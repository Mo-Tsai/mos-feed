<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "連四黑結束", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普 500 ETF，週五標普漲 0.86% 收 7,656.98 點、單日漲 65.15 點"}, {"t": "DIA", "n": "道瓊 ETF，道瓊漲 509.19 點、漲幅 0.98%，收 52,573.29 點"}, {"t": "QQQ", "n": "那斯達克 100 ETF，那斯達克綜合指數漲 0.96% 收 26,333.04 點"}, {"t": "IWM", "n": "羅素 2000 ETF，小型股只漲 0.45%，是四大指數裡最弱的一個"}], "en": "US stocks snapped a four-session losing streak on Friday. The Dow rose 509.19 points, or 0.98%, to 52,573.29, the S&P 500 added 0.86% to 7,656.98 and the Nasdaq Composite gained 0.96% to 26,333.04. The trigger was not the inflation print itself but crude giving back part of the week's spike. That is worth noting: the market rallied because oil fell, not because the data was good. Core CPI actually came in a tenth hotter than forecast.", "zh": "美股週五全面收紅，結束連續四個交易日的下跌。道瓊漲 509.19 點、漲幅 0.98%，收 52,573.29 點；標普 500 漲 0.86% 收 7,656.98 點；那斯達克綜合指數漲 0.96% 收 26,333.04 點。反彈的理由值得看清楚：不是通膨數據好，而是原油回吐了本週漲幅的一部分。八月核心消費者物價指數其實比預期還高一個百分點的十分之一。換句話說，這一天股市是被油價救的，不是被物價救的。", "url": "https://www.cnbc.com/2026/09/10/stock-market-today-live-updates.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "油價回吐", "color": "#E05C5C", "stocks": [{"t": "USO", "n": "美國原油基金，西德州原油週五跌 2.37% 收 100.05 美元，但整週仍漲約 8%"}, {"t": "VLO", "n": "Valero，煉油商，油價回落但成品油價差仍寬，股價當日創 52 週新高"}, {"t": "LUV", "n": "西南航空，燃油成本是航空股本週最大逆風，巴克萊當日下修目標價"}], "en": "West Texas Intermediate settled at $100.05, down $2.43 or 2.37%, while Brent fell 2.81% to $104.61. But the week still ended about 8% higher for crude. That is the number that matters for next week: a single down day does not undo a Middle East supply premium that has been building for five sessions. Equities treated the pullback as an all-clear; the bond market did not.", "zh": "西德州原油週五收在每桶 100.05 美元，單日跌 2.43 美元、跌幅 2.37%；布蘭特原油跌 2.81% 收 104.61 美元。但把整週拉開來看，原油還是漲了大約 8%。這才是下週真正要盯的數字：一天的回檔並不會抵銷已經累積五個交易日的中東供給溢價。股市把這次回檔當成警報解除，債市沒有跟著這樣解讀，兩邊的分歧就是這個週末最值得思考的地方。", "url": "https://investrade.com/market-review-september-11-2026/"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "三段殖利率齊揚", "color": "#E05C5C", "stocks": [{"t": "SHY", "n": "1 至 3 年期公債 ETF，2 年期殖利率升到約 4.65%、是兩年來最高"}, {"t": "TLT", "n": "20 年期以上公債 ETF，30 年期殖利率約 5.38%，逼近 2007 年 6 月的 5.40%"}, {"t": "XLRE", "n": "不動產類股 ETF，REIT 的資金成本直接綁在長端殖利率上，全週落後大盤"}], "en": "The whole curve moved. The two-year yield rose to about 4.65%, a two-year high; the ten-year closed at 4.975%, the highest since October 2023; the thirty-year reached roughly 5.38%, within two basis points of its June 2007 peak. A two-year yield at a two-year high is a policy story. A thirty-year yield at an eighteen-year high is an inflation-expectations story. Both moved in the same direction on the same day, which is the part that should not be shrugged off.", "zh": "這一天債市三段期限一起往上走。2 年期殖利率升到約 4.65%，是兩年來最高；10 年期收在 4.975%，是 2023 年 10 月以來最高；30 年期來到約 5.38%，距離 2007 年 6 月的 5.40% 只差兩個基點。這兩個數字講的是兩件不同的事：2 年期反映的是下週的政策，30 年期反映的是市場對長期物價的看法。它們同一天往同一個方向走，而股市當天是漲的，這個落差不該被輕輕帶過。", "url": "https://investrade.com/market-review-september-11-2026/"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "週線仍收黑", "color": "#E05C5C", "stocks": [{"t": "XLK", "n": "科技類股 ETF，週五漲逾 1%，是當日 11 個類股裡的領漲者之一"}, {"t": "XLI", "n": "工業類股 ETF，同樣單日漲逾 1%，受惠於國際紙業等升評與資本支出題材"}, {"t": "XLV", "n": "醫療保健類股 ETF，當日落後，史賽克創 52 週新低拖累指數"}, {"t": "XLU", "n": "公用事業類股 ETF，殖利率飆升時最直接受害的防禦型類股"}], "en": "Friday's bounce did not save the week. The S&P 500 still finished down 0.8%, the Dow down 1.6% and the Nasdaq down 0.7%. Nine of eleven sectors rose on the day, led by technology, industrials and communications, all up more than 1%, while healthcare and utilities lagged. The shape is consistent: what rallied was cyclical and rate-tolerant, what lagged was defensive and rate-sensitive. That is not a risk-on tape, it is a rate-repricing tape.", "zh": "週五的反彈救不了整週。標普 500 全週仍跌 0.8%，道瓊跌 1.6%，那斯達克跌 0.7%。當日 11 個類股有 9 個上漲，科技、工業與通訊都漲逾 1%，醫療保健與公用事業落後。這個分布很一致：漲的是景氣循環且對利率忍受度高的，落後的是防禦型且對利率敏感的。所以這不是風險偏好回來了，而是市場在重新按利率排序，順序換了、總量沒變。", "url": "https://articles.stockcharts.com/article/best-five-us-stock-market-sectors-week-of-09-07-2026-82/"},
    {"id": "earn_0", "channel": "財報速報", "tag": "克羅格砍展望", "color": "#E8786A", "stocks": [{"t": "KR", "n": "克羅格，調整後每股盈餘 1.09 美元優於預期 1.06，但同店銷售展望下修，盤前跌 2.6% 後翻紅逾 2.5%"}, {"t": "ACI", "n": "Albertsons，美國第二大連鎖超市，同樣吃到藥局處方藥營收的結構性壓力"}, {"t": "CVS", "n": "CVS Health，通膨削減法案壓低聯邦醫療保險藥價，對零售藥局營收是同一個逆風"}], "en": "Kroger beat on earnings and cut the top line. Adjusted EPS came in at $1.09 against $1.06 expected, on revenue of $34.6 billion, a shade under the $34.65 billion forecast. The cut was the news: identical sales excluding fuel are now guided to 0.2% to 0.8% for fiscal 2026, down from 1% to 2%, with about 140 basis points of the drag coming from the Inflation Reduction Act lowering what Medicare patients pay for prescriptions. Full-year adjusted EPS of $5.10 to $5.30 was reaffirmed. The stock fell 2.6% before the open and closed higher.", "zh": "克羅格的財報是「獲利過關、營收展望砍掉」。調整後每股盈餘 1.09 美元，優於市場預期的 1.06 美元；營收 346 億美元，略低於預期的 346.5 億美元。真正的新聞是下修：扣除油品的同店銷售全年展望，從原本的成長 1% 到 2%，下修到只剩 0.2% 到 0.8%，其中約 140 個基點來自通膨削減法案壓低聯邦醫療保險病患的處方藥自付額，直接打在藥局營收上。全年調整後每股盈餘 5.10 到 5.30 美元維持不變。股價盤前跌 2.6%，收盤反而翻紅。", "url": "https://qz.com/kroger-earnings-same-store-sales-guidance-cut-091126"},
    {"id": "earn_1", "channel": "財報速報", "tag": "RH 逆勢成長", "color": "#E8786A", "stocks": [{"t": "RH", "n": "RH（原 Restoration Hardware），第二季營收年增 2.6% 至 9.222 億美元、淨利年增 16.36%，股價當日走高"}, {"t": "W", "n": "Wayfair，線上家具通路，同期需求環境的對照組"}, {"t": "ETD", "n": "Ethan Allen，中高價位家具品牌，可對照 RH 的高端客層是否真的比較抗跌"}], "en": "RH reported second-quarter revenue up 2.6% to $922.2 million with net income up 16.36%, and the stock rose. In a week when 30-year mortgage-linked yields pushed toward an eighteen-year high, a high-ticket home furnishings retailer growing both lines is genuinely unusual. The read-through is narrow, though: RH sells to a customer who does not finance the purchase. It tells you about the top of the income distribution, not about housing demand.", "zh": "RH 第二季營收年增 2.6% 至 9.222 億美元，淨利年增 16.36%，股價當日走高。在長端殖利率逼近十八年高點的這一週，一家賣高單價家具的零售商還能營收與獲利同步成長，確實少見。但這則訊號的適用範圍很窄：RH 的客人買沙發不需要貸款。它告訴你的是所得分配最頂端那一層的消費力，不是房市需求本身。把它讀成家具業復甦會讀錯。", "url": "https://investrade.com/market-review-september-11-2026/"},
    {"id": "earn_2", "channel": "財報速報", "tag": "青少年零售轉弱", "color": "#E8786A", "stocks": [{"t": "ZUMZ", "n": "Zumiez，第二季虧損從 100 萬美元擴大到 270 萬美元，營收年減 2.5% 至 2.0896 億美元，股價重挫"}, {"t": "HOFT", "n": "Hooker Furnishings，第二季每股盈餘 0.15 美元、營收 6,325 萬美元，下半年展望轉弱"}, {"t": "BOOT", "n": "Boot Barn，同屬中低價位服飾零售，可對照這波消費力道是通路問題還是族群問題"}], "en": "Two small retailers reported into the same tape and both pointed the same way. Zumiez widened its second-quarter loss to $2.7 million from $1 million on revenue down 2.5% to $208.96 million. Hooker Furnishings earned $0.15 a share on $63.25 million of sales and guided the back half of fiscal 2027 lower. Put next to RH on the same day, the split is clean: the top end is still spending and the middle is not. That gap is the single most useful consumer datapoint of the week.", "zh": "同一天有兩家小型零售商交出財報，方向一致。Zumiez 第二季虧損從 100 萬美元擴大到 270 萬美元，營收年減 2.5% 至 2.0896 億美元；Hooker Furnishings 每股盈餘 0.15 美元、營收 6,325 萬美元，並下修 2027 會計年度下半年展望。把它們跟同一天的 RH 擺在一起，分界線很乾淨：最高端還在花錢，中間那一層沒有。這個落差是本週最有用的一則消費數據，比任何一個總體指標都具體。", "url": "https://investrade.com/market-review-september-11-2026/"},
    {"id": "macro_0", "channel": "總經政策", "tag": "核心高一檔", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，核心月增 0.3% 高於預期 0.2%，實質利率定價的核心變數"}, {"t": "GLD", "n": "黃金 ETF，現貨金收 4,408.90 美元，通膨黏著時的傳統避險去處"}, {"t": "XLP", "n": "必需消費類股 ETF，最能觀察企業把成本轉嫁給消費者的能力"}], "en": "August CPI rose 0.4% on the month and 3.4% from a year earlier, both in line. Core CPI rose 0.3%, a tenth above the 0.2% forecast, with the core annual rate at 2.4%. August PPI had already come in at 0.4% monthly and 5.4% annually. The headline being in line is what let stocks rally; the core miss is what let yields rise. Both reactions were rational, because the two numbers are telling different stories about whether the energy shock is staying in energy.", "zh": "八月消費者物價指數月增 0.4%、年增 3.4%，兩個數字都符合預期。核心月增 0.3%，比預期的 0.2% 高一檔，核心年增率 2.4%。稍早公布的八月生產者物價指數則是月增 0.4%、年增 5.4%。整體數字符合預期，所以股市敢漲；核心超出預期，所以殖利率往上。兩邊的反應都合理，因為這兩個數字在回答不同的問題：能源衝擊到底有沒有滲出能源項目本身。核心那一檔，就是滲出來的證據。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-11-2026"},
    {"id": "macro_1", "channel": "總經政策", "tag": "升息機率九成", "color": "#7C6AF7", "stocks": [{"t": "XLF", "n": "金融類股 ETF，升息循環下淨利差擴張的第一順位受惠者"}, {"t": "KRE", "n": "區域銀行 ETF，存款成本與資產重定價速度在升息初期最不對稱"}, {"t": "SHY", "n": "1 至 3 年期公債 ETF，短端價格直接反映下週會議的定價"}], "en": "After the CPI print, futures moved to roughly a 90% probability of a 25 basis point hike at the September 15-16 FOMC, up from around 70% before. Chair Kevin Warsh has been explicit that price stability needs further progress, and the meeting also brings updated projections and a new dot plot. Note what is unusual here: the market is not debating how big a cut will be. It is pricing a hike, into an economy where August payrolls came in at 162,000. That combination has not appeared since 2022.", "zh": "消費者物價指數公布後，期貨市場把 9 月 15 至 16 日聯準會會議升息一碼的機率推到大約九成，公布前約七成。主席華許一直明講物價穩定還需要更多進展，而這次會議同時會公布更新後的經濟預測與新的點陣圖。這裡真正不尋常的地方是：市場現在爭論的不是要降幾碼，而是在替升息定價，而八月非農就業還有 16.2 萬人。升息預期與這種就業數字同時出現，上一次是 2022 年。", "url": "https://finance.biggo.com/news/d703d7a9-96eb-4ea1-afc3-11f05600c8a8"},
    {"id": "macro_2", "channel": "總經政策", "tag": "信心跌預期升", "color": "#7C6AF7", "stocks": [{"t": "XRT", "n": "零售類股 ETF，消費者信心 47.8 遠低於預期 51.0，零售端是第一線"}, {"t": "XLY", "n": "非必需消費類股 ETF，油價墊高時可支配所得被擠壓得最明顯"}, {"t": "DLTR", "n": "Dollar Tree，折扣通路，消費者往下換購時的典型受惠者"}], "en": "The University of Michigan sentiment index came in at 47.8 against 51.0 expected, and one-year inflation expectations jumped to 4.6% from 4.0%. Read them together rather than separately. Households are simultaneously feeling worse and expecting prices to rise faster, which is the specific combination that makes an energy shock persistent: expectations get embedded in wage demands and pricing decisions before the spot price ever comes back down. This is also exactly the reading the Fed says it watches most closely.", "zh": "密西根大學消費者信心指數 47.8，遠低於預期的 51.0；同時一年期通膨預期從 4.0% 跳升到 4.6%。這兩個數字要一起讀。家計單位一邊覺得日子更難過、一邊預期物價會漲更快，而這正是讓能源衝擊變成長期問題的那組組合：預期會先寫進薪資要求與訂價決策，遠早於現貨價格回落。這也剛好是聯準會一再說自己盯得最緊的一項調查，下週開會時它會被放在桌上。", "url": "https://investrade.com/market-review-september-11-2026/"},
    {"id": "sector_0", "channel": "產業風向", "tag": "煉油全面新高", "color": "#4EABA4", "stocks": [{"t": "VLO", "n": "Valero，當日創 52 週新高，美國最大獨立煉油商之一"}, {"t": "MPC", "n": "Marathon Petroleum，同樣創 52 週新高，煉油產能規模最大"}, {"t": "PARR", "n": "Par Pacific，小型煉油商，夏威夷與內陸市場，對價差變動的槓桿最大"}, {"t": "DK", "n": "Delek US，小型煉油商，同日創 52 週新高"}], "en": "Valero, Phillips 66, PBF, Marathon Petroleum, HF Sinclair and Delek all hit 52-week highs on Friday. The mechanism is specific: refiners buy crude and sell product, so a supply scare that lifts crude but lifts gasoline and diesel more actually widens their margin. Crude falling 2.4% on the day did not break that, because the shortage is in refined product, not barrels in the ground. The risk is equally specific. Crack spreads this wide historically do not last, and the small refiners that gain most on the way up give back most on the way down.", "zh": "Valero、Phillips 66、PBF、Marathon Petroleum、HF Sinclair 與 Delek 週五全部創 52 週新高。機制很具體：煉油商買原油、賣成品油，當供給疑慮把原油拉高、但把汽油與柴油拉得更高時，中間的價差反而變寬。週五原油跌 2.4% 並沒有打斷這件事，因為短缺發生在成品油端，不是地底下的原油。風險同樣具體：這種寬度的裂解價差在歷史上不持久，而漲勢中彈性最大的小型煉油商，回檔時交回去的也最多。", "url": "https://investrade.com/market-review-september-11-2026/"},
    {"id": "sector_1", "channel": "產業風向", "tag": "航空被砍目標", "color": "#4EABA4", "stocks": [{"t": "DAL", "n": "達美航空，巴克萊目標價從 105 美元降到 95 美元"}, {"t": "AAL", "n": "美國航空，目標價從 19 美元降到 14 美元，降幅最重的網路型航空"}, {"t": "LUV", "n": "西南航空，目標價從 65 美元降到 58 美元"}, {"t": "ALK", "n": "阿拉斯加航空，目標價從 65 美元降到 52 美元"}], "en": "Barclays cut price targets across the airline group on energy costs, and the spread of the cuts is the information. American went from $19 to $14 and Allegiant from $145 to $115, while Delta went from $105 to $95. Roughly speaking, the carriers with the thinnest margins and the most leverage took the deepest cuts, because jet fuel is a larger share of their cost base and they have the least pricing power to pass it on. Energy shocks do not hit an industry evenly; they sort it by balance sheet.", "zh": "巴克萊以能源成本為由，全面下修航空股目標價，而下修幅度的分布本身就是資訊。美國航空從 19 美元砍到 14 美元、Allegiant 從 145 美元砍到 115 美元，達美只從 105 美元降到 95 美元。粗略地說，利潤率最薄、槓桿最高的業者被砍得最重，因為航空燃油佔成本比重更高，而且最沒有能力把成本轉嫁到票價上。能源衝擊從來不是平均地打在一個產業上，它是照資產負債表排序的。", "url": "https://investrade.com/market-review-september-11-2026/"},
    {"id": "sector_2", "channel": "產業風向", "tag": "醫材落隊", "color": "#4EABA4", "stocks": [{"t": "SYK", "n": "史賽克，當日創 52 週新低，市場關切其製造端問題"}, {"t": "RMD", "n": "瑞思邁，同日走弱，睡眠呼吸器龍頭"}, {"t": "XLV", "n": "醫療保健類股 ETF，是週五 11 個類股裡落後的兩個之一"}], "en": "While nine of eleven sectors rose, healthcare lagged, with Stryker hitting a 52-week low on manufacturing concerns and ResMed weak alongside it. Medical devices are worth watching here for a reason that has nothing to do with healthcare policy: they are long-cycle manufacturers with global supply chains, so they absorb an energy and freight shock the way industrials do, but they sell into hospital budgets that reprice once a year. Cost goes up now, price goes up next year.", "zh": "週五 11 個類股有 9 個上漲，醫療保健是落後的其中之一。史賽克因市場關切其製造端問題創下 52 週新低，瑞思邁同步走弱。醫材值得看的原因跟健保政策無關：它們本質上是長週期的製造業，有全球供應鏈，所以吸收能源與運費衝擊的方式跟工業股一樣；但它們賣的對象是醫院預算，而醫院預算一年才重新議價一次。成本現在漲，售價要等明年，中間那段就是利潤率被壓的時間。", "url": "https://investrade.com/market-review-september-11-2026/"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "跟不上大盤", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，正在測試 287 美元附近的關鍵支撐"}, {"t": "IJR", "n": "標普 600 小型股 ETF，成分股獲利品質門檻較高，可與羅素 2000 對照"}, {"t": "VTWO", "n": "Vanguard 羅素 2000 ETF，費用率較低的同指數替代品"}], "en": "The Russell 2000 rose 12.99 points, or 0.45%, to 2,903 on Friday, less than half the gain of the three large-cap indices. The small-cap ETF is now testing support around $287 after trading at $296 earlier in the year, when it was up 20% year to date. The underperformance on a bounce day is the signal, not the level. When the index that leads on the way down also lags on the way up, the market is telling you it does not believe the reason for the bounce.", "zh": "羅素 2000 週五漲 12.99 點、漲幅 0.45%，收 2,903 點，漲幅不到三大指數的一半。小型股 ETF 正在測試 287 美元附近的支撐，而今年稍早它曾站上 296 美元、年初至今漲幅一度有 20%。真正的訊號不是價位，是「反彈日跟不上」這件事。當一個指數在下跌時領跌、反彈時又落後，代表市場並不相信這次反彈的理由能持續。", "url": "https://chartsarefun.substack.com/p/watching-small-caps-test-a-key-level"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "45% 溢價", "color": "#5B8ED6", "stocks": [{"t": "ACVA", "n": "ACV Auctions，被 Copart 以每股 10.50 美元、約 19 億美元收購，溢價約 45%"}, {"t": "CPRT", "n": "Copart，事故車線上拍賣龍頭，買方"}, {"t": "KAR", "n": "OPENLANE，中古車批發線上交易平台，這樁交易之後市場上最後一家有規模的獨立同業"}], "en": "Copart agreed to buy ACV Auctions for $10.50 a share, about $1.9 billion, a roughly 45% premium. Two things follow. First, a strategic buyer with the best data in the category just told the market what a digital wholesale vehicle marketplace is worth, and it was 45% above where the public market had it. Second, the number of independent scaled comparables in that category just dropped by one. Premiums like this reprice the whole shelf, not only the company being bought.", "zh": "Copart 同意以每股 10.50 美元、總額約 19 億美元收購 ACV Auctions，溢價約 45%。這件事有兩層意義。第一，一個手上握有整個類別最好資料的策略買家，直接告訴市場「線上中古車批發平台值多少錢」，而那個數字比公開市場當時的定價高出 45%。第二，這個類別裡有規模的獨立同業又少了一家。這種溢價重新標價的不只是被買走的那一家，而是整個貨架上剩下的每一家。", "url": "https://investrade.com/market-review-september-11-2026/"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "核電小型股", "color": "#5B8ED6", "stocks": [{"t": "SMR", "n": "NuScale Power，遭瑞銀降評至賣出、目標價從 10 美元砍到 6 美元"}, {"t": "OKLO", "n": "Oklo，同日簽訂最高 10 億美元的股票分銷協議"}, {"t": "BWXT", "n": "BWX Technologies，已有真實營收與國防訂單的核能製造商，可作為對照組"}], "en": "Two small nuclear names moved in opposite ways on the same day. UBS downgraded NuScale to Sell and cut its target to $6 from $10, while Oklo signed an equity distribution agreement for up to $1 billion. The pairing is instructive. Both companies are pre-revenue bets on an energy theme; one is being repriced by an analyst and the other is funding itself by issuing stock into the same enthusiasm. For a pre-revenue developer, the ability to sell shares at current prices is itself part of the business model, which is exactly what makes a rate shock dangerous for the group.", "zh": "同一天有兩檔小型核電股往相反方向走。瑞銀把 NuScale 降評到賣出，目標價從 10 美元砍到 6 美元；Oklo 則簽下最高 10 億美元的股票分銷協議。這組對照很有意思：兩家都是還沒有實質營收、押注能源主題的公司，一家被分析師重新標價，另一家正利用同一份市場熱情發股票籌錢。對還沒有營收的開發商來說，「能不能用現在的股價賣股票」本身就是商業模式的一部分，這也正是利率衝擊對這一類公司特別危險的原因。", "url": "https://investrade.com/market-review-september-11-2026/"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "浮動利率的算法", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普 600 小型股 ETF，成分股需通過獲利門檻，債務結構通常優於羅素 2000"}, {"t": "KRE", "n": "區域銀行 ETF，小型企業浮動利率貸款的主要放款方"}, {"t": "TLT", "n": "20 年期以上公債 ETF，長端殖利率決定的是再融資成本而非當期利息"}], "en": "Here is the mechanism behind next week's small-cap risk, in plain terms. Small companies carry far more floating-rate debt than large ones and refinance more often, so a policy rate increase reaches their income statement in the current quarter rather than years later when a bond matures. A large company with ten-year fixed debt feels a hike through its share price. A small company with a revolver feels it through its interest expense. That is why the same 25 basis points is not the same event for the two groups, and why the Russell has lagged all week.", "zh": "把下週小型股的風險拆成機制來看會清楚很多。小公司的浮動利率債務比重遠高於大公司，再融資的頻率也更高，所以政策利率一動，就會在當季直接進到損益表，而不是等好幾年後某一檔債券到期才反映。一家發了十年期固定利率債的大公司，感受升息的方式是股價；一家靠循環信用額度過日子的小公司，感受升息的方式是利息費用。同樣的一碼，對這兩群公司根本不是同一件事，這也是羅素 2000 整週落後的結構性原因。", "url": "https://chartsarefun.substack.com/p/watching-small-caps-test-a-key-level"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "包裝紙升評", "color": "#5B8ED6", "stocks": [{"t": "IP", "n": "國際紙業，美銀升評至買進，目標價從 34 美元上調到 46 美元"}, {"t": "PKG", "n": "Packaging Corp of America，同屬瓦楞紙箱供應鏈，是最直接的對照組"}, {"t": "XLI", "n": "工業類股 ETF，週五漲逾 1%，是當日領漲類股之一"}], "en": "Bank of America upgraded International Paper to Buy and lifted its target to $46 from $34, a 35% increase in one step. Containerboard is an unglamorous read on physical volumes: boxes get made when goods get shipped. An upgrade of that size, in the same week that energy costs spiked and freight-exposed airlines got cut, says the analyst thinks pricing power in packaging is strong enough to pass the cost through. Whether that is true is testable within one quarter, which makes it a useful thing to watch rather than to argue about.", "zh": "美銀把國際紙業升評到買進，目標價從 34 美元一口氣上調到 46 美元，單次調升 35%。瓦楞紙箱是一個不起眼但誠實的實體量能指標：有貨要出，才會有箱子要做。在能源成本飆升、運輸曝險高的航空股被集體砍目標價的同一週，出現這種幅度的升評，等於分析師認為包裝業的訂價能力強到足以把成本轉嫁出去。這個假設一季之內就能驗證，所以它值得追蹤，而不值得爭論。", "url": "https://investrade.com/market-review-september-11-2026/"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "六季連續改善", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（看自由現金流是否轉正）", "stocks": [{"t": "PRTS", "n": "CarParts.com，微型市值線上汽車零件通路，兩位內部人 8/27 至 9/10 買進約 43.8 萬美元"}, {"t": "AMZN", "n": "亞馬遜，線上汽車零件的最大競爭者，也是這檔公司最主要的反方論點"}, {"t": "GPC", "n": "Genuine Parts，實體汽車零件通路龍頭，可對照售後市場需求本身好不好"}], "en": "CarParts.com sells aftermarket auto parts online, market cap under $200 million, essentially no sell-side coverage. Second-quarter revenue fell 10.7% to $135.64 million but still beat forecasts by $6.56 million, and adjusted EBITDA swung to positive $1.8 million from negative $3.1 million, the sixth consecutive quarter of sequential improvement. Gross margin reached 33.2%. The change worth tracking is the A-Premium partnership, now near a $50 million annualised run rate with a stated path past $100 million, carrying roughly twice the profitability of legacy owned-inventory revenue with virtually no inventory. Two insiders bought about $438,000 between 27 August and 10 September. Against that: revenue is still shrinking, the category competes directly with Amazon and tariffs sit on imported parts. Research lead, not investment advice.", "zh": "CarParts.com 做的是線上汽車售後零件通路，市值不到 2 億美元，賣方幾乎沒有覆蓋。它被忽視的原因很直白：營收還在衰退。第二季營收年減 10.7% 至 1.3564 億美元，但仍比市場預期高出 656 萬美元；調整後稅前息前折舊攤銷前獲利由去年同期的負 310 萬美元轉為正 180 萬美元，這是連續第六季逐季改善，毛利率來到 33.2%。真正在改變的是與 A-Premium 的合作：年化營收已接近 5,000 萬美元，公司說有路徑衝破 1 億美元，而這塊業務的獲利能力約為傳統自有庫存業務的兩倍，且幾乎不需要壓庫存。兩位內部人在 8 月 27 日到 9 月 10 日之間買進約 43.8 萬美元。反方論點同樣清楚：營收仍在縮、這個品類直接對上亞馬遜、進口零件還有關稅。這是研究線索，不是投資建議。", "url": "https://www.investing.com/news/transcripts/earnings-call-transcript-carpartscom-beats-q2-2026-estimates-as-loss-narrows-93CH-4844723"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "四個人一起買", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 FY2026 年度財報（看管線現金分配金額）", "stocks": [{"t": "RGCO", "n": "RGC Resources，市值約 2.25 億美元的維吉尼亞天然氣公用事業，四位內部人 9/1 至 9/10 買進"}, {"t": "EQT", "n": "EQT，阿帕拉契盆地最大天然氣生產商，是山谷管線的主要託運方"}, {"t": "NI", "n": "NiSource，中型天然氣公用事業，可對照這個族群的評價水準"}], "en": "RGC Resources supplies natural gas to about 64,500 customers around Roanoke, Virginia, with a market cap near $225 million and only 10.4 million shares outstanding. It is ignored because it looks like a sleepy local utility, and the stock is up just 2.7% over twelve months at around $21.57. What is changing sits in the subsidiary: RGC Midstream holds an equity stake in the Mountain Valley Pipeline, whose mainline has now been in service over two years, operating reliably and paying RGC excess cash distributions every quarter, with MVP Southgate and MVP Boost still ahead. Four insiders bought in the first ten days of September. Against that: the dollar amounts were small, rate cases drive most of the earnings, a 4.975% ten-year yield compresses every utility valuation, and the float is tiny. Research lead, not investment advice.", "zh": "RGC Resources 在維吉尼亞州羅安諾克一帶供應天然氣，服務約 64,500 戶，市值約 2.25 億美元，在外流通股數只有 1,040 萬股。它被忽視的原因是外表看起來就是一家昏昏欲睡的地方公用事業，股價約 21.57 美元、十二個月只漲 2.7%。正在改變的東西藏在子公司：RGC Midstream 持有山谷管線的股權，這條管線主線已通氣兩年多、運作穩定，每季持續發放超額現金分配給母公司，後面還有 Southgate 與 Boost 兩個延伸專案。九月前十天有四位內部人同時買進。反方論點要記住：買進金額很小、獲利主要仍由費率審查決定、10 年期殖利率 4.975% 會壓縮所有公用事業的評價，而且流通量極小、進出都不容易。這是研究線索，不是投資建議。", "url": "https://www.fool.com/earnings/call-transcripts/2026/08/12/rgc-resources-rgco-q3-2026-earnings-call-transcript/"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "同業被標價了", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（看全年 EBITDA 上緣是否再上調）", "stocks": [{"t": "KAR", "n": "OPENLANE，線上中古車批發交易平台，第二季每股盈餘 0.40 美元優於預期 14%"}, {"t": "ACVA", "n": "ACV Auctions，同業，週五被 Copart 以 45% 溢價收購，等於替整個類別標出併購價值"}, {"t": "CVNA", "n": "Carvana，零售端中古車平台，可對照整條中古車產業鏈的資金情緒"}], "en": "OPENLANE runs a digital wholesale used-vehicle marketplace. Be precise about the neglect here: it is covered, but it is priced as a used-car cyclical rather than as a marketplace, which is a different kind of being ignored. Second-quarter EPS of $0.40 beat by 14% on revenue up 15% to $555 million, Marketplace EBITDA rose 27% to $57 million with 80 basis points of margin expansion, US dealer-to-dealer volumes jumped 31% and commercial sales 39%, and full-year adjusted EBITDA guidance was raised to $385-400 million. The catalyst arrived Friday from outside: Copart paying a 45% premium for ACV put a strategic number on the category. Against that: used-vehicle volumes are genuinely cyclical, the Finance segment carries dealer credit risk, and an acquisition premium for one company is not a valuation for another. Research lead, not investment advice.", "zh": "OPENLANE 經營線上中古車批發交易平台。這裡要把「忽視」講精確：它不是沒有人覆蓋，而是被放在景氣循環股的框架裡定價，而不是用平台的框架，這是另一種被忽視。第二季每股盈餘 0.40 美元、優於預期 14%，營收年增 15% 至 5.55 億美元；市集部門稅前息前折舊攤銷前獲利年增 27% 至 5,700 萬美元、利潤率擴張 80 個基點，美國車商對車商交易量年增 31%、商用車銷售年增 39%，全年調整後獲利預估上調至 3.85 億到 4.00 億美元。催化劑在週五從外部出現：Copart 用 45% 溢價買走 ACV，等於替這個類別標出了策略買家願意付的價格。反方論點是中古車交易量本來就有循環性、金融部門承擔車商信用風險，而且別人的併購溢價不等於這一家的評價。這是研究線索，不是投資建議。", "url": "https://finance.yahoo.com/quote/KAR/"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內更新 · 運價", "color": "#C9A227", "status": "RADAR · 池內更新 · 下一個驗證點 11 月 Q3 財報（看現貨運價實際入帳多少）", "stocks": [{"t": "TNK", "n": "Teekay Tankers，蘇伊士型與阿芙拉型原油輪船東，以現貨運價賣航次，池內 9/2 入池"}, {"t": "FRO", "n": "Frontline，超大型原油輪船東，同族群規模最大者"}, {"t": "DHT", "n": "DHT Holdings，純超大型原油輪船東，現貨曝險同樣高"}], "en": "Pool update on Teekay Tankers, added 2 September. The evidence has moved a long way in ten days. Very large crude carrier time-charter equivalents on the Middle East Gulf to Singapore route are running near $702,000 a day, more than 900% above a year earlier, and Suezmax rates on Middle East Gulf to Mediterranean are near $335,000 a day. Teekay, Frontline, Okeanis and TEN all closed at their highest levels of the year. The honest revision is this: the inflection is no longer hidden, so the question changes from discovery to verification. Rates like these are a function of a supply disruption, and the number that matters is how many voyages actually get booked at them before the disruption resolves. Research lead, not investment advice.", "zh": "池內更新：Teekay Tankers，9 月 2 日入池。十天內證據變化很大。超大型原油輪在中東灣到新加坡航線的等價期租日租金已來到約 70.2 萬美元，比一年前高出逾 900%；蘇伊士型在中東灣到地中海航線約 33.5 萬美元。Teekay、Frontline、Okeanis 與 TEN 全部收在今年最高。這裡要誠實修正一件事：拐點已經不再是祕密，所以問題從「發掘」變成「驗證」。這種運價是供給中斷的函數，真正該追的數字是在中斷解除之前，到底有多少航次以這個價格實際簽進帳上。這是研究線索，不是投資建議。", "url": "https://public.axsmarine.com/blog/weekly-tanker-market-monitor-week-35-2026-2"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新 · 續買", "color": "#C9A227", "status": "RADAR · 池內更新 · 下一個驗證點 10 月 Q3 財報（看淨利差與存款成本）", "stocks": [{"t": "FRST", "n": "Primis Financial，維吉尼亞州社區銀行控股公司，市值不到 4 億美元，池內 8/28 入池"}, {"t": "HNVR", "n": "Hanover Bancorp，同屬小型社區銀行，池內 9/9 入池，可對照同族群"}], "en": "Pool update on Primis Financial, added 28 August. Two insiders kept buying between 20 August and 9 September, roughly $48,000 in total. The dollar figure is trivial; the continuation across the CPI week is the part that carries information, because these buyers were adding while the rate outlook flipped from cuts to a hike. For a small community bank that flip cuts both ways: asset yields reprice upward faster than a large bank's, but deposit competition also intensifies, and an inverted-then-steepening curve changes the arithmetic quarter by quarter. The verification point is the net interest margin line in the October quarter, not the insider filings. Research lead, not investment advice.", "zh": "池內更新：Primis Financial，8 月 28 日入池。兩位內部人在 8 月 20 日到 9 月 9 日之間持續買進，合計約 4.8 萬美元。金額本身微不足道，有資訊量的是「在消費者物價指數那一週還在加碼」這件事，因為這段期間利率預期正好從降息翻成升息。對一家小型社區銀行來說，這個翻轉是雙面的：資產端重定價的速度比大銀行快，但存款競爭也會更激烈，而殖利率曲線的形狀每一季都會改變這道算式。驗證點在十月那份財報的淨利差那一行，不在內部人申報。這是研究線索，不是投資建議。", "url": "https://insideraction.io/clusters"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內更新 · 論點受損", "color": "#C9A227", "status": "RADAR · 池內更新 · 下一個驗證點 11 月 Q3 財報（看自有礦石投料比重與銻價）", "stocks": [{"t": "UAMY", "n": "United States Antimony，美國本土銻的開採與冶煉，池內 9/1 入池"}, {"t": "MP", "n": "MP Materials，美國稀土開採與加工，同屬關鍵礦物本土化題材的對照組"}], "en": "Pool update on United States Antimony, added 1 September, and this one is a downgrade of the thesis, not a confirmation. Second-quarter revenue fell to $7.9 million from $10.5 million and gross margin collapsed to 7% from 27%, because the realised antimony price dropped to $13.70 a pound from $28.32. Full-year revenue guidance was cut to $60-75 million from $125 million and the stock fell 25%. What keeps it in the pool: a $245 million sole-source Defense Logistics Agency contract, a newly announced $100 million buyback, and ore haulage at Stibnite Hill in Montana more than doubling versus 2025, with about 576 tons of roughly 10% antimony ore moved since April. The thesis was always vertical integration; the commodity price broke first. Research lead, not investment advice.", "zh": "池內更新：United States Antimony，9 月 1 日入池，而這一則是論點受損，不是確認。第二季營收從 1,050 萬美元掉到 790 萬美元，毛利率從 27% 崩到 7%，原因是實現銻價從每磅 28.32 美元跌到 13.70 美元。全年營收預估從 1.25 億美元砍到 6,000 萬至 7,500 萬美元，股價單日跌 25%。留在池裡的理由是另外三件事：與國防後勤局之間 2.45 億美元的獨家來源合約、新宣布的 1 億美元庫藏股，以及蒙大拿州 Stibnite Hill 的礦石運量比 2025 年增加超過一倍，四月以來已運出約 576 噸含銻約 10% 的礦石。原本的論點一直是垂直整合，只是商品價格先垮了。這是研究線索，不是投資建議。", "url": "https://finance.yahoo.com/markets/stocks/articles/united-states-antimony-plummets-25-191000610.html"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "科恩再加碼", "color": "#6DB56D", "stocks": [{"t": "GME", "n": "GameStop，董事長科恩買進 100 萬股、約 2,038 萬美元，直接持股增至 3,930 萬股"}], "en": "Ryan Cohen bought one million GameStop shares for about $20.38 million, lifting his direct holding to 39.3 million shares. Read it as what it is: a chairman adding to an already very large position, which tells you about conviction but not about a change in the business. The useful discipline with a filing like this is to separate the two questions. Does the buyer know something new, or does the buyer simply already believe what they believed? A first purchase by a new insider answers the first question. A top-up by the largest holder mostly answers the second.", "zh": "科恩買進 100 萬股 GameStop，金額約 2,038 萬美元，直接持股增加到 3,930 萬股。要照它本來的樣子讀：這是董事長在一個本來就非常大的部位上再加碼，它告訴你的是信念強度，不是公司基本面出現了變化。面對這類申報，有用的紀律是把兩個問題分開：買進的人是知道了什麼新的事，還是只是繼續相信他本來就相信的事。一位新任內部人的第一筆買進回答第一個問題；最大股東的加碼，多半只回答第二個。", "url": "https://investrade.com/market-review-september-11-2026/"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "優步兩人買", "color": "#6DB56D", "stocks": [{"t": "UBER", "n": "優步，兩位內部人 9/4 至 9/10 合計買進約 1,530 萬美元，是近期金額最大的叢集買進"}, {"t": "LYFT", "n": "Lyft，同業對照組，可檢驗這是公司層面的訊號還是產業層面的訊號"}], "en": "Two Uber insiders bought roughly $15.3 million of stock between 4 and 10 September, the largest cluster by dollar value on the current tracker. Cluster buying, defined as three or more insiders inside a short window, has historically been one of the stronger signals; two insiders is weaker but the size here is unusual for a company this large, where executives typically sell to diversify rather than buy. One caveat worth holding: dollar size at a mega-cap tells you less than dollar size relative to that person's own net worth, and Form 4 filings do not show you the second number.", "zh": "兩位優步內部人在 9 月 4 日到 9 月 10 日之間合計買進約 1,530 萬美元，是目前追蹤名單上金額最大的一筆叢集買進。所謂叢集買進，一般定義是三位以上內部人在短時間內同時買，歷史上是較強的訊號；兩個人的強度較弱，但對一家這種規模的公司來說，金額相當罕見，因為大型公司的高階主管通常是為了分散風險而賣、不是買。要記住一個限制：在大型股身上，絕對金額能告訴你的事，遠不如那筆金額佔這個人身家的比重，而 Form 4 不會揭露第二個數字。", "url": "https://insideraction.io/clusters"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "微型股三例", "color": "#6DB56D", "stocks": [{"t": "RGCO", "n": "RGC Resources，四位內部人 9/1 至 9/10 合計買進約 5.7 萬美元"}, {"t": "PRTS", "n": "CarParts.com，兩位內部人 8/27 至 9/10 合計買進約 43.8 萬美元"}, {"t": "FRST", "n": "Primis Financial，兩位內部人 8/20 至 9/9 合計買進約 4.8 萬美元"}], "en": "Three of the current cluster buys sit in companies most people have never heard of: RGC Resources with four insiders and about $57,000, CarParts.com with two insiders and about $438,000, Primis Financial with two insiders and about $48,000. The reading discipline matters here. Number of participants beats dollar size at this end of the market, because a small-company director's $15,000 can be a larger share of their liquid assets than an executive's $5 million. Also check whether the purchase was open-market or an option exercise, and whether it clusters near an earnings date, where the information asymmetry is largest and the filing least interesting.", "zh": "目前的叢集買進名單裡，有三家是多數人沒聽過的公司：RGC Resources 四位內部人合計約 5.7 萬美元、CarParts.com 兩位內部人約 43.8 萬美元、Primis Financial 兩位內部人約 4.8 萬美元。判讀的紀律在這裡特別重要。在這個市值層級，參與的人數比金額大小更有意義，因為小公司董事的 1.5 萬美元，佔他流動資產的比重可能比大公司高階主管的 500 萬美元還高。另外兩件要順手檢查的事：這筆是公開市場買進還是選擇權執行，以及買進時點是不是緊貼財報日期。越貼近財報，資訊不對稱越大，這筆申報能告訴你的反而越少。", "url": "https://insideraction.io/clusters"},
    {"id": "capitol_0", "channel": "政要持股", "tag": "買等權重", "color": "#B5654D", "stocks": [{"t": "RSP", "n": "Invesco 標普 500 等權重 ETF，德州眾議員吉爾 8/13 買進 5 萬至 10 萬美元，9/9 申報"}, {"t": "QQQ", "n": "那斯達克 100 ETF，市值加權、集中度極高，正是這筆交易在迴避的東西"}], "en": "Texas Representative Brandon Gill disclosed a single purchase on 9 September: the Invesco S&P 500 Equal Weight ETF, $50,001 to $100,000, executed 13 August. What makes this worth a card is that the position itself carries a thesis rather than a name. Buying the equal-weight version of the index instead of the cap-weighted one is a bet on breadth: that the median S&P company does better from here than the handful of megacaps that dominate the standard index. It is one transaction, one fund, and one clearly stated view about concentration. No claim is made here about how that view was formed.", "zh": "德州眾議員吉爾在 9 月 9 日申報了一筆交易：買進 Invesco 標普 500 等權重 ETF，金額區間 5 萬到 10 萬美元，執行日是 8 月 13 日。這筆之所以值得一張卡，是因為部位本身帶著一個明確的假設，而不是一個公司名字。買等權重版本、而不是市值加權版本，押的是廣度：往後標普 500 的中位數公司會比主導標準指數的那幾檔超大型股表現更好。一筆交易、一檔基金、一個對集中度的清楚看法。這裡不對這個看法是怎麼形成的做任何推論。", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035410.pdf"},
    {"id": "capitol_1", "channel": "政要持股", "tag": "排行榜的陷阱", "color": "#B5654D", "stocks": [{"t": "COIN", "n": "Coinbase，在該份申報中出現的標的之一，但同一檔既有買也有賣"}, {"t": "TTD", "n": "The Trade Desk，同樣出現在該份申報的高頻名單中"}, {"t": "AMD", "n": "超微，同一份申報裡被部分賣出，與「熱門買進」的直覺相反"}], "en": "The counterweight card. California Representative Gilbert Cisneros tops every congressional trading leaderboard right now with 139 transactions in 90 days across 118 distinct assets. Open the actual filing and the ranking dissolves. Every line reads the same way: executed by 150 Main Street Trust through Bank of America, every single amount in the $1,001 to $15,000 bracket, buys and sells of the same names on the same dates. This is a managed account rebalancing, not a person forming a view. Three structural limits apply to this whole dataset: disclosure can lag the trade by 45 days, amounts are broad ranges rather than numbers, and many accounts are spousal or trust-executed. A leaderboard sorted by transaction count measures none of that.", "zh": "這是一張配重卡。加州眾議員西斯內羅斯目前在所有國會交易排行榜上都排第一：90 天內 139 筆交易、涵蓋 118 個不同標的。但把申報書打開，排名就瓦解了。每一行都長得一樣：由 150 Main Street Trust 透過美國銀行執行，每一筆金額都落在 1,001 到 15,000 美元這個區間，同一檔股票在同一天既有買也有賣。這是一個受託管理帳戶在做再平衡，不是一個人在形成看法。整套資料有三個結構性限制要一起記住：申報可以落後交易 45 天、金額只有寬區間沒有數字、很多帳戶由配偶或信託執行。而一個照交易筆數排序的排行榜，這三件事一件都沒有衡量到。", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035390.pdf"},
    {"id": "week_0", "channel": "本週事件", "tag": "下週總經", "color": "#C97DD4", "stocks": [{"t": "XLF", "n": "金融類股 ETF，聯準會決議與點陣圖是下週最大的單一變數"}, {"t": "XRT", "n": "零售類股 ETF，八月零售銷售將檢驗油價墊高後家庭實際還花不花錢"}, {"t": "DIA", "n": "道瓊 ETF，本週已跌 1.6%，是三大指數裡週線最弱的"}], "en": "Next week is dominated by one event. The FOMC meets 15-16 September with futures pricing roughly a 90% chance of a 25 basis point increase, and the meeting carries updated economic projections and a new dot plot, which in this situation matters more than the decision itself. Around it: August retail sales and industrial production, housing starts and permits, weekly jobless claims and the Philadelphia Fed survey. Retail sales is the one to watch second, because it is the first hard read on whether $100 crude has already reached household spending.", "zh": "下週被單一事件主導。聯準會在 9 月 15 至 16 日開會，期貨定價升息一碼的機率約九成；同時會公布更新後的經濟預測與新的點陣圖，而在目前這種情境下，點陣圖比決議本身更重要，因為市場需要知道這是一次性的，還是一個循環的開始。圍繞在它周邊的還有：八月零售銷售與工業生產、房屋開工與建照、每週初領失業金人數，以及費城聯準銀行製造業調查。第二重要的是零售銷售，它是每桶 100 美元的原油有沒有已經打進家庭支出的第一份硬數據。", "url": "https://tradingeconomics.com/united-states/calendar"},

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {

  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>筆數</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>買 / 賣</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>申報區間</th>
                  <th style={{ textAlign:"left",  padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>常見標的</th>
                  <th style={{ textAlign:"right", padding:"6px 0 6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>最新申報</th>
                </tr>
              </thead>
              <tbody>
                {R.roster.map(r => (
                  <tr key={r.name + r.dst}>
                    <td style={{ padding:"7px 8px 7px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      <a href={r.url} target="_blank" rel="noopener noreferrer" style={{ color:"#B5654D", textDecoration:"none" }}>{r.name}</a>
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px", marginLeft:"6px" }}>{r.dst}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums" }}>{r.n}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>
                      <span style={{ color:"#6DB56D" }}>{r.buy}</span>
                      <span style={{ color:"var(--text-tertiary)" }}> / </span>
                      <span style={{ color:"#E05C5C" }}>{r.sell}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>{money(r.lo)}–{money(r.hi)}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      {r.top.map(t => (
                        <a key={t} href={"https://www.tradingview.com/symbols/" + t + "/"} target="_blank" rel="noopener noreferrer"
                           style={{ color:"var(--text-secondary, inherit)", textDecoration:"none", marginRight:"7px", fontFamily:"'Courier New',monospace" }}>{t}</a>
                      ))}
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px" }}>共 {r.distinct} 檔</span>
                    </td>
                    <td style={{ padding:"7px 0 7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", whiteSpace:"nowrap" }}>{r.last}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ padding:"12px 16px 0", fontSize:"10px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            只涵蓋眾議院；參議院走另一套 efdsearch 系統，尚未納入。買＋賣不一定等於筆數，差額是交換（exchange）類交易。
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/12/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v10.7</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
