<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
  const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "道瓊斷鏈", "color": "#E05C5C", "stocks": [{"t": "DIA", "n": "道瓊 ETF，-464.02 點(-0.85%)收 53,885.10，連續創高的行情就此中止"}, {"t": "SPY", "n": "標普500 ETF，-0.18% 收 7,709.96"}, {"t": "QQQ", "n": "那斯達克100 ETF，對照那指僅小跌 0.06% 收 26,348.35"}], "en": "US stocks closed lower on Thursday. The Dow fell 464.02 points (-0.85%) to 53,885.10, ending its record-setting run; the S&P 500 slipped 0.18% to 7,709.96 and the Nasdaq eased just 0.06% to 26,348.35. The index-level damage was small, but it was concentrated in the Dow, which means what got sold were the heavyweight, rate-sensitive names rather than the whole market. Only two of the eleven S&P sectors closed green.", "zh": "週四美股收黑。道瓊跌 464.02 點(-0.85%)收 53,885.10，終結了連續創高的一段行情；標普 500 跌 0.18% 收 7,709.96，那斯達克只跌 0.06% 收 26,348.35。指數層級的跌幅不大，但下跌集中在道瓊，代表被賣的是權重高、對利率敏感的成分股，而不是整個市場一起撤退。同一天十一大類股裡只有兩個收紅。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-august-6-dow-sp-nasdaq-091620000.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "油價回頭", "color": "#E05C5C", "stocks": [{"t": "USO", "n": "原油期貨 ETF，西德州原油漲近 3% 收破 77 美元、布蘭特漲近 4% 收破 82 美元"}, {"t": "XLE", "n": "能源類股，當天唯二收紅的類股之一，漲逾 1%"}, {"t": "XOM", "n": "埃克森美孚，當天漲近 2%，是能源類股最大貢獻者"}, {"t": "CVX", "n": "雪佛龍，同日漲逾 1%"}], "en": "Iran's foreign ministry spokesman Baghaei said Thursday that Tehran had reached an agreement with Oman on a temporary shipping route through the Strait of Hormuz — then attached the condition that matters: whether it can be implemented depends on third parties not obstructing it. The market promptly took back some of its optimism. WTI rose nearly 3% to settle above $77 and Brent jumped almost 4% to close above $82, touching $83 intraday. Energy was one of only two sectors to finish higher, up more than 1%.", "zh": "伊朗外交部發言人 Baghaei 週四表示，德黑蘭已與阿曼就荷莫茲海峽的臨時航道達成協議，但補上了關鍵條件：能不能執行，取決於第三方不從中阻撓。市場立刻把樂觀收回去一部分——西德州原油大漲近 3% 收在 77 美元之上，布蘭特跳升近 4% 收破 82 美元、盤中一度到 83 美元。能源因此成為當天唯二收紅的類股，漲幅超過 1%。", "url": "https://www.zacks.com/stock/news/2969501/stock-market-news-for-aug-6-2026"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "利率壓頂", "color": "#E05C5C", "stocks": [{"t": "XLRE", "n": "不動產類股，當天最弱三類股之一，跌約 1%"}, {"t": "XLB", "n": "原物料類股，同樣跌約 1%"}, {"t": "XLI", "n": "工業類股，跌約 1%，與前兩者的共同點是評價靠貼現率"}], "en": "The 10-year Treasury yield rose to 4.67% and the 30-year to 5.21%, and that pushed the rate-sensitive complex down as a block: real estate, materials and industrials each fell about 1%, the three weakest sectors of the day. Read the causation carefully — the fundamentals of those three industries did not all deteriorate on the same afternoon. Their valuations simply live on the discount rate, and when the long end rises the denominator gets bigger. That has nothing to do with how the companies are trading.", "zh": "十年期公債殖利率升到 4.67%、三十年期升到 5.21%，把利率敏感的族群整批壓下去：不動產、原物料與工業各跌約 1%，是當天最弱的三個類股。這裡要看清楚因果——不是這三個產業的基本面同一個下午一起變壞，而是它們的評價都靠貼現率吃飯。當長端殖利率往上走，估值的分母就變大，這跟公司生意做得好不好無關。", "url": "https://www.cnbc.com/2026/08/06/treasury-yields-interest-rates-inflation-fed.html"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "個股離散", "color": "#E05C5C", "stocks": [{"t": "HTZ", "n": "赫茲租車，第二季財報優於預期，大漲 11.5%"}, {"t": "UWMC", "n": "UWM Holdings，財報不如預期並暫停季配息，重挫近 25%"}, {"t": "SPCX", "n": "SpaceX，早盤一度漲 6.14%，在解禁賣壓下把漲幅吐光"}], "en": "The index barely moved; the single names moved a lot. Hertz beat on its second quarter and jumped 11.5%. UWM Holdings missed and suspended its quarterly dividend, and fell nearly 25%. SpaceX was up 6.14% early and gave the whole gain back as its lock-up expired. Three stocks, three different scripts, and the thing they share is that none of them was driven by the market. On days like this, sizing a position off the index is the least efficient thing you can do.", "zh": "指數只跌一點，個股的落差卻很大。赫茲租車財報優於預期、大漲 11.5%；UWM Holdings 財報不如預期並暫停季配息，重挫近 25%；SpaceX 早盤一度漲 6.14%，卻在解禁賣壓下把漲幅全部吐光。三檔股票、三種劇本，共同點是沒有一檔的走勢跟大盤有關。在這種市場裡，看指數決定部位是最沒有效率的做法。", "url": "https://www.tipranks.com/news/these-are-the-stocks-reporting-earnings-today-august-6-2026"},
    {"id": "earn_0", "channel": "財報速報", "tag": "軟體挨打", "color": "#E8786A", "stocks": [{"t": "DDOG", "n": "Datadog，營收年增 36% 且上修全年指引，仍跌 17%"}, {"t": "HUBS", "n": "HubSpot，調整後 EPS 3.26 美元優於預期 3.02、營收 9.117 億年增 19.8%，因下修全年展望跌 24%"}, {"t": "APP", "n": "AppLovin，營收 19.2 億略低於預期 19.4 億，跌 19.3%"}], "en": "Software cratered on Thursday: Datadog fell 17%, HubSpot 24%, AppLovin 19.3%. Look at what was actually punished and none of it was the quarter itself. Datadog grew revenue 36% and raised full-year guidance, but its adjusted gross margin of 80% came in under the 80.7% expected, free cash flow margin narrowed from 29% to 25%, and its largest AI customer flagged lower usage for the rest of the year. HubSpot beat on both lines — adjusted EPS of $3.26 against $3.02, revenue of $911.7 million up 19.8% — and then cut its full-year revenue outlook. AppLovin's $1.92 billion missed a $1.94 billion bar. This season the market is buying the next twelve months, not the last three.", "zh": "週四軟體股集體崩落：Datadog 跌 17%、HubSpot 跌 24%、AppLovin 跌 19.3%。細看被罰的理由，沒有一個是「這一季不好」——Datadog 營收年增 36% 且上修全年指引，敗在調整後毛利率 80% 略低於預期的 80.7%、自由現金流利潤率從 29% 降到 25%，加上最大的 AI 客戶預告下半年用量會減少；HubSpot 調整後每股盈餘 3.26 美元優於預期的 3.02、營收 9.117 億年增 19.8% 也超標，卻下修了全年營收展望；AppLovin 營收 19.2 億略低於 19.4 億。這一季市場買的是未來十二個月，不是過去三個月。", "url": "https://finance.yahoo.com/markets/article/software-stocks-sink-led-by-declines-from-figma-datadog-144104020.html"},
    {"id": "earn_1", "channel": "財報速報", "tag": "儲存門檻", "color": "#E8786A", "stocks": [{"t": "SNDK", "n": "SanDisk，會計年度第四季營收 89.7 億美元、調整後每股盈餘 39.25 美元均超預期，但下季指引中位數不足，今年已漲 423%"}, {"t": "WDC", "n": "西部數據，財報同樣超標，盤後仍跌約 10%"}], "en": "SanDisk's fiscal fourth quarter delivered revenue of $8.97 billion and adjusted EPS of $39.25, both ahead of consensus — but the midpoint of next-quarter revenue guidance came in below Wall Street's number and the stock weakened. Western Digital reported the same shape on the same day, beating and still falling about 10% after hours. SanDisk is up 423% in 2026, and that is the point: the bar has been raised from beat to blow out. The date that matters now is the August 13 investor day, where fiscal 2027 supply, contract conversion and price floors get spelled out.", "zh": "SanDisk 會計年度第四季營收 89.7 億美元、調整後每股盈餘 39.25 美元都超過市場預期，但下一季營收指引的中位數低於華爾街估計，股價因此走弱；同一天西部數據也是財報超標、盤後仍跌約 10%。SanDisk 今年已經漲了 423%，這正是重點：市場的門檻已經從「超預期」墊高到「要遠超預期」。現在真正的關鍵是 8/13 的法人說明會——2027 會計年度的供給量、合約轉換與價格下限會在那天講清楚。", "url": "https://www.investing.com/news/stock-market-news/sandisk-earnings-impact-on-micron-western-digital-and-seagate-93CH-4839061"},
    {"id": "earn_2", "channel": "財報速報", "tag": "推論成本", "color": "#E8786A", "stocks": [{"t": "FIG", "n": "Figma，營收與獲利雙雙超標，卻因提到 AI 推論支出上升而下跌"}, {"t": "KVYO", "n": "Klaviyo，同日財報後同步走弱"}, {"t": "NET", "n": "Cloudflare，被同一條疑慮拖累的軟體同業"}], "en": "Figma and Klaviyo both fell after reporting. Figma beat on the top and bottom lines and then raised something new on the call: AI inference spending is rising — every time a user prompt runs through a model, someone pays, and the bill scales with usage. That is a variable cost appearing on a software income statement, and the whole appeal of SaaS was that one more customer cost almost nothing to serve. Once that line is drawn in, every gross margin model in the industry has to be rebuilt.", "zh": "Figma 與 Klaviyo 財報後同步走弱。Figma 的營收與獲利雙雙超標，卻在法說會上提到一件新事：AI 推論支出正在上升——把使用者的提示丟進模型跑，每跑一次就要付一次錢，而且成本隨用量增加。這是軟體業損益表上新出現的一條變動成本，而過去 SaaS 最迷人的地方，正是「多一個客戶幾乎不增加成本」。這條線一旦被畫上去，整個產業的毛利率模型都要重算。", "url": "https://seekingalpha.com/news/4627969-figma-klaviyo-fall-following-earnings-as-bulk-of-software-sector-sees-red"},
    {"id": "macro_0", "channel": "總經政策", "tag": "裁員兩年低", "color": "#7C6AF7", "stocks": [{"t": "XLI", "n": "工業類股，就業降溫最早反映在製造與運輸的雇用"}, {"t": "MAN", "n": "ManpowerGroup，人力仲介，是就業循環最直接的讀數"}], "en": "Two labour prints landed on the same day and pointed the same way. Initial jobless claims for the week to August 1 rose just 1,000 to 199,000, still inside the lowest range since 1969. Challenger counted 33,429 announced job cuts in July — down 27% from June and 46% from a year ago, the lowest monthly total in two years. That sits awkwardly against ADP's 44,000 private-payroll gain earlier in the week: companies are not firing, but they are not hiring faster either. Tonight's 8:30am ET July payrolls report is the referee.", "zh": "兩份就業數據同一天出來，方向一致：截至 8/1 當週的初次請領失業金人數只增加 1,000 人至 19.9 萬，仍在 1969 年以來的最低區間；Challenger 統計 7 月企業宣布裁員 33,429 人，比 6 月少 27%、比去年同期少 46%，是兩年來最低的單月數字。這跟本週稍早 ADP 民間就業只增 4.4 萬形成矛盾：企業沒有在裁人，但也沒有在加速招人。今晚美東時間 8:30 的 7 月非農，就是這場爭論的裁判。", "url": "https://finance.yahoo.com/news/us-weekly-jobless-claims-edge-125055810.html"},
    {"id": "macro_1", "channel": "總經政策", "tag": "58%", "color": "#7C6AF7", "stocks": [{"t": "TLT", "n": "20 年以上公債 ETF，三十年期升到 5.21%，長端首當其衝"}, {"t": "IEF", "n": "7-10 年公債 ETF，十年期 4.67%，可對照曲線形狀"}], "en": "The odds of a 25bp hike at the September 16 FOMC fell to about 58% on Thursday from 68% on Monday. The reason is not the Fed — it is oil. Progress on the Strait of Hormuz pulled inflation expectations down and the market unwound some of its hawkish pricing. But that link runs both ways: crude rose almost 4% again on Thursday, and if the deal stalls the hike odds climb back just as fast. With the 10-year at 4.67% and the 30-year at 5.21%, the bond market clearly has not concluded that the inflation problem is solved.", "zh": "9 月 16 日 FOMC 升息一碼的機率，從週一的 68% 降到週四的 58%。理由不在 Fed，而在油——荷莫茲海峽的協議進展壓低了通膨預期，市場就把鷹派定價往回收一些。但這條連結是雙向的：週四油價又漲了近 4%，如果協議卡住，升息機率會一樣快地漲回去。十年期 4.67%、三十年期 5.21% 的位置說明，債市還沒有真的相信通膨壓力已經解除。", "url": "https://tradingeconomics.com/united-states/government-bond-yield"},
    {"id": "macro_2", "channel": "總經政策", "tag": "傳導鏈", "color": "#7C6AF7", "stocks": [{"t": "DBC", "n": "廣泛商品 ETF，這條鏈條的起點"}, {"t": "TIP", "n": "抗通膨公債 ETF，鏈條中段的定價器"}], "en": "Lay this week's events end to end and you get the transmission chain worth memorising for 2026: the status of the Strait of Hormuz to oil, oil to inflation expectations, inflation expectations to September hike odds, hike odds to the long end, and the long end to the valuation of rate-sensitive sectors like real estate and industrials. Every link in that chain moved this week, and several moved twice in both directions. The practical implication is uncomfortable: right now a Middle East diplomacy headline explains your portfolio better than any company's earnings report does.", "zh": "把這幾天的事件排成一條線，就得到今年最值得記住的傳導鏈：荷莫茲海峽的通行狀況 → 油價 → 通膨預期 → 9 月升息機率 → 長端殖利率 → 不動產與工業等利率敏感股的評價。這一週，這條鏈的每一節都動了，而且好幾節來回動了兩次。對一般投資人的實際意義有點不舒服：現在盯一則中東外交新聞，比盯任何一家公司的財報，更能解釋你的持股為什麼漲跌。", "url": "https://investinglive.com/commodities/oil-recap-oil-prices-mixed-as-hormuz-reopening-hopes-offset-surprise-us-crude-build/"},
    {"id": "sector_0", "channel": "產業風向", "tag": "軟體重估", "color": "#4EABA4", "stocks": [{"t": "IGV", "n": "軟體類股 ETF，週四跌逾 2%；自 4 月低點反彈逾 35%，年內仍為負 3%"}, {"t": "CRM", "n": "Salesforce，跟著同業一起下跌"}, {"t": "NOW", "n": "ServiceNow，同樣被這條疑慮拖累"}], "en": "The iShares Expanded Tech-Software ETF fell more than 2% on Thursday. It has rebounded over 35% from its April low and is still down 3% year to date. Put those two facts together and the message is that software in 2026 has been a bounce off a low, not a re-rating on growth — and the market is now re-measuring the group with an AI yardstick. Does AI help software companies sell more, or does it turn their products into features anyone can build? Salesforce and ServiceNow falling alongside the reporters is what an unanswered question looks like in price.", "zh": "iShares 擴展科技軟體 ETF 週四跌逾 2%。它自 4 月低點反彈超過 35%，但年初至今仍是負的 3%。把這兩個事實放在一起，訊息就很清楚：軟體股今年是「跌深反彈」而不是「重新成長」，而市場正在用 AI 這把尺重新量它們——AI 到底是幫軟體公司賣得更多，還是把它們的產品變成隨手可做的功能？週四 Salesforce 與 ServiceNow 跟著交卷的同業一起跌，就是這個疑問還沒有答案的價格表現。", "url": "https://finance.yahoo.com/markets/stocks/articles/crm-now-intu-adbe-software-020402578.html"},
    {"id": "sector_1", "channel": "產業風向", "tag": "AI裁員", "color": "#4EABA4", "stocks": [{"t": "XLK", "n": "科技類股，7 月裁員 9,867 人、今年累計 149,023 人"}, {"t": "ADP", "n": "Automatic Data Processing，薪資處理商，對企業雇用人數的曝險最直接"}], "en": "There is one number in the July Challenger report that is easy to skim past: AI was the leading stated reason for announced job cuts for the fifth consecutive month, accounting for 10,970 in July. Technology led all sectors with 9,867 cuts in July and 149,023 so far in 2026. Total layoffs at a two-year low while AI is the number one cause of them is not a cyclical layoff cycle — it is structural substitution. For investors the other end of that thread is the question of whose income statement the saved labour cost eventually shows up on.", "zh": "Challenger 的 7 月報告裡有一個容易被跳過的數字：AI 連續第五個月成為企業宣布裁員的首要原因，7 月因此裁掉 10,970 人；科技業 7 月裁 9,867 人，今年累計 149,023 人。裁員總數落在兩年低點的同時，AI 卻是裁員的第一主因——這代表發生的不是景氣性裁員，而是結構性替換。對投資人來說，這條線的另一端是：企業省下來的人力成本，最後會出現在誰的損益表上。", "url": "https://www.challengergray.com/blog/challenger-report-layoffs-fall-hiring-picks-up-ai-leads-for-fifth-straight-month/"},
    {"id": "sector_2", "channel": "產業風向", "tag": "能源虛實", "color": "#4EABA4", "stocks": [{"t": "OIH", "n": "油服 ETF，吃的是探勘與開採的資本支出，不是單週油價"}, {"t": "SLB", "n": "斯倫貝謝，全球最大油服商"}, {"t": "HAL", "n": "哈里伯頓，北美壓裂與完井服務"}], "en": "Energy was one of only two sectors to close green on Thursday, up more than 1%, with ExxonMobil adding almost 2% and Chevron more than 1%. But be honest about why: this leg was not stronger demand, it was Hormuz uncertainty pushing crude up. The demand evidence is, if anything, soft. That distinction matters more for oilfield services than for the integrated majors — services live on exploration and production capex, and capex decisions turn on whether operators believe oil can hold a level for years, not on whether there was a geopolitical headline this week.", "zh": "能源是週四唯二收紅的類股、漲幅超過 1%，埃克森美孚漲近 2%、雪佛龍漲逾 1%。但要誠實看它漲的理由：這一波不是需求變強，而是荷莫茲海峽的不確定性把油價推上去，需求端的證據其實偏弱。這個區別對油服業者的意義比對綜合型石油公司更大——油服吃的是探勘與開採的資本支出，而資本支出看的是「油價能不能長期站穩」，不是「這週有沒有地緣新聞」。", "url": "https://www.zacks.com/stock/news/2969501/stock-market-news-for-aug-6-2026"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "逆勢收紅", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，8/6 收漲 0.19%"}, {"t": "DIA", "n": "道瓊 ETF，同日跌 0.85%，是最直接的對照組"}], "en": "On the day the Dow fell 464 points, the Russell 2000 closed up 0.19%. This picture keeps recurring in 2026: small caps are decoupling from the headline index. The reason is not mysterious. Dow constituents are global-revenue businesses sensitive to the dollar and to long-duration rates, while a large share of the Russell 2000 is domestically driven. When the risk of the day comes from the long end of the curve rather than from the economy, there is no reason those two should fall together.", "zh": "在道瓊跌 464 點的那一天，羅素 2000 收漲 0.19%。這是今年反覆出現的畫面：小型股跟大盤指數的走勢正在鬆綁。原因並不神秘——道瓊的成分股是全球營收、對匯率與長天期利率敏感的大公司，而羅素 2000 有很高比重是內需型企業。當市場當天的風險來自長端殖利率而不是景氣，這兩者本來就不該一起跌。", "url": "https://www.tradingview.com/symbols/TVC-RUT/"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "品質分層", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素 2000 成長型，不賺錢公司比重高，這波漲幅最大"}, {"t": "IWN", "n": "羅素 2000 價值型，獲利公司比重高，漲幅相對溫和"}], "en": "The small-cap rally remains badly lopsided: since mid-2025, unprofitable Russell 2000 companies have gained 154% while profitable ones gained 34%. That gap is especially dangerous with the 30-year at 5.21% and September hike odds at 58%, because companies without earnings survive entirely on external funding, and funding cost is the first thing a hike touches. The spread between the growth and value small-cap ETFs is the simplest way to watch this split in real time.", "zh": "小型股今年的漲勢仍然嚴重偏食：自 2025 年中以來，羅素 2000 裡不賺錢的公司漲了 154%，有獲利的只漲 34%。這個差距在三十年期殖利率 5.21%、9 月升息機率 58% 的環境下特別危險，因為沒有獲利的公司完全靠外部融資活著，而融資成本正是升息第一個動到的東西。成長型與價值型小型股 ETF 的走勢差，就是即時觀察這條分層最簡單的工具。", "url": "https://247wallst.com/investing/2026/07/16/the-russell-2000-is-having-its-best-year-in-23-years-heres-why-small-caps-are-winning-again/"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "覆蓋真空", "color": "#5B8ED6", "stocks": [{"t": "QNST", "n": "QuinStreet，財報後單日漲 28% 至 19.47 美元，市值僅 8.89 億美元"}, {"t": "IWC", "n": "微型股 ETF，覆蓋真空最集中的地方"}], "en": "Thursday produced a clean demonstration. QuinStreet reported and rose 28% in a single session, on a market capitalisation of just $888.7 million. For a company to gain nearly a third of its value in one day, the market's prior expectation has to have been badly wrong — which is another way of saying nobody was seriously modelling it. That is the price consequence of a coverage vacuum: the information gap does not get corrected gradually, it gets settled all at once on an earnings date. The upside and the downside are the same mechanism pointed in opposite directions.", "zh": "週四出現一個很乾淨的示範：QuinStreet 公布財報後單日漲 28%，而它的市值只有 8.89 億美元。一家公司要在一天內漲掉將近三成，前提是市場原本對它的預期錯得很離譜——換句話說，沒有人在認真替它建模。這就是覆蓋真空的價格後果：資訊落差不會慢慢被修正，它會在某一個財報日一次補完。好處與壞處其實是同一個機制，只是方向相反時跌幅也一樣猛。", "url": "https://markets.financialcontent.com/stocks/article/stockstory-2026-8-6-quinstreet-nasdaqqnst-reports-bullish-q2-cy2026-stock-jumps-28"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "非農夜", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000，成分股以美國內需營收為主，對就業數據的敏感度高於大型股"}, {"t": "KRE", "n": "區域銀行 ETF，小型企業的主要放款來源"}], "en": "Tonight's 8:30am ET July payrolls report matters more to small caps than to large caps, for a structural reason: Russell 2000 revenue is overwhelmingly domestic, so employment and wages feed straight into their sales, whereas roughly 40% of S&P 500 revenue comes from overseas. That is why the same data point routinely moves twice as far down the cap scale. And the setup is two-sided — a weak print raises growth worries, a strong print brings September hike pricing back, and for indebted small companies neither is good news.", "zh": "今晚美東時間 8:30 的 7 月非農，對小型股的意義比對大型股大，理由是結構性的：羅素 2000 的成分股營收以美國內需為主，就業與薪資直接決定它們的營收；而標普 500 有將近四成營收來自海外。這也是為什麼同一份數據常常在小型股身上放大兩倍。而且這個局面是雙面的——數據太弱，市場擔心景氣；數據太強，9 月升息的定價就回來，對負債高的小型公司，兩邊都不是好消息。", "url": "https://continuumeconomics.com/a/6815e0e3/preview-due-august-7-us-july-employment-non-farm-payrolls-stronger-than-june-but-with-a-rise-in-unemployment"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "流動性", "color": "#5B8ED6", "stocks": [{"t": "IWC", "n": "微型股 ETF，成分股日成交金額常只有數十萬美元"}, {"t": "IJS", "n": "標普小型價值型，流動性明顯較佳，適合當對照"}], "en": "One cost you have to price before touching micro caps: liquidity. A micro cap may trade only a few hundred thousand dollars a day, which means two things. Your own buy order pushes the price up, and the day you want out is usually the day everyone else wants out too. The practical method is to decide what share of average daily volume you are willing to be, size the position from that, and think about the exit before the entry. That is not conservatism — for micro caps it is the only arithmetic that works.", "zh": "做小型股之前必須先算清楚的一項成本是流動性。微型股每天的成交金額可能只有數十萬美元，這代表兩件事：你自己的買單就會把價格推上去，而你想出場的那一天，通常就是所有人都想出場的那一天。實務上的做法是先決定「願意佔日均成交量的多少比例」，再由此反推部位大小；先想出場、再想進場。這不是保守，對微型股來說，這是唯一行得通的算法。", "url": "https://www.zacks.com/stock-education/57/Stocks-Neglected-By-Analysts"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "ADV驗證失敗", "color": "#C9A227", "stocks": [{"t": "ADV", "n": "Advantage Solutions，Q2 營收 8.895 億美元年增 1.8% 低於預估 8.962 億；淨損從 3,040 萬擴大到 6,270 萬；調整後 EBITDA 年減 12.2% 至 7,580 萬"}], "en": "Advantage Solutions provides retail execution and marketing services for consumer brands. It entered the pool on one signal: CEO David Peacock bought 18 times in a year with zero sales, and insiders as a group were 18 buys and no sells. The stated verification point was the August Q2 report, and specifically whether the turnaround was showing up in cash flow. It did not. Revenue of $889.5 million grew 1.8% and missed the $896.2 million consensus; the net loss widened to $62.7 million from $30.4 million a year ago; adjusted EBITDA fell 12.2% to $75.8 million, an 8.5% margin; net leverage stands at 4.5x. One thing held: adjusted unlevered free cash flow of $18.7 million, and management reiterated full-year guidance. But the honest reading is that persistent insider buying has now failed to convert in this pool two days running. Research lead, not investment advice.", "zh": "Advantage Solutions 做的是消費品牌的零售通路執行與行銷服務。它入池靠的是單一訊號：執行長 David Peacock 一年買進 18 次、零賣出，全體內部人一年 18 買 0 賣。當初訂的驗證點是 8 月的第二季財報，要看的就是轉型有沒有反映在現金流上。答案是沒有：營收 8.895 億美元年增 1.8%，低於市場預估的 8.962 億；淨損從去年同期的 3,040 萬擴大到 6,270 萬；調整後 EBITDA 年減 12.2% 至 7,580 萬、利潤率 8.5%；淨槓桿 4.5 倍。有一項守住了——調整後無槓桿自由現金流 1,870 萬美元，公司也維持全年指引。但誠實的讀法是：「內部人連續買進」這個訊號，在這個雷達池裡連續第二天沒有兌現。研究線索，非投資建議。", "url": "https://www.stocktitan.net/news/ADV/advantage-solutions-reports-second-quarter-2026-hrzxd0yn63z8.html", "status": "RADAR · 驗證未過，降級觀察；下一個驗證點是 Q3 的 EBITDA 利潤率能否止跌、淨槓桿能否從 4.5 倍下降"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "CSR論點換了", "color": "#C9A227", "stocks": [{"t": "CSR", "n": "Centerspace，Q2 營收 6,580 萬美元年減 4.0%，FFO 每股 1.20、Core FFO 1.27 優於預期；已出售或簽約出售 20 個社區約 5.3 億美元"}], "en": "Centerspace is a Midwest apartment REIT. It went on the radar because a strategic review failed to produce a buyer, event-driven money left, and insiders bought five times with zero sales into that weakness. The Q2 numbers: revenue of $65.8 million fell 4.0% from $68.5 million, a net loss of $0.07 per diluted share, but FFO of $1.20 and Core FFO of $1.27 both beat. The important part is on the asset side. The company has now sold or agreed to sell 20 communities for roughly $530 million, is fully exiting Rapid City and plans to exit Bismarck, and is rotating the proceeds into institutional markets — after quarter-end it sold five Rapid City communities for $66.0 million and two Minneapolis communities for $73.8 million. So the thesis has changed underneath us. It is no longer wait for someone to buy the company; it is the company is selling itself off piece by piece and changing which markets it owns. That is a different bet entirely. Research lead, not investment advice.", "zh": "Centerspace 是美國中西部的公寓 REIT。它上雷達的原因是策略檢討找不到買家、事件套利資金離場，而內部人在這段跌勢裡一年 5 買 0 賣。第二季數字：營收 6,580 萬美元、年減 4.0%（去年同期 6,850 萬），單季每股淨損 0.07 美元，但 FFO 每股 1.20 美元、Core FFO 1.27 美元都優於預期。真正重要的在資產面——公司已出售或簽約出售 20 個社區、金額約 5.3 億美元，完全退出 Rapid City、計畫退出 Bismarck，把資金轉向法人型市場；季後又賣掉 Rapid City 五個社區 6,600 萬與明尼亞波利斯兩個社區 7,380 萬美元。所以論點在我們腳下換掉了：不再是「等人來買整家公司」，而是「公司自己一塊一塊賣掉資產、換掉持有的市場」。這是完全不同的一場賭注。研究線索，非投資建議。", "url": "https://www.stocktitan.net/sec-filings/CSR/8-k-centerspace-reports-material-event-d3ea33cb6b2f.html", "status": "RADAR · 論點已改寫；下一個驗證點是處分價格與 Core FFO 全年指引 4.58-4.68 美元能否守住"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "SONO補一角", "color": "#C9A227", "stocks": [{"t": "SONO", "n": "Sonos，會計年度第三季營收 3.7526 億美元、淨利 2,985 萬（去年同期虧損），毛利率 46.57%；3-6 月實際買回 199 萬股、3,014 萬美元"}], "en": "Sonos makes premium wireless home audio. The strongest bear point against it was always that this profit came from cost cuts and that the next hardware cycle is entirely unproven. New information fills part of that gap: the company has signed a partnership with Škoda Auto, taking its audio into the automotive channel — a growth source that does not depend on its own next product launch. On the financials, fiscal Q3 revenue was $375.26 million with net income of $29.85 million against a loss a year earlier, and a 46.57% gross margin; between March and June it actually repurchased 1.99 million shares for $30.14 million, which puts it in the executed rather than merely authorised category. The bear case has not gone away: a 30.5x P/E is high against peers, the CFO who drove the cost programme has announced her retirement, and rising memory component costs feed straight into gross margin. Research lead, not investment advice.", "zh": "Sonos 做的是高階無線家庭音響。針對它最強的空方論點一直是：這一輪獲利來自砍成本，下一輪硬體週期完全未經驗證。新資訊補上了一角——公司與 Škoda Auto 簽定合作，把音響帶進車用通路，這是一條不依賴自家新產品週期的成長來源。財務面，會計年度第三季營收 3.7526 億美元、淨利 2,985 萬美元（去年同期為虧損），毛利率 46.57%；3 至 6 月實際買回 199 萬股、金額 3,014 萬美元，屬於「有執行」而不只是「有授權」的那一類。空方仍然成立：本益比 30.5 倍在同業裡偏高，主導成本削減的財務長已宣布退休，而記憶體零組件成本上升會直接壓到毛利率。研究線索，非投資建議。", "url": "https://simplywall.st/stocks/us/consumer-durables/nasdaq-sono/sonos/news/discover-august-2026s-undervalued-small-caps-with-insider-bu/amp", "status": "RADAR · 下一個驗證點：下一季財報的毛利率，以及車用合作對營收的實際貢獻"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "QNST新名字", "color": "#C9A227", "stocks": [{"t": "QNST", "n": "QuinStreet，當季營收 3.739 億美元年增 42.7%、超預期 4%；調整後每股盈餘 0.50 美元超預期 13.2%；營業利益率從 1.5% 拉到 5.1%"}], "en": "New name. QuinStreet, founded in 1999, runs digital performance marketplaces that route high-intent consumers to financial and home-services clients. Why ignored: lead generation reads to the market as a low-quality cyclical, the market cap is only $888.7 million, and coverage is thin. What is changing: the quarter reported on 08/06 showed revenue of $373.9 million, up 42.7% and 4% above the $359.3 million consensus; adjusted EPS of $0.50 beat by 13.2%; adjusted EBITDA of $41.36 million; and operating margin widened to 5.1% from 1.5% a year ago. Next-quarter guidance of $375 million in revenue and $39 million in EBITDA came in 4.5% above the revenue consensus and well above the $32.56 million EBITDA estimate. The stock rose 28% to $19.47. Risks: the street models only 12% revenue growth over the next twelve months, a sharp deceleration from the last two years; auto insurance advertising budgets are highly cyclical; and after a 28% single-day move a large part of the mispricing has already been removed. Research lead, not investment advice.", "zh": "新名字。QuinStreet 成立於 1999 年，經營的是數位成效行銷平台，把有明確購買意圖的消費者導給金融與居家服務業者。為什麼被忽視：導客生意在市場眼中是低品質的景氣循環股，市值僅 8.89 億美元、覆蓋薄。什麼正在改變：8/6 公布的當季營收 3.739 億美元、年增 42.7%，超出市場預估的 3.593 億達 4%；調整後每股盈餘 0.50 美元超預期 13.2%；調整後 EBITDA 4,136 萬美元；營業利益率從去年同期的 1.5% 拉到 5.1%。下一季指引營收 3.75 億、EBITDA 3,900 萬美元，分別高於市場預估 4.5% 與遠高於 3,256 萬。股價單日漲 28% 至 19.47 美元。風險：市場預估未來十二個月營收成長只有 12%，比近兩年大幅減速；車險廣告預算是高度景氣循環的東西；而單日漲三成之後，錯價已經被修掉一大截。研究線索，非投資建議。", "url": "https://markets.financialcontent.com/stocks/article/stockstory-2026-8-6-quinstreet-nasdaqqnst-reports-bullish-q2-cy2026-stock-jumps-28", "status": "RADAR · 下一個驗證點：下一季能否守住 3.75 億營收指引，以及車險以外的居家服務占比"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "DLHC新名字", "color": "#C9A227", "stocks": [{"t": "DLHC", "n": "DLH Holdings，會計年度第三季營收 4,420 萬美元、每股虧損 1.16 美元；調整後 EBITDA 340 萬、利潤率 7.7%，自由現金流 420 萬"}], "en": "New name, and a deliberately awkward one. DLH Holdings provides health services and IT outsourcing to the US federal government, mainly veterans' and health agencies. Why ignored: it is a micro cap trading near its 52-week low of $4.74, at about $4.88, with almost no sell-side coverage. What is changing: fiscal Q3 revenue of $44.2 million and a loss of $1.16 per share were far worse than the $53 million and $0.11 loss expected — but the ugliness has a specific source. The company completed its exit from the low-margin legacy VA CMOP contract and booked restructuring costs against it. Underneath that, adjusted EBITDA was $3.4 million at a 7.7% margin with $4.2 million of free cash flow. Meanwhile 10% holder and director Mink Brook Asset Management kept buying through July, adding 79 shares on 07/23 and 391 on 07/24 at $5.0975 to $5.0997, after an earlier $51,083 purchase. Risks: this is a company whose revenue is shrinking, and the entire bull case rests on the smaller remainder carrying better margins — which has exactly one quarter of evidence. Federal budget and contract renewal risk is the whole business, and micro-cap liquidity is poor. Research lead, not investment advice.", "zh": "新名字，而且是一檔刻意不好看的。DLH Holdings 替美國聯邦政府提供健康服務與資訊技術外包，客戶以退伍軍人與衛生單位為主。為什麼被忽視：微型股，股價在 4.88 美元附近貼著 52 週低點 4.74，賣方幾乎沒有覆蓋。什麼正在改變：會計年度第三季營收 4,420 萬美元、每股虧損 1.16 美元，遠差於市場預期的 5,300 萬與虧損 0.11 美元——但這一季的難看有具體來源：公司完成了退出 VA CMOP 這個低毛利舊合約的轉型，並認列了相應的重組費用。剝掉那些之後，調整後 EBITDA 為 340 萬美元、利潤率 7.7%，自由現金流 420 萬美元。同時，10% 股東兼董事 Mink Brook Asset Management 在 7 月持續買進，7/23 買 79 股、7/24 買 391 股，價格 5.0975 至 5.0997 美元，更早一筆為 51,083 美元。風險：這是一家營收正在縮小的公司，多方論點完全建立在「縮小之後的那一塊毛利更好」，而這只有一季的證據；聯邦預算與合約續約風險就是它的全部生意；微型股的流動性極差。研究線索，非投資建議。", "url": "https://www.investing.com/news/insider-trading-news/dlh-holdings-director-mink-brook-asset-management-buys-2396-stock-93CH-4829389", "status": "RADAR · 下一個驗證點：下一季營收能否止跌，以及調整後 EBITDA 利潤率能否守住 7.7%"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "BANR新名字", "color": "#C9A227", "stocks": [{"t": "BANR", "n": "Banner Corporation，Q2 淨利 4,890 萬美元、稀釋後每股 1.43 美元，優於去年同期的 4,550 萬與 1.31；8/3 授權買回最多 170 萬股約當流通股 5%"}], "en": "New name. Banner Corporation is a $16.59 billion bank holding company running a commercial bank across four western states. Why ignored: when the whole regional-bank group is being traded as a single rate bet, nobody looks at the differences between individual banks. What is changing: two things at once. Earnings are improving — Q2 net income of $48.9 million and diluted EPS of $1.43 beat the $45.5 million and $1.31 of a year ago, revenue of $172 million came in above consensus, and net interest income of $153.7 million reflected margin expansion plus growth in earning assets. And on 08/03 the board authorised the repurchase of up to 1.7 million shares, roughly 5% of shares outstanding, with management stating plainly that it sees the stock as an attractive value. Risks: $1.43 is actually below the prior quarter's $1.60; part of the earning-asset growth was funded by higher FHLB borrowings, which is not free; commercial real estate exposure and deposit-cost pressure are the shared problem of every regional bank; and an authorisation is permission, not a commitment. Research lead, not investment advice.", "zh": "新名字。Banner Corporation 是總資產 165.9 億美元、在美國西部四州經營商業銀行的銀行控股公司。為什麼被忽視：當整個區域銀行族群被當成單一的利率賭注在交易時，沒有人細看個別銀行之間的差異。什麼正在改變：兩件事同時發生。第一，獲利在改善——第二季淨利 4,890 萬美元、稀釋後每股 1.43 美元，高於去年同期的 4,550 萬與 1.31 美元；營收 1.72 億超出市場預估；淨利息收入 1.537 億，來自淨息差擴大與生息資產成長。第二，8/3 董事會授權買回最多 170 萬股，約當流通股的 5%，管理層直說目前股價是有吸引力的價值。風險：每股 1.43 美元其實低於前一季的 1.60；生息資產的成長有一部分靠拉高 FHLB 借款支撐，這是有成本的；商用不動產曝險與存款成本壓力是所有區域銀行的共同題目；而庫藏股是授權、不是承諾。研究線索，非投資建議。", "url": "https://www.stocktitan.net/news/BANR/banner-corporation-announces-stock-repurchase-hursg63ojv1x.html", "status": "RADAR · 下一個驗證點：Q3 淨息差能否續擴，以及 170 萬股庫藏股的實際執行進度"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "小額但不斷", "color": "#6DB56D", "stocks": [{"t": "DLHC", "n": "DLH Holdings，10% 股東兼董事 Mink Brook 於 7/23 買 79 股、7/24 買 391 股，合計不到 2,400 美元；更早一筆 51,083 美元"}], "en": "Insider buying is not only about size; the pattern carries information too. Mink Brook Asset Management, a 10% holder and director of DLH Holdings, bought 79 shares on July 23 and 391 on July 24 — under $2,400 combined, after an earlier $51,083 purchase. The amounts are too small to look like a signal, and that is exactly the point: the meaning lives in the repetition. The same buyer keeps stepping in, with its own money, while the stock sits against a 52-week low. Small-and-constant and one-large-block say different things. The first is a statement about patience; the second is a statement about timing.", "zh": "內部人買進不是只看金額，型態本身也帶著資訊。DLH Holdings 的 10% 股東兼董事 Mink Brook Asset Management 在 7 月 23 日買 79 股、24 日買 391 股，兩筆合起來不到 2,400 美元，更早一筆則是 51,083 美元。金額小到不像訊號，而這正是重點：它的意義在連續性——同一個買方拿自己的錢，在股價貼著 52 週低點的時候反覆進場。「小額但不斷」跟「一次大額」講的是兩件不同的事：前者說的是耐心，後者說的是時點判斷。", "url": "https://www.stocktitan.net/sec-filings/DLHC/form-4-dlh-holdings-corp-insider-trading-activity-ec60c3a68779.html"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "能源買盤", "color": "#6DB56D", "stocks": [{"t": "UUUU", "n": "Energy Fuels，總裁兼執行長 Ross Bhappu 於 7/9 買進 74,000 股、96.79 萬美元；董事 Bruce Hansen 同日買 4,000 股、5.076 萬美元"}, {"t": "LBRT", "n": "Liberty Energy，董事 Arjun Murti 於 7/28 買進 14,053 股、25 萬美元"}], "en": "The size of July's insider buying in energy is worth writing down. At Energy Fuels, president and CEO Ross Bhappu bought 74,000 shares for $967,920 on 07/09 and director Bruce Hansen bought 4,000 shares for $50,760 the same day. At Liberty Energy, director Arjun Murti bought 14,053 shares for $250,008 on 07/28. The shared backdrop is crude swinging violently on geopolitical headlines. The caution to hold onto: what these people know intimately is their own operations, not the oil futures curve. Their purchases say this price looks cheap for this company — not oil is going up.", "zh": "能源業內部人在 7 月出手的規模值得記下來。Energy Fuels 的總裁兼執行長 Ross Bhappu 於 7/9 買進 74,000 股、金額 96.79 萬美元，董事 Bruce Hansen 同日買 4,000 股、5.076 萬美元；Liberty Energy 的董事 Arjun Murti 則在 7/28 買進 14,053 股、25 萬美元。這三筆的共同背景是油價在地緣新聞裡上下劇烈擺盪。要留著的一句提醒是：這些人熟悉的是自家營運，不是原油期貨曲線。他們的買進反映的是「這個價格對這家公司便宜」，不是「油價要漲」。", "url": "https://www.investing.com/news/stock-market-news/top-insider-buys-and-sells-disclosed-on-friday-93CH-4831286"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "授權潮", "color": "#6DB56D", "stocks": [{"t": "HUBS", "n": "HubSpot，8/3 授權最多 10 億美元、期限 24 個月；同一週股價單日跌 24%"}, {"t": "MQ", "n": "Marqeta，8/3 在前一個計畫執行完畢、零額度剩餘後再授權 1.5 億美元"}], "en": "The density of buyback authorisations this week was unusual. HubSpot's board approved up to $1.0 billion over as long as 24 months on 08/03. Marqeta authorised another $150 million the same day, having completed its previous programme. Banner Corporation also authorised 1.7 million shares on 08/03. Three boards doing the same thing on the same day usually reflects a shared read on valuation rather than coincidence. The filter does not change though: an authorisation is permission, not a promise. Marqeta's comes with the credential of a prior programme finished with zero remaining capacity; HubSpot's will only really be tested now that the stock has fallen 24% in a session. The 08/14 13F deadline fills in the other half of the picture — where institutions actually stood in Q2.", "zh": "這一週的庫藏股授權密度異常高：HubSpot 於 8/3 授權最多 10 億美元、期限長達 24 個月；Marqeta 同日在前一個計畫執行完畢之後再授權 1.5 億美元；Banner Corporation 也在 8/3 授權買回 170 萬股。同一天三家董事會做同一件事，通常代表的是對估值的共同判斷，而不是巧合。但過濾方式不變：授權是許可、不是承諾。Marqeta 的授權有前一個計畫「零額度剩餘」的紀錄背書；HubSpot 的則要等到現在——股價單日跌 24% 之後——才會真正被檢驗。8/14 的 13F 截止日會補上另一半資訊：機構在第二季到底站在哪一邊。", "url": "https://www.sec.gov/Archives/edgar/data/0001404655/000119312526335148/hubs-20260803.htm"},
    {"id": "week_0", "channel": "本週事件", "tag": "今晚非農", "color": "#C97DD4", "stocks": [{"t": "SPY", "n": "標普500 ETF，非農與 CPI 是 9/16 FOMC 前的兩個關鍵輸入"}, {"t": "TLT", "n": "長端公債，對這兩份數據的反應通常比股市更直接"}], "en": "Tonight at 8:30am ET the July employment report lands, with forecasts for 80,000 to 120,000 payrolls and unemployment holding at 4.2%. This week's build-up has been contradictory: ADP showed only 44,000 private jobs added, which is soft, while jobless claims of 199,000 and a two-year low in Challenger layoffs are firm. Then next Wednesday 08/12 brings July CPI and 08/13 brings PPI. Those releases feed directly into the September 16 FOMC, currently priced at 58% for a hike. With earnings season thinning out, the thing that moves prices has already changed hands.", "zh": "今晚美東時間 8:30 公布 7 月就業報告，市場預估非農新增落在 8 萬到 12 萬人之間、失業率持平 4.2%。本週的鋪陳是矛盾的：ADP 民間就業只增 4.4 萬，偏弱；但初領失業金 19.9 萬與 Challenger 裁員兩年最低，偏強。接著下週三 8/12 是 7 月 CPI、8/13 是 PPI。這幾份數據會直接餵進 9 月 16 日的 FOMC，而目前升息機率是 58%。在財報季進入尾聲之後，推動價格的東西已經換人了。", "url": "https://www.theepochtimes.com/us/layoffs-fall-unemployment-claims-flat-ahead-of-july-jobs-report-6072050"},
    {"id": "week_1", "channel": "本週事件", "tag": "三個日期", "color": "#C97DD4", "stocks": [{"t": "ALLT", "n": "Allot，8/12 美東時間上午 8:30 公布第二季財報，是雷達池裡下一個到期的驗證點"}, {"t": "SNDK", "n": "SanDisk，8/13 法人說明會，主題是 2027 會計年度供給、合約轉換與價格下限"}], "en": "Three dates matter directly to this feed. On 08/12 at 8:30am ET Allot reports its second quarter — the next verification point due in the radar pool, and the test of whether the profit growth that justified its $40 million buyback authorisation is real. On 08/13 SanDisk holds its investor day, where fiscal 2027 supply, contract conversion and price floors get laid out; that is the pricing reference for the whole memory complex. And on 08/14 the Q2 13F deadline arrives, which is when the full picture of institutional positioning finally becomes visible.", "zh": "有三個日期跟這份晨報直接相關。8/12 美東時間上午 8:30，Allot 公布第二季財報——這是雷達池裡下一個到期的驗證點，要檢驗的是支撐它 4,000 萬美元庫藏股授權的那個「獲利成長」是不是真的。8/13，SanDisk 舉行法人說明會，會把 2027 會計年度的供給量、合約轉換與價格下限講清楚，這是整個記憶體族群的定價依據。8/14 則是第二季 13F 申報截止日，機構部位的全貌要到那天才會齊。", "url": "https://www.stocktitan.net/news/ALLT/allot-to-release-second-quarter-2026-results-and-host-conference-3x32o6bwvgsu.html"},
    {"id": "eval_0", "channel": "今日評估", "tag": "今日一件事", "color": "#E8A838", "stocks": [{"t": "ADV", "n": "驗證失敗的那一檔：淨損翻倍、調整後 EBITDA 年減 12.2%"}, {"t": "CSR", "n": "論點被公司自己換掉的那一檔：出售 20 個社區約 5.3 億美元、退出兩個城市"}], "en": "The most useful thing yesterday was not the Dow's 464-point drop. It was two radar names leaving their original scripts in two completely different ways. Advantage Solutions is the simple case: insiders bought 18 times, and the quarter came back with the net loss doubled and adjusted EBITDA down 12.2%. The signal did not convert, and you know what to do with that. Centerspace is the harder case. It did not fail — it became a different company. The reason it went on the list was a strategic review that might end in a takeover; the reality now is a business selling $530 million of assets and walking out of two cities. Question to sit with: when a company itself replaces the bull case you bought, do you re-underwrite it, or do you admit that the thing you originally bought no longer exists?", "zh": "昨天最有用的一件事不是道瓊跌 464 點，而是雷達池裡兩檔股票用完全不同的方式離開了原本的劇本。Advantage Solutions 是簡單的那一種：內部人買了 18 次，結果這一季交回來的是淨損翻倍、調整後 EBITDA 年減 12.2%。訊號沒有兌現，這種情況你知道要怎麼辦。Centerspace 是麻煩的那一種：它沒有失敗，它變成了另一家公司——當初上名單的理由是「策略檢討可能以被併購收場」，現在的現實是一家正在賣掉 5.3 億美元資產、退出兩個城市的公司。留一個問題給你：當一家公司自己把你當初買的那個多方論點換掉，你應該重新評估它，還是應該承認你當初買的那個東西已經不存在了？", "url": "https://www.stocktitan.net/sec-filings/CSR/8-k-centerspace-reports-material-event-d3ea33cb6b2f.html", "status": "今日討論 · 按下方討論鍵跟 Claude 繼續聊"},

function getDateString() {

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function HeatmapView() {

      const dark = document.body.getAttribute("data-theme") === "dark";

      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/07/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v6.8</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
