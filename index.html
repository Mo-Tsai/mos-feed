// ===== AZURE TTS =====
let _azToken = null, _azTokenExp = 0, _azAbort = null;
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
function azureStop() { if (_azAbort) { _azAbort.abort(); _azAbort = null; } }
async function azureSpeak(text, { rate='0%', onStart, onEnd, onError }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const voice = localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural';
  if (!key) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const token = await _getAzToken(key, region, ctrl.signal);
    const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'><voice name='${voice}'><prosody rate='${rate}'>${_xmlEsc(text)}</prosody></voice></speak>`;
    const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method:'POST', signal:ctrl.signal,
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
      body:ssml
    });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (ctrl.signal.aborted) return true;
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    if (onError) onError(e);
    return false;
  }
}

    { "id": "overnight_0", "channel": "隔夜盤勢", "tag": "指數總覽", "color": "#E05C5C", "stocks": [ { "t": "DIA", "n": "道瓊ETF，昨收大漲1.03%領軍" }, { "t": "SPY", "n": "S&P 500再創收盤新高" }, { "t": "QQQ", "n": "那指走弱，科技類股承壓" } ], "en": "Tuesday split the tape. The Dow surged 537 points (+1.03%) to 52,747 and the S&P 500 eked out a record close at 7,428.78 (+0.21%), but the Nasdaq slipped 0.22% to 24,876.91 as money bled out of chips into industrials, financials and defensives. Eight of eleven S&P sectors closed green, led by energy. The rotation, not the index level, is the story.", "zh": "週二盤面分裂。道瓊大漲537點(+1.03%)收52,747，S&P 500以7,428.78再創收盤新高(+0.21%)，但那指下跌0.22%收24,876.91——資金正從半導體流出，轉進工業、金融與防禦類股。S&P 11大類股有8個收紅，能源領漲。重點不是指數高低，而是這場輪動。", "ja": "火曜日は明暗が分かれた。ダウは537ポイント高(+1.03%)の52,747、S&P500は7,428.78で終値の最高値を更新(+0.21%)したが、ナスダックは0.22%安の24,876.91。資金は半導体から資本財・金融・ディフェンシブへ流出した。指数水準ではなくこのローテーションが本質だ。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-july-28-2026" },

    { "id": "overnight_2", "channel": "隔夜盤勢", "tag": "風險事件", "color": "#E05C5C", "stocks": [ { "t": "SMH", "n": "半導體ETF受亞股拖累" }, { "t": "NVDA", "n": "輝達受DeepSeek自研晶片消息壓" }, { "t": "TSM", "n": "台積電資本支出憂慮發酵" } ], "en": "The chip pain started overseas. South Korea's Kospi slumped 10.8% as SK Hynix fell 14.7% and Samsung 13.4% on a retail-leverage unwind. Adding fuel: reports that China's DeepSeek is building its own AI chip to cut reliance on Nvidia. A global AI-valuation gut-check is rippling through the supply chain.", "zh": "晶片痛楚從海外開始。南韓Kospi暴跌10.8%，SK海力士跌14.7%、三星跌13.4%，散戶槓桿解除觸發。火上加油的是：傳中國DeepSeek正自研AI晶片以降低對輝達依賴。一場全球AI估值的體檢正沿供應鏈擴散。", "ja": "半導体の痛みは海外から始まった。韓国Kospiは10.8%急落、SKハイニックスは14.7%安、サムスンは13.4%安と個人の信用取引解消が引き金に。さらに中国DeepSeekがエヌビディア依存を減らすため独自AIチップを開発中との報道。世界的なAIバリュエーション点検がサプライチェーンに波及している。", "url": "https://www.cnbc.com/amp/2026/07/28/sk-hynix-plunges-semiconductor-selloff-deepens-samsung-softbank.html" },

    { "id": "earn_1", "channel": "財報速報", "tag": "財報Miss", "color": "#E8786A", "stocks": [ { "t": "GLW", "n": "康寧財測僅符合預期崩16%" } ], "en": "The market is punishing misses harder than usual. Corning tumbled 16% after Q3 guidance merely matched rather than beat, with signs of a near-term slowdown in carrier capex. Data shows stocks missing both lines now fall ~4.7 points on average — nearly double the historical 2.5. In a priced-for-perfection tape, in-line is the new miss.", "zh": "市場對財報miss的懲罰比以往更狠。康寧因Q3財測只是符合、而非超標，加上電信商資本支出短期放緩跡象，重挫16%。數據顯示，營收獲利雙miss的股票如今平均下跌約4.7個百分點——幾乎是歷史2.5的兩倍。在完美定價的盤面裡，符合預期就是新的miss。", "ja": "市場は決算未達をいつもより厳しく罰している。コーニングはQ3ガイダンスが超過ではなく一致にとどまり、通信キャリアの設備投資減速の兆候もあって16%急落。データでは売上・利益ともに未達の銘柄は今や平均約4.7ポイント下落——歴史的な2.5のほぼ倍。完璧を織り込んだ相場では一致は新たな未達だ。", "url": "https://www.itiger.com/news/2555010757" },
    { "id": "macro_0", "channel": "總經政策", "tag": "Fed動態", "color": "#7C6AF7", "stocks": [ { "t": "TLT", "n": "長債受利率決策牽動" }, { "t": "SPY", "n": "大盤等待Fed記者會定調" } ], "en": "The Fed decision lands Wednesday at 2pm ET. FactSet-polled economists expect a hold at 3.50–3.75%, which would be the fifth straight pause. But the CME FedWatch tool assigns roughly a 25% chance to a 25bp HIKE — an unusual tail risk that reflects how far the inflation narrative has shifted. The presser, not the decision, is the event.", "zh": "Fed決策週三美東下午2點揭曉。FactSet調查的經濟學家預期維持3.50–3.75%，將是連續第五次暫停。但CME FedWatch工具給予升息1碼約25%機率——這是罕見的尾端風險，反映通膨敘事已大幅位移。真正的看點是記者會，而非決策本身。", "ja": "FRBの決定は水曜午後2時(米東部)に出る。FactSet調査のエコノミストは3.50〜3.75%の据え置きを予想し、5回連続の休止となる。だがCME FedWatchは25bp利上げに約25%の確率を割り当てる——インフレ物語がどれだけ動いたかを映す異例のテールリスクだ。本番は決定ではなく記者会見だ。", "url": "https://www.cbsnews.com/news/fed-interest-rate-decision-july-meeting/" },
    { "id": "macro_1", "channel": "總經政策", "tag": "通膨數據", "color": "#7C6AF7", "stocks": [ { "t": "TIP", "n": "抗通膨債反映通膨預期升溫" }, { "t": "GLD", "n": "黃金隨實質利率與避險波動" } ], "en": "Fed Governor Waller says the risks have 'completely flipped' — inflation, not labor weakness, is now the primary policy concern. Core PCE prints alongside the decision this week. If energy-driven inflation reignites amid geopolitical tension, some forecasters now expect higher rates before year-end rather than cuts. The dovish base case is quietly eroding.", "zh": "Fed理事Waller表示風險已「完全翻轉」——如今主要政策顧慮是通膨，而非勞動市場疲軟。核心PCE本週與決策同步公布。若地緣緊張下能源驅動的通膨再起，部分預測者現在預期年底前是升息、而非降息。鴿派基準情境正悄悄鬆動。", "ja": "FRBのウォラー理事はリスクが『完全に反転した』と述べる——今や主な政策懸念は労働市場の弱さではなくインフレだ。コアPCEは今週決定と同時に発表される。地政学的緊張下でエネルギー主導のインフレが再燃すれば、一部の予測者は年末までに利下げではなく利上げを見込む。ハト派のベースケースが静かに崩れつつある。", "url": "https://intellectia.ai/blog/fed-interest-rate-decision-july-2026-analysis" },
    { "id": "sector_0", "channel": "產業風向", "tag": "晶片退潮", "color": "#4EABA4", "stocks": [ { "t": "SMH", "n": "半導體ETF本月重挫約13%" }, { "t": "TSM", "n": "台積電資本支出成導火線" }, { "t": "SOXX", "n": "晶片指數ETF回吐上半年漲幅" } ], "en": "The semiconductor rout has real scale. The MSCI World Semiconductor Index has dropped roughly 13% in July, and global chip stocks have shed $3.3 trillion since June. The trigger: TSMC's earnings call flagged unexpectedly massive capex, sparking margin fears across the supply chain. This is profit-taking after an 80% first-half surge — the question is whether it stops there.", "zh": "晶片大跌有真實規模。MSCI世界半導體指數本月下跌約13%，全球晶片股自6月以來蒸發3.3兆美元。導火線：台積電法說會隱約透露巨額資本支出，引發供應鏈毛利率憂慮。這是80%上半年漲幅後的獲利了結——問題是會不會到此為止。", "ja": "半導体の下落には実体がある。MSCI世界半導体指数は7月に約13%下落し、世界のチップ株は6月以降3.3兆ドルを消した。引き金はTSMCの決算説明会で予想外の巨額設備投資が示され、マージン懸念がサプライチェーンに広がったこと。上半期80%上昇後の利食いだが、問題はそこで止まるかだ。", "url": "https://wallstreettimes.com/semiconductor-stocks-pullback-july-2026-profit-taking/" },
    { "id": "sector_1", "channel": "產業風向", "tag": "類股輪動", "color": "#4EABA4", "stocks": [ { "t": "XLF", "n": "金融類股承接輪動資金" }, { "t": "XLI", "n": "工業類股受青睞" }, { "t": "XLE", "n": "能源領漲當日類股" }, { "t": "AAPL", "n": "蘋果創高奪回最高市值" } ], "en": "The flip side of the chip pain is a genuine broadening. As semis sold, money rotated into industrials, financials, energy and defensives — and Apple hit an all-time high to reclaim the most-valuable-company crown. This looks structural, not a one-day reflex: institutions trimming stretched tech to fund undervalued value and small-caps. Breadth is finally the market's friend.", "zh": "晶片痛楚的另一面，是真正的市場擴大。半導體被拋售同時，資金轉進工業、金融、能源與防禦類股——蘋果創歷史新高，重新奪回最高市值寶座。這看起來是結構性而非單日反彈：機構正削減過度拉高的科技股，轉而推升低估的價值與小型股。市場廣度終於站到多方這邊。", "ja": "半導体の痛みの裏返しは真の市場の拡がりだ。半導体が売られる一方で資金は資本財・金融・エネルギー・ディフェンシブへ回転し、アップルは史上最高値で最高時価総額の座を取り戻した。これは一日の反射ではなく構造的に見える。幅の広がりがやっと市場の味方になった。", "url": "https://markets.financialcontent.com/stocks/article/marketminute-2026-1-8-the-great-rotation-semiconductor-giants-retreat-as-investors-pivot-to-defense-and-financials" },
    { "id": "small_0", "channel": "小型股風雲", "tag": "小型股", "color": "#5B8ED6", "stocks": [ { "t": "IWM", "n": "羅素2000 ETF近2,980點" }, { "t": "VTWO", "n": "小型股ETF年初至今跑贏大盤" } ], "en": "The small-cap comeback is real. The Russell 2000 has surged nearly 22% in the first half — its best H1 since 1991 — and now sits near 2,980, outpacing the S&P 500 year-to-date. After years of being left for dead, the rotation into domestic small-caps is the cleanest expression of the broadening trade. The move has momentum behind it.", "zh": "小型股的回歸是真的。Russell 2000上半年飆漲近22%——自1991年以來最強的上半年——現在接近2,980點，年初至今跑贏S&P 500。在被拋棄多年後，轉進本土小型股是市場擴大交易最清晰的表達。這波行情背後有動能。", "ja": "小型株の復活は本物だ。Russell 2000は上半期に約22%急騰——1991年以来最強の上半期——今は2,980付近で、年初来S&P500を上回る。長年見捨てられていた後の国内小型株へのローテーションは、幅の広がる取引の最も明確な表現だ。この動きには勢いがある。", "url": "https://www.ibtimes.com.au/russell-2000-index-small-cap-rally-2026-1872366" },
    { "id": "small_1", "channel": "小型股風雲", "tag": "催化事件", "color": "#5B8ED6", "stocks": [ { "t": "IWM", "n": "受Fed政策與浮動利率題材推動" }, { "t": "IJR", "n": "S&P小型股指數Q1獲利飆升" } ], "en": "What's driving small-caps is fundamental, not just sentiment. This week's Fed meeting is a near-term catalyst: small-caps carry more floating-rate debt, so any dovish signal is outsized relief. Beneath that, Russell 2000 Q1 earnings growth consensus hit 44.9% year-over-year, with tech hardware, health care, industrials and financials all contributing. Rate relief plus earnings is a durable combination.", "zh": "推動小型股的是基本面，不只是情緒。本週Fed會議是短期催化劑：小型股背負更多浮動利率債務，任何鴿派訊號都是超額紓困。更深層：Russell 2000的Q1獲利成長共識達年增44.9%，科技硬體、醫療保健、工業與金融均有貢獻。利率紓困加上獲利，是持久的組合。", "ja": "小型株を動かすのはセンチメントだけでなくファンダメンタルだ。今週のFRB会合は短期の触媒だ。小型株は変動金利債務を多く抱えるため、ハト派シグナルは格別の安堵となる。その下でRussell 2000のQ1利益成長コンセンサスは前年比44.9%に達し、テックハード・ヘルスケア・資本財・金融が寄与した。金利の緩和と利益は持続的な組み合わせだ。", "url": "https://247wallst.com/investing/etf/2026/07/20/the-russell-2000-is-outpacing-the-sp-500-in-2026-is-it-too-late-to-buy-small-cap-etfs/" },
    { "id": "small_2", "channel": "小型股風雲", "tag": "投資教育", "color": "#5B8ED6", "stocks": [ { "t": "IWM", "n": "以廣度擴散概念看小型股輪動" } ], "en": "A teaching note: when market gains broaden beyond a handful of mega-caps, that's usually a healthier tape, not a weaker one. Narrow leadership means the index is one stumble away from a drawdown; broad participation spreads the risk. The Russell's outperformance signals that AI tailwinds are reaching second-order beneficiaries — chip equipment, data-center connectivity — rather than just the obvious names. Watch breadth, not just the megacap headlines.", "zh": "一則教學筆記：當市場漲幅從少數巨頭股擴散開來，通常代表盤面更健康，而非更虛弱。領導狹窄意味著指數只要一個跌倒就可能回撤；廣泛參與則分散風險。Russell的超額表現，告訴我們AI順風正流向二級受益者——晶片設備、資料中心連接——而非只有那幾檔明牌。看廣度，不只看巨頭頭條。", "ja": "教育のノート:市場の上昇が一握りの巨大株を超えて広がる時、それは通常より健全な相場で、弱い相場ではない。狭いリーダーシップは指数が一つのつまずきで下落することを意味し、幅広い参加はリスクを分散する。Russellの優位はAIの追い風が二次的な受益者——チップ製造装置、データセンター接続——に及んでいることを示す。幅を見よ、巨大株の見出しだけを見るな。", "url": "https://tickeron.com/trading-investing-101/the-small-cap-seasonality-forecast-why-may-june-and-july-2026-may-be-the-most-powerful-window-for-stocks-in-generation/" },
    { "id": "radar_0", "channel": "忽視雷達", "tag": "深層價值", "color": "#C9A227", "stocks": [ { "t": "ERII", "n": "淡化利基設備，董事買進持股+25%" } ], "status": "RADAR · 下一個驗證點 Q2財報", "en": "Energy Recovery (ERII) makes PX Pressure Exchanger devices that recover energy in desalination plants — a niche, unglamorous business Wall Street mostly ignores. The signal: Director Colin Sabol bought 11,180 shares at $8.88 (~$99K), lifting his stake 25%, and the company just won a new desalination supply deal. Shares sit at $8.62 vs an $11 average target. The risk: insiders have net-sold over 12 months, so this is one buyer against the tide. This is a research lead, not a buy recommendation.", "zh": "Energy Recovery(ERII)生產PX壓力交換器，在海水淡化廠回收能量——這是華爾街大多忽視的利基、不華麗的生意。訊號：董事Colin Sabol以$8.88買進11,180股(約$99K)，持股提升25%，公司剛拿下新的淡化供應案。股價$8.62，對比平均目標$11。風險：過去12個月內部人淨賣，這是單一買盤逆勢而行。這不是買進建議，是研究線索。", "ja": "Energy Recovery(ERII)は海水淡水化プラントでエネルギーを回収するPX圧力交換器を作る——ウォール街がほぼ無視する地味なニッチ事業だ。シグナル:コリン・サボル取締役が$8.88で11,180株(約$99K)を購入し保有を25%引き上げ、新規の淡水化供給契約も獲得。株価は$8.62で平均目標$11に対し安い。リスク:直近12カ月ではインサイダーはネットで売り越しだ。これは買い推奨ではなく調査の手がかりだ。", "url": "https://simplywall.st/stocks/us/capital-goods/nasdaq-erii/energy-recovery/news/top-undervalued-small-caps-with-insider-buying-in-july-2026" },
    { "id": "radar_1", "channel": "忽視雷達", "tag": "內部人買", "color": "#C9A227", "stocks": [ { "t": "CSR", "n": "公寓REIT，內部人跨損加碼2萬股" } ], "status": "RADAR · 下一個驗證點 Q2 FFO", "en": "Centerspace (CSR) is a ~$1B multifamily apartment REIT flying under the radar. The signal cuts against the numbers: insider Bart Reichert bought 20,000 shares for ~$99,200 even as the company posted a Q1 net loss of $4.8M. When an insider adds size into red ink, it's worth asking what they see that the tape doesn't. The risk: REIT earnings are rate-sensitive and the loss is real. This is a research lead, not a buy recommendation.", "zh": "Centerspace(CSR)是市值約十億美元的多家庭公寓REIT，低調飛在雷達下。訊號與數字對幹：內部人Bart Reichert以約$99,200買進20,000股，即使公司Q1實現480萬美元淨損。當內部人在赤字中加碼，值得問：他看到了盤面沒看到的什麼？風險：REIT獲利對利率敏感，且虧損是真的。這不是買進建議，是研究線索。", "ja": "Centerspace(CSR)は時価総額約10億ドルの集合住宅REITで、レーダーの下を飛ぶ。シグナルは数字に逆らう:インサイダーのBart Reichertが会社のQ1の480万ドルの純損失にもかかわらず約$99,200で20,000株を購入した。相場に見えない何を彼らが見ているのか問う価値がある。リスク:REITの利益は金利敏感で損失は実在する。これは買い推奨ではなく調査の手がかりだ。", "url": "https://simplywall.st/stocks/us/real-estate/nyse-csr/centerspace/news/undervalued-small-caps-with-insider-buying-in-july-2026" },
    { "id": "radar_2", "channel": "忽視雷達", "tag": "轉機訊號", "color": "#C9A227", "stocks": [ { "t": "MSBI", "n": "轉機區域銀行，Q2 EPS超標並回購" } ], "status": "RADAR · 下一個驗證點 淨核銷趨勢", "en": "Midland States Bancorp (MSBI) is a small regional bank mid-turnaround. The signal stack is unusually clean: Q2 EPS of $0.82 beat the $0.78 estimate, Q1 net income swung to $18.46M from a loss a year ago, net charge-offs fell, and the board authorized a $45M buyback (with $7.85M already repurchased). Consensus forecasts 42% annual earnings growth. The risk: regional-bank credit quality can turn fast, and a GF Score of 56 flags mediocrity. This is a research lead, not a buy recommendation.", "zh": "Midland States Bancorp(MSBI)是一家轉機中的小型區域銀行。訊號疊加異常乾淨：Q2每股盈餘$0.82超過$0.78預估，Q1淨利從去年虧損轉為1,846萬美元，淨核銷下降，董事會授權4,500萬美元回購(已回購785萬)。共識預測年增42%獲利。風險：區域銀行信用品質可能快速惡化，GF Score僅56分屬平庸。這不是買進建議，是研究線索。", "ja": "Midland States Bancorp(MSBI)は転換期の小型地方銀行だ。シグナルの重なりが異例に明確:Q2のEPS $0.82は$0.78予想を上回り、Q1純利益は前年の損失から1,846万ドルに転換、純償却額は減少、取締役会は4,500万ドルの自社株買いを承認(既に785万ドル購入済)。コンセンサスは年率42%の利益成長を予想。リスク:地方銀行の信用の質は速く悪化しうる。これは買い推奨ではなく調査の手がかりだ。", "url": "https://www.gurufocus.com/news/8975791/is-midland-states-bancorp-inc-msbi-overvalued-after-q2-earnings-beat-eps-082-vs-estimate-078-gf-score-56100" },
    { "id": "radar_3", "channel": "忽視雷達", "tag": "群買訊號", "color": "#C9A227", "stocks": [ { "t": "SHBI", "n": "Shore Bancshares，Q1淨利成長+內部人買" }, { "t": "ISTR", "n": "Investar Holding，同批低估+內部人買篩選" } ], "status": "RADAR · 下一個驗證點 下季財報", "en": "A cluster of small-cap banks is showing insider conviction that screens ignore. Shore Bancshares (SHBI) saw Q1 net income rise to $17.09M from $13.76M a year ago, with insider purchases logged April–June, and Investar Holding (ISTR) surfaced on the same undervalued-with-insider-buying screens. Roughly 59–64 US small-caps met the low-coverage + insider-buying + improving-financials filter this month. The risk: regional-bank exposure is correlated, so cluster signals can also cluster in downturns. This is a research lead, not a buy recommendation.", "zh": "一群小型銀行正展現篩選器忽略的內部人信念。Shore Bancshares(SHBI)Q1淨利從去年1,376萬升至1,709萬美元，4至6月間有內部人買進；Investar Holding(ISTR)也出現在同一批「低估加內部人買進」篩選中。本月約59至64檔美國小型股符合「低覆蓋+內部人買進+財務改善」篩條件。風險：區域銀行曝險高度連動，群買訊號在下行時也可能扎堆出現。這不是買進建議，是研究線索。", "ja": "小型銀行の一団が、スクリーナーが見逃すインサイダーの確信を示している。Shore Bancshares(SHBI)はQ1純利益が前年の1,376万から1,709万ドルに増加し4〜6月にインサイダー購入あり、Investar Holding(ISTR)も同じ割安・インサイダー買いのスクリーンに登場した。今月約59〜64の米小型株が該当。リスク:地方銀行のエクスポージャーは相関するため、クラスターシグナルは下落局面でも集中しうる。これは買い推奨ではなく調査の手がかりだ。", "url": "https://www.sahmcapital.com/news/content/undervalued-small-caps-with-insider-activity-to-explore-in-july-2026-2026-07-08" },
    { "id": "insider_0", "channel": "內部人動向", "tag": "回購訊號", "color": "#6DB56D", "stocks": [ { "t": "MSBI", "n": "授權4,500萬回購，已買回785萬" }, { "t": "SHBI", "n": "4-6月直接內部人買進" } ], "en": "Buybacks and insider purchases are clustering in small-cap financials. Midland States Bancorp authorized a $45M repurchase and has already bought back $7.85M, while Shore Bancshares logged direct insider purchases April–June. Cluster buying — multiple insiders or repeated purchases at one company — historically carries more signal than a single lone buy, because it's harder to fake conviction across several people. Financials leading the cluster fits the rotation narrative.", "zh": "回購與內部人買進正在小型金融股扎堆。Midland States Bancorp授權4,500萬美元回購，已回購785萬；Shore Bancshares在4至6月登錄直接內部人買進。群買——同一公司多位內部人或重複買進——歷史上比單一買盤帶更多訊號，因為跨多人偽裝信念更難。金融股帶頭群買，符合輪動敘事。", "ja": "自社株買いとインサイダー購入が小型金融株に集中している。Midland States Bancorpは4,500万ドルの自社株買いを承認し既に785万ドルを買い戻し、Shore Bancsharesは4〜6月に直接のインサイダー購入を記録した。クラスター買いは複数の人間で確信を偽るのが難しいため、単一の買いより歴史的にシグナルが強い。金融株がクラスターを牽引するのはローテーションの物語に合致する。", "url": "https://www.defenseworld.net/2026/07/25/midland-states-bancorp-nasdaqmsbi-hits-new-1-year-high-on-strong-earnings.html" },

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  const speakWord = React.useCallback(async (word) => {
    const ok = await azureSpeak(word, { rate:'-15%' });
    if (!ok) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US"; u.rate = 0.82;
      const voices = speechSynthesis.getVoices();
      const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
      if (picked) u.voice = picked;
      speechSynthesis.speak(u);
    }
  }, []);

  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      return;
    }
    setSpeaking(true);
    const ok = await azureSpeak(card.en, {
      rate: '-5%',
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
    if (!ok) {
      const u = new SpeechSynthesisUtterance(card.en);
      u.lang = "en-US"; u.rate = 0.88; u.pitch = 1.0; u.volume = 1.0;
      const tryVoices = () => {
        const voices = speechSynthesis.getVoices();
        const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
        if (picked) u.voice = picked;
      };
      if (speechSynthesis.getVoices().length > 0) tryVoices();
      else { speechSynthesis.onvoiceschanged = () => { tryVoices(); speechSynthesis.onvoiceschanged = null; }; }
      u.onend = () => setSpeaking(false);
      u.onerror = () => setSpeaking(false);
      speechSynthesis.speak(u);
    }
  }, [card.en, speaking]);

  // Stop speaking & close popup when card changes
  React.useEffect(() => {
    return () => {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀全文"} style={{ marginLeft:"auto" }}>{speaking ? "■" : "🔊"}</button>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          {lang === "ja"
            ? <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"15px", lineHeight:1.9, color:"var(--text-secondary)", margin:0, maxWidth:"46ch", fontWeight:300 }}>{card.ja || card.en}</p>
            : <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>}
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("ja"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="ja" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="ja" ? "close ↑" : "日本語 ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function SettingsPanel({ open, onClose }) {
  const [key, setKey] = React.useState(() => localStorage.getItem('mf_azureKey') || '');
  const [region, setRegion] = React.useState(() => localStorage.getItem('mf_azureRegion') || 'eastus');
  const [voice, setVoice] = React.useState(() => localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural');
  const [status, setStatus] = React.useState('');
  const save = () => {
    localStorage.setItem('mf_azureKey', key);
    localStorage.setItem('mf_azureRegion', region);
    localStorage.setItem('mf_azureVoice', voice);
    _azToken = null;
  };
  const handleSave = () => { save(); setStatus('已儲存'); setTimeout(() => setStatus(''), 2000); };
  const handleTest = async () => {
    save(); setStatus('測試中…');
    const ok = await azureSpeak('Hello, this is Azure Neural voice for Mo\'s Feed.', {
      onEnd: () => setStatus('✓ 連線成功'),
      onError: (e) => setStatus('✗ ' + (e?.message || '失敗'))
    });
    if (!ok) setStatus('✗ 請先填入 Azure Key');
  };
  if (!open) return null;
  return ReactDOM.createPortal(
    <>
      <div style={{ position:'fixed',inset:0,zIndex:149 }} onClick={onClose} />
      <div style={{ position:'fixed',top:0,right:0,bottom:0,width:'252px',background:'var(--bg-elevated)',borderLeft:'1px solid var(--divider)',zIndex:150,padding:'20px 18px',display:'flex',flexDirection:'column',gap:'14px',overflowY:'auto' }}>
        <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'4px' }}>
          <span style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.18em',textTransform:'uppercase',color:'var(--text-tertiary)' }}>Azure TTS 設定</span>
          <button onClick={onClose} style={{ background:'none',border:'none',cursor:'pointer',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'12px',padding:'0' }}>✕</button>
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Subscription Key</div>
          <input type="password" className="az-input" value={key} onChange={e=>setKey(e.target.value)} placeholder="貼上 Azure Key…" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Region</div>
          <input className="az-input" value={region} onChange={e=>setRegion(e.target.value)} placeholder="eastus" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Voice</div>
          <select className="az-input" value={voice} onChange={e=>setVoice(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="en-US-AriaNeural">Aria（女）自然流暢</option>
            <option value="en-US-JennyNeural">Jenny（女）清晰</option>
            <option value="en-US-GuyNeural">Guy（男）沉穩</option>
            <option value="en-US-DavisNeural">Davis（男）個性</option>
            <option value="en-US-TonyNeural">Tony（男）自信</option>
          </select>
        </div>
        <div style={{ display:'flex',gap:'8px' }}>
          <button onClick={handleSave} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--divider)',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>儲存</button>
          <button onClick={handleTest} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--text-secondary)',color:'var(--text-secondary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>測試</button>
        </div>
        {status && <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',color:'var(--text-tertiary)',letterSpacing:'0.1em' }}>{status}</div>}
        <div style={{ marginTop:'auto',fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.7,paddingTop:'8px',borderTop:'1px solid var(--divider)' }}>Key 存於 localStorage<br/>未設定時退回瀏覽器 TTS</div>
      </div>
    </>,
    document.body
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;

  const [resumeMsg, setResumeMsg] = useState(null);
  const lsKey = "mosfeed_Today_" + todaySub;

  // Read localStorage on tab/sub change
  React.useEffect(() => {
    const key = "mosfeed_Today_" + todaySub;
    try {
      const saved = parseInt(localStorage.getItem(key), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") go(idx + 1);
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(idx - 1);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 07/29/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v4.9</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
      >
        {atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} />
          </div>
        )}
      </div>

      {/* Nav bar */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => go(idx - 1)} disabled={idx === 0}>←</button>
        <span className="nav-count">{atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn" onClick={() => go(idx + 1)} disabled={atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
