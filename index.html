// ===== AZURE TTS =====
let _azToken = null, _azTokenExp = 0, _azAbort = null;
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
function azureStop() { if (_azAbort) { _azAbort.abort(); _azAbort = null; } }
async function azureSpeak(text, { rate='0%', onStart, onEnd, onError }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const voice = localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural';
  if (!key) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const token = await _getAzToken(key, region, ctrl.signal);
    const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'><voice name='${voice}'><prosody rate='${rate}'>${_xmlEsc(text)}</prosody></voice></speak>`;
    const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method:'POST', signal:ctrl.signal,
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
      body:ssml
    });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (ctrl.signal.aborted) return true;
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    if (onError) onError(e);
    return false;
  }
}

    {"id": "earn_0", "channel": "財報速報", "tag": "財報反差", "color": "#E8786A", "stocks": [{"t": "BA", "n": "核心每股虧損 0.76 美元大幅低於預期，股價反而收漲 3.98%"}, {"t": "KO", "n": "可口可樂財報超標，單日漲逾 4%"}], "en": "Boeing showed how an ugly print can still lift a stock. Its core loss of $0.76 a share missed the $0.34 consensus by 124%, including a $280M VC-25B charge that flipped Defense from a $110M profit to a $15M operating loss. Shares still closed at $219.92, up 3.98%, because investors fixed on two numbers: a record $715B backlog and $631M of free cash flow. Coca-Cola also gained over 4% on an earnings beat.", "zh": "波音示範了什麼叫「數字難看、股價照漲」。7月28日公布的核心每股虧損0.76美元，遠低於市場預期的虧損0.34美元，落差達123%；其中包含空軍一號VC-25B專案的2.8億美元認列，直接把國防部門從1.1億美元獲利翻成1,500萬美元虧損。但股價收219.92美元、上漲3.98%，因為市場只看兩個數字：7,150億美元創紀錄在手訂單，以及6.31億美元自由現金流。同日可口可樂也因財報超標漲逾4%。", "ja": "ボーイングは「数字は悪いが株価は上がる」典型。コア損益は1株0.76ドルの赤字で予想の0.34ドル赤字を124%下回り、VC-25B案件の2.8億ドル計上で防衛部門は1.1億ドルの黒字から1,500万ドルの赤字に転落。それでも株価は3.98%高の219.92ドル。過去最高の7,150億ドル受注残と6.31億ドルのFCFが評価された。", "url": "https://247wallst.com/investing/2026/07/28/the-1-number-behind-boeings-q2-2026-earnings-that-has-investors-worried/"},
    {"id": "earn_1", "channel": "財報速報", "tag": "資料中心電力", "color": "#E8786A", "stocks": [{"t": "BE", "n": "Q2 營收年增 166% 至 10.7 億美元，全年指引上修至 40.5 億"}, {"t": "VRT", "n": "資料中心電力與散熱基礎設施同一條供應鏈"}], "en": "In a week when AI capex was under fire, Bloom Energy supplied the counter-evidence. Q2 revenue jumped 166% year over year to $1.07B, non-GAAP EPS of $0.78 beat consensus by roughly 92%, and full-year guidance of $4.05B landed 8.2% above estimates. Management stressed it is neither capacity- nor order-constrained, selling behind-the-meter power that solves data centers' worst bottleneck: time to grid connection.", "zh": "在AI資本支出被全面質疑的一週，Bloom Energy給了反方證據。Q2營收年增166%至10.7億美元，非GAAP每股獲利0.78美元、超出市場共識約92%，全年營收指引40.5億美元比分析師預估高出8.2%。管理層強調公司「既不受產能限制、也不缺訂單」，賣點在於解決資料中心最痛的「併網等待時間」——用表後(behind-the-meter)發電讓案子先跑起來。重點在於：懷疑AI支出的人，也得解釋這張單子從哪來。", "ja": "AI設備投資が疑問視される週に、ブルーム・エナジーが反証を示した。第2四半期売上高は前年比166%増の10.7億ドル、非GAAP EPS0.78ドルは市場予想を約92%上回り、通期ガイダンス40.5億ドルは予想を8.2%上回った。経営陣は生産能力も受注も制約はないと強調。データセンター最大の難所である系統接続待ちを裏側発電で解く。", "url": "https://www.stocktitan.net/news/BE/bloom-energy-reports-record-second-quarter-2026-financial-results-ldr8nkxk210v.html"},
    {"id": "macro_0", "channel": "總經政策", "tag": "FOMC今日", "color": "#7C6AF7", "stocks": [{"t": "TLT", "n": "20年期以上公債，利率路徑最直接的表達工具"}, {"t": "XLF", "n": "金融股，利率預期與殖利率曲線的槓桿部位"}, {"t": "IWM", "n": "小型股對利率最敏感，是今日決議的風向球"}], "en": "The FOMC announces at 2 p.m. ET today, with new Chair Kevin Warsh holding the press conference at 2:30. Economists polled by FactSet expect a hold at 3.50–3.75%, the fifth straight, and over three-quarters of prediction-market money agrees. The tension sits in the dots: after June, 9 of 18 officials saw at least one hike by year-end 2026 and only one saw a cut. Warsh has pledged less forward guidance, raising the stakes on every word.", "zh": "今天台灣時間深夜、美東時間下午2點，FOMC公布利率決議，2點半由新任主席Kevin Warsh主持記者會。FactSet調查的經濟學家預期維持在3.50-3.75%，將是連續第五次按兵不動，預測市場中超過四分之三押注不動。真正的張力在點陣圖：6月會議後的預測顯示18位官員中有9位預期2026年底前至少升息一次，只有1位預期降息。Warsh已明言要減少前瞻指引，這讓記者會的每一個字都變得更難解讀、也更重要。", "ja": "本日米東部時間午後2時にFOMCが決定を公表、2時半からウォーシュ新議長が記者会見。FactSet調査のエコノミストは3.50-3.75%据え置きを予想し、5会合連続となる。焦点はドットチャート——6月時点で18人中9人が年内少なくとも1回の利上げを想定し、利下げ予想は1人のみ。フォワードガイダンス削減方針で会見の一語一語が重い。", "url": "https://www.cbsnews.com/news/fed-interest-rate-decision-july-meeting/"},
    {"id": "macro_1", "channel": "總經政策", "tag": "數據雙擊", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債，核心 PCE 數字的直接對價"}, {"t": "GLD", "n": "黃金，實質利率與政策可信度的避險部位"}], "en": "Thursday 8:30 a.m. ET stacks Q2 GDP, June personal income and outlays with the PCE deflator, and initial jobless claims into one release window. That is the week's real information peak: the Fed gives its rate and tone today, and markets get the evidence to confirm or contradict it tomorrow. Core PCE remains sticky near 3.3%, well above target. Strong GDP plus stubborn PCE puts the hike debate straight back on the table.", "zh": "明天(7/30)美東時間早上8點半，第二季GDP、6月個人所得與支出(含PCE平減指數)、初領失業金三份數據同時出爐。這是本週真正的資訊密度高峰：FOMC今天先給利率與語氣，市場明天才拿到驗證或推翻它的證據。核心PCE仍在3.3%附近黏著，離2%目標有明顯距離。若GDP偏強而PCE不降，今年升息的辯論會立刻回到桌上；反之則替廣度行情續命。", "ja": "木曜午前8時半(米東部)に第2四半期GDP、6月の個人所得・支出(PCEデフレーター含む)、新規失業保険申請が同時公表。今週の情報密度のピークだ。FRBは本日金利とトーンを示し、市場は明日その裏付けか反証かを得る。コアPCEは3.3%付近で粘着し目標から距離がある。GDP堅調かつPCE高止まりなら利上げ論が再燃する。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar"},
    {"id": "sector_0", "channel": "產業風向", "tag": "價值輪動", "color": "#4EABA4", "stocks": [{"t": "XLI", "n": "工業類股，2026 年輪動的核心受惠板塊"}, {"t": "XLP", "n": "消費防禦，在成長股回檔時提供相對強勢"}, {"t": "XLE", "n": "能源，漲幅高度依賴油價站穩 80 美元之上"}], "en": "The 2026 sector story has shifted from tech dominance to a broad value handoff. Industrials, energy and consumer defensives are beating the market by a wide margin, offsetting losses in tech, communication services, consumer cyclicals and even financials, while materials climb on commodity recovery and AI-infrastructure metals demand. The fragility is explicit: energy's gains lean on oil holding above $80 — and crude just fell 7%.", "zh": "2026年的板塊故事已經從「科技一枝獨秀」轉成「價值全面接棒」。工業、能源、消費防禦大幅跑贏大盤，抵銷了科技、通訊服務、非必需消費甚至金融的失分；原物料則因商品價格反彈與AI基礎建設對金屬的需求而走高。但這條輪動有一個明確的脆弱點：能源的漲幅高度依賴油價維持在每桶80美元之上，一旦地緣局勢降溫或需求轉弱，這部分貢獻可能很快消失——而本週油價已經先跌了7%。", "ja": "2026年のセクター物語はテック一強から価値株への広範なバトンタッチへ。資本財、エネルギー、生活必需品が市場を大きく上回り、テック・通信・一般消費財・金融の下落を相殺。素材は商品価格回復とAIインフラの金属需要で上昇。脆さも明確で、エネルギーの上昇は原油80ドル維持が前提だが、今週すでに7%下落した。", "url": "https://alphabetastock.com/sector-rotation-industrials-energy-tech-narrowing-2026/"},
    {"id": "sector_1", "channel": "產業風向", "tag": "生技回魂", "color": "#4EABA4", "stocks": [{"t": "XBI", "n": "等權重生技 ETF，今年 +25%、近 12 個月近 +80%"}, {"t": "IBB", "n": "市值加權生技，今年表現落後 XBI"}, {"t": "EXEL", "n": "被點名的中型生技標的之一"}], "en": "While everyone watched chips, biotech quietly broke out. XBI is up about 25% this year and nearly 80% over 12 months, its highest level since February 2021, including a 13%-plus June and roughly $1.3B of net inflows. The telling detail is that equal-weighted XBI is beating cap-weighted IBB — this is M&A money hunting small-cap innovators, not big pharma leading. The driver is structural: patent cliffs force large caps to buy revenue.", "zh": "在所有人盯著晶片的時候，生技悄悄創了新高。XBI今年上漲約25%、過去12個月接近80%，寫下2021年2月以來最高水位，光6月就漲逾13%、淨流入約13億美元。關鍵細節是等權重的XBI跑贏市值加權的IBB——代表這波不是大藥廠帶動，而是併購資金鎖定小型創新公司。背後的驅動力很結構性：大型藥廠面臨專利懸崖，必須靠買來補營收缺口。", "ja": "皆が半導体を見ている間に、バイオテクが静かに高値を更新。XBIは年初来約25%高、12カ月で約80%高と2021年2月以来の高水準。6月だけで13%超上昇し約13億ドルの資金流入。均等加重のXBIが時価総額加重のIBBを上回る点が重要で、大手製薬主導ではなくM&A資金が小型イノベーターを狙う構図。特許切れが構造的な後押し。", "url": "https://finance.yahoo.com/news/heres-why-biotech-etfs-rallying-150000062.html"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素動能", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，指數約 2,970 點高檔震盪"}, {"t": "IJR", "n": "標普小型股 600，品質篩選版本的小型股曝險"}], "en": "The Russell 2000 is up roughly 17–22% this year, on pace for its best annual showing since 2003 after its strongest first half since 1991. It has since gone sideways at elevated levels, hovering near 2,970 and slipping 0.18% in a session as Fed caution and chip weakness weighed. Small caps are structurally more sensitive to rates and borrowing costs, which is why today's FOMC matters more to them than to megacaps.", "zh": "羅素2000今年上漲約17-22%，正走在2003年以來最強的年度表現上，上半年更是1991年以來最好的半年。但近期已進入高檔震盪：指數在2,970點附近，單日小跌0.18%，因為市場對Fed轉趨謹慎、加上晶片與科技股走弱拖累。小型股本來就對利率與借貸成本更敏感，這也是為什麼今天的FOMC對它們的意義大於對大型股。", "ja": "ラッセル2000は年初来約17~22%高で、1991年以来最強の上半期を経て2003年以来の年間パフォーマンスを狙う。足元は2,970付近で高値もみ合い、FRB警戒と半導体安で0.18%安の場面も。小型株は金利と借入コストへの感応度が構造的に高く、本日のFOMCは大型株以上に重い意味を持つ。", "url": "https://www.ibtimes.com.au/russell-2000-historic-surge-small-cap-stocks-2026-1872416"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "政策催化", "color": "#5B8ED6", "stocks": [{"t": "OFIX", "n": "7 月漲 28%，CMS 給付逆轉的直接受惠者，但今年仍跌 23%"}, {"t": "NUVA", "n": "脊椎與骨科器材同業，同受 Medicare 給付規則影響"}], "en": "Seven small caps ripped 28% or more in four sessions in July, but that was not broad strength — it was individual names repricing on hard catalysts: takeovers, court-cleared refinancings, and one Medicare reversal. Orthofix is the last kind: on July 1 CMS reversed the May billing and fee-schedule changes for non-invasive bone growth stimulators, restoring prior reimbursement. The stock is up 28% in July yet still down 23% year to date.", "zh": "7月有七檔小型股在四個交易日內漲逾28%，但這不是小型股全面走強，而是個股各自踩到硬催化劑——併購、法院放行的再融資、以及一次Medicare政策逆轉。Orthofix就是最後這類：Medicare與Medicaid服務中心(CMS)在7月1日撤回5月對非侵入式骨生長刺激器的計費與費率調整，把給付恢復到原水準。股價7月漲28%，但今年迄今仍下跌23%——這個對比正是小型股的本質：政策一句話就能決定損益表。", "ja": "7月は7銘柄の小型株が4営業日で28%以上急騰したが、これは全体的な強さではなく個別の硬い触媒——買収、裁判所承認の借換、そしてメディケアの方針転換——による再評価だ。オルソフィックスは最後の例で、CMSが7月1日に非侵襲的骨成長刺激装置の5月の算定変更を撤回し償還を元に戻した。7月は28%高だが年初来では23%安。", "url": "https://www.benzinga.com/markets/small-cap/26/07/60593569/russell-2000-small-cap-stocks-july-biggest-gainers-2026"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "判讀知識", "color": "#5B8ED6", "stocks": [{"t": "VTWO", "n": "羅素 2000 指數基金，觀察小型股整體利率敏感度"}, {"t": "KRE", "n": "區域銀行 ETF，小型股池中利率反應最劇烈的一群"}], "en": "Why do small caps always react harder to the Fed? Three structural reasons. First, a larger share of their debt is floating-rate, so a move in rates hits interest expense directly. Second, refinancing windows are shorter and bargaining power weaker, so tightening credit bites them first. Third, thinner liquidity means the same flow produces bigger price swings. When IWM moves far more than SPY on Fed day, that is balance-sheet structure, not sentiment.", "zh": "為什麼小型股對Fed的反應永遠比大型股激烈？三個結構性理由值得記住：第一，小型公司的負債裡浮動利率佔比更高，利率一動就直接吃掉利息費用；第二，它們的再融資窗口更短、議價能力更弱，信用環境緊縮時首當其衝；第三，流動性較薄，同樣的資金流進出會造成更大的價格擺盪。所以當你看到FOMC當天IWM的波動遠大於SPY，那不是情緒，是資產負債表結構的差異。", "ja": "なぜ小型株はFRBに対し常に大型株より激しく反応するのか。理由は三つ。第一に変動金利負債の比率が高く金利上昇が利息費用を直撃する。第二に借換の期間が短く交渉力も弱いため信用収縮の影響を最初に受ける。第三に流動性が薄く同じ資金フローでも値動きが大きくなる。FOMC当日にIWMがSPYより大きく動くのは感情ではなく構造だ。", "url": "https://247wallst.com/investing/etf/2026/07/20/the-russell-2000-is-outpacing-the-sp-500-in-2026-is-it-too-late-to-buy-small-cap-etfs/"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "分拆新股", "color": "#C9A227", "stocks": [{"t": "MFP", "n": "7/7 分拆上市的純食品加工設備平台，股價約 45.83 美元"}, {"t": "MIDD", "n": "母公司 Middleby，分拆後轉為純商用餐飲設備公司"}], "en": "What it does: Midera is a pure-play industrial food processing technology platform with 30-plus brands, spun off from Middleby on July 6 and trading on Nasdaq as MFP since July 7 (one MFP share per MIDD share). Why ignored: under a month old, no standalone financial history, roughly 2 analysts covering. What's changing: a $1.0B credit facility funds an acquisition-led strategy, with just 1.5% share of a ~$70B market and an estimated $700M of deployable M&A capacity; shares near $45.83 in a $33.00–$46.68 range. Risks: indiscriminate spin-off selling, integration failure, demand tied to customer capex, and zero standalone track record. Research lead, not investment advice.", "zh": "這家公司做什麼：Midera Food Processing是工業食品加工技術平台，旗下30多個品牌提供整線解決方案，7月6日自Middleby分拆完成、7月7日以MFP在那斯達克掛牌，股東每持1股MIDD配得1股MFP。為什麼被忽視：上市不到一個月、沒有獨立財報歷史，目前僅約2位分析師覆蓋，法人模型還沒建起來。什麼正在改變：公司取得10億美元信貸額度支撐併購成長策略，在約700億美元的市場中僅有1.5%市佔，管理層估算有7億美元的併購佈署空間；股價約45.83美元，區間33.00-46.68。風險與反方：分拆股常見前股東無差別賣壓、併購整合失敗風險、食品加工設備需求與客戶資本支出高度連動，且完全沒有獨立經營的公開紀錄可供檢驗。這是研究線索，不是投資建議。", "ja": "事業内容：ミデラは30以上のブランドを持つ産業用food processing技術プラットフォーム。7月6日にミドルビーから分離、7日よりナスダックでMFPとして取引。無視される理由：上場1カ月未満、単独の財務履歴がなくカバーは約2名。変化：10億ドルの信用枠でM&A主導の成長戦略、約700億ドル市場でシェア1.5%、7億ドルの買収余地。株価は約45.83ドル。リスク：分離上場特有の売り圧力、統合失敗、顧客設備投資への依存。投資助言ではない。", "url": "https://finance.yahoo.com/markets/stocks/articles/midera-food-processing-mfp-starts-111116706.html", "status": "RADAR · 下一個驗證點 2026-08 首份獨立季報（看併購節奏與獨立後毛利）"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "大股東連買", "color": "#C9A227", "stocks": [{"t": "HDSN", "n": "冷媒回收再製商，10% 大股東 Hartree 一年買進 83.5 萬股、零賣出"}], "en": "What it does: Hudson Technologies reclaims, reprocesses and sells refrigerants, sitting on the recovery side of the AIM Act HFC phasedown. Why ignored: small cap in an unglamorous niche with near-zero media voice. What's changing: 10% holder Hartree Partners keeps buying — 65,550 shares (~$285,771) on July 21, 834,986 shares over the past year with zero sales, plus 288,111 and 271,302 shares on July 1–2; a Solstice licensing deal adds reclaimed HFO blends R-448A and R-449A. Risks: Q1 revenue of $60.15M beat but adjusted EPS of $0.01 missed $0.05 badly, management guides lower Q2 pricing, and the mid-20% margin target plus an ERP transition remain unproven. Research lead, not investment advice.", "zh": "這家公司做什麼：Hudson Technologies做冷媒的回收、再製與銷售，是AIM法案HFC逐步淘汰政策下的回收端業者。為什麼被忽視：小型股、產業冷門到近乎無人討論，媒體聲量極低。什麼正在改變：10%大股東Hartree Partners持續買進——7月21日再買65,550股(約28.6萬美元)，過去一年累計買進834,986股、期間零賣出，7月1日與2日各買進288,111股與271,302股；同時公司與Solstice Advanced Materials簽授權，回收再售專利HFO混合冷媒R-448A與R-449A，切入商用冷凍替換需求。風險與反方：Q1營收6,015萬美元雖超預期，但調整後每股獲利僅0.01美元、遠低於預期0.05美元；管理層自己說Q2售價會比去年低，因為去年的缺貨漲價不再重演，全年毛利率20%出頭的目標尚未驗證，ERP系統轉換也還在消化。這是研究線索，不是投資建議。", "ja": "事業内容：ハドソン・テクノロジーズは冷媒の回収・再生・販売を行い、AIM法によるHFC段階的削減の受け皿となる。無視される理由：小型株かつ地味なニッチで報道がほぼない。変化：10%株主ハートリーが7月21日に65,550株(約28.6万ドル)を買い増し、過去1年で834,986株を購入し売却ゼロ。ソルスティスとの提携でHFO混合冷媒の再生販売も開始。リスク：第1四半期の調整後EPSは0.01ドルと予想0.05ドルを大幅未達、第2四半期は価格低下見込み。投資助言ではない。", "url": "https://www.stocktitan.net/sec-filings/HDSN/form-4-hudson-technologies-inc-ny-insider-trading-activity-d5d7823b3f57.html", "status": "RADAR · 下一個驗證點 08/05 Q2 財報電話會議（看毛利率是否回到 20% 中段）"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "授權轉機", "color": "#C9A227", "stocks": [{"t": "MOV", "n": "手錶集團，股價約 38.5 美元逼近 52 週高點 39.85"}], "en": "What it does: Movado Group owns Movado and Ebel and runs licensed watch lines for Coach, Tommy Hilfiger, Lacoste and HUGO. Why ignored: watches are an unfashionable niche, the float is small, analyst coverage is minimal and media voice is near zero. What's changing: on July 21 Kate Spade New York signed a global licensing deal (effective July 1) with Movado designing, making and distributing its watches; on July 16 the Bank of America revolver was extended from October 2026 to July 2031. Balance sheet holds ~$230M cash with almost no net debt; FY2026 Q1 EPS rose 417%. Risks: no FY2027 guidance on tariff and macro uncertainty, luxury slowdown, brand aging, and a ~35.6% run in 12 weeks that has compressed the margin of safety. Research lead, not investment advice.", "zh": "這家公司做什麼：Movado Group是手錶與珠寶品牌集團，自有Movado、Ebel，並代工經營Coach、Tommy、Lacoste、HUGO等授權錶款。為什麼被忽視：鐘錶是典型冷門產業，小型股、分析師覆蓋極少、媒體聲量幾乎為零。什麼正在改變：7月21日Kate Spade New York宣布與Movado簽定全球授權合作(7月1日生效)，由Movado負責設計、製造與經銷Kate Spade錶款；7月16日與美國銀行把循環信貸到期日從2026年10月延長至2031年7月(額度由1億降為7,500萬，目前完全未動用)。財務面：帳上現金約2.3億美元、近乎無淨負債，FY2026 Q1每股獲利年增417%。風險與反方：關稅與總經不確定讓管理層拒絕給FY2027財測，精品消費放緩與品牌老化是長期問題，且股價近12週已漲約35.6%，便宜的安全邊際明顯被壓縮。這是研究線索，不是投資建議。", "ja": "事業内容：モバード・グループはMovado、Ebelを保有し、Coach、Tommy、Lacoste、HUGOのライセンス時計も手掛ける。無視される理由：時計は不人気ニッチで小型株、カバレッジも報道もほぼ皆無。変化：7月21日にケイト・スペードとの世界的ライセンス契約を発表(7月1日発効)、16日にはBofAのリボルバー期限を2031年7月へ延長。現金約2.3億ドルで実質無借金、FY2026第1四半期EPSは417%増。リスク：FY2027見通し未提示、高級品消費減速、12週で約35.6%上昇し割安余地は縮小。投資助言ではない。", "url": "https://stockanalysis.com/stocks/mov/statistics/", "status": "RADAR · 下一個驗證點 08/27 財報（看 Kate Spade 授權錶對營收與毛利的實際貢獻）"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "會計雜訊", "color": "#C9A227", "stocks": [{"t": "BHRB", "n": "維吉尼亞社區銀行，Q2 調整後 EPS 2.03 美元 vs GAAP 僅 0.50 美元"}], "en": "What it does: Burke & Herbert is a long-established Virginia community bank that closed its LINKBANCORP merger on May 1, 2026, reaching roughly $11B in assets and over 100 branches. Why ignored: small regional banks get little coverage, and merger-quarter accounting noise distorted the print — Q2 GAAP EPS of $0.50 versus $1.79 the prior quarter looks like an earnings collapse. What's changing: adjusted operating net income of $37.5M and adjusted EPS of $2.03 show the underlying run-rate; insiders bought 12,300 shares (~$774K) in three months and are net buyers of ~$933K over 12 months, with director Julian Barnwell buying ~5,000 shares at ~$62.76 on June 3. Risks: CRE exposure, integration failure, deposit-cost pressure, and a GAAP-to-adjusted gap wide enough that investors must reconstruct the numbers themselves. Research lead, not investment advice.", "zh": "這家公司做什麼：Burke & Herbert Financial Services是維吉尼亞老牌社區銀行，2026年5月1日完成與LINKBANCORP合併，資產規模約110億美元、逾100家分行。為什麼被忽視：小型區域銀行本來覆蓋就極少，而合併當季的會計雜訊把GAAP數字弄花——Q2 GAAP每股獲利僅0.50美元，對比前季1.79美元，帳面上看起來像獲利崩塌。什麼正在改變：還原後的Q2調整後營運淨利3,750萬美元、調整後每股獲利2.03美元，才是真實獲利能力；內部人近三個月買進12,300股約77.4萬美元，12個月淨買超約93.3萬美元，董事Julian Barnwell於6月3日以約62.76美元買進約5,000股。風險與反方：商用不動產曝險、合併整合失敗風險、社區銀行存款成本壓力，而且GAAP與調整後數字落差極大，投資人必須自己動手還原——這本身就是一種風險。這是研究線索，不是投資建議。", "ja": "事業内容：バーク・アンド・ハーバートはバージニア州の老舗コミュニティ銀行で、2026年5月1日にLINKBANCORPとの合併を完了し資産約110億ドル、100超の支店を持つ。無視される理由：小型地銀はカバーが乏しく、合併四半期の会計ノイズがGAAP数値を歪めた(第2四半期GAAP EPSは0.50ドル、前四半期は1.79ドル)。変化：調整後営業純利益3,750万ドル、調整後EPS2.03ドルが実力値。直近3カ月で内部者が12,300株(約77.4万ドル)購入。リスク：商業用不動産エクスポージャー、統合失敗、預金コスト。投資助言ではない。", "url": "https://www.stocktitan.net/news/BHRB/burke-herbert-financial-services-corp-announces-second-quarter-2026-xcwaznl6owwy.html", "status": "RADAR · 下一個驗證點 2026-10 Q3 財報（看合併綜效落地、GAAP 與調整後差距是否收斂）"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "銀行群聚", "color": "#6DB56D", "stocks": [{"t": "MPB", "n": "賓州社區銀行，Q2 EPS 0.87 超預期 0.81，庫藏股加碼 5,000 萬美元"}, {"t": "ISTR", "n": "路易斯安那小型銀行，同列低估值＋內部人買進名單"}], "en": "Small bank stocks are showing clustered insider and corporate buying. Mid Penn Bancorp reported Q2 EPS of $0.87 on July 23, beating the $0.81 consensus, with revenue of $75.87M topping $73.28M and up 39.6% year over year; the board expanded buybacks by $50M on April 21 (through April 30, 2027) and insiders logged seven purchases over the past year. Investar Holding appears on the same undervalued-with-insider-buying screen. Caveat: much of Mid Penn's 39.6% growth came from acquisition, not organic expansion, and Q1 EPS of $0.36 trailed the prior year's $0.71.", "zh": "小型銀行股正出現群聚式的內部人與公司自身買進。Mid Penn Bancorp在7月23日公布Q2每股獲利0.87美元、超出市場預期0.81美元，營收7,587萬美元優於預估7,328萬、年增39.6%；董事會4月21日再加碼5,000萬美元庫藏股計畫(效期到2027年4月30日)，過去一年內部人有7筆買進。Investar Holding也出現在同一份低估值＋內部人買進的篩選名單上。判讀提醒：Mid Penn營收年增39.6%相當部分來自併購擴張而非有機成長，且Q1每股獲利0.36美元還低於去年同期0.71美元——買進行為要對照獲利品質一起看。", "ja": "小型銀行株で内部者と自社の買いが集中している。ミッドペン・バンコープは7月23日に第2四半期EPS0.87ドル(予想0.81ドル)、売上7,587万ドル(予想7,328万ドル、前年比39.6%増)を発表。4月21日には5,000万ドルの自社株買い枠を追加し、過去1年で内部者の買いが7件。インベスターも同じ割安＋内部者買いのスクリーンに登場。留意点：39.6%成長の相当部分は買収由来で、第1四半期EPSは0.36ドルと前年の0.71ドルを下回る。", "url": "https://www.gurufocus.com/news/8974123/mid-penn-bancorp-mpb-reports-strong-q2-earnings-with-3959-revenue-growth"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "訊號分級", "color": "#6DB56D", "stocks": [{"t": "UMH", "n": "曼哈頓房車社區 REIT，CFO 與董事透過股息再投資計畫買進"}, {"t": "CSR", "n": "Centerspace 公寓 REIT，近期出現內部人買進"}], "en": "Not all insider buys carry equal weight — this card is the grading exercise. UMH Properties CFO Kevin Miller 'bought' 67.8 shares at $14.75 on July 15; note the decimal, since that came through the dividend reinvestment and stock purchase plan rather than an open-market decision. A director added the same way. Contrast that with Hartree's 834,986 shares over a year or a Burke & Herbert director's 5,000-share ticket. The rule: check size, open-market versus plan, persistence, and seniority — DRIP and option exercises carry almost no information.", "zh": "不是所有內部人買進都同一個等級，這張卡就是分級練習。UMH Properties的財務長Kevin Miller在7月15日以每股14.75美元「買進」67.8股——注意那個小數點，這是透過股息再投資與購股計畫(DRIP)自動執行的，不是主動掏錢在公開市場買。同期董事也是透過股息計畫增持。相對地，本週雷達卡裡Hartree一年買進83.5萬股、Burke & Herbert董事單筆5,000股，才是真正的開放市場買單。判讀原則：看金額、看是否開放市場、看是否連續、看買方層級——DRIP與選擇權行使幾乎不帶訊息量。", "ja": "内部者の買いは同格ではない。このカードはその格付け演習だ。UMHのミラーCFOは7月15日に14.75ドルで67.8株を「購入」したが、小数点が示す通り配当再投資・株式購入プラン(DRIP)による自動執行であり、公開市場での能動的判断ではない。対照的にハートリーの年間834,986株やバーク・アンド・ハーバート取締役の5,000株は本物の公開市場の買いだ。金額・公開市場か・継続性・役職を見よ。", "url": "https://www.stocktitan.net/sec-filings/UMH/form-4-umh-properties-inc-insider-trading-activity-651b52890c03.html"},
    {"id": "week_0", "channel": "本週事件", "tag": "48小時關卡", "color": "#C97DD4", "stocks": [{"t": "MSFT", "n": "今日盤後財報，Azure 成長率與資料中心資本支出是焦點"}, {"t": "META", "n": "今日盤後財報，市場預估每股獲利 7.18-7.24 美元"}, {"t": "AAPL", "n": "7/30 盤後財報，預估每股獲利約 1.86 美元"}, {"t": "AMZN", "n": "7/30 盤後財報，預估每股獲利約 1.85 美元"}], "en": "The next 48 hours are the season's densest stretch. Today (July 29): FOMC at 2 p.m. ET, Warsh at 2:30, then Microsoft and Meta report after the close — Azure growth, AI capacity, Copilot monetization and data-center capex for MSFT; ad revenue, AI-driven targeting efficiency and post-buildout costs for META. Tomorrow (July 30): GDP, PCE and jobless claims at 8:30 a.m., with Apple and Amazon after the bell. 177 S&P 500 companies report this week, and the four megacaps' capex commentary decides whether the spend is accelerating, plateauing or rolling over.", "zh": "接下來48小時是本季資訊密度最高的一段。今天(7/29)美東下午2點FOMC決議、2點半Warsh記者會，盤後微軟與Meta同時公布財報；微軟看Azure成長率、AI產能供給、M365 Copilot商業化與資料中心資本支出，Meta看廣告營收成長、AI推薦系統帶來的投放效率與資料中心投資後的成本變化。明天(7/30)早上8點半GDP、PCE、初領失業金三連發，盤後換蘋果與亞馬遜上場。本週標普成分股共177家公布財報，四家巨頭對AI資本支出的說法，將決定這波支出是加速、走平還是開始遞減。", "ja": "今後48時間が今季最も情報密度の高い局面だ。本日(7/29)は午後2時にFOMC、2時半にウォーシュ会見、引け後にマイクロソフトとメタが決算。MSFTはAzure成長率・AI供給能力・Copilot収益化・データセンター設備投資、METAは広告収入・AI推薦の効率・投資後のコストが焦点。明日(7/30)は午前8時半にGDP・PCE・失業保険、引け後にアップルとアマゾン。今週はS&P500の177社が発表する。", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262054300-weekly-preview-fed-apple-microsoft-meta-amazon-earnings-reports-tradingkey"},

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  const speakWord = React.useCallback(async (word) => {
    const ok = await azureSpeak(word, { rate:'-15%' });
    if (!ok) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US"; u.rate = 0.82;
      const voices = speechSynthesis.getVoices();
      const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
      if (picked) u.voice = picked;
      speechSynthesis.speak(u);
    }
  }, []);

  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      return;
    }
    setSpeaking(true);
    const ok = await azureSpeak(card.en, {
      rate: '-5%',
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
    if (!ok) {
      const u = new SpeechSynthesisUtterance(card.en);
      u.lang = "en-US"; u.rate = 0.88; u.pitch = 1.0; u.volume = 1.0;
      const tryVoices = () => {
        const voices = speechSynthesis.getVoices();
        const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
        if (picked) u.voice = picked;
      };
      if (speechSynthesis.getVoices().length > 0) tryVoices();
      else { speechSynthesis.onvoiceschanged = () => { tryVoices(); speechSynthesis.onvoiceschanged = null; }; }
      u.onend = () => setSpeaking(false);
      u.onerror = () => setSpeaking(false);
      speechSynthesis.speak(u);
    }
  }, [card.en, speaking]);

  // Stop speaking & close popup when card changes
  React.useEffect(() => {
    return () => {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀全文"} style={{ marginLeft:"auto" }}>{speaking ? "■" : "🔊"}</button>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          {lang === "ja"
            ? <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"15px", lineHeight:1.9, color:"var(--text-secondary)", margin:0, maxWidth:"46ch", fontWeight:300 }}>{card.ja || card.en}</p>
            : <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>}
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("ja"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="ja" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="ja" ? "close ↑" : "日本語 ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />

        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Subscription Key</div>
          <input type="password" className="az-input" value={key} onChange={e=>setKey(e.target.value)} placeholder="貼上 Azure Key…" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Region</div>
          <input className="az-input" value={region} onChange={e=>setRegion(e.target.value)} placeholder="eastus" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Voice</div>
          <select className="az-input" value={voice} onChange={e=>setVoice(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="en-US-AriaNeural">Aria（女）自然流暢</option>
            <option value="en-US-JennyNeural">Jenny（女）清晰</option>
            <option value="en-US-GuyNeural">Guy（男）沉穩</option>
            <option value="en-US-DavisNeural">Davis（男）個性</option>
            <option value="en-US-TonyNeural">Tony（男）自信</option>
          </select>
        </div>
        <div style={{ display:'flex',gap:'8px' }}>
          <button onClick={handleSave} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--divider)',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>儲存</button>
          <button onClick={handleTest} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--text-secondary)',color:'var(--text-secondary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>測試</button>
        </div>
        {status && <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',color:'var(--text-tertiary)',letterSpacing:'0.1em' }}>{status}</div>}
        <div style={{ marginTop:'auto',fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.7,paddingTop:'8px',borderTop:'1px solid var(--divider)' }}>Key 存於 localStorage<br/>未設定時退回瀏覽器 TTS</div>
      </div>
    </>,
    document.body
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;

  const [resumeMsg, setResumeMsg] = useState(null);
  const lsKey = "mosfeed_Today_" + todaySub;

  // Read localStorage on tab/sub change
  React.useEffect(() => {
    const key = "mosfeed_Today_" + todaySub;
    try {
      const saved = parseInt(localStorage.getItem(key), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") go(idx + 1);
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(idx - 1);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 07/29/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v4.8</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
      >
        {atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} />
          </div>
        )}
      </div>

      {/* Nav bar */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => go(idx - 1)} disabled={idx === 0}>←</button>
        <span className="nav-count">{atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn" onClick={() => go(idx + 1)} disabled={atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
