/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

    {"id": "earn_1", "channel": "財報速報", "tag": "盤後：Netflix 財測偏弱，SpaceX 獲利優於預期", "color": "#E8786A", "zh": "Netflix 週二盤後公布每股盈餘 0.87 美元，高於預期的 0.82 美元，但第四季每股盈餘指引 0.67 美元低於預期的 0.73 美元，營業利益率指引 26% 也低於預期的 27.6%，全年自由現金流指引約 120 億美元（原約 125 億美元），盤後股價約下跌 3.3%。SpaceX 每股盈餘 0.35 美元（預期 0.17 美元），資本支出 195.9 億美元遠高於預期的 68.8 億美元，盤後約上漲 2.2%。", "en": "Netflix reported Tuesday after the close EPS of $0.87 versus $0.82 expected, but guided Q4 EPS to $0.67 against $0.73 expected and operating margin to 26% against 27.6%, and trimmed full-year free cash flow to about $12 billion from about $12.5 billion; the stock fell roughly 3.3% after hours. SpaceX posted EPS of $0.35 versus $0.17 expected with capital spending of $19.59 billion versus $6.88 billion expected, and rose about 2.2% after hours.", "url": "https://investinglive.com/news/investinglive-americas-fx-news-wrap-20-oct-usd-falls-as-deal-headlines-swing-oil-dow-and-small-caps-outperform", "stocks": [{"t": "NFLX", "n": "Netflix，Q4 EPS 指引 0.67 美元低於預期，盤後約 -3.3%"}, {"t": "SPCX", "n": "SpaceX，EPS 0.35 美元優於預期，資本支出大增，盤後約 +2.2%"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "盤後：Capital One 大漲，直覺外科與聯合航空下跌", "color": "#E8786A", "zh": "Capital One 第三季每股盈餘 6.69 美元，優於預期 1.19 美元，盤後上漲約 4.5%。直覺外科（Intuitive Surgical）營收優於預期，但盤後仍下跌約 7.1%；聯合航空因第四季財測偏弱，盤後下跌約 2.2%。以上皆為盤後初步反應，次日實際收盤可能不同，不同資料商的預期值也略有差異。", "en": "Capital One reported Q3 EPS of $6.69, beating estimates by $1.19, and rose about 4.5% after hours. Intuitive Surgical beat on revenue yet fell about 7.1% after hours, and United Airlines slid about 2.2% on a weak fourth-quarter outlook. These are early after-hours reactions; the next regular session may differ, and consensus figures vary by data vendor.", "url": "https://cappnotes.substack.com/p/closing-look-tuesday-october-20-2026", "stocks": [{"t": "COF", "n": "Capital One，EPS 6.69 美元，盤後約 +4.5%"}, {"t": "ISRG", "n": "直覺外科，營收優於預期，盤後約 -7.1%"}, {"t": "UAL", "n": "聯合航空，Q4 財測偏弱，盤後約 -2.2%"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "殖利率曲線趨平：十年期 5.12%、三十年期 5.42%", "color": "#7C6AF7", "zh": "週二短端殖利率小升、長端下滑：兩年期約 4.79%（上升約 2 個基點），十年期約 5.12%（下降約 3 個基點），三十年期約 5.42%（下降約 6 個基點），兩年與十年期利差由約 38 個基點縮到約 33 個基點。長端下滑部分與疲弱的房市數據有關。短端幾乎沒有重新定價為更寬鬆的 Fed 政策，意味著市場仍預期利率維持在高檔。", "en": "Short-end yields edged up and the long end fell on Tuesday: the 2-year was about 4.79% (up roughly 2 bp), the 10-year about 5.12% (down roughly 3 bp) and the 30-year about 5.42% (down roughly 6 bp), flattening the 2s10s spread from about 38 bp to about 33 bp. The long-end drop was linked in part to weak housing data. The short end showed little sign of pricing easier Fed policy.", "url": "https://investinglive.com/news/investinglive-americas-fx-news-wrap-20-oct-usd-falls-as-deal-headlines-swing-oil-dow-and-small-caps-outperform", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，長端殖利率下滑時價格受支撐"}, {"t": "SHY", "n": "1 至 3 年公債 ETF，短端殖利率小升"}, {"t": "IEF", "n": "7 至 10 年公債 ETF，十年期約 5.12%"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "Fed 10/28 開會：市場預期按兵不動，但升息議題未散", "color": "#7C6AF7", "zh": "Fed 目前利率區間為 3.75% 至 4.00%，10/28 的會議，CME FedWatch 顯示維持不動的機率約 83%。9 月 CPI 年增 3.7%、核心 2.6%。官員談話仍偏鷹派：Waller 表示需要更多升息來壓低通膨，但不必連續會議進行；Williams 9 月表示年底前再升息一次是合理預期；9 月點陣圖顯示 18 位官員中有 16 位認為今年稍後可能再升息 25 個基點。以上利率機率與談話來自彙整資料，請以 Fed 官方文件為準。", "en": "The fed funds range is 3.75% to 4.00%, and CME FedWatch put the odds of a hold at the Oct. 28 meeting at about 83%. September CPI was 3.7% year over year, with core at 2.6%. Officials remain hawkish: Waller said more hikes are needed but not at consecutive meetings, Williams said another hike by year-end would be reasonable, and the September projections showed 16 of 18 officials seeing at least one more 25 bp hike possible this year. These come from aggregated sources; check Fed documents for the official record.", "url": "https://www.noradarealestate.com/blog/interest-rate-predictions-october-2026/", "stocks": [{"t": "SPY", "n": "標普 500 ETF，對利率路徑敏感"}, {"t": "XLF", "n": "金融類股 ETF，受利率與殖利率曲線影響"}, {"t": "IWM", "n": "羅素 2000 ETF，小型股對借貸成本更敏感"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "房市數據疲弱：待完成交易指數創紀錄新低", "color": "#7C6AF7", "zh": "9 月成屋待完成交易指數月減 7.3%（預期減 0.5%），指數降至 66.0，創紀錄新低，年減 12.6%；9 月新屋開工 122.1 萬戶，低於預期的 130.5 萬戶，建築許可 140.0 萬戶則略高於預期的 139.5 萬戶。財政部長 Bessent 表示經濟已走到「能源衝擊的另一邊」，房貸利率會下降。數據說的是高利率正在壓抑成交，而房貸利率要不要降，取決於長端殖利率。", "en": "September pending home sales fell 7.3% (versus a 0.5% decline expected), taking the index to a record-low 66.0, down 12.6% from a year earlier. Housing starts were 1.221 million against 1.305 million expected, while building permits were 1.400 million versus 1.395 million expected. Treasury Secretary Bessent said the economy is on the other side of the energy shock and that mortgage rates would come down. The data show high rates suppressing transactions; whether mortgage rates fall depends on long-end yields.", "url": "https://investinglive.com/news/investinglive-americas-fx-news-wrap-20-oct-usd-falls-as-deal-headlines-swing-oil-dow-and-small-caps-outperform", "stocks": [{"t": "ITB", "n": "房屋建商 ETF，對房貸利率與成交量敏感"}, {"t": "XHB", "n": "房屋建築相關 ETF"}, {"t": "DHI", "n": "D.R. Horton，美國最大房屋建商之一"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "醫療保健領漲 2.37%，防禦與利率敏感族群同步走強", "color": "#4EABA4", "zh": "週二標普 500 各類股中，醫療保健上漲 2.37% 居冠，房地產漲 1.70%、公用事業漲 1.26%、金融漲 1.20%，科技則下跌 0.28%。領漲的是防禦型與利率敏感類股，反映市場在長端殖利率回落時從成長股轉向其他族群。單日的輪動不代表趨勢，需觀察接下來幾天是否持續。", "en": "Among S&P 500 sectors on Tuesday, health care led with a 2.37% gain, followed by real estate (+1.70%), utilities (+1.26%) and financials (+1.20%), while technology fell 0.28%. Leadership came from defensive and rate-sensitive groups as long-end yields eased, a rotation away from growth. A one-day rotation is not a trend; watch whether it persists.", "url": "https://cappnotes.substack.com/p/closing-look-tuesday-october-20-2026", "stocks": [{"t": "XLV", "n": "醫療保健類股 ETF，週二最強類股約 +2.37%"}, {"t": "XLRE", "n": "房地產類股 ETF，約 +1.70%"}, {"t": "XLU", "n": "公用事業類股 ETF，約 +1.26%"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "半導體：設備股回吐，韓國股市重挫", "color": "#4EABA4", "zh": "費城半導體指數週二下跌 0.29% 至 11,283.81，吐回週一的部分反彈；設備類股下跌：Lam Research 約 -3.21%、KLA 約 -2.80%、Arm 約 -3.07%。韓國 Kospi 重挫 3.73%，SK 海力士下跌 4.23%，原因是市場擔心 AI 的融資問題。Super Micro 盤後上漲約 12.7%，因調高季度營收展望。Lam Research 將於 10/21 盤後公布財報，預期每股盈餘 2.17 美元。", "en": "The Philadelphia Semiconductor Index fell 0.29% to 11,283.81 on Tuesday, giving back part of Monday's rebound, with equipment names lower: Lam Research about -3.21%, KLA about -2.80% and Arm about -3.07%. South Korea's Kospi dropped 3.73% and SK hynix fell 4.23% on worries about AI financing. Super Micro rose about 12.7% after hours on a raised quarterly revenue outlook. Lam Research reports after the close on Oct. 21, with consensus EPS of $2.17.", "url": "https://cappnotes.substack.com/p/closing-look-tuesday-october-20-2026", "stocks": [{"t": "LRCX", "n": "Lam Research，約 -3.21%，10/21 盤後財報預期 EPS 2.17 美元"}, {"t": "KLAC", "n": "KLA，約 -2.80%"}, {"t": "SMCI", "n": "Super Micro，調高營收展望，盤後約 +12.7%"}, {"t": "SOXX", "n": "半導體 ETF，費城半導體指數 -0.29%"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "能源：煉油廠與油服的財報預期正在分岔", "color": "#4EABA4", "zh": "油價維持在高檔（布蘭特約 109 美元），能源族群內部的預期出現分歧：本週四（10/22）Valero 公布財報，預期每股盈餘 21.23 美元，遠高於去年同期的 3.66 美元，反映煉油利潤的暴增；週五（10/23）油服公司 SLB 的預期每股盈餘 0.62 美元，卻低於去年同期的 0.69 美元。油價高不一定帶動所有能源公司，關鍵在公司賺的是價差、還是靠鑽井與服務的量。", "en": "With oil elevated (Brent near $109), expectations inside energy are diverging. Valero reports Thursday Oct. 22 with consensus EPS of $21.23 versus $3.66 a year earlier, reflecting a surge in refining profits, while oilfield services firm SLB reports Friday Oct. 23 with consensus EPS of $0.62 against $0.69 a year earlier. High crude does not lift every energy company equally; what matters is whether a firm earns on spreads or on drilling and service volumes.", "url": "https://www.stocktitan.net/articles/earnings-calendar-week-of-october-19-2026", "stocks": [{"t": "VLO", "n": "Valero，10/22 財報，預期 EPS 21.23 美元（去年同期 3.66 美元）"}, {"t": "SLB", "n": "SLB，10/23 財報，預期 EPS 0.62 美元（去年同期 0.69 美元）"}, {"t": "XLE", "n": "能源類股 ETF"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000 單日 +1.65%，但 IWM 流出 11 億美元", "color": "#5B8ED6", "zh": "羅素 2000 週二上漲約 1.65% 至 2,773.42，領先主要指數；比上週五（10/16）收盤的 2,721.37 高約 1.9%。但追蹤它的 ETF IWM 雖然上漲約 1.66%，當天卻淨流出約 11 億美元，意思是有投資人趁著上漲賣出。指數漲幅與資金流向不一致時，不要只看漲幅就判斷小型股行情已經確立。", "en": "The Russell 2000 rose about 1.65% to 2,773.42 on Tuesday, leading the major indexes and standing about 1.9% above last Friday's 2,721.37 close. Yet the IWM ETF that tracks it, up about 1.66%, still saw roughly $1.1 billion of net outflows, meaning some holders sold into the rally. When price and flows disagree, do not conclude a small-cap uptrend is established from the price move alone.", "url": "https://cappnotes.substack.com/p/closing-look-tuesday-october-20-2026", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，約 +1.66%，淨流出約 11 億美元"}, {"t": "IJR", "n": "標普小型股 600 ETF"}, {"t": "VTWO", "n": "羅素 2000 ETF，另一個追蹤標的"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "併購溢價：Braze 被收購，單日 +51.7%", "color": "#5B8ED6", "zh": "Salesforce 同意以每股 47.50 美元現金收購 Braze，Braze 週二大漲約 51.7%，是全市場漲幅最大的個股之一。中小型股被收購時，收購價相對收購前股價往往有很高的溢價，這也是小型股吸引人的原因之一。但並非每家小型公司都會被收購，市場預期併購的股票若沒有成真，股價也可能回落。", "en": "Salesforce agreed to buy Braze for $47.50 a share in cash, and Braze jumped about 51.7% on Tuesday, one of the biggest gains in the market. When smaller companies are acquired the price usually carries a large premium over the pre-deal price, one reason small caps attract attention. But most small companies are never acquired, and a stock priced for a deal can fall back if none comes.", "url": "https://cappnotes.substack.com/p/closing-look-tuesday-october-20-2026", "stocks": [{"t": "BRZE", "n": "Braze，Salesforce 每股 47.50 美元現金收購，約 +51.7%"}, {"t": "CRM", "n": "Salesforce，收購方"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "判讀：小型股為什麼對利率與銀行財報特別敏感", "color": "#5B8ED6", "zh": "判讀小型股指數時要記得兩件事。第一，羅素 2000 成分公司的借款多為浮動利率，所以對借貸成本的敏感度比大型股高，這也是殖利率下滑日它表現較好的原因之一。第二，指數裡金融股（特別是區域銀行）占比不小，銀行財報會直接影響指數。本週後半有社區銀行與眾多區域銀行公布財報，值得留意淨利差的變化。", "en": "Two things to remember when reading small-cap indexes. First, many Russell 2000 constituents borrow at floating rates, so they are more sensitive to borrowing costs than large caps, one reason they did better on a day when long yields eased. Second, financials, especially regional banks, are a meaningful weight, so bank earnings feed straight into the index. Watch net interest margins as community and regional banks report later this week.", "url": "https://cappnotes.substack.com/p/closing-look-tuesday-october-20-2026", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，對淨利差與財報敏感"}, {"t": "IWM", "n": "羅素 2000 ETF"}, {"t": "SHBI", "n": "Shore Bancshares，社區銀行，10/22 財報"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "MSG Rangers（MSGR）：分拆預發行交易今天開始", "color": "#C9A227", "zh": "MSG Sports 將遊騎兵（Rangers）業務分拆為獨立公司 MSG Rangers，登記日 10/20，每 2 股換 1 股，預發行交易預計今天（10/21）開始，正式交易預計 10/27。分拆股常因被動賣壓與分析師覆蓋不足而被忽視，這就是它的雷達邏輯。風險：仍需 Form 10 生效、聯盟批准與稅務意見，而且公司由杜蘭家族控制，常有治理折價。這是研究線索，不是投資建議。", "en": "MSG Sports is spinning off its Rangers business as MSG Rangers: record date Oct. 20, one new share for every two held, when-issued trading expected today (Oct. 21) and regular trading expected Oct. 27. Spin-offs are often neglected because of passive selling and thin analyst coverage, which is the radar logic. Risks: the Form 10 must still become effective, league approval and tax opinions are pending, and the Dolan-controlled governance often carries a discount. This is a research lead, not investment advice.", "url": "https://insidersport.com/2026/10/01/msg-to-split-knicks-and-rangers/", "stocks": [{"t": "MSGR", "n": "MSG Rangers，遊騎兵分拆，10/21 預發行、10/27 正式交易"}, {"t": "MSGS", "n": "MSG Sports，母公司，分拆後將更名 MSG Knickerbockers（MSGK）"}], "status": "RADAR · 下一個驗證點 10/27 正式交易"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "Shore Bancshares（SHBI）：10/22 財報看淨利差守不守得住 3.70%", "color": "#C9A227", "zh": "Shore Bancshares 是社區銀行，分析師覆蓋稀疏；Simply Wall St 模型估算約 36.6% 折價（僅供參考）。拐點證據有兩項：董事 Esham 在 2 月買進 5,000 股（約 10 萬美元），第二季淨利差上升 6 個基點至 3.70%。風險：第二季淨利差有一部分來自貸款提前還款的一次性收益，內部人買進也不是連續的。明天（10/22）財報是下一個驗證點。這是研究線索，不是投資建議。", "en": "Shore Bancshares is a community bank with sparse analyst coverage; a Simply Wall St model estimates roughly a 36.6% discount (for reference only). Two signals: director Esham bought 5,000 shares (about $100,000) in February, and Q2 net interest margin rose 6 bp to 3.70%. Risks: part of the Q2 margin came from one-time loan prepayment income, and the insider buying was not repeated. The Oct. 22 report tomorrow is the next checkpoint. This is a research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/banks/nasdaq-shbi/shore-bancshares/news/insider-buys-additional-us101k-in-shore-bancshares-stock", "stocks": [{"t": "SHBI", "n": "Shore Bancshares，社區銀行，淨利差 3.70%，10/22 財報"}], "status": "RADAR · 下一個驗證點 10/22 Q3 財報"},

    {"id": "radar_3", "channel": "忽視雷達", "tag": "Bluerock Private Real Estate Fund（BPRE）：董事長連三天買進", "color": "#C9A227", "zh": "BPRE 是 2025 年 12 月在紐約證交所掛牌的私募不動產基金。Ramin Kamfar 於 10/12 至 10/14 分三天買進 427,609 股（約 548 萬美元），Jordan Ruddy 10/14 另買約 4.4 萬美元；Kamfar 的買進是透過他控制的實體。這是封閉式基金的特殊結構：要同時看每日淨值與折價幅度。風險：基金流動性低、折價可能長期存在。下一個驗證點是每日淨值變化與下一輪 Form 4。這是研究線索，不是投資建議。", "en": "BPRE is a private real estate fund listed on the NYSE in December 2025. Ramin Kamfar bought 427,609 shares (about $5.48 million) over three days from Oct. 12 to 14, and Jordan Ruddy added about $44,000 on Oct. 14; Kamfar's buying runs through a controlled entity. As a closed-end-style fund, you need to watch daily net asset value and the discount together. Risks: low liquidity and a discount that can persist. Next checkpoints are daily NAV and the next Form 4 filings. This is a research lead, not investment advice.", "url": "https://amberallocates.substack.com/p/insider-flow-week-of-october-10-17", "stocks": [{"t": "BPRE", "n": "Bluerock Private Real Estate Fund，Kamfar 約 548 萬美元買進"}], "status": "RADAR · 下一個驗證點 每日淨值與折價、下一輪 Form 4"},

    {"id": "insider_2", "channel": "內部人動向", "tag": "判讀：同時、同額的買進，可能只是薪酬計畫", "color": "#6DB56D", "zh": "HEICO 在 10/8 有八位內部人買進，合計約 140 萬美元，其中七位董事與主管各買 795 股 A 類股，但它們是透過遞延薪酬計畫同時執行的相同數量，所以分析者解讀為薪酬計畫驅動，而非八個獨立決定。另外，OneMedNet 兩位內部人認購約 100 萬美元，是以前一日成交量加權均價私募，不是公開市場買進。該來源也提醒：前一批訊號 48 檔中只有 12 檔跑贏大盤，平均超額報酬 -9.7%，樣本很薄。", "en": "At HEICO, eight insiders bought about $1.4 million on Oct. 8, but seven directors and officers each bought an identical 795 Class A shares through a deferred-compensation plan, so the analyst reads it as plan-driven rather than eight independent decisions. At OneMedNet, two insiders subscribed about $1 million at the prior VWAP in a private placement, not open-market buys. The source also cautions that the prior batch of signals saw only 12 of 48 tickers beat the market, with an average excess return of -9.7%, a thin sample.", "url": "https://amberallocates.substack.com/p/insider-flow-week-of-october-10-17", "stocks": [{"t": "HEI", "n": "HEICO，八位內部人透過薪酬計畫買進約 140 萬美元"}, {"t": "ONMD", "n": "OneMedNet，私募認購約 100 萬美元，非公開市場"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "近 90 天眾議院 PTR：Hern 78 筆交易、74 筆是賣出", "color": "#B5654D", "zh": "依眾議院書記官的官方 PTR 彙整，近 90 天申報中，奧克拉荷馬州的 Kevin Hern 共 78 筆交易，其中買進 2 筆、賣出 74 筆，估計金額區間約 138 萬至 390 萬美元，涉及 56 檔，包含 BSX、HD、IQV、OGN；最近一份申報在 10/13，其中有賣出 NEE。這種結構代表的是以賣出為主的調整，並不是在押注特定主題。申報內容只代表申報人當時的部位變動，不是買賣訊號。", "en": "Based on the House Clerk's official PTR filings over the past 90 days, Oklahoma's Kevin Hern reported 78 transactions, 2 buys and 74 sells, in an estimated range of about $1.38 million to $3.9 million across 56 tickers including BSX, HD, IQV and OGN; the latest filing on Oct. 13 included a sale of NEE. A sell-heavy pattern like this reflects portfolio trimming rather than a bet on one theme. The filings only show the filer's positions at the time; they are not trading signals.", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035588.pdf", "stocks": [{"t": "BSX", "n": "波士頓科學，Hern 申報交易的標的之一"}, {"t": "HD", "n": "家得寶，申報交易標的之一"}, {"t": "NEE", "n": "NextEra Energy，Hern 於 10/13 的申報含賣出"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "判讀：看政要持股的三個限制", "color": "#B5654D", "zh": "判讀 PTR 要記得三件事。第一，法規允許最晚在交易後 45 天申報，所以你看到的是舊的部位，跟單者買到的是別人 45 天前的價位。第二，金額只有區間（例如 1,001 至 15,000 美元），沒有精確數字。第三，許多交易是配偶或信託帳戶執行。這個頻道只呈現申報事實與結構，不暗示任何交易動機。", "en": "Three limits when reading PTRs. First, filers have up to 45 days after a trade to report, so you are seeing old positions and anyone copying them buys at prices from 45 days earlier. Second, amounts are ranges only (for example $1,001 to $15,000), not exact figures. Third, many trades are executed by spouses or trusts. This channel presents filing facts and structure only and implies nothing about motives.", "url": "https://www.congressstock.com/", "stocks": [{"t": "SPY", "n": "大盤基準，對照比較用"}]},
