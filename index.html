/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;
    --text-tertiary: #6b6863; --divider: #ddd9d1;
    --noise-opacity: 0.035;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  /* 鍵盤焦點:看得到目前在哪一顆 */
  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }
  .tab-nav button { background: none; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: Georgia, serif; transition: all 0.3s ease; padding: 0; line-height: 1.2; }
  .sub-pill { background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 0 4px; min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; white-space: nowrap; transition: all 0.2s ease; border-bottom: 1px solid transparent; }

  .card-slide { position: absolute; inset: 0; padding: 16px 32px 96px; display: flex; flex-direction: column; justify-content: flex-start; transition: transform 0.3s ease, opacity 0.3s ease; will-change: transform, opacity; overflow-y: auto; }
  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }
  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }
  .source-link { position: relative; display: inline-block; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }

  .nav-btn-lang { padding:10px 11px; font-size:12px; letter-spacing:0.06em; color:var(--text-secondary); min-width:40px; }

  @media (max-width: 420px) { .nav-btn { padding:10px 11px; } .nav-btn-icon { padding:10px 10px; } .nav-btn-lang { padding:10px 8px; min-width:38px; } }
  .nav-btn:hover { border-color:var(--text-secondary); color:var(--text); }
  .nav-btn:active { background:var(--bg-elevated); }
  .nav-btn:disabled { opacity:0.3; cursor:default; border-color:var(--divider); color:var(--text-tertiary); }
  .nav-count { font-family:'Courier New',monospace; font-size:11px; letter-spacing:0.1em; color:var(--text-tertiary); text-transform:uppercase; white-space:nowrap; }
  .sub-row { scrollbar-width: none; }

    {"id": "earn_0", "channel": "財報速報", "tag": "Constellation 今晚盤後", "color": "#E8786A", "zh": "Constellation Brands（STZ）將於週二（10/6）盤後公布 2027 會計年度第二季財報，市場預期每股盈餘 3.56 美元（去年同期 3.63 美元）、營收 25.4 億美元（去年 24.8 億美元）。啤酒業務靠高端化與墨西哥產能擴充維持強勢，但葡萄酒與烈酒業務在第一季銷售下滑 47%，是拖累。法說會安排在週三早上 8 點（美東），今晚的重點是啤酒銷量與全年財測是否下修。", "en": "Constellation Brands (STZ) reports fiscal second-quarter 2027 results after the close on Tuesday (Oct. 6). The consensus is $3.56 a share (versus $3.63 a year ago) on revenue of $2.54 billion (versus $2.48 billion). Beer is holding up on premiumization and added Mexican capacity, but wine and spirits sales fell 47% in the first quarter and remain a drag. The call is at 8 a.m. ET Wednesday; tonight the focus is beer volume and any change to the full-year outlook.", "url": "https://finance.yahoo.com/markets/stocks/articles/constellation-brands-pre-q2-earnings-141600904.html", "stocks": [{"t": "STZ", "n": "週二盤後公布，預期 EPS 3.56 美元、營收 25.4 億美元"}, {"t": "TAP", "n": "同為啤酒股，可對照消費者啤酒需求"}, {"t": "BF-B", "n": "烈酒與葡萄酒同業，對照酒類需求"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "Schneider 收購 PTC", "color": "#E8786A", "zh": "法國施耐德電氣（Schneider Electric）宣布以每股 205 美元全現金收購美國工業軟體公司 PTC，股權價值約 226 億美元，較 PTC 宣布前收盤價溢價 42.3%。施耐德股價當天重挫逾 7%，因為資金安排包含 50 至 60 億歐元新股與 160 至 170 億歐元新債。公司預期第三年可帶來 2.5 億歐元年度成本綜效與約 8 億歐元營收綜效。這是把設計工程軟體與工廠、能源設備資料串接的賭注。", "en": "France's Schneider Electric agreed to buy US industrial software company PTC for $205 a share in cash, valuing the equity at about $22.6 billion, a 42.3% premium to PTC's last close before the announcement. Schneider shares fell more than 7% as the financing includes EUR 5-6 billion of new equity and EUR 16-17 billion of new debt. The company expects EUR 250 million of annual cost synergies by year three and about EUR 800 million of revenue synergies. It is a bet on linking design-engineering software with factory and energy-equipment data.", "url": "https://www.mdm.com/news/top-distributor-sectors/electrical/schneider-electric-to-acquire-ptc-in-22-6b-industrial-software-deal/", "stocks": [{"t": "PTC", "n": "被收購標的，每股 205 美元現金，溢價 42.3%"}, {"t": "ADSK", "n": "設計軟體同業，可對照工程軟體估值"}, {"t": "EMR", "n": "工業自動化同業，工業軟體整併的參照"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "SpaceX 與 TSMC", "color": "#E8786A", "zh": "SpaceX（SPCX）週一上漲約 7.6%，起因是執行長馬斯克證實正與台積電討論合作：由台積電興建並營運一座晶片廠，專供 Tesla、SpaceX 與 xAI，他也強調「只是討論」。摩根士丹利分析師維持加碼評等與 300 美元目標價，認為以 2028 年的成長調整本益比看股價偏低。這是一則尚未簽約的消息，執行面（太空資料中心）仍是最大不確定性。", "en": "SpaceX (SPCX) rose about 7.6% on Monday after CEO Elon Musk confirmed talks with TSMC on building and operating a chip fab that would supply chips exclusively to Tesla, SpaceX and xAI, though he stressed they are only discussions. Morgan Stanley kept an Overweight rating and a $300 price target, arguing the stock looks cheap on 2028 growth-adjusted multiples. Nothing is signed, and execution on the space data-center vision remains the biggest uncertainty.", "url": "https://www.fool.com/investing/2026/10/05/why-spacex-stock-took-flight-today/", "stocks": [{"t": "SPCX", "n": "週一漲約 7.6%，大摩加碼評等、目標價 300 美元"}, {"t": "TSM", "n": "洽談中的代工夥伴，尚未簽約"}, {"t": "TSLA", "n": "洽談中的專屬晶片客戶之一"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "非農 2.9 萬人", "color": "#7C6AF7", "zh": "9 月非農只新增 2.9 萬人，遠低於預期的 8.4 萬人，失業率升至 4.2%（預期 4.1%），前兩個月數字也被下修。報導指 Fed 已把基準利率升至 3.75% 至 4.00%（一致 12 比 0 通過），所以數據一出，市場把 10 月再升息的機率壓到約兩成。矛盾在於就業降溫的同時通膨壓力仍在，Fed 面對的是「停滯性」的兩難，而不是單純的景氣降溫。", "en": "September nonfarm payrolls rose by only 29,000 against an expected 84,000, while unemployment climbed to 4.2% (expected 4.1%) and the prior two months were revised lower. The Fed is reported to have lifted its policy rate to 3.75%-4.00% on a unanimous 12-0 vote, so after the data markets cut the odds of another October hike to roughly one in five. The tension is that hiring is cooling while inflation pressure persists, leaving the Fed with a stagflation-style dilemma rather than a simple slowdown.", "url": "https://www.heygotrade.com/en/news/weekly-economic-outlook-2026-10-05/", "stocks": [{"t": "SHY", "n": "1 至 3 年期公債 ETF，對 10 月升息預期最敏感"}, {"t": "XLF", "n": "金融板塊，受利率與信用循環雙重影響"}, {"t": "XRT", "n": "零售板塊 ETF，對就業與消費力敏感"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "週三 Fed 會議紀要", "color": "#7C6AF7", "zh": "週三（10/7）公布 9 月 FOMC 會議紀要，被視為本週最重要的事件。市場要找的是委員對再升息的態度：有多少人認為仍需要升息、對油價推升通膨的評估，以及對勞動市場轉弱的看法。紀要是會議後三週才公布的文字紀錄，反映的是當時的討論，而不是最新立場，但在非農意外偏弱之後，字句的鷹派程度會被放大解讀。", "en": "The minutes of the September FOMC meeting are due Wednesday (Oct. 7) and are the most important event of the week. Markets will look for how many officials still see a need to raise rates, how they assess oil-driven inflation, and how they read the weakening labor market. The minutes record discussion from three weeks ago rather than current positions, but after a soft payroll surprise their hawkish tone will be read closely.", "url": "https://www.heygotrade.com/en/news/weekly-economic-outlook-2026-10-05/", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，對紀要語氣最敏感"}, {"t": "UUP", "n": "美元指數 ETF，利率預期變動的反映"}, {"t": "GLD", "n": "黃金 ETF，實質利率預期的對照"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "殖利率 5% 以上", "color": "#7C6AF7", "zh": "十年期美債殖利率在 5.26% 至 5.31% 之間，是今年的高檔區，週一的變動不大（各來源回報約 3 個基點），但水位本身就是壓力。報導形容這是「成長股創高、無風險利率居高不下」的罕見背離。殖利率高於 5% 對房貸、銀行持有債券的未實現損失、以及高估值股票的折現都有影響；若會議紀要偏鷹，這個背離最可能以股價修正收斂。", "en": "The 10-year Treasury yield sat between 5.26% and 5.31%, a high for the year; Monday's move was small (about 3 basis points in the reports), but the level itself is the pressure. Coverage called it an unusual divergence between growth stocks at records and a persistently high risk-free rate. Yields above 5% matter for mortgages, for unrealized losses on bank bond holdings and for discounting richly valued stocks; if the minutes lean hawkish, the divergence is most likely to close through lower equity prices.", "url": "https://tradingeconomics.com/united-states/government-bond-yield", "stocks": [{"t": "IEF", "n": "7 至 10 年期公債 ETF，殖利率走高時承壓"}, {"t": "KRE", "n": "區域銀行 ETF，對債券未實現損失敏感"}, {"t": "ITB", "n": "房屋建築 ETF，對房貸利率敏感"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "AI 與晶片供應鏈", "color": "#4EABA4", "zh": "週一創高的那斯達克由 AI 相關股領軍，連輝達也在報導中創下新高；SpaceX 與台積電的晶片廠討論，則把話題延伸到專屬晶片供應。這條線的邏輯是 AI 算力需求還在把資本支出往上拉，受惠的不只 GPU，還有晶圓代工與先進封裝。風險是漲幅集中在少數股票，一旦殖利率再上沖，估值最高的部位最先承受壓力。", "en": "Monday's Nasdaq record was led by AI-linked names, with Nvidia also reported at a record, and SpaceX's talks with TSMC on a dedicated fab extend the theme to captive chip supply. The logic is that AI compute demand keeps pulling capital spending higher, benefiting not just GPUs but foundries and advanced packaging. The risk is that gains are concentrated in a few stocks, and if yields push higher again the richest valuations feel it first.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-october-5-dow-sp-500-nasdaq-081220790.html", "stocks": [{"t": "NVDA", "n": "報導稱週一創歷史新高"}, {"t": "TSM", "n": "洽談為 Tesla、SpaceX、xAI 設專屬晶片廠"}, {"t": "SMH", "n": "半導體 ETF，晶片鏈的整體表現"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "能源：高檔整理", "color": "#4EABA4", "zh": "截至 10/2 的一週，能源板塊約上漲 0.66%，但在一份板塊輪動模型中相對強度排名下滑到第八，屬於強勢趨勢中的短線回檔。油價推升使能源業獲利預期上修，但荷莫茲海峽的消息讓價格方向反覆。能源股的邏輯是現金流與庫藏股，真正要看的是油價在 90 至 100 美元之間能守多久，而不是單日漲跌。", "en": "In the week to Oct. 2 the energy sector gained about 0.66%, but in one sector-rotation model its relative-strength rank slipped to eighth, a short-term pullback within a strong trend. Higher oil has lifted earnings estimates, yet Hormuz headlines keep the price direction choppy. The energy case rests on cash flow and buybacks, so what matters is how long oil holds between $90 and $100, not a single day's move.", "url": "https://capitalregimeintelligence.substack.com/p/weekly-sector-rotation", "stocks": [{"t": "XLE", "n": "能源板塊 ETF，一週約 +0.66%，相對強度回檔"}, {"t": "OXY", "n": "油價敏感度高的探勘生產商"}, {"t": "VLO", "n": "煉油商，油價與裂解價差並看"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "公用與地產墊底", "color": "#4EABA4", "zh": "同一份板塊輪動模型顯示，不動產、非必需消費與公用事業排在最後三名，公用事業被標為「避開」。原因單純：十年期殖利率在 5.3% 附近，高股息、高槓桿的類債券板塊最難與公債競爭。若 Fed 紀要偏鴿、殖利率回落，這些板塊的反彈空間最大，但在那之前，它們是利率壓力的第一線。", "en": "The same sector-rotation model ranks real estate, consumer discretionary and utilities in the bottom three, with utilities rated Avoid. The reason is simple: with the 10-year near 5.3%, high-yield, high-leverage bond proxies struggle most to compete with Treasuries. If the Fed minutes lean dovish and yields fall these sectors have the most room to rebound, but until then they are on the front line of rate pressure.", "url": "https://capitalregimeintelligence.substack.com/p/weekly-sector-rotation", "stocks": [{"t": "XLU", "n": "公用事業 ETF，被模型列為避開"}, {"t": "XLRE", "n": "不動產 ETF，利率敏感度高"}, {"t": "XLY", "n": "非必需消費 ETF，排名後段"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000：沒有方向", "color": "#5B8ED6", "zh": "週一羅素 2000 約收 2,847（+0.5%），另一來源回報為 2,832.90（+0.94%），兩者落差來自資料時點，結論是小型股漲幅落後那斯達克的 1.05%。有一則快訊的標題寫道，那斯達克創高、道瓊下跌之際小型股「仍無方向」。小型股的負債多為浮動利率，殖利率在 5% 以上時，非農偏弱帶來的降息預期是否能延續，比單日漲跌重要。", "en": "The Russell 2000 closed near 2,847 (+0.5%) on Monday, while another source reported 2,832.90 (+0.94%); the gap reflects data timing, but either way small caps lagged the Nasdaq's 1.05% gain. One flash headline described small caps as still directionless while the Nasdaq hit a record. Small-cap debt is largely floating-rate, so with yields above 5% whether the softer payrolls translate into lower rate expectations matters more than one day's move.", "url": "https://www.kucoin.com/news/flash/nasdaq-hits-new-high-dow-falls-small-cap-stocks-remain-directionless", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，漲幅落後那指"}, {"t": "IJR", "n": "標普小型 600 ETF，品質較高的小型股對照"}, {"t": "VTWO", "n": "羅素 2000 的另一檔 ETF，可對照追蹤差異"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "區域銀行財報倒數", "color": "#5B8ED6", "zh": "區域銀行的第三季財報即將登場，看點是淨利差（放貸收益減存款成本）能否擴張。LCNB 第二季淨利息收入 1,979 萬美元（去年同期 1,754 萬），淨利 749 萬美元（去年 592 萬），是一個正面案例。但長天期殖利率在 5% 以上，銀行持有債券的未實現損失可能再擴大，所以銀行股常在財報前就先反映利率。", "en": "Regional banks are about to report third-quarter results, and the key is whether net interest margin expands. LCNB is a positive example: second-quarter net interest income was $19.79 million (versus $17.54 million) and net income $7.49 million (versus $5.92 million). With long yields above 5%, unrealized losses on bank bond holdings may widen again, so bank stocks often price in rates before earnings.", "url": "https://simplywall.st/stocks/us/capital-goods/nasdaq-flnc/fluence-energy/news/undervalued-small-caps-with-insider-activity-to-explore-in-o-2", "stocks": [{"t": "LCNB", "n": "市值約 1.8 億美元，第二季淨利 749 萬美元"}, {"t": "KRE", "n": "區域銀行 ETF，銀行股整體表現"}, {"t": "FRST", "n": "雷達池內的社區銀行，同屬 10 月下旬財報"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "社區銀行的估值", "color": "#5B8ED6", "zh": "German American Bancorp（GABC）是一個中型社區銀行的例子：本益比約 12.9 倍，第二季淨利息收入 8,100 萬美元（去年 7,300 萬），淨利 3,800 萬美元（去年 3,100 萬），第三方估值模型認為股價較合理價低約 29%。要注意「低於合理價」是模型輸出，不是事實；銀行的估值最終看淨利差與信用品質，這兩項都要等下一份財報確認。", "en": "German American Bancorp (GABC) is an example of a mid-sized community bank: a price-to-earnings ratio near 12.9, second-quarter net interest income of $81 million (versus $73 million) and net income of $38 million (versus $31 million). A third-party valuation model puts the stock about 29% below fair value. That is model output, not fact; bank valuations ultimately rest on net interest margin and credit quality, both of which need the next report to confirm.", "url": "https://simplywall.st/stocks/us/banks/nasdaq-hwbk/hawthorn-bancshares/news/exploring-october-2026s-undervalued-small-caps-with-insider", "stocks": [{"t": "GABC", "n": "第二季淨利 3,800 萬美元，本益比約 12.9 倍"}, {"t": "LCNB", "n": "同屬社區銀行，第二季淨利 749 萬美元"}, {"t": "XLF", "n": "金融板塊 ETF，相對強度偏弱"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "浮動利率的小型股", "color": "#5B8ED6", "zh": "判讀小型股要看債務結構：羅素 2000 中有相當比例公司的借款是浮動利率，基準利率或市場利率一上升，利息費用會很快反映在獲利上，這是常被稱為「浮動利率債務陷阱」的風險。反過來說，一旦利率回落，這類公司獲利彈性最大。同時小型股流動性較差，買賣價差大，資訊也較少，所以同一個催化事件造成的股價波動往往比大型股更劇烈。", "en": "Reading small caps starts with the debt structure: a meaningful share of Russell 2000 companies borrow at floating rates, so higher rates feed into interest expense and earnings quickly, a risk often called the floating-rate debt trap. Conversely, when rates fall these companies have the most earnings leverage. Small caps are also less liquid, with wider spreads and less research coverage, so the same catalyst often moves their prices more violently than large caps.", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment", "stocks": [{"t": "VB", "n": "小型股 ETF，浮動利率負債比重高"}, {"t": "IWC", "n": "微型股 ETF，流動性更差的一端"}, {"t": "IWN", "n": "羅素 2000 價值型 ETF，與成長型對照"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "指數納入效應", "color": "#5B8ED6", "zh": "Workiva（WK）宣布自 10/6 起納入標普小型 600 指數，盤前股價明顯走高，這是典型的指數納入效應：追蹤指數的基金必須買進，價格在納入日前後被推升。這類漲幅來自被動買盤，不是公司基本面改變，納入日後常出現回吐。看這類新聞時，先問上漲的原因是需求被迫產生，還是事業本身變好。", "en": "Workiva (WK) will join the S&P SmallCap 600 index effective Oct. 6 and traded sharply higher in premarket, a classic index-inclusion effect: funds tracking the index must buy, pushing the price around the inclusion date. The gain comes from passive demand rather than a change in the business, and it often partly reverses afterward. With such news, ask whether the move comes from forced buying or from a better business.", "url": "https://stockanalysis.com/markets/premarket/", "stocks": [{"t": "WK", "n": "10/6 起納入標普小型 600，盤前走高"}, {"t": "IJR", "n": "追蹤標普小型 600 的 ETF，被動買盤的來源"}, {"t": "SPSM", "n": "另一檔標普小型 600 ETF"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "Hawthorn：CFO 與董事買進", "color": "#C9A227", "zh": "Hawthorn Bancshares（HWBK）是密蘇里州的社區銀行控股公司。為什麼被忽視：市值小、賣方覆蓋少。什麼正在改變：第二季淨利 733 萬美元（去年同期 610 萬）；董事 Hettinger 在 8/26、8/27 公開市場買進（均價約 38.75 與 38.20 美元），CFO Guthrie 買進 3,000 股、約 7.15 萬美元，持股增加近 59%；報導指近三年內部人只買不賣。風險是五年盈餘成長為負、單季呆帳沖銷 13.8 萬美元顯示信用品質仍需追蹤，且 CFO 的買進金額小。這是研究線索，不是投資建議。", "en": "Hawthorn Bancshares (HWBK) is a Missouri community bank holding company. Why it is neglected: small market cap and thin analyst coverage. What is changing: second-quarter net income was $7.33 million (versus $6.1 million); director Hettinger bought on the open market on Aug. 26-27 (about $38.75 and $38.20 a share), and CFO Guthrie bought 3,000 shares, about $71,500, raising his stake nearly 59%; coverage says insiders have only bought, never sold, in three years. Risks: earnings growth has been negative over five years, a $138,000 charge-off shows credit quality needs watching, and the CFO purchase is small. This is a research lead, not investment advice.", "url": "https://www.benzinga.com/quote/HWBK/ownership", "stocks": [{"t": "HWBK", "n": "第二季淨利 733 萬美元，本益比約 10.4 倍，近三年內部人無賣出"}], "status": "RADAR · 下一個驗證點 10 月底 Q3 財報"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "Fluence：董事在低點買進", "color": "#C9A227", "zh": "Fluence Energy（FLNC）是電池儲能系統供應商，股價今年下跌逾 60%、接近 52 週低點 7.01 美元。董事 Herman Bulls 在 9/21 以每股 7.36 美元買進 1 萬股（約 7.36 萬美元），另一位董事 Harald von Heynitz 以同價買進 7,000 股，形成董事群聚。基本面並不乾淨：全年營收指引下修到 24 億美元，且有生產延遲、供應鏈與法律問題；單筆買進金額也不大。這家公司不算「無人關注」，所以只能算半個雷達線索，是研究線索而非投資建議。", "en": "Fluence Energy (FLNC) supplies battery energy storage systems; the stock is down more than 60% this year, near its 52-week low of $7.01. Director Herman Bulls bought 10,000 shares at $7.36 on Sept. 21 (about $73,600), and director Harald von Heynitz bought 7,000 shares at the same price, forming a director cluster. The fundamentals are not clean: full-year revenue guidance was cut to $2.4 billion amid production delays, supply-chain issues and legal matters, and the purchases are small. It is not truly unwatched, so this is only a partial radar lead, a research lead rather than investment advice.", "url": "https://www.marketbeat.com/instant-alerts/insider-fluence-energy-nasdaq-flnc-director-herman-bulls-acquires-10000-shares-of-stock-2026-09-22/", "stocks": [{"t": "FLNC", "n": "股價年內約 -60%，兩位董事 9/21 以 7.36 美元買進"}], "status": "RADAR · 下一個驗證點 下一季財報與全年指引"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "Ethan Allen：零負債的家具商", "color": "#C9A227", "zh": "池內追蹤：Ethan Allen（ETD）是北美中高價位家具的設計、製造與零售商。為什麼被忽視：家具與房市連動、賣方覆蓋薄。已知證據：截至 6/30 當季營收 1.468 億美元、調整後毛利率 59.7%，年底零負債、現金與投資 1.875 億美元，並同時宣布特別股利與常規股利。下一個驗證點是 10/28 的 FY2027 第一季財報，只看營收能否止跌；營收若再降一階，「無債加高毛利」就只是縮小中的公司。今日沒有新消息，是研究線索而非投資建議。", "en": "Pool follow-up: Ethan Allen (ETD) designs, makes and retails mid-to-high-priced furniture in North America. Why neglected: furniture tracks the housing cycle and coverage is thin. Known evidence: quarter to June 30 revenue of $146.8 million, adjusted gross margin of 59.7%, no debt at year-end and $187.5 million of cash and investments, plus a special and a regular dividend. The next test is fiscal first-quarter 2027 results on Oct. 28, where only revenue stabilization matters; if sales fall another step, no debt and high margin just describes a shrinking company. No new news today; this is a research lead, not investment advice.", "url": "https://finance.yahoo.com/quote/ETD/", "stocks": [{"t": "ETD", "n": "10/28 公布 FY2027 第一季，看營收能否止跌"}], "status": "RADAR · 下一個驗證點 10/28 財報"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "ISSC：毛利率能否守住 50%", "color": "#C9A227", "zh": "池內追蹤：Innovative Solutions and Support（ISSC）做飛機顯示器、大氣數據系統與自動駕駛儀，商業模式是收購大廠不想經營的產品線。為什麼被忽視：市值不到十億美元、覆蓋極少。已知證據：上一季營收 2,670 萬美元（年增約 11%），毛利率從 35.6% 跳到 51.7%，管理層給下一季營收指引 2,800 至 3,000 萬美元。下一個驗證點是 10 月的 FQ4 財報，只看毛利率能否守在 50% 以上。今日沒有新消息，風險是成長靠併購、客戶集中、流動性差，是研究線索而非投資建議。", "en": "Pool follow-up: Innovative Solutions and Support (ISSC) makes aircraft displays, air data systems and autopilots, and its model is acquiring product lines that larger avionics makers no longer want to run. Why neglected: market cap under $1 billion and very thin coverage. Known evidence: last quarter revenue was $26.7 million (up about 11%) and gross margin jumped from 35.6% to 51.7%, with next-quarter revenue guided at $28-30 million. The next test is October's fiscal fourth-quarter report, where only whether margin holds above 50% matters. No new news today; risks are acquisition-led growth, customer concentration and poor liquidity. A research lead, not investment advice.", "url": "https://finance.yahoo.com/quote/ISSC/", "stocks": [{"t": "ISSC", "n": "毛利率 51.7%，10 月 FQ4 財報看能否守住 50%"}], "status": "RADAR · 下一個驗證點 10 月 FQ4 財報"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "Insperity：執行長三度買進", "color": "#C9A227", "zh": "池內追蹤：Insperity（NSP）是專業僱主組織（PEO），替中小企業代管薪資、福利與健保。為什麼被忽視：健保成本通膨讓整個族群重訂價，股價自高點腰斬。已知證據：執行長 Sarvadi 在 2026 年於公開市場三度買進（3 月約 460 萬美元、5 月約 287 萬美元、6 月約 793 萬美元）。公司對第三季的指引是平均付薪員工 30.55 萬至 30.75 萬人，調整後每股盈餘介於虧損 9 美分到獲利 41 美分，區間很寬；估計 11/2 公布財報。風險是只有一位內部人買進，且股價尚未止穩。是研究線索而非投資建議。", "en": "Pool follow-up: Insperity (NSP) is a professional employer organization that runs payroll, benefits and health plans for small businesses. Why neglected: health-cost inflation forced the whole group to reprice and the stock is down about half from its high. Known evidence: CEO Sarvadi bought on the open market three times in 2026 (about $4.6 million in March, $2.87 million in May and $7.93 million in June). Third-quarter guidance is 305,500-307,500 average paid employees and adjusted EPS from a loss of 9 cents to a profit of 41 cents, a wide range; earnings are estimated for Nov. 2. Risks: only one insider is buying and the stock has not stabilized. A research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/commercial-services/nyse-nsp/insperity/news/why-insperity-nsp-is-down-51-after-narrow-2026-profit-outloo", "stocks": [{"t": "NSP", "n": "執行長 2026 年三度公開市場買進，預計 11/2 財報"}], "status": "RADAR · 下一個驗證點 約 11/2 Q3 財報"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "Honeywell Aerospace 分拆股", "color": "#C9A227", "zh": "池內追蹤：Honeywell Aerospace（HONA）於 6/29 自 Honeywell 分拆獨立掛牌。為什麼被忽視：分拆股的結構性孤兒，舊的分析師模型需重建、指數基金被迫賣出。已知證據：Q2 營收 45 億美元（年增 5%），管理層把獲利未達標歸因於供應鏈產能限制；風險是全年有機營收成長財測自 7% 至 9% 下修到 4% 至 5%、8/6 當天股價重挫逾 20%，且下修一次的公司常有第二次。下一個驗證點是 10 月底的 Q3 財報，看出貨瓶頸是否緩解。今日沒有新消息，是研究線索而非投資建議。", "en": "Pool follow-up: Honeywell Aerospace (HONA) was spun off from Honeywell and listed on June 29. Why neglected: spin-offs are structural orphans, with old analyst models needing a rebuild and index funds forced to sell. Known evidence: second-quarter revenue was $4.5 billion (up 5%), and management blamed the earnings shortfall on supply-chain capacity limits. Risks: full-year organic growth guidance was cut from 7%-9% to 4%-5%, the stock fell more than 20% on Aug. 6, and companies that cut once often cut again. The next test is the late-October third-quarter report, where the question is whether shipment bottlenecks ease. No new news today; a research lead, not investment advice.", "url": "https://finance.yahoo.com/quote/HONA/", "stocks": [{"t": "HONA", "n": "6/29 分拆獨立，10 月底 Q3 財報看出貨瓶頸"}], "status": "RADAR · 下一個驗證點 10 月底 Q3 財報"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "Ryan Cohen 再買 70 萬股", "color": "#6DB56D", "zh": "GameStop（GME）執行長兼董事長 Ryan Cohen 在 10/2 於公開市場買進 70 萬股，加權均價 24.4061 美元，約 1,708 萬美元，買進後直接持有 41,648,522 股，約占已發行股數 8.9%（13D/A 揭露）。這次增持約為其原有部位的 1.7%，金額對他個人而言是加碼而非重押。判讀提醒：Cohen 是控制性大股東，買進同時兼具表態與控股意味，不能直接等同一般高階主管的信心訊號。", "en": "GameStop (GME) CEO and chairman Ryan Cohen bought 700,000 shares on the open market on Oct. 2 at a weighted average of $24.4061, about $17.08 million, leaving him with 41,648,522 shares held directly, roughly 8.9% of shares outstanding per the 13D/A. The purchase is about 1.7% of his prior position, an add rather than a big bet. Caution: Cohen is a controlling shareholder, so the buy mixes signaling with control, and it cannot be read like an ordinary executive's confidence signal.", "url": "https://www.sec.gov/Archives/edgar/data/0001326380/000092189526002719/form413177018_10022026.xml", "stocks": [{"t": "GME", "n": "Cohen 10/2 買進 70 萬股，均價 24.41 美元，持股約 8.9%"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "群聚買進的幾個樣本", "color": "#6DB56D", "zh": "近期 Form 4 中的幾個樣本：Auburn National Bancorporation（AUBN）有多位董事在 9/30 買進，屬於群聚；Sky Harbour（SKYH）財務長 Francisco Gonzalez 於 10/2 以每股 9.25 美元買進 3,850 股（約 3.56 萬美元）；巴西銀行 Bradesco（BBD）董事 Denise Aguiar Alvarez 於 10/5 以 17.22 美元買進 195 萬股（約 3,358 萬美元），資料站稱這使其持股增加約 30%。資料來自第三方整理，細節請以 SEC 或當地申報原文為準。", "en": "A few recent Form 4 samples: several directors at Auburn National Bancorporation (AUBN) bought on Sept. 30, a cluster; Sky Harbour (SKYH) CFO Francisco Gonzalez bought 3,850 shares at $9.25 on Oct. 2 (about $35,600); and Bradesco (BBD) director Denise Aguiar Alvarez bought 1.95 million shares at $17.22 on Oct. 5 (about $33.58 million), which the data site says raised her holding by about 30%. The data come from a third-party aggregator, so check the SEC or local filings for details.", "url": "https://insiders.data-tracking.net/", "stocks": [{"t": "AUBN", "n": "多位董事 9/30 買進，群聚訊號"}, {"t": "SKYH", "n": "財務長 10/2 買進 3,850 股，金額小"}, {"t": "BBD", "n": "董事 10/5 買進 195 萬股，約 3,358 萬美元"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "怎麼看買進的分量", "color": "#6DB56D", "zh": "同樣是「內部人買進」，訊號強度差很多。可以問三件事：買進金額占他原有部位多少（Hawthorn 財務長買進使持股增加近 59%，Cohen 這次約 1.7%）；是群聚還是單人（Fluence 兩位董事同價買進，Insperity 只有執行長一人）；買的是公開市場還是選擇權行使或股票獎勵。還要記得股價下跌時內部人買進未必能抓到底部，Insperity 執行長自 3 月起一路買進，股價至今尚未止穩。", "en": "Not all insider buying carries the same signal. Ask three questions: what share of his existing position the purchase represents (Hawthorn's CFO raised his stake nearly 59%, Cohen's latest buy is about 1.7%); whether it is a cluster or one person (two Fluence directors bought at the same price, only the CEO at Insperity); and whether it is an open-market buy rather than an option exercise or stock award. Remember insider buying does not necessarily catch the bottom: Insperity's CEO has bought since March and the stock has yet to stabilize.", "url": "http://openinsider.com/", "stocks": [{"t": "HWBK", "n": "財務長買進使持股增加近 59%"}, {"t": "NSP", "n": "執行長 2026 年三度買進，仍未止穩"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "Sessions 賣出 AAPL", "color": "#B5654D", "zh": "10/1 申報的眾議院交易中，議員 Pete Sessions 賣出 AAPL，金額區間 10 萬至 25 萬美元；另一位議員 David Taylor 賣出 MPC、買進 HD 與 AMGN（各 1,000 至 15,000 美元）。這批交易的資訊量很低：單一股票的賣出看不出背後主題，小額買進更像例行調整。值得記得的只有一件事，申報是交易日（9/23）之後約一週才出現，而法定上限是 45 天。", "en": "Among House trades filed Oct. 1, Rep. Pete Sessions sold AAPL in the $100,000-$250,000 range, and Rep. David Taylor sold MPC and bought HD and AMGN ($1,000-$15,000 each). The information content is low: a single-stock sale does not reveal a theme and small buys look like routine rebalancing. One thing worth remembering is that the filing appeared about a week after the Sept. 23 trade date, while the legal limit is 45 days.", "url": "https://www.congressstock.com/trades", "stocks": [{"t": "AAPL", "n": "Sessions 賣出，區間 10 萬至 25 萬美元"}, {"t": "MPC", "n": "Taylor 賣出，區間 1,000 至 15,000 美元"}, {"t": "HD", "n": "Taylor 買進，區間 1,000 至 15,000 美元"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "判讀：金額只有區間", "color": "#B5654D", "zh": "政要持股的判讀提醒：第一，申報金額只有寬區間（例如 1,001 至 15,000 美元），無法還原真實部位，也看不出占其資產多少；第二，很多交易由配偶或信託帳戶執行，不一定反映本人決定；第三，申報可晚至 45 天，跟單者買到的是別人一個半月前的價位。這些資料適合用來觀察哪些主題被關注，不適合當作買賣訊號。", "en": "Reading politician holdings: first, amounts are reported only in wide ranges (for example $1,001-$15,000), so true positions and their share of a member's assets cannot be reconstructed; second, many trades are made by spouses or trust accounts and may not reflect the member's own decision; third, filings can lag up to 45 days, so anyone copying buys at a price set a month and a half earlier. The data are better for seeing which themes draw attention than as a buy or sell signal.", "url": "https://www.quiverquant.com/congresstrading/", "stocks": [{"t": "AMGN", "n": "Taylor 10/1 申報買進，小額區間"}, {"t": "VOO", "n": "跟單績效常拿來對照的大盤基準"}]},
