<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;

  [data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #6a6663; --divider: #2e2a24;

  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;

  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }

  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }

  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }
  .tab-nav button { background: none; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: Georgia, serif; transition: all 0.3s ease; padding: 0; line-height: 1.2; }
  .sub-pill { background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 0; transition: all 0.2s ease; border-bottom: 1px solid transparent; }
  .swipe-area { position: relative; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .card-slide { position: absolute; inset: 0; padding: 16px 32px 80px; display: flex; flex-direction: column; justify-content: flex-start; transition: transform 0.3s ease, opacity 0.3s ease; will-change: transform, opacity; overflow-y: auto; }
  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .source-link { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }
  .source-link:hover { color: var(--text-secondary); border-color: var(--text-secondary); }
  .end-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; height: 100%; }
  .end-btn { padding: 12px 28px; background: none; border: 1px solid var(--divider); color: var(--text-tertiary); font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; transition: all 0.25s ease; }
  .end-btn:hover { border-color: var(--text-secondary); color: var(--text-secondary); }

  .word-popup-trans { font-family: system-ui, -apple-system, 'PingFang TC', sans-serif; font-size: 14px; color: var(--text-secondary); line-height: 1.6; font-weight: 300; }
  .speak-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--text-tertiary); padding: 2px; transition: color 0.2s; line-height: 1; }

  .az-input { width:100%; background:var(--bg); border:1px solid var(--divider); color:var(--text); padding:7px 10px; font-family:'Courier New',monospace; font-size:11px; outline:none; -webkit-appearance:none; appearance:none; border-radius:0; }

  .nav-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; gap:6px; padding:10px 16px 14px; background:var(--bg); border-top:1px solid var(--divider); z-index:50; }
  .nav-btn { background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:16px; cursor:pointer; padding:10px 18px; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; line-height:1; }
  .nav-btn-icon { padding:10px 14px; font-size:13px; }
  .nav-btn-icon.playing { border-color:var(--text); color:var(--text); }
  .nav-btn-lang { padding:10px 11px; font-size:11px; letter-spacing:0.08em; color:var(--text-tertiary); min-width:38px; }
  .nav-btn-lang:hover { color:var(--text-secondary); }
  @media (max-width: 420px) { .nav-btn { padding:10px 11px; } .nav-btn-icon { padding:10px 10px; } .nav-btn-lang { padding:10px 8px; min-width:34px; } }
  .nav-btn:hover { border-color:var(--text-secondary); color:var(--text); }
  .nav-btn:active { background:var(--bg-elevated); }
  .nav-btn:disabled { opacity:0.25; cursor:default; border-color:var(--divider); color:var(--text-tertiary); }

<body data-theme="light">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
  const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "最強一週", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普500 ETF，指數週五收 7,757.64 創收盤新高，全週漲 3.6%"}, {"t": "QQQ", "n": "那斯達克100 ETF，那指全週漲 5.2% 收 26,690.62"}, {"t": "DIA", "n": "道瓊 ETF，全週漲近 3% 收 54,036.93"}], "en": "Weekend recap, with the week as the unit rather than the day. The S&P 500 gained 3.6% over the five sessions to a record close of 7,757.64, the Nasdaq 5.2% to 26,690.62 and the Dow nearly 3% to 54,036.93 — the strongest week for all three since mid-April. The shape underneath matters more than the totals. The Nasdaq 100 rebounded more than 10% from the low it made during the previous week's clearing event, which means a large part of this was recovering ground rather than breaking new ground. Three things did the work: a run of corporate results that held up, economic data soft enough to take a September hike off the table, and a mid-week drop in oil that eased yields. None of those three is a structural change; all three are conditions that can reverse.", "zh": "週末回顧，把單位放大到「一週」而不是「一天」來看。標普 500 在五個交易日裡漲 3.6%，收在 7,757.64 的收盤新高;那斯達克漲 5.2% 收 26,690.62;道瓊漲近 3% 收 54,036.93——三大指數都是 4 月中以來最強的一週。底下的形狀比總數更重要:那斯達克 100 是從前一週那次清洗事件的低點反彈超過 10%，也就是說這一週有很大一部分是在收復失土，而不是在開疆闢土。推動它的是三件事:企業財報整體撐住、經濟數據軟到足以把 9 月升息拿掉、以及週中油價下跌讓殖利率跟著鬆開。這三件沒有一件是結構性的改變，三件都是可以反轉的條件。", "url": "https://www.ig.com/ae/news-and-trade-ideas/week-ahead-august-10th-2026-260807"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "創高週的輸家", "color": "#E05C5C", "stocks": [{"t": "DDOG", "n": "Datadog，第三季指引 11.35 至 11.45 億美元僅小幅超過市場的 11.1 億，單日重挫 16%"}, {"t": "HON", "n": "Honeywell 航太，把 2026 有機營收成長從 7% 至 9% 砍到 4% 至 5%，單日跌 20%"}, {"t": "Z", "n": "Zillow，Evercore ISI 由優於大盤降至中性、目標價自 80 美元砍到 40 美元，單日跌逾 12%"}], "en": "A record week is an average, and averages hide executions. Inside the same five sessions: Datadog fell 16% because third-quarter guidance of $1.135 to $1.145 billion only narrowly cleared the $1.11 billion consensus. Honeywell's aerospace business fell 20% after cutting 2026 organic sales growth guidance from 7% to 9% down to 4% to 5%. Zillow dropped more than 12% after Evercore ISI moved it from outperform to in line and halved the price target from $80 to $40. Note what these three have in common and what they do not. None of them missed on the quarter just reported; all three were repriced on what comes next. In a market trading the rate path, the index goes up on macro while individual names go down on their own forecasts — and the second is the more specific information.", "zh": "創高的一週是一個平均值，而平均值會藏住裡面的處決。在同樣這五個交易日裡:Datadog 因為第三季指引 11.35 至 11.45 億美元只勉強超過市場的 11.1 億，單日重挫 16%;Honeywell 的航太事業把 2026 年有機營收成長指引從 7% 至 9% 砍到 4% 至 5%，單日跌 20%;Zillow 在 Evercore ISI 把評等由優於大盤降至中性、目標價從 80 美元砍到 40 美元之後，單日跌超過 12%。注意這三家的共同點與非共同點:沒有一家是剛公布的那一季不及格，三家都是因為「接下來會怎樣」被重新定價。在一個交易利率路徑的市場裡，指數靠總經往上、個股靠自己的預測往下——而後者才是比較具體的那項資訊。", "url": "https://www.cnbc.com/2026/08/05/stock-market-today-live-updates.html"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "油價來回", "color": "#E05C5C", "stocks": [{"t": "USO", "n": "原油 ETF，西德州原油 8/5 跌 1.5% 至 74.63 美元，8/7 又回到 78 美元上方"}, {"t": "XLE", "n": "能源類股，8/7 上漲 1.48% 為當日最強類股"}, {"t": "XOM", "n": "艾克森美孚，油價回升當日上漲近 2%，是能源類股最大貢獻者之一"}], "en": "Oil went both directions inside one week and the reason is worth understanding, because it is now an input to the inflation print. On Wednesday 08/05 Brent fell 1.16% to $78.44 and WTI 1.5% to $74.63 on hopes that shipping through the Strait of Hormuz would resume gradually. By Friday both had rebounded, with Brent back above $82. The swing factor is the terms rather than the deal itself: under the proposed Iran-Oman arrangement governing the waterway, Tehran wants to bar US and Israeli vessels, require countries it deems hostile to pay compensation before passage, and impose penalties equal to 20% of a cargo's value for violations. A signed memorandum in June is not the same as an open strait, and the market keeps rediscovering that gap.", "zh": "油價在一週之內走了兩個方向，而這個理由值得弄懂，因為它現在是通膨數字的一項輸入。8/5 週三，布蘭特原油跌 1.16% 至 78.44 美元、西德州原油跌 1.5% 至 74.63 美元，理由是荷莫茲海峽的航運可望逐步恢復。到了週五，兩者都彈回去，布蘭特重新站上 82 美元。真正的擺盪因子不是協議本身，而是條款:在伊朗與阿曼研議中的海峽管理安排裡，德黑蘭希望禁止美國與以色列船隻通行、要求它認定為敵對的國家先付補償金才能通過，並對違規者課以相當於貨物價值 20% 的罰則。6 月簽下的備忘錄，和一條真正打開的海峽，是兩件事——而市場一次又一次重新發現這個落差。", "url": "https://hdfcsky.com/news/brent-crude-oil-prices-today-august-5-2026-brent-below-79-wti-drops-1-5-on-hormuz-shipping-hopes"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "廣度的問題", "color": "#E05C5C", "stocks": [{"t": "RSP", "n": "標普500 等權重 ETF，用來對照市值加權指數，差距代表漲幅集中在多少檔股票"}, {"t": "SOXX", "n": "半導體 ETF，晶片股是這波反彈的主要推力，也是前一週回檔的主因"}, {"t": "DIA", "n": "道瓊 ETF，全週漲近 3%，是三大指數裡最溫和的一個"}], "en": "One habit worth building on a quiet weekend: when an index makes a new high, check how many stocks took it there. The tool is free — compare the equal-weighted S&P against the market-cap-weighted version. If the cap-weighted one is running well ahead, the record belongs to a handful of large names rather than to the market. This week gives a specific reason to look: the rebound was led by chips and technology, the same group whose weakness drove the previous week's decline, and the Dow's near-3% was the mildest of the three indexes while the Nasdaq's 5.2% was the strongest. That ordering is itself a breadth statement. None of this tells you what happens next; it tells you what you actually own when you own the index.", "zh": "在一個安靜的週末值得養成的一個習慣:當指數創新高，去查一下是多少檔股票把它推上去的。工具是免費的——把等權重的標普跟市值加權的標普放在一起比。如果市值加權那條跑得遠遠在前面，那個新高就屬於少數幾檔大股票，而不屬於整個市場。這一週剛好有具體的理由去看:帶頭反彈的是晶片與科技股，正是前一週因為走弱而拖累大盤的同一群;而道瓊的近 3% 是三大指數裡最溫和的，那斯達克的 5.2% 是最強的。這個排序本身就是一則關於廣度的陳述。這些都不會告訴你接下來會怎樣，它們告訴你的是:當你買進指數的時候，你實際上買到了什麼。", "url": "https://www.ig.com/ae/news-and-trade-ideas/week-ahead-august-10th-2026-260807"},
    {"id": "earn_0", "channel": "財報速報", "tag": "UWM停股利", "color": "#E8786A", "stocks": [{"t": "UWMC", "n": "UWM Holdings，單季淨損 4.52 億美元、首次暫停股利，股價單日重挫逾 33%"}, {"t": "RKT", "n": "Rocket Companies，同為零售房貸業者，可對照同一利率環境下的表現"}], "en": "The single worst reaction of the week belongs to UWM Holdings, one of the largest mortgage lenders in the United States, which fell more than 33% after reporting a net loss of $452 million and pausing its dividend for the first time. Take the two separately. A quarterly loss in mortgage origination is cyclical and, on its own, survivable. Suspending a dividend is a different category of statement: it is a management team telling you it needs the cash more than it needs your goodwill, and it is the hardest decision to reverse without admitting it was made too early. The context makes it sharper. This happened in the same week the market decided rates are heading down, which is supposed to be the good scenario for anyone whose business is writing mortgages.", "zh": "這一週最慘的反應屬於 UWM Holdings——美國最大的房貸業者之一——它在公布單季淨損 4.52 億美元並首次暫停股利之後，股價單日重挫超過 33%。把這兩件事分開看。房貸承作出現單季虧損是景氣循環的一部分，單獨看是撐得過去的。暫停股利則是完全不同層級的陳述:那是管理層在告訴你，它需要現金的程度高過需要你的好感，而且這是一個很難在不承認「當初決定得太早」的前提下收回的決定。放進脈絡裡更刺眼:這件事發生在市場認定利率要往下走的同一週，而利率往下，本來應該是所有靠承作房貸吃飯的公司的好劇本。", "url": "https://www.cnbc.com/2026/08/05/stock-market-today-live-updates.html"},
    {"id": "earn_1", "channel": "財報速報", "tag": "航太砍指引", "color": "#E8786A", "stocks": [{"t": "HON", "n": "Honeywell 航太，2026 有機營收成長指引自 7% 至 9% 下修為 4% 至 5%，股價單日跌 20%"}, {"t": "XAR", "n": "航太與國防 ETF，可用來對照這則下修是個案還是整個族群的問題"}], "en": "Honeywell's aerospace arm cut its 2026 organic sales growth outlook from a range of 7% to 9% down to 4% to 5%, and the shares fell 20% in a session. The size of the reaction relative to the size of the cut is the point. Roughly three percentage points came off a growth rate, and a fifth of the market value came off with it — which tells you the stock had been priced as a defence and aerospace compounder whose growth was not in question. This is the risk that lives inside the phrase quality industrial: when the premium comes from predictability rather than from the growth rate itself, the punishment for becoming unpredictable is out of proportion to the numbers involved. Worth checking whether this is company-specific execution or a read-through to the wider aerospace supply chain.", "zh": "Honeywell 的航太事業把 2026 年有機營收成長展望從 7% 至 9% 下修到 4% 至 5%，股價當天跌了 20%。重點在於「反應的幅度」相對於「下修的幅度」。成長率被砍掉大約三個百分點，市值跟著被砍掉五分之一——這告訴你，這檔股票先前是被當成一家成長不容質疑的國防與航太複利機器在定價的。這正是「優質工業股」這個說法裡藏著的風險:當溢價來自可預測性、而不是來自成長率本身，那麼一旦變得不可預測，懲罰的力道就會遠遠超過數字本身的變化。值得追查的是，這究竟是公司自己的執行問題，還是可以外推到整條航太供應鏈的訊號。", "url": "https://www.cnbc.com/2026/08/05/stock-market-today-live-updates.html"},
    {"id": "earn_2", "channel": "財報速報", "tag": "超標仍跌", "color": "#E8786A", "stocks": [{"t": "NYT", "n": "紐約時報，調整後每股盈餘 0.69 美元優於預期 0.67、營收 7.625 億美元優於預估 7.521 億，盤前仍跌 6%"}, {"t": "PTON", "n": "Peloton，獲利符合預期、營收超標，但預告新會計年度銷售下滑，單日跌逾 14%"}], "en": "Two more entries in the file marked beat the quarter, sold anyway. The New York Times reported adjusted EPS of $0.69 against a $0.67 estimate and revenue of $762.5 million against $752.1 million expected — and fell 6% pre-market. Peloton matched on earnings and beat on revenue, then fell more than 14% after saying it expects sales to decline in the coming fiscal year. Both are the same mechanism as Datadog and Honeywell: the market is not paying for the quarter that just closed, it is paying for the next four. Which raises the practical question this week keeps asking. If a beat no longer moves a stock up, then the number you need before a report is not the consensus estimate — it is what the price already assumes about the year ahead, and that number is much harder to look up.", "zh": "「財報超標、股價照跌」這個檔案夾這一週又多了兩筆。紐約時報公布調整後每股盈餘 0.69 美元優於預期的 0.67，營收 7.625 億美元優於預估的 7.521 億——盤前仍跌 6%。Peloton 獲利符合預期、營收超標，但在說出「預期新會計年度銷售將下滑」之後，單日跌超過 14%。這兩筆跟 Datadog、Honeywell 是同一套機制:市場付錢買的不是剛結束的那一季，而是接下來的四季。這帶出這一週不斷在問的實務問題:如果超標已經不會讓股價上漲，那麼你在財報前需要知道的數字就不是市場共識預估值，而是「現在的價格已經對明年做了什麼假設」——而後面這個數字，難查得多。", "url": "https://www.investing.com/news/earnings/new-york-times-stock-falls-6-despite-earnings-beat-93CH-4837212"},
    {"id": "macro_0", "channel": "總經政策", "tag": "延後不是取消", "color": "#7C6AF7", "stocks": [{"t": "SHY", "n": "1-3 年期公債 ETF，兩年期殖利率跌逾 5 個基點至 4.193%，是 7 月 17 日以來最低"}, {"t": "TLT", "n": "20 年以上公債 ETF，十年期殖利率同日跌逾 3 個基點至 4.639%"}, {"t": "XLF", "n": "金融類股，利率路徑的變化直接改寫銀行與保險的獲利模型"}], "en": "The most misread line of the week is the one everybody quoted. Yes, the odds of a September hike fell to about 42% after July payrolls came in at minus 23,000. But the odds of a hike by October are still above 57%. The market did not cancel the hike; it moved it. That distinction changes what you should do with the rally. If this were a genuine end to the tightening cycle, the correct response would be to extend duration and buy the most rate-sensitive assets on the board. If it is a six-week delay, then what you have is a window, and windows close on a schedule. The honest reading of 42% versus 57% is that the market thinks the Fed still wants to hike and is waiting for permission from the data.", "zh": "這一週被誤讀最嚴重的一句話，正是被引用最多的那一句。沒錯，7 月非農交出減少 23,000 人之後，9 月升息的機率降到約 42%。但「10 月之前升息」的機率仍然在 57% 以上。市場沒有取消升息，它只是把升息挪後。這個區別會改變你該怎麼看待這波漲勢:如果這是緊縮循環真正的結束，正確的反應是拉長債券天期、買進盤面上對利率最敏感的資產;如果這只是延後六週，那你手上拿到的是一扇窗，而窗子是照時間表關上的。42% 對 57% 的誠實讀法是:市場認為 Fed 仍然想升息，只是在等數據給它許可。", "url": "https://www.cnbc.com/2026/08/07/odds-the-fed-hikes-in-september-tumble-following-big-july-jobs-miss.html"},
    {"id": "macro_1", "channel": "總經政策", "tag": "3.5%的距離", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，6 月整體 CPI 年增 3.5%、核心 CPI 年增 2.6%"}, {"t": "GLD", "n": "黃金 ETF，通膨與實質利率的組合是金價最主要的變數"}], "en": "Before Wednesday's release it is worth restating where inflation actually is, because the market has spent a week discussing rate cuts as though the job were done. In June the headline CPI fell 0.4% on the month but was still up 3.5% over twelve months. Core, excluding food and energy, was unchanged on the month and up 2.6% over the year. So the headline sits a full 1.5 percentage points above the Fed's 2% target, and the gap between headline and core — nine tenths of a point — is being carried by food and energy. That is precisely why oil rebounding to $82 late in the week is not a side story. July's data lands on Wednesday 08/12 at 8:30am ET, and the headline number is the one with the most room to disappoint.", "zh": "在週三的數據出來之前，值得把「通膨現在到底在哪裡」重講一次，因為市場已經花了一週在討論降息，講得像事情已經辦完了。6 月整體 CPI 月減 0.4%，但十二個月來仍上漲 3.5%;扣除食物與能源的核心 CPI 月持平、年增 2.6%。也就是說，整體通膨還高出 Fed 的 2% 目標整整 1.5 個百分點，而整體與核心之間那 0.9 個百分點的差距，是由食物與能源扛著的。這正是為什麼油價在週尾反彈回 82 美元不是花邊新聞。7 月的數據在 8/12 週三美東時間上午 8:30 公布，而整體那個數字，正是最有空間讓人失望的那一個。", "url": "https://www.bls.gov/news.release/cpi.nr0.htm"},
    {"id": "macro_2", "channel": "總經政策", "tag": "鷹派被當真", "color": "#7C6AF7", "stocks": [{"t": "IEF", "n": "7-10 年期公債 ETF，長端對通膨的看法決定這一段的定價"}, {"t": "KRE", "n": "區域銀行 ETF，對「升息延後」的解讀最兩極的一個族群"}], "en": "There is a reason a negative payroll print only cut September hike odds to 42% instead of to nothing, and it is not in the data. Fixed-income participants have concluded that Fed chair Kevin Warsh is genuinely hawkish and appear ready to take his statements about not tolerating high inflation at face value. That belief is doing real work in the pricing. In a normal cycle a negative employment number would have flushed hike expectations out entirely; here it removed roughly a third of them. The practical consequence is asymmetry into Wednesday. If CPI comes in soft, the market gets confirmation of something it has already bought. If CPI comes in hot, it collides with a chair the bond market has decided will not blink — and that is the path with the most repricing left in it.", "zh": "一份轉負的非農數據，為什麼只把 9 月升息機率砍到 42%、而不是砍到零?理由不在數據裡。固定收益市場已經得出結論:Fed 主席 Kevin Warsh 是真的鷹派，而且他們準備把他「不會容忍高通膨」的說法照字面接受。這個信念在定價裡發揮了實質作用——在一個正常的循環裡，一份負值的就業數據應該會把升息預期整個沖掉，這次卻只沖掉大約三分之一。實務上的後果是週三的不對稱:CPI 如果偏軟，市場只是拿到一個它已經買進的東西的確認;CPI 如果偏熱，它撞上的是一位債市已經認定不會眨眼的主席——而那條路徑，才是還留著最多重新定價空間的那一條。", "url": "https://seekingalpha.com/article/4820279-august-cpi-preview-muted-inflation-consistent-with-recession"},
    {"id": "sector_0", "channel": "產業風向", "tag": "能源領漲", "color": "#4EABA4", "stocks": [{"t": "XLE", "n": "能源類股，8/7 上漲 1.48%，是當天表現最強的類股"}, {"t": "XOM", "n": "艾克森美孚，當日上漲近 2%，是能源類股最大的貢獻者"}, {"t": "CVX", "n": "雪佛龍，當日上漲逾 1%，與艾克森美孚同為權值支撐"}], "en": "Energy was the strongest sector on Friday, up 1.48%, with ExxonMobil adding almost 2% and Chevron more than 1%. Worth being precise about what kind of leadership this is. The sector did not rise because demand improved or because these companies reported anything; it rose because crude went up on a supply scare in the Strait of Hormuz. Energy leading on price rather than on volume is a fundamentally different signal from energy leading on an industrial upturn. The first is a tax on every other sector's input costs and on the CPI print; the second would be evidence of an economy accelerating. Given that the same week produced a negative payroll number, it is fairly clearly the first.", "zh": "能源是週五最強的類股，上漲 1.48%，其中艾克森美孚漲近 2%、雪佛龍漲超過 1%。要講精確的是:這是哪一種領漲。這個類股上漲，不是因為需求改善，也不是因為這些公司公布了什麼，而是因為原油在荷莫茲海峽的供給驚嚇下上漲。能源靠「價」領漲，跟能源靠「量」領漲，是本質完全不同的訊號:前者是對其他所有類股的投入成本、以及對 CPI 數字課的一筆稅;後者才會是經濟在加速的證據。考慮到同一週交出的是一份轉負的就業數據，答案相當明顯是前者。", "url": "https://www.interactivecrypto.com/spy-edges-lower-amid-geopolitical-tensions-and-mixed-sector-performance-on-august-7-2026-aug-202"},
    {"id": "sector_1", "channel": "產業風向", "tag": "醫療翻身", "color": "#4EABA4", "stocks": [{"t": "XLV", "n": "醫療保健類股 ETF，2026 年以約 16.0% 的漲幅在各類股中領先"}, {"t": "GEHC", "n": "GE HealthCare，醫療影像設備，是醫材族群裡的中大型代表"}, {"t": "TMDX", "n": "TransMedics，器官移植灌流系統，屬於高成長的小型醫材"}], "en": "The quiet story of 2026 is healthcare, up about 16.0% and leading the sector table after several years of being the group nobody wanted. Two things sit underneath it. The first is arithmetic: after years of underperformance the sector started the year cheap relative to its own history, so a modest change in sentiment moves it a long way. The second is operational — medtech generated $584 billion of revenue in 2025, a seventh consecutive year of top-line growth, and entered 2026 with better visibility. Healthcare also has a habit of outperforming in midterm election years, which is worth knowing and worth not over-weighting. The useful implication for this feed is that a sector leading the market while carrying low coverage in its smaller names is exactly where a radar channel should be looking.", "zh": "2026 年最安靜的一則故事是醫療保健:漲約 16.0%，在多年沒人要之後領先各類股。底下有兩件事。第一件是算術:在連續幾年落後之後，這個類股是以相對自身歷史偏低的估值開年的，所以情緒只要稍微轉向，它就能走很遠。第二件是營運面——醫療科技產業 2025 年創造 5,840 億美元營收，是連續第七年成長，並且以更好的能見度進入 2026 年。醫療保健在美國期中選舉年也有領先大盤的習慣，這件事值得知道，但也值得不要過度加權。對這份晨報有用的推論是:一個正在領先大盤、但小型成分股仍然乏人覆蓋的類股，正是忽視雷達該去翻的地方。", "url": "https://www.fool.com/investing/stock-market/market-sectors/healthcare/"},
    {"id": "sector_2", "channel": "產業風向", "tag": "房市沒收到", "color": "#4EABA4", "stocks": [{"t": "ITB", "n": "美國住宅營建 ETF，利率預期改善理論上最直接受惠的族群"}, {"t": "XHB", "n": "住宅建材與相關 ETF，可對照建材端與營建端的落差"}, {"t": "MBC", "n": "MasterBrand，櫥櫃製造商，合併後首份完整季報顯示本體營收年減 5.6%"}], "en": "Here is the week's most awkward contradiction. Rates repriced lower, which is supposed to be the single best thing that can happen to housing — and the housing chain had a terrible week anyway. UWM lost $452 million and paused its dividend. Zillow was downgraded with its target cut in half. MasterBrand, whose cabinets go into kitchens and bathrooms, reported that revenue at the original business fell 5.6% year on year once you strip out the contribution from the American Woodmark merger. The message is that a change in the expected rate path is not the same as a change in mortgage rates actually charged, and neither is the same as a household deciding to move. Housing responds to the long end, and the long end barely moved.", "zh": "這一週最彆扭的矛盾在這裡。利率預期往下重新定價，這本來應該是房市所能遇到最好的一件事——但房市這條鏈子照樣過了很慘的一週。UWM 虧了 4.52 億美元並暫停股利;Zillow 被降評、目標價砍半;做櫥櫃的 MasterBrand 在合併後首份完整季報裡顯示，扣掉 American Woodmark 的貢獻之後，原本的本體營收年減 5.6%。這裡的訊息是:「預期利率路徑改變」不等於「實際房貸利率下降」，而後者又不等於「一個家庭決定要搬家」。房市吃的是長端殖利率，而長端這一週幾乎沒動。", "url": "https://www.financialcontent.com/article/bizwire-2026-8-4-masterbrand-reports-second-quarter-2026-financial-results"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "23年最佳", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，指數約在 2,980 點，今年以來漲約 20%"}, {"t": "IJR", "n": "標普小型股 600 ETF，可與羅素 2000 對照成分品質的差異"}], "en": "Where small caps actually stand as the week closes: the Russell 2000 sits around 2,980, up roughly 20% in 2026 against about 11% for the S&P 500, on pace for its best year since 2003 after its best first half since 1991. That is a genuinely large divergence and it has run for months, not days. The reason to keep saying this out loud is that a run of that size changes the starting point for everything that follows. The valuation gap that made small caps interesting at the beginning of the year has partly closed by definition — you cannot outperform by nine percentage points and remain equally cheap. Anyone arriving now is buying a different proposition from the one that was available in January.", "zh": "在這一週結束時，小型股實際站在哪裡:羅素 2000 大約在 2,980 點，今年以來漲約 20%，同期標普 500 約 11%，在寫下 1991 年以來最強上半年之後，全年有機會拿下 2003 年以來最好的成績。這是一個真正很大的落差，而且已經跑了好幾個月、不是好幾天。之所以要把這件事一直講出來，是因為這種幅度的漲勢會改變之後每一件事的起算點:年初讓小型股顯得有意思的那個估值落差，按定義已經被填掉一部分——你不可能領先九個百分點、同時還一樣便宜。現在才進場的人，買的是一個跟 1 月時完全不同的命題。", "url": "https://www.ibtimes.com.au/russell-2000-index-small-cap-rally-2026-1872366"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "第二層", "color": "#5B8ED6", "stocks": [{"t": "VTWO", "n": "羅素 2000 ETF(Vanguard)，今年以來漲約 20%"}, {"t": "MAGS", "n": "七巨頭 ETF，同期大型 AI 領導群僅漲約 4%"}], "en": "The cleanest way to see what is happening: the Magnificent Seven are up about 4% this year, the S&P 500 about 11% and the Russell 2000 about 20%. The order is completely inverted from the last several years. The explanation now offered is that money is hunting the second layer of AI beneficiaries — the smaller companies supplying, powering, cooling and building out the infrastructure rather than the handful of names that own the models. Treat this as a description, not a thesis. The second layer is a real phenomenon in a few specific supply chains and a marketing label almost everywhere else, and the difference only shows up in the revenue line. If a small cap is a genuine AI beneficiary, it appears as customer concentration and order backlog, not as a slide in the deck.", "zh": "要看清楚正在發生什麼，最乾淨的方法是這組數字:七巨頭今年漲約 4%，標普 500 約 11%，羅素 2000 約 20%。這個順序跟過去幾年完全顛倒。目前提出的解釋是:資金正在獵捕「AI 的第二層受惠者」——那些供應、供電、散熱、承建基礎設施的較小公司，而不是擁有模型的那幾家。把這句話當成描述、不要當成論點。「第二層」在少數幾條特定供應鏈裡是真實現象，在其他絕大多數地方只是一個行銷標籤，而差別只會顯示在營收那一行。一檔小型股如果真的是 AI 受惠者，它會以客戶集中度和在手訂單的形式出現，而不是以簡報上的一頁投影片出現。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "兩張池子", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普小型股 600 ETF，成分納入前有獲利門檻要求"}, {"t": "IWM", "n": "羅素 2000 ETF，純按市值排序納入，不設獲利門檻"}], "en": "Today's knowledge card, and it matters more this year than most: small caps are not one pool, they are two, and the difference is a rule. The Russell 2000 takes companies by market capitalisation alone — if you are the right size you are in, profitable or not. The S&P SmallCap 600 applies an earnings screen before admission. That single rule produces meaningfully different indexes with the same label, and in a year driven by falling rate expectations it matters enormously, because the companies that benefit most from cheaper money are the ones that need it most. So when someone tells you small caps are up 20%, the first question is which pool. And when you buy a small-cap ETF, you are not choosing a size — you are choosing whether a profit requirement was applied on your behalf.", "zh": "今天的知識卡，而且今年格外重要:小型股不是一個池子，是兩個，而差別在於一條規則。羅素 2000 純粹按市值收成分股——市值符合就進得來，有沒有獲利不管;標普小型股 600 則在納入之前先套一道獲利門檻。這一條規則就做出了兩個貼著同樣標籤、內容卻明顯不同的指數;而在一個由「降息預期」推動的年份裡，這件事的份量特別大，因為最受惠於資金變便宜的公司，正是最需要便宜資金的那些。所以當有人跟你說「小型股漲了 20%」，第一個該問的是:哪一個池子。而當你買進一檔小型股 ETF，你選的其實不是市值，是「有沒有人替你先套上獲利門檻」。", "url": "https://247wallst.com/investing/etf/2026/07/20/the-russell-2000-is-outpacing-the-sp-500-in-2026-is-it-too-late-to-buy-small-cap-etfs/"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "一天漲三成", "color": "#5B8ED6", "stocks": [{"t": "QNST", "n": "QuinStreet，8/6 財報後單日大漲 28% 至 19.47 美元;營收 3.739 億美元年增 42.7%、超市場預估 4%"}], "en": "QuinStreet rose 28% in a single session on 08/06 to $19.47. The numbers behind it: revenue of $373.9 million grew 42.7% and beat the $359.3 million consensus by 4%, adjusted EPS of $0.50 beat by 13.2%, adjusted EBITDA of $41.36 million beat by 3.1%, and operating margin went from 1.5% a year ago to 5.1%. Next-quarter guidance of $375 million came in 4.5% above consensus. Good quarter, clearly. But hold on to the size of the move rather than the quality of the quarter, because a company only gains 28% in a day if essentially nobody was modelling it beforehand. That is the mechanic worth internalising: the payoff in small caps comes from the absence of coverage, not from the presence of good news. And it works in reverse with exactly the same violence.", "zh": "QuinStreet 在 8/6 單日大漲 28% 至 19.47 美元。背後的數字是:營收 3.739 億美元年增 42.7%，超出市場預估的 3.593 億達 4%;調整後每股盈餘 0.50 美元超預期 13.2%;調整後 EBITDA 4,136 萬美元超預期 3.1%;營業利益率從一年前的 1.5% 拉到 5.1%。下一季指引 3.75 億美元，也高於市場預估 4.5%。這一季顯然很好。但真正要記住的是這個漲幅的「大小」，而不是這一季的「品質」——因為一家公司之所以能在一天內漲三成，前提是先前基本上沒有人在替它建模。這才是值得內化的機制:小型股的報酬來自「沒有人覆蓋」，而不是來自「有好消息」。而且反過來的時候，力道一模一樣兇。", "url": "https://markets.financialcontent.com/stocks/article/stockstory-2026-8-6-quinstreet-nasdaqqnst-reports-bullish-q2-cy2026-stock-jumps-28"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "先算費用", "color": "#5B8ED6", "stocks": [{"t": "IWC", "n": "微型股 ETF，用分散持有的方式繞開個股的流動性問題"}, {"t": "DLHC", "n": "DLH Holdings，股價約 4.88 美元、貼近 52 週低點 4.74，是流動性極薄的微型股範例"}], "en": "One thing that gets left out of every small-cap article, including the enthusiastic ones: at the micro-cap end, the cost of getting in and out is itself an expense you have to budget for before you start. A stock like DLH Holdings, trading near $4.88 against a 52-week low of $4.74, can have a spread and a depth profile where a position of any size moves the price against you on the way in and again on the way out. That round trip can be several percent before the thesis has had a single day to work. The practical rule is that in micro caps, position size is not only a risk decision — it is a cost decision, and it should be made before the research, not after it.", "zh": "每一篇談小型股的文章都會漏掉一件事，連最熱情的那些也一樣:在微型股這一端，「進出的成本」本身就是一項你必須在開始之前先編進預算的費用。像 DLH Holdings 這種股價約 4.88 美元、貼著 52 週低點 4.74 的股票，買賣價差與掛單深度可能是這樣的:任何有份量的部位在進場時會把價格推高、出場時又把價格壓低。這一趟來回可能吃掉好幾個百分點，而論點連一天發揮的機會都還沒有。實務上的規則是:在微型股裡，部位大小不只是風險決策，它同時是成本決策——而且應該在做研究之前決定，不是之後。", "url": "https://www.investing.com/news/insider-trading-news/dlh-holdings-director-mink-brook-asset-management-buys-2396-stock-93CH-4829389"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "WD會計雜訊", "color": "#C9A227", "stocks": [{"t": "WD", "n": "Walker & Dunlop，Q2 GAAP 每股盈餘 0.09 美元年減 91%，但調整後核心每股盈餘 1.19 美元年增 3%;GSE 市佔自 11.2% 升至 14.7%"}], "en": "New name, and the classic radar setup of a real business hidden behind an ugly headline number. Walker & Dunlop is a commercial real estate finance firm — it originates multifamily and commercial mortgages, sells them to the government-sponsored enterprises and HUD, and keeps the servicing. What it does is boring and essential. Why ignored: the second quarter reported on 08/06 shows net income of $3.0 million and diluted EPS of $0.09, both down 91%, which is the number a screener sees. What is changing: strip out $23.2 million of operating and credit expenses tied to legacy indemnified and repurchased loans from a small number of previously identified fraudulent sponsors, and adjusted core EPS actually rose 3% to $1.19. Underneath, transaction volume of $14.4 billion grew 3%, the servicing portfolio grew 6% to $145.8 billion, debt financing volume rose 8% to $12.5 billion with HUD originations up 43%, and year-to-date GSE market share jumped to 14.7% from 11.2% a year earlier. Repurchased loans fell to $193.3 million at 30 June and by a further $39.4 million after quarter end, so the problem has a visible path to resolution. Risks: total revenue still fell 4% to $306.7 million; market share gains in a shrinking market are worth less than they look; the fraud clean-up is management's own estimate of an endpoint, not a certainty; and commercial real estate credit is exposed to the long end of the curve, which has not fallen. Research lead, not investment advice.", "zh": "新名字，而且是最經典的雷達設定:一門真實的生意，藏在一個難看的頭條數字後面。Walker & Dunlop 做的是商用不動產金融——承作多戶型住宅與商用房貸，賣給政府贊助機構與美國住房及城市發展部，然後留下服務權。它做的事無聊而且必要。為什麼被忽視:8/6 公布的第二季，淨利 300 萬美元、稀釋後每股盈餘 0.09 美元，兩項都年減 91%——這就是篩選器看到的數字。什麼正在改變:把 2,320 萬美元的營運與信用相關費用剝掉(那來自少數幾個先前已辨識出的詐欺型貸款發起人所留下的舊有賠付與回購貸款)，調整後核心每股盈餘其實年增 3% 至 1.19 美元。底下的體質是:交易量 144 億美元年增 3%，服務組合年增 6% 至 1,458 億美元，債務融資量年增 8% 至 125 億美元、其中 HUD 承作年增 43%，而今年以來的 GSE 市佔率從一年前的 11.2% 跳升到 14.7%。被回購的貸款餘額在 6 月 30 日降至 1.933 億美元，季後又再減少 3,940 萬美元——這個問題有一條看得見的收斂路徑。風險:總營收仍年減 4% 至 3.067 億美元;在一個縮小的市場裡拿到市佔，價值不如表面好看;詐欺案的清理進度是管理層自己對終點的估計、不是確定的事;而商用不動產信用曝險綁在長端殖利率上，而長端並沒有下來。研究線索，非投資建議。", "url": "https://www.stocktitan.net/news/WD/walker-dunlop-reports-second-quarter-2026-financial-4p5k8fl8fr83.html", "status": "RADAR · 下一個驗證點:下一季財報看回購貸款餘額是否續降、GAAP 與調整後核心的差距是否收斂，以及 GSE 市佔能否守住 14.7%"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "KBR拆兩半", "color": "#C9A227", "stocks": [{"t": "KBR", "n": "KBR，宣布分拆 Mission Technology Solutions;該事業近十二個月營收約 58 億美元、員工約 2 萬人，分拆預計 2027/01/04 完成"}, {"t": "FDXF", "n": "FedEx Freight，池內既有的分拆案例，可用來對照分拆前後的賣壓與重估節奏"}], "en": "New name, and this one is a setup rather than an event. KBR announced its intention to spin off its Mission Technology Solutions segment into a separate US-listed company, a tax-free separation targeted for mid to late 2026 with completion expected by 04 January 2027. Michael LaRouche has been named CEO of the entity and Nicholas Veasey CFO. Why this belongs on the radar: as of the end of the second quarter MTS carries roughly $5.8 billion of trailing twelve-month revenue and about 20,000 employees in government services, defence and space — and it currently has no independent price, no independent quarterly series and no analyst models. Everything institutional investors need in order to value it does not exist yet. What is changing: the remaining KBR becomes a pure Sustainable Technology Solutions business built on proprietary process technology and licensing, which is a completely different margin structure from government services. Two businesses that have been valued as one blended average are about to be valued separately. Be honest about the label though — KBR itself is well covered, so this is a half-ignored case like FedEx Freight in the pool: what is neglected is the future standalone entity, not the parent. Risks: spin-offs reliably produce indiscriminate selling from index funds and original holders; MTS revenue is entirely dependent on federal budgets and contract renewals; the timetable can slip; and there is not a single independent financial statement to examine yet, which makes this the weakest evidence category the radar accepts. Research lead, not investment advice.", "zh": "新名字，而且這一檔是一個「局」、不是一個事件。KBR 宣布計畫把旗下的 Mission Technology Solutions 事業分拆成一家獨立在美國掛牌的公司，採免稅分拆、目標在 2026 年中至下半年進行，預計 2027 年 1 月 4 日完成;新公司的執行長已定為 Michael LaRouche，財務長為 Nicholas Veasey。為什麼它該上雷達:截至第二季底，MTS 的近十二個月營收約 58 億美元、員工約 2 萬人，做的是政府服務、國防與太空——而它現在沒有獨立的價格、沒有獨立的季度序列、也沒有任何分析師模型。法人替它估值所需要的東西，全部都還不存在。什麼正在改變:留下來的 KBR 會變成一家純粹的永續技術方案公司，靠自有製程技術與授權賺錢，那跟政府服務是完全不同的毛利結構。兩門原本被當成一個混合平均值來評價的生意，即將被分開評價。但標籤要誠實:KBR 本身覆蓋充足，所以這是跟池內 FedEx Freight 一樣的「半忽視」案例——被忽視的是那家未來的獨立公司，不是母公司。風險:分拆一定會引來指數型基金與原股東的無差別賣壓;MTS 的營收完全依賴聯邦預算與合約續約;時程可能延後;而且到現在連一份獨立財報都還沒有可以檢查——這是忽視雷達所能接受的最弱一級證據。研究線索，非投資建議。", "url": "https://www.kbr.com/en/insights-news/press-release/kbr-announces-strategic-intent-spin-mission-technology-solutions", "status": "RADAR · 下一個驗證點:分拆的 Form 10 申報文件(首度揭露 MTS 的獨立財務數字與資本結構)，以及分拆完成日 2027/01/04"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "MOV到期日", "color": "#C9A227", "stocks": [{"t": "MOV", "n": "Movado Group，8/27 公布財報、市場預估每股盈餘 0.36 美元;Kate Spade 全球授權自 7/1 生效，股價約 38.5 美元逼近 52 週高點 39.85"}], "en": "Pool update with a date attached. Movado Group is a watch and jewellery group — its own Movado and Ebel brands plus licensed watches for Coach, Tommy Hilfiger, Lacoste and HUGO. It went on the radar because it is a small cap in a genuinely cold category with almost no analyst coverage and near-zero media volume, sitting on roughly $230 million of cash and essentially no net debt, with fiscal Q1 EPS up 417% year on year and operating margin improving. What has changed since: on 07/21 Kate Spade New York signed a global licensing agreement, effective 07/01, under which Movado designs, manufactures and distributes Kate Spade watches; and on 07/16 the Bank of America revolver was extended from October 2026 to July 2031, with the facility reduced from $100 million to $75 million and none of it currently drawn. Both are quiet, structural improvements. The verification point is 08/27, with consensus EPS of $0.36, and the specific question is what Kate Spade actually contributes to revenue and what it does to gross margin. Risks that have not gone away: tariffs and macro uncertainty are why management declined to give FY2027 guidance at all; luxury consumption is slowing; brand ageing is a real threat in this category; and the shares are up around 35.6% in twelve weeks to near the 52-week high, so the cheap margin of safety that made it interesting has already been compressed. Research lead, not investment advice.", "zh": "池內更新，而且帶著日期。Movado Group 是手錶與珠寶品牌集團——自有的 Movado 與 Ebel，加上 Coach、Tommy Hilfiger、Lacoste、HUGO 的授權錶。它會上雷達，是因為它是一檔位在真正冷門品類裡的小型股，分析師覆蓋極少、媒體聲量接近零，帳上約 2.3 億美元現金且幾乎沒有淨負債，會計年度第一季每股盈餘年增 417%，營業利益率也在改善。之後的變化是:7/21 Kate Spade New York 簽下全球授權合作、自 7/1 生效，由 Movado 設計、製造與經銷 Kate Spade 錶款;7/16 與美國銀行的循環信貸到期日從 2026 年 10 月延長到 2031 年 7 月，額度由 1 億降為 7,500 萬美元，目前完全未動用。這兩件都是安靜的結構性改善。驗證點是 8/27，市場預估每股盈餘 0.36 美元，而具體要問的是:Kate Spade 對營收實際貢獻多少、對毛利率做了什麼。沒有消失的風險:關稅與總經不確定，正是管理層乾脆不給 FY2027 財測的理由;精品消費正在放緩;品牌老化在這個品類裡是真實的威脅;而股價 12 週已漲約 35.6%、逼近 52 週高點 39.85 美元，當初讓它有意思的那個便宜的安全邊際，已經被壓縮掉了。研究線索，非投資建議。", "url": "https://stockanalysis.com/stocks/mov/statistics/", "status": "RADAR · 下一個驗證點 08/27 財報;看 Kate Spade 授權錶的實際營收貢獻與毛利影響，市場預估每股盈餘 0.36 美元"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "FCFS的雙面", "color": "#C9A227", "stocks": [{"t": "FCFS", "n": "FirstCash Holdings，Q2 營收 10.7 億美元年增 29%、GAAP 稀釋每股盈餘 2.12 美元年增 58%;當鋪債權年增 63% 至 8.98 億、同店成長 22%"}], "en": "Pool update, read against Friday's jobs report — and this is the pairing that makes it worth a card today. FirstCash operates 3,343 pawn stores across the United States and Latin America. Why ignored: pawn lending sits on most ESG exclusion lists, so institutions avoid the category by rule rather than by analysis, and it is filed under low-growth consumer finance with thin sell-side coverage. What is changing: the second quarter was a record — revenue of $1.07 billion up 29%, GAAP diluted EPS of $2.12 up 58%, adjusted EPS of $2.50 up 40%, pawn receivables up 63% to $898 million with same-store growth of 22%, and operating cash flow of $673 million funding a net 347 new stores in twelve months. The board completed one $150 million buyback and authorised another, plus a $0.42 quarterly dividend paid in August. Now put that next to a July payroll print of minus 23,000 with softening retail and hospitality hiring. Pawn receivables growing 63% is a reading of household financial stress, and that is exactly why this cuts both ways: the same conditions that drive volume now will, if they deepen, hurt collateral values and redemption rates at the same time. Other risks: regulatory exposure through the CFPB and state rate caps never goes away; the Latin American weighting means currency moves the reported numbers directly; and 29% revenue growth needs splitting between new stores and same-store before it means anything. Research lead, not investment advice.", "zh": "池內更新，而且要跟週五的就業報告對著讀——這正是今天值得給它一張卡的理由。FirstCash 在美國與拉丁美洲經營 3,343 家當鋪。為什麼被忽視:當鋪放款在大多數 ESG 排除名單上，法人是按規則迴避這個品類、而不是分析後迴避;同時它被歸類為低成長的消費金融，賣方覆蓋很薄。什麼正在改變:第二季是紀錄季——營收 10.7 億美元年增 29%，GAAP 稀釋後每股盈餘 2.12 美元年增 58%，調整後每股盈餘 2.50 美元年增 40%;當鋪債權年增 63% 至 8.98 億美元、同店成長 22%;營運現金流 6.73 億美元支應了一年內淨增的 347 家門市。董事會在執行完一個 1.5 億美元的庫藏股計畫後再授權 1.5 億，並宣布 8 月發放每股 0.42 美元的季配息。現在把這些放到「7 月非農減少 23,000 人、零售與休閒餐旅雇用轉弱」旁邊。當鋪債權成長 63%，本身就是一份家庭財務壓力的讀數——而這正是它兩面刃的地方:現在推升業務量的同一組條件，如果再惡化下去，會同時傷害抵押品價值與贖回率。其他風險:來自消費者金融保護局與各州利率上限的監管曝險永遠存在;拉美佔比高，匯率會直接改動帳面數字;而 29% 的營收成長要先拆成新開店與同店，才有意義。研究線索，非投資建議。", "url": "https://www.stocktitan.net/news/FCFS/first-cash-reports-record-second-quarter-operating-results-pawn-nry75dt7e0li.html", "status": "RADAR · 下一個驗證點:Q3 財報看同店成長能否守住雙位數、新 1.5 億庫藏股的執行速度與均價，以及拉美匯率影響"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "MQ的指引", "color": "#C9A227", "stocks": [{"t": "MQ", "n": "Marqeta，Q2 淨營收 1.76 億美元年增 17%、總支付金額年增 32%，連續第二季 GAAP 獲利;8/3 再授權 1.5 億美元庫藏股"}], "en": "Pool update, and the point of this card is the disagreement inside it. Marqeta is card-issuing infrastructure — the platform hiding behind other companies' payment products. Why ignored: it listed at the 2021 fintech peak and spent years being repriced downward, so most funds have filed it away, and an infrastructure business has no consumer-facing story to tell. What is changing: second-quarter net revenue of $176 million grew 17% on total payment volume up 32%, gross profit of $122 million grew 17%, adjusted EBITDA of $37 million grew 31%, and EPS of $0.07 came in far above a consensus near breakeven — the second consecutive quarter of GAAP profit. On 08/03 the board authorised another $150 million buyback, notable because it came only after the previous programme was fully used with zero capacity remaining, and Q1 repurchases were done at an average of $4.16. Now the counter-evidence, which is specific: third-quarter revenue guidance came in below expectations. That is the whole argument in one sentence — the company is proving it can be profitable at the same moment it signals slower growth. Other risks: growth is concentrated in a handful of large platform customers so a single loss is disproportionate; two quarters of GAAP profit is a very short record; and issuing-infrastructure margins are squeezed by customer bargaining power. Research lead, not investment advice.", "zh": "池內更新，而這張卡的重點就是它內部的矛盾。Marqeta 是發卡基建平台——藏在別人的支付產品背後的那一層。為什麼被忽視:它在 2021 年金融科技高點掛牌，之後多年一路被往下重新定價，大多數基金已經把它歸檔;而基建型生意沒有面向消費者的故事可講。什麼正在改變:第二季淨營收 1.76 億美元年增 17%，總支付金額年增 32%;毛利 1.22 億年增 17%;調整後 EBITDA 3,700 萬年增 31%;每股盈餘 0.07 美元遠高於市場幾乎損益兩平的預估——這是連續第二季 GAAP 獲利。8/3 董事會再授權 1.5 億美元庫藏股，值得注意的是這是在前一個計畫用到零額度剩餘之後才發的，而第一季的買回均價是 4.16 美元。接著是反方證據，而且很具體:第三季營收指引低於市場預期。整個爭論就在這一句話裡——公司在證明自己能賺錢的同一刻，也在預告成長要放慢。其他風險:成長高度集中在少數幾個大型平台客戶，單一客戶流失的衝擊不成比例;連續兩季 GAAP 獲利是很短的紀錄;發卡基建的毛利率會被客戶的議價能力壓縮。研究線索，非投資建議。", "url": "https://stockstory.org/us/stocks/nasdaq/mq/news/earnings/marqetas-nasdaq-mq-q2-cy2026-sales-top-estimates-but-quarterly-revenue-guidance-misses-expectations", "status": "RADAR · 下一個驗證點:Q3 財報看 GAAP 獲利能否連三季、總支付金額成長率是否維持 30% 以上、1.5 億庫藏股的實際執行均價"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "ICFI靠預算", "color": "#C9A227", "stocks": [{"t": "ICFI", "n": "ICF International，6/25 授權 1 億美元庫藏股(約當流通股 8.1%)，而 1-6 月已先買回 435,000 股、金額 2,900 萬美元"}], "en": "Pool update, and this one is deliberately uncomfortable. ICF International is a consulting firm serving government, energy and climate clients on contract-based revenue. Why ignored: consulting has no product story and no narrative hook, a first-quarter miss pushed generalist funds out, and it is a small cap with thin coverage. What is changing: capital allocation turned explicit. On 06/25 the board authorised a $100 million buyback, about 8.1% of shares outstanding — and the credential is that it had already repurchased 435,000 shares for $29 million in the first half, before the new authorisation. Full-year guidance was maintained rather than cut after the Q1 miss. It also won a $14 million California transportation contract, and insiders including Randall Mehl and Scott Salmirs have bought within the last 24 months. Now the reason it is uncomfortable: federal budget and policy exposure is not a risk factor here, it is the entire business. Every argument for this company is also an argument about whether government spending holds up, and that is a variable nobody in this feed can forecast. Other risks: deferred revenue trends were the actual cause of the Q1 miss and have not been shown to have improved; the buyback is permission rather than a promise, so check the next 10-Q for shares actually retired; and with a net margin under 5% there is very little operating leverage to work with. Research lead, not investment advice.", "zh": "池內更新，而這一檔是刻意讓人不舒服的。ICF International 是一家顧問公司，客戶是政府、能源與氣候相關單位，收入來自合約。為什麼被忽視:顧問業沒有產品故事、沒有敘事鉤子;第一季未達標把泛用型基金趕走;而它是一檔覆蓋很薄的小型股。什麼正在改變:資本配置轉得很明確。6/25 董事會授權 1 億美元庫藏股，約當流通股的 8.1%——而它的背書是，在這紙新授權之前，1 至 6 月就已經先買回 435,000 股、金額 2,900 萬美元。全年指引在第一季未達標之後維持不變、沒有下修。它也拿下加州交通局 1,400 萬美元的合約，而內部人包含 Randall Mehl 與 Scott Salmirs 在近 24 個月內都有買進。接著是它讓人不舒服的理由:聯邦預算與政策曝險在這裡不是一項風險因子，它就是整門生意。每一個支持這家公司的論點，同時也是一個關於「政府支出撐不撐得住」的論點，而那是這份晨報裡沒有人預測得了的變數。其他風險:遞延收入的趨勢正是第一季未達標的真正原因，而它至今沒有被證明已經改善;庫藏股是許可、不是承諾，要查的是下一份 10-Q 裡實際減少的股數;而淨利率不到 5%，代表可以運用的營運槓桿非常有限。研究線索，非投資建議。", "url": "https://simplywall.st/stocks/us/commercial-services/nasdaq-icfi/icf-international/news/icf-international-and-2-other-undervalued-small-caps-with-in", "status": "RADAR · 下一個驗證點:下一份 10-Q 看遞延收入趨勢是否改善，以及 1 億美元庫藏股的實際執行進度與均價"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "WEX全體進場", "color": "#6DB56D", "stocks": [{"t": "WEX", "n": "WEX Inc，董事長 Melissa Smith 6/2 以 50.07 萬美元買進 3,721 股;營運長、財務長、技術長、法務長與數位長同期均在公開市場買進"}], "en": "The strongest single insider signal still sitting in the pool belongs to WEX, and this week gave it a new complication worth writing down. WEX processes fleet card, corporate payment and health account transactions. In a short window the chairman, chief operating officer, chief financial officer, chief technology officer, chief legal officer and chief digital officer all bought on the open market — chairman Melissa Smith taking 3,721 shares for $500,700 on 06/02, director James Groch 1,500 shares on 05/18. An entire C-suite buying at once, after a stock that is down 30.3% over five years, is difficult to explain as diversification or as pre-set 10b5-1 plans. The new complication: fleet card revenue is tied to fuel prices and miles driven, and oil spent this week swinging on Hormuz headlines. Lower fuel prices reduce the dollar value of every transaction it processes, so a Hormuz reopening would help the market and hurt this specific line. Also note the decay — those purchases are now more than two months old, and insiders can be both early and wrong.", "zh": "池內目前最強的單一內部人訊號仍然是 WEX，而這一週給了它一個值得寫下來的新變數。WEX 處理的是車隊卡、企業支付與醫療帳戶的支付。在一段很短的時間裡，董事長、營運長、財務長、技術長、法務長與數位長全部在公開市場買進——董事長 Melissa Smith 於 6/2 以 50.07 萬美元買進 3,721 股，董事 James Groch 於 5/18 買進 1,500 股。在一檔五年跌了 30.3% 的股票上，整個高階經營團隊同時進場，很難用分散配置或預先設定的 10b5-1 計畫來解釋。新的變數是:車隊卡的營收綁在油價與行駛里程上，而油價這一週正隨著荷莫茲的新聞來回擺盪。燃料價格下跌會壓低它處理的每一筆交易金額，所以荷莫茲若真的重開，那會幫到大盤、卻傷到它這一條線。另外也要注意衰減——那些買進距今已經超過兩個月，而內部人可以既早且錯。", "url": "https://finance.yahoo.com/news/wex-insider-buying-cluster-highlights-101146160.html"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "買回看比例", "color": "#6DB56D", "stocks": [{"t": "EHC", "n": "Encompass Health，7/23 董事會把庫藏股授權提高至 10 億美元"}, {"t": "BL", "n": "BlackLine，7/31 把庫藏股計畫增加 1 億美元、總授權自 5 億提高到 6 億"}], "en": "Two more buyback authorisations landed in the past fortnight: Encompass Health raised its total repurchase authorisation to $1 billion on 07/23, and BlackLine added $100 million on 07/31, taking its programme from $500 million to $600 million. The headline dollar figure is the least informative part of either announcement. What determines whether a buyback moves anything for a shareholder is the amount as a percentage of market capitalisation, and a billion dollars at a large company can retire a smaller share of the float than $100 million at a small one. The second filter is the price paid, since a repurchase executed above intrinsic value transfers wealth to the people selling. So the reading order is: percentage of shares outstanding first, average execution price second, headline dollars last — and headline dollars is what press releases lead with.", "zh": "過去兩週又落地了兩筆庫藏股授權:Encompass Health 於 7/23 把總授權提高到 10 億美元，BlackLine 於 7/31 增加 1 億美元、把計畫從 5 億提高到 6 億。這兩則公告裡，資訊量最低的部分就是那個頭條金額。真正決定一次買回對股東有沒有意義的，是「金額佔市值的比例」——一家大公司的 10 億美元，能買回的流通股比例可能比一家小公司的 1 億美元還少。第二道過濾是「買在什麼價位」，因為在內在價值之上執行的買回，等於把財富轉移給賣股票的那些人。所以正確的閱讀順序是:先看佔流通股的百分比，再看實際執行均價，最後才看頭條金額——而頭條金額，正是新聞稿一定會放在最前面的那個。", "url": "https://www.sec.gov/Archives/edgar/data/0001666134/000162828026053353/bl-20260630.htm"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "早而且錯", "color": "#6DB56D", "stocks": [{"t": "ERII", "n": "Energy Recovery，董事 Colin Sabol 6/15 以 8.88 美元買進約 9.9 萬美元;Q2 營收 1,200 萬美元年減 57.2%、比預估少 36.3%"}, {"t": "ADV", "n": "Advantage Solutions，執行長 David Peacock 一年內 18 次買進、零賣出;Q2 淨損自 3,040 萬擴大到 6,270 萬美元"}], "en": "The most useful insider cards are the ones that did not work, so here are two from this pool, both closed out in the past ten days. Energy Recovery: director Colin Sabol bought about $99,000 at $8.88 on 06/15, and the second-quarter result on 08/05 showed revenue of $12 million, down 57.2% and 36.3% below the $18.83 million expected, with adjusted EBITDA swinging to minus $2.6 million. Advantage Solutions: chief executive David Peacock bought 18 times in twelve months with zero sales, and the second quarter showed revenue up just 1.8% while the net loss widened from $30.4 million to $62.7 million. Two lessons, and they are different. Insiders can be both early and wrong — proximity to the books is not the same as knowing what customers will do. And insider buying on its own is a single signal; both of these lacked a second, independent piece of evidence of a fundamental inflection, which is precisely why the pool now requires two.", "zh": "最有用的內部人卡片是那些沒有奏效的，所以這裡放兩則來自這個池子、都在過去十天內結案的案例。Energy Recovery:董事 Colin Sabol 於 6/15 以 8.88 美元買進約 9.9 萬美元，而 8/5 交卷的第二季顯示營收僅 1,200 萬美元、年減 57.2%，比市場預估的 1,883 萬少 36.3%，調整後 EBITDA 由正轉負為 -260 萬美元。Advantage Solutions:執行長 David Peacock 在十二個月內買進 18 次、零賣出，而第二季營收只增 1.8%，淨損卻從 3,040 萬擴大到 6,270 萬美元。兩個教訓，而且是不同的兩個。第一，內部人可以既早且錯——離帳本近，不等於知道客人接下來會做什麼。第二，內部人買進單獨看只是一個訊號;這兩個案例都缺少第二項獨立的基本面拐點證據，而這正是這個池子現在要求「至少命中兩項訊號」的理由。", "url": "https://markets.financialcontent.com/stocks/article/stockstory-2026-8-5-energy-recovery-nasdaqerii-misses-q2-cy2026-revenue-estimates-stock-drops"},
    {"id": "week_0", "channel": "本週事件", "tag": "週三見真章", "color": "#C97DD4", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，8/12 上午 8:30 公布 7 月 CPI，6 月整體為年增 3.5%、核心 2.6%"}, {"t": "SHY", "n": "1-3 年期公債 ETF，短端對這兩份數據的反應最直接"}], "en": "The week's macro calendar is short and heavily loaded at the front. July CPI is released Wednesday 08/12 at 8:30am ET, with June's readings of 3.5% headline and 2.6% core as the starting line, and PPI follows on Thursday 08/13. These are the last major inflation inputs before the September FOMC, and they arrive into a market that has already priced September as a hold at roughly 58% probability. Set your expectations for how each outcome resolves. A soft print confirms what is already owned, so the upside is limited. A hot print has to be argued against a payroll number that just came in negative, which is why it would be the more disruptive of the two. And watch the split between headline and core, because oil's rebound to $82 late last week feeds the headline and not the core.", "zh": "這一週的總經行事曆很短，而且重量全部壓在前段。7 月 CPI 在 8/12 週三美東時間上午 8:30 公布，起跑線是 6 月的整體年增 3.5% 與核心 2.6%;PPI 接在 8/13 週四。這是 9 月 FOMC 之前最後幾份重要的通膨輸入，而它們進入的是一個已經把 9 月按兵不動定價到約 58% 機率的市場。先把兩種結果各自的解法想好:數字偏軟，只是確認你已經持有的東西，上檔有限;數字偏熱，則必須跟一份剛剛轉負的就業數據對著吵，這也是為什麼它會是比較有破壞力的那一個。另外要盯整體與核心的分岔——上週尾油價彈回 82 美元，餵的是整體、不是核心。", "url": "https://www.bls.gov/news.release/cpi.htm"},
    {"id": "week_1", "channel": "本週事件", "tag": "neocloud週", "color": "#C97DD4", "stocks": [{"t": "SMCI", "n": "Super Micro，8/11 盤後公布 FQ4;營收預估落在 110 至 125 億美元指引低端，但毛利率估 15% 至 17% 遠優於原指引的 8.2% 至 8.4%"}, {"t": "CRWV", "n": "CoreWeave，8/11 公布財報;市場預估單季每股虧損 1.17 美元，年減 333.3%"}, {"t": "JD", "n": "京東，同週公布財報，是本週少數的非美國需求讀數"}], "en": "Earnings season is thinning out, and what is left this week belongs to AI infrastructure. Super Micro reports fiscal Q4 after the close on Tuesday 08/11, and its own preliminary update has already framed it: revenue near the low end of the $11.0 to $12.5 billion guidance range, but GAAP and non-GAAP gross margins estimated at 15% to 17% against guidance of 8.2% to 8.4%, attributed to favourable customer and product mix — with more than $60 billion of new orders received in the quarter and a record backlog. Consensus EPS is $0.68, up 65% year on year. CoreWeave also reports on 08/11, with consensus at a loss of $1.17 per share, a 333.3% deterioration year on year — revenue rising while earnings fall, which is what building capacity ahead of demand looks like on an income statement. JD.com reports in the same week and is one of the few non-US demand readings available.", "zh": "財報季正在收尾，而這一週剩下的部分屬於 AI 基礎設施。Super Micro 在 8/11 週二盤後公布會計年度第四季，而它自己的初步更新已經先把框架講好了:營收落在 110 至 125 億美元指引區間的低端，但 GAAP 與非 GAAP 毛利率估計落在 15% 至 17%，遠高於原本 8.2% 至 8.4% 的指引，公司歸因於有利的客戶與產品組合;同一季收到超過 600 億美元的新訂單，在手訂單創下新高。市場預估每股盈餘 0.68 美元、年增 65%。CoreWeave 同樣在 8/11 公布，市場預估單季每股虧損 1.17 美元、年減 333.3%——營收在增加、獲利在惡化，那正是「先建產能、需求後到」在損益表上的長相。京東在同一週公布財報，是這一週少數可以拿到的非美國需求讀數。", "url": "https://www.businesswire.com/news/home/20260721109492/en/Supermicro-Provides-Fourth-Quarter-of-Fiscal-Year-2026-Preliminary-Business-Update"},
    {"id": "eval_0", "channel": "今日評估", "tag": "週末一件事", "color": "#E8A838", "stocks": [{"t": "SPY", "n": "標普500 ETF，全週漲 3.6% 收在 7,757.64 的紀錄高點"}, {"t": "VTWO", "n": "羅素 2000 ETF，今年以來漲約 20%，全年可望創 2003 年以來最佳"}], "en": "The one thing to hold from this week is a contradiction that has not resolved. All three indexes had their strongest week since April, and the Russell 2000 is running its best year since 2003 — while inside those same five sessions a top-five mortgage lender lost $452 million and suspended its dividend, an aerospace business cut its growth outlook by three points and lost a fifth of its value, and the economy printed negative payrolls. Both descriptions are accurate. What reconciles them is that the index is being priced off the rate path while individual companies are being priced off their own forecasts, and this week the rate path won. Wednesday's CPI is where that gets settled, because it is the one number that can move the rate path back. So the question worth sitting with over the weekend: if July CPI comes in hot on Wednesday and the September hike is back on the table, which of your positions were you holding because of the business, and which were you holding because of the rate path? You do not need to trade the answer. You do need to know it before Wednesday, not after.", "zh": "這一週值得留下來的一件事，是一個還沒有被解決的矛盾。三大指數都寫下 4 月以來最強的一週，羅素 2000 正在跑 2003 年以來最好的一年——而在同樣這五個交易日裡，一家前五大的房貸業者虧了 4.52 億美元並暫停股利，一家航太事業把成長展望砍掉三個百分點、市值跟著掉了五分之一，而整個經濟交出的是一份負值的就業數據。這兩種描述都是準確的。把它們調和起來的解釋是:指數是照著利率路徑在定價，個別公司是照著自己的預測在定價，而這一週是利率路徑贏了。週三的 CPI 就是這件事被裁決的地方，因為它是唯一有能力把利率路徑推回去的那個數字。所以這個週末值得坐下來想的問題是:如果 7 月 CPI 在週三偏熱、9 月升息重新回到桌上，你手上哪些部位是因為那門生意而持有的，哪些是因為利率路徑而持有的?你不需要拿這個答案去做交易，但你需要在週三之前就知道，而不是週三之後。", "url": "https://www.ig.com/ae/news-and-trade-ideas/week-ahead-august-10th-2026-260807", "status": "今日討論 · 按下方討論鍵跟 Claude 繼續聊"},

// 「資金流向」是特殊分頁:嵌 TradingView 即時熱力圖,不吃 CARDS、每日排程不用動它
const TODAY_SUBS = ["全部", ...CHANNELS.map(c => c.key), "資金流向"];

// 內容指紋:CARDS 一換(每日排程更新)就變,閱讀進度 key 跟著換 → 新的一天自動從第 1 張開始讀。
// 排程只要照常抽換 CARDS 就好,不用額外維護日期。
const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}
