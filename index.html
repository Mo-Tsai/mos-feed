<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },

  { key: "內部人動向", color: "#6DB56D" },

  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "很窄的紅盤", "color": "#E05C5C", "zh": "週一盤前的形狀是「指數紅、內容分裂」：SPY 報 762.80 幾乎打平（+0.03%），QQQ 722.41 漲 0.77%，但羅素 2000 的 IWM 反而是 284.10、跌 0.47%。撐盤的是輝達、亞馬遜、Alphabet 與加密貨幣，同一時間微軟、蘋果、Meta、特斯拉走弱，防禦類股整排在跌。這不是全面的 risk-on，是一個只有少數高 beta 名字在動的窄盤。上週升息之後，市場還沒決定要用什麼邏輯重新排隊，今天的分裂就是那個猶豫的樣子。", "en": "Monday's premarket shape is green at the index level but split underneath: SPY at 762.80 is essentially flat (+0.03%), QQQ at 722.41 is up 0.77%, while the Russell 2000's IWM sits at 284.10, down 0.47%. The bid is in Nvidia, Amazon, Alphabet and crypto, while Microsoft, Apple, Meta and Tesla are weaker and defensive sectors are broadly lower. This is not a broad risk-on tape; it is a narrow one carried by a handful of high-beta names. After last week's hike the market has not decided which logic to re-sort by, and today's split is what that hesitation looks like.", "url": "https://strongbuyanalytics.com/stock-market-outlook", "stocks": [{"t": "SPY", "n": "標普 500 ETF，盤前 762.80、幾乎打平"}, {"t": "QQQ", "n": "那斯達克 100 ETF，盤前 722.41、+0.77%，唯一有力道的一邊"}, {"t": "IWM", "n": "羅素 2000 ETF，盤前 284.10、-0.47%，在漲勢裡再次缺席"}, {"t": "NVDA", "n": "盤前領漲的高 beta 代表，撐住整個那斯達克的敘事"}]},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "油價的地板破了", "color": "#E05C5C", "zh": "上週五還站在每桶 100 美元附近的西德州原油，今天盤前大幅下挫。理由不是需求變差，是供給的恐懼在消退：衛星影像顯示沙烏地過去六天經荷莫茲海峽運出約 280 萬桶／日，而八月只有 70 萬桶／日；沙烏地阿美預期東西向輸油管能恢復一半流量；伊朗與阿曼談成的臨時航道也正在往外攤牌。原油從 9 月 15 日以來已經是連續第四個交易日走弱。對美股來說這不是單純的好消息——能源是今年最強的板塊，它的多頭理由正好就是現在在瓦解的那一件事。", "en": "WTI, which was still sitting near $100 a barrel on Friday, is sharply lower in Monday's premarket. The driver is not weaker demand but fading supply fear: satellite imagery suggests Saudi Arabia moved about 2.8 million barrels a day through the Strait of Hormuz over the past six days, against just 700,000 a day in August; Aramco expects to restore half the flows on its East-West pipeline; and the temporary lane Iran negotiated with Oman is being formally laid out. Crude has now fallen for a fourth straight session since September 15. For US equities this is not simply good news - energy is the strongest sector of the year, and the bull case that carried it is precisely the thing now coming apart.", "url": "https://tradingeconomics.com/commodity/crude-oil", "stocks": [{"t": "USO", "n": "西德州原油 ETF，盤前自 100 美元上方重挫"}, {"t": "XLE", "n": "能源類股 ETF，今年最強的板塊，多頭理由直接被打到"}, {"t": "DVN", "n": "上游頁岩商，避險比例低、對油價的營收彈性最直接"}, {"t": "VLO", "n": "大型煉油商，裂解價差的多頭故事跟著原油敘事一起鬆動"}]},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "油跌但殖利率漲", "color": "#E05C5C", "zh": "今天盤前最值得停下來看的組合是：原油大跌，而十年期美國公債殖利率同時往上走。過去半年市場的簡單連結是「油漲＝通膨＝殖利率漲」，今天這條線被打斷了。如果油跌而殖利率還在漲，代表現在推動長端的不是通膨預期，而是對聯準會不會很快轉向的定價——點陣圖裡 18 位有 16 位預期年底前還要再升一次，這件事還沒被完全吸收。公用事業盤前走弱也是同一件事的另一面：它們是被當成債券代理在賣，不是被當成 AI 用電故事在買。", "en": "The combination worth pausing on this morning is crude sharply lower while the 10-year Treasury yield moves higher at the same time. For six months the market's shorthand has been oil up equals inflation equals yields up; today that line breaks. If oil falls and yields still rise, what is driving the long end is not inflation expectations but the pricing of a Fed that will not pivot soon - 16 of 18 dots still point to one more hike before year-end, and that has not been fully absorbed. Utilities weakening in the premarket is the same fact from another angle: they are being sold as bond proxies, not bought as an AI-power story.", "url": "https://www.investing.com/analysis/sector-rotation-a-guide-to-the-sp-500-momentum-status-200675903", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，長端殖利率再往上、價格承壓"}, {"t": "TIP", "n": "抗通膨債 ETF，油跌時它跟名目債的價差最能看出市場在定價什麼"}, {"t": "XLU", "n": "公用事業 ETF，盤前走弱，被當債券代理賣而非 AI 用電買"}]},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "防禦股在漲勢裡跌", "color": "#E05C5C", "zh": "盤前的板塊排列有一個不常見的組合：必需消費、通訊服務、公用事業三個防禦性類股同時走弱，而半導體、ARKK 這類高 beta 同時走強，VIX 還在往下。一般的 risk-on 是資金從防禦流向景氣循環，今天則是從防禦直接跳到高 beta，中間的景氣循環沒有接到多少。這種結構的意思是市場沒有在買「經濟會變好」，是在買「少數幾家公司的成長跟利率無關」。這種行情通常很難用板塊輪動的方式跟，也比較容易在單一消息上一次還回去。", "en": "One uncommon arrangement in the premarket: consumer staples, communication services and utilities - three defensive groups - are weak at the same time as semiconductors and ARKK-style high beta are strong, with VIX lower. A normal risk-on rotates money from defensives into cyclicals; today it jumps straight from defensives to high beta, with cyclicals picking up little in between. What that structure says is that the market is not buying a better economy, it is buying the idea that a handful of companies grow regardless of rates. Tapes like this are hard to follow through sector rotation and tend to give it all back on a single headline.", "url": "https://strongbuyanalytics.com/stock-market-outlook", "stocks": [{"t": "XLP", "n": "必需消費 ETF，盤前走弱，防禦買盤缺席"}, {"t": "XLC", "n": "通訊服務 ETF，今年最差的板塊、年初至今約 -5.3%"}, {"t": "SMH", "n": "半導體 ETF，盤前領漲的高 beta 核心"}, {"t": "ARKK", "n": "高成長主動型 ETF，跟半導體同向，是這種窄盤的溫度計"}]},
    {"id": "earn_0", "channel": "財報速報", "tag": "記憶體要搬進美國", "color": "#E8786A", "zh": "9 月 16 日路透報導 SK 海力士正與英特爾洽談在美國生產記憶體晶片，消息當天英特爾漲約 5%，SK 海力士的那斯達克掛牌股漲約 2%，今天盤前英特爾再度走強。談判有兩個可能結構：SK 海力士承租英特爾俄亥俄廠的一部分，或是與英特爾及需要安全記憶體供應的雲端業者合組合資公司。SK 海力士官方的說法是「尚未有任何事項決定」，所以這目前是一則早期消息、不是一樁案子。重點在於它同時解決兩邊的問題：英特爾的美國產能需要外部需求填，而記憶體的美國本土製造到現在是零——SK 海力士上個月在印第安納動工的 40 億美元廠是封測，不是製造。", "en": "On September 16 Reuters reported that SK hynix is in early talks with Intel about making memory chips in the United States; Intel rose about 5% on the day and SK hynix's Nasdaq-listed shares about 2%, and Intel is firmer again in Monday's premarket. Two structures are under discussion: SK hynix leasing part of Intel's Ohio fab, or a venture with Intel and cloud firms that want secure memory supply. SK hynix's official line is that nothing has been determined, so this is an early report rather than a deal. What makes it matter is that it solves both sides at once: Intel's US capacity needs outside demand, and US-based memory manufacturing is currently zero - the $4 billion Indiana plant SK hynix broke ground on last month does packaging and test, not fabrication.", "url": "https://www.cnbc.com/2026/09/16/intel-sk-hynix-us-memory-chips.html", "stocks": [{"t": "INTC", "n": "消息當天漲約 5%，今天盤前再走強，代工產能的外部需求是關鍵"}, {"t": "MU", "n": "美國唯一的本土記憶體製造商，這則談判直接改變它的競爭地景"}, {"t": "AMAT", "n": "半導體設備商，美國新增記憶體產能等於新增設備資本支出"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "同一天兩個方向", "color": "#E8786A", "zh": "Xenon Pharmaceuticals 在 9 月 17 日同一份公告裡講了兩件相反的事：一方面向美國食品藥物管理局遞交 azetukalner 治療局灶性癲癇的新藥查驗登記，另一方面暫停重度憂鬱症與雙相憂鬱症三期試驗的新病人收案，原因是出現包含精神病症狀在內的神經精神不良事件。市場只聽到後半句，盤後先跌約 22%，之後一度擴大到 32%。公司說這些不良事件符合已知的安全性輪廓，但先前的試驗階段沒有觀察到；現有受試者繼續治療，公司正在調整劑量。癲癇適應症不受影響——這是判斷這家公司剩下多少價值的關鍵切分。", "en": "Xenon Pharmaceuticals said two opposite things in one September 17 release: it filed a New Drug Application with the FDA for azetukalner in focal seizures, and it paused new enrollment in its Phase 3 major depressive and bipolar depression trials after neuropsychiatric adverse events including psychosis. The market heard only the second half - shares fell about 22% after hours and at one point were down 32%. The company says the events fit the drug's known safety profile but had not appeared in earlier phases; current participants stay on treatment while dosing is adjusted. The epilepsy programme is unaffected, and that split is the key to judging how much value is left here.", "url": "https://www.fiercebiotech.com/biotech/xenon-pauses-phase-3-depression-trials-after-psychosis-events", "stocks": [{"t": "XENE", "n": "暫停憂鬱症三期收案，盤後先跌 22%、一度擴大到 32%"}, {"t": "XBI", "n": "小型生技 ETF，單一臨床事件在這個池子裡的傳染性最高"}, {"t": "JAZZ", "n": "中樞神經領域的中型藥廠，癲癇與精神科管線的對照組"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "保險經紀被買下來", "color": "#E8786A", "zh": "9 月 14 日 The Baldwin Group（BWIN）與 Sequence Holdings 及 DFO Management 簽下合併協議，將被私有化下市。這則消息的資訊量不在保險經紀本身，而在於它回答了一個現在很難回答的問題：在無風險利率 4% 出頭、十年期 5% 的環境裡，私募買方還願不願意用槓桿買一家穩定現金流的公司。保險經紀是典型的「費用型、不吃資產負債表風險、跟保費漲價同向」的生意，是槓桿收購名單上長年的常客。如果連這種資產都還有人出價，代表私募信貸的水位還沒被升息抽乾；如果這是最後一筆，那它就是這一輪的頂。", "en": "On September 14 The Baldwin Group (BWIN) signed a merger agreement with Sequence Holdings and DFO Management to be taken private. The information here is less about insurance broking than about a question that is hard to answer right now: with the risk-free rate above 4% and the 10-year at 5%, will private buyers still lever up to buy a stable cash-flow business? Insurance broking is the classic fee-based, balance-sheet-light model that rises with premium rates, and a perennial name on leveraged-buyout lists. If even this asset still draws a bid, private credit has not been drained by the hiking cycle; if it turns out to be the last one, it marks the top of this round.", "url": "https://www.insidearbitrage.com/category/new-merger-announcements/", "stocks": [{"t": "BWIN", "n": "9/14 簽約被 Sequence Holdings 與 DFO Management 私有化"}, {"t": "AJG", "n": "大型保險經紀，同業估值的對照基準"}, {"t": "BRO", "n": "中型保險經紀，最直接的併購比價對象"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "連 16 個月不動", "color": "#7C6AF7", "zh": "中國人民銀行今天公布貸款市場報價利率維持不變，一年期 3.00%、五年期以上 3.50%，這是連續第 16 個月不動，路透調查的 21 位市場參與者全部猜中。真正的重點是不動的理由：聯準會剛升息一碼，中美利差擴大，人民幣有壓力；同時國內信貸需求弱、銀行淨息差已經薄到降息會直接傷害銀行的獲利能力。也就是說，全球最後一個還有降息空間的大型經濟體，現在也被綁住了。對美股投資人而言，這降低了「中國放水拉動全球需求」這條舊劇本在今年剩下時間發生的機率。", "en": "The People's Bank of China left its loan prime rates unchanged today at 3.00% for one year and 3.50% for five years and above, a 16th straight month on hold, exactly as all 21 participants in a Reuters poll expected. What matters is the reason: the Fed has just hiked, the US-China rate gap has widened and the yuan is under pressure, while domestic credit demand is weak and bank net interest margins are already thin enough that a cut would hit bank profitability directly. In other words, the last large economy with room to ease is now tied up too. For US equity investors that lowers the odds of the old script - China stimulates, global demand follows - playing out in what remains of this year.", "url": "https://investinglive.com/central-banks/china-holds-loan-prime-rates-for-16th-month-as-fed-hike-narrows-room-to-ease/", "stocks": [{"t": "FXI", "n": "中國大型股 ETF，降息預期被壓縮是最直接的估值壓力"}, {"t": "KWEB", "n": "中概網路 ETF，對「中國放水」這條劇本的彈性最大"}, {"t": "MCHI", "n": "中國全市場 ETF，看的是整體風險溢價而非單一板塊"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "9/24 川習會", "color": "#7C6AF7", "zh": "本週四習近平將在白宮與川普會面，這是一年內第三次會晤，也是十多年來中國領導人首次對華府的國是訪問。議程上最重要的三件事是關鍵礦物、科技與台灣，而市場真正在等的是 11 月 10 日到期的關稅休兵會不會延長——當初就是這份協議把已經衝破 100% 的關稅拉回來。另外兩個可量化的部分是涵蓋約 300 億美元商品的互降關稅提案，以及農產品與非關稅壁壘的進展。風險也很具體：北京已經透過外交管道警告，若華府在習近平抵達前通過對台 140 億美元的軍售案，峰會就取消。", "en": "Xi Jinping meets Donald Trump at the White House on Thursday, their third meeting in under a year and the first Chinese state visit to Washington in more than a decade. Critical minerals, technology and Taiwan top the agenda, but what the market is really waiting on is whether the tariff truce expiring November 10 gets extended - that truce is what pulled tariffs back from above 100%. Two other quantifiable pieces are a proposed mutual tariff reduction covering about $30 billion of goods, and progress on agriculture and non-tariff barriers. The risk is equally concrete: Beijing has warned through diplomatic channels that it would cancel the summit if Washington approves a pending $14 billion arms package for Taiwan before Xi arrives.", "url": "https://www.weforum.org/stories/geo-economics-and-politics/what-to-expect-from-the-trump-xi-summit-in-washington/", "stocks": [{"t": "DE", "n": "農機龍頭，農產品採購與非關稅壁壘的進展直接影響終端需求"}, {"t": "ADM", "n": "農產品加工與貿易商，中國採購承諾的第一線受益者"}, {"t": "TSM", "n": "先進製程代工，科技管制與台灣議題同時出現在議程上"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "沒有資料的一週", "color": "#7C6AF7", "zh": "這一週的行事曆很輕但發言很重：聯準會官員總共安排了不下 10 場公開露面，包括今天芝加哥聯邦準備銀行總裁 Goolsbee 的談話，以及本週稍後的 Williams、Barkin、Hammack。硬資料方面今天只有芝加哥聯準全國活動指數，沒有消費者物價指數、也沒有個人消費支出物價指數（八月的要等 9 月 30 日）。沒有資料的一週不代表波動小，反而常常相反：市場沒有客觀錨點時，只能用官員的措辭重新定價，一句「我們對再升一次抱持開放態度」在這種環境裡的殺傷力，會比有資料的一週大得多。", "en": "This week's calendar is light on data and heavy on talk: Fed officials are scheduled for no fewer than 10 public appearances, including Chicago Fed President Goolsbee today and Williams, Barkin and Hammack later in the week. On the hard-data side today brings only the Chicago Fed National Activity Index, with no CPI and no PCE - the August PCE print waits until September 30. A week without data does not mean a quiet week; often the opposite. With no objective anchor, the market can only reprice off officials' wording, and a line like 'we remain open to one more' does more damage in this kind of week than it would in one with numbers.", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar", "stocks": [{"t": "IEI", "n": "3-7 年期公債 ETF，對政策路徑的敏感度最高的一段"}, {"t": "UUP", "n": "美元指數 ETF，官員措辭轉鷹時最快反應的資產"}, {"t": "BIL", "n": "短天期國庫券 ETF，年底前再升一碼的定價直接落在這裡"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "最強與最弱", "color": "#4EABA4", "zh": "到 9 月 18 日為止，能源類股 ETF 今年上漲約 45.8%，是所有板塊裡最強的一個；通訊服務 ETF 則是下跌約 5.3%，最弱。這個排序本身就是今年的故事：地緣政治帶來的供給缺口把能源的現金流墊高，而長端殖利率站上 5% 把高存續期的成長股估值壓下來。問題是今天早上油價正在崩，而支撐 45.8% 的那一整套供給恐懼正在鬆開。板塊年度冠軍在最後一季被自己的多頭理由反咬，是過去二十年常見的劇情；判斷點不在油價本身，而在這些公司的獲利有多少是價格、多少是產量與成本紀律。", "en": "Through September 18 the energy sector ETF is up about 45.8% for the year, the strongest group, while communication services is down about 5.3%, the weakest. That ordering is the story of 2026: geopolitically driven supply gaps lifted energy cash flows, while a 10-year yield above 5% compressed multiples on long-duration growth. The problem is that crude is breaking down this morning, and the supply fear underpinning that 45.8% is loosening. A sector leading the year getting bitten by its own bull case in the final quarter is a familiar pattern over the past two decades; the judgment is not about the oil price itself but about how much of these companies' earnings is price versus volume and cost discipline.", "url": "https://www.kalkine.com/news/premium/us-sector-momentum-update-energy-and-utilities-lead-while-health-care-and-financials-lag", "stocks": [{"t": "XLE", "n": "能源類股 ETF，今年至 9/18 約 +45.8%，板塊冠軍"}, {"t": "XLC", "n": "通訊服務 ETF，今年約 -5.3%，板塊最弱"}, {"t": "XOP", "n": "油氣探勘與生產 ETF，對油價的彈性比 XLE 更純"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "公用事業的兩股力", "color": "#4EABA4", "zh": "公用事業現在同時被兩件相反的事拉扯。一邊是資料中心用電的結構性需求，這是過去兩年支撐整個板塊重新評價的故事；另一邊是十年期殖利率站上 5%，讓「拿 3.5% 股息、成長個位數」的傳統公用事業看起來完全沒有吸引力，因為無風險利率就給你更多。今天盤前公用事業走弱，說明第二股力量暫時贏了。要分辨一檔公用事業站在哪一邊，看的是它的成長有多少來自已經簽約的大用戶負載，而不是管理層簡報上的那張需求曲線圖。", "en": "Utilities are being pulled by two opposite forces at once. On one side is structural data-centre power demand, the story that has re-rated the whole sector for two years. On the other is a 10-year yield above 5%, which makes a traditional utility paying 3.5% with single-digit growth look unattractive when the risk-free rate pays more. Utilities weakening in this morning's premarket says the second force is winning for now. To tell which side a given utility sits on, look at how much of its growth comes from already-contracted large-load customers rather than from the demand curve on a management slide.", "url": "https://www.investing.com/analysis/sector-rotation-a-guide-to-the-sp-500-momentum-status-200675903", "stocks": [{"t": "XLU", "n": "公用事業 ETF，盤前走弱，債券代理的一面暫時壓過成長的一面"}, {"t": "NEE", "n": "再生能源與電力公用事業龍頭，資本支出高、對長端利率最敏感"}, {"t": "VST", "n": "獨立發電商，資料中心供電合約是它與傳統公用事業最大的差別"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "建商的補貼吃掉多少", "color": "#4EABA4", "zh": "週四要公布八月新屋銷售，這是本週唯一一份能直接檢驗「5% 殖利率對實體經濟的傷害」的硬資料。三十年期房貸利率跟著十年期公債走，長端站上 5% 之後，建商維持銷售量的方法是自己出錢買低房貸利率，把成本從買方轉到自己的毛利上。所以看建商的財報要分兩層：銷售棟數是不是還在，以及每一棟的毛利被補貼吃掉多少。棟數撐住而毛利率往下，代表需求其實已經走弱，只是被價格補貼蓋住了。", "en": "August new home sales land on Thursday, the only hard data this week that directly tests how much a 5% yield is hurting the real economy. Thirty-year mortgage rates track the 10-year Treasury, and with the long end above 5% builders have kept volumes by paying for rate buydowns themselves - moving the cost from the buyer onto their own gross margin. So builder results need reading in two layers: whether unit closings are holding, and how much of each unit's margin the incentive ate. Units holding while gross margin slips means demand has already weakened and is simply being papered over with price.", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar", "stocks": [{"t": "XHB", "n": "住宅建築 ETF，週四新屋銷售最直接的反應標的"}, {"t": "LEN", "n": "大型建商，9/17 已公布的財報是這次數據的前導讀數"}, {"t": "DHI", "n": "量最大的建商，買點補貼對毛利率的侵蝕在它身上最容易量化"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "漲勢裡缺席", "color": "#5B8ED6", "zh": "今天盤前那斯達克在漲、羅素 2000 在跌，這是升息定案之後反覆出現的組合。小型股的落後不是情緒問題，是算術問題：它們的資本結構對短端利率的敏感度遠高於大型股，而聯準會剛剛把短端往上推了一碼，點陣圖還指向年底前可能再一次。過去兩年「小型股補漲」的論點幾乎都建立在「降息快到了」，這個前提在 9 月 16 日被正式撤掉。接下來要看的不是羅素 2000 跌多少，而是它內部的分化——有沒有現金、有沒有定價能力的那一半會開始跟沒有的那一半分家。", "en": "The Nasdaq is up and the Russell 2000 is down in this morning's premarket, a pairing that keeps recurring since the hike was confirmed. Small-cap underperformance is not a sentiment problem but an arithmetic one: their capital structures are far more sensitive to the front end than large caps', and the Fed has just pushed the front end up a quarter point with dots pointing to possibly one more before year-end. Almost every small-cap catch-up thesis of the past two years rested on cuts being near, and that premise was formally withdrawn on September 16. What to watch next is not how much the Russell falls but the dispersion inside it - whether the half with cash and pricing power starts separating from the half without.", "url": "https://www.cmegroup.com/videos/2026/09/16/e-mini-russell-2000-futures-reverse-lower-as-fed-hikes-rates-9-.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，盤前 -0.47%，與 QQQ 的 +0.77% 形成對照"}, {"t": "IJR", "n": "標普小型股 600 ETF，成分股要求獲利，體質優於羅素 2000"}, {"t": "VTWO", "n": "羅素 2000 的另一個載具，費用更低、走勢與 IWM 幾乎同步"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "3680 億的牆", "color": "#5B8ED6", "zh": "小型股在 2026 年面對約 3,680 億美元的到期債務牆。真正的問題不是金額，是價差：這批債大多是在利率 1% 到 2% 的年代發出去的，現在要用接近 6.5% 的成本轉貸。同一筆借款，利息支出變成三到四倍，而營收不會因為換約就跟著漲。這件事的殺傷力是分批而不是一次性的——每一季都有一小群公司在財報上把利息費用往上跳一階，然後市場才發現原本的獲利預估是用舊利率算的。看小型股的財報，利息費用那一行比營收那一行更值得先看。", "en": "Small caps face a maturity wall of roughly $368 billion in 2026. The number is not the problem; the spread is. Most of that debt was issued when rates were 1% to 2% and now has to be refinanced near 6.5%. On the same borrowing, interest expense becomes three to four times larger, while revenue does not rise just because the paper rolled. The damage arrives in instalments rather than all at once - each quarter a small group of companies steps its interest expense up a notch, and only then does the market notice the earnings estimates were built on the old rate. When reading small-cap results, the interest expense line deserves your eye before the revenue line.", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment", "stocks": [{"t": "HYG", "n": "高收益債 ETF，轉貸成本的市場價格就寫在這裡"}, {"t": "BKLN", "n": "銀行貸款（浮動利率）ETF，借款人成本上升的另一端"}, {"t": "IWO", "n": "羅素 2000 成長型 ETF，未獲利公司佔比高、轉貸壓力最集中"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "便宜的理由", "color": "#5B8ED6", "zh": "羅素 2000 的落後本益比壓到約 19.5 倍，標普 500 接近 30 倍，價差看起來很誘人。但同一份分析指出，羅素 2000 裡有 41% 到 46% 的公司，營業利益蓋不住自己的利息費用。這兩個數字要放在一起讀：指數層級的本益比是由有獲利的那一半撐出來的，而接近一半的成分股在會計上根本沒有「本益比」可言。所以「小型股比大型股便宜」這句話在指數層級是對的，在個股層級幾乎沒有意義。要在這個池子裡找便宜，唯一能用的篩選是自由現金流與淨負債，不是本益比。", "en": "The Russell 2000's trailing P/E has compressed to about 19.5x against nearly 30x for the S&P 500, a gap that looks inviting. But the same analysis notes that 41% to 46% of Russell 2000 companies cannot cover their interest expense with operating profit. Read the two together: the index-level multiple is held up by the profitable half, while close to half the constituents have no meaningful P/E at all. So 'small caps are cheaper than large caps' is true at the index level and almost meaningless at the stock level. The only screen that works in this pool is free cash flow and net debt, not the earnings multiple.", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment", "stocks": [{"t": "IWN", "n": "羅素 2000 價值型 ETF，便宜的那一半裡體質差異最大"}, {"t": "VBR", "n": "小型價值 ETF，篩選標準與 IWN 不同，可以互相對照"}, {"t": "IJS", "n": "標普小型股 600 價值 ETF，因為母指數要求獲利，體質篩過一輪"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "同一則消息兩倍幅度", "color": "#5B8ED6", "zh": "這幾天有兩個很乾淨的樣本可以看小型股的流動性差異：Alphatec 在執行長買進的消息後盤中一度上漲 19.1%，Xenon 在暫停收案的消息後盤後跌約 22%、一度擴大到 32%。同樣份量的消息放在大型股身上，幅度通常只有個位數。原因不是小型股的基本面更敏感，是做市深度太薄、被動基金持股比例低、浮動籌碼小，成交簿上一點點買賣就把價格推很遠。對閱讀者的實務意義是：在小型股裡，單日漲跌幅幾乎不能當成消息重要性的指標，要看的是成交量相對於平均量的倍數。", "en": "Two clean samples this week show the liquidity difference in small caps: Alphatec traded up as much as 19.1% intraday on news of its CEO's purchase, while Xenon fell about 22% after hours on the enrollment pause and at one point 32%. News of similar weight on a large cap usually moves it by single digits. The reason is not that small-cap fundamentals are more sensitive but that market-making depth is thin, passive ownership is low and the float is small, so modest flow pushes price a long way. The practical takeaway is that in small caps a one-day move is a poor gauge of how important the news was - the number to look at is volume as a multiple of its average.", "url": "https://www.marketbeat.com/instant-alerts/insider-insider-buying-alphatec-nasdaq-atec-ceo-acquires-101315000-in-stock-2026-09-10/", "stocks": [{"t": "ATEC", "n": "執行長買進消息後盤中一度 +19.1%，小型醫材的深度樣本"}, {"t": "XENE", "n": "暫停收案後盤後 -22%、一度 -32%，同一份公告還有利多"}, {"t": "IWO", "n": "羅素 2000 成長型 ETF，這類單日大幅波動的集中地"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "小油商先流血", "color": "#5B8ED6", "zh": "油價今天盤前重挫，第一個被打到的不是大型綜合油商，是小型上游與油田服務商。差別在三件事：小型上游的避險比例通常比大型低，所以現貨價的變動幾乎全額打進營收；它們的產區集中，沒辦法用地理分散去平滑；以及油田服務商的鑽機日費是落後指標，客戶的資本支出決策通常要一兩季才會反映到報價上。所以油價跌的第一週看的是上游股價，第二個月才看得到鑽機數量。想追這個主題的人，鑽機數週報比油價日線更有資訊量。", "en": "With crude sharply lower in the premarket, the first casualties are not the large integrated majors but small upstream producers and oilfield service firms. Three things drive the difference: small producers typically hedge a lower share of output, so spot moves flow almost fully into revenue; their acreage is concentrated, leaving no geographic smoothing; and rig day rates are a lagging indicator, since customers' capex decisions take a quarter or two to reach quoted prices. So week one of an oil decline shows up in upstream share prices, and only by month two in rig counts. For anyone following this theme, the weekly rig count carries more information than the daily oil chart.", "url": "https://tradingeconomics.com/commodity/crude-oil", "stocks": [{"t": "XOP", "n": "油氣探勘生產 ETF，小型上游佔比高，油價彈性最大"}, {"t": "PTEN", "n": "陸上鑽井與完井服務商，日費與鑽機數是落後指標的代表"}, {"t": "HP", "n": "高規格陸上鑽機業者，客戶資本支出轉向會延遲一兩季才反映"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "主席自己掏 520 萬", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（不良資產比率）", "zh": "Kayne Anderson BDC（KBDC）是一家商業發展公司，專做美國中型企業的直接放款，2024 年才掛牌，分析師覆蓋很少、媒體幾乎不寫。正在改變的是：董事長 James Robo 透過 Ventus Capital 在 9 月 14 日與 16 日買進共 40 萬股、均價約 13.03 美元、金額約 521 萬美元，Form 4 申報代碼是公開市場買進的「P」，且沒有 10b5-1 預設計畫；其中 9 月 16 日單日就是 34 萬股、約 443 萬美元。Robo 是前 NextEra Energy 執行長，這不是一個會為了作秀買股票的人。反方論點很清楚：BDC 的放款是浮動利率，升息抬高利息收入的同時也抬高借款人的違約率，中型企業正是最沒有議價能力的那一層；而且 BDC 的淨值是用模型評價的非上市債權，帳面好看不代表收得回來。這是研究線索，不是投資建議。", "en": "Kayne Anderson BDC (KBDC) is a business development company doing direct lending to US middle-market firms, listed only in 2024, with thin analyst coverage and almost no press. What is changing: Chairman James Robo, through Ventus Capital, bought 400,000 shares on September 14 and 16 at an average near $13.03, about $5.21 million, filed under Form 4 code P for open-market purchases with no 10b5-1 plan - including 340,000 shares for about $4.43 million on September 16 alone. Robo is the former CEO of NextEra Energy, not a man who buys stock for show. The counter-case is plain: BDC loans float, so hikes lift interest income and borrower default rates together, and middle-market firms are the layer with the least pricing power; a BDC's net asset value is also model-marked private credit, so a clean book is not the same as collectible. This is a research lead, not investment advice.", "url": "https://www.marketbeat.com/instant-alerts/insider-kayne-anderson-bdc-nyse-kbdc-director-buys-443360000-in-stock-2026-09-16/", "stocks": [{"t": "KBDC", "n": "主角，董事長 9/14 與 9/16 合計買進約 521 萬美元、均價約 13.03"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "創辦人回來掀桌", "color": "#C9A227", "status": "RADAR · 下一個驗證點 2026 年股東會三項提案表決", "zh": "Freightos（CRGO）經營國際貨運的線上訂艙與報價平台，可以理解成「貨櫃與空運版的機票比價網」，市值很小、分析師覆蓋極低。正在改變的是治理：創辦人 Zvi Schreiber 在 2025 年 12 月卸任執行長、2026 年 2 月離開董事會之後，於 6 月 29 日把持股申報從被動的 13G 改成主動的 13D，揭露約 6.1% 持股並表明公司應該改變策略、管理層或董事會；7 月 8 日向公司提出三項股東會提案，包括撤換董事長 Udo Lange、改聘有規模化成長型科技公司經驗的董事長、以及修改章程讓全體董事改為年度改選；9 月 9 日另外架了 GrowCRGO 直接向股東訴求。風險很實際：微型股的治理戰可能拖上一整年，期間本業不會自動變好，而平台業務的成長能不能回來，跟誰當董事長並沒有必然關係。這是研究線索，不是投資建議。", "en": "Freightos (CRGO) runs an online booking and quoting platform for international freight - think a fare-comparison site for ocean and air cargo - with a very small market cap and minimal analyst coverage. What is changing is governance: founder Zvi Schreiber, who stepped down as CEO in December 2025 and left the board in February 2026, converted his holding from a passive 13G to an activist 13D on June 29, disclosing about 6.1% and stating the company should change strategy, management or board. On July 8 he filed three resolutions for the 2026 annual meeting - removing Chairman Udo Lange, appointing a chairman experienced in scaling growth-stage technology companies, and amending the articles for annual election of all directors - and on September 9 launched GrowCRGO to take the case to shareholders directly. The risk is real: a micro-cap governance fight can run a full year while the operating business does not improve on its own, and whether platform growth returns has no necessary connection to who chairs the board. This is a research lead, not investment advice.", "url": "https://theloadstar.com/freightos-founder-zvi-schreiber-turns-activist-in-battle-to-restore-growth/", "stocks": [{"t": "CRGO", "n": "主角，創辦人持股約 6.1%、已轉 13D 並提出三項股東會提案"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "阿茲海默的小量產", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（處方瓶數與現金消耗）", "zh": "Alpha Cognition（ACOG）是一家微型製藥公司，唯一的商品是治療輕度到中度阿茲海默症失智的口服藥 ZUNVEYL，市值小、覆蓋極少。正在改變的是它真的在賣東西：第二季淨營收約 600 萬美元，比第一季的 350 萬成長約 71%；出貨瓶數季增約 37% 到 8,294 瓶，六月單月需求達 2,997 瓶；有分析師把合理價值估計從約 14.67 美元上調到 16.75 美元，理由是商業執行改善與給付方談判進展。另外 9 月 16 日有一位 10% 股東在市場上買進約 110 萬美元。風險非常明確：阿茲海默是商業化的墳場，銷售爬升在早期都很漂亮，真正的關卡是給付覆蓋與續方率；而且微型藥廠的現金消耗速度決定它有沒有機會走到那一關，增資稀釋是隨時可能發生的事。這是研究線索，不是投資建議。", "en": "Alpha Cognition (ACOG) is a micro-cap pharmaceutical company whose only product is ZUNVEYL, an oral treatment for mild-to-moderate Alzheimer's dementia, with a small market cap and almost no coverage. What is changing is that it is actually selling: second-quarter net revenue was about $6.0 million, up roughly 71% from $3.5 million in the first quarter; bottles dispensed rose about 37% quarter over quarter to 8,294, with June monthly demand at 2,997. One analyst lifted a fair-value estimate from about $14.67 to $16.75 on improving commercial execution and payer discussions, and on September 16 a 10% holder bought about $1.1 million in the open market. The risks are explicit: Alzheimer's is a commercial graveyard, early launch curves always look good, and the real gate is reimbursement coverage and refill rates - while a micro-cap's cash burn decides whether it reaches that gate at all, with dilution possible at any time. This is a research lead, not investment advice.", "url": "https://www.biospace.com/press-releases/alpha-cognition-inc-reports-second-quarter-2026-financial-results-and-provides-operational-update", "stocks": [{"t": "ACOG", "n": "主角，ZUNVEYL 第二季淨營收約 600 萬、季增約 71%"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "稀缺論點的到期日", "color": "#C9A227", "status": "RADAR · 下一個驗證點 9/24 川習會與 11/27 管制暫停到期", "zh": "池內更新：美國銻業（UAMY）這檔的整個多頭論點建立在「銻很稀缺」，而稀缺的來源是中國的出口管制。現在出現了一個很具體的時間表——中國對美國的鎵、鍺、銻出口禁令暫停到 2026 年 11 月 27 日，跟 11 月 10 日到期的關稅休兵幾乎是同一個窗口，而本週四的川習會就是最近的檢查點。這代表論點的方向可能跟直覺相反：如果峰會談成、休兵延長、管制繼續暫停，對它其實是利空。基本面這邊也已經在警告：第二季營收年減約 25%，原因正是銻價下跌；公司把 2026 全年毛營收指引從 1.25 億美元下修到 6,000 萬到 7,500 萬美元，幅度非常大。9 月 19 日股價約 4.66 美元、市值約 6.94 億美元，也就是市場仍然給著很高的期待倍數。要追這檔，先追 9/24 與 11/27 兩個日子。這是研究線索，不是投資建議。", "en": "Pool update: the entire bull case on United States Antimony (UAMY) rests on antimony being scarce, and that scarcity comes from Chinese export controls. There is now a concrete timetable - China's suspension of its gallium, germanium and antimony export ban to the US runs to November 27, 2026, almost the same window as the tariff truce expiring November 10, and Thursday's Trump-Xi summit is the nearest checkpoint. That means the thesis may run opposite to intuition: if the summit succeeds, the truce extends and the suspension holds, that is bearish for the stock. The fundamentals are already warning - second-quarter revenue fell about 25% year over year on lower antimony prices, and full-year 2026 gross revenue guidance was cut from $125 million to $60-75 million, a very large step down. The shares were about $4.66 on September 19 for a market cap near $694 million, so the market is still paying a high expectations multiple. To follow this name, follow September 24 and November 27 first. This is a research lead, not investment advice.", "url": "https://www.pillsburylaw.com/en/news-and-insights/china-suspends-export-controls-certain-critical-minerals-related-items.html", "stocks": [{"t": "UAMY", "n": "池內股，全年毛營收指引自 1.25 億下修到 6,000 萬-7,500 萬"}, {"t": "CRML", "n": "池內另一檔關鍵礦物股，同一組政策風險的對照樣本"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "董事長連續買第二次", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報與新約日費", "zh": "池內更新：Borr Drilling（BORR）做淺水自升式鑽井平台租賃，覆蓋少、市值小。新證據是連續性——董事長 Tor Olav Troim 在 9 月 16 日再度買進約 430 萬美元，而 8 月 25 日他才剛在公開市場買了 20 萬股、約 87.5 萬美元。兩次之間不到一個月，金額還放大了將近五倍，這比單筆更值得記下來：連續買進代表他在第一次之後看到的東西沒有讓他改變想法。反方論點今天特別重要——油價正在崩，而鑽井業者的日費是跟著客戶的資本支出決策走的落後指標，油價如果在低位待上一季，新約日費會直接往下調。Troim 的買點是在油價 100 美元上方的世界裡形成的，今天的世界不一樣了。這是研究線索，不是投資建議。", "en": "Pool update: Borr Drilling (BORR) leases shallow-water jack-up rigs, with thin coverage and a small market cap. The new evidence is continuity - Chairman Tor Olav Troim bought about $4.3 million more on September 16, after buying 200,000 shares for roughly $875,000 in the open market on August 25. Less than a month apart and nearly five times larger, a repeat purchase is worth more than a single one: buying again means what he saw after the first did not change his mind. The counter-case matters especially today - crude is breaking down, and driller day rates are a lagging indicator tied to customers' capex decisions, so a quarter of low oil prices feeds straight into lower rates on new contracts. Troim's entry was formed in a world with oil above $100, and today's world is different. This is a research lead, not investment advice.", "url": "https://www.thedesperatetrader.com/insider-buying", "stocks": [{"t": "BORR", "n": "池內股，董事長 9/16 再買約 430 萬，接續 8/25 的 87.5 萬"}, {"t": "VAL", "n": "同業離岸鑽井商，日費與在手合約的對照基準"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "昨天的論點今天被打到", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報（噸海里與日租金）", "zh": "池內更新，而且是降級：Teekay Tankers（TNK）在這個池子裡的論點一直是「制裁與繞道讓油輪的噸海里上升、日租金跟著上升」。今天的新聞正好打在這個論點上——沙烏地過去六天經荷莫茲海峽運出約 280 萬桶／日、八月只有 70 萬桶／日，沙烏地阿美預期東西向輸油管恢復一半流量，伊朗與阿曼的臨時航道也在成形。航道恢復正常等於航程縮短，噸海里下降，這是油輪運價最直接的負面變數。誠實地說：昨天這裡把它寫成受惠制裁拉長航程的標的，今天的資訊讓那個方向站不住，論點降一級為觀察。要繼續追，就把檢查項目改成「日租金有沒有跟著航道正常化往下掉」。這是研究線索，不是投資建議。", "en": "Pool update, and a downgrade: the case for Teekay Tankers (TNK) in this pool has been that sanctions and rerouting lift tanker ton-miles and with them day rates. Today's news lands directly on that thesis - Saudi Arabia moved about 2.8 million barrels a day through the Strait of Hormuz over the past six days against 700,000 a day in August, Aramco expects half of its East-West pipeline flows restored, and the Iran-Oman temporary lane is taking shape. Normalised routing means shorter voyages, fewer ton-miles, and that is the most direct negative variable for tanker rates. To be honest about it: yesterday this slot framed the name as a beneficiary of sanctions lengthening voyages, and today's information does not support that direction, so the thesis drops a level to watch-only. To keep following it, change the check to whether day rates fall as routing normalises. This is a research lead, not investment advice.", "url": "https://tradingeconomics.com/commodity/crude-oil", "stocks": [{"t": "TNK", "n": "池內股，論點自「制裁拉長航程」降級為觀察"}, {"t": "INSW", "n": "同業國際海運，噸海里變化的對照樣本"}]},
    {"id": "insider_0", "channel": "內部人動向", "tag": "52 週低點附近下手", "color": "#6DB56D", "zh": "Alphatec（ATEC）執行長 Patrick Miles 在 9 月 10 日以均價 8.81 美元買進 115,000 股，金額 101 萬 3,150 美元。值得注意的是位置：當時股價貼近 52 週低點 6.82 美元，今年以來跌幅很深。基本面上，最近一季營收 2 億 1,350 萬美元、年增 15%，自由現金流為正，並重申 2026 全年約 8 億 8,200 萬美元的營收指引。申報揭露後股價盤中一度上漲 19.1%，Miles 申報後合計控制 6,154,451 股，其中 589 萬股為直接持有。判讀提醒：執行長在低點買自家股票，最有說服力的部分不是金額，是他沒有選擇等財報——這代表他認為現在的價格與他知道的資訊之間已經有距離。", "en": "Alphatec (ATEC) CEO Patrick Miles bought 115,000 shares on September 10 at an average of $8.81, for $1,013,150. The location is what stands out: the stock was near its 52-week low of $6.82 after a deep year-to-date decline. On fundamentals, the most recent quarter showed revenue of $213.5 million, up 15% year over year, positive free cash flow, and reaffirmed full-year 2026 revenue guidance of about $882 million. Shares traded up as much as 19.1% after the filing, and Miles now controls 6,154,451 shares in total, 5.89 million of them held directly. A reading note: when a CEO buys his own stock at the lows, the persuasive part is not the dollar amount but that he did not wait for the next report - that implies he sees a gap between today's price and what he already knows.", "url": "https://www.marketbeat.com/instant-alerts/insider-insider-buying-alphatec-nasdaq-atec-ceo-acquires-101315000-in-stock-2026-09-10/", "stocks": [{"t": "ATEC", "n": "執行長 9/10 買進 11.5 萬股、均價 8.81，消息後一度 +19.1%"}, {"t": "SYK", "n": "骨科與脊椎大廠，ATEC 搶市佔的對象與估值對照"}, {"t": "GMED", "n": "中型脊椎器械同業，最接近的成長與利潤率比較基準"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "同一天兩個人", "color": "#6DB56D", "zh": "Agree Realty（ADC）在 9 月 16 日同一天出現兩筆內部人買進：董事 John Rakolta Jr. 買進約 140 萬美元，總裁兼執行長 Joey Agree 買進約 50 萬 1,000 美元。群聚比單筆重要，同日更代表兩個人是在同一組資訊下各自決定的。時機是這件事真正的看點——它是零售淨租賃不動產投資信託，是升息環境裡最被嫌棄的類別之一：租約是長年期固定租金，而折現率跟著十年期殖利率往上跑，帳面估值兩頭受壓。管理層在這個時候買進，等於是在說租金與承租人的信用品質撐得住。判讀提醒：這類標的的內部人買進要跟股利率與債務到期表一起看，不然很容易把「配息穩」誤讀成「價值被低估」。", "en": "Agree Realty (ADC) saw two insider purchases on the same day, September 16: director John Rakolta Jr. bought about $1.4 million and President and CEO Joey Agree about $501,000. A cluster carries more weight than a single buy, and same-day timing means two people decided independently on the same information set. The timing is the real point - this is a retail net-lease REIT, one of the least loved categories in a hiking cycle: leases carry long-dated fixed rents while the discount rate tracks a rising 10-year yield, squeezing book values from both ends. Management buying here effectively says rents and tenant credit quality will hold. A reading note: insider buying in this category has to be read alongside the dividend yield and the debt maturity schedule, or a steady payout is easily mistaken for undervaluation.", "url": "https://www.thedesperatetrader.com/insider-buying", "stocks": [{"t": "ADC", "n": "9/16 同日兩筆買進，董事約 140 萬、執行長約 50.1 萬"}, {"t": "O", "n": "最大的零售淨租賃不動產投資信託，估值與資金成本的對照組"}, {"t": "NNN", "n": "另一檔純淨租賃標的，租約結構最接近 ADC"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "金額要跟薪酬比", "color": "#6DB56D", "zh": "判讀卡。九月的內部人買進榜上有幾筆很醒目的金額：Upstart 執行長 Paul Gu 約 130 萬美元、Truist Financial 總裁兼執行長 Michael Lyons 約 100 萬美元、Liberty Latin America 的 10% 股東 John Malone 約 75.8 萬美元。這些數字單看都很大，但內部人買進的訊號強度不是看絕對金額，是看三件事。第一，金額佔這個人年度薪酬的比例——一位年薪 500 萬美元的執行長買 100 萬，跟一位董事費只有 3 萬美元的小型股董事買 2.5 萬，後者的承諾密度高得多。第二，是不是群聚：多位不同職位的內部人在同一個窗口買，遠勝單一個人的大筆。第三，Form 4 的交易代碼是不是公開市場買進的「P」，以及有沒有 10b5-1 預設計畫——有計畫的買進是幾個月前排好的，跟今天的判斷無關。", "en": "A reading card. September's insider-buying list has several eye-catching amounts: Upstart CEO Paul Gu at about $1.3 million, Truist Financial President and CEO Michael Lyons at about $1.0 million, and Liberty Latin America 10% holder John Malone at about $758,000. Each looks large on its own, but the signal strength of an insider buy is not the absolute figure - it is three other things. First, the amount as a share of that person's annual compensation: a CEO earning $5 million buying $1 million is a far thinner commitment than a small-cap director on $30,000 of board fees buying $25,000. Second, whether it clusters: several insiders in different roles buying in the same window beats one large solo purchase. Third, whether the Form 4 transaction code is P for an open-market purchase and whether a 10b5-1 plan was in place - a planned buy was scheduled months ago and says nothing about today's judgment.", "url": "https://www.thedesperatetrader.com/insider-buying", "stocks": [{"t": "UPST", "n": "執行長九月買進約 130 萬美元，金額大但要跟薪酬比例一起讀"}, {"t": "TFC", "n": "總裁兼執行長 9/17 買進約 100 萬美元，大型銀行的樣本"}, {"t": "LILA", "n": "10% 股東 9/17 買進約 75.8 萬，大股東加碼與經理人買進性質不同"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "科技堆裡的一檔隔熱", "color": "#B5654D", "zh": "眾議院書記官的官方定期交易報告顯示，俄亥俄州第二選區眾議員 David J. Taylor 在 9 月 17 日完成申報，九十天窗口內共 28 筆交易、19 買 9 賣，申報金額區間約 4 萬 2,000 到 45 萬 5,000 美元。有意思的不是金額，是組合的形狀：持股最集中的四檔是微軟、Installed Building Products、Alphabet 與博通——三檔大型科技中間夾了一檔住宅隔熱安裝商。這個組合底下的假設可以拆成兩句：一是繼續押資料中心與軟體的長期支出，二是押住宅新建案的量在十年期殖利率 5% 的環境下還撐得住。第二句才是真正需要別人用錢投票才會被注意到的那一句，因為市場現在的共識偏向相反。", "en": "Official periodic transaction reports from the House Clerk show Representative David J. Taylor of Ohio's second district filed on September 17, covering 28 transactions in the ninety-day window - 19 buys and 9 sells - across a disclosed range of roughly $42,000 to $455,000. The interesting part is not the size but the shape: the four largest positions are Microsoft, Installed Building Products, Alphabet and Broadcom - three large-cap technology names with a residential insulation installer wedged in between. The assumptions underneath split into two statements: keep backing long-run data-centre and software spending, and bet that residential construction volumes hold up with the 10-year yield at 5%. The second is the one worth noticing, because consensus currently leans the other way.", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure", "stocks": [{"t": "IBP", "n": "住宅隔熱安裝商，夾在三檔大型科技中間的那一檔"}, {"t": "AVGO", "n": "同一份申報的前四大持股之一，資料中心支出的代表"}, {"t": "MSFT", "n": "申報中最集中的持股，軟體與雲端的長期押注"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "區間與延遲", "color": "#B5654D", "zh": "判讀卡。政要持股資料有兩個結構性限制，今天用 Taylor 這份申報當例子最清楚。第一是金額只有寬區間、沒有實數：28 筆交易的合計只能說是「4 萬 2,000 到 45 萬 5,000 美元之間」，上下差了十倍，你沒有辦法從這裡算出任何部位大小或報酬率。第二是 45 天的申報延遲：9 月 17 日送出的申報，交易本身可能發生在八月上旬——也就是在 9 月 16 日聯準會升息定案之前。跟著買的人買到的不只是別人的舊價位，是另一個利率世界裡形成的判斷。這個頻道要做的事是「看有人用真錢投票給哪個主題」，不是「跟單」，這兩件事在資料結構上根本做不到同一件。", "en": "A reading card. Political-holdings data has two structural limits, and today's Taylor filing shows both clearly. First, amounts come only as wide ranges, never exact figures: the 28 transactions total somewhere between roughly $42,000 and $455,000, a tenfold spread, from which no position size or return can be derived. Second, the 45-day reporting delay: a filing submitted on September 17 may cover trades executed in early August - that is, before the Fed's September 16 hike was confirmed. Anyone following along buys not just someone else's old price but a judgment formed in a different interest-rate world. What this channel does is observe which themes are getting real money voted at them; it is not a copy-trading feed, and the data structure makes those two things impossible to combine.", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報的 ETF，45 天延遲同樣內建在它的持股裡"}, {"t": "GOP", "n": "追蹤共和黨籍議員申報的 ETF，與 NANC 是同一套資料的兩面"}, {"t": "BIL", "n": "短天期國庫券 ETF，升息前後的價位差異就發生在這一段"}]},
    {"id": "week_0", "channel": "本週事件", "tag": "五個交易日的表", "color": "#C97DD4", "zh": "未來五個交易日的總經行事曆很集中：今天是芝加哥聯準全國活動指數與 Goolsbee 談話，中國人民銀行的貸款市場報價利率已經公布維持不變；週三是九月採購經理人指數初值，歐元區、英國與美國同一天公布，美國的綜合初值在台北時間晚間；週四早上是初領失業金與續領人數，接著是八月新屋銷售；同一個週四，川習會在白宮舉行。整週沒有消費者物價指數、沒有個人消費支出物價指數，八月的個人消費支出要等到 9 月 30 日。實務上的意思是：週三的採購經理人指數初值和週四的新屋銷售是這一週唯二能改變利率定價的硬資料，其餘時間市場在讀嘴形。", "en": "The macro calendar for the next five sessions is concentrated. Today brings the Chicago Fed National Activity Index and remarks from Goolsbee, while the PBOC has already left its loan prime rates unchanged. Wednesday brings September flash PMIs, with the euro zone, UK and US all reporting the same day and the US composite flash in the evening Taipei time. Thursday morning brings initial and continuing jobless claims followed by August new home sales - and on that same Thursday the Trump-Xi summit takes place at the White House. There is no CPI and no PCE all week; the August PCE print waits until September 30. Practically: Wednesday's flash PMI and Thursday's new home sales are the only two hard releases capable of moving rate pricing, and the rest of the week the market is reading lips.", "url": "https://www.newsquawk.com/headlines/newsquawk-economic-calendar---21st-25th-september-2026", "stocks": [{"t": "IEF", "n": "7-10 年期公債 ETF，週三 PMI 初值與週四數據的第一反應位置"}, {"t": "XHB", "n": "住宅建築 ETF，週四八月新屋銷售的直接標的"}, {"t": "FXI", "n": "中國大型股 ETF，週四川習會是本週對它影響最大的單一事件"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "財報空窗週", "color": "#C97DD4", "zh": "這一週的重點財報幾乎是零：美光要到 9 月 30 日才公布會計年度第四季，埃森哲的第四季與全年財報排在 10 月 1 日，兩家都落在本週之外。真正在交易的是預期本身——市場對美光這一季的共識是每股約 31.16 美元，而去年同期是 3.03 美元；選擇權市場隱含財報後單日波動約正負 11%。另一個要提前看的數字是記憶體合約價：TrendForce 預估第三季動態隨機存取記憶體合約價季增約 13% 到 18%，比前幾季放緩。空窗週的實務意義是，接下來五個交易日裡股價的變動幾乎全部來自利率、政策與資金流，不會有基本面數字幫你修正判斷。", "en": "This week has almost no significant earnings: Micron reports fiscal fourth-quarter results on September 30 and Accenture its fourth-quarter and full-year figures on October 1, both outside the week. What is trading is the expectation itself - consensus for Micron's quarter is about $31.16 a share against $3.03 a year ago, and options imply a post-print move of roughly 11% either way. One number worth checking early is memory contract pricing: TrendForce expects third-quarter DRAM contract prices up about 13% to 18% quarter over quarter, a slowdown from recent gains. The practical meaning of a gap week is that over the next five sessions price moves come almost entirely from rates, policy and flows, with no fundamental print arriving to correct your view.", "url": "https://www.benzinga.com/markets/large-cap/26/09/61855575/micron-earnings-preview-31-per-share-vs-3-a-year-ago", "stocks": [{"t": "MU", "n": "9/30 公布會計年度第四季，共識每股約 31.16 美元、選擇權隱含約 ±11%"}, {"t": "ACN", "n": "10/1 公布第四季與全年，企業科技支出的重要讀數"}]},
    {"id": "eval_0", "channel": "今日評估", "tag": "今天最該注意的", "color": "#E8A838", "status": "讀完按下面的討論鍵，把這一題帶去聊", "zh": "今天最值得注意的一件事，是油價大跌與長端殖利率上升同時發生。過去半年市場一直用一條很省事的連結在運作：油漲推升通膨、通膨推升殖利率、殖利率壓抑成長股估值。今天早上這條線斷了一半——油在跌，殖利率還在漲。如果這個組合維持超過幾天，代表市場已經把長端的定價權從「通膨預期」交給了「政策路徑」，也就是說，就算通膨數字下來，長天期利率也不一定會跟著下來。這件事對高存續期的成長股、對公用事業與不動產投資信託、對手上有浮動利率債的小型股，是三種完全不同的後果。今天的開放式問題：如果油價回到 80 美元而十年期殖利率還在 5%，你手上的配置有哪一塊是用「通膨會帶著利率一起下來」這個假設撐著的？", "en": "The thing most worth noticing today is crude falling sharply while long-end yields rise at the same time. For six months the market has run on a convenient chain: oil lifts inflation, inflation lifts yields, yields compress growth multiples. This morning half that chain broke - oil is down and yields are still up. If the pairing holds for more than a few days, it means pricing power at the long end has moved from inflation expectations to the policy path, which is to say long rates need not fall even if inflation prints do. That has three entirely different consequences: for long-duration growth stocks, for utilities and REITs, and for small caps carrying floating-rate debt. Today's open question: if oil returns to $80 while the 10-year sits at 5%, which part of your allocation is being held up by the assumption that inflation drags rates down with it?", "url": "https://www.investing.com/analysis/sector-rotation-a-guide-to-the-sp-500-momentum-status-200675903", "stocks": [{"t": "USO", "n": "原油 ETF，這一組矛盾的其中一邊"}, {"t": "TLT", "n": "長天期公債 ETF，另一邊；兩者同向下跌就是矛盾本身"}, {"t": "RSP", "n": "標普 500 等權重 ETF，用來檢查這件事有沒有擴散到指數內部"}]},
];

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/21/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v11.8</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
