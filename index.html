// ===== AZURE TTS =====
let _azToken = null, _azTokenExp = 0, _azAbort = null;
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
function azureStop() { if (_azAbort) { _azAbort.abort(); _azAbort = null; } }
async function azureSpeak(text, { rate='0%', onStart, onEnd, onError }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const voice = localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural';
  if (!key) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const token = await _getAzToken(key, region, ctrl.signal);
    const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'><voice name='${voice}'><prosody rate='${rate}'>${_xmlEsc(text)}</prosody></voice></speak>`;
    const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method:'POST', signal:ctrl.signal,
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
      body:ssml
    });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (ctrl.signal.aborted) return true;
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    if (onError) onError(e);
    return false;
  }
}

    {"id": "macro_0", "channel": "總經政策", "tag": "FOMC 下週", "color": "#7C6AF7", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，高利率墊高放款利差的受惠者"}, {"t": "TLT", "n": "長天期公債 ETF，利率預期的溫度計"}], "en": "The Fed meets July 28-29 and is widely expected to hold rates steady. Markets now price roughly an 80% chance of zero cuts in all of 2026, with odds of even a single quarter-point cut near 20%. 'Higher for longer' is quietly becoming the base case.", "zh": "Fed 下週（7/28–29）開會，市場普遍預期按兵不動。目前定價顯示 2026 全年零降息的機率約八成，連降一碼的機率都只剩兩成。「更高更久」正在悄悄變成基本情境。", "ja": "FRBは7月28〜29日に会合を開き、金利据え置きが広く予想されている。市場は2026年の利下げゼロの確率を約8割と織り込み、25bpの利下げすら2割程度しか見ていない。「より高く、より長く」が静かにベースシナリオになりつつある。", "url": "https://centralbank.watch/federal-reserve/"},
    {"id": "macro_1", "channel": "總經政策", "tag": "通膨黏著", "color": "#7C6AF7", "stocks": [{"t": "GLD", "n": "黃金 ETF，通膨黏著的傳統避險"}, {"t": "XLE", "n": "能源通膨的源頭，也是受惠者"}], "en": "Inflation is proving sticky: CPI ran 4.2% year-over-year in May, and the Fed lifted its year-end PCE forecast sharply to 3.6% from 2.7%. Energy costs, pushed by the Middle East conflict, are doing much of the damage. Sticky prices keep rate relief out of reach - that is gravity for valuations.", "zh": "通膨顯出黏性：5 月 CPI 年增 4.2%，Fed 把年底 PCE 預測從 2.7% 大幅上修到 3.6%，中東衝突推升的能源價格是主因。物價黏住，降息就遙遙無期——這是壓在估值上的地心引力。", "ja": "インフレの粘着性が鮮明だ。5月のCPIは前年比4.2%上昇し、FRBは年末PCE予測を2.7%から3.6%へ大幅に引き上げた。中東紛争によるエネルギー高が主因だ。物価が下がらなければ利下げは遠く、それはバリュエーションにかかる重力となる。", "url": "https://finance.yahoo.com/news/federal-reserve-keeps-rate-cut-forecasts-steady-as-economic-growth-inflation-outlooks-rise-181628371.html"},
    {"id": "sector_0", "channel": "產業風向", "tag": "資金輪動", "color": "#4EABA4", "stocks": [{"t": "IWM", "n": "Russell 2000 ETF，本輪輪動的主角"}, {"t": "KRE", "n": "區域銀行，上半年領漲板塊"}, {"t": "XLI", "n": "工業股 ETF，實體資產受青睞"}], "en": "Leadership is broadening beyond the Magnificent 7. The Russell 2000 gained 22.6% in the first half - its best start since 1991 - as money rotates into regional banks, energy and industrials offering hard assets, dividends and low multiples. Higher-for-longer rates are actually padding lenders' margins.", "zh": "領漲板塊正在擴散，不再只有 Mag 7：Russell 2000 上半年大漲 22.6%，創 1991 年以來最佳上半年。資金轉進區域銀行、能源、工業——有實體資產、有股息、本益比低。高利率環境反而墊高了銀行的放款利差。", "ja": "相場の主導権はマグニフィセント7の外へ広がっている。ラッセル2000は上半期に22.6%上昇し、1991年以来最高のスタートを切った。資金は地方銀行、エネルギー、資本財へ回転。実物資産、配当、低PERが魅力だ。高金利の長期化はむしろ銀行の貸出利ざやを押し上げている。", "url": "https://www.morningstar.com/markets/is-stock-market-rotation-underway-these-sectors-are-outpacing-tech-2026"},
    {"id": "sector_1", "channel": "產業風向", "tag": "能源紀律", "color": "#4EABA4", "stocks": [{"t": "XLE", "n": "能源 ETF，板塊載體"}, {"t": "XOM", "n": "資本紀律代表，美國最大石油股"}, {"t": "CVX", "n": "高股息＋庫藏股回購"}], "en": "Energy stocks are stabilizing even as oil pulls back: the market now rewards capital discipline - companies that resist over-drilling and return cash through dividends and buybacks. Energy is shifting from an oil-price bet into a cash-yielding asset class, which changes its role in a portfolio.", "zh": "油價回落但能源股展現韌性：市場開始獎勵「資本紀律」——不亂擴產、把現金流拿去配息和買回庫藏股的公司。能源板塊正從「賭油價」變成「領現金」的資產類別，這改變了它在投資組合裡的角色。", "ja": "原油が反落しても、エネルギー株は底堅い。市場はいまや資本規律——増産を我慢し、配当と自社株買いで現金を還元する企業——に報いている。エネルギーは「原油価格への賭け」から「現金を生む資産クラス」へ変わりつつあり、ポートフォリオでの役割も変わる。", "url": "https://stockhouse.com/opinion/contributors/2026/07/08/markets-motion-sector-rotation-signals-broader-market-leadership"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "23 年最強", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "Russell 2000 ETF，今年約 +21%"}, {"t": "IJR", "n": "S&P 600 ETF，有獲利門檻的小型股池"}], "en": "The Russell 2000 sits near 2,980, up about 21% this year - its best run since 2003. This is not hot money chasing beta: AI capital spending is rippling beyond megacap tech, and the market is hunting the second layer of AI beneficiaries among small caps - equipment, power, components and local services.", "zh": "Russell 2000 站上 2,980 點，今年大漲約 21%，寫下 2003 年以來最強表現。這一輪不是投機資金亂竄：AI 資本支出正從超大型科技股往外擴散，市場在小型股裡找「AI 受惠第二層」——設備、電力、零組件、在地服務。", "ja": "ラッセル2000は2,980近辺に達し、年初来約21%高と2003年以来最強の年となっている。これは投機資金の暴走ではない。AI設備投資がメガテックの外へ波及し、市場は小型株の中に「AI恩恵の第2層」——装置、電力、部品、地域サービス——を探している。", "url": "https://www.cnbc.com/2026/06/30/small-cap-stocks-enjoy-best-first-half-since-1991-as-ai-trade-expands.html"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "催化劑行情", "color": "#5B8ED6", "stocks": [{"t": "OFIX", "n": "Medicare 政策逆轉，單月 +28%（年內仍 -23%）"}, {"t": "IWM", "n": "對照組：指數本身"}], "en": "Seven small caps have jumped 28%+ within four sessions in July - but every one had a specific catalyst: takeovers, court-cleared refinancings, a Medicare reversal. Orthofix is up 28% this month yet still down 23% on the year. In small caps, catalysts pay - not beta.", "zh": "7 月已有七檔小型股在四個交易日內大漲 28% 以上——但仔細看，漲的全是「有事發生」的股票：被併購、債務重整過關、Medicare 給付政策逆轉。骨科醫材 Orthofix 單月漲 28%，年內仍跌 23%。小型股賺的是催化劑，不是大盤 beta。", "ja": "7月には7つの小型株がわずか4営業日で28%以上急騰した。だがよく見れば、上がったのはすべて「何かが起きた」銘柄——買収、裁判所承認のリファイナンス、メディケア方針の転換だ。整形外科機器のオーソフィックスは月間28%高でも年初来では23%安。小型株で稼ぐのはカタリストであってベータではない。", "url": "https://www.benzinga.com/markets/small-cap/26/07/60593569/russell-2000-small-cap-stocks-july-biggest-gainers-2026"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "怎麼挑池子", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "S&P 600 ETF，成分股須連續獲利"}, {"t": "IWM", "n": "Russell 2000 ETF，無獲利門檻、涵蓋最廣"}], "en": "Even the pond you fish in matters: IWM's Russell 2000 takes almost any company - roughly 40% of members lose money - while IJR's S&P 600 requires profitability, giving it a built-in quality tilt. Same 'small cap exposure', very different long-run outcomes. When you study a small cap, first check which pond it swims in.", "zh": "小型股連「池子」都有學問：IWM 追蹤的 Russell 2000 幾乎什麼公司都收，約四成成分股不賺錢；IJR 追蹤的 S&P 600 有獲利門檻，品質天生高一截。同樣是「買小型股」，選哪個池子長期報酬差很大——研究一檔小型股之前，先看它游在哪個池子裡。", "ja": "小型株はどの池で釣るかも重要だ。IWMが追うラッセル2000はほぼ無条件で組み入れ、約4割の企業が赤字。一方IJRが追うS&P600には黒字要件があり、品質が一段高い。同じ「小型株投資」でも池の選択で長期リターンは大きく変わる。個別の小型株を調べる前に、まずどの池にいるかを確認しよう。", "url": "https://247wallst.com/investing/etf/2026/07/20/the-russell-2000-is-outpacing-the-sp-500-in-2026-is-it-too-late-to-buy-small-cap-etfs/"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "MOV · 鐘錶", "color": "#C9A227", "status": "RADAR · 下一個驗證點 08/27 財報", "stocks": [{"t": "MOV", "n": "本卡主角，已入雷達池追蹤"}], "en": "Movado Group makes watches - a business Wall Street does not bother to cover. Yet it sits on roughly $230 million in cash with almost no net debt, quarterly EPS just rose over 400% year-over-year, and margins keep improving. Ignored because the industry feels dated; risks are tariffs and soft luxury demand. Not a recommendation - a name worth understanding.", "zh": "Movado 做手錶——一個華爾街懶得覆蓋的生意。但它帳上有約 2.3 億美元現金、幾乎零淨負債，單季 EPS 年增超過 400%，利潤率持續改善。被忽視只因產業過氣；風險在關稅與精品需求放緩。這不是買進建議，是一個值得看懂的名字。", "ja": "モバードは腕時計メーカー。ウォール街が取り上げる気もない事業だ。だが手元には約2.3億ドルの現金、純負債はほぼゼロ、四半期EPSは前年比400%超の伸び、利益率も改善中。無視される理由は業界が時代遅れだから。リスクは関税と高級品需要の減速。推奨ではなく、理解しておく価値のある銘柄だ。", "url": "https://stockanalysis.com/stocks/mov/statistics/"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "ERII · 海水淡化", "color": "#C9A227", "status": "RADAR · 下一個驗證點 8 月初 Q2 財報", "stocks": [{"t": "ERII", "n": "本卡主角，已入雷達池追蹤"}], "en": "Energy Recovery's PX pressure exchanger slashes the energy cost of desalination - a niche few analysts follow. In five weeks it landed a major Saudi desal contract plus five industrial wastewater projects in India, and a director bought $99k of stock at $8.88, lifting his stake 25%. Risks: lumpy project revenue, unproven new markets. A research lead, not advice.", "zh": "Energy Recovery 的 PX 壓力交換器能大幅降低海水淡化的能耗——冷門到沒幾個分析師追。但五週內它連拿沙烏地大型海淡案與印度五個工業廢水案，董事更在 6 月以 8.88 美元自掏 9.9 萬美元加碼、持股增 25%。風險：專案型營收波動大、新市場未驗證。這是研究線索，不是投資建議。", "ja": "エナジー・リカバリーのPX圧力交換器は海水淡水化のエネルギーコストを大幅に削減する。アナリストがほとんど追わないニッチだ。だがこの5週間でサウジの大型淡水化案件とインドの産業廃水案件5件を獲得し、取締役は6月に8.88ドルで9.9万ドル分を買い増し、保有を25%増やした。リスクは案件型収益の変動と未証明の新市場。投資助言ではなく、リサーチの手がかりだ。", "url": "https://www.gurufocus.com/news/8966649/energy-recovery-erii-secures-contract-for-saudi-desalination-project"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "ADV · 通路服務", "color": "#C9A227", "status": "RADAR · 下一個驗證點 8 月 Q2 財報", "stocks": [{"t": "ADV", "n": "本卡主角，CEO 一年 18 買 0 賣"}], "en": "Advantage Solutions runs retail execution and marketing for consumer brands - market cap shrunk to about $272 million, a one-dollar stock Wall Street has left for dead. Yet CEO David Peacock has bought 18 times with zero sales over the past year, roughly $400k net, adding again in May. Insiders are paying real money for the turnaround. Risks: heavy debt, thin industry margins, execution. A research lead, not advice.", "zh": "Advantage Solutions 幫消費品牌做零售通路執行與行銷——市值縮到約 2.7 億美元、股價一美元多，華爾街幾乎當它不存在。但 CEO Peacock 過去一年 18 次買進、零賣出，累計淨買超約 40 萬美元，5 月又再加碼。內部人正用真金白銀押注轉型。風險：負債沉重、產業毛利薄、執行力待驗證。這是研究線索，不是投資建議。", "ja": "アドバンテージ・ソリューションズは消費財ブランドの店頭実行とマーケティングを担う。時価総額は約2.7億ドルに縮み、1ドル台の株はウォール街から見捨てられた。だがピーコックCEOは過去1年で18回買い・売りゼロ、純額約40万ドルを買い増し、5月にも追加した。インサイダーが身銭で再建に賭けている。リスクは重い負債、薄利の業界、実行力。投資助言ではなくリサーチの手がかりだ。", "url": "https://finance.yahoo.com/news/insider-buying-ceo-david-peacock-061128797.html"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "GLOO · 信仰科技", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Q2 財報(指引 +172%)", "stocks": [{"t": "GLOO", "n": "本卡主角，Q1 營收 +238%"}], "en": "Gloo is 'faith tech' - an AI platform serving churches and nonprofits, 140,000 organizations strong. Too niche for headlines, yet Q1 revenue grew 238% to $41.5 million, full-year guidance was raised to $195 million, and insiders net-bought $5 million over the past year. The bear case is real too: a $159 million net loss last year, and a fresh 7-million-share offering announced in July means dilution is coming. A high-risk watchlist name - not advice.", "zh": "Gloo 做的是「信仰科技」——服務教會與非營利組織的 AI 平台，14 萬個組織在用。冷門到沒有媒體版面，但 Q1 營收年增 238% 達 4,150 萬美元、全年指引上修到 1.95 億，內部人一年淨買超 500 萬美元。反方論點同樣真實：去年淨虧 1.59 億、7 月又宣布增發 700 萬股，稀釋在路上。高風險高成長的觀察型標的——不是建議。", "ja": "Glooは「フェイステック」——教会や非営利団体向けのAIプラットフォームで、14万組織が利用する。ニュースにならないニッチだが、第1四半期売上は前年比238%増の4,150万ドル、通期ガイダンスは1.95億ドルへ上方修正、インサイダーは過去1年で純額500万ドルを買い越した。弱気材料も直視すべきだ。昨年度は1.59億ドルの純損失、7月には700万株の増資を発表し希薄化が控える。ハイリスクのウォッチ銘柄であり、推奨ではない。", "url": "https://investors.gloo.com/news-releases/news-release-details/gloo-holdings-inc-reports-first-quarter-2026-financial-results"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "小銀行加碼", "color": "#6DB56D", "stocks": [{"t": "ISTR", "n": "董事 4 月大額買進，P/E 13、目標價 33 美元"}, {"t": "KRE", "n": "區域銀行 ETF，輪動大背景"}], "en": "Louisiana lender Investar Holding (about $400 million market cap) sits at the crossroads of insider buying and the bank rotation: a director made a bold purchase in April, the company closed its Wichita Falls acquisition in January and raised its dividend 9% in June. It trades at 13x earnings with a $33 analyst target. In a regional-bank rotation, the small banks insiders back first deserve a second look.", "zh": "路易斯安那小銀行 Investar（市值約 4 億美元）站在「內部人買盤 × 銀行輪動」的交叉點：董事 4 月大手筆買進自家股票，公司 1 月完成 Wichita Falls 併購、6 月又把股息上調 9%。本益比 13 倍、分析師目標價 33 美元。區域銀行輪動行情裡，內部人先押注的小銀行值得多看一眼。", "ja": "ルイジアナ州の小規模銀行インベスターHD（時価総額約4億ドル）は、インサイダー買いと銀行株ローテーションの交差点にいる。4月に取締役が大口購入、1月にはウィチタフォールズ買収を完了、6月には配当を9%増額した。PERは13倍、アナリスト目標株価は33ドル。地銀ローテーションの中で、インサイダーが先に賭けた小さな銀行は一見の価値がある。", "url": "https://stockanalysis.com/stocks/istr/"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "訊號怎麼讀", "color": "#6DB56D", "stocks": [{"t": "CSR", "n": "Q1 虧損中內部人續買的公寓 REIT"}, {"t": "ERII", "n": "本期雷達股，6 月董事加碼的例子"}], "en": "July's insider screens flagged 131 undervalued small caps with insider buying - even apartment REIT Centerspace saw insiders buy through a Q1 loss. A reminder: insider buying is a signal, not a guarantee - insiders can be early or wrong. What matters is clustered, repeated, against-the-tape buying; that is what information advantage looks like. A single small purchase means little.", "zh": "7 月的內部人篩選一口氣掃出 131 檔「低估＋內部人進場」的小型股，連公寓 REIT Centerspace 都在 Q1 虧損下出現內部人持續買進。提醒：內部人買進是訊號、不是保證——他們可能太早，也可能錯。真正有含金量的是「集體、連續、逆勢」的買法，那才是資訊優勢的長相；單次小額的，看看就好。", "ja": "7月のインサイダー・スクリーニングでは、「割安+インサイダー買い」の小型株が131銘柄も浮上した。アパートREITのセンタースペースでさえ、第1四半期の赤字の中で買いが続いた。ただし忘れずに——インサイダー買いはシグナルであって保証ではない。早すぎることも間違うこともある。意味があるのは「集団で、繰り返し、逆張りの」買い方だ。それが情報優位の形であり、単発の少額買いは参考程度でいい。", "url": "https://simplywall.st/stocks/us/real-estate/nyse-csr/centerspace/news/undervalued-small-caps-with-insider-buying-in-july-2026"},
    {"id": "week_0", "channel": "本週事件", "tag": "財報行事曆", "color": "#C97DD4", "stocks": [{"t": "GOOGL", "n": "週三盤後，廣告與 AI 資本支出是焦點"}, {"t": "TSLA", "n": "週三盤後，交車量與毛利率"}, {"t": "TXN", "n": "週三盤後，類比晶片景氣風向球"}, {"t": "INTC", "n": "週四盤後，代工轉型進度"}], "en": "The heaviest week of Q2 earnings: Alphabet and Tesla report Wednesday after the close, alongside IBM, Texas Instruments and ServiceNow; Intel follows Thursday. More than 400 companies report this week, and the Fed decision lands next Wednesday. Index-level moves will be earnings-driven from here.", "zh": "Q2 財報最重的一週：週三盤後 Alphabet 與 Tesla 登場，同日還有 IBM、德州儀器、ServiceNow；英特爾週四盤後接棒。本週超過 400 家公司發財報，下週三再接 Fed 決策。指數層級的行情，接下來由財報驅動。", "ja": "第2四半期決算で最も重い一週間。水曜引け後にアルファベットとテスラ、同日にIBM、テキサス・インスツルメンツ、サービスナウ、木曜にはインテルが続く。今週は400社超が決算を発表し、来週水曜にはFOMCが控える。指数レベルの相場は当面、決算が動かす。", "url": "https://www.kiplinger.com/investing/stocks/17494/next-week-earnings-calendar-stocks"},

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  const speakWord = React.useCallback(async (word) => {
    const ok = await azureSpeak(word, { rate:'-15%' });
    if (!ok) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US"; u.rate = 0.82;
      const voices = speechSynthesis.getVoices();
      const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
      if (picked) u.voice = picked;
      speechSynthesis.speak(u);
    }
  }, []);

  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      return;
    }
    setSpeaking(true);
    const ok = await azureSpeak(card.en, {
      rate: '-5%',
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
    if (!ok) {
      const u = new SpeechSynthesisUtterance(card.en);
      u.lang = "en-US"; u.rate = 0.88; u.pitch = 1.0; u.volume = 1.0;
      const tryVoices = () => {
        const voices = speechSynthesis.getVoices();
        const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
        if (picked) u.voice = picked;
      };
      if (speechSynthesis.getVoices().length > 0) tryVoices();
      else { speechSynthesis.onvoiceschanged = () => { tryVoices(); speechSynthesis.onvoiceschanged = null; }; }
      u.onend = () => setSpeaking(false);
      u.onerror = () => setSpeaking(false);
      speechSynthesis.speak(u);
    }
  }, [card.en, speaking]);

  // Stop speaking & close popup when card changes
  React.useEffect(() => {
    return () => {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀全文"} style={{ marginLeft:"auto" }}>{speaking ? "■" : "🔊"}</button>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          {lang === "ja"
            ? <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"15px", lineHeight:1.9, color:"var(--text-secondary)", margin:0, maxWidth:"46ch", fontWeight:300 }}>{card.ja || card.en}</p>
            : <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>}
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("ja"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="ja" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="ja" ? "close ↑" : "日本語 ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev }) {

  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();

  };
  return (
    <div className="end-screen">

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;

  const [resumeMsg, setResumeMsg] = useState(null);
  const lsKey = "mosfeed_Today_" + todaySub;

  // Read localStorage on tab/sub change
  React.useEffect(() => {
    const key = "mosfeed_Today_" + todaySub;
    try {
      const saved = parseInt(localStorage.getItem(key), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") go(idx + 1);
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(idx - 1);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 07/22/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v4.3</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
      >
        {atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} />
          </div>
        )}
      </div>

      {/* Nav bar */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => go(idx - 1)} disabled={idx === 0}>←</button>
        <span className="nav-count">{atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn" onClick={() => go(idx + 1)} disabled={atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
