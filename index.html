/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;

  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;

    --text-tertiary: #86837f; --divider: #2e2a24;

  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;

    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }

    from { opacity: 0; transform: translateY(12px); }

  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }

    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "個股異動", "color": "#E05C5C", "zh": "今天的個股異動有一個要小心看的假象：Corteva（CTVA）單日顯示重挫約 82%，是因為它剛完成種子與基因事業的分拆，新公司 Vylor（VYLR）10/1 起在紐約證交所掛牌，股價依分拆比例調整，不是公司出了事。另外，加州法官核准 Paramount Skydance 與各州的和解，其 1,100 億美元收購華納兄弟探索的案子預計 10/6 完成，Paramount 股價下跌約 4.75%；Moderna 被花旗從中立降到賣出（目標價小幅調高到 80 美元），盤前跌約 3.2%。看漲跌幅之前，先確認是不是分拆或除息造成的機械式變動。", "en": "One move needs care: Corteva (CTVA) showed a drop of about 82% only because it completed the spin-off of its seed and genetics business; the new company, Vylor (VYLR), began trading on the NYSE on Oct. 1 and CTVA's price adjusted for the distribution. A California judge also approved Paramount Skydance's settlement with the states, clearing its $110 billion takeover of Warner Bros. Discovery, expected to close Oct. 6; Paramount fell about 4.75%. Citi downgraded Moderna from Neutral to Sell (price target nudged up to $80), and it fell about 3.2% premarket. Before reading a move, check whether it is a spin-off or ex-dividend adjustment.", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-oct-01-2026", "stocks": [{"t": "CTVA", "n": "完成種子事業分拆，顯示的約 -82% 是分拆後的機械式調整"}, {"t": "VYLR", "n": "新分拆的種子與基因公司，10/1 起交易"}, {"t": "PSKY", "n": "法官核准和解、10/6 預計完成併購華納，股價約 -4.75%"}, {"t": "MRNA", "n": "花旗降到賣出，盤前約 -3.2%"}]},
    {"id": "earn_0", "channel": "財報速報", "tag": "耐吉重整", "color": "#E8786A", "zh": "Nike（NKE）週四盤後公布 2027 會計年度第一季：營收年減 4% 到 112 億美元，每股盈餘 0.48 美元高於預期的 0.43 美元，毛利率提高 0.6 個百分點到 42.8%，但中國區營收大減 26%。全年財測更吃重：營收預期高個位數衰退，調整後每股盈餘 1.15 至 1.35 美元，遠低於市場預期的約 1.65 美元；同時啟動名為 Pace 的重整，目標在 2031 會計年度省下 25 億美元、裁員約 1,400 人。盤後股價跌約 3%，年初至今已跌約 44%。「財報超預期、財測不如預期」是這家公司目前的典型劇本。", "en": "Nike (NKE) reported fiscal 2027 first-quarter results after the bell Thursday: revenue fell 4% to $11.2 billion, EPS of $0.48 beat the $0.43 estimate and gross margin rose 60 basis points to 42.8%, but China revenue dropped 26%. Guidance weighed more: revenue is expected to fall by a high-single-digit percentage and adjusted EPS is $1.15 to $1.35, well below the roughly $1.65 expected. It also launched a restructuring called Pace, targeting $2.5 billion in savings by fiscal 2031 and about 1,400 job cuts. Shares fell about 3% after hours and are down about 44% this year. A beat on the quarter and a miss on the outlook is this company's recent script.", "url": "https://www.cnbc.com/2026/10/01/nike-nke-q1-2027-earnings.html", "stocks": [{"t": "NKE", "n": "營收 112 億美元（-4%）、中國 -26%、財測低於預期，盤後約 -3%"}, {"t": "ONON", "n": "運動鞋同業，內部人 8/14 買進約 399 萬美元（OpenInsider），可對照品牌分化"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "顧問業翻身", "color": "#E8786A", "zh": "Accenture（ACN）週四盤前公布第四季：營收 187 億美元、每股盈餘 3.29 美元雙雙優於預期，並給出 2027 年營收成長 3% 至 6% 的財測，同時預計回饋股東至少 95 億美元，股價單日大漲約 20%。更重要的是這份財報一度被視為「AI 會不會吃掉顧問業」的檢驗，結果公司交出創紀錄的大型訂單，連帶 Cognizant（CTSH）漲約 8%、IBM 約 3%，印度的 Infosys 與 Wipro 美國存託憑證漲 6% 至 7%。一份財報把整個產業的估值折價往回拉了一截，但一天的漲幅不等於趨勢確立。", "en": "Accenture (ACN) reported fiscal fourth quarter before the open Thursday: revenue of $18.7 billion and EPS of $3.29 both beat, with fiscal 2027 revenue growth guided to 3% to 6% and at least $9.5 billion to be returned to shareholders; the stock jumped about 20%. The report was widely seen as a test of whether AI would eat consulting, and the company posted record large-deal bookings. Cognizant (CTSH) rose about 8%, IBM about 3%, and U.S.-listed Infosys and Wipro 6% to 7%. One report pulled the industry's valuation discount back a notch, but a one-day jump does not confirm a trend.", "url": "https://www.benzinga.com/markets/earnings/26/10/62103078/ai-threat-accenture-posts-record-big-ticket-client-bookings", "stocks": [{"t": "ACN", "n": "營收 187 億美元、財測 +3% 至 6%，單日約 +20%"}, {"t": "CTSH", "n": "同業連動上漲約 8%"}, {"t": "INFY", "n": "印度外包龍頭 ADR，漲 6% 至 7%"}, {"t": "IBM", "n": "顧問與軟體並重，跟著漲約 3%"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "麥考密克", "color": "#E8786A", "zh": "McCormick（MKC）公布第三季財報：調整後每股盈餘 0.86 美元高於預期的 0.76 美元，營收 20.2 億美元也高於預期的 19.8 億美元，但股價仍跌逾 2%。Benzinga 的財報整理指出，這家公司正處於被聯合利華（UL）收購的過程中，聯合利華股價同樣下跌逾 2%。這提醒我們：被併購中的公司，股價主要跟著交易條件與完成風險走，財報好壞的影響反而變小。要看這類案子，先看交易價格與時程，再看季報。", "en": "McCormick (MKC) reported third quarter results: adjusted EPS of $0.86 beat the $0.76 estimate and revenue of $2.02 billion beat the $1.98 billion consensus, yet the stock fell more than 2%. Benzinga's earnings roundup says the company is in the midst of being acquired by Unilever (UL), whose shares also fell more than 2%. The lesson: for a company being acquired, the stock follows deal terms and completion risk, and the quarterly report matters less. For these situations read the deal price and timeline first, then the quarter.", "url": "https://benzinga.com/news/earnings/26/10/62101167/earnings-scheduled-october-1-2026", "stocks": [{"t": "MKC", "n": "EPS 0.86 美元（預期 0.76）、營收 20.2 億美元，股價仍跌逾 2%"}, {"t": "UL", "n": "報導稱為收購方，股價同樣跌逾 2%"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "今晚非農", "color": "#7C6AF7", "zh": "九月就業報告在美東週五早上 8:30（台灣時間今晚 20:30）公布：道瓊共識預期新增 8.4 萬個工作、失業率維持 4.1%，八月是 16.2 萬個。Natixis 的經濟學家預期更低、約 6 萬個，認為即使數字強，單靠一份就業報告也不足以讓聯準會 10 月升息。同一天一早公布的裁員數據偏溫和：Challenger 統計九月宣布裁員 43,281 人，較八月減少 18%，科技業占近三分之一。市場把重點放在「好數據是不是又變成壞消息」：數字越強，殖利率越可能再創高。", "en": "The September jobs report is due Friday at 8:30 a.m. ET (8:30 p.m. Taiwan time tonight): the Dow Jones consensus is 84,000 new jobs with unemployment steady at 4.1%, after 162,000 in August. Natixis expects about 60,000 and argues a strong print alone would not push the Fed to hike in October. Layoff data was mild: Challenger counted 43,281 announced job cuts in September, down 18% from August, with tech accounting for nearly a third. The question is whether good news becomes bad news again: the stronger the number, the more likely yields push to new highs.", "url": "https://www.cnbc.com/2026/10/01/the-september-jobs-report-will-be-released-friday-heres-what-to-expect.html", "stocks": [{"t": "SHY", "n": "短天期美債 ETF，對就業數據與升息預期的反應最直接"}, {"t": "XLI", "n": "工業類股 ETF，製造與資料中心建設帶動就業的代表"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "製造業物價", "color": "#7C6AF7", "zh": "供應管理協會（ISM）九月製造業指數 54.5，略低於八月的 54.6 與預期的 55，但仍連續第九個月擴張，新訂單指數升到 55.3。真正刺眼的是物價指數：從 71.1 跳升 6.8 點到 77.9，協會點名鋼鋁價格上漲、關稅，以及中東衝突推高石油相關產品。需求仍在、成本更貴，等於企業要嘛吃掉利潤、要嘛漲價給消費者，這正是聯準會最不想看到的組合。", "en": "The ISM manufacturing index for September was 54.5, a touch below August's 54.6 and the 55 forecast, but it marked a ninth straight month of expansion and new orders rose to 55.3. The eye-catching part was prices paid, which jumped 6.8 points from 71.1 to 77.9; ISM cited steel and aluminum, tariffs, and petroleum-based products pushed up by the Middle East conflict. Demand is intact while costs rise, meaning companies either absorb the margin hit or raise prices, the combination the Fed least wants to see.", "url": "https://www.prnewswire.com/news-releases/manufacturing-pmi-at-54-5-september-2026-ism-manufacturing-pmi-report-302894520.html", "stocks": [{"t": "NUE", "n": "美國最大電爐鋼廠，鋼價上漲與關稅下的成本與報價是觀察點"}, {"t": "AA", "n": "鋁生產商，ISM 點名鋁價上漲是物價指數升高的原因之一"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "聯準會口風", "color": "#7C6AF7", "zh": "聯準會官員對通膨的口風沒有放鬆：明尼阿波利斯聯邦準備銀行總裁 Kashkari 週三受訪說「通膨還是太高」，核心 PCE 約 3% 的水準已持續五年以上，週三的數據沒有改變他的看法；他同時認為消費與 GDP 顯示經濟有韌性。Capital.com 的分析師則形容那份 PCE 是「雜訊多於訊號」，統計方法調整讓核心通膨看起來降溫，卻讓市場更不確定。下一個要看的是 10/7（週三）下午 2 點公布的 FOMC 會議紀錄，市場會逐字找「升息」的討論有多熱。", "en": "Fed officials have not softened their tone: Minneapolis Fed President Kashkari said Wednesday that inflation is 'still too high', noting core PCE has run around 3% for more than five years and that the data did not change his view; he also called the economy resilient on consumer spending and GDP. Capital.com's analyst called the PCE release more noise than signal, as methodological changes made core inflation look cooler while leaving markets less certain. Next up are the FOMC minutes at 2 p.m. ET on Wednesday, Oct. 7, which markets will parse for how hot the rate-hike discussion was.", "url": "https://www.cnbc.com/2026/09/30/watch-minneapolis-fed-president-kashkari.html", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，對利率路徑與存款成本最敏感"}, {"t": "XHB", "n": "房屋建築商 ETF，房貸利率與升息預期的代表"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "AI 訂單落地", "color": "#4EABA4", "zh": "科技股的風向正從「AI 會不會泡沫」轉到「訂單有沒有落地」。Synopsys（SNPS）週四大漲約 13%、收 490.54 美元，原因是投資人日公布的幾件事：與亞馬遜 AWS 簽下價值逾 10 億美元的多年授權、與 OpenAI 合作推出 GPT-Synopsys 晶片設計工具、預期明年營收成長約 15%，並宣布庫藏股。同一天，摩根大通指出「七巨頭」的預期本益比相對大盤已降到近十年低點，認為這段修正大致結束。把這兩件事放在一起看：基本面有合約的標的先被買回來，其他仍在等證據。", "en": "Tech's focus is shifting from whether AI is a bubble to whether orders are landing. Synopsys (SNPS) jumped about 13% to $490.54 on Investor Day news: a multiyear license with Amazon Web Services worth more than $1 billion, a partnership with OpenAI on an AI chip-design tool called GPT-Synopsys, about 15% revenue growth expected next year, and a buyback. The same day JPMorgan said the Magnificent Seven's forward P/E relative to the market has fallen to a ten-year low, arguing the de-rating has largely run its course. Together: names with signed contracts are being bought back first, while the rest wait for evidence.", "url": "https://seekingalpha.com/news/4649583-synopsys-rallies-13-as-wall-street-digests-amazon-deal-openai-partnership", "stocks": [{"t": "SNPS", "n": "AWS 合約逾 10 億美元、OpenAI 合作，單日約 +13% 收 490.54 美元"}, {"t": "MAGS", "n": "七巨頭等權重 ETF，午後約 -0.37% 到 71.43 美元，估值相對大盤近十年低"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "電力搶供給", "color": "#4EABA4", "zh": "AI 需求最後都會回到電力。Amazon 與 Constellation Energy（CEG）簽下 20 年購電協議，向馬里蘭州 Calvert Cliffs 核電廠購買 690 百萬瓦電力，包含擴增的 190 百萬瓦、預計 2030 至 2032 年上線，電廠總裝置容量 1,790 百萬瓦，並帶動超過 30 億美元的州內投資，CEG 股價約漲 3.8%。Bloom Energy（BE）執行長同日也說，電力需求「來自四面八方」、AI 只是催化劑。長約帶來的是營收確定性：能不能把核電廠再延 20 年執照，是這種合約的真正價值。", "en": "AI demand ultimately comes back to electricity. Amazon signed a 20-year power purchase agreement with Constellation Energy (CEG) for 690 megawatts from the Calvert Cliffs nuclear plant in Maryland, including a 190 megawatt uprate due 2030 to 2032, at a 1,790 megawatt plant, unlocking more than $3 billion of state investment; CEG rose about 3.8%. Bloom Energy's (BE) CEO said the same day that power demand is coming 'from all angles' with AI just the catalyst. A long contract provides revenue certainty; the ability to relicense the plant for another 20 years is its real value.", "url": "https://www.esgtoday.com/amazon-signs-20-year-deal-with-constellation-to-upgrade-extend-life-of-nuclear-plant/", "stocks": [{"t": "CEG", "n": "Calvert Cliffs 20 年購電協議，股價約 +3.8% 到 263.66 美元"}, {"t": "AMZN", "n": "購電方，股價約 +0.9%"}, {"t": "BE", "n": "燃料電池供電業者，執行長稱電力需求長期結構性成長"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "煉油斷供", "color": "#4EABA4", "zh": "能源這條線的新變數在煉油：路透報導，中國煉油廠暫停向香港與澳門以外地區出口成品油，直到北京另行通知，中國石油（PetroChina）取消了部分 10 月的汽油與航空燃油貨載，浙江石化假期週沒有排任何成品油出貨。中國國內柴油與瓦斯油庫存比戰前水準低約 2,000 萬桶、汽油低約 900 萬桶；10/7 假期結束後是否恢復出口還不確定。亞洲柴油價差因此升到兩週高點。成品油供給少一塊，對其他地區煉油廠是利多還是被油價拖累，要看原油成本與裂解價差誰漲得更快。", "en": "The new variable in energy is refining: Reuters reported Chinese refiners suspended oil product exports to destinations other than Hong Kong and Macau until further notice; PetroChina cancelled some October gasoline and jet fuel cargoes and Zhejiang Petrochemical scheduled no product shipments during the holiday week. Domestic gasoil and diesel inventories sit about 20 million barrels below pre-war levels and gasoline about 9 million barrels short; whether exports resume after the holiday ends Oct. 7 is unclear. Asian diesel swap spreads rose to a two-week high. Whether losing a chunk of product supply helps other regions' refiners depends on whether crack spreads rise faster than crude costs.", "url": "https://uk.finance.yahoo.com/news/chinese-refiners-suspend-october-fuel-075448881.html", "stocks": [{"t": "XLE", "n": "能源類股 ETF，原油上漲但油價與殖利率同步走高的壓力並存"}, {"t": "VLO", "n": "美國大型獨立煉油商，成品油供給吃緊時裂解價差的觀察對象"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "小型股喘息", "color": "#5B8ED6", "zh": "小型股在殖利率新高的一天終於有一點喘息：開盤時羅素 2000 指數一度下跌 0.39%，之後翻紅，iShares 羅素 2000 ETF（IWM）報導約上漲 0.4% 到 279.06 美元。這個反彈要放在前面的背景裡看：據報導羅素 2000 九月下跌超過 5%、第三季跌約 7.5%，是「對利率最敏感」的族群被打得最重。反彈一天不等於轉向，今晚的非農與殖利率才是真正的裁判。", "en": "Small caps got a bit of relief on a day of record-high yields: the Russell 2000 was down 0.39% at the open before turning up, and the iShares Russell 2000 ETF (IWM) was reported up about 0.4% at $279.06. Put that in context: the Russell 2000 reportedly fell more than 5% in September and about 7.5% in the third quarter, the group most sensitive to rates took the heaviest hit. One day of bounce is not a turn; tonight's jobs report and yields are the real referees.", "url": "https://www.cnbc.com/2026/09/30/stock-market-today-live-updates.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，約 +0.4% 到 279.06 美元，九月跌逾 5%"}, {"t": "VTWO", "n": "另一檔羅素 2000 ETF，成分與 IWM 高度重疊"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "電力授權", "color": "#5B8ED6", "zh": "Vicor（VICR）週四盤前跳升約 12%：公司把第三季營收成長財測從「至少 20%」上調到「超過 30%」，原因是首次非獨家授權「垂直供電」技術帶來的權利金收入增加。這家做電源模組的中小型公司，正好站在 AI 伺服器與資料中心供電的需求上；把一次性的授權金放進財測，也提醒讀者「超預期」有多少是可重複的營收。看這類股票，要追問下一季授權收入還在不在。", "en": "Vicor (VICR) jumped about 12% premarket Thursday after raising its third-quarter revenue growth guidance from at least 20% to more than 30%, driven by higher royalties from its first non-exclusive license of vertical power delivery technology. The power-module maker sits right on demand for AI server and data-center power; but when licensing fees go into guidance, readers should ask how much of the beat is repeatable. The question for the next quarter is whether the licensing revenue is still there.", "url": "https://www.gurufocus.com/news/9105119/vicor-corporation-vicr-shares-surge-10-on-upgraded-q3-growth-forecast", "stocks": [{"t": "VICR", "n": "Q3 營收成長財測上調到超過 30%（原為至少 20%），約 +12%"}, {"t": "VRT", "n": "資料中心電力與散熱設備，產業位置相近、可對照需求"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "併購被嫌", "color": "#5B8ED6", "zh": "Grindr（GRND）股價週四再跌逾 7%，原因是宣布以 2.5 億美元現金加股票收購 PurposeMed（旗下 Freddie 是提供愛滋預防藥線上處方的遠距醫療平台），交易預計年底前完成，若 Freddie 達成 2027 年的績效目標，2028 年還要再付 7,000 萬美元現金。投資人的疑慮就在這筆或有對價：買得貴、又跨到新業務。小型股宣布併購，市場通常先問「這筆錢是不是用股東的錢賭新故事」，答案得等整合成績。", "en": "Grindr (GRND) fell more than 7% again Thursday after announcing it will buy PurposeMed, parent of the Freddie telehealth service for HIV prevention prescriptions, for $250 million in cash and stock; the deal is expected to close later this year, with an additional $70 million in cash due in 2028 if Freddie hits 2027 performance targets. Investor doubt centers on that contingent payment: paying up and stepping into a new business. When a small cap announces an acquisition, the market first asks whether it is gambling shareholders' money on a new story; the answer waits for integration results.", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-oct-01-2026", "stocks": [{"t": "GRND", "n": "宣布 2.5 億美元收購 PurposeMed，股價連兩日下跌、單日約 -7%"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "小型股分數", "color": "#5B8ED6", "zh": "同樣叫「小型股」，指數裡裝的東西差很多。羅素 2000 約有 1,958 檔成分股、市值分界約 57 億美元，市場分析指出其中約四成公司目前仍在虧損；標普小型 600 則要求公司獲利為正才能納入。所以當利率很高、融資成本壓著虧損公司時，兩者的表現會分岔，近來資金也確實往 S&P 600 這類有獲利門檻的指數移動。看小型股的新聞，先問一句：說的是哪一個指數、裡面有多少公司在賺錢。", "en": "'Small cap' hides very different baskets. The Russell 2000 holds about 1,958 constituents with a market-cap breakpoint near $5.7 billion, and market analysis notes roughly 40% of the companies are currently unprofitable; the S&P SmallCap 600 requires positive earnings for inclusion. When rates are high and funding costs press loss-making firms, the two diverge, and money has been moving toward profit-screened indexes like the S&P 600. When reading small-cap news, ask which index is meant and how many of its companies actually earn money.", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，成分含大量虧損公司"}, {"t": "SPSM", "n": "標普小型 600 ETF，有獲利門檻"}, {"t": "IJR", "n": "iShares 標普小型 600 ETF，同為有獲利篩選的小型股基準"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "中型股弱勢", "color": "#5B8ED6", "zh": "市場強弱不一的一天，有兩檔中型的材料股特別弱：Mosaic（MOS）下跌約 5%，原因包括投入成本壓力未解、放空比例升高，以及近期的管理層更替；Smurfit Westrock（SW）下跌約 4.2%，包裝紙板產業整體疲弱、利潤率仍受壓。它們不是小型股，但同屬景氣循環材料，在殖利率與油價上揚時一起被賣，提醒我們「便宜」的循環股在成本上升的時候，常常是便宜得有理由。", "en": "On a lopsided day, two mid-cap materials names were notably weak: Mosaic (MOS) fell about 5% on unresolved input-cost pressure, rising short interest and a recent leadership transition, and Smurfit Westrock (SW) dropped about 4.2% on broad weakness and lingering margin pressure across containerboard and packaging. They are not small caps, but as cyclical materials they were sold together with yields and oil rising, a reminder that 'cheap' cyclicals are often cheap for a reason when costs climb.", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-oct-01-2026", "stocks": [{"t": "MOS", "n": "磷酸鹽與鉀肥，約 -4.97%，成本壓力、放空比例升高"}, {"t": "SW", "n": "包裝紙板，約 -4.24%，利潤率仍受壓"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "四內部人加碼", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月財年第四季財報", "zh": "Embecta（EMBC）是從 Becton Dickinson 分拆出來的胰島素筆針與針筒公司，股價約 5 美元、分析師共識偏向「減碼」，還面臨證券詐欺訴訟。8/12 四位內部人同日自費買進：執行長 Kurdikar 買 3 萬股（約 14.1 萬美元，均價 4.70）、財務長 Elguicze 買 2 萬股、Mann 買 2 萬股、董事 Hombach 買 4.5 萬股，過去十二個月內部人只買不賣。拐點證據是管理層與董事會同時用自己的錢表態；風險是糖尿病護理產品競爭、負債與訴訟的不確定性，這是研究線索、不是投資建議。", "en": "Embecta (EMBC), spun off from Becton Dickinson, makes insulin pen needles and syringes; the stock is around $5, analyst consensus leans 'Reduce' and it faces a securities-fraud lawsuit. On Aug. 12 four insiders bought on the same day: CEO Kurdikar 30,000 shares (about $141,000 at $4.70), CFO Elguicze 20,000, Mann 20,000 and director Hombach 45,000; insiders have bought but not sold over the past twelve months. The turn-signal is management and the board putting their own money in together; the risks are competition in diabetes care, debt and litigation. A research lead, not investment advice.", "url": "https://www.marketbeat.com/instant-alerts/jeffrey-mann-purchases-20000-shares-of-embecta-nasdaqembc-stock-2026-08-13/", "stocks": [{"t": "EMBC", "n": "分拆自 BD 的胰島素針具公司，8/12 四位內部人同日買進"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "紐約租賃", "color": "#C9A227", "status": "RADAR · 下一個驗證點 250 Livingston 同意協議或出售案", "zh": "Clipper Realty（CLPR）持有紐約市的出租公寓與商辦，股價約 3.3 美元、幾乎沒有市場關注。9 月內部人連續自費買進：董事兼 10% 持股人 Sam Levinson 在 9/8、9/14、9/23 共買約 14.96 萬股（均價 3.29 至 3.38 美元），營運長 Bistricer 9/28 買 7.35 萬股（3.35 美元）。公司說新簽的市價租約比舊租約高 13%、續約高逾 5%。風險很具體：布魯克林 250 Livingston 街的貸款已發生違約、貸款人可能走法拍，公司正在談同意與合作協議、可能出售該物件，槓桿偏高。這是研究線索、不是投資建議。", "en": "Clipper Realty (CLPR) owns New York City apartments and commercial space; the stock is near $3.30 with almost no market attention. In September insiders bought repeatedly: director and 10% holder Sam Levinson bought about 149,600 shares across Sept. 8, 14 and 23 ($3.29 to $3.38), and COO Bistricer bought 73,500 shares at $3.35 on Sept. 28. The company says new market-rate leases came in 13% above prior rents and renewals more than 5% higher. The risk is concrete: the loan on 250 Livingston Street in Brooklyn is in default, with the lender able to pursue foreclosure while the company negotiates a consent agreement and possible sale, and leverage is high. A research lead, not investment advice.", "url": "https://www.secform4.com/insider-trading/1649096.htm", "stocks": [{"t": "CLPR", "n": "紐約出租公寓 REIT，9 月董事與營運長連續買進，250 Livingston 貸款違約為主要風險"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "汽配轉盈", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月初第三季財報", "zh": "CarParts.com（PRTS）是網路汽車零件零售商，營收仍在萎縮，但損益表出現轉折：第二季營收 1.356 億美元（年減 10.7%），調整後 EBITDA 轉為 180 萬美元、為 2023 年第三季以來最高，連續六季改善，虧損也遠小於預期。9/4 到 9/9，執行長 Meniane 與營運長 Huffaker 各買約 7.9 萬股，價格 9.11 至 9.64 美元。風險是營收還在下滑、股價今年已漲約 86%（轉折可能已部分反映）、市值小、流動性有限。這是研究線索、不是投資建議。", "en": "CarParts.com (PRTS) is an online auto-parts retailer whose revenue is still shrinking but whose income statement has turned: second-quarter revenue was $135.6 million (down 10.7%) while adjusted EBITDA of $1.8 million was the highest since the third quarter of 2023, the sixth straight quarter of improvement, and the loss was far smaller than expected. Between Sept. 4 and 9, CEO Meniane and COO Huffaker each bought about 79,000 shares at $9.11 to $9.64. The risks: revenue is still declining, the stock is up about 86% this year (some turnaround may be priced in) and it is a thinly traded micro-cap. A research lead, not investment advice.", "url": "https://www.ad-hoc-news.de/boerse/news/nebenwerte/carparts-com-stock-reports-a-smaller-q2-loss-as-insiders-buy/70170043", "stocks": [{"t": "PRTS", "n": "網路汽配零售，Q2 調整後 EBITDA 180 萬美元、執行長與營運長 9 月各買約 7.9 萬股"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "賣掉子公司", "color": "#C9A227", "status": "RADAR · 下一個驗證點 12 月第三季財報與債務安排", "zh": "Skillsoft（SKIL）賣企業培訓與數位學習內容，股價約 6 美元，市場對它的興趣低。拐點在兩件事：公司完成出售 Global Knowledge，把業務聚焦在 AI 技能管理平台；9 月內部人也買進，執行長 Hovsepian 9/17 與 9/21 買 2,691 與 8,325 股（約 6.1 至 6.2 美元），董事 Francola 9/15 買 2.5 萬股（約 12.9 萬美元）。9/9 公布的財報，調整後每股盈餘優於預期，營收略低於預期。風險是負債：總債務約 5.78 億美元、淨債務約 5 億美元，現金僅 7,750 萬美元。這是研究線索、不是投資建議。", "en": "Skillsoft (SKIL) sells corporate training and e-learning content; the stock is around $6 and market interest is low. The turn rests on two things: the company completed the sale of Global Knowledge, refocusing on its AI skills platform, and insiders bought in September, with CEO Hovsepian buying 2,691 and 8,325 shares on Sept. 17 and 21 (about $6.10 to $6.17) and director Francola buying 25,000 shares on Sept. 15 (about $128,600). Results reported Sept. 9 beat on adjusted EPS while revenue was slightly light. The risk is debt: gross debt of about $578 million, net debt about $500 million and only $77.5 million of cash. A research lead, not investment advice.", "url": "https://www.marketbeat.com/instant-alerts/insider-insider-buying-skillsoft-nyse-skil-ceo-buys-8325-shares-2026-09-23/", "stocks": [{"t": "SKIL", "n": "企業培訓平台，出售 Global Knowledge、內部人 9 月買進，淨債務約 5 億美元"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "餐飲娛樂", "color": "#C9A227", "status": "RADAR · 下一個驗證點 12 月第三季同店銷售", "zh": "Dave & Buster's（PLAY）是餐飲加電玩的大型娛樂連鎖，股價約 6.5 美元，分析機構正在下調預期：Zacks 把它降到「強力賣出」。但數字有「變得不那麼壞」的線索：第二季營收 5.441 億美元（年減 2.4%），同店銷售減 2.9%、淨損 1,250 萬美元，同店銷售降幅 6 月是 5.0%、7 月收斂到 1.6%。財務長 Hatton 9/28 買進 4,000 股（均價 6.50 美元），另有一位董事 9 月中買進約 8.1 萬美元。風險是消費信心在十二年低點、虧損仍在擴大，同店銷售要連續轉正才算反轉。這是研究線索、不是投資建議。", "en": "Dave & Buster's (PLAY) is a large dining-plus-arcade entertainment chain; the stock is around $6.50 and research houses are cutting estimates, with Zacks downgrading it to Strong Sell. But the numbers show a 'less bad' trend: second-quarter revenue was $544.1 million (down 2.4%), comparable sales fell 2.9% and the net loss was $12.5 million, with the comp decline easing from 5.0% in June to 1.6% in July. CFO Hatton bought 4,000 shares at $6.50 on Sept. 28, and a director bought about $81,000 in mid-September. The risk is consumer confidence at a 12-year low and widening losses; comps need to turn positive for a real reversal. A research lead, not investment advice.", "url": "https://www.defenseworld.net/2026/09/29/play-stock-earnings-estimates-decreased-by-zacks-research.html", "stocks": [{"t": "PLAY", "n": "餐飲電玩連鎖，同店銷售降幅由 6 月 -5.0% 收斂至 7 月 -1.6%，財務長 9/28 買進"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "零分析師", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月第三季遞延歲修是否回流", "zh": "Team（TISI）做工業設備的檢測、維修與停機保養，目前沒有任何分析師追蹤。9/3 財務長 Roeder 以 27.59 美元買進 8,000 股（約 22.1 萬美元），OpenInsider 的叢集買進清單顯示三位內部人合計約 61 萬美元。股價今年已漲約 97%、接近 52 週高點 28.01 美元，所以「便宜」的故事不成立，這檔要看的是「訂單遞延會不會回來」：第二季營收 2.287 億美元（年減 7.8%）、調整後 EBITDA 1,280 萬美元（去年 2,450 萬美元），因為煉油廠為了高煉油利潤與中東衝突而延後歲修。這是研究線索、不是投資建議。", "en": "Team (TISI) provides industrial inspection, maintenance and turnaround services, and no analyst currently covers it. On Sept. 3 CFO Roeder bought 8,000 shares at $27.59 (about $221,000), and OpenInsider's cluster-buy list shows three insiders totaling about $610,000. The stock is up about 97% this year and near its 52-week high of $28.01, so this is not a cheap-stock story; the question is whether deferred work comes back: second-quarter revenue was $228.7 million (down 7.8%) and adjusted EBITDA $12.8 million versus $24.5 million a year earlier, as refiners postponed turnarounds to chase high margins amid the Middle East conflict. A research lead, not investment advice.", "url": "https://www.investing.com/news/insider-trading-news/team-inc-cfo-roeder-buys-220720-in-company-stock-93CH-4892246", "stocks": [{"t": "TISI", "n": "工業檢測與維修，零分析師，Q2 EBITDA 1,280 萬美元（去年 2,450 萬）、股價近 52 週高"}]},
    {"id": "insider_0", "channel": "內部人動向", "tag": "波克夏加碼", "color": "#6DB56D", "zh": "波克夏海瑟威（Berkshire Hathaway）9/30 申報的 Form 4 顯示，持續買進建商 Lennar（LEN）：這一筆買 642,821 股，平均價約 81.58 美元，約 5,244 萬美元（A 股 638,813 股均價 81.59 美元、B 股 4,008 股均價 79.98 美元），買完持有 26,034,436 股，持股增加約 2.53%；到 9 月下旬，部位已接近翻倍。判讀提醒：波克夏是大股東、不是公司經營者，它反映的是一個長期資本配置者對房屋建築週期的看法，而不是管理層對公司營運的內線資訊。", "en": "Berkshire Hathaway's Form 4 filed Sept. 30 shows it kept buying homebuilder Lennar (LEN): this tranche was 642,821 shares at an average of about $81.58, roughly $52.4 million (638,813 Class A at $81.59 and 4,008 Class B at $79.98), bringing it to 26,034,436 shares, a 2.53% increase; by late September the position had nearly doubled. A reading note: Berkshire is a large shareholder, not management, so it reflects a long-term capital allocator's view of the housing cycle rather than operating knowledge from inside the company.", "url": "https://www.marketbeat.com/instant-alerts/insider-lennar-nyse-len-major-shareholder-berkshire-hathaway-inc-acquires-642821-shares-of-company-stock-2026-09-30/", "stocks": [{"t": "LEN", "n": "波克夏單筆買約 5,244 萬美元，持股 26,034,436 股"}, {"t": "DHI", "n": "同為大型建商，可對照房市循環的看法"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "越跌越買", "color": "#6DB56D", "zh": "生技公司 Kodiak Sciences（KOD）出現大額買盤：持有 10% 以上股份的 Baker Bros. Advisors 在 9/28 買進 681,866 股、均價 88.77 美元（約 6,050 萬美元），9/29 再買 33,726 股、均價 85.05 美元；另一份 Form 4 顯示 9/30 買進 1,941,755 股、均價 80.85 美元，約 1.57 億美元。買價一路往下，代表它是在股價下跌時加碼。判讀提醒：Baker Bros. 是專業生技投資機構與大股東、不是公司管理層，它反映的是對特定臨床資產的機構判斷，並不等同公司內部知情。", "en": "Biotech Kodiak Sciences (KOD) saw heavy buying: Baker Bros. Advisors, a holder of more than 10%, bought 681,866 shares on Sept. 28 at an average of $88.77 (about $60.5 million) and 33,726 more on Sept. 29 at $85.05; another Form 4 shows a Sept. 30 purchase of 1,941,755 shares at $80.85, about $157 million. Prices stepped down each time, meaning it added as the stock fell. A reading note: Baker Bros. is a specialist biotech investor and large holder, not management, so it reflects an institutional view on specific clinical assets rather than knowledge from inside the company.", "url": "https://www.marketbeat.com/instant-alerts/insider-insider-buying-kodiak-sciences-nasdaq-kod-director-buys-6052924482-in-stock-2026-09-30/", "stocks": [{"t": "KOD", "n": "Baker Bros. 9/28 至 9/30 在 80 至 89 美元區間大額買進"}, {"t": "XENE", "n": "另一檔生技，OpenInsider 顯示 9/30 兩位內部人買 4.5 萬股、約 168 萬美元"}]},
