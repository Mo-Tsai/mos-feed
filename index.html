/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {

  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;

    --text-tertiary: #86837f; --divider: #2e2a24;

    background-repeat: repeat; background-size: 180px 180px;

  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }

    15% { opacity: 1; }
    70% { opacity: 1; }

  ::-webkit-scrollbar { width: 2px; }

  /* 鍵盤焦點:看得到目前在哪一顆 */

  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }
  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }

  {"id": "earn_0", "channel": "財報速報", "tag": "理想汽車虧損收窄", "color": "#E8786A", "zh": "理想汽車（LI）第三季營收 288 億人民幣（+5.4%），交車 99,964 輛（+7.2%），毛利率 16.7%，比第二季的 11.0% 大幅回升，淨虧損約 3.1 億、年減約一半。第四季交車指引 11 萬至 11.5 萬輛、營收 317 億至 331 億，有報導認為營收指引略低於預期。美股 ADR 週三收 11.88 美元（+11%），港股週四也漲約 11%。", "en": "Li Auto (LI) posted Q3 revenue of RMB28.8 billion (+5.4%) on 99,964 deliveries (+7.2%). Gross margin rebounded to 16.7% from 11.0% in Q2, and the net loss roughly halved to about RMB310 million. It guides Q4 deliveries of 110,000-115,000 and revenue of RMB31.7-33.1 billion, which one report calls slightly light. The US ADR closed 11% higher at $11.88 on Wednesday and the Hong Kong shares also rose about 11%.", "url": "https://ir.lixiang.com/news-releases/news-release-details/li-auto-inc-announces-unaudited-third-quarter-2026-financial", "stocks": [{"t": "LI", "n": "ADR 週三收 11.88 美元（+11%），毛利率回升"}, {"t": "XPEV", "n": "中國電動車同業，對照毛利走勢"}]},
  {"id": "earn_1", "channel": "財報速報", "tag": "Workday 跌後收復", "color": "#E8786A", "zh": "Workday（WDAY）本季營收 27.05 億美元（+11.2%），訂閱營收 25.32 億（+12.8%），未來 12 個月訂閱積壓 92.16 億（+12.3%），Non-GAAP 營業利益率 31.4%。公布後盤後與盤前一度跌約 7% 至 10%，週三盤中卻轉為約 +2.3%、報 183.31 美元（非收盤價）。Autodesk（ADSK）同樣優於預期並上修，盤前仍跌約 3.8%。", "en": "Workday (WDAY) reported revenue of $2.705 billion (+11.2%), subscription revenue of $2.532 billion (+12.8%), a 12-month subscription backlog of $9.216 billion (+12.3%) and a 31.4% non-GAAP operating margin. The shares fell roughly 7%-10% after hours and premarket, yet traded about 2.3% higher at $183.31 on Wednesday (intraday, not the close). Autodesk (ADSK) also beat and raised but was down about 3.8% premarket.", "url": "https://www.sec.gov/Archives/edgar/data/0001327811/000132781126000057/wday-10312026x991.htm", "stocks": [{"t": "WDAY", "n": "盤後重挫後週三盤中約 +2.3%"}, {"t": "ADSK", "n": "優於預期並上修，盤前約 -3.8%"}, {"t": "IGV", "n": "軟體類股 ETF，觀察財報後的族群反應"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "更正：CRWD 已公布", "color": "#E8786A", "zh": "更正昨天晨報：CrowdStrike（CRWD）財報不是 12/1，公司已改在 11/23 公布。營收 15.8 億美元（+28%），優於預期的 15.3 億，同時宣布以換股方式收購 Zscaler（ZS），每股 ZS 換 1.135 股 CRWD，整體約 439 億美元。市場把焦點放在併購，CRWD 約跌 9%（各來源寫 11/23 或 11/24），超預期的財報被蓋過。", "en": "A correction to yesterday's brief: CrowdStrike (CRWD) is not reporting on Dec. 1; it moved the release to Nov. 23. Revenue was $1.58 billion (+28%) against a $1.53 billion estimate, and it agreed to buy Zscaler (ZS) in stock, 1.135 CRWD shares per ZS share, about $43.9 billion in total. The deal overshadowed the beat and CRWD fell about 9% (sources date the move Nov. 23 or 24).", "url": "https://www.businesswire.com/news/home/20261123147150/en/CrowdStrike-Reports-Third-Quarter-Fiscal-Year-2027-Financial-Results", "stocks": [{"t": "CRWD", "n": "11/23 已公布財報，併購消息壓過業績"}, {"t": "ZS", "n": "被收購方，宣布當天大漲"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "貿易夥伴回應", "color": "#7C6AF7", "zh": "301 關稅提案的回應出爐：中國商務部要求美方改正，日本提出抗議，台灣行政院副院長表示有信心維持 15% 上限，新加坡表示非常失望。歐盟貿易部長預定下週一（11/30）與美國貿易代表 Greer 通話。生效時間各家寫法不同（最快明年 1 月，或 2 至 3 月前不太可能），是否與現行關稅疊加也有爭議；美中休戰 2027/1/10 到期。", "en": "Responses to the Section 301 proposal arrived. China's commerce ministry urged Washington to correct course, Japan protested, Taiwan's vice premier voiced confidence in keeping the 15% cap, and Singapore said it was very disappointed. EU trade ministers are due to speak with USTR Greer on Monday, Nov. 30. Timing estimates range from January to no earlier than February-March, stacking is disputed, and the US-China truce expires Jan. 10, 2027.", "url": "https://www.cnbc.com/2026/11/26/us-tariffs-hike-trade-agreement.html", "stocks": [{"t": "MCHI", "n": "中國股票 ETF，稅率上限 20%、休戰到期是變數"}, {"t": "EWS", "n": "新加坡股票 ETF，政府表示將在意見徵詢爭取重議"}, {"t": "VGK", "n": "歐洲股票 ETF，下週一歐美通話"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "ECB 偏鷹與新總裁", "color": "#7C6AF7", "zh": "歐洲央行週四公布 10 月會議紀要：許多委員當時就可以支持升息，最後一致同意按兵不動；除非通膨前景明顯改善，進一步緊縮很可能必要。市場估 12/17 升息一碼的機率約九成。另外，歐元區國家推舉現任 BIS 總經理 Hernández de Cos 接任總裁，仍待歐盟領袖 12 月正式拍板。", "en": "The ECB's October minutes, released Thursday, show many members could have backed a hike then, though all agreed to hold, and further tightening would likely be necessary unless the inflation outlook improves markedly. Markets put the odds of a quarter-point hike on Dec. 17 near 90%. Separately, euro-area countries picked BIS chief Pablo Hernández de Cos to succeed Christine Lagarde, pending formal approval by EU leaders in December.", "url": "https://www.fxstreet.com/news/euro-ticks-higher-as-ecb-minutes-reveal-appetite-for-further-tightening-202611261440", "stocks": [{"t": "FXE", "n": "歐元 ETF，歐元約 1.0986 小升"}, {"t": "EUFN", "n": "歐洲金融股 ETF，利率走高的敏感族群"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "亞洲升息潮", "color": "#7C6AF7", "zh": "南韓央行升息一碼到 3.25%（5 比 2），2026 年成長預估從 3.3% 上修到 3.9%、2027 年上修到 4.1%，ING 預期明年還會再升一碼。日本方面，市場普遍預期日銀 12/18 由 1.25% 升到 1.50%。加上聯準會 12/8 至 9 日升息機率約 97%，主要央行 12 月同步偏緊，全球資金成本還在往上。", "en": "The Bank of Korea raised its policy rate a quarter point to 3.25% in a 5-2 vote and lifted its growth forecasts to 3.9% for 2026 (from 3.3%) and 4.1% for 2027; ING expects one more hike next year. In Japan, a Dec. 18 move from 1.25% to 1.50% is widely expected. With about 97% odds of a Fed hike on Dec. 8-9, major central banks are leaning tighter into December and global funding costs are still rising.", "url": "https://www.fxstreet.com/news/korean-won-bank-of-korea-hikes-story-strong-ing-202611262112", "stocks": [{"t": "FXY", "n": "日圓 ETF，日銀 12/18 升息預期"}, {"t": "EWY", "n": "南韓股票 ETF，央行升息到 3.25%"}, {"t": "BNDX", "n": "美國以外債券 ETF，反映海外利率上行"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "金礦股重挫後", "color": "#4EABA4", "zh": "金礦股近期比金價痛得多：截至 11/20 那週金價創 14 個月新低（一說低點約 3,502 美元），VanEck 金礦 ETF（GDX）單週 -14.8%。報導歸因於科技股虧損引發的變現與保證金賣壓、升息預期和強勢美元。金價 11/23 反彈約 2.4%，週四約 3,566 美元。礦商獲利對金價有槓桿，跌與彈都會放大。", "en": "Gold miners have hurt far more than bullion. In the week to Nov. 20 gold hit a 14-month low (one source puts it near $3,502) and the VanEck Gold Miners ETF (GDX) fell 14.8%. Reports cite forced selling to cover tech losses and margin calls, rate-hike expectations and a strong dollar. Gold bounced about 2.4% on Nov. 23 and traded near $3,566 on Thursday. Miners are leveraged to the metal in both directions.", "url": "https://www.ntd.com/gold-hits-14-month-low_1186746.html", "stocks": [{"t": "GDX", "n": "金礦股 ETF，11/20 當週 -14.8%"}, {"t": "NEM", "n": "大型金礦商，獲利對金價有槓桿"}, {"t": "GLD", "n": "黃金 ETF，金價自低點回升"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "油輪運價回升", "color": "#4EABA4", "zh": "油輪是荷姆茲風險的另一面。Frontline 表示伊朗攻擊壓低通行量，原本的運價回落停住、現貨小幅回升，公司第四季已訂的超大型油輪現貨天數日租約 56.26 萬美元；波羅的海原油運價指數 11/19 漲逾 5%。但運價遠低於先前高點，市場也因制裁鬆綁與停火的可能性賣油輪股，兩股力量拉扯中。", "en": "Tankers are the other side of Hormuz risk. Frontline says Iranian attacks are curbing volumes, halting the rate correction and lifting spot rates modestly; its booked spot VLCC days for Q4 average about $562,600, and the Baltic Dirty Tanker Index rose more than 5% on Nov. 19. Rates remain far below earlier peaks, and investors have been selling tanker stocks on talk of sanctions relief and a possible deal.", "url": "https://www.lloydslist.com/LL1159257/Tanker-rates-rising-again-as-Hormuz-flow-falters-says-Frontline", "stocks": [{"t": "FRO", "n": "大型油輪船東，Q4 已訂日租約 56 萬美元"}, {"t": "DHT", "n": "超大型油輪船東"}, {"t": "STNG", "n": "成品油輪船東，同受航道風險影響"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "AI 導購與關稅", "color": "#4EABA4", "zh": "零售旺季兩條線。需求面：Adobe 統計 11/1 至 22 美國線上消費 825 億美元（+9.1%），感恩節前首次出現兩天單日破 40 億；它預測感恩節 AI 導流年增 159%，但消費者多半只用 AI 做功課、自己結帳。成本面：花旗點名新關稅讓 Adidas、H&M、Puma、Primark 有下修風險。感恩節當天實績我還沒查到。", "en": "Two threads for holiday retail. On demand, Adobe counted $82.5 billion of US online spending for Nov. 1-22 (+9.1%), with two $4 billion days before Thanksgiving for the first time, and forecasts a 159% rise in AI-referred traffic on Thanksgiving, though shoppers mostly use AI for research and pay on their own. On cost, Citi flags downgrade risk from the new tariffs for Adidas, H&M, Puma and Primark. No Thanksgiving-day actuals found yet.", "url": "https://www.digitalcommerce360.com/2026/11/25/adobe-online-holiday-spending-data/", "stocks": [{"t": "SHOP", "n": "電商平台，黑五交易量風向球"}, {"t": "AMZN", "n": "線上零售龍頭，AI 導購的主要戰場"}, {"t": "ADDYY", "n": "Adidas ADR，花旗點名關稅下修風險"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "鍍膜設備內部人買", "color": "#5B8ED6", "zh": "Forge Nano（NANO）做原子層沉積鍍膜設備，10 月才經 SPAC 掛牌。旗下電池事業總裁 Shane Smith 11/23、24 公開買進 81,580 股、約 25 萬美元，週三收 3.97 美元（+11.8%）。但基本面很吃重：近四季營收約 813 萬、毛利為負，市值約 8.9 億、股價營收比約 110 倍，負債 7,664 萬高於現金 1,572 萬，11/20 另有註冊文件待讀。", "en": "Forge Nano (NANO) makes atomic layer deposition equipment and listed via a SPAC in October. Shane Smith, president of its battery unit, bought 81,580 shares (about $250,000) on Nov. 23-24, and the stock closed up 11.8% at $3.97 on Wednesday. The fundamentals are heavy: trailing revenue of about $8.1 million, negative gross margin, a market value near $891 million (about 110 times sales), debt of $76.6 million against $15.7 million cash, and a Nov. 20 registration statement to review.", "url": "https://stockanalysis.com/stocks/nano/", "stocks": [{"t": "NANO", "n": "事業單位總裁買約 25 萬美元，週三 +11.8%"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "ALT 增為五人", "color": "#5B8ED6", "zh": "追蹤更新：臨床階段生技 Altimmune（ALT）的內部人買盤由三人增為五人，FinWire 統計 11/13 至 11/24 合計 110,731 美元、股價 1.42 至 1.64 美元，執行長 Durso 約 4.97 萬最多，董事 Sohn 11/24 的那筆 11/25 申報。人數增加是加分，但總額很小，資料沒說是否 10b5-1 預排，生技仍看臨床數據與現金。", "en": "Update on clinical-stage biotech Altimmune (ALT): insider buyers have grown from three to five. FinWire totals $110,731 between Nov. 13 and Nov. 24 at $1.42-$1.64, led by CEO Jerome Durso at about $49,700; director Catherine Sohn's Nov. 24 purchase was filed Nov. 25. More names is a plus, but the sum is small, the source does not say whether any trades were pre-planned, and the case still rests on trial data and cash.", "url": "https://finwire.io/news/insider-trading-news/cluster-buy-at-altimmune-inc-five-insiders-add-110731-of-alt", "stocks": [{"t": "ALT", "n": "五名內部人合計約 11 萬美元"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "KORU 獲利轉好", "color": "#5B8ED6", "zh": "雷達池追蹤：皮下輸液給藥設備商 KORU Medical（KRMD）第三季營收約 1,160 萬美元（+11%），調整後 EBITDA 由 10 萬升到 130 萬，全年營收指引 4,800 萬至 4,850 萬美元。公司 12/1 將在 Piper Sandler 醫療會議簡報，可留意放量速度與獲利目標的說法。規模小、成交量薄，單一季的改善要再看一兩季。", "en": "Pool follow-up: KORU Medical (KRMD), which makes subcutaneous infusion systems, grew Q3 revenue about 11% to $11.6 million, lifted adjusted EBITDA to $1.3 million from $0.1 million and guides full-year revenue of $48.0-48.5 million. It presents at the Piper Sandler healthcare conference on Dec. 1, a chance to hear about adoption and profit targets. It is small and thinly traded, so one good quarter needs follow-through.", "url": "https://www.stocktitan.net/news/KRMD/koru-medical-systems-announces-third-quarter-2026-results-including-ot9286q23x7q.html", "stocks": [{"t": "KRMD", "n": "Q3 營收 +11%，12/1 投資人會議"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "微型股暴漲榜", "color": "#5B8ED6", "zh": "週三美股小型股盤面：漲幅榜前面多是微型股，NXAT 約 +52.5% 到 0.65 美元，藥廠 Apimeds（APUS）約 +38.9% 到 3.21 美元。我沒有查到可確認的催化劑。這類股價很低、市值很小的標的，幾筆單就能推出大漲幅，成交一退常原路回吐；先查有沒有公告、增發或反向分割，再談基本面。", "en": "Wednesday's small-cap gainers were mostly micro-caps: NXAT rose about 52.5% to $0.65 and drug developer Apimeds (APUS) about 38.9% to $3.21. I found no confirmed catalyst. At such low prices and tiny market values a few orders can produce a huge percentage move that often reverses once volume fades. Check for filings, share issuance or reverse splits before discussing fundamentals.", "url": "https://www.chartmill.com/news/PDC/Chartmill-59189-Top-US-Stock-Movers-for-Nov-25-2026-Gainers-and-Losers", "stocks": [{"t": "NXAT", "n": "週三約 +52.5%，股價 0.65 美元"}, {"t": "APUS", "n": "週三約 +38.9%，催化劑未確認"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "兩種小型股指數", "color": "#5B8ED6", "zh": "判讀：週三 S&P 小型股 600 約 +0.8%，中型股 400 是主要指數中最強；羅素 2000 各來源寫 +0.57% 至 +0.78%。同樣叫小型股，池子不同：S&P 600 納入時要求公司有獲利紀錄，羅素 2000 沒有這道篩選、虧損公司比例高很多。升息環境下比較 IJR 與 IWM 的相對強弱，能看出資金是在買小型股，還是只買有賺錢的小型股。", "en": "How to read it: the S&P SmallCap 600 rose about 0.8% on Wednesday and the MidCap 400 led the major averages, while sources put the Russell 2000 anywhere from +0.57% to +0.78%. The pools differ. The S&P 600 requires an earnings record for entry; the Russell 2000 has no such screen and holds many more loss-makers. In a hiking cycle, comparing IJR with IWM shows whether money wants small caps or only profitable ones.", "url": "https://cappnotes.substack.com/p/closing-look-wednesday-november-25", "stocks": [{"t": "IJR", "n": "S&P 小型股 600 ETF，有獲利門檻"}, {"t": "IWM", "n": "羅素 2000 ETF，虧損公司比例較高"}, {"t": "MDY", "n": "S&P 中型股 400 ETF，週三最強"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "Patrick 董事買進", "color": "#C9A227", "zh": "Patrick Industries（PATK）：供應露營車、船舶、動力運動與組合屋零組件。忽視面：露營車景氣弱，股價 85.49 美元遠低於 52 週高點 148.50（仍有 12 位分析師，忽視度中等）。拐點：董事 Welch 11/23、25 買 5,200 股、約 43.3 萬美元（多數由配偶持有）；Q3 調整後 EPS 1.03 勝預期。風險：露營車營收 -15%、與 LCI 合併的執行。研究線索，非投資建議。", "en": "Patrick Industries (PATK) supplies parts to RV, marine, powersports and manufactured-housing makers. Neglect: the weak RV cycle leaves it at $85.49 against a $148.50 52-week high (12 analysts still cover it, so neglect is moderate). Change: director Scott Welch bought 5,200 shares (about $433,000) on Nov. 23 and 25, mostly through a spouse, and Q3 adjusted EPS of $1.03 beat. Risks: RV sales fell 15% and the LCI merger must be executed. A research lead, not investment advice.", "url": "https://www.investing.com/news/insider-trading-news/patrick-industries-director-acquires-432941-in-company-stock-93CH-5052027", "stocks": [{"t": "PATK", "n": "董事買約 43 萬美元，Q3 優於預期"}], "status": "RADAR · 下一個驗證點 LCI 合併交割與 Q4 財報"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "CVD 大股東加碼", "color": "#C9A227", "zh": "CVD Equipment（CVV）：做化學氣相沉積與熱製程設備，市值僅約 2,900 萬美元、資料站未列分析師。忽視面：營收近四季 -31%，營業仍虧。拐點：董事 Africk 控制的基金 11/13、16 公開買進 108,573 股、約 47 萬美元，合計持股 20.7%；公司裁員約一半並評估策略選項，9 月底現金約 2,345 萬、無負債。風險：帳上獲利主要來自出售事業。研究線索，非投資建議。", "en": "CVD Equipment (CVV) builds chemical vapor deposition and thermal process systems; its market value is only about $29 million and the data site lists no analysts. Neglect: trailing revenue is down 31% with operating losses. Change: a fund controlled by director Andrew Africk bought 108,573 shares (about $470,000) on Nov. 13 and 16, taking his stake to 20.7%; the company cut about half its staff, is reviewing strategic options and held $23.45 million cash with no debt. Risk: reported profit mostly reflects a divestiture. A research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0000766792/000149315226053116/primary_doc.xml", "stocks": [{"t": "CVV", "n": "董事關聯基金買約 47 萬美元，現金接近市值"}], "status": "RADAR · 下一個驗證點 策略評估結果與 Q4 財報"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "礦權低點買盤", "color": "#C9A227", "zh": "Black Stone Minerals（BSM）：持有美國 41 州油氣礦權收權利金的合夥企業。忽視面：資料站未列分析師覆蓋（待查），股價貼近 52 週低點 12.95。拐點：董事 DeWalch 11/24 以均價 13.29 美元買 22,222 單位、約 29.5 萬美元；Q3 法說稱產量成長、配息連兩次調升。風險：天然氣比重高、負債由 2024 年底 2,500 萬升到約 1.95 億、合夥稅務對海外投資人複雜。研究線索，非投資建議。", "en": "Black Stone Minerals (BSM) is a partnership collecting royalties on oil and gas mineral rights across 41 states. Neglect: the data site lists no analyst coverage (to be verified) and units sit near the $12.95 52-week low. Change: director D. Mark DeWalch bought 22,222 units at $13.29 (about $295,000) on Nov. 24, and the Q3 call cited production growth and a second straight distribution increase. Risks: gas-heavy mix, debt up to about $195 million from $25 million at end-2024, and complex partnership taxes for foreign holders. A research lead, not investment advice.", "url": "https://stockanalysis.com/stocks/bsm/", "stocks": [{"t": "BSM", "n": "董事買約 29.5 萬美元，近 52 週低點"}], "status": "RADAR · 下一個驗證點 下次配息公告與 Q4 財報"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "TransAct 分拆評估", "color": "#C9A227", "zh": "TransAct（TACT）：做博弈機台列印機與餐飲業標籤軟硬體的微型股。忽視面：規模小、單季營收僅 1,440 萬美元。拐點：Q3 營收約 +10%、餐飲科技帶動；董事會聘 BofA 評估博弈事業，並考慮出售餐飲科技事業，先前有股東揭露 5.1% 持股要求出售。風險：博弈需求弱、全年調整後 EBITDA 下修到 150 至 175 萬，評估不保證成交、沒有時間表。研究線索，非投資建議。", "en": "TransAct Technologies (TACT) is a micro-cap making casino-machine printers and food-service labeling hardware and software. Neglect: small scale, with quarterly sales of only $14.4 million. Change: Q3 sales rose about 10% on food-service technology, the board hired BofA to review the casino business and is weighing a sale of the food-service unit; a 5.1% holder had earlier pushed for sales. Risks: soft casino demand, full-year adjusted EBITDA cut to $1.5-1.75 million, no timetable and no guarantee of a deal. A research lead, not investment advice.", "url": "https://www.tradingview.com/news/tradingview:2ea524f4fb876:0-transact-technologies-q3-sales-rise-10-to-14-4-million-revises-2026-outlook/", "stocks": [{"t": "TACT", "n": "策略評估進行中，Q3 營收約 +10%"}], "status": "RADAR · 下一個驗證點 策略評估進展與 Q4 財報"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "DLH 年報前檢查", "color": "#C9A227", "zh": "DLH（DLHC，池內追蹤）：替美國聯邦政府做醫療與公共衛生專業服務的微型股。忽視面：舊合約流失後營收大幅縮水，6 月季營收 4,420 萬美元（前年同期 8,330 萬），含遞延稅資產備抵淨損約 1,680 萬。拐點待驗：先前紀錄大股東 Mink Brook 持續加碼。彙整站列 12/2 公布年報（公司未確認）。看營收是否止跌、債務是否續降。研究線索，非投資建議。", "en": "DLH Holdings (DLHC, pool follow-up) is a micro-cap providing health and public-health services to the US government. Neglect: revenue shrank as old contracts moved away, to $44.2 million in the June quarter from $83.3 million, with a net loss near $16.8 million including a deferred-tax valuation allowance. The turn is unproven; our earlier notes show holder Mink Brook still buying. An aggregator lists Dec. 2 for annual results (unconfirmed). Watch whether revenue stabilizes and debt keeps falling. A research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/785557/000162828026050627/dlhc-20260630.htm", "stocks": [{"t": "DLHC", "n": "年報預計 12 月，營收能否止跌"}], "status": "RADAR · 下一個驗證點 12/2 年報（彙整站日期，未確認）"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "機庫商指引分歧", "color": "#C9A227", "zh": "Sky Harbour（SKYH，池內追蹤）：開發出租商務機機庫園區。忽視面：規模小、仍在燒錢。新動態：BTIG 11/25 把目標價由 13 調到 14 美元、維持買進，理由是出租與開發進度；但同一份第三季更新裡，2026 年調整後 EBITDA 指引由 400 至 600 萬下修到損益兩平至 400 萬，和上調營收指引方向相反。風險：建設進度與資金需求。研究線索，非投資建議。", "en": "Sky Harbour (SKYH, pool follow-up) develops and leases business-aviation hangar campuses. Neglect: small and still burning cash. New: BTIG lifted its target to $14 from $13 on Nov. 25 and kept a Buy, citing leasing and development progress. Yet the Q3 update cut 2026 adjusted EBITDA guidance to breakeven-to-$4 million from $4-6 million, the opposite direction from the raised revenue outlook. Risks: construction pace and funding needs. A research lead, not investment advice.", "url": "https://investing.com/news/analyst-ratings/sky-harbor-stock-price-target-raised-to-14-by-btig-on-strong-leasing-development-93CH-5050282", "stocks": [{"t": "SKYH", "n": "目標價上調到 14 美元，但 EBITDA 指引下修"}], "status": "RADAR · 下一個驗證點 2027 年指引與下一次 Form 4"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "Galaxy 雙主管買", "color": "#6DB56D", "zh": "Galaxy Digital（GLXY）執行長 Novogratz 與財務長 Paquette 同時公開買進。財務長 11/25 買 25,000 股、均價約 10.74 美元、約 26.9 萬；執行長金額兩個來源不同：Investing.com 寫 11/25 約 95.6 萬，Unusual Whales 寫 11/20 至 25 約 583 萬，要回看 Form 4。後者並指非 10b5-1 預排，公司另核准追加 2 億美元庫藏股；股價近期曾大跌約 17%。", "en": "Galaxy Digital (GLXY) saw both CEO Michael Novogratz and CFO Anthony Paquette buy in the open market. Paquette bought 25,000 shares at about $10.74 (some $269,000) on Nov. 25. The CEO figure differs: Investing.com shows about $956,000 on Nov. 25, Unusual Whales about $5.83 million over Nov. 20-25, so check the Form 4s. The latter says the trades were not 10b5-1 plans and notes an added $200 million buyback authorization; the shares recently fell about 17%.", "url": "https://unusualwhales.com/news/galaxy-digital-ceo-cfo-buy-stock-2026-11-26", "stocks": [{"t": "GLXY", "n": "執行長與財務長同期公開買進"}]},
  {"id": "insider_1", "channel": "內部人動向", "tag": "大額單筆比較", "color": "#6DB56D", "zh": "兩筆金額差很大的買進：光通訊與雷射材料商 Coherent（COHR）董事 Pagliuca 11/23、24 買 169,910 股、約 3,470 萬美元（均價約 204），11/25 盤後申報；油氣公司 Mach Natural Resources（MNR）執行長 Ward 約 197 萬、董事兼大股東 McMullen 約 20 萬。兩者都來自彙整站，未核對原件；大股東型董事的買進，要分清是個人還是所屬基金出錢。", "en": "Two very different sizes. Coherent (COHR) director Stephen Pagliuca bought 169,910 shares, about $34.7 million at roughly $204, on Nov. 23-24, filed after the close on Nov. 25. At Mach Natural Resources (MNR), CEO Tom Ward bought about $1.97 million and director and major holder William McMullen about $200,000. Both come from aggregators and were not checked against filings; with holder-directors, ask whether personal or fund money paid.", "url": "https://www.quantisnow.com/insight/director-stephen-g-pagliuca-bought-34652890-worth-of-shares-169910-6807624", "stocks": [{"t": "COHR", "n": "董事買約 3,470 萬美元"}, {"t": "MNR", "n": "執行長與董事合計約 217 萬美元"}]},
  {"id": "insider_2", "channel": "內部人動向", "tag": "誰在買、怎麼買", "color": "#6DB56D", "zh": "判讀：看內部人買進先問三件事。一，誰出錢：今天 PATK 那筆多數記在配偶名下，CVV 是董事控制的基金。二，哪種申報：CVV 是 13D 修正案，反映大股東持股變化，不是一般 Form 4。三，股數別看表面：Kodiak AI（KDK）執行長 11/24 買 200 萬股聽起來很多，股價約 1.11 美元，實際約 221 萬美元。金額要再對照他原本持股與薪酬。", "en": "Three questions for any insider buy. Who paid: most of today's PATK purchase sits in a spouse's name, and CVV's came from a director-controlled fund. Which filing: the CVV item is a 13D amendment tracking a large holder's stake, not an ordinary Form 4. And do not judge by share count: Kodiak AI (KDK) CEO's 2 million shares on Nov. 24 sound large, but at about $1.11 it is roughly $2.21 million. Compare the sum with existing holdings and pay.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+November+25,+2026", "stocks": [{"t": "KDK", "n": "執行長買 200 萬股、約 221 萬美元"}]},
  {"id": "capitol_0", "channel": "政要持股", "tag": "晶片一買一賣", "color": "#B5654D", "zh": "本週申報裡晶片鏈方向不一。參議員 Rand Paul 11/25 申報本人三筆買進 Nvidia（交易日 11/5、7、9），每筆 1,001 至 15,000 美元。眾議員 Hageman 11/23 申報 39 筆、多標配偶，10/14 同一天賣出 NVDA、AMD、CRWD、PANW、SNOW，也賣 LLY、MRK 等藥廠。金額小、同日跨產業進出，看起來比較像組合調整，撐不起單一主題。", "en": "This week's filings point both ways on chips. Sen. Rand Paul reported on Nov. 25 three of his own Nvidia purchases (Nov. 5, 7 and 9), each $1,001-$15,000. Rep. Harriet Hageman filed 39 trades on Nov. 23, mostly marked spouse, including Oct. 14 sales of NVDA, AMD, CRWD, PANW and SNOW, plus drugmakers such as LLY and MRK. Small sizes and same-day moves across sectors look more like portfolio rebalancing than a single thesis.", "url": "https://getsignal.finance/congress/trades", "stocks": [{"t": "NVDA", "n": "一邊小額買進、一邊配偶帳戶賣出"}, {"t": "PANW", "n": "10/14 配偶帳戶賣出之一"}, {"t": "LLY", "n": "同日藥廠賣出之一"}]},
  {"id": "capitol_1", "channel": "政要持股", "tag": "先看交易日", "color": "#B5654D", "zh": "判讀：申報日是新聞日，交易日才是價格。眾議員 Onder 11/24 申報 12 筆賣出（PEP、DUK、PG、MDLZ 各 1.5 萬至 5 萬美元），實際交易是 10/29；Hageman 那份有些交易距申報 68 至 88 天，超過 45 天期限。彙整站彼此也漏件，有的沒列 Hageman 與 Meuser。金額只有區間，先核對官方原件再下結論。", "en": "The filing date makes the news; the trade date sets the price. Rep. Robert Onder reported 12 sales on Nov. 24, including PEP, DUK, PG and MDLZ at $15,000-$50,000 each, all traded Oct. 29. Some trades in the Hageman report were filed 68-88 days after execution, beyond the 45-day window. Aggregators also miss filings, with one omitting both Hageman and Meuser. Amounts are only ranges, so check the official documents.", "url": "https://coldpine.io/filings", "stocks": [{"t": "PEP", "n": "10/29 賣出，11/24 才申報"}, {"t": "DUK", "n": "公用事業，同批賣出"}, {"t": "PG", "n": "必需消費，同批賣出"}]},
  {"id": "week_0", "channel": "本週事件", "tag": "OPEC 到非農", "color": "#C97DD4", "zh": "接下來的總經：今晚美股半日盤；週日 11/29 OPEC+ 部長會議；週一 11/30 歐盟貿易部長與美國貿易代表通話；下週二、四是 ISM 製造業與服務業，ActionForex 預估 53.8（前值 55.4）與 54.9（前值 54.5），該預覽未寫明日期，請對照行事曆；12/4（五）非農預估約增 8 萬、失業率 4.1%；12/8 至 9 日 FOMC。", "en": "Coming up: a half session tonight; the OPEC+ ministerial meeting Sunday, Nov. 29; the EU-USTR call Monday, Nov. 30; ISM manufacturing and services next Tuesday and Thursday, with ActionForex expecting 53.8 (from 55.4) and 54.9 (from 54.5), though its preview states no dates, so check a calendar; November payrolls on Friday, Dec. 4, seen near +80,000 with 4.1% unemployment; and the FOMC on Dec. 8-9.", "url": "https://www.actionforex.com/contributors/fundamental-analysis/662125-economics-week-ahead-35/", "stocks": [{"t": "SHY", "n": "短天期公債 ETF，非農與 FOMC 敏感"}, {"t": "UUP", "n": "美元指數 ETF，升息預期支撐美元"}]},
  {"id": "week_1", "channel": "本週事件", "tag": "下週重點財報", "color": "#C97DD4", "zh": "下週財報：行事曆顯示 Marvell（MRVL）12/1、Salesforce（CRM）12/2，標示為公司公告日期；折扣零售 Dollar Tree（DLTR）也在同一週的清單上，確切日期請以公司網站為準。注意 CrowdStrike 已提前公布，舊行事曆仍可能列 12/1。看點：MRVL 的資料中心訂製晶片訂單、CRM 的 AI 產品收入、DLTR 的客流與關稅成本。", "en": "Next week's earnings: calendars show Marvell (MRVL) on Dec. 1 and Salesforce (CRM) on Dec. 2, marked company-announced; discount retailer Dollar Tree (DLTR) also appears that week, so confirm its date on the company site. CrowdStrike has already reported, though stale calendars may still list Dec. 1. Watch Marvell's custom data-center chip orders, Salesforce's AI revenue and Dollar Tree's traffic and tariff costs.", "url": "https://greeksoup.ai/stocks/us/results/upcoming/", "stocks": [{"t": "MRVL", "n": "12/1，資料中心訂製晶片"}, {"t": "CRM", "n": "12/2，AI 產品收入"}, {"t": "DLTR", "n": "同週公布，客流與關稅成本"}]},
  {"id": "eval_0", "channel": "今日評估", "tag": "海外反彈算數嗎", "color": "#E8A838", "zh": "今天最值得注意的是：美股休市時，歐亞股市替週三的急跌做了一次投票，歐股漲近 2%、日股科技反彈，期貨小漲。但南韓只彈回一小塊，油價仍有地緣溢價，12 月主要央行同步偏緊，利率壓力沒有消失。分辨方法：今晚半日盤先別下結論，看下週量能回來後，晶片股能否跟上指數。你認為這是風險解除，還是賣壓暫歇？", "en": "What stands out: while the US was closed, Europe and Asia voted on Wednesday's slide, with European stocks up nearly 2%, Japanese tech rebounding and futures slightly higher. Yet Korea recovered only a sliver, oil still carries a geopolitical premium and major central banks lean tighter into December. Do not read much into tonight's half session; watch whether chip stocks keep pace once volume returns next week. Is this risk clearing, or selling pausing?", "url": "https://investinglive.com/stocks/european-stocks-surge-s-p-500-futures-finish-higher-in-thanksgiving-trading/", "stocks": [{"t": "ACWX", "n": "美國以外股票 ETF，海外反彈的代理"}, {"t": "SOXX", "n": "半導體 ETF，下週相對強弱"}], "status": "觀察 · 下週量能回來後晶片股相對強弱"},
