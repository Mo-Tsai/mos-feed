<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "指數分家", "color": "#E05C5C", "zh": "週二三大指數走了三個方向：那斯達克綜合指數漲約 0.5% 收在 27,244 點、連兩天改寫收盤紀錄；標普 500 幾乎完全不動，收 7,764.64、只比前一天低 0.06 點；道瓊反而跌 185 點、0.36% 收 51,864。標普 500 收在小數點後兩位都幾乎不變，不代表市場沒事發生，而是指數內部的加減法剛好抵銷——科技與晶片的漲幅，被銀行與道瓊成分股的賣壓吃掉。這種「指數靜止、底下劇烈換手」的盤，通常比單日大漲更值得留意，因為它告訴你資金是在移動而不是在進場。", "en": "Tuesday's three main indices went three different ways. The Nasdaq Composite rose about 0.5% to 27,244, a second straight record close; the S&P 500 barely moved at all, finishing at 7,764.64, just 0.06 points below Monday; the Dow fell 185 points, or 0.36%, to 51,864. An S&P 500 that is unchanged to two decimal places does not mean nothing happened - it means the arithmetic inside the index cancelled out, with gains in tech and semiconductors absorbed by selling in banks and Dow components. A flat index with violent churn underneath is usually more informative than a big up day, because it tells you money is rotating rather than arriving.", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-22-2026", "stocks": [{"t": "QQQ", "n": "那斯達克100 ETF，追蹤當日唯一收紅的主要指數、連兩日創高"}, {"t": "SPY", "n": "標普500 ETF，對應收 7,764.64、單日僅 -0.06 點的指數"}, {"t": "DIA", "n": "道瓊 ETF，對應當日 -0.36%、跌 185 點的落後指數"}]},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "費半六連紅", "color": "#E05C5C", "zh": "半導體是週二唯一有明確方向的板塊：追蹤晶片龍頭的指數連續第六個交易日上漲，帶動那斯達克 100 指數改寫六月以來的第一個紀錄。這一段的主角是記憶體與 AI 基礎建設，美光（Micron）與輝達（Nvidia）都在推升名單上。要理解這六天，關鍵是市場正在把 AI 需求跟利率脫鉤看待——聯準會上週才升息，但晶片股照漲，等於押注「終端需求強到升息也擋不住」。這個假設的第一份實測是 9/30 美光的年度財報。", "en": "Semiconductors were the one group with a clear direction on Tuesday: a closely watched gauge of chip majors rose for a sixth straight session, carrying the Nasdaq 100 to its first record since June. Memory and AI infrastructure led, with Micron and Nvidia both among the drivers. The way to read the six-day run is that the market is decoupling AI demand from interest rates - the Fed hiked only last week, yet chips kept rising, which is a bet that end demand is strong enough to ignore policy. The first real test of that assumption is Micron's fiscal year-end report on September 30.", "url": "https://www.bloomberg.com/news/articles/2026-09-22/us-stock-futures-drift-after-ai-driven-rally-oil-prices-slip", "stocks": [{"t": "SOXX", "n": "費城半導體 ETF，對應連六日上漲的晶片指數"}, {"t": "MU", "n": "美光，這波記憶體行情的核心，9/30 盤後公布 FY26 Q4"}, {"t": "NVDA", "n": "輝達，AI 加速器需求端的代表，與美光同列推升名單"}]},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "油價連五跌", "color": "#E05C5C", "zh": "原油繼續走弱：布蘭特原油跌 1% 收 99.25 美元、西德州原油跌 1.2% 收 94.59 美元，本週累計跌超過 4%，但整個九月仍上漲逾 9%。直接原因是外交——美方與伊朗代表團在聯合國大會場邊談了三個小時，川普說可能願意會見伊朗總統佩澤希齊揚。同時美軍中央司令部指出，通過荷莫茲海峽的原油與液化天然氣流量已回到六個月高點、主航道已清除水雷。這裡要分清楚兩件事：油價跌是「風險溢價退潮」，不是需求變好。", "en": "Crude kept sliding: Brent fell 1% to settle at $99.25 and WTI lost 1.2% to $94.59, leaving the week down more than 4% - though September is still up over 9%. The proximate cause was diplomacy. US officials met Iran's delegation for three hours on the sidelines of the UN General Assembly, and Trump said he would probably be open to meeting President Pezeshkian. Separately, US Central Command said crude and LNG flows through Hormuz have reached a six-month high with the main transit lanes cleared of mines. Keep the distinction straight: this is a risk premium draining away, not demand improving.", "url": "https://www.cnbc.com/2026/09/22/oil-iran-us-bessent-un-crude.html", "stocks": [{"t": "XLE", "n": "能源類股 ETF，油價連跌下的直接承壓標的"}, {"t": "OXY", "n": "上游生產商，獲利對油價彈性最高的一類"}, {"t": "VLO", "n": "煉油商，原油走弱時反而有利於裂解價差"}]},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "銀行拖後腿", "color": "#E05C5C", "zh": "週二盤面的結構比指數更值得看：整體個股偏多、小型股續強，但銀行股出現明顯賣壓，正是這一塊把道瓊與標普 500 壓回平盤。銀行的問題不是壞消息，而是利率路徑翻轉的兩面性——升息一方面擴大存放利差，一方面提高存款競爭與債券部位的未實現虧損，市場還沒決定要給哪一邊更高權重。當廣度是好的、但金融股單獨走弱，通常代表市場對「經濟撐得住」有信心，對「銀行資產負債表撐得住」沒信心。", "en": "The structure of Tuesday's tape mattered more than the index prints: breadth was positive and small caps kept advancing, but bank shares sold off, and that is what pulled the Dow and S&P 500 back to flat. The problem for banks is not bad news; it is that a reversed rate path cuts both ways - a hike widens the spread between loan and deposit yields, but it also intensifies deposit competition and deepens unrealised losses on securities books, and the market has not decided which side to weight. When breadth is good but financials alone lag, it usually means confidence in the economy and doubt about bank balance sheets.", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-22-2026", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，週二小型股續強、與大型指數分歧"}, {"t": "KRE", "n": "區域銀行 ETF，當日賣壓最集中的一塊"}]},
    {"id": "earn_0", "channel": "財報速報", "tag": "AutoZone", "color": "#E8786A", "zh": "汽車零件連鎖 AutoZone 公布會計年度第四季：每股盈餘 56.05 美元、優於市場預期的 54.08 美元，淨利 9.316 億美元；營收 65.9 億美元、年增 5.6%，但略低於預期的 67 億。營業利益 13.17 億、年增 10.1%，營業利益率擴張 81 個基點到 20.0%；美國同店銷售只成長 1.6%，國際同店卻成長 10.7%。全年營收首度突破 200 億美元，股價收漲 5.71% 到 2,963.34 美元。要注意市場的解讀分歧：這次的獲利超預期有一部分來自關稅退款的挹注，扣掉之後本業的成長斜率沒有股價反應的那麼陡。", "en": "AutoZone reported fiscal Q4 earnings of $56.05 a share against the $54.08 consensus, with net income of $931.6 million. Revenue rose 5.6% to $6.59 billion, slightly short of the $6.7 billion expected. Operating profit climbed 10.1% to $1,317 million and operating margin expanded 81 basis points to 20.0%. Domestic same-store sales grew just 1.6% while international comps rose 10.7%. Full-year revenue topped $20 billion for the first time, and the shares closed up 5.71% at $2,963.34. Note the split reading: part of the beat came from a tariff refund, and stripping that out leaves an underlying growth slope less steep than the share reaction implies.", "url": "https://247wallst.com/cards/autozone-q4-2026-earnings-azo-01m34ce1jkfag556xtb8vnk0aw", "stocks": [{"t": "AZO", "n": "本季主角，EPS 56.05 超預期、股價收漲 5.71%"}, {"t": "ORLY", "n": "同業對照組，美國同店只增 1.6% 是全產業的共同問題"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "KB Home", "color": "#E8786A", "zh": "住宅建商 KB Home 第三季雙雙優於預期：營收 12.97 億美元、調整後每股盈餘 1.05 美元（預期 0.89），但底下的量能很差——交屋 2,732 戶、年減 19%，平均售價從 47.57 萬降到 47.3 萬，新接訂單年減 12%。唯一的亮點是在手訂單金額四年來第一次回升，戶數增 2% 到 4,398 戶、金額增 3% 到 20.5 億美元。公司同時下修全年住宅營收指引到 49 至 51 億美元、毛利率降到 16.0-16.2%。這份財報的讀法是：獲利品質靠成本控制，需求端還沒轉彎。", "en": "KB Home beat on both lines in Q3: revenue of $1.297 billion and adjusted EPS of $1.05 against $0.89 expected. The volume underneath was weak - 2,732 homes delivered, down 19% year over year, average selling price down to $473,000 from $475,700, and net orders off 12%. The single bright spot was backlog value rising for the first time in four years, with homes in backlog up 2% to 4,398 and value up 3% to $2.05 billion. Management cut full-year housing revenue guidance to $4.9-5.1 billion and gross margin to 16.0-16.2%. The read: earnings quality is coming from cost control, and demand has not turned.", "url": "https://www.benzinga.com/markets/earnings/26/09/61935036/kb-home-posts-q3-double-beat-despite-weakening-housing-market", "stocks": [{"t": "KBH", "n": "本季主角，交屋年減 19%、全年指引下修"}, {"t": "LEN", "n": "同業對照組，下一份財報是檢驗「需求問題是全產業」的樣本"}, {"t": "ITB", "n": "美國住宅建商 ETF，利率翻轉後整個板塊的承壓位置"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "VK2735 數據", "color": "#E8786A", "zh": "這不是財報而是臨床數據，但它是週二影響最大的單一公司事件：Viking Therapeutics 公布 GLP-1/GIP 雙激動劑 VK2735 的維持期試驗頂線結果，股價單日大漲約 28%。設計是 21 週誘導期後接 12 週維持期；誘導期結束時的減重幅度（扣除安慰劑）約 16% 到 19%，探索性族群到第 33 週達約 22%。真正的重點在維持期：從每週注射改成每月一次者，平均保住第 21 週減重的 85%（對照安慰劑組只剩 61%），改成兩週一次者可保住多達 97%，且腸胃道副作用發生率與安慰劑相當。", "en": "Not an earnings report but the single biggest company event of Tuesday: Viking Therapeutics released topline results from a maintenance study of its GLP-1/GIP dual agonist VK2735, and the stock jumped about 28%. The design was a 21-week induction period followed by 12 weeks of maintenance. Placebo-adjusted weight loss at week 21 ran roughly 16% to 19%, with an exploratory cohort reaching about 22% by week 33. The maintenance data is the real point: patients moved from weekly to monthly dosing held an average of 85% of their week-21 loss, against 61% for those switched to placebo, and every-other-week dosing preserved up to 97%, with GI adverse events comparable to placebo.", "url": "https://ir.vikingtherapeutics.com/2026-09-22-Viking-Therapeutics-Announces-Positive-Topline-Results-from-Maintenance-Study-of-GLP-1-GIP-Agonist-VK2735-Demonstrating-the-Promise-of-Multiple-Maintenance-Dosing-Regimens", "stocks": [{"t": "VKTX", "n": "本則主角，維持期數據公布當日大漲約 28%"}, {"t": "GPCR", "n": "口服 GLP-1 開發的同類小型生技，維持期劑量彈性是共同賣點"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "升息後的債市", "color": "#7C6AF7", "zh": "要看懂現在的美股，得先接受一個已經改變的前提：聯準會在 9 月 16 日升息 1 碼、把政策利率推到 3.75%-4.00%，是 2023 年以來的第一次升息。主席沃許（Kevin Warsh）當時的說法是「今年夏天的通膨讀數沒有告訴我底層趨勢有實質改善，通膨太高，而且已經高太久」。十年期公債殖利率一度被推上 5% 關卡，週二則幾乎沒動、收在 4.959%；兩年期 4.743%、三十年期 5.296%。債市目前的定價是「暫停觀望」，不是「政策轉向」。", "en": "To read the current equity market you have to accept a changed premise: on September 16 the Fed raised rates by a quarter point to 3.75%-4.00%, its first hike since 2023. Chair Kevin Warsh put it this way - this summer's inflation readings do not tell him underlying trends have meaningfully improved, and inflation is too high and has been for too long. The 10-year Treasury yield was pushed back above the 5% handle after the decision; on Tuesday it barely moved, closing at 4.959%, with the 2-year at 4.743% and the 30-year at 5.296%. The bond market is currently priced for a pause and a look, not for a policy turn.", "url": "https://www.cnbc.com/2026/09/16/treasury-yield-bond-market-fed-decision.html", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，三十年期殖利率 5.296% 的價格對照"}, {"t": "IEF", "n": "中天期公債 ETF，對應十年期 4.959% 的位置"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "發言週", "color": "#7C6AF7", "zh": "本週的總經行事曆沒有消費者物價指數、也沒有個人消費支出物價指數，是一個典型的「發言週」——聯準會官員本週排了不下十場公開露面。這種週次的特徵是：沒有硬數據可以校正，市場就只能靠官員的語氣去猜下一步。目前點陣圖的分布是 18 位官員中有 16 位認為今年還會再有至少 1 碼升息、其中 4 位認為會有兩次。換句話說，市場現在辯論的不是「會不會降息」，而是「今年還會再升幾次」，這個前提的翻轉本身就值得寫在筆記本第一行。", "en": "This week's macro calendar carries neither CPI nor PCE - it is a classic Fedspeak week, with officials down for no fewer than ten public appearances. The signature of such a week is that with no hard data to anchor on, the market is left guessing from tone. The current dot plot has 16 of 18 officials seeing at least one more quarter-point hike this year, four of them penciling in two. Put differently, the debate is no longer whether cuts are coming but how many more hikes land this year - and that inversion of the premise deserves the first line in anyone's notebook.", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar", "stocks": [{"t": "GLD", "n": "黃金 ETF，實質利率走高時最直接的反向對照"}, {"t": "UUP", "n": "美元指數 ETF，升息預期與美元強弱的對照組"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "川習會", "color": "#7C6AF7", "zh": "本週真正的主事件在 9 月 24 日：川普在白宮接待習近平，是習近平自 2015 年以來第一次造訪白宮，也是兩人六個月內的第二次會面。議程涵蓋關稅、晶片出口管制、稀土供應、人工智慧與台灣議題，輝達執行長黃仁勳與 OpenAI 執行長奧特曼預計出席國宴。市場在意的其實是一個硬日期：2025 年 10 月釜山達成的休兵所對應的關稅豁免，依白宮命令執行到 11 月 10 日。這場會決定的是「休兵會不會續約」，不是「貿易戰會不會結束」。", "en": "The real event of the week lands on September 24: Trump hosts Xi Jinping at the White House, Xi's first visit there since 2015 and the pair's second meeting in six months. The agenda spans tariffs, chip export controls, rare-earth supply, artificial intelligence and Taiwan, with Nvidia's Jensen Huang and OpenAI's Sam Altman expected at the state dinner. What the market actually cares about is a hard date: the tariff exclusions implementing the Busan truce reached in late October 2025 run through November 10 under a White House order. This meeting decides whether the truce gets renewed, not whether the trade war ends.", "url": "https://www.usnews.com/news/national-news/articles/2026-09-21/trump-and-xi-meet-in-washington-under-shadow-of-ai-trade-and-rare-earth-tensions", "stocks": [{"t": "FXI", "n": "中國大型股 ETF，休兵是否續約的直接定價工具"}, {"t": "MP", "n": "美國本土稀土生產商，稀土供應議題的受惠或受害端"}, {"t": "NVDA", "n": "執行長出席國宴，晶片出口管制是議程核心之一"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "減肥藥沒跟漲", "color": "#4EABA4", "zh": "週二最值得記下來的板塊現象，是 Viking 獨自大漲近 28%，而整個減肥藥複合體幾乎沒有反應。禮來股價幾乎不動，諾和諾德還跌 0.7% 到 39.54 美元、一年跌幅來到 32.5%，後者正在消化 2027 年 1 月 1 日生效的定價調整——Wegovy 標價約砍半、Ozempic 砍約 35%。這代表市場把 VK2735 的數據讀成「單一資產的驗證」與「搶食既有大廠」，而不是「整個減重市場的規模被放大」。同一則好消息，市場選擇把它算成零和而非增量，這個選擇比數據本身更有資訊量。", "en": "The sector fact worth writing down from Tuesday is that Viking rose almost 28% alone while the rest of the obesity complex barely registered. Eli Lilly hardly moved, and Novo Nordisk actually slipped 0.7% to $39.54, extending a 32.5% one-year decline as it absorbs list-price cuts effective January 1, 2027 - roughly half off Wegovy and about 35% off Ozempic. That means the market read the VK2735 data as validation of a single asset and a threat to incumbents, not as evidence the addressable obesity market just got bigger. Faced with one piece of good news, the market chose to score it zero-sum rather than additive, and that choice carries more information than the data.", "url": "https://247wallst.com/investing/2026/09/22/viking-soars-alone-as-obesity-complex-shrugs-at-strong-glp-1-results/", "stocks": [{"t": "LLY", "n": "減重龍頭，數據公布當日股價幾乎不動"}, {"t": "NVO", "n": "跌 0.7% 到 39.54 美元，一年跌 32.5%、2027 起大幅降價"}, {"t": "VKTX", "n": "獨自上漲近 28%，被讀成搶食而非做大市場"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "煉油吃價差", "color": "#4EABA4", "zh": "油價回落對能源板塊不是齊跌，而是一次內部分家。上游生產商的獲利直接跟著油價走，布蘭特跌破 100 美元、本週累跌逾 4%，是直接的獲利壓縮；煉油商的獲利來自裂解價差，也就是成品油價格減去原油成本，原油下跌反而是成本端的利多。判斷這一段有沒有真的發生，不要看油價，要看煉油廠的實現利潤率——這是下個月底陸續公布的第三季財報裡唯一該看的一行。九月整體油價仍漲逾 9%，所以現在談的是回吐，不是趨勢反轉。", "en": "A falling oil price does not sink the energy sector uniformly; it splits it. Upstream producers' earnings track the crude price directly, so Brent breaking below $100 and losing more than 4% on the week is straight margin compression. Refiners earn the crack spread - product prices minus crude cost - so cheaper crude is a benefit on the input side. To judge whether this is actually happening, do not watch the oil price; watch realised refining margins, which is the one line that matters in the Q3 reports landing from late next month. September is still up more than 9% overall, so this is a give-back, not a trend reversal.", "url": "https://tradingeconomics.com/commodity/brent-crude-oil", "stocks": [{"t": "MPC", "n": "大型煉油商，裂解價差擴張的主要受惠者"}, {"t": "PSX", "n": "煉油與中游並重，成本端受惠但中游量能是另一條線"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "銀行的兩面刃", "color": "#4EABA4", "zh": "金融股是本月最明顯的落後板塊之一，九月中的數據顯示金融服務板塊下跌約 1.25%，週二的銀行賣壓延續同一條線。癥結在於整個產業原本都是按「2026 會降息」在做資產負債表規劃，現在前提被推翻了。升息對銀行有利的部分是資產端收益率重定價；不利的部分是存款競爭加劇、存款成本追上來，以及持有到期債券部位的帳面壓力。社區銀行的整體淨利差目前約 3.81%，市場關心的是這個數字是靠資產端撐住，還是靠擴大資產負債表堆量。", "en": "Financials are one of the clearest laggards this month, with sector data through mid-September showing financial services down about 1.25%, and Tuesday's bank selling extended the same line. The crux is that the whole industry built its balance-sheet plans around rate cuts in 2026, and that premise has been overturned. A hike helps banks on the asset side as loan yields reprice; it hurts through fiercer deposit competition, rising deposit costs, and pressure on held-to-maturity securities books. The aggregate community-bank net interest margin currently sits near 3.81%, and what matters is whether that is being held by asset yields or by piling on balance-sheet volume.", "url": "https://mercercapital.com/insights/newsletters/bank-watch-newsletter/2026/june-2026-community-bank-earnings-what-s-supporting-the-improvement/", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，本月落後板塊的集中位置"}, {"t": "USB", "n": "大型區域銀行，存款成本與利差重定價的觀察樣本"}, {"t": "CFG", "n": "另一個區域銀行樣本，商用不動產曝險是共同風險項"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素年內 +20%", "color": "#5B8ED6", "zh": "羅素 2000 指數今年以來上漲約 20%，是 2003 年以來最好的一年，上半年更是 1991 年以來最強的上半年。這一段不是少數股票拉出來的：在創紀錄的那一天，指數內有超過六成的成分股收紅，市場參與度是三年來最高。週二在大型指數分歧的情況下，小型股仍然續強。但要注意，這個漲勢的原始敘事之一是「聯準會降息、小型股浮動利率債務壓力鬆綁」，而九月中的升息已經把這個前提整個翻掉，後面幾張卡會拆這件事。", "en": "The Russell 2000 is up about 20% year to date, its best showing since 2003, and its strongest first half since 1991. This has not been a narrow move: on the day of the record, more than 60% of index constituents closed higher, with participation at a three-year high. On Tuesday, with the large-cap indices going separate ways, small caps still advanced. Note, though, that one of the founding narratives for this rally was Fed easing relieving small caps' floating-rate debt burden - and the September hike has inverted that premise entirely, which the next cards take apart.", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，年內約 +20%、2003 年以來最佳"}, {"t": "IJR", "n": "標普600小型股 ETF，成分要求獲利的另一個小型股池子"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "晶片吃走漲幅", "color": "#5B8ED6", "zh": "小型股今年的漲幅高度集中在一個產業上：羅素 2000 表現最好的前 50 檔裡有 16 檔跟晶片有關，其中 Aehr Test Systems、Ichor Holdings、MaxLinear 三檔今年漲幅都超過 400%。這代表所謂「小型股行情」在相當程度上就是「AI 資本支出的第二層受益者行情」，跟利率關係沒有敘事上講得那麼大。判讀上的意義是：如果只是想買小型股的廣度，買指數等於同時買進一個高度集中的半導體曝險，要知道自己實際上押的是什麼。", "en": "This year's small-cap gains are heavily concentrated in one industry: 16 of the Russell 2000's 50 best performers are chip-related, and Aehr Test Systems, Ichor Holdings and MaxLinear have each rallied more than 400% in 2026. That means the so-called small-cap rally is to a large degree a second-layer AI capex rally, with far less to do with rates than the narrative suggests. The practical implication is that buying the index for breadth also buys a highly concentrated semiconductor exposure - it is worth knowing what you are actually betting on.", "url": "https://www.cnbc.com/2026/07/16/best-stock-market-trades-small-caps.html", "stocks": [{"t": "AEHR", "n": "晶圓級老化測試設備，今年漲幅逾 400%"}, {"t": "ICHR", "n": "半導體設備次系統代工，同列漲逾 400% 名單"}, {"t": "MXL", "n": "通訊晶片設計，同樣是今年漲逾 400% 的小型股"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "前提翻轉", "color": "#5B8ED6", "zh": "這張是判讀卡。小型股相對大型股最常被引用的結構差異，是它們的負債裡浮動利率占比高很多，大型股手上現金多、且多半在低利時期鎖了長天期固定利率債務。這個差異在降息週期是順風，在升息週期就是逆風，而聯準會已經在 9 月 16 日啟動升息。所以接下來三到六個月要盯的不是股價，是小型股整體的利息費用占營業利益的比重——這個數字如果開始上升，指數層面的漲勢和個別公司的現金流就會開始分家。", "en": "This is an interpretation card. The structural difference most often cited between small and large caps is that small caps carry a far higher share of floating-rate debt, while large caps hold more cash and mostly locked in long-dated fixed-rate debt during the low-rate era. That difference is a tailwind in an easing cycle and a headwind in a tightening one - and the Fed began hiking on September 16. So over the next three to six months the thing to watch is not price but interest expense as a share of operating income across the small-cap universe. If that ratio starts climbing, index-level gains and company-level cash flow will begin to diverge.", "url": "https://www.cnbc.com/2026/09/16/treasury-yield-bond-market-fed-decision.html", "stocks": [{"t": "IWO", "n": "羅素2000成長型 ETF，成分中未獲利公司比重較高、對利率最敏感"}, {"t": "IWN", "n": "羅素2000價值型 ETF，金融股權重高，是利差與信用成本的另一面"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "池子不一樣", "color": "#5B8ED6", "zh": "另一張判讀卡：談「小型股」時一定要先問是哪個池子。羅素 2000 是純按市值排序取第 1001 到 3000 名，不篩獲利，所以裡面長期有相當比重的虧損公司；標普 600 則要求連續幾季 GAAP 獲利為正才能納入。同一段行情，這兩個指數的漲幅組成會差很多——羅素的漲幅更容易來自高波動、無獲利的題材股，標普 600 的漲幅比較貼近基本面。看到「小型股大漲」的標題時，先確認講的是哪一個，再決定要不要跟。", "en": "A second interpretation card: whenever someone says small caps, ask which pool. The Russell 2000 is a pure market-cap slice - ranks 1,001 to 3,000 - with no profitability screen, so it persistently contains a meaningful share of loss-making companies. The S&P 600 requires several quarters of positive GAAP earnings for inclusion. Across the same stretch of market, the composition of the two indices' gains differs a lot: Russell gains skew toward high-volatility, unprofitable story stocks, while S&P 600 gains track fundamentals more closely. When you see a small-caps-surge headline, establish which one it means before deciding whether to follow.", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-outpacing-p-500-163007242.html", "stocks": [{"t": "IJR", "n": "標普600 ETF，成分需有連續 GAAP 獲利，是有獲利門檻的小型股池"}, {"t": "VIOO", "n": "另一檔追蹤標普600的 ETF，可用來對照費用率與流動性差異"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "小型建商", "color": "#5B8ED6", "zh": "KB Home 的財報給了一個檢查小型住宅建商的現成框架。大型建商還能靠規模與自有金融部門撐住毛利，小型建商在同樣的交屋量下滑與降價壓力下沒有這些緩衝。KB Home 這季交屋年減 19%、新接訂單年減 12%、全年毛利率指引下修到 16.0-16.2%，若把同樣的條件套在專攻東南部與德州的小型建商身上，壓力會更集中在土地庫存的持有成本與購屋補貼支出上。升息週期剛啟動，這條線值得單獨追蹤而不是併進大型建商看。", "en": "KB Home's report hands you a ready-made framework for checking smaller homebuilders. Large builders can lean on scale and captive mortgage arms to defend margin; smaller ones face the same falling deliveries and discounting without those buffers. KB Home posted deliveries down 19%, net orders down 12%, and cut full-year gross margin guidance to 16.0-16.2%. Apply those conditions to builders concentrated in the Southeast and Texas and the pressure lands harder on land-inventory carrying costs and buyer incentive spending. With a hiking cycle just beginning, this line deserves tracking separately rather than being folded into the large-cap builder story.", "url": "https://markets.financialcontent.com/stocks/article/stockstory-2026-9-22-kb-homes-nysekbh-q3-cy2026-earnings-results-revenue-in-line-with-expectations-but-full-year-sales-guidance-misses-expectations", "stocks": [{"t": "LGIH", "n": "入門價位建商，對購屋者利率敏感度最高的一類"}, {"t": "DFH", "n": "東南部與德州小型建商，土地輕資產模式的對照樣本"}, {"t": "CCS", "n": "另一檔小型建商，區域集中度高、緩衝更少"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "種子分拆倒數", "color": "#C9A227", "zh": "Vylor 是 Corteva 分拆出來的種子事業，獨立後將是純種子與性狀授權公司。它被忽視的原因很單純：目前還沒有獨立的交易歷史、沒有分析師覆蓋、也沒有任何指數成分資格。時間表已經定死——9 月 24 日為配發基準日，每持有一股 Corteva 配發一股 Vylor；9 月 25 日至 9 月 30 日在紐約證交所以 VYLR WI 進行 when-issued 交易；10 月 1 日起以 VYLR 正常交易。分拆股的典型現象是初期被動基金與指數型持有人被迫賣出，量價會失真。風險：這種賣壓可能持續數週，且正式文件揭露的負債分配還沒有完整的公開數字。這是研究線索，不是投資建議。", "en": "Vylor is the seed business Corteva is spinning off, and as a standalone it will be a pure seed and trait-licensing company. Why it is ignored is simple: no independent trading history, no analyst coverage, and no index membership yet. The timetable is now fixed - September 24 is the record date, with one Vylor share distributed per Corteva share; VYLR trades when-issued on the NYSE from September 25 through September 30; regular-way trading under VYLR begins October 1. The classic spinoff pattern is forced selling by index and passive holders in the early weeks, which distorts price and volume. Risk: that pressure can run for weeks, and the full debt allocation in the final filings is not yet publicly quantified. A research lead, not investment advice.", "url": "https://www.citybiz.co/article/902339/corteva-board-approves-vylor-spin-off-sets-october-1-distribution/", "status": "RADAR · 下一個驗證點 9/25 when-issued 開盤量價", "stocks": [{"t": "VYLR", "n": "本則主角，9/25 起 when-issued、10/1 正式交易"}, {"t": "CTVA", "n": "母公司，9/25-9/30 同時存在含權與除權兩個市場"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "許可證二元開關", "color": "#C9A227", "zh": "AXT 透過中國子公司通美生產磷化銦等化合物半導體基板，被忽視的原因是市值小、覆蓋少，而且整個論點卡在一個行政程序上。中國在 2025 年 2 月 4 日把磷化銦基板列入出口管制清單，通美的三個晶圓基板產品線出口都需要商務部許可。目前已取得輸往歐洲、日本、英國與加拿大的許可，但輸美許可公司自稱在「最終審查階段」、尚未核發，而且明說可能受美中地緣情勢影響。這是二元開關，沒有中間地帶。風險：公司在 2026 年已辦理增資（424B5），稀釋是實質存在的成本。這是研究線索，不是投資建議。", "en": "AXT makes indium phosphide and other compound semiconductor substrates through its Chinese subsidiary Tongmei. It is ignored because the market cap is small, coverage is thin, and the entire thesis hinges on one administrative process. China added InP substrates to its export control list on February 4, 2025, so all three of Tongmei's wafer substrate families need Ministry of Commerce permits to ship. Permits for Europe, Japan, the UK and Canada have been granted; the US permit is described by the company as in final review but not issued, and explicitly exposed to US-China tensions. This is a binary switch with no middle ground. Risk: the company raised equity in 2026 via a 424B5, and that dilution is a real cost. A research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001051627/000121390026046176/ea0287123-424b5_axtinc.htm", "status": "RADAR · 下一個驗證點 9/24 川習會會後聲明是否觸及出口管制", "stocks": [{"t": "AXTI", "n": "本則主角，輸美磷化銦許可仍在最終審查、未核發"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "加州社區銀行", "color": "#C9A227", "zh": "Bank of Marin 是加州北灣的社區銀行控股公司，新入池。被忽視的原因是市值小、幾乎沒有大型券商追蹤，而且過去兩年被不良放款清理拖垮了獲利基期。正在改變的是獲利與利差同步回升：第二季每股盈餘 0.58 美元、優於市場預期的 0.52，淨利年增近一倍到 920 萬美元；淨利差從第一季的 3.24% 擴張 14 個基點到 3.38%，公司給出全年淨利差落在 3% 中段的目標。董事 Nicolas Anderson 在 7 月 30 日以每股 28.88 美元加碼 175 股。風險：這筆內部人買進金額極小（約 5,054 美元），不構成群聚訊號；加州商用不動產曝險仍是主要風險。這是研究線索，不是投資建議。", "en": "Bank of Marin is a North Bay California community bank holding company, new to the pool. It is ignored because the market cap is small, large brokers barely cover it, and two years of problem-loan cleanup crushed the earnings base. What is changing is that earnings and margin are recovering together: Q2 EPS of $0.58 beat the $0.52 consensus, net income nearly doubled year over year to $9.2 million, and net interest margin expanded 14 basis points to 3.38% from 3.24% in Q1, with management guiding full-year NIM to the mid-3% range. Director Nicolas Anderson added 175 shares at $28.88 on July 30. Risk: that insider purchase is tiny - about $5,054 - and does not constitute a cluster signal, and California commercial real estate exposure remains the main risk. A research lead, not investment advice.", "url": "https://www.investing.com/news/company-news/bank-of-marin-q2-2026-slides-margin-expands-earnings-beat-93CH-4814774", "status": "RADAR · 下一個驗證點 10 月下旬 Q3 財報的淨利差與存款成本", "stocks": [{"t": "BMRC", "n": "本則主角，Q2 淨利差 3.38%、每股盈餘 0.58 超預期"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "13D 催策略檢討", "color": "#C9A227", "zh": "Equus Total Return 是紐約證交所掛牌的極小型封閉式投資公司，新入池。被忽視的原因是結構性的：這類資產管理型封閉式公司規模太小、幾乎沒有賣方覆蓋，而且市價長期低於資產淨值時，市場往往就不再追蹤它。正在改變的是治理端出現壓力——持股約 5.61% 的股東遞交 Schedule 13D，要求董事會立即問責並進行策略檢討。這類 13D 的價值在於它把「折價可能永遠存在」變成「有人正在逼出時間表」。風險很實在：13D 不保證任何結果，小型封閉式公司的流動性極差，折價也可能在整個過程中完全不收斂。這是研究線索，不是投資建議。", "en": "Equus Total Return is a very small NYSE-listed closed-end investment company, new to the pool. The neglect is structural: vehicles this small get almost no sell-side coverage, and once the market price sits persistently below net asset value, the market tends to stop following them altogether. What is changing is governance pressure - a holder of roughly 5.61% filed a Schedule 13D calling for immediate board accountability and a strategic review. The value of such a filing is that it converts a discount that might persist forever into one with someone forcing a timetable. The risks are concrete: a 13D guarantees no outcome, liquidity in small closed-end vehicles is poor, and the discount may never close. A research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0000878932/000109991026000220/ex99-1.htm", "status": "RADAR · 下一個驗證點 董事會是否正式回應或聘任財務顧問", "stocks": [{"t": "EQS", "n": "本則主角，5.61% 股東遞 13D 要求董事會問責與策略檢討"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "論點降級", "color": "#C9A227", "zh": "Aehr Test Systems 做晶圓級與封裝級老化測試設備，是晶片出貨前的良率關卡，8 月 13 日入池時的論點是雙重忽視。這張是誠實的論點降級：它今年漲幅超過 400%，已經是羅素 2000 表現最好的 50 檔之一，媒體聲量與賣方關注都跟著上來——「被忽視」這個入池前提現在已經不成立，它變成擁擠交易。沒變的是設備週期本身的問題：老化測試的訂單高度集中在少數幾家碳化矽與 AI 加速器客戶，單一客戶延單就能讓一季的數字失真。風險是估值已經把多年的成長先付掉了。這是研究線索，不是投資建議。", "en": "Aehr Test Systems makes wafer-level and package-level burn-in test equipment, the yield gate before chips ship, and the thesis when it entered the pool on August 13 was double neglect. This card is an honest downgrade: the stock is up more than 400% this year, now sits among the Russell 2000's 50 best performers, and media attention and sell-side interest have followed. The neglect premise no longer holds - it is a crowded trade. What has not changed is the equipment-cycle problem itself: burn-in orders are concentrated in a handful of silicon carbide and AI accelerator customers, and a single customer push-out can distort a quarter. The risk is that the valuation has already paid forward years of growth. A research lead, not investment advice.", "url": "https://www.cnbc.com/2026/07/16/best-stock-market-trades-small-caps.html", "status": "RADAR · 論點降級為擁擠交易，下一個驗證點為單一客戶集中度揭露", "stocks": [{"t": "AEHR", "n": "本則主角，今年漲逾 400%、入池時的被忽視前提已不成立"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "裂解價差在動", "color": "#C9A227", "zh": "Par Pacific 在夏威夷與太平洋西北地區經營煉油與零售通路，池內名單。被忽視的原因是地理位置太偏——夏威夷市場沒有同業可比，分析師很難建模，覆蓋自然就少。正在改變的是成本端：布蘭特本週跌逾 4%、跌破 100 美元，西德州收 94.59 美元，對純煉油商來說這是原料成本下降而成品價格還沒同步反映的窗口。但這個窗口能不能變成獲利，不看油價，要看實現煉油利潤率這一行實際印出什麼數字。風險：夏威夷與太平洋西北兩個區段可能一好一壞，合併數字會蓋掉真相。這是研究線索，不是投資建議。", "en": "Par Pacific runs refining and retail distribution in Hawaii and the Pacific Northwest, and is already in the pool. The neglect is geographic - the Hawaii market has no comparable peer set, which makes it hard for analysts to model and keeps coverage thin. What is changing is the input side: Brent fell more than 4% on the week and broke below $100, with WTI settling at $94.59, opening a window in which feedstock costs drop before product prices follow. Whether that window becomes profit is not visible in the oil price; it shows up in the realised refining margin line. Risk: the Hawaii and Pacific Northwest segments can move in opposite directions, and the consolidated number will hide it. A research lead, not investment advice.", "url": "https://www.cnbc.com/2026/09/22/oil-iran-us-bessent-un-crude.html", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報的實現煉油利潤率分項", "stocks": [{"t": "PARR", "n": "本則主角，夏威夷與太平洋西北純煉油商，成本端受惠於油價回落"}]},
    {"id": "insider_0", "channel": "內部人動向", "tag": "執行長砸三千萬", "color": "#6DB56D", "zh": "東南亞叫車與外送平台 Grab 的執行長陳炳耀（Anthony Tan）在 9 月 21 日申報買進 1,035 萬股 A 類普通股，加權平均價 2.8866 美元、成交價區間 2.83 到 2.91，總金額約 2,990 萬美元。時間點值得注意：公司上週才宣布以 14.9 億美元現金收購 Atome Financial 六成股權，把消費金融業務往東南亞擴張。這是典型的「重大資本配置決定之後、由做決定的人自己出錢背書」的結構。判讀提醒：執行長買進是公開市場交易、不是配股，這一點比金額本身更重要。", "en": "Anthony Tan, chief executive of Southeast Asian ride-hailing and delivery platform Grab, disclosed on September 21 the purchase of 10.35 million Class A ordinary shares at a weighted average price of $2.8866, in a range of $2.83 to $2.91, for roughly $29.9 million. The timing is notable: the company had announced only a week earlier a $1.49 billion cash deal for a controlling 60% stake in Atome Financial, expanding consumer lending across the region. This is the classic structure of a major capital allocation decision followed by the person who made it putting his own money behind it. Reading note: this was an open-market purchase, not a grant, and that distinction matters more than the dollar figure.", "url": "https://www.quiverquant.com/news/Grab+CEO+Anthony+Tan+Buys+Nearly+%2430+Million+of+GRAB+Stock", "stocks": [{"t": "GRAB", "n": "本則主角，執行長 9/21 申報買進約 2,990 萬美元"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "銀行群聚最多", "color": "#6DB56D", "zh": "把 Form 4 的資料攤開看，截至 9 月 20 日為止的三十天內，有 63 家美國上市公司出現「內部人群聚買進」，其中 21 家是三位以上的不同內部人分別買進。最集中的產業是銀行，共有 9 個群聚。這個分布本身就是訊息：內部人最密集下注的地方，正好是市場最不想碰的板塊。群聚之所以比單一買進強，是因為不同職位看到的東西不一樣——財務長看數字、事業部主管看營運、董事看策略討論，三種視角同時得到相同結論，才算共識。", "en": "Laid out across Form 4 data, 63 US-listed companies had an active insider buying cluster in the thirty days to September 20, and 21 of those had three or more separate insiders buying. The most concentrated industry was banks, with 9 clusters. That distribution is itself the message: insiders are betting most densely in precisely the sector the market least wants to own. The reason a cluster outranks a single purchase is that different seats see different things - the CFO sees the numbers, division heads see operations, directors see the strategy debates - and consensus only exists when all three reach the same conclusion at once.", "url": "https://insiderclusters.com/", "stocks": [{"t": "XLF", "n": "金融類股 ETF，內部人群聚最密集的產業所在"}, {"t": "BMRC", "n": "社區銀行樣本，董事 7 月買進但金額極小、尚未形成群聚"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "金額才是強度", "color": "#6DB56D", "zh": "這張是判讀卡。「內部人買進」是個太粗的標籤，實際強度要看三個維度：金額相對於這個人既有持股與年薪的比例、買方的職位、以及是不是公開市場交易。把今天兩個例子並排就很清楚：Grab 執行長一筆 2,990 萬美元，對照某家社區銀行董事一筆約 5,054 美元——同樣叫「內部人買進」，訊號強度差了三個數量級。另一個常見誤判是把大股東買進當成經營層買進：QVC Group 近期出現在買進名單上，但買方是持股逾一成的 GoldenTree，那是資本結構判斷，不是對下一季營運的判斷。學術研究一致指出，內部人買進的訊號在覆蓋稀少的小公司最強。", "en": "This is an interpretation card. Insider buying is too coarse a label; actual signal strength turns on three dimensions - the size of the purchase relative to the buyer's existing holding and annual pay, the buyer's seat, and whether it was an open-market trade. Set today's two examples side by side and it is obvious: Grab's CEO spent $29.9 million, while a community bank director spent about $5,054. Both are filed as insider buying, and the signal differs by three orders of magnitude. Another common error is treating a large-holder purchase as a management purchase: QVC Group recently appeared on buy lists, but the buyer was GoldenTree, a holder of more than 10%, which is a capital-structure judgement, not a view on next quarter's operations. The academic work consistently finds the insider-buying signal is strongest in thinly covered small companies.", "url": "https://insideraction.io/learn/cluster-buying-guide", "stocks": [{"t": "GRAB", "n": "2,990 萬美元的執行長買進，訊號強度的上緣樣本"}, {"t": "QVCG", "n": "買方是持股逾一成的大股東而非經營層，屬資本結構判斷"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "電力加晶片", "color": "#B5654D", "zh": "從眾議院書記官的官方申報索引重算九十天名單，多數議員的申報是幾十筆分散的組合，看不出主題。少數例外之一是 Nancy Pelosi（加州第 11 選區）的最新申報：九十天內只有 6 筆、全部是買進、只涉及兩檔標的——Bloom Energy 與 Intel，申報金額區間從 375 萬到 1,350 萬美元，最近一次申報日為 8 月 21 日。這個部位結構背後的假設很單一：AI 資料中心的瓶頸會從晶片移到電力，而先進製程的產能會被推回美國本土。集中兩檔、全是買進，代表這是主題押注而不是資產配置調整。", "en": "Recomputing the ninety-day list from the House Clerk's official filing index, most members' disclosures are dozens of scattered trades with no discernible theme. One of the few exceptions is the latest filing from Nancy Pelosi (CA-11): just 6 transactions over ninety days, all purchases, across only two names - Bloom Energy and Intel - with a disclosed value range of $3.75 million to $13.5 million and a most recent filing date of August 21. The assumption behind that position structure is singular: that the bottleneck for AI data centres shifts from chips to electricity, and that advanced-node capacity gets pushed back onshore. Two names, all buys, marks this as a thematic bet rather than an allocation adjustment.", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035143.pdf", "stocks": [{"t": "BE", "n": "燃料電池發電，對應資料中心電力瓶頸這一側的假設"}, {"t": "INTC", "n": "美國本土先進製程產能，對應晶片在地化那一側的假設"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "四十五天", "color": "#B5654D", "zh": "這張是固定的判讀卡。STOCK Act 只要求議員在交易後四十五天內申報，所以你今天讀到的 8 月 21 日申報，實際成交日可能更早。這代表跟單者買到的永遠是別人四十五天前的價位，中間如果有一段行情，跟單的人就是在幫先進場的人抬轎。第二層問題是金額只有寬區間、沒有數字——「375 萬到 1,350 萬」這種區間跨度近四倍，你根本算不出部位權重。第三，多數申報是配偶或信託帳戶執行的，下單決策未必來自議員本人。這個頻道的定位是「有人用真錢投票給某個主題」，不是買賣訊號。", "en": "This is the standing interpretation card. The STOCK Act only requires members to file within forty-five days of a trade, so a filing dated August 21 that you read today may reflect an execution well before that. Anyone following along is always buying at a price someone else saw forty-five days ago, and if the stock has moved in between, the follower is carrying the earlier buyer. The second problem is that amounts come only as wide ranges, never as numbers - a band like $3.75 million to $13.5 million spans nearly four times, so position weight cannot be computed. Third, most filings are executed in spouse or trust accounts, so the order decision may not be the member's at all. This channel exists to show that someone voted real money on a theme, not to generate trade signals.", "url": "https://capitolmarkets.org/research/congress-stock-trading", "stocks": [{"t": "NANC", "n": "追蹤民主黨議員申報的 ETF，本身就承擔 45 天延遲"}, {"t": "GOP", "n": "追蹤共和黨議員申報的 ETF，同樣的延遲結構"}]},
    {"id": "week_0", "channel": "本週事件", "tag": "沒有硬數據", "color": "#C97DD4", "zh": "接下來的交易日沒有消費者物價指數、也沒有個人消費支出物價指數，本週唯一能校正預期的硬數據偏少，取而代之的是聯準會官員不下十場的公開露面，以及週五的密西根大學消費者信心終值。真正有定價能力的是 9 月 24 日的川習會——關稅豁免到 11 月 10 日到期，市場想知道的是續約與否。在沒有硬數據的一週裡，殖利率與美元的方向通常由官員語氣決定，而不是由基本面決定，這種行情的特徵是快速反覆、方向不易延續。", "en": "The remaining sessions carry neither CPI nor PCE, leaving little hard data to recalibrate expectations against. In their place are no fewer than ten public appearances by Fed officials and Friday's final University of Michigan consumer sentiment reading. The genuinely price-setting event is the September 24 Trump-Xi meeting, with the tariff exclusions expiring November 10 and the market wanting to know whether they get renewed. In a week without hard data, yields and the dollar tend to take direction from official tone rather than fundamentals, and the signature of that regime is fast reversals and directionless follow-through.", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，發言週裡對官員語氣最敏感的資產"}, {"t": "UUP", "n": "美元指數 ETF，同樣由語氣而非數據推動的一週"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "達美樂與美光", "color": "#C97DD4", "zh": "財報端本週只有零星幾家，重點是週四開盤前的 Darden Restaurants（Olive Garden 母公司）2027 會計年度第一季，市場預估每股盈餘 2.05 美元、年增 4.1%，營收 32 億美元、年增 6.7%——這是檢查美國中價位外食需求還撐不撐得住的直接樣本。真正的大場子在下週三 9 月 30 日盤後：美光公布會計年度第四季，六月給的指引是營收 500 億美元上下 10 億、非一般公認會計原則每股盈餘 31.00 上下 1.00，9 月 21 日的市場共識約 506 億與 31.27，選擇權市場定價的單日波動約一成。", "en": "Only a scattering of companies report this week. The one that matters is Darden Restaurants, the Olive Garden parent, before Thursday's open with fiscal 2027 first-quarter results: consensus is $2.05 a share, up 4.1% year over year, on revenue of $3.2 billion, up 6.7% - a direct read on whether mid-priced US dining demand is holding. The main event is next Wednesday, September 30, after the close: Micron reports fiscal Q4 against June guidance of $50.0 billion in revenue plus or minus $1.0 billion and non-GAAP EPS of $31.00 plus or minus $1.00, with consensus as of September 21 near $50.6 billion and $31.27, and options pricing roughly a 10% single-day move.", "url": "https://traderc.com/mu-q4-fy2026-earnings-options/", "stocks": [{"t": "DRI", "n": "週四開盤前公布 FY27 Q1，預估 EPS 2.05、營收 32 億"}, {"t": "MU", "n": "9/30 盤後公布 FY26 Q4，選擇權定價單日約 10% 波動"}]},
    {"id": "eval_0", "channel": "今日評估", "tag": "零和還是增量", "color": "#E8A838", "zh": "週二最值得注意的一件事，不是那斯達克又創高，而是市場對一則明確的好消息做出的分類選擇。Viking 的維持期數據在臨床上是新資訊——它證明減重後可以靠更低頻率的給藥守住成果，這理論上會擴大整個減重藥物的可治療人口與長期用藥意願。但市場只讓 Viking 漲、讓禮來不動、讓諾和諾德繼續跌，等於把它讀成「搶既有的餅」而不是「把餅做大」。同一天，指數層面也在做類似的事：那斯達克創高、道瓊下跌，錢在移動而不是在增加。今天的開放式問題是：當市場一再把好消息定價成零和，這反映的是對總需求的悲觀，還是對既有龍頭護城河的懷疑？", "en": "The thing worth noticing about Tuesday is not another Nasdaq record but the classification the market chose for a clearly good piece of news. Viking's maintenance data is genuinely new clinical information - it shows weight loss can be held with less frequent dosing, which in theory widens the treatable population and long-run willingness to stay on therapy. Yet the market let Viking run, left Eli Lilly flat and let Novo Nordisk fall further, reading it as taking share rather than growing the pie. On the same day the indices did something similar: Nasdaq at a record, Dow down, money moving rather than arriving. Today's open question: when the market repeatedly prices good news as zero-sum, is that pessimism about aggregate demand, or doubt about the incumbents' moats?", "url": "https://247wallst.com/investing/2026/09/22/viking-soars-alone-as-obesity-complex-shrugs-at-strong-glp-1-results/", "status": "今日評估 · 點下方按鈕把這個問題帶去討論", "stocks": [{"t": "LLY", "n": "對手的好數據公布當日股價不動，市場沒有重評價整個板塊"}, {"t": "NVO", "n": "同日再跌 0.7%，一年跌 32.5%，承受的是零和解讀那一側"}]},

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>

      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>

  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/23/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v12.0</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
