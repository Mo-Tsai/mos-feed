/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;
    --text-tertiary: #6b6863; --divider: #ddd9d1;
    --noise-opacity: 0.035;

  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;

  body::before {

    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }

  ::-webkit-scrollbar { width: 2px; }

  /* 鍵盤焦點:看得到目前在哪一顆 */
  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }

  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }
  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }
  .source-link { position: relative; display: inline-block; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }

  {"id": "earn_1", "channel": "財報速報", "tag": "Meta 募資 950 億", "color": "#E8786A", "zh": "Meta 宣布計畫為 AI 基礎設施募集最高 950 億美元，第一筆先發行 350 億美元的股票。上週 Meta 剛把 2026 年資本支出上調到 1,350 億至 1,450 億美元，股價單日重挫約 7%，這次的重點變成「錢從哪裡來」。如果大型科技公司開始用發股與舉債來付 AI 帳單，就要同時檢視稀釋與利息成本，而十年期殖利率正貼近 5%。", "en": "Meta said it plans to raise up to $95 billion for AI infrastructure, starting with $35 billion of stock. Last week it lifted 2026 capital spending to $135 billion to $145 billion and the shares fell about 7% in a day, so the question is now where the money comes from. If big tech starts paying its AI bills with equity and debt, both dilution and interest cost matter, with the 10-year yield close to 5%.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-october-26-dow-sp-500-nasdaq-101153035.html", "stocks": [{"t": "META", "n": "Meta，募資最高 950 億美元、首批 350 億美元股票"}, {"t": "MSFT", "n": "微軟，週三財報，看資本支出與資金安排"}, {"t": "AMZN", "n": "亞馬遜，週四財報，同樣要交代資本支出"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "聯準會會議開始", "color": "#7C6AF7", "zh": "聯準會的兩天會議今天開始，週三下午 2 點公布利率決策，目標區間維持在 3.75% 至 4.00% 的機率約 90%。Yahoo 財經引述分析師說法，預期這會是一次「鷹派暫停」，主席是華許（Kevin Warsh），背景是通膨高於預期。先前 FinanceFeeds 的經濟學家調查顯示 100 位全部預期 12 月升息，所以重點在聲明與記者會有沒有為 12 月鋪路。", "en": "The Fed's two-day meeting begins today, with the decision due Wednesday at 2 p.m. and about a 90% chance of a hold at the 3.75% to 4.00% target range. Yahoo Finance cites analysts expecting a hawkish pause under Chairman Kevin Warsh after hotter-than-expected inflation. An earlier FinanceFeeds survey had all 100 economists expecting a December hike, so the focus is whether the statement and press conference pave the way.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-october-26-dow-sp-500-nasdaq-101153035.html", "stocks": [{"t": "TLT", "n": "長天期美債 ETF，對利率路徑最敏感"}, {"t": "SHY", "n": "短天期美債 ETF，反映政策利率預期"}, {"t": "UUP", "n": "美元指數 ETF，鷹派訊號通常偏多美元"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "三家央行同週", "color": "#7C6AF7", "zh": "除了聯準會，歐洲央行、加拿大央行與日本央行本週也都有利率會議。主要央行同一週出手，意味著本週的匯率與殖利率反應不只來自華盛頓：任何一家的措辭偏鷹或偏鴿，都會經由匯市傳到美債。操作面要留意的是，同時有多個催化事件時，市場的單日波動往往比單一事件大。", "en": "Beyond the Fed, the European Central Bank, Bank of Canada and Bank of Japan all hold rate meetings this week. With several major central banks acting in the same week, currency and yield reactions will not come only from Washington, since a hawkish or dovish tone at any of them travels through FX to Treasuries. Single-day swings are often larger when several catalysts stack up.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-october-26-dow-sp-500-nasdaq-101153035.html", "stocks": [{"t": "FXE", "n": "歐元 ETF，歐洲央行決策的直接對照"}, {"t": "FXY", "n": "日圓 ETF，日本央行決策的直接對照"}, {"t": "FXC", "n": "加幣 ETF，加拿大央行決策的直接對照"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "光通訊與晶片", "color": "#4EABA4", "zh": "週一科技類股領漲，Lumentum（LITE）大漲約 10%，起因是 StoneX 以買進評等與 1,200 美元目標價開始涵蓋，Coherent 與 Applied Optoelectronics 跟著上漲。光通訊零組件是 AI 資料中心互連的受惠者，所以同一類股同步漲，比單一股票的消息更有訊號意義。不過目標價大幅高於現價時，通常也反映這類股的波動很大，追價前要看清楚。", "en": "Tech led on Monday, with Lumentum (LITE) up about 10% after StoneX initiated coverage with a Buy rating and a $1,200 price target, and Coherent and Applied Optoelectronics rose with it. Optical components benefit from AI data-center interconnect, so the group rising together carries more signal than a single-stock headline. A target far above the price also reflects how volatile this group is.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-october-26-dow-sp-500-nasdaq-101153035.html", "stocks": [{"t": "LITE", "n": "Lumentum，StoneX 買進評等、目標價 1,200 美元，約 +10%"}, {"t": "COHR", "n": "Coherent，同類光通訊股同步上漲"}, {"t": "AAOI", "n": "Applied Optoelectronics，同類小型光通訊股同步上漲"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "新雲端廠商", "color": "#4EABA4", "zh": "CoreWeave 在 AI 融資疑慮拖累數週之後週一轉為上漲。Yahoo 財經指出，八檔「新雲端」（neocloud）算力供應商組成的籃子，自 7 月下旬以來仍下跌超過 40%。這類公司的商業模式是用融資買晶片再出租算力，所以股價對資金成本與融資管道特別敏感；Meta 募資 950 億與 Anthropic 遞件，剛好是資金環境的兩個新資料點。", "en": "CoreWeave turned positive on Monday after weeks of AI-financing worries. Yahoo Finance noted a basket of eight neocloud compute providers is still down more than 40% since late July. These companies finance chips and rent out compute, so their shares are especially sensitive to funding costs and access, and Meta's $95 billion raise and Anthropic's filing are two new data points on that environment.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-october-26-dow-sp-500-nasdaq-101153035.html", "stocks": [{"t": "CRWV", "n": "CoreWeave，新雲端代表，週一轉為上漲"}, {"t": "NBIS", "n": "Nebius，同屬新雲端算力供應商"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "巴西大選衝擊", "color": "#4EABA4", "zh": "巴西總統盧拉（Lula）出人意料地連任，擊敗弗拉維奧・波索納羅（Flávio Bolsonaro），先前的上漲預期反轉。Yahoo 財經的熱門榜顯示：XP 下跌約 48%、Banco Bradesco 約 -28%、Itaú 約 -20%、Nu Holdings 約 -17%、巴西國家石油（Petrobras）約 -14%；盤前 EWZ 曾跌約 26%。這些是盤中截圖數字，收盤可能不同，但訊號清楚：巴西金融與國營能源股被重新定價。", "en": "Brazilian President Lula won a surprise reelection over Flávio Bolsonaro, reversing an earlier rally. Yahoo Finance's most-active list showed XP down about 48%, Banco Bradesco about 28%, Itaú about 20%, Nu Holdings about 17% and Petrobras about 14%, and EWZ was down about 26% premarket. These are intraday snapshots and closes may differ, but the signal is clear: Brazilian financials and state-run energy are being repriced.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-october-26-dow-sp-500-nasdaq-101153035.html", "stocks": [{"t": "EWZ", "n": "iShares 巴西 ETF，盤前曾跌約 26%"}, {"t": "NU", "n": "Nu Holdings，巴西數位銀行，約 -17%"}, {"t": "ITUB", "n": "Itaú Unibanco，巴西最大私人銀行，約 -20%"}, {"t": "PBR", "n": "巴西國家石油，約 -14%"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000 創區間高", "color": "#5B8ED6", "zh": "羅素 2000 週一收 2,786.42，上漲 0.38%，高於上週四的區間高點 2,784.03，終於結束連日窄幅整理。小型股沒有直接暴露在 AI 資本支出的疑慮裡，但同樣怕十年期殖利率貼近 5%，所以真正的突破要看週三聯準會之後能否站穩。短期只是跳出區間，還不能說趨勢改變。", "en": "The Russell 2000 closed Monday at 2,786.42, up 0.38%, above last Thursday's range high of 2,784.03 and ending several sessions of narrow consolidation. Small caps are not directly exposed to AI-capex worries but are just as sensitive to a 10-year yield near 5%, so a real breakout depends on holding after Wednesday's Fed. For now it is only a move out of a range, not a trend change.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-october-26-dow-sp-500-nasdaq-101153035.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週一 +0.38%"}, {"t": "IJR", "n": "標普小型 600 ETF，品質較高的小型股對照"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "SGRY 收購案", "color": "#5B8ED6", "zh": "Surgery Partners（SGRY）週一暴漲 47.62% 收 23.25 美元，起因是 Bon Secours 的關係企業 HealthSpan Partners 同意以每股 23.50 美元現金收購，相當於前一日收盤 15.75 美元的 49% 溢價，含負債交易價值約 57 億美元；持股約 39% 的 Bain Capital 仍會留任夥伴，預計 2027 年第一季完成。股價只低於收購價不到 1%，代表市場認為交易成功機率很高，後續上漲空間已很有限。", "en": "Surgery Partners (SGRY) jumped 47.62% to $23.25 on Monday after HealthSpan Partners, an affiliate of Bon Secours, agreed to buy it for $23.50 per share in cash, a 49% premium to the prior close of $15.75 and about $5.7 billion including debt. Bain Capital, which owns about 39%, stays on as a partner, and closing is expected in the first quarter of 2027. The shares trade less than 1% below the offer, so the market sees a high chance of completion and little upside left.", "url": "https://www.fool.com/coverage/stock-market-today/2026/10/26/stock-market-today-oct-26-surgery-partners-skyrockets-48-on-usd5-7-billion-healthspan-acquisition/", "stocks": [{"t": "SGRY", "n": "Surgery Partners，現金收購價 23.50 美元，收 23.25 美元"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "區域銀行低估名單", "color": "#5B8ED6", "zh": "Simply Wall St 10 月 13 日整理的「內部人買進的低估小型股」名單中，十家公司大半是區域銀行：Regional Management 本益比 6.6 倍、Financial Institutions 9.4 倍、Five Star Bancorp 14.6 倍、Shore Bancshares 11.3 倍。名單的「相對公允價值折價」是模型推算，不是分析師目標價。判讀小型銀行時，淨息差走勢與不良貸款比率比本益比更能說明趨勢，這也是本站雷達池常追的兩個數字。", "en": "A Simply Wall St list from October 13 of undervalued small caps with insider buying is mostly regional banks: Regional Management at 6.6 times earnings, Financial Institutions at 9.4, Five Star Bancorp at 14.6 and Shore Bancshares at 11.3. The discount to fair value is a model estimate, not an analyst target. For small banks, the net interest margin trend and non-performing loan ratio say more than the P/E, and those are the two numbers this feed's radar tracks most.", "url": "https://www.webull.com/news/15740612236354560", "stocks": [{"t": "RM", "n": "Regional Management，本益比 6.6 倍、折價約 30%（模型推算）"}, {"t": "FISI", "n": "Financial Institutions，本益比 9.4 倍"}, {"t": "SHBI", "n": "Shore Bancshares，本益比 11.3 倍"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "Bank of Marin Q3", "color": "#C9A227", "zh": "Bank of Marin（BMRC）第三季淨息差從上一季的 3.38% 升到 3.48%（+10 個基點），淨利息收入 3,140 萬美元，比上一季增加約 62 萬，原因是新放款的收益率較高、存款利息支出下降。這家加州北灣的社區銀行是雷達池裡「淨息差能否回升」的驗證案例，這次財報算是通過第一個驗證點。風險：一季的回升還不是趨勢，信用成本與商用不動產曝險仍要追蹤。這是研究線索，不是投資建議。", "en": "Bank of Marin Bancorp (BMRC) reported a third-quarter net interest margin of 3.48%, up 10 basis points from 3.38% the prior quarter, with net interest income of $31.4 million, about $619,000 higher, on higher yields on new loans and lower deposit costs. The North Bay community bank is the radar's test case for whether margins can recover, and this report passes the first checkpoint. Risk: one quarter is not a trend, and credit costs and commercial real estate exposure still need tracking. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001403475/000140347526000043/earningsrelease-ex991q32026.htm", "stocks": [{"t": "BMRC", "n": "Bank of Marin，淨息差 3.38% → 3.48%"}, {"t": "KRE", "n": "區域銀行 ETF，產業對照"}], "status": "RADAR · 驗證點通過：淨息差回升 10 bp，下一步看信用成本"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "MSG Rangers 首日", "color": "#C9A227", "zh": "MSG Sports 分拆案今天進入正式交易：MSG Rangers（MSGR）獨立掛牌，持有紐約遊騎兵（Rangers）、Hartford Wolf Pack 與 MSG 訓練中心；母公司改名 MSG Knickerbockers（代號 MSGK）。股東每持有兩股 MSG Sports 可獲得一股 MSGR，目標是免稅分配。分拆後的小公司常因被動賣壓與缺乏覆蓋而被忽視，所以首日到前幾週的成交最值得看。風險：Form 10 揭露的債務與獨立運營成本。這是研究線索，不是投資建議。", "en": "The MSG Sports separation reaches regular-way trading today: MSG Rangers (MSGR) lists on its own, holding the New York Rangers, Hartford Wolf Pack and MSG Training Center, while the parent is renamed MSG Knickerbockers (MSGK). Shareholders receive one MSGR share for every two MSG Sports shares, intended as a tax-free distribution. Spin-offs are often neglected because of forced selling and thin coverage, so the first days of trading are worth watching. Risks: the debt and standalone costs disclosed in the Form 10. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001636519/000119312526409143/d126791dex991.htm", "stocks": [{"t": "MSGR", "n": "MSG Rangers，今天起正式交易"}, {"t": "MSGS", "n": "MSG Sports，母公司（分拆後改名 MSGK）"}], "status": "RADAR · 今天 10/27 正式交易，觀察首日成交與被動賣壓"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "SGRY 被收購", "color": "#C9A227", "zh": "雷達池內的 Surgery Partners（SGRY）剛走完「忽視」的最後一步：HealthSpan Partners 以每股 23.50 美元現金收購，週一股價漲 47.62%。回頭看，這支股票在雷達池的邏輯是「大股東 Bain 去年放棄收購後仍持股約 39%，且財報虧損收斂」，這次由新買家完成交易，價值被市場重估。後續只剩股東投票與監管核准，預計 2027 年第一季完成；上檔空間受收購價限制，風險主要是交易破局。這是研究線索，不是投資建議。", "en": "Surgery Partners (SGRY), already in the radar pool, has reached the end of the neglect story: HealthSpan Partners agreed to pay $23.50 per share in cash and the stock rose 47.62% Monday. The pool's thesis was Bain Capital still holding about 39% after abandoning its own buyout last year and losses narrowing, and a new buyer has now completed a deal. What remains is a shareholder vote and regulatory approval, expected in the first quarter of 2027; upside is capped by the offer price and the main risk is the deal failing. This is a research lead, not investment advice.", "url": "https://www.fool.com/coverage/stock-market-today/2026/10/26/stock-market-today-oct-26-surgery-partners-skyrockets-48-on-usd5-7-billion-healthspan-acquisition/", "stocks": [{"t": "SGRY", "n": "Surgery Partners，雷達池內，現金收購價 23.50 美元"}], "status": "RADAR · 下一個驗證點 股東投票與監管核准（預計 2027 Q1）"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "Parke Bancorp", "color": "#C9A227", "zh": "Parke Bancorp（PKBK）是紐澤西的社區銀行，市值約 2 億美元，本益比約 8.3 倍。Simply Wall St 的資料顯示，第二季淨利息收入 2,301 萬美元，去年同期 1,787 萬美元，年增約 29%，近一季淨利率達 51.5%，同時過去一年有內部人買進。這是「低本益比＋營收回升＋內部人買進」三個訊號同時出現的小型銀行，但文章沒有提供買進金額與日期，需自行查 Form 4。風險：過去曾有獲利下滑，商用不動產集中度須另查。這是研究線索，不是投資建議。", "en": "Parke Bancorp (PKBK) is a New Jersey community bank with a market value of about $200 million and a P/E near 8.3. Simply Wall St data shows second-quarter net interest income of $23.01 million versus $17.87 million a year earlier, up about 29%, a net margin of 51.5% in the latest quarter and insider buying over the past year. Low P/E, rising income and insider buying line up, but the article gives no purchase amounts or dates, so Form 4 filings need checking. Risks: past earnings declines, and commercial real estate concentration needs separate research. This is a research lead, not investment advice.", "url": "https://www.webull.com/news/15740612236354560", "stocks": [{"t": "PKBK", "n": "Parke Bancorp，本益比約 8.3 倍、淨利息收入年增約 29%"}], "status": "RADAR · 下一個驗證點 Q3 財報的淨息差與不良貸款，並查 Form 4 買進金額"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "Alphatec 董事買進", "color": "#6DB56D", "zh": "脊椎手術器材公司 Alphatec（ATEC）的 Keith Valentine 在 2026 年 1 月至 10 月間買進 13.5 萬股，約 99.6 萬美元。公司第二季淨損縮小到 2,578 萬美元（去年同期 4,114 萬美元），毛利率達 70.84%，市值約 12 億美元。內部人在虧損縮小的階段持續買進，比單筆買進更有參考價值，但本人持股比例與是否為公開市場買進，仍須看 Form 4 的交易代碼 P。", "en": "Keith Valentine bought 135,000 shares of spinal-surgery device maker Alphatec (ATEC), about $996,000, between January and October 2026. The company's second-quarter net loss narrowed to $25.78 million from $41.14 million a year earlier, gross margin reached 70.84% and market value is about $1.2 billion. Repeated insider buying while losses shrink is more informative than a single purchase, but the stake size and whether they were open-market buys (code P) should be confirmed on Form 4.", "url": "https://www.webull.com/news/15740612236354560", "stocks": [{"t": "ATEC", "n": "Alphatec，Valentine 買進 13.5 萬股約 99.6 萬美元，淨損縮小"}]},
  {"id": "insider_1", "channel": "內部人動向", "tag": "判讀：買進代碼", "color": "#6DB56D", "zh": "看 Form 4 時先認交易代碼：只有代碼 P（公開市場買進）才是用自己的錢投票，獎勵股、行使選擇權與稅款代扣都不算。其次要看是否為預先設定的交易計畫（10b5-1），那類交易不代表當下的信心。群聚買進（三位以上獨立董事在 30 天內買進）比單人買進訊號強，但公司在壞消息後安排小額同步買進也不是沒有，所以金額相對於個人資產的比例才是關鍵。", "en": "On Form 4, first check the transaction code: only code P (open-market purchase) means spending one's own money, while grants, option exercises and tax withholding do not count. Next, check whether it falls under a pre-arranged 10b5-1 plan, which says little about current conviction. Cluster buying, with three or more independent directors in 30 days, is a stronger signal than a lone purchase, though small coordinated buys after bad news do happen, so the size relative to personal wealth is the key.", "url": "https://www.webull.com/news/15740612236354560", "stocks": [{"t": "IJR", "n": "標普小型 600 ETF，小型股內部人訊號的基準"}]},
