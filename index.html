<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [

  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },

  { key: "本週事件", color: "#C97DD4" },

];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "sector_2", "channel": "產業風向", "tag": "兩股相反的力", "color": "#4EABA4", "zh": "公用事業是最近一個矛盾的板塊。截至 9 月 25 日那一週，它是標普 500 十一個類股裡第二強的；Utilities Select Sector SPDR 年初至今漲約 15%，僅次於科技類股的 21%。但它同時正面迎向殖利率 5.21% 的壓力——傳統上公用事業就是債券的替代品，無風險利率越高，這個替代價值就越薄。它今年能撐住，靠的不是防禦性，是 AI 資料中心帶來的實際用電需求。這兩股力量哪一邊先鬆手，決定這個板塊的第四季。", "en": "Utilities are the market's most contradictory sector right now. For the week ending September 25 they were the second-best of the S&P 500's eleven sectors, and the Utilities Select Sector SPDR is up about 15% year to date, trailing only technology's 21%. Yet they face a 5.21% 10-year yield head-on — utilities are traditionally a bond substitute, and the higher the risk-free rate, the thinner that substitution value. What has carried them this year is not defensiveness but real electricity demand from AI data centers. Which force gives way first decides the sector's fourth quarter.", "url": "https://www.schwab.com/learn/story/stock-sector-outlook", "stocks": [{"t": "XLU", "n": "公用事業 ETF，年初至今約 +15%，上週為第二強類股"}, {"t": "NEE", "n": "NextEra，再生能源與電網投資的權值代表"}, {"t": "SO", "n": "南方電力，資料中心負載成長最明確的服務區之一"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "三十三億出走", "color": "#5B8ED6", "zh": "iShares 羅素 2000 ETF 上週淨流出 33 億美元，是 2026 年第二大的單週失血。理由不複雜：殖利率飆到二十年新高，投資人先砍掉對借貸成本最敏感的那一塊。這個流出值得注意的地方不是金額，而是它跟指數跌幅不成比例——資金離場的速度比價格反映的還快，代表這不是價值判斷，是風險預算在收縮。", "en": "The iShares Russell 2000 ETF saw $3.3 billion of outflows last week, its second-largest weekly withdrawal of 2026. The reason is simple: with yields at two-decade highs, investors cut the segment most exposed to borrowing costs first. What matters is not the size but that it is out of proportion to the index's decline — money is leaving faster than price reflects, which points to shrinking risk budgets rather than a valuation call.", "url": "https://www.benzinga.com/etfs/sector-etfs/26/09/61982431/small-caps-crushed-iwm-sees-3-3b-outflow-treasury-yields-surge", "stocks": [{"t": "IWM", "n": "iShares 羅素 2000 ETF，上週淨流出 33 億美元"}, {"t": "IJR", "n": "標普 600 小型股 ETF，品質篩選較嚴的對照組"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "八年來最長", "color": "#5B8ED6", "zh": "標普 500 已經連續五週跑贏羅素 2000。如果這週再贏一次，就會是八年來大型股連續壓制小型股最長的一段。這種連續性比單週漲跌重要得多：五週以上的持續分歧通常不是輪動的雜訊，而是資金結構在換邊。要判斷它會不會延續，看的不是小型股本身的估值，是十年期殖利率什麼時候停下來。", "en": "The S&P 500 has now outperformed the Russell 2000 for five consecutive weeks. One more week would make it the longest stretch of large-cap dominance over small caps in eight years. That persistence matters far more than any single week's move: a divergence sustained beyond five weeks is usually not rotation noise but capital structurally changing sides. Whether it continues depends less on small-cap valuations than on when the 10-year yield stops rising.", "url": "https://www.benzinga.com/etfs/sector-etfs/26/09/61982431/small-caps-crushed-iwm-sees-3-3b-outflow-treasury-yields-surge", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，已連五週落後標普 500"}, {"t": "SPY", "n": "標普 500 ETF，連五週跑贏小型股"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "判讀：為什麼這麼痛", "color": "#5B8ED6", "zh": "小型股對長天期殖利率特別敏感，原因有三層，值得分清楚。第一層是折現：小型股的獲利更集中在未來，折現率上升對它的估值傷害大於現金流穩定的大型股。第二層是融資：中小企業主要靠銀行浮動利率貸款，而不是像大型股鎖定長期固定利率公司債，升息當季就進損益表。第三層是流動性：池子淺，同樣的贖回金額造成的價格衝擊大得多，這也是為什麼 33 億美元的流出能有這麼明顯的效果。這三層會同時作用，所以下跌往往比基本面該有的幅度更大。", "en": "Small caps are unusually sensitive to long-dated yields for three distinct reasons worth separating. First, discounting: their earnings sit further in the future, so a higher discount rate hurts their valuation more than a stable-cash-flow large cap. Second, financing: smaller firms borrow mainly through floating-rate bank loans rather than locking in long fixed-rate bonds, so a hike hits the income statement the same quarter. Third, liquidity: the pool is shallow, so the same redemption size moves prices far more — which is why $3.3 billion of outflows shows up so visibly. All three compound, so declines routinely overshoot what fundamentals alone justify.", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment", "stocks": [{"t": "IJR", "n": "標普 600 小型股 ETF，成分股有獲利門檻，可對照品質差異"}, {"t": "KRE", "n": "區域銀行 ETF，小型企業浮動利率貸款的主要提供者"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "年線還贏", "color": "#5B8ED6", "zh": "把時間拉長會看到一個相反的畫面：截至 9 月 21 日，羅素 2000 年初至今上漲 15.9%，還領先標普 500 的 13.4%。也就是說小型股今年大半時間是贏的，是最近五週才被反超。這個落差本身就是一個有用的資訊——它告訴你目前的弱勢是「事件驅動」（殖利率突然跳升）而不是「趨勢反轉」。判斷方法很直接：如果十年期殖利率在 5.2% 附近盤住，年線的領先幅度應該守得住；如果繼續往 5.5% 走，那今年的領先會被吃光。", "en": "Zoom out and the picture inverts: as of September 21 the Russell 2000 was up 15.9% year to date, still ahead of the S&P 500's 13.4%. Small caps led for most of the year and were only overtaken in the past five weeks. That gap is itself useful information — it says the current weakness is event-driven (a sudden yield spike) rather than a trend reversal. The test is straightforward: if the 10-year stalls near 5.2%, the year-to-date lead should hold; if it grinds toward 5.5%, this year's lead gets erased.", "url": "https://investorplace.com/hypergrowthinvesting/2026/09/the-small-cap-comeback-may-be-earlier-than-it-looks/", "stocks": [{"t": "VTWO", "n": "Vanguard 羅素 2000 ETF，費用率較低的同指數對照"}, {"t": "SPSM", "n": "SPDR 標普 600 小型股 ETF，年初至今表現可與羅素對照"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "誰借錢給他們", "color": "#5B8ED6", "zh": "要看小型股的融資壓力，與其看小型股指數，不如看區域銀行。美國中小企業的循環信用與設備貸款幾乎都來自區域銀行，而不是債券市場。升息循環重啟對這些銀行是兩面的：資產端收益率往上，但存款成本追得更快，同時商用不動產曝險的提存壓力在累積。如果區域銀行開始收緊放款標準，小型股受到的衝擊會比殖利率本身更實際、也更慢才顯現。", "en": "To gauge small-cap financing stress, watch regional banks rather than the small-cap index. Revolving credit and equipment loans for U.S. small and mid-sized firms come almost entirely from regional banks, not the bond market. A renewed hiking cycle cuts both ways for them: asset yields rise, but deposit costs rise faster, while commercial real estate provisioning pressure builds. If regionals start tightening lending standards, the hit to small caps will be more concrete than the yield move itself — and slower to show up.", "url": "https://www.benzinga.com/etfs/sector-etfs/26/09/61982431/small-caps-crushed-iwm-sees-3-3b-outflow-treasury-yields-surge", "stocks": [{"t": "ZION", "n": "Zions Bancorporation，西部中小企業放款佔比高"}, {"t": "RF", "n": "Regions Financial，東南部中小企業主要往來銀行"}, {"t": "PNFP", "n": "Pinnacle Financial，商業放款成長快、對信用循環敏感"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "zh": "Dynex Capital（DX）是一家專做 Agency 抵押證券的抵押型不動產信託，市值極小。它做什麼：用槓桿持有政府機構擔保的房貸證券，賺利差、配高息。為什麼被忽視：在十年期殖利率創二十年新高的時候，沒有人想碰抵押型 REIT，股價貼在 52 週低點 11.12 美元附近，本益比 4.8、股利率 16.89%。什麼正在變：投資長 Terrence Connelly Jr. 在 9 月 25 日以每股 11.18 美元自掏腰包買進 2,500 股，公司 9 月 22 日同時發行 480 萬股 9.375% 的 D 系列特別股、募資約 1.2 億美元去加碼 Agency 證券——管理層在低點同時用自己的錢與公司的錢加碼。風險與反方：三十年期 5.48% 直接侵蝕每股帳面價值，9.375% 的特別股成本很貴，而 16.89% 的股利率本身就是市場在說它會減配。這是研究線索，不是投資建議。", "en": "Dynex Capital (DX) is a very small mortgage REIT focused on Agency mortgage-backed securities. What it does: holds government-guaranteed mortgage paper with leverage, earning a spread and paying a high dividend. Why it is ignored: nobody wants a mortgage REIT with the 10-year at a two-decade high — the stock sits near its 52-week low of $11.12, on a 4.8 P/E with a 16.89% yield. What is changing: CIO Terrence Connelly Jr. bought 2,500 shares of his own money at $11.18 on September 25, and on September 22 the company priced 4.8 million shares of 9.375% Series D preferred for about $120 million to buy more Agency paper — management adding with both its own money and the company's. Risks and the other side: a 5.48% 30-year yield erodes book value directly, 9.375% preferred is expensive capital, and a 16.89% yield is the market saying the dividend gets cut. A research lead, not investment advice.", "url": "https://www.gurufocus.com/news/9099951/dynex-capital-dx-insider-buying-cio-connelly-terrence-john-jr-purchases-2500-shares", "stocks": [{"t": "DX", "n": "Dynex Capital，投資長 9/25 以 11.18 美元買進 2,500 股"}], "status": "RADAR · 下一個驗證點 10/下旬 Q3 財報每股帳面價值"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "zh": "Titan Machinery（TITN）是北美與東歐的農業與工程機械經銷商，賣 Case IH 等品牌的設備並提供維修與零件。為什麼被忽視：農機是這一輪最冷的循環之一，穀物價格低迷讓農民延後換機，公司近年營收下修、獲利受壓，覆蓋的分析師寥寥可數。什麼正在變：董事長 David Meyer 買進 55,000 股、金額約 99.6 萬美元——這不是象徵性的董事買股，是七位數的自有資金加碼，而且發生在循環谷底。風險與反方論點很清楚：這家公司高度依賴外部借款營運，升息環境下利息覆蓋率是真正的壓力點；如果農業景氣再延一年，庫存與應收會先出問題。這是研究線索，不是投資建議。", "en": "Titan Machinery (TITN) is an agricultural and construction equipment dealer across North America and Eastern Europe, selling Case IH and other brands with service and parts attached. Why it is ignored: farm equipment is one of this cycle's coldest corners — weak grain prices have farmers deferring replacement, revenue has been revised down and margins squeezed, with almost no analyst coverage. What is changing: chairman David Meyer bought 55,000 shares for roughly $996,600 — not a token director purchase but a seven-figure commitment of personal money at what looks like a cycle trough. The counter-case is clear: the company leans heavily on external borrowing, so interest coverage is the real pressure point in a hiking cycle, and another weak farm year would hit inventory and receivables first. A research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/capital-goods/nasdaq-titn/titan-machinery", "stocks": [{"t": "TITN", "n": "Titan Machinery，董事長買進 55,000 股約 99.6 萬美元"}, {"t": "DE", "n": "Deere，農機循環的大型對照組，判斷景氣位置用"}], "status": "RADAR · 下一個驗證點 下一份季報的存貨週轉與利息覆蓋率"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "zh": "First Financial Bankshares（FFIN）是德州的銀行控股公司，分行網絡集中在德州中西部。為什麼被忽視：這是典型的市場面忽視——只有三家分析師追蹤，而且共識評等還停在「持有」，在一個有數千檔標的的市場裡，三家覆蓋等於沒有人在講它的故事。什麼正在變：內部人已經連續五個季度買進、期間完全沒有賣出，而且在 2026 年初買進金額創下歷史高點，主力是董事與財務長。連續五季零賣出的型態，比單次大額買進更難用「分散配置」解釋。風險與反方：升息會把存款成本推上去，德州的商用不動產曝險與提存趨勢是這類區域銀行的共同弱點，而共識評等停在持有，也可能只是這家銀行本來就沒什麼成長性。這是研究線索，不是投資建議。", "en": "First Financial Bankshares (FFIN) is a Texas bank holding company with a branch network concentrated in central and west Texas. Why it is ignored: this is classic market-side neglect — only three analysts track it and the consensus rating is still Hold; in a market of thousands of names, three covering analysts means nobody is telling its story. What is changing: insiders have bought for five consecutive quarters with no selling at all, and purchase volume hit an all-time high in early 2026, led by directors and the CFO. Five straight quarters with zero sales is harder to explain away as portfolio diversification than any single large buy. Risks and the other side: hikes push deposit costs up, Texas commercial real estate exposure and provisioning are the shared weak point for banks like this, and a Hold consensus may simply reflect a bank with little growth. A research lead, not investment advice.", "url": "https://www.barchart.com/story/news/844666/3-stocks-where-insiders-are-putting-their-own-money-to-work", "stocks": [{"t": "FFIN", "n": "First Financial Bankshares，連五季內部人買進、零賣出"}], "status": "RADAR · 下一個驗證點 10/下旬 Q3 財報淨息差與存款成本"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "zh": "Redwood Trust（RWT）9 月 16 日入池，池內記錄的核心證據是執行長暨董事 Christopher Abate 在 9 月 15 日以每股 3.839 美元買進 100,000 股、金額 383,900 美元，當時股價貼近 52 週低點 3.22 美元、過去六個月跌 28%，是近期第三位以上的內部人買進。9 月 28 日的內部人訊號彙整把它與 Dynex Capital 一起列為群聚買進的代表，等於這筆買進在市場端被重新看見。但同一天的背景要一起看：三十年期殖利率來到 5.48%，已經高過池內驗證點當時引用的 5.43%，對持有住宅抵押資產的公司來說這是每股帳面價值的直接侵蝕。所以問題很乾淨——執行長用 38 萬美元在賭帳面價值守得住 6.90 美元，而債市正在賭守不住。10 月底的 Q3 財報會給答案。這是研究線索，不是投資建議。", "en": "Redwood Trust (RWT) entered the pool on September 16, and the core evidence on file is CEO and director Christopher Abate buying 100,000 shares at $3.839 for $383,900 on September 15 — with the stock near its 52-week low of $3.22 and down 28% over six months, making him at least the third insider to buy recently. A September 28 insider-signal roundup listed RWT alongside Dynex Capital as a cluster-buy name, effectively resurfacing that purchase for the market. Read it against the same day's backdrop, though: the 30-year yield reached 5.48%, above the 5.43% cited in the pool's own verification note, and that erodes book value directly for a holder of residential mortgage assets. The question is clean — the CEO is betting $384,000 that book value holds at $6.90, and the bond market is betting it does not. The late-October Q3 report settles it. A research lead, not investment advice.", "url": "https://www.everhint.com/insider-trading-signals-september-28-2026-midday-update-last-24-hours-pacific-time/", "stocks": [{"t": "RWT", "n": "Redwood Trust，執行長 9/28 買進 10 萬股約 38.39 萬美元"}], "status": "RADAR · 下一個驗證點 10/下旬 Q3 財報每股帳面價值 6.90 美元"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "zh": "Teekay Tankers（TNK）在 9 月 28 日的更新裡被降級為觀察，理由是傳出美伊正在談「分階段協議」、荷姆茲海峽可能重開。24 小時之後，這個降級理由消失了：川普直接回絕德黑蘭的停火提議，布蘭特衝向 107 美元，油輪族群年初至今的 120% 漲幅背後的供給緊縮條件重新成立。這一段的教訓比標的本身更值得記：當一個論點是建立在地緣政治的「還沒發生」上，它的降級與復原都可能只隔一個新聞週期，所以這種部位的持有期限要跟新聞週期對齊，不能跟財報週期對齊。這是研究線索，不是投資建議。", "en": "Teekay Tankers (TNK) was downgraded to watch in the September 28 update on reports of a phased U.S.-Iran deal that might reopen the Strait of Hormuz. Twenty-four hours later that reason is gone: Trump rebuffed Tehran's ceasefire offer outright, Brent pushed toward $107, and the supply-tightening conditions behind the tanker complex's 120% year-to-date run are back in force. The lesson here matters more than the name: when a thesis rests on geopolitics not yet happening, downgrade and recovery can be one news cycle apart — so the holding horizon has to match the news cycle, not the earnings cycle. A research lead, not investment advice.", "url": "https://oilprice.com/Energy/Energy-General/Oil-Prices-Rally-as-US-Targets-Iranian-Tankers-in-New-Escalation.html", "stocks": [{"t": "TNK", "n": "Teekay Tankers，降級理由在 24 小時內消失"}, {"t": "INSW", "n": "International Seaways，同族群對照，供給緊縮受惠度相近"}], "status": "RADAR · 下一個驗證點 11 月 Q3 財報的新約日費水準"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "zh": "Modine（MOD）的分拆已經走到最後一步。9 月 28 日是 Performance Technologies 事業分拆的除權基準日，分派與併入 Gentherm 的反向莫里斯信託交易預計 10 月 1 日完成，原 Modine 股東將持有合併後公司的 43.6%、Gentherm 原股東持 56.4%。交割之後，留下來的 Modine 變成一家純粹的 Climate Solutions 公司：商用暖通、室內空氣品質、資料中心冷卻。入池時的論點就是「被車用零件評價蓋住的資料中心冷卻事業」，10/1 之後這個遮罩正式拿掉。接下來唯一要看的是新結構的第一份完整季報：Climate Solutions 單獨的營收成長率、利潤率，以及資料中心冷卻到底佔多少。這是研究線索，不是投資建議。", "en": "Modine's (MOD) separation has reached its final step. September 28 was the record date for spinning off the Performance Technologies business, with distribution and the Reverse Morris Trust merger into Gentherm expected to close October 1 — former Modine holders will own 43.6% of the combined company and existing Gentherm holders 56.4%. After closing, what remains of Modine is a pure Climate Solutions company: commercial HVAC, indoor air quality, and data-center cooling. The pool thesis was always \"a data-center cooling business hidden under an auto-parts multiple,\" and on October 1 that cover comes off. The only thing left to verify is the first full quarter under the new structure: standalone Climate Solutions revenue growth, margin, and exactly how much is data-center cooling. A research lead, not investment advice.", "url": "https://www.panabee.com/news/modine-and-gentherm-adjust-spin-off-terms-set-record-date-for-merger", "stocks": [{"t": "MOD", "n": "Modine，10/1 完成分拆後成為純 Climate Solutions 公司"}, {"t": "THRM", "n": "Gentherm，合併後承接 Performance Technologies 事業"}], "status": "RADAR · 下一個驗證點 新結構下第一份完整季報"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "三個人一起買", "color": "#6DB56D", "zh": "Cooper Companies（COO）在 9 月 11 日到 16 日之間，出現三位不同內部人的公開市場買進，合計約 190 萬美元，全部是 Form 4 的 P 碼、每筆至少一萬美元。這家公司做隱形眼鏡與婦產科醫材，屬於中大型股，不是冷門標的——所以這筆群聚買進的意義不在「發現價值」，而在「管理層對目前股價的看法與市場不同」。要判斷它有沒有續航力，看的是接下來三十天有沒有第四位跟進，以及買進的是不是經營層而非只有董事。", "en": "Cooper Companies (COO) saw three different insiders buy on the open market between September 11 and 16, totaling roughly $1.9 million, all Form 4 code-P purchases of at least $10,000 each. The company makes contact lenses and women's health devices and is a mid-to-large cap, not an obscure name — so the cluster signals less \"value discovery\" than a management view that diverges from the market's. To judge durability, watch whether a fourth insider follows in the next thirty days, and whether buyers are operating executives rather than only directors.", "url": "https://github.com/jwill736/market-tracker/issues/14", "stocks": [{"t": "COO", "n": "Cooper Companies，9/11-9/16 三位內部人買進共約 190 萬美元"}, {"t": "ALC", "n": "愛爾康，隱形眼鏡與眼科醫材的主要同業"}, {"t": "BLCO", "n": "Bausch + Lomb，同業對照，估值差異可對比"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "判讀：怎麼看群聚", "color": "#6DB56D", "zh": "群聚買進是所有內部人訊號裡研究支持最強的一種，但它不是保證，使用時要記住三件事。第一，訊號強度看的是「人數 × 身分 × 自有資金」，執行長與財務長的權重遠高於獨立董事，因為他們看得到下一季的內部數字。第二，小公司流動性差、波動大，同樣一筆買進在微型股上的訊噪比其實更低，不是更高。第三，這裡講的 Form 4 跟政要持股頻道講的 PTR 是兩套完全不同的申報制度，Form 4 通常兩個營業日內就要申報，PTR 有 45 天延遲——不要把兩者的即時性混為一談。", "en": "Cluster buying is the insider signal with the most research behind it, but it is not a guarantee, and three caveats apply. First, signal strength is a function of headcount times role times own money — CEOs and CFOs carry far more weight than independent directors because they see next quarter's internal numbers. Second, small companies are illiquid and volatile, so the same purchase in a microcap actually has a worse signal-to-noise ratio, not a better one. Third, the Form 4 filings discussed here and the PTRs in the Capitol Holdings channel are entirely different regimes: Form 4 is generally due within two business days, a PTR can lag 45 days. Do not conflate their timeliness.", "url": "http://openinsider.com/latest-cluster-buys", "stocks": [{"t": "DX", "n": "今日案例，投資長單人買進，屬於強度較低的一類"}, {"t": "RWT", "n": "今日案例，執行長 9/15 以 3.839 美元買進 10 萬股，為近期第三位以上內部人，屬於較強的群聚型"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "公司買 vs 自己買", "color": "#6DB56D", "zh": "今年美國企業投入庫藏股的金額約一兆美元，但把它跟內部人自己的買賣放在一起看，常常會發現兩者方向不一致——公司在買回股票的同時，經營層在賣。這是為什麼「授權金額」幾乎沒有參考價值，要看的是實際執行的股數與均價。兩個可對照的例子：Azenta 在 4 月到 6 月之間實際買回 230 萬股、約 5,000 萬美元；Citizens Financial Services 在 5 月到 6 月只買回約 89 萬美元，規模小得多，但它在 6 月被踢出多個羅素指數之後還繼續買，脈絡就不一樣了。", "en": "Corporate America is putting roughly $1 trillion into buybacks this year, but set that against what insiders themselves are doing and the two often point opposite ways — the company repurchases while executives sell. This is why authorized amounts are nearly worthless as a signal; what counts is shares actually retired and the average price paid. Two comparable cases: Azenta actually repurchased 2.3 million shares for about $50 million between April and June; Citizens Financial Services bought back only about $890,000 in May and June — far smaller, but it kept buying after being dropped from several Russell indexes in June, which changes the context.", "url": "https://finance.yahoo.com/markets/stocks/articles/corporate-america-pumping-1-trillion-173100033.html", "stocks": [{"t": "AZTA", "n": "Azenta，4-6 月實際買回 230 萬股約 5,000 萬美元"}, {"t": "CZFS", "n": "Citizens Financial Services，6 月被剔除羅素指數後仍持續買回"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "押在電力上", "color": "#B5654D", "zh": "目前這一批申報裡，論點最完整的一筆是裴洛西家族對 Bloom Energy 的買進。依 8 月 21 日簽署的申報文件，這個家庭在 7 月下旬分數筆買進這家加州燃料電池與電力系統公司。值得看的不是誰申報的，是這個部位在押什麼：Bloom Energy 做的是替 AI 資料中心的龐大電力需求提供現地發電，也就是說這筆錢押的主題是「算力的瓶頸在電、不在晶片」。把它放在昨天 Cook 理事那段「AI 正在加通膨」的談話旁邊看，會發現同一個假設從兩個方向被驗證。這裡只寫申報了什麼、這個部位結構代表什麼假設。", "en": "Among current filings, the one with the most complete thesis behind it is the Pelosi household's purchase of Bloom Energy. Per a disclosure signed August 21, the household made several purchases in late July of the California fuel-cell and power-systems company. What matters is not whose filing it is but what the position bets on: Bloom Energy supplies on-site generation for AI data centers' enormous power demand — the money is betting that the compute bottleneck is electricity, not chips. Read alongside Governor Cook's remarks that AI is adding inflationary pressure, the same assumption is being tested from two directions. This notes only what was disclosed and what the position structure assumes.", "url": "https://www.westernjournal.com/nancy-pelosi-disclosed-multi-million-dollar-ai-investment-just-weeks-stock-blew/", "stocks": [{"t": "BE", "n": "Bloom Energy，燃料電池現地發電，申報標的本身"}, {"t": "CEG", "n": "星座能源，同一主題的另一種押法：核電供應資料中心"}, {"t": "VST", "n": "Vistra，電價上行的直接受惠者"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "判讀：四十五天", "color": "#B5654D", "zh": "這個頻道要一直提醒的第一件事是時間差。STOCK 法案給的申報期限是成交後 45 天，所以你今天讀到的每一筆，成交都發生在一個半月前——以本週這種利率與油價的波動幅度，45 天前的價位跟現在可能是兩個世界。第二件事是精度：申報用的是金額區間（例如 1,001 到 15,000 美元），不是實際數字，所以任何「某某人買了多少錢」的加總都只是區間的中位數推估。第三件事是執行主體：相當比例的交易是配偶帳戶或信託執行的，跟申報人本人的判斷未必是同一回事。真正有資訊量的是選擇權的履約價與到期日，因為那裡面寫著對價格與時間的具體假設。", "en": "The first thing to keep repeating in this channel is the lag. The STOCK Act allows 45 days from execution to filing, so every trade you read today was executed a month and a half ago — with this week's swings in rates and oil, the price 45 days ago may belong to a different world. Second, precision: filings use dollar ranges (for example $1,001 to $15,000), not actual amounts, so any \"member X bought $Y\" total is a midpoint estimate. Third, who executed it: a sizeable share of trades run through spouse accounts or trusts and need not reflect the filer's own judgment. What genuinely carries information is an option's strike and expiry, because those encode a specific assumption about price and time.", "url": "https://capitolmarkets.org/research/congress-stock-trading", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報持股的 ETF，可觀察策略化後的績效"}, {"t": "GOP", "n": "追蹤共和黨籍議員申報持股的 ETF，與 NANC 對照"}]},
    {"id": "week_0", "channel": "本週事件", "tag": "兩份數據定調", "color": "#C97DD4", "zh": "這週剩下的交易日由兩份數據主導。9 月 30 日八月個人消費支出物價指數，預期年增 3.8%、月增 0.4%、核心月增 0.3%；10 月 2 日九月非農就業報告，預期新增就業降到 9 萬人，失業率維持 4.1%、仍是一年來最低。組合決定劇本：通膨偏熱加上就業穩定，10 月 28 日再升一碼幾乎沒有懸念；如果就業明顯轉弱，決策層才會有猶豫的空間。目前市場定價的升息機率約七成，這兩份數據就是在測試這個七成該往哪邊修。", "en": "Two data points govern the rest of this week. On September 30, the August PCE price index: consensus 3.8% year over year, 0.4% month over month, core up 0.3%. On October 2, the September jobs report: payrolls seen slowing to 90,000 with unemployment holding at 4.1%, still a one-year low. The combination writes the script — hot inflation plus a stable labor market makes another 25bp on October 28 close to certain, while a clearly weak jobs number is what would give policymakers pause. Markets price roughly 70%; these two releases test which way that 70% should move.", "url": "https://blockonomi.com/key-economic-reports-and-earnings-to-watch-this-week-jobs-inflation-and-micron-mu-results/", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，兩份數據的直接反應標的"}, {"t": "GLD", "n": "黃金 ETF，實質利率路徑的對照"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "三場財報", "color": "#C97DD4", "zh": "財報端有三場排在一起，涵蓋三個完全不同的需求面。今天（9/29）盤後嘉年華郵輪，測的是高油價下的旅遊消費；9 月 30 日盤後美光，測的是 AI 記憶體循環還在不在加速；10 月 1 日盤後耐吉，測的是中國競爭與美國一般消費。三份加起來，等於在同一週內把「AI 資本支出」與「家庭可支配所得」這兩條線各拉一次。如果兩條線給出相反的答案——AI 很強、消費很弱——那就是目前指數集中度最好的解釋。", "en": "Three reports land back to back, covering three entirely different demand pictures. Carnival tonight (9/29) tests travel spending under high oil. Micron on September 30 tests whether the AI memory cycle is still accelerating. Nike on October 1 tests Chinese competition and U.S. general consumption. Together they pull on both the AI-capex thread and the household-income thread within one week. If the two give opposite answers — AI strong, consumer weak — that is the cleanest available explanation for the index's current concentration.", "url": "https://algotradealert.substack.com/p/earnings-week-ahead-september-28", "stocks": [{"t": "CCL", "n": "嘉年華，今晚盤後，測旅遊消費與燃油成本"}, {"t": "MU", "n": "美光，9/30 盤後，測 AI 記憶體循環"}, {"t": "NKE", "n": "耐吉，10/1 盤後，測中國競爭與一般消費"}]},
    {"id": "eval_0", "channel": "今日評估", "tag": "今天最值得注意的一件事", "color": "#E8A838", "zh": "今天最值得注意的不是指數跌了多少，是聯準會理事 Cook 那句「AI 短期正在加通膨」。過去兩年市場對 AI 的定價，隱含的假設一直是它會提升生產力、因此壓低通膨、因此讓利率下來，這個鏈條支撐了所有高估值。如果 AI 資本支出在搶電力、變壓器與工程人力，它在短期內就是通膨來源而不是解方——那麼 AI 股與高利率就不是可以互相抵銷的兩個變數，而是同一個變數推出來的兩個結果。今天的盤面剛好把這個矛盾演了一遍：十年期 5.21%、三十年期 5.48%、油價 107，然後指數跌，公用事業卻是今年第二強的類板塊。開放式問題：如果 AI 投資本身就是這輪通膨的一部分，那「殖利率回落之後成長股就會重新領漲」這個劇本，還成立嗎？", "en": "The thing most worth noticing today is not how far the index fell but Governor Cook's line that AI is adding inflationary pressure in the short run. For two years the market's pricing of AI has assumed it raises productivity, therefore lowers inflation, therefore lowers rates — that chain supports every high multiple. If AI capex is bidding for power, transformers and engineering labor, then in the near term it is a source of inflation rather than a cure, and AI stocks and high rates are not offsetting variables but two outputs of the same one. Today's tape acted the contradiction out: 5.21% on the 10-year, 5.48% on the 30-year, $107 crude, the index down — and utilities the year's second-strongest sector. The open question: if AI investment is itself part of this inflation, does the script where growth stocks re-lead once yields fall still hold?", "url": "https://finance.biggo.com/news/11b14bc0-f00a-4042-96e4-038d8ff9f6a6", "stocks": [{"t": "QQQ", "n": "那斯達克 100，AI 估值最集中的載體"}, {"t": "XLE", "n": "能源類股，通膨端的另一半"}], "status": "今日評估 · 按下方討論鍵接著聊"},
];

})();

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/29/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v12.7</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
