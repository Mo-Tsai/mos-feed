/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

  {"id": "earn_1", "channel": "財報速報", "tag": "AI 設備與雲端回吐", "color": "#E8786A", "zh": "應用材料（AMAT）第四季調整後每股盈餘 4.16 美元，高於預期的 4.06 美元，週五卻收跌約 3.4% 到 368.02 美元，此前四個交易日已漲約 24%。Nebius（NBIS）週五再跌約 9.4% 到 116.60 美元，前一天已因資本支出上調大跌。兩者共同點是：AI 基礎設施股在財報後被賣，市場要的是超出預期的幅度，而不是單純超預期。價格取自週五下午報導。", "en": "Applied Materials posted Q4 adjusted EPS of $4.16 versus $4.06 expected yet fell about 3.4% to $368.02 on Friday, after rising about 24% in the prior four sessions. Nebius fell another 9.4% to $116.60 after Thursday's capex-driven drop. The common thread: AI-infrastructure stocks are being sold after earnings because the market wants a large beat, not just a beat. Prices are from Friday afternoon reports.", "url": "https://uk.investing.com/news/stock-market-news/earnings-week-scorecard-beats-rewarded-selectively-as-aiinfrastructure-names-pull-back-93CH-4981826", "stocks": [{"t": "AMAT", "n": "週五約 -3.4%，約 368.02 美元；前四日 +24%"}, {"t": "NBIS", "n": "週五約 -9.4%，約 116.60 美元"}, {"t": "LRCX", "n": "半導體設備同業，觀察資本支出情緒"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "本週財報股的後續", "color": "#E8786A", "zh": "本週財報股在週五的表現，把「財報反應」與「後續走勢」分開：CoreWeave（CRWV）財報後曾大漲約 24%，週五跌約 6.6% 到 52.85 美元；Constellation Energy（CEG）每股盈餘 5.06 美元、遠高於預期的 3.72 美元，財報後漲約 7%，週五跌約 1.6%；KKR 每股盈餘 1.78 美元高於預期 1.59 美元，週五約持平。意思是財報當天的漲幅，不等於持有者拿得到。", "en": "Friday separated the earnings-day reaction from what came after: CoreWeave jumped about 24% on results and fell about 6.6% to $52.85 on Friday; Constellation Energy earned $5.06 per share versus $3.72 expected, rose about 7% on the report and fell about 1.6% Friday; KKR earned $1.78 versus $1.59 and was roughly flat. An earnings-day pop is not a gain holders necessarily keep.", "url": "https://uk.investing.com/news/stock-market-news/earnings-week-scorecard-beats-rewarded-selectively-as-aiinfrastructure-names-pull-back-93CH-4981826", "stocks": [{"t": "CRWV", "n": "財報後 +24%，週五約 -6.6%"}, {"t": "CEG", "n": "EPS 5.06 美元 vs 預期 3.72，週五約 -1.6%"}, {"t": "KKR", "n": "EPS 1.78 美元 vs 預期 1.59，週五約持平"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "10 月 PPI", "color": "#7C6AF7", "zh": "10 月生產者物價指數（PPI）月增 0.3%，低於道瓊調查預期的 0.4%；年增 6.5%，是 2022 年 11 月（當時 7.4%）以來最大的 12 個月漲幅。月增低於預期是小小的好消息，但年增率仍高。股市沒有因此上漲，標普 500 收跌 0.4%，市場關心的是「通膨水位」，而不只是「這個月比預期好一點」。", "en": "October producer prices rose 0.3% m/m, below the 0.4% Dow Jones economists expected, and 6.5% y/y, the largest 12-month gain since November 2022 (7.4% then). A softer monthly number is mildly good news, but the annual rate is still high. Stocks did not rally on it: the S&P 500 closed down 0.4%. The market is focused on the level of inflation, not just a slightly better month.", "url": "https://cnbc.com/2026/11/12/stock-market-today-live-updates.html", "stocks": [{"t": "IWM", "n": "小型股對利率最敏感，通膨數據的受益或受害者"}, {"t": "TIP", "n": "抗通膨債券 ETF，通膨預期觀察指標"}, {"t": "XLP", "n": "必需消費，成本轉嫁能力的對照"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "12 月升息定價", "color": "#7C6AF7", "zh": "CME FedWatch 顯示，市場認為 12 月 9 日的 FOMC 會議幾乎確定升息：約 87% 機率升息 1 碼（25 個基點）、約 13% 機率升 2 碼（50 個基點）。10 月 CPI 偏熱、PPI 月增略低於預期，沒有改變這個方向；改變的只是升幅的賠率。目前 Fed 的利率區間是 3.75% 至 4%，所以本輪討論的是「升多少」，不是「要不要降」。", "en": "CME FedWatch shows markets pricing a December 9 rate hike as near certain: about 87% odds of 25 basis points and about 13% odds of 50. The hot October CPI and the slightly softer PPI did not change the direction, only the odds on size. The Fed's range is 3.75-4%, so the debate is how much to hike, not whether to cut.", "url": "https://cnbc.com/2026/11/12/stock-market-today-live-updates.html", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，利率與存款成本的敏感指標"}, {"t": "XLU", "n": "公用事業，高殖利率股在升息期的壓力"}, {"t": "SHY", "n": "短天期公債 ETF，反映政策利率預期"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "通膨的位階", "color": "#7C6AF7", "zh": "把 PPI 年增 6.5% 放在歷史裡看：它低於 2022 年 11 月的 7.4%，但遠高於 Fed 設定的 2% 長期目標，這也是為什麼官員的語氣偏鷹。生產者物價屬於上游成本，企業能不能把成本轉嫁給消費者，會決定獲利率；轉嫁能力弱的公司（零售、餐飲、低價商品）在這種環境最容易被擠壓。這是背景知識整理，不是預測。", "en": "Put the 6.5% y/y PPI in context: it is below November 2022's 7.4% but far above the Fed's 2% long-run goal, which is why officials sound hawkish. Producer prices are upstream costs, and whether companies can pass them to consumers determines margins; weak pass-through businesses (retail, restaurants, low-priced goods) get squeezed most. This is background, not a forecast.", "url": "https://cnbc.com/2026/11/12/stock-market-today-live-updates.html", "stocks": [{"t": "TJX", "n": "折扣零售，下週三財報，看成本與價格轉嫁"}, {"t": "TGT", "n": "大型零售，下週三財報，毛利率是焦點"}, {"t": "COST", "n": "會員制零售，成本轉嫁能力的對照"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "AI 晶片逆轉", "color": "#4EABA4", "zh": "週四博通（AVGO）漲約 5.5%、超微（AMD）漲約 6%，被當成「Nvidia 之外的 AI 選擇」；週五風向翻轉，Benzinga 標題指超微盤中一度重挫約 10.5%，那斯達克 100 盤中跌約 1.7%。一天一個方向，代表這波資金只是在不同的 AI 晶片股之間輪流，不是對整個族群有共識。這種短線翻轉很難追，值得追蹤的是財報與新管理層的說法。", "en": "On Thursday Broadcom rose about 5.5% and AMD about 6% as the 'AI alternatives to Nvidia'; on Friday the wind flipped, with a Benzinga headline saying AMD sank as much as 10.5% intraday and the Nasdaq 100 fell about 1.7% at one point. A different direction every day suggests money rotating among AI chip names, not consensus on the group. Hard to chase; earnings and management commentary are what to watch.", "url": "https://www.benzinga.com/markets/equities/26/11/63259862/stock-market-today-amd-nvidia-chip-selloff-cisco-modine-november-13", "stocks": [{"t": "AVGO", "n": "週四 +5.5%，週五隨晶片族群轉弱"}, {"t": "AMD", "n": "週四 +6%，週五盤中一度 -10.5%"}, {"t": "SOXX", "n": "半導體 ETF，觀察族群整體"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "電力與房屋", "color": "#4EABA4", "zh": "兩個板塊在高利率下走向相反：電力商 Constellation Energy（CEG）五個交易日漲近 18%，AI 資料中心的用電需求支撐它的故事，雖然週五回吐約 1.6%；房屋建商 D.R. Horton（DHI）同期跌約 8%，因為 10 年期殖利率在 5% 以上，房貸利率跟著上升。一個吃 AI 電力需求，一個吃利率，兩者的拉扯是這個市場的縮影。", "en": "Two sectors moved in opposite directions under high rates: power producer Constellation Energy rose nearly 18% over five sessions on AI data-center power demand, though it gave back about 1.6% Friday; homebuilder D.R. Horton fell about 8% over the same stretch as the 10-year yield above 5% pushes mortgage rates up. One rides AI power demand, the other rides interest rates.", "url": "https://marketdailytape.substack.com/p/evening-tape-nvidia-lost-its-chief", "stocks": [{"t": "CEG", "n": "五日約 +18%，週五約 -1.6%"}, {"t": "DHI", "n": "五日約 -8%，房貸利率壓力"}, {"t": "XLU", "n": "公用事業，電力需求題材的另一面"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "貴金屬降溫", "color": "#4EABA4", "zh": "貴金屬週四明顯走弱：黃金跌近 3%、白銀跌逾 3%，金礦商 Newmont（NEM）跌近 5%，原物料是週四跌最多的板塊；美元指數同時升到 2025 年 4 月以來的高點，高殖利率與強勢美元通常對不生息的黃金不利。週五黃金大致持平，約在 3,884 美元附近。要注意的是，這是一天的反應，不足以判斷中期趨勢。", "en": "Precious metals weakened sharply Thursday: gold fell nearly 3%, silver more than 3% and Newmont nearly 5%, with materials the worst sector. The dollar index also hit its highest level since April 2025; high yields and a strong dollar usually weigh on non-yielding gold. Gold was roughly flat Friday near $3,884. One day's reaction is not enough to call a medium-term trend.", "url": "https://marketdailytape.substack.com/p/evening-tape-nvidia-lost-its-chief", "stocks": [{"t": "NEM", "n": "週四約 -5%，金礦股"}, {"t": "GLD", "n": "黃金 ETF，週四約 -3%，週五約持平"}, {"t": "SLV", "n": "白銀 ETF，週四跌逾 3%"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "Cerebras", "color": "#5B8ED6", "zh": "AI 晶片新上市公司 Cerebras（CBRS）週五盤前漲約 16%，起因是第三季營收 2.31 億美元高於預期的 2.15 億美元，並取得微軟的新合約；CNBC 稱這是出乎意料的第三季獲利。這類新上市股財報資料少、波動大，上漲是否在整個交易日站得住，我沒有查到收盤資料，所以只能當盤前訊號。", "en": "AI chip newcomer Cerebras rose about 16% premarket Friday after Q3 revenue of $231 million beat the $215 million estimate and it landed a new Microsoft contract; CNBC called it a surprise third-quarter profit. Newly listed stocks have thin history and big swings; I could not find the closing move, so this is only a premarket signal.", "url": "https://cnbc.com/2026/11/12/stock-market-today-live-updates.html", "stocks": [{"t": "CBRS", "n": "盤前約 +16%，營收 2.31 億美元 vs 預期 2.15 億"}, {"t": "MSFT", "n": "新合約客戶"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "Rocket Lab", "color": "#5B8ED6", "zh": "太空發射與製造商 Rocket Lab（RKLB）11 月 9 日財報每股虧損 0.12 美元，比預期的虧 0.07 美元差，股價卻在財報後大漲約 18%；週五跌約 4.4% 到 61.28 美元。這是成長股的樣子：市場買的是訂單與未來，不是這一季的虧損。但這種漲幅在利率高檔很容易被賣回去，週五就是一例。", "en": "Rocket Lab reported a Q3 loss of $0.12 per share versus a $0.07 loss expected on November 9, yet the stock jumped about 18% on the report and fell about 4.4% to $61.28 on Friday. That is how growth stocks behave: the market buys orders and the future, not this quarter's loss. With rates this high, such gains are easily sold back, as Friday showed.", "url": "https://uk.investing.com/news/stock-market-news/earnings-week-scorecard-beats-rewarded-selectively-as-aiinfrastructure-names-pull-back-93CH-4981826", "stocks": [{"t": "RKLB", "n": "財報後 +18%，週五約 -4.4%，約 61.28 美元"}, {"t": "ARKX", "n": "太空主題 ETF，同族群對照"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "升評個案", "color": "#5B8ED6", "zh": "在科技股賣壓的一天，升評個案支撐了一部分類股：醫療器材與消毒設備商 Steris（STE）因 Jefferies 升評上漲近 4%；網路安全的 Palo Alto Networks（PANW）獲 KeyBanc 升到加碼。Steris 屬於中型股，代表在高利率環境下，防禦型、現金流穩定的醫療設備類股，仍有分析師願意調升看法；Palo Alto 11 月 18 日盤後公布財報。", "en": "On a day of tech selling, upgrades supported pockets of the market: medical sterilization maker Steris rose nearly 4% on a Jefferies upgrade, and cybersecurity firm Palo Alto Networks was raised to overweight by KeyBanc. Steris is a mid cap, showing analysts still upgrade steady-cash-flow healthcare equipment names in a high-rate market; Palo Alto reports after the close on November 18.", "url": "https://cnbc.com/2026/11/12/stock-market-today-live-updates.html", "stocks": [{"t": "STE", "n": "約 +4%，Jefferies 升評"}, {"t": "PANW", "n": "KeyBanc 升至加碼，11/18 盤後財報"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "Take-Two", "color": "#5B8ED6", "zh": "遊戲商 Take-Two（TTWO）11 月 9 日財報每股虧損 0.29 美元，遠差於預期的盈餘 0.97 美元，但股價反應約上漲 4.6%，週五再漲約 0.6% 到 228.41 美元，分析師對它的獲利預估在財報後一週反而上調約 7%。市場看的是遊戲發行節奏與未來大作，不是單季帳面。同一檔股票週四還曾因美銀的銷售門檻評論跌約 2%，波動並不小。", "en": "Take-Two reported a Q3 loss of $0.29 per share versus the $0.97 profit expected on November 9, yet shares rose about 4.6% on the report and another 0.6% Friday to $228.41; analyst estimates actually rose about 7% in the following week. The market is looking at the release pipeline, not the quarter's accounting. The stock still fell about 2% Thursday on a BofA comment about sales thresholds, so it is volatile.", "url": "https://uk.investing.com/news/stock-market-news/earnings-week-scorecard-beats-rewarded-selectively-as-aiinfrastructure-names-pull-back-93CH-4981826", "stocks": [{"t": "TTWO", "n": "財報後約 +4.6%，約 228.41 美元"}, {"t": "EA", "n": "遊戲同業，產業情緒對照"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "判讀知識", "color": "#5B8ED6", "zh": "小型股判讀知識：羅素 2000 與標普 600 為什麼表現會不同。羅素 2000 沒有獲利門檻，包含大量虧損公司；標普 600 要求近期獲利為正。在利率上升、融資變貴的環境，虧損公司最容易被拋售，所以兩個「小型股指數」常有落差。看小型股時，先看它是哪個指數、公司有沒有穩定獲利，再看估值。這是知識整理，不是推薦。", "en": "Small-cap reading tip: why the Russell 2000 and S&P 600 can differ. The Russell 2000 has no profitability screen and includes many unprofitable companies; the S&P 600 requires positive recent earnings. When rates rise and financing gets costlier, unprofitable firms are sold first, so the two small-cap indexes often diverge. Check which index, whether the company is profitable, then valuation. Knowledge, not a recommendation.", "url": "https://cnbc.com/2026/11/12/stock-market-today-live-updates.html", "stocks": [{"t": "IWM", "n": "追蹤羅素 2000，含大量虧損公司"}, {"t": "IJR", "n": "追蹤標普 600，要求獲利"}, {"t": "VBR", "n": "小型價值 ETF，另一種篩選方式"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "Adtran", "color": "#C9A227", "zh": "Adtran Holdings（ADTN）是光纖與寬頻接取網路設備商。InsiderEdge 彙整顯示，董事長兼執行長在近期以每股約 4.01 美元買進 15 萬股，約 60 萬美元，被標為「跌後買進」。這檔已在雷達池內，目前新增的訊號只有這筆自掏腰包的買進；分析師覆蓋度與最新財報趨勢尚未查證。風險是低價股、電信資本支出循環。這是研究線索，不是投資建議。", "en": "Adtran Holdings (ADTN) makes fiber and broadband access network equipment. An InsiderEdge roundup shows its chairman and CEO recently bought 150,000 shares at about $4.01, roughly $600,000, flagged as a dip buy. Already in the radar pool, the only new signal is this open-market buy; analyst coverage and the latest earnings trend are unverified. Risks: low-priced stock and telecom capex cycles. A research lead, not investment advice.", "url": "https://www.bbae.com/blog/insideredge-major-holdings-changes-november-10-2026/", "stocks": [{"t": "ADTN", "n": "執行長買進 15 萬股約 60 萬美元，約 4.01 美元"}, {"t": "CALX", "n": "寬頻設備同業，產業對照"}], "status": "RADAR · 下一個驗證點 下次財報與內部人續買"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "Columbus McKinnon", "color": "#C9A227", "zh": "Columbus McKinnon（CMCO）做起重、物料搬運與動力傳動設備，是典型的工業小型股。InsiderEdge 彙整顯示，總裁兼執行長以每股約 16.90 美元買進 32,631 股，約 55 萬美元，屬於非計畫性買進。目前只確認這筆買進；基本面拐點與分析師覆蓋尚未查證。風險是工業景氣循環與高利率下的資本支出遲滯。這是研究線索，不是投資建議。", "en": "Columbus McKinnon (CMCO) makes hoists, material-handling and motion-control equipment, a classic industrial small cap. An InsiderEdge roundup shows its president and CEO bought 32,631 shares at about $16.90, roughly $551,000, an unscheduled purchase. Only this buy is confirmed; fundamental inflection and analyst coverage are unverified. Risks: industrial cycle and delayed capex under high rates. A research lead, not investment advice.", "url": "https://www.bbae.com/blog/insideredge-major-holdings-changes-november-10-2026/", "stocks": [{"t": "CMCO", "n": "執行長買進 32,631 股約 55 萬美元，約 16.90 美元"}, {"t": "XLI", "n": "工業類股 ETF，景氣循環對照"}], "status": "RADAR · 下一個驗證點 下次財報訂單與毛利"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "Flowco", "color": "#C9A227", "zh": "Flowco Holdings（FLOC）是較新上市的油氣生產設備與服務公司。InsiderEdge 彙整顯示，總裁兼執行長以每股約 19.47 美元買進 41,000 股，約 80 萬美元，屬於非計畫性買進。上市時間短、公開歷史少，往往也代表分析師與媒體的關注不多。目前只確認這筆買進，基本面與覆蓋度尚未查證。風險是油價循環與新上市股的籌碼變動。這是研究線索，不是投資建議。", "en": "Flowco Holdings (FLOC) is a recently listed oilfield production equipment and services company. An InsiderEdge roundup shows its president and CEO bought 41,000 shares at about $19.47, roughly $798,000, an unscheduled purchase. A short listing history often means thin analyst and media attention. Only this buy is confirmed; fundamentals and coverage are unverified. Risks: oil cycles and newly listed share dynamics. A research lead, not investment advice.", "url": "https://www.bbae.com/blog/insideredge-major-holdings-changes-november-10-2026/", "stocks": [{"t": "FLOC", "n": "執行長買進 41,000 股約 80 萬美元，約 19.47 美元"}, {"t": "OIH", "n": "油服 ETF，產業對照"}], "status": "RADAR · 下一個驗證點 下次財報與鎖定期後籌碼"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "UMH Properties", "color": "#C9A227", "zh": "UMH Properties（UMH）是以預製屋社區為主的房地產投資信託（REIT）。董事 William Mitchell 在 11 月 4 日申報以每股 15.06 美元買進 1,300 股，買進後直接持有約 38,682 股，6 月也曾小額買進；另有其他董事近期買進。金額不大，但是連續、自掏腰包。第三季財報已在 11 月初發布，我沒有查到具體數字，所以覆蓋度與基本面拐點尚未驗證。風險是利率與 REIT 的債務成本。這是研究線索，不是投資建議。", "en": "UMH Properties (UMH) is a REIT focused on manufactured-home communities. Director William Mitchell reported buying 1,300 shares at $15.06 on a Form 4 filed November 4, taking his direct holding to about 38,682 shares; he also made a small buy in June and other directors bought recently. Small amounts, but repeated and out-of-pocket. Q3 results came out in early November and I could not find the figures, so coverage and any inflection are unverified. Risk: rates and REIT debt costs. A research lead, not investment advice.", "url": "https://kalkine.com/news/announcements/director-mitchell-buys-1300-umh-shares-at-1506", "stocks": [{"t": "UMH", "n": "董事買進 1,300 股，15.06 美元，11/4 申報"}, {"t": "SUI", "n": "住宅型 REIT 同業對照"}], "status": "RADAR · 下一個驗證點 季報細節與董事續買"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "Fluence", "color": "#C9A227", "zh": "Fluence Energy（FLNC）做電網等級的儲能系統。8 月公布的最近一季營收與獲利都未達預期，並把全年營收預測從 32 億至 36 億美元下修到約 29 億至 31 億美元，原因是生產與專案延遲、交貨遞延到明年；但同一季新增訂單近乎三倍，來到逾 14.4 億美元，積壓訂單創高達 64 億美元。這檔已在雷達池，下一個驗證點是財年第四季財報（通常在 11 月下旬，日期待確認）。風險是交付延遲與毛利。這是研究線索，不是投資建議。", "en": "Fluence Energy (FLNC) builds grid-scale energy storage systems. Its August quarter missed estimates and it cut fiscal 2026 revenue guidance to about $2.9-3.1 billion from $3.2-3.6 billion on production and project delays pushing deliveries into next year; but order intake nearly tripled to more than $1.44 billion and backlog hit a record $6.4 billion. Already in the radar pool; next checkpoint is fiscal Q4 results, normally late November (date to confirm). Risks: delivery delays and margins. A research lead, not investment advice.", "url": "https://www.benzinga.com/markets/earnings/26/08/60988298", "stocks": [{"t": "FLNC", "n": "訂單近三倍、積壓訂單創高 64 億美元，但交付延遲"}, {"t": "ENPH", "n": "再生能源設備同業，對照"}], "status": "RADAR · 下一個驗證點 財年第四季財報（日期待確認）"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "Vylor／Corteva", "color": "#C9A227", "zh": "Corteva 把種子事業獨立成 Vylor（VYLR）；多個來源指分拆日期預計在 10 月 1 日左右，來源之間說法不一，我沒有查到上市後的股價表現。週四 Corteva（CTVA）財報營收不如預期、收跌逾 9%，母公司股價承壓時，被分出去的新公司往往也因為不在指數成分、沒人覆蓋而被忽視。這檔已在雷達池，目前沒有新的拐點證據，只列觀察。風險是分拆後的成本與基本面不明。這是研究線索，不是投資建議。", "en": "Corteva separated its seed business as Vylor (VYLR); sources say the spin-off was expected around October 1, though accounts differ and I could not find post-listing price action. Corteva missed on revenue Thursday and fell more than 9%; when a parent stumbles, the newly spun company is often overlooked, outside indexes and uncovered. Already in the radar pool, with no new inflection evidence, so watch only. Risks: post-spin costs and unclear fundamentals. A research lead, not investment advice.", "url": "https://www.rfdtv.com/corteva-split-creates-separate-seed-crop-protection-companies", "stocks": [{"t": "VYLR", "n": "Corteva 分拆出的種子公司"}, {"t": "CTVA", "n": "母公司，週四財報後 -9%"}], "status": "RADAR · 下一個驗證點 分拆後首批財報"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "大額董事買進", "color": "#6DB56D", "zh": "InsiderEdge 彙整的最近買進中，金額最大的是 Stride（LRN）董事 Dylan Haggart，以約 74.83 美元買進 108,273 股，約 810 萬美元；Rockwell Automation（ROK）總裁兼執行長以約 386.36 美元買進 4,000 股，約 155 萬美元。兩者都被標為非計畫性買進。判讀提醒：大額、自掏腰包的買進比例行小額訊號強，但仍不保證股價上漲。", "en": "In InsiderEdge's roundup the largest recent buys were Stride director Dylan Haggart, who bought 108,273 shares at about $74.83 (roughly $8.1 million), and Rockwell Automation's president and CEO, who bought 4,000 shares at about $386.36 (roughly $1.55 million). Both were flagged unscheduled. Reading note: large out-of-pocket buys are a stronger signal than routine small ones, but they do not guarantee a rise.", "url": "https://www.bbae.com/blog/insideredge-major-holdings-changes-november-10-2026/", "stocks": [{"t": "LRN", "n": "董事買進 108,273 股約 810 萬美元，約 74.83 美元"}, {"t": "ROK", "n": "執行長買進 4,000 股約 155 萬美元"}]},
  {"id": "insider_1", "channel": "內部人動向", "tag": "跌後買進", "color": "#6DB56D", "zh": "同一份彙整把幾筆買進標成「跌後買進」：Lumen（LUMN）執行長以約 3.97 美元買進 10 萬股，約 40 萬美元；TTM Technologies（TTMI）董事以約 61.92 美元買進 5,000 股，約 31 萬美元；AudioCodes（AUDC）執行長以約 7.91 美元買進 15,939 股。判讀提醒：「跌後買進」是整理者的標記，高管買進只說明他認為價格低於內在價值，不代表低點已過。", "en": "The same roundup flags several buys as dip buys: Lumen's CEO bought 100,000 shares at about $3.97 (roughly $400,000); a TTM Technologies director bought 5,000 at about $61.92 (roughly $310,000); AudioCodes' CEO bought 15,939 at about $7.91. Reading note: 'dip buy' is the compiler's label; an executive buying only says he thinks price is below value, not that the low is in.", "url": "https://www.bbae.com/blog/insideredge-major-holdings-changes-november-10-2026/", "stocks": [{"t": "LUMN", "n": "執行長買進 10 萬股約 40 萬美元，約 3.97 美元"}, {"t": "TTMI", "n": "董事買進 5,000 股約 31 萬美元"}, {"t": "AUDC", "n": "執行長買進 15,939 股，約 7.91 美元"}]},
  {"id": "insider_2", "channel": "內部人動向", "tag": "財務長買進", "color": "#6DB56D", "zh": "財務長的買進再出現：WESCO（WCC）財務長以約 291.90 美元買進 1,725 股，約 50 萬美元；DraftKings（DKNG）財務長以約 18.51 美元買進 18,908 股，約 35 萬美元；AutoNation（AN）財務長以約 184.83 美元買進 1,081 股，約 20 萬美元。財務長最了解資產負債表，所以他們的買進常被看重。判讀提醒：單筆金額比公司市值小很多時，訊號強度有限。", "en": "CFO buying again: WESCO's CFO bought 1,725 shares at about $291.90 (roughly $500,000); DraftKings' CFO bought 18,908 at about $18.51 (roughly $350,000); AutoNation's CFO bought 1,081 at about $184.83 (roughly $200,000). CFOs know the balance sheet best, so their buys get attention. Reading note: when a purchase is tiny relative to market cap, the signal is limited.", "url": "https://www.bbae.com/blog/insideredge-major-holdings-changes-november-10-2026/", "stocks": [{"t": "WCC", "n": "財務長買進 1,725 股約 50 萬美元"}, {"t": "DKNG", "n": "財務長買進 18,908 股約 35 萬美元"}, {"t": "AN", "n": "財務長買進 1,081 股約 20 萬美元"}]},
  {"id": "capitol_0", "channel": "政要持股", "tag": "財報前的申報", "color": "#B5654D", "zh": "第三方彙整 Disclosed Capitol 的近期整理顯示，眾議員的申報集中在財報季前的幾檔：Pete Sessions 與 Rick Larsen 申報賣出 Home Depot（HD，11 月 17 日財報）；David Taylor 申報買進 Prologis（PLD）；Ro Khanna 申報買進 Marvell（MRVL）與 PLD。另外有六位議員在 30 天內對 Nvidia 申報 10 筆交易，買賣各 5 筆，看法並不一致。這是第三方整理，請以眾議院書記官的 PTR 為準；只陳述誰申報了什麼，不代表任何預測。", "en": "Disclosed Capitol's recent roundups show House filings clustered around names ahead of earnings: Pete Sessions and Rick Larsen reported selling Home Depot (earnings November 17); David Taylor reported buying Prologis; Ro Khanna reported buying Marvell and Prologis. Separately, six lawmakers filed 10 Nvidia trades in 30 days, five buys and five sells, with no common view. This is third-party aggregation; rely on the House Clerk's PTRs. It states who filed what and predicts nothing.", "url": "https://www.disclosedcapitol.com/news", "stocks": [{"t": "HD", "n": "兩位議員申報賣出，11/17 財報"}, {"t": "PLD", "n": "物流 REIT，兩位議員申報買進"}, {"t": "MRVL", "n": "Khanna 申報買進"}]},
  {"id": "capitol_1", "channel": "政要持股", "tag": "判讀提醒", "color": "#B5654D", "zh": "判讀卡：看議員申報績效時要小心。第三方網站常公布「申報後漲幅」，例如把某筆申報之後的漲幅算成數百個百分點，但這些是網站自己用申報日起算的估算，部分還標註「審查中」。一，申報最長可延遲 45 天，看到的是舊資料。二，金額只有區間。三，很多是配偶或信託帳戶。四，申報日之後的漲幅，不是議員實際賺到的報酬。這不是買賣訊號，也不暗示任何不當行為。", "en": "Reading card: be careful with congressional 'performance' claims. Third-party sites often publish gains since filing, sometimes several hundred percent, but those are the site's own estimates counted from the filing date and some are marked under review. One, filings can lag up to 45 days, so the data is old. Two, amounts are only ranges. Three, many trades are by spouses or trusts. Four, gains since the filing date are not what the member actually earned. Not a trading signal and no implication of wrongdoing.", "url": "https://www.disclosedcapitol.com/news", "stocks": [{"t": "MRNA", "n": "網站計算的申報後漲幅極大，僅為其估算"}, {"t": "SPY", "n": "對照基準：申報後績效應與大盤比較"}]},
  {"id": "week_0", "channel": "本週事件", "tag": "總經日程", "color": "#C97DD4", "zh": "下週總經重點：10 月零售銷售預計在週二 11 月 17 日美東早上 8:30 公布，9 月的數字是月增 0.8%，高於預期的 0.3%，所以這次是在檢查消費是否降溫。FOMC 會議紀要也在下週，但我沒查到確認的日期與時間，請以 Fed 行事曆為準；下一個決策點是 12 月 8 日至 9 日的 FOMC 會議。週六美股休市，週一開盤才會反映這些消息。", "en": "Macro next week: October retail sales are scheduled for Tuesday, November 17 at 8:30 a.m. ET; September rose 0.8% versus 0.3% expected, so this checks whether consumption is cooling. FOMC minutes are also due next week, but I could not confirm the date and time, so check the Fed calendar; the next decision is the December 8-9 FOMC meeting. US markets are closed Saturday; Monday's open will reflect all of this.", "url": "https://forexfundamentals.com/economic-calendar/us-retail-sales/2026-11-17", "stocks": [{"t": "XRT", "n": "零售 ETF，零售銷售數據的直接對照"}, {"t": "XLY", "n": "可選消費 ETF，消費降溫的指標"}, {"t": "TLT", "n": "公債 ETF，數據對殖利率的反應"}]},
  {"id": "week_1", "channel": "本週事件", "tag": "重點財報", "color": "#C97DD4", "zh": "下週財報重點（預估日期來自 TheStreet，請以公司公告為準）：週二 11 月 17 日 Home Depot 與迪士尼盤前、Nvidia 盤後（預期每股盈餘 2.47 美元、營收 1,087 億美元）；週三 11 月 18 日 Target、Lowe's、TJX 盤前，Palo Alto Networks 盤後；週四 11 月 19 日 Walmart 盤前，Intuit、Ross Stores 盤後。週一只有 Tyson Foods 盤前。零售財報會直接回答「消費者撐不撐得住」。", "en": "Key earnings next week (estimated dates from TheStreet; confirm with company announcements): Tuesday November 17 Home Depot and Disney before the open, Nvidia after the close (EPS estimate $2.47, revenue $108.7 billion); Wednesday November 18 Target, Lowe's, TJX before the open and Palo Alto Networks after; Thursday November 19 Walmart before the open, Intuit and Ross Stores after. Monday has only Tyson Foods. Retail reports answer whether the consumer is holding up.", "url": "https://pro.thestreet.com/earnings/week/2026-11-16", "stocks": [{"t": "NVDA", "n": "11/17 盤後，黃仁勳辭職後首份財報"}, {"t": "WMT", "n": "11/19 盤前，防禦股高估值的代表"}, {"t": "TGT", "n": "11/18 盤前，毛利與庫存是焦點"}, {"t": "HD", "n": "11/17 盤前，利率與房市的溫度計"}]},
  {"id": "eval_0", "channel": "今日評估", "tag": "好消息被賣", "color": "#E8A838", "zh": "今天最值得注意的一件事：好消息正在被賣掉。PPI 月增低於預期、道瓊還小漲，但 Cisco 財報雙超預期卻跌 6.5%，應用材料超預期也跌 3.4%，AI 設備與雲端股在財報後一致被拋；10 年期殖利率在 5.13% 附近，12 月升息已近乎確定。市場現在要的是超大幅超預期，而不是小幅超預期。下週 Nvidia、Walmart 財報是下一道檢驗。想想：如果你持有的是漲多的 AI 股，財報小幅超預期後被賣，你原本的賣出條件是什麼？", "en": "The most notable thing today: good news is being sold. PPI came in softer than expected and the Dow even rose, yet Cisco beat on both lines and fell 6.5%, Applied Materials beat and fell 3.4%, and AI-equipment and cloud stocks were sold after earnings across the board; the 10-year is near 5.13% and a December hike is nearly certain. The market now wants big beats, not small ones. Nvidia and Walmart next week are the next test. Think: if you hold a stock that already ran up, and a small beat gets sold, what was your original exit rule?", "url": "https://cnbc.com/2026/11/12/stock-market-today-live-updates.html", "stocks": [{"t": "CSCO", "n": "財報雙超預期卻 -6.5%"}, {"t": "AMAT", "n": "財報超預期仍 -3.4%"}, {"t": "SHY", "n": "短天期公債 ETF，升息預期的溫度計"}], "status": "討論 好消息被賣掉，市場要的到底是什麼"},
