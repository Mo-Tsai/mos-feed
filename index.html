<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;

  [data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;

  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;

  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }

  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }

  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }
  .tab-nav button { background: none; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: Georgia, serif; transition: all 0.3s ease; padding: 0; line-height: 1.2; }
  .sub-pill { background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 0; transition: all 0.2s ease; border-bottom: 1px solid transparent; }
  .swipe-area { position: relative; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .card-slide { position: absolute; inset: 0; padding: 16px 32px 80px; display: flex; flex-direction: column; justify-content: flex-start; transition: transform 0.3s ease, opacity 0.3s ease; will-change: transform, opacity; overflow-y: auto; }
  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .source-link { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }
  .source-link:hover { color: var(--text-secondary); border-color: var(--text-secondary); }
  .end-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; height: 100%; }

  .word-popup-trans { font-family: system-ui, -apple-system, 'PingFang TC', sans-serif; font-size: 14px; color: var(--text-secondary); line-height: 1.6; font-weight: 300; }

  .az-input { width:100%; background:var(--bg); border:1px solid var(--divider); color:var(--text); padding:7px 10px; font-family:'Courier New',monospace; font-size:11px; outline:none; -webkit-appearance:none; appearance:none; border-radius:0; }

  .nav-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; gap:6px; padding:10px 16px 14px; background:var(--bg); border-top:1px solid var(--divider); z-index:50; }
  .nav-btn { background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:16px; cursor:pointer; padding:10px 18px; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; line-height:1; }
  .nav-btn-icon { padding:10px 14px; font-size:13px; }
  .nav-btn-icon.playing { border-color:var(--text); color:var(--text); }

  .nav-btn-lang:hover { color:var(--text-secondary); }
  @media (max-width: 420px) { .nav-btn { padding:10px 11px; } .nav-btn-icon { padding:10px 10px; } .nav-btn-lang { padding:10px 8px; min-width:34px; } }
  .nav-btn:hover { border-color:var(--text-secondary); color:var(--text); }

<body data-theme="light">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "四天交易週", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普500 ETF，上週五收7,718.60點、單日跌0.38%"}, {"t": "DIA", "n": "道瓊 ETF，上週五道瓊跌271.86點收53,414.25"}, {"t": "QQQ", "n": "那斯達克100 ETF，那斯達克綜合指數跌0.29%收26,506.99"}, {"t": "IWM", "n": "羅素2000 ETF，上週五唯一收紅、漲0.21%至2,975"}], "en": "US markets were shut Monday for Labor Day and reopen today, leaving Friday 4 September as the last full session. The Dow fell 271.86 points, or 0.51%, to 53,414.25, the S&P 500 slid 0.38% to 7,718.60 and the Nasdaq Composite dropped 0.29% to 26,506.99. For the week the S&P added 0.1%, the Dow lost 0.3% and the Nasdaq gained 0.4% — effectively a week that went nowhere. Only the Russell 2000 closed higher on Friday, up 0.21% to 2,975.", "zh": "美股週一因勞動節休市，今天恢復正常交易，所以最近一個完整交易日仍然是上週五九月四日。當天道瓊下跌兩百七十一點八六點、跌幅百分之零點五一，收在五萬三千四百一十四點二五；標普五百跌百分之零點三八收七千七百一十八點六零；那斯達克綜合指數跌百分之零點二九收兩萬六千五百零六點九九。整週來看標普漲百分之零點一、道瓊跌百分之零點三、那斯達克漲百分之零點四，等於一週白走一趟。四大指數裡只有羅素兩千在上週五收紅，上漲百分之零點二一到兩千九百七十五點。", "url": "https://www.cnbc.com/2026/09/03/stock-market-today-live-updates.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "非農打亂節奏", "color": "#E05C5C", "stocks": [{"t": "TLT", "n": "20年期以上公債 ETF，數據公布當天殖利率跳升、債券價格下挫"}, {"t": "KRE", "n": "區域銀行 ETF，升息預期升溫時利差敏感度最高的一塊"}, {"t": "GLD", "n": "黃金 ETF，升息預期回溫使金價短線承壓"}], "en": "Friday's real variable was the August payrolls report. Non-farm payrolls grew 162,000, far above the 53,000 economists polled by Dow Jones had expected, while unemployment held at 4.1% as forecast. That turned September's Fed question from vague into a live confrontation: yields jumped and equities turned red on the day. Worth remembering that July's print had missed badly in the other direction — two consecutive months pointing opposite ways.", "zh": "上週五真正的變數是八月非農就業報告。新增就業十六萬兩千人，遠高於道瓊調查的五萬三千人預估；失業率則如預期持平在百分之四點一。這份數據把「聯準會這個月到底會不會升息」從模糊變成正面對決，公債殖利率當天跳升，股市因此翻黑。要放在心上的是七月那份數據曾經大幅低於預期，連續兩個月的訊號方向完全相反，這本身就是市場現在難以定價的原因。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-04-2026"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "油價逼近98", "color": "#E05C5C", "stocks": [{"t": "XLE", "n": "能源類股 ETF，油價續強是今年最大的單一推力"}, {"t": "VLO", "n": "獨立煉油商，柴油裂解價差創紀錄的直接受惠者"}, {"t": "MPC", "n": "馬拉松石油，美國柴油價格來到2022年年中以來最高"}], "en": "Brent crude climbed toward $97 a barrel on Monday and at one point approached $98, extending last week's gains. Three forces are stacked: the US and Iran exchanging strikes, OPEC+ holding October output steady, and falling US crude inventories. Tanker traffic through the Strait of Hormuz has dropped to its lowest since May, with Tehran signalling a restricted maritime zone beyond the strait. Diesel crack spreads hit record highs in both the US and Europe, and US diesel prices reached their highest level since mid-2022.", "zh": "布蘭特原油週一升向每桶九十七美元，盤中一度逼近九十八美元，延續上週漲勢。推力有三個疊在一起：美國與伊朗互相動手、OPEC+ 決定十月產量維持不變、美國原油庫存下降。同時荷姆茲海峽的油輪通行量已降到五月以來最低，德黑蘭放話要在海峽外劃設限制海域。柴油裂解價差在美國與歐洲同步創下歷史新高，美國柴油價格來到二零二二年年中以來的最高水準，這代表壓力已經從原油轉到成品油這一端。", "url": "https://tradingeconomics.com/commodity/brent-crude-oil"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "亞歐照常開門", "color": "#E05C5C", "stocks": [{"t": "EWG", "n": "德國股市 ETF，德國10年期公債殖利率升至3.348%"}, {"t": "FXI", "n": "中國大型股 ETF，滬深300週一上漲0.44%"}, {"t": "GLD", "n": "黃金 ETF，週一在強勁就業數據後偏弱"}], "en": "With Wall Street shut, price discovery on Monday belonged to Asia and Europe. Asia-Pacific traded broadly higher — Hong Kong's Hang Seng slipped 0.15% while mainland China's CSI 300 rose 0.44% — and European stocks finished mixed, with attention still on the US-Iran conflict. German 10-year bund yields rose a basis point to 3.348% and the two-year climbed more than three basis points to 2.967%, driven by politics rather than inflation after exit polls put the far-right AfD first in Saxony-Anhalt.", "zh": "美股休市的這一天，全球價格發現完全交給亞洲與歐洲。亞太股市週一普遍走高，恆生指數微跌百分之零點一五，滬深三百上漲百分之零點四四；歐股收盤漲跌互見，市場焦點仍然是美伊衝突。德國十年期公債殖利率上升一個基點到百分之三點三四八，兩年期跳升逾三個基點到百分之二點九六七，推力來自政治而非通膨——薩克森-安哈特邦選舉的出口民調把極右翼的德國另類選擇黨推上第一。黃金則因為升息預期回溫而短線承壓。", "url": "https://www.cnbc.com/2026/09/07/stock-market-today-live-updates.html"},
    {"id": "earn_0", "channel": "財報速報", "tag": "指引殺股價", "color": "#E8786A", "stocks": [{"t": "GWRE", "n": "保險核心系統商，上週五重挫14.5%"}, {"t": "IGV", "n": "軟體類股 ETF，本輪財報季反覆出現「beat 但指引弱」的殺法"}], "en": "Guidewire Software fell 14.5% on Friday. Its fourth-quarter earnings and revenue both beat, but the revenue forecast for fiscal Q1 2027 came in below expectations and one line of guidance buried the whole report. This is the recurring pattern of the season: the market pays far less for good news already banked than it charges for bad news still ahead. Insurance core systems are a once-a-decade replacement purchase, so weak guidance immediately reads as customers pushing implementations out.", "zh": "Guidewire 上週五重挫百分之十四點五。它的第四季營收與獲利其實雙雙超出預期，但公司給的二零二七會計年度第一季營收展望低於市場預期，一句指引就把整份財報蓋過去。這是本輪財報季反覆出現的模式：市場對「已經發生的好」給的分數，遠低於對「即將發生的壞」給的懲罰。保險核心系統是換一次用十年的生意，指引一弱，市場立刻聯想到客戶把上線時程往後推。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-04-2026"},
    {"id": "earn_1", "channel": "財報速報", "tag": "牛隻短缺", "color": "#E8786A", "stocks": [{"t": "TSN", "n": "泰森食品，下修展望後上週五重挫逾7%"}, {"t": "PPC", "n": "Pilgrim's Pride，雞肉部門是牛肉成本壓力的替代出口"}, {"t": "HRL", "n": "荷美爾，同樣受美國牛隻存欄短缺影響的蛋白質加工商"}], "en": "Tyson Foods plunged more than 7% on Friday after cutting its outlook, with pressure coming from a US cattle shortage. This is a pure cost-side story: beef segment input costs are set by ranch supply, the company has almost no pricing leverage, and chicken and pork have to carry the slack. For investors it doubles as a leading indicator for inflation data — beef has been the most stubborn line in the CPI food basket all year.", "zh": "泰森食品上週五重挫逾百分之七，原因是下修全年展望，壓力來自美國牛隻存欄短缺。這是一個很純粹的成本端故事：牛肉部門的原料成本由牧場供給決定，公司幾乎沒有議價空間，只能靠雞肉與豬肉部門去補。對投資人來說它同時是通膨數據的先行指標——牛肉價格是這一年消費者物價指數食品項裡最頑固的一塊。本週五的 CPI 裡，食品這一欄值得單獨看。", "url": "https://www.schwab.com/learn/story/stock-market-update-open"},
    {"id": "earn_2", "channel": "財報速報", "tag": "今晚交卷", "color": "#E8786A", "stocks": [{"t": "GME", "n": "GameStop，今天盤後公布第二季、預估淨銷售7.8-8.0億美元"}, {"t": "BBY", "n": "百思買，實體電子零售的對照組"}, {"t": "MSTR", "n": "Strategy，同樣把資產負債表轉向比特幣的對照案例"}], "en": "GameStop reports second-quarter results after today's close, with net sales guided to $780-800 million against $972.2 million a year ago — a decline of nearly 20%. The shrinking of physical game retail is not news. The real question is how to price a company that has moved its balance sheet into cash and bitcoin: as a retailer, or as an allocation vehicle. The numbers that matter tonight are gross margin and inventory, not the revenue headline.", "zh": "GameStop 今天盤後公布第二季財報，市場預估淨銷售落在七億八千萬到八億美元之間，去年同期是九億七千兩百二十萬美元，等於年減將近兩成。實體遊戲零售的營收萎縮早就不是新聞。真正的問題是，當公司把資產負債表轉向現金與比特幣之後，市場該用零售股的邏輯還是用資產配置工具的邏輯替它定價。今晚該看的是毛利率與庫存，不是營收數字本身。", "url": "https://www.sec.gov/Archives/edgar/data/0001326380/000132638026000046/pressreleasesecondquarterp.htm"},
    {"id": "macro_0", "channel": "總經政策", "tag": "升息機率六成五", "color": "#7C6AF7", "stocks": [{"t": "XLF", "n": "金融類股 ETF，升息定價升溫時的相對受惠者"}, {"t": "TLT", "n": "長天期公債 ETF，升息機率上升直接壓抑長債價格"}, {"t": "IWM", "n": "羅素2000 ETF，對利率最敏感卻在數據當天收紅"}], "en": "August's 162,000 payroll surprise pushed the implied probability of a hike at the 15-16 September FOMC from around 50% the day before to roughly 65%. That number has swung violently in a month: about 35% before Fed Chair Kevin Warsh's hawkish Jackson Hole remarks, back to 50% after Governor Waller urged patience, and now higher again on jobs. What the market is pricing is no longer how many cuts, but whether there is a hike this month — a directional turn after 2026's cutting cycle.", "zh": "八月非農十六萬兩千人的意外強勁，把九月十五到十六日 FOMC 升息的隱含機率從前一天的約五成推到約六成五。這個數字在過去一個月劇烈擺盪：主席華許在傑克森霍爾發表偏鷹談話之前約三成五，理事沃勒呼籲耐心之後回到五成，如今又被就業數據推高。市場現在定價的不再是「要降幾碼」，而是「這個月會不會升息」。這是二零二六年連續降息之後的方向性轉彎，也是本週所有資產價格的共同分母。", "url": "https://www.roic.ai/news/rate-futures-traders-add-to-bets-on-september-fed-hike-after-bigger-than-expected-august-jobs-gain-09-04-2026"},
    {"id": "macro_1", "channel": "總經政策", "tag": "沒有官方翻譯", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，兩份數據直接決定盈虧平衡通膨率"}, {"t": "XLP", "n": "必需消費類股 ETF，通膨轉嫁能力的觀察窗口"}, {"t": "XLU", "n": "公用事業類股 ETF，資本密集、對利率路徑最敏感"}], "en": "The August PPI lands at 8:30am ET on 10 September and the August CPI at 8:30am ET on 11 September — the last two inflation prints before the FOMC. Consensus looks for core CPI to rise about 0.2% on the month, a reacceleration that is still slightly below the past year's average pace. July's PPI for final demand was unchanged, with services up 0.2% and goods down 0.7%. Both prints arrive inside the Fed's pre-meeting blackout, so there will be no official translation — the market has to read them alone.", "zh": "九月十日美東時間八點半公布八月生產者物價指數，九月十一日八點半公布八月消費者物價指數，這是 FOMC 開會前最後兩份通膨數據。市場預估核心 CPI 月增約百分之零點二，屬於再加速、但仍略低於過去一年平均的水準。作為對照，七月 PPI 最終需求月增為零，服務項漲百分之零點二、商品項跌百分之零點七。關鍵是這兩份數據落地時，聯準會官員已進入會前靜默期，沒有官方發言替市場翻譯，所有解讀都得由價格自己完成。", "url": "https://www.bls.gov/cpi/"},
    {"id": "macro_2", "channel": "總經政策", "tag": "歐洲三面夾", "color": "#7C6AF7", "stocks": [{"t": "EUFN", "n": "歐洲金融股 ETF，歐洲央行9/10決議的直接標的"}, {"t": "VGK", "n": "歐洲整體股市 ETF，政治與能源風險同時上升"}, {"t": "EWG", "n": "德國股市 ETF，邦選舉結果推升短天期公債殖利率"}], "en": "The ECB meets on 10 September, the same day as the US PPI. Europe's variable is not only rates: German 10-year bund yields sit at 3.348% and 30-year at 3.825%, while the two-year jumped more than three basis points in a session — a move driven by politics, after exit polls put the far-right AfD first in the Saxony-Anhalt state election. Layer on European diesel inventories running well below seasonal norms and the region is squeezed by politics, energy and rates at once.", "zh": "歐洲央行九月十日開會，時間點正好卡在美國 PPI 同一天。歐洲這邊的變數不只利率：德國十年期公債殖利率百分之三點三四八、三十年期百分之三點八二五，兩年期單日跳升逾三個基點，推力是政治而非通膨——薩克森-安哈特邦選舉的出口民調把極右翼政黨推上第一。再加上歐洲柴油庫存明顯低於季節性常態，歐洲同時被政治、能源與利率三件事夾住。對美股投資人來說，這決定的是資金會不會繼續往美元資產靠。", "url": "https://ic.com/blog/ic-europe-fundamental-forecast-07-september-2026/"},
    {"id": "sector_0", "channel": "產業風向", "tag": "最便宜的贏家", "color": "#4EABA4", "stocks": [{"t": "XLE", "n": "能源類股 ETF，今年以來漲約42%、本益比僅約13倍"}, {"t": "OXY", "n": "西方石油，油價年內約漲12%的直接槓桿"}, {"t": "HAL", "n": "哈里伯頓，油服端反映的是資本支出而非現貨價"}], "en": "Energy is up roughly 42% year to date, the best sector in the S&P 500, driven mainly by a 12% rise in oil and by geopolitical supply disruption. The oddity is that it is simultaneously among the cheapest sectors, trading near 13x earnings. Industrials and consumer defensives are also beating the index by a wide margin, while technology, communication services, consumer cyclicals and even financials lag. This has not been a year of tech pulling back — it has been a year of money moving from narrative into physical assets.", "zh": "能源類股今年以來上漲約百分之四十二，是標普五百裡表現最好的一塊，推力主要來自油價年內約百分之十二的漲幅與地緣供給中斷。矛盾的是它同時還是最便宜的類股之一，本益比大約十三倍。工業與必需消費也明顯優於大盤，而科技、通訊服務、非核心消費、甚至金融都在拖後腿。這不是一個「科技股回檔」的年份，而是一個資金從敘事流向實體資產的年份，而且這個動作已經走了大半年。", "url": "https://www.investing.com/news/stock-market-news/sp-500-sector-performance-energy-leads-with-42-ytd-gain-in-2026-93CH-4883146"},
    {"id": "sector_1", "channel": "產業風向", "tag": "變壓器卡住AI", "color": "#4EABA4", "stocks": [{"t": "GEV", "n": "GE Vernova，燃氣輪機在手訂單今年首季已達100吉瓦"}, {"t": "ETN", "n": "伊頓，資料中心電力分配設備的主要供應商"}, {"t": "PWR", "n": "Quanta Services，電網施工端的產能瓶頸受惠者"}, {"t": "VRT", "n": "Vertiv，資料中心供電與散熱設備"}], "en": "The real bottleneck for AI data centres is not chips but power gear. Large power transformers now average 128 weeks from order to delivery, and substation transformers have stretched from about 140 weeks in 2023 to more than 160 weeks this year. One major manufacturer's backlog grew 23% in the first half to $8.5 billion — over three years of work. US data centre capacity is projected to scale from roughly 24GW to 110GW between 2026 and 2030, and data centres could account for 40% of total US electrical equipment demand by 2030. More than half of this year's planned facilities may slip or be cancelled for lack of gear, not money.", "zh": "AI 資料中心真正的瓶頸不是晶片，是電力設備。大型電力變壓器從下單到交貨平均需要一百二十八週；變電所用的變壓器交期則從二零二三年的約一百四十週，拉長到今年的超過一百六十週。某大廠在手訂單上半年增加百分之二十三、來到八十五億美元，等於超過三年的量。美國資料中心容量預計在二零二六到二零三零年之間從約二十四吉瓦擴到一百一十吉瓦，到二零三零年將占全美電力設備需求的四成。今年規劃的資料中心已有超過一半可能延後或取消，缺的是設備不是錢。", "url": "https://www.powermag.com/transformers-in-2026-shortage-scramble-or-self-inflicted-crisis/"},
    {"id": "sector_2", "channel": "產業風向", "tag": "柴油改寫運價", "color": "#4EABA4", "stocks": [{"t": "JBHT", "n": "Hunt 運輸，北美複合運輸量能的指標公司"}, {"t": "UNP", "n": "聯合太平洋鐵路，柴油越貴、鐵路的成本優勢越明顯"}, {"t": "XPO", "n": "XPO，零擔運輸業者，燃油附加費是關鍵變數"}], "en": "The national average on-highway diesel price is around $5.65 a gallon; the official 31 August figure was $5.599, up $1.865 from a year earlier. The SONAR truckload spot index sits near $3.35 a mile, close to a 15-week low, but the industry is braced for a post-Labor-Day reversal. The dearer diesel gets, the wider the cost gap between rail and road, which is why intermodal volumes keep running above the five-year average. Manufacturing has now expanded for eight straight months with customer inventories still reported as too low — historically a leading signal for production.", "zh": "全美公路柴油均價來到每加侖約五點六五美元，八月三十一日的官方數字是五點五九九美元，比一年前貴了一點八六五美元。卡車現貨全包運價指數約每哩三點三五美元，處在近十五週的低點，但整個產業都在等勞動節之後的反轉。柴油越貴，鐵路與公路之間的成本差距就拉得越開，這也是複合運輸量持續高於五年平均的原因。製造業已連續八個月擴張、客戶端庫存仍偏低，歷史上這通常是未來幾個月生產增加的領先訊號。", "url": "https://ielfreight.com/diesel-rates-freight-market-september-2026/"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "折價34.5%", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普600小型股 ETF，成分股有連續獲利的品質門檻"}, {"t": "VTWO", "n": "Vanguard 羅素2000 ETF，今年以來漲約23%"}, {"t": "SPY", "n": "標普500 ETF，小型股今年領先它約9.1個百分點"}], "en": "The Russell 2000 is up about 23% this year, ahead of the S&P 500 by roughly 9.1 percentage points and one of its strongest starts since 1991. On valuation the main Russell 2000 ETF trades near 19.21x earnings versus 29.32x for the Russell 1000 — a 34.5% discount. On Friday it was the only major index to close green, up 0.21% to 2,975 on a day when hike odds jumped. The catch: part of this rally was built on an expectation of lower borrowing costs that is now being priced away.", "zh": "羅素兩千今年以來上漲約百分之二十三，領先標普五百約九點一個百分點，是一九九一年以來最好的年度開局之一。估值上，主要的羅素兩千 ETF 本益比約十九點二一倍，羅素一千則是二十九點三二倍，小型股折價百分之三十四點五。上週五在升息機率跳升的那一天，它反而是四大指數裡唯一收紅的，漲百分之零點二一到兩千九百七十五點。問題在於這波漲勢有相當一部分是靠「借款成本會降」的預期堆起來的，而那個預期正在被拆掉。", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "冷氣變基建", "color": "#5B8ED6", "stocks": [{"t": "FIX", "n": "Comfort Systems USA，進入2026年在手訂單119億美元創紀錄"}, {"t": "AAON", "n": "AAON，客製化空調設備商，同樣吃資料中心散熱需求"}, {"t": "EMR", "n": "艾默生，工業自動化端的對照組"}], "en": "Comfort Systems USA is the archetypal small-cap winner of this cycle: a conventional HVAC contractor that has become a mission-critical supplier of cooling for data centre construction, entering 2026 with a record $11.9 billion backlog. It illustrates the logic of this rally — not multiple repair, but one large theme spilling over into an unfashionable link in the supply chain. The caveat is that these stories have a clock: once backlog peaks, the multiple contracts faster than revenue does.", "zh": "Comfort Systems USA 是這一輪小型股裡最典型的贏家樣本：它原本是一家傳統暖通空調承包商，現在變成資料中心冷卻的關鍵供應商，進入二零二六年時在手訂單達到創紀錄的一百一十九億美元。它示範的正是這一輪小型股的邏輯——不是靠估值修復，而是靠一個大主題外溢到原本沒人看的供應鏈環節。要注意的是這種故事有時間性：訂單一旦見頂，市場給的倍數會收得比營收還快。", "url": "https://seekingalpha.com/article/4920445-russell-2000-soars-21-percent-ytd-4-top-small-cap-stocks"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "在高點鎖長約", "color": "#5B8ED6", "stocks": [{"t": "STNG", "n": "Scorpio Tankers，Q3 LR2型日均64,900美元、MR型30,000美元"}, {"t": "INSW", "n": "International Seaways，同樣吃荷姆茲繞道的噸海里效應"}, {"t": "TNK", "n": "Teekay Tankers，池內原油輪標的，現貨曝險更純"}], "en": "Scorpio Tankers updated third-quarter rates on 3 September: LR2s averaged $64,900 a day with 85% of revenue days booked, MRs $30,000 with 79%, Handymaxes $25,500 with 70%. On the same day it chartered out three vessels on three-year deals — two LR2s at $40,188 and $42,500 a day, one MR at $23,900. The question worth sitting with: when spot is paying $64,900, why lock a ship at low-$40,000s for three years? In shipping, that is one of the most honest signals management ever sends.", "zh": "Scorpio Tankers 九月三日更新第三季運價：LR2 型日均六萬四千九百美元、八成五營運日已訂；MR 型三萬美元、七成九；Handymax 兩萬五千五百美元、七成。同一天它把三艘船簽了三年期長約，兩艘 LR2 分別是每日四萬零一百八十八與四萬兩千五百美元，一艘 MR 兩萬三千九百美元。值得坐下來想的是：現貨拿得到六萬四千九百的時候，把船用四萬出頭鎖三年，管理層自己在說什麼？在航運股的判讀裡，這是最誠實的一種訊號。", "url": "https://www.globenewswire.com/news-release/2026/09/03/3355735/0/en/scorpio-tankers-inc-announces-updates-on-third-quarter-2026-tce-rates-and-time-charter-out-agreements.html"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "浮動利率的代價", "color": "#5B8ED6", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，小型股的資金來源端"}, {"t": "XLU", "n": "公用事業類股 ETF，同樣是高負債、對利率敏感的族群"}, {"t": "IWO", "n": "羅素2000成長股 ETF，獲利尚未穩定者對利率最脆弱"}], "en": "Small caps are more rate-sensitive than large caps for structural reasons, not sentimental ones: they lean harder on external financing, carry shorter-duration liabilities and hold a higher share of floating-rate debt. That is precisely why part of the Russell 2000's advance was built on softer rate forecasts — and why CME data now showing roughly a two-in-three chance of a hike this month matters. For mega-cap tech, rates are a discount-rate question; for small caps they are a quarterly interest-expense question. Read the debt structure before the P/E.", "zh": "小型股對利率的敏感度高於大型股，原因是結構性的而不是情緒性的：小公司更依賴外部融資、負債存續期間更短、浮動利率債務的占比也更高。這正是為什麼羅素兩千這一輪上漲有一部分建立在「利率會降」的預期上，而現在 CME 顯示本月升息機率接近三分之二。同一件事對大型科技股是折現率的問題，對小型股卻是每一季利息費用的問題。讀小型股行情時，第一件事應該是看它的債務結構，不是本益比。", "url": "https://www.inc.com/phil-rosen/stock-market-outlook-small-caps-russell-investing-sector/91399934"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "漲跌榜的陷阱", "color": "#5B8ED6", "stocks": [{"t": "CDTG", "n": "上週五漲幅榜第一，單日上漲43.27%"}, {"t": "BANL", "n": "上週五跌幅榜第一，單日下跌39.47%"}, {"t": "IWO", "n": "羅素2000成長股 ETF，用來對照真正的族群動能"}], "en": "On Friday's movers list CDTG rose 43.27% and BANL fell 39.47%. Moves of that size are routine in micro caps and usually come from a tiny float, thin volume and a single announcement or financing — not from a 40% change in the business. The first filter when reading this channel should be average daily dollar volume, not percentage move. Liquidity decides whether you can actually transact at the price you are looking at.", "zh": "上週五的漲跌幅榜上，CDTG 上漲百分之四十三點二七、BANL 下跌百分之三十九點四七。這種級距的單日波動在微型股是常態，成因多半是流通股數極少、成交量極低，再加上一則消息或一次募資，而不是基本面出現了百分之四十的變化。看這個頻道時，第一個過濾條件應該是日均成交金額，不是漲跌幅。流動性決定的是你能不能真的用你看到的價格成交。", "url": "https://www.chartmill.com/news/CDTG/Chartmill-54419-US-Market-Movers-Top-Gainers-and-Losers-for-September-4-2026"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "第二位到位", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月初 Q3 財報", "stocks": [{"t": "ENOV", "n": "Enovis，執行長與行政長一週內接連買進、股價貼近52週低18.52"}, {"t": "ZBH", "n": "Zimmer Biomet，骨科重建的規模對照組"}, {"t": "SNN", "n": "Smith+Nephew，同樣在做重建與運動醫學的中型同業"}], "en": "Enovis makes orthopaedic implants and bracing. When it entered the pool on 26 August the stated checkpoint was whether a second insider would follow the first — and this week the answer arrived. Chief Administrative Officer Oliver Engert bought 2,458 shares at $20.32 on 2 September (about $150,000), and CEO Damien McDonald bought 13,035 shares at $19.10-19.16 on 4 September (about $250,000), with the stock near its 52-week low of $18.52 after falling roughly 25% in a week. In parallel the company agreed to buy eCential Robotics for EUR 155 million in cash, closing what BTIG called its most notable competitive gap. Risks: Q2 adjusted operating margin fell 6.7 points year on year to 4.5%, tariff costs are unquantified, and BMO cut its target to $27 from $30 while keeping Outperform. This is a research lead, not investment advice.", "zh": "Enovis 是骨科植入物與護具廠商。八月二十六日入池時我們寫下的驗證點是「會不會出現第二位內部人跟進」，這一週答案來了：行政長 Oliver Engert 九月二日以每股二十點三二美元買進兩千四百五十八股、約十五萬美元；執行長 Damien McDonald 九月四日再以十九點一零到十九點一六美元買進一萬三千零三十五股、約二十五萬美元，當時股價貼近五十二週低點十八點五二、一週內跌了約兩成五。同一時間公司宣布以一億五千五百萬歐元現金收購 eCential Robotics，補上手術機器人這塊被 BTIG 稱為「最明顯競爭缺口」的空白。風險要說清楚：第二季調整後營業利益率年減六點七個百分點到百分之四點五、關稅成本未定，BMO 已把目標價從三十降到二十七雖仍維持優於大盤。這是研究線索，不是投資建議。", "url": "https://www.investing.com/news/stock-market-news/top-insider-buys-and-sells-disclosed-for-friday-93CH-4890644"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "同業替它背書", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報", "stocks": [{"t": "ASC", "n": "Ardmore Shipping，自己給的Q3指引僅29,600美元/日"}, {"t": "STNG", "n": "Scorpio Tankers，實際Q3 MR型日均30,000美元、七成九已訂"}, {"t": "TNK", "n": "Teekay Tankers，池內原油輪標的，運價結構不同但同一地緣邏輯"}], "en": "When Ardmore Shipping entered the pool on 7 September, the awkward part of the thesis was that Q2 realised $51,870 a day while the company's own Q3 guidance was just $29,600 — a bull case that had to be balanced by management saying next quarter gets worse. On 3 September Scorpio disclosed actual Q3 MR rates of $30,000 a day with 79% of revenue days booked, which puts a real-world floor under Ardmore's guidance rather than contradicting it. The difference is that Scorpio chose to lock ships into long charters while Ardmore stays exposed to spot. Risk: if the Hormuz situation eases, rates fall faster than they rose. Research lead, not investment advice.", "zh": "Ardmore Shipping 九月七日入池時，論點裡最尷尬的一塊是：第二季實現日收五萬一千八百七十美元，公司自己給的第三季指引卻只有兩萬九千六百美元，多頭論述得靠「公司自己說下一季會變差」來平衡。九月三日 Scorpio 揭露第三季 MR 型實現運價三萬美元、七成九營運日已訂，等於用真實數字替 Ardmore 的指引畫了一條下限，而不是打臉。差別在於 Scorpio 選擇把船鎖成長約，Ardmore 仍留在現貨。風險是荷姆茲局勢一旦緩解，運價回落的速度會比上漲時更快。研究線索，不是投資建議。", "url": "https://www.investing.com/news/company-news/scorpio-tankers-reports-q3-tce-rates-charters-out-three-vessels-93CH-4887475"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "今晚就驗證", "color": "#C9A227", "status": "RADAR · 驗證點今日盤後到期", "stocks": [{"t": "AVO", "n": "Mission Produce，今天盤後公布截至7/30的FQ3"}, {"t": "FDP", "n": "Fresh Del Monte，同樣吃產地價格波動的生鮮供應商"}, {"t": "DOLE", "n": "Dole，生鮮農產配銷的規模對照組"}], "en": "Mission Produce reports fiscal Q3 (ended 30 July) after today's close — the checkpoint we set for this pool name. Last quarter revenue was $290.9 million with avocado volume up 15%, but a 30% price decline from Mexican oversupply drove a $7.2 million net loss. So tonight has exactly one question: can volume growth cover the price fall. It also doubles as a live case study in whether an agricultural producer is an inflation beneficiary or an inflation victim. Research lead, not investment advice.", "zh": "Mission Produce 今天盤後公布截至七月三十日的第三季財報，這正是池內這一檔的既定驗證點。上一季它的營收兩億九千零九十萬美元、酪梨出貨量年增百分之十五，但墨西哥供給過剩讓價格年減三成，最後認列七百二十萬美元淨損。所以今晚只有一個問題：量的成長能不能補回價的下跌。它同時是一個現成案例，用來檢驗「農產品公司到底是通膨的受惠者還是受害者」這個常被講反的問題。研究線索，不是投資建議。", "url": "https://www.globenewswire.com/news-release/2026/08/25/3350869/0/en/mission-produce-to-release-fiscal-third-quarter-2026-financial-results-on-tuesday-september-8-2026.html"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "新名字·印刷股的誤會", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報", "stocks": [{"t": "DFIN", "n": "Donnelley Financial，董事9/1-9/2買進約100萬美元"}, {"t": "WK", "n": "Workiva，財報申報與監理合規軟體的直接同業"}], "en": "Donnelley Financial Solutions runs the filing and compliance workflow behind public-company disclosure, yet the market still prices it as a printer. Q2 net sales were $224.2 million, up 2.8%, with software at $99.4 million, up 7.8%, now 44.3% of revenue; adjusted EBITDA was $82.3 million for a record quarterly margin of 36.7%. The stock still fell 14.2% to $44.48 on soft Q3 guidance and a 15% decline in print. Between 1 and 2 September director Joseph Leo Binz bought roughly $1.0 million of stock at $47.75-48.52. Risks: print still erodes 5-6% a year and filing volumes track the IPO cycle. Research lead, not investment advice.", "zh": "Donnelley Financial Solutions 做的是上市公司財報與監理文件的申報合規流程，但市場到現在仍然把它當印刷股定價。第二季總營收兩億兩千四百二十萬美元、年增百分之二點八，其中軟體業務九千九百四十萬、年增百分之七點八，占比已達百分之四十四點三；調整後 EBITDA 八千兩百三十萬美元、利潤率百分之三十六點七創單季紀錄。即使如此，股價仍因第三季指引偏弱與印刷業務年減百分之十五而當日下跌百分之十四點二到四十四點四八美元。九月一日到二日，董事 Joseph Leo Binz 以四十七點七五到四十八點五二美元買進約一百萬美元。風險是印刷每年仍有百分之五到六的結構性衰退，且申報量與 IPO 循環綁在一起。研究線索，不是投資建議。", "url": "https://www.investing.com/news/company-news/dfin-q2-2026-slides-software-drives-record-margins-despite-print-decline-93CH-4825274"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "新名字·只有一個訊號", "color": "#C9A227", "status": "RADAR · 下一個驗證點 下一份季報的現金可撐月數", "stocks": [{"t": "ATRA", "n": "Atara Biotherapeutics，董事9/4以9.6美元買進104,166股"}, {"t": "XBI", "n": "生技類股 ETF，臨床期公司的族群風險對照"}], "en": "Atara Biotherapeutics is a thinly covered clinical-stage biotech. On 4 September director Brian N. Cherry bought 104,166 shares at $9.60, about $1.0 million — an open-market purchase of that size is unusual in a micro-cap biotech and is worth logging. But it must be said plainly: this is one signal with no second line of evidence, and Advantage Solutions sits in the same pool as the standing lesson that eighteen insider buys over a year can still fail to produce a fundamental turn. For clinical-stage companies the real line is cash runway and trial read-out timing, not how much an insider bought. Research lead, not investment advice.", "zh": "Atara Biotherapeutics 是一家覆蓋極少的臨床期生技公司。九月四日董事 Brian N. Cherry 以每股九點六美元買進十萬四千一百六十六股、金額約一百萬美元；這種整數規模的公開市場買進在微型市值生技裡少見，所以值得記錄。但要非常誠實地說：這只有一個訊號，沒有第二條交叉驗證。池內的 Advantage Solutions 就是活教材——內部人一年買了十八次、零賣出，基本面到頭來還是沒兌現。臨床期公司真正的生死線是現金可撐月數與試驗讀數時間表，不是內部人買了多少錢。研究線索，不是投資建議。", "url": "https://www.investing.com/news/stock-market-news/top-insider-buys-and-sells-disclosed-for-friday-93CH-4890644"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "新名字·升息受惠", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月下旬 Q3 財報", "stocks": [{"t": "CVCY", "n": "Community West Bancshares，上半年淨息差擴大38個基點至4.45%"}, {"t": "HFWA", "n": "Heritage Financial，同屬對利率敏感的西岸社區銀行"}, {"t": "MCB", "n": "Metropolitan Bank，管理層預期不靠降息也能推升淨息差"}], "en": "Community West Bancshares is a small central-California community bank with almost no sell-side coverage. For the six months to 30 June its net interest margin on a fully tax-equivalent basis widened from 4.07% to 4.45% — 38 basis points in half a year. With the market now pricing a possible hike, a small bank whose assets reprice faster than its deposits is a direct beneficiary, and here the degree of neglect is roughly inverse to the degree of benefit. Three risks: commercial real estate exposure, deposit-cost competition, and the fact that if September brings no hike, half the external tailwind disappears. Research lead, not investment advice.", "zh": "Community West Bancshares 是加州中部的小型社區銀行，幾乎沒有券商覆蓋。截至六月三十日的上半年，以稅務等價基礎計算的淨息差從去年同期的百分之四點零七擴大到百分之四點四五，半年增加三十八個基點。在市場開始替升息定價的當下，這種資產端重定價速度快於負債端的小銀行是直接受惠者，而它被忽視的程度剛好跟受惠的程度成反比。風險有三：商用不動產曝險、存款成本競爭，以及如果九月最後沒有升息，這條外部順風就消失一半。研究線索，不是投資建議。", "url": "https://www.sec.gov/Archives/edgar/data/0001127371/000162828026055293/cvcy-20260630.htm"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "兩位還不算群聚", "color": "#6DB56D", "stocks": [{"t": "ENOV", "n": "Enovis，本週兩位高管買進，尚未達三位的群聚門檻"}, {"t": "DFIN", "n": "Donnelley Financial，單一董事百萬美元買進"}, {"t": "ATRA", "n": "Atara Biotherapeutics，單一董事百萬美元買進"}], "en": "The academic definition of a cluster buy is three or more independent insiders purchasing within a five-day window; research suggests such signals generate roughly twice the excess return of a single-insider buy, front-loaded in the first 21 to 60 trading days and decaying as the information diffuses. Last week Enovis produced two buyers (CEO and CAO) while Donnelley Financial and Atara each produced one. The honest reading: two is below the threshold and one is well below it. Turning \"someone bought\" into \"you should buy\" is the most common error in this channel.", "zh": "學術上「群聚買進」的定義是五個交易日內有三位以上獨立內部人各自買進；研究顯示這種訊號的超額報酬大約是單一內部人買進的兩倍，而且集中在事件後的二十一到六十個交易日，之後隨著資訊擴散而衰減。上週 Enovis 出現執行長與行政長兩位買進，Donnelley Financial 與 Atara 則各只有一位董事。誠實的判讀是：兩位還沒到門檻，一位更不到。把「有人買」直接讀成「所以該買」，是這個頻道最常見的錯誤。", "url": "https://www.form4api.com/guides/cluster-buy-signals"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "跌深才買", "color": "#6DB56D", "stocks": [{"t": "BABA", "n": "阿里巴巴，執行長在股價今年走弱後買進自家股票"}, {"t": "CSGP", "n": "CoStar，同樣出現執行長逆勢加碼"}, {"t": "KLAR", "n": "Klarna，第三家執行長買進的公司，三家合計逾2,000萬美元"}], "en": "There was also a large-cap insider group last week: the CEOs of Alibaba, Klarna and CoStar bought over $20 million of their own stock combined, with all three names struggling this year. A CEO's purchase carries more information than a typical director's, because they see operations most completely and face the tightest reporting and trading-window constraints. But two things need separating: buying after a fall can be a value judgement, or it can be the first time a board has asked for a bigger stake. Beyond the dollar amount, look at what fraction of that person's net worth it represents.", "zh": "這一週還有一組大型股的內部人買進：阿里巴巴、Klarna 與 CoStar 三家公司的執行長合計買進超過兩千萬美元自家股票，而這三檔今年的股價都不好看。執行長買自家股票的資訊價值高於一般董事，因為他們對營運的了解最完整，受到的申報與交易窗口限制也最嚴。但要區分兩件事：跌深後的買進可能是價值判斷，也可能只是任內第一次被董事會要求增加持股。看金額之外，更該看的是這筆錢占這個人身家的比例。", "url": "https://finance.yahoo.com/markets/stocks/articles/3-ceos-buying-millions-dollars-112500691.html"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "賣出不等於看空", "color": "#6DB56D", "stocks": [{"t": "CAI", "n": "Caris Life Sciences，高管9/3行權100萬股同時處分39.31萬股"}, {"t": "XBI", "n": "生技類股 ETF，新上市生技公司的申報密度特別高"}], "en": "On 3 September a Caris Life Sciences executive exercised options on 1,000,000 shares at $2.44 and disposed of 393,100 shares at a weighted average of $24.7604. On a Form 4 that looks like heavy insider selling; in substance it is post-exercise selling to cover tax and lock in part of the gain, which is a different event from an unprompted open-market sale. Always read the transaction code first: P is an open-market purchase, S a sale, M an option exercise. Only P carries high information content — the rest is mostly a by-product of how compensation is structured.", "zh": "九月三日 Caris Life Sciences 一位高管以每股二點四四美元行使一百萬股選擇權，同時以加權均價二十四點七六零四美元處分三十九萬三千一百股。這在 Form 4 上看起來像是「內部人大賣」，實際上是行權之後賣掉一部分繳稅與鎖住獲利，跟主動在公開市場拋售是兩件事。讀 Form 4 一定要先看交易代碼：P 是公開市場買進、S 是賣出、M 是選擇權行使。只有 P 的資訊含量最高，其餘多半是薪酬結構的副產品。", "url": "https://www.investing.com/news/stock-market-news/top-insider-buys-and-sells-disclosed-for-friday-93CH-4890644"},
    {"id": "capitol_0", "channel": "政要持股", "tag": "押在電力側", "color": "#B5654D", "stocks": [{"t": "BE", "n": "Bloom Energy，揭露當日股價上漲約5%"}, {"t": "INTC", "n": "英特爾，本身就是 Bloom Energy 資料中心電力系統的客戶"}, {"t": "FCEL", "n": "FuelCell Energy，同一天連帶上漲約4%"}, {"t": "PLUG", "n": "Plug Power，同一天上漲約2%"}], "en": "Filings made public on 24 August show the Pelosi household acquired 15,000 Bloom Energy Class A shares in two transactions dated 24 and 28 July, plus 200 call options struck at $100 expiring 17 June 2027. The same filing shows 10,000 Intel shares bought on 24 July in the $500,001-$1,000,000 band, alongside 50 Intel calls struck at $50 with the same expiry, in the $250,001-$500,000 band. Using the disclosure bands, the combined position is reported at roughly $4.25 million to $14.5 million. The theme is unambiguous: not the compute side of AI but the power side — Intel is itself a Bloom Energy customer for data-centre power systems. On the day of disclosure Bloom rose about 5%, FuelCell 4% and Plug Power 2%.", "zh": "八月二十四日公開的申報顯示，Pelosi 家戶在七月二十四日與七月二十八日分兩筆取得一萬五千股 Bloom Energy A 股，另外持有兩百口履約價一百美元、二零二七年六月十七日到期的買權。同一份申報還有七月二十四日買進的一萬股英特爾，申報區間五十萬到一百萬美元，以及五十口履約價五十美元、同一到期日的英特爾買權，區間二十五萬到五十萬美元。依申報區間換算，這一組交易合計約四百二十五萬到一千四百五十萬美元。這筆錢押的主題很清楚：不是 AI 的運算側，而是 AI 的電力側——英特爾本身就是 Bloom Energy 資料中心電力系統的客戶。消息當天 Bloom Energy 漲約百分之五，FuelCell 漲百分之四、Plug Power 漲百分之二。", "url": "https://www.thestreet.com/investing/stocks/nancy-pelosi-buys-intc-intel-stock-be-bloom-energy-stock"},
    {"id": "capitol_1", "channel": "政要持股", "tag": "判讀·四十五天", "color": "#B5654D", "stocks": [{"t": "NANC", "n": "追蹤民主黨議員申報部位的 ETF，本身就承受45天延遲"}, {"t": "GOP", "n": "追蹤共和黨議員申報部位的 ETF，對照組"}], "en": "This channel's source is the STOCK Act Periodic Transaction Report, filed up to 45 days after the trade — so what you see is always a 45-day-old price. The second problem is that it gives ranges, not numbers: the $4.25 million to $14.5 million band on the previous card spans a factor of 3.4, which is not precise enough to size anything. What actually carries information is the option parameters — a $100 strike expiring June 2027 encodes the assumption \"above $100 within a year\", not a vague long-term view. And anyone copying the trade is buying after the stock has already moved 5% on the disclosure itself. This channel records only that someone put real money behind a theme; it is not a recommendation to buy or sell anything.", "zh": "這個頻道的資料來源是 STOCK Act 的定期交易報告，法定申報期限是交易後四十五天，所以你看到的永遠是四十五天前的價位。第二層問題是它只給區間不給數字：上一張卡那組交易的「四百二十五萬到一千四百五十萬」，上下限差了三點四倍，這種精度沒辦法拿來推算部位大小。真正有資訊量的是選擇權的參數——履約價一百美元、二零二七年六月到期，編碼的假設是「一年內要站上一百」，而不是模糊的長期看好。最後，跟單者買到的是揭露當天已經漲過百分之五的價格。這裡只記錄「有人用真錢押了哪個主題」，不做任何買賣建議。", "url": "https://www.congress.gov/crs_external_products/TE/HTML/TE10073.html"},
    {"id": "week_0", "channel": "本週事件", "tag": "四天塞四件事", "color": "#C97DD4", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，9/10 PPI 與 9/11 CPI 的直接標的"}, {"t": "XLF", "n": "金融類股 ETF，9/15-16 FOMC 的主要對照"}, {"t": "VGK", "n": "歐洲股市 ETF，9/10 歐洲央行決議同日登場"}], "en": "This is a four-session week. August PPI lands at 8:30am ET on 10 September, the same day the ECB meets; August CPI follows at 8:30am ET on 11 September; then the FOMC convenes on 15-16 September. Consensus has core CPI up about 0.2% on the month. The crucial detail is that Fed officials are already inside the pre-meeting blackout, so neither inflation print will come with an official interpretation. That is why intraday swings this week could be larger than the data itself justifies.", "zh": "這一週只有四個交易日，卻排滿了事情：九月十日美東時間八點半公布八月生產者物價指數，同一天歐洲央行開會；九月十一日八點半公布八月消費者物價指數；接著九月十五到十六日就是 FOMC。市場預估核心 CPI 月增約百分之零點二。關鍵細節是聯準會官員已進入會前靜默期，兩份通膨數據落地時都不會有官方發言替市場翻譯。這也是為什麼這一週的日內波動，有可能比數據本身該有的幅度更劇烈。", "url": "https://www.kiplinger.com/investing/stocks/17494/next-week-earnings-calendar-stocks"},

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;

    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;

      {card.stocks && card.stocks.length > 0 && (

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums" }}>{r.n}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>
                      <span style={{ color:"#6DB56D" }}>{r.buy}</span>
                      <span style={{ color:"var(--text-tertiary)" }}> / </span>
                      <span style={{ color:"#E05C5C" }}>{r.sell}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>{money(r.lo)}–{money(r.hi)}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      {r.top.map(t => (
                        <a key={t} href={"https://www.tradingview.com/symbols/" + t + "/"} target="_blank" rel="noopener noreferrer"
                           style={{ color:"var(--text-secondary, inherit)", textDecoration:"none", marginRight:"7px", fontFamily:"'Courier New',monospace" }}>{t}</a>
                      ))}
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px" }}>共 {r.distinct} 檔</span>
                    </td>
                    <td style={{ padding:"7px 0 7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", whiteSpace:"nowrap" }}>{r.last}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ padding:"12px 16px 0", fontSize:"10px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            只涵蓋眾議院；參議院走另一套 efdsearch 系統，尚未納入。買＋賣不一定等於筆數，差額是交換（exchange）類交易。
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/08/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v10.3</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
