(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

  {"id": "earn_1", "channel": "財報速報", "tag": "Meta 資本支出", "color": "#E8786A", "zh": "Meta 把 2026 年資本支出區間上調到 1,350 億至 1,450 億美元，股價週四重挫約 7%，週五盤前跌幅收斂。這個數字之所以重要，是因為微軟、Alphabet、亞馬遜本週都要公布自己的資本支出，市場會拿 Meta 當成基準。關鍵不在金額大不大，而在雲端營收成長能不能追上支出成長。", "en": "Meta raised its 2026 capital expenditure range to $135 billion to $145 billion, and the stock dropped about 7% Thursday before pared losses in Friday premarket trading. The figure matters because Microsoft, Alphabet and Amazon report their own spending this week and the market will use Meta as the yardstick. The question is not whether the number is large but whether cloud revenue growth can keep up with spending growth.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-23-dow-sp-500-nasdaq-tesla-meta-093000521.html", "stocks": [{"t": "META", "n": "Meta，資本支出區間 1,350 億至 1,450 億美元"}, {"t": "MSFT", "n": "微軟，本週三盤後公布財報"}, {"t": "AMZN", "n": "亞馬遜，本週四公布財報"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "財報季進度", "color": "#E8786A", "zh": "第三季標普 500 成分股獲利預期年增超過 30%，本週是本季最密集的一週：根據 FinWire 的說法，約三分之一的標普 500 公司會在這幾天公布。微軟與 Alphabet 週三盤後、亞馬遜週四公布。獲利成長是強的，所以本週的焦點會是前瞻指引與資本支出，而不是單季數字本身。", "en": "Third-quarter S&P 500 earnings are on track to rise more than 30% year on year, and this is the densest week of the season, with about a third of S&P 500 companies reporting, according to FinWire. Microsoft and Alphabet report Wednesday after the close and Amazon on Thursday. With growth already strong, the focus will be forward guidance and capital spending rather than the quarter's numbers themselves.", "url": "https://finwire.io/news/stock-markets-news/wall-streets-week-ahead-earnings-flood-fed-meeting-pose-pivotal-tests-for-rickety-ai-market-rally", "stocks": [{"t": "MSFT", "n": "微軟，週三盤後公布"}, {"t": "GOOGL", "n": "Alphabet，週三盤後公布"}, {"t": "INTC", "n": "英特爾，本週公布財報"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "聯準會決策", "color": "#7C6AF7", "zh": "聯準會週三（10/28）下午 2 點公布利率決策。FinanceFeeds 引述的經濟學家調查顯示，100 位受訪者中有 94 位預期維持利率不變，而 100 位全部預期 12 月升息；其他報導引用的利率期貨定價，12 月升息機率約 75% 至 83%。所以本週的重點不是決策本身，而是聲明與記者會有沒有為 12 月鋪路。", "en": "The Fed announces its decision Wednesday, Oct. 28 at 2 p.m. ET. In an economist survey cited by FinanceFeeds, 94 of 100 expect a hold and all 100 expect a December hike, while other reports put futures odds of a December hike at roughly 75% to 83%. The point this week is not the decision itself but whether the statement and press conference pave the way for December.", "url": "https://financefeeds.com/fed-decision-wednesday-94-of-100-economists-expect-a-hold-and-all-100-a-december-hike-what-the-statement-has-to-say-for-gold-oil-and-bitcoin", "stocks": [{"t": "TLT", "n": "長天期美債 ETF，對 12 月升息預期最敏感"}, {"t": "SHY", "n": "短天期美債 ETF，反映政策利率預期"}, {"t": "UUP", "n": "美元指數 ETF，鷹派預期的受惠方向"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "殖利率落差", "color": "#7C6AF7", "zh": "十年期美債殖利率週五收 4.988%。值得注意的是週四殖利率才出現近四年來最大的單日跌幅，隔天就又回到 5% 附近，來回幅度很大。殖利率每天這樣震盪，對股票估值的影響比單日漲跌更大，因為高成長股的現金流折現對利率最敏感。", "en": "The 10-year Treasury yield closed Friday at 4.988%. Notably, Thursday saw its biggest one-day drop in nearly four years, and it was back near 5% a day later. Daily swings like this matter more for equity valuations than any single day's price move, because discounted cash flows of high-growth stocks are the most rate-sensitive.", "url": "https://www.abc.net.au/news/2026-10-26/asx-markets-business-live-news-october-26/107306820", "stocks": [{"t": "IEF", "n": "7 至 10 年期美債 ETF，殖利率來回震盪的直接對照"}, {"t": "QQQ", "n": "那斯達克 100 ETF，長期現金流對利率最敏感"}, {"t": "SCHD", "n": "高股息 ETF，防禦型對照"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "全球央行週", "color": "#7C6AF7", "zh": "不只聯準會：澳洲央行（RBA）11 月升息的定價約三分之二，預期到明年 2 月已完全定價升息；加拿大央行週三被預期升息 25 個基點，紐西蘭央行也幾乎被完全定價升息。多國央行同時偏鷹，代表外匯與跨國資金流向會被聯準會的措辭牽動。", "en": "It is not only the Fed: markets price about two-thirds odds of an RBA hike in November with a hike fully priced by February, the Bank of Canada is expected to hike 25 bps on Wednesday and a New Zealand hike is nearly fully priced. Several central banks leaning hawkish at once means currency and cross-border flows will react to the Fed's wording.", "url": "https://www.abc.net.au/news/2026-10-26/asx-markets-business-live-news-october-26/107306820", "stocks": [{"t": "FXA", "n": "澳幣 ETF，RBA 11 月升息的對照"}, {"t": "FXC", "n": "加幣 ETF，加拿大央行週三決策"}, {"t": "UUP", "n": "美元指數 ETF，各國升息預期的對照"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "電信重摔", "color": "#4EABA4", "zh": "AT&T 與 T-Mobile 週五各下跌近 8%，起因是報導指出 SpaceX 洽談租用美國約 8 萬座基地台站點，被解讀為想成為第四家無線電信業者。市場擔心的是競爭與定價壓力，而不是短期獲利；不過也有分析認為，既有業者的地面網路與頻譜資產仍有價值，反應可能過度。", "en": "AT&T and T-Mobile each fell nearly 8% Friday after reports that SpaceX was in talks to lease space on about 80,000 US cell sites, read as a push to become a fourth wireless carrier. The market worry is competition and pricing pressure rather than near-term profit, though some analysts argue the incumbents' terrestrial networks and spectrum still matter and the reaction may be overdone.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-23-dow-sp-500-nasdaq-tesla-meta-093000521.html", "stocks": [{"t": "T", "n": "AT&T，週五約 -8%"}, {"t": "TMUS", "n": "T-Mobile，週五約 -8%"}, {"t": "VZ", "n": "Verizon，週一公布財報，同樣受衝擊"}, {"t": "AMT", "n": "American Tower，電信基地台租賃，受益或受害要看租約"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "能源與航空", "color": "#4EABA4", "zh": "標普 500 能源類股週五上漲約 2.5%，創歷史新高；同一天，聯合、達美、美國航空因燃油成本上升走弱。油價對板塊的影響是同一個數字的兩面。下週埃克森美孚與雪佛龍財報，會檢驗能源獲利是否真的跟得上油價。", "en": "The S&P 500 energy sector rose about 2.5% Friday to a record, while United, Delta and American Airlines weakened on higher fuel costs. Oil's effect on sectors is two sides of the same number. Exxon Mobil and Chevron report next, which will test whether energy earnings really keep pace with crude.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-23-dow-sp-500-nasdaq-tesla-meta-093000521.html", "stocks": [{"t": "XOM", "n": "埃克森美孚，即將公布財報"}, {"t": "CVX", "n": "雪佛龍，即將公布財報"}, {"t": "UAL", "n": "聯合航空，燃油成本上升走弱"}, {"t": "DAL", "n": "達美航空，同上"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "資安逆勢", "color": "#4EABA4", "zh": "週五資安類股在大盤走弱時逆勢上漲：Palo Alto Networks、Cloudflare、SailPoint 各漲超過 7%，起因是 Evercore ISI 的調查指出企業資安預算展望轉強，Okta 與 Fortinet 也被點名有強勁的訂單管線。資安 ETF CIBR 五天約上漲 7%。這張卡的重點是預算排序：AI 支出升高時，資安常被視為必要而非可選。", "en": "On Friday cybersecurity stocks rose against a weak tape: Palo Alto Networks, Cloudflare and SailPoint each gained more than 7% after an Evercore ISI survey pointed to a stronger enterprise security budget outlook, with Okta and Fortinet also cited for strong pipelines. The CIBR ETF rose about 7% over five days. The point is budget priority: as AI spending rises, security is often treated as necessary rather than optional.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-23-dow-sp-500-nasdaq-tesla-meta-093000521.html", "stocks": [{"t": "PANW", "n": "Palo Alto Networks，漲逾 7%"}, {"t": "NET", "n": "Cloudflare，漲逾 7%"}, {"t": "OKTA", "n": "Okta，被點名訂單管線強"}, {"t": "FTNT", "n": "Fortinet，被點名訂單管線強"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "區間整理", "color": "#5B8ED6", "zh": "羅素 2000 上週五收 2,775.90，下跌 0.29%；對照 10/20 的收盤 2,773.42，三個交易日幾乎原地踏步，週四收 2,784.03 是區間高點。小型股沒有直接暴露在 AI 資本支出的疑慮裡，但同樣受到十年期殖利率貼近 5% 的壓力。這個窄幅整理，是在等 10/28 聯準會的措辭。", "en": "The Russell 2000 closed Friday at 2,775.90, down 0.29%, against 2,773.42 on Oct. 20, so it barely moved over three sessions, with Thursday's 2,784.03 the range high. Small caps are not directly exposed to AI capex worries but feel the same pressure from a 10-year yield near 5%. The narrow range looks like a wait for the Fed's wording on Oct. 28.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-23-dow-sp-500-nasdaq-tesla-meta-093000521.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，窄幅整理"}, {"t": "IJR", "n": "標普小型 600 ETF，品質較高的小型股對照"}, {"t": "KRE", "n": "區域銀行 ETF，淨息差與存款成本的指標"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "利息保障倍數", "color": "#5B8ED6", "zh": "判讀小型股財報有個比本益比更實用的數字：利息保障倍數，也就是營業利益除以利息費用。小型公司負債中浮動利率比重較高，殖利率貼近 5% 時，這個倍數會比大型股掉得更快；低於 3 倍通常代表獲利很容易被利息吃掉。看小型股財報時先查這個數字，再談成長。", "en": "A more practical number than the P/E for reading small-cap results is interest coverage: operating income divided by interest expense. Small companies carry more floating-rate debt, so with yields near 5% the ratio falls faster than for large caps, and below about 3x earnings are easily eaten by interest. When reading a small-cap report, check this number before talking about growth.", "url": "https://www.nasdaq.com/articles/vanguard-russell-2000-etf-insider-buying-index-registering-11.0", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，利率敏感度的代表"}, {"t": "SLYV", "n": "標普小型 600 價值 ETF，對照負債較重的類型"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "電信小型連動", "color": "#5B8ED6", "zh": "電信重摔不只影響 AT&T 與 T-Mobile。依賴基地台租賃的公司，例如 American Tower、Crown Castle、SBA Communications，在 SpaceX 傳聞中也曾被拖累；其中 Crown Castle 與 SBA 市值較小，對租約續約與客戶集中度更敏感。這是一個消息如何沿著供應鏈往中小型股傳導的例子。", "en": "The telecom sell-off did not stop at AT&T and T-Mobile. Tower-lease companies such as American Tower, Crown Castle and SBA Communications were also hit when SpaceX's mobile plans surfaced, and the smaller ones, Crown Castle and SBA, are more sensitive to lease renewals and customer concentration. It is an example of news travelling down the supply chain to smaller stocks.", "url": "https://www.morningstar.com/news/marketwatch/20260805394/why-att-verizon-and-t-mobile-shares-are-down-after-spacexs-earnings", "stocks": [{"t": "CCI", "n": "Crown Castle，基地台租賃，客戶集中度高"}, {"t": "SBAC", "n": "SBA Communications，同上"}, {"t": "XLC", "n": "通訊服務 ETF，電信板塊對照"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "Alpha Metallurgical", "color": "#C9A227", "zh": "這家公司做什麼：美國冶金煤（煉鋼用煤）生產商。為什麼被忽視：煤炭被許多機構排除在持股之外，加上近期獲利轉虧。什麼正在改變：10/23 提前公布第三季初步數字，賣出 390 萬噸，非 GAAP 實現價格每噸 121.09 美元、成本每噸 106.93 美元，淨損 930 萬美元（每股 0.73 美元），調整後 EBITDA 2,940 萬美元；帳上現金 3.341 億美元、無借款、長期債務僅 1,060 萬美元，累計買回約 710 萬股、約 12 億美元，流通股剩 12,667,855 股。風險：價格波動壓縮獲利、仍在虧損，且第三季買回只有約 300 萬美元，比過去慢很多，第四季與 2027 展望要等 11/6。以上是研究線索，不是投資建議。", "en": "What it does: a US producer of metallurgical (steelmaking) coal. Why it is overlooked: many institutions exclude coal, and earnings have turned to a loss. What is changing: on Oct. 23 it pre-released Q3, selling 3.9 million tons at a non-GAAP realized price of $121.09 per ton against $106.93 cost, a net loss of $9.3 million ($0.73 per share) and adjusted EBITDA of $29.4 million; it holds $334.1 million of cash, has no borrowings and $10.6 million of long-term debt, and has repurchased about 7.1 million shares for roughly $1.2 billion, leaving 12,667,855 shares outstanding. Risks: price volatility is squeezing margins, it is still loss-making, and Q3 buybacks were only about $3.0 million, much slower than before; Q4 and 2027 outlook wait for Nov. 6. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001704715/000170471526000038/a102326preliminarypressrel.htm", "stocks": [{"t": "AMR", "n": "Alpha Metallurgical，雷達池內，11/6 完整財報"}, {"t": "BTU", "n": "Peabody，煤炭同業對照"}], "status": "RADAR · 下一個驗證點 11/6 完整第三季財報與 2027 展望"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "Bank of Marin", "color": "#C9A227", "zh": "這家公司做什麼：加州北灣（Marin County）的社區銀行，服務當地中小企業與屋主。為什麼被忽視：市值小、幾乎沒有大型券商追蹤。什麼正在改變：Q2 非利息支出下降 94.2 萬美元至 2,160 萬美元，存款較去年同期成長 3.8%，新放款殖利率升到 6.53%；9 月內部人買進。今天（10/26，太平洋時間 8:30）召開 Q3 電話會議，去年同期淨利 750 萬美元、每股 0.47 美元，是對照基準。風險：存款較上季下降 1.7%、商用不動產風險仍在。以上是研究線索，不是投資建議。", "en": "What it does: a community bank in Marin County, north of San Francisco, serving local small businesses and homeowners. Why it is overlooked: small market cap and almost no large-broker coverage. What is changing: Q2 non-interest expense fell $942,000 to $21.6 million, deposits are up 3.8% year on year and the yield on new loans rose to 6.53%, with insider buying in September. Today (Oct. 26, 8:30 a.m. PT) it holds its Q3 call, with last year's net income of $7.5 million ($0.47 per share) as the benchmark. Risks: deposits fell 1.7% from the prior quarter and commercial real estate risk remains. This is a research lead, not investment advice.", "url": "https://finviz.com/news/398414/bank-of-marin-bancorp-to-webcast-q3-earnings-on-monday-october-26-2026-at-8-30-am-pt", "stocks": [{"t": "BMRC", "n": "Bank of Marin，今天 10/26 Q3 電話會議"}, {"t": "KRE", "n": "區域銀行 ETF，同業對照"}], "status": "RADAR · 今天 10/26 Q3 電話會議（太平洋時間 8:30）"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "MSG Rangers", "color": "#C9A227", "zh": "這家公司做什麼：由 MSG Sports 分拆出來的紐約遊騎兵（Rangers）業務，MSG Sports 將更名為 MSG Knickerbockers（MSGK）。為什麼被忽視：分拆案常有被動賣壓與覆蓋不足。什麼正在改變：登記日為 10/20，每持有 2 股 MSG Sports 配發 1 股 MSG Rangers，分配日 10/26，預計 10/27 起以正式方式交易；10/21 起已有 when-issued 交易。風險：完成仍取決於 Form 10 生效、聯盟最終批准與稅務意見等條件。以上是研究線索，不是投資建議。", "en": "What it does: the New York Rangers business being spun off from MSG Sports, which will be renamed MSG Knickerbockers (MSGK). Why it is overlooked: spin-offs often face passive selling and thin coverage. What is changing: the record date was Oct. 20, holders get one MSG Rangers share for every two MSG Sports shares, the distribution is Oct. 26 and regular-way trading is expected from Oct. 27, with when-issued trading since Oct. 21. Risks: completion still depends on the Form 10 taking effect, final league approval and a tax opinion. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001636519/000119312526409143/d126791dex991.htm", "stocks": [{"t": "MSGR", "n": "MSG Rangers，10/27 預計正式交易"}, {"t": "MSGS", "n": "MSG Sports，母公司，將更名 MSG Knickerbockers"}], "status": "RADAR · 下一個驗證點 10/27 預計正式交易"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "GameStop 執行長", "color": "#6DB56D", "zh": "GameStop 執行長 Ryan Cohen 在 10/2 公開市場買進 70 萬股，加權均價 24.41 美元（約 1,700 萬美元），10/13 又買進 844,130 股，價格 26.75 與 27.00 美元（約 2,280 萬美元）。報導指出申報沒有註明 10b5-1 計畫，13D/A 顯示他持股約 9.1%（含認股權證）。10/14 開盤價 27.71 美元，股價幾乎沒有反應。買進是事實，但大股東買進的理由很多，不等於基本面轉折。", "en": "GameStop CEO Ryan Cohen bought 700,000 shares in the open market on Oct. 2 at a weighted average of $24.41 (about $17 million) and another 844,130 shares on Oct. 13 at $26.75 and $27.00 (about $22.8 million). Coverage notes the filings carry no 10b5-1 plan marker, and the 13D/A shows a stake of about 9.1% including warrants. GameStop opened at $27.71 on Oct. 14, barely reacting. The buying is a fact, but a large holder buys for many reasons, which is not the same as a fundamental turn.", "url": "https://247wallst.com/investing/2026/10/14/ryan-cohen-told-investors-to-bet-against-him-on-the-same-day-he-bought-22-8-million-more/", "stocks": [{"t": "GME", "n": "GameStop，執行長 10/2 與 10/13 兩次公開市場買進"}]},
