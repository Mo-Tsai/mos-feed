<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;

  [data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;

  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;

  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }

  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }

  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }
  .tab-nav button { background: none; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: Georgia, serif; transition: all 0.3s ease; padding: 0; line-height: 1.2; }
  .sub-pill { background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 0; transition: all 0.2s ease; border-bottom: 1px solid transparent; }
  .swipe-area { position: relative; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .card-slide { position: absolute; inset: 0; padding: 16px 32px 80px; display: flex; flex-direction: column; justify-content: flex-start; transition: transform 0.3s ease, opacity 0.3s ease; will-change: transform, opacity; overflow-y: auto; }
  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .source-link { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }
  .source-link:hover { color: var(--text-secondary); border-color: var(--text-secondary); }
  .end-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; height: 100%; }

  .word-popup-trans { font-family: system-ui, -apple-system, 'PingFang TC', sans-serif; font-size: 14px; color: var(--text-secondary); line-height: 1.6; font-weight: 300; }

  .az-input { width:100%; background:var(--bg); border:1px solid var(--divider); color:var(--text); padding:7px 10px; font-family:'Courier New',monospace; font-size:11px; outline:none; -webkit-appearance:none; appearance:none; border-radius:0; }

  .nav-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; gap:6px; padding:10px 16px 14px; background:var(--bg); border-top:1px solid var(--divider); z-index:50; }
  .nav-btn { background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:16px; cursor:pointer; padding:10px 18px; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; line-height:1; }
  .nav-btn-icon { padding:10px 14px; font-size:13px; }
  .nav-btn-icon.playing { border-color:var(--text); color:var(--text); }

  .nav-btn-lang:hover { color:var(--text-secondary); }
  @media (max-width: 420px) { .nav-btn { padding:10px 11px; } .nav-btn-icon { padding:10px 10px; } .nav-btn-lang { padding:10px 8px; min-width:34px; } }
  .nav-btn:hover { border-color:var(--text-secondary); color:var(--text); }

<body data-theme="light">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "升息週的週線", "color": "#E05C5C", "zh": "上週是聯準會三年來第一次升息的一週，收盤的形狀是分裂的：道瓊全週跌約 1.6% 到 1.7%，是三月以來最差的一週；標普 500 小跌約 0.1% 收在 7,650 點附近；那斯達克反而漲約 0.7%。羅素 2000 全週跌 1.83%，是四大指數裡最弱的一個。週五單日三大指數幾乎打平（道瓊 -0.13%、標普 +0.11%、那斯達克 +0.39%），沒有恐慌，但也沒有人願意加碼。週末沒有開市，今天讀這份晨報的重點不是找新消息，是把上週那件已經發生的事想清楚：利率的假設被改掉了，而價格還沒完全反應。", "en": "Last week was the week of the Fed's first rate hike in three years, and the tape closed split: the Dow fell roughly 1.6-1.7% for the week, its worst since March; the S&P 500 slipped about 0.1% to around 7,650; the Nasdaq actually gained about 0.7%. The Russell 2000 dropped 1.83%, the weakest of the four. Friday itself was a near-flat session (Dow -0.13%, S&P +0.11%, Nasdaq +0.39%) - no panic, but no appetite either. With markets shut over the weekend, the job today is not to hunt for news but to digest what already happened: the rate assumption changed, and prices have not fully caught up.", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-18-2026", "stocks": [{"t": "DIA", "n": "道瓊 ETF，全週跌約 1.6%，是主要指數裡最差的一週"}, {"t": "SPY", "n": "標普 500 ETF，全週約 -0.1%，指數面幾乎沒動"}, {"t": "QQQ", "n": "那斯達克 100 ETF，全週約 +0.7%，唯一收紅的大型指數"}, {"t": "IWM", "n": "羅素 2000 ETF，全週 -1.83%，升息第一個壓到的就是它"}]},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "曲線在變平", "color": "#E05C5C", "zh": "十年期美國公債殖利率上週收在 5.00% 附近，是 2007 年以來的高檔區。真正的重點不是這個數字本身，而是曲線的形狀：聯準會升息推高的是短端，長端因為市場對成長的預期沒那麼樂觀，漲幅跟不上，整條曲線在變平。借短放長的生意會先感覺到——區域銀行的存款與市場資金成本立刻跟著短端走，但手上長天期放款的收益率是慢慢才調整的。這是同一件事對不同資產的兩種解釋，不要用「殖利率漲＝銀行賺錢」這種舊直覺套。", "en": "The 10-year Treasury yield ended last week near 5.00%, its highest zone since 2007. The number matters less than the shape: the Fed is pushing the front end up, while the long end lags because growth expectations are not keeping pace - the curve is flattening. Businesses that borrow short and lend long feel it first. Regional banks' deposit and wholesale funding costs reprice with the front end immediately, while yields on long-dated loans on the books adjust only slowly. Do not apply the old reflex that rising yields automatically mean banks earn more.", "url": "https://www.cnbc.com/2026/09/16/fed-rate-decision-september-2026.html", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，長端殖利率站上 5% 區間，價格承壓"}, {"t": "IEF", "n": "7-10 年期公債 ETF，曲線中段是判斷「平不平」最直接的位置"}, {"t": "KRE", "n": "區域銀行 ETF，借短放長的代表，曲線變平時利差被兩頭夾"}]},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "油價站在 100", "color": "#E05C5C", "zh": "西德州原油上週五收在每桶 100.30 美元、布蘭特 103.87 美元，整週仍漲逾 8%，是近四個月最高。推升的理由不在需求，在供給的不確定：中東緊張與對俄羅斯煉油設施的攻擊，讓俄國把成品油出口禁令延長到 9 月 30 日。原油站上 100 美元對美股是雙面刃——它把能源類股的現金流墊高，同時把每一份 CPI 與 PCE 的能源分項往上推，而聯準會現在對通膨的容忍度比半年前低很多。本週沒有 CPI 也沒有 PCE，油價就變成市場唯一能即時讀到的通膨溫度計。", "en": "WTI closed Friday at $100.30 a barrel and Brent at $103.87, still up more than 8% on the week and the highest in nearly four months. The driver is not demand but supply uncertainty: Middle East tension and strikes on Russian refining assets pushed Moscow to extend its product export ban through September 30. Crude above $100 cuts both ways for US equities - it lifts energy cash flows while pushing the energy component of every CPI and PCE print higher, and the Fed's tolerance for inflation is now much lower than it was six months ago. With no CPI or PCE this week, oil becomes the only real-time inflation gauge the market can read.", "url": "https://energynewsbeat.co/diesel/diesel-crack-spread-hits-record-highs-as-the-global-downstream-market-is-hit-by-drones-and-oil-shortages/", "stocks": [{"t": "USO", "n": "西德州原油 ETF，週五收 100.30 美元、整週漲逾 8%"}, {"t": "BNO", "n": "布蘭特原油 ETF，收 103.87 美元，反映的是國際供給缺口"}, {"t": "XLE", "n": "能源類股 ETF，油價站上 100 是整個板塊現金流的地板"}, {"t": "OXY", "n": "上游純度高的大型油商，油價彈性最直接的觀察標的"}]},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "指數說不清楚", "color": "#E05C5C", "zh": "上週最值得記住的不是指數收在哪裡，而是指數與成分股的分歧：那斯達克整週收紅，但漲的集中在少數 AI 基建與晶片股；等權重的標普 500 表現明顯輸給市值加權，代表中位數那一檔股票其實是跌的。這種形狀在歷史上不是立刻的賣出訊號，但它降低了指數作為判斷工具的解析度——當三十檔股票決定七千點的方向，看指數會誤判自己手上的部位。本週要看的是寬度能不能回來，而不是指數能不能再創新高。", "en": "The most important thing about last week was not where the indices closed but how far they diverged from their own constituents: the Nasdaq finished green, but the gains were concentrated in a handful of AI-infrastructure and chip names. The equal-weight S&P 500 clearly lagged the cap-weighted version, meaning the median stock actually fell. Historically this shape is not an immediate sell signal, but it lowers the resolution of the index as a judgment tool - when thirty stocks set the direction of seven thousand points, watching the index will mislead you about your own book. What matters this week is whether breadth returns, not whether the index makes a new high.", "url": "https://www.cnbc.com/2026/09/17/stock-market-today-live-updates.html", "stocks": [{"t": "RSP", "n": "等權重標普 500 ETF，落後市值加權版本＝中位數個股在跌"}, {"t": "SPY", "n": "市值加權標普 500，靠少數大型股撐住整週的平盤"}, {"t": "XLK", "n": "科技類股 ETF，上週撐住指數的就是這一塊裡的少數名字"}]},
    {"id": "earn_0", "channel": "財報速報", "tag": "FedEx 的第一個裸考", "color": "#E8786A", "zh": "FedEx 在 9 月 17 日交出 2027 會計年度第一季，這是它分拆掉零擔貨運（FedEx Freight，6 月 1 日獨立掛牌）之後第一個「沒有貨運部門遮蔽」的季度。市場預估調整後每股盈餘 3.65 美元、營收 217.8 億美元，年增不到 1%。關鍵不在有沒有小贏，而在兩個結構問題：第一，柴油價格 7 月到 8 月漲一成、9 月續漲，燃油附加費能不能真的轉嫁出去；第二，拿掉貨運之後，剩下的快遞本體成長率到底長什麼樣子。這是整個物流板塊今年最乾淨的一次體檢。", "en": "FedEx reported fiscal 2027 first quarter results on September 17 - its first clean quarter after spinning off its less-than-truckload arm, FedEx Freight, which began trading separately on June 1. The Street looked for adjusted EPS of $3.65 on revenue of $21.78 billion, growth of under 1% year over year. The point is not a small beat or miss but two structural questions: whether fuel surcharges can actually pass through diesel costs that rose 10% from July to August and kept climbing in September, and what the underlying express business growth rate really looks like once Freight is stripped out. This is the cleanest read on the logistics sector all year.", "url": "https://pomegra.io/news/fedex-q1-fy2027-can-fuel-surcharges-hold", "stocks": [{"t": "FDX", "n": "分拆後第一份季報，營收 217.8 億、年增不到 1%"}, {"t": "FDXF", "n": "6/1 獨立掛牌的 LTL 純業，母公司數字是它的對照組"}, {"t": "UPS", "n": "同業對照，柴油轉嫁能力與快遞量能的另一個讀數"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "Lennar 說了實話", "color": "#E8786A", "zh": "Lennar 9 月 17 日的第三季把住宅市場的真實狀況攤開來：淨利年減 52% 到 2.84 億美元，GAAP 每股盈餘 1.19 美元（去年同期 2.29 美元），營收 80 億美元，房屋銷售毛利率 15.8%。交屋 20,840 戶、年減 3%，新訂單 20,879 戶、年減 9%，全年交屋指引下修到 8.0 萬至 8.1 萬戶。管理層選擇了「保量不保價」，所以量的衰退看起來溫和，痛全部集中在毛利率上。這是判讀建商股最重要的一課：看交屋數會以為還好，看毛利率才知道發生什麼事。", "en": "Lennar's third quarter on September 17 laid the housing market bare: net earnings fell 52% to $284 million, GAAP EPS of $1.19 versus $2.29 a year ago, on revenue of $8.0 billion, with a home sales gross margin of 15.8%. Deliveries of 20,840 homes were down 3% and new orders of 20,879 were down 9%, and full-year delivery guidance was cut to 80,000-81,000 homes. Management chose volume over margin, so the volume decline looks mild while all the pain sits in the gross margin line. That is the key lesson for reading homebuilders: deliveries make it look fine, the margin tells you what actually happened.", "url": "https://www.fool.com/earnings/call-transcripts/2026/09/17/lennar-len-q3-2026-earnings-call-transcript/", "stocks": [{"t": "LEN", "n": "Q3 淨利 -52%、毛利率 15.8%、全年交屋下修到 8.0-8.1 萬戶"}, {"t": "PHM", "n": "同業對照，看保量或保價的策略選擇是否一致"}, {"t": "TOL", "n": "高價位建商，客層利率敏感度較低，是分層的另一端"}, {"t": "XHB", "n": "住宅建商 ETF，本週四新屋銷售是下一個檢查點"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "Costco 週四盤後", "color": "#E8786A", "zh": "本週財報只有一檔真正有全市場意義：Costco 在 9 月 24 日盤後公布會計年度第四季與全年。在油價 100 美元、升息剛定案的環境裡，它是最乾淨的「消費者到底還撐不撐得住」樣本——因為它的獲利有一大半來自會員費，這是一筆不隨單次消費波動的年繳訂閱收入。三個要看的地方：會員續約率有沒有鬆動、同店銷售裡食品與非食品的分岔（非食品先退就是消費降級的證據）、以及電商佔比。在沒有 CPI 也沒有 PCE 的一週，這份財報就是本週最高解析度的通膨與消費讀數。", "en": "Only one report this week carries market-wide meaning: Costco posts fiscal fourth quarter and full year results after the close on September 24. With oil at $100 and a rate hike just locked in, it is the cleanest sample of whether the consumer is still holding up, because a large share of its profit comes from membership fees - an annual subscription that does not swing with any single shopping trip. Three things to watch: any softening in renewal rates, the split between food and non-food comparable sales (non-food rolling over first is the evidence of trading down), and the e-commerce mix. In a week with no CPI and no PCE, this is the highest-resolution inflation and consumption read available.", "url": "https://www.kiplinger.com/investing/stocks/17494/next-week-earnings-calendar-stocks", "stocks": [{"t": "COST", "n": "9/24 盤後公布 FQ4 與全年，會員費是本週最乾淨的消費讀數"}, {"t": "WMT", "n": "大型量販對照組，食品佔比更高、降級受惠者的代表"}, {"t": "BJ", "n": "同為會員制倉儲的小型對照，客層所得中位數較低、先反應"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "12 比 0", "color": "#7C6AF7", "zh": "9 月 16 日的 FOMC 以 12 比 0 全票通過升息一碼，聯邦資金利率目標區間來到 3.75% 至 4.00%，這是 2023 年 7 月以來第一次升息。比決議更重要的是點陣圖：18 位與會者有 16 位預期年底前還會再升一次，其中 4 位認為可能再升兩次，年底利率預測落在 4.1% 至 4.4%。後續年度沒有任何升息的點，2028 與 2029 各有一碼降息。翻成白話就是：聯準會認為這是一次「把利率抬回夠高、然後停很久」的操作，不是一個升息循環的開始。市場現在爭的不是會不會再升，是停在哪裡、停多久。", "en": "The FOMC voted 12-0 on September 16 to raise rates by 25 basis points to a target range of 3.75%-4.00%, the first hike since July 2023. The dot plot matters more than the decision: 16 of 18 participants expect another increase before year-end, four of them see two more as possible, and year-end projections sit between 4.1% and 4.4%. There are no hikes penciled in for later years, with one cut each indicated for 2028 and 2029. In plain terms, the Fed sees this as lifting rates high enough and then holding for a long time, not the start of a hiking cycle. The debate is no longer whether there is another hike, but where it stops and for how long.", "url": "https://www.cnbc.com/2026/09/16/fed-rate-decision-september-2026.html", "stocks": [{"t": "SHY", "n": "1-3 年期公債 ETF，直接反映政策利率路徑的重新定價"}, {"t": "BIL", "n": "短天期國庫券 ETF，3.75-4% 的現金收益率是所有資產的比較基準"}, {"t": "UUP", "n": "美元指數 ETF，升息定案後利差對匯率的傳導"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "沒有數據的一週", "color": "#7C6AF7", "zh": "本週的行事曆有一個特徵：沒有重量級通膨數據。八月 PCE 物價指數要到 9 月 30 日才公布，CPI 也不在本週。真正有資訊量的只有週三的九月製造業與服務業採購經理人指數初值——它是唯一能在 FOMC 之後第一時間告訴你「升息有沒有立刻打到實體需求」的高頻指標。其餘是週一的芝加哥聯準會全國活動指數與官員談話、週四的初領失業金與 Q2 經常帳、以及週四的八月新屋銷售。數據真空的一週通常不是平靜的一週，因為市場會把任何一則官員發言放大成政策訊號。", "en": "This week's calendar has one defining feature: no heavyweight inflation print. August PCE does not land until September 30, and there is no CPI. The only genuinely informative release is Wednesday's flash September manufacturing and services PMIs - the one high-frequency gauge that can tell you, right after the FOMC, whether the hike is already biting real demand. The rest is Monday's Chicago Fed National Activity Index and Fed speakers, Thursday's jobless claims and Q2 current account, and Thursday's August new home sales. A data vacuum is usually not a quiet week, because the market will magnify any official remark into a policy signal.", "url": "https://www.eoption.com/weekly-event-calendar-09-21-2026-09-25-2026/", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，數據真空時反映的是預期而非實績"}, {"t": "IEF", "n": "中期公債，週三 PMI 初值是本週唯一能撼動它的數字"}, {"t": "XLU", "n": "公用事業類股，利率敏感度高、在數據真空週容易被殖利率牽著走"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "不只美國在升", "color": "#7C6AF7", "zh": "全球央行本週各走各的：中國人民銀行週一公布貸款市場報價利率、瑞士央行週四開會、加拿大央行總裁週一有談話。背景是日本央行已經把政策利率升到 1.25%，但日圓反而走貶——這件事告訴我們，當多個主要央行同時緊縮，匯率就不再由單一利差決定，而是由「誰的實質利率先轉正」決定。對美股投資人的實際意義是：過去十年那套「日本便宜資金流出去買全球資產」的套利結構正在鬆動，而這個鬆動的受害者通常不是大型股，是流動性薄的那一端。", "en": "Global central banks are diverging this week: the People's Bank of China sets its loan prime rate on Monday, the Swiss National Bank meets Thursday, and the Bank of Canada governor speaks Monday. The backdrop is that the Bank of Japan has already lifted its policy rate to 1.25% while the yen weakened anyway - which tells you that when several major central banks tighten at once, exchange rates stop being set by a single rate differential and start being set by whose real rate turns positive first. For US equity investors the practical implication is that the decade-long structure of cheap Japanese funding flowing out to buy global assets is loosening, and the casualties of that loosening are usually not large caps but the thin end of the liquidity spectrum.", "url": "https://www.litefinance.org/blog/analysts-opinions/weekly-economic-calendar-for-21092026-27092026/", "stocks": [{"t": "FXY", "n": "日圓 ETF，日本升息到 1.25% 但日圓仍貶，利差邏輯失效"}, {"t": "EWJ", "n": "日本股市 ETF，日圓弱勢對出口權值股是順風"}, {"t": "FXI", "n": "中國大型股 ETF，週一 LPR 是本週亞洲時段的第一個變數"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "煉油的紀錄行情", "color": "#4EABA4", "zh": "今年最強的不是 AI，是煉油。美國超低硫柴油裂解價差 9 月初突破每桶 106 美元、寫下歷史紀錄，超過 2022 年能源危機時的任何讀數；Valero、Marathon Petroleum、HF Sinclair、Phillips 66 一度連漲六週。原因有三個疊在一起：對俄羅斯煉油設施的攻擊讓莫斯科把成品油出口禁令延到 9 月 30 日、歐洲補庫、美國煉廠開工率超過 97% 已經沒有餘裕。反方論點同樣清楚——CNBC 統計，煉油股這種近乎史無前例的連漲，歷史上結束得很快，因為裂解價差是均值回歸最強的商品價差之一。", "en": "The strongest trade this year is not AI, it is refining. The US ultra-low sulfur diesel crack spread broke $106 a barrel in early September, a record that exceeds anything seen during the 2022 energy crisis, and Valero, Marathon Petroleum, HF Sinclair and Phillips 66 ran up for six straight weeks. Three things stack up: strikes on Russian refining assets pushed Moscow to extend its product export ban through September 30, Europe is restocking, and US refineries running above 97% utilization have no slack left. The bear case is just as clear - CNBC notes that runs of this kind in refiner stocks have historically ended quickly, because crack spreads are among the most mean-reverting commodity spreads there are.", "url": "https://www.cnbc.com/2026/09/14/whats-next-for-oil-refiners-after-an-unprecedented-run-to-all-time-highs.html", "stocks": [{"t": "PSX", "n": "大型煉油商，連漲六週的四檔之一，柴油曝險高"}, {"t": "CVI", "n": "中型煉油商，沒有指數資金追捧、與裂解價差的連動更純"}, {"t": "DK", "n": "二疊紀與墨西哥灣煉油，負債比高、對價差最敏感的一檔"}, {"t": "CRAK", "n": "煉油 ETF，要看板塊而非單一公司的風險時用這個"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "變壓器要等兩年", "color": "#4EABA4", "zh": "資料中心的瓶頸已經從晶片移到供電，而供電的瓶頸是硬體交期。配電變壓器目前的交期是 18 到 24 個月，因為國內產能同時要應付老舊設備汰換與新增的資料中心負載。數字看得見：Hubbell 的美洲電氣部門第二季有機營收成長 18%，滾動十二個月訂單年增 41%、六月底在手訂單比去年同期高 33%；Powell Industries 2026 會計年度第三季在手訂單年增 69% 到 24 億美元，其中包含一筆金額超過 4 億美元的超大型資料中心訂單。這個板塊的特徵是：需求是合約，不是預期，所以在升息環境裡比大部分成長股耐打。", "en": "The data center bottleneck has moved from chips to power, and the power bottleneck is hardware lead times. Distribution transformers now run 18 to 24 months, because domestic capacity has to cover both aging-equipment replacement and new data center load. The numbers are visible: Hubbell's Electrical Americas segment grew organic sales 18% in the second quarter, with trailing twelve-month orders up 41% and June backlog 33% above a year ago. Powell Industries grew fiscal 2026 third quarter backlog 69% year over year to $2.4 billion, including a single mega data center order worth more than $400 million. What distinguishes this group is that the demand is contracted, not forecast, which makes it more durable in a tightening cycle than most growth stocks.", "url": "https://www.fool.com/investing/2026/09/17/3-grid-equipment-stocks-are-riding-the-same-boom-o/", "stocks": [{"t": "HUBB", "n": "美洲電氣有機營收 +18%、在手訂單較去年同期高 33%"}, {"t": "POWL", "n": "FQ3 在手訂單年增 69% 到 24 億，含單筆逾 4 億超大訂單"}, {"t": "ETN", "n": "同樣受惠變壓器短缺，規模大、但成長率被稀釋"}, {"t": "GEV", "n": "電網設備與發電端，交期緊俏的另一個受惠者"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "銀行的算式變了", "color": "#4EABA4", "zh": "區域銀行是今年表現最好的板塊之一，KRE 年漲約 28%，理由是存款成本從高點回落：整體來看，第二季利息支出佔平均生息資產比重從一年前的 2.41% 降到 2.16%，整整二十五個基點。問題是這個順風的前提是「政策利率往下或持平」。聯準會升息之後算式反過來——短端上去，銀行的存款與市場資金成本立刻跟著上去；長端因為曲線變平沒有同幅上升，手上長天期放款的收益率又是慢慢才重新訂價。本季財報季（十月中開始）要盯的不是每股盈餘，是淨息差的方向與存款貝塔（deposit beta）到底恢復了多少。", "en": "Regional banks have been one of the best sectors this year, with KRE up about 28%, on the back of falling deposit costs: interest expense as a share of average earning assets fell from 2.41% a year ago to 2.16% in the second quarter, a full 25 basis points. But that tailwind assumed a flat-to-lower policy rate. After the hike the arithmetic inverts - the front end rises and deposit and wholesale funding costs follow immediately, while a flattening curve means the long end does not rise as much and yields on long-dated loans already on the books reprice only slowly. When earnings season starts in mid-October, the line to watch is not EPS but the direction of net interest margin and how much deposit beta has come back.", "url": "https://www.kavout.com/market-lens/is-the-regional-banking-sector-finally-turning-a-corner", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，年漲約 28%，但升息後的假設要重算"}, {"t": "CFG", "n": "淨息差曾年增 24 個基點到 3.14%，是存款成本回落的代表"}, {"t": "KEY", "n": "曾上調全年淨利息收入指引到 9-10% 成長，現在要重新檢視"}, {"t": "IAT", "n": "另一檔銀行類 ETF，成分偏大型，與 KRE 的分歧值得追蹤"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "最好的一年，最差的一週", "color": "#5B8ED6", "zh": "羅素 2000 今年到目前為止仍漲約 20%，是 1991 年以來最好的年初表現；但上週跌 1.83%，而且自 8 月 13 日高點以來已經回落 6.45%。轉折點非常清楚，就是聯準會的升息定案。這個對比本身就是今年最重要的一課：小型股的超額報酬在利率預期往下的階段來得又快又大，在利率預期反轉的階段也還回去得一樣快。它不是一個「長期比較好」的資產類別，它是一個對資金成本槓桿倍數很高的資產類別，方向對的時候很甜。", "en": "The Russell 2000 is still up about 20% year to date, its best start to a year since 1991 - yet it fell 1.83% last week and is now 6.45% below its August 13 high. The inflection point is unambiguous: the Fed's hike. That contrast is the year's most important lesson. Small-cap excess returns arrive fast and large when rate expectations are falling, and they are given back just as fast when those expectations reverse. This is not an asset class that is structurally better over time; it is an asset class with high leverage to the cost of money, which is lovely when the direction is right.", "url": "https://www.fool.com/investing/2026/09/09/this-vanguard-etf-sp-500-nasdaq-100-2026-reckoning/", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，上週 -1.83%、自 8/13 高點 -6.45%"}, {"t": "VTWO", "n": "另一檔羅素 2000 ETF，費用率較低，長期持有的替代"}, {"t": "IJR", "n": "標普 600 小型股 ETF，成分有獲利門檻，與羅素的分歧是重點"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "32% 對 6%", "color": "#5B8ED6", "zh": "高盛的估算是今年最實用的一個數字：羅素 2000 成分股裡約 32% 持有浮動利率債務，標普 500 只有 6%。這不是統計趣聞，它直接決定一碼升息會從誰的損益表裡拿走錢。怎麼自己查：翻公司 10-Q 或 10-K 的「Debt」附註，看它把借款拆成固定與浮動兩類的那張表，再看循環信用額度（revolving credit facility）的動用餘額——那幾乎必然是浮動的。第二個要看的是到期時程表（maturity schedule），2027 到 2028 年要再融資的部位，現在就已經知道會用比原來高的利率換掉。", "en": "Goldman Sachs' estimate is the most practical number of the year: about 32% of Russell 2000 constituents carry floating rate debt, against just 6% of the S&P 500. That is not a statistical curiosity - it determines whose income statement a 25 basis point hike takes money out of. How to check it yourself: open the Debt note in a company's 10-Q or 10-K, find the table splitting borrowings into fixed and floating, then look at the drawn balance on the revolving credit facility, which is almost always floating. The second thing to read is the maturity schedule: anything refinancing in 2027-2028 is already known to be swapping into a higher rate.", "url": "https://finance.yahoo.com/news/russell-2000-outperform-p-500-155346998.html", "stocks": [{"t": "IWN", "n": "羅素 2000 價值型 ETF，槓桿較高的公司集中在這一端"}, {"t": "VBR", "n": "小型價值 ETF，與成長型的分歧可以看出是不是純利率因素"}, {"t": "SLYV", "n": "標普 600 小型價值，有獲利門檻，是「債務壓力」的對照組"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "兩個小型股指數", "color": "#5B8ED6", "zh": "很多人把「小型股」當一個東西，其實市場上兩個主要的小型股指數是兩種生物。羅素 2000 是純粹按市值排名取第 1001 到 3000 名，不問公司賺不賺錢，所以裡面有相當比例是長期虧損的公司；標普 600 有獲利門檻，納入前要求連續獲利。在資金寬鬆的年份，羅素 2000 因為含有更多高貝他、高本夢比的名字而跑贏；在資金收緊的年份，這個成分差異就會反過來咬人。要買「小型股」之前，先決定你買的是市值定義還是獲利定義——這一個選擇對報酬的影響，通常大於選哪一檔個股。", "en": "Many people treat small caps as one thing, but the two main small-cap indices are different animals. The Russell 2000 simply takes ranks 1001 to 3000 by market value and asks nothing about profitability, so a meaningful share of its members lose money persistently. The S&P 600 applies an earnings screen and requires a record of profitability before inclusion. In easy-money years the Russell outperforms because it holds more high-beta, high-multiple names; in tightening years that same composition difference bites. Before buying small caps, decide whether you are buying the market-cap definition or the profitability definition - that choice usually matters more to returns than which single stock you pick.", "url": "https://www.proshares.com/browse-all-insights/insights/is-the-small-cap-slumber-over", "stocks": [{"t": "IJR", "n": "標普 600，納入前要求連續獲利，是「有獲利門檻」的那一邊"}, {"t": "SPSM", "n": "另一檔標普 600 ETF，費用率更低的同類選擇"}, {"t": "IWO", "n": "羅素 2000 成長型，高貝他名字最集中，升息時跌最兇"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "本週的壓力點", "color": "#5B8ED6", "zh": "本週小型股真正的壓力點在週四的八月新屋銷售，而不是任何一則聯準會發言。理由是傳導鏈很短：房貸利率跟著十年期殖利率走，十年期站上 5%，看屋到簽約的轉換率就掉；Lennar 上週已經先替全行業說了——新訂單年減 9%、全年交屋指引下修。大型建商有自己的金融部門可以補貼利率，小型建商與建材、安裝、屋頂配件這一整串供應鏈沒有這個工具，衰退會直接打在毛利率上。看新屋銷售時記得看的是「未售出庫存月數」，那比單月銷售數字更早告訴你事情的方向。", "en": "The real pressure point for small caps this week is Thursday's August new home sales, not any Fed speech. The transmission chain is short: mortgage rates follow the 10-year yield, and with the 10-year above 5% the conversion rate from showing to contract falls. Lennar already said it for the whole industry last week - new orders down 9% and full-year delivery guidance cut. Large builders have captive finance arms to buy down rates; small builders and the building products, installation and roofing supply chain behind them do not, so the slowdown lands straight on gross margin. When the release lands, read months of unsold inventory rather than the headline monthly number - it turns first.", "url": "https://investrade.com/weekly-event-calendar-09-21-2026-09-25-2026/", "stocks": [{"t": "GRBK", "n": "小型建商，德州與東南部為主，沒有大型金融部門可補貼利率"}, {"t": "IBP", "n": "住宅隔熱安裝商，量的衰退直接打在毛利率上"}, {"t": "BLDR", "n": "建材通路，是整條供應鏈裡最早反映簽約量的環節"}, {"t": "XHB", "n": "住宅建商 ETF，週四新屋銷售是本週唯一的房市數據"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "分拆潮在生小公司", "color": "#5B8ED6", "zh": "今年有一批新的小型股不是 IPO 生出來的，是大公司分拆出來的：Middleby 在 7 月 6 日把食品加工事業分拆成 Midera Food Processing 獨立掛牌；Flex 已送件 Form 10，要把雲端與電力基礎建設事業拆成獨立公司；Corteva 的種子與基因事業 Vylor 下週就要除權。分拆股有一個共同的結構性現象：母公司的指數型基金與大型法人因為持股規範，會在分拆後被迫賣出這家「太小、不在我的指數裡」的新公司，造成與基本面無關的賣壓。這是機會，也是陷阱——賣壓多久結束沒有人說得準，而新公司的第一份財報往往才是真正的考試。", "en": "A batch of new small caps this year came not from IPOs but from corporate separations: Middleby spun its food processing business into Midera Food Processing as a standalone listing on July 6; Flex has filed a Form 10 to separate its Cloud and Power Infrastructure business; and Corteva's seed and genetics arm, Vylor, goes ex next week. Spin-offs share one structural feature: index funds and large institutions holding the parent are often forced by mandate to sell the new company because it is too small or outside their benchmark, creating selling pressure unrelated to fundamentals. That is both the opportunity and the trap - nobody can tell you when the forced selling ends, and the new company's first reported quarter is usually the real exam.", "url": "https://www.insidearbitrage.com/spinoffs/", "stocks": [{"t": "MFP", "n": "Middleby 於 7/6 分拆出來的食品加工純業，首份完整獨立季報在 11 月"}, {"t": "MIDD", "n": "分拆後的母公司，看「剩下的本體」評價有沒有重估"}, {"t": "FLEX", "n": "已送件 Form 10，要分拆雲端與電力基礎建設事業"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "被大煉油商蓋住", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報", "zh": "Par Pacific 做的是夏威夷、太平洋西北與懷俄明的區域煉油加零售（自有加油站與便利商店），這三個市場的共同特徵是進口替代成本高、競爭者少。為什麼被忽視：柴油裂解價差創紀錄的新聞全被 Valero、Marathon Petroleum、Phillips 66 這些大型股吸走，市值小得多的區域煉油商很少進到版面。什麼正在改變：高盛以「具說服力的獲利預估上修」為由同時上調 Par Pacific 與 Delek US，理由正是裂解價差的結構性緊俏。風險與反方：裂解價差是商品價差裡均值回歸最強的一種，歷史上這種連漲結束得很快；夏威夷單一市場的需求彈性小，一旦觀光或航空需求轉弱，利基就變成集中度風險。這是研究線索，不是投資建議。", "en": "Par Pacific runs regional refining plus retail (owned fuel stations and convenience stores) in Hawaii, the Pacific Northwest and Wyoming - three markets that share high import-replacement costs and few competitors. Why it is ignored: the record diesel crack story is absorbed entirely by Valero, Marathon Petroleum and Phillips 66, and far smaller regional refiners rarely make the page. What is changing: Goldman Sachs upgraded both Par Pacific and Delek US citing compelling positive earnings revisions, driven by exactly this structural tightness in crack spreads. Risks and the other side: crack spreads are among the most mean-reverting commodity spreads, and historically runs like this end quickly; Hawaii's single-market demand is inelastic, so if tourism or aviation demand softens the niche becomes concentration risk. This is a research lead, not investment advice.", "url": "https://seekingalpha.com/news/4574145-refiners-par-pacific-delek-us-upped-at-goldman-on-compelling-positive-earnings-revisions", "stocks": [{"t": "PARR", "n": "夏威夷／太平洋西北／懷俄明區域煉油＋零售，高盛上調"}, {"t": "DK", "n": "同批被高盛上調，二疊紀與墨西哥灣曝險，負債比高得多"}, {"t": "CRAK", "n": "煉油 ETF，用來對照「個股故事」與「整個板塊的價差行情」"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "從 Flex 裡拆出電力", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Form 10 修訂版與分拆時程確定", "zh": "Flex 已向美國證管會送出 Form 10，要把旗下「雲端與電力基礎建設」事業分拆成獨立上市公司（申報名稱 Archer SpinCo）。這家未來的新公司做的正是市場現在最缺的東西——資料中心的電力分配與散熱硬體，而它目前被包在一家外界普遍當成「代工製造商」的母公司裡，用代工的本益比在評價。為什麼被忽視：分拆案在 Form 10 階段幾乎沒有分析師覆蓋，新公司連正式代號都還沒有。什麼正在改變：國際能源總署指出資料中心用電 2025 年成長 17%、AI 專用資料中心用電成長 50%，同一個瓶頸已經讓 Hubbell 與 Powell 的在手訂單分別年增 33% 與 69%。風險與反方：分拆時程可能延後或取消；分開之後失去母公司的採購規模與資產負債表；新公司的負債結構要等 Form 10 修訂版才看得到。這是研究線索，不是投資建議。", "en": "Flex has filed a Form 10 with the SEC to separate its Cloud and Power Infrastructure business into an independent public company (filed as Archer SpinCo). That future company makes exactly what the market is short of - power distribution and thermal hardware for data centers - and it currently sits inside a parent widely treated as a contract manufacturer and valued on contract-manufacturing multiples. Why it is ignored: at the Form 10 stage a spin-off has almost no analyst coverage, and the new company does not even have a ticker yet. What is changing: the IEA reports data center electricity demand grew 17% in 2025 and AI-specific data center use grew 50%, and the same bottleneck has driven Hubbell's and Powell's backlogs up 33% and 69% respectively. Risks and the other side: the separation could slip or be abandoned; standalone it loses the parent's purchasing scale and balance sheet; and its debt structure will not be visible until an amended Form 10. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0002130999/000119312526391224/d42824d1012b.htm", "stocks": [{"t": "FLEX", "n": "分拆母公司，Form 10 已送件，拆的是雲端與電力基礎建設"}, {"t": "VRT", "n": "資料中心供電與散熱的純業對照組，評價倍數的參考點"}, {"t": "ETN", "n": "電力管理大廠，同一個瓶頸的另一端，用來校準需求真實度"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "10 月 1 日才出生", "color": "#C9A227", "status": "RADAR · 下一個驗證點 9/25 when-issued 開盤與 10/1 正式交易", "zh": "Corteva 董事會已核准把種子與基因事業分拆為獨立上市公司 Vylor：除權基準日 9 月 24 日，持有一股 Corteva 配發一股 Vylor；9 月 25 日起在紐約證交所以「VYLR WI」進行 when-issued 交易到 9 月 30 日，10 月 1 日開盤起以「VYLR」正式交易。為什麼被忽視：一家 10 月 1 日才存在的公司，在此之前沒有任何獨立的分析師模型、沒有歷史股價、不在任何指數裡。什麼正在改變：Vylor 已對外確認 2027 年要推出混種小麥並擴張大豆產品線，這是種子業少見的新品類。風險與反方：農業是典型的看天吃飯，農民收入受穀物價格與投入成本兩頭夾；分拆初期的被動賣壓可能持續數週到數月；when-issued 階段的成交量薄，價格未必有參考性。這是研究線索，不是投資建議。", "en": "Corteva's board has approved separating its seed and genetics business into an independent public company, Vylor: the record date is September 24, with one Vylor share for every Corteva share held; when-issued trading runs on the NYSE under VYLR WI from September 25 through September 30, and regular-way trading under VYLR begins at the open on October 1. Why it is ignored: a company that does not exist until October 1 has no standalone analyst model, no price history and no index membership. What is changing: Vylor has publicly confirmed a 2027 hybrid wheat launch and an expanded soybean line, a genuinely new category for the seed industry. Risks and the other side: agriculture is weather-dependent and farm income is squeezed between grain prices and input costs; post-spin passive selling can last weeks or months; and when-issued volume is thin, so that price is not necessarily informative. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001755672/000119312526391369/d71834dex991.htm", "stocks": [{"t": "VYLR", "n": "9/25 起 when-issued、10/1 正式交易的種子與基因新公司"}, {"t": "CTVA", "n": "分拆母公司，9/24 除權，拆完剩下作物保護本體"}, {"t": "BG", "n": "農業產業鏈對照，穀物價格是 Vylor 客戶收入的來源"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "母公司先開了考卷", "color": "#C9A227", "status": "RADAR · 池內更新 · 下一個驗證點 11 月首份獨立季報", "zh": "池內更新。FedEx Freight 是今年 6 月 1 日從 FedEx 分出來獨立掛牌的北美零擔運輸純業。這週有一個新的讀數：母公司 FedEx 在 9 月 17 日公布 2027 會計年度第一季，那是它第一個不含貨運部門的季度，市場預估營收 217.8 億美元、年增不到 1%。對 FedEx Freight 的意義是——母公司的燃油附加費轉嫁能力與貨量趨勢，等於提前替 LTL 產業做了一次壓力測試，而柴油從 7 月到 8 月漲一成、9 月續漲，正是零擔運輸最大的變動成本。風險與反方：LTL 產業的定價紀律在貨量下滑時容易瓦解；分拆初期的被動賣壓還沒完全消化；以及柴油成本上升不保證能完整轉嫁。這是研究線索，不是投資建議。", "en": "Pool update. FedEx Freight is the North American less-than-truckload pure play spun out of FedEx on June 1 this year. There is a new read this week: the parent reported fiscal 2027 first quarter results on September 17 - its first quarter without the freight division - with the Street looking for revenue of $21.78 billion, up under 1% year over year. What that means for FedEx Freight is that the parent's fuel-surcharge pass-through and volume trend amount to an early stress test of the LTL industry, and diesel, which rose 10% from July to August and kept climbing in September, is LTL's single biggest variable cost. Risks and the other side: LTL pricing discipline tends to break down when volumes fall; post-spin passive selling is not fully absorbed; and higher diesel costs are not guaranteed to pass through in full. This is a research lead, not investment advice.", "url": "https://pomegra.io/news/fedex-q1-fy2027-can-fuel-surcharges-hold", "stocks": [{"t": "FDXF", "n": "6/1 分拆獨立的 LTL 純業，首份獨立季報在 11 月"}, {"t": "FDX", "n": "母公司 9/17 財報，等於替 LTL 產業先做了一次壓力測試"}, {"t": "ODFL", "n": "LTL 同業標竿，定價紀律的對照組"}, {"t": "SAIA", "n": "另一檔 LTL 同業，貨量敏感度更高"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "制裁改寫航線", "color": "#C9A227", "status": "RADAR · 池內更新 · 下一個驗證點 10 月底 Q3 財報", "zh": "池內更新。Teekay Tankers 經營蘇伊士型與阿芙拉型原油輪，是少數沒有複雜控股結構、可以直接讀懂的航運公司。本週的外部變數對它有利：俄羅斯把成品油出口禁令延長到 9 月 30 日，加上中東緊張與西德州原油站上 100 美元，原油與成品油的貿易流被迫繞遠路。航運業真正賺錢的變數不是運量，是噸海里（tonne-mile）——同樣一桶油，走得越遠，需要的船就越多。地緣政治把航線拉長，就等於在不增加需求的情況下，憑空減少了可用船噸。風險與反方：這類順風是事件驅動的，制裁一解除就消失；油價太高本身會壓抑需求；而現貨運價的波動遠大於公司獲利的波動，看到運價創高不等於這一季就入帳。這是研究線索，不是投資建議。", "en": "Pool update. Teekay Tankers operates Suezmax and Aframax crude carriers and is one of the few shipping names without a complex holding structure, so it can be read directly. This week's external variables favor it: Russia extended its refined product export ban through September 30, and with Middle East tension and WTI above $100, crude and product trade flows are being forced onto longer routes. The variable that actually makes money in shipping is not volume but tonne-miles - the same barrel travelling further requires more ships. Geopolitics lengthening routes effectively removes available tonnage without any increase in demand. Risks and the other side: this kind of tailwind is event-driven and disappears the moment sanctions lift; very high oil prices suppress demand on their own; and spot rates are far more volatile than reported earnings, so a record rate print does not mean it lands in this quarter's books. This is a research lead, not investment advice.", "url": "https://energynewsbeat.co/diesel/diesel-crack-spread-hits-record-highs-as-the-global-downstream-market-is-hit-by-drones-and-oil-shortages/", "stocks": [{"t": "TNK", "n": "蘇伊士型與阿芙拉型原油輪，結構單純、噸海里彈性直接"}, {"t": "INSW", "n": "美國籍油輪同業，原油與成品油兩邊都做的對照組"}, {"t": "ASC", "n": "成品油輪純業，俄羅斯出口禁令延長的直接受惠者"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "兩張考卷都不及格", "color": "#C9A227", "status": "RADAR · 池內更新 · 論點降級觀察", "zh": "池內更新，而且是壞消息。Dream Finders Homes 是美國東南部與德州的建商，入池時設了兩個外部檢查點：同業讀數與 FOMC。兩張考卷上週都出來了，而且都偏空。第一，Lennar 第三季每股盈餘 1.19 美元、淨利年減 52%、新訂單年減 9%、全年交屋指引下修，證明壓力不是單一公司的執行問題，是整個產業的需求問題。第二，聯準會升息一碼且點陣圖指向年底前還有一次，房貸利率的方向確定往上。誠實的處理方式是把論點降一級：原本的「東南部人口流入撐住量」還在，但「利率見頂」這個前提已經不成立。風險與反方：建商股常在最壞的新聞出來時見底，因為市場提前反應；但論點要靠信念而不是證據撐住時，就該減碼觀察。這是研究線索，不是投資建議。", "en": "Pool update, and it is bad news. Dream Finders Homes builds in the US Southeast and Texas, and two external checkpoints were set when it entered the pool: a peer read and the FOMC. Both landed last week, and both were negative. First, Lennar's third quarter showed EPS of $1.19, net earnings down 52%, new orders down 9% and full-year delivery guidance cut - evidence that the pressure is industry demand, not one company's execution. Second, the Fed hiked 25 basis points with a dot plot pointing to another before year-end, so the direction of mortgage rates is settled. The honest response is to downgrade the thesis: the Southeast in-migration support for volume still stands, but the assumption that rates had peaked does not. Risks and the other side: builders often bottom on the worst headline because the market front-runs it; but when a thesis needs conviction rather than evidence to stand up, it belongs on the watch list, not the buy list. This is a research lead, not investment advice.", "url": "https://www.fool.com/earnings/call-transcripts/2026/09/17/lennar-len-q3-2026-earnings-call-transcript/", "stocks": [{"t": "DFH", "n": "東南部與德州建商，兩項外部檢查（同業讀數、FOMC）皆偏空"}, {"t": "LEN", "n": "同業讀數來源，Q3 淨利 -52%、新訂單 -9%"}, {"t": "MTH", "n": "入門客層建商同業，利率敏感度最高的一群"}]},
    {"id": "insider_0", "channel": "內部人動向", "tag": "執行長與財務長一起買", "color": "#6DB56D", "zh": "上週最乾淨的一個群聚訊號出現在 Relmada Therapeutics：執行長兼董事 Sergio Traversa 以每股 4.10 到 4.18 美元在公開市場買進 20 萬股、約 82.8 萬美元；財務長 Maged Shenouda 分兩天以 4.20 到 4.25 美元買進、合計約 84.4 萬美元。兩位核心高管在幾天內各自掏自己的錢買進，是內部人研究裡權重最高的一種形態。但臨床期生技的內部人買進要多問一句：這類公司最大的風險是現金燒完，而高管買進有時是為了在增資前支撐股價與市場信心。判讀的方法是把買進金額跟公司的季度現金消耗擺在一起看——如果兩位高管合計買了不到兩百萬美元，而公司一季燒掉兩千萬，那訊號的份量就要打折。", "en": "The cleanest cluster signal last week came at Relmada Therapeutics: CEO and director Sergio Traversa bought 200,000 shares in the open market at $4.10-$4.18 for about $828,000, while CFO Maged Shenouda bought across two days at $4.20-$4.25 for roughly $844,000 in total. Two core executives each committing their own money within days is the highest-weight pattern in insider research. But insider buying at a clinical-stage biotech demands one extra question: the biggest risk for these companies is running out of cash, and executive purchases can sometimes be intended to support the price and market confidence ahead of a raise. The way to read it is to set the purchase size against the quarterly cash burn - if two executives bought under $2 million combined while the company burns $20 million a quarter, discount the signal accordingly.", "url": "https://www.investing.com/news/stock-market-news/top-insider-buys-and-sells-disclosed-on-friday-93CH-4899669", "stocks": [{"t": "RLMD", "n": "執行長買 20 萬股／82.8 萬美元，財務長兩天買約 84.4 萬美元"}, {"t": "XBI", "n": "等權重生技 ETF，小型臨床期生技的整體風險偏好溫度計"}, {"t": "IBB", "n": "市值加權生技 ETF，與 XBI 的分歧可看出資金在大還是小"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "產險總裁的自掏腰包", "color": "#6DB56D", "zh": "Kemper 總裁 Lakhbir Lamba 買進 1 萬股、約 31.6 萬美元。金額不大，但產險公司的內部人買進有一個特別的解讀角度：這門生意的獲利高度取決於「費率循環」在哪個位置——費率剛調漲、理賠成本還沒追上來的那一段最甜，費率見頂、理賠通膨追上來的那一段最苦。高階經理人比任何外部人都早知道自家的續保費率與理賠準備金提列狀況。所以產險股的內部人買進值得追問的是：他買在承保循環的哪一段？要自己查，可以看公司最近幾季的綜合成本率（combined ratio）趨勢，以及準備金是否連續出現有利發展（favorable development）。", "en": "Kemper president Lakhbir Lamba bought 10,000 shares for about $316,495. The size is modest, but insider buying at a property and casualty insurer has a particular angle: profitability depends heavily on where the company sits in the rate cycle - the sweetest stretch is just after rates rise and before claims costs catch up, the hardest is when rates peak and claims inflation catches up. Senior managers know their own renewal pricing and reserve adequacy long before any outsider does. So the question worth asking about insider buying at an insurer is which part of the underwriting cycle they bought in. To check it yourself, look at the combined ratio trend over recent quarters and whether reserves have shown consecutive favorable development.", "url": "https://www.investing.com/news/stock-market-news/top-insider-buys-and-sells-disclosed-on-friday-93CH-4899669", "stocks": [{"t": "KMPR", "n": "總裁買進 1 萬股、約 31.6 萬美元，非標準車險為主"}, {"t": "ALL", "n": "個人險大型同業，費率循環位置的對照組"}, {"t": "TRV", "n": "商業險為主，與個人險的循環節奏不同步，用來分辨產業與公司"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "金額大不等於訊號強", "color": "#6DB56D", "zh": "判讀卡。內部人資料最常見的誤用是看金額排行榜。9 月 14 日那份名單上，前幾名合計約 7.852 億美元的買進金額裡，光是 Republic Services 一家就佔了 5.658 億——這種規模幾乎必然是大股東或關係人的結構性交易，不是某位高管對未來十二個月的看法。真正有統計意義的是「群聚買進」：五個交易日內有三位以上內部人各自獨立買進；學術研究顯示群聚買進在二十一個交易日的超額報酬約為單人買進的兩倍，而這種形態全市場一週只出現約二十多起。另外兩個必要的過濾條件：只算交易代碼 P 的公開市場買進（排除授予、選擇權行使與代扣稅股），以及看買進金額佔該內部人已知持股的比例。", "en": "A reading card. The most common misuse of insider data is the dollar leaderboard. On the September 14 list, of roughly $785.2 million bought across the top names, Republic Services alone accounted for $565.8 million - a size that is almost certainly a structural transaction by a large or related holder, not one executive's view of the next twelve months. What carries statistical weight is the cluster buy: three or more insiders purchasing independently within a five-day window. Academic work finds cluster purchases generate about twice the excess return of single-insider buys over 21 trading days, and the pattern appears only around two dozen times a week across the entire market. Two more necessary filters: count only transaction code P open-market purchases (excluding grants, option exercises and tax withholding), and look at the purchase as a share of that insider's known holding.", "url": "https://www.form4api.com/guides/cluster-buy-signals", "stocks": [{"t": "RSG", "n": "9/14 名單金額第一（約 5.658 億），但規模本身就說明不是高管訊號"}, {"t": "GPI", "n": "同批名單上的汽車經銷商，屬於金額適中、值得往下查的類型"}, {"t": "KMPR", "n": "單一高管、金額 31.6 萬，是「小額但乾淨」的對照"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "押在電線與卡車上", "color": "#B5654D", "zh": "截至 9 月 20 日的眾議院申報統計（近 90 天、133 份 PTR）裡，馬里蘭州第六選區的 April McClain Delaney 申報量排第二：91 筆交易、57 買 33 賣、總金額區間約 318.6 萬到 841.5 萬美元，最新一筆申報日期 9 月 9 日。值得看的不是金額，是前四大標的的組合：Hubbell（電網與資料中心供電硬體）、C.H. Robinson（貨運仲介）、Liberty Media Formula One（F1）與 Life Time（高價健身）。把前兩個放在一起，這是一組押在「實體基礎建設與運輸週期」的部位，而不是押在 AI 軟體或半導體。這個角度的資訊量在於：有人用真錢投票給「電力硬體的瓶頸會持續」這個主題，而同一個主題上週剛被 Hubbell 與 Powell 的在手訂單數字證實。", "en": "In the House disclosure tally as of September 20 (trailing 90 days, 133 PTRs), April McClain Delaney of Maryland's sixth district ranks second by filing volume: 91 transactions, 57 purchases and 33 sales, in a total range of roughly $3.19 million to $8.42 million, most recently filed September 9. What is worth reading is not the size but the mix of the top four names: Hubbell (grid and data center power hardware), C.H. Robinson (freight brokerage), Liberty Media Formula One, and Life Time (premium fitness). Put the first two together and this is a position expressing physical infrastructure and the freight cycle, not AI software or semiconductors. The informational content is that someone is voting with real money on the power-hardware bottleneck persisting - a theme Hubbell's and Powell's backlog numbers independently confirmed last week.", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure", "stocks": [{"t": "HUBB", "n": "申報前四大之一，電網與資料中心供電硬體，在手訂單年增 33%"}, {"t": "CHRW", "n": "貨運仲介，押的是運輸週期而不是 AI 主題"}, {"t": "LTH", "n": "高價位健身，是這組部位裡唯一的消費曝險"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "你買到的是 45 天前", "color": "#B5654D", "zh": "判讀卡，今天只講一件事：時間差。STOCK Act 要求議員在成交後 45 天內申報，所以這個月看到的申報，實際成交日大多落在 7 月到 8 月——也就是聯準會 9 月 16 日升息定案之前。這不是小事：在 7 月建立的部位，面對的是「利率可能持平或往下」的世界；今天跟單買進的人，面對的是「已經升了一碼、年底可能再一碼」的世界。同一檔股票，兩個完全不同的貼現率假設。除了延遲，還有三件事讓這份資料天生不是買賣訊號：金額只揭露寬區間（例如 1,001 到 15,000 美元）而沒有實際數字；不少交易由配偶或信託帳戶執行，議員本人未必參與決策；而選擇權部位的履約價與到期日才是真正的資訊，卻最常被摘要掉。", "en": "A reading card, on one point only: the lag. The STOCK Act requires members to file within 45 days of a trade, so disclosures seen this month were mostly executed in July and August - before the Fed's September 16 hike was settled. That is not a detail. A position built in July faced a world where rates might hold or fall; anyone copying it today faces a world where one hike has landed and another may come by year-end. Same stock, two entirely different discount-rate assumptions. Beyond the lag, three things make this data structurally unsuitable as a trading signal: amounts are disclosed only as wide ranges (such as $1,001 to $15,000) with no actual figure; many trades are executed in spousal or trust accounts where the member may not have made the decision; and for options positions the strike and expiry carry the real information, yet those are the details most often summarized away.", "url": "https://www.congress.gov/crs_external_products/R/HTML/R47818.html", "stocks": [{"t": "NANC", "n": "追蹤民主黨議員申報的 ETF，本身就內含 45 天延遲"}, {"t": "GOP", "n": "追蹤共和黨議員申報的 ETF，與 NANC 的分歧多來自產業組合"}, {"t": "SHY", "n": "短債 ETF，提醒你 7 月與今天的無風險利率假設已經不同"}]},
    {"id": "week_0", "channel": "本週事件", "tag": "本週的總經行事曆", "color": "#C97DD4", "zh": "本週（9/21–9/25）總經數據排得很鬆，重點集中在三天。週一：八月芝加哥聯準會全國活動指數、芝加哥聯準會總裁 Goolsbee 談話、中國人民銀行公布貸款市場報價利率、加拿大央行總裁談話。週三：美國、歐元區、英國、德國同步公布九月採購經理人指數初值，這是本週唯一能即時檢驗「升息有沒有打到需求」的高頻數據。週四：初領失業金與續領人數（前次初領降 1 萬到 19.6 萬，接近 7 月創下的六十年低點 18.9 萬）、第二季經常帳、八月新屋銷售，以及瑞士央行利率決議。要記住的是八月 PCE 物價指數在 9 月 30 日、不在本週，所以這週的通膨判斷只能靠油價與 PMI 的價格分項。", "en": "This week (September 21-25) has a light macro calendar, concentrated on three days. Monday: the August Chicago Fed National Activity Index, remarks from Chicago Fed President Goolsbee, the People's Bank of China loan prime rate, and a speech by the Bank of Canada governor. Wednesday: flash September PMIs for the US, euro area, UK and Germany - the only high-frequency data this week capable of testing whether the hike is already hitting demand. Thursday: initial and continuing jobless claims (initial claims fell 10,000 to 196,000, near July's sixty-year low of 189,000), the Q2 current account, August new home sales, and the Swiss National Bank decision. Keep in mind that August PCE lands on September 30, not this week, so inflation judgment this week rests on oil and the PMI price components.", "url": "https://www.eoption.com/weekly-event-calendar-09-21-2026-09-25-2026/", "stocks": [{"t": "TIP", "n": "抗通膨公債，本週沒有 CPI／PCE，只能靠 PMI 價格分項定價"}, {"t": "FXI", "n": "中國大型股，週一 LPR 是本週亞洲時段第一個變數"}, {"t": "XLU", "n": "公用事業，數據真空週最容易被殖利率單獨牽動的類股"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "本週的公司日程", "color": "#C97DD4", "zh": "本週公司端有兩件事要記在行事曆上。第一，Costco 在 9 月 24 日盤後公布會計年度第四季與全年，這是本週唯一有全市場意義的財報，重點在會員續約率與同店銷售裡食品與非食品的分岔。第二，Corteva 分拆 Vylor 的關鍵日程全部落在本週：9 月 24 日為除權基準日，持有一股 Corteva 配一股 Vylor；9 月 25 日起 Vylor 以「VYLR WI」在紐約證交所展開 when-issued 交易，到 9 月 30 日結束；10 月 1 日開盤起以「VYLR」正式交易。要注意 when-issued 階段成交量薄、價格容易失真，多數機構要等到正式交易並納入指數後才會建立部位。", "en": "Two corporate items belong on the calendar this week. First, Costco reports fiscal fourth quarter and full year results after the close on September 24 - the only report with market-wide significance this week, with membership renewal rates and the food versus non-food split in comparable sales as the things to read. Second, the key dates for Corteva's Vylor separation all fall this week: September 24 is the record date, with one Vylor share distributed per Corteva share; when-issued trading in VYLR WI opens on the NYSE on September 25 and runs through September 30; and regular-way trading under VYLR begins at the open on October 1. Note that when-issued volume is thin and the price is easily distorted - most institutions will not build positions until regular-way trading and index inclusion.", "url": "https://www.sec.gov/Archives/edgar/data/0001755672/000119312526391369/d71834dex991.htm", "stocks": [{"t": "COST", "n": "9/24 盤後公布 FQ4 與全年，本週唯一全市場級財報"}, {"t": "CTVA", "n": "9/24 除權基準日，一股配發一股 Vylor"}, {"t": "VYLR", "n": "9/25 起 when-issued、10/1 正式交易，初期量薄價格易失真"}]},
    {"id": "eval_0", "channel": "今日評估", "tag": "今天最該注意的", "color": "#E8A838", "status": "到 end screen 按討論，把這個問題丟給我", "zh": "今天最值得注意的一件事，是本週沒有新消息——這反而是重點。CPI 不在本週、PCE 要等 9 月 30 日，市場接下來五個交易日要做的，就是安靜地消化一件已經發生的事：聯準會三年來第一次升息，而且十八位與會者有十六位說還有下一次。上週的分歧已經把答案寫在牆上——道瓊創三月來最差週線、羅素 2000 週跌 1.83%、而那斯達克還是紅的，煉油股在創紀錄，電力硬體的在手訂單年增三成到七成。差別不在產業標籤，在於這家公司的需求是「合約」還是「預期」，它的債務是「固定」還是「浮動」。開放式問題是：如果我只能用公開財報查兩個欄位，就要判斷一家公司撐不撐得過這輪升息，我該查哪兩個？", "en": "The thing most worth noticing today is that there is no news this week - and that is the point. There is no CPI this week and PCE does not arrive until September 30, so what the market has to do over the next five sessions is quietly digest something that has already happened: the Fed's first hike in three years, with 16 of 18 participants saying there is another one coming. Last week's divergence already wrote the answer on the wall - the Dow posted its worst week since March, the Russell 2000 fell 1.83%, the Nasdaq still finished green, refiners set records, and power-hardware backlogs grew 33% to 69% year over year. The distinction is not the sector label; it is whether a company's demand is contracted or forecast, and whether its debt is fixed or floating. The open question: if I could look up only two line items in public filings to judge whether a company survives this tightening, which two should they be?", "url": "https://www.cnbc.com/2026/09/16/fed-rate-decision-september-2026.html", "stocks": [{"t": "RSP", "n": "等權重標普 500，中位數個股的真實處境在這裡"}, {"t": "VTWO", "n": "羅素 2000，浮動利率債務比重最高的一群"}, {"t": "TLT", "n": "長天期公債，這輪升息裡「停在哪裡」的定價都寫在它身上"}]},
];

  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");

  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}
