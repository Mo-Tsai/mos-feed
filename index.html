/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

    {"id": "earn_0", "channel": "財報速報", "tag": "PepsiCo 財報優於預期，但下修獲利展望", "color": "#E8786A", "zh": "PepsiCo 第三季營收 252.7 億美元（+5.6%）、調整後每股盈餘 2.34 美元，皆優於預期（2.29 美元），其中含 1.78 億美元關稅退稅；但核心每股盈餘成長展望下修為 2.5% 至 3%，原本是 5% 至 7% 區間的低端。北美先前降價使核心營業利益率少了 280 個基點，換到的是美國零食的銷量與市占回升；管理層預期商品與能源通膨持續，並暗示更多結構性成本削減。股價收盤漲幅各來源不一（約 2% 到 4%），請以正式收盤價為準。", "en": "PepsiCo's third-quarter revenue was $25.27 billion (+5.6%) and adjusted EPS was $2.34 versus $2.29 expected, including $178 million of tariff refunds. But it cut its core EPS growth outlook to 2.5%-3%, from the low end of a 5%-7% range. Earlier price cuts lowered North America core operating margin by 280 basis points but brought back volume and share in U.S. snacks. Management expects commodity and energy inflation to continue and hinted at further structural cost cuts. Reports differ on the closing gain (roughly 2% to 4%), so check the official close.", "url": "https://finance.yahoo.com/markets/stocks/article/pepsico-beats-earnings-expectations-lowers-guidance-as-it-aims-to-stabilize-north-america-business-103147761.html", "stocks": [{"t": "PEP", "n": "PepsiCo，營收 252.7 億美元、EPS 2.34 美元，核心 EPS 展望下修"}, {"t": "KO", "n": "可口可樂，飲料同業對照，今日未報價"}, {"t": "XLP", "n": "必需消費 ETF，成本轉嫁能力的整體對照"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "Levi's 財報優於預期並上調全年展望", "color": "#E8786A", "zh": "Levi Strauss 於 10/7 公布截至 8/30 的第三季：營收年增 4%（有機成長 5%）、調整後營業利益率 15.5%、調整後每股盈餘 0.48 美元，高於約 0.36 美元的共識，並上調全年利潤率與每股盈餘展望。它是少數把關稅成本用定價轉嫁、同時守住利潤的服飾品牌，PepsiCo 那邊則是同一件事做得較吃力，兩者並排看很有意思。財報後的股價反應本文未能確認，請以行情為準。", "en": "Levi Strauss reported fiscal third-quarter results on Oct. 7 for the period ended Aug. 30: net revenue rose 4% (5% organic), adjusted EBIT margin was 15.5% and adjusted EPS was $0.48 versus a consensus of about $0.36. It also raised its full-year margin and EPS outlook. It is one of the few apparel brands passing tariff costs through pricing while protecting profit, and set beside PepsiCo, which is finding the same task harder, the contrast is useful. The post-earnings share reaction could not be confirmed, so check live quotes.", "url": "https://www.sec.gov/Archives/edgar/data/0000094845/000009484526000048/exhibit991-3q2026pressrele.htm", "stocks": [{"t": "LEVI", "n": "Levi Strauss，調整後 EPS 0.48 美元，上調全年展望"}, {"t": "XRT", "n": "零售類股 ETF，服飾通路的整體對照"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "Delta 今日登場，油價是這季的考題", "color": "#E8786A", "zh": "Delta 預定在 10/9 公布第三季財報，公司公告寫的是美東上午 10 點說明會，但部分資料庫日期不同，請以公司公告為準。市場預期每股盈餘約 2.03 至 2.21 美元、營收約 176 億美元；7 月它重申全年調整後 EPS 6.50 至 7.50 美元，同時指出燃油成本約翻了一倍。現在布蘭特在 103 至 104 美元，燃油與票價能否同步調整，是這份財報的核心。", "en": "Delta is scheduled to report third-quarter results on Oct. 9; the company notice cites a 10 a.m. ET call, though some databases list other dates, so confirm with the company. Expectations are for EPS of about $2.03 to $2.21 on revenue near $17.6 billion. In July it reaffirmed full-year adjusted EPS of $6.50 to $7.50 while noting fuel costs had roughly doubled. With Brent at $103 to $104, whether fares can move in step with fuel is the central question.", "url": "https://skift.com/2026/07/10/delta-expects-to-meet-original-2026-profit-outlook/", "stocks": [{"t": "DAL", "n": "Delta，今日財報，共識 EPS 約 2.03 至 2.21 美元"}, {"t": "JETS", "n": "航空類股 ETF，燃油成本的整體對照"}, {"t": "UAL", "n": "聯合航空，同樣吃油價，財報日待查"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "初領失業金 19.7 萬，勞動市場仍緊", "color": "#7C6AF7", "zh": "截至 10/3 當週初領失業救濟金減少 2,000 人至 197,000，續領（至 9/26 當週）增加 17,000 人至 171 萬。初領停在低水位，代表裁員潮還沒擴大，Fed 沒有「勞動市場轉弱」這個理由停下升息討論；Amazon 裁員不到 1,000 人屬個別事件，規模不足以改變這個判斷。下一個大考是 10/14 的 CPI。", "en": "Initial jobless claims fell by 2,000 to 197,000 for the week ended Oct. 3, and continuing claims rose by 17,000 to 1.71 million for the week ended Sept. 26. Initial claims staying low means layoffs have not broadened, so the Fed has no labor-market weakness to justify setting rate-hike talk aside; Amazon's cut of fewer than 1,000 roles is an isolated case too small to change that. The next big test is CPI on Oct. 14.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-8-dow-sp-500-nasdaq-080537884.html", "stocks": [{"t": "SHY", "n": "短天期公債 ETF，對升息預期最敏感"}, {"t": "AMZN", "n": "Amazon，裁員不到 1,000 人，屬個別事件"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "CPI 前哨：PepsiCo 的成本轉嫁說法", "color": "#7C6AF7", "zh": "PepsiCo 在財報中表示商品與能源通膨預期持續，報導並指它重申今年提價的計畫，同時有 1.78 億美元關稅退稅的一次性挹注。這是 9 月 CPI（10/14 美東上午 8:30）前，一線消費品公司對成本傳導的直接說法；布蘭特維持在 103 美元上下，也意味能源項目仍可能把整體數字往上推。單一公司不代表整體通膨，但方向與市場擔心的一致。", "en": "PepsiCo said it expects commodity and energy inflation to continue, and reports note it reiterated plans to raise prices this year, with a one-time $178 million tariff refund also helping results. Ahead of September CPI (Oct. 14, 8:30 a.m. ET) this is a direct statement from a major consumer-goods company on cost pass-through; Brent holding around $103 also means energy could still push the headline number up. One company does not stand for overall inflation, but the direction matches what the market worries about.", "url": "https://finance.yahoo.com/markets/stocks/article/pepsico-beats-earnings-expectations-lowers-guidance-as-it-aims-to-stabilize-north-america-business-103147761.html", "stocks": [{"t": "XLP", "n": "必需消費 ETF，價格轉嫁能力的對照"}, {"t": "TIP", "n": "抗通膨公債 ETF，通膨預期的觀察指標"}, {"t": "DBC", "n": "商品指數 ETF，能源與原物料成本的代表"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "利率路徑：紀要之後，等 CPI 與 10/28 決議", "color": "#7C6AF7", "zh": "Fed 9 月紀要（10/7 公布）多數與會者認為年底前再升息「可能適當」，但沒給時點；下一次 FOMC 在 10/27 至 28 日，決議預定 10/28 美東下午 2 點宣布。十年期殖利率目前 5.23%，10/1 官方資料顯示 2 年期 4.78%、10 年期 5.24%，曲線相當平。換句話說市場已經為「升息仍在選項內」定價，CPI 若偏熱，修正最先發生在短天期。", "en": "The Fed's September minutes (released Oct. 7) show most participants thought another hike by year-end could be appropriate, without a timeline; the next FOMC meets Oct. 27-28, with the decision due Oct. 28 at 2 p.m. ET. The 10-year yield is 5.23% now, and Oct. 1 Treasury data showed the 2-year at 4.78% and the 10-year at 5.24%, a fairly flat curve. The market has priced a hike as still on the table, so a hot CPI would be repriced first at the short end.", "url": "https://fedratecalc.com/us-economic-calendar/october-2026/", "stocks": [{"t": "IEF", "n": "7 至 10 年期公債 ETF，十年期殖利率 5.23%"}, {"t": "KRE", "n": "區域銀行 ETF，對曲線形狀與債券帳面損失敏感"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "半導體：費半盤中一度 -4%，才大漲的 Marvell 也被賣", "color": "#4EABA4", "zh": "費城半導體指數週四盤中一度重挫 4%，後來收斂一部分跌幅；英特爾 -5.34% 收 107.08 美元、美光跌逾 5%，Arm、英特爾與 Marvell 盤中各有跌逾 6% 的時段。對照前一天 Marvell 才因投資人日大漲，這說明板塊內部是「消息一出就重新定價」，而不是基本面單日改變。判斷關鍵要看接下來 AI 資本支出的指引，而不是單日跌幅。", "en": "The Philadelphia Semiconductor Index fell as much as 4% intraday on Thursday before recovering part of the loss; Intel dropped 5.34% to $107.08 and Micron fell more than 5%, while Arm, Intel and Marvell each had stretches down more than 6%. Marvell had just jumped on its investor day, so this is the sector repricing as news arrives rather than fundamentals changing in a day. What matters next is guidance on AI capital spending, not the size of one day's drop.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-8-dow-sp-500-nasdaq-080537884.html", "stocks": [{"t": "SMH", "n": "半導體 ETF，費半盤中一度 -4%"}, {"t": "INTC", "n": "英特爾，-5.34% 收 107.08 美元"}, {"t": "MU", "n": "美光，跌逾 5%"}, {"t": "MRVL", "n": "Marvell，前一日投資人日大漲、今日盤中跌逾 6%"}, {"t": "ARM", "n": "Arm，盤中一度跌逾 6%"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "防禦輪動：公用事業一日 +2.95%，工業 -1.33%", "color": "#4EABA4", "zh": "這是 10/7 的板塊資料：公用事業 XLU +2.95% 居冠，醫療 +0.86%、必需消費 +0.81%、非必需消費 +0.85%，工業 -1.33%、原物料 -1.05% 墊底，同日十年期殖利率在 5.28%。在高利率下公用事業大漲，較像資金往防禦與配息股移動，而不是單純的利率敏感交易；NorthWestern Energy 前日上漲 7.33%，原因本文未能查證。單日資料不足以下結論，要看 10/8 以後能否延續。", "en": "These are Oct. 7 sector figures: utilities XLU +2.95% led, health care +0.86%, staples +0.81% and discretionary +0.85%, while industrials -1.33% and materials -1.05% lagged, with the 10-year yield at 5.28%. Utilities surging at high rates looks more like money moving to defensive and dividend names than a plain rate-sensitive trade; NorthWestern Energy rose 7.33% that day, for a reason not verified here. One day of data is not enough to conclude, so watch whether it continues after Oct. 8.", "url": "https://tapeboard.com/blog/market-pulse-2026-10-07", "stocks": [{"t": "XLU", "n": "公用事業 ETF，10/7 +2.95%"}, {"t": "XLI", "n": "工業類股 ETF，10/7 -1.33%"}, {"t": "XLV", "n": "醫療類股 ETF，10/7 +0.86%"}, {"t": "NWE", "n": "NorthWestern Energy，10/7 +7.33%，原因未查證"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "油價 100 美元上方：吃油的與賣油的", "color": "#4EABA4", "zh": "布蘭特在 103 至 104 美元、WTI 91.18 美元，能源成本的贏家與輸家同日浮現。吃油的一側：Delta 今日財報，燃油成本年內約翻倍；PepsiCo 預期能源通膨持續。賣油與運油的一側是上游與油輪，池內的 Teekay Tankers 以現貨運價賣航次，營收對運價與油品流向高度敏感，但單日漲跌本文未取得。油價受地緣消息牽動，波動大，對兩側都是雙面刃。", "en": "Brent at $103 to $104 and WTI at $91.18 are creating energy winners and losers in the same session. On the consuming side, Delta reports today with fuel costs roughly doubled this year, and PepsiCo expects energy inflation to continue. On the supplying side are upstream and tanker owners; the radar pool name Teekay Tankers sells voyages at spot rates, so its revenue is highly sensitive to freight rates and crude flows, though its move today was not retrieved. Oil is driven by geopolitical headlines and its volatility cuts both ways.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-8-dow-sp-500-nasdaq-080537884.html", "stocks": [{"t": "DAL", "n": "Delta，燃油成本約翻倍，今日財報"}, {"t": "TNK", "n": "Teekay Tankers，池內雷達股，以現貨運價賣航次"}, {"t": "OIH", "n": "油服類股 ETF，高油價的需求側對照"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000 距 8/12 高點仍低 8.3%", "color": "#5B8ED6", "zh": "羅素 2000 週四收 2,794.13（+0.03%），看似持平，但前一日才 -1.31%，且仍低於 10/1 的 2,806.62；對照 8/12 的收盤紀錄 3,045.48（今年第 27 次收盤新高），目前差距約 8.3%（本文自行計算）。換句話說，小型股今年領先的幅度正被利率和油價逐步吃掉，單日持平不代表止跌，要看十年期殖利率是否站穩 5.2% 以下。", "en": "The Russell 2000 closed at 2,794.13 on Thursday (+0.03%), which looks flat, but it fell 1.31% the day before and is still below the 2,806.62 close on Oct. 1. Against the record close of 3,045.48 on Aug. 12 (the 27th record of the year), the gap is about 8.3% (calculated here). In other words, small caps' lead this year is being eaten by rates and oil, and a flat day does not mean the slide has stopped; the test is whether the 10-year yield can stay below 5.2%.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-8-dow-sp-500-nasdaq-080537884.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，指數收 2,794.13"}, {"t": "IJR", "n": "標普 600 小型股 ETF，另一種小型股口徑"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "Penguin Solutions 財報大超預期，單日 +13%", "color": "#5B8ED6", "zh": "Penguin Solutions（PENG）10/6 盤後公布財年第四季：每股盈餘 1.00 美元對預期 0.75 美元、營收 5.667 億美元對 5.125 億美元；2027 財年指引每股盈餘 3.75 至 5.15 美元、營收約 24.3 億美元，高於共識的 3.40 美元與 21.9 億美元。10/7 股價上漲 13.08% 收 72.61 美元。這家公司的財報日波動兩邊都大：去年 10 月因營收不如預期與保守指引曾盤前重挫約 18%，所以追高前要留意指引兌現的速度。", "en": "Penguin Solutions (PENG) reported fiscal fourth-quarter results after the close on Oct. 6: EPS of $1.00 versus $0.75 expected and revenue of $566.7 million versus $512.5 million. Fiscal 2027 guidance is EPS of $3.75 to $5.15 on revenue of about $2.43 billion, above consensus of $3.40 and $2.19 billion. The stock rose 13.08% to $72.61 on Oct. 7. Its earnings days swing both ways: last October it fell about 18% premarket on a revenue miss and cautious guidance, so how fast guidance converts matters before chasing.", "url": "https://www.sec.gov/Archives/edgar/data/0001616533/000161653326000046/pengq4-26form8xkxex991.htm", "stocks": [{"t": "PENG", "n": "Penguin Solutions，10/7 +13.08% 收 72.61 美元，指引高於共識"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "小型股判讀：為什麼單日漲跌不能直接比較", "color": "#5B8ED6", "zh": "羅素 2000 約有三到四成的成分股過去十二個月沒有獲利（各家口徑不同，是常見估計而非精確值），所以指數漲跌裡，有一大塊是「對利率與融資環境的賭注」而不是獲利成長。成長型指數（IWO）通常含較多虧損公司，價值型（IWN）則偏金融與傳統產業，兩者遇到殖利率上升的反應可能相反。看小型股，先分清楚你看的是哪一種口徑。", "en": "Roughly three to four in ten Russell 2000 members have no trailing twelve-month profit (a common estimate that varies by source, not a precise figure), so much of the index's move is a bet on rates and financing conditions rather than earnings growth. The growth version (IWO) tends to hold more unprofitable companies, while the value version (IWN) leans toward financials and traditional industries, and the two can react in opposite ways to rising yields. When reading small caps, first decide which version you are looking at.", "url": "https://www.cmegroup.com/news/2026/after-the-russell-reconstitution.html", "stocks": [{"t": "IWO", "n": "羅素 2000 成長型 ETF，虧損公司比重較高"}, {"t": "IWN", "n": "羅素 2000 價值型 ETF，偏金融與傳統產業"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "區域銀行 Q3 財報倒數：只看一個數字", "color": "#5B8ED6", "zh": "大型銀行下週二（10/13）開跑，區域與社區銀行多在 10 月下旬接棒；雷達池內的 Banner（BANR）與 S&T Bancorp（STBA）要看的都是淨息差能否守住、而不是靠借款把放款堆大，Mid Penn（MPB）看營收增速能否延續。以 Auburn National 為例，Q1 淨息差 3.28%（+19 個基點）、淨利息收入年增約 10%，去年 Q3 在 10/23 公布。在十年期 5.2% 的環境下，這組數字是市場能否分辨「真的賺到利差」的最直接證據。", "en": "Large banks start next Tuesday (Oct. 13), and regional and community lenders mostly follow in late October. For radar-pool names Banner (BANR) and S&T Bancorp (STBA) the question is whether net interest margin holds rather than being propped up by borrowing to grow loans, and for Mid Penn (MPB) whether revenue growth continues. Auburn National, for example, posted a Q1 margin of 3.28% (+19 basis points) with net interest income up about 10% year over year, and reported last year's Q3 on Oct. 23. With the 10-year near 5.2%, these numbers are the most direct evidence on who is truly earning the spread.", "url": "https://www.marketbeat.com/instant-alerts/auburn-national-bancorporation-nasdaqaubn-posts-quarterly-earnings-results-2026-07-28/", "stocks": [{"t": "BANR", "n": "Banner，池內雷達股，看淨息差能否續擴"}, {"t": "STBA", "n": "S&T Bancorp，池內雷達股，看淨息差能否守住"}, {"t": "MPB", "n": "Mid Penn，池內雷達股，看營收增速"}, {"t": "KBE", "n": "銀行 ETF，銀行類股整體對照"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "光通訊與射頻中小型股單日重挫", "color": "#5B8ED6", "zh": "Applied Optoelectronics（AAOI）週四 -13.58%、MaxLinear（MXL）-12.72%，是 OpenAI 營收疑慮下跌幅最深的名單。這類公司的營收高度仰賴雲端業者的資本支出，一旦對 AI 需求的預期下修，反應比大型晶片股更激烈。池內的 ADTRAN（ADTN）光通訊營收占比約 39%，同屬這條鏈，今日漲跌本文未取得。單日重挫不等於基本面惡化，要看下一輪訂單與客戶指引。", "en": "Applied Optoelectronics (AAOI) fell 13.58% and MaxLinear (MXL) fell 12.72% on Thursday, the deepest losses on the list amid OpenAI revenue worries. Such companies depend heavily on cloud operators' capital spending, so a lower AI-demand outlook hits harder than it does for large chip names. Radar-pool name ADTRAN (ADTN), with optical about 39% of revenue, sits in the same chain, though its move today was not retrieved. A one-day plunge is not the same as weaker fundamentals; the next orders and customer guidance will tell.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-8-dow-sp-500-nasdaq-080537884.html", "stocks": [{"t": "AAOI", "n": "Applied Optoelectronics，-13.58%"}, {"t": "MXL", "n": "MaxLinear，-12.72%"}, {"t": "ADTN", "n": "ADTRAN，池內雷達股，光通訊營收約 39%，今日漲跌未取得"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "Bluerock 地產基金：折價近三成，董事三天實買 27 萬股", "color": "#C9A227", "zh": "Bluerock Private Real Estate Fund（BPRE）是 2025 年 12 月在 NYSE 掛牌的房地產基金，掛牌首日收盤約比最新淨值低 4 成；4/29 揭露的折價為 29.72%。10/1 至 10/5 董事 Ramin Kamfar 透過自己控制的 Bluerock Asset Management 分三天在公開市場買進 269,164 股（均價約 12.6 至 12.7 美元，約 340 萬美元），持股升至 1,175,524 股。被忽視的原因：上市即破發、折價長期存在。風險：折價可能是市場對淨值估值的合理懷疑，且買方是與基金管理人關係密切的實體，利害一致不等於獨立判斷。以上為研究線索，不是投資建議。", "en": "Bluerock Private Real Estate Fund (BPRE) listed on the NYSE in December 2025 and closed its first day about 40% below its latest net asset value; the discount disclosed on April 29 was 29.72%. From Oct. 1 to Oct. 5, director Ramin Kamfar bought 269,164 shares on the open market over three days through Bluerock Asset Management, an entity he controls, at about $12.6 to $12.7 (roughly $3.4 million), lifting his holding to 1,175,524 shares. It is neglected because it broke issue on listing and the discount has persisted. Risks: the discount may be a reasonable doubt about the NAV marks, and the buyer is closely tied to the fund's manager, so aligned interests are not independent judgment. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001551047/000139834426017906/fp0101268-1_4.xml", "stocks": [{"t": "BPRE", "n": "Bluerock 地產基金，董事 10/1 至 10/5 買進 269,164 股"}], "status": "RADAR · 下一個驗證點 每日淨值與折價變化、下一輪 Form 4"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "Euroseas：董事再買進，股價低於管理層估算淨值三成", "color": "#C9A227", "zh": "Euroseas（ESEA）是希臘的貨櫃船出租商，管理層估算淨資產價值超過 7.25 億美元、約每股 103 美元，而董事 Aristeidis Pittas 近日以約 71 美元再買進 1,050 股（追蹤站資料；6 月 11 日另有申報買進 500 股、67.18 美元）。Q2 淨利 3,320 萬美元（每股 4.74 美元）、季股利 0.80 美元（約 4.5% 殖利率），租約涵蓋 2026 年剩餘時間超過 95%、2027 年 81%、2028 年 47%。風險：淨值是管理層自己估算、貨櫃運價具循環性、買進金額小。以上為研究線索，不是投資建議。", "en": "Euroseas (ESEA) is a Greek container-ship lessor. Management estimates net asset value above $725 million, about $103 per share, while director Aristeidis Pittas recently bought another 1,050 shares at about $71 (tracker data; a June 11 filing shows 500 shares at $67.18). Q2 net income was $33.2 million ($4.74 per share), the quarterly dividend is $0.80 (about a 4.5% yield), and charters cover over 95% of the rest of 2026, 81% of 2027 and 47% of 2028. Risks: NAV is management's own estimate, container rates are cyclical, and purchases are small. This is a research lead, not investment advice.", "url": "https://www.nasdaq.com/articles/euroseas-q2-earnings-call-highlights", "stocks": [{"t": "ESEA", "n": "Euroseas，貨櫃船出租，董事買進、股價低於管理層估算淨值"}], "status": "RADAR · 下一個驗證點 11 月 Q3 財報與下一次股利宣告"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "Auburn National：四位內部人同日買進，但金額極小", "color": "#C9A227", "zh": "Auburn National Bancorporation（AUBN）是阿拉巴馬州的社區銀行，市值約 9,100 萬美元，分析師覆蓋幾乎為零（MarketBeat 近 90 天僅 1 份報告）。追蹤站顯示近期一位資深副總與三位董事各買進 27 至 73 股、約 27.4 至 27.5 美元，金額只有 743 到 2,007 美元。Q1 淨息差 3.28%（+19 個基點）、淨利 220 萬美元。重要提醒：每人幾十股的買進常見於定期再投資或定額計畫，四個人同時出現不等於信念。風險：規模極小、流動性差。以上為研究線索，不是投資建議。", "en": "Auburn National Bancorporation (AUBN) is an Alabama community bank with a market cap around $91 million and almost no analyst coverage (MarketBeat shows one report in 90 days). A tracker shows a senior vice president and three directors each recently bought 27 to 73 shares at about $27.4 to $27.5, only $743 to $2,007 apiece. Q1 net interest margin was 3.28% (+19 basis points) and net earnings $2.2 million. Caution: buys of a few dozen shares per person often come from periodic reinvestment or fixed plans, so four people at once is not conviction. Risks: tiny size and poor liquidity. This is a research lead, not investment advice.", "url": "https://quartr.com/events/auburn-national-bancorporation-aubn-q1-2026_Fs4dF5Xz", "stocks": [{"t": "AUBN", "n": "Auburn National，社區銀行，分析師覆蓋近乎零"}], "status": "RADAR · 下一個驗證點 10 月下旬 Q3 財報的淨息差"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "Willamette Valley：CEO 在 1.91 美元再買進", "color": "#C9A227", "zh": "Willamette Valley Vineyards（WVVI）是奧勒岡州的酒莊與酒廠，分析師覆蓋稀少。追蹤站顯示 CEO Michael Osborn 近日以約 1.91 美元買進 10,000 股（約 1.9 萬美元）；去年 12 月他買進的價位在 2.93 至 2.95 美元，1 月時 52 週區間為 2.49 至 7.18 美元，現價已低於該區間下緣。訊號只有一個半：忽視加上 CEO 在更低價加碼。風險：2025 年普通股每股虧損 0.64 美元（2024 年 0.48 美元）、有優先股股利負擔、買進金額很小。以上為研究線索，不是投資建議。", "en": "Willamette Valley Vineyards (WVVI) is an Oregon winery with sparse analyst coverage. A tracker shows CEO Michael Osborn recently bought 10,000 shares at about $1.91 (roughly $19,000); in December he bought at $2.93 to $2.95, and in January the 52-week range was $2.49 to $7.18, so the price is now below the bottom of that range. That is one and a half signals: neglect plus a CEO adding at lower prices. Risks: a 2025 loss of $0.64 per common share ($0.48 in 2024), a preferred-dividend burden, and a very small purchase size. This is a research lead, not investment advice.", "url": "https://quantisnow.com/ticker/WVVI", "stocks": [{"t": "WVVI", "n": "Willamette Valley，酒莊，CEO 在約 1.91 美元買進 10,000 股"}], "status": "RADAR · 下一個驗證點 11 月 Q3 財報的虧損收斂與優先股股利負擔"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "Gentherm：與 Modine 事業合併完成，43.6% 股份換手", "color": "#C9A227", "zh": "Gentherm（THRM）10/1 完成與 Modine 旗下 Performance Technologies 的 Reverse Morris Trust：Modine 股東每股換 0.44619 股 Gentherm，合併後持有約 43.62%，新發 23,735,961 股；新股不領 10/7 發放的每股 2.07 美元特別股利。這張是事件型而非典型雙重忽視：分析師約 4 買 4 持有，但收到股票的 Modine 股東原本投資的是工業熱管理，常見的短期換手賣壓，我沒找到實際賣壓資料。風險：整合、股本近乎翻倍、後續財報超預期是否延續。以上為研究線索，不是投資建議。", "en": "Gentherm (THRM) completed on Oct. 1 its Reverse Morris Trust combination with Modine's Performance Technologies business: Modine holders received 0.44619 Gentherm shares per Modine share and now own about 43.62% of the combined company, with 23,735,961 new shares issued; the new shares did not receive the $2.07 special dividend paid Oct. 7. This is an event case rather than a classic double-neglect name: analysts are about 4 Buy and 4 Hold, but the Modine holders who received the shares originally owned industrial thermal management, which often means short-term turnover, though I found no actual selling data. Risks: integration, a nearly doubled share count, and whether earlier beats continue. This is a research lead, not investment advice.", "url": "https://www.webull.com/news/15674913718928384", "stocks": [{"t": "THRM", "n": "Gentherm，與 Modine 事業合併，新發 23,735,961 股"}, {"t": "MOD", "n": "Modine，分出事業後預定更名 Modexus，收 1.56 億美元還債"}], "status": "RADAR · 下一個驗證點 11 月合併後首份財報與新股東持股（13F）變化"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "Sky Harbour：CFO 連續四次買進，但已有分析師覆蓋", "color": "#C9A227", "zh": "Sky Harbour（SKYH）開發並出租商務航空的機庫園區。CFO Francisco Gonzalez 8/18 買進 1,000 股（約 10.05 美元）、9/11 買進 1,000 股、9/30 買進 1,500 股（9.69 美元）、10/1 買進 1,600 股（約 9.40 美元），價格一路往 52 週區間（8.22 至 11.70 美元）下緣靠；追蹤站另列一筆 3,850 股、9.25 美元的買進，尚未核對。這張不是雙重忽視：分析師共識為買進、平均目標價約 12.75 美元，看的是內部人加碼節奏。風險：單筆金額僅約 1.5 萬美元、無法得知買進動機。以上為研究線索，不是投資建議。", "en": "Sky Harbour (SKYH) develops and leases hangar campuses for business aviation. CFO Francisco Gonzalez bought 1,000 shares on Aug. 18 (about $10.05), 1,000 on Sept. 11, 1,500 on Sept. 30 ($9.69) and 1,600 on Oct. 1 (about $9.40), with prices drifting toward the bottom of the 52-week range ($8.22 to $11.70); a tracker also lists a 3,850-share purchase at $9.25 that has not been checked. This is not double neglect: the analyst consensus is Buy with an average target near $12.75, so the angle is the pace of insider adds. Risks: each purchase is only about $15,000 and the motive is unknown. This is a research lead, not investment advice.", "url": "https://www.insidertrades.com/alerts/nyse-skyh-insider-buying-and-selling-2026-08-20/", "stocks": [{"t": "SKYH", "n": "Sky Harbour，機庫園區開發商，CFO 連續買進"}], "status": "RADAR · 下一個驗證點 11 月 Q3 財報與下一次 Form 4"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "Cohen 再買 70 萬股 GameStop，三週內第四次", "color": "#6DB56D", "zh": "GameStop 董事長兼 CEO Ryan Cohen 10/2 以加權均價 24.4061 美元買進 700,000 股（約 1,710 萬美元），此前已在 9/10 買 1,000,000 股、9/21 買 1,150,680 股，9/29 也有買進；10/2 之後直接持股為 41,648,522 股。13D/A 顯示他含認股權證共實質持有 45,383,306 股，約占 8.9%。24/7 Wall St. 指出申報沒有 10b5-1 計畫的跡象；他持有的 32 美元認股權證 10/30 到期，目前股價遠低於履約價。提醒：CEO 連續買自家股票是強訊號，但不等於公司基本面轉折。", "en": "GameStop chairman and CEO Ryan Cohen bought 700,000 shares on Oct. 2 at a weighted average of $24.4061 (about $17.1 million), after buying 1,000,000 on Sept. 10 and 1,150,680 on Sept. 21, with more purchases on Sept. 29; he directly held 41,648,522 shares afterward. A 13D/A shows 45,383,306 shares beneficially owned including warrants, about 8.9%. 24/7 Wall St. noted the filings show no sign of a Rule 10b5-1 plan, and his $32 warrants expire Oct. 30 with the stock well below the strike. Caution: a CEO repeatedly buying his own stock is a strong signal, but not proof of a fundamental turn.", "url": "https://www.sec.gov/Archives/edgar/data/0001326380/000092189526002719/form413177018_10022026.xml", "stocks": [{"t": "GME", "n": "GameStop，Cohen 10/2 買進 700,000 股，直接持股 41,648,522 股"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "判讀：同樣是買進，金額與身分差很多", "color": "#6DB56D", "zh": "今天的 Form 4 清單正好是對照組：GameStop 的 Cohen 一次買 1,700 萬美元、身分是 CEO 兼董事長；Auburn National 的四位內部人各買 27 到 73 股、只有幾百到兩千美元；Bluerock 基金的董事透過自己控制的實體在三天買 340 萬美元。判讀的順序是：先看金額相對於本人資產與市值的比重，再看身分（創辦人、董事、財務長、大股東），最後看是否重複出現且沒有 10b5-1 計畫。小額且一致的買進，更可能是制度性安排，不是看法。", "en": "Today's Form 4 list is a natural contrast set: GameStop's Cohen bought $17 million as CEO and chairman; four Auburn National insiders each bought 27 to 73 shares, only hundreds to two thousand dollars; and a Bluerock fund director bought $3.4 million over three days through an entity he controls. The order of reading is: first the size relative to the person's wealth and the company's market cap, then who they are (founder, director, CFO, large holder), and finally whether the buying repeats without a Rule 10b5-1 plan. Small, uniform buys are more likely a structured arrangement than a view.", "url": "https://247wallst.com/investing/2026/10/01/ryan-cohen-keeps-paying-up-for-gamestop-stock-and-he-is-not-buying-alone/", "stocks": [{"t": "AUBN", "n": "Auburn National，四位內部人買進共不到 5,500 美元"}, {"t": "BPRE", "n": "Bluerock 基金，董事三天買進約 340 萬美元"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "Vera Bradley：董事再買進，但價位比去年貴了一倍多", "color": "#6DB56D", "zh": "Vera Bradley（VRA）董事 Ivan Brockman 10/6 以 5.02 美元買進 10,000 股（約 5.02 萬美元），10/7 申報。對照另一位董事 Andrew Meslow：去年 12 月買 250,000 股的價位約 1.98 美元，今年 6 月買 24,926 股已是 3.73 美元。新任 CEO Ian Bickley 的 2027 財年營收指引為 2.55 億至 2.7 億美元，最近一季營收 7,160 萬美元（+1.1%），但批發通路下滑 39.4%。重點：內部人還在買，但股價已先翻倍，以前的低價優勢沒有了。以上為研究線索，不是投資建議。", "en": "Vera Bradley (VRA) director Ivan Brockman bought 10,000 shares at $5.02 on Oct. 6 (about $50,200), filed Oct. 7. By comparison, director Andrew Meslow bought 250,000 shares at about $1.98 last December and 24,926 shares at $3.73 in June. New CEO Ian Bickley guides fiscal 2027 revenue to $255 million to $270 million; the latest quarter's revenue was $71.6 million (+1.1%) but the indirect segment fell 39.4%. The point: insiders are still buying but the stock has already more than doubled, so the earlier low-price edge is gone. This is a research lead, not investment advice.", "url": "https://www.quantisnow.com/insiders/VRA", "stocks": [{"t": "VRA", "n": "Vera Bradley，董事 10/6 以 5.02 美元買進 10,000 股"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "Hern：近 90 天 73 筆申報，66 筆是賣出", "color": "#B5654D", "zh": "眾議員 Kevin Hern（共和黨，奧克拉荷馬第 1 選區）在眾議院書記官最近 90 天的 PTR 中累計 73 筆交易申報，其中賣出 66 筆、買進僅 2 筆，涉及 56 檔不同標的，金額區間加總約 143 萬至 402 萬美元，最近一份申報在 9/25。名單中出現的有 Boston Scientific、IQVIA、Exxon Mobil、Organon。這個結構看起來是持續減碼而非押注某個主題；申報主體可能含配偶或信託帳戶，也無法從申報判斷動機。", "en": "Representative Kevin Hern (R-OK-01) filed 73 transactions in House Clerk periodic transaction reports over the last 90 days: 66 sales and only 2 purchases across 56 different securities, with the combined value ranges adding up to about $1.43 million to $4.02 million; the latest filing is Sept. 25. Names include Boston Scientific, IQVIA, Exxon Mobil and Organon. The structure looks like steady trimming rather than a bet on one theme; the filer may include a spouse or trust account, and motive cannot be inferred from the filings.", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035491.pdf", "stocks": [{"t": "BSX", "n": "Boston Scientific，出現在 Hern 的申報中"}, {"t": "IQV", "n": "IQVIA，出現在 Hern 的申報中"}, {"t": "XOM", "n": "Exxon Mobil，出現在 Hern 的申報中"}]},
