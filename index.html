<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
  {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "科技獨漲", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普500 ETF，指數漲 0.72% 收 7,730.99"}, {"t": "QQQ", "n": "那斯達克100 ETF，那指綜合漲 1.57% 收 26,541.35"}, {"t": "DIA", "n": "道瓊ETF，道瓊只漲 0.20% 收 53,569.44，落後幅度明顯"}], "en": "Thursday's rally was carried by technology alone. The S&P 500 rose 0.72% to 7,730.99, the Nasdaq Composite gained 1.57% to 26,541.35, and the Dow managed just 0.20% to 53,569.44. The driver was Nvidia's results the night before and its guidance for roughly 70% revenue growth next fiscal year, which temporarily removed the fear that AI capital spending had peaked. Three indices rising with that much spread between them is itself a message: money did not come back to the market broadly, it came back to a few specific lines.", "zh": "週四美股由科技股單獨扛起：標普 500 漲 0.72% 收 7,730.99，那斯達克綜合指數漲 1.57% 收 26,541.35，道瓊只漲 0.20% 收 53,569.44。推手是輝達前一晚的財報，以及管理層給出下一個會計年度營收「約成長七成」的展望，把市場對 AI 資本支出見頂的擔憂暫時掃掉。三大指數同時收紅、幅度卻差這麼開，本身就是一則訊息：錢沒有全面回到股市，只回到了幾條特定的線上。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-august-27-dow-sp-500-nasdaq-082144520.html"},
  {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "漲勢很窄", "color": "#E05C5C", "stocks": [{"t": "XLK", "n": "科技類股ETF，當日十一個類股中唯一收紅的一個"}, {"t": "RSP", "n": "標普500等權重ETF，用來檢查漲勢有沒有擴散到成分股"}, {"t": "XLV", "n": "醫療類股ETF，屬於當日收黑的那十個類股之一"}], "en": "Only one of the eleven S&P 500 sectors closed higher on Thursday: technology. Every other sector fell. The index looks like it gained 0.72%, but that was a handful of heavyweight names pulling the whole line up, and an equal-weight view of the same day shows a different market. This kind of index-up, constituents-down structure usually ends one of two ways: the rotation broadens over the following days, or the leaders pull back with nobody underneath to catch them. Which one it is shows up in flows next week, not in Thursday's close.", "zh": "這一天十一個類股裡只有科技股收紅，其餘全部收黑。指數看起來漲了 0.72%，但那是少數幾檔權重股把整條線拉起來的結果，換成等權重的角度看到的是另一個市場。這種「指數漲、成分股跌」的結構通常有兩種結局：接下來幾天輪動擴散開來，或是領頭羊回檔時底下沒有人接得住。要判斷是哪一種，得看下週的資金流向，而不是今天的收盤數字。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-27-2026"},
  {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "軟體反攻", "color": "#E05C5C", "stocks": [{"t": "CRM", "n": "財報營收超預期，執行長反擊 SaaS 末日論，當日漲約 22%"}, {"t": "OKTA", "n": "身分驗證軟體，當日漲 28%，全場最強"}, {"t": "IGV", "n": "軟體類股ETF，這段反攻最直接的載具"}], "en": "Enterprise software, beaten down for most of the year, came back in one session. Salesforce jumped about 22%, Okta 28%, CrowdStrike 20%, while Adobe and Autodesk closed up 5.7% and 6.2%. The trigger was Salesforce's CEO telling investors to stop the SaaSpocalypse nonsense on the earnings call, combined with Nvidia's outlook making the case that AI is a source of software demand rather than a substitute for it. This is the first time this year the SaaS narrative has flipped this hard in a single day.", "zh": "被壓了大半年的企業軟體股在週四集體回魂：Salesforce 大漲約 22%、Okta 漲 28%、CrowdStrike 漲 20%，Adobe 與 Autodesk 也分別收高 5.7% 與 6.2%。導火線是 Salesforce 執行長在財報電話會上直接要投資人別再講「SaaS 末日」這種話，加上輝達的展望讓市場重新相信 AI 是軟體的需求來源、不是替代品。這是今年 SaaS 敘事第一次在單一交易日內翻轉得這麼徹底。", "url": "https://seekingalpha.com/news/4637517-enterprise-software-stocks-rally-as-salesforce-ceo-says-time-to-stop-saaspocalypse-nonsense"},
  {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "勞動仍緊", "color": "#E05C5C", "stocks": [{"t": "TLT", "n": "20年期以上公債ETF，殖利率預期的主要出口"}, {"t": "IWM", "n": "羅素2000 ETF，小型股對利率路徑的敏感度最高"}], "en": "Initial jobless claims released Thursday fell to 203,000, below the 208,000 consensus, with the four-week moving average at 205,500. That is hard to read as a weakening economy, which makes the rate-cut debate harder to settle: the labour market is holding while inflation is still above 3%. Bond markets largely stood still ahead of Warsh's Friday speech, with yields stabilising after last week's volatility.", "zh": "週四公布的初領失業金人數降到 20.3 萬人，低於市場預期的 20.8 萬，四週移動平均為 20.55 萬。這個數字很難解讀成經濟走弱，也因此讓「聯準會該不該降息」的辯論更難收尾——勞動市場撐得住，通膨卻還在 3% 以上。債市在 Warsh 週五演說前基本上按兵不動，殖利率在上週的震盪之後穩了下來。", "url": "https://www.dol.gov/ui/data.pdf"},
  {"id": "earn_0", "channel": "財報速報", "tag": "雙超卻跌", "color": "#E8786A", "stocks": [{"t": "MRVL", "n": "營收 27.39 億美元年增 37%，資料中心加速到年增 46%，盤後跌 3.1%"}, {"t": "AVGO", "n": "客製化 AI 晶片的最大對手，Marvell 的展望等於對它的需求交叉驗證"}], "en": "Marvell reported fiscal Q2 2027 revenue of $2.739 billion, up 37% year over year and a quarterly record, with data centre revenue growth accelerating to 46%. Non-GAAP EPS was $0.94, beating on both lines. Management lifted full-year revenue guidance to nearly $11.5 billion, about 40% growth, and said Q3 will reach $3 billion a full quarter ahead of plan. The stock still fell about 3.1% after hours. It has nearly doubled this year; the good news was already in the price.", "zh": "Marvell 公布 FY2027 第二季營收 27.39 億美元、年增 37%，創單季新高，其中資料中心營收成長加速到年增 46%；非 GAAP 每股獲利 0.94 美元，營收與獲利雙雙超過預期。管理層把全年營收展望上修到接近 115 億美元、年增約 40%，並說第三季就會摸到 30 億美元，比原計畫提早整整一季。但股價盤後仍下跌約 3.1%——這檔今年已經漲了將近一倍，好消息早就在價格裡。", "url": "https://www.businesswire.com/news/home/20260827816134/en/Marvell-Technology-Inc.-Reports-Second-Quarter-of-Fiscal-Year-2027-Financial-Results"},
  {"id": "earn_1", "channel": "財報速報", "tag": "上調也跌", "color": "#E8786A", "stocks": [{"t": "ADSK", "n": "營收年增約 16%、上調全年展望，盤中漲 6.2% 但盤後跌約 5%"}, {"t": "ADBE", "n": "同屬設計創作軟體，當日漲 5.7%，用來對照本益比修復的節奏"}], "en": "Autodesk grew fiscal Q2 2027 revenue about 16% and raised its full-year billings and revenue growth guidance, including the incremental contribution from MaintainX. Management said the sales reorganisation is proceeding as expected. This is a solid report by any normal standard. But the stock had already risen 6.2% during the session with the rest of software, and gave back about 5% after hours. That is the recurring pattern this earnings season: the price moves on the narrative first, and the report only tests whether the narrative was overpriced.", "zh": "Autodesk 的 FY2027 第二季營收年增約 16%，並上調全年帳單與營收成長展望，其中包含新併入的 MaintainX 貢獻；公司也表示銷售組織改組進度符合預期。以一般標準看，這是一份紮實的財報。但股價在盤中已經跟著整個軟體類股先漲了 6.2%，盤後反而回吐約 5%。這是這個財報季反覆出現的模式：價格先反應敘事，財報只負責檢驗敘事有沒有被過度定價。", "url": "https://seekingalpha.com/news/4637621-autodesk-dips-after-q2-earnings-show-16-revenue-gain"},
  {"id": "earn_2", "channel": "財報速報", "tag": "七成展望", "color": "#E8786A", "stocks": [{"t": "NVDA", "n": "下一個會計年度營收展望約成長七成，當日漲約 8%"}, {"t": "VRT", "n": "資料中心電力與散熱設備，算力擴張外溢的第一站"}], "en": "To finish the Nvidia story: what actually held the tape up on Thursday was not the $96.2 billion of Q2 revenue but management saying revenue will grow roughly 70% next fiscal year. That single sentence pushed the visibility on AI capital spending out by another year, and it explains why power and cooling equipment names moved in sympathy. The compute expansion Nvidia describes requires somebody to build the halls, run the power and handle the heat. The stock closed up about 8%.", "zh": "把輝達財報的餘波講完：真正撐住週四盤面的不是第二季那 962 億美元營收，而是管理層說下一個會計年度營收「約成長七成」。這一句話等於把 AI 資本支出的能見度往後推了一整年，也直接解釋了為什麼電力與散熱設備股同步走強——輝達描述的算力擴張，最後總得有人去蓋機房、拉電力、處理散熱。當日股價收漲約 8%。", "url": "https://www.bloomberg.com/news/articles/2026-08-27/us-stock-futures-climb-as-nvidia-s-outlook-lifts-tech-sector"},
  {"id": "macro_0", "channel": "總經政策", "tag": "沃許首演", "color": "#7C6AF7", "stocks": [{"t": "IEF", "n": "7-10年期公債ETF，對政策路徑的定價最直接"}, {"t": "GLD", "n": "黃金ETF，實質利率預期的鏡子"}], "en": "Fed Chair Kevin Warsh delivers his first major speech as chair at Jackson Hole today, Friday, at 10:00 a.m. Eastern. He took over as the 17th chair on May 22, and this is the first time markets get to hear him lay out a policy framework in full. The situation is not an easy one to hand over: inflation is still above the 2% target while the labour market shows no sign of loosening. Bond markets have been positioning for a hint, but the thing worth listening for is the framework, not the next meeting's vote.", "zh": "聯準會主席 Warsh 今天（週五）美東時間上午 10 點在傑克森洞發表就任以來的第一場主席演說。他在今年 5 月 22 日接任第 17 任主席，這是市場第一次有機會完整聽他談貨幣政策框架。眼前這個局面不好接手：通膨還在 2% 目標之上，勞動市場卻沒有鬆動的跡象。債市已經先在猜他會不會鬆口，但真正該聽的是框架本身，而不是下一次會議的那一票。", "url": "https://www.npr.org/2026/08/27/nx-s1-5945044/federal-reserve-kevin-warsh-jackson-hole-wyoming-bond-markets"},
  {"id": "macro_1", "channel": "總經政策", "tag": "改目標？", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債ETF，通膨目標若鬆動它是第一線"}, {"t": "IEF", "n": "中天期公債ETF，長期通膨預期改變會直接改寫它的合理殖利率"}], "en": "Warsh has convened 15 outside experts to review the Fed's monetary policy framework, with recommendations due by the end of 2026. It is worth watching because inflation has now run above the 2% target for half a decade. When a target is missed for that long, the conclusion of a review is often not try harder but redefine the target. If the 2% number itself moves, the asset most affected is not equities but the pricing basis for long-duration bonds and inflation-protected securities.", "zh": "Warsh 上任後找了 15 位外部專家重新檢討聯準會的貨幣政策框架，建議預計今年底前出爐。值得盯的理由是：通膨已經連續五年高於 2% 的目標。當一個目標長期達不到，檢討的結論往往不會只是「更努力」，而是把目標本身重新定義。萬一真的動到 2% 這個數字，受影響最大的不是股市，而是長天期債券與抗通膨資產的定價基礎。", "url": "https://www.rexshares.com/jackson-hole-explained/"},
  {"id": "macro_2", "channel": "總經政策", "tag": "退稅巨浪", "color": "#7C6AF7", "stocks": [{"t": "GPC", "n": "汽車與工業零件通路商，進口曝險大、退稅現金流可觀"}, {"t": "HELE", "n": "家用消費品，FY2026 已繳 8,050 萬美元 IEEPA 關稅並提出退稅申請"}, {"t": "EPC", "n": "個人護理，同屬高進口比重的中型消費品公司"}], "en": "Since the Supreme Court ruled in February that IEEPA does not authorise the president to impose tariffs, the refund numbers have started to firm up. As of July 31, more than 75,000 declarations had been submitted, 17.69 million entries had been liquidated without IEEPA tariffs, and Customs had accepted roughly $128.68 billion in potential and certified refunds for processing. That money is flowing back onto importers' income statements quarter by quarter, and it usually shows up as a reduction in cost of revenue, which flatters gross margin without being repeatable. Strip it out when reading results.", "zh": "自從最高法院在今年 2 月判定 IEEPA 不授權總統課徵關稅之後，退稅的規模開始有數字了：到 7 月 31 日為止，超過 7.5 萬份申報送出、1,769 萬筆已在不含 IEEPA 關稅的情況下清算，海關受理處理中的潛在與已核定退稅金額約 1,286.8 億美元。這筆錢正一季一季回流到進口商的損益表，而且多半以「銷貨成本減項」的形式出現，會讓毛利率短期漂亮、卻不具持續性。看財報時務必把它拆出來。", "url": "https://www.bdo.com/insights/tax/ieepa-tariff-refunds-frequently-asked-questions"},
  {"id": "sector_0", "channel": "產業風向", "tag": "電力外溢", "color": "#4EABA4", "stocks": [{"t": "VRT", "n": "上調 2026 全年營收展望至 138 至 142 億美元"}, {"t": "PWR", "n": "電力工程承包，機房拉電的實際施工方"}, {"t": "ETN", "n": "電力管理設備，資料中心配電的另一條主線"}], "en": "Nvidia's capital spending story keeps spilling downstream, most visibly into data centre power and cooling. Vertiv has raised full-year 2026 guidance to net sales of $13.80 to $14.20 billion with GAAP operating profit of $2.96 billion, citing demand for AI-ready power and liquid cooling. What makes this leg different is that it is more physical than silicon: lead times, supply-chain congestion and phased project execution all slow recognition, so a strong order book does not translate into a strong quarter on the same schedule.", "zh": "輝達的資本支出敘事正在往下游外溢，最明顯的一段是資料中心的電力與散熱。Vertiv 已經把 2026 年全年營收展望上調到 138 至 142 億美元、GAAP 營業利益 29.6 億美元，理由就是 AI 機房對電力與液冷的需求。這條線跟晶片不同的地方在於它更「實體」：交期、供應鏈壅塞、專案分期執行都會拖慢認列，所以訂單好看不等於當季營收也好看。", "url": "https://simplywall.st/stocks/us/capital-goods/nyse-vrt/vertiv-holdings-co/news/vertiv-vrt-is-up-128-after-raised-2026-guidance-and-new-ai-d/amp"},
  {"id": "sector_1", "channel": "產業風向", "tag": "太陽能轉彎", "color": "#4EABA4", "stocks": [{"t": "SHLS", "n": "在手與已得標訂單 8.014 億美元、年增 19.4%，推出資料中心用 AirLink"}, {"t": "TAN", "n": "太陽能ETF，用來對照整個類股的情緒"}, {"t": "FSLR", "n": "美國本土太陽能模組龍頭，需求端的另一半"}], "en": "Solar balance-of-system suppliers are repositioning themselves as data centre supply chain. Shoals reported backlog and awarded orders of $801.4 million as of June 30, up 19.4% year over year, with about $207 million added in the quarter for a book-to-bill of 1.3, and launched AirLink, a power delivery product aimed at data centres. Around $700 million of that backlog ships over the next four quarters. This is a transition worth tracking: same capacity, same plants, a different customer list.", "zh": "太陽能的電氣平衡系統供應商正在把自己重新定位成資料中心供應鏈。Shoals 截至 6 月底的在手與已得標訂單為 8.014 億美元、年增 19.4%，單季新增約 2.07 億、訂單出貨比 1.3，並推出針對資料中心的 AirLink 電力輸送產品，其中約 7 億美元的訂單會在未來四季出貨。這是一個值得追蹤的轉型樣本：同一批產能、同一批工廠，客戶名單卻從公用事業級太陽能換成了機房。", "url": "https://www.sec.gov/Archives/edgar/data/0001831651/000183165126000105/exhibit991earningsrelease2.htm"},
  {"id": "sector_2", "channel": "產業風向", "tag": "油價鬆動", "color": "#4EABA4", "stocks": [{"t": "XLE", "n": "能源類股ETF，油價回落的直接承受方"}, {"t": "XOM", "n": "綜合油氣龍頭，煉化事業讓它對油價的槓桿相對低"}, {"t": "HAL", "n": "油服商，資本支出對油價的敏感度最高"}], "en": "Oil is letting go. WTI fell 1.06% on Thursday to $81.36, having watched Brent spike as high as $105 on July 23 after tanker attacks in the Strait of Hormuz. The recent slide came because Washington's latest measures against Iran were less aggressive than the market expected, stopping short of secondary sanctions on Iran's trading partners. The EIA forecasts Brent averaging around $85 in the third quarter and falling to about $69 in 2027. The geopolitical premium is being squeezed out slowly.", "zh": "油價這一週在鬆手。西德州原油週四跌 1.06% 到 81.36 美元，而 7 月底因為荷莫茲海峽的油輪遇襲，布蘭特原油一度衝到 105 美元。近期回落的理由是華府對伊朗的新措施沒有市場想像的強硬——並未對伊朗的貿易夥伴祭出次級制裁。美國能源資訊署預估布蘭特第三季均價約 85 美元、2027 年降到 69 美元。地緣風險溢價正在被慢慢擠出來。", "url": "https://www.eia.gov/outlooks/steo/report/global_oil.php"},
  {"id": "small_0", "channel": "小型股風雲", "tag": "沒跟上車", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，當日幾乎沒動、盤後 -0.01%"}, {"t": "RSP", "n": "標普500等權重ETF，同樣被窄幅漲勢排除在外"}], "en": "A session where only mega-cap technology rises is the most awkward kind for small caps. The Russell 2000 barely moved, down 0.01% in after-hours trade, capturing none of the Nvidia move. The reason is not complicated: what rallied were direct beneficiaries of AI capital spending, and the share of the small-cap index that genuinely touches that supply chain is low. When gains concentrate in a few chains, equal-weight and small-cap baskets get left standing.", "zh": "週四這種「只有大型科技上漲」的盤，小型股是最尷尬的一群。羅素 2000 在盤後幾乎沒動、僅 -0.01%，完全沒吃到輝達行情的紅利。原因不難懂：這波漲的是 AI 資本支出的直接受益者，而小型股指數裡真正沾得到邊的比例很低。當漲勢集中在少數幾條供應鏈上，等權重與小型股就會被留在原地。", "url": "https://stockanalysis.com/markets/afterhours/"},
  {"id": "small_1", "channel": "小型股風雲", "tag": "虧錢的贏", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素2000成長型ETF，虧損公司權重集中的地方"}, {"t": "XBI", "n": "生技ETF，「沒有獲利、押未來」這個族群的典型代表"}], "en": "Something unusual is happening inside the small-cap index. Since mid-2025, unprofitable Russell 2000 companies have gained 154% while profitable peers rose 34%. The market is paying for AI exposure, not for current earnings. That structure reinforces itself while risk appetite holds, but it is also the clearest warning available: when the funding environment turns, this is always the first cohort to be dropped.", "zh": "小型股內部正在發生一件反常的事：自 2025 年年中以來，羅素 2000 裡「不賺錢」的公司大漲 154%，而有獲利的同儕只漲 34%。市場在為 AI 的曝險付錢，不是為當期獲利付錢。這種結構在風險偏好還在的時候會自我強化，但它同時也是最清楚的一個提醒——當資金環境轉向，最先被丟掉的永遠是這一批。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
  {"id": "small_2", "channel": "小型股風雲", "tag": "折價迷思", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普600小型股ETF，成分股要求連續獲利，是比較乾淨的對照組"}, {"t": "IWB", "n": "羅素1000 ETF，折價計算裡的分母"}], "en": "The standard bull case is that small caps are cheap: the Russell 2000 ETF trades at about 19.21 times earnings against 29.32 for the Russell 1000, a 34.5% discount. Read that number carefully. Part of the discount comes from sector composition, since financials, industrials and real estate carry heavy weights and were never going to earn a technology multiple. Another part comes from the unprofitable cohort distorting the denominator. A discount does not mean cheap, it means different.", "zh": "常見的多頭論點是「小型股便宜」：羅素 2000 ETF 約 19.21 倍本益比，羅素 1000 約 29.32 倍，折價 34.5%。但這個數字要小心讀。折價有一部分來自成分股的產業結構——金融、工業、地產權重高，本來就給不到科技的倍數；另一部分來自那批沒有獲利的公司把分母弄失真了。折價不等於便宜，只等於「不一樣」。", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/"},
  {"id": "small_3", "channel": "小型股風雲", "tag": "沾邊行情", "color": "#5B8ED6", "stocks": [{"t": "FORM", "n": "半導體探針卡與測試設備，隨輝達展望跳升"}, {"t": "ACLS", "n": "離子植入設備商，同屬設備端的小型股"}], "en": "The small caps that actually moved on Thursday were the ones that could attach themselves to Nvidia's supply chain. FormFactor, which makes probe cards and semiconductor test equipment, jumped with the broad chip rally, not because of anything in its own results but because Nvidia's 70% growth guidance forced the whole chain's capacity assumptions higher. Adjacency trades like this are fast, concentrated and entirely narrative-dependent, which means they retrace the same path on the first day the narrative loosens.", "zh": "週四小型股裡真正動起來的，是能沾上輝達那條供應鏈的名字。做半導體探針卡與測試設備的 FormFactor 隨著整個半導體類股跳升，理由不是自己的財報，而是輝達給出的七成成長展望讓整條產業鏈的產能假設被上修。這類「沾邊行情」的特性是快速、集中、而且高度依賴敘事——它會在敘事鬆動的第一天原路走完。", "url": "https://www.stocktitan.net/rankings/top-news/gainers/2026-08"},
  {"id": "small_4", "channel": "小型股風雲", "tag": "池子問題", "color": "#5B8ED6", "stocks": [{"t": "IWC", "n": "微型股ETF，流動性最薄的一層"}, {"t": "VTWO", "n": "另一檔羅素2000 ETF，用來對照成交量的級距差異"}], "en": "A mechanism you have to internalise before trading small caps: the same piece of good news is a repricing in a large cap and an absence of sellers in a small one. Daily dollar volume in a small cap can be a few hundredths of a large cap's, so modestly concentrated buying pushes the price a long way, and the same is true on the way out. So a 20% single-day move in a small cap does not necessarily mean the information was worth 20%. Often the pool was simply too small. Micro caps are the extreme version of this.", "zh": "一個做小型股必須先懂的機制：同樣一則好消息，在大型股是重新定價，在小型股常常只是「沒有賣方」。小型股每天的成交金額可能只有大型股的幾百分之一，買盤稍微集中就能把價格推開一大段，賣的時候同理。所以在小型股上看到 20% 的單日漲幅，不必然代表這則資訊有 20% 的價值，很可能只是池子太小。微型股更是這種現象的極端版本。", "url": "https://www.royceinvest.com/insights/chartbook/us-small-cap-mrkt-overview/index.html"},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "銀行拐點", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月下旬 Q3 財報", "stocks": [{"t": "FRST", "n": "第二季淨利 940 萬美元、去年同期 240 萬，淨息差由 2.86% 擴到 3.45%"}], "en": "Primis Financial is a Virginia community bank holding company with a market value under $400 million and barely any analyst coverage. The reason it is ignored is concrete: two years tangled in problem assets and a consumer-loan accounting issue, so the market simply stopped looking. What is changing is the arithmetic. Q2 net income to common shareholders was $9.4 million, or $0.38 a share, against $2.4 million and $0.10 a year earlier; net interest income rose 34% to $33.8 million; net interest margin widened from 2.86% to 3.45%; non-performing assets fell 37% in the quarter to $63 million, or 1.45% of assets. Risks and the other side: $5.9 million of the gain came from selling an insurance agency, the mortgage arm is highly rate-sensitive, and 1.45% NPAs is still high versus peers. This is a research lead, not investment advice.", "zh": "Primis Financial 是維吉尼亞州的社區銀行控股公司，市值不到 4 億美元、分析師覆蓋屈指可數。它被忽視的理由很實在：過去兩年被不良資產與一樁消費貸款的會計問題纏住，市場乾脆不看了。正在改變的是數字本身——第二季歸屬普通股東淨利 940 萬美元、每股 0.38 美元，去年同期只有 240 萬與 0.10 美元；淨利息收入年增 34% 到 3,380 萬；淨息差從 2.86% 擴大到 3.45%；不良資產單季下降 37% 到 6,300 萬、佔總資產 1.45%。風險與反方論點：獲利裡有 590 萬來自出售保險代理的一次性利益，房貸業務對利率高度敏感，而 1.45% 的不良資產比率在同業中仍偏高。這是研究線索，不是投資建議。", "url": "https://www.prnewswire.com/news-releases/primis-financial-corp-reports-strong-results-for-the-second-quarter-of-2026-302833482.html"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "分家後遺", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 FY2026 第四季財報", "stocks": [{"t": "AZTA", "n": "第三季營收 1.612 億美元、年增約 12%，由虧轉盈，董事透過家族信託買進 1 萬股"}], "en": "Azenta does sample management and multiomics services for life sciences: in plain terms it stores, tracks and analyses biological samples for drugmakers and research institutions. It is ignored because of an awkward corporate history. After separating from Brooks Automation, semiconductor investors stopped following it and biotech investors never picked it up, so it fell into the gap. What is changing: fiscal Q3 revenue of $161.2 million, up about 12% year over year, swinging from a loss to net income of $2.46 million, alongside a director buying 10,000 shares in the open market through family trusts. Risks and the other side: the profit base is tiny enough that one quarter's product mix can reverse it, reliance on external borrowing is high, and pharma R&D budgets are in a tightening cycle. This is a research lead, not investment advice.", "zh": "Azenta 做的是生命科學的樣本管理與多體學服務——白話說，就是替藥廠與研究機構保存、追蹤、分析生物樣本。它被忽視是因為身世尷尬：從 Brooks Automation 分家出來之後，半導體投資人不再看它、生技投資人也不熟它，整檔掉在兩邊的裂縫裡。正在改變的是第三季營收 1.612 億美元、年增約 12%，並從去年同期的虧損轉為淨利 246 萬美元；同時有董事透過家族信託在公開市場買進 1 萬股。風險與反方論點：獲利基數極小，一個季度的產品組合變化就能翻盤；公司對外部借款的依賴度偏高；而且藥廠研發支出正處在縮減週期。這是研究線索，不是投資建議。", "url": "https://www.gurufocus.com/news/9003172/is-azenta-inc-azta-a-value-play-after-q3-earnings-report-eps-at-003-revenue-of-161m-gf-score-71100"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "退稅換血", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報與退稅認列的拆分", "stocks": [{"t": "HNST", "n": "上半年收到 1,190 萬美元關稅退稅，Q2 基礎調整毛利率 43.8% 創新高"}], "en": "Honest Company sells clean-label baby and household products, originally direct to consumer. It is a small-cap consumer name that has spent most of its listed life below its IPO price with very little media presence. Two things are changing. It received $11.9 million of IEEPA tariff refunds in the first half, of which $6.6 million was recognised as a reduction in cost of revenue. Underneath that, Q2 gross margin was 48.4%, up 800 basis points, and underlying adjusted gross margin of 43.8% was an all-time high; the company raised full-year organic revenue growth guidance to 5-7% and adjusted EBITDA to $23-25 million. Risks and the other side: reported revenue actually fell 10.9% on diaper declines and deliberate channel exits, the refund is one-off, and a 9.8% EBITDA margin is still thin for consumer staples. This is a research lead, not investment advice.", "zh": "Honest Company 做的是嬰兒與家庭用的無添加日用品，以直接面對消費者起家，是一檔上市後多數時間低於發行價、媒體聲量很小的小型消費股。正在改變的有兩件事：上半年收到 1,190 萬美元的 IEEPA 關稅退稅，其中 660 萬認列為銷貨成本的減項；本業方面第二季毛利率 48.4%、年增 800 個基點，而扣掉退稅影響後的基礎調整毛利率 43.8% 仍創歷史新高，公司也上調全年有機營收成長至 5% 至 7%、調整後 EBITDA 至 2,300 至 2,500 萬美元。風險與反方論點：整體營收其實年減 10.9%（尿布業務衰退加上主動退出部分通路），退稅是一次性的，而 9.8% 的 EBITDA 利潤率在日用品業裡仍屬偏薄。這是研究線索，不是投資建議。", "url": "https://investors.honest.com/news-releases/news-release-details/honest-company-reports-second-quarter-2026-results/"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "董事重押", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報", "stocks": [{"t": "GWRS", "n": "兩位董事 8/20 同日以每股 8.85 美元買進，合計約 700 萬美元"}], "en": "A pool name, Global Water Resources, the small Arizona water utility, has produced unusually strong new evidence. On August 20 two directors bought in the open market on the same day: Jonathan Levine took 651,618 shares for about $5.77 million and Andrew Cohn 139,343 shares for about $1.23 million, both at $8.85. For a utility with a market value in the low hundreds of millions that is a very large personal commitment and a textbook cluster-buy signal. The original checkpoint is unchanged: the November Q3 report has to separate how much of the 24.8% growth came from the Tucson acquisition and how much was organic. Risk: utility growth is gated by rate-case approvals, and director buying does not guarantee an operating turn. This is a research lead, not investment advice.", "zh": "池內的 Global Water Resources（亞利桑那州的小型水務公用事業）出現了強度很高的新證據：8 月 20 日兩位董事在公開市場同日買進——Jonathan Levine 買進 651,618 股、約 577 萬美元，Andrew Cohn 買進 139,343 股、約 123 萬美元，兩筆都在每股 8.85 美元。對一家市值只有兩億多美元的公用事業來說，這是相當大的個人押注，也構成標準的群聚買進訊號。原本的驗證點不變：11 月的 Q3 財報要拆清楚 24.8% 年增裡有多少來自圖森的併購、多少是有機成長。風險：公用事業的成長受費率核准節奏限制，董事買進不保證營運真的轉折。這是研究線索，不是投資建議。", "url": "https://www.tradingpedia.com/2026/08/24/us-insider-trades-show-shifts-in-key-names/"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "櫃體回穩", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報", "stocks": [{"t": "MBC", "n": "第二季營收 1.4918 億、淨利 204 萬美元，8 月初有內部人買進 6 萬股約 50.58 萬美元"}], "en": "Two pieces of new information on pool name MasterBrand, North America's largest maker of kitchen and bath cabinets. Operationally: Q2 sales of $149.18 million against $129.75 million a year earlier, with net income rising from $518,000 to $2.04 million. On the insider side, an insider named Banyard bought 60,000 shares in early August for roughly $505,800. The existing checkpoint was whether legacy MasterBrand revenue can stop falling in Q3, having declined 5.6% last quarter, and how fast the $100 million annualised synergy target lands. These two data points shore the thesis up slightly without clearing it. Risk: existing-home transaction volume has not recovered, and cabinets are classic deferrable demand. This is a research lead, not investment advice.", "zh": "池內的 MasterBrand（北美最大的廚房與浴室櫃體製造商）有兩筆新資訊。營運面：第二季營收 1.4918 億美元、高於去年同期的 1.2975 億，淨利從 51.8 萬升到 204 萬。內部人方面：8 月初有一位姓 Banyard 的內部人買進 6 萬股、金額約 50.58 萬美元。原本的驗證點是 Q3 要看原 MasterBrand 本體營收能否止跌（上一季是 -5.6%），以及一億美元年化綜效的落地速度；這兩筆新資料讓論點稍微站穩了一點，但還沒過關。風險：成屋交易量沒有回來，而櫃體是典型可以延後的需求。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/capital-goods/nyse-mbc/masterbrand/news/undervalued-small-caps-with-insider-buying-to-watch-in-augus-1"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "買回加碼", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報", "stocks": [{"t": "EVTC", "n": "第二季買回 190.7 萬股、花費 4,710 萬美元，8 月 4 日再加碼 1.5 億美元授權"}], "en": "Pool name Evertec, the payments processor for Puerto Rico and Latin America, has stepped up its buyback. Q2 revenue was $274.82 million against $229.61 million a year earlier; in the same quarter it repurchased 1,907,437 shares for $47.1 million; and on August 4 it added a further $150 million of authorisation while raising full-year revenue guidance. The original checkpoint was whether the gap between net income and revenue converges, that is, whether the $5.41 million level was a one-off dent caused by the data breach. The larger buyback can be read as an indirect answer from management, but it does not substitute for the actual Q3 numbers. Risks: Latin American currencies, and authorisation is not execution. This is a research lead, not investment advice.", "zh": "池內的 Evertec（波多黎各與拉丁美洲的支付處理商）把買回的力道拉大了。第二季營收 2.7482 億美元、去年同期 2.2961 億；同一季買回 1,907,437 股、花掉 4,710 萬美元；8 月 4 日再加碼 1.5 億美元的買回授權，並上調全年營收展望。原本的驗證點是「淨利與營收的落差是否收斂」，也就是 541 萬那種水準到底是不是資料外洩造成的一次性凹陷。買回加碼可以視為管理層對這個問題的間接回答，但仍不能取代 Q3 的實際數字。風險：拉美匯率波動，以及授權不等於實際執行。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/diversified-financials/nyse-evtc/evertec/news/top-undervalued-small-caps-with-insider-activity-in-august-2/amp"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "執行長進場", "color": "#6DB56D", "stocks": [{"t": "TTMI", "n": "執行長 8/25 買進 1 萬股約 112 萬美元，同週董事再買 52.45 萬美元"}], "en": "TTM Technologies CEO Edwin Roks bought 10,000 shares in the open market on August 25 at prices from $111.73 to $111.88, a weighted average of $111.77 and about $1.12 million in total, lifting his direct holding 18% to 64,814 shares. In the same week director Rex Geveden bought $524,500. But the CFO sold nearly 6,000 shares in that same week. That combination is worth pausing on: buying usually has one reason and selling can have many, so when both appear together the most reasonable reading is a difference in personal tax and portfolio circumstances, not internal disagreement.", "zh": "TTM Technologies 的執行長 Edwin Roks 在 8 月 25 日於公開市場買進 1 萬股，成交價區間 111.73 至 111.88 美元、加權均價 111.77 美元，金額約 112 萬美元，直接持股一口氣增加 18% 到 64,814 股。同一週董事 Rex Geveden 也買進 52.45 萬美元。但同一週財務長賣掉了將近 6,000 股。這種「執行長買、財務長賣」的組合值得停下來想：買進通常只有一個理由，賣出可以有很多個，兩者同時出現時，比較合理的解讀是個人稅務與資產配置的差異，而不是內部有分歧。", "url": "https://www.fool.com/coverage/filings/2026/08/26/ttm-technologies-ceo-edwin-roks-buys-10-000-shares-for-usd1-1-million-what-is-he-telling-investors/"},
  {"id": "insider_1", "channel": "內部人動向", "tag": "四十八比一", "color": "#6DB56D", "stocks": [{"t": "TSM", "n": "90 天視窗內有 3 位不同內部人買進，是追蹤範圍中群聚訊號最強的一家"}], "en": "Putting individual cases back into context is sobering. In early August the tracked universe showed 1,910 open-market sale transactions against just 40 purchases, roughly 48 sales for every buy. Of 149 tracked companies, only 8 had a named officer such as a CEO or CFO buy in the open market. Only 2 showed a cluster signal, meaning two or more distinct insiders buying inside a 90-day window, and the one with the most distinct buyers was Taiwan Semiconductor with three. Insider buying is a signal precisely because it is rare.", "zh": "把個別案例放回全景會清醒很多：8 月上旬的統計裡，追蹤範圍內出現 1,910 筆公開市場賣出，對上只有 40 筆買進，比例約 48 比 1。在 149 家追蹤的公司中，只有 8 家有具名高管（執行長、財務長等）進場買進。90 天視窗內出現「兩位以上不同內部人買進」這種群聚訊號的，只有 2 家，其中買進人數最多的是台積電的 3 位。內部人買進之所以會是訊號，正是因為它很稀有。", "url": "https://pro.stockalarm.io/blog/insider-buying-vs-selling-signals"},
  {"id": "insider_2", "channel": "內部人動向", "tag": "怎麼讀它", "color": "#6DB56D", "stocks": [{"t": "GWRS", "n": "兩位董事同日買進的例子，說明「佔比」比「絕對金額」重要"}, {"t": "MBC", "n": "單一內部人買進的例子，屬於還需要更多佐證的那一類"}], "en": "Three practical reminders for reading Form 4. First, check the transaction code: only P, an open-market purchase, is a real signal, since A is a grant and S may come from a pre-set 10b5-1 plan. Second, look at the size relative to the person's wealth rather than the headline dollar figure. A director putting $5.77 million into a utility worth a couple of hundred million means something entirely different from the same amount going into a trillion-dollar company. Third, look for clustering: one person can be wrong, but two or three insiders in different roles buying at the same time cuts the noise down considerably.", "zh": "三個讀 Form 4 的實務提醒。第一，看交易代碼：只有 P（公開市場買進）才算真訊號，A 是股權授予、S 則可能來自 10b5-1 的預設計畫。第二，看金額佔個人財富的比例，而不是絕對金額——一位董事拿 577 萬美元去買一家市值兩億多的公用事業，跟同樣金額買進一家兆元市值的公司，含意完全不同。第三，看是不是群聚：單獨一個人可以看錯，兩三位不同職務的內部人同時進場，才把雜訊壓下來。", "url": "http://openinsider.com/latest-cluster-buys"},
  {"id": "capitol_0", "channel": "政要持股", "tag": "電網押注", "color": "#B5654D", "stocks": [{"t": "HUBB", "n": "電網與電氣設備商，該申報中的最大部位之一"}, {"t": "BWXT", "n": "海軍與商用核反應爐，核能主題的核心持股"}, {"t": "LTH", "n": "健身房營運商，這個組合裡少見的純內需消費部位"}, {"t": "CHRW", "n": "第三方物流商，帶進運價循環的曝險"}], "en": "In the House Clerk's official disclosure index, the entry most worth reading over the past 90 days is not the most famous name. It belongs to April McClain Delaney of Maryland's sixth district: 64 transactions, 60 of them purchases against only 3 sales, in a disclosed range of $288,000 to $1.52 million, and concentrated in just 15 tickers. The four largest are Hubbell in grid equipment, Life Time in fitness clubs, BWX Technologies in naval and commercial nuclear reactors, and C.H. Robinson in logistics. Set the name aside and the portfolio itself is betting on one specific proposition: that electricity demand and nuclear build-out are the through-line of the next few years. Most recent filing date, August 3.", "zh": "眾議院書記官的官方申報索引裡，過去 90 天最值得看的不是最有名的那個名字，而是馬里蘭州第六選區的 April McClain Delaney：64 筆交易中有 60 筆是買進、只有 3 筆賣出，申報金額區間 28.8 萬至 152 萬美元，而且只集中在 15 檔標的。前四大是 Hubbell（電網設備）、Life Time（健身房）、BWX Technologies（海軍與商用核反應爐）、C.H. Robinson（物流）。把名字放一邊，這個組合本身在押一個很具體的假設：電力需求與核能建設是未來幾年的主線。最近一次申報日期是 8 月 3 日。", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035118.pdf"},
  {"id": "capitol_1", "channel": "政要持股", "tag": "四十五天", "color": "#B5654D", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報標的的ETF"}, {"t": "GOP", "n": "追蹤共和黨籍議員申報標的的ETF"}], "en": "Four things worth repeating every day. First, the STOCK Act gives 45 days to file after a trade, so the price you are looking at today is a price from a month and a half ago, which makes this structurally incapable of being a trading signal. Second, filings disclose only a dollar range, for example $1,001 to $15,000, with no actual figure, so any total is an estimated band rather than a number. Third, many transactions are executed in spouse or trust accounts and the member may not have been involved. Fourth, the penalty for filing late is $200 and is routinely waived, so even the completeness of the data cannot be taken on trust. This channel is about what themes somebody is backing with real money, nothing more.", "zh": "四件每天都值得重複的事。第一，STOCK Act 給的申報期限是交易後 45 天，你今天看到的是一個半月前的價位，這讓它在結構上就不可能是買賣訊號。第二，申報只給金額區間（例如 1,001 至 15,000 美元），沒有實際數字，所以任何「總金額」都只是估算的上下限。第三，很多交易是由配偶或信託帳戶執行，議員本人未必參與決策。第四，遲交的罰款只有 200 美元、而且經常被免除，所以連資料的完整度本身都不能全信。這個頻道看的是「有人用真錢押了什麼主題」，僅此而已。", "url": "https://congressflow.com/learn/how-congress-trades-stocks"},
  {"id": "week_0", "channel": "本週事件", "tag": "數據週", "color": "#C97DD4", "stocks": [{"t": "SPY", "n": "標普500 ETF，反映整個數據週的風險胃口"}, {"t": "TLT", "n": "長天期公債ETF，非農公布當天通常波動最大"}], "en": "Start with Warsh at Jackson Hole today at 10:00 a.m. Eastern. Next week is the first week of September and the macro calendar is dense: September 1 brings ISM manufacturing and JOLTS job openings, September 2 the ADP private payrolls figure, and September 4 the August non-farm payrolls report and unemployment rate. With inflation still above 3% and initial claims down at 203,000, the payrolls print is effectively what prices the September meeting.", "zh": "今天先看 Warsh 在傑克森洞美東時間上午 10 點的演說。下週進入九月第一週，總經數據排得很密：9 月 1 日是 ISM 製造業指數與 JOLTS 職缺，9 月 2 日是 ADP 民間就業，9 月 4 日是 8 月非農就業報告與失業率。在通膨還在 3% 以上、初領失業金卻降到 20.3 萬的情況下，非農那一天基本上就決定了 9 月會議的定價。", "url": "https://www.thomsoninvestmentgroup.com/economic-calendar-september-2026"},
  {"id": "week_1", "channel": "本週事件", "tag": "財報尾聲", "color": "#C97DD4", "stocks": [{"t": "DOCU", "n": "9/4 盤前財報，市場預期每股獲利 0.84 美元、營收約 7.80 億美元"}, {"t": "AVGO", "n": "客製化 AI 晶片的另一半，接下來的財報是 Marvell 展望的交叉驗證"}, {"t": "LULU", "n": "消費端的對照組，關稅與需求同時反映在它的毛利率上"}], "en": "The earnings season is winding down but a few names next week still matter. DocuSign reports second-quarter results before the open on September 4, with consensus at $0.84 a share on about $780 million of revenue, making it a small-cap-scale test of whether AI is actually eating SaaS. Also watch the semiconductor reports scheduled for early September, particularly on the custom AI silicon side, which will directly test the industry growth assumptions Marvell just handed the market.", "zh": "財報季進入尾聲，但下週還有幾檔值得看。DocuSign 預計 9 月 4 日盤前公布第二季結果，市場預期每股獲利 0.84 美元、營收約 7.80 億美元——它是「SaaS 到底有沒有被 AI 吃掉」這個辯論的一個中型驗證樣本。另外要留意九月初排定的半導體財報，特別是客製化 AI 晶片這條線，會直接檢驗 Marvell 這次交給市場的產業成長假設。", "url": "https://www.marketbeat.com/instant-alerts/docusign-docu-to-release-quarterly-earnings-on-thursday-2025-08-28"},
  {"id": "eval_0", "channel": "今日評估", "tag": "今日評估", "color": "#E8A838", "status": "討論起點 · 往下滑到最後按討論鍵", "stocks": [{"t": "MRVL", "n": "營收年增 37%、全年上修到 115 億，盤後仍跌 3.1%"}, {"t": "ADSK", "n": "上調全年展望，盤後仍跌約 5%"}], "en": "The single thing most worth noticing today is how narrow this rally was. The S&P 500 rose 0.72% but only one of eleven sectors closed higher, and the Russell 2000 barely moved. On the same day, Marvell delivered 37% revenue growth and raised full-year guidance to $11.5 billion, and the stock still fell 3.1% after hours; Autodesk raised guidance and fell 5%. Put those together and the message is that good news is already priced, and the market is now only paying for things that exceed the narrative. An open question for you: when a single narrative is holding the index up, do you follow it, or go looking for what got left standing?", "zh": "今天最值得注意的一件事，是這波上漲有多窄。標普 500 漲了 0.72%，但十一個類股裡只有一個收紅，羅素 2000 幾乎沒動。同一天，Marvell 交出營收年增 37%、全年上修到 115 億美元的成績單，股價盤後還是跌 3.1%；Autodesk 上調展望，盤後跌 5%。這兩件事拼起來的意思是：好消息已經被提前定價，市場現在只對「超出敘事的部分」付錢。留一個開放式問題給你——當只有一條敘事在撐著指數，你會選擇跟著它走，還是去找那些被留在原地的東西？", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-27-2026"}
];

const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();
const lsKeyFor = (sub) => "mosfeed_" + BRIEF_ID + "_" + sub;

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

// ===== 資金流向(TradingView 官方嵌入元件,即時資料,每日排程不需更新) =====
function HeatmapView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",
        blockSize: "market_cap_basic", blockColor: "change",
        locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true,
        hasSymbolTooltip: true, isMonoSize: false,
        width: "100%", height: "100%"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 10px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>S&P 500 · 即時資金流向</span>
        <a href="https://finviz.com/map?t=sec&st=d1" target="_blank" rel="noopener noreferrer" className="source-link">Finviz 完整版 ↗</a>
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ flex:1, minHeight:0 }} />
    </div>
  );
}

// ===== 政要績效(TradingView 官方嵌入元件,即時資料,每日排程不需更新) =====
// NANC = 民主黨籍國會申報交易 ETF、GOP = 共和黨籍(原 KRUZ,2025-03-21 改代號),兩檔都依 STOCK Act
// 申報建倉;拿它們跟 SPY 比,就是「照著政要申報買」的真實長期績效,不必自己算、也不會過期。
function PerfView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        symbols: [["民主黨 NANC", "CBOE:NANC|12M"], ["共和黨 GOP", "CBOE:GOP|12M"], ["標普500 SPY", "AMEX:SPY|12M"]],
        chartOnly: false, locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        autosize: true, showVolume: false, showMA: false,
        hideDateRanges: false, hideMarketStatus: true, hideSymbolLogo: false,
        scalePosition: "right", scaleMode: "Percentage",
        fontSize: "10", noTimeScale: false, valuesTracking: "1",
        changeMode: "price-and-percent", chartType: "area"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  const R = CAPITOL_ROSTER;
  const money = n => n >= 1000000 ? "$" + (n / 1000000).toFixed(1) + "M"
                   : n >= 1000 ? "$" + Math.round(n / 1000) + "k" : "$" + n;
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px", overflowY:"auto" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 6px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>政要交易 ETF · 近一年</span>
        <a href="https://www.quiverquant.com/congresstrading/" target="_blank" rel="noopener noreferrer" className="source-link">Quiver 排行 ↗</a>
      </div>
      <div style={{ padding:"0 16px 10px", fontSize:"11px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
        NANC 跟著民主黨籍議員的申報建倉、GOP 跟著共和黨籍（原 KRUZ），兩檔都吃 45 天申報延遲後的資料。跟 SPY 的差距就是「照著政要申報買」的真實代價與報酬。
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ height:"300px", flexShrink:0 }} />

      {R.roster.length > 0 && (
        <div style={{ paddingTop:"20px" }}>
          <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 6px" }}>
            <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>個別議員 · 近 {R.window} 天申報</span>
            <span style={{ fontSize:"10px", color:"var(--text-tertiary)" }}>更新 {R.updated}</span>
          </div>
          <div style={{ padding:"0 16px 12px", fontSize:"11px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            眾議院 STOCK Act 定期交易報告（PTR）原始申報書彙整，共 {R.filings} 份、其中 {R.skipped_scanned} 份是紙本掃描件無法解析。金額只有級距沒有數字，絕大多數落在最低的 $1,001–$15,000，所以下面顯示的是<span style={{ color:"var(--text-secondary, inherit)" }}>申報區間</span>而不是實際金額——別把它當成真實部位大小。點議員名字可看原始申報書。
          </div>
          <div style={{ overflowX:"auto", padding:"0 16px" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"12px" }}>
              <thead>
                <tr style={{ color:"var(--text-tertiary)", fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", textTransform:"uppercase" }}>
                  <th style={{ textAlign:"left",  padding:"6px 8px 6px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>議員</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>筆數</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>買 / 賣</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>申報區間</th>
                  <th style={{ textAlign:"left",  padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>常見標的</th>
                  <th style={{ textAlign:"right", padding:"6px 0 6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>最新申報</th>
                </tr>
              </thead>
              <tbody>
                {R.roster.map(r => (
                  <tr key={r.name + r.dst}>
                    <td style={{ padding:"7px 8px 7px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      <a href={r.url} target="_blank" rel="noopener noreferrer" style={{ color:"#B5654D", textDecoration:"none" }}>{r.name}</a>
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px", marginLeft:"6px" }}>{r.dst}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums" }}>{r.n}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>
                      <span style={{ color:"#6DB56D" }}>{r.buy}</span>
                      <span style={{ color:"var(--text-tertiary)" }}> / </span>
                      <span style={{ color:"#E05C5C" }}>{r.sell}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>{money(r.lo)}–{money(r.hi)}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      {r.top.map(t => (
                        <a key={t} href={"https://www.tradingview.com/symbols/" + t + "/"} target="_blank" rel="noopener noreferrer"
                           style={{ color:"var(--text-secondary, inherit)", textDecoration:"none", marginRight:"7px", fontFamily:"'Courier New',monospace" }}>{t}</a>
                      ))}
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px" }}>共 {r.distinct} 檔</span>
                    </td>
                    <td style={{ padding:"7px 0 7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", whiteSpace:"nowrap" }}>{r.last}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ padding:"12px 16px 0", fontSize:"10px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            只涵蓋眾議院；參議院走另一套 efdsearch 系統，尚未納入。買＋賣不一定等於筆數，差額是交換（exchange）類交易。
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/28/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v9.2</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
