<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;

  [data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;

  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;

  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }

  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }

  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }
  .tab-nav button { background: none; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: Georgia, serif; transition: all 0.3s ease; padding: 0; line-height: 1.2; }
  .sub-pill { background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 0; transition: all 0.2s ease; border-bottom: 1px solid transparent; }
  .swipe-area { position: relative; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .card-slide { position: absolute; inset: 0; padding: 16px 32px 80px; display: flex; flex-direction: column; justify-content: flex-start; transition: transform 0.3s ease, opacity 0.3s ease; will-change: transform, opacity; overflow-y: auto; }
  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .source-link { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }
  .source-link:hover { color: var(--text-secondary); border-color: var(--text-secondary); }
  .end-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; height: 100%; }

  .word-popup-trans { font-family: system-ui, -apple-system, 'PingFang TC', sans-serif; font-size: 14px; color: var(--text-secondary); line-height: 1.6; font-weight: 300; }

  .az-input { width:100%; background:var(--bg); border:1px solid var(--divider); color:var(--text); padding:7px 10px; font-family:'Courier New',monospace; font-size:11px; outline:none; -webkit-appearance:none; appearance:none; border-radius:0; }

  .nav-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; gap:6px; padding:10px 16px 14px; background:var(--bg); border-top:1px solid var(--divider); z-index:50; }
  .nav-btn { background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:16px; cursor:pointer; padding:10px 18px; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; line-height:1; }
  .nav-btn-icon { padding:10px 14px; font-size:13px; }
  .nav-btn-icon.playing { border-color:var(--text); color:var(--text); }

  .nav-btn-lang:hover { color:var(--text-secondary); }
  @media (max-width: 420px) { .nav-btn { padding:10px 11px; } .nav-btn-icon { padding:10px 10px; } .nav-btn-lang { padding:10px 8px; min-width:34px; } }
  .nav-btn:hover { border-color:var(--text-secondary); color:var(--text); }

<body data-theme="light">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

    {"id": "earn_1", "channel": "財報速報", "tag": "物流軟體連四季", "color": "#E8786A", "zh": "物流與供應鏈軟體商 Descartes Systems 公布截至 7 月底的季度：營收 2.01 億美元、年增 12%，比市場共識高 1%；服務營收 1.89 億美元、年增 13%，排除匯率後的有機成長約 9%；調整後 EBITDA 9,440 萬美元、年增 18%，每股盈餘 0.57 美元，連續四季營收超過預期，財報後股價漲約 6.5%。在關稅與航線不斷改變的一年，報關、路線規劃與貨況追蹤這類「規則一變就得重算」的軟體，反而成了需求穩定的生意。", "en": "Logistics and supply-chain software maker Descartes Systems reported its quarter ended July 31: revenue of $201 million, up 12% and 1% above consensus; services revenue of $189 million, up 13%, with organic growth of about 9% excluding currency; adjusted EBITDA of $94.4 million, up 18%; and EPS of 57 cents. It was the fourth straight quarterly revenue beat, and the stock rose about 6.5% after the report. In a year of constantly changing tariffs and shipping routes, customs filing, routing and tracking software that must be recalculated every time the rules move has turned into a steady-demand business.", "url": "https://www.freightwaves.com/news/descartes-reports-another-record-breaking-quarter", "stocks": [{"t": "DSGX", "n": "Descartes Systems，連四季營收超預期，財報後漲約 6.5%"}, {"t": "MANH", "n": "Manhattan Associates，倉儲與供應鏈軟體同業，可對照需求是否普遍"}]},

    {"id": "macro_0", "channel": "總經政策", "tag": "白宮喊降息", "color": "#7C6AF7", "zh": "週三利率決議前，白宮對聯準會的公開施壓升溫。川普在 Truth Social 發文要求降息，稱美國的信用「比不久前強得多」，並要聯準會理事會「當一次愛國者」；副總統范斯也強調政府正努力壓低利率、關注購屋負擔。另一邊，主席華許在傑克森霍爾把通膨列為「首要焦點」，8 月 CPI 年增 3.4%，期貨把升息一碼的機率定在八成五到九成。行政部門要降、央行準備升，這種方向相反的背景很少見，決議後的記者會怎麼回應政治壓力，可能比利率本身更影響長端殖利率。", "en": "Public White House pressure on the Fed is rising ahead of Wednesday's decision. President Trump posted on Truth Social demanding lower rates, saying the U.S. is a much stronger credit than it was a short time ago and telling the Fed Board to 'BE PATRIOTS,' while Vice President Vance stressed the administration's effort to keep rates down and its focus on housing affordability. On the other side, Chair Warsh made inflation the 'predominant focus' at Jackson Hole, August CPI rose 3.4% year over year, and futures put the odds of a quarter-point hike at 85% to 90%. An administration pushing for cuts while the central bank prepares to hike is a rare backdrop, and how the press conference handles political pressure may move long-term yields more than the rate itself.", "url": "https://fortune.com/2026/09/07/wall-street-hike-expectations-kevin-warsh-fed-trump/", "stocks": [{"t": "SHY", "n": "1-3 年期公債 ETF，對升息與否最敏感"}, {"t": "TIP", "n": "抗通膨公債 ETF，若市場擔心央行向政治壓力讓步，通膨預期會先反映在這裡"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "決議前的最後數據", "color": "#7C6AF7", "zh": "週三美東早上 8 點半（台灣晚上 8 點半）先公布 8 月零售銷售與進口物價，10 點公布 7 月企業庫存，下午 2 點才是利率決議與點陣圖。也就是說，決議公布時，最新的消費數據才出爐不到六小時。零售銷售若明顯轉弱，市場會開始押「升一碼就停」；若消費仍強、進口物價又因油價上揚，點陣圖多畫一碼的機率就會升高。上週零售類股已先跌 3.2%，代表部分悲觀已經反映，數據只要不差，零售股反而可能鬆一口氣。", "en": "On Wednesday, August retail sales and import prices come out at 8:30 a.m. ET (8:30 p.m. Taiwan time), July business inventories at 10 a.m., and only then the rate decision and dot plot at 2 p.m. The freshest consumer data will be less than six hours old when the decision is announced. A clearly weak retail print would push markets toward a 'one hike and done' bet; strong spending plus import prices lifted by oil would raise the odds of an extra dot. Retail stocks already fell 3.2% last week, so some pessimism is priced in and a merely decent number could bring relief.", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262165022-week-ahead-fomc-rate-decision-dot-plot-ctrip-lennar-earnings-tradingkey", "stocks": [{"t": "RTH", "n": "零售 ETF（偏大型零售商），對 8 月零售銷售反應最直接"}, {"t": "IEF", "n": "7-10 年期公債 ETF，數據與決議同一天接連出現，殖利率可能雙向波動"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "長債壓力", "color": "#7C6AF7", "zh": "上週 10 年期公債殖利率升到 4.97% 附近，是 2023 年 10 月以來最高，30 年期約 5.36%。財政部長貝森特一直在執行公債買回，想穩住長端利率，但聯準會若在週三升息，短端上移會把整條曲線往上推，買回的效果可能被抵銷。對股市而言，房貸、商用不動產與高負債公司的融資成本看的不是聯準會利率，而是長端殖利率；30 年期若守在 5% 以上，估值偏高的成長股與需要借新還舊的企業都得重新計價。", "en": "The 10-year Treasury yield rose to about 4.97% last week, its highest since October 2023, and the 30-year reached roughly 5.36%. Treasury Secretary Bessent has been running buybacks to steady long-term rates, but a Fed hike on Wednesday would lift the short end and push the whole curve higher, potentially offsetting that effort. For equities, mortgage, commercial real estate and leveraged-company funding costs key off long yields rather than the Fed's rate; if the 30-year holds above 5%, richly valued growth stocks and companies that need to refinance will both have to reprice.", "url": "https://palmafutures.substack.com/p/sunday-post-recap-and-week-ahead-24c", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，30 年期殖利率約 5.36%"}, {"t": "GOVT", "n": "美國公債綜合 ETF，反映整條殖利率曲線的變化"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "食品股評級下滑", "color": "#4EABA4", "zh": "包裝食品股的信用品質正在一家一家往下掉。標普 9/9 把 Flowers Foods 從 BBB- 降到 BB+ 垃圾級，穆迪上週五也把它的無擔保債降到 Ba2；原因是第二季銷售年減 4%、EBITDA 減 18%，核心麵包銷量掉 9.5%，槓桿升到約 3.5 倍，5 月已把股利砍半。同一天標普把 Hormel 的展望調為負向，雖然維持 A-，但指出槓桿一年半都在 1.8 倍以上、EBITDA 利潤率從疫情前逾 14% 降到 11% 以下。消費者換品牌、人工與運費上升，壓力不只一家公司。", "en": "Credit quality in packaged food is slipping one company at a time. S&P cut Flowers Foods from BBB- to junk-rated BB+ on Sept. 9, and Moody's lowered its unsecured debt to Ba2 on Friday, citing a 4% second-quarter sales decline, an 18% EBITDA drop, a 9.5% fall in core bread volumes and leverage of about 3.5 times; the dividend was already halved in May. The same day S&P moved Hormel's outlook to negative while affirming A-, noting leverage at or above 1.8 times for a year and a half and EBITDA margins down from over 14% before COVID to below 11%. With shoppers switching brands and labor and freight costs rising, the pressure is not limited to one company.", "url": "https://www.investing.com/news/stock-market-news/sp-cuts-flowers-foods-rating-to-junk-on-weak-sales-93CH-4894369", "stocks": [{"t": "FLO", "n": "Flowers Foods，標普與穆迪都降到垃圾級，股利 5 月已砍半"}, {"t": "HRL", "n": "Hormel，標普展望轉負、仍維持 A-"}, {"t": "XLP", "n": "必需消費品 ETF，觀察食品股是否拖累防禦類股"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "銀行評級上調", "color": "#4EABA4", "zh": "和食品股相反，部分區域銀行的信用面在改善。惠譽上週五把 Citizens Financial 與旗下 Citizens Bank 從 BBB+ 升到 A-，理由是資產重新定價帶動利差擴大、信用成本穩定，加上私人銀行與資本市場業務的手續費收入成長，讓獲利來源更分散。同一週 WaFd 宣布與 EverBank Financial 進行約 39 億美元的反向合併，區域銀行整併仍在進行。升息環境對存款成本控制得好的銀行是順風，但商用不動產放款的信用品質仍是整個族群共同的風險。", "en": "In contrast to food companies, some regional banks are seeing credit improve. Fitch upgraded Citizens Financial and Citizens Bank to A- from BBB+ on Friday, citing margin expansion from asset repricing, stable credit costs and fee growth in private banking and capital markets that diversifies earnings. The same week, WaFd announced a roughly $3.9 billion reverse merger with EverBank Financial, a sign that regional bank consolidation is continuing. Rising rates help banks that keep deposit costs in check, but commercial real estate loan quality remains a shared risk for the group.", "url": "https://ca.investing.com/news/stock-market-news/fitch-upgrades-citizens-financial-rating-on-profitability-93CH-4837060", "stocks": [{"t": "CFG", "n": "Citizens Financial，惠譽升至 A-，展望穩定"}, {"t": "WAFD", "n": "WaFd，9/8 宣布與 EverBank 約 39 億美元反向合併"}, {"t": "KRE", "n": "區域銀行 ETF，升息週的族群代表"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "太陽能關稅終判", "color": "#4EABA4", "zh": "美國商務部上週五對印度、印尼、寮國進口的太陽能電池與模組做出反傾銷與反補貼終判，合計稅率最高分別達 234%、178% 與 103%，而且會疊加在既有的行政關稅之上。這個案子由 First Solar、韓華 Qcells 等美國製造商組成的聯盟提出。下一步是國際貿易委員會 10 月 14 日的最終產業損害投票，若成立，11 月 2 日正式發布課稅令。對本土模組廠是保護，對依賴進口模組的電廠開發商則是成本上升，同一個板塊裡會出現兩種方向的反應。", "en": "The Commerce Department on Friday issued final antidumping and countervailing duty determinations on solar cells and modules from India, Indonesia and Laos, with combined rates as high as 234%, 178% and 103% respectively, stacked on top of existing executive tariffs. The case was brought by a coalition of U.S. manufacturers including First Solar and Hanwha Qcells. Next comes the International Trade Commission's final injury vote on Oct. 14; if affirmative, duty orders would be issued on Nov. 2. That protects domestic module makers but raises costs for developers that rely on imported panels, so the same sector will move in two directions.", "url": "http://pv-magazine-usa.com/2026/09/11/department-of-commerce-finalizes-trade-duties-on-solar-imports-from-india-indonesia-and-laos/", "stocks": [{"t": "FSLR", "n": "First Solar，提案聯盟成員，本土薄膜模組直接受惠"}, {"t": "TAN", "n": "太陽能 ETF，成分股同時包含受惠的製造商與受壓的開發商"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "產能不夠用", "color": "#5B8ED6", "zh": "電源模組廠 Vicor 上週五宣布在新罕布夏州買下兩塊地：梅里馬克一棟 33.4 萬平方英尺的廠房連同 66 英畝工業用地，以及胡克賽特的 54 英畝土地，用來興建第二與第三座 ChiP 晶圓廠，合計面積接近 100 萬平方英尺。原因是麻州安多弗的第一座廠使用率已接近滿載，在手訂單大增 145%，客戶包括伺服器廠與雲端業者。消息公布當天股價漲 10.6%。但第二座廠要一年後才能開始投產，這段期間出貨的上限就是現有產能。", "en": "Power-module maker Vicor said on Friday it is buying two sites in New Hampshire: a 334,000-square-foot building on 66 acres of industrial land in Merrimack and 54 acres in Hooksett, for its second and third ChiP fabs with a combined footprint of nearly 1 million square feet. Utilization at its first fab in Andover, Massachusetts, is approaching capacity and backlog is up 145%, with customers including OEMs and hyperscalers. The stock jumped 10.6% on the news. But Fab-2 has a one-year lead time to initial deployment, so shipments until then are capped by existing capacity.", "url": "https://www.globenewswire.com/news-release/2026/09/11/3360412/0/en/vicor-acquires-sites-for-additional-chip-fabs.html", "stocks": [{"t": "VICR", "n": "Vicor，宣布擴建兩座 ChiP 晶圓廠，當日漲 10.6%"}, {"t": "IWM", "n": "羅素 2000 ETF，Vicor 是小型股指數裡少數直接吃到 AI 電源需求的公司"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "專業基金連買", "color": "#5B8ED6", "zh": "小型生技股的內部人買進，有時來自懂這一行的基金，而不是經營者。上週的例子：Alumis 董事 Srinivas Akkaraju 9/8 買進約 27.3 萬股、約 290 萬美元，他是生技創投出身；ADAR1 資本 9/3 買進 Tenax Therapeutics 90 萬股、約 160 萬美元，半年內 7 買 0 賣；Opaleye 對 Sol-Gel Technologies 半年內 21 買 0 賣。這類買家通常看得懂完整臨床資料，訊號值得追蹤；但他們的持有期與承受虧損的能力都遠高於一般投資人，跟進前要先想清楚自己的時間框架。", "en": "Insider buying in small biotech sometimes comes from specialist funds rather than management. Last week's examples: Alumis director Srinivas Akkaraju, a biotech venture investor, bought about 273,000 shares worth roughly $2.9 million on Sept. 8; ADAR1 Capital bought 900,000 Tenax Therapeutics shares for about $1.6 million on Sept. 3, its seventh purchase with no sales in six months; and Opaleye has made 21 purchases and no sales of Sol-Gel Technologies over the same period. These buyers can read full clinical data, so the signal is worth tracking, but their holding periods and tolerance for losses are far greater than an individual's, so be clear about your own time frame before following.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+September+10,+2026", "stocks": [{"t": "ALMS", "n": "Alumis，生技創投背景董事 9/8 買進約 290 萬美元"}, {"t": "TENX", "n": "Tenax Therapeutics，大股東 ADAR1 半年內 7 買 0 賣"}, {"t": "SLGL", "n": "Sol-Gel Technologies，大股東 Opaleye 半年內 21 買 0 賣"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "跌落垃圾級", "color": "#5B8ED6", "zh": "判讀中小型股的一個知識：公司債被信評機構從投資等級降到垃圾級，稱為「墮落天使」。許多投資等級債基金依規定不能持有垃圾級債券，降評後會被迫賣出，公司發新債的利率也會跳一階。Flowers Foods 就是現成例子：標普與穆迪先後降到 BB+ 與 Ba2，槓桿約 3.5 倍，標普要看到 12 個月內降到 3 倍以下才可能止降。對股東的影響不只在利息，融資成本上升會壓縮股利與併購空間，所以公司 5 月已先把股利砍半。反過來說，強制賣壓有時會讓債券被賣過頭，這正是墮落天使債券 ETF 的操作邏輯。", "en": "A concept for reading small and mid caps: a company whose bonds are cut from investment grade to junk is called a fallen angel. Many investment-grade bond funds cannot hold junk debt, so they are forced to sell after a downgrade, and the company's cost of new debt steps up. Flowers Foods is a live example: S&P and Moody's cut it to BB+ and Ba2, leverage is about 3.5 times, and S&P wants it below 3 times within 12 months to stop further cuts. The impact on shareholders goes beyond interest, since higher funding costs squeeze dividends and M&A capacity, which is why the dividend was halved in May. Conversely, forced selling can push the bonds too low, which is the logic behind fallen-angel bond ETFs.", "url": "https://ng.investing.com/news/stock-market-news/moodys-downgrades-flowers-foods-rating-on-slow-deleveraging-93CH-2693681", "stocks": [{"t": "FLO", "n": "Flowers Foods，標普 BB+、穆迪無擔保債 Ba2，典型的墮落天使"}, {"t": "ANGL", "n": "墮落天使高收益債 ETF，專門買進從投資等級被降下來的債券"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "小額買進別放大", "color": "#5B8ED6", "zh": "看內部人買進，要先看金額相對於身家與市值。上週的反例：Hyperscale Data 執行董事長 Milton Ault 9/11 以每股 0.19 美元買進 15 萬股，總額約 2.8 萬美元；Tenon Medical 的投資人 HRT Financial 買進約 3.95 萬股、約 13.4 萬美元。這類交易在篩選器上一樣顯示為「內部人買進」，但一位執行董事長買 2.8 萬美元的訊號強度，和動輒數十萬到上百萬美元的買進不在同一個量級。股價低於 1 美元的股票還有交易所下市規則的壓力，這時候的小額買進有時是表態，不一定是對基本面的判斷。", "en": "When reading insider buys, first compare the amount with the insider's wealth and the company's size. Last week's counterexamples: Hyperscale Data executive chairman Milton Ault bought 150,000 shares at $0.19 on Sept. 11, about $28,000 in total, and Tenon Medical investor HRT Financial bought about 39,500 shares for roughly $134,000. Screeners list these as insider purchases just like any other, but $28,000 from an executive chairman is not in the same league as purchases of hundreds of thousands or millions of dollars. Stocks under $1 also face exchange delisting rules, so small purchases at that point are sometimes a gesture rather than a fundamental judgment.", "url": "https://www.insiderscreener.com/en/sec-form-4", "stocks": [{"t": "GPUS", "n": "Hyperscale Data，執行董事長買進約 2.8 萬美元，股價 0.19 美元"}, {"t": "TNON", "n": "Tenon Medical，投資人 HRT Financial 買進約 13.4 萬美元"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "傳聞不等於報價", "color": "#5B8ED6", "zh": "供應鏈軟體商 SPS Commerce 上週五傳出私募 GTCR 洽談收購，股價從前一天收盤 77.23 美元一度衝到 89.44 美元、漲 15.8%，收盤卻只剩 82.68 美元、漲 7.06%，守住的漲幅不到一半，市值約 30 億美元。原因很簡單：沒有報價、沒有簽約、公司也沒確認，談判可能破局或冒出其他買家。對中小型股來說，收購傳聞第一天的漲幅比較像「選擇權價值」，真正的溢價要等到有融資、有董事會支持的正式提案才算數；若破局，參考點就是傳聞前的 77.23 美元，比週五收盤低 6.6%。", "en": "Supply-chain software company SPS Commerce jumped Friday on a report that private-equity firm GTCR is in talks to buy it. From Thursday's $77.23 close the stock hit $89.44, up 15.8%, but closed at $82.68, up 7.06%, keeping less than half the intraday gain, for a market value of about $3 billion. The reason is simple: there is no price, no signed agreement and no company confirmation, and talks could fail or draw another bidder. For small and mid caps, a first-day rumor gain is closer to option value; a real premium only counts once there is a financed proposal with board support. If talks collapse, the reference point is the pre-report $77.23, 6.6% below Friday's close.", "url": "https://ts2.tech/en/sps-commerce-stock-gave-back-more-than-half-its-gtcr-takeover-rally/", "stocks": [{"t": "SPSC", "n": "SPS Commerce，傳出 GTCR 洽購，週五收 82.68 美元、漲 7.06%"}, {"t": "IGV", "n": "軟體 ETF，私募收購潮是中小型軟體股估值的下檔支撐之一"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新名字 · 三次加碼", "color": "#C9A227", "zh": "Helus Pharma（原 Cybin，今年 1 月改名並把美股代號改為 HELP）是臨床階段藥廠，主力是以迷幻藥分子為基礎的憂鬱症新藥 HLP003。為什麼被忽視：迷幻藥新藥族群過去幾年資金明顯退潮，公司又接連改名、換交易所、交接執行長，市場注意力散掉。什麼正在改變：成長長 Paul Glavine 8/31、9/3、9/8 三度在公開市場買進共 29 萬股、約 360 萬美元，執行董事長 Eric So 9/4 也買進 10 萬股、約 121 萬美元，半年內內部人 4 買 0 賣；同時三期 APPROACH 試驗已完成收案，頂線數據預計今年第四季公布。風險：6 月底現金 1.664 億美元、單季淨損 4,780 萬美元，只夠撐三個多季度，數據若不如預期幾乎一定要增資，二元事件風險極高。這是研究線索，不是投資建議。", "en": "Helus Pharma (formerly Cybin, renamed in January with its U.S. ticker changed to HELP) is a clinical-stage drugmaker whose lead asset, HLP003, is a psychedelic-derived treatment for depression. Why it is overlooked: money has flowed out of psychedelic drug developers in recent years, and the company changed its name, exchange and CEO in quick succession, scattering attention. What is changing: Chief Growth Officer Paul Glavine bought 290,000 shares in the open market on Aug. 31, Sept. 3 and Sept. 8, about $3.6 million, and Executive Chair Eric So bought 100,000 shares for about $1.21 million on Sept. 4, making four insider buys and no sales in six months; meanwhile the pivotal Phase 3 APPROACH trial is fully enrolled with topline data expected in the fourth quarter. Risks: cash was $166.4 million at June 30 against a quarterly net loss of $47.8 million, just over three quarters of runway, so a weak readout would almost certainly require new equity; this is a high-risk binary event. This is a research lead, not investment advice.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+September+11,+2026", "status": "RADAR · 下一個驗證點 2026 Q4 APPROACH 三期頂線數據（9/16 摩根士丹利醫療會議先聽管理層說法）", "stocks": [{"t": "HELP", "n": "Helus Pharma（原 Cybin），兩位高階四週內合計買進約 480 萬美元"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新名字 · 賣一座抵八成市值", "color": "#C9A227", "zh": "Logistic Properties of the Americas 是拉丁美洲的倉儲物流地產開發與持有商，在哥斯大黎加、哥倫比亞、秘魯、墨西哥有 34 座設施、約 620 萬平方英尺。為什麼被忽視：市值只有約 1 億美元，在美國掛牌但資產都在拉美，分析師覆蓋極少，今年 5 月才有巴西 BTG Pactual 首次給出評等；股價 52 週區間 2.04 到 9.41 美元。什麼正在改變：秘魯反壟斷機關 INDECOPI 批准它以 1.45 億美元把 130 萬平方英尺的 Lima Sur 物流園區賣給 FIBRA Prime，稅前淨回收約 8,500 萬美元，約為公告時市值的八成，資金將轉投墨西哥，消息公布當天股價漲 18.5%。風險：負債權益比約 0.92，出售後剩下的資產仍需折現才算數；轉投墨西哥是新的執行風險；成交量低、買賣價差大。這是研究線索，不是投資建議。", "en": "Logistic Properties of the Americas develops and owns warehouse and logistics real estate in Latin America, with 34 facilities totaling about 6.2 million square feet across Costa Rica, Colombia, Peru and Mexico. Why it is overlooked: the market value is only about $100 million, it lists in the U.S. while its assets are in Latin America, and analyst coverage is minimal, with Brazil's BTG Pactual initiating only in May; the 52-week range is $2.04 to $9.41. What is changing: Peru's antitrust authority INDECOPI approved the $145 million sale of the 1.3-million-square-foot Parque Logistico Lima Sur to FIBRA Prime, bringing about $85 million in net proceeds before taxes, roughly 80% of the market value at announcement, to be redeployed into Mexico; the stock jumped 18.5% that day. Risks: debt-to-equity is about 0.92 and the remaining assets still need a discount; redeploying into Mexico adds execution risk; volume is thin and spreads are wide. This is a research lead, not investment advice.", "url": "https://www.stocktitan.net/news/LPA/logistic-properties-of-the-americas-receives-definitive-regulatory-954r69jbu9i8.html", "status": "RADAR · 下一個驗證點 秘魯園區交割完成與 8,500 萬美元轉投墨西哥的首個案子（11 月 Q3 財報確認）", "stocks": [{"t": "LPA", "n": "Logistic Properties of the Americas，秘魯園區 1.45 億美元出售獲批，當日漲 18.5%"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "新名字 · 一進一出", "color": "#C9A227", "zh": "QVC Group 是電視與直播購物平台 QVC、HSN 的母公司，今年走完債務重整，股價年初至今跌約 47%。為什麼被忽視：重整後的新股權幾乎沒有分析師追蹤，電視購物又是公認的衰退產業，市場普遍當成價值陷阱。什麼正在改變：信用基金 GoldenTree 從 8 月下旬開始連續買進，9/3 買進約 1,180 萬美元、9/8 再以每股 16.25 美元買進 160 萬股、約 2,600 萬美元，而且沒有使用 10b5-1 預設計畫；9/10 的 13D 修正把持股從 18.8% 提高到 22%，一個月內第三次申報。對手方是另一家重整基金 Silver Point，同日以相同價格賣出相同股數。風險：GoldenTree 的成本可能大多來自重整時的債權轉股，和一般股東不同；企業價值約 61 億美元、仍有債務；本業營收衰退尚未止住。這是研究線索，不是投資建議。", "en": "QVC Group is the parent of TV and livestream shopping platforms QVC and HSN; it completed a debt restructuring this year and its shares are down about 47% year to date. Why it is overlooked: the post-reorganization equity has almost no analyst coverage, and TV shopping is widely seen as a declining business and a value trap. What is changing: credit fund GoldenTree has bought steadily since late August, about $11.8 million on Sept. 3 and 1.6 million shares at $16.25, roughly $26 million, on Sept. 8, without a 10b5-1 plan; a 13D/A filed Sept. 10 lifted its stake from 18.8% to 22%, its third filing in a month. The seller was another restructuring fund, Silver Point, which sold the same number of shares at the same price that day. Risks: much of GoldenTree's cost basis may come from debt converted to equity in the restructuring, unlike ordinary holders; enterprise value is about $6.1 billion with debt still outstanding; and revenue declines have not stopped. This is a research lead, not investment advice.", "url": "https://ortex.news/articles/162580/goldentree-goes-activist-on-qvcg-as-silver-point-exits", "status": "RADAR · 下一個驗證點 GoldenTree 後續 13D 是否提出具體訴求（董事席次、資本配置），以及下一份季報營收跌幅是否收斂", "stocks": [{"t": "QVCG", "n": "QVC Group，GoldenTree 持股升至 22%，9/8 以 16.25 美元買進 160 萬股"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內更新 · 同業被標價", "color": "#C9A227", "zh": "池內的 Enovis（骨科植入物與護具）多了一個外部估值參考。Apollo 洽談以近 200 億美元收購嬌生的 DePuy Synthes，對應去年營收 93 億美元，約 2.2 倍營收；Enovis 9 月初市值約 11.8 億美元、今年營收指引 23.1 億到 23.7 億美元，股權市值只有營收的一半左右，執行長 9/4 在 19 美元附近買進，兩位高階一週內接連進場。這不代表 Enovis 值同樣倍數：DePuy 是全球最大的骨科事業、有規模溢價，Enovis 還背著債務與 eCential 機器人併購對利潤率的拖累，Q2 調整後營業利益率只有 4.5%。但私募願意為骨科資產付這個價格，是「這個產業並非沒人要」的佐證，池內另一檔骨科股 Orthofix 也適用同一個參考。這是研究線索，不是投資建議。", "en": "Pool name Enovis (orthopedic implants and bracing) now has an outside valuation reference. Apollo is in talks to buy J&J's DePuy Synthes for nearly $20 billion, about 2.2 times last year's $9.3 billion in sales. Enovis had a market value of about $1.18 billion in early September against 2026 revenue guidance of $2.31 billion to $2.37 billion, so its equity is worth roughly half of revenue, and its CEO bought near $19 on Sept. 4, the second executive to buy within a week. That does not mean Enovis deserves the same multiple: DePuy is the world's largest orthopedics business with a scale premium, while Enovis carries debt and margin drag from the eCential robotics deal, with a second-quarter adjusted operating margin of just 4.5%. Still, private equity paying that price for orthopedic assets shows the industry is not unwanted, and the same reference applies to Orthofix, another orthopedics name in the pool. This is a research lead, not investment advice.", "url": "https://ca.investing.com/news/company-news/apollo-in-talks-to-buy-jj-orthopedics-unit-for-nearly-20-billion-4837151", "status": "RADAR · 池內更新 · 下一個驗證點 Apollo 與嬌生是否簽約（確認成交倍數）、11 月初 Q3 財報調整後營業利益率能否從 4.5% 回升", "stocks": [{"t": "ENOV", "n": "Enovis，股權市值約為營收一半，執行長 9/4 在 19 美元附近買進"}, {"t": "OFIX", "n": "Orthofix，池內另一檔骨科小型股，同樣適用私募估值參考"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新 · 關稅終判", "color": "#C9A227", "zh": "池內的 FTC Solar（太陽能追日支架）碰上政策面的新進展。商務部上週五對印度、印尼、寮國的太陽能電池與模組做出反傾銷與反補貼終判，合計稅率最高到 234%，10/14 國際貿易委員會投票，11/2 可能正式發布課稅令。對 FTC Solar 的影響是間接的：它賣的是支架不是模組，進口模組變貴會提高本土供應鏈的議價力，而支架這類鋼構件是電廠較容易本土化的部分；反面是整體建置成本上升，可能讓部分專案延後。公司上週開始出貨澳洲 330 MW 的 Fraser Coast 專案，股價週五收 2.37 美元，產業出身的董事 9 月初才買進約 27 萬美元。風險不變：燒錢速度與增資稀釋仍是最大問題。這是研究線索，不是投資建議。", "en": "Pool name FTC Solar (solar trackers) faces a new policy development. On Friday, Commerce issued final antidumping and countervailing duty determinations on solar cells and modules from India, Indonesia and Laos, with combined rates up to 234%; the ITC votes Oct. 14 and duty orders could follow Nov. 2. The effect on FTC Solar is indirect: it sells trackers, not panels, but pricier imported modules strengthen domestic supply chains, and steel structures like trackers are among the easier parts of a project to source domestically; on the other hand, higher total build costs could delay some projects. The company began shipping to the 330 MW Fraser Coast project in Australia last week, the stock closed Friday at $2.37, and a director with an industry background bought about $270,000 in early September. The risks are unchanged: cash burn and dilution remain the biggest issues. This is a research lead, not investment advice.", "url": "https://www.globenewswire.com/news-release/2026/09/08/3357614/0/en/ftc-solar-begins-shipments-on-330-mw-fraser-coast-project-in-australia.html", "status": "RADAR · 池內更新 · 下一個驗證點 10/14 國際貿易委員會產業損害投票、9/15 與 9/24 投資人會議、Q3 財報出貨量與毛利率", "stocks": [{"t": "FTCI", "n": "FTC Solar，週五收 2.37 美元，9/15 出席 H.C. Wainwright 投資會議"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內更新 · 油價條件到位", "color": "#C9A227", "zh": "池內的 Battalion Oil（微型油氣生產商）入池時設了「西德州原油守住 80 美元」的外部檢查，現在的環境遠超過這個門檻：WTI 上週收 99.98 美元、整週漲 9.6%，沙烏地繞道荷莫茲的東西向管線又因無人機攻擊停擺。這讓論點的舉證責任完全落到公司本身：高槓桿的小型生產商在接近 100 美元的油價下，營運現金流若仍無法轉正，問題就不在景氣。同時要記下反方：今天撒拉拉會議若談出荷莫茲新航道，地緣溢價可能快速退潮，這檔的跌幅會被槓桿放大。兩位董事 8 月底在約 1.3 美元買進，仍是目前唯一的內部人訊號。這是研究線索，不是投資建議。", "en": "Pool name Battalion Oil (a micro-cap oil and gas producer) entered with an external check that WTI hold $80, and conditions are now far beyond that: WTI closed last week at $99.98, up 9.6%, and Saudi Arabia's Hormuz-bypass East-West pipeline has been shut by drone attacks. That puts the burden of proof entirely on the company: if a leveraged small producer cannot turn operating cash flow positive with oil near $100, the problem is not the cycle. The counterargument should be logged too: if today's Salalah meeting produces a new Hormuz route, the geopolitical premium could fade quickly, and leverage would magnify this stock's decline. Two directors buying near $1.30 in late August remain the only insider signal. This is a research lead, not investment advice.", "url": "https://www.cnbc.com/2026/09/11/saudi-arabia-shut-down-east-west-crude-oil-pipeline.html", "status": "RADAR · 池內更新 · 下一個驗證點 11 月 Q3 財報營運現金流是否轉正；降級條件：停火且 WTI 跌破 75 美元", "stocks": [{"t": "BATL", "n": "Battalion Oil，對油價槓桿最大的微型生產商之一，董事 8 月底在約 1.3 美元買進"}]},
    {"id": "insider_0", "channel": "內部人動向", "tag": "計畫內的賣出", "color": "#6DB56D", "zh": "上週兩筆大額賣出看起來刺眼，細節卻很平常。科林研發執行長 Tim Archer 9/9 以 319.26 美元賣出 3 萬股、約 958 萬美元，同一天以每股 30.03 美元行使 3 萬股員工認股權，屬於「行權後賣出」，而且是 2 月就設定好的 10b5-1 計畫。Protagonist Therapeutics 執行長 Dinesh Patel 9/8 至 9/9 賣出約 11.8 萬股、約 1,720 萬美元，同樣是 1 月設定的 10b5-1 計畫，股價一年漲 143%、市值約 94 億美元。判讀重點：預先排定的計畫賣出與行權賣出，主要反映個人資產配置與稅務，不宜直接解讀為看空；真正要留意的是計畫外、在股價低檔時的賣出。", "en": "Two large sales last week look alarming but are routine in the details. Lam Research CEO Tim Archer sold 30,000 shares at $319.26 on Sept. 9, about $9.58 million, after exercising 30,000 employee options at $30.03 the same day, an exercise-and-sell under a 10b5-1 plan adopted in February. Protagonist Therapeutics CEO Dinesh Patel sold about 118,000 shares worth roughly $17.2 million on Sept. 8-9, also under a 10b5-1 plan set in January, after the stock rose 143% in a year to a $9.4 billion market value. The takeaway: prearranged plan sales and option exercise sales mostly reflect personal allocation and taxes and should not be read as bearish; what deserves attention is unplanned selling at low prices.", "url": "https://www.investing.com/news/insider-trading-news/lam-research-ceo-timothy-archer-sells-958-million-in-company-stock-93CH-4896620", "stocks": [{"t": "LRCX", "n": "科林研發，執行長行權後依 10b5-1 計畫賣出約 958 萬美元"}, {"t": "PTGX", "n": "Protagonist Therapeutics，執行長依 10b5-1 計畫賣出，股價一年漲 143%"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "左手換右手", "color": "#6DB56D", "zh": "篩選器上 PAMT Corp（原 P.A.M. Transportation，卡車貨運）9/3 出現一筆 3,120 萬美元的內部人買進，是當週金額最大的之一，但它不是新資金進場。董事兼大股東 Matthew Moroun 以每股 9.555 美元，把 326.8 萬股私下轉給家族的 2020 Lindsay Moroun Trust，所以同一份 Form 4 裡同時有一筆賣出與一筆等量的間接取得。判讀提醒：看到大額買進要先檢查交易代碼與備註，家族信託移轉、贈與、分拆配股都可能被網站歸類成「買進」，對股價沒有訊號意義。", "en": "Screeners showed a $31.2 million insider purchase at PAMT Corp (formerly P.A.M. Transportation, a trucking company) on Sept. 3, one of the largest of the week, but it was not new money. Director and major holder Matthew Moroun transferred 3,268,000 shares at $9.555 each to the family's 2020 Lindsay Moroun Trust in a private transaction, so the same Form 4 shows a sale and an equal indirect acquisition. The reminder: before trusting a large buy, check the transaction code and footnotes, because family trust transfers, gifts and spin-off distributions can be labeled purchases by some sites and carry no signal for the stock.", "url": "https://ng.investing.com/news/stock-market-news/pamt-director-moroun-sells-312m-shares-moves-to-trust-93CH-2688524", "stocks": [{"t": "PAMT", "n": "PAMT Corp，董事將 326.8 萬股轉入家族信託，帳面上是買進、實際是移轉"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "重複計算的賣壓", "color": "#6DB56D", "zh": "兒童骨科醫材公司 OrthoPediatrics 上週被列為「大股東集體出貨、合計 1,270 萬美元」，但這個數字重複計算了。實際情況是：10% 大股東 Squadron Capital 9/10 以均價 21.01 美元賣出 30.2 萬股、約 635 萬美元，因為它與董事 Jennifer Pritzker 合併申報，同一筆交易在兩份 Form 4 裡各出現一次；Pritzker 另在 8/28 至 9/1 申報賣出約 776 萬美元。申報文件寫明出售是為了替 Squadron 旗下其他投資事業籌資，出售後仍直接持有約 620 萬股。判讀：與基本面無關的賣出訊號較弱，但大股東持續減碼會形成賣壓，彙整網站的加總數字要先拆開再看。", "en": "OrthoPediatrics, a pediatric orthopedics device maker, was flagged last week for $12.7 million of coordinated major-holder selling, but that total double counts. In fact, 10% holder Squadron Capital sold 302,369 shares at an average $21.01 on Sept. 10, about $6.35 million; because it files jointly with director Jennifer Pritzker, the same trade appears on two Form 4s. Pritzker separately reported about $7.76 million of sales from Aug. 28 to Sept. 1. The filing says the sale was to fund Squadron's other portfolio businesses, and Squadron still directly holds about 6.2 million shares. The takeaway: selling unrelated to fundamentals is a weaker signal, but a major holder steadily trimming creates supply, and aggregated totals from tracking sites should be unpacked first.", "url": "https://www.investing.com/news/insider-trading-news/squadron-capital-10-owner-sells-635m-in-orthopediatrics-stock-93CH-4897944", "stocks": [{"t": "KIDS", "n": "OrthoPediatrics，大股東 9/10 以 21.01 美元出售 30.2 萬股，仍持有約 620 萬股"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "股票換成市政債", "color": "#B5654D", "zh": "眾議員 Kevin Hern（共和黨、奧克拉荷馬州第 1 選區）9/1 簽署的一份交易報告，幾乎是一面倒的出清：8 月 5 日到 24 日間，透過家族基金會、家族信託與個人 IRA 賣出約 30 筆股票，包括寶僑、家得寶、微軟、迪士尼、美敦力、波音、Hormel，多數單筆在 1,001 到 5 萬美元，寶僑與家得寶單筆在 5 萬到 10 萬美元。唯一的買進是一檔奧克拉荷馬州 Canadian County 教育設施債券，票面利率 3%、2029 年到期，金額 10 萬到 25 萬美元。這個部位結構代表的假設很清楚：在 10 年期殖利率逼近 5% 的環境下，把分散的股票換成短天期、免稅的市政債，用確定的收益取代股價波動。", "en": "A transaction report signed Sept. 1 by Rep. Kevin Hern (R-Okla., 1st District) is an almost one-way clear-out: between Aug. 5 and Aug. 24, his family foundation, family trust and personal IRA sold about 30 stock positions including Procter & Gamble, Home Depot, Microsoft, Disney, Medtronic, Boeing and Hormel, mostly in the $1,001 to $50,000 range, with Procter & Gamble and Home Depot at $50,001 to $100,000. The only purchase was an Oklahoma Canadian County educational facilities bond with a 3% coupon maturing in 2029, sized at $100,001 to $250,000. The implied thesis is clear: with the 10-year yield near 5%, swap a scattered stock portfolio for short-dated, tax-exempt municipal debt and trade price volatility for a known yield.", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035326.pdf", "stocks": [{"t": "PG", "n": "寶僑，家族信託賣出 5 萬至 10 萬美元，是這份申報中最大的股票賣出之一"}, {"t": "HD", "n": "家得寶，家族基金會部分賣出 5 萬至 10 萬美元"}, {"t": "SUB", "n": "短天期市政債 ETF，對應他唯一買進的 2029 年到期市政債"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "先看是哪個帳戶", "color": "#B5654D", "zh": "判讀提醒：政要申報上的「擁有者」欄位常被忽略，但它決定了這筆交易代表什麼。以 Hern 這份為例，同一份報告分成三種帳戶：家族基金會、家族可撤銷信託、個人傳統 IRA。基金會賣股常是為了支應捐贈與每年的最低發放要求，IRA 裡換股沒有即時稅務後果、比較像資產配置，信託裡的賣出才比較接近個人判斷。再加上三個限制：交易到申報最長可以隔 45 天（這份是 8 月交易、9/1 簽署）、金額只有寬區間、看不到成交價。同一句「議員賣出」，在不同帳戶裡的意義差很多，不能當成一致的看空訊號，更不是跟單的依據。", "en": "A reading note: the owner field on congressional disclosures is often ignored, yet it determines what a trade means. Hern's report splits into three accounts: a family foundation, a family revocable trust and a personal traditional IRA. Foundation sales often fund grants and annual minimum payout requirements, IRA swaps have no immediate tax consequence and look more like allocation, and trust sales are closer to personal judgment. Add three limits: up to 45 days between trade and filing (these were August trades signed Sept. 1), only broad dollar ranges, and no execution prices. The same 'lawmaker sold' means very different things across accounts, so it cannot be read as a uniform bearish signal, let alone a basis for copying trades.", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035326.pdf", "stocks": [{"t": "MUB", "n": "全美市政債 ETF，基金會與信託轉向固定收益時最常見的替代工具"}, {"t": "DIS", "n": "迪士尼，同份申報中家族信託賣出 1.5 萬至 5 萬美元的例子"}]},

  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>

    </div>
  );
}

function ThemeToggle() {

        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>政要交易 ETF · 近一年</span>
        <a href="https://www.quiverquant.com/congresstrading/" target="_blank" rel="noopener noreferrer" className="source-link">Quiver 排行 ↗</a>
      </div>
      <div style={{ padding:"0 16px 10px", fontSize:"11px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
        NANC 跟著民主黨籍議員的申報建倉、GOP 跟著共和黨籍（原 KRUZ），兩檔都吃 45 天申報延遲後的資料。跟 SPY 的差距就是「照著政要申報買」的真實代價與報酬。
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ height:"300px", flexShrink:0 }} />

      {R.roster.length > 0 && (
        <div style={{ paddingTop:"20px" }}>
          <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 6px" }}>
            <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>個別議員 · 近 {R.window} 天申報</span>
            <span style={{ fontSize:"10px", color:"var(--text-tertiary)" }}>更新 {R.updated}</span>
          </div>
          <div style={{ padding:"0 16px 12px", fontSize:"11px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            眾議院 STOCK Act 定期交易報告（PTR）原始申報書彙整，共 {R.filings} 份、其中 {R.skipped_scanned} 份是紙本掃描件無法解析。金額只有級距沒有數字，絕大多數落在最低的 $1,001–$15,000，所以下面顯示的是<span style={{ color:"var(--text-secondary, inherit)" }}>申報區間</span>而不是實際金額——別把它當成真實部位大小。點議員名字可看原始申報書。
          </div>
          <div style={{ overflowX:"auto", padding:"0 16px" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"12px" }}>
              <thead>
                <tr style={{ color:"var(--text-tertiary)", fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", textTransform:"uppercase" }}>
                  <th style={{ textAlign:"left",  padding:"6px 8px 6px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>議員</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>筆數</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>買 / 賣</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>申報區間</th>
                  <th style={{ textAlign:"left",  padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>常見標的</th>
                  <th style={{ textAlign:"right", padding:"6px 0 6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>最新申報</th>
                </tr>
              </thead>
              <tbody>
                {R.roster.map(r => (
                  <tr key={r.name + r.dst}>
                    <td style={{ padding:"7px 8px 7px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      <a href={r.url} target="_blank" rel="noopener noreferrer" style={{ color:"#B5654D", textDecoration:"none" }}>{r.name}</a>
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px", marginLeft:"6px" }}>{r.dst}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums" }}>{r.n}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>
                      <span style={{ color:"#6DB56D" }}>{r.buy}</span>
                      <span style={{ color:"var(--text-tertiary)" }}> / </span>
                      <span style={{ color:"#E05C5C" }}>{r.sell}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>{money(r.lo)}–{money(r.hi)}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      {r.top.map(t => (
                        <a key={t} href={"https://www.tradingview.com/symbols/" + t + "/"} target="_blank" rel="noopener noreferrer"
                           style={{ color:"var(--text-secondary, inherit)", textDecoration:"none", marginRight:"7px", fontFamily:"'Courier New',monospace" }}>{t}</a>
                      ))}
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px" }}>共 {r.distinct} 檔</span>
                    </td>
                    <td style={{ padding:"7px 0 7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", whiteSpace:"nowrap" }}>{r.last}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ padding:"12px 16px 0", fontSize:"10px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            只涵蓋眾議院；參議院走另一套 efdsearch 系統，尚未納入。買＋賣不一定等於筆數，差額是交換（exchange）類交易。
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/14/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v10.9</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
