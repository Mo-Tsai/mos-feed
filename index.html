<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;

  [data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #6a6663; --divider: #2e2a24;

  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;

  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }

  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }

  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }
  .tab-nav button { background: none; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: Georgia, serif; transition: all 0.3s ease; padding: 0; line-height: 1.2; }
  .sub-pill { background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 0; transition: all 0.2s ease; border-bottom: 1px solid transparent; }
  .swipe-area { position: relative; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .card-slide { position: absolute; inset: 0; padding: 16px 32px 80px; display: flex; flex-direction: column; justify-content: flex-start; transition: transform 0.3s ease, opacity 0.3s ease; will-change: transform, opacity; overflow-y: auto; }
  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .source-link { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }
  .source-link:hover { color: var(--text-secondary); border-color: var(--text-secondary); }
  .end-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; height: 100%; }
  .end-btn { padding: 12px 28px; background: none; border: 1px solid var(--divider); color: var(--text-tertiary); font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; transition: all 0.25s ease; }
  .end-btn:hover { border-color: var(--text-secondary); color: var(--text-secondary); }

  .word-popup-trans { font-family: system-ui, -apple-system, 'PingFang TC', sans-serif; font-size: 14px; color: var(--text-secondary); line-height: 1.6; font-weight: 300; }
  .speak-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--text-tertiary); padding: 2px; transition: color 0.2s; line-height: 1; }

  .az-input { width:100%; background:var(--bg); border:1px solid var(--divider); color:var(--text); padding:7px 10px; font-family:'Courier New',monospace; font-size:11px; outline:none; -webkit-appearance:none; appearance:none; border-radius:0; }

  .nav-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; gap:6px; padding:10px 16px 14px; background:var(--bg); border-top:1px solid var(--divider); z-index:50; }
  .nav-btn { background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:16px; cursor:pointer; padding:10px 18px; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; line-height:1; }
  .nav-btn-icon { padding:10px 14px; font-size:13px; }
  .nav-btn-icon.playing { border-color:var(--text); color:var(--text); }
  .nav-btn-lang { padding:10px 11px; font-size:11px; letter-spacing:0.08em; color:var(--text-tertiary); min-width:38px; }
  .nav-btn-lang:hover { color:var(--text-secondary); }
  @media (max-width: 420px) { .nav-btn { padding:10px 11px; } .nav-btn-icon { padding:10px 10px; } .nav-btn-lang { padding:10px 8px; min-width:34px; } }
  .nav-btn:hover { border-color:var(--text-secondary); color:var(--text); }
  .nav-btn:active { background:var(--bg-elevated); }
  .nav-btn:disabled { opacity:0.25; cursor:default; border-color:var(--divider); color:var(--text-tertiary); }

<body data-theme="light">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
  const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "新高的起點", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普500 ETF，週五收在 7,757.64 的紀錄高點、單日 +0.62%，整週 +3.6%"}, {"t": "QQQ", "n": "那斯達克100 ETF，那斯達克綜合指數週五 +1.3% 收 26,690.62，整週 +5.2% 是三大指數最強"}, {"t": "DIA", "n": "道瓊 ETF，週五僅 +151.83 點（+0.28%）收 54,036.93，是三者裡最溫和的"}], "en": "This week opens from a record. Friday's S&P 500 closed at 7,757.64, up 0.62%, capping a 3.6% week — the strongest since April. The Nasdaq Composite added 1.3% to 26,690.62 for a 5.2% week, and the Dow rose 151.83 points to 54,036.93. The reason the market feels different than it did ten days ago is a single data point: July payrolls contracted by 23,000 against an expected gain of about 83,000, which traders read as removing the near-term case for another Fed hike. Starting a week from an all-time high changes the arithmetic of everything that follows — good news is already partly in the price, and Wednesday's CPI has to clear a bar that was lower a week ago.", "zh": "這一週是從紀錄高點開始的。週五標普 500 收在 7,757.64 點、單日漲 0.62%，整週累計 +3.6%，是四月以來最強的一週；那斯達克綜合指數週五漲 1.3% 收 26,690.62、整週 +5.2% 為三大指數之最，道瓊則只漲 151.83 點（+0.28%）收 54,036.93。市場氣氛跟十天前完全不同的原因只有一個數據：7 月非農就業意外減少 23,000 人，而市場原本預期增加約 8.3 萬人，交易員把它讀成「Fed 短期內沒有再升息的必要」。從歷史高點開始的一週，算式跟別的週不一樣——好消息有一部分已經被反映在價格裡了，而週三的 CPI 要跨過的門檻，比一週前更高。", "url": "https://www.cnbc.com/2026/08/06/stock-market-today-live-updates.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "晶片回魂", "color": "#E05C5C", "stocks": [{"t": "SOXX", "n": "半導體 ETF，整週漲逾 7%，是那斯達克週線 +5.2% 的主要推力"}, {"t": "INTC", "n": "今年以來股價漲逾 170%，本益比已達 79 倍預估獲利——反彈幅度與估值同時被拉到極端"}], "en": "The single biggest contributor to last week's index gains was the group that had been hurting the market before it: chips. The iShares Semiconductor ETF finished the week up more than 7%, which is most of the Nasdaq's 5.2%. Worth holding two facts at once — the rebound was real, and the sector had fallen by a double-digit percentage over the preceding seven weeks, so a good part of this is recovering lost ground rather than breaking new ground. Intel is the extreme case: up more than 170% year to date and now trading around 79 times forward earnings.", "zh": "上週指數漲幅的最大貢獻者，正是先前拖累大盤的那一群：晶片股。iShares 半導體 ETF 整週漲超過 7%，那斯達克 5.2% 的週線漲幅有一大半來自這裡。這裡要同時記住兩件事——反彈是真的，但這個板塊在此前七週跌掉了雙位數百分比，所以這波有相當部分是在收復失土，不是開疆闢土。英特爾是最極端的案例：今年以來股價漲逾 170%，現在的估值已經來到約 79 倍預估本益比，反彈幅度與估值被同時拉到極端位置。", "url": "https://finance.yahoo.com/markets/stocks/articles/ai-trade-rotation-money-moving-081400402.html"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "荷莫茲拉鋸", "color": "#E05C5C", "stocks": [{"t": "BNO", "n": "布蘭特原油 ETF，週五布蘭特在 82 美元下方來回，反映談判與攻擊事件同時發生"}, {"t": "XLE", "n": "能源類股 ETF，週五單日領漲 1.48%，但整週標普能源板塊仍跌逾 2%"}], "en": "Oil spent Friday going nowhere in a very noisy way: Brent traded below $82 a barrel, swinging between gains and losses as the market weighed Iran–Oman negotiations to restore shipping through the Strait of Hormuz. Both sides of the story were live at once — a deal would return millions of barrels of Middle Eastern crude to the market, while Abu Dhabi National Oil Co. reported attacks on three vessels transiting the strait. The disputed terms are specific: Iran wants to exclude US and Israeli vessels and charge fees to countries it deems hostile; the US wants unrestricted transit. Until that gap closes, energy prices are a negotiation headline, not a supply-and-demand number.", "zh": "油價週五走了一整天，結果幾乎回到原點，但過程非常吵：布蘭特原油在每桶 82 美元下方來回震盪，市場一邊評估伊朗與阿曼恢復荷莫茲海峽航運的談判，一邊消化實際發生的攻擊事件。兩件事同時是真的——協議一旦成立，數百萬桶中東原油會回到市場；而阿布達比國家石油公司同時通報有三艘通過該海峽的船隻遭到攻擊。爭議的條件很具體：伊朗要求排除美國與以色列船隻、並對它認定的敵對國家收費，美方則要求無限制通行。在這個落差被填平之前，能源價格反映的是談判標題，而不是供需數字。", "url": "https://www.cnbc.com/2026/08/06/oil-price-iran-war-strait-hormuz-oman-deal.html"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "漲的是誰", "color": "#E05C5C", "stocks": [{"t": "RSP", "n": "標普500 等權重 ETF，跟市值加權版本的差距就是「這波是誰在漲」的直接讀數"}, {"t": "MDY", "n": "標普中型 400 ETF，中型股本月表現落後，與羅素 2000 的相對強弱形成對照"}], "en": "Behind a 3.6% week sits an uneven market. While the Russell 2000 held up and large-cap tech rebounded, the S&P MidCap 400 has been declining — mid caps are the part of the market nobody is writing about this month, and that in itself is information. A separate structural fact adds to it: roughly $3.2 trillion has rotated out of chips and into the largest megacap names this year, which is why an index can make records while the median stock goes nowhere. The practical takeaway is small and free: when you see a record close, put the equal-weighted S&P next to the cap-weighted one before deciding what the record means.", "zh": "3.6% 的週線背後，是一個很不平均的市場。羅素 2000 撐住了、大型科技股反彈了，但標普中型 400 指數這段期間反而在跌——中型股是這個月沒有人在寫的那一塊，而「沒人寫」本身就是資訊。另一個結構性事實加強了這個判讀：今年以來約有 3.2 兆美元的資金從晶片股輪動到最大的幾檔超大型股，這就是為什麼指數可以創新高、而中位數的那檔股票卻原地踏步。實務上的做法很小也免費：看到創高收盤時，先把等權重的標普跟市值加權的標普放在一起比，再決定這個新高的意義是什麼。", "url": "https://finance.yahoo.com/markets/article/32-trillion-rotation-from-chips-to-the-magnificent-7-has-left-the-sp-500-going-nowhere-chart-of-the-day-100000821.html"},
    {"id": "earn_0", "channel": "財報速報", "tag": "超標仍暴跌", "color": "#E8786A", "stocks": [{"t": "SEZL", "n": "週五單日重挫 34%，是一年來最差單日表現；盤後一度自 178.53 跌到 129.99 美元"}, {"t": "AFRM", "n": "同屬先買後付賽道，Sezzle 的減速指引會被拿來當整個 BNPL 成長曲線的參考點"}], "en": "Sezzle is the cleanest lesson of the week. Q2 revenue came in at $149.7 million, up 51.7% and well above the roughly $135–136 million consensus; adjusted EPS of $1.13 beat the $1.03 estimate; management raised full-year revenue growth guidance to 35%, adjusted net income to $185 million and adjusted EPS to $5.25. The stock then fell 34% on Friday, its worst day in a year. The reason is one line in the outlook: second-half growth is guided to roughly 30%, down from the 51.7% just delivered. Beat, raise, and collapse are not contradictory here — the market was paying for a growth rate, and the company told it the growth rate is changing.", "zh": "Sezzle 是這一週最乾淨的一堂課。它的 Q2 營收 1.497 億美元、年增 51.7%，遠高於市場約 1.35 至 1.36 億的預估；調整後每股盈餘 1.13 美元也超過 1.03 美元的預期；管理層甚至把全年營收成長指引上修到 35%、調整後淨利上修到 1.85 億、調整後每股盈餘上修到 5.25 美元。然後股價在週五重挫 34%，創下一年來最差單日表現。原因就在指引裡的一句話：下半年營收成長率將放緩到約 30%，而剛交出的這一季是 51.7%。「超標、上修、暴跌」在這裡並不矛盾——市場買的是一個成長率，而公司親口告訴市場，那個成長率正在改變。", "url": "https://seekingalpha.com/news/4628256-sezzle-stock-slumps-after-q2-earnings-beat-guidance-raised"},
    {"id": "earn_1", "channel": "財報速報", "tag": "季報季體檢", "color": "#E8786A", "stocks": [{"t": "SPY", "n": "標普500 ETF，成分股 88% 已交卷，這份總表就是指數獲利面的體檢報告"}, {"t": "XLK", "n": "科技類股 ETF，是本季獲利超預期幅度被拉高的主要來源之一"}], "en": "Zoom out from any single report and the Q2 scoreboard is extraordinary. As of August 7, 88% of S&P 500 companies had reported, 86% beat on EPS, and in aggregate results came in 29.2% above estimates — the highest earnings surprise in FactSet's records, which begin in 2008. Two readings are possible and both matter. One: corporate profitability is genuinely stronger than analysts modelled. Two: estimates had been cut low enough that clearing them stopped being difficult. Which reading you hold determines how you interpret the next stock that beats and falls anyway — and last week produced several of those.", "zh": "把鏡頭從任何單一份財報拉遠，Q2 的總成績單其實非常不尋常。截至 8 月 7 日，標普 500 成分股已有 88% 公布財報，其中 86% 的每股盈餘超出預估，整體超預期幅度達 29.2%——是 FactSet 自 2008 年開始統計以來的最高紀錄。這個數字有兩種讀法，而且兩種都成立。第一種：企業獲利真的比分析師模型裡的強。第二種：預估值早就被砍得夠低，以至於「超標」不再是件難事。你採用哪一種讀法，會直接決定你怎麼解釋「財報超標但股價照跌」的個股——而上週恰好出現了好幾檔。", "url": "https://insight.factset.com/sp-500-earnings-season-update-august-7-2026"},
    {"id": "earn_2", "channel": "財報速報", "tag": "今晨盤前", "color": "#E8786A", "stocks": [{"t": "B", "n": "Barrick Mining，今晨美股盤前公布 Q2，市場預估合併營收 44.88 億美元、年增 21.9%"}, {"t": "NEM", "n": "同業對照組，金價與礦商成本結構的差異會在同一季財報裡被拿來比較"}], "en": "Today's premarket headline is Barrick Mining's Q2, out before the US open. The Zacks consensus puts consolidated sales at $4,487.7 million, a 21.9% increase from a year ago — that growth rate is mostly a gold-price story, which makes the interesting numbers the ones underneath it: all-in sustaining costs, production volumes, and whether higher realised prices are actually reaching the bottom line rather than being eaten by mining inflation. Gold miners are one of the few groups whose revenue line can rise 20% while margins go sideways, so read the cost page before the headline.", "zh": "今天美股盤前的重頭戲是 Barrick Mining 的第二季財報。Zacks 市場共識預估合併營收為 44.877 億美元、年增 21.9%——但這個成長率主要是金價的故事，所以真正值得看的是它底下的數字：全維持成本、產量，以及較高的實現售價有沒有真的落到獲利，而不是被開採端的通膨吃掉。黃金礦商是少數幾種「營收可以年增 20%、利潤率卻原地踏步」的生意，所以先翻成本那一頁，再看標題數字。", "url": "https://finance.yahoo.com/markets/stocks/articles/barrick-mining-post-q2-earnings-124400945.html"},
    {"id": "macro_0", "channel": "總經政策", "tag": "就業轉負", "color": "#7C6AF7", "stocks": [{"t": "TLT", "n": "20年期以上美債 ETF，長端殖利率是這份就業數據最直接的傳導對象"}, {"t": "SHY", "n": "1-3 年期美債 ETF，短端對政策路徑最敏感，跟長端的反應差異就是重點"}], "en": "The number that moved everything: July nonfarm payrolls contracted by 23,000, against a Wall Street expectation of roughly +83,000 — a swing of more than 100,000 jobs against consensus. The unemployment rate came in at 4.1%, slightly better than the 4.2% economists expected, which is the detail most summaries skip and the one that complicates the story: employment fell while the jobless rate improved. Markets responded by pushing back the odds of a near-term Fed hike, and equities rallied into the weekend on that repricing. A single month of payroll data is heavily revised, so treat this as one observation, not a trend.", "zh": "讓所有東西動起來的那個數字：7 月非農就業人數減少 23,000 人，而華爾街原本預期增加約 8.3 萬人——與市場共識的落差超過 10 萬個工作。失業率則是 4.1%，比經濟學家預期的 4.2% 還略好一些，這是多數摘要會跳過、但其實讓故事變複雜的細節：就業人數在減少，失業率卻在改善。市場的反應是把 Fed 短期內升息的機率往後推，股市就是靠這個重新定價收出週線大漲。要提醒的是，單月非農數據的事後修正幅度向來很大，把它當成一個觀察值，不要當成趨勢。", "url": "https://www.nbcnews.com/business/markets/sp-500-nasdaq-post-record-closes-friday-jobs-report-raises-fed-rate-cu-rcna160495"},
    {"id": "macro_1", "channel": "總經政策", "tag": "衝擊後首份", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨債券 ETF，是市場對通膨預期最直接的價格投票"}, {"t": "DBC", "n": "廣泛商品 ETF，能源與運價的上漲要透過它才會傳到 CPI 裡"}], "en": "Wednesday's July CPI carries more weight than a normal print because of what it is the first to measure. June's inflation reading came before the collapse of the US–Iran ceasefire and the escalation in the Middle East, which disrupted shipping through the Hormuz and Bab el-Mandeb straits and pushed energy prices higher. July is therefore the first month in which that shock can show up in the data. The market has spent the last three sessions pricing a softer Fed path off one weak jobs report; a hot CPI would put that repricing under immediate pressure, and the sequence matters — CPI Wednesday, PPI and retail sales later in the week.", "zh": "週三的 7 月 CPI 之所以比一般月份重要，是因為它是第一份能測到那件事的數據。6 月的通膨讀數公布時，美伊停火尚未破裂、中東衝突尚未升級，而後來的衝突干擾了荷莫茲海峽與曼德海峽的航運、推高了能源價格。換句話說，7 月是這波衝擊第一次有機會出現在數據裡的月份。市場過去三個交易日靠著一份疲軟的就業報告，把 Fed 的政策路徑重新定價成比較寬鬆的版本；如果 CPI 偏熱，這個重新定價會立刻承受壓力。順序也要記住：週三 CPI，本週稍晚才是 PPI 與零售銷售。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar"},
    {"id": "macro_2", "channel": "總經政策", "tag": "銀行的算式", "color": "#7C6AF7", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，整個族群被當成單一的利率賭注在交易"}, {"t": "XLF", "n": "金融類股 ETF，與區域銀行的表現差距反映的是大小銀行的資金成本差異"}], "en": "The group with the most at stake in this repricing is not technology — it is the banks. Regional banks have been traded as a single bet on the rate path, which means the whole sector moves together and nobody is paid to look at individual balance sheets. A softer policy path helps deposit costs and hurts asset yields at the same time, and which effect dominates differs bank by bank depending on how much of the loan book reprices and how much funding came from wholesale borrowing rather than deposits. That is exactly the kind of distinction that gets erased when a sector trades as one ticker, and exactly where mispricing tends to sit.", "zh": "在這場重新定價裡籌碼押得最重的，其實不是科技股，是銀行。區域銀行整個族群一直被當成「一個對利率路徑的賭注」在交易，意思是全族群一起漲跌，沒有人有誘因去看個別銀行的資產負債表。政策路徑轉軟，同時會壓低存款成本、也會壓低資產收益率，而哪一邊的效果比較大，每家銀行都不一樣——取決於放款組合有多少會重新定價，以及資金有多少來自躉售借款而不是存款。這正是「整個板塊當成一檔股票在交易」時最先被抹掉的差異，也正是錯價最常躲的地方。", "url": "https://www.schwab.com/learn/story/stock-market-update-open"},
    {"id": "sector_0", "channel": "產業風向", "tag": "晶片換軟體", "color": "#4EABA4", "stocks": [{"t": "IGV", "n": "軟體類股 ETF，被點名為這波輪動的主要受益標的"}, {"t": "CRM", "n": "大型 SaaS 代表，今年上半年因「AI 會取代軟體」的敘事被殺得很兇，估值因此變便宜"}], "en": "The clearest sector story right now is capital leaving chips and arriving in software. Forty-four of the 51 software names in one widely used industry basket were positive in July, with a median gain of about 6%, while semiconductor ETFs fell by a double-digit percentage over the preceding seven weeks. The logic behind the flow is worth understanding: SaaS names were sold hard earlier this year on the thesis that AI would disrupt their business models, leaving many of them historically cheap, while chip demand now faces questions about token efficiency and cost. Note the symmetry — the same AI narrative that crushed software is now being used to justify buying it.", "zh": "目前最清楚的板塊故事，是資金離開晶片、流進軟體。在一個被廣泛使用的產業籃子裡，51 檔軟體股中有 44 檔在 7 月上漲、漲幅中位數約 6%，而同一時間半導體 ETF 在此前七週跌掉了雙位數百分比。這股資金流背後的邏輯值得理解：SaaS 類股今年稍早因為「AI 會顛覆它們的商業模式」這個論點而被大幅賣出，導致許多標的估值來到歷史低檔；而晶片這一端現在則面臨 AI token 使用效率與成本的質疑。請注意這裡的對稱性——當初把軟體股殺下來的那套 AI 敘事，現在正被用來合理化買進軟體股。", "url": "https://www.fool.com/investing/2026/08/08/the-ai-trade-rotation-money-is-moving-out-of-chips/"},
    {"id": "sector_1", "channel": "產業風向", "tag": "能源分歧", "color": "#4EABA4", "stocks": [{"t": "OXY", "n": "美國頁岩與二疊紀盆地代表，對油價敏感度高於一體化油商"}, {"t": "SLB", "n": "油服龍頭，客戶資本支出決定它的營收，比油價本身晚一步反應"}], "en": "Energy is the sector where the daily and weekly readings disagree, and the disagreement is the point. On Friday energy led the market with a 1.48% gain as crude firmed on Hormuz risk; across the full week, the S&P 500 energy sector fell more than 2% as oil stocks followed crude lower. That is what it looks like when a sector's price is set by a negotiation rather than by demand. For the operating companies underneath, the number that actually matters is not the daily print but whether producers commit capital — and nobody commits multi-year capex on a headline that could reverse at the next round of talks.", "zh": "能源是本週「日線」跟「週線」講出完全不同故事的板塊，而這個分歧本身就是重點。週五能源類股以 1.48% 的漲幅領先大盤，因為原油受荷莫茲風險支撐走強；但拉長到整週，標普 500 能源板塊卻跌超過 2%，油股跟著油價往下走。當一個板塊的價格是由一場談判決定、而不是由需求決定時，看起來就是這樣。對底下那些真正在營運的公司來說，重要的不是每日報價，而是生產商願不願意投入資本——而沒有人會為了一個下一輪談判就可能反轉的標題，去承諾一筆跨年度的資本支出。", "url": "https://www.interactivecrypto.com/spy-edges-lower-amid-geopolitical-tensions-and-mixed-sector-performance-on-august-7-2026-aug-202"},
    {"id": "sector_2", "channel": "產業風向", "tag": "電網缺口", "color": "#4EABA4", "stocks": [{"t": "GEV", "n": "電網與發電設備龍頭，電力設備需求的直接代表"}, {"t": "PWR", "n": "電力基礎建設工程商，公用事業的資本支出會先變成它的訂單"}, {"t": "AMSC", "n": "單季訂單逾 1.3 億美元，其中含一筆 2,500 萬美元的礦業開發用電力品質訂單"}], "en": "While attention sits on chips and software, a quieter industrial theme keeps compounding: the electrical grid cannot keep up with what is being plugged into it. American Superconductor booked more than $130 million of orders in its latest quarter, led by utility-sector mining developments and traditional energy markets, including a $25 million order from a North American utility for an integrated power-quality solution supporting a large-scale mining development — its largest single mining order to date. Its twelve-month backlog now exceeds $300 million. Grid equipment is unglamorous, capital-intensive, and priced on order books rather than quarterly EPS, which is precisely why it stays underdiscussed.", "zh": "當注意力都在晶片與軟體上時，有一個比較安靜的工業主題正在持續累積：電網跟不上被接上去的東西。American Superconductor 最新一季的訂單超過 1.3 億美元，主要來自公用事業端的礦業開發案與傳統能源市場，其中包含一筆來自北美某公用事業、金額 2,500 萬美元的整合式電力品質解決方案訂單，用於支援大型礦業開發，是該公司史上最大的單筆礦業訂單。它的十二個月在手訂單目前超過 3 億美元。電網設備這門生意不迷人、資本密集，而且是看訂單簿而不是看單季每股盈餘在定價的——這正是它長期被討論不足的原因。", "url": "https://www.stocktitan.net/sec-filings/AMSC/8-k-american-superconductor-corp-de-reports-material-event-1574d2fcd616.html"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素回神", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，指數近期站上 2,961.51 點、單日 +0.76%"}, {"t": "IJR", "n": "標普 600 小型股 ETF，成分股有獲利門檻，跟羅素 2000 的差異在弱勢期會放大"}], "en": "Small caps have been the quiet beneficiary of the shift in rate expectations. The Russell 2000 rose 22.31 points, or 0.76%, to 2,961.51, extending a year in which the index has outperformed broader benchmarks in several stretches. The mechanism is straightforward: smaller companies carry more floating-rate debt and more domestic revenue, so a softer policy path helps them twice — lower interest expense and less exposure to trade friction. One caution worth carrying: the Russell 2000 has no profitability requirement for inclusion, so a rate-driven rally in the index is not the same as a rate-driven improvement in the underlying businesses.", "zh": "小型股是這次利率預期轉向下比較安靜的受益者。羅素 2000 指數上漲 22.31 點、幅度 0.76%，來到 2,961.51 點，延續了它今年多次跑贏大盤基準的表現。機制其實很直白：規模較小的公司浮動利率債務比重較高、營收也更集中在國內，所以政策路徑轉軟對它們是雙重利多——利息支出下降，同時受貿易摩擦的衝擊較小。但有一點要一直帶在身上：羅素 2000 的成分股沒有獲利門檻，所以「指數因利率而漲」跟「底下的生意因利率而變好」，完全是兩件不同的事。", "url": "https://www.ibtimes.com.au/russell-2000-index-surges-small-cap-resilience-2026-1870784"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "今晚雙響", "color": "#5B8ED6", "stocks": [{"t": "RKLB", "n": "今晚美股盤後公布 Q2，市場預估營收約 2.316 億美元、年增約 60%，每股虧損 0.06 美元"}, {"t": "HIMS", "n": "同樣今晚盤後公布，市場預估 GAAP 每股虧損 0.05 美元"}], "en": "Tonight after the US close brings two of the most heavily traded small and mid caps in retail portfolios. Rocket Lab is expected to post revenue of about $231.6 million, up roughly 60% year over year, with a loss of $0.06 per share — for a launch business the number that moves the stock is usually cadence and backlog rather than the revenue line itself. Hims & Hers is expected to report a GAAP loss of five cents. Both are names where the options market prices large moves, which tells you the range of outcomes is genuinely wide rather than that anyone knows the direction.", "zh": "今晚美股盤後有兩檔散戶部位很集中的中小型股要交卷。Rocket Lab 市場預估營收約 2.316 億美元、年增約 60%，每股虧損 0.06 美元——不過對一家發射公司來說，真正會推動股價的通常是發射頻率與在手訂單，而不是營收那一行數字。Hims & Hers 則預估 GAAP 每股虧損 5 美分。這兩檔的選擇權市場都在為大幅波動定價，那代表的是「可能的結果範圍真的很寬」，而不是「有人知道方向」。", "url": "https://www.tipranks.com/news/rocket-lab-earnings-preview-what-investors-need-to-watch-on-august-10"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "指引為王", "color": "#5B8ED6", "stocks": [{"t": "DOCS", "n": "當季每股盈餘 0.29 美元、略低於預估的 0.30，但因 FY27 指引強勁，股價反而大漲"}], "en": "Doximity is the mirror image of Sezzle and worth putting side by side with it. Its quarterly EPS came in at $0.29 against a $0.30 estimate — a miss — and the stock surged anyway, because the forward guidance for FY27 was strong. Two companies, opposite quarters, same lesson: in this market the current quarter is treated as history and the guide is treated as the product. If you are holding a small cap into earnings, the useful preparation is not guessing the quarter — it is knowing in advance what forward number would change your view of the business.", "zh": "Doximity 是 Sezzle 的鏡像，值得把兩者並排放在一起看。它當季每股盈餘 0.29 美元、低於市場預估的 0.30 美元——是不折不扣的未達標——但股價反而大漲，因為它給出的 FY27 財測很強。兩家公司、相反的當季表現、同一個教訓：在現在這個市場，當季數字被當成歷史，而財測才被當成商品。如果你手上有小型股要面對財報，真正有用的準備不是猜這一季的數字，而是事先想清楚：什麼樣的前瞻數字會改變你對這門生意的看法。", "url": "https://www.eregal.com/morning-preview-august-07-2026/"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "為何三成", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素 2000 成長型 ETF，成長型小型股的估值最依賴前瞻假設，波動也最大"}, {"t": "IWN", "n": "羅素 2000 價值型 ETF，跟成長型的表現差距，就是市場在為「確定性」付多少錢"}], "en": "Why do small caps routinely move 20-30% in a single session on earnings, when a megacap moving 8% is news? Three structural reasons, none of them about the business. First, thin analyst coverage means the range of published estimates is wide, so there is no tight consensus for the stock to be measured against. Second, valuation rests almost entirely on forward assumptions, and small changes to a growth rate compound into large changes in a discounted value. Third, order books are shallow — the same dollar of selling moves the price far more than it would in a liquid megacap. The move size tells you about the market's structure, not about how much the company changed.", "zh": "為什麼小型股在財報後動不動就單日漲跌兩三成，而大型股跌 8% 就已經是新聞？有三個結構性原因，而且沒有一個跟生意本身有關。第一，分析師覆蓋很薄，公布出來的預估值分散度很大，等於沒有一個緊密的共識可以拿來衡量這檔股票。第二，估值幾乎完全建立在前瞻假設上，成長率的小幅變動，折現之後會放大成價值的大幅變動。第三，掛單簿很淺——同樣一塊錢的賣壓，在小型股推動價格的幅度遠大於在流動性充足的大型股。單日的漲跌幅度告訴你的是市場的結構，而不是這家公司在一天內改變了多少。", "url": "https://www.chartmill.com/stock/markets/usa/screener/insider-buying-stocks"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "訂單能見度", "color": "#5B8ED6", "stocks": [{"t": "AMSC", "n": "最新一季營收 9,410 萬美元、年增 30%，是首次單季突破 9,000 萬美元"}, {"t": "PWR", "n": "大型同業對照組，用來看電網資本支出這個順風有多寬"}], "en": "American Superconductor is a useful example of how to read an industrial small cap. Latest-quarter revenue was $94.1 million, up 30% from $72.4 million a year earlier, the first time quarterly sales cleared $90 million, driven by growth in both the Grid and Wind units. Management flagged gross-margin improvement in the second half. But the number that carries the most information for a project-driven business is the twelve-month backlog above $300 million, because it converts a lumpy revenue line into something with visibility. For companies like this, a soft quarter with a rising backlog and a strong quarter with a shrinking one mean opposite things.", "zh": "American Superconductor 是一個很好的範例，說明工業型小型股該怎麼讀。它最新一季營收 9,410 萬美元、較去年同期的 7,240 萬年增 30%，是單季營收首度突破 9,000 萬美元，成長來自電網與風電兩個事業單位；管理層並指出下半年毛利率可望改善。不過對一家專案型公司來說，資訊含量最高的數字是那個超過 3 億美元的十二個月在手訂單，因為它把原本忽高忽低的營收，變成一條有能見度的曲線。對這類公司而言，「季度數字疲軟但在手訂單上升」跟「季度數字亮眼但在手訂單縮水」，代表的是完全相反的兩件事。", "url": "https://www.investing.com/news/transcripts/earnings-call-transcript-american-superconductor-posts-record-q1-2026-revenue-93CH-4843178"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "無債家具商", "color": "#C9A227", "status": "RADAR · 下一個驗證點 8/12 股利登記日後的 FY27 首季（約 10 月）", "stocks": [{"t": "ETD", "n": "Ethan Allen，FY2026 全年營收 5.79 億美元、Q4 營收 1.468 億，調整後毛利率 59.7%"}], "en": "What it does: Ethan Allen designs, manufactures and retails mid-to-upper-end home furniture in North America. Why it is ignored: furniture is a housing-cycle proxy in a soft housing market, and this is a small cap with thin coverage in a category no fund manager wants to explain. What is changing: for the quarter ended June 30 it posted net sales of $146.8 million with an adjusted gross margin of 59.7%, adjusted operating income of $10.8 million (7.4% margin) and adjusted diluted EPS of $0.36; the full year came in at $579 million, and it ended the year debt-free with $187.5 million in cash and investments while declaring both a special and a regular dividend, with the regular $0.39 payable August 26 to holders of record August 12. Risk and the other side: revenue is falling, not growing — lower order volumes and reduced contract sales are the reason the year ended at $579 million, and a 59.7% gross margin on a shrinking top line is a quality signal, not a growth signal. This is a research lead, not investment advice.", "zh": "這家公司做什麼：Ethan Allen 在北美設計、製造並零售中高價位的家用家具。為什麼被忽視：家具是房市循環的代理變數，而房市正疲軟；再加上它是覆蓋很薄的小型股，落在沒有基金經理人想花時間解釋的品類裡。什麼正在改變：截至 6 月 30 日的當季，它繳出淨銷售額 1.468 億美元、調整後毛利率 59.7%、調整後營業利益 1,080 萬美元（利益率 7.4%）、調整後稀釋每股盈餘 0.36 美元；全年營收 5.79 億美元，年底帳上零負債、現金與投資 1.875 億美元，並同時宣布特別股利與常規股利，其中每股 0.39 美元的常規股利將於 8 月 26 日發放給 8 月 12 日在冊股東。風險與反方論點：它的營收是在縮小而不是成長——訂單量下滑與合約銷售減少正是全年落在 5.79 億的原因，而在營收縮小的情況下維持 59.7% 的毛利率，是一個品質訊號，不是成長訊號。這是研究線索，不是投資建議。", "url": "https://ir.ethanallen.com/news-events/press-releases/detail/318/ethan-allen-reports-fiscal-2026-full-year-and-fourth"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "南方超市", "color": "#C9A227", "status": "RADAR · 下一個驗證點 FY2026 第四季與全年財報（約 11 月）", "stocks": [{"t": "IMKTA", "n": "Ingles Markets，在美國東南部六州經營 195 家超市，前九個月淨利年增 35%"}], "en": "What it does: Ingles Markets runs 195 supermarkets across six southeastern US states, a family-controlled grocer that also owns much of its real estate. Why it is ignored: grocery is treated as a zero-growth, low-margin category, the share class structure deters institutions, and sell-side coverage is close to non-existent. What is changing: for the quarter ended June 27, net sales were $1.37 billion versus $1.35 billion a year earlier with gross profit of $332.4 million (24.3% of sales), and quarterly net income was $25.9 million against $26.2 million — essentially flat. The interesting line is the nine-month figure: net income of $78.3 million versus $57.9 million, a 35% increase on sales of $4.05 billion. Risk and the other side: a flat quarter after a strong nine months is exactly when a margin story stalls, grocery competition from national chains is relentless, and owning real estate cuts both ways when a region's economy turns. This is a research lead, not investment advice.", "zh": "這家公司做什麼：Ingles Markets 在美國東南部六個州經營 195 家超市，是一家家族控股的連鎖雜貨商，並自有相當比例的店面不動產。為什麼被忽視：雜貨業被歸類為零成長、低毛利的品類，雙層股權結構讓法人卻步，賣方覆蓋幾乎等於沒有。什麼正在改變：截至 6 月 27 日當季淨銷售額 13.7 億美元、去年同期為 13.5 億，毛利 3.324 億美元（佔銷售 24.3%），單季淨利 2,590 萬美元、去年同期 2,620 萬——基本上持平。真正有意思的是前九個月的數字：淨利 7,830 萬美元、去年同期 5,790 萬，在 40.5 億美元的銷售額上年增 35%。風險與反方論點：在強勁的九個月之後出現持平的一季，正是毛利率故事開始熄火的典型時點；全國型連鎖的競爭從不停歇；而自有不動產在區域經濟轉弱時是雙面刃。這是研究線索，不是投資建議。", "url": "https://finance.yahoo.com/markets/stocks/articles/ingles-markets-incorporated-reports-results-113000482.html"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "防護裝備", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Q3 財報：32% 的營收成長有多少來自併購、多少來自本業", "stocks": [{"t": "CDRE", "n": "Cadre Holdings，Q2 淨銷售額 2.071 億美元年增 32%、調整後 EBITDA 年增 56%，盤後漲 18.26% 至 36.70 美元"}], "en": "What it does: Cadre Holdings makes safety and survivability equipment for police, military and nuclear customers — body armour, duty gear, explosive-ordnance-disposal robots and nuclear-facility services. Why it is ignored: it is a small cap in a procurement-driven niche with no consumer story, and an 18% after-hours move on results is itself evidence that few people were modelling it carefully. What is changing: Q2 net sales of $207.1 million were up 32% year over year with adjusted EBITDA up 56%, comfortably beating expectations and prompting management to raise full-year guidance; the company also flagged an active M&A pipeline across both public safety and nuclear. Risk and the other side: acquisition-led growth and organic growth are not the same thing and this release does not separate them cleanly; municipal and federal budgets set the ceiling on demand; and the stock has already repriced 18% on the news, so whatever mispricing existed is materially smaller today than it was on Wednesday. This is a research lead, not investment advice.", "zh": "這家公司做什麼：Cadre Holdings 為警察、軍方與核能客戶製造安全與存活防護裝備——防彈衣、勤務裝具、拆彈機器人與核能設施服務。為什麼被忽視：它是一檔落在採購驅動利基市場裡的小型股，沒有面向消費者的故事；而財報後盤後單日跳漲 18%，本身就是「沒什麼人在認真替它建模」的證據。什麼正在改變：第二季淨銷售額 2.071 億美元、年增 32%，調整後 EBITDA 年增 56%，明顯超出市場預期，管理層並因此上修全年財測；公司同時表示在公共安全與核能兩個方向都有活躍的併購管道，盤後股價漲 18.26% 至 36.70 美元。風險與反方論點：併購帶來的成長跟本業有機成長不是同一件事，而這份財報並沒有把兩者拆乾淨；地方政府與聯邦預算決定了需求的天花板；而且股價已經因為這則消息重新定價了 18%，所以原本存在的錯價，今天的幅度已經明顯小於上週三。這是研究線索，不是投資建議。", "url": "https://www.investing.com/news/company-news/cadre-q2-2026-slides-strong-revenue-beat-drives-guidance-raise-93CH-4843586"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 下一季財報：65% 的毛利率能否守住、獲利是否重演", "stocks": [{"t": "ANIK", "n": "Anika Therapeutics，Q2 營收 3,261 萬美元年增 16%、毛利率自 51% 拉到 65%，全年財測上修"}], "en": "A pool update with genuinely new numbers. Anika entered the radar on August 8 on two signals: a return to profit and buybacks that were being executed rather than merely authorised. The Q2 detail now available strengthens the case more than expected. Record quarterly revenue of $32.6 million was up 16% year over year with both the Commercial and OEM channels contributing; gross margin expanded to 65% from 51% a year earlier on operational improvements, higher volume and favourable mix. Management raised full-year revenue growth guidance to 5-10% from 1-9% and adjusted EBITDA margin guidance to 13-17% from 5-10%. Risk and the other side is unchanged and still the main thing: this remains a company with a loss history and a single strong quarter, at $32.6 million of quarterly revenue one product line or one reimbursement decision can move the whole business, and small-medtech reimbursement risk arrives without warning. This is a research lead, not investment advice.", "zh": "這是一則有實質新數字的池內更新。Anika 於 8 月 8 日入池，當時的兩個訊號是獲利翻正、以及庫藏股是「已經在執行」而非只是被授權。現在拿到的 Q2 細節，把論點加強的幅度超出預期：單季營收創紀錄的 3,261 萬美元、年增 16%，商業與 OEM 兩條通路都有貢獻；毛利率從去年同期的 51% 擴張到 65%，來自營運改善、銷量提升與產品組合轉佳。管理層並將全年營收成長財測從 1-9% 上修到 5-10%，調整後 EBITDA 利潤率財測從 5-10% 上修到 13-17%。風險與反方論點沒有改變，而且依然是最重要的一件事：這仍然是一家有虧損歷史、只交出一季好成績的公司；在單季營收僅 3,261 萬美元的規模下，單一產品線或單一給付決定就足以撼動整家公司；而小型醫材的給付風險往往毫無預警到來。這是研究線索，不是投資建議。", "url": "https://www.stocktitan.net/news/ANIK/anika-reports-second-quarter-2026-financial-2dylpsbbn440.html"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "本週交卷", "color": "#C9A227", "status": "RADAR · 下一個驗證點 2026-08-12 美東上午 8:30 Q2 財報與法說會", "stocks": [{"t": "ALLT", "n": "Allot，8/12 盤前公布 Q2，是 6 月那筆 4,000 萬美元庫藏股授權後的第一份成績單"}], "en": "The pool name with a verification date inside this week. Allot sells network intelligence and security-as-a-service to telecom operators, dual-listed on Nasdaq and Tel Aviv, with almost no large-broker coverage after years of losses parked it in the do-not-open drawer. It entered the radar on August 1 on a single piece of evidence: a board authorisation on June 23 for up to $40 million of buybacks, which for a company this size is a meaningful capital-allocation commitment, framed by management as confidence following a year of profit growth and double-digit revenue growth. That claim gets tested on August 12 at 8:30am US Eastern. Risk and the other side: the whole thesis currently rests on the company's own characterisation and a repurchase authorisation, neither of which is a quarterly result; telecom capex is strongly cyclical; Israeli geopolitical risk is real; and the buyback requires a 30-day creditor objection period before it can be executed. This is a research lead, not investment advice.", "zh": "這是池內唯一驗證點就落在本週的名字。Allot 賣的是給電信商的網路智慧與資安即服務，在那斯達克與特拉維夫雙掛牌，多年虧損讓它被歸進「不用打開」的抽屜，幾乎沒有大型券商覆蓋。它在 8 月 1 日入池，依據只有一項證據：董事會 6 月 23 日通過最高 4,000 萬美元的庫藏股授權——對這個市值規模的公司來說是有份量的資本配置承諾，管理層把它定調為「在一年獲利成長與營收雙位數成長之後的信心表態」。這個說法將在美東時間 8 月 12 日上午 8 點 30 分受到檢驗。風險與反方論點：整個論點目前建立在公司自己的說法與一紙回購授權上，兩者都不是季度實績；電信商資本支出有強烈週期性；以色列地緣風險真實存在；而庫藏股還須經過 30 天的債權人異議期才能執行。這是研究線索，不是投資建議。", "url": "https://www.tipranks.com/news/company-announcements/allot-launches-40-million-share-buyback-to-signal-confidence-in-growth"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "油價的另一面", "color": "#C9A227", "status": "RADAR · 下一個驗證點 下一份 10-Q：車隊卡交易量趨勢，以及是否有第二輪內部人買進", "stocks": [{"t": "WEX", "n": "車隊卡與企業支付商，6 月出現董事長、營運長、財務長、技術長、法務長與數位長的群聚買進"}], "en": "A pool name whose main risk factor is now the week's live news. WEX processes fleet-card, corporate-payment and healthcare-account transactions, and entered the radar on August 6 on a rare signal: the chairman, COO, CFO, CTO, general counsel and chief digital officer all bought on the open market within a short window, with chairman Melissa Smith buying 3,721 shares for about $500,700 on June 2. An entire C-suite stepping in after a five-year 30.3% underperformance is hard to explain away as diversification or a pre-set 10b5-1 plan. The reason it belongs in today's brief: fleet-card revenue is tied to fuel prices and miles driven, so the Hormuz negotiations covered in the overnight section run directly through this thesis — a reopening that lowers crude also lowers the dollar value of every transaction. Risk and the other side: insiders can be both early and wrong, and five years of underperformance is a fact about execution, not only about sentiment. This is a research lead, not investment advice.", "zh": "這是一檔池內名字，而它的主要風險因子正好是本週的即時新聞。WEX 處理車隊卡、企業支付與醫療帳戶支付，於 8 月 6 日入池，依據是一個罕見訊號：董事長、營運長、財務長、技術長、法務長與數位長在很短的時間內全部於公開市場買進，其中董事長 Melissa Smith 於 6 月 2 日以約 50.07 萬美元買進 3,721 股。整個高管團隊在五年落後大盤 30.3% 之後同時進場，很難用分散配置或 10b5-1 預設計畫來解釋。它今天出現在晨報裡的原因是：車隊卡的營收綁在油價與行駛里程上，所以隔夜盤勢那張荷莫茲談判的卡，其實直接穿過這個論點——海峽重開若壓低油價，也會同時壓低每一筆交易的金額。風險與反方論點：內部人可以既早且錯，而五年的落後是關於執行力的事實，不只是情緒問題。這是研究線索，不是投資建議。", "url": "https://finance.yahoo.com/news/wex-insider-buying-cluster-highlights-101146160.html"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "科技破紀錄", "color": "#6DB56D", "stocks": [{"t": "XLK", "n": "科技類股 ETF，成分股六個月內有 28 位高管公開市場買進，創有紀錄以來新高"}, {"t": "ADBE", "n": "典型的「自五月高點明顯回落」的大型軟體股，正是這波內部人買盤出現的價格環境"}], "en": "A genuine record has just been set and it barely made the news. Twenty-eight executives at companies inside the State Street Technology Select Sector SPDR ETF have bought their own stock on the open market over the past six months — the highest count on record according to SentimenTrader, double the figure at the start of 2026 and above the previous record of 25 set in 2011. The distinction that makes this readable is that these are Form 4 open-market purchases, not option exercises, restricted stock or compensation awards: the executive spends their own cash under the same conditions as everyone else. The context is that many well-known tech names have fallen noticeably from mid-May highs or simply lagged all year.", "zh": "一項真正的紀錄剛剛誕生，但幾乎沒上新聞。在 State Street 科技類股 SPDR ETF 的成分股裡，過去六個月有 28 位高管於公開市場買進自家股票——根據 SentimenTrader 的統計，這是有紀錄以來的最高數量，是 2026 年初的兩倍，也超過了 2011 年創下的 25 位前高。讓這個數字可以被解讀的關鍵在於：這些是 Form 4 的公開市場買進，不是選擇權行使、不是限制股，也不是薪酬獎勵——高管是用自己的現金，在跟所有人相同的市場條件下買進。背景則是：許多知名科技股自五月中的高點明顯回落，或者整年都在落後。", "url": "https://finance.yahoo.com/markets/article/a-record-number-of-tech-stock-insiders-are-buying-their-own-shares-in-2026-133810825.html"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "誰沒有買", "color": "#6DB56D", "stocks": [{"t": "AMZN", "n": "內部人已超過兩年沒有公開市場買進，即使股價出現有意義的回檔"}, {"t": "MSFT", "n": "同上，兩年以上沒有高管在公開市場自掏腰包買進"}, {"t": "NVDA", "n": "同上，回檔期間也沒有出現內部人的公開市場買盤"}], "en": "The same dataset carries a second finding that is easy to miss and arguably more useful: insiders at Amazon, Meta, Microsoft and Nvidia have not made an open-market purchase in more than two years, despite meaningful pullbacks in their share prices. Read carefully, this is not a bearish signal on those four. Executives at the largest companies are already saturated with equity through compensation, are locked into narrow trading windows, and have obvious optics reasons to avoid discretionary purchases. What it does mean is that the record 28 buyers sit somewhere else in the sector — and that if you use insider buying as a screen, the absence of it at the megacaps carries much less information than its presence further down the market cap scale.", "zh": "同一份資料還帶著第二個容易被忽略、但可能更有用的發現：亞馬遜、Meta、微軟與輝達的內部人，已經超過兩年沒有在公開市場買進，即使這些股票期間出現過有意義的回檔。這件事要小心讀——它並不是對這四家公司的看空訊號。最大型公司的高管本來就已經透過薪酬持有大量股權，交易窗口很窄，而且有明顯的觀感理由避免自主性買進。它真正的意義是：那 28 位創紀錄的買家坐落在這個板塊的別處；而如果你把內部人買進當成篩選條件，那麼「超大型股沒有內部人買進」所含的資訊量，遠低於「市值往下一層的公司出現內部人買進」。", "url": "https://www.aol.com/finance/record-number-tech-stock-insiders-133810261.html"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "13F 週", "color": "#6DB56D", "stocks": [{"t": "BRK.B", "n": "最常被追蹤的 13F 申報者，也最能說明「六週前的持股」跟現在的差距"}], "en": "This Friday, August 14, is the Q2 13F deadline: every institutional manager with more than $100 million in US equities must disclose what it held as of June 30. Expect a wave of headlines about what famous investors bought. Three caveats belong in your head before you read any of them. The data is already about six weeks old, so a position may have been added to or exited entirely since. The deadline is the last day, not the day everyone files — some managers filed within a week of quarter-end and their disclosures are older still. And 13F shows long US-listed equity positions only, so a holding that looks like a big bullish bet may be one leg of a hedge you cannot see.", "zh": "本週五 8 月 14 日是第二季 13F 的申報截止日：所有持有超過 1 億美元美國股票的機構經理人，都必須揭露它們在 6 月 30 日當下的持股。接下來會出現一波「某某知名投資人買了什麼」的新聞，而在讀任何一則之前，腦子裡要先放三個但書。第一，這份資料已經是六週前的了，該部位可能早已加碼或整個出清。第二，截止日是最後一天、不是大家一起申報的那一天——有些經理人在季末後一週內就交了，那些揭露的內容還更舊。第三，13F 只顯示美國上市股票的多頭部位，所以一個看起來像重押看多的持股，很可能只是某個你看不到的避險組合的其中一隻腳。", "url": "https://www.finrep.ai/blog/13f-filing-deadlines-2026-every-date-rule-and-trap"},
    {"id": "week_0", "channel": "本週事件", "tag": "數據三連", "color": "#C97DD4", "stocks": [{"t": "TLT", "n": "長天期美債 ETF，CPI 的結果會先反映在長端殖利率上"}, {"t": "XRT", "n": "零售類股 ETF，本週稍晚的零售銷售數據直接對應它的基本面"}], "en": "The macro calendar is front-loaded and unusually consequential. July CPI lands Wednesday, followed by PPI and retail sales later in the week — three prints that together answer whether June's improvement in consumer prices and spending survived the geopolitical shock. CPI is the one that sets the tone, because the market has already spent last week pricing a softer Fed path off a single weak payroll number, and it needs the inflation data to cooperate for that pricing to hold. Retail sales matters for a different reason: it is the demand-side check on whether higher energy costs are already showing up as reduced spending elsewhere.", "zh": "本週的總經行事曆前重後輕，而且份量不小。7 月 CPI 在週三公布，接著是本週稍晚的 PPI 與零售銷售——這三份數據合起來要回答的問題是：6 月在消費者物價與支出上看到的改善，有沒有撐過這波地緣衝擊。CPI 是定調的那一份，因為市場上週已經靠一份疲軟的非農把 Fed 的政策路徑定價成比較寬鬆的版本，而這個定價要能站住，就需要通膨數據配合。零售銷售的重要性則是另一個層面：它是需求端的檢查，看較高的能源成本是不是已經以「其他地方少花錢」的形式顯現出來。", "url": "https://www.indexbox.io/blog/us-economic-data-and-key-earnings-in-the-week-ahead/"},
    {"id": "week_1", "channel": "本週事件", "tag": "AI 基建週", "color": "#C97DD4", "stocks": [{"t": "CRWV", "n": "CoreWeave 本週交卷，是 AI 算力租賃需求最直接的讀數"}, {"t": "AMAT", "n": "應用材料週四盤後公布 FY2026 第三季，是半導體設備循環的關鍵指標"}, {"t": "SMCI", "n": "AI 伺服器組裝端，本週財報決定「晶片換軟體」的輪動論述站不站得住"}], "en": "Eighteen companies on the verified calendar report between August 10 and 14, and the ones that matter are clustered around AI infrastructure. CoreWeave and Super Micro both report this week, and Applied Materials releases fiscal Q3 after Wednesday's close on Thursday, August 13. Others on the list include Sea Limited, monday.com, Barrick Mining, Rumble, Lumentum on Tuesday and Coherent on Wednesday. The reason this cluster is worth watching beyond the individual tickers: last week's rotation story assumed capital is leaving chips because AI demand is becoming more efficient. These reports are where that assumption meets actual order books.", "zh": "8 月 10 日到 14 日這一週，已確認行事曆上有 18 家公司公布財報，而真正重要的幾家都集中在 AI 基礎建設。CoreWeave 與 Super Micro 本週交卷，應用材料則在 8 月 13 日週四盤後公布 FY2026 第三季；名單上還有 Sea Limited、monday.com、Barrick Mining、Rumble，週二的 Lumentum 與週三的 Coherent。這一串值得看的理由超過個股本身：上週那套輪動敘事的前提是「資金離開晶片，是因為 AI 需求正變得更有效率」。而這幾份財報，正是這個假設第一次跟真實的訂單簿正面相遇的地方。", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262090642-weekly-preview-us-cpi-ppi-data-market-focus-crwv-amat-earnings-reports-tradingkey"},
    {"id": "eval_0", "channel": "今日評估", "tag": "今天的一件事", "color": "#E8A838", "status": "想清楚了嗎? 按下面的討論按鈕，把你的答案講給我聽", "stocks": [{"t": "QQQ", "n": "那斯達克100 ETF，代表本週被押注的「利率路徑」那一邊"}, {"t": "IJR", "n": "標普 600 小型股 ETF，代表被個別財報一檔一檔處決的那一邊"}], "en": "The one thing worth holding today: last week the index was priced off the rate path, while individual stocks were priced off their own forecasts — and those two mechanisms produced opposite results in the same five sessions. The S&P made a record on a weak payroll number, and inside that same week Sezzle fell 34% after beating and raising, while Doximity rose after missing. The index was voting on the Fed; the single names were voting on guidance. Wednesday's CPI is when the first mechanism gets tested, and this week's earnings are when the second one does. Open question to sit with: for each position you hold, do you actually know which of the two is setting its price — and would you still want it if that mechanism turned against you?", "zh": "今天值得帶著走的一件事：上週指數是照利率路徑在定價，個股卻是照自己的財測在定價——而這兩套機制在同樣的五個交易日裡，產生了完全相反的結果。標普靠一份疲軟的非農創下歷史新高，而在同一週裡，Sezzle 財報超標又上修財測，股價卻跌了 34%；Doximity 當季未達標，股價反而上漲。指數投的是 Fed 那一票，個股投的是財測那一票。週三的 CPI 是第一套機制受檢驗的時刻，本週的財報則是第二套機制受檢驗的時刻。留一個開放式問題給自己：你手上的每一個部位，你真的知道是哪一套機制在決定它的價格嗎——如果那套機制反過來對你不利，你還會想持有它嗎？", "url": "https://www.cnbc.com/2026/08/06/stock-market-today-live-updates.html"}
  ];

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>

      </div>

      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/10/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v7.1</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
