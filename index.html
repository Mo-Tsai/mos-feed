/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;

  :root[data-theme="dark"] {

    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;

  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;

  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }

    70% { opacity: 1; }

  {"id": "earn_2", "channel": "財報速報", "tag": "指引殺手", "color": "#E8786A", "zh": "多家公司財報本身過關、股價卻因指引重挫。卡特彼勒調整後每股盈餘 7.20 美元、營收 206.8 億美元只小幅優於預期，第四季銷售成長預測令人失望，儘管在手訂單創高達 780 億美元，股價一度跌 12%。Fortinet 第三季優於預期但下修全年服務營收到 51.5 億至 51.7 億美元，下跌約 20%。Sprouts 第四季每股盈餘指引 0.47 至 0.51 美元，遠低於預期的 1.21 美元，因為降價搶回客人，下跌 18% 至 23%。", "en": "Several companies passed on earnings but were hit on guidance. Caterpillar's adjusted EPS of $7.20 and revenue of $20.68 billion only modestly beat, and its fourth-quarter sales growth outlook disappointed despite a record $78 billion backlog; the stock fell as much as 12%. Fortinet beat on the third quarter but cut its full-year service revenue forecast to $5.15 billion to $5.17 billion and dropped about 20%. Sprouts guided fourth-quarter EPS to $0.47 to $0.51 versus $1.21 expected as it cuts prices to win back shoppers, falling 18% to 23%.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-29-dow-sp-500-nasdaq-alphabet-microsoft-081708101.html", "stocks": [{"t": "CAT", "n": "卡特彼勒，第四季銷售成長預測令人失望，一度 -12%"}, {"t": "FTNT", "n": "Fortinet，下修全年服務營收，約 -20%"}, {"t": "SFM", "n": "Sprouts，第四季每股盈餘指引遠低於預期，-18% 至 -23%"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "Fed 按兵不動", "color": "#7C6AF7", "zh": "聯準會本週三以 10 比 2 投票維持利率在 3.75% 至 4.00%，兩位反對者都主張升息 0.25 個百分點；理事 Cook 是四年多來第一次投反對票。主席 Warsh 表示 AI 建設不能無視借貸成本上升，利率「直接或間接影響幾乎所有事」，並提到部分風險資產的信用利差在擴大。聲明沒有澆熄 12 月 9 日升息的預期。", "en": "The Fed held its policy rate at 3.75% to 4.00% on Wednesday by a 10-2 vote, with both dissenters wanting a quarter-point hike; Governor Cook's dissent was her first in more than four years. Chair Warsh said the AI buildout cannot ignore rising borrowing costs, that rates affect almost everything directly or indirectly, and that credit spreads on some riskier assets are widening. The statement did little to dispel expectations of a hike on December 9.", "url": "https://pro.thestreet.com/market-commentary/microsoft-beats-alphabet-misses-and-fed-holds-steady", "stocks": [{"t": "SHY", "n": "短天期美債 ETF，對政策利率最敏感"}, {"t": "TLT", "n": "長天期美債 ETF，升息預期壓著長債"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "通膨與成長", "color": "#7C6AF7", "zh": "9 月 PCE 物價年增 3.6%，高於前月的 3.4%，核心 PCE 年增 3.1%；第三季 GDP 年化成長 3.4%，優於預期的 3.1% 與第二季的 2.2%，其中企業投資成長 12.7%。成長強、通膨又在升，市場因此預期 12 月升息，十年期殖利率貼近 5%。要留意企業投資的強勁大部分來自 AI 建設，和上面的資本支出爭議是同一條線。", "en": "September PCE inflation rose 3.6% from a year earlier, up from 3.4%, with core PCE at 3.1%; third-quarter GDP grew at a 3.4% annualized rate, above the 3.1% forecast and the 2.2% of the second quarter, with business investment up 12.7%. Strong growth and rising inflation have markets pricing a December hike, with the 10-year yield near 5%. Much of the investment strength is the AI buildout, the same thread as the capital spending debate.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-29-dow-sp-500-nasdaq-alphabet-microsoft-081708101.html", "stocks": [{"t": "SPY", "n": "標普 500 ETF，升息預期壓抑估值"}, {"t": "TIP", "n": "抗通膨債券 ETF，通膨升溫的對照"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "就業與期中選舉", "color": "#7C6AF7", "zh": "上一份就業報告顯示 9 月非農只增加 2.9 萬人，遠低於預期的 8.4 萬至 9 萬人，失業率上升；10 月就業報告預定 11 月 6 日公布，第三季僱用成本指數（ECI）則在今天 8:30（美東）發布。通膨在升、就業在轉弱，讓 Fed 12 月的決定更難。11 月 3 日的期中選舉也是變數，但有評論認為 Fed 風險比選舉結果更大。", "en": "The last jobs report showed September payrolls up only 29,000 against 84,000 to 90,000 expected, with unemployment rising; the October report is scheduled for November 6, and the third-quarter Employment Cost Index is due today at 8:30 a.m. Eastern. Rising inflation and softening hiring make the Fed's December call harder. The November 3 midterm elections add uncertainty, though some commentary sees the Fed as the bigger market risk.", "url": "https://www.newsweek.com/job-market-economy-midterms-2026-scenarios-preductions-12602195", "stocks": [{"t": "SHY", "n": "短天期美債 ETF，就業轉弱與升息預期的交會"}, {"t": "DIA", "n": "道瓊 ETF，週四 -0.25%"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "輪向防禦", "color": "#4EABA4", "zh": "週四資金從科技巨頭轉向醫療保健、金融與房地產。禮來上漲約 6%，是醫療類股的領頭羊。這種輪動符合「AI 回報被重新檢視、利率預期上升」的組合：獲利穩定的防禦型板塊相對受惠，但房地產與金融對利率其實敏感，持續性有待觀察，單日現象不等於趨勢。", "en": "On Thursday money moved out of the tech giants into healthcare, financials and real estate. Eli Lilly rose about 6%, leading the healthcare group. The rotation fits a mix of re-examined AI returns and rising rate expectations: steady-earnings defensives benefit, though real estate and financials are rate-sensitive, so durability is unproven and one day is not a trend.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-29-dow-sp-500-nasdaq-alphabet-microsoft-081708101.html", "stocks": [{"t": "LLY", "n": "禮來，約 +6%"}, {"t": "XLV", "n": "醫療保健 ETF，週四資金流入"}, {"t": "XLRE", "n": "房地產 ETF，週四資金流入"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "光通訊併購", "color": "#4EABA4", "zh": "報導指出 Marvell 正在和 Lumentum 進行收購的深入談判，Marvell 股價下跌約 11%，Lumentum 上漲約 5%。這是 AI 資料中心「光連接」環節的整合訊號，也顯示買方付出高價時市場會先懲罰收購方。目前是媒體報導，尚未見雙方正式公告，細節以公司公告為準。", "en": "Reports said Marvell is in advanced talks to acquire Lumentum; Marvell shares fell about 11% while Lumentum rose about 5%. It points to consolidation in the optical-connectivity layer of AI data centers and shows the market punishing the acquirer first when a rich price is paid. This is based on media reports with no formal announcement yet, so rely on company filings for details.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-29-dow-sp-500-nasdaq-alphabet-microsoft-081708101.html", "stocks": [{"t": "MRVL", "n": "Marvell，約 -11%，傳洽談收購 Lumentum"}, {"t": "LITE", "n": "Lumentum，約 +5%，傳為收購標的"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "消費分化", "color": "#4EABA4", "zh": "消費類股財報分歧很大：Sprouts 因降價搶客，第四季獲利指引遠低於預期，股價重挫 18% 至 23%；Carvana 第三季營收 80.4 億美元（年增 42.4%），零售車輛銷量成長 39%，股價上漲約 15%。同一個消費端，一邊是靠降價換量、一邊是營收大增，市場獎勵的是有獲利成長的故事，而不是以價換量。", "en": "Consumer earnings diverged sharply: Sprouts guided fourth-quarter profit far below expectations as it cuts prices to win back shoppers and fell 18% to 23%, while Carvana's third-quarter revenue of $8.04 billion (up 42.4%) and retail unit sales up 39% sent the stock up about 15%. The market rewarded profitable growth rather than volume bought with lower prices.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-29-dow-sp-500-nasdaq-alphabet-microsoft-081708101.html", "stocks": [{"t": "SFM", "n": "Sprouts，第四季指引遠低於預期，-18% 至 -23%"}, {"t": "CVNA", "n": "Carvana，營收年增 42.4%，約 +15%"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "小型股逆勢", "color": "#5B8ED6", "zh": "羅素 2000 週四上漲 1.01% 收 2,859.22，同一天那斯達克下跌 1.38%，兩者差距近 2.4 個百分點。我們的解讀（非來源陳述）：小型股較少暴露在 AI 資本支出回報的疑慮上，也較多受國內成長與資金輪動影響。但小型股對利率更敏感，十年期殖利率貼近 5% 時這個優勢能維持多久，是接下來要看的事。", "en": "The Russell 2000 gained 1.01% to 2,859.22 on Thursday while the Nasdaq fell 1.38%, a gap of nearly 2.4 percentage points. Our interpretation, not a stated fact from the source: small caps have less exposure to doubts over AI spending returns and more to domestic growth and rotation. They are also more rate-sensitive, so how long the edge lasts with the 10-year yield near 5% is the thing to watch.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-29-dow-sp-500-nasdaq-alphabet-microsoft-081708101.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週四 +1.01%"}, {"t": "IJR", "n": "標普小型股 600 ETF，小型股的另一個基準"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "Crocs 回升", "color": "#5B8ED6", "zh": "Crocs 第三季 HEYDUDE 品牌營收年增 6% 到 1.7 億美元，是六個季度以來首次成長；Crocs 品牌營收年增 4%、創第三季新高，公司上調全年營收與獲利展望，第三季買回約 200 萬股、金額 2.5 億美元。股價大漲約 25%。HEYDUDE 只是剛止跌，不代表轉折已確立，後面幾季能否續增才是驗證。", "en": "Crocs said third-quarter HEYDUDE revenue rose 6% to $170 million, its first increase in six quarters; the Crocs brand grew 4% to a record third quarter, the company raised its full-year revenue and earnings outlook, and it repurchased about 2.0 million shares for $250 million in the quarter. The stock jumped about 25%. HEYDUDE has only stopped falling, so confirmation requires further quarters of growth.", "url": "https://www.sec.gov/Archives/edgar/data/0001334036/000133403626000058/croxq32026-pressrelease.htm", "stocks": [{"t": "CROX", "n": "Crocs，HEYDUDE 六季來首度成長，股價約 +25%"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "ADT 收購報價", "color": "#5B8ED6", "zh": "據 Yahoo Finance 整理，ADT 週四上漲約 33% 至約 9.87 美元，起因是一份價值約 76 億美元的收購報價。我們沒有查到買方與完整條件的公告，只有這則市場報導，因此收購價格、是否為最終協議、是否需要股東與主管機關核准都還不明。收購消息股價大漲後，剩下的價差常反映市場對交易完成機率的看法。", "en": "According to Yahoo Finance's market wrap, ADT rose about 33% to roughly $9.87 on a buyout offer valued at about $7.6 billion. We could not find a filing naming the buyer or full terms, only this market report, so the price, whether it is a definitive agreement, and any shareholder or regulatory approvals are unclear. After a big jump on a buyout, the remaining spread to the offer usually reflects the market's view of the odds of completion.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-29-dow-sp-500-nasdaq-alphabet-microsoft-081708101.html", "stocks": [{"t": "ADT", "n": "ADT，約 +33% 至約 9.87 美元，傳 76 億美元收購報價"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "外送併購案", "color": "#5B8ED6", "zh": "DoorDash 同意以每股 65 美元、約 170 億美元股權價值收購 Instacart（Maplebear），較 10 月 22 日（媒體報導前一日）收盤價溢價 26%。股東可選全現金 65 美元、0.3372 股 DoorDash 股票，或 48.75 美元現金加 0.0843 股，整體現金至少占 75%。預計要到 2027 年底或 2028 年上半年才完成，需通過 Instacart 股東投票與反壟斷審查。", "en": "DoorDash agreed to acquire Instacart (Maplebear) for $65.00 per share, about $17 billion in equity value, a 26% premium to the October 22 close, the last trading day before media reports. Holders can elect $65.00 in cash, 0.3372 DoorDash shares, or $48.75 in cash plus 0.0843 shares, with at least 75% of the total paid in cash. Closing is expected at the end of 2027 or the first half of 2028, subject to an Instacart shareholder vote and antitrust review.", "url": "https://www.sec.gov/Archives/edgar/data/0001792789/000179278926000062/proddashex991-pressrelease.htm", "stocks": [{"t": "CART", "n": "Instacart（Maplebear），收購價每股 65 美元"}, {"t": "DASH", "n": "DoorDash，收購方，現金部分以現金與舉債支付"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "單日大振幅", "color": "#5B8ED6", "zh": "同一天裡，Crocs 約 +25%、ADT 約 +33%、Sprouts 約 -18% 至 -23%，都是中小型股。小型股判讀有三個習慣：第一，財報與指引會讓股價一天跳空二、三成，部位大小要先想好；第二，流動性較差，買賣價差在跳空日會擴大；第三，大型股的單日波動大多落在個位數，所以用大型股的風險感去看小型股容易低估。", "en": "On the same day Crocs rose about 25%, ADT about 33% and Sprouts fell 18% to 23%, all small and mid caps. Three habits for reading small caps: earnings and guidance can gap a stock 20% to 30% in a session, so size positions beforehand; liquidity is thinner and bid-ask spreads widen on gap days; and large caps usually move in single digits, so using a large-cap sense of risk underestimates small-cap swings.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-29-dow-sp-500-nasdaq-alphabet-microsoft-081708101.html", "stocks": [{"t": "IJR", "n": "標普小型股 600 ETF，品質篩選較嚴的小型股基準"}, {"t": "VB", "n": "小型股 ETF，涵蓋範圍更廣"}]},
