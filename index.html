/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;
    --text-tertiary: #6b6863; --divider: #ddd9d1;
    --noise-opacity: 0.035;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;

  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }

    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }

  ::-webkit-scrollbar { width: 2px; }

  /* 鍵盤焦點:看得到目前在哪一顆 */
  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }

  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }

  {"id": "earn_0", "channel": "財報速報", "tag": "AppLovin", "color": "#E8786A", "zh": "AppLovin（APP）週三盤後公布第三季：營收 21.85 億美元，年增 55%，每股盈餘 4.30 美元，高於預期的約 4.03 到 4.07 美元；第四季營收指引 23.65 億到 23.95 億美元，高於預期約 22.5 億美元。董事會再增加 32 億美元庫藏股授權。各來源對盤後漲幅說法不一，約 16% 到 18%；Yahoo 的連盤後計算是約 22.6%。", "en": "AppLovin (APP) reported Q3 after Wednesday's close: revenue of $2.185 billion, up 55%, and EPS of $4.30 versus estimates of about $4.03–4.07; Q4 revenue guidance of $2.365–2.395 billion topped the roughly $2.25 billion estimate. The board added $3.2 billion to its buyback authorization. Sources differ on the after-hours gain, roughly 16% to 18%, while Yahoo's session-plus-extended figure was about 22.6%.", "url": "https://www.benzinga.com/markets/earnings/26/11/62890608/applovin-stock-surges-on-q3-double-beat-strong-outlook", "stocks": [{"t": "APP", "n": "營收 +55%、Q4 指引 23.65 億到 23.95 億美元，盤後約 +16%"}]},
  {"id": "earn_1", "channel": "財報速報", "tag": "財報分歧", "color": "#E8786A", "zh": "週三盤中公布財報的幾家公司反應兩極：Block 上漲約 16%，每股盈餘 1.13 美元高於預期的 1.03 美元、營收 67.2 億美元，並調升全年展望；Booking 上漲 11%。相反地，Datadog 雖然兩項都超預期，第四季營收指引 11.9 億到 12 億美元沒有高於共識 12 億美元，股價下跌約 14%；FIS 把全年每股盈餘展望從 6.15 到 6.24 美元砍到 5.82 到 5.89 美元，大跌約 24%。數字取自 CNBC 午盤整理。", "en": "Companies reporting around Wednesday's session split sharply: Block rose about 16% on EPS of $1.13 versus $1.03 expected, revenue of $6.72 billion and a raised full-year outlook, and Booking gained 11%. By contrast, Datadog beat on both lines but its Q4 revenue guide of $1.19–1.20 billion did not top the $1.20 billion consensus, and it fell about 14%; FIS cut its full-year EPS outlook to $5.82–5.89 from $6.15–6.24 and dropped about 24%. Figures are from CNBC's midday roundup.", "url": "https://www.cnbc.com/2026/11/04/stocks-making-the-biggest-moves-midday-crwv-mu-bkng-mcd-cvs.html", "stocks": [{"t": "XYZ", "n": "Block，盤中約 +16%，調升全年展望"}, {"t": "DDOG", "n": "Datadog，Q4 指引未高於共識，約 -14%"}, {"t": "FIS", "n": "全年盈餘展望下修，約 -24%"}, {"t": "BKNG", "n": "Booking，約 +11%"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "分拆與下滑", "color": "#E8786A", "zh": "高通（QCOM）週三盤後公布財報：營收年減 8% 至 103.2 億美元，下一季指引 104 億到 112 億美元，盤後約下跌 4.4%（常規盤收 173.19 美元）。CVS Health 盤中大跌超過 12%，CNBC 的整理寫公司計畫在 2028 年上半年前拆成兩家上市公司、撤銷 780 億美元的 Aetna 併購；這是午盤整理的描述，細節請看公司公告。諾和諾德則因財報優於預期並調升全年展望，上漲超過 6%。", "en": "Qualcomm (QCOM) reported after Wednesday's close: revenue fell 8% to $10.32 billion, guidance for the next quarter is $10.4–11.2 billion, and the stock slid about 4.4% after hours from a $173.19 close. CVS Health fell more than 12% intraday; CNBC's roundup described a plan to split into two public companies by the first half of 2028, reversing the $78 billion Aetna deal, a midday description whose details should be checked against the company filing. Novo Nordisk rose more than 6% on better-than-expected results and a raised full-year outlook.", "url": "https://www.cnbc.com/2026/11/04/stocks-making-the-biggest-moves-midday-crwv-mu-bkng-mcd-cvs.html", "stocks": [{"t": "QCOM", "n": "營收 -8%，盤後約 -4.4%"}, {"t": "CVS", "n": "盤中約 -12%，傳出拆分為兩家上市公司"}, {"t": "NVO", "n": "財報優於預期並上調展望，約 +6%"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "ADP 與貿易", "color": "#7C6AF7", "zh": "週三公布的兩項數據：ADP 民間就業 10 月增加 8.6 萬人，高於路透調查預期的 6.9 萬人（道瓊的預估是 7.5 萬），9 月修正為 8.6 萬；9 月貿易逆差 1,050 億美元，比 8 月的 1,057 億美元略縮小。兩項都沒有改變大方向，但 ADP 近幾個月常與政府的非農數據走不同方向，經濟學家只把它當方向參考，不是週五非農的預告。", "en": "Two releases on Wednesday: ADP private payrolls rose 86,000 in October, above the 69,000 Reuters poll forecast (Dow Jones estimated 75,000), with September revised to 86,000; the September trade deficit was $105.0 billion, slightly narrower than August's $105.7 billion. Neither changed the big picture, and ADP has often diverged from the government payroll data in recent months, so economists treat it as a directional hint, not a preview of Friday's report.", "url": "https://www.usnews.com/news/national-news/articles/2026-11-04/adp-86k-jobs-added-in-october-as-hiring-picks-up", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，利率與景氣敏感"}, {"t": "IWM", "n": "羅素 2000 ETF，就業與利率敏感"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "升息仍在桌上", "color": "#7C6AF7", "zh": "市場現在的關鍵連結是「就業數據→12 月會不會升息」。Barclays 的經濟學家估計 10 月非農約增加 5 萬人、失業率降到 4.1%，並指出這種組合會讓 12 月 FOMC 升息繼續「在牌桌上」；路透調查的共識是 6.5 萬人、失業率 4.2%。殖利率則是先前提過的約 4.90%，下降幅度不到 5 個基點，這幾天仍卡在 5% 附近。我沒有查到最新的升息機率數字，所以不引用。", "en": "The market's key link right now is jobs data to a December hike. Barclays estimates October payrolls near 50,000 with unemployment slipping to 4.1%, and says that combination would keep a December FOMC hike in play; the Reuters consensus is 65,000 and 4.2%. The 10-year yield, around 4.90% after a drop of under 5 basis points, is still stuck near 5%. I did not find a current hike-probability figure, so I do not quote one.", "url": "https://continuumeconomics.com/a/2d9f494f/preview-due-november-6-us-october-employment-non-farm-payrolls-subdued-report-to-hint-at-q4-slowing", "stocks": [{"t": "TLT", "n": "長天期美債 ETF，十年期約 4.90%"}, {"t": "XLF", "n": "金融類股 ETF，利率路徑敏感"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "選後政策", "color": "#7C6AF7", "zh": "民主黨拿下國會兩院，川普表示接受結果，市場把它解讀成政治不確定性下降，也是政策可能受到制衡的訊號。這一天最明顯的反應是產業輪動：國防股下跌、太陽能與醫療保險股上漲（詳見產業卡）。要提醒的是，目前我只查到市場反應，沒有查到新國會對關稅或預算的具體立場，政策變動要等後續法案與表態才算數。", "en": "Democrats took both chambers of Congress and Trump said he accepts the results, which the market read as lower political uncertainty and a possible check on policy. The clearest reaction was sector rotation: defense fell while solar and health insurers rose (see the sector cards). Note that I only found the market reaction, not the new Congress's concrete stance on tariffs or the budget; policy change counts only once bills and statements follow.", "url": "https://www.cnbc.com/2026/11/03/stock-market-today-live-updates.html", "stocks": [{"t": "ITA", "n": "航太國防 ETF，國防股選後下跌"}, {"t": "TAN", "n": "太陽能 ETF，選後上漲"}, {"t": "XLV", "n": "醫療類股 ETF，醫療保險股走強"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "AI 基建賣壓", "color": "#4EABA4", "zh": "AI 基礎建設相關股在週三被集中賣出：CoreWeave 午盤約下跌 9%、Iren 下跌 11%、Nebius 約下跌 6%；與資料中心用電、施工有關的 Comfort Systems 午盤下跌 17%、Vistra 下跌 13%。報導的說法是選後對資料中心建設放緩的擔憂（Texas 州長選舉結果也被提到），這是媒體整理的解釋，各公司本身沒有同步公布利空。這些是午盤數字，收盤可能不同。", "en": "AI-infrastructure names were sold hard on Wednesday: CoreWeave fell about 9% at midday, Iren 11% and Nebius about 6%; data-center power and construction plays Comfort Systems fell 17% and Vistra 13%. Reports pointed to post-election worries about slower data-center buildout (the Texas governor's race was also cited), which is a media explanation, and none of these companies announced bad news. These are midday figures and closes may differ.", "url": "https://www.cnbc.com/2026/11/04/stocks-making-the-biggest-moves-midday-crwv-mu-bkng-mcd-cvs.html", "stocks": [{"t": "CRWV", "n": "CoreWeave，午盤約 -9%"}, {"t": "VST", "n": "Vistra，午盤約 -13%"}, {"t": "FIX", "n": "Comfort Systems，午盤約 -17%"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "再生能源反彈", "color": "#4EABA4", "zh": "太陽能與再生能源股在選後走強：First Solar 收盤上漲 4.63%，Invesco 太陽能基金上午 11 點約上漲 8%；午盤 Sunrun 與 Plug Power 各約上漲 7%、Nextpower 上漲 15%。這和前面的 AI 基建賣壓形成對比：資金從押注資料中心用電的主題，轉到押注政策可能偏向再生能源的主題。這是一天的輪動，還不是趨勢。", "en": "Solar and renewable stocks strengthened after the election: First Solar closed up 4.63%, the Invesco solar fund was up about 8% at 11 a.m., and at midday Sunrun and Plug Power were each up about 7% and Nextpower 15%. It contrasts with the AI-infrastructure selloff: money moved from a data-center power theme to a theme betting policy may tilt toward renewables. That is one day of rotation, not yet a trend.", "url": "https://stocktitan.net/articles/stock-market-today-live-november-4-2026", "stocks": [{"t": "FSLR", "n": "First Solar，收盤約 +4.63%"}, {"t": "RUN", "n": "Sunrun，午盤約 +7%"}, {"t": "PLUG", "n": "Plug Power，午盤約 +7%"}, {"t": "TAN", "n": "太陽能 ETF，上午約 +8%"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "國防與醫保", "color": "#4EABA4", "zh": "選後的另一組對照是國防與醫療保險：國防股下跌，洛克希德馬丁午盤約下跌 6%，諾斯洛普與 Howmet 各下跌超過 4%；醫療保險與醫院股上漲，Centene 收盤上漲 12.64%、HCA Healthcare 收盤上漲 10.39%。媒體把前者連到民主黨掌國會後的國防預算預期，把後者連到醫保政策預期。這些是市場的推測，具體政策還沒出現。", "en": "Another post-election pair was defense versus health insurance: defense fell, with Lockheed Martin down about 6% at midday and Northrop Grumman and Howmet each down more than 4%, while insurers and hospitals rose, with Centene closing up 12.64% and HCA Healthcare up 10.39%. Media linked the first to defense-budget expectations under a Democratic Congress and the second to health-policy expectations. Those are market guesses; no concrete policy has appeared yet.", "url": "https://stocktitan.net/articles/stock-market-today-live-november-4-2026", "stocks": [{"t": "LMT", "n": "洛克希德馬丁，午盤約 -6%"}, {"t": "NOC", "n": "諾斯洛普，午盤逾 -4%"}, {"t": "CNC", "n": "Centene，收盤約 +12.64%"}, {"t": "HCA", "n": "HCA Healthcare，收盤約 +10.39%"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000", "color": "#5B8ED6", "zh": "我沒有查到 11/4 羅素 2000 的收盤數字，所以不寫漲跌幅。能確認的背景是：前一天（11/3）收 2,812.45，10/29 為 2,859.22。週三的兩個消息對小型股是順風，油價大跌、殖利率回落；小型股對利率比大型股敏感，有分析指出羅素 2000 約 40% 的債務是浮動利率，標普 500 不到 15%（5 月的二手分析，數字僅供參考）。請用行情軟體確認實際漲幅。", "en": "I did not find the Russell 2000's close for Nov 4, so I state no percentage. What I can confirm: it closed at 2,812.45 on Nov 3 and was 2,859.22 on Oct 29. Wednesday's oil plunge and lower yields are tailwinds for small caps, which are more rate-sensitive than large caps; one analysis noted roughly 40% of Russell 2000 debt is floating-rate versus under 15% for the S&P 500 (a May secondary source, indicative only). Check a quote screen for the actual move.", "url": "https://tapeboard.com/blog/market-pulse-2026-10-29", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，11/3 指數收 2,812.45"}, {"t": "IJR", "n": "標普小型 600 ETF，同為小型股參照"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "Duolingo", "color": "#5B8ED6", "zh": "語言學習應用 Duolingo（DUOL）週三午盤大漲約 32%。它第三季營收 3.09 億美元，高於預期的 3.03 億美元；月活躍用戶 1.53 億，高於預期的 1.49 億，EBITDA 利潤率也優於預期。週二晚間盤後已先漲約 11%，隔天擴大。用戶數與利潤率同時超預期，是這種單日大漲背後的內容，不過它的市值在這群股票裡偏中型，不算典型小型股。", "en": "Language-learning app Duolingo (DUOL) jumped about 32% at midday Wednesday. Q3 revenue was $309 million versus $303 million expected, monthly active users were 153 million versus a 149 million forecast, and EBITDA margin also beat. It had already gained about 11% after hours Tuesday and extended the move. Users and margin beating together is what stands behind such a one-day jump, though its size is closer to mid-cap than a typical small cap.", "url": "https://www.cnbc.com/2026/11/04/stocks-making-the-biggest-moves-midday-crwv-mu-bkng-mcd-cvs.html", "stocks": [{"t": "DUOL", "n": "Duolingo，午盤約 +32%，用戶與利潤率雙超預期"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "Clear Secure", "color": "#5B8ED6", "zh": "身分驗證公司 Clear Secure（YOU）午盤被 CNBC 列為大漲約 33%。官方第三季新聞稿顯示營收 2.929 億美元，年增 27.8%，調整後 EBITDA 1.039 億美元；自由現金流是負的 1.038 億美元，但公司說這含約 3.15 億美元的合作夥伴負債一次性結算。午盤整理提到「調升全年自由現金流展望」，我只確認 Q2 時展望由至少 4.65 億調到至少 4.8 億，Q3 是否再調升我沒能驗證。", "en": "Identity-verification company Clear Secure (YOU) was listed by CNBC as up about 33% at midday. Its Q3 release shows revenue of $292.9 million, up 27.8%, and adjusted EBITDA of $103.9 million; free cash flow was negative $103.8 million, which the company says includes a roughly $315 million one-time settlement of partnership liabilities. The midday roundup mentioned a raised full-year free-cash-flow outlook; I only confirmed the Q2 raise from at least $465 million to at least $480 million and could not verify a further Q3 raise.", "url": "https://www.sec.gov/Archives/edgar/data/0001856314/000185631426000053/clearq32026pressreleaseear.htm", "stocks": [{"t": "YOU", "n": "Clear Secure，午盤約 +33%，Q3 營收 +27.8%"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "Trimble 下修", "color": "#5B8ED6", "zh": "Trimble（TRMB，嚴格說屬中型股）午盤下跌約 18%，原因是下修展望：預期 2026 年有機年度經常性收入成長約 10%，低於原先的 12% 到 14%。對小型股讀者的提醒是，軟體與科技股的成長故事一旦指引下修，股價反應通常比營收小幅落後更大，因為估值是用「成長持續」來撐的。同一天 Datadog 的例子也類似：數字超預期，但指引沒有更高。", "en": "Trimble (TRMB, strictly a mid cap) fell about 18% at midday after cutting its outlook: it now expects 2026 organic annual recurring revenue growth of about 10%, down from 12% to 14%. A reminder for small-cap readers: once growth guidance is cut, software and tech stocks usually react more than to a small revenue miss, because the valuation rests on growth continuing. Datadog the same day was similar: results beat but guidance was not higher.", "url": "https://www.cnbc.com/2026/11/04/stocks-making-the-biggest-moves-midday-crwv-mu-bkng-mcd-cvs.html", "stocks": [{"t": "TRMB", "n": "Trimble，午盤約 -18%，ARR 成長展望下修至約 10%"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "判讀小型股", "color": "#5B8ED6", "zh": "看小型股的單日大漲，先問三件事：一，是財報數字還是指引推動？Duolingo 是數字超預期，Trimble 與 Datadog 是指引。二，流動性：成交量小的股票，一筆買賣就能推動價格，大漲日也容易隔天回吐。三，覆蓋與資金結構：分析師少的股票容易被忽視也容易被錯估，浮動利率債務多的公司則受利率影響更直接。以上是判讀框架，不是對任何個股的看法。", "en": "When a small cap jumps in a day, ask three things. First, was it the numbers or the guidance? Duolingo was results; Trimble and Datadog were guidance. Second, liquidity: in thinly traded stocks one order can move the price, and big up days often give back the next day. Third, coverage and capital structure: stocks with few analysts are easy to ignore and easy to misprice, and companies with more floating-rate debt feel rate changes more directly. This is a framework, not a view on any stock.", "url": "https://tapeboard.com/blog/market-pulse-2026-10-29", "stocks": [{"t": "IJR", "n": "標普小型 600 ETF，小型股基準"}, {"t": "IWO", "n": "羅素 2000 成長 ETF，成長型小型股參照"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "Shoals 池內", "color": "#C9A227", "zh": "Shoals（SHLS）做太陽能電廠用的電氣平衡系統。它仍在雷達池裡，我沒有查證最新分析師家數，所以「還被忽視」只是池內舊判斷。11/4 盤前公布第三季：營收 1.953 億美元，年增 43.8%，高於公司自己給的 1.5 億到 1.7 億美元指引；毛利率 31.9%，低於去年同期的 37.0%；營業利益 2,900 萬美元，淨利 1,790 萬美元。風險是毛利率下滑、全年指引我沒查到是否更新（Q2 時是營收 6 億到 6.4 億美元），以及政策方向剛變。以上是研究線索，不是投資建議。", "en": "Shoals (SHLS) makes electrical balance-of-system equipment for solar plants. It remains in the radar pool, but I did not check current analyst coverage, so 'still neglected' is only the pool's older judgment. Q3 came before the open on Nov 4: revenue of $195.3 million, up 43.8% and above the company's own $150–170 million outlook; gross margin of 31.9% versus 37.0% a year earlier; operating income of $29.0 million and net income of $17.9 million. Risks are the margin decline, an unconfirmed full-year guide (Q2 had revenue of $600–640 million), and a policy direction that just changed. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001831651/000183165126000121/exhibit991earningsrelease2.htm", "stocks": [{"t": "SHLS", "n": "Q3 營收 1.953 億美元超出自家指引，毛利率 31.9%"}], "status": "RADAR · 下一個驗證點 全年指引與毛利率走向"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "XPOF 池內", "color": "#C9A227", "zh": "Xponential Fitness（XPOF）經營精品健身工作室品牌的加盟體系，是池內回鍋追蹤。最新確認的資料是 8/6 的第二季：營收 6,600 萬美元，年減 13%，並下修全年展望，淨新增工作室改為約 150 間。前一天的晨報寫 Q3 在 11/5 盤後公布，我這次沒能找到官方公告，只知道去年是 11/6 盤後 4:30 電話會議，所以日期要以公司公告為準。池內另記錄 4 月啟動策略替代方案檢討（聘 Jefferies，選項含出售或合併）。風險是營收還在下滑、加盟體系成長放緩。以上是研究線索，不是投資建議。", "en": "Xponential Fitness (XPOF) runs a franchise system of boutique fitness studio brands and is a returning pool name. The latest confirmed data is the Aug 6 second quarter: revenue of $66.0 million, down 13%, with a revised full-year outlook of about 150 net new studios. The prior brief put Q3 on Nov 5 after the close; I could not find the official announcement this time, only that last year the call was Nov 6 at 4:30 p.m. ET, so confirm the date with the company. The pool also notes a strategic-alternatives review started in April (Jefferies hired; options include a sale or merger). Risks are still-falling revenue and slowing franchise growth. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001802156/000119312526338374/d328551dex991.htm", "stocks": [{"t": "XPOF", "n": "Q2 營收 6,600 萬美元、年減 13%，下修全年展望"}], "status": "RADAR · 下一個驗證點 策略檢討結論與 Q3 財報（日期待確認）"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "Starz 池內", "color": "#C9A227", "zh": "Starz（STRZ）是訂閱制影視頻道與串流公司，池內追蹤。資料互相矛盾所以我要先講：8/7 公布的財季營收約 3.079 億美元、年減 11.24%（Quiver），Google 另列 3.209 億對 3.061 億預估；CEO Jeffrey Hirsch 的 1 萬股買進，有來源寫 5/12 價格 20.72 美元，另一來源寫 8/10 價格 24.80 美元，持股約 6.5 萬股。前一天晨報寫的「CEO、CFO 11/2 買進」這次我沒能驗證，請當作未確認，要看 Form 4 原件。風險是營收下滑與資料不確定。以上是研究線索，不是投資建議。", "en": "Starz (STRZ) is a subscription premium-channel and streaming company and a pool name. The data conflict, so I say so first: the quarter reported Aug 7 had revenue of about $307.9 million, down 11.24% (Quiver), while Google lists $320.9 million against a $306.1 million estimate; one source dates CEO Jeffrey Hirsch's 10,000-share buy at May 12 and $20.72, another at Aug 10 and $24.80, with holdings near 65,000 shares. The prior brief's 'CEO and CFO bought on Nov 2' I could not verify this time, so treat it as unconfirmed and check the Form 4s. Risks are falling revenue and the data uncertainty. This is a research lead, not investment advice.", "url": "https://www.quiverquant.com/news/Insider+Purchase%3A+President+and+CEO+of+%24STRZ+Buys+10%2C000+Shares", "stocks": [{"t": "STRZ", "n": "財季營收約 3.079 億美元（-11.24%），CEO 買進日期各來源不一"}], "status": "RADAR · 下一個驗證點 Form 4 原件與下次財報"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "STC 降溫", "color": "#C9A227", "zh": "Stewart Information Services（STC）是產權保險與房地產交易服務公司，池內追蹤，這次的更新偏負面。10/21 公布第三季：營收 9.007 億美元，GAAP 每股盈餘 0.98 美元，去年同期是 1.55 美元；調整後 1.33 美元，去年同期是 1.64 美元；營業現金流 4,660 萬美元，去年同期是 9,260 萬美元。獲利與現金流都比去年弱。有第三方文章寫股價在 36 美元區，但 8 月的 Form 4 成交價是 69.16 美元，兩者差很多，我不採用該文章。以上是研究線索，不是投資建議。", "en": "Stewart Information Services (STC) is a title insurer and real-estate transaction services company in the pool, and this update is negative. Q3 on Oct 21: revenue of $900.7 million, GAAP EPS of $0.98 versus $1.55 a year ago, adjusted EPS of $1.33 versus $1.64, and operating cash flow of $46.6 million versus $92.6 million. Earnings and cash flow were both weaker than last year. One third-party article put the price in the $36 zone, but an August Form 4 sale was at $69.16, a big gap, so I do not use that article. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0000094344/000110465926117852/tm2628060d1_ex99-1.htm", "stocks": [{"t": "STC", "n": "Q3 調整後每股盈餘 1.33 美元（去年 1.64），營業現金流減半"}], "status": "RADAR · 降溫觀察，下一個驗證點 下一季財報"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "NPB 池內", "color": "#C9A227", "zh": "Northpointe Bancshares（NPB）是銀行控股公司，池內追蹤。可確認的是 CEO Charles Alan Williams 在 2026 年多次買進：2 月 14,205 股、5 月 25,000 股、8 月 30,000 股（來自內部人交易快訊的標題）。但整體並不單純：同一來源顯示過去 12 個月內部人買進 151 萬美元、賣出 238 萬美元，近 90 天其他內部人賣出約 7.39 萬股、130 萬美元。池內記錄 10/20 已公布第三季並宣布出售分銷零售與消費者直接房貸承作通路，Q3 淨利我這次沒取得；分析師共識評等是「持有」。以上是研究線索，不是投資建議。", "en": "Northpointe Bancshares (NPB) is a bank holding company in the pool. Confirmed: CEO Charles Alan Williams bought repeatedly in 2026, 14,205 shares in February, 25,000 in May and 30,000 in August (from insider-trade alert headlines). The picture is not simple, though: the same source shows insiders bought $1.51 million and sold $2.38 million over 12 months, with other insiders selling about 73,895 shares, or $1.30 million, in the last 90 days. The pool notes Q3 was reported Oct 20 with a sale of its wholesale-retail and direct-to-consumer mortgage origination channels; I did not retrieve Q3 net income this time, and the consensus rating is Hold. This is a research lead, not investment advice.", "url": "https://www.insidertrades.com/alerts/nyse-npb-insider-buying-and-selling-2026-08-27/", "stocks": [{"t": "NPB", "n": "CEO 2 月、5 月、8 月三度買進，12 個月內部人淨賣出"}], "status": "RADAR · 下一個驗證點 10/20 的 8-K 與 10-Q 淨利、通路出售後獲利結構"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "TTMI 對照", "color": "#C9A227", "zh": "這張是對照案例，不入池：TTM Technologies（TTMI）的 CEO Edwin Roks 在 8/25 以約 111.77 美元買進 1 萬股、約 111.8 萬美元，持股增加 18.24% 到 64,814 股，看起來像內部人買進訊號。但它不符合「被忽視」：第三季營收約 12 億美元、年增 60%，第四季指引 14.2 億到 14.4 億美元，近期股價約 131 美元；而且 6 個月內部人交易 243 筆裡，買進只有 2 筆、賣出 241 筆。一個高階主管買進，不能蓋掉大量賣出。以上是研究線索，不是投資建議。", "en": "This is a counter-example, not a pool entry: the CEO of TTM Technologies (TTMI), Edwin Roks, bought 10,000 shares on Aug 25 at about $111.77, roughly $1.118 million, raising his stake 18.24% to 64,814 shares, which looks like an insider-buying signal. But it is not neglected: Q3 sales were about $1.2 billion, up 60%, Q4 guidance is $1.42–1.44 billion and the stock is around $131; and of 243 insider trades in six months, only 2 were purchases and 241 were sales. One executive buying does not cancel heavy selling. This is a research lead, not investment advice.", "url": "https://www.insidertrades.com/alerts/nasdaq-ttmi-insider-buying-and-selling-2026-08-26/", "stocks": [{"t": "TTMI", "n": "CEO 8/25 買進約 111.8 萬美元；6 個月內部人 2 買 241 賣"}], "status": "RADAR · 對照案例，不入池"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "STC 買賣", "color": "#6DB56D", "zh": "Stewart Information Services（STC）的內部人交易是小買大賣：董事 C. Allen Bradley Jr. 6 月買進 1,000 股、約 6.39 萬美元，持股增加 4.16% 到 25,034 股（3 月也有類似的 1,000 股）；但 4 月有 CFO 賣出約 78.35 萬美元，8/21 另有一位內部人以 69.16 美元賣出 1,500 股、約 10.37 萬美元。一個彙整網站顯示過去 12 個月內部人買進約 1.6 萬美元、賣出約 91.6 萬美元。我沒有查到 10/21 財報後的任何新 Form 4。", "en": "Insider activity at Stewart Information Services (STC) is small buying against bigger selling: director C. Allen Bradley Jr. bought 1,000 shares in June for about $63,870, raising his stake 4.16% to 25,034 shares (a similar 1,000 shares in March); but the CFO sold about $783,510 in April, and on Aug 21 another insider sold 1,500 shares at $69.16, about $103,740. One aggregator shows insiders bought about $16,000 and sold about $916,000 over 12 months. I found no new Form 4 after the Oct 21 earnings.", "url": "https://www.insidertrades.com/alerts/nyse-stc-insider-buying-and-selling-2026-06-03/", "stocks": [{"t": "STC", "n": "董事小額買進，CFO 與內部人賣出較大"}]},
  {"id": "insider_1", "channel": "內部人動向", "tag": "NPB CEO", "color": "#6DB56D", "zh": "Northpointe Bancshares（NPB）CEO Charles Alan Williams 的買進金額一路加大：2 月 14,205 股、5/14 為 25,000 股、8/27 的快訊是 30,000 股；另有報導寫他以每股 16.88 美元買進 23,450 股，日期不明。連續三季加碼，是比單次買進更有意義的行為，但同一個來源也顯示其他內部人在近 90 天賣出約 130 萬美元。要判斷訊號強弱，請對照 EDGAR 的 Form 4 確認每筆是否為公開市場買進。", "en": "Northpointe Bancshares (NPB) CEO Charles Alan Williams has scaled up his purchases: 14,205 shares in February, 25,000 on May 14 and 30,000 in an Aug 27 alert; another report has him buying 23,450 shares at $16.88, date unclear. Adding three quarters running is more meaningful than a single buy, but the same source shows other insiders selling about $1.30 million over the last 90 days. To judge the signal, check the Form 4s on EDGAR to confirm each was an open-market purchase.", "url": "https://www.insidertrades.com/alerts/nyse-npb-insider-buying-and-selling-2026-05-14/", "stocks": [{"t": "NPB", "n": "CEO 買進 14,205 股→25,000 股→30,000 股"}]},
  {"id": "insider_2", "channel": "內部人動向", "tag": "叢集買進判讀", "color": "#6DB56D", "zh": "判讀內部人買進，常見的標準是「叢集買進」：一個來源的定義是兩週內有三位以上內部人買進，OpenInsider 則用七天內兩位以上。Form 4 要在交易後兩個營業日內申報，所以資料很新。但要排除事先排程的 10b5-1 計畫交易，那反映的是舊的決定。還要看比例：TTMI 一位 CEO 買進，同期卻有 241 筆賣出。叢集買進的歷史平均超額報酬，各來源說法不一，不要當成保證。", "en": "A common standard for reading insider buying is the 'cluster buy': one source defines it as three or more insiders buying within two weeks, while OpenInsider uses two or more within seven days. Form 4s are due within two business days of the trade, so the data is fresh. But exclude pre-scheduled 10b5-1 plan trades, which reflect older decisions. Also check the ratio: TTMI had one CEO buy against 241 sales in the same period. Sources vary on the average excess return after cluster buys, so do not treat it as a guarantee.", "url": "https://edgarlookup.com/articles/how-cluster-buying-works-when-multiple-insiders-buy-together", "stocks": [{"t": "TTMI", "n": "CEO 買進，但 6 個月內部人 241 筆賣出"}]},
  {"id": "capitol_0", "channel": "政要持股", "tag": "90 天申報", "color": "#B5654D", "zh": "統計眾議院書記官網站最近 90 天的 PTR（本次掃描 120 份申報，另有 18 份掃描圖檔未納入）：筆數最多的是 Gilbert Cisneros，126 筆（買 96、賣 28）、涉及 107 檔標的，金額區間合計約 55 萬到 293 萬美元，列在前面的有 EPAC、ALKS、APP、AORT，最近一份申報在 10/12；Kevin Hern 78 筆、其中 74 筆是賣出，前面有 BSX、HD；Pete Sessions 34 筆全是賣出，有 AAPL、AMZN。這種分散度很難讀出單一主題，只是記錄「誰申報了什麼」。", "en": "Counting House Clerk periodic transaction reports from the last 90 days (this scan covered 120 filings; 18 scanned-image filings were not included): the most active is Gilbert Cisneros with 126 trades (96 buys, 28 sells) across 107 tickers, with amount ranges totaling about $547,000 to $2.93 million, led by EPAC, ALKS, APP and AORT, latest filing Oct 12; Kevin Hern filed 78 trades, 74 of them sales, including BSX and HD; Pete Sessions filed 34 trades, all sales, including AAPL and AMZN. That spread is hard to read as a single theme; this only records who filed what.", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure", "stocks": [{"t": "APP", "n": "Cisneros 申報清單前列（今天 AppLovin 剛公布財報）"}, {"t": "AAPL", "n": "Sessions 申報的賣出標的之一"}, {"t": "BSX", "n": "Hern 申報標的之一"}]},
  {"id": "capitol_1", "channel": "政要持股", "tag": "判讀限制", "color": "#B5654D", "zh": "判讀政要申報要先記幾個限制：議員交易後最晚 45 天內申報，所以公開時的價格可能是一個半月前的；金額只給寬區間，看不到確切數字；很多交易是配偶或信託帳戶執行，申報不揭露誰做的決定；選擇權要看履約價與到期日才有資訊量。例如 Cisneros 一個人就有 107 檔標的，用單一主題解釋它並不合理。這個頻道只記錄「誰申報了什麼」，不是買賣建議，也不暗示任何人有內線資訊。", "en": "Read congressional filings with these limits in mind: members have up to 45 days to file, so the price at disclosure may be a month and a half old; amounts come only as wide ranges; many trades are in spouse or trust accounts, and filings do not reveal who made the decision; and options only carry information once you see strike and expiry. For example, Cisneros alone has 107 tickers, so explaining it with one theme is not reasonable. This channel records who filed what, not trading advice, and implies nothing about anyone having inside information.", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure", "stocks": [{"t": "NANC", "n": "追蹤民主黨議員持股的 ETF"}, {"t": "GOP", "n": "追蹤共和黨議員持股的 ETF"}]},
  {"id": "week_0", "channel": "本週事件", "tag": "非農與 CPI", "color": "#C97DD4", "zh": "接下來的總經數據：週五 11/6 公布 10 月非農就業。路透調查的共識是增加約 6.5 萬人（9 月是 2.9 萬人）、失業率 4.2%；E&Y Parthenon 預估 7.4 萬人，Barclays 預估 5 萬人、失業率 4.1%。ADP 週三給出 8.6 萬人，高於預期，但與非農不一定同方向。之後 11/10（週二）公布 10 月 CPI。11/5 還有英國央行利率決議。這些數字都會影響 12 月會不會升息的預期。", "en": "The macro data ahead: October nonfarm payrolls on Friday, Nov 6. The Reuters consensus is about 65,000 (September was 29,000) with unemployment at 4.2%; E&Y Parthenon expects 74,000 and Barclays 50,000 with unemployment at 4.1%. ADP showed 86,000 on Wednesday, above forecast, but it does not always move with payrolls. October CPI follows on Tuesday, Nov 10, and the Bank of England rate decision is on Nov 5. These numbers all feed expectations for a December hike.", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar", "stocks": [{"t": "TLT", "n": "長天期美債 ETF，非農與 CPI 的反應"}, {"t": "SPY", "n": "標普 500 ETF，數據對大盤的反應"}]},
