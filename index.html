<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "個股異動", "color": "#E05C5C", "zh": "週五個股的漲跌幅遠比指數精彩。巴西數位銀行 Nu Holdings 大漲近 12%，因為單季淨利首度突破 10 億美元；Reddit 跳升逾 10%，標普道瓊指數公司宣布它將於 8/18 開盤前納入標普 500；Sandisk 在投資人日端出長期財測後上漲 7%。反向的一端，軟體外包商 Globant 因第二季財報不如預期重挫 12.6%。", "en": "Single-stock moves on Friday far outpaced the indexes. Brazilian digital bank Nu Holdings surged almost 12% after posting its first quarter with net income above $1 billion. Reddit jumped more than 10% after S&P Dow Jones Indices said it will join the S&P 500 before the open on Aug 18. Sandisk gained 7% following a bullish long-term outlook at its investor day. On the other side, IT services firm Globant tumbled 12.6% on a disappointing second quarter.", "url": "https://seekingalpha.com/news/4633064-biggest-stock-movers-friday-amat-nu-and-more", "stocks": [{"t": "NU", "n": "巴西數位銀行，單季獲利首破 10 億美元，週五漲近 12%"}, {"t": "RDDT", "n": "8/18 開盤前納入標普 500，消息一出跳漲逾 10%"}, {"t": "SNDK", "n": "投資人日給出偏多長期財測，週五 +7%"}, {"t": "GLOB", "n": "第二季財報不如預期，單日重挫 12.6%"}]},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "原油與能源", "color": "#E05C5C", "zh": "這週真正的主角是原油。西德州原油（WTI）近月合約整週上漲約 4.3%，週五能源類股以 1.4% 的漲幅領先標普 500 的十一個類股。背後的結構性原因是荷姆茲海峽自今年 2 月底以來的封閉——這條水道原本運送全球約五分之一的原油，布蘭特原油 7 月 23 日一度衝上每桶 105 美元。年初至今 WTI 已上漲約 42%，這是今年美股最大的單一變數。", "en": "Crude was the real story of the week. Front-month WTI rose about 4.3% over the week, and on Friday energy led all eleven S&P 500 sectors with a 1.4% gain. The structural driver is the closure of the Strait of Hormuz since late February — a waterway that normally carries roughly one-fifth of the world's crude — with Brent touching $105 a barrel on July 23. WTI is up about 42% year to date, making it the single biggest variable in U.S. equities this year.", "url": "https://energynow.com/2026/08/sp-500-energy-sector-on-track-for-biggest-weekly-gain-since-october-2022/", "stocks": [{"t": "USO", "n": "原油 ETF，追蹤 WTI，本週約 +4.3%、今年以來約 +42%"}, {"t": "XOM", "n": "埃克森美孚，週五 +1.4%，是能源類股最大貢獻者之一"}, {"t": "CVX", "n": "雪佛龍，週五 +1.6%，同為指數權重貢獻主力"}]},
    {"id": "overnight_4", "channel": "隔夜盤勢", "tag": "盤勢結構", "color": "#E05C5C", "zh": "把三個數字放在一起看，這週的盤勢結構比漲跌本身更值得注意：道瓊跌、那斯達克幾乎不動、羅素 2000 卻在本週三度創下歷史新高。這代表資金不是在離場，而是在往下、往外跑——從大型權值股流向中小型與價值股。等權重的標普 500 表現優於市值加權版本，也指向同一件事：這波上漲的寬度變好了，但領頭羊換人了。", "en": "Put three numbers side by side and the structure of the week matters more than the direction: the Dow fell, the Nasdaq was nearly flat, yet the Russell 2000 set all-time highs three separate times. That is not money leaving the market — it is money moving down the cap scale and out of the megacap complex toward small caps and value. The equal-weight S&P 500 outperforming the cap-weighted version points to the same conclusion: breadth is improving, but leadership has changed hands.", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-14-2026", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，本週三度創歷史新高，是這波寬度擴散的主角"}, {"t": "RSP", "n": "等權重標普 500，表現優於市值加權版，反映漲勢不再靠少數權值股"}, {"t": "XLK", "n": "科技類股 ETF，本週相對落後，資金明顯從此處流出"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "半導體設備", "color": "#E8786A", "zh": "應用材料週四盤後交出創紀錄的會計年度第三季：營收 91.2 億美元、年增 25%，調整後每股盈餘 3.50 美元，雙雙超過市場預期的 89.9 億與 3.40 美元。公司同時把半導體系統事業的成長預期從「超過 20%」上修到「超過 30%」，下一季營收指引 102.5 億美元。但股價盤後仍跌 4.94% 至 508.15 美元——市場盯的是短期毛利率指引，不是這一季的數字。這是典型的「好消息不夠好」。", "en": "Applied Materials posted record fiscal Q3 results after Thursday's close: revenue of $9.12 billion, up 25% year over year, and adjusted EPS of $3.50, both ahead of the $8.99 billion and $3.40 consensus. Management also raised its semiconductor systems growth outlook from above 20% to above 30%, guiding next quarter to $10.25 billion. Yet the stock fell 4.94% after hours to $508.15 — investors focused on near-term margin guidance rather than the quarter itself. A textbook case of good news not being good enough.", "url": "https://www.globenewswire.com/news-release/2026/08/13/3344890/0/en/applied-materials-announces-third-quarter-2026-results.html", "stocks": [{"t": "AMAT", "n": "營收 91.2 億、調整後 EPS 3.50 均超預期，盤後仍跌 4.94%"}, {"t": "LRCX", "n": "同屬晶圓製造設備商，AMAT 上修設備支出展望對其為同向指標"}, {"t": "KLAC", "n": "檢測設備龍頭，設備資本支出週期的另一個觀察窗口"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "新興市場金融", "color": "#E8786A", "zh": "Nu Holdings 第二季淨利 10.61 億美元，是這家拉丁美洲數位銀行史上第一個十億美元獲利季，年增 49%。營收接近 58.8 億美元、以固定匯率計年增 39%，淨利差擴大 180 個基點到 22.9%，股東權益報酬率 33%。客戶數來到 1.389 億、年增 13%，其中 83.5% 是活躍用戶。對照美國本土的消費疲弱數據，這份財報提醒一件事：消費金融的景氣不是全球同步的。", "en": "Nu Holdings earned $1.061 billion in the second quarter — the first billion-dollar profit quarter in the Latin American digital bank's history, up 49% year over year. Revenue reached nearly $5.88 billion, up 39% on an FX-neutral basis, net interest margin expanded 180 basis points to 22.9%, and return on equity hit 33%. Customers reached 138.9 million, up 13%, with an 83.5% activity rate. Against soft U.S. consumer data, this is a reminder that consumer credit cycles are not globally synchronized.", "url": "https://international.nubank.com.br/company/nu-holdings-ltd-reports-second-quarter-2026-financial-results/", "stocks": [{"t": "NU", "n": "單季淨利 10.61 億美元、ROE 33%，客戶數 1.389 億"}, {"t": "MELI", "n": "拉美電商與金融科技，與 NU 共享同一批拉美消費者的信用循環"}, {"t": "STNE", "n": "巴西支付商，可對照觀察巴西中小商戶的付款與信貸狀況"}]},
    {"id": "earn_3", "channel": "財報速報", "tag": "財報季尾聲", "color": "#E8786A", "zh": "第二季財報季進入尾聲，市場的反應函數變得不對稱：財報好的不太漲，財報差的重跌。週五 Globant 因季報不如預期跌 12.6%，天然氣生產商 Range Resources 因區域供給過剩與分析師調降目標價跌 7.3%，公用事業與建材集團 MDU Resources 則因營收低於預期跌 6.3%。同一天應用材料明明超預期卻下挫近 5%——這種不對稱通常出現在市場已經把好消息定價完畢的階段。", "en": "As second-quarter earnings season winds down, the market's reaction function has turned asymmetric: beats barely move stocks, misses get punished. On Friday, Globant fell 12.6% on a weak quarter, natural gas producer Range Resources dropped 7.3% on regional supply gluts and analyst target cuts, and MDU Resources declined 6.3% after revenue came in light. The same day, Applied Materials beat on both lines and still fell nearly 5%. That asymmetry typically shows up once good news is already priced in.", "url": "https://seekingalpha.com/news/4633064-biggest-stock-movers-friday-amat-nu-and-more", "stocks": [{"t": "GLOB", "n": "第二季財報不如預期，週五跌 12.6%"}, {"t": "RRC", "n": "天然氣生產商，區域供給過剩加上目標價調降，跌 7.3%"}, {"t": "MDU", "n": "天然氣與電力集團，第二季營收低於市場預期，跌 6.3%"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "消費轉弱", "color": "#7C6AF7", "zh": "週五兩份數據同時指向美國消費者正在收手。七月零售銷售月減 0.6%，市場原本預期是增加 0.1%，這是九個月來首次下滑、也是一年多來最大跌幅，總額 7,636 億美元。同一天密西根大學八月消費者信心初值從七月的 55.2 崩到 51.0，跌幅約 8%，終結連續兩個月的回升。經濟學家已開始下調第三季的經濟成長預估。", "en": "Two data points on Friday pointed the same way: the U.S. consumer is pulling back. July retail sales fell 0.6% month over month against expectations for a 0.1% gain — the first decline in nine months and the steepest in over a year, totaling $763.6 billion. The same day, the University of Michigan's preliminary August consumer sentiment index collapsed to 51.0 from 55.2 in July, a roughly 8% drop that ended two months of gains. Economists have begun cutting third-quarter growth estimates.", "url": "https://www.washingtonpost.com/business/2026/08/14/july-retail-sales-notch-biggest-drop-more-than-year/", "stocks": [{"t": "XRT", "n": "零售類股 ETF，零售銷售 -0.6% 的第一線受衝擊標的"}, {"t": "AMZN", "n": "今年把 Prime Day 提前到六月，是七月零售數字失真的原因之一"}, {"t": "DG", "n": "折扣零售商，消費降級時通常是相對受惠的一端"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "升息之辯", "color": "#7C6AF7", "zh": "這輪利率辯論的方向和多數人的直覺相反：市場在爭論的是九月要不要「升息」，不是降息。聯準會 7 月 28-29 日會議按兵不動、維持 3.50% 至 3.75%，但表決是 9 票對 3 票，三位委員主張升息一碼。九月升息機率在七月底一度衝到八成上下，八月十二日偏冷的消費者物價指數出爐後明顯回落。主席是 Kevin Warsh，這是他上任後第一次面對這種兩面受夾的處境。", "en": "This rate debate runs opposite to most people's instincts: the argument is over whether to hike in September, not cut. The Fed held at 3.50%–3.75% on July 28–29, but the vote was 9–3, with three members dissenting in favor of a quarter-point hike. Odds of a September hike spiked to around 80% in late July before falling back after the cooler August 12 CPI print. Chair Kevin Warsh is facing his first genuinely two-sided policy bind since taking the job.", "url": "https://www.fool.com/investing/2026/08/12/odds-september-rate-hike-plunge-fed-job-challenge/", "stocks": [{"t": "TLT", "n": "20 年期以上美國公債 ETF，升息預期的直接對手方"}, {"t": "SHY", "n": "1-3 年期公債 ETF，最貼近聯準會政策利率的短端定價"}, {"t": "KRE", "n": "區域銀行 ETF，淨息差同時受短端政策與長端曲線影響"}]},
    {"id": "macro_3", "channel": "總經政策", "tag": "通膨拉扯", "color": "#7C6AF7", "zh": "聯準會現在面對的是一組互相打架的數據。七月消費者物價指數月增 0.1%、年增 3.4%（前值 3.5%），核心年增 2.5%，完全符合共識——通膨在降溫。但荷姆茲海峽仍然封閉，能源與運費成本居高不下，密大調查中民眾直接把信心下滑歸因於伊朗戰事推升的油價與食物價格。通膨在總量上緩解，在體感上沒有，這正是九月決策難產的核心。", "en": "The Fed is staring at data that contradicts itself. July CPI rose 0.1% month over month and 3.4% year over year (down from 3.5%), with core at 2.5% — fully in line with consensus, and cooling. But the Strait of Hormuz remains closed, keeping energy and freight costs elevated, and respondents in the Michigan survey explicitly blamed the Iran conflict's effect on fuel and food prices for their falling confidence. Inflation is easing in aggregate but not in lived experience — which is exactly why September is a hard call.", "url": "https://www.eia.gov/outlooks/steo/report/global_oil.php", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，反映市場對長期通膨的實際定價"}, {"t": "GLD", "n": "黃金 ETF，地緣風險與實質利率的雙重壓力計"}, {"t": "UUP", "n": "美元指數 ETF，升息預期與能源進口成本交錯作用的匯率端"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "能源獨強", "color": "#4EABA4", "zh": "標普 500 能源類股本週上漲約 7.3%，是 2022 年 10 月以來最強的一週，同時寫下連續 14 週上漲的紀錄。這不只是股價現象，獲利也真的跟上了：埃克森美孚第二季獲利年增一倍到 145 億美元，雪佛龍淨利年增接近 400%。能源類股今年以來漲約 38%，是全市場最強的一個板塊。反過來看，這也意味著整個市場的獲利成長有一塊建立在戰爭溢價上。", "en": "The S&P 500 energy sector rose about 7.3% this week — its strongest since October 2022 — and extended a record 14-week winning streak. This is not just a price phenomenon: ExxonMobil's second-quarter profit doubled year over year to $14.5 billion, and Chevron's net income rose close to 400%. Energy is up roughly 38% year to date, the strongest sector in the market. The flip side is that a meaningful slice of index-level earnings growth now rests on a war premium.", "url": "https://www.etftrends.com/sector-investing-content-hub/energy-sector-logs-record-14-week-winning-streak/", "stocks": [{"t": "XLE", "n": "能源類股 ETF，本週 +7.3%、連 14 週收紅創紀錄"}, {"t": "XOM", "n": "第二季獲利年增一倍至 145 億美元"}, {"t": "OXY", "n": "美國本土頁岩油商，對油價的每桶槓桿高於整合型油商"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "領導權外擴", "color": "#4EABA4", "zh": "2023 年以來由科技獨挑大樑的行情，正在把領導權讓出去。八月的資金明顯往能源、醫療、金融與工業擴散，而不是逃離股市。金融股受惠於交易與併購手續費——第二季主要銀行普遍優於預期，富國銀行的股票交易營收年增 64%。醫療類股則在落後一年多之後開始出現相對強度改善。這比較像是健康的再平衡，不是恐慌性換股。", "en": "The tech-only leadership that has dominated since 2023 is handing over the baton. August flows have spread into energy, healthcare, financials, and industrials rather than out of equities altogether. Financials are benefiting from trading and deal fees — major banks broadly beat in the second quarter, with Wells Fargo's equities trading revenue up 64%. Healthcare, after lagging for more than a year, is finally showing improving relative strength. This looks more like healthy rebalancing than a panic rotation.", "url": "https://www.vaneck.com/us/en/blogs/thematic-investing/the-state-of-us-sector-investing-in-mid-2026/", "stocks": [{"t": "XLF", "n": "金融類股 ETF，交易與併購手續費是本季主要驅動"}, {"t": "XLV", "n": "醫療類股 ETF，落後逾一年後相對強度開始改善"}, {"t": "XLI", "n": "工業類股 ETF，與小型股同步受惠於領導權外擴"}]},
    {"id": "sector_3", "channel": "產業風向", "tag": "AI 外溢", "color": "#4EABA4", "zh": "AI 的資本支出正在從大型晶片商往供應鏈的下游與邊緣外溢。應用材料把半導體系統成長預期上修到「超過 30%」，代表設備端的訂單還在加速。更值得注意的是小公司：功率半導體商 Alpha and Omega Semiconductor 的先進運算營收單季環比大增 35%，佔運算部門比重來到 31% 的歷史新高。當 AI 的受惠名單從三五家擴散到三五十家，選股的難度反而上升，因為「沾邊」和「真受惠」開始難以分辨。", "en": "AI capital spending is spilling from the large chipmakers down into the supply chain's edges. Applied Materials raised its semiconductor systems growth outlook to above 30%, signaling equipment orders are still accelerating. More telling is what is happening at the small end: power-semiconductor maker Alpha and Omega Semiconductor saw advanced computing revenue jump 35% sequentially, hitting a record 31% of its computing segment. As the beneficiary list widens from a handful of names to dozens, stock picking gets harder, not easier — adjacency and genuine exposure start to blur.", "url": "https://www.tradingkey.com/news/earnings/262100440-tradingkey", "stocks": [{"t": "SOXX", "n": "半導體類股 ETF，觀察 AI 資本支出擴散的整體溫度計"}, {"t": "AMAT", "n": "半導體系統成長預期上修至超過 30%，設備端訂單仍在加速"}, {"t": "AOSL", "n": "功率半導體小型股，先進運算營收季增 35%、佔比創 31% 新高"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "羅素創高", "color": "#5B8ED6", "zh": "羅素 2000 指數 8 月 13 日站上 3,060 點、創下歷史新高，並且在這一週內三度刷新紀錄。今年以來它上漲約 23%，領先那斯達克 100 的 19% 與標普 500 的 11%，是 2003 年以來最強的一年。更誇張的對比是所謂的「七雄」大型科技股今年只漲了約 4%。小型股從被遺忘的角落走回舞台中央，用了整整兩年。", "en": "The Russell 2000 closed above 3,060 on August 13 for a record high, and set new records three separate times during the week. It is up roughly 23% year to date, ahead of the Nasdaq 100's 19% and the S&P 500's 11% — its strongest year since 2003. The starker comparison: the Magnificent 7 megacap group is up only about 4% this year. Small caps have taken two full years to walk back from the forgotten corner to center stage.", "url": "https://www.benzinga.com/etfs/specialty-etfs/26/08/61181756/quick-spark-russell-2000-hits-new-record-highs-beats-nasdaq-100-in-2026", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，8/13 創高破 3,060，年初至今約 +23%"}, {"t": "IJR", "n": "標普小型股 600 ETF，成分股獲利門檻較高，可對照觀察品質差異"}, {"t": "VTWO", "n": "Vanguard 羅素 2000 ETF，費用率更低的同指數選項"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "品質分歧", "color": "#5B8ED6", "zh": "小型股上漲的內部結構有一個令人不安的細節：羅素 2000 裡「沒有獲利」的公司自 2025 年年中以來大漲 154%，而真正有獲利的公司只上漲 34%。差距接近五倍。領漲的主要是被認為將受惠於 AI 基礎建設支出的科技與基建類公司，市場現在獎勵的是「AI 曝險」，不是「今年賺多少錢」。這種結構在多頭中後段很常見，但它同時也是回檔時跌最兇的那一群。", "en": "There is an uncomfortable detail inside the small-cap rally: unprofitable Russell 2000 companies have surged 154% since mid-2025, while profitable ones are up just 34% — nearly a fivefold gap. The leaders are mostly technology and infrastructure names seen as beneficiaries of AI capital spending. The market is currently rewarding AI exposure rather than current earnings. That structure is common in the later stages of a bull market, and it is also the cohort that falls hardest in a drawdown.", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html", "stocks": [{"t": "IWO", "n": "羅素 2000 成長股 ETF，未獲利公司權重最集中之處"}, {"t": "XBI", "n": "生技 ETF，成分股大量未獲利，是這個現象的極端樣本"}, {"t": "ARKK", "n": "以未獲利成長股為主的主動式 ETF，可視為風險偏好溫度計"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "折價的兩面", "color": "#5B8ED6", "zh": "即使漲了 23%，羅素 2000 的主要 ETF 本益比仍較大型股折價約 34.5%，這是多頭最常引用的數字。但折價要拆開看：小型股指數本來就含有大量虧損公司，本益比在分母被稀釋的情況下失真。真正該問的不是「折價多少」，而是「折價的是哪一群」。若把未獲利公司剔除後折價大幅收斂，那麼所謂便宜其實只存在於統計上，不存在於你能買到的公司裡。", "en": "Even after a 23% run, the main Russell 2000 ETF still trades at roughly a 34.5% earnings-multiple discount to large caps — the number bulls quote most often. But the discount deserves unpacking: the small-cap index contains a large share of loss-making companies, which distorts the P/E denominator. The better question is not how big the discount is, but which cohort it applies to. If the discount collapses once unprofitable names are stripped out, then the cheapness exists in the statistics rather than in any company you can actually buy.", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/", "stocks": [{"t": "IWN", "n": "羅素 2000 價值股 ETF，剔除高成長後的估值對照組"}, {"t": "IWO", "n": "羅素 2000 成長股 ETF，與價值版並列可看出折價來自哪一端"}, {"t": "SPY", "n": "大型股基準，折價 34.5% 的比較對象"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "利率的隱形帳單", "color": "#5B8ED6", "zh": "這是小型股投資最容易被忽略的一條線：羅素 2000 成分公司大量使用浮動利率債務，這代表如果聯準會九月真的升息，利息支出會在下一季直接進損益表，不需要等到債券到期再融資。大型股多半在低利率時期就把長天期固定利率債鎖好了，小公司沒有這個籌碼。高盛已警告這波小型股動能將消退，理由正是 AI 題材燃料減弱加上聯準會可能轉鷹。看小型股不能只看估值，要先看資產負債表的利率結構。", "en": "This is the line small-cap investors most often miss: Russell 2000 constituents carry a large amount of floating-rate debt, meaning that if the Fed does hike in September, interest expense flows straight into next quarter's income statement — no need to wait for maturities and refinancing. Large caps mostly locked in long-dated fixed-rate debt during the low-rate era; smaller companies did not have that option. Goldman Sachs has warned the small-cap rally will fade, citing exactly this combination of waning AI fuel and a more hawkish Fed. Valuation is not the first thing to check here — the interest-rate structure of the balance sheet is.", "url": "https://www.aol.com/articles/goldman-sachs-warns-blistering-rally-154958900.html", "stocks": [{"t": "IJR", "n": "標普小型股 600 ETF，成分股需通過獲利門檻，槓桿體質相對可控"}, {"t": "KRE", "n": "區域銀行 ETF，同時是小型股放款者也是利率受害者，雙重觀察點"}, {"t": "HYG", "n": "高收益債 ETF，小型股信用壓力最早浮現的地方"}]},
    {"id": "small_5", "channel": "小型股風雲", "tag": "指數納入的機制", "color": "#5B8ED6", "zh": "Reddit 將在 8 月 18 日開盤前納入標普 500，取代被 Equity Residential 併購的公寓不動產信託 AvalonBay，消息一出盤後跳漲 12.6%。這是一次「非定期」的成分股調整，觸發原因是併購案而非季度審核。值得學起來的機制是：所有追蹤標普 500 的被動基金必須在生效日買進，這種強制買盤會製造短期的價格扭曲，而扭曲通常在納入後數週回吐。看到指數納入而追價，買的是流動性事件，不是公司。", "en": "Reddit joins the S&P 500 before the open on August 18, replacing AvalonBay Communities, the apartment REIT being acquired by Equity Residential. The stock jumped 12.6% after hours on the news. This is an off-cycle index change triggered by an acquisition rather than a quarterly review. The mechanism worth internalizing: every passive fund tracking the S&P 500 must buy on the effective date, and that forced demand creates a short-term price distortion which typically unwinds over the following weeks. Chasing an index add means buying a liquidity event, not a company.", "url": "https://www.forbes.com/sites/tylerroush/2026/08/14/reddit-joins-the-sp-500-next-week-heres-what-that-means-for-shares/", "stocks": [{"t": "RDDT", "n": "8/18 開盤前納入標普 500，成為第二檔純社群媒體成分股"}, {"t": "AVB", "n": "被剔除的公寓 REIT，因遭 EQR 併購而退出指數"}, {"t": "EQR", "n": "併購 AVB 的一方，這樁交易是本次成分調整的觸發原因"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "功率半導體", "color": "#C9A227", "zh": "Alpha and Omega Semiconductor 做的是功率半導體——電源管理與電壓轉換的晶片，不是運算晶片，所以在 AI 敘事裡幾乎沒有聲量。市值約 10.9 億美元，只有四位分析師覆蓋，這是典型的雙重忽視。正在改變的是產品組合：會計年度第四季營收 1.704 億美元（年減 3.5%、但季增 4.0%），先進運算營收季增 35%、佔運算部門 31% 創新高，同時在為一家美國一線手機客戶量產；非 GAAP 每股虧損 0.13 美元，優於預估的虧 0.28 美元。風險很實在：這家公司仍在虧損，GAAP 毛利率只有 23.1%，且財報後股價盤後下跌。這是研究線索，不是投資建議。", "en": "Alpha and Omega Semiconductor makes power semiconductors — power management and voltage conversion chips, not compute silicon — which is why it barely registers in the AI narrative. With a market cap around $1.09 billion and only four analysts covering it, this is textbook double neglect. What is changing is the mix: fiscal Q4 revenue of $170.4 million (down 3.5% year over year but up 4.0% sequentially), advanced computing revenue up 35% sequentially to a record 31% of the computing segment, alongside a ramp for a Tier 1 U.S. smartphone customer. Non-GAAP loss per share of $0.13 beat the $0.28 loss consensus. The risks are real: the company is still losing money, GAAP gross margin is only 23.1%, and the stock fell after hours on the print. A research lead, not investment advice.", "url": "https://www.tradingkey.com/news/earnings/262100440-tradingkey", "status": "RADAR · 下一個驗證點 FQ1 財報（約 2026/11），指引營收 1.76 億", "stocks": [{"t": "AOSL", "n": "市值約 10.9 億、僅 4 位分析師覆蓋；先進運算季增 35%，但仍非 GAAP 虧損"}, {"t": "ON", "n": "同為功率半導體同業，規模大得多，可作為毛利率與週期位置的對照"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "特殊 REIT", "color": "#C9A227", "zh": "Innovative Industrial Properties 是專做大麻種植廠房的不動產信託，因為承租產業敏感、機構覆蓋稀薄，長期處在輿論與研究的雙盲區。第二季每股盈餘 1.36 美元，遠超市場預估的 1.05 美元（+29.5%），但營收 6,332 萬美元低於預估的 6,751 萬，且較第一季的 6,900 萬下滑——原因是違約租戶付款減少。公司同時完成 146.8 萬股、8,896 萬美元的庫藏股，並用 1.5 億美元擔保貸款與 4.025 億美元可交換債償還 2.91 億美元到期債務。股價距 52 週低點 44.58 美元約高 32%。反方論點很清楚：獲利超標來自成本與股數減少，營收端的租戶違約還沒止血。這是研究線索，不是投資建議。", "en": "Innovative Industrial Properties is a REIT specializing in cannabis cultivation facilities — a tenant base sensitive enough, and coverage thin enough, that it sits in a double blind spot of both media and research. Second-quarter EPS of $1.36 beat the $1.05 consensus by 29.5%, but revenue of $63.32 million missed the $67.51 million estimate and fell from $69 million in Q1, driven by reduced payments from defaulting tenants. The company completed a buyback of 1,468,542 shares for $88.96 million, and used $150 million in secured term loans plus a $402.5 million exchangeable notes offering to repay a $291 million maturity. Shares sit about 32% above the $44.58 52-week low. The bear case is plain: the earnings beat came from costs and a smaller share count, while tenant defaults on the revenue line have not stopped. A research lead, not investment advice.", "url": "https://www.stocktitan.net/news/IIPR/innovative-industrial-properties-reports-second-quarter-2026-f8c8cr2afhlt.html", "status": "RADAR · 下一個驗證點 Q3 財報（約 2026/11），看營收能否止跌", "stocks": [{"t": "IIPR", "n": "Q2 EPS 1.36 超預期 29.5%，但營收 6,332 萬較上季 6,900 萬下滑"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "微型油氣", "color": "#C9A227", "zh": "Amplify Energy 是一家微型油氣生產商，在能源類股連漲 14 週的行情裡幾乎沒有被提及。8 月 6 日董事會授權最高 1,500 萬美元的庫藏股，以近期股價計約等於流通在外股數的 10%，8 月 11 日開始執行、到年底為止——這種規模的比例在小公司裡是強烈訊號。但財務面必須誠實看：今年上半年營收 9,020 萬美元（去年同期 1.404 億），淨損 2,080 萬美元，其中 3,680 萬來自商品衍生品損失；營運現金流從 4,920 萬掉到 730 萬，投入油氣資產 4,220 萬，帳上現金只剩 2,120 萬美元。用剩下的現金去買自家股票，是管理層的信心，也是流動性的賭注。這是研究線索，不是投資建議。", "en": "Amplify Energy is a micro-cap oil and gas producer that has gone almost entirely unmentioned during energy's 14-week winning streak. On August 6 the board authorized up to $15 million of share repurchases — roughly 10% of shares outstanding at recent prices — running from August 11 through year end. A ratio that large is a strong signal at a company this size. But the financials deserve an honest read: first-half revenue of $90.2 million (versus $140.4 million a year earlier) and a net loss of $20.8 million, including a $36.8 million loss on commodity derivatives. Operating cash flow fell from $49.2 million to $7.3 million, capital spending on oil and gas properties was $42.2 million, and cash stands at just $21.2 million. Spending remaining cash on your own stock is management conviction — and a liquidity bet. A research lead, not investment advice.", "url": "https://www.globenewswire.com/news-release/2026/08/10/3342248/18120/en/amplify-energy-announces-second-quarter-2026-results-and-approval-of-share-repurchase-program.html", "status": "RADAR · 下一個驗證點 12/31 前庫藏股實際執行股數與均價", "stocks": [{"t": "AMPY", "n": "1,500 萬美元庫藏股約當 10% 流通股，但帳上現金僅剩 2,120 萬"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "zh": "池內名單 Anika Therapeutics（8/8 入池）有新的驗證材料。這家市值約 5.8 億美元的小型醫材公司做的是玻尿酸相關產品，第二季營收 3,261 萬美元、淨利 331 萬美元，從先前的虧損轉正。公司自 2024 年 5 月起已買回 210 萬股、金額 3,039 萬美元，而且在 6 月遭數個指數剔除、承受被動賣壓之後，仍上修了 2026 會計年度的營收財測，並預期 2027 年溫和成長。反方論點不變：這仍是一家有虧損歷史的公司，兩個獲利季不足以宣告轉折完成。這是研究線索，不是投資建議。", "en": "Pool name Anika Therapeutics (added Aug 8) has fresh evidence to test. The roughly $580 million medical technology company, built around hyaluronic acid science, posted second-quarter revenue of $32.61 million and net income of $3.31 million, swinging from prior losses. It has repurchased 2.1 million shares for $30.39 million since May 2024, and after being dropped from several indices in June — absorbing the resulting passive selling — it still raised fiscal 2026 revenue guidance and guided to modest growth in 2027. The bear case is unchanged: this is a company with a history of losses, and two profitable quarters do not confirm an inflection. A research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/consumer-durables/nyse-etd/ethan-allen-interiors/news/undervalued-small-caps-with-insider-activity-to-consider-in-9", "status": "RADAR · 下一個驗證點 Q3 財報（約 2026/11），看 65% 毛利率能否守住", "stocks": [{"t": "ANIK", "n": "Q2 營收 3,261 萬、淨利 331 萬轉正；6 月遭指數剔除後仍上修財測"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "zh": "Movado Group 是雷達池最早的成員（7/22 入池），本週財報日就要到了，但日期資訊出現分歧：先前記錄為 8 月 20 日，最新公開資料則顯示 8 月 27 日，以公司正式公告為準。另有一項需要修正的認知：Kate Spade New York 全球授權自 7 月 1 日生效、效期到 2030 年 6 月 30 日，但第一個系列要到 2027 年春季才上市——也就是說這一季的財報看不到任何 Kate Spade 貢獻，把它當成本季催化劑是搞錯了時間軸。Northland 已把目標價自 35 美元上調至 50 美元。這是研究線索，不是投資建議。", "en": "Movado Group is the radar pool's oldest entry (added July 22) and its earnings date falls in this window — but the date is in dispute: previously logged as August 20, while the latest public sources show August 27. The company's own announcement is the authority. One correction to the thesis is also needed: the global Kate Spade New York license took effect July 1 and runs through June 30, 2030, but the first collection does not arrive until spring 2027. That means this quarter's report will show no Kate Spade contribution at all — treating it as a near-term catalyst gets the timeline wrong. Northland has raised its price target to $50 from $35. A research lead, not investment advice.", "url": "https://www.wallstreetzen.com/stocks/us/nyse/mov/earnings", "status": "RADAR · 下一個驗證點 8/20 或 8/27 財報（日期待公司確認）", "stocks": [{"t": "MOV", "n": "財報日 8/20 與 8/27 兩種說法並存；Kate Spade 首個系列要到 2027 春季"}]},
    {"id": "radar_6", "channel": "忽視雷達", "tag": "方法論", "color": "#C9A227", "zh": "今天出現了一個值得記下來的模式：被動剔除本身就是忽視的製造機。Anika 在 6 月被數個指數剔除，池內的 Value Line 也遇到同樣的事。指數剔除會製造兩件事——一是被迫的被動賣壓，把股價往下壓；二是研究覆蓋的真空，因為指數成分股才會被例行追蹤。這兩件事同時發生時，價格下跌與資訊減少會互相加強，形成「沒人看所以更便宜、更便宜所以更沒人看」的循環。找雙重忽視標的時，指數剔除公告是一個高效率的起點。這是研究方法，不是投資建議。", "en": "A pattern worth recording surfaced today: passive deletion is itself a neglect factory. Anika was dropped from several indices in June, and pool name Value Line hit the same thing. An index deletion produces two effects — forced passive selling that pushes the price down, and a vacuum in research coverage, since index membership is what drives routine analyst attention. When both happen at once, falling prices and thinning information reinforce each other into a loop: nobody watches it so it gets cheaper, and it gets cheaper so nobody watches it. When hunting double-neglect names, index deletion announcements are an efficient place to start. A research method, not investment advice.", "url": "https://simplywall.st/stocks/us/diversified-financials/nasdaq-valu/value-line/news/undervalued-small-caps-with-insider-action-in-august-2026", "status": "RADAR · 方法卡 · 下一步：整理近三個月指數剔除名單交叉比對池內標的", "stocks": [{"t": "VALU", "n": "池內名單，6 月指數剔除造成的被動賣壓仍是待驗證項目"}, {"t": "ANIK", "n": "6 月遭多個指數剔除，卻在同期上修財測，是本模式的正面樣本"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "波克夏 13F", "color": "#6DB56D", "zh": "8 月 14 日是第二季 13F 申報截止日，波克夏海瑟威的持股表揭曉：執行長 Greg Abel 在第二季淨買入 198 億美元的股票，是三年半來最大的一次買方轉向。加碼標的包括 Alphabet、達美航空、建商 Lennar、梅西百貨與紐約時報；減碼的則有美國銀行、DaVita、Kroger、Ally Financial 與 Capital One。整體 29 檔持股、總市值 2,990 億美元，前五大部位約佔七成二。從買賣名單看，這是一次從金融往消費、媒體與住宅的移動。", "en": "August 14 was the second-quarter 13F deadline, and Berkshire Hathaway's holdings are out: CEO Greg Abel put a net $19.8 billion into equities during the quarter, the largest swing to net buying in three and a half years. Additions included Alphabet, Delta Air Lines, homebuilder Lennar, Macy's, and The New York Times; trims included Bank of America, DaVita, Kroger, Ally Financial, and Capital One. The portfolio holds 29 positions worth $299 billion, with the top five making up roughly 72%. Read as a whole, it is a shift out of financials and into consumer, media, and housing.", "url": "https://13f.info/13f/000119312526352200-berkshire-hathaway-inc-q2-2026", "stocks": [{"t": "BRK.B", "n": "第二季淨買入 198 億美元，3.5 年來最大的買方轉向"}, {"t": "GOOGL", "n": "本季加碼標的之一，波克夏在科技股的少數持股"}, {"t": "M", "n": "梅西百貨，在消費數據轉弱之際被加碼，是本次最反直覺的一筆"}, {"t": "NYT", "n": "紐約時報，同屬本季新增部位，指向媒體訂閱模式"}]},

    {"id": "insider_3", "channel": "內部人動向", "tag": "判讀提醒", "color": "#6DB56D", "zh": "13F 季報季一到，各種「跟著大戶買」的內容就會冒出來，但這份文件有三個結構性盲點必須先知道。第一，它有 45 天的延遲，你看到的是 6 月 30 日的持股，這期間股價可能已經走完一大段。第二，它只揭露美國掛牌的多頭部位，不含債券、海外持股、現金與放空部位——所以你看到的從來不是完整的資產配置。第三，它不區分主動決策與被動變動，指數型持股或併購換股都會出現在增減欄裡。13F 適合用來找研究起點，不適合用來抄作業。", "en": "13F season always brings a wave of \"follow the smart money\" content, but the filing has three structural blind spots worth knowing first. One: a 45-day lag — you are seeing holdings as of June 30, and much of the price move may already have happened. Two: it discloses only long positions in U.S.-listed securities, excluding bonds, foreign holdings, cash, and shorts — so you are never seeing the full asset allocation. Three: it does not distinguish active decisions from passive changes; index positions and merger share exchanges show up in the same add-and-trim columns. 13Fs are a good place to start research and a poor place to copy homework.", "url": "https://www.sec.gov/Archives/edgar/data/0001067983-berkshire-hathaway-inc", "stocks": [{"t": "BRK.B", "n": "持股表揭露的是 6/30 狀態，公布日已是 8/14，延遲 45 天"}, {"t": "DAL", "n": "本季被加碼的達美航空，是否為主動加碼需看後續申報才能確認"}, {"t": "ARKK", "n": "主動式 ETF 每日揭露持股，可對照 13F 的季度延遲有多不利"}]},

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {

  const abortRef = React.useRef(null);

    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {

      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);

    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />

        </div>

      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>

  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/16/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v7.7</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
