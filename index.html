<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
  const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "壞消息大漲", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普500 ETF，對照指數 +0.62% 收 7,757.64 創收盤新高"}, {"t": "QQQ", "n": "那斯達克100 ETF，那指 +1.3% 收 26,690.62，單週漲 5.2%"}, {"t": "DIA", "n": "道瓊 ETF，道瓊 +151.83 點(+0.28%)收 54,036.93"}], "en": "Friday delivered the cleanest example of bad news being good news you will see this year. The July employment report showed the US economy lost 23,000 jobs against forecasts of an 80,000 to 85,000 gain — and stocks went straight up. The S&P 500 rose 0.62% to a record close of 7,757.64, the Nasdaq climbed 1.3% to 26,690.62 and the Dow added 151.83 points, or 0.28%, to 54,036.93. For the week the S&P gained 3.6%, its strongest since April, the Nasdaq 5.2% and the Dow nearly 3%. The logic is not complicated: a labour market this soft removes the case for a September rate hike, and this market has been trading interest rates, not earnings, for weeks.", "zh": "週五出現了今年最乾淨的一次「壞消息就是好消息」。7 月就業報告顯示美國經濟減少 23,000 個工作，而市場原本預期是增加 8 萬到 8.5 萬——股市直接往上噴。標普 500 漲 0.62% 收在 7,757.64 的收盤新高，那斯達克漲 1.3% 收 26,690.62，道瓊漲 151.83 點(0.28%)收 54,036.93。全週標普漲 3.6% 是 4 月以來最強的一週，那斯達克漲 5.2%，道瓊漲近 3%。邏輯並不複雜:勞動市場軟到這個程度，9 月升息的理由就沒了，而這個市場已經連續幾週在交易利率、不是在交易獲利。", "url": "https://www.cnbc.com/2026/08/06/stock-market-today-live-updates.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "拆開來看", "color": "#E05C5C", "stocks": [{"t": "XRT", "n": "零售 ETF，7 月零售就業是拖累非農的疲軟項目之一"}, {"t": "XLV", "n": "醫療類股，醫療業雇用成長低於往常水準，也是這次的減項"}, {"t": "MAR", "n": "萬豪國際，休閒餐旅是另一個被點名走弱的雇用來源"}], "en": "Open up the minus 23,000 before you trade it. The single biggest contributor was a loss of 53,000 government jobs, which economists say was largely seasonal distortion that could get revised away. Private payrolls actually rose 30,000. The soft spots underneath were retail, leisure and hospitality, plus healthcare hiring growing more slowly than usual. The unemployment rate ticked down to 4.1% from an expected 4.2%, but for the wrong reason — fewer people were holding jobs or looking for them. So the honest description is not that the economy shed jobs; it is that the government payroll count fell hard, private hiring nearly stalled, and people quietly left the labour force.", "zh": "在拿這個數字做決定之前，先把它拆開。減少最多的單一項目是政府部門的 53,000 個職位，而經濟學家認為這多半是季節性的統計失真、日後可能被修正掉;民間就業其實是增加 30,000 人。底下真正疲軟的地方是零售、休閒餐旅，以及醫療業的雇用成長低於往常水準。失業率從預期的 4.2% 降到 4.1%，但降的理由不好——是有工作或在找工作的人變少了。所以誠實的說法不是「經濟在裁員」，而是「政府就業數字大減、民間雇用幾乎停住、而且有人默默退出勞動市場」。", "url": "https://www.cnbc.com/2026/08/07/here-are-three-key-takeaways-from-the-disappointing-july-jobs-report.html"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "黃金最強週", "color": "#E05C5C", "stocks": [{"t": "GLD", "n": "黃金 ETF，現貨黃金週五漲 2.4% 至每盎司 4,347.70 美元、七週新高"}, {"t": "GDX", "n": "金礦股 ETF，金價單週漲約 7.5% 是七個月來最強的一週"}, {"t": "UUP", "n": "美元指數 ETF，美元指數跌到 99.5，自近期高點 101 一路走弱"}], "en": "The largest move on Friday was not in equities. Gold rose 2.4% to $4,347.70 an ounce, a seven-week high, capping a weekly gain of about 7.5% — its strongest week in seven months. The dollar index slid to 99.5 from a recent 101. Both are the same trade expressed twice: if the Fed is not hiking, the opportunity cost of holding an asset that pays no interest falls, and the currency loses one of its supports. What is worth noting is what did not join in — bitcoin sat near $64,940 and barely moved, despite lower yields, a weaker dollar and a risk-on session. When gold and bitcoin stop moving together, the phrase digital gold is doing less work than people assume.", "zh": "週五漲最兇的不是股票。現貨黃金漲 2.4% 至每盎司 4,347.70 美元、創七週新高，單週累計漲約 7.5%，是七個月來最強的一週;美元指數則從近期的 101 一路滑到 99.5。這兩件事其實是同一筆交易的兩種說法:Fed 如果不升息，持有不孳息資產的機會成本就下降，而美元也少掉一個支撐。值得記下來的是誰沒有跟上——比特幣停在 64,940 美元附近幾乎沒動，即使殖利率下降、美元走弱、市場明顯在冒險。當黃金與比特幣不再一起動，「數位黃金」這個說法就沒有大家以為的那麼有效。", "url": "https://www.benzinga.com/markets/equities/26/08/61055145/jobs-fall-stocks-records-gold-what-moved-markets-august-7-2026"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "荷莫茲反轉", "color": "#E05C5C", "stocks": [{"t": "XLE", "n": "能源類股，單日上漲 1.48%，是當天最強的類股"}, {"t": "USO", "n": "原油 ETF，西德州原油站上 78.05 美元、布蘭特站上 83.46 美元"}, {"t": "XOP", "n": "油氣探勘與生產 ETF，同日上漲 1.13%"}], "en": "Oil went the other way from the rate story. Reports that Iran plans to bar US and Israeli vessels from the Strait of Hormuz drained what was left of the optimism around a reopening deal, and crude extended its gains — Brent added 1.18% to $83.46 and WTI 0.98% to $78.05. Energy was the strongest sector of the day, up 1.48%, with oil and gas exploration up 1.13%. Hold on to the awkward part: the equity market rallied on the expectation that inflation pressure is easing, while the single most direct input into headline inflation went up at the same time. Both of those cannot keep being true for long.", "zh": "油價走的是跟利率完全相反的方向。有報導指伊朗計畫禁止美國與以色列船隻通過荷莫茲海峽，把重啟協議僅存的樂觀也抽乾，原油因此續漲——布蘭特漲 1.18% 至 83.46 美元，西德州原油漲 0.98% 至 78.05 美元。能源是當天最強的類股、上漲 1.48%，油氣探勘與生產也漲 1.13%。要留著這個彆扭的地方:股市是因為「通膨壓力在減輕」而大漲，但同一天，最直接推升整體通膨的那個輸入項卻在上漲。這兩件事沒辦法同時成立太久。", "url": "https://finance.yahoo.com/energy/articles/oil-extends-gains-stocks-fall-024841858.html"},
    {"id": "earn_0", "channel": "財報速報", "tag": "TEAM噴32%", "color": "#E8786A", "stocks": [{"t": "TEAM", "n": "Atlassian，調整後每股盈餘 1.87 美元遠優於預期 1.50，營收 17.7 億年增 28%，單日漲 32.38%"}], "en": "Atlassian rose 32.38% on Friday after a quarter that beat on every line: adjusted EPS of $1.87 against a $1.50 consensus, revenue of $1.77 billion versus $1.66 billion expected and up 28% year over year, with cloud revenue accelerating 31% to $1.21 billion. Guidance for the coming quarter of $1.705 to $1.715 billion also topped the roughly $1.67 billion street view. The detail worth keeping is what it is shipping: AI-native Jira features including a Jira Coding Agent, plus integrations with Claude Code, Cursor and GitHub Copilot, all at no extra cost to paid Jira Cloud customers. That is the opposite bet from charging for AI as an add-on — it uses AI to defend the seat rather than to sell a new one.", "zh": "Atlassian 週五大漲 32.38%，因為這一季每一條線都超標:調整後每股盈餘 1.87 美元遠優於預期的 1.50，營收 17.7 億美元高於預估的 16.6 億、年增 28%，雲端營收更加速到年增 31% 的 12.1 億。下一季指引 17.05 至 17.15 億美元，也高於市場約 16.7 億的看法。值得記住的細節是它出了什麼貨:內建 AI 的 Jira 功能，包含 Jira Coding Agent，以及與 Claude Code、Cursor、GitHub Copilot 的整合，而且對付費的 Jira Cloud 客戶完全不加價。這跟「把 AI 當加購項目收錢」是相反的賭注——它用 AI 來守住既有席次，而不是拿來多賣一份。", "url": "https://ts2.tech/en/atlassian-nasdaqteam-surges-35-in-after-hours-as-cloud-revenue-lifts-results-despite-data-center-slowdown/"},
    {"id": "earn_1", "channel": "財報速報", "tag": "DOCS噴81%", "color": "#E8786A", "stocks": [{"t": "DOCS", "n": "Doximity，盤前一度自 20.66 美元跳到 35.10 美元(+70%)，終場漲約 81%"}], "en": "Doximity, a workflow platform for physicians, jumped roughly 81% on Friday — the stock was already up about 70% before the open, moving from $20.66 to $35.10. The quarter beat on revenue and the company raised its full-year sales outlook, lifting the revenue midpoint by $6 million while trimming the adjusted earnings midpoint. That combination is the whole story: it is spending into an AI Search product whose first cohort of customers covers more than 24 programs. A move of this size on numbers this modest tells you the market had priced almost no option value into the AI line. Note the shape though — guidance up on revenue, down on profit — because that is exactly the trade software companies were punished for two days earlier.", "zh": "醫師工作流程平台 Doximity 週五大漲約 81%，開盤前就已經從 20.66 美元跳到 35.10 美元、漲約 70%。這一季營收超標，公司並上修全年銷售展望，把營收中位數調高 600 萬美元，同時把調整後獲利的中位數往下調。這個組合就是整則故事:它正在為 AI 搜尋產品增加投入，而該產品第一批客戶涵蓋超過 24 個方案。用這麼溫和的數字換到這種漲幅，代表市場先前幾乎沒有給它的 AI 業務任何想像空間。但要注意這個形狀——營收指引上修、獲利指引下修——因為這正是兩天前軟體股被重罰的那筆交易。", "url": "https://ts2.tech/en/doximity-nysedocs-surges-70-before-market-open-as-investors-factor-in-ai-search-revenue-shift/"},
    {"id": "earn_2", "channel": "財報速報", "tag": "AI流量過半", "color": "#E8786A", "stocks": [{"t": "NET", "n": "Cloudflare，營收 6.961 億美元年增 36% 超預期，股價一度跳升 17.41% 至 333.95 美元"}], "en": "Cloudflare reported revenue of $696.1 million, up 36% and well above the $664.7 million expected, with adjusted EPS of $0.29 against $0.27. It ended the quarter with 4,698 customers paying more than $100,000 a year, up 27%, including a record 986 net additions. Guidance was raised: $736 to $737 million for the third quarter and $2.864 to $2.870 billion for the full year, about 32% growth. The stock jumped 17.41% to $333.95 and price targets moved to $389. The number that will matter for years is buried in the release: automated traffic generated by AI agents passed 50% of its total network volume for the first time. On one of the internet's largest networks, more than half the traffic is no longer serving people — it is machines calling machines.", "zh": "Cloudflare 公布營收 6.961 億美元、年增 36%，遠高於預估的 6.647 億，調整後每股盈餘 0.29 美元優於 0.27。年付超過 10 萬美元的客戶達 4,698 家、年增 27%，單季淨增 986 家創新高。指引同步上修:第三季 7.36 至 7.37 億美元，全年 28.64 至 28.70 億美元、約年增 32%。股價一度跳升 17.41% 至 333.95 美元，目標價被調到 389 美元。但真正會影響往後幾年的數字藏在新聞稿裡:由 AI 代理程式產生的自動化流量，首次超過它整體網路流量的一半。全世界最大的網路之一，現在有超過一半的流量服務的不是人，而是機器在呼叫機器。", "url": "https://www.stocktitan.net/news/NET/cloudflare-announces-second-quarter-2026-financial-6hawe1aj0b2k.html"},
    {"id": "macro_0", "channel": "總經政策", "tag": "55%到40%", "color": "#7C6AF7", "stocks": [{"t": "SHY", "n": "1-3 年期公債 ETF，兩年期殖利率盤中一度跌 9 個基點至 4.15%、收在 4.19% 附近"}, {"t": "TLT", "n": "20 年以上公債 ETF，長端是這次定價翻轉的第二受惠者"}, {"t": "IEF", "n": "7-10 年公債 ETF，十年期殖利率收在 4.654%、小跌逾 1 個基點"}], "en": "The repricing was fast. Fed funds futures had 40% odds of a September hike after the report, down from 55% before it. Kalshi now shows a 65% chance the Fed simply holds, and CME's FedWatch 60%. The two-year yield, the maturity that tracks policy most closely, fell as much as nine basis points to 4.15% intraday before settling near 4.19% — its lowest since July 17. The ten-year barely moved, ending around 4.654%. That gap is the information: the short end has changed its mind about the Fed, while the long end has not changed its mind about inflation. A steeper curve driven by the front end is a market pricing relief, not recovery.", "zh": "定價翻轉得很快。數據公布後，聯邦基金期貨對 9 月升息的機率從 55% 降到 40%;預測市場 Kalshi 顯示 Fed 按兵不動的機率為 65%，芝商所的 FedWatch 則是 60%。最貼近政策的兩年期公債殖利率盤中一度重挫 9 個基點至 4.15%，終場收在 4.19% 附近，是 7 月 17 日以來最低;十年期幾乎沒動，收在 4.654% 左右。這個落差就是資訊本身:短端已經改變對 Fed 的看法，長端還沒有改變對通膨的看法。由短端帶動的曲線變陡，反映的是「鬆一口氣」，不是「景氣要好了」。", "url": "https://www.cnbc.com/2026/08/07/odds-the-fed-hikes-in-september-tumble-following-big-july-jobs-miss.html"},
    {"id": "macro_1", "channel": "總經政策", "tag": "數據會被改", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，時薪年增率降到 3.2%，是 2021 年 5 月以來最低"}, {"t": "MAN", "n": "ManpowerGroup，人力仲介，對雇用實況的反應比統計修正更即時"}], "en": "Two things in Friday's release should make you slower, not faster. First, the Labor Department revised May and June hiring down by a combined 103,000 — the number you traded two months ago was not the number that turned out to be true. Second, the 53,000 drop in government jobs that produced the negative headline is widely attributed to seasonal factors that may be revised away. Set against that, the cleanest signal was wages: average hourly earnings growth slipped to 3.2% over twelve months, the lowest since May 2021. Wages are revised far less than payroll counts, and 3.2% is the piece of evidence that the Fed's wage-to-inflation channel is genuinely cooling.", "zh": "週五這份數據裡有兩件事應該讓你放慢、而不是加快動作。第一，勞工部把 5 月與 6 月的雇用人數合計下修 103,000 人——你兩個月前拿來做決定的那個數字，後來證明不是真的。第二，造成這次負值頭條的政府部門減少 53,000 人，普遍被認為來自季節性因素、日後可能被修正掉。相對之下，最乾淨的訊號是薪資:平均時薪的十二個月增幅降到 3.2%，是 2021 年 5 月以來最低。薪資數據被修正的幅度遠小於就業人數，而 3.2% 才是「Fed 最在意的薪資推升通膨這條路徑真的在降溫」的那項證據。", "url": "https://www.bls.gov/news.release/empsit.nr0.htm"},
    {"id": "macro_2", "channel": "總經政策", "tag": "凍結中", "color": "#7C6AF7", "stocks": [{"t": "ADP", "n": "Automatic Data Processing，本週稍早的民間就業僅增 4.4 萬，與週五方向一致"}, {"t": "RHI", "n": "Robert Half，人力派遣，職缺凍結時最先反映在它的營收上"}], "en": "String this week's labour data together and the picture is not a downturn — it is a freeze. Jobless claims for the week to August 1 were 199,000, still near the lowest range since 1969, and Challenger counted the fewest monthly layoffs in two years. Yet ADP showed private hiring of just 44,000 and Friday's private payrolls came in at 30,000. Firms are not letting people go, and they are also not taking people on. That combination is genuinely unusual, and it has an uncomfortable property: it looks stable right up until it isn't, because a freeze breaks in one direction or the other rather than drifting.", "zh": "把這一週的就業數據串起來，看到的不是衰退，而是凍結。截至 8 月 1 日當週的初次請領失業金人數為 19.9 萬，仍在 1969 年以來的最低區間，Challenger 統計的單月裁員人數是兩年來最少;但 ADP 的民間就業只增 4.4 萬，週五的民間非農也只有 3 萬。企業沒有在放人，也沒有在收人。這個組合相當罕見，而且有一個讓人不安的性質:它會一直看起來很穩定，直到不穩定為止——因為凍結的結局通常是往某一邊斷掉，而不是慢慢滑動。", "url": "https://finance.yahoo.com/economy/policy/articles/soft-july-jobs-report-fuels-130642877.html"},
    {"id": "sector_0", "channel": "產業風向", "tag": "一週兩判決", "color": "#4EABA4", "stocks": [{"t": "IGV", "n": "軟體類股 ETF，同一週先崩後噴，幅度都超過 2%"}, {"t": "DDOG", "n": "Datadog，週四營收年增 36% 且上修指引仍跌 17%"}, {"t": "HUBS", "n": "HubSpot，週四雙超標卻因下修全年展望跌 24%"}], "en": "Two consecutive sessions handed the software sector opposite verdicts. Thursday: Datadog fell 17% despite 36% revenue growth and raised guidance, HubSpot fell 24% after beating both lines and cutting its full-year outlook, AppLovin fell 19.3%. Friday: Atlassian rose 32%, Doximity 81%, Cloudflare 17%. The dividing line is not growth rate — Datadog grew faster than several of Friday's winners. It is whether AI shows up as revenue or as cost. Cloudflare reported AI agents crossing half its network traffic; Atlassian shipped AI into Jira for free; Datadog flagged its largest AI customer cutting usage and a gross margin miss. Same technology, opposite side of the income statement.", "zh": "連續兩個交易日，軟體股拿到了完全相反的判決。週四:Datadog 營收年增 36% 且上修指引仍跌 17%，HubSpot 雙超標卻因下修全年展望跌 24%，AppLovin 跌 19.3%。週五:Atlassian 漲 32%、Doximity 漲 81%、Cloudflare 漲 17%。分界線不是成長率——Datadog 的成長率比週五好幾家贏家都高。分界線是 AI 出現在損益表的哪一邊:Cloudflare 說 AI 代理流量已過網路總量一半，Atlassian 把 AI 免費塞進 Jira，而 Datadog 講的是最大 AI 客戶要減少用量、毛利率不如預期。同一項技術，站在報表的兩邊。", "url": "https://finance.yahoo.com/markets/article/software-stocks-sink-led-by-declines-from-figma-datadog-144104020.html"},
    {"id": "sector_1", "channel": "產業風向", "tag": "翻正三兄弟", "color": "#4EABA4", "stocks": [{"t": "XLI", "n": "工業類股，週五 +0.60%，週四才因殖利率上升被壓下約 1%"}, {"t": "XLB", "n": "原物料類股，週五 +0.35%"}, {"t": "XLRE", "n": "不動產類股，週五 +0.20%，是對利率預期最敏感的一個"}], "en": "On Thursday, real estate, materials and industrials were the three weakest sectors, each down about 1% as the 30-year yield touched 5.21%. On Friday all three closed green — industrials up 0.60%, materials 0.35%, real estate 0.20%. Nothing about those businesses changed in twenty-four hours. What changed was the discount rate applied to them. This is a useful thing to have watched in real time, because it shows how much of a sector move can be pure denominator. If you owned any of the three on Thursday and felt bad, and owned them on Friday and felt good, neither feeling was about the companies.", "zh": "週四，不動產、原物料與工業是最弱的三個類股，在三十年期殖利率觸及 5.21% 時各跌約 1%。週五，這三個全部收紅——工業 +0.60%、原物料 +0.35%、不動產 +0.20%。這三個產業的生意在二十四小時內完全沒有變化，變的是套在它們身上的貼現率。這是一次很值得親眼看過的示範，因為它顯示一個類股的漲跌可以有多大比例純粹來自分母。如果你週四抱著這三者覺得難受、週五抱著它們覺得舒服，那兩種感覺都跟公司無關。", "url": "https://www.benzinga.com/etfs/sector-etfs/26/08/61037974/leading-and-lagging-sectors-august-7-2026"},
    {"id": "sector_2", "channel": "產業風向", "tag": "銀行兩面刃", "color": "#4EABA4", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，升息預期解除同時鬆開存款成本、也收走淨息差的順風"}, {"t": "KBE", "n": "廣泛銀行 ETF，可與 KRE 對照大型與區域銀行的差異"}], "en": "For regional banks the collapse in hike odds is genuinely two-edged, and it is worth being precise about why. A hike raises what a bank pays depositors almost immediately, while what it earns on loans reprices more slowly — so no hike removes a real cost pressure. But most regional banks spent the last few quarters reporting net interest margin expansion, and a chunk of that came from the same rate environment. Take the hike away and you remove the pressure and the tailwind together. That is why this group should not be traded as one block: a bank whose margin came from deposit repricing and one whose margin came from asset growth will now diverge.", "zh": "對區域銀行來說，升息機率崩落是真正的兩面刃，而理由值得講精確。升息會幾乎立刻推高銀行付給存戶的利息，放款端的重新定價卻比較慢——所以不升息確實移走了一項實在的成本壓力。但過去幾季大多數區域銀行報出來的淨息差擴張，有一部分也來自同一個利率環境。把升息拿掉，壓力和順風會一起消失。這正是這個族群不該被當成一整塊來交易的原因:息差來自存款重新定價的銀行，跟息差來自生息資產成長的銀行，從這裡開始會分道揚鑣。", "url": "https://finance.yahoo.com/economy/policy/articles/us-rate-futures-cut-chances-124656547.html"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "最強一年", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，今年以來漲約 20%，上半年是 1991 年以來最強"}, {"t": "IJR", "n": "標普小型股 ETF，同期標普 500 漲約 11%，落差近一倍"}], "en": "The Russell 2000 is up around 20% in 2026 against about 11% for the S&P 500, its best first half since 1991 and on pace for its strongest year since 2003. Friday added fuel: the single largest driver of small-cap performance is the cost of floating-rate debt, and the market just moved September from probably a hike to probably a hold. But keep the arithmetic honest. A large part of this year's gain came from multiple expansion on the expectation of cheaper money, not from earnings that have already arrived. Gains built on an expected rate path are only as durable as the path, and this week the path moved twice in five days.", "zh": "羅素 2000 今年以來漲約 20%，同期標普 500 約 11%，上半年表現是 1991 年以來最強，全年有機會寫下 2003 年以來最好的成績。週五又添了柴火:影響小型股表現最大的單一變數是浮動利率負債的成本，而市場剛把 9 月從「可能升息」改成「可能不動」。但算式要誠實看:今年的漲幅有很大一部分來自「資金會變便宜」這個預期帶來的評價擴張，而不是已經入帳的獲利。建立在預期利率路徑上的漲幅，穩固程度就等於那條路徑的穩固程度——而這條路徑，光是這五天就動了兩次。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "浮動利率", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素 2000 成長型，不賺錢公司比重高，對融資成本最敏感"}, {"t": "IWN", "n": "羅素 2000 價值型，獲利公司比重高，對同一則消息反應相對溫和"}], "en": "Why does a jobs number move small caps twice as far as large caps? Two structural reasons. First, revenue: Russell 2000 sales are overwhelmingly domestic, so US employment feeds straight into them, while roughly 40% of S&P 500 revenue comes from abroad. Second, and more important, the liability side. Large companies mostly issue fixed-rate bonds with long maturities; small companies borrow from banks at floating rates tied to short-term benchmarks. When the two-year yield falls nine basis points, that is not an abstraction for them — it is next quarter's interest expense. The growth-versus-value small-cap ETF spread is the cheapest way to watch which half of the index is actually leveraged to this.", "zh": "為什麼一份就業數據對小型股的影響是大型股的兩倍?兩個結構性理由。第一是營收面:羅素 2000 的營收壓倒性以美國內需為主，美國的就業直接餵進它們的銷售，而標普 500 有將近四成營收來自海外。第二個更重要，在負債面:大公司多半發行長天期的固定利率債券，小公司則是跟銀行借、利率浮動且綁在短天期基準上。當兩年期殖利率下跌 9 個基點，對它們來說不是抽象的數字，而是下一季的利息支出。成長型與價值型小型股 ETF 的走勢差，是觀察指數裡哪一半真正吃到這條槓桿最便宜的方法。", "url": "https://finance.yahoo.com/economy/policy/articles/us-rate-futures-cut-chances-124656547.html"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "有期限的", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普小型股 ETF，成分股營收幾乎全部來自美國內需"}, {"t": "XRT", "n": "零售 ETF，7 月零售就業轉弱，是內需鏈條上最先亮燈的一環"}], "en": "Bad news is good news has an expiry date, and small caps are where it expires first. The trade works while weak employment only means cheaper money. It stops working the moment weak employment means fewer customers — and because Russell 2000 revenue is domestic, those companies feel a consumer slowdown before an S&P 500 multinational does. July already showed retail and leisure hiring softening. So the practical question for anyone holding small caps here is not are rates going down; it is which arrives first at your holdings' revenue line, the cheaper debt or the weaker customer.", "zh": "「壞消息就是好消息」有到期日，而小型股是最早到期的地方。這筆交易在「就業疲軟只代表資金變便宜」的時候有效，在「就業疲軟代表客人變少」的那一刻就失效——而因為羅素 2000 的營收來自內需，這些公司會比標普 500 的跨國企業更早感覺到消費降溫。7 月的數據已經看到零售與休閒餐旅的雇用轉弱。所以現在抱著小型股的人真正該問的不是「利率會不會下來」，而是「便宜的債務和變弱的客人，哪一個會先走到你持股的營收那一行」。", "url": "https://www.cnbc.com/2026/08/07/here-are-three-key-takeaways-from-the-disappointing-july-jobs-report.html"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "61檔沒人寫", "color": "#5B8ED6", "stocks": [{"t": "IWC", "n": "微型股 ETF，覆蓋真空最集中的地方"}, {"t": "PCB", "n": "PCB Bancorp，Sang Lee 買進 18,200 股、金額約 39 萬美元，主流媒體零報導"}], "en": "A concrete measure of the coverage gap: one screener currently lists 61 to 64 US small caps that are both cheap on its metrics and seeing insider buying. Read the financial press for the same week and you will find almost none of them mentioned by name. PCB Bancorp is typical — director Sang Lee bought 18,200 shares for about $390,000, an amount that at this market cap is meaningful, and it generated essentially no coverage. This is the structural fact the radar channel exists to exploit, and also the reason it is hard work: nobody has done the first pass for you, which is exactly why the price can be wrong, and exactly why you can be wrong too.", "zh": "覆蓋落差有一個很具體的量法:某個篩選器目前列出 61 至 64 檔同時符合「估值便宜」與「有內部人買進」的美國小型股。把同一週的財經媒體翻過一遍，你會發現裡面幾乎沒有一檔被點名寫過。PCB Bancorp 就是典型——董事 Sang Lee 買進 18,200 股、金額約 39 萬美元，以這個市值規模來說是有份量的動作，但幾乎沒有任何報導。這就是忽視雷達這個頻道存在的結構性理由，也是它辛苦的地方:沒有人替你做過第一輪過濾，這正是價格可能錯的原因，也正是你可能錯的原因。", "url": "https://simplywall.st/stocks/us/consumer-durables/nasdaq-sono/sonos/news/discover-august-2026s-undervalued-small-caps-with-insider-bu/amp"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "分層失效", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素 2000 成長型，降息預期回來時，不賺錢的公司彈性最大"}, {"t": "IWC", "n": "微型股 ETF，同一條邏輯在市值更小的地方放得更大"}], "en": "Here is the knowledge point for today, and it is uncomfortable. When rate-cut expectations return, quality stops being the sorting variable in small caps — leverage does. The most indebted, least profitable companies bounce hardest, because the thing that changed helps them the most in percentage terms. Since mid-2025, unprofitable Russell 2000 companies have gained 154% against 34% for profitable ones. So a week like this one flatters exactly the part of the index you would not want to own for five years. If your small-cap position just had a very good Friday, it is worth checking whether it went up because it is good or because it is fragile.", "zh": "今天的知識點，而且不太舒服:當降息預期回來時，小型股裡的排序變數不再是品質，而是槓桿。負債最重、最不賺錢的公司彈得最兇，因為改變的那件事對它們的幫助按比例算最大。自 2025 年中以來，羅素 2000 裡不賺錢的公司漲了 154%，有獲利的只漲 34%。所以像這一週這樣的行情，美化的正好是這個指數裡你不會想抱五年的那一半。如果你的小型股部位剛過了一個很棒的週五，值得回頭確認一下:它漲是因為它好，還是因為它脆弱。", "url": "https://247wallst.com/investing/2026/07/16/the-russell-2000-is-having-its-best-year-in-23-years-heres-why-small-caps-are-winning-again/"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "池子假設翻轉", "color": "#C9A227", "stocks": [{"t": "ATLO", "n": "Ames National，關鍵反方原本是「9 月升息會反轉資金成本順風」，升息機率降到 40% 後這條反方鬆動"}, {"t": "AHRT", "n": "AH Realty Trust，小型 REIT，對長端殖利率最敏感，是池內最直接的受惠者"}], "en": "Friday changed an assumption sitting underneath several names in the pool at once, so it is worth stating plainly rather than pretending each is independent. Ames National entered the radar on three consecutive quarters of net interest margin expansion — 2.65% to 3.01% to 3.18% — but the stated bear case was explicit: management attributed part of that to falling funding costs, so a September hike, then priced at 60% to 80%, would reverse the tailwind. With hike odds now at 40%, that bear case has loosened. AH Realty Trust is the other side: a small REIT whose entire sector was being avoided because the 30-year hit a 19-year high. Be careful with what this does and does not mean. Nothing improved at either company this week. What improved was the environment both theses were priced against, and an environment that moved this fast in one direction can move back. Research lead, not investment advice.", "zh": "週五一次改掉了池內好幾檔股票底下的同一個假設，所以值得直說，而不是假裝它們各自獨立。Ames National 入池靠的是淨息差連三季擴張——2.65% 到 3.01% 再到 3.18%——但當初列的關鍵反方講得很明白:管理層把其中一部分歸因於資金成本下降，所以當時定價 60% 至 80% 的 9 月升息會直接反轉這個順風。現在升息機率是 40%，這條反方鬆動了。AH Realty Trust 則是另一面:一檔小型 REIT，整個族群先前被迴避的理由就是三十年期殖利率創 19 年新高。但要小心這代表什麼、不代表什麼:這一週這兩家公司本身沒有任何改善，改善的是它們論點所對應的環境;而一個能在一天內往這個方向跑這麼快的環境，也能一樣快地跑回去。研究線索，非投資建議。", "url": "https://www.cnbc.com/2026/08/07/odds-the-fed-hikes-in-september-tumble-following-big-july-jobs-miss.html", "status": "RADAR · ATLO 與 AHRT 的下一個驗證點:Q3 財報看淨息差與淨利息收入是否延續，而不是只看利率環境"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "ALLT到期", "color": "#C9A227", "stocks": [{"t": "ALLT", "n": "Allot，8/12 美東時間上午 8:30 公布第二季財報與法說會，是池內下一個到期的驗證點"}], "en": "Allot is an Israeli network intelligence and security vendor whose main business is security-as-a-service sold to telecom operators. It is on the radar because in June the board approved a buyback of up to $40 million — a meaningful capital commitment at this market cap — and said explicitly that it followed a year of profit growth and double-digit revenue growth. That is the weakness of the thesis too: the entire bull case currently rests on the company's own description of itself plus a repurchase authorisation, with no fresh quarter to check it against. That check arrives on Tuesday 08/12 at 8:30am ET. Three things to look for: whether revenue growth stayed double-digit, whether profitability persisted, and how much of the $40 million has actually been executed rather than merely authorised. Risks unchanged — telecom capex is strongly cyclical, Israeli geopolitical risk is real, and the buyback required a 30-day creditor objection period. Research lead, not investment advice.", "zh": "Allot 是以色列的網路智慧與資安服務商，主力是賣給電信商的資安即服務。它上雷達的原因是 6 月董事會通過最高 4,000 萬美元的庫藏股計畫——以這個市值來說是有份量的資本配置承諾——而且公司明講這是在「一年獲利成長、營收雙位數增長」之後的信心表態。這也正是這個論點的弱點:目前整個多方論點建立在公司自己的說法加上一紙回購授權上，沒有新的一季可以對照檢查。這個檢查在 8/12 週三美東時間上午 8:30 到期。要看三件事:營收成長是否守住雙位數、獲利是否延續，以及那 4,000 萬美元實際執行了多少、而不只是被授權。風險不變——電信商資本支出具強週期性、以色列地緣風險真實存在，而庫藏股須經債權人 30 天異議期。研究線索，非投資建議。", "url": "https://www.stocktitan.net/news/ALLT/allot-to-release-second-quarter-2026-results-and-host-conference-3x32o6bwvgsu.html", "status": "RADAR · 驗證點 08/12 上午 8:30 財報;看營收成長率、獲利延續性與庫藏股實際執行金額"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "MD超標卻跌", "color": "#C9A227", "stocks": [{"t": "MD", "n": "Pediatrix Medical Group，Q2 營收 4.878 億美元年增 4% 超標、調整後每股盈餘 0.63 美元超預期 0.03，股價卻跌 12.3%"}], "en": "New name, and it fits the most classic radar pattern of all: beat the quarter, stock fell anyway. Pediatrix Medical Group is a physician services organisation built around neonatal and maternal-fetal medicine — it staffs and manages NICUs and related practices for hospitals. Why ignored: physician staffing is an unglamorous, labour-intensive business with no product story, sitting in a corner of healthcare that generalist funds do not visit. What is changing: Q2 revenue of $487.8 million rose 4% and beat, adjusted EPS of $0.63 came in $0.03 ahead, adjusted EBITDA was $76 million, and management reaffirmed full-year adjusted EBITDA guidance of $280 to $300 million — and the shares dropped 12.3% anyway. Management is also pivoting to a telehybrid model, pairing the largest maternal-fetal medicine footprint in the country with new teleservices aimed at care deserts. The bear case is specific and credible: NICU days fell 3%, full-year volumes are guided flat to slightly down, and the revenue cycle collections tailwind that flattered recent quarters starts dissipating in the second half as it laps last year. So the question is whether the drop priced a real deterioration or just the end of an accounting tailwind. Research lead, not investment advice.", "zh": "新名字，而且是最經典的雷達型態:財報超標，股價照跌。Pediatrix Medical Group 做的是以新生兒與母胎醫學為核心的醫師服務組織，替醫院配置與管理新生兒加護病房及相關科別。為什麼被忽視:醫師人力服務是沒有產品故事、高度依賴人力的生意，位在泛用型基金不會拜訪的醫療角落。什麼正在改變:第二季營收 4.878 億美元年增 4% 且超標，調整後每股盈餘 0.63 美元超出預期 0.03，調整後 EBITDA 7,600 萬美元，管理層並重申全年調整後 EBITDA 2.8 至 3.0 億美元的指引——而股價還是跌了 12.3%。管理層同時在轉向「遠距混合」模式，把全美最大的母胎醫學版圖與新的遠距服務結合，鎖定醫療資源不足的地區。空方論點很具體也很可信:新生兒加護病房住院天數年減 3%，全年病人量指引是持平到略降，而美化了近幾季的收款循環順風，會在下半年因為比較基期墊高而開始消退。所以問題是:這 12.3% 的跌幅反映的是真正的體質惡化，還是只是一項會計順風的結束。研究線索，非投資建議。", "url": "https://markets.financialcontent.com/stocks/article/stockstory-2026-8-4-pediatrix-medical-groups-nysemd-q2-cy2026-beats-on-revenue-but-stock-drops-123", "status": "RADAR · 下一個驗證點:下一季財報看收款循環順風消退後的營收與 EBITDA，以及遠距服務的實際貢獻"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "VGNT分拆", "color": "#C9A227", "stocks": [{"t": "VGNT", "n": "Versigent，2026/04/01 自 Aptiv 分拆、紐約交易所掛牌，每 3 股 APTV 配 1 股;2026 營收指引 91 至 94 億美元"}], "en": "New name, and a spin-off. Versigent is the former Electrical Distribution Systems segment of Aptiv — the wiring architecture and electrical distribution business that sits inside a vehicle — separated on 04/01/2026 and listed on the NYSE, with Aptiv holders of record on 03/17 receiving one Versigent share for every three Aptiv shares. Why ignored: this is the textbook spin-off setup. Index funds and original shareholders sell indiscriminately because the new entity does not fit their mandate, and there is no independent operating history for institutional models to work from. What is changing: guidance of $9.1 to $9.4 billion in 2026 revenue, about 2% adjusted growth at the midpoint, supported by EV momentum and diversification across Asia-Pacific, Europe and North America — and the company reaffirmed that revenue and net income guidance alongside a new dividend policy and buyback programme, which gives an earnings base those returns can be checked against. Sell-side attention went the other way, incidentally: UBS upgraded Aptiv to Buy on the value created by the separation, and Wolfe Research to Outperform — the parent got the ratings, the spun-off entity got the selling. Risks: auto components are a cyclical business tied to vehicle production, the growth rate at 2% is not the story, the dividend and buyback are new policies with no execution record, and there is still no complete independent annual result to examine. Research lead, not investment advice.", "zh": "新名字，而且是一檔分拆股。Versigent 原本是 Aptiv 的電氣分配系統事業部，做的是車輛內部的線束架構與電氣分配，2026 年 4 月 1 日完成分拆並在紐約交易所掛牌，3 月 17 日在冊的 Aptiv 股東每持有 3 股可換得 1 股 Versigent。為什麼被忽視:這是分拆股的教科書設定——指數型基金與原股東因為新公司不符合自己的投資範圍而無差別賣出，同時沒有獨立經營歷史可供法人建模。什麼正在改變:公司指引 2026 年營收 91 至 94 億美元，中位數約當調整後成長 2%，支撐來自電動車動能與亞太、歐洲、北美的地區分散;而且它重申了營收與淨利指引，並同時提出新的股利政策與買回計畫，讓這些股東回報有一個可以被檢驗的獲利基礎。順帶一提，賣方的注意力去了相反的方向:瑞銀因分拆創造的價值把 Aptiv 調升至買進，Wolfe Research 調升至優於大盤——評等給了母公司，賣壓留給了被分出來的那一家。風險:汽車零件是綁在整車產量上的景氣循環生意，2% 的成長率本身不是故事，股利與買回都是全新政策、沒有執行紀錄，而且至今仍沒有一份完整的獨立年度成績可以檢查。研究線索，非投資建議。", "url": "https://seekingalpha.com/news/4571448-versigent-begins-trading-after-its-spinoff-from-aptiv", "status": "RADAR · 下一個驗證點:首份完整獨立年度成績，以及新股利政策與買回計畫的實際執行"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "ANIK轉正", "color": "#C9A227", "stocks": [{"t": "ANIK", "n": "Anika Therapeutics，市值約 5.8 億美元;Q2 2026 營收 3,261 萬美元、淨利 331 萬美元由虧轉盈;自 2024 年 5 月累計買回 210 萬股、3,039 萬美元"}], "en": "New name. Anika Therapeutics is a small-cap medical technology company built on hyaluronic acid science, selling joint preservation and regenerative solutions — osteoarthritis pain management injections and soft tissue repair products. Why ignored: a market capitalisation of roughly $580 million puts it below most institutional screens, and a company that has spent recent years unprofitable gets filed under not worth reopening. What is changing: two things that are cleaner than most radar entries. First, the profit line turned — Q2 2026 revenue of $32.61 million came with net income of $3.31 million, against a loss in the comparable period. Second, capital allocation has been consistent rather than announced: it has repurchased 2.1 million shares for $30.39 million since May 2024, which for a company this size is real money already spent, not an authorisation waiting to be used. Risks: one quarter of profit is a very short record and this is a business with a history of losses, so the first thing to check next quarter is whether it repeats; revenue at $32.61 million a quarter means a single product line or reimbursement decision can move the whole company; and small-cap medtech carries device reimbursement risk that arrives without warning. Research lead, not investment advice.", "zh": "新名字。Anika Therapeutics 是一家以玻尿酸科學為基礎的小型醫療科技公司，賣的是關節保存與再生方案——骨關節炎疼痛管理的注射劑，以及軟組織修復產品。為什麼被忽視:市值約 5.8 億美元，落在大多數法人的篩選門檻之下;而一家近年一直虧損的公司，通常會被歸到「不必再打開」的那一格。什麼正在改變:兩件事，而且比多數雷達標的更乾淨。第一，獲利那一行翻正了——2026 年第二季營收 3,261 萬美元，淨利 331 萬美元，而去年同期是虧損。第二，資本配置是持續執行而不是宣布而已:自 2024 年 5 月以來已買回 210 萬股、金額 3,039 萬美元，以這個規模的公司來說，那是真的已經花掉的錢，不是一紙等著被動用的授權。風險:一季獲利是非常短的紀錄，而這是一家有虧損歷史的公司，所以下一季第一件要看的就是它會不會重演;單季營收 3,261 萬美元的規模，代表單一產品線或單一給付決定就能撼動整家公司;小型醫材的給付風險往往毫無預警地到來。研究線索，非投資建議。", "url": "https://simplywall.st/stocks/us/consumer-durables/nasdaq-sono/sonos/news/discover-august-2026s-undervalued-small-caps-with-insider-bu/amp", "status": "RADAR · 下一個驗證點:下一季獲利能否重演，以及庫藏股是否延續同樣的執行節奏"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "FIGS上修", "color": "#C9A227", "stocks": [{"t": "FIGS", "n": "FIGS，Q2 營收 1.966 億美元年增 28.8%、淨利 2,840 萬、調整後 EBITDA 3,660 萬;全年成長指引自 14-16% 上修到約 20%"}], "en": "New name. FIGS designs and sells direct-to-consumer scrubs and apparel for healthcare professionals. Why ignored: it listed in 2021 and was filed away as a broken pandemic-era consumer IPO, the category sounds unserious, and generalist funds left years ago. What is changing: Q2 2026 revenue of $196.6 million grew 28.8%, with net income of $28.4 million and adjusted EBITDA of $36.6 million. The composition matters more than the headline — active customers grew 13%, average order value hit a record $127, and purchase frequency rose, so this is more customers buying more often at higher tickets rather than a single promotional quarter. Management raised full-year revenue growth to about 20% from 14% to 16%, guiding roughly $757.3 million against a $729.1 million consensus. On capital allocation, the board raised the repurchase authorisation to $200 million on 08/06, and the credential is that it had already bought 2,580,973 Class A shares for about $32.8 million in the first half, leaving about $119.2 million available. Risks: apparel is a category where a hot brand can cool fast and inventory is the first thing to go wrong; 28.8% growth invites a valuation that assumes it continues; and the healthcare-worker customer base is exactly the group whose hiring growth just showed up as below normal in the July payrolls. Research lead, not investment advice.", "zh": "新名字。FIGS 設計並直接銷售給醫護人員的刷手服與服飾。為什麼被忽視:它在 2021 年掛牌，之後被歸檔成「壞掉的疫情消費股」，品類聽起來也不夠嚴肅，泛用型基金幾年前就離場了。什麼正在改變:2026 年第二季營收 1.966 億美元、年增 28.8%，淨利 2,840 萬美元，調整後 EBITDA 3,660 萬美元。組成比標題更重要——活躍客戶數年增 13%，平均客單價創下 127 美元新高，購買頻率也上升，所以這是「更多客人、更常買、單筆更大」，而不是靠一季促銷衝出來的。管理層把全年營收成長從 14% 至 16% 上修到約 20%，指引約 7.573 億美元，高於市場預估的 7.291 億。資本配置方面，董事會於 8/6 把買回授權提高到 2 億美元，而它的背書是上半年已實際買回 2,580,973 股 A 類股、金額約 3,280 萬美元，尚餘約 1.192 億額度。風險:服飾是熱度可以退得很快的品類，而庫存通常是第一個出問題的地方;年增 28.8% 會招來假設它能延續的評價;而它的客群正好是醫護人員——7 月非農裡雇用成長低於往常的，就是這一群。研究線索，非投資建議。", "url": "https://www.stocktitan.net/news/FIGS/figs-releases-second-quarter-2026-financial-x6ei0y3af4l9.html", "status": "RADAR · 下一個驗證點:下一季活躍客戶與客單價能否同步再升，以及 1.192 億剩餘額度的實際買回速度"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "科技創紀錄", "color": "#6DB56D", "stocks": [{"t": "XLK", "n": "科技類股 ETF，過去六個月有 28 位成分股高管在公開市場買自家股票，是有紀錄以來最高"}, {"t": "QQQ", "n": "那斯達克100 ETF，可對照同期科技股的價格表現"}], "en": "One statistic from this week deserves to be written down: over the past six months, 28 executives at companies inside the technology sector SPDR bought their own stock on the open market — the highest count on record. Insiders sell for many reasons and buy for essentially one, so a record count is not nothing. But apply the usual filters before it becomes a conclusion. A record number of buyers says nothing about the size of the purchases, and 28 executives spread across a sector of that scale can still be a small amount of money. Cluster buying at a single company is a much stronger signal than a sector-wide count, because it means several people looking at the same set of books reached the same conclusion in the same window.", "zh": "這一週有一個統計值得記下來:過去六個月，科技類股 ETF 成分股裡有 28 位高管在公開市場買進自家股票，是有紀錄以來最高的一次。內部人賣股的理由有很多種，買股的理由基本上只有一種，所以創紀錄的買進人數不是沒有意義。但在把它變成結論之前，要先套上平常那幾道過濾:買進人數創紀錄，完全沒有告訴你金額多大，而 28 位高管分散在這種規模的類股裡，加起來也可能只是很小的一筆錢。單一公司內的群聚買進，訊號強度遠高於整個類股的人數統計——因為那代表好幾個看著同一套帳的人，在同一段時間裡得到了同一個結論。", "url": "https://finance.yahoo.com/markets/article/a-record-number-of-tech-stock-insiders-are-buying-their-own-shares-in-2026-133810825.html"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "銀行買自家", "color": "#6DB56D", "stocks": [{"t": "PCB", "n": "PCB Bancorp，Sang Lee 買進 18,200 股、金額約 39 萬美元"}, {"t": "KRE", "n": "區域銀行 ETF，可對照同期整個族群的走勢"}], "en": "Sang Lee bought 18,200 shares of PCB Bancorp for about $390,000. Scale that against the company rather than against your own account and it reads differently — at this market capitalisation it is a substantial personal commitment, made while the entire regional banking group was being traded as a single bet on the September rate decision. That is the part worth noticing. When a sector moves as a block on a macro variable, an individual bank's own numbers stop setting its price, and the people best placed to know whether that price is wrong are the ones sitting inside it. It remains a single-signal case though. One buyer, one filing, no fundamental inflection attached — that is a name to open a file on, not a name to act on.", "zh": "PCB Bancorp 的 Sang Lee 買進 18,200 股、金額約 39 萬美元。把這個金額拿去對照公司規模、而不是對照你自己的帳戶，讀起來就不一樣了——以這個市值來說，那是一筆相當可觀的個人投入，而且是在整個區域銀行族群被當成「押 9 月利率決議」的單一賭注在交易的時候做的。這才是值得注意的地方:當一個類股因為總經變數整批一起動，個別銀行自己的數字就不再決定它的價格，而最清楚這個價格有沒有錯的人，正是坐在裡面的那些人。但這仍然是單一訊號的案例:一個買方、一份申報，沒有搭配任何基本面拐點——這是可以開一個檔案的名字，不是可以動作的名字。", "url": "https://simplywall.st/stocks/us/banks/nasdaq-bhrb/burke-herbert-financial-services/news/exploring-3-undervalued-small-caps-with-insider-buying-acros-13/amp"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "授權與執行", "color": "#6DB56D", "stocks": [{"t": "FIGS", "n": "8/6 把買回授權提高到 2 億美元，而上半年已實際買回 2,580,973 股、約 3,280 萬美元"}, {"t": "MQ", "n": "Marqeta，8/3 在前一個計畫零額度剩餘後再授權 1.5 億美元"}, {"t": "BANR", "n": "Banner Corporation，8/3 授權買回最多 170 萬股，約當流通股 5%"}], "en": "Three buyback authorisations landed in the same week: FIGS raised its programme to $200 million on 08/06, Marqeta added $150 million on 08/03, and Banner authorised 1.7 million shares, about 5% of shares outstanding, also on 08/03. The useful way to read a buyback is to separate the authorisation from the execution, because they are different statements. An authorisation is a board saying it may buy; execution is a company that has already spent the money. On that test FIGS and Marqeta both carry receipts — FIGS bought 2,580,973 Class A shares for roughly $32.8 million in the first half before raising the ceiling, and Marqeta only received its new authorisation after finishing the previous one with zero capacity left. Banner's is fresh and untested; the place to check it is the share count in the next 10-Q, not the press release.", "zh": "同一週落地了三筆庫藏股授權:FIGS 於 8/6 把計畫提高到 2 億美元，Marqeta 於 8/3 再加 1.5 億美元，Banner 也在 8/3 授權買回 170 萬股、約當流通股的 5%。讀庫藏股有用的方法，是把「授權」和「執行」分開，因為那是兩種不同的陳述:授權是董事會說它「可以買」，執行是公司「已經把錢花掉了」。用這個標準看，FIGS 與 Marqeta 都有收據——FIGS 在提高上限之前，上半年已實際買回 2,580,973 股 A 類股、約 3,280 萬美元;Marqeta 則是在前一個計畫用到零額度剩餘之後，才拿到新的授權。Banner 這一筆是全新的、還沒被檢驗，要查的地方是下一份 10-Q 的流通股數，不是那則新聞稿。", "url": "https://www.stocktitan.net/sec-filings/FIGS/8-k-figs-inc-reports-material-event-6673e2de354a.html"},
    {"id": "week_0", "channel": "本週事件", "tag": "通膨裁判", "color": "#C97DD4", "stocks": [{"t": "SPY", "n": "標普500 ETF，這兩份數據是 9/16 FOMC 前最後的關鍵輸入"}, {"t": "TIP", "n": "抗通膨公債 ETF，對 CPI 與 PPI 的反應比股市更直接"}], "en": "Next week is where Friday's story gets tested. July CPI arrives on Wednesday 08/12 and PPI plus jobless claims on Thursday 08/13, with retail sales on Friday 08/14. These are the last major inputs before the September 16 FOMC, and they are the referee in an argument the market has already decided it won. The setup is asymmetric in an unpleasant way. A soft CPI mostly confirms what is now priced, so the upside is limited. A hot CPI has to fight a labour market that just printed negative — and note that crude rose again on Friday, which is the input most likely to make the inflation number uncooperative. Retail sales on Friday then answers the other half: whether the consumer is still spending while hiring freezes.", "zh": "下週就是週五那個故事被檢驗的地方。7 月 CPI 在 8/12 週三公布，PPI 與初次請領失業金在 8/13 週四，零售銷售在 8/14 週五。這是 9 月 16 日 FOMC 之前最後幾份重要輸入，也是一場市場已經自認贏了的爭論的裁判。這個局面的不對稱有點討厭:CPI 偏弱，大致只是確認現在已經定價的東西，上檔有限;CPI 偏熱，則要對抗一份剛剛交出負值的就業數據——而且注意，原油週五又漲了，那正是最可能讓通膨數字不聽話的輸入項。接著週五的零售銷售會回答另一半問題:在雇用凍結的同時，消費者到底還有沒有在花錢。", "url": "https://us.econoday.com/"},
    {"id": "week_1", "channel": "本週事件", "tag": "三個到期日", "color": "#C97DD4", "stocks": [{"t": "ALLT", "n": "Allot，8/12 上午 8:30 財報，是雷達池裡下一個到期的驗證點"}, {"t": "SNDK", "n": "SanDisk，8/13 法人說明會，主題是 2027 會計年度供給、合約轉換與價格下限"}], "en": "Three dates tie directly to this feed. On Wednesday 08/12 at 8:30am ET Allot reports, the next verification point due in the radar pool, and the test of whether the profit growth behind its $40 million buyback is real. On Thursday 08/13 SanDisk holds its investor day, laying out fiscal 2027 supply, contract conversion and price floors — the pricing reference for the entire memory complex, and worth watching even if you own none of it, because memory cost is now an input to hardware margins across consumer electronics. On Friday 08/14 the second-quarter 13F deadline arrives, which is when institutional positioning through the quarter finally becomes visible rather than inferred.", "zh": "有三個日期跟這份晨報直接相關。8/12 週三美東時間上午 8:30，Allot 公布財報，這是雷達池裡下一個到期的驗證點，要檢驗支撐它 4,000 萬美元庫藏股的那個「獲利成長」是不是真的。8/13 週四，SanDisk 舉行法人說明會，會把 2027 會計年度的供給量、合約轉換與價格下限講清楚，那是整個記憶體族群的定價依據;就算你一股都沒有也值得看，因為記憶體成本現在是消費電子硬體毛利率的一項輸入。8/14 週五是第二季 13F 申報截止日，機構在這一季的部位到那天才會從推測變成可見。", "url": "https://www.stocktitan.net/news/ALLT/allot-to-release-second-quarter-2026-results-and-host-conference-3x32o6bwvgsu.html"},
    {"id": "eval_0", "channel": "今日評估", "tag": "今日一件事", "color": "#E8A838", "stocks": [{"t": "DIA", "n": "道瓊 ETF，週四跌 464 點、週五收復並創高，兩天的差別只有一份數據"}, {"t": "MD", "n": "Pediatrix，財報超標卻跌 12.3%，是同一週裡完全不受總經敘事影響的另一種價格"}], "en": "The most useful thing about Friday was not the record close. It was how little it took to produce one. On Thursday the Dow fell 464 points because the long end rose; on Friday the whole market made a new high because one employment report came in negative. Two sessions, opposite conclusions, and the underlying businesses did not change at all. Now hold that next to Pediatrix, which beat its quarter in the same week and fell 12.3% regardless — a price set entirely by its own numbers, with the macro narrative doing nothing. Both are happening in the same market at the same time. Question worth sitting with: for each position you hold, do you actually know whether it is priced by the macro story or by its own results? Because those two require completely different things from you — one asks you to have a view on the Fed, and the other asks you to have read the filing.", "zh": "週五最有用的一件事不是收盤創高，而是「創高」這件事竟然這麼容易發生。週四，道瓊因為長端殖利率上升跌了 464 點;週五，整個市場因為一份就業報告出現負值就創了新高。兩個交易日、相反的結論，而底下那些公司的生意完全沒有變。現在把這件事跟 Pediatrix 放在一起看:它在同一週財報超標，股價照樣跌 12.3%——那是一個完全由自己的數字決定的價格，總經敘事在裡面一點作用也沒有。這兩種情況正在同一個市場、同一個時間裡發生。留一個值得坐下來想的問題:你手上每一個部位，你真的知道它的價格是由總經故事決定的，還是由它自己的成績決定的嗎?因為這兩者對你的要求完全不同——一個要你對 Fed 有看法，另一個要你把財報讀完。", "url": "https://www.cnbc.com/2026/08/06/stock-market-today-live-updates.html", "status": "今日討論 · 按下方討論鍵跟 Claude 繼續聊"},

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function HeatmapView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",
        blockSize: "market_cap_basic", blockColor: "change",
        locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true,
        hasSymbolTooltip: true, isMonoSize: false,
        width: "100%", height: "100%"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 10px" }}>

      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ flex:1, minHeight:0 }} />
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/08/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v6.9</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
