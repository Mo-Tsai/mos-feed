<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
  {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "收黑週紅", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普500 ETF，指數週五跌 0.25% 收 7,711.76、全週仍漲 0.5%"}, {"t": "QQQ", "n": "那斯達克100 ETF，那指綜合週五跌 0.52% 收 26,402.42、全週漲 0.9%"}, {"t": "DIA", "n": "道瓊ETF，週五只跌 9.45 點（-0.02%）收 53,559.99，全週漲 0.5%、是三週來第一次週線收紅"}], "en": "US stocks slipped on Friday but still finished the week higher. The S&P 500 fell 0.25% to 7,711.76, the Nasdaq Composite lost 0.52% to 26,402.42, and the Dow was essentially flat, down 9.45 points to 53,559.99. Over the full week the S&P gained 0.5%, the Nasdaq 0.9% and the Dow 0.5%, the Dow's first winning week in three. The pullback came after Fed Chair Kevin Warsh used his first Jackson Hole keynote to warn that inflation is still too high, which traders read as mildly hawkish.", "zh": "週五美股收黑，但全週仍是紅的。標普 500 跌 0.25% 收 7,711.76，那斯達克綜合指數跌 0.52% 收 26,402.42，道瓊幾乎沒動、跌 9.45 點收 53,559.99。全週來看標普漲 0.5%、那指漲 0.9%、道瓊漲 0.5%，是道瓊三週來第一次週線收紅。回檔的原因是聯準會主席 Warsh 在傑克森洞的第一場主席演說裡直說通膨還是太高，市場把這段話讀成偏鷹。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-august-28-dow-sp-500-nasdaq-dip-fed-warsh-jackson-hole-speech-081514091.html"},
  {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "先漲後跌", "color": "#E05C5C", "stocks": [{"t": "RSP", "n": "標普500等權重ETF，用來看漲跌有沒有擴散到成分股，而不只是權值股"}, {"t": "XLK", "n": "科技類股ETF，前一日獨撐大盤的那一個類股，週五換它領跌"}], "en": "The intraday path mattered more than the closing number on Friday. Stocks actually edged higher through the morning, with commentators reading Warsh's message as at least clear even if hawkish, and then gave it all back into the close. That shape, buy the clarity and sell the implication, is what a market looks like when it has stopped arguing about the direction of policy and started arguing about the timing. Thursday's technology-only rally also reversed, with the sector that carried the index one day leading it down the next.", "zh": "週五真正值得看的是盤中路徑，不是收盤數字。早盤股市其實是往上走的，評論普遍認為 Warsh 至少把話講清楚了，就算內容偏鷹；但這些漲幅到尾盤全部吐回去。這種「先買清晰、後賣含意」的形狀，通常出現在市場已經不再爭論政策方向、開始爭論政策時點的時候。前一天由科技股單獨扛起的漲勢也在週五反轉，昨天拉抬指數的那一個類股，今天換它往下拖。", "url": "https://www.fool.com/coverage/stock-market-today/2026/08/28/stock-market-midday-aug-28-stocks-edge-higher-on-fed-s-clear-inflation-message/"},
  {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "黃金月", "color": "#E05C5C", "stocks": [{"t": "GLD", "n": "黃金ETF，現貨金 8 月 28 日約 4,631.5 美元，單月漲逾 15%"}, {"t": "GDX", "n": "金礦股ETF，金價創本月紀錄時，礦商的營運槓桿放大得更明顯"}, {"t": "USO", "n": "原油ETF，油價回落是這段黃金行情的助力之一"}], "en": "Spot gold sat around $4,631.5 an ounce on Friday, up more than 15% for August and on track for its strongest month since September 1999. The driver being cited is the debasement trade: investors hedging against a US fiscal problem and a softer dollar rather than betting on any single event. Falling oil prices and easing Treasury yields helped, since both reduce the opportunity cost of holding a metal that pays no income. A move of this size in one month is not a quiet asset behaving normally.", "zh": "週五現貨黃金停在每盎司約 4,631.5 美元，八月單月漲幅超過 15%，有機會寫下 1999 年 9 月以來最強的一個月。市場給的理由是「貨幣貶值交易」：投資人拿黃金去避美國財政問題與弱勢美元的風險，而不是在賭某一個特定事件。油價回落與公債殖利率鬆動也幫了忙，因為兩者都降低了持有這種不生息資產的機會成本。一個月漲這種幅度，已經不是一個資產安靜地照常運作。", "url": "https://finance.yahoo.com/markets/commodities/articles/gold-eases-holds-near-three-092041274.html"},
  {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "債市轉向", "color": "#E05C5C", "stocks": [{"t": "TLT", "n": "20年期以上公債ETF，升息押注升溫時最先受傷的一段曲線"}, {"t": "IEF", "n": "7-10年期公債ETF，中段殖利率是市場對政策路徑的直接投票"}], "en": "The equity reaction to Warsh was modest; the bond reaction was not. Expectations built through Friday for the Fed's next move to be a hike rather than a cut, with the market broadly settling on nothing in September but a real possibility by October or December. That is a genuine regime change in pricing: for most of the past year the debate was about how fast cuts would come. Anyone whose portfolio is built on the assumption that the next move is down now owns a position that needs rechecking.", "zh": "股市對 Warsh 的反應是溫和的，債市不是。整個週五，市場對聯準會下一步的押注從降息偏向升息，大致的共識是九月不會動，但十月或十二月有真實的可能性。這在定價上是一次貨真價實的轉向：過去一年多數時間的辯論題目是「降息會降多快」。任何一個投資組合如果建立在「下一步是往下」這個假設上，現在都需要重新檢查一次。", "url": "https://www.npr.org/2026/08/28/nx-s1-5947903/federal-reserve-inflation-jackson-hole-interest-rates"},
  {"id": "earn_0", "channel": "財報速報", "tag": "換帥行情", "color": "#E8786A", "stocks": [{"t": "GAP", "n": "第二季營收 36.5 億年減 2%、調整後每股 0.52 美元優於預期 0.48，週五漲逾 12%"}, {"t": "XRT", "n": "零售類股ETF，服飾零售在整段消費板塊裡屬於偏強的一群"}], "en": "Gap's quarter was mixed but the stock jumped more than 12%. Revenue fell 2% to $3.65 billion, slightly below the roughly $3.69 billion consensus, while adjusted profit of $0.52 beat the $0.48 estimate and full-year adjusted EPS guidance was lifted to $2.35-$2.45. The real trigger was leadership: Michael Francis, a Target and Walmart veteran, becomes president and CEO of Old Navy on November 2. That matters because Old Navy comparable sales fell 4%, its first decline in twelve quarters, while the Gap brand itself grew comps 10%.", "zh": "Gap 這一季的數字是好壞參半，股價卻大漲超過 12%。營收年減 2% 到 36.5 億美元、略低於約 36.9 億的預期；調整後每股盈餘 0.52 美元優於預期的 0.48，全年調整後每股盈餘指引也上調到 2.35 至 2.45 美元。真正的導火線是人事：曾任職 Target 與 Walmart 的 Michael Francis 將於 11 月 2 日出任 Old Navy 總裁兼執行長。這件事之所以重要，是因為 Old Navy 同店銷售這一季下滑 4%、是十二個季度以來第一次衰退，而 Gap 本體品牌的同店卻成長 10%。", "url": "https://www.cnbc.com/2026/08/27/gap-q2-2026-earnings.html"},
  {"id": "earn_1", "channel": "財報速報", "tag": "毛利率懲罰", "color": "#E8786A", "stocks": [{"t": "MRVL", "n": "FY2027 第二季營收 27.39 億高於財測中值 3,900 萬，週五仍重挫約 8%"}, {"t": "AVGO", "n": "同樣做客製化 AI 晶片的對手，市場拿它的利潤結構來對照 Marvell"}, {"t": "SOXX", "n": "半導體ETF，這段「成長很好但毛利率不夠好」的重新定價發生在整個族群身上"}], "en": "Marvell beat on both lines and the stock still fell hard. Fiscal Q2 2027 revenue was $2.739 billion, $39 million above the midpoint of guidance, with non-GAAP gross margin of 58.9%. The problem was the next quarter: non-GAAP gross margin guided to 57.5%-58.5%, a step down driven by product mix as lower-margin AI custom silicon takes a larger share. At roughly 84 times trailing earnings, a stock priced for both growth and margin expansion cannot afford to deliver only the first.", "zh": "Marvell 營收獲利雙雙超預期，股價還是重挫。FY2027 第二季營收 27.39 億美元、比財測中值高出 3,900 萬，非 GAAP 毛利率 58.9%。問題出在下一季：非 GAAP 毛利率財測只給 57.5% 到 58.5%，這一階下滑來自產品組合，因為毛利率較低的 AI 客製晶片佔比拉高。以大約 84 倍的本益比來說，一檔同時被定價成「會成長、毛利率也會擴張」的股票，只交出前面那一半是不夠的。", "url": "https://www.fool.com/investing/2026/08/28/why-did-marvell-technology-stock-drop-today/"},
  {"id": "earn_2", "channel": "財報速報", "tag": "美妝穩健", "color": "#E8786A", "stocks": [{"t": "ULTA", "n": "第二季淨銷售 30.4 億年增 8.9%、同店 3.8%、稀釋每股 6.55 美元年增 13.3%"}, {"t": "XRT", "n": "零售類股ETF，高客單價、會員黏著度高的通路是零售板塊裡的相對強者"}], "en": "Ulta Beauty delivered the quiet kind of quarter. Net sales rose 8.9% to $3.04 billion against a $2.98 billion estimate, comparable sales grew 3.8% driven mostly by a 3.9% rise in average ticket, and diluted EPS climbed 13.3% to $6.55. Full-year EPS guidance moved up to $28.70-$29.00 and the fiscal 2026 buyback was raised from $1.5 billion to $1.8 billion. Comps driven by ticket rather than traffic is worth watching: it means customers are spending more per visit, not that more customers are coming.", "zh": "Ulta Beauty 交出的是那種安靜但扎實的一季。淨銷售年增 8.9% 到 30.4 億美元、優於 29.8 億的預期；同店銷售成長 3.8%，主要來自平均客單價上升 3.9%；稀釋後每股盈餘年增 13.3% 到 6.55 美元。全年每股盈餘指引上調到 28.70 至 29.00 美元，2026 會計年度庫藏股規模也從 15 億拉高到 18 億美元。同店成長靠客單價而不是來客數，這一點值得留意：代表現有客人每次花更多，而不是來的人變多了。", "url": "https://www.sec.gov/Archives/edgar/data/0001403568/000110465926102438/ulta-20260827xex99d1.htm"},
  {"id": "macro_0", "channel": "總經政策", "tag": "主席轉鷹", "color": "#7C6AF7", "stocks": [{"t": "SHY", "n": "1-3年期公債ETF，短天期最直接反映政策利率的預期路徑"}, {"t": "UUP", "n": "美元指數ETF，升息預期回來時美元的方向指標"}], "en": "In his first Jackson Hole keynote as Fed Chair, Kevin Warsh said inflation remains too high and that the central bank may have to raise rates in the coming months. He acknowledged recent reports show inflation cooling somewhat, but added that they do not tell him underlying trends have meaningfully improved. He also recommitted to the 2% PCE target and said elevated prices should be the Fed's main focus. This is a clearer signal than anything he gave after the July meeting.", "zh": "在他就任聯準會主席後的第一場傑克森洞主題演說裡，Warsh 說通膨仍然太高，央行未來幾個月可能必須升息。他承認近期報告顯示通膨稍微降溫，但補了一句：這些數據並沒有告訴他底層趨勢有實質改善。他同時重申 2% 的 PCE 通膨目標，並表示高物價應該是聯準會的主要焦點。這比他在七月會議之後給出的任何訊號都要明確。", "url": "https://www.cnbc.com/2026/08/28/kevin-warsh-jackson-hole-fed-inflation-rate-hike.html"},
  {"id": "macro_1", "channel": "總經政策", "tag": "核心卡住", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債ETF，核心通膨黏著時的直接受益標的"}, {"t": "IEF", "n": "7-10年期公債ETF，通膨預期與實質利率在這一段公債上打架"}], "en": "The July PCE report is the number sitting underneath Warsh's warning. Core PCE rose 0.2% on the month and 3.3% from a year earlier, in line with forecasts and unchanged from June. Headline PCE also rose 0.2% monthly, holding the annual rate at 3.7%. Core has now printed roughly 3.3% for two consecutive months. That is the definition of the phrase Warsh used: cooled a bit, underlying trend not meaningfully improved.", "zh": "七月的 PCE 報告就是 Warsh 那段警告底下的數字。核心 PCE 月增 0.2%、年增 3.3%，與預期一致，也與六月持平；整體 PCE 同樣月增 0.2%，年增率維持在 3.7%。核心通膨已經連續兩個月停在約 3.3% 這個水準。這正好是 Warsh 用的那句話的具體樣貌：稍微降溫了，但底層趨勢沒有實質改善。", "url": "https://www.cnbc.com/2026/08/26/feds-preferred-inflation-gauge-shows-core-prices-rose-3point3percent-annually-in-july.html"},
  {"id": "macro_2", "channel": "總經政策", "tag": "路徑改寫", "color": "#7C6AF7", "stocks": [{"t": "XLU", "n": "公用事業類股ETF，長期利率走高時這種高股利、高負債的板塊承壓最快"}, {"t": "SHY", "n": "1-3年期公債ETF，若真的走向升息，這一段的評價調整最直接"}], "en": "The practical question is no longer how many cuts, it is whether the next move is a hike. Market pricing after Friday settled on no change in September but a live possibility of a hike by October or December. That reframing changes what counts as good news: strong employment data, which for the past year supported the soft-landing story, now argues for tighter policy. Sectors that were bid up as rate-cut plays need to be re-examined under the opposite assumption.", "zh": "現在實務上的問題已經不是「會降幾碼」，而是「下一步會不會是升息」。週五之後的市場定價大致落在：九月不動，但十月或十二月升息是活的可能性。這個框架一改，什麼算好消息也跟著改：過去一年支撐軟著陸敘事的強勁就業數據，現在反而是支持政策收緊的理由。那些當初被當成降息受惠股買上來的板塊，需要在相反的假設下重新檢查一次。", "url": "https://www.cnbc.com/2026/08/28/kevin-warsh-jackson-hole-federal-reserve-inflation.html"},
  {"id": "sector_0", "channel": "產業風向", "tag": "銀行兩面", "color": "#4EABA4", "stocks": [{"t": "KRE", "n": "區域銀行ETF，升息預期回來時淨息差與信用品質往相反方向拉扯"}, {"t": "XLF", "n": "金融類股ETF，大型銀行與區域銀行對利率的反應並不一致"}], "en": "A hawkish Fed pulls regional banks in two directions at once. Higher-for-longer or higher-from-here rates widen net interest margins, which is the single biggest driver of community bank earnings and the reason so many of them have been quietly rerating this year. The same rates raise the cost of servicing commercial real estate loans and floating-rate borrowers, which is where credit quality goes wrong. The question is not whether rates help or hurt banks, it is which of the two shows up in the numbers first.", "zh": "一個轉鷹的聯準會會同時把區域銀行往兩個方向拉。利率維持在高檔、甚至再往上，會讓淨息差擴張，而淨息差是社區銀行獲利最大的單一驅動力，也是今年這麼多家安靜地被重新評價的原因。同樣的利率會推高商用不動產貸款與浮動利率借款人的還款負擔，信用品質出問題就是從這裡開始。真正的問題不是利率對銀行是好是壞，而是這兩件事裡哪一件會先出現在財報數字上。", "url": "https://www.cnbc.com/2026/08/28/kevin-warsh-jackson-hole-fed-inflation-rate-hike.html"},
  {"id": "sector_1", "channel": "產業風向", "tag": "生醫換手", "color": "#4EABA4", "stocks": [{"t": "ILMN", "n": "董事 Keith Meister 於 8/19-8/21 賣出 68.3 萬股、約 1.456 億美元"}, {"t": "XBI", "n": "生技ETF，小型生技的併購預期是今年小型股行情的支撐之一"}, {"t": "IHI", "n": "醫療器材ETF，設備與耗材這一段的評價與生技並不同步"}], "en": "Life sciences is quietly changing hands. On the sell side, Illumina director Keith Meister disposed of 683,474 shares between August 19 and 21 for roughly $145.6 million, a large single-holder reduction in a name that has spent years in restructuring. On the buy side, expectations of pharma and biotech acquisitions are one of the stated tailwinds behind this year's small-cap strength, since large pharma faces a patent cliff and small biotech is where the pipeline sits. Both things are true at once, in different parts of the same sector.", "zh": "生命科學這一塊正在安靜地換手。賣方這邊，Illumina 董事 Keith Meister 在 8 月 19 日到 21 日之間賣出 683,474 股、約 1.456 億美元，對一檔已經重組多年的股票來說，這是單一持有人相當大的一次減碼。買方這邊，藥廠與生技的併購預期則是今年小型股走強被點名的順風之一，因為大型藥廠面對專利懸崖，而管線在小型生技手上。這兩件事同時成立，只是發生在同一個產業的不同角落。", "url": "https://www.investing.com/news/stock-market-news/top-insider-buys-and-sells-disclosed-on-friday-93CH-4873558"},
  {"id": "sector_2", "channel": "產業風向", "tag": "防禦折價", "color": "#4EABA4", "stocks": [{"t": "ROL", "n": "8/27 跌到 52 週低 35.83 美元，第二季調整後每股 0.32 低於共識 5.9%、但仍年增 6.7%"}, {"t": "CARR", "n": "預估 2026 年獲利成長逾 12%，約 11.9 倍前瞻本益比、低於歷史平均"}], "en": "The steady-compounder trade is being repriced. Rollins, a pest control business with famously recurring revenue, hit a 52-week low of $35.83 on August 27 after softer second-quarter results and a trimmed organic growth outlook for residential. Its adjusted EPS of $0.32 missed consensus by 5.9% but was still up 6.7% year over year. Carrier is in a similar spot, forecast to grow earnings over 12% in 2026 while trading around 11.9 times forward earnings, below its own historical average. Defensive quality has stopped commanding a premium.", "zh": "穩健複利型的交易正在被重新定價。Rollins 這家以經常性收入著稱的害蟲防治公司，在 8 月 27 日跌到 52 週低點 35.83 美元，原因是第二季表現偏弱、住宅端的有機成長展望被下調；它的調整後每股盈餘 0.32 美元比共識低 5.9%，但仍然年增 6.7%。Carrier 的處境類似：市場預估 2026 年獲利成長超過 12%，前瞻本益比卻只有約 11.9 倍、低於自己的歷史平均。防禦型的品質，現在拿不到溢價了。", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/rollins-stock-hits-a-52-week-low-as-q2-2026-earnings-and-guidance/70010869"},
  {"id": "small_0", "channel": "小型股風雲", "tag": "最強一年", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，指數今年迄今漲約 20%，是 2003 年以來最好的一年"}, {"t": "IJR", "n": "標普小型股600 ETF，成分股要求獲利為正，與羅素2000的體質差異在這種年份最明顯"}], "en": "The Russell 2000 is having its best year since 2003, up roughly 20% in 2026 after its strongest first half since 1991. The cited drivers are AI spending spilling out of mega-cap technology into smaller suppliers, greater exposure to the domestic US economy, expectations of merger activity especially in pharma and biotech, and tax incentives aimed at capital investment by smaller firms. Sector returns inside the index are highly dispersed, with information technology up 48.3% through June while consumer staples and utilities managed 10.2% and 0.1%.", "zh": "羅素 2000 指數正在走 2003 年以來最好的一年，2026 年迄今漲約 20%，上半年更是 1991 年以來最強。被點名的推力有幾條：AI 支出從大型科技股外溢到較小的供應鏈、小型股對美國本土經濟曝險較高、藥廠與生技的併購預期，以及鼓勵中小企業資本投資的稅務誘因。指數內部的產業報酬差異很大，到六月底為止資訊科技漲 48.3% 遙遙領先，必需消費與公用事業則只有 10.2% 與 0.1%。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
  {"id": "small_1", "channel": "小型股風雲", "tag": "利率痛點", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，成分股浮動利率負債比重高，是升息預期下的第一個受壓點"}, {"t": "IWO", "n": "羅素2000成長型ETF，還沒獲利的成長型小型股對資金成本最敏感"}], "en": "If the next Fed move is a hike, small caps are where it bites first. The mechanism is not sentiment, it is the balance sheet: a much larger share of Russell 2000 debt is floating rate or short-dated, so a policy change reprices interest expense within quarters rather than years. Roughly 40% of the index has historically carried floating-rate exposure, and a meaningful slice of the index does not earn a profit at all. That is why the same small-cap rally that ran on rate-cut hopes can unwind faster than the large-cap one.", "zh": "如果聯準會下一步真的是升息，小型股是第一個被咬到的地方。機制不是情緒，是資產負債表：羅素 2000 成分股的負債裡，浮動利率或短天期的比重高得多，所以政策一變，利息費用是以「季」為單位重新定價，而不是以「年」。歷史上大約四成的成分股帶有浮動利率曝險，而且指數裡有相當一部分公司根本還沒有獲利。這也是為什麼同一波靠降息預期跑出來的小型股行情，可以退得比大型股快。", "url": "https://www.fool.com/investing/2026/08/26/small-cap-stocks-waiting-years-moment-is-it-here/"},
  {"id": "small_2", "channel": "小型股風雲", "tag": "獲利交叉", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普小型股600 ETF，小型股獲利成長 2026 與 2027 年預估各為 18%"}, {"t": "RSP", "n": "標普500等權重ETF，拿來對照大型股在剔除權值效應後的獲利成長"}], "en": "Here is the number that decides whether this small-cap cycle is real: earnings growth for small caps is forecast at 18% in 2026 and another 18% in 2027, which would be the first time in several years that small-cap earnings growth exceeds large-cap. Valuation gaps alone never fix themselves, because a cheap index can stay cheap for a decade if its earnings do not grow. What changes the outcome is the growth crossover, and that is the line to check each quarter rather than the discount to the S&P.", "zh": "決定這一輪小型股行情是不是真的，關鍵是這個數字：小型股的獲利成長預估 2026 年 18%、2027 年再 18%，如果兌現，將是好幾年來第一次小型股獲利成長超過大型股。單靠估值差距永遠修不好，因為一個便宜的指數如果獲利不成長，可以便宜十年。真正會改變結局的是這條獲利成長的交叉線，該每季追蹤的是它，而不是相對標普的折價幅度。", "url": "https://www.royceinvest.com/insights/chartbook/us-small-cap-mrkt-overview/index.html"},
  {"id": "small_3", "channel": "小型股風雲", "tag": "池子很淺", "color": "#5B8ED6", "stocks": [{"t": "GWRS", "n": "兩位董事 8/20 各以 8.85 美元買進 65.16 萬股與 13.93 萬股，合計約 700 萬美元"}, {"t": "VALU", "n": "市值約 5.4 億美元的出版商，日成交量小到單一筆買賣就能推動報價"}], "en": "Small-cap liquidity is the part that does not show up in a screener. When two Global Water Resources directors bought 651,618 and 139,343 shares on the same day at $8.85, that was roughly $7 million of demand hitting a stock whose normal daily turnover is a fraction of that. In a name like Value Line, with a market cap around $540 million, a single institutional decision can move the quote several percent before any news exists. This cuts both ways: the same shallow pool that produces fast gains produces gaps down with no seller to absorb them.", "zh": "小型股的流動性是選股軟體上看不到的那一半。當 Global Water Resources 的兩位董事在同一天以 8.85 美元分別買進 651,618 股與 139,343 股，那是大約 700 萬美元的買盤壓進一檔平常日成交量只有這個數字一小部分的股票。像 Value Line 這種市值約 5.4 億美元的公司，一個法人的決定就能在完全沒有新聞的情況下把報價推動好幾個百分點。這件事是雙向的：同一個淺池子能製造快速的漲幅，也能製造沒有人接的跳空缺口。", "url": "https://www.investing.com/news/stock-market-news/top-insider-buys-and-sells-disclosed-on-friday-93CH-4873558"},
  {"id": "small_4", "channel": "小型股風雲", "tag": "併購預期", "color": "#5B8ED6", "stocks": [{"t": "XBI", "n": "生技ETF，大型藥廠專利懸崖讓小型生技成為被併購的主要池子"}, {"t": "IWN", "n": "羅素2000價值型ETF，併購溢價通常先反映在便宜、資產型的那一半"}], "en": "Merger expectation is one of the load-bearing assumptions in this year's small-cap case, and it is worth separating from the others. Large pharma faces a patent cliff and needs pipeline, which points buyers at small biotech; meanwhile tax incentives for capital investment lower the after-tax cost of acquiring capacity. The catch is that acquisition premiums are lumpy and unforecastable at the single-stock level. Owning the theme through a basket captures the arithmetic; owning one name and waiting for a bid is a different, much less diversified bet.", "zh": "併購預期是今年小型股論述裡的一根承重柱，值得跟其他理由分開來看。大型藥廠面對專利懸崖、需要補管線，買方的目光自然落到小型生技上；同時鼓勵資本投資的稅務誘因，也壓低了收購產能的稅後成本。麻煩的地方在於，收購溢價是塊狀出現的，在個股層級幾乎無法預測。用一籃子去持有這個主題，賺的是機率上的算術；押單一檔然後等收購提案，則是完全不同、而且分散度低得多的一場賭。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "董事重押", "color": "#C9A227", "stocks": [{"t": "CLVT", "n": "董事 Kenneth Cornick 於 8/6-8/7 以每股 1.86 美元買進約 90 萬股、約 170 萬美元，個人持股增加 74%"}], "en": "Clarivate provides scientific and academic research data, patent and IP intelligence sold on subscription to universities, pharma and law firms. It is ignored on both counts: the stock returned -52% over the year to August 7 and trades at $1.86, a price point most institutions simply will not hold. What changed: director Kenneth Cornick bought roughly 900,000 shares across August 6 and 7 at $1.86, lifting his own position 74% from 1.2 million to about 2.1 million shares, while management sells non-core units to make remaining revenue more predictable. Risks: leverage, revenue that is still shrinking, and the plain possibility that a cheap stock is cheap for a reason. This is a research lead, not investment advice.", "zh": "Clarivate 做的是科學與學術研究資料庫、專利與智慧財產情報，用訂閱制賣給大學、藥廠與律師事務所。它兩邊都被忽視：到 8 月 7 日為止的一年總報酬是 -52%，股價 1.86 美元，這個價位本身就讓多數法人不會持有。正在改變的是：董事 Kenneth Cornick 在 8 月 6 日與 7 日以每股 1.86 美元買進約 90 萬股、約 170 萬美元，把自己的持股從 120 萬股一口氣拉高 74% 到約 210 萬股；同時管理層持續處分非核心業務，讓剩下的營收更可預測。風險是負債、營收仍在萎縮，以及一個很直白的可能性：便宜的股票之所以便宜，是有理由的。這是研究線索，不是投資建議。", "url": "https://www.fool.com/coverage/filings/2026/08/18/clarivate-director-cornick-buys-900-000-shares-for-usd1-7-million-what-does-this-tell-investors-about-the-outlook-for-2026/", "status": "RADAR · 下一個驗證點 11 月 Q3 財報"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "標籤錯位", "color": "#C9A227", "stocks": [{"t": "UFPT", "n": "2025 年 6.028 億營收中有 5.553 億來自醫療市場，股價約 194 美元、距 52 週高點約 29%"}], "en": "UFP Technologies is a contract developer and manufacturer of single-use and single-patient medical devices. Of its $602.8 million of 2025 revenue, $555.3 million came from the medical market, yet it is widely classified and screened as an industrial packaging name. It is also barely covered: it shows up on lists of steady compounders with almost no analyst following. What changed: Q1 2026 sales rose 41.9% with MedTech up 48.6%, the stock now sits about 29% below its 52-week high and only 1.41% above the 52-week low, and long-time CEO Jeffrey Bailly handed over to Mitchell Rock on June 4. Risks: growth is partly acquisition-driven rather than organic, customer concentration is real, and margin pressure has already been flagged. Research lead only, not investment advice.", "zh": "UFP Technologies 是一家專做單次使用、單一病患醫療器材的委託開發製造商。2025 年 6.028 億美元的營收裡，有 5.553 億來自醫療市場，但它在多數分類與選股系統裡仍被歸成工業包裝股。它同時也幾乎沒有券商追蹤，會出現在「幾乎沒有分析師覆蓋的穩健複利股」這種名單上。正在改變的是：2026 年第一季營收年增 41.9%、其中 MedTech 部門成長 48.6%；股價目前距 52 週高點約 29%、只比 52 週低點高 1.41%；長年執行長 Jeffrey Bailly 已於 6 月 4 日把位子交給 Mitchell Rock。風險在於成長有一部分來自併購而非有機、客戶集中度是真實存在的，而且毛利率壓力已經被點名。這是研究線索，不是投資建議。", "url": "https://www.investing.com/analysis/ufp-technologies-the-medical-device-maker-hiding-inside-an-industrial-stock-200679860", "status": "RADAR · 下一個驗證點 11 月 Q3 財報"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "轉盈一季", "color": "#C9A227", "stocks": [{"t": "SONO", "n": "第三季銷售 3.7526 億美元、淨利 2,985 萬美元，去年同期為虧損"}], "en": "Sonos, the premium wireless home audio brand, is a pool name with a fresh data point. Third-quarter sales came in at $375.26 million with net income of $29.85 million, a turnaround from a loss in the same quarter a year earlier, and the company has been running a share repurchase programme. Why it was ignored: a consumer hardware brand with no new product cycle, coming off an app rollout that damaged its reputation. Risks: memory cost inflation feeding into gross margin, revenue growth that has to come without a hardware refresh, and the CFO seat still to be filled. Research lead only, not investment advice.", "zh": "Sonos 是高階無線家庭音響品牌，屬於池內的老名字，但有新的數據點。第三季銷售 3.7526 億美元、淨利 2,985 萬美元，去年同期還是虧損，公司同時在執行庫藏股。它為什麼會被忽視：一個沒有新產品週期的消費硬體品牌，而且才剛從一次搞砸的 App 改版裡把商譽補回來。風險是記憶體成本上升對毛利率的侵蝕、在沒有硬體換機潮的情況下營收要怎麼續增，以及財務長人選到現在還沒定。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/consumer-durables/nasdaq-sono/sonos/news/discover-august-2026s-undervalued-small-caps-with-insider-bu", "status": "RADAR · 下一個驗證點 11 月 FQ4 與全年財報"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "買回自己", "color": "#C9A227", "stocks": [{"t": "VALU", "n": "市值約 5.4 億美元，7 月啟動 200 萬美元、無到期日的庫藏股計畫"}], "en": "Value Line publishes investment research and periodicals, a business model that sounds like it should have died two decades ago and did not. It is a genuine coverage desert: a roughly $540 million market cap publisher that almost nobody writes about. What changed: in July 2026 the company authorised a share repurchase programme of up to $2 million with no expiration date, small in dollars but meaningful against its float. Risks: the profit improvement so far rests on revenue shrinking rather than growing, and an authorisation is not an execution. Watch shares actually retired and the average price paid. Research lead only, not investment advice.", "zh": "Value Line 出版投資研究與刊物，這種商業模式聽起來像是二十年前就該消失、結果沒有。它是真正的覆蓋沙漠：一家市值約 5.4 億美元的出版商，幾乎沒有人在寫它。正在改變的是：2026 年 7 月公司通過一項最高 200 萬美元、沒有到期日的庫藏股計畫，金額不大，但相對它的流通股數並非沒有意義。風險在於，目前的獲利改善是建立在營收縮小而不是成長之上，而且授權不等於執行。要看的是實際買回並註銷的股數與平均成本。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/diversified-financials/nasdaq-valu/value-line/news/undervalued-small-caps-with-insider-action-in-august-2026", "status": "RADAR · 下一個驗證點 下一份季報的營收與實際買回股數"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "虧損收窄", "color": "#C9A227", "stocks": [{"t": "ENOV", "n": "上半年營收 11.7 億美元，淨損從去年同期的 9,271 萬收窄到 995 萬"}], "en": "Enovis makes orthopaedic implants and bracing products, split between reconstructive surgery and prevention and recovery. It is a pool name with a clean inflection number: first-half 2026 sales of $1.17 billion with net losses narrowing sharply from $92.71 million to $9.95 million year over year, alongside insider purchases through 2026. Why it is ignored: a mid-cap medtech that has spent years absorbing an acquisition and reporting GAAP losses, which screens badly. Risks: the gap between adjusted and GAAP numbers, integration costs that keep recurring, and a single insider buy is not a cluster. Research lead only, not investment advice.", "zh": "Enovis 做骨科植入物與護具，業務分成重建手術與預防復健兩塊。它是池內名字，但這次有一個乾淨的拐點數字：2026 年上半年營收 11.7 億美元，淨損從去年同期的 9,271 萬美元大幅收窄到 995 萬美元，2026 年間也持續有內部人買進。它為什麼被忽視：一家花了好幾年消化併購、帳上一直是 GAAP 虧損的中型醫材公司，在選股系統上很難看。風險是調整後與 GAAP 數字之間的落差、一再出現的整併費用，以及一位內部人買進還構不成群聚訊號。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/diversified-financials/nasdaq-pics/pics/news/exploring-august-2026s-undervalued-small-caps-with-notable-i", "status": "RADAR · 下一個驗證點 11 月初 Q3 財報"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "分拆倒數", "color": "#C9A227", "stocks": [{"t": "KBR", "n": "分拆案的獨立公司已定名 Trinzic，執行長與財務長人選底定，目標 2027/1/4 完成"}], "en": "KBR is a pool name and the honest update is that its verification point has not arrived yet. The company announced its intent to spin off Mission Technology Solutions in September 2025; since then it has named Michael LaRouche as CEO-designate and Nicholas Veasey as CFO-designate in June 2026, and unveiled the standalone brand as Trinzic on July 30. Completion targets January 4, 2027, the first business day of fiscal 2027, and remains conditional on a Form 10 registration statement becoming effective. Until that Form 10 lands there are still no standalone financials, capital structure or debt allocation to test the thesis against. Research lead only, not investment advice.", "zh": "KBR 是池內名字，而誠實的更新是：它的驗證點還沒到。公司在 2025 年 9 月宣布有意分拆 Mission Technology Solutions；此後在 2026 年 6 月定下 Michael LaRouche 為執行長人選、Nicholas Veasey 為財務長人選，並在 7 月 30 日公布獨立後的品牌名稱 Trinzic。完成時程目標是 2027 年 1 月 4 日、也就是 2027 會計年度的第一個營業日，前提仍是 Form 10 註冊聲明生效。在 Form 10 出來之前，這個論點還沒有任何獨立財務數字、資本結構或債務分配可以檢驗。這是研究線索，不是投資建議。", "url": "https://investors.kbr.com/news-and-events/spin-off-information/", "status": "RADAR · 下一個驗證點 Form 10 生效（分拆目標 2027/01/04）"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "執行長加碼", "color": "#6DB56D", "stocks": [{"t": "TTMI", "n": "執行長 Edwin Roks 於 8/25 以每股 111.77 美元買進 10,000 股、約 111 萬美元，直接持股增加 18%"}, {"t": "ITA", "n": "航太國防ETF，TTM 的國防任務系統業務與這個族群同一條需求線"}], "en": "TTM Technologies makes printed circuit boards, RF components and mission systems for defence and data-centre customers. CEO Edwin Roks bought 10,000 shares in the open market on August 25 at $111.77, about $1.11 million, lifting his direct holding 18% to 64,814 shares worth roughly $7.28 million. What makes this readable rather than decorative: he bought after the stock had already run, not at the lows, and management is guiding to quarterly sales near $950 million and $0.85 EPS on AI and defence demand. A CEO adding 18% to an already large position at a high price is a different signal from a token purchase.", "zh": "TTM Technologies 做印刷電路板、射頻元件與任務系統，客戶集中在國防與資料中心。執行長 Edwin Roks 在 8 月 25 日於公開市場以每股 111.77 美元買進 10,000 股、約 111 萬美元，把自己的直接持股拉高 18% 到 64,814 股、價值約 728 萬美元。這一筆之所以讀得出東西而不只是裝飾：他是在股價已經漲過一段之後買的、不是在低點買，而管理層同時給出單季營收接近 9.5 億美元、每股盈餘 0.85 美元的指引，動能來自 AI 與國防。一位執行長在高價位把本來就不小的部位再加 18%，跟象徵性買一張的訊號完全不同。", "url": "https://www.fool.com/coverage/filings/2026/08/26/ttm-technologies-ceo-edwin-roks-buys-10-000-shares-for-usd1-1-million-what-is-he-telling-investors/"},
  {"id": "insider_1", "channel": "內部人動向", "tag": "外部董事買", "color": "#6DB56D", "stocks": [{"t": "ELAN", "n": "董事 Lawrence Kurzius 於 8/20 以每股 23.398 美元買進 40,000 股、約 93.6 萬美元"}, {"t": "ZTS", "n": "同業龍頭，動物保健這個板塊今年整體評價受壓，拿來當對照組"}], "en": "Elanco Animal Health director Lawrence Erik Kurzius bought 40,000 shares on August 20 at $23.398, roughly $936,000. The detail worth noting is who he is: a former chief executive of McCormick, an outside director with operating experience in branded consumer products rather than a company lifer whose net worth is already tied to the stock. Independent directors buying with their own money carry a different weight from executives buying, because they have less private information and less obligation to signal. Animal health has de-rated broadly this year, which is the backdrop this purchase sits against.", "zh": "Elanco Animal Health 的董事 Lawrence Erik Kurzius 在 8 月 20 日以每股 23.398 美元買進 40,000 股、約 93.6 萬美元。值得注意的細節是他是誰：McCormick 的前執行長，一位在品牌消費品有實際營運經驗的外部董事，而不是身家早就綁在這檔股票上的公司老臣。獨立董事自掏腰包買進，跟高階經理人買進的分量並不一樣，因為他們掌握的內部資訊較少，也比較沒有做球給市場看的義務。動物保健這個板塊今年整體評價被壓低，這是這筆買進的背景。", "url": "https://www.investing.com/news/stock-market-news/top-insider-buys-and-sells-disclosed-on-friday-93CH-4873558"},
  {"id": "insider_2", "channel": "內部人動向", "tag": "賣出判讀", "color": "#6DB56D", "stocks": [{"t": "ILMN", "n": "董事 Keith Meister 於 8/19-8/21 賣出 68.3 萬股、約 1.456 億美元"}, {"t": "NET", "n": "總裁暨董事會共同主席 Michelle Zatlyn 於 8/19-8/21 賣出 99,009 股、約 2,830 萬美元"}, {"t": "AMD", "n": "技術長 Mark Papermaster 於 8/20 賣出 28,811 股、約 1,360 萬美元"}], "en": "The same week produced three very large insider sales: Illumina director Keith Meister sold 683,474 shares for about $145.6 million, Cloudflare president Michelle Zatlyn sold 99,009 shares for about $28.3 million, and AMD's CTO sold 28,811 shares for about $13.6 million. Read these differently from buys. There is essentially one reason to buy your own stock and many reasons to sell: tax bills, diversification, a scheduled 10b5-1 plan, a fund returning capital to its own investors. A sale is only informative when it breaks a pattern, such as an insider who never sells starting to sell, or a plan cancelled early.", "zh": "同一週出現三筆金額很大的內部人賣出：Illumina 董事 Keith Meister 賣出 683,474 股約 1.456 億美元、Cloudflare 總裁 Michelle Zatlyn 賣出 99,009 股約 2,830 萬美元、超微技術長 Mark Papermaster 賣出 28,811 股約 1,360 萬美元。這些要用跟買進不同的方式讀。買自家股票基本上只有一個理由，賣則有很多理由：稅單、分散風險、事先排定的 10b5-1 計畫、基金要把資金還給自己的投資人。賣出只有在打破慣性的時候才有資訊量，例如一個從不賣的人開始賣，或是一個計畫被提前取消。", "url": "https://www.investing.com/news/stock-market-news/top-insider-buys-and-sells-disclosed-on-friday-93CH-4873558"},
  {"id": "capitol_0", "channel": "政要持股", "tag": "押電力", "color": "#B5654D", "stocks": [{"t": "BE", "n": "7/24 買進 1 萬股，加上 100 口 2027/6/17 到期、履約價 100 美元的買權，後續再加一批 100 口同條件買權與約 5,000 股"}, {"t": "INTC", "n": "同一份申報加碼 1 萬股，外加 50 口 2027/6/17 到期、履約價 50 美元的買權"}], "en": "A PTR filed on August 21 by Rep. Nancy Pelosi discloses spousal purchases executed on July 24: Bloom Energy, 10,000 shares plus 100 call options struck at $100 expiring June 17, 2027, then a second tranche of another 100 calls at the same strike and about 5,000 more shares; and Intel, 10,000 shares plus 50 calls struck at $50 expiring June 17, 2027. Disclosed ranges put the two names together as high as $13.5 million. The thesis underneath is legible: fuel cells as an answer to the data-centre power bottleneck, and Intel after the US government took a stake. The expiry date says the position is sized to a mid-2027 horizon, not a trade.", "zh": "眾議員 Nancy Pelosi 在 8 月 21 日申報的一份 PTR，揭露了 7 月 24 日由配偶執行的買進：Bloom Energy 1 萬股，加上 100 口履約價 100 美元、2027 年 6 月 17 日到期的買權，之後再加一批同條件的 100 口買權與約 5,000 股；以及 Intel 1 萬股，外加 50 口履約價 50 美元、同樣 2027 年 6 月 17 日到期的買權。揭露的金額區間把兩檔加起來最高可達約 1,350 萬美元。底下的假設是讀得出來的：燃料電池是資料中心電力瓶頸的解方之一，而 Intel 則是在美國政府入股之後的標的。到期日告訴我們這個部位是照著 2027 年年中的時間框架去配置的，不是一筆短打。", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035143.pdf"},
  {"id": "capitol_1", "channel": "政要持股", "tag": "怎麼讀", "color": "#B5654D", "stocks": [{"t": "BE", "n": "申報揭露區間寫成 4,250,007 至 14,500,000 美元，這種尾數是各區間下緣相加、不是實際成交金額"}, {"t": "VST", "n": "同樣被歸在資料中心供電主題的獨立發電商，可用來對照這個假設有沒有被市場定價"}], "en": "Four things stop a PTR from being a trade signal. First, timing: the STOCK Act allows 45 days, and even this relatively fast filing was 28 days after execution, so the price you can buy at is not the price that was paid. Second, amounts are wide bands, which is why totals carry odd endings like $4,250,007, that being the sum of range floors rather than a real dollar figure. Third, most of these are executed in a spouse's or trust's account. Fourth, the real information is structure, not the ticker: an out-of-the-money call with a stated strike and expiry states a view on both direction and time, which a share purchase does not.", "zh": "有四件事讓 PTR 不能當成買賣訊號。第一是時間差：STOCK Act 給的申報期限是 45 天，就算這一筆算快的，也是成交後 28 天才揭露，你現在能買到的價位不是當初成交的價位。第二是金額只有寬區間，這也是為什麼加總會出現 4,250,007 這種奇怪的尾數，那是各區間下緣相加，不是真實的成交金額。第三，這類交易多數是在配偶或信託帳戶執行的。第四，真正的資訊量在部位結構而不是股票代號：一口寫明履約價與到期日的價外買權，同時表達了方向與時間的看法，單純買股票並不會。", "url": "https://www.benzinga.com/government/26/08/61385680/recent-filing-shows-rep-nancy-pelosi-bought-over-4-25m-worth-bloom-energy-stock"},
  {"id": "week_0", "channel": "本週事件", "tag": "非農週", "color": "#C97DD4", "stocks": [{"t": "TLT", "n": "20年期以上公債ETF，非農公布當天波動最大的資產之一"}, {"t": "UUP", "n": "美元指數ETF，就業數據若偏強，升息押注與美元通常同向走高"}], "en": "Next week is a jobs week. Tuesday September 1 brings ISM Manufacturing, S&P Global Manufacturing PMI, construction spending and JOLTS; Wednesday the ADP employment report, factory orders and the Fed's Beige Book; Thursday the trade balance, jobless claims and ISM Services; and Friday the August nonfarm payrolls, with consensus at 58,000 jobs, unemployment holding at 4.1% and average hourly earnings up 3.1% year over year. After Warsh, the reading flips: a strong print now argues for tightening rather than confirming a soft landing.", "zh": "下週是就業數據週。9 月 1 日週二有 ISM 製造業、S&P Global 製造業 PMI、營建支出與 JOLTS 職缺；週三是 ADP 就業報告、工廠訂單與聯準會褐皮書；週四是貿易餘額、初領失業金與 ISM 服務業；週五則是八月非農就業，市場共識為新增 5.8 萬人、失業率維持 4.1%、平均時薪年增 3.1%。在 Warsh 那場演說之後，這份數據的讀法是反過來的：強勁的就業現在是支持政策收緊的理由，而不是軟著陸的佐證。", "url": "https://www.schaeffersresearch.com/content/news/2026/08/27/the-week-ahead-august-jobs-report-takes-center-stage"},
  {"id": "week_1", "channel": "本週事件", "tag": "財報尾聲", "color": "#C97DD4", "stocks": [{"t": "AVGO", "n": "本季財報排在下週到九月初，是 AI 客製晶片需求在 Marvell 之後的第二個檢查點"}, {"t": "LULU", "n": "同一段時間公布，是高單價運動服飾在關稅與消費放緩下的體溫計"}], "en": "The earnings season tail runs through next week and into early September, with Broadcom, Lululemon and Dollar General among the names on deck; exact dates are still being confirmed by the companies. Two of these are worth pairing with what just happened. Broadcom is the second read on AI custom silicon demand and margin structure immediately after Marvell was punished for guiding gross margin down. Lululemon and Dollar General sit at opposite ends of the consumer, which makes them a useful spread on whether trade-down is still deepening. Note US markets trade normally next week; Labor Day falls on September 7.", "zh": "財報季的尾巴會延續到下週與九月初，Broadcom、Lululemon 與 Dollar General 都在名單上，確切日期各公司仍在確認中。其中兩檔值得跟剛發生的事一起看。Broadcom 是 Marvell 因為下修毛利率財測被懲罰之後，AI 客製晶片需求與利潤結構的第二個檢查點。Lululemon 與 Dollar General 分別站在消費光譜的兩端，把它們放在一起看，可以判斷降級消費的趨勢有沒有繼續加深。另外提醒：下週美股正常交易，勞動節假期是 9 月 7 日。", "url": "https://finance.yahoo.com/video/dollar-general-lululemon-broadcom-earnings-120016344.html"},
  {"id": "eval_0", "channel": "今日評估", "tag": "方向翻轉", "color": "#E8A838", "stocks": [{"t": "SPY", "n": "標普500 ETF，過去一年的漲勢有一部分建立在降息預期上，這個前提剛被動搖"}, {"t": "GLD", "n": "黃金ETF，八月漲逾 15%，是這個星期最誠實的一張選票"}], "en": "The single most important thing this week was not an earnings number, it was Warsh putting a rate hike back on the table. For most of the past year, every data point was scored against the question of how fast cuts would arrive; from Friday, the scoring changes sign. Gold's 15% month, the bond market's repricing, and the fact that a beat-and-raise quarter from Marvell still lost 8% all point the same way: the market is repricing the discount rate, not the earnings. So here is the question worth sitting with. If the next Fed move is up rather than down, which position in your thinking was actually a rate-cut bet wearing a different label?", "zh": "這一週最重要的一件事不是任何一個財報數字，而是 Warsh 把「升息」重新放回桌上。過去一年多數時間，每一個數據都被拿去回答同一個問題：降息會多快到？從週五開始，這個計分方式的正負號翻轉了。黃金單月漲逾 15%、債市重新定價、Marvell 營收獲利雙超預期還是跌了 8%，這三件事指向同一個方向：市場在重新定價的是折現率，不是獲利。所以留一個問題給你：如果聯準會下一步是往上而不是往下，你腦子裡哪一個部位，其實是換了個名字的降息押注？", "url": "https://www.cnbc.com/2026/08/28/kevin-warsh-jackson-hole-fed-inflation-rate-hike.html", "status": "評估 · 到最後一頁按討論鍵，把今天這個問題丟給 AI"},
];

// 「資金流向」「政要績效」是特殊分頁,不吃 CARDS、卡片版型完全不適用
const TODAY_SUBS = ["全部", ...CHANNELS.map(c => c.key), "資金流向", "政要績效"];

// 個別議員申報彙整。來源是眾議院書記官的官方 PTR 索引與 PDF,由 tools/capitol_roster.py

// 排程只要照常抽換 CARDS 就好,不用額外維護日期。
const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();
const lsKeyFor = (sub) => "mosfeed_" + BRIEF_ID + "_" + sub;

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/29/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v9.3</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
