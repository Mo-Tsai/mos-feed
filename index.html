<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS =====
let _azToken = null, _azTokenExp = 0, _azAbort = null;
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
function azureStop() { if (_azAbort) { _azAbort.abort(); _azAbort = null; } }
async function azureSpeak(text, { rate='0%', onStart, onEnd, onError }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const voice = localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural';
  if (!key) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const token = await _getAzToken(key, region, ctrl.signal);
    const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'><voice name='${voice}'><prosody rate='${rate}'>${_xmlEsc(text)}</prosody></voice></speak>`;
    const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method:'POST', signal:ctrl.signal,
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
      body:ssml
    });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (ctrl.signal.aborted) return true;
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    if (onError) onError(e);
    return false;
  }
}

// ===== 每日卡片(由每日排程整批抽換,共 20 張) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "收月線", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "S&P 500 漲 0.7% 收 7,489.72"}, {"t": "QQQ", "n": "那斯達克漲 1% 收 25,373.85"}, {"t": "DIA", "n": "道瓊漲 276.97 點、連四月收紅"}], "en": "Wall Street closed July on a high. On Friday the Dow rose 276.97 points (+0.53%) to 52,485.03, the S&P 500 added 0.7% to 7,489.72, and the Nasdaq gained 1% to 25,373.85 — the Dow's fourth straight winning month. Amazon's earnings did the lifting, and investors chose to look past long-dated Treasury yields ripping higher on the same day.", "zh": "週五（7/31）美股三大指數同步收高，為 7 月畫下句點。道瓊漲 276.97 點（+0.53%）收 52,485.03，S&P 500 漲 0.7% 收 7,489.72，那斯達克漲 1% 收 25,373.85，道瓊寫下連四個月上漲。推力來自亞馬遜財報，而投資人選擇先無視同一天竄升的長天期公債殖利率。", "ja": "ウォール街は7月を高値で締めた。金曜、ダウは276.97ポイント高（+0.53%）の52,485.03、S&P500は0.7%高の7,489.72、ナスダックは1%高の25,373.85——ダウは4カ月連続の上昇となった。牽引役はアマゾンの決算で、投資家は同日に急上昇した長期国債利回りをひとまず無視した。", "url": "https://www.cnbc.com/2026/07/30/stock-market-today-live-updates.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "債市警報", "color": "#E05C5C", "stocks": [{"t": "TLT", "n": "30 年期殖利率 5.22-5.25%、19 年新高"}, {"t": "IEF", "n": "10 年期盤中觸 4.737%、2025/1 以來最高"}], "en": "The real story on Friday was in bonds. The 10-year Treasury yield touched 4.737% intraday, its highest since January 2025, while the 30-year pushed to 5.22-5.25% — a level unseen since 2007, roughly 19 years. The trigger: several Fed officials said publicly they favor hiking to pin down inflation, with Minneapolis Fed's Kashkari saying he'd rather start with small hikes now than wait. Stocks up and long yields up rarely coexist for long.", "zh": "週五真正的主角在債市。10 年期公債殖利率盤中觸及 4.737%，是 2025 年 1 月以來最高；30 年期衝到 5.22-5.25%，是 2007 年以來、約 19 年沒見過的水位。導火線是多位 Fed 官員公開表態支持升息壓通膨，明尼阿波利斯聯準銀行總裁 Kashkari 甚至說寧可現在就開始小幅升息、不要拖。股市漲、長債殖利率也漲，這種組合通常不會長期並存。", "ja": "金曜の主役は債券市場だった。10年債利回りは日中4.737%と2025年1月以来の高水準に達し、30年債は5.22-5.25%——2007年以来、約19年ぶりの水準へ。引き金は、複数のFRB高官がインフレ抑制のため利上げを支持すると公言したこと。ミネアポリス連銀のカシュカリ総裁は待つより今から小幅利上げを始めたいと述べた。株高と長期金利上昇が長く共存することは稀だ。", "url": "https://www.cnbc.com/2026/07/31/treasury-yields-inflation-interest-rates-federal-reserve.html"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "油價地緣", "color": "#E05C5C", "stocks": [{"t": "XLE", "n": "能源是 7 月少數贏家板塊"}, {"t": "USO", "n": "國際油價今年以來漲逾 40%"}, {"t": "OXY", "n": "上游生產商直接受惠油價高檔"}], "en": "Oil is the fuel under this yield move. The US-Iran war has cut Gulf output and collapsed tanker traffic through the Strait of Hormuz, sending crude up more than 40% year to date and dragging inflation expectations with it. That made energy one of July's few winning sectors — but the price is a higher discount rate for every other asset. Geopolitical risk is simultaneously the bull case for energy stocks and the bear case for market-wide valuations.", "zh": "油價是這輪殖利率上行的燃料。美伊戰爭導致波灣產量下滑、荷姆茲海峽油輪流量崩跌，國際油價今年以來已漲逾 40%，把通膨預期一起推高。能源因此成為 7 月少數的贏家板塊，但代價是全市場的折現率跟著墊高。地緣風險現在同時是能源股的多頭理由，也是整體估值的空頭理由。", "ja": "この利回り上昇の燃料は原油だ。米イラン戦争で湾岸の生産が落ち、ホルムズ海峡のタンカー交通が急減、原油は年初来40%超上昇しインフレ期待を押し上げた。エネルギーは7月の数少ない勝ち組セクターになったが、代償は他の全資産の割引率上昇である。地政学リスクは今、エネルギー株の強気材料であると同時に市場全体のバリュエーションの弱気材料でもある。", "url": "https://www.cnn.com/2026/07/31/business/big-oil-earnings-q2-2026"},
    {"id": "earn_0", "channel": "財報速報", "tag": "雲端與硬體", "color": "#E8786A", "stocks": [{"t": "AMZN", "n": "AWS 營收年增 37%、股價暴漲 15.32%"}, {"t": "AAPL", "n": "營收展望偏軟、市值一天蒸發約 4,750 億美元"}, {"t": "META", "n": "同屬七雄、週五漲 2.5% 隨大盤反彈"}], "en": "Thursday's after-hours prints decided Friday's tape. Amazon exploded 15.32% to $270.90 on 37% AWS revenue growth — the market happily funded its higher capex. Apple collapsed 7.35% (down as much as 9.7% to $301.12 intraday) on a soft revenue outlook, erasing roughly $475 billion of market value in its worst single-day drop since March 2020. Same AI story, but the market only pays for the half that has already turned into revenue.", "zh": "週四盤後的兩份財報，在週五決定了盤面。亞馬遜暴漲 15.32% 收 270.90 美元，AWS 營收年增 37%，市場願意為它更高的資本支出買單。蘋果則重挫 7.35%（盤中一度跌 9.7% 至 301.12 美元），營收展望偏軟，單日市值蒸發約 4,750 億美元，創 2020 年 3 月以來最大單日跌幅。同一個 AI 敘事，市場只獎勵已經變成營收的那一半。", "ja": "木曜の時間外決算が金曜の相場を決めた。アマゾンはAWS売上37%増で15.32%高の270.90ドルへ急騰——市場は増額した設備投資を喜んで容認した。アップルは売上見通しの弱さで7.35%安（日中は一時9.7%安の301.12ドル）、時価総額約4,750億ドルが消失し2020年3月以来最大の下落率となった。同じAIの物語でも、市場はすでに売上に変わった半分にしか対価を払わない。", "url": "https://www.benzinga.com/markets/equities/26/07/60850532/stock-market-today-amazon-jumps-15-apple-wipes-out-475-billion"},
    {"id": "earn_1", "channel": "財報速報", "tag": "石油雙雄", "color": "#E8786A", "stocks": [{"t": "XOM", "n": "單季賺 145 億、調整後 EPS 3.52 差預期 8 美分、股價跌逾 2%"}, {"t": "CVX", "n": "獲利 121 億寫史上最大單季、股價僅漲約 1%"}], "en": "Exxon and Chevron booked a combined ~$26.5 billion quarter. Exxon earned $14.5B — about $160 million a day, its best since 2022 — while Chevron's $12.1B was its largest quarterly profit ever, more than quadruple the $2.5B a year earlier. Refining margins for gasoline, jet fuel and diesel hit records. Yet the tape shrugged: Chevron rose about 1% and Exxon fell more than 2% after adjusted EPS of $3.52 missed by eight cents.", "zh": "埃克森美孚與雪佛龍公布合計約 265 億美元的單季獲利。Exxon 單季賺 145 億美元、相當於每天進帳約 1.6 億美元，是 2022 年以來最高；雪佛龍賺 121 億美元，寫下史上最大單季獲利，比去年同期的 25 億暴增逾四倍。汽油、航空燃油與柴油的煉油利差同創新高。但股價反應冷淡——雪佛龍僅漲約 1%，Exxon 因調整後 EPS 3.52 美元差預期 8 美分反而跌逾 2%。", "ja": "エクソンとシェブロンは合計約265億ドルの四半期利益を計上した。エクソンは145億ドル——1日あたり約1.6億ドルで2022年以来最高。シェブロンは121億ドルと過去最大の四半期利益で、前年同期の25億ドルの4倍超だ。ガソリン・ジェット燃料・ディーゼルの精製マージンも過去最高を記録した。それでも株価は冷淡で、シェブロンは約1%高、エクソンは調整後EPS3.52ドルが8セント未達となり2%超下落した。", "url": "https://www.cnbc.com/2026/07/31/exxon-xom-chevron-cvx-q2-earnings.html"},
    {"id": "macro_0", "channel": "總經政策", "tag": "Fed分裂", "color": "#7C6AF7", "stocks": [{"t": "SHY", "n": "2 年期殖利率升至 4.273%、反映升息定價"}, {"t": "XLF", "n": "銀行是升息情境下的相對受惠者"}], "en": "The Fed held rates at its late-July meeting, but three FOMC members dissented in favor of a hike. Markets responded immediately: interest-rate swaps now price roughly a 60-63% probability of a 25bp increase in September. That is the pivotal shift of 2026 — the debate is no longer 'when do they cut' but 'do they hike.' For small and mid-caps carrying floating-rate debt, that is the exact opposite script.", "zh": "Fed 在 7 月底會議維持利率不變，但票數分裂：三位 FOMC 委員投票主張升息。市場反應直接——利率交換合約已為 9 月升息 1 碼定價約 60-63% 的機率。這是 2026 年的關鍵轉折：市場討論的不再是「何時降息」，而是「會不會升息」。對背負浮動利率債務的中小型企業來說，這是完全相反的劇本。", "ja": "FRBは7月末会合で金利を据え置いたが、3人のFOMCメンバーが利上げを主張して反対票を投じた。市場の反応は即座で、金利スワップは9月に0.25%利上げされる確率を約60-63%織り込んでいる。これが2026年の決定的な転換だ——論点はもはや「いつ利下げか」ではなく「利上げするのか」である。変動金利債務を抱える中小型株にとっては、まったく逆の脚本だ。", "url": "https://www.bloomberg.com/news/articles/2026-07-29/treasuries-jolted-as-fed-hold-trims-september-hike-bets"},
    {"id": "macro_1", "channel": "總經政策", "tag": "長端壓力", "color": "#7C6AF7", "stocks": [{"t": "TLT", "n": "長天期公債直接反映折現率上升"}, {"t": "VNQ", "n": "REIT 靠配息吸金、對長端最敏感"}, {"t": "XLU", "n": "公用事業同屬債券替代品受壓"}], "en": "The 30-year Treasury at 5.23% — a 19-year high — matters more than the headline suggests. Long yields are the discount rate for every asset: each step up shaves the present value of long-dated growth cash flows and directly squeezes yield-substitutes like REITs and utilities. Oil-driven inflation expectations and Fed officials talking about hikes are both pushing the long end higher. This is currently the most under-priced systemic risk on the board.", "zh": "30 年期公債殖利率升到 5.23%、19 年新高，這個數字對股市的意義比新聞標題大得多。長端殖利率是所有資產的折現率基準，它每上一階，成長股遠期現金流的現值就被砍一次，同時也直接打擊靠配息吸引資金的 REIT 與公用事業。油價推升通膨預期、Fed 官員談升息，兩股力量正把長端往上頂。這是目前最被低估的系統性風險。", "ja": "30年債利回り5.23%——19年ぶりの高水準——は見出し以上に重要だ。長期金利はあらゆる資産の割引率であり、一段上がるたびに長期成長株の将来キャッシュフローの現在価値が削られ、配当で資金を集めるREITや公益事業を直撃する。原油主導のインフレ期待とFRB高官の利上げ発言、この二つが長期ゾーンを押し上げている。現時点で最も過小評価されているシステミックリスクだ。", "url": "https://www.etftrends.com/fixed-income-content-hub/treasury-yields-snapshot-july-31-2026/"},
    {"id": "sector_0", "channel": "產業風向", "tag": "晶片崩月", "color": "#4EABA4", "stocks": [{"t": "SOXX", "n": "單月跌 27.43%、2001 年 9 月以來最差"}, {"t": "MRVL", "n": "7 月跌 45.15%"}, {"t": "KLAC", "n": "7 月跌 43.59%"}, {"t": "ALAB", "n": "7 月跌 48.30%、月內最慘"}], "en": "July was a disaster for semiconductors. The iShares Semiconductor ETF (SOXX) fell 27.43% on the month — its worst since September 2001 — while VanEck's SMH lost more than 19%, its worst since 2008, and the PHLX Semiconductor Index dropped nearly 21% after doubling in the first half. Single names were bloodier: Astera Labs -48.30%, Marvell -45.15%, KLA -43.59%, and not one of SOXX's 34 holdings finished the month green. The trigger was a simultaneous panic over AI capex returns, circular financing and foreign competition.", "zh": "7 月是半導體的災難月。iShares 半導體 ETF（SOXX）單月跌 27.43%，是 2001 年 9 月以來最差；VanEck 的 SMH 跌逾 19%，為 2008 年以來最慘；費城半導體指數跌近 21%——而上半年它才剛翻倍。個股更血腥：Astera Labs 月跌 48.30%、Marvell 跌 45.15%、KLA 跌 43.59%，SOXX 的 34 檔成分股沒有一檔月線收紅。起因是 AI 資本支出回報、循環融資與國際競爭三個疑慮同時引爆。", "ja": "7月は半導体にとって災厄の月だった。iSharesセミコンダクターETF（SOXX）は月間27.43%安と2001年9月以来最悪、VanEckのSMHは19%超安で2008年以来最悪、フィラデルフィア半導体指数は21%近く下落した——上半期に倍化した直後にである。個別はさらに凄惨で、Astera Labsは48.30%安、Marvellは45.15%安、KLAは43.59%安。SOXXの34銘柄で月間プラスは一つもなかった。引き金はAI設備投資の回収、循環的資金調達、海外競争への懸念が同時に噴出したことだ。", "url": "https://www.cnbc.com/2026/07/28/chip-stocks-head-for-one-of-their-worst-months-ever-is-it-the-end.html"},
    {"id": "sector_1", "channel": "產業風向", "tag": "領導權換手", "color": "#4EABA4", "stocks": [{"t": "XLV", "n": "本季唯一預期獲利年減、資金買的是折價"}, {"t": "XLF", "n": "金融接棒、營收超預期貢獻最大"}, {"t": "XLI", "n": "工業受惠 AI 資料中心與基建支出"}], "en": "The flip side of the chip crash is money flowing into healthcare, financials and industrials. These three were completely eclipsed by mega-cap tech for years and are now being re-priced as breadth widens. Energy and value have also quietly outperformed on elevated oil and AI data-center power demand. Worth noting: healthcare is the only sector projected to post a year-over-year earnings decline this quarter — buyers are paying for the valuation discount, not current earnings.", "zh": "晶片崩跌的另一面，是資金流向醫療保健、金融與工業。這三個板塊過去幾年被超大型科技股的光芒完全遮蔽，如今在市場廣度擴散下重新獲得定價。能源與價值型類股也因油價高檔與 AI 資料中心的電力需求而低調跑贏。值得注意的是，醫療保健是本季唯一預期獲利年減的板塊——資金進場買的是估值折價，不是當期盈餘。", "ja": "半導体急落の裏側で、資金はヘルスケア・金融・資本財へ流れている。この3セクターは長年、超大型テックの影に完全に隠れていたが、市場の幅が広がる中で再評価されつつある。エネルギーとバリューも、高い原油価格とAIデータセンターの電力需要を背景に静かに上回った。注目点：ヘルスケアは今四半期に前年比減益が見込まれる唯一のセクターだ——買い手が払っているのはバリュエーションの割安さであり、足元の利益ではない。", "url": "https://www.vaneck.com/us/en/blogs/thematic-investing/the-state-of-us-sector-investing-in-mid-2026/"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "R2K動態", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "年內漲約 20-22%、1991 來最強上半年"}, {"t": "IJR", "n": "S&P 600 同屬小型股輪動受惠者"}], "en": "The Russell 2000 is up roughly 20-22% in 2026, its best first half since 1991, and in January it out-ran the Nasdaq for 15 straight sessions — the longest such streak since 1996. But small caps skipped Friday's party, with the index slipping about 0.31% while the majors rose. Useful reminder: small-cap relative strength is a trend for the year, not a guarantee for the day.", "zh": "Russell 2000 今年漲約 20-22%，締造 1991 年以來最強的上半年，並在 1 月創下連續 15 個交易日跑贏那斯達克的紀錄（1996 年以來最長）。但週五小型股缺席派對，Russell 2000 小跌約 0.31%，落後同日走高的三大指數。這提醒一件事：小型股的相對強勢是「年度趨勢」，不是「每日必然」。", "ja": "ラッセル2000は2026年に約20-22%上昇し、1991年以来最高の上半期を記録。1月にはナスダックを15営業日連続で上回り、1996年以来最長の連続記録となった。だが金曜、小型株はパーティーを欠席し、主要3指数が上昇する中で同指数は約0.31%下落した。教訓は明快だ——小型株の相対的な強さは年間のトレンドであって、毎日の必然ではない。", "url": "https://247wallst.com/investing/etf/2026/07/20/the-russell-2000-is-outpacing-the-sp-500-in-2026-is-it-too-late-to-buy-small-cap-etfs/"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "當日主角", "color": "#5B8ED6", "stocks": [{"t": "AXTI", "n": "Q2 EPS 0.19 遠超預期 0.07、週五漲逾 25%"}, {"t": "SPXC", "n": "同日財報後走高的工業小型股"}, {"t": "NWL", "n": "同日財報後走高的消費品小型股"}], "en": "In a month when chip stocks were slaughtered, AXT (AXTI) jumped more than 25% on Friday. The small indium-phosphide wafer maker posted Q2 adjusted EPS of $0.19 against a $0.07 estimate, with revenue of $47.59 million — up 164% year over year and 77% sequentially. Indium phosphide revenue hit a record $30.7 million on data-center optical demand, and non-GAAP gross margin leapt from 29.9% in Q1 to 45.0%. Management says InP capacity expansion is ahead of schedule with revenue opportunity set to more than triple by end-2026. SPX Technologies and Newell Brands also rose on earnings the same day.", "zh": "在晶片股哀鴻遍野的 7 月，AXT（AXTI）週五大漲逾 25%。這家做磷化銦（InP）晶圓的小型半導體材料商，Q2 調整後 EPS 0.19 美元遠超預期的 0.07，營收 4,759 萬美元、年增 164%、季增 77%，其中磷化銦營收 3,070 萬創歷史新高，需求來自資料中心光通訊。非 GAAP 毛利率從 Q1 的 29.9% 跳升到 45.0%。管理層稱 InP 產能擴充進度超前，2026 年底營收機會可望增為三倍以上。同日 SPX Technologies 與 Newell Brands 也在財報後走高。", "ja": "半導体株が総崩れの7月に、AXT（AXTI）は金曜25%超上昇した。インジウムリン（InP）ウエハーを手掛ける小型の半導体材料メーカーで、Q2調整後EPSは0.19ドルと予想0.07ドルを大きく上回り、売上高4,759万ドルは前年同期比164%増・前四半期比77%増。InP売上はデータセンター向け光通信需要で過去最高の3,070万ドルに達し、非GAAP粗利率はQ1の29.9%から45.0%へ跳ねた。経営陣はInPの能力増強が前倒しで進み、2026年末には売上機会が3倍超になるとしている。同日はSPX TechnologiesとNewell Brandsも決算を受けて上昇した。", "url": "https://finance.yahoo.com/markets/stocks/articles/axti-q2-earnings-beat-record-151300077.html"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "投資教育", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "小型股對利率方向的槓桿最大"}, {"t": "IWC", "n": "微型股流動性更薄、波動更放大"}], "en": "Here is the small-cap lesson worth internalising this week: rate direction drives small caps, and it cuts both ways. Small companies carry a far higher share of floating-rate debt than large caps, so cuts deliver immediate interest relief and maximum earnings leverage — but once the market starts pricing a September hike, that same leverage becomes an accelerator in reverse. Add thin liquidity and sparse analyst coverage, and small caps structurally react harder to the same headline than large caps do. Read the yield curve first, the stock second.", "zh": "這是本週最該內化的小型股知識：利率方向決定小型股的命運，而且是雙向的。小型股負債中浮動利率的比重遠高於大型股，降息時利息負擔立刻下降、獲利彈性最大；但當市場開始為 9 月升息定價，同一個槓桿就變成反向的加速器。再加上流動性薄、分析師覆蓋少，小型股對同一則消息的價格反應天生就比大型股劇烈。看小型股，先看殖利率曲線的長短端，再看個股。", "ja": "今週、腹に落としておくべき小型株の知識はこれだ——金利の方向が小型株の運命を決め、しかも両方向に効く。小型企業は大型株より変動金利債務の比率がはるかに高く、利下げ局面では利払い負担が即座に軽くなり利益弾力性が最大になる。だが市場が9月利上げを織り込み始めれば、同じレバレッジが逆方向の加速装置に変わる。加えて流動性が薄くアナリストのカバレッジも乏しいため、同じニュースへの価格反応は構造的に大型株より激しい。小型株を見る前に、まずイールドカーブを見よ。", "url": "https://www.lseg.com/en/ftse-russell/market-insights/russell-us-reports/july-2026"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "內部人買", "color": "#C9A227", "stocks": [{"t": "AVO", "n": "酪梨供應鏈、董事四筆共買約 255 萬美元"}], "status": "RADAR · 下一個驗證點 09/上旬 Q3 財報（看酪梨均價與毛利率是否回升）", "en": "Mission Produce (AVO) farms, markets and distributes avocados and blueberries — a roughly $1 billion market cap agricultural supply-chain name. Why it's ignored: produce is treated as a no-growth commodity business and media coverage is close to zero. What's changing is insider behaviour — director Jay Pack has made four open-market purchases totalling about 226,000 shares for roughly $2.55 million, including 188,550 shares (~$2.14M) on June 15 and 40,000 shares at about $12.10 on June 30, all cash at market and all after the stock fell about 33% in June. The bear case is hard: Q2 revenue and earnings both fell on a 36% drop in avocado prices and margin compression from a supply-demand mismatch in core fruit sizes, and management's 'temporary' framing has not yet been validated by a single quarter. This is a research lead, not investment advice.", "zh": "Mission Produce（AVO）種植、行銷與配銷酪梨和藍莓，市值約 10 億美元，是典型的冷門農產供應鏈股。被忽視的原因：農產品被視為沒有成長性的商品生意，媒體聲量近乎零。正在改變的是內部人行為——董事 Jay Pack 分四筆在公開市場買進約 22.6 萬股、金額約 255 萬美元，其中 6/15 買 18.85 萬股（約 214 萬美元）、6/30 再以每股約 12.10 美元買 4 萬股（48.4 萬美元），全部是現金依市價買進，且時間點都在股價 6 月重挫約 33% 之後。反方論點很硬：Q2 營收與獲利雙雙下滑，主因酪梨價格年減 36%，以及核心果徑供需錯配造成的毛利壓縮，管理層口中的「暫時性」還沒被任何一季財報驗證。這是研究線索，不是投資建議。", "ja": "Mission Produce（AVO）はアボカドとブルーベリーの生産・マーケティング・流通を手掛ける時価総額約10億ドルの農産サプライチェーン企業だ。無視される理由：青果は成長のないコモディティ事業と見なされ、メディアの露出はほぼゼロ。変化しているのは内部者の行動——取締役Jay Packが公開市場で4回に分けて計約22.6万株・約255万ドルを購入。6月15日に188,550株（約214万ドル）、6月30日に約12.10ドルで4万株（48.4万ドル）、いずれも現金による市場購入で、株価が6月に約33%下落した後のことだ。弱気材料は重い：Q2はアボカド価格が前年比36%下落し、主要サイズの需給ミスマッチで粗利が圧迫され減収減益。経営陣の言う「一時的」はまだ一度も四半期決算で検証されていない。これは研究の手がかりであり、投資助言ではない。", "url": "https://www.fool.com/coverage/filings/2026/07/05/a-mission-produce-director-bought-40-000-company-shares-here-s-what-that-means-for-investors/"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "回購訊號", "color": "#C9A227", "stocks": [{"t": "ALLT", "n": "電信資安服務、4,000 萬美元庫藏股授權"}], "status": "RADAR · 下一個驗證點 08/12 Q2 財報與法說會", "en": "Allot (ALLT) is an Israeli network-intelligence and security vendor whose main product is Security-as-a-Service sold through telecom carriers. Why it's ignored: small cap, dual-listed on Nasdaq and Tel Aviv, almost no major broker coverage, and years of losses that got it filed under 'old tech, don't bother.' What's changing is capital allocation — on June 23 the board authorised a share repurchase of up to $40 million, explicitly framed as confidence after a year of profitable growth with double-digit revenue gains. For a company this size, $40 million is a meaningful commitment. Risks: carrier capex is cyclical, Israeli geopolitical exposure is real, the buyback is subject to a 30-day creditor objection window, and whether the profit improvement holds is unknown until Q2 results on August 12. Research lead, not investment advice.", "zh": "Allot（ALLT）是以色列的網路智慧與資安服務商，主力產品是賣給電信商的資安即服務（SECaaS）。被忽視的原因：市值小、在那斯達克與特拉維夫雙掛牌、幾乎沒有大型券商覆蓋，加上過去多年虧損，被歸類為「不用看的舊科技」。正在改變的是資本配置——6/23 董事會通過最高 4,000 萬美元的庫藏股計畫，公司明說這是在「一年獲利成長、營收雙位數增長」之後對財務體質的信心表態；對這種市值的公司，4,000 萬美元是有份量的承諾。風險是電信商資本支出具週期性、以色列地緣風險真實存在、庫藏股需經債權人 30 天異議期，而獲利改善能否延續要等 8/12 的 Q2 財報才知道。研究線索，不是投資建議。", "ja": "Allot（ALLT）はイスラエルのネットワークインテリジェンス・セキュリティ企業で、主力は通信事業者経由で販売するSecurity-as-a-Service（SECaaS）だ。無視される理由：小型株、ナスダックとテルアビブの重複上場、大手証券のカバレッジがほぼ皆無、そして長年の赤字により「見る必要のない旧テック」に分類されてきた。変化しているのは資本配分——6月23日、取締役会が最大4,000万ドルの自社株買いを承認。会社は「1年間の増収増益と二桁成長」を経た財務体質への自信の表明だと明言している。この規模の会社にとって4,000万ドルは重い約束だ。リスクは通信事業者の設備投資の循環性、イスラエルの地政学リスク、債権者の30日間の異議申立期間、そして収益改善が続くかは8月12日のQ2決算まで分からないこと。研究の手がかりであり、投資助言ではない。", "url": "https://www.tipranks.com/news/company-announcements/allot-launches-40-million-share-buyback-to-signal-confidence-in-growth"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "群聚買進", "color": "#C9A227", "stocks": [{"t": "MBC", "n": "廚浴櫃體製造、11 天內三位內部人連續買進"}], "status": "RADAR · 下一個驗證點 08/04 盤後 Q2 財報", "en": "MasterBrand (MBC) makes kitchen and bath cabinets in North America and is in an all-stock merger with American Woodmark. Why it's ignored: building products is an unfashionable sector, and it collided with a soft housing market and high rates, so institutions simply won't touch it. What's changing is the insider signal — three insiders bought on the open market within 11 days: CEO R. Banyard bought 60,000 shares on June 1 (the largest single insider buy in three months), director David Petratis 11,587 shares on June 8, and director Philip Fracassa 5,000 shares on June 11. GuruFocus puts GF Value near $13.21, a price-to-GF-Value of just 0.69. The bear case: Q1 2026 still showed a $15.4 million net loss with revenue and profit both falling, merger integration risk and housing demand risk are landing at the same time, and the 30-year yield at a 19-year high is salt in the wound for mortgage rates. Q2 results after the close on August 4 are the nearest test. Research lead, not investment advice.", "zh": "MasterBrand（MBC）是北美廚浴櫃體製造商，正與 American Woodmark 進行全股交換合併。被忽視的原因：建材櫃體產業本身冷門，又撞上房市疲軟與高利率，法人根本不想碰。正在改變的是內部人訊號——11 天內三位內部人連續在公開市場買進：執行長 R. Banyard 於 6/1 買 6 萬股（近三個月最大單筆內部人買進）、董事 David Petratis 於 6/8 買 11,587 股、董事 Philip Fracassa 於 6/11 買 5,000 股；GuruFocus 給的 GF Value 約 13.21 美元，price-to-GF-Value 僅 0.69。反方論點：Q1 2026 仍虧損 1,540 萬美元、營收獲利雙降，合併整合風險與房市需求風險同時發生，而 30 年期殖利率創 19 年新高對房貸利率是雪上加霜。8/4 盤後的 Q2 財報是最近的驗證點。研究線索，不是投資建議。", "ja": "MasterBrand（MBC）は北米のキッチン・バス用キャビネットメーカーで、American Woodmarkとの全株式交換による合併を進行中だ。無視される理由：建材・キャビネット業界そのものが地味な上、住宅市場の低迷と高金利に直撃され、機関投資家が手を出さない。変化しているのは内部者シグナル——11日間に3名が公開市場で連続購入。CEOのR. Banyardが6月1日に6万株（直近3カ月で最大の内部者買い）、取締役David Petratisが6月8日に11,587株、取締役Philip Fracassaが6月11日に5,000株。GuruFocusのGF Valueは約13.21ドルで、price-to-GF-Valueはわずか0.69だ。弱気材料：2026年Q1はなお1,540万ドルの純損失で減収減益、合併の統合リスクと住宅需要リスクが同時に発生し、19年ぶり高水準の30年債利回りは住宅ローン金利に追い打ちをかける。8月4日引け後のQ2決算が直近の検証点だ。研究の手がかりであり、投資助言ではない。", "url": "https://www.gurufocus.com/news/8897598/insider-buying-r-banyard-acquires-60000-shares-of-masterbrand-inc-mbc"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "驗證週", "color": "#C9A227", "stocks": [{"t": "ERII", "n": "海淡壓力交換器、8/5 盤後財報定生死"}], "status": "RADAR · 下一個驗證點 08/05 盤後 Q2 財報與法說會", "en": "Energy Recovery (ERII) makes PX pressure exchangers, the energy-recovery core of seawater desalination, with very high global share in a very small company, now extending into industrial wastewater and CO2 refrigeration. It hits its most important checkpoint this week: Q2 results after the close on August 5. The bull case rests on the large Saudi desalination contract won on July 20, five Indian industrial-wastewater projects on June 29, and director Colin Sabol adding about $99,000 at $8.88 on June 15 (a 25% increase in his holding). The bear case must be stated plainly: 2026 desalination revenue guidance of $105-125 million is below 2025, with management pointing directly at project delays, and the CO2 retail refrigeration business has been shut down with roughly $1.5 million of restructuring charges and $1.7 million of goodwill impairment. The entire bull thesis now rests on one question — can new orders convert into revenue? August 5 answers it. Research lead, not investment advice.", "zh": "Energy Recovery（ERII）做的是海水淡化的 PX 壓力交換器，全球市占極高但公司本身極小，正在往工業廢水與 CO2 冷凍延伸。它本週迎來最關鍵的驗證點：8/5 盤後公布 Q2 財報。多方論點建立在 7/20 拿下的沙烏地大型海淡案、6/29 的印度 5 個工業廢水案，以及董事 Colin Sabol 於 6/15 以 8.88 美元加碼約 9.9 萬美元（持股增加 25%）。但必須誠實說明反方：2026 年海淡業務營收指引 1.05-1.25 億美元，低於 2025 年，管理層直指專案延後；CO2 零售冷凍業務已經收攤，認列約 150 萬美元重組費用與 170 萬美元商譽減損。整個多方論點現在完全押在「新訂單能否轉成營收」這一件事上，8/5 就會知道答案。研究線索，不是投資建議。", "ja": "Energy Recovery（ERII）は海水淡水化のエネルギー回収の中核であるPX圧力交換器を製造する。世界シェアは極めて高いが会社自体は極小で、いま産業排水とCO2冷凍へ展開中だ。今週、最も重要な検証点を迎える——8月5日引け後のQ2決算である。強気材料は7月20日に獲得したサウジの大型淡水化案件、6月29日のインド5件の産業排水案件、そして取締役Colin Sabolが6月15日に8.88ドルで約9.9万ドルを買い増した（保有25%増）こと。だが弱気材料も正直に述べる必要がある：2026年の淡水化事業の売上ガイダンスは1.05-1.25億ドルと2025年を下回り、経営陣はプロジェクト遅延を直接指摘。CO2小売冷凍事業は撤退済みで、約150万ドルの再編費用と170万ドルののれん減損を計上した。強気論は今や「新規受注が売上に変わるか」の一点に賭けられており、8月5日に答えが出る。研究の手がかりであり、投資助言ではない。", "url": "https://www.gurufocus.com/news/8966649/energy-recovery-erii-secures-contract-for-saudi-desalination-project"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "資本配置", "color": "#6DB56D", "stocks": [{"t": "EXE", "n": "單季回購 5.3 億、新增 10 億授權、12.5 億併購"}, {"t": "EQT", "n": "同業對照：天然氣生產商的資本配置競賽"}], "en": "Expand Energy's (EXE) July 29 report was a masterclass in capital allocation. Q2 EPS of $1.33 beat the $1.12 estimate on revenue of $2.96 billion, with free cash flow of about $343 million. The company repurchased $530 million of stock in the quarter — $849 million year to date — added a fresh $1 billion buyback authorisation, and announced a $1.25 billion acquisition of Twin Eagle to pivot from 'North America's largest gas producer' to an integrated natural gas company. Leverage stayed at a peer-leading ~0.5x. Insider conviction isn't only Form 4s: a company buying its own stock without leveraging up to do it is the same category of signal.", "zh": "7/29 Expand Energy（EXE）交出的 Q2 財報是一堂資本配置課。單季 EPS 1.33 美元超越預期的 1.12，營收 29.6 億美元，自由現金流約 3.43 億。公司單季回購 5.3 億美元股票、年初至今累計 8.49 億，並新增 10 億美元回購授權，同時宣布以 12.5 億美元收購 Twin Eagle，從「北美最大天然氣生產商」轉向「整合型天然氣公司」。槓桿仍維持在約 0.5 倍的同業最低水準。看內部人動向不能只看 Form 4——公司自己買自己的股票、而且不靠舉債來買，是同一類的訊號。", "ja": "7月29日のExpand Energy（EXE）のQ2決算は資本配分の教科書だ。EPS1.33ドルは予想1.12ドルを上回り、売上高29.6億ドル、フリーキャッシュフローは約3.43億ドル。同社は四半期に5.3億ドルの自社株買いを実施（年初来8.49億ドル）、新たに10億ドルの買い戻し枠を追加し、同時に12.5億ドルでTwin Eagleを買収して「北米最大のガス生産者」から統合型天然ガス企業への転換を打ち出した。レバレッジは同業最低水準の約0.5倍を維持。内部者の動向はForm 4だけではない——借入に頼らず自社株を買う企業は、同じ種類のシグナルだ。", "url": "https://www.stocktitan.net/sec-filings/EXE/8-k-expand-energy-corp-reports-material-event-83ff4c8ed65a.html"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "Form4解讀", "color": "#6DB56D", "stocks": [{"t": "HDSN", "n": "大股東 Hartree 一年買 834,986 股、零賣出"}, {"t": "AVO", "n": "同一位董事四個月內分四筆加碼"}], "en": "Insider buying is about clusters and persistence, not headline dollar amounts. Two live examples: Hudson Technologies' (HDSN) 10% holder Hartree Partners has bought 834,986 shares over the past year with zero sales, adding another 65,550 shares (~$286,000) on July 21; Mission Produce (AVO) shows a single director adding across four separate purchases in four months. Three things to check. One: the Form 4 code — 'P' means cash paid at market and carries signal, while 'M' (option exercise) and 'A' (grant) are compensation and carry almost none. Two: the purchase as a percentage of that person's existing stake — a 25% increase means far more than a big dollar figure that moves their holding 1%. Three: insiders know their industry, but they have no edge on macro or short-term price direction — they can be very early, and they can be very wrong.", "zh": "內部人買進要看「群聚」與「連續」，不是看單筆金額的大小。兩個現成案例：Hudson Technologies（HDSN）的 10% 大股東 Hartree Partners 過去一年累計買進 834,986 股、期間零賣出，7/21 又買 65,550 股（約 28.6 萬美元）；Mission Produce（AVO）則是同一位董事在四個月內分四筆持續加碼。判讀重點有三：一、看 Form 4 的代碼是不是「P」（公開市場現金買進），選擇權行使的「M」與授予的「A」屬於薪酬，幾乎沒有訊號；二、看買進佔該人原有持股的比例，加碼 25% 遠比金額很大但只增加持股 1% 有意義；三、內部人是產業內行人，但他們對總體環境與自家股價的短期方向並沒有優勢——他們可以買得很早，也可以買得很錯。", "ja": "内部者の買いは「クラスター」と「継続性」で見る。金額の大きさではない。実例が二つ。Hudson Technologies（HDSN）の10%株主Hartree Partnersは過去1年で834,986株を購入し売却はゼロ、7月21日にもさらに65,550株（約28.6万ドル）を取得した。Mission Produce（AVO）は同一の取締役が4カ月で4回に分けて買い増している。読み解きの要点は三つ。第一、Form 4のコードが「P」（市場価格での現金購入）かどうか。オプション行使の「M」や付与の「A」は報酬でありシグナル性はほぼない。第二、その人の既存保有に対する購入比率。25%の積み増しは、金額が大きくても保有が1%しか増えない取引よりはるかに意味がある。第三、内部者は業界には詳しいが、マクロや自社株の短期方向に優位性はない——非常に早すぎることも、単に間違っていることもある。", "url": "https://www.stocktitan.net/sec-filings/HDSN/form-4-hudson-technologies-inc-ny-insider-trading-activity-d5d7823b3f57.html"},
    {"id": "week_0", "channel": "本週事件", "tag": "行事曆", "color": "#C97DD4", "stocks": [{"t": "SPY", "n": "8/7 非農是本週最大變數"}, {"t": "ERII", "n": "8/5 盤後 Q2 財報"}, {"t": "HDSN", "n": "8/5 Q2 財報、看毛利率是否回到 20% 中段"}], "en": "August 3-7 is jobs week — and validation week for the radar pool. On data: Wednesday August 5 brings JOLTS, with economists expecting June openings slightly lower month over month; Friday August 7 at 8:30am ET is the July employment report, where Barclays looks for about 100,000 jobs added, which would put the three-month average at 95,000 — still above breakeven. With Fed officials openly discussing hikes and markets pricing roughly 60% odds for September, a hot payroll print pushes that probability higher. On stocks: radar names MasterBrand (after the close August 4) and both Energy Recovery and Hudson Technologies (August 5) report on back-to-back days.", "zh": "8/3-8/7 是就業週，也是雷達池的驗證週。經濟數據方面：8/5（週三）公布 JOLTS 職缺數，市場預期 6 月職缺較前月略減；8/7（週五）美東時間上午 8:30 公布 7 月非農就業報告，Barclays 預估新增約 10 萬人，將使三個月移動平均達 9.5 萬、仍高於平衡水準。在 Fed 官員公開談升息、市場為 9 月升息定價約六成的背景下，一份偏強的非農會把升息機率再往上推。個股方面，雷達池的 MasterBrand（8/4 盤後）、Energy Recovery 與 Hudson Technologies（皆 8/5）連續兩天交卷。", "ja": "8月3-7日は雇用ウィークであり、レーダープールの検証ウィークでもある。経済指標では、8月5日（水）にJOLTS求人件数——エコノミストは6月の求人が前月比でやや減少と予想。8月7日（金）米東部時間8時30分に7月雇用統計が発表され、バークレイズは約10万人増を見込む。これなら3カ月移動平均は9.5万人となり、なお均衡水準を上回る。FRB高官が公然と利上げを語り、市場が9月利上げを約6割織り込む中、強い雇用統計はその確率をさらに押し上げる。個別では、レーダープールのMasterBrand（8月4日引け後）、Energy RecoveryとHudson Technologies（ともに8月5日）が2日連続で答え合わせを迎える。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar"},
    {"id": "eval_0", "channel": "今日評估", "tag": "今日提問", "color": "#E8A838", "status": "DISCUSS · 讀完到最後一頁，複製 PROMPT 找 CLAUDE 復盤", "stocks": [{"t": "QQQ", "n": "成長股遠期現金流對折現率最敏感"}, {"t": "XLE", "n": "油價是通膨與殖利率的上游變數"}, {"t": "KRE", "n": "區域銀行同時吃利差與信用風險兩面"}], "en": "The single most important thing today isn't Amazon up 15% — it's the 30-year Treasury yield hitting a 19-year high on the very same day. Equities treated 'AI capex is finally converting to revenue' as a reason to buy, while the bond market was busy pricing sticky inflation and a possible Fed hike into the long-end discount rate. Both cannot stay right for long: a rising discount rate eats growth stocks with the longest-dated cash flows first, and crushes the small caps carrying the heaviest floating-rate load next — July's 27% drop in the semiconductor ETF may already have been the first warning shot. The question to sit with: if September really does bring a hike, which position in your book has a bull thesis that quietly assumes rates were going down?", "zh": "今天最值得注意的一件事，不是亞馬遜漲 15%，而是 30 年期公債殖利率在同一天衝上 19 年新高。股市把「AI 資本支出開始變現」當成買進理由，債市卻在把「通膨黏著、Fed 可能升息」定價進長端折現率。這兩件事不可能長期同時是對的：折現率上升會先吃掉遠期現金流最多的成長股，再壓垮浮動利率負擔最重的小型股，而 7 月半導體 ETF 跌 27% 或許已經是第一次預警。值得靜下來想的問題：如果 9 月真的升息，你手上哪一個部位的多頭論點，其實是悄悄建立在「利率會降」這個前提上？", "ja": "今日いちばん重要なのはアマゾンの15%高ではない——同じ日に30年債利回りが19年ぶり高値をつけたことだ。株式は「AI設備投資がついに売上に変わり始めた」を買い材料と受け取り、債券市場は粘着インフレとFRB利上げの可能性を長期ゾーンの割引率に織り込んでいた。この二つが長く同時に正しいことはあり得ない。割引率の上昇は、まず最も長期のキャッシュフローを持つ成長株を食い、次に変動金利負担の重い小型株を潰す。7月の半導体ETF27%安は、すでに最初の警告だったのかもしれない。腰を据えて考えるべき問い：もし9月に本当に利上げがあるなら、あなたの持ち高のうち、どの強気論が「金利は下がる」という前提の上に静かに立っているだろうか？", "url": "https://www.cnbc.com/2026/07/31/treasury-yields-inflation-interest-rates-federal-reserve.html"}
  ];

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  const speakWord = React.useCallback(async (word) => {
    const ok = await azureSpeak(word, { rate:'-15%' });
    if (!ok) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US"; u.rate = 0.82;
      const voices = speechSynthesis.getVoices();
      const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
      if (picked) u.voice = picked;
      speechSynthesis.speak(u);
    }
  }, []);

  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      return;
    }
    setSpeaking(true);
    const ok = await azureSpeak(card.en, {
      rate: '-5%',
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
    if (!ok) {
      const u = new SpeechSynthesisUtterance(card.en);
      u.lang = "en-US"; u.rate = 0.88; u.pitch = 1.0; u.volume = 1.0;
      const tryVoices = () => {
        const voices = speechSynthesis.getVoices();
        const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
        if (picked) u.voice = picked;
      };
      if (speechSynthesis.getVoices().length > 0) tryVoices();
      else { speechSynthesis.onvoiceschanged = () => { tryVoices(); speechSynthesis.onvoiceschanged = null; }; }
      u.onend = () => setSpeaking(false);
      u.onerror = () => setSpeaking(false);
      speechSynthesis.speak(u);
    }
  }, [card.en, speaking]);

  // Stop speaking & close popup when card changes
  React.useEffect(() => {
    return () => {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀全文"} style={{ marginLeft:"auto" }}>{speaking ? "■" : "🔊"}</button>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          {lang === "ja"
            ? <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"15px", lineHeight:1.9, color:"var(--text-secondary)", margin:0, maxWidth:"46ch", fontWeight:300 }}>{card.ja || card.en}</p>
            : <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>}
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("ja"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="ja" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="ja" ? "close ↑" : "日本語 ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function SettingsPanel({ open, onClose }) {
  const [key, setKey] = React.useState(() => localStorage.getItem('mf_azureKey') || '');
  const [region, setRegion] = React.useState(() => localStorage.getItem('mf_azureRegion') || 'eastus');
  const [voice, setVoice] = React.useState(() => localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural');
  const [status, setStatus] = React.useState('');
  const save = () => {
    localStorage.setItem('mf_azureKey', key);
    localStorage.setItem('mf_azureRegion', region);
    localStorage.setItem('mf_azureVoice', voice);
    _azToken = null;
  };
  const handleSave = () => { save(); setStatus('已儲存'); setTimeout(() => setStatus(''), 2000); };
  const handleTest = async () => {
    save(); setStatus('測試中…');
    const ok = await azureSpeak('Hello, this is Azure Neural voice for Mo\'s Feed.', {
      onEnd: () => setStatus('✓ 連線成功'),
      onError: (e) => setStatus('✗ ' + (e?.message || '失敗'))
    });
    if (!ok) setStatus('✗ 請先填入 Azure Key');
  };
  if (!open) return null;
  return ReactDOM.createPortal(
    <>
      <div style={{ position:'fixed',inset:0,zIndex:149 }} onClick={onClose} />
      <div style={{ position:'fixed',top:0,right:0,bottom:0,width:'252px',background:'var(--bg-elevated)',borderLeft:'1px solid var(--divider)',zIndex:150,padding:'20px 18px',display:'flex',flexDirection:'column',gap:'14px',overflowY:'auto' }}>
        <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'4px' }}>
          <span style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.18em',textTransform:'uppercase',color:'var(--text-tertiary)' }}>Azure TTS 設定</span>
          <button onClick={onClose} style={{ background:'none',border:'none',cursor:'pointer',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'12px',padding:'0' }}>✕</button>
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Subscription Key</div>
          <input type="password" className="az-input" value={key} onChange={e=>setKey(e.target.value)} placeholder="貼上 Azure Key…" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Region</div>
          <input className="az-input" value={region} onChange={e=>setRegion(e.target.value)} placeholder="eastus" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Voice</div>
          <select className="az-input" value={voice} onChange={e=>setVoice(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="en-US-AriaNeural">Aria（女）自然流暢</option>
            <option value="en-US-JennyNeural">Jenny（女）清晰</option>
            <option value="en-US-GuyNeural">Guy（男）沉穩</option>
            <option value="en-US-DavisNeural">Davis（男）個性</option>
            <option value="en-US-TonyNeural">Tony（男）自信</option>
          </select>
        </div>
        <div style={{ display:'flex',gap:'8px' }}>
          <button onClick={handleSave} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--divider)',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>儲存</button>
          <button onClick={handleTest} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--text-secondary)',color:'var(--text-secondary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>測試</button>
        </div>
        {status && <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',color:'var(--text-tertiary)',letterSpacing:'0.1em' }}>{status}</div>}
        <div style={{ marginTop:'auto',fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.7,paddingTop:'8px',borderTop:'1px solid var(--divider)' }}>Key 存於 localStorage<br/>未設定時退回瀏覽器 TTS</div>
      </div>
    </>,
    document.body
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

// ===== 資金流向(TradingView 官方嵌入元件,即時資料,每日排程不需更新) =====
function HeatmapView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",
        blockSize: "market_cap_basic", blockColor: "change",
        locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true,
        hasSymbolTooltip: true, isMonoSize: false,
        width: "100%", height: "100%"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 10px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>S&P 500 · 即時資金流向</span>
        <a href="https://finviz.com/map?t=sec&st=d1" target="_blank" rel="noopener noreferrer" className="source-link">Finviz 完整版 ↗</a>
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ flex:1, minHeight:0 }} />
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const lsKey = "mosfeed_Today_" + todaySub;

  // Read localStorage on tab/sub change
  React.useEffect(() => {
    const key = "mosfeed_Today_" + todaySub;
    try {
      const saved = parseInt(localStorage.getItem(key), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") go(idx + 1);
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(idx - 1);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/01/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v5.5</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} />
          </div>
        )}
      </div>

      {/* Nav bar */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => go(idx - 1)} disabled={isFlow || idx === 0}>←</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn" onClick={() => go(idx + 1)} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
