<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "週線全黑", "color": "#E05C5C", "zh": "週五（8/21）美股三大指數收紅，標普 500 漲 0.42%、道瓊漲 0.51%、那斯達克漲 0.46%，但這根紅K救不了整週。全週結算下來，那斯達克跌 2.1%、標普 500 跌 1.4%、道瓊跌 0.8%，跌幅由高估值排到低估值，順序乾淨得不像巧合。這一週真正在主導股價的不是企業獲利，而是公債殖利率：長天期利率往上走，折現率就往上走，估值最貴的一端被壓得最重。週五的反彈成交量偏低、尾盤還翻弱，比較像空頭回補而不是買盤回來。", "en": "US stocks closed higher on Friday (8/21), with the S&P 500 up 0.42%, the Dow up 0.51% and the Nasdaq up 0.46% — but one green session could not rescue the week. For the full week the Nasdaq fell 2.1%, the S&P 500 1.4% and the Dow 0.8%, a ranking that runs neatly from most expensive to least. What drove prices this week was not corporate earnings but Treasury yields: as long-dated rates rose, so did the discount rate, and the priciest end of the market took the most damage. Friday's rebound came on light volume and faded into the close, looking more like short covering than returning demand.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-august-21-dow-sp-500-nasdaq-bitcoin-080533702.html", "stocks": [{"t": "SPY", "n": "標普 500 ETF，週五 +0.42%，但全週仍收黑 1.4%"}, {"t": "QQQ", "n": "那斯達克 100 ETF，全週 -2.1% 是三大指數最慘，高估值對利率最敏感"}, {"t": "DIA", "n": "道瓊 ETF，全週 -0.8% 跌最少，成分股估值最低、久期最短"}]},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "長端失控", "color": "#E05C5C", "zh": "這週股市只是配角，主角是債市。三十年期美國公債殖利率週二一度衝到 5.34%，是 2007 年以來最高，週四再彈 7 個基點到 5.26%，週五收在約 5.25%；十年期則守在 4.71%。財政部長貝森特宣布加倍買回長天期公債，效果只撐一天就被市場推翻，等於當眾證明了政策工具對長端的作用有限。同一週法國與德國十年期殖利率創 2008 與 2011 年以來新高，日本十年期則是三十年新高——這不是美國一家的問題，是全球長天期資金在重新定價。", "en": "Equities were the sideshow this week; the bond market was the main act. The 30-year US Treasury yield touched 5.34% on Tuesday, its highest since 2007, rebounded seven basis points to 5.26% on Thursday and settled near 5.25% Friday, while the 10-year held 4.71%. Treasury Secretary Bessent's move to double buybacks of long-dated debt held for barely a session before the market reversed it, a public demonstration of how little traction policy has at the long end. In the same week French and German 10-year yields hit their highest since 2008 and 2011, and Japan's 10-year reached a 30-year high. This is not just an American problem.", "url": "https://finance.yahoo.com/markets/currencies/articles/us-bond-selloff-drives-30-164444618.html", "stocks": [{"t": "TLT", "n": "20 年期以上美國公債 ETF，殖利率創 2007 新高等於價格創低，本週承壓最重"}, {"t": "IEF", "n": "7 至 10 年期公債 ETF，十年期守在 4.71%，短端壓力明顯小於長端"}, {"t": "LQD", "n": "投資級公司債 ETF，公司債供給增加也是這波長端賣壓的原因之一"}]},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "經濟戰", "color": "#E05C5C", "zh": "川普宣布對伊朗發動「史上對任何國家最嚴厲的經濟行動」，點名要切斷石油走私、貨幣互換、現金移轉、匯兌行、船籍登記與人頭公司，並警告任何協助德黑蘭規避制裁的國家都要付出代價——矛頭實質指向買下伊朗大部分石油的中國。油價連五天走高，布蘭特原油攀上每桶約 94 美元、本月最高。荷姆茲海峽已封閉第 174 天，數月的軍事打擊與海上封鎖都沒讓伊朗讓步，川普轉而改用金融手段，代表這場衝突的時間軸又被拉長了一截。", "en": "Trump announced what he called the most crushing economic operation ever taken against any country, naming oil smuggling, currency swap lines, cash transfers, exchange houses, ship registries and front companies as channels to be shut down, and warning that any nation helping Tehran evade sanctions would pay a price — a message aimed squarely at China, which buys the bulk of Iran's crude. Oil advanced for a fifth straight day, with Brent reaching about $94 a barrel, the highest this month. The Strait of Hormuz has now been closed for 174 days, and months of strikes and blockade have failed to force a capitulation. Switching to financial tools stretches this conflict's timeline out further.", "url": "https://www.cnbc.com/2026/08/19/us-iran-war-trump-hormuz-economic-warfare.html", "stocks": [{"t": "USO", "n": "美國原油基金，布蘭特連五漲至每桶約 94 美元、本月新高"}, {"t": "XLE", "n": "能源類股 ETF，前一週單週大漲 7.6%，是全市場唯一的明確強勢區"}, {"t": "FRO", "n": "Frontline 油輪商，荷姆茲封閉推升繞道運距，是衝突延長的直接受惠者"}]},
    {"id": "overnight_4", "channel": "隔夜盤勢", "tag": "避險同漲", "color": "#E05C5C", "zh": "股債同時難看的一週，黃金與比特幣卻各自演出。金價週五衝破每盎司 4,600 美元、盤中報 4,577 美元附近，創三個月新高、單週漲近 5%，直接觸媒是美國國債總額突破 40 兆美元——距離跨過 39 兆才五個月。比特幣同一週漲超過 20%、一度站上 75,740 美元，若守住將是 2024 年 3 月以來最強週線。兩者上漲的理由是同一個：財政部加倍回購長債等於注入流動性，而市場把這件事讀成「政府正在想辦法壓住自己的利息支出」。", "en": "In a week when both stocks and bonds looked ugly, gold and Bitcoin went their own way. Gold pushed above $4,600 an ounce on Friday, trading near $4,577, a three-month high and a weekly gain of almost 5%. The immediate trigger was US national debt crossing $40 trillion, only five months after passing $39 trillion. Bitcoin rose more than 20% on the week and touched $75,740, which would be its strongest week since March 2024 if it holds. Both rallies share one reason: doubling Treasury buybacks injects liquidity, and the market reads that as a government trying to hold down its own interest bill.", "url": "https://finance.yahoo.com/personal-finance/investing/article/gold-prices-today-friday-august-21-2026-gold-remains-strong-amid-us-debt-concerns-161052751.html", "stocks": [{"t": "GLD", "n": "黃金 ETF，金價衝破 4,600 美元、三個月新高，單週約 +5%"}, {"t": "IBIT", "n": "現貨比特幣 ETF，比特幣單週 +20% 以上、一度觸及 75,740 美元"}, {"t": "COIN", "n": "Coinbase，加密行情的高貝他代理股，同時受惠 CLARITY 法案推進"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "超預期卻崩", "color": "#E8786A", "zh": "沃爾瑪繳出調整後每股盈餘 0.81 美元、擊敗 0.741 美元的共識，營收 1,879.4 億美元年增 6%，還上修了 FY27 的獲利與營收指引——然後股價在 8/20 當天從 114.30 跌到 103.84，重挫 9%。市場不買單的原因不在這一季，在成長速度：這是六年多來最慢的季度銷售增速，而沃爾瑪的本益比是照著「防禦性成長股」在給的。當一家公司的估值建立在穩定加速上，只要曲線變平，超預期也救不了它。", "en": "Walmart delivered adjusted EPS of $0.81 against a $0.741 consensus, revenue of $187.94 billion up 6% year on year, and raised its FY27 earnings and sales guidance — then the stock fell from $114.30 to $103.84 on 8/20, down 9%. The market's objection was not the quarter but the rate of change: this was the slowest quarterly sales growth in more than six years, and Walmart trades on a multiple priced for defensive growth. When a valuation rests on steady acceleration, flattening the curve is enough to override a beat.", "url": "https://247wallst.com/investing/2026/08/21/walmart-beat-earnings-and-raised-guidance-so-why-did-the-stock-crash/", "stocks": [{"t": "WMT", "n": "沃爾瑪 8/20 跌約 9%，EPS 與指引都超預期，敗在六年最慢的銷售增速"}, {"t": "COST", "n": "好市多，同屬高本益比的防禦性零售，沃爾瑪的估值修正是它的參考座標"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "折扣店大勝", "color": "#E8786A", "zh": "同一週，折扣零售商 Ross Stores 交出完全相反的成績單：第二季營收年增 13% 到 63 億美元，同店銷售成長 10%，而且主要來自來客交易筆數增加而非單價上升；每股盈餘 1.32 美元，遠高於 1.16 美元的共識。在通膨還有 3.4%、油價每桶 94 美元的環境裡，消費者沒有不消費，只是換了地方消費。這一組對照——沃爾瑪放緩、Ross 加速——比任何一份消費者信心調查都更直接地說明了現在的家庭預算長什麼樣子。", "en": "In the same week, off-price retailer Ross Stores posted the mirror image: Q2 sales up 13% to $6.3 billion, comparable-store sales up 10% and driven mainly by higher transaction counts rather than higher tickets, with EPS of $1.32 against a $1.16 consensus. With inflation still at 3.4% and oil at $94 a barrel, consumers have not stopped spending — they have moved where they spend. The Walmart-slowing, Ross-accelerating pairing says more about the shape of household budgets right now than any confidence survey.", "url": "http://www.prnewswire.com/news-releases/ross-stores-reports-strong-second-quarter-sales-and-earnings-results-302856807.html", "stocks": [{"t": "ROST", "n": "Ross Stores Q2 營收 +13% 至 63 億、同店 +10%、EPS 1.32 遠超預估 1.16"}, {"t": "TJX", "n": "TJX 集團，全球最大折扣零售商，Ross 的成績等於幫它的模式背書"}, {"t": "BURL", "n": "Burlington，同屬折扣服飾通路，是這個題材裡彈性最大的中型股"}]},
    {"id": "earn_3", "channel": "財報速報", "tag": "消費分化", "color": "#E8786A", "zh": "零售財報週還有第二組對照。目標百貨第二季淨銷售 265 億美元、年增 5.3%，同店成長 3.8% 大幅擊敗 2.4% 的共識，其中實體店同店 +2.7%、數位同店 +8.7%、當日到貨成長超過 25%，公司順勢把全年營收成長指引從 4% 上修到 5%——過去半年多在價格、人力、店面標準與商品上的投入，開始被看見。家得寶則是另一種節奏：營收 479 億美元年增 5.7%、每股 4.79 美元，但同店只有 1.7%，動能來自小型修繕案而非大裝修。羅氏公司每股盈餘 4.40 美元優於預期。家庭願意花錢買日用與小物，還不願意動大工程。", "en": "The retail week produced a second contrast. Target posted Q2 net sales of $26.5 billion, up 5.3%, with comparable sales of 3.8% far ahead of the 2.4% consensus — store comps up 2.7%, digital comps up 8.7% and same-day delivery growing more than 25% — and lifted full-year sales growth guidance from 4% to 5%, as six to nine months of investment in price, labour, store standards and merchandise started to show. Home Depot ran to a different beat: sales of $47.9 billion up 5.7% and EPS of $4.79, but comps of only 1.7%, driven by smaller projects. Lowe's EPS of $4.40 beat. Households will spend on everyday goods and small jobs, not yet on big renovations.", "url": "https://www.stocktitan.net/news/TGT/target-corporation-reports-second-quarter-whi1a63iatnc.html", "stocks": [{"t": "TGT", "n": "目標百貨同店 +3.8% 遠優於預估 2.4%，全年營收指引由 4% 上修到 5%"}, {"t": "HD", "n": "家得寶營收 +5.7% 至 479 億、同店僅 +1.7%，需求集中在小型修繕"}, {"t": "LOW", "n": "羅氏公司每股 4.40 美元優於預期，與家得寶一起反映裝修需求偏冷"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "升息定價", "color": "#7C6AF7", "zh": "現在市場在爭論的不是聯準會什麼時候降息，而是會不會再升一碼。聯邦資金利率目前維持在 3.50% 至 3.75%，7 月 29 日會議按兵不動。到 8 月 20 日為止，CME FedWatch 顯示 9 月 16 日會議維持不動的機率約 68.4%，升息機率約 31.6%。這個數字一個月內來回擺盪很大：7 月油價急漲時升息押注一度衝高，8 月 7 日那份大幅低於預期的 7 月就業報告又把它壓下來。對股市而言，重點不在最後升不升，而在這個機率本身的波動度——它就是這幾週估值反覆的來源。", "en": "The debate is no longer when the Fed cuts but whether it hikes again. The federal funds target sits at 3.50% to 3.75% after the 29 July meeting left rates unchanged. As of 20 August, CME FedWatch put the odds of no change at the 16 September meeting at about 68.4%, implying roughly 31.6% for a hike. That number has swung hard within a month: July's oil surge pushed hike bets up, and the much weaker-than-expected July jobs report on 7 August pushed them back down. For equities the point is not the eventual decision but the volatility of the probability itself, which is exactly what has been whipping valuations around.", "url": "https://www.cnbc.com/2026/08/07/odds-the-fed-hikes-in-september-tumble-following-big-july-jobs-miss.html", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，升息機率一升一降，淨息差與債券部位評價跟著擺動"}, {"t": "XLF", "n": "金融類股 ETF，本週已進入相對強勢象限，是利率高檔的結構性受惠方"}, {"t": "TLT", "n": "長天期公債 ETF，9 月會議的機率變化直接反映在它的日內波動上"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "四十兆", "color": "#7C6AF7", "zh": "美國國債總額本週突破 40 兆美元，距離跨過 39 兆只隔了五個月。這個數字本身不會讓市場崩盤，但它解釋了為什麼財政部長貝森特要宣布至少加倍長天期公債的回購規模，也解釋了為什麼市場只給了這個政策一天的面子。真正的問題是供給：赤字要靠發債填、AI 資本支出熱潮又讓企業債供給同步放大，兩邊一起搶同一批長天期資金。當買方要求更高的補償，殖利率曲線的長端就自己站上去了，這跟聯準會的短端政策是兩件事。", "en": "US national debt crossed $40 trillion this week, five months after passing $39 trillion. The number alone does not break markets, but it explains why Treasury Secretary Bessent announced at least a doubling of long-dated buybacks, and why the market gave that policy exactly one day of credit. The real issue is supply: deficits are funded with issuance while the AI capital-spending boom is enlarging corporate bond supply at the same time, and both compete for the same pool of long-duration money. When buyers demand more compensation, the long end reprices on its own — a separate matter from what the Fed does at the short end.", "url": "https://www.cnn.com/2026/08/18/investing/global-bond-market", "stocks": [{"t": "GLD", "n": "黃金 ETF，債務規模與貨幣信用是這波三個月新高最常被引用的理由"}, {"t": "LQD", "n": "投資級公司債 ETF，企業債供給放大正在跟公債搶同一批長天期買盤"}, {"t": "IEF", "n": "中天期公債 ETF，短端與長端的分歧可以用它與 TLT 的相對表現來看"}]},
    {"id": "macro_3", "channel": "總經政策", "tag": "二次通膨", "color": "#7C6AF7", "zh": "通膨路徑是這一切的根。7 月消費者物價年增 3.4%（前值 3.5%）、月增 0.1%，核心年增 2.5%，完全符合共識——表面上是好消息。問題出在時間差：布蘭特原油從那之後一路漲到每桶 94 美元、柴油裂解價差 8 月 17 日創下每桶 102 美元的史上新高，這些成本要等幾個月才會流進物價指數。下週三（8/26）公布的 7 月核心 PCE，共識是月增 0.2%、年增維持 3.3%。真正要盯的是 9 月與 10 月那兩份數據，能源衝擊會不會在那裡現形。", "en": "Inflation is the root of all of it. July CPI rose 3.4% year on year (from 3.5%) and 0.1% on the month, with core at 2.5%, all in line with consensus — good news on the surface. The problem is the lag: Brent has since climbed to about $94 a barrel and the diesel crack spread set an all-time record of $102 a barrel on 17 August, costs that take months to reach the price index. Wednesday's July core PCE is expected at 0.2% monthly and an unchanged 3.3% annual. The readings that matter are September's and October's, when the energy shock either shows up or does not.", "url": "https://www.cmcmarkets.com/en-ie/news-and-analysis/the-week-ahead-us-pce-tokyo-cpi-nvidia-earnings", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，能源衝擊是否傳導到物價，會先反映在通膨補償上"}, {"t": "XOM", "n": "埃克森美孚，油價每桶 94 美元既是它的獲利來源，也是通膨的源頭"}, {"t": "XLP", "n": "必需消費類股 ETF，成本轉嫁能力是這一輪通膨中最直接的分水嶺"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "煉油暴利", "color": "#4EABA4", "zh": "柴油裂解價差 8 月 17 日衝上每桶 102.20 美元，是歷史上第一次突破三位數。正常情況下這個數字在 20 到 40 美元之間，2022 年俄烏戰爭時歐洲柴油最高也只到約 89 美元。推力有三個疊在一起：荷姆茲海峽封閉、煉廠罷工、以及俄羅斯的出口禁令，而釋出原油儲備解決不了成品油的缺口。美國三大獨立煉油商馬拉松石油、菲利普斯 66 與瓦萊羅單季合計獲利 126 億美元，是 2022 年以來最高，兩家的每桶煉油利潤翻倍以上。反方意見同樣值得聽：CNBC 引述歷史經驗指出，煉油股這種等級的漲勢通常維持不了太久。", "en": "The diesel crack spread hit $102.20 a barrel on 17 August, the first time in history it has cleared three digits. In normal conditions it trades between $20 and $40; even at the peak of the 2022 Russia-Ukraine shock, European diesel reached only about $89. Three forces are stacked: the closed Strait of Hormuz, refinery strikes and Russia's export ban — and releasing crude reserves does not fix a products shortage. Marathon Petroleum, Phillips 66 and Valero earned a combined $12.6 billion in the quarter, the most since 2022, with two of them more than doubling per-barrel margins. The counterargument deserves airtime: CNBC notes that runs of this magnitude in refining stocks historically do not last.", "url": "https://www.forbes.com/sites/garthfriesen/2026/07/23/refining-stocks-soar-as-crack-spread-hits-record-high-in-2026/", "stocks": [{"t": "VLO", "n": "瓦萊羅，第二季每桶煉油利潤翻倍以上，是純煉油曝險最直接的一檔"}, {"t": "MPC", "n": "馬拉松石油，三大煉油商合計單季獲利 126 億美元中的最大貢獻者"}, {"t": "PSX", "n": "菲利普斯 66，煉油＋中游組合，波動小於純煉油商"}, {"t": "DK", "n": "Delek US，中小型煉油商，高盛以自助措施帶動現金流為由上調至買進、目標 55 美元"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "油輪十倍", "color": "#4EABA4", "zh": "海運是這場地緣衝突裡數字最誇張的一塊。中東灣區到中國的超大型油輪（VLCC）日租金已經突破 52 萬美元，而平常區間是 2 萬到 6 萬美元——這是十倍以上的價格。荷姆茲海峽的商船通行量持續萎縮，8 月 10 日到 16 日只有 73 艘次，前一週還有 91 艘次。願意冒險穿越的船東變少，反而讓少數高風險營運商賺走溢價，而阿曼與富查伊拉外海的船對船轉運活動明顯增加。要注意的是：這種運價是事件驅動的，海峽一旦重新開放，回落速度會跟上漲一樣快。", "en": "Shipping is where this conflict produces the most extreme numbers. VLCC earnings on the Middle East Gulf to China route have passed $520,000 per day against a normal $20,000 to $60,000 range — more than tenfold. Traffic through Hormuz keeps shrinking, with 73 transits between 10 and 16 August versus 91 the week before. Fewer owners willing to make the passage means the few high-risk operators capture the premium, while ship-to-ship transfers off Oman and Fujairah have visibly increased. The caveat matters: these rates are event-driven, and if the strait reopens they will fall as fast as they rose.", "url": "https://www.lloydslistintelligence.com/resources/blog/strait-of-hormuz-brief-19-august-2026", "stocks": [{"t": "FRO", "n": "Frontline，VLCC 船隊規模居前，日租金 52 萬美元對它的槓桿最直接"}, {"t": "DHT", "n": "DHT Holdings，純 VLCC 業者，現貨曝險比例高"}, {"t": "INSW", "n": "International Seaways，原油與成品油雙船隊，兩邊運價都在高檔"}, {"t": "STNG", "n": "Scorpio Tankers，成品油輪為主，直接對應柴油短缺造成的繞道運距"}]},
    {"id": "sector_3", "channel": "產業風向", "tag": "科技內部分化", "color": "#4EABA4", "zh": "資訊科技類股本週跌超過 3%，是拖累大盤的主力，領跌的是半導體封測與連接元件——Amkor 五個交易日跌近 15%、Credo 跌 11%，Meta 同期跌近 7%。但同一個板塊裡，記憶體卻在寫另一個劇本：美光今年來已經漲 240%，BMO 資本以「延長版記憶體超級週期、供給持續緊繃」為由起始評等給予優於大盤、目標價 1,300 美元。換句話說，「科技股在跌」這句話今年已經失效了，真正在分化的是有沒有實體供給瓶頸——有瓶頸的漲價，沒瓶頸的被殺估值。", "en": "Information technology fell more than 3% this week and led the index lower, with semiconductor packaging and connectivity names at the bottom: Amkor down nearly 15% over five sessions, Credo down 11% and Meta down almost 7%. Inside the same sector, memory is running a different script — Micron is up 240% year to date, and BMO Capital initiated coverage at Outperform with a $1,300 target, citing a prolonged memory supercycle driven by constrained supply. The sentence tech stocks are falling has stopped being useful this year. What actually separates winners from losers is whether there is a physical supply bottleneck: with one you raise prices, without one your multiple gets cut.", "url": "https://www.morningstar.com/stocks/energy-industrials-stocks-take-lead-market-rotation-continues", "stocks": [{"t": "MU", "n": "美光今年來 +240%，BMO 起始評等優於大盤、目標價 1,300 美元"}, {"t": "AMKR", "n": "Amkor 封測廠，五個交易日跌近 15%，是本週科技股最大拖累之一"}, {"t": "CRDO", "n": "Credo 高速連接元件，同期跌 11%，AI 概念的估值先被修正"}, {"t": "SMH", "n": "半導體 ETF，內部分化劇烈時，指數本身反而看不出真實情況"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "小型股領先", "color": "#5B8ED6", "zh": "羅素 2000 指數週五收在 3,017.87 點，上漲 25.44 點約 0.9%，是全市場當天最強的一段。放大到今年，小型股指數上漲 23%，領先標普 500 足足 9.1 個百分點，是 2003 年以來最好的一年。這件事在一個「殖利率創 2007 年新高」的環境裡發生，反直覺得值得停下來想：教科書說高利率對小型股最不利，因為它們負債成本高、現金流短。但今年市場給的答案是，資金正在離開最擁擠的大型科技股，而小型股是它們的去處。", "en": "The Russell 2000 closed Friday at 3,017.87, up 25.44 points or about 0.9%, the strongest corner of the market that day. Zoom out and the small-cap index is up 23% this year, ahead of the S&P 500 by 9.1 percentage points and on track for its best year since 2003. That this is happening while yields sit at 2007 highs is counterintuitive enough to pause on: textbooks say high rates hurt small caps most, given their heavier debt costs and shorter cash flows. The market's answer this year is that money is leaving the most crowded large-cap technology names, and small caps are where it goes.", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週五收 3,017.87、+0.9%，今年來 +23%"}, {"t": "VTWO", "n": "Vanguard 羅素 2000 ETF，追蹤同一指數但費用率更低的版本"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "折價與陷阱", "color": "#5B8ED6", "zh": "小型股目前相對大型股有約 34% 的估值折價，這個數字常被拿來當作買進理由，但它需要一層修正才能用。羅素 2000 裡有相當比例的成分股是不賺錢的，指數的本益比因此被少數獲利公司撐著、失真嚴重；標普 600 小型股指數則要求成分股必須有正獲利紀錄才納入。同樣叫「小型股」，IWM 與 IJR 的體質差一大截。看到「折價 34%」時，先問一句：折的是誰的價——是一籃子會賺錢的公司，還是一籃子還在燒錢的公司。", "en": "Small caps currently trade at roughly a 34% valuation discount to large caps, a figure often used as a buy case but one that needs a correction before it is usable. A meaningful share of Russell 2000 constituents are unprofitable, so the index P/E is propped up by the minority that earn money and is badly distorted. The S&P SmallCap 600, by contrast, requires a record of positive earnings for inclusion. Same label, very different composition: IWM and IJR are not interchangeable. When you see a 34% discount, ask whose price is discounted — a basket of profitable companies, or a basket still burning cash.", "url": "https://247wallst.com/investing/2026/07/16/the-russell-2000-is-having-its-best-year-in-23-years-heres-why-small-caps-are-winning-again/", "stocks": [{"t": "IJR", "n": "標普 600 小型股 ETF，成分股需有正獲利紀錄，體質篩過一輪"}, {"t": "IWM", "n": "羅素 2000 ETF，不設獲利門檻，指數本益比容易失真"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "漲幅榜陷阱", "color": "#5B8ED6", "zh": "八月漲幅排行榜前三名分別是 RF Acquisition Corp II 上漲 423%、XHG 上漲 364%、USDE 上漲 331%，週五 RFAI 又單日跳升 356%。這種數字看起來像機會，實際上多半是流動性現象：這些標的流通股數少、成交量薄，幾筆買單就能把價格拉開，而同樣的薄度會在你要賣的時候反過來咬你。判讀小型股有個實用的先決條件——先看平均日成交金額，如果你打算投入的金額佔它日成交量的比例過高，這檔標的的「漲幅」對你就沒有意義。", "en": "August's top gainers were RF Acquisition Corp II up 423%, XHG up 364% and USDE up 331%, with RFAI jumping another 356% on Friday. Numbers like these look like opportunity but are usually a liquidity phenomenon: thin float, thin volume, a handful of orders moving the price a long way — and the same thinness bites back when you try to exit. A practical prerequisite for reading small caps is to check average daily dollar volume first. If the size you intend to deploy is a large fraction of that, the headline gain is not available to you.", "url": "https://www.stocktitan.net/rankings/stock-gains-monthly/2026/august", "stocks": [{"t": "RFAI", "n": "RF Acquisition Corp II，八月漲幅榜第一 +423%，典型薄流動性標的"}, {"t": "XHG", "n": "八月漲幅第二 +364%，同樣屬於低流通量的極端波動族群"}, {"t": "IWO", "n": "羅素 2000 成長型 ETF，用分散的方式參與小型股，避開單一標的流動性風險"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "訂單與虧損", "color": "#5B8ED6", "zh": "ERock 第二季營收 3,990 萬美元、季增 26%，其中電力系統銷售季增 67% 到 2,650 萬美元，帳上現金與受限現金 6.609 億美元、零負債。真正的重點在訂單：合約積壓金額來到 17 億美元，年增約十倍，其中包含 Anthropic 一筆 470 兆瓦的設備採購，把生產排程一路排到 2028 年。但同一季調整後 EBITDA 是負 1,400 萬美元、每股虧 0.06 美元，全年調整後 EBITDA 指引只有 300 萬到 900 萬美元。訂單能見度與當期損益之間的落差，就是這類 AI 電力小型股現在最大的估值爭議。", "en": "ERock posted Q2 revenue of $39.9 million, up 26% sequentially, with power system sales up 67% to $26.5 million, and ended the quarter with $660.9 million in cash and restricted cash and no debt. The story is the order book: contracted backlog reached $1.7 billion, up roughly tenfold year on year, including a 470 MW equipment order from Anthropic that extends production commitments into 2028. Yet adjusted EBITDA was negative $14 million with a loss of $0.06 per share, and full-year adjusted EBITDA guidance is only $3 million to $9 million. The gap between order visibility and current earnings is the central valuation argument for this whole class of AI-power small caps.", "url": "https://www.businesswire.com/news/home/20260811144024/en/ERock-Reports-Second-Quarter-2026-Results", "stocks": [{"t": "EROC", "n": "ERock，積壓訂單 17 億美元年增約十倍，但本季調整後 EBITDA 負 1,400 萬"}, {"t": "GEV", "n": "GE Vernova，同樣吃資料中心電力需求，是大型股的對照組"}, {"t": "PWR", "n": "Quanta Services，電網與電力建設承包商，訂單轉營收的節奏可作參考基準"}]},
    {"id": "small_5", "channel": "小型股風雲", "tag": "基建訂單", "color": "#5B8ED6", "zh": "水利與電力基建營造商 Shimmick 截至 7 月 3 日的積壓訂單約 9.91 億美元，是 2024 年第一季以來最高，另外還有 2.21 億美元的新得標案尚未入帳，主戰場是加州與德州的水利與電力工程。這類公司的迷人之處在於營收能見度：訂單簽下去就是未來幾季的營收基礎，比較不受消費者情緒或利率轉折影響。要留意的是營造業的老問題——毛利率。訂單多不等於賺錢，固定價格合約遇上材料與人工上漲時，積壓訂單反而會變成負擔。", "en": "Water and power infrastructure contractor Shimmick reported backlog of about $991 million as of 3 July, the highest since Q1 2024, plus $221 million of new awards not yet booked, concentrated in water and electrical work in California and Texas. The appeal of this business is revenue visibility: signed work is the base for coming quarters and is relatively insulated from consumer mood or interest-rate turns. The caveat is construction's perennial issue — gross margin. More orders is not the same as more profit, and when fixed-price contracts meet rising material and labour costs, backlog becomes a liability rather than an asset.", "url": "https://www.sec.gov/Archives/edgar/data/0001887944/000119312526342368/shim-ex99_1.htm", "stocks": [{"t": "SHIM", "n": "Shimmick 積壓訂單 9.91 億美元創兩年新高，另有 2.21 億新約待入帳"}, {"t": "PRIM", "n": "Primoris Services，同類基建營造商，規模較大、可作毛利率對照"}, {"t": "ROAD", "n": "Construction Partners，公路基建承包商，一樣吃聯邦與州政府預算"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "分拆孤兒", "color": "#C9A227", "status": "RADAR · 下一個驗證點 2026/11 Q3 財報", "zh": "Mobility Global 是 7 月 1 日從標普全球分拆出來的汽車資料與分析業務，旗下最有名的資產是二手車履歷平台 CARFAX。它為什麼被忽視：一比一分拆給標普全球股東，而標普全球的持股人多半是衝著評等與指數業務來的，拿到這批股票的第一個動作往往是賣掉；母公司市值 1,299 億美元，這個小孩沒人接手研究。什麼正在改變：第二季營收 4.68 億美元、有機成長 7%（CARFAX +8%、B2B +4%），調整後 EBITDA 2.02 億、利潤率 43%，並宣布首次季配息每股 0.06 美元。風險與反方論點：公司同時下修全年指引到 18.7 至 18.85 億美元，理由是 CARFAX 的市場進入策略沒有產生預期效果、美國以外的汽車活動偏軟，而且明確表示 2027 年初之前不會買回庫藏股——換句話說，這是一家利潤率很高但成長正在減速的公司，而分拆本身不會讓它變好。這是研究線索，不是投資建議。", "en": "Mobility Global was spun out of S&P Global on 1 July as its automotive data and analytics arm, with CARFAX as its best-known asset. Why it is ignored: the one-for-one distribution handed shares to S&P Global holders who own that stock for ratings and indices, and whose first instinct is to sell; the parent is a $130 billion company and nobody is picking up coverage of the child. What is changing: Q2 revenue of $468 million with 7% organic growth (CARFAX up 8%, B2B up 4%), adjusted EBITDA of $202 million at a 43% margin, and a first quarterly dividend of $0.06. Risks and the bear case: the company cut full-year guidance to $1.87-1.885 billion, blaming a CARFAX go-to-market approach that underdelivered and softer non-US automotive activity, and said no buybacks before early 2027. A high-margin business that is decelerating, and the spin-off alone does not fix that. A research lead, not investment advice.", "url": "https://www.investing.com/news/company-news/mobility-global-q2-2026-slides-7-revenue-growth-margins-hold-at-43-93CH-4846670", "stocks": [{"t": "MBGL", "n": "Mobility Global，Q2 營收 4.68 億、EBITDA 利潤率 43%，股價約 20.5 美元"}, {"t": "SPGI", "n": "標普全球，分拆母公司，這批股票的賣壓來源就是它的股東結構"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "內部人重押", "color": "#C9A227", "status": "RADAR · 下一個驗證點 2027 上半年 DENALI 整合期中數據", "zh": "Zentalis 是一家專攻 Cyclin E1 陽性、鉑類抗藥卵巢癌的小型生技公司，主力藥物 azenosertib。它為什麼被忽視：臨床期生技在利率高檔時是被市場整批放棄的族群，媒體聲量幾乎歸零。什麼正在改變：8 月 14 日，同時是董事與 10% 股東的 Walters Group 以每股 3.50 美元買進 433.5 萬股、金額 1,517 萬美元——這不是第一次，先前已有一筆 770 萬美元的買進，構成連續買進而非單筆事件。基本面上，6 月 30 日帳上現金與有價證券 1.746 億美元、現金可用到 2027 年底；DENALI 試驗 2a 與 2b 部分收案完成、2c 收案中，整合期中數據預計 2027 上半年；FDA 在 Type D 會議中對維持 400mg 單藥劑量沒有異議，並認可 Part 2 族群可能支持加速核准途徑。風險與反方論點：這是一家還在燒錢、沒有產品上市的公司，加速核准「可能」不等於「會」，而 2027 上半年的數據距離現在還有超過一年，中間任何一次收案或安全性意外都會直接改寫論點。這是研究線索，不是投資建議。", "en": "Zentalis is a small biotech focused on Cyclin E1-positive, platinum-resistant ovarian cancer, with azenosertib as its lead asset. Why it is ignored: clinical-stage biotech is a category the market abandons wholesale when rates are high, and media coverage is near zero. What is changing: on 14 August, Walters Group — both a director and a 10% owner — bought 4,335,000 shares at $3.50 for $15.17 million, following an earlier $7.7 million purchase, which makes this a repeat buyer rather than a one-off. On fundamentals, cash and marketable securities were $174.6 million at 30 June with runway into late 2027; DENALI Parts 2a and 2b have completed enrolment with 2c ongoing and an integrated topline readout expected in the first half of 2027; and after a Type D meeting the FDA raised no objection to the 400mg monotherapy dose and acknowledged Part 2 may support accelerated approval. Risks: this company burns cash with no marketed product, may is not will, and the readout is more than a year away. A research lead, not investment advice.", "url": "https://www.globenewswire.com/news-release/2026/08/06/3340744/0/en/zentalis-pharmaceuticals-reports-second-quarter-2026-financial-results-and-business-updates.html", "stocks": [{"t": "ZNTL", "n": "Zentalis，董事兼 10% 股東 8/14 以 3.50 美元買進 1,517 萬美元，帳上現金 1.746 億"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內驗證點", "color": "#C9A227", "status": "RADAR · 下一個驗證點 08/27（週四）財報", "zh": "Movado 是手錶與珠寶品牌集團，除了自有的 Movado 與 Ebel，還經營 Coach、Tommy Hilfiger、Lacoste、HUGO 與 2026 年 7 月 1 日生效的 Kate Spade 授權錶。這檔是本池 7 月 22 日就收進來的名字，重要的不是它今天漲跌，而是它的驗證點下週四就到了。要盯的三件事：第一，每股盈餘的回升是不是靠營收撐起來的（上一季 0.32 美元遠超 0.07 美元的預期，但那有一部分是基期效應）；第二，授權錶業務的營收與毛利貢獻，特別是新加入的 Kate Spade 系列；第三，管理層會不會給出 FY2027 的指引。風險與反方論點：股價約 38.5 美元、貼著 52 週高點 39.85，等於市場已經先把好消息買進去了，而 Kate Spade 首批系列要 2027 年春夏才上市，這一季根本看不到營收貢獻——真正的時間差在 FY2028。這是研究線索，不是投資建議。", "en": "Movado is a watch and jewellery group that owns Movado and Ebel and licenses Coach, Tommy Hilfiger, Lacoste, HUGO and, effective 1 July 2026, Kate Spade. It entered this pool on 22 July, and what matters today is not the price but that its verification point arrives next Thursday. Three things to watch: whether the EPS recovery is revenue-driven (last quarter's $0.32 versus a $0.07 estimate was partly a base effect); the revenue and margin contribution of the licensed watch business, especially the new Kate Spade line; and whether management issues FY2027 guidance. Risks: the stock at about $38.50 sits against a 52-week high of $39.85, meaning good news is already priced, and the first Kate Spade collection does not ship until spring/summer 2027, so this quarter shows nothing — the real lag runs to FY2028. A research lead, not investment advice.", "url": "https://stockanalysis.com/stocks/mov/statistics/", "stocks": [{"t": "MOV", "n": "Movado，8/27 財報是本池記錄的驗證點，股價約 38.5 貼近 52 週高 39.85"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "外部檢查沒過", "color": "#C9A227", "status": "RADAR · 下一個驗證點 09/16 FOMC 前後三十年期殖利率方向", "zh": "UMH Properties 是製造住宅（活動住宅社區）不動產信託，在美國中部與東部持有約 11,200 戶出租屋。這檔 8 月 14 日入池時附了一項外部檢查：三十年期公債殖利率會不會跟著短端一起下行。這一週答案很硬——三十年期不但沒降，還衝到 5.34% 的 2007 年以來最高，週五收在約 5.25%。這對 REIT 是雙重打擊：一邊是再融資成本，另一邊是估值——REIT 的資本化率跟長天期利率同向，長端不降，資產價值就撐不起來。營運面的三個驗證點不變：同店租金及相關收入增速能否守住 9%、出租率 95.3% 能否維持、1,140 萬美元的售屋收入是不是一次性。風險與反方論點：這個論點現在有一條腿是靠外部利率環境撐著，而那條腿本週明顯更弱了；如果 9/16 之後長端還是回不來，就該把它從「等待催化」改成「論點失效」。這是研究線索，不是投資建議。", "en": "UMH Properties is a manufactured-housing REIT with roughly 11,200 rental homes across the central and eastern US. When it entered the pool on 14 August it carried an external check: would the 30-year Treasury yield fall alongside the short end? This week's answer was emphatic — the 30-year did not fall, it hit 5.34%, the highest since 2007, closing Friday near 5.25%. That is a double hit for REITs: refinancing costs on one side, valuation on the other, since cap rates move with long-dated yields and asset values cannot hold up while the long end rises. The operating checks are unchanged: whether same-property rental and related income growth holds 9%, whether 95.3% occupancy is maintained, and whether $11.4 million of home-sales revenue was one-off. Risk: one leg of this thesis rests on the rate environment and that leg got visibly weaker. A research lead, not investment advice.", "url": "https://tradingeconomics.com/united-states/30-year-bond-yield", "stocks": [{"t": "UMH", "n": "UMH Properties，入池時的外部檢查是三十年期殖利率是否下行，本週答案是否定"}, {"t": "ELS", "n": "Equity LifeStyle，同屬製造住宅社區 REIT 的大型對照組，受同一利率壓力"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內新訂單", "color": "#C9A227", "status": "RADAR · 下一個驗證點 2026/11 Q3 財報的國防部門積壓訂單", "zh": "National Presto 是一家外表看起來很奇怪的公司：一邊賣壓力鍋與小家電，一邊透過子公司 AMTEC 與 Spectra 供應美軍 40 公釐彈藥與小直徑炸彈彈頭。它為什麼被忽視：家電這個外殼掩蓋了國防這個核心，媒體與分析師很少把它歸類到國防股裡。什麼正在改變：公司在 8 月 14 日申報，兩家國防子公司拿到合計 1.591 億美元的訂單——AMTEC 是五年期 40 公釐系統合約下的選擇權行使，Spectra 則是小直徑炸彈彈頭生產的分包案。對一家這種規模的公司來說，這個金額不是零頭。風險與反方論點：國防訂單來得快也走得穩定，但家電部門的營收衰退會持續稀釋整體成績，而且選擇權行使屬於既有合約的延續、不是新客戶新市場。真正要看的是 11 月財報裡國防部門的積壓訂單金額，以及家電到底還在往下走多深。這是研究線索，不是投資建議。", "en": "National Presto looks like an odd company: it sells pressure cookers and small appliances while its AMTEC and Spectra subsidiaries supply the US military with 40mm ammunition and small diameter bomb warheads. Why it is ignored: the appliance shell hides the defence core, and analysts rarely classify it as a defence name. What is changing: on 14 August the company disclosed $159.1 million of combined defence awards — AMTEC option exercises under its five-year 40mm systems contract and a Spectra subcontract for SDB warhead production. For a company this size that is not rounding error. Risks: defence orders arrive steadily but the shrinking appliance segment keeps diluting the result, and option exercises are continuations of existing contracts rather than new customers or markets. What matters is the defence backlog in the November report and how much further appliances fall. A research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0000080172/000143774926028014/npk20260814_8k.htm", "stocks": [{"t": "NPK", "n": "National Presto，8/14 申報國防子公司合計 1.591 億美元訂單"}, {"t": "KTOS", "n": "Kratos，總積壓訂單 20.84 億美元、年增約 47%，是國防小型股的對照組"}]},
    {"id": "radar_6", "channel": "忽視雷達", "tag": "金價順風", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Bilboes 約 6 億美元融資包的定案方式", "zh": "Caledonia Mining 是在辛巴威經營 Blanket 金礦的小型金礦商，在紐約與倫敦 AIM 雙掛牌。它為什麼被忽視：辛巴威的國家風險加上小市值，讓多數機構直接跳過，覆蓋幾乎為零。什麼正在改變：金價本週衝上每盎司 4,600 美元、創三個月新高、單週漲近 5%，直接推力是美國國債突破 40 兆美元帶來的貨幣信用疑慮。對一家全部產量都是黃金的小型礦商來說，金價每一次抬升都是等比例放大的營業槓桿。風險與反方論點：真正決定股東命運的不是金價，而是 Bilboes 專案那筆約 6 億美元融資包最後怎麼談——股權稀釋、舉債、還是黃金串流合約，三條路對現有股東的結果差非常多。另外還要看 2026 下半年產量能不能兌現「下半年權重較高」的說法、全年落在 72,000 至 76,500 盎司區間。這是研究線索，不是投資建議。", "en": "Caledonia Mining is a small gold producer operating the Blanket mine in Zimbabwe, dual-listed in New York and on London's AIM. Why it is ignored: Zimbabwean country risk plus a tiny market cap means most institutions skip it and coverage is close to zero. What is changing: gold pushed above $4,600 an ounce this week, a three-month high and up almost 5% on the week, driven by currency-credibility concerns after US debt passed $40 trillion. For a producer whose entire output is gold, every uplift in the metal is proportionally amplified operating leverage. Risks: what actually decides shareholder outcomes is not the gold price but how the roughly $600 million Bilboes financing package is structured — equity dilution, debt or a streaming deal produce very different results. Also watch whether second-half production delivers the promised weighting within the 72,000-76,500 ounce full-year range. A research lead, not investment advice.", "url": "https://finance.yahoo.com/markets/commodities/articles/gold-price-hits-3-month-160122945.html", "stocks": [{"t": "CMCL", "n": "Caledonia Mining，全部產量為黃金的小型礦商，金價每上一階都是等比放大"}, {"t": "GDXJ", "n": "初級金礦商 ETF，用來對照小型金礦股整體是否也跟著金價重評價"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "波克夏轉向", "color": "#6DB56D", "zh": "波克夏 8 月 14 日申報的第二季 13F 顯示，整體組合價值 2,993 億美元、共 29 檔持股。最大的一筆動作是 Alphabet：C 股持股增加超過七倍，A 股從 5,425 萬股加碼到 7,879 萬股、增幅 45%，Alphabet 一舉躍升為第四大持股、佔比 9.4%。同時加碼的還有達美航空、Lennar、梅西百貨與紐約時報；減碼的是美國銀行、DaVita、Kroger、Ally Financial 與第一資本。前五大持股依序是蘋果 22.0%、美國運通 17.1%、可口可樂 10.9%、Alphabet 9.4%、美國銀行 9.2%。判讀提醒：13F 有 45 天的時間差，這是 6 月 30 日的快照，公布時價格早就變了；而且它只揭露美股多頭部位，不揭露空頭、債券與海外持股。", "en": "Berkshire's Q2 13F, filed 14 August, showed a $299.3 billion portfolio across 29 positions. The headline move was Alphabet: the Class C stake grew more than sevenfold and the Class A holding rose from 54.25 million to 78.79 million shares, up 45%, taking Alphabet to the fourth-largest position at 9.4%. Delta Air Lines, Lennar, Macy's and the New York Times were also increased, while Bank of America, DaVita, Kroger, Ally Financial and Capital One were trimmed. The top five are Apple at 22.0%, American Express 17.1%, Coca-Cola 10.9%, Alphabet 9.4% and Bank of America 9.2%. Read with care: a 13F is a 45-day-lagged snapshot of 30 June, prices have long since moved, and it discloses only long US equity positions — not shorts, bonds or overseas holdings.", "url": "https://hedgefundalpha.com/news/q2-2026-13f-roundup/", "stocks": [{"t": "BRK.B", "n": "波克夏 B 股，第二季組合 2,993 億美元、29 檔持股"}, {"t": "GOOGL", "n": "Alphabet A 股從 5,425 萬加碼到 7,879 萬股，躍居第四大持股佔 9.4%"}, {"t": "DAL", "n": "達美航空，本季獲加碼，在油價每桶 94 美元的環境下是逆勢的一筆"}, {"t": "LEN", "n": "Lennar 建商，在三十年期殖利率創 2007 新高時被加碼，同樣是逆向操作"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "自家人買進", "color": "#6DB56D", "zh": "上週的內部人買單有幾筆值得記錄。EquipmentShare 的共同創辦人兼總裁 William Schlacks 在 8 月 14 日到 18 日之間分批於公開市場買進，價格區間 19.56 到 21.36 美元、合計 18.29 萬美元——這家公司今年 1 月才以每股 24.50 美元掛牌，等於創辦人在破發價買回自家股票，而且他同時是 IPO 揭露爭議訴訟的被告之一。Bakkt 董事 Michael Alfred 在 8 月 18 日以加權均價 7.12 美元買進 296,567 股、金額 211 萬美元。光是 8 月 17 日一天，市場就有 119 筆公開市場內部人交易申報。判讀提醒：金額的絕對值沒有意義，要看它相對於這位內部人薪酬的比例，以及有沒有第二個人跟進——單筆買進不構成訊號，群聚才是。", "en": "A few insider purchases from last week are worth recording. EquipmentShare co-founder and president William Schlacks bought on the open market between 14 and 18 August in a $19.56 to $21.36 range for a total of $182,884 — this company only listed in January at $24.50, so the founder is buying back below the IPO price, and he is also named as a defendant in litigation over IPO disclosures. Bakkt director Michael Alfred bought 296,567 shares on 18 August at a weighted average of $7.12, or $2.11 million. On 17 August alone there were 119 open-market insider transactions filed. Read with care: the absolute dollar figure means little; what matters is its size relative to that insider's compensation and whether a second insider follows. One purchase is not a signal — a cluster is.", "url": "https://www.bbae.com/blog/insideredge-top-sales-and-top-purchases-august-17-2026/", "stocks": [{"t": "EQPT", "n": "EquipmentShare，創辦人 8/14-18 於 19.56-21.36 美元買進 18.29 萬美元，低於 24.50 的 IPO 價"}, {"t": "BKKT", "n": "Bakkt，董事 8/18 以均價 7.12 美元買進 296,567 股、金額 211 萬美元"}, {"t": "AUGO", "n": "Aura Minerals，董事 8/17 買進 11,000 股、金額約 86.8 萬美元"}]},

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>

}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/22/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v8.3</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
