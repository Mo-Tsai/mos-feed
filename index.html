/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;
    --text-tertiary: #6b6863; --divider: #ddd9d1;
    --noise-opacity: 0.035;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  /* 鍵盤焦點:看得到目前在哪一顆 */
  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }
  .tab-nav button { background: none; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: Georgia, serif; transition: all 0.3s ease; padding: 0; line-height: 1.2; }
  .sub-pill { background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 0 4px; min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; white-space: nowrap; transition: all 0.2s ease; border-bottom: 1px solid transparent; }
  .swipe-area { position: relative; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .card-slide { position: absolute; inset: 0; padding: 16px 32px 96px; display: flex; flex-direction: column; justify-content: flex-start; transition: transform 0.3s ease, opacity 0.3s ease; will-change: transform, opacity; overflow-y: auto; }
  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }
  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }
  .source-link { position: relative; display: inline-block; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }
  .source-link:hover { color: var(--text-secondary); border-color: var(--text-secondary); }
  .end-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; height: 100%; }

  .theme-toggle { position: fixed; top: 12px; z-index: 100; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; font-size: 17px; color: var(--text-tertiary); padding: 0; line-height: 1; transition: color 0.3s ease; font-family: 'Courier New', monospace; }

  .icon-btn { background: none; border: none; cursor: pointer; color: var(--text-tertiary); min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; }

  .az-input { width:100%; background:var(--bg); border:1px solid var(--divider); color:var(--text); padding:9px 10px; font-family:'Courier New',monospace; font-size:12px; outline:none; -webkit-appearance:none; appearance:none; border-radius:0; }

  .nav-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; gap:4px; padding:8px 12px 12px; background:var(--bg); border-top:1px solid var(--divider); z-index:50; }
  .nav-btn { background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:16px; cursor:pointer; padding:10px 18px; min-height:44px; min-width:40px; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; line-height:1; }
  .nav-btn-icon { padding:10px 14px; font-size:14px; }

  .nav-btn:hover { border-color:var(--text-secondary); color:var(--text); }
  .nav-btn:active { background:var(--bg-elevated); }
  .nav-btn:disabled { opacity:0.3; cursor:default; border-color:var(--divider); color:var(--text-tertiary); }
  .nav-count { font-family:'Courier New',monospace; font-size:11px; letter-spacing:0.1em; color:var(--text-tertiary); text-transform:uppercase; white-space:nowrap; }

</style>

  {"id": "earn_0", "channel": "財報速報", "tag": "超微財報", "color": "#E8786A", "zh": "超微（AMD）週二盤後公布第三季：營收 133.8 億美元，年增 45%，資料中心營收 85.5 億美元，年增 97%；非 GAAP 每股盈餘 2.09 美元，高於預期的 1.94 美元，毛利率 56%。第四季營收指引約 170 億美元（上下 3%），中間值年增約 66%、季增約 27%。CNBC 標題寫盤後股價上漲約 8%，資料中心營收幾乎翻倍是這次最強的一項。", "en": "AMD reported Q3 after Tuesday's close: revenue of $13.38 billion, up 45%, with data-center revenue of $8.55 billion, up 97%; non-GAAP EPS of $2.09 versus the $1.94 estimate and a 56% gross margin. Q4 revenue guidance is about $17 billion, plus or minus 3%, implying roughly 66% year-over-year and 27% sequential growth at the midpoint. CNBC's headline put the after-hours gain near 8%, with nearly doubled data-center revenue the standout.", "url": "https://ir.amd.com/news-events/press-releases/detail/1303/amd-reports-third-quarter-2026-financial-results", "stocks": [{"t": "AMD", "n": "營收 +45%、資料中心 +97%，盤後約 +8%"}]},
  {"id": "earn_1", "channel": "財報速報", "tag": "網路設備", "color": "#E8786A", "zh": "Arista（ANET）週二盤後公布第三季：營收 36.6 億美元，年增 58.5%，是上市以來最高的年增率；非 GAAP 每股盈餘 1.20 美元，高於預期的 1.08 美元，毛利率 64.0%。第四季指引營收 39 億到 40 億美元、每股盈餘 1.26 至 1.30 美元，單季成長從 20.5% 放緩到約 7%。Yahoo 頁面引述的報導認為展望放緩，盤後股價反應我沒有查到確認數字。", "en": "Arista (ANET) reported Q3 after Tuesday's close: revenue of $3.66 billion, up 58.5%, its fastest growth since the IPO; non-GAAP EPS of $1.20 versus the $1.08 estimate and a 64.0% gross margin. Q4 guidance is revenue of $3.9–4.0 billion and EPS of $1.26–1.30, so sequential growth slows from 20.5% to about 7%. A report cited on Yahoo called the outlook a slowdown; I could not confirm the after-hours move.", "url": "https://www.sec.gov/Archives/edgar/data/0001596532/000159653226000252/ex991q326-earningsrelease.htm", "stocks": [{"t": "ANET", "n": "營收 +58.5%、每股盈餘 1.20 美元，第四季指引 39 億到 40 億美元"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "盤後重挫", "color": "#E8786A", "zh": "Amdocs（DOX）與 Skyworks（SWKS）都在週二盤後公布財報，盤後股價大跌。Amdocs 常規盤收 62.43 美元，盤後跌到約 43 美元，幅度約 -31%；Skyworks 收 85.40 美元，盤後約 72.31 美元，約 -15%。Skyworks 這次是合併 Qorvo 後的第一份財報。我查到的頁面只有標題與股價，沒有財報細節，所以不下原因判斷，請看兩家公司的財報全文與電話會議。", "en": "Amdocs (DOX) and Skyworks (SWKS) both reported after Tuesday's close and fell sharply in extended trading. Amdocs closed at $62.43 and traded near $43 after hours, about -31%; Skyworks closed at $85.40 and traded near $72.31, about -15%, in its first report after combining with Qorvo. The pages I could reach showed only headlines and prices, not the results, so I draw no conclusion on the cause; read each company's full release and call.", "url": "https://finance.yahoo.com/quote/DOX/", "stocks": [{"t": "DOX", "n": "盤後約 -31%，第四季財報（FY2026）"}, {"t": "SWKS", "n": "盤後約 -15%，合併 Qorvo 後首份財報"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "殖利率上行", "color": "#7C6AF7", "zh": "十年期美債殖利率週二升 5.8 個基點到 4.952%，距離 5% 只差 4.8 個基點，在股市反彈的同一天上行，代表市場並沒有因為選舉不確定而轉向避險債券。VIX 下降到 20.83。殖利率逼近 5% 對房貸、小型股和估值偏高的成長股都是壓力，這一關要看接下來的就業與通膨數據能不能讓升息預期降溫。", "en": "The 10-year Treasury yield rose 5.8 basis points to 4.952% on Tuesday, just 4.8 basis points shy of 5%, and it rose on a day when stocks rebounded, so investors did not flee to safe-haven bonds because of election uncertainty. The VIX eased to 20.83. A yield near 5% pressures mortgages, small caps and richly valued growth stocks; whether upcoming jobs and inflation data can cool rate-hike expectations is the test.", "url": "https://finance.yahoo.com/markets/stocks/", "stocks": [{"t": "TLT", "n": "20 年期以上美債 ETF，殖利率上行時價格承壓"}, {"t": "IWM", "n": "羅素 2000 ETF，對利率最敏感的指數之一"}, {"t": "KRE", "n": "區域銀行 ETF，受殖利率曲線影響"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "12 月升息", "color": "#7C6AF7", "zh": "聯準會 10/28 維持利率不變（有兩位委員主張升息），目前區間 3.75%–4.00%。12/9 是否再升一碼，各來源差異很大：前一天的整理約 75%，另一個部落格寫到 85% 左右，所以請把它當成「機率偏高」而不是精確數字，以 CME FedWatch 當天的數字為準。重點是升息預期還沒有退場，就業與通膨數據會直接改寫這個機率。", "en": "The Fed held rates on Oct 28 with two members preferring a hike, leaving the range at 3.75%–4.00%. Whether it hikes another quarter point on Dec 9 varies widely by source: roughly 75% in the prior day's roundup, around 85% in one blog, so treat it as 'likely' rather than a precise figure and check CME FedWatch on the day. The point is that hike expectations have not gone away, and jobs and inflation data can rewrite the odds directly.", "url": "https://www.noradarealestate.com/blog/interest-rates-hike-odds-december-2026-jump-85-after-feds-recent-decision/", "stocks": [{"t": "TLT", "n": "長天期美債 ETF，利率路徑的直接反映"}, {"t": "XLF", "n": "金融類股 ETF，升息對淨利差的影響"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "選舉與政策題材", "color": "#7C6AF7", "zh": "選舉日的盤面題材有兩條。一是 CNBC 與 Moby 等報導都點出，市場在等參議院開票，以評估財政、關稅與能源政策的方向；另一條是 AI 資料中心交易：報導提到德州選情可能對這個主題造成壓力。另外，房利美、房地美（FNMA、FMCC）因為 Bill Ackman 推動結束政府託管而上漲。這些都是題材與標題，開票結果出來前，沒有可靠的數字可以量化。", "en": "Two threads ran through Election Day trading. CNBC and Moby both noted that the market was waiting on the Senate count to gauge the direction of fiscal, tariff and energy policy; the other was the AI data-center trade, with a report saying Texas races could pressure it. Separately, Fannie Mae and Freddie Mac (FNMA, FMCC) rallied as Bill Ackman pushed to end conservatorship. These are themes and headlines; until results arrive there is nothing reliable to quantify.", "url": "https://www.cnbc.com/investing/", "stocks": [{"t": "FNMA", "n": "Ackman 推動結束託管，股價上漲"}, {"t": "FMCC", "n": "同上，政策題材"}, {"t": "SPY", "n": "標普 500 ETF，選後政策預期的整體反應"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "AI 硬體", "color": "#4EABA4", "zh": "週二盤後的財報把 AI 硬體需求推到前面：超微資料中心營收年增 97%、Arista 營收年增 58.5%、輝達上漲 3.74%，美超微（SMCI）常規盤收 31.39 美元（+3.12%），財報後盤後再漲約 8%，Yahoo 與 Investing.com 的標題都寫盈餘與展望優於預期。這一串數字的共同點是客戶端的資料中心支出沒有放緩。要留意的是殖利率逼近 5%，這類高估值股對利率很敏感。", "en": "Tuesday's after-the-bell reports put AI-hardware demand in front: AMD's data-center revenue rose 97%, Arista's revenue grew 58.5%, Nvidia gained 3.74%, and Super Micro (SMCI) closed at $31.39 (+3.12%) before rising about 8% after hours, with Yahoo and Investing.com headlines saying earnings and guidance beat estimates. The common thread is that customers' data-center spending has not slowed. The caution is that with yields near 5%, these richly valued stocks are rate-sensitive.", "url": "https://finance.yahoo.com/quote/SMCI/", "stocks": [{"t": "SMCI", "n": "常規盤 +3.12%，盤後約 +8%，財報優於預期"}, {"t": "NVDA", "n": "約 +3.74% 到 209.62 美元"}, {"t": "AMD", "n": "資料中心營收 +97%"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "非科技財報", "color": "#4EABA4", "zh": "科技以外的財報也在週二出爐：Shopify（SHOP）每股盈餘 0.49 美元，高於預期的 0.46 美元；輝瑞（PFE）0.87 美元，高於預期 0.74 美元，但股價仍下跌約 2%；Eaton（ETN）3.68 美元，高於 3.55 美元；ADM 1.77 美元，高於 1.60 美元；Apollo（APO）2.07 美元，低於預期 2.20 美元。同一天橫跨電商、製藥、電力設備、農產與資產管理，多數都過了預期，但股價反應不見得跟著。", "en": "Earnings outside tech also arrived on Tuesday: Shopify (SHOP) reported EPS of $0.49 versus $0.46 expected; Pfizer (PFE) $0.87 versus $0.74, yet shares fell about 2%; Eaton (ETN) $3.68 versus $3.55; ADM $1.77 versus $1.60; and Apollo (APO) $2.07, below the $2.20 estimate. Across e-commerce, pharma, electrical equipment, agriculture and asset management, most beat, but share-price reactions did not always follow.", "url": "https://finance.yahoo.com/calendar/earnings/", "stocks": [{"t": "PFE", "n": "每股盈餘 0.87 美元優於預期，股價約 -2%"}, {"t": "ETN", "n": "電力設備，每股盈餘 3.68 美元優於預期"}, {"t": "ADM", "n": "農產加工，每股盈餘 1.77 美元優於預期"}, {"t": "APO", "n": "資產管理，2.07 美元低於預期"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "礦工與算力", "color": "#4EABA4", "zh": "比特幣礦工與 AI 資料中心概念股週二大漲：Riot（RIOT）收 14.02 美元、上漲 18.4%，成交量約 3,970 萬股，是平均 1,870 萬股的兩倍多；Cipher Digital（CIFR）約 +20%，TeraWulf（WULF）約 +16%，IREN 約 +13%。標題把原因寫成「AI 資料中心股在目標價下修後反彈」，Riot 前一個月先跌了約 29%，所以這比較像超跌反彈而不是新趨勢，持續性要看後續成交量。", "en": "Bitcoin miners and AI data-center stocks jumped on Tuesday: Riot (RIOT) closed at $14.02, up 18.4% on volume of about 39.7 million shares, more than double its 18.7 million average; Cipher Digital (CIFR) rose about 20%, TeraWulf (WULF) about 16% and IREN about 13%. Headlines framed it as AI data-center stocks rebounding after a price-target selloff; Riot had fallen about 29% over the prior month, so this looks more like an oversold bounce than a new trend, and follow-through volume is the test.", "url": "https://finance.yahoo.com/quote/RIOT/", "stocks": [{"t": "RIOT", "n": "收 14.02 美元 +18.4%，量為平均兩倍多"}, {"t": "CIFR", "n": "約 +20%，AI 資料中心概念"}, {"t": "IREN", "n": "約 +13%"}, {"t": "WULF", "n": "約 +16%"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000", "color": "#5B8ED6", "zh": "羅素 2000 週二上漲 0.23% 收 2,812.45，那斯達克漲 0.83%、道瓊跌 0.38%。週一小型股相對抗跌，週二反而沒跟上科技反彈，指數落在兩者之間。殖利率升到 4.952% 對小型股是逆風，因為它們更依賴浮動利率貸款，所以 2,800 點附近的整理要看十年期能不能守在 5% 以下。", "en": "The Russell 2000 gained 0.23% on Tuesday to 2,812.45, between the Nasdaq's +0.83% and the Dow's -0.38%. Small caps held up better on Monday but did not keep pace with Tuesday's tech rebound. A 4.952% 10-year yield is a headwind for small caps, which lean more on floating-rate debt, so consolidation near 2,800 hinges on whether the 10-year holds under 5%.", "url": "https://finance.yahoo.com/markets/stocks/", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週二約 +0.23%"}, {"t": "IJR", "n": "標普小型股 600 ETF，要求獲利，與羅素 2000 組成不同"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "Aehr 三倍", "color": "#5B8ED6", "zh": "晶片測試設備商 Aehr Test（AEHR）公布 2027 會計年度第一季：營收創紀錄 3,301 萬美元，全年營收展望上調到 1.5 億美元，約為上一年度的三倍，訂單 4,670 萬美元。股價週二常規盤收 65.11 美元、上漲 26.5%，盤後再漲一些。有意思的是 Lake Street 雖維持買進，卻把目標價從 110 美元降到 90 美元；股價大漲、目標價卻下修，代表市場追價的速度比分析師調整的速度快。", "en": "Chip-test equipment maker Aehr Test (AEHR) reported fiscal Q1 2027: record revenue of $33.0 million, a full-year revenue outlook raised to $150 million, about triple last year, and bookings of $46.7 million. Shares closed at $65.11 on Tuesday, up 26.5%, and rose a bit more after hours. Notably, Lake Street kept a Buy rating but cut its target from $110 to $90; the stock jumped while the target fell, meaning buyers moved faster than analysts adjusted.", "url": "https://finance.yahoo.com/quote/AEHR/", "stocks": [{"t": "AEHR", "n": "營收 3,301 萬美元、全年展望 1.5 億美元，收 +26.5%"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "Shoals 前夕", "color": "#5B8ED6", "zh": "太陽能電廠電氣設備商 Shoals（SHLS）週二收 8.47 美元、上漲 11.45%，市值約 14 億美元，Q3 財報電話會議安排在 11/4。上一季（Q2）營收 1.634 億美元、盈餘 1,214 萬美元；股價五年下跌約 72%，JPMorgan 10/19 把目標價從 13 美元降到 12 美元，但仍維持加碼。財報前一天先漲 11%，要看明天的訂單與展望能不能支撐這個反彈。", "en": "Solar-plant electrical-equipment maker Shoals (SHLS) closed Tuesday at $8.47, up 11.45%, for a market cap of about $1.4 billion, ahead of its Q3 call on Nov 4. Q2 revenue was $163.4 million with earnings of $12.1 million; the stock is down roughly 72% over five years, and JPMorgan on Oct 19 cut its target from $13 to $12 while keeping an Overweight rating. Rising 11% the day before results means tomorrow's orders and outlook must support the bounce.", "url": "https://finance.yahoo.com/quote/SHLS/", "stocks": [{"t": "SHLS", "n": "收 8.47 美元 +11.45%，11/4 財報電話會議"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "看量能", "color": "#5B8ED6", "zh": "小型股單日大漲，先看成交量和反應是否有基本面支撐。例如 Graphic Packaging（GPK）週二收 11.31 美元、上漲 21.2%，成交量約 2,270 萬股，是平均 630 萬股的三倍多，但分析師平均目標價 10.95 美元反而低於股價，Zacks 評等也偏空。量放大加上價格已超過目標價，代表這波是資金面推動的反應；後面股價要不要續漲，看下一份展望與合約調整的進度。", "en": "When a small cap jumps in a day, check volume and whether fundamentals support it. Graphic Packaging (GPK) closed Tuesday at $11.31, up 21.2%, on about 22.7 million shares, more than triple its 6.3 million average, yet the average analyst target of $10.95 sits below the price and Zacks leans bearish. Heavy volume with price already above targets suggests flows drove the move; whether it extends depends on the next outlook and progress on contract repricing.", "url": "https://finance.yahoo.com/quote/GPK/", "stocks": [{"t": "GPK", "n": "收 11.31 美元 +21.2%，量為平均三倍多"}, {"t": "IWM", "n": "羅素 2000 ETF，小型股整體"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "Xponential", "color": "#5B8ED6", "zh": "精品健身加盟平台 Xponential Fitness（XPOF）週二收 4.55 美元、下跌 4.8%，市值約 2.25 億美元，今年來下跌約 45%，Q3 財報安排在 11/5 盤後。頁面上有一則「傳出收購報價而股價上漲」的標題（約四天前），但沒有細節，可信度要查原文。上一季（Q2）營收 6,597 萬美元、虧損 414 萬美元，並曾調降展望；財報前傳出收購消息又回吐，波動會很大。", "en": "Boutique fitness franchisor Xponential Fitness (XPOF) closed Tuesday at $4.55, down 4.8%, for a market cap of about $225 million and a year-to-date loss of roughly 45%, with Q3 results due Nov 5 after the close. A headline from about four days ago said shares jumped on reports of a takeover bid, but no details were shown, so check the original. Q2 revenue was $65.97 million with a $4.14 million loss and guidance had been cut; takeover chatter fading just before results points to large swings.", "url": "https://finance.yahoo.com/quote/XPOF/", "stocks": [{"t": "XPOF", "n": "收 4.55 美元 -4.8%，11/5 財報"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "Starz 內部人", "color": "#C9A227", "zh": "Starz Entertainment（STRZ）是在美國與加拿大賣付費影視頻道與串流的公司，市值約 4 億美元。11/2 有三位內部人在公開市場買進：執行長 Jeffrey Hirsch 5,000 股（約 11 萬美元）、財務長 Scott Macdonald 2,500 股（約 5.6 萬美元）、另一位內部人 460 股，來源是 MarketBeat 彙整。同一季（9/30）營收 3.224 億美元、優於預期，但淨損 3,480 萬美元。風險是仍在虧損、串流是競爭激烈的市場，52 週區間 8.40 到 32.58 美元代表股價波動大。以上是研究線索，不是投資建議。", "en": "Starz Entertainment (STRZ) sells premium video channels and streaming in the US and Canada, with a market cap near $400 million. On Nov 2 three insiders bought in the open market: CEO Jeffrey Hirsch 5,000 shares (about $111,000), CFO Scott Macdonald 2,500 shares (about $55,600) and another insider 460 shares, per MarketBeat. Q3 (Sept 30) revenue of $322.4 million topped estimates but the company lost $34.8 million. Risks: continuing losses and a crowded streaming market; the 52-week range of $8.40–$32.58 shows how volatile it is. This is a research lead, not investment advice.", "url": "https://www.marketbeat.com/insider-trades/", "stocks": [{"t": "STRZ", "n": "CEO、CFO 11/2 買進，市值約 4 億美元，收 23.36 美元"}], "status": "RADAR · 下一個驗證點：Form 4 原文與下次財報的虧損收斂"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "TRTX 折價", "color": "#C9A227", "zh": "TPG RE Finance Trust（TRTX）是紐約的商用不動產放款機構，主要做第一順位商辦與多戶住宅貸款，市值約 5.2 億美元。10/30 兩位董事在公開市場買進：Michael Smith 5,000 股（約 3.3 萬美元）、Michael Gillmore 2,000 股（約 1.3 萬美元）。Yahoo 顯示股價淨值比約 0.48、股息殖利率約 14%。Q3 營收與盈餘低於預期，Wells Fargo 10/28 把目標價從 9 美元降到 8 美元。風險是商辦放款的違約與減損、買進金額偏小。以上是研究線索，不是投資建議。", "en": "TPG RE Finance Trust (TRTX) is a New York commercial real estate lender focused on first-mortgage loans, with a market cap near $520 million. On Oct 30 two directors bought in the open market: Michael Smith 5,000 shares (about $32,600) and Michael Gillmore 2,000 shares (about $12,900). Yahoo shows a price-to-book of about 0.48 and a dividend yield near 14%. Q3 revenue and earnings missed estimates and Wells Fargo cut its target from $9 to $8 on Oct 28. Risks: office-loan defaults and impairments, and the purchases are small. This is a research lead, not investment advice.", "url": "https://finance.yahoo.com/quote/TRTX/", "stocks": [{"t": "TRTX", "n": "兩位董事 10/30 買進，股價淨值比約 0.48，收 6.81 美元"}], "status": "RADAR · 下一個驗證點：下一季信用損失準備與股息是否維持"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "Adtran 回鍋", "color": "#C9A227", "zh": "Adtran（ADTN）已在雷達池，上次標的是財報前夕。11/3 公布第三季：營收 2.8117 億美元，股價當天收 5.06 美元，下跌 19.4%，成交量約 439 萬股，是平均 174 萬股的 2.5 倍。Needham 維持買進，但把目標價從 14 美元降到 9 美元。我查到的頁面沒有 EPS 與指引細節，因此不判斷是財報本身還是展望造成，新證據反而偏負面。風險是營運仍虧損（過去十二個月每股虧損 0.28 美元）。以上是研究線索，不是投資建議。", "en": "Adtran (ADTN) is already in the radar pool; the last card was a pre-earnings look. It reported Q3 on Nov 3 with revenue of $281.17 million, and shares closed at $5.06, down 19.4%, on about 4.39 million shares, 2.5 times the 1.74 million average. Needham kept a Buy rating but cut its target from $14 to $9. The pages I reached did not show EPS or guidance, so I cannot say whether results or the outlook drove it; the new evidence leans negative. Risk: still unprofitable, with trailing EPS of -$0.28. This is a research lead, not investment advice.", "url": "https://finance.yahoo.com/quote/ADTN/", "stocks": [{"t": "ADTN", "n": "Q3 營收 2.8117 億美元，股價 -19.4% 收 5.06 美元"}], "status": "RADAR · 下一個驗證點：指引細節、10-Q 與是否有內部人買進"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "Fluence 換帥", "color": "#C9A227", "zh": "Fluence Energy（FLNC）已在雷達池，是電池儲能系統供應商。現況是壞消息很多：公司更換執行長與財務長，股價今年來下跌約 72%，Goldman 11/3 把目標價從 9 美元降到 7 美元，但同一天收 5.50 美元、上漲 5.6%。上一季營收 6.4985 億美元、淨損 3,282 萬美元，現金 3.39 億美元，下一次財報約 11/23。新證據偏弱，最多算「價格已很低、等管理層重整的結果」，不是拐點確認。以上是研究線索，不是投資建議。", "en": "Fluence Energy (FLNC) is already in the radar pool as a battery-storage system supplier. There is a lot of bad news: the company replaced its CEO and CFO, shares are down about 72% this year and Goldman cut its target from $9 to $7 on Nov 3, yet the stock closed at $5.50, up 5.6%. Last quarter revenue was $649.85 million with a $32.8 million net loss and $339 million of cash; the next report is around Nov 23. The new evidence is weak: at best the price is low while management reshuffles, not a confirmed inflection. This is a research lead, not investment advice.", "url": "https://finance.yahoo.com/quote/FLNC/", "stocks": [{"t": "FLNC", "n": "換執行長與財務長，今年來約 -72%，收 5.50 美元"}], "status": "RADAR · 下一個驗證點：11/23 左右財報的訂單與現金燃燒"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "AXT 回鍋", "color": "#C9A227", "zh": "AXT（AXTI）已在雷達池，做磷化銦與砷化鎵半導體基板。第三季營收 7,341 萬美元、盈餘 2,572 萬美元，Zacks 標題寫營收與盈餘優於預期；股價週二收 51.33 美元、上漲 6.5%。過去一年漲約 507%，但近一個月下跌約 40%、52 週高點 143.16 美元，所以已不是沒人看的名字，分析師平均目標價 91.60 美元。這張回鍋卡主要是追蹤：高波動、市值約 34 億美元，基本面有數字、價格大幅震盪。以上是研究線索，不是投資建議。", "en": "AXT (AXTI) is already in the radar pool; it makes indium-phosphide and gallium-arsenide semiconductor substrates. Q3 revenue was $73.41 million with earnings of $25.72 million, and Zacks headlines said both beat estimates; the stock closed Tuesday at $51.33, up 6.5%. It is up about 507% over a year but down about 40% over a month and well below its $143.16 52-week high, and with an average target of $91.60 it is no longer an unwatched name. This is a tracking card: a market cap near $3.4 billion, real numbers and violent price swings. This is a research lead, not investment advice.", "url": "https://finance.yahoo.com/quote/AXTI/", "stocks": [{"t": "AXTI", "n": "Q3 營收 7,341 萬美元，收 51.33 美元，一個月約 -40%"}], "status": "RADAR · 下一個驗證點：下一季指引與客戶集中度"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "XPOF 回鍋", "color": "#C9A227", "zh": "Xponential Fitness（XPOF）已在雷達池，是 Club Pilates、CycleBar 等精品健身的加盟平台，市值約 2.25 億美元，今年來下跌約 45%。11/5 盤後公布 Q3，上一季曾轉為虧損並調降展望，UBS 9/16 把目標價從 7 美元降到 4.50 美元，新任財務長 Jennifer Ryu 近一個月上任。近日有「傳出收購報價」的標題，但頁面沒有細節。風險是虧損、債務與加盟店健康度，11/5 的財報是下一個驗證點。以上是研究線索，不是投資建議。", "en": "Xponential Fitness (XPOF) is already in the radar pool; it franchises boutique fitness brands such as Club Pilates and CycleBar, with a market cap near $225 million and a year-to-date loss of about 45%. It reports Q3 after the close on Nov 5; last quarter it swung to a loss and cut guidance, UBS cut its target from $7 to $4.50 on Sept 16, and new CFO Jennifer Ryu started within the past month. A recent headline mentions a takeover bid report but the page gives no details. Risks: losses, debt and franchise health; the Nov 5 report is the next test. This is a research lead, not investment advice.", "url": "https://finance.yahoo.com/quote/XPOF/", "stocks": [{"t": "XPOF", "n": "收 4.55 美元，今年來約 -45%，11/5 財報"}], "status": "RADAR · 下一個驗證點：11/5 財報與收購傳聞是否有下文"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "MGM 大買", "color": "#6DB56D", "zh": "MGM Resorts（MGM）董事 Keith Meister 10/30 在公開市場買進 1,738,074 股，均價約 29.64 美元，金額約 5,150 萬美元，11/2 又買 7,518 股（約 22.7 萬美元），來源是 MarketBeat 彙整。MGM 第三季營收 42.1 億美元、淨損 1,711 萬美元，報導指拉斯維加斯表現偏弱；股價週二收 31.02 美元，今年來下跌約 15%。這是少見的大額自掏腰包，但要用 EDGAR Form 4 對照是否為其公司持股的調整，不等於買進訊號。", "en": "MGM Resorts (MGM) director Keith Meister bought 1,738,074 shares in the open market on Oct 30 at about $29.64, roughly $51.5 million, and another 7,518 shares (about $227,000) on Nov 2, per MarketBeat. Q3 revenue was $4.21 billion with a $17.1 million net loss, and headlines pointed to weak Las Vegas results; the stock closed Tuesday at $31.02, down about 15% this year. It is a rare large purchase with his own money, but check the Form 4 on EDGAR and note it is not a buy signal by itself.", "url": "https://www.marketbeat.com/insider-trades/", "stocks": [{"t": "MGM", "n": "董事 Meister 10/30 買約 5,150 萬美元，收 31.02 美元"}]},
  {"id": "insider_1", "channel": "內部人動向", "tag": "LKQ 雙董事", "color": "#6DB56D", "zh": "汽車零件分銷商 LKQ 在一週內有兩位董事買進：Andrew Clarke 10/30 買 21,800 股，均價約 18.35 美元（約 40 萬美元）；Michael Powell 11/2 買 10,000 股，均價約 19.15 美元（約 19 萬美元）。兩人價差約 4%，第二位在更高價追買。兩筆合計約 59 萬美元，算是群聚買進的起點，但只有兩個人、時間在財報後，仍要看是否有第三位跟進與 Form 4 細節。", "en": "Auto-parts distributor LKQ had two directors buy within a week: Andrew Clarke bought 21,800 shares on Oct 30 at about $18.35 (roughly $400,000), and Michael Powell bought 10,000 shares on Nov 2 at about $19.15 (roughly $191,500). The second buyer paid about 4% more. Together about $590,000, it is the beginning of a cluster, but with only two people it needs a third buyer and Form 4 details to confirm.", "url": "https://www.marketbeat.com/insider-trades/", "stocks": [{"t": "LKQ", "n": "兩位董事 10/30、11/2 買進，合計約 59 萬美元"}]},
  {"id": "insider_2", "channel": "內部人動向", "tag": "金額差很大", "color": "#6DB56D", "zh": "同一份彙整裡的買進金額差距可以到一百倍以上：Caterpillar（CAT）董事 James Fish 11/2 買 1,000 股，約 62 萬美元；First Financial Bankshares（FFIN）董事 Murray Edwards 10/30 買 800 股，約 2.4 萬美元；Community Bancorp（CMTV）執行長 11/3 買 500 股，約 2.1 萬美元。小額買進常是象徵性表態，金額大不大要和這個人的持股與薪酬比。彙整頁面被截斷，名單可能不完整。", "en": "Purchase sizes in the same roundup differ by more than a hundredfold: Caterpillar (CAT) director James Fish bought 1,000 shares on Nov 2 for about $620,000; First Financial Bankshares (FFIN) director Murray Edwards bought 800 shares on Oct 30 for about $24,000; and Community Bancorp (CMTV) CEO bought 500 shares on Nov 3 for about $21,000. Small buys are often symbolic, and what counts as large depends on the person's holdings and pay. The roundup page was truncated, so the list may be incomplete.", "url": "https://www.marketbeat.com/insider-trades/", "stocks": [{"t": "CAT", "n": "董事 Fish 11/2 買約 62 萬美元"}, {"t": "FFIN", "n": "董事 Edwards 10/30 買約 2.4 萬美元"}, {"t": "CMTV", "n": "執行長 11/3 買約 2.1 萬美元"}]},
  {"id": "capitol_0", "channel": "政要持股", "tag": "次數與金額", "color": "#B5654D", "zh": "判讀政要交易有一個常見誤解：交易次數多不代表部位大。Quiver 的「過去一年最活躍」清單裡，Ro Khanna 有 4,079 筆交易、估計金額約 6,220 萬美元；Nancy Pelosi 只有 26 筆，估計金額約 6,100 萬美元，兩人金額差不多、筆數差約 150 倍。參議員 Alan Armstrong 有 370 筆、約 2,180 萬美元。這是第三方的估計值，用的是申報區間，頻道只記錄「誰申報了什麼」，不是買賣建議。", "en": "A common misreading of congressional trades is that more trades mean bigger positions. In Quiver's most-active list for the past year, Ro Khanna has 4,079 trades with an estimated volume of about $62.2 million, while Nancy Pelosi has only 26 trades at about $61.0 million, similar dollars on roughly 150 times fewer trades. Senator Alan Armstrong shows 370 trades, about $21.8 million. These are third-party estimates built from disclosure ranges; this channel records who filed what, not trading advice.", "url": "https://www.quiverquant.com/congresstrading/", "stocks": [{"t": "SPY", "n": "Quiver 清單的參照基準 ETF"}, {"t": "NANC", "n": "追蹤民主黨議員持股的 ETF"}, {"t": "GOP", "n": "追蹤共和黨議員持股的 ETF"}]},
  {"id": "capitol_1", "channel": "政要持股", "tag": "判讀時限", "color": "#B5654D", "zh": "判讀政要申報要先記一個時限：議員交易後要在 30 天內得知、45 天內申報（STOCK Act），所以公開時距離實際交易最多可以隔一個半月。例如眾議員 Lisa McClain 9/14 買進 CACI，10/12 才公開，隔了 28 天；眾議員 Maria Elvira Salazar 賣出思科的申報日期是 10/7。看到「剛揭露」的交易，買到的人是在跟別人幾週前的價位，不是即時訊號。這頻道只記錄「誰申報了什麼」，不是買賣建議，也不暗示任何人有內線資訊。", "en": "Read congressional filings with one deadline in mind: members must be notified of a trade within 30 days and file within 45 days under the STOCK Act, so a disclosure can arrive up to a month and a half after the actual trade. For example, Rep. Lisa McClain bought CACI on Sept 14 and it was disclosed on Oct 12, 28 days later, and Rep. Maria Elvira Salazar's Cisco sale was reported on Oct 7. Someone acting on a just-disclosed trade is following prices set weeks earlier, not a live signal. This channel records who filed what, not trading advice, and implies nothing about anyone having inside information.", "url": "https://www.disclosedcapitol.com/glossary/periodic-transaction-report", "stocks": [{"t": "CACI", "n": "McClain 9/14 買進、10/12 公開，隔 28 天"}, {"t": "CSCO", "n": "Salazar 賣出，申報日期 10/7"}]},
  {"id": "week_0", "channel": "本週事件", "tag": "選後數據", "color": "#C97DD4", "zh": "接下來三件事：一是選舉結果出爐後，財政、關稅、能源政策的預期會被重新定價，參議院開票是市場最在意的部分；二是 11/4（週三）預定有 ISM 服務業指數，日期在我查到的頁面上標示為暫定；三是就業數據預計本週五 11/6 公布，確切時間以 BLS 為準，它會直接影響 12/9 是否再升息。三件事都沒有已知答案，所以本週波動預期偏高。", "en": "Three things ahead: first, once election results arrive, expectations on fiscal, tariff and energy policy will be repriced, with the Senate count what the market cares most about; second, the ISM services index is scheduled for Wednesday, Nov 4, a date marked provisional on the page I found; third, jobs data is expected Friday, Nov 6, with the exact timing per the BLS, and it bears directly on whether the Fed hikes again on Dec 9. None has a known answer, so expect elevated volatility this week.", "url": "https://www.cnbc.com/investing/", "stocks": [{"t": "SPY", "n": "標普 500 ETF，選舉與就業數據的整體反應"}, {"t": "TLT", "n": "長天期美債 ETF，數據與升息預期的反應"}]},
  {"id": "week_1", "channel": "本週事件", "tag": "財報密集", "color": "#C97DD4", "zh": "本週財報密集：Yahoo 日曆顯示 11/4 有 484 家、11/5 有 615 家、11/6 有 86 家公布。已知的幾件：Uber（UBER）11/4 盤前，焦點是獲利、自駕車與 Delivery Hero 收購期限（取自前日整理，開盤前請再對一次）；Shoals（SHLS）11/4 的 Q3 電話會議；Xponential Fitness（XPOF）11/5 盤後。我沒有查到完整的重點公司名單，要看個股請以公司公告為準。", "en": "Earnings are dense this week: Yahoo's calendar shows 484 reports on Nov 4, 615 on Nov 5 and 86 on Nov 6. Known items: Uber (UBER) before the open on Nov 4, with focus on profit, autonomous vehicles and the Delivery Hero deadline (from the prior day's roundup, so re-check before the open); Shoals (SHLS) holds its Q3 call on Nov 4; and Xponential Fitness (XPOF) reports after the close on Nov 5. I could not retrieve a full list of key names, so rely on company announcements for specifics.", "url": "https://finance.yahoo.com/calendar/earnings/", "stocks": [{"t": "UBER", "n": "11/4 盤前，Delivery Hero 收購期限"}, {"t": "SHLS", "n": "11/4 Q3 電話會議"}, {"t": "XPOF", "n": "11/5 盤後財報"}]},
  {"id": "eval_0", "channel": "今日評估", "tag": "AI 受惠分界", "color": "#E8A838", "zh": "今天最值得注意的一件事：同一個晚上，AI 硬體受惠者與其他公司被拉開。超微資料中心營收年增 97%、Arista 營收年增 58.5%、Aehr 全年展望上調到三倍，而 Amdocs 與 Skyworks 盤後各跌約 31% 與 15%，蘋果與帕蘭泰爾當天也走弱。原因我只確定前面一半，後面兩家要看財報全文。問題是：這是 AI 需求真的集中在少數公司，還是十年期殖利率逼近 5% 後，市場只願意為最確定的成長付高價？", "en": "The most notable thing today: the same evening split AI-hardware beneficiaries from everyone else. AMD's data-center revenue rose 97%, Arista's revenue grew 58.5% and Aehr tripled its full-year outlook, while Amdocs and Skyworks fell about 31% and 15% after hours, and Apple and Palantir weakened on the day. I am sure of the first half; the last two need their full releases. The question: is AI demand truly concentrating in a few companies, or, with the 10-year yield near 5%, will the market pay up only for the most certain growth?", "url": "https://finance.yahoo.com/markets/stocks/", "stocks": [{"t": "AMD", "n": "資料中心營收 +97%，盤後約 +8%"}, {"t": "DOX", "n": "盤後約 -31%，原因待查"}]}
