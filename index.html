<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "連三日收黑", "color": "#E05C5C", "zh": "週二（9/29）美股三大指數再收黑，但跌幅明顯收斂。道瓊跌 131.59 點、以 0.26% 收在 51,349.92 點；標普 500 跌 0.16% 收 7,670.84；那斯達克只跌 0.09% 收 26,797.54。主因還是同一件事：美債殖利率又往上刷新多年高點，把股票的相對吸引力壓下來。值得注意的是三個指數的跌幅一日比一日小，代表賣壓是「不情願的調整」而不是恐慌出逃。", "en": "US stocks fell for a third straight session on Tuesday, Sept 29, but the losses narrowed sharply. The Dow slipped 131.59 points, or 0.26%, to 51,349.92; the S&P 500 eased 0.16% to 7,670.84; the Nasdaq Composite gave up just 0.09% to 26,797.54. The driver was unchanged: Treasury yields pushed to fresh multiyear highs, eroding the relative appeal of equities. Notably the daily declines keep shrinking, suggesting reluctant repricing rather than panic selling.", "url": "https://www.cnbc.com/2026/09/28/stock-market-today-live-updates.html", "stocks": [{"t": "DIA", "n": "追蹤道瓊的 ETF，對應指數收 51,349.92、單日 -0.26%"}, {"t": "SPY", "n": "追蹤標普 500，收 7,670.84、單日 -0.16%，是三者中跌幅居中的"}, {"t": "QQQ", "n": "追蹤那斯達克 100，母指數只跌 0.09%，成長股反而最抗跌"}]},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "二十年新高", "color": "#E05C5C", "zh": "債市仍然是這一輪的主角，而且是往更極端的方向走。三十年期美債殖利率週二攀上 5.6% 之上，是 2002 年 6 月以來沒見過的水準；十年期在 5.2% 出頭徘徊，盤中一度觸及 5.29%，同樣是十九年新高。推力有三條：油價墊高通膨預期、財政赤字與國債供給讓投資人要求更高的期限溢酬、以及市場開始認真定價「還會再升息」。對持有長天期債券的人來說，這不是利息變多，是本金在縮水。", "en": "The bond market remains the main act, and it is moving further into extremes. The 30-year Treasury yield climbed above 5.6% on Tuesday, a level unseen since June 2002, while the 10-year hovered just above 5.2% after touching 5.29% intraday, a 19-year high. Three forces are at work: oil-driven inflation expectations, fiscal deficits and Treasury supply demanding a bigger term premium, and markets now seriously pricing further rate hikes. For holders of long-duration bonds this is not more income, it is principal erosion.", "url": "https://www.cnbc.com/2026/09/29/treasury-yields-bonds.html", "stocks": [{"t": "TLT", "n": "二十年期以上美債 ETF，殖利率每往上一段，它的淨值就往下一段，是最直接的受害者"}, {"t": "IEF", "n": "七到十年期美債 ETF，對應的十年期殖利率在 5.2% 出頭，跌幅比長天期輕但同方向"}]},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "談判停滯", "color": "#E05C5C", "zh": "油價是這波殖利率的上游。布蘭特原油週二升向每桶 106 美元、收在 105.31 美元附近，一個月漲 16.4%、比去年同期高 59.5%；西德州原油約在 95 美元。原因是美伊談判卡住：伊朗方面放話在十一月美國期中選舉前不太可能達成協議重開荷姆茲海峽，而沙烏地東西向管線復輸的利多被完全蓋過。市場也在吵柴油出口該不該管，這件事壓著西德州油價、卻推高煉油利差。", "en": "Oil sits upstream of this yield move. Brent rose toward $106 a barrel on Tuesday and settled near $105.31, up 16.4% in a month and 59.5% year on year, while WTI traded around $95. The reason is stalled US-Iran diplomacy: Tehran has signalled a deal to reopen the Strait of Hormuz is unlikely before November's US midterms, overwhelming the bullish news that Saudi Arabia's East-West pipeline has resumed flows. A separate debate over restricting diesel exports is capping WTI while widening refining margins.", "url": "https://fortune.com/article/price-of-oil-09-29-2026/", "stocks": [{"t": "XOM", "n": "綜合型油商，上游賺油價、下游賺煉油利差，這種結構下兩邊都順風"}, {"t": "VLO", "n": "純煉油商，柴油出口管制的爭議直接左右它的裂解價差，是最敏感的一檔"}, {"t": "COP", "n": "純上游生產商，沒有煉油部門緩衝，油價怎麼走它就怎麼走"}]},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "換位置", "color": "#E05C5C", "zh": "把當天的類股攤開看，這不是普跌而是換位置。消費必需、工業、原物料、能源留在領先象限，科技、通訊、可選消費與金融落在落後象限，不動產與公用事業則正在改善。這種排列的共同語言只有一個字：利率。誰的現金流要靠折現率撐、誰的資金成本會跟著十年期走，就落後；誰能把成本轉嫁、或本來就靠實體資產收租，就相對強。", "en": "Look at the sector map and this is rotation, not a broad sell-off. Consumer staples, industrials, materials and energy sit in the leading quadrant; technology, communications, consumer discretionary and financials are lagging; real estate and utilities are improving. The common language of that ranking is one word: rates. Whatever depends on a discount rate or funds itself off the 10-year lags, while businesses that can pass costs through or collect rent on hard assets hold up better.", "url": "https://www.investing.com/analysis/sector-rotation-a-guide-to-the-sp-500-momentum-status-200675903", "stocks": [{"t": "XLP", "n": "消費必需類股 ETF，留在領先象限，是這種環境的資金避風港"}, {"t": "XLF", "n": "金融類股 ETF，落在落後象限，殖利率曲線與存款成本同時夾擊"}, {"t": "IWM", "n": "羅素 2000 小型股 ETF，浮動利率債務佔比高，對升息定價最敏感"}]},
    {"id": "earn_0", "channel": "財報速報", "tag": "大幅超預期", "color": "#E8786A", "zh": "CarMax 週二交出遠超預期的會計年度第二季：調整後每股盈餘 1.16 美元，市場原本只預期 0.73 美元；營收 78.8 億美元、年增 19.5%，也比 69.8 億的預估高出近 9 億。零售加批發合計售出 387,735 台、年增 14.7%，毛利 7.995 億美元、增 11.4%。更值得注意的是管理層的說法：連最低所得的客層都還撐得住。公司並重申年度 2 億美元的營業費用節省目標，且會在本季以溫和節奏重啟庫藏股。", "en": "CarMax posted a fiscal second quarter far above expectations on Tuesday: adjusted EPS of $1.16 against a $0.73 consensus, with revenue up 19.5% year on year to $7.88 billion versus a $6.98 billion estimate. Combined retail and wholesale unit sales rose 14.7% to 387,735, and gross profit gained 11.4% to $799.5 million. More telling was management's commentary that even its lowest-income customers are holding up. The company reaffirmed its $200 million annualised SG&A savings target and said it will resume buybacks at a modest pace this quarter.", "url": "https://www.benzinga.com/markets/earnings/26/09/62052154/carmax-says-even-its-lowest-income-customers-are-holding-up-despite-affordability-squeeze", "stocks": [{"t": "KMX", "n": "財報主角，每股盈餘超出預期 0.43 美元、營收年增 19.5%，盤中走高"}, {"t": "CVNA", "n": "線上二手車同業，CarMax 的單量與客層說法是它下一季需求的先行指標"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "獲利超預期", "color": "#E8786A", "zh": "Concentrix 週二公布的第三季（截至 8 月底）是典型的「獲利超預期、營收不及預期」：調整後每股盈餘 2.92 美元、比預估高 0.22 美元，但營收 24.5 億美元、年減 1.2%，比市場少 3,000 萬。公司同時交出第三季歷史最高的營運現金流 2.68 億美元、調整後自由現金流 2.18 億，並調高季配息。問題在展望：全年營收指引 98 到 99 億美元，低於 100 億的共識，而且明說固定匯率基礎下還會繼續衰退。", "en": "Concentrix's third quarter, ended in August, was a textbook beat-and-miss: adjusted EPS of $2.92 topped estimates by $0.22, but revenue fell 1.2% year on year to $2.45 billion, $30 million short of consensus. The company delivered record third-quarter operating cash flow of $268 million and adjusted free cash flow of $218 million, and raised its quarterly dividend. The problem is the outlook: full-year revenue guidance of $9.8 to $9.9 billion sits below the $10.0 billion consensus, with management flagging continued declines on a constant-currency basis.", "url": "https://www.sec.gov/Archives/edgar/data/0001803599/000180359926000147/exhibit991q32026.htm", "stocks": [{"t": "CNXC", "n": "財報主角，每股盈餘超預期但營收年減 1.2%，全年指引低於共識"}, {"t": "ACN", "n": "大型顧問與外包同業，客戶端「用人變少、用工具變多」的趨勢兩家共用同一條曲線"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "跳空一成二", "color": "#E8786A", "zh": "嘉年華遊輪週二是全場最亮的一檔，股價跳升 12.65% 到 24.94 美元。財報超預期之外，真正讓市場買單的是三件事：營收創同期新高、公司上調全年指引、以及 2027 年的預訂情況強勁。這件事跟消費者信心創十二年新低放在一起看很衝突，但兩者的客層不同：郵輪賣的是已付訂金、鎖定未來一年的行程，這是中高所得家庭的可支配支出，不是月底要繳的帳單。", "en": "Carnival was the standout of the session, jumping 12.65% to $24.94. Beyond the earnings beat, three things drove the buying: record revenue for the period, raised full-year guidance, and strong 2027 bookings. That sits awkwardly next to consumer confidence hitting a 12-year low, but the customer bases differ: cruise revenue is prepaid deposits locking in travel a year out, which is discretionary spending by higher-income households rather than a bill due at month end.", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-29-2026", "stocks": [{"t": "CCL", "n": "財報主角，單日 +12.65% 收 24.94 美元，2027 年預訂強勁是最關鍵的一句"}, {"t": "RCL", "n": "郵輪同業，嘉年華的預訂數據通常會被市場當成整個郵輪業的需求讀數"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "十二年低點", "color": "#7C6AF7", "zh": "美國九月消費者信心指數重摔 6.7 點到 81.9，是 2014 年以來最低，市場原本預期 89.2、差距很大。拆開看更難看：現況指數跌 7.9 點到 109.3，預期指數跌 5.9 點到 63.6、連續三個月下滑。諮商理事會特別指出，民眾對「現在的景氣」的淨看法自 2024 年 9 月以來第一次翻負，而且提到物價、生活成本、尤其是油價的次數創新高。判讀時要記住一條經驗法則：預期指數低於 80，歷史上常對應未來一年出現衰退。", "en": "US consumer confidence dropped 6.7 points in September to 81.9, its lowest since 2014 and far below the 89.2 economists expected. The internals are worse: the Present Situation Index fell 7.9 points to 109.3 and the Expectations Index fell 5.9 points to 63.6, a third straight decline. The Conference Board noted net views of current business conditions turned negative for the first time since September 2024, with mentions of prices, cost of living and especially fuel at record highs. One rule of thumb matters here: an Expectations reading below 80 has historically pointed to recession within a year.", "url": "https://www.investing.com/news/economic-indicators/us-consumer-confidence-dives-to-more-than-12year-low-in-september-4923037", "stocks": [{"t": "XLY", "n": "可選消費類股 ETF，信心指數與它的營收關聯最直接，目前落在落後象限"}, {"t": "DG", "n": "折扣零售商，信心走弱時消費會往下沉，通常是這類通路的相對順風"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "還要升幾次", "color": "#7C6AF7", "zh": "這一輪最需要重新校準的觀念是方向：聯準會在 9 月 16 日已經升息一次，而貨幣市場現在定價未來十二個月還有 100 個基點的升息空間。主席華許（Kevin Warsh）在會後記者會把十年期殖利率走高解釋成經濟強勁、資本競爭與地緣因素的結果，而不是政策失控。這代表年初「等降息」的劇本已經作廢，下一個關卡是十月底的會議。對浮動利率借款人來說，成本會再往上，而不是見頂。", "en": "The idea most in need of recalibration is direction: the Fed already hiked on September 16, and money markets now price a further 100 basis points of tightening over 12 months. At the post-meeting press conference Chair Kevin Warsh framed the higher 10-year yield as a product of economic strength, competition for capital and geopolitics rather than a policy accident. That retires the wait-for-cuts script investors carried into the year, and turns attention to the late-October meeting. For floating-rate borrowers, funding costs are still rising, not peaking.", "url": "https://www.cnbc.com/2026/09/24/us-treasury-yields-bonds-fed-inflation.html", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，升息拉高存款成本，淨息差能不能同步擴張是它的分水嶺"}, {"t": "SHY", "n": "一到三年期美債 ETF，最貼近政策利率的一段，升息定價直接反映在它的殖利率上"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "房貸七趴", "color": "#7C6AF7", "zh": "殖利率走高在家計端的第一個痛點是房貸。三十年期固定房貸利率週末一度衝上 7.28% 的年內新高，週二回落 6 個基點到 7.24%。要理解這件事得看三十年期公債為什麼漲到 5.6% 以上：不是因為經濟過熱，而是投資人要求更高的期限溢酬來承擔財政赤字與國債供給的風險。這種漲法對購屋端特別不友善，因為它同時墊高房貸利率、又不代表就業或所得會跟著變好。", "en": "The first place higher yields bite households is mortgages. The 30-year fixed rate spiked to a year-to-date high of 7.28% over the weekend before easing six basis points to 7.24% on Tuesday. To read this properly, look at why the 30-year Treasury is above 5.6%: not an overheating economy, but investors demanding a larger term premium for fiscal deficits and Treasury supply. That mix is especially unkind to housing, because it raises borrowing costs without any implied improvement in jobs or incomes.", "url": "https://www.noradarealestate.com/blog/todays-mortgage-rates-september-29-2026-update/", "stocks": [{"t": "ITB", "n": "美國住宅建商 ETF，房貸利率 7.24% 是它成交量的直接天花板"}, {"t": "TOL", "n": "高價位住宅建商，客層自備款比例高、對房貸利率的敏感度理論上較低，可用來檢驗這條假設"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "授權熱", "color": "#4EABA4", "zh": "諾和諾德週二宣布向中國恆瑞醫藥取得 HRS-1596 的獨家授權，總金額上限 26 億美元、先付 3 億，取得中國大陸、香港、澳門與台灣地區以外的全球開發與銷售權。標的是一款可望做到每週口服一次的 GLP-1／GIP 雙受體促效劑，還在第一期臨床前後。這不是單一事件：目前約有 250 個中國 GLP-1 在開發，阿斯特捷利康、默克、輝瑞都買過中國的減重資產。趨勢很清楚——大型藥廠正在把早期研發外包給中國，用授權金換時間。", "en": "Novo Nordisk said on Tuesday it had licensed HRS-1596 from China's Hengrui Pharma for up to $2.6 billion, including a $300 million upfront payment, taking global development and commercial rights outside mainland China, Hong Kong, Macao and Taiwan. The asset is a GLP-1/GIP dual receptor agonist with potential for once-weekly oral dosing, still around phase one. This is not a one-off: roughly 250 Chinese GLP-1 candidates are in development, and AstraZeneca, Merck and Pfizer have all licensed Chinese obesity assets. The trend is plain: big pharma is outsourcing early discovery to China and paying licence fees to buy time.", "url": "https://www.globenewswire.com/news-release/2026/09/29/3370376/0/en/novo-and-hengrui-pharma-enter-exclusive-license-agreement-for-once-weekly-oral-glp-1-gip-dual-receptor-agonist-hrs-1596.html", "stocks": [{"t": "NVO", "n": "交易主角，用 3 億先付款補強減重管線，面對的是未來十年的專利到期壓力"}, {"t": "LLY", "n": "減重市場的最大對手，諾和諾德補管線正是為了追它"}, {"t": "PFE", "n": "同樣向中國藥廠買過減重資產，是「授權取代自研」這條路的另一個案例"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "本土製造", "color": "#4EABA4", "zh": "工業與原物料是今年最容易被忽略的贏家，兩者目前都在領先象限。邏輯不在景氣循環，而在政策：關稅把生產拉回美國本土，受惠的是設備、焊接、鋼構、化工原料這些「蓋東西需要的東西」。這條線跟殖利率走高並不衝突，因為它的訂單來自資本支出決策，不是消費信貸。要檢驗它，看的是在手訂單與產能利用率，不是估值倍數。", "en": "Industrials and materials are this year's easiest-to-miss winners, and both currently sit in the leading quadrant. The logic is policy rather than cycle: tariffs have pulled production back onshore, favouring equipment, welding, steel fabrication and chemical inputs, the things you need in order to build things. This line does not conflict with rising yields, because its orders come from capital-spending decisions rather than consumer credit. Test it with backlog and capacity utilisation, not with valuation multiples.", "url": "https://www.investing.com/analysis/sector-rotation-a-guide-to-the-sp-500-momentum-status-200675903", "stocks": [{"t": "XLI", "n": "工業類股 ETF，在動能圖上位於領先象限"}, {"t": "XLB", "n": "原物料類股 ETF，同樣領先，反映的是本土興建活動的原料需求"}, {"t": "ESAB", "n": "焊接與切割設備商，是本土製造題材裡「蓋東西的工具」最純的代表之一"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "雙面刃", "color": "#4EABA4", "zh": "公用事業與不動產在動能圖上正在改善，但這兩個板塊今年的處境是最分裂的。往上的力量是電力需求與防禦性配置；往下的力量是它們本質上是債券替代品，三十年期公債給到 5.6% 的時候，殖利率 3% 的公用股就變得不划算。所以這裡不能整個板塊一起看：能把成本轉嫁給受管制費率的、或有實質用電成長的，跟純吃利差的完全是兩件事。", "en": "Utilities and real estate are improving on the momentum map, yet these are the most internally split sectors of the year. Pushing up are power demand and defensive positioning; pushing down is the fact that both are bond substitutes, and with the 30-year Treasury at 5.6% a utility yielding 3% stops looking cheap. So the sector cannot be judged as one block: names that can pass costs into regulated rates or that have real load growth are a different proposition from those simply harvesting a spread.", "url": "https://www.investing.com/analysis/sector-rotation-a-guide-to-the-sp-500-momentum-status-200675903", "stocks": [{"t": "XLU", "n": "公用事業類股 ETF，在動能圖上屬於改善中，但殖利率競爭是它的天花板"}, {"t": "XLRE", "n": "不動產類股 ETF，同屬改善象限，資金成本與資產估值同時受長天期殖利率牽動"}, {"t": "AEP", "n": "大型受管制電力公司，適合用來檢驗「費率轉嫁能力」這條分水嶺"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "二十三年最佳", "color": "#5B8ED6", "zh": "小型股今年是真的在贏。截至 9 月 21 日，羅素 2000 今年上漲 15.9%，勝過標普 500 的 13.4%，是二十三年來最好的一年。理由有幾層：多年落後留下的估值空間、獲利改善、以及關稅環境下「營收來自美國本土的比重高」反而變成優勢。但這個領先是在市場原本預期降息的前提下累積的，而現在的定價方向已經反轉，這是接下來最需要盯的變數。", "en": "Small caps really are winning this year. Through September 21 the Russell 2000 was up 15.9%, ahead of the S&P 500's 13.4% and on track for its best year in 23 years. Several layers explain it: valuation room left by years of underperformance, improving earnings, and the fact that drawing most revenue from inside the US has become an advantage under tariffs. But that lead was built on an assumption of rate cuts, and the pricing has now flipped the other way, which is the variable to watch from here.", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，今年到 9/21 上漲 15.9%，是這波領先的主體"}, {"t": "IJR", "n": "標普小型 600 ETF，成分要求已有獲利，用來跟羅素 2000 對照品質差異"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "浮動利率", "color": "#5B8ED6", "zh": "小型股最大的結構弱點不是景氣，是負債的形式。指數裡有相當比重的公司靠浮動利率借款，升息一碼，利息支出當季就跟著上去，不像大型公司可以靠早年鎖定的長期固定利率債撐著。所以「市場定價還有 100 個基點升息」對小型股是直接的獲利下修，不只是估值問題。另一面是借錢給它們的商業發展公司，收的正是浮動利率利息，同一件事對它們是收入增加、但呆帳風險也同步上升。", "en": "The biggest structural weakness in small caps is not the economy but the shape of their debt. A meaningful share of index constituents borrow at floating rates, so each hike lifts interest expense in the same quarter, unlike large caps sheltered by long-dated fixed-rate paper issued years ago. That makes the market's 100 basis points of priced-in hikes a direct earnings downgrade, not merely a valuation question. The mirror image is the business development companies lending to them, which collect those floating coupons, gaining income while their credit risk rises in step.", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment", "stocks": [{"t": "SPSM", "n": "另一檔小型股 ETF，可用來檢查不同編製規則下浮動利率曝險的差異"}, {"t": "TRIN", "n": "商業發展公司，借錢給成長期中小企業、收浮動利率利息，升息時收入與呆帳風險同時上升"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "漲四倍之後", "color": "#5B8ED6", "zh": "今年羅素 2000 表現最好的五十檔裡，有十六檔是晶片相關，其中好幾檔漲幅超過四倍。這個數字好看，但也是一個警訊：當一檔小型股漲成這樣，它通常已經不再符合「被忽視」的條件——覆蓋的券商變多、流動性變好、估值也不再有安全邊際。以老化測試設備商 Aehr 為例，今年漲幅逾 400%、已經在往大型股指數靠，這時候該問的不是還能漲多少，而是這個估值需要多少年的訂單來兌現。", "en": "Sixteen of the Russell 2000's fifty best performers this year are chip-related, several up more than fourfold. Impressive, but also a warning: once a small cap moves like that it usually no longer fits the neglected profile, because coverage widens, liquidity improves and the valuation margin of safety disappears. Take burn-in test equipment maker Aehr, up over 400% this year and drifting toward large-cap index territory: the question is no longer how much further it can run, but how many years of orders that valuation already assumes.", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html", "stocks": [{"t": "AEHR", "n": "晶圓級老化測試設備商，今年漲逾 400%，是「漲太多就不再是被忽視股」的活教材"}, {"t": "AOSL", "n": "功率半導體商，同屬小型晶片股但漲幅遠不及，可用來對照本輪資金集中的程度"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "單一催化", "color": "#5B8ED6", "zh": "週二小型股裡最明確的催化劑來自生技與能源兩端。BeyondSpring 取得美國食品藥物管理局的快速審查資格，適應症是先前已治療過的晚期非鱗狀非小細胞肺癌，用藥組合是 plinabulin 加上多西他賽。快速審查只是縮短審查時程、不是核准，這個區別在微型生技股上經常被市場搞混。另一端是鈾礦商 Uranium Energy 在同一天公布財報，核電題材今年沒有退燒。", "en": "Tuesday's clearest small-cap catalysts came from biotech and energy. BeyondSpring received US Food and Drug Administration Fast Track designation for plinabulin plus docetaxel in previously treated advanced non-squamous non-small-cell lung cancer. Fast Track shortens the review path; it is not an approval, a distinction routinely blurred by the market in micro-cap biotech. At the other end, uranium miner Uranium Energy reported results the same day, with the nuclear theme still running hot this year.", "url": "https://www.stocktitan.net/rankings/top-news/gainers/2026-09", "stocks": [{"t": "BYSI", "n": "微型生技股，取得肺癌適應症的快速審查資格，是加快流程而非核准"}, {"t": "UEC", "n": "鈾礦商，9/29 公布財報，核電需求是它今年的主軸"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "池子不同", "color": "#5B8ED6", "zh": "很多人把小型股當成一件事，其實光是指數的池子就差很多。羅素 2000 按市值排序取第 1001 到 3000 名，不管公司有沒有獲利；標普小型 600 則要求連續獲利才納入。結果是同一段時間，兩者的報酬與波動可以差好幾個百分點，而且成分裡的虧損公司比例天差地遠。買小型股 ETF 之前先確認自己買到的是哪一個池子，這件事比挑進場時機重要。", "en": "Small caps get treated as one thing, when even the index pools differ sharply. The Russell 2000 simply takes companies ranked 1,001 to 3,000 by market value regardless of profitability, while the S&P SmallCap 600 requires a record of positive earnings to qualify. Over the same stretch the two can diverge by several percentage points in return and volatility, and the share of loss-making constituents is worlds apart. Checking which pool you are buying matters more than timing the entry.", "url": "https://en.wikipedia.org/wiki/Russell_2000_Index", "stocks": [{"t": "VTWO", "n": "追蹤羅素 2000，成分不篩獲利，虧損公司比重較高"}, {"t": "SPSM", "n": "追蹤標普小型 600，納入前要求連續獲利，是同一類資產的另一種篩法"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新進池", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月下旬 Q3 財報", "zh": "這家公司做什麼：Alerus Financial 是北達科他與明尼蘇達一帶的社區銀行，但它有一半的個性不在放款，而在退休金計畫管理與財富管理的手續費收入。為什麼被忽視：市值小、掛在那斯達克，追蹤的券商只有 Piper Sandler、DA Davidson、Keefe Bruyette 等少數幾家。什麼正在改變：董事會通過新的 125 萬股庫藏股授權（到 2029 年 8 月），且不是只授權——今年第一季已實買 600 萬美元，到 6 月累計買回 50 萬股、金額 1,256 萬美元，同時把季配息調到每股 0.22 美元，全年淨息差目標 3.55% 到 3.65%。風險與反方論點：9 月 2 日提交 2 億美元的儲架註冊，意思是隨時可能增資，跟庫藏股是反方向的訊號；而且十年期殖利率 5.2% 之下，社區銀行的存款成本壓力還沒結束。這是研究線索，不是投資建議。", "en": "What it does: Alerus Financial is a community bank across North Dakota and Minnesota, but half its character sits in retirement-plan administration and wealth-management fee income rather than lending. Why it is ignored: small market value, Nasdaq-listed, and covered by only a handful of brokers including Piper Sandler, DA Davidson and Keefe Bruyette. What is changing: the board approved a new 1.25 million share repurchase authorisation running to August 2029, and this is not just paper. The company bought back $6 million in the first quarter and 500,000 shares for $12.56 million through June, while lifting the quarterly dividend to $0.22 and guiding to a reported net interest margin of 3.55% to 3.65%. Risks and the other side: a $200 million shelf registration filed on September 2 means equity issuance is possible at any time, pointing the opposite way from buybacks, and with the 10-year at 5.2% deposit-cost pressure on community banks is not over. This is a research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/healthcare/nasdaq-sgry/surgery-partners/news/september-2026s-top-undervalued-small-caps-with-insider-buyi", "stocks": [{"t": "ALRS", "n": "雷達主角，社區銀行加退休金與財富管理手續費，庫藏股已實買 1,256 萬美元"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新進池", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報", "zh": "這家公司做什麼：Surgery Partners 在全美經營門診手術中心與手術醫院，做的是骨科、腸胃科這類非急迫的排程手術。為什麼被忽視：股價一年跌了 49%、貼近 52 週低點 12.25 美元，券商報告的語氣普遍負面，資金早就換去別處。什麼正在改變：董事 Teresa DeLuca 在 8 月 18 日以每股 14.35 美元自掏腰包買進 10,000 股，持股增至 66,843 股，這是 Form 4 的 P 碼、不是配股。風險與反方論點：反方很硬——TD Cowen 指出調整後稅前息前折舊攤銷前獲利短少 6%，原因是保險給付組合轉差加上三家手術醫院的個別問題；Jefferies 則點名財測重設與槓桿偏高。而且執行長今年 3 月兩度賣股（雖然是限制股解禁的稅務賣出），代表管理層內部並沒有一致的買進訊號。這是研究線索，不是投資建議。", "en": "What it does: Surgery Partners runs a national network of ambulatory surgery centres and surgical hospitals, handling scheduled, non-urgent procedures in fields such as orthopaedics and gastroenterology. Why it is ignored: the stock is down 49% over a year and sits near its 52-week low of $12.25, broker commentary is broadly negative, and money has long since rotated elsewhere. What is changing: director Teresa DeLuca bought 10,000 shares with her own money at $14.35 on August 18, lifting her holding to 66,843 shares, filed as a Form 4 open-market purchase rather than a grant. Risks and the other side: the bear case is solid. TD Cowen flagged a 6% shortfall in adjusted EBITDA on a worsening insurance mix plus specific problems at three surgical hospitals, and Jefferies pointed to an earnings reset and a leveraged balance sheet. The chief executive also sold twice in March, albeit to cover tax on vesting restricted stock, so there is no unified insider signal. This is a research lead, not investment advice.", "url": "https://www.fool.com/coverage/filings/2026/09/03/surgery-partners-director-teresa-deluca-buys-11-250-shares/", "stocks": [{"t": "SGRY", "n": "雷達主角，門診手術中心營運商，一年跌 49%、董事 8/18 以 14.35 美元買進 10,000 股"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "新進池", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月下旬 Q3 財報", "zh": "這家公司做什麼：Bank of Marin Bancorp 是加州北灣地區的社區銀行，服務舊金山灣區北側的中小企業與屋主。為什麼被忽視：市值不到五億美元，幾乎沒有大型券商追蹤，在加州銀行的討論裡向來不是主角。什麼正在改變：內部人 Gary Strong 在 9 月買進 2,000 股、金額約 6.5 萬美元，讓自己的持股一口氣增加 16%。金額很小，但這裡要看的是比例而不是絕對數字——一個人願意把自己的部位加大六分之一，資訊量跟隨手買一手是不同的。風險與反方論點：單一內部人不構成群聚訊號；加州商用不動產的曝險是這類銀行最常見的地雷；而且升息定價反轉之下，社區銀行的存款競爭只會更激烈。這是研究線索，不是投資建議。", "en": "What it does: Bank of Marin Bancorp is a community bank in California's North Bay, serving small businesses and homeowners on the northern edge of the San Francisco Bay Area. Why it is ignored: market value under half a billion dollars, almost no major broker coverage, and never the headline name in any discussion of California banks. What is changing: insider Gary Strong bought 2,000 shares for roughly $65,000 in September, increasing his own holding by 16% in one step. The dollar amount is small, but the ratio is the point: someone willing to enlarge their position by a sixth carries different information than a token purchase. Risks and the other side: a single insider is not a cluster signal, California commercial real-estate exposure is the classic landmine for banks this size, and with hike pricing reversed, deposit competition only gets tougher. This is a research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/banks/nasdaq-bmrc/bank-of-marin-bancorp/news/undervalued-small-caps-with-insider-buying-to-watch-globally", "stocks": [{"t": "BMRC", "n": "雷達主角，加州北灣社區銀行，內部人 9 月買進使個人持股增加 16%"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Form 10 生效與國稅局私函裁定", "zh": "這家公司做什麼：KBR 是工程與政府服務集團，正在把國防與情報為主的 Mission Technology Solutions 部門分拆成獨立上市公司。池內更新：分拆時程已經定到 2027 年 1 月 4 日，也就是新會計年度的第一個營業日，比先前含糊的「2026 下半年」清楚得多。什麼正在改變：交易設計為對公司與股東免稅，但還有三道關卡沒過——向美國證管會遞交的 Form 10 註冊書要生效、要拿到國稅局的私函裁定或法律顧問意見、以及董事會最終核准。為什麼值得追：分拆後的政府服務業務通常會被重新評價，有分析認為以母公司九倍的倍數為基準仍有空間。風險與反方論點：任何一道關卡延後，整個時間表就往後推，而分拆本身不會讓兩邊的合約與利潤率變好。這是研究線索，不是投資建議。", "en": "What it does: KBR is an engineering and government services group, and it is separating its defence and intelligence-led Mission Technology Solutions division into a standalone listed company. Pool update: the spin-off is now targeted for January 4, 2027, the first business day of the new fiscal year, far more concrete than the earlier vague second-half-of-2026 language. What is changing: the deal is structured to be tax-free to the company and its shareholders, but three gates remain unopened. The Form 10 registration filed with the SEC must go effective, a favourable IRS private letter ruling or counsel opinion is required, and the board must give final approval. Why it is worth tracking: spun-off government services businesses are often re-rated, and some analysis argues there is room against the parent's nine-times multiple. Risks and the other side: any gate slipping pushes the whole timetable back, and separation by itself does not improve either side's contracts or margins. This is a research lead, not investment advice.", "url": "https://www.kbr.com/en/insights-news/press-release/kbr-announces-strategic-intent-spin-mission-technology-solutions", "stocks": [{"t": "KBR", "n": "雷達主角，分拆 Mission Technology Solutions 目標 2027/1/4 完成，三道關卡未過"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 資金成本與逾期率的季報拆解", "zh": "這家公司做什麼：Regional Management 是做非優級消費者貸款的小型放款業者，客層是信用評分不足以拿到銀行貸款的家庭。池內更新：這一檔在池內的論點原本建立在「內部人買進」加上「降息會壓低資金成本」，而今天的環境把第二個前提整個推翻——聯準會 9 月已升息，市場還在定價未來十二個月 100 個基點的升息。什麼正在改變：這家公司的收入端是固定利率的消費貸款，成本端是浮動的批發資金，升息時利差是被壓縮的，而不是擴張。同時消費者信心跌到十二年低點、預期指數 63.6，非優級客層的還款能力正好是最先出問題的一段。風險與反方論點：資金成本與逾期率同時逆風，是這個論點最壞的組合；內部人 8 月的買進發生在升息定案之前，資訊價值要打折。這是研究線索，不是投資建議。", "en": "What it does: Regional Management is a small non-prime consumer lender, serving households whose credit scores fall short of bank loans. Pool update: its thesis rested on insider buying plus an assumption that rate cuts would lower funding costs, and today's environment demolishes the second leg, with the Fed having hiked in September and markets pricing another 100 basis points over twelve months. What is changing: revenue comes from fixed-rate consumer loans while funding is floating wholesale money, so rising rates compress the spread rather than widen it. At the same time consumer confidence has fallen to a 12-year low with an Expectations reading of 63.6, and non-prime borrowers are exactly the cohort whose repayment cracks first. Risks and the other side: funding costs and delinquencies turning against it simultaneously is the worst combination for this thesis, and the August insider purchase predates the rate decision, so discount its information value. This is a research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/diversified-financials/nyse-rm/regional-management/news/undervalued-small-caps-with-insider-action-to-watch-in-septe-1", "stocks": [{"t": "RM", "n": "雷達主角，非優級消費放款商，升息定價反轉同時打擊它的資金成本與客層還款能力"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "新進池", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報的利差與帳面價值", "zh": "這家公司做什麼：Angel Oak Mortgage REIT 是微型市值的房貸不動產信託，主要持有非合格房貸（non-QM）資產，靠借短放長的利差賺錢。為什麼被忽視：市值極小、股價在個位數，在房貸信託的討論裡幾乎不會被提到。什麼正在改變：身兼董事與百分之十以上股東的 Michael Fierman 在 9 月 25 日以每股約 7.50 美元買進 38,726 股、金額 29.05 萬美元。時間點是關鍵：他是在三十年期公債衝上 5.6% 的那一週買的，也就是在最不利的利率環境裡加碼自己的部位。風險與反方論點：房貸信託在殖利率走高時，資產端的帳面價值會直接縮水，利差再好也救不了淨值；股價個位數代表流動性差、波動大；而且大股東加碼也可能只是為了維持持股比例。這是研究線索，不是投資建議。", "en": "What it does: Angel Oak Mortgage REIT is a micro-cap mortgage real-estate investment trust holding mainly non-QM residential mortgage assets and earning a spread by borrowing short and lending long. Why it is ignored: a very small market value and a single-digit share price mean it rarely comes up in any discussion of mortgage REITs. What is changing: Michael Fierman, a director and holder of more than 10% of the company, bought 38,726 shares at around $7.50 on September 25, spending $290,510. The timing is the point: he added during the very week the 30-year Treasury pushed above 5.6%, the least hospitable rate backdrop available. Risks and the other side: when yields rise, a mortgage REIT's asset book marks down directly, and no spread saves book value; a single-digit price implies thin liquidity and high volatility; and a large holder adding can simply be maintaining a percentage. This is a research lead, not investment advice.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+September+28,+2026", "stocks": [{"t": "AOMR", "n": "雷達主角，微型房貸信託，大股東兼董事 9/25 以約 7.50 美元買進 38,726 股"}]},
    {"id": "insider_0", "channel": "內部人動向", "tag": "往上加碼", "color": "#6DB56D", "zh": "上週最值得看的一筆內部人買進來自生技公司 Inhibrx Biosciences。身兼執行長與董事的 Mark Lappe 在 9 月 25 日與 9 月 28 日分批買進，合計約 99.88 萬美元；其中 9 月 28 日那天是 1,500 股買在加權均價 98.88 美元、3,000 股買在 101.70 美元。這筆交易的特別之處在於方向：他不是在低點撿便宜，是在股價往上走的過程中越買越高。內部人在上漲中加碼，通常比在低點抄底更難用「覺得便宜」來解釋。", "en": "Last week's most notable insider purchase came from biotech Inhibrx Biosciences. Chief executive and director Mark Lappe bought in tranches on September 25 and September 28 for roughly $998,783 in total, including 1,500 shares at a weighted average of $98.88 and 3,000 shares at $101.70 on the 28th alone. What makes it distinctive is the direction: he was not bottom-fishing but paying progressively higher prices as the stock rose. Insiders adding on the way up are harder to explain away with a simple it-looks-cheap motive than those buying a dip.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+September+28,+2026", "stocks": [{"t": "INBX", "n": "執行長兼董事 9/25 與 9/28 分批買進約 99.88 萬美元，且是在股價往上時加碼"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "誰在買", "color": "#6DB56D", "zh": "另一筆值得記下來的是 Kayne Anderson BDC：James L. Robo 在 9 月 24 日買進 105,000 股，估計金額約 136.98 萬美元。這筆的資訊量一半在買的人身上——Robo 是電力業界出身的資深經營者，他選擇加碼的標的是一家商業發展公司，也就是借錢給中型企業、收浮動利率利息的放款平台。在市場定價還有 100 個基點升息的時候，這個部位押的是「利息收得更多」贏過「借款人撐不住」。判讀時兩邊都要看，不能只看殖利率。", "en": "Another worth logging is Kayne Anderson BDC, where James L. Robo bought 105,000 shares on September 24 for an estimated $1,369,830. Half the information sits with the buyer: Robo is a veteran operator from the power industry, and what he chose to add is a business development company, a platform lending to mid-sized firms and collecting floating-rate interest. With markets pricing another 100 basis points of hikes, that position bets higher coupons will outweigh borrowers failing. Read both sides of it, not just the yield.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+September+28,+2026", "stocks": [{"t": "KBDC", "n": "商業發展公司，9/24 有內部人買進 105,000 股、估計約 137 萬美元"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "怎麼讀", "color": "#6DB56D", "zh": "第三筆是能源端：Infinity Natural Resources 的財務長 Cary D. Baetz 在 9 月 24 與 25 日合計買進 22,316 股 A 類普通股，金額 29.99 萬美元。這裡順便講三條判讀規矩。第一，只認 Form 4 上的 P 碼（公開市場自費買進），選擇權行使與配股不算。第二，看比例不看金額——占個人原有持股一成以上才有意義。第三，單一內部人是雜訊、兩位以上在短期內同向才叫群聚訊號，而財務長買自家公司通常比其他職位更值得留意，因為他最清楚下一季的數字。", "en": "The third is on the energy side: Infinity Natural Resources chief financial officer Cary D. Baetz bought a combined 22,316 Class A shares on September 24 and 25 for $299,993. Three reading rules are worth restating here. First, only count code P on Form 4, an open-market purchase with the insider's own cash; option exercises and grants do not qualify. Second, look at the ratio rather than the dollar amount, since anything above roughly a tenth of an existing holding is what carries meaning. Third, one insider is noise and two or more in the same direction over a short window is a cluster, and a CFO buying their own stock deserves extra attention because they know next quarter's numbers best.", "url": "https://www.investing.com/news/stock-market-news/top-insider-buys-and-sells-disclosed-for-monday-93CH-4922736", "stocks": [{"t": "INR", "n": "阿帕拉契油氣生產商，財務長 9/24 至 9/25 買進 22,316 股、金額 29.99 萬美元"}, {"t": "RRC", "n": "同區天然氣生產商，可用來對照同業在同一段油氣價格下的內部人行為"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "只賣不買", "color": "#B5654D", "zh": "眾議院書記官最新的申報裡，最極端的一份來自奧克拉荷馬州第一選區的 Kevin Hern，9 月 25 日申報、共 73 筆交易，其中 66 筆是賣出、只有 2 筆買進，涉及 56 個不同標的，申報金額區間 143.6 萬到 401.5 萬美元。常被提到的持股包括波士頓科學、艾昆緯、艾克森美孚與歐甘農。這個部位結構代表的假設不是「押某個主題」，而是把一整本個股簿子幾乎清掉——賣出範圍橫跨醫材、醫藥研究服務與能源，看起來是帳戶層級的再配置，而不是對哪個產業轉空。", "en": "In the House Clerk's latest filings, the most extreme belongs to Kevin Hern of Oklahoma's first district, disclosed on September 25: 73 transactions of which 66 were sales and only two purchases, spanning 56 distinct securities in a reported range of $1.44 million to $4.02 million. Frequently cited names include Boston Scientific, IQVIA, Exxon Mobil and Organon. The structure implies not a bet on a theme but the near-complete clearing of an individual-stock book, and because the selling cuts across medical devices, pharma research services and energy, it looks like account-level reallocation rather than a turn against any one industry.", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure", "stocks": [{"t": "BSX", "n": "醫材大廠，是這份申報中被提到的主要標的之一"}, {"t": "IQV", "n": "醫藥研究委外服務商，同在申報標的之列"}, {"t": "XOM", "n": "綜合油商，在一份幾乎全面賣出的申報裡出現，方向與油價走強相反"}, {"t": "OGN", "n": "從默克分拆出來的女性健康與成熟藥品公司，也在名單中"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "時間差", "color": "#B5654D", "zh": "這個頻道每天都要重講一次為什麼它不是買賣訊號，今天講兩條最容易被忽略的。第一是時間差：STOCK 法案允許在交易後 45 天內申報，所以你今天讀到的 9 月 25 日申報，交易可能發生在 8 月中——那是聯準會 9 月 16 日升息定案之前的世界，價格背景完全不同。第二是金額的呈現方式：申報只給區間不給數字，例如「143.6 萬到 401.5 萬美元」，中間差了快三倍，任何以此計算報酬率的排行榜都是估算而非事實。附帶一句：多數申報是配偶或信託帳戶執行的，署名的人不一定是下單的人。", "en": "This channel has to restate why it is not a trading signal, and today the two most overlooked reasons. First, the lag: the STOCK Act allows 45 days to file, so a disclosure dated September 25 may describe trades executed in mid-August, a world before the Fed's September 16 hike and at an entirely different price backdrop. Second, how amounts are presented: filings give ranges rather than figures, and a band like $1.44 million to $4.02 million spans nearly threefold, so any performance league table built on it is an estimate, not a fact. One footnote: many filings cover spouse or trust accounts, so the name on the form is not necessarily the person placing the order.", "url": "https://www.congress.gov/crs_external_products/TE/HTML/TE10073.html", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報持股的 ETF，把 45 天時間差的結構性落後具體化"}, {"t": "GOP", "n": "共和黨版的同類 ETF，兩者並看可以看出時間差對兩邊都一樣存在"}]},
    {"id": "week_0", "channel": "本週事件", "tag": "兩張考卷", "color": "#C97DD4", "zh": "接下來兩天有兩份會改變利率定價的數據。十月一日星期四，美東時間早上八點半公布初領失業金人數、十點公布供應管理協會製造業指數，這是九月工廠狀況的第一份成績單，50 以上代表擴張。十月二日星期五早上八點半是主秀：勞工統計局的就業報告，非農新增、失業率與薪資成長三個數字會直接決定十月底會議的定價。另外十月一日是聯邦政府新會計年度起始，目前靠臨時撥款法案運作。", "en": "Two data points over the next two days can move rate pricing. On Thursday October 1, initial jobless claims land at 8:30am Eastern and the ISM Manufacturing index at 10:00am, the first read on how factories fared in September, with above 50 signalling expansion. Friday October 2 at 8:30am is the main event: the Bureau of Labor Statistics employment report, where payrolls, the unemployment rate and wage growth will set pricing for the late-October meeting. October 1 also starts the federal government's new fiscal year, currently funded under a stopgap measure.", "url": "https://vanderbiltreport.com/week-ahead-september-28-october-4-2026/", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，就業報告與製造業指數的意外值會第一時間反映在它身上"}, {"t": "SPY", "n": "標普 500 ETF，這兩份數據決定的是折現率，對整體指數是同一個變數"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "財報空窗", "color": "#C97DD4", "zh": "財報方面，這一週的重頭戲（美光、耐吉、嘉年華、埃森哲）已經公布完畢，接下來會進入一段空窗期。真正的第三季財報季通常要等到十月中，由大型銀行揭幕——那也是今年最值得等的一份，因為它會同時回答淨息差、放款成長與消費信貸品質三個問題，而這三件事剛好是目前殖利率環境下最大的疑問。空窗期裡市場的注意力會完全轉向數據，所以這幾天的波動更可能由債市而不是個股主導。", "en": "On earnings, this week's heavyweights, Micron, Nike, Carnival and Accenture, have already reported, and a quiet stretch follows. The real third-quarter season typically opens in mid-October with the large banks, and this year that will be the report worth waiting for, because it answers net interest margin, loan growth and consumer credit quality in one go, the three biggest open questions in the current yield environment. Through the gap, attention shifts entirely to data, so volatility over the coming days is more likely to come from the bond market than from single stocks.", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar", "stocks": [{"t": "JPM", "n": "大型銀行，通常率先揭開季報季，淨息差與消費信貸品質是今年最關鍵的兩個讀數"}, {"t": "STZ", "n": "酒類消費品公司，是財報空窗期裡少數會先給出消費端讀數的名字之一"}]},
    {"id": "eval_0", "channel": "今日評估", "tag": "問卷與刷卡", "color": "#E8A838", "status": "這一題適合帶進討論", "zh": "今天最值得注意的一件事，是兩個訊號正面相撞。同一天，諮商理事會的消費者信心指數跌到 81.9、十二年最低，預期指數 63.6 已經進入歷史上對應衰退的區間；而 CarMax 的營收年增 19.5%、售出 38.7 萬台車，管理層還特別說連最低所得客層都撐得住。問卷問的是「你覺得怎麼樣」，刷卡紀錄記的是「你實際做了什麼」，兩者分岔的時候，通常是問卷先動、行為後動——但也可能是這次問卷反應的是油價而不是所得。這個分岔往哪一邊收斂，會決定整個第四季的消費類股怎麼走。", "en": "The thing most worth noticing today is two signals colliding head-on. On the same day, the Conference Board's confidence index fell to 81.9, a 12-year low, with Expectations at 63.6 and inside the range historically associated with recession, while CarMax reported revenue up 19.5% on 387,735 vehicles sold and management specifically said even its lowest-income customers are holding up. Surveys record how people feel; transactions record what they did. When the two diverge, sentiment usually moves first and behaviour follows, though it is also possible this survey is reacting to fuel prices rather than incomes. Which way that gap closes will set the tone for consumer stocks through the fourth quarter.", "url": "https://www.axios.com/2026/09/29/new-12-year-low-in-consumer-confidence", "stocks": [{"t": "KMX", "n": "實際交易端的證據：營收年增 19.5%、售出 387,735 台，管理層說低所得客層仍撐得住"}, {"t": "XLY", "n": "可選消費類股 ETF，這個分岔往哪邊收斂，最後會反映在它的相對強弱上"}]}

  return CARDS.length + "-" + (h >>> 0).toString(36);
})();

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);

  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/30/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v12.8</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
