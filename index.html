<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "指數收盤", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普 500 ETF，週三收漲 0.3%，貼近歷史高點"}, {"t": "QQQ", "n": "那斯達克 100，那指漲約 0.5% 領先"}, {"t": "DIA", "n": "道瓊 ETF，指數收在平盤下方，是三大指數唯一收黑"}], "en": "US stocks closed higher Wednesday after July CPI landed exactly on consensus. The S&P 500 rose 0.3% and the Nasdaq Composite added roughly 0.5%, while the Dow finished just below flat. The more telling detail is that the indexes gave back most of their initial pop after the 8:30 print — a report that lands on consensus tells you nothing you had not already paid for.", "zh": "週三美股收高，7 月 CPI 完全落在市場共識上。標普 500 上漲 0.3%，那斯達克綜合指數漲約 0.5%，道瓊則收在平盤下方，是三大指數唯一收黑。更值得注意的細節是，指數在美東上午 8:30 數據公布後衝高，隨即把大部分漲幅回吐——一份完全符合預期的數據，等於沒有提供任何你還沒付過錢的新資訊。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-12-2026"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "個股異動", "color": "#E05C5C", "stocks": [{"t": "CRWV", "n": "CoreWeave，財報超標帶動大漲 18%"}, {"t": "CAVA", "n": "Cava Group，第二季財報亮眼、跳漲 16%"}, {"t": "WDAY", "n": "Workday，企業軟體資金外流，跌約 4%"}], "en": "Individual names told a cleaner story than the index. CoreWeave surged 18% on a second-quarter beat, and Cava Group jumped 16% after strong results from the fast-casual Mediterranean chain. On the other side, Workday fell about 4% as money rotated out of enterprise software ahead of its own report. Same session, and the spread between the best and worst mid-cap moves was over twenty points.", "zh": "個股層面比指數層面清楚得多。CoreWeave 因第二季財報超標大漲 18%，地中海快休閒餐飲連鎖 Cava Group 也在亮眼財報後跳漲 16%。另一邊，Workday 在自家財報前因企業軟體資金輪出而跌約 4%。同一個交易日，中型股裡最強與最弱的價差超過二十個百分點——指數的 0.3% 完全蓋掉了底下的動盪。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-12-2026"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "地緣油價", "color": "#E05C5C", "stocks": [{"t": "XLE", "n": "能源類股，供給風險溢價持續墊高的直接受惠者"}, {"t": "OXY", "n": "西方石油，美國本土產能純度較高的標的"}, {"t": "HAL", "n": "哈里伯頓，油服端反映的是資本支出而非現貨價"}], "en": "Oil rose again Wednesday as fresh attacks knocked back hopes of reopening the Strait of Hormuz. Brent sits near $89 a barrel and WTI around $84 — well below the peaks of the conflict, because emergency stocks, alternative export routes, softer demand and higher non-Gulf supply have absorbed part of the shock. The EIA does not expect Middle East output back near pre-conflict levels until early 2027 and sees Brent averaging $87 this year.", "zh": "油價週三再度走高，新一輪攻擊讓荷莫茲海峽重新開通的希望受挫。布蘭特原油約每桶 89 美元、西德州中級原油約 84 美元，都明顯低於這場衝突的高點，原因是緊急儲備、替代出口路線、需求走弱與非波灣供給增加吸收掉一部分衝擊。美國能源資訊署預估中東產量要到 2027 年初才會回到接近衝突前的水準，並估 2026 年布蘭特均價為 87 美元。", "url": "https://www.aljazeera.com/economy/2026/8/12/oil-prices-rise-as-attacks-dent-hopes-for-strait-of-hormuz-reopening"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "盤勢結構", "color": "#E05C5C", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，今年上漲 20%，2003 年以來最佳"}, {"t": "MAGS", "n": "七巨頭 ETF，同期僅上漲 4%，全年最弱的一群"}], "en": "The structural story of 2026 is a reversal nobody had on their card at the start of the year. The Russell 2000 is up 20% year to date, its best run since 2003, while the S&P 500 has gained 11% and the Magnificent 7 group of mega-cap AI leaders has advanced just 4%. AI spending is rippling outward past the names that started the theme, and money is hunting the second layer of beneficiaries rather than the first.", "zh": "2026 年真正的結構故事，是一個年初沒人押到的反轉。羅素 2000 今年以來上漲 20%，是 2003 年以來最好的一年，同期標普 500 漲 11%，而七巨頭這群大型 AI 領頭羊只漲 4%。AI 支出正在往外擴散、越過最早開啟這個主題的那幾個名字，資金也開始去獵第二層受惠者而不是第一層。", "url": "https://247wallst.com/investing/2026/07/16/the-russell-2000-is-having-its-best-year-in-23-years-heres-why-small-caps-are-winning-again/"},
    {"id": "earn_0", "channel": "財報速報", "tag": "網通 AI", "color": "#E8786A", "stocks": [{"t": "CSCO", "n": "思科，會計年度 Q4 營收、營益與每股盈餘同創紀錄"}, {"t": "ANET", "n": "Arista Networks，資料中心交換器的同業對照組"}], "en": "Cisco delivered the week's most substantive report after Wednesday's close: record Q4 revenue, non-GAAP operating income and EPS, all above the high end of guidance, with total product orders up 35% year over year. The number that matters is AI: $4B of hyperscaler orders in Q4 alone, taking fiscal 2026 to $9.3B against a raised $9B target, and fiscal 2027 AI revenue guidance lifted to $6.5-7B. Networking orders grew 40%, an eighth straight double-digit quarter.", "zh": "思科在週三盤後交出本週最有份量的財報：會計年度第四季營收、非 GAAP 營業利益與每股盈餘同創紀錄，且全部高於財測上緣，整體產品訂單年增 35%。真正的重點在 AI：光第四季就拿下 40 億美元的超大規模業者訂單，使 2026 會計年度累計達 93 億，超過已經上調過的 90 億目標，2027 年度 AI 營收目標同步提高到 65 至 70 億美元。網通產品訂單年增 40%，是連續第八季雙位數成長。", "url": "http://www.prnewswire.com/news-releases/cisco-reports-fourth-quarter-and-fiscal-year-2026-earnings-302850096.html"},
    {"id": "earn_1", "channel": "財報速報", "tag": "AI 算力", "color": "#E8786A", "stocks": [{"t": "CRWV", "n": "CoreWeave，第二季超標，單日漲 18%"}, {"t": "CBRS", "n": "Cerebras Systems，核心營收指引約 1.94 億美元、年增 88%"}], "en": "The AI compute layer reported in the same window and the market treated the two names very differently. CoreWeave beat and rose 18%. Cerebras Systems guided to roughly $194M of second-quarter core revenue, up 88% year over year, while the Street still modelled an adjusted loss near $0.17 a share. That gap is the whole question for this cohort right now: revenue is compounding fast, and profitability is arriving on a slower and much less certain schedule.", "zh": "AI 算力這一層在同一個時間窗交卷，市場對兩個名字的態度卻很不一樣。CoreWeave 財報超標、單日漲 18%；Cerebras Systems 則指引第二季核心營收約 1.94 億美元、年增 88%，但市場仍預估其調整後每股虧損約 0.17 美元。這個落差就是這一群公司現在的全部問題：營收複利很快，獲利卻走在一個慢得多、也不確定得多的時程上。", "url": "https://247wallst.com/investing/2026/08/12/spacex-rises-5-on-fresh-starlink-launch-intuitive-machines-gains-3-ahead-of-earnings/"},
    {"id": "earn_2", "channel": "財報速報", "tag": "餐飲消費", "color": "#E8786A", "stocks": [{"t": "CAVA", "n": "Cava Group，每股 0.19 美元超出預估的 0.18，漲 16%"}, {"t": "CMG", "n": "Chipotle，同型態快休閒連鎖的成熟對照組"}, {"t": "SG", "n": "Sweetgreen，同賽道但展店速度與獲利路徑不同"}], "en": "Cava Group jumped 16% on second-quarter earnings of $0.19 a share against an $0.18 consensus. The interesting part is the contrast with the macro backdrop: on a day when CPI showed food prices up just 0.1% month over month, the restaurant name that rewarded shareholders was the one still adding traffic rather than the one pushing price. In a cooling-inflation tape, pricing power stops being the story and unit growth becomes it.", "zh": "Cava Group 因第二季每股盈餘 0.19 美元、超出市場預估的 0.18 而大漲 16%。有意思的是它跟總經背景的對照：在 CPI 顯示食品價格月增僅 0.1% 的這一天，被市場獎勵的餐飲股是還在增加來客的那一家，而不是靠漲價撐營收的那一家。當通膨降溫，定價能力就不再是故事，展店與來客成長才是。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-12-2026"},
    {"id": "macro_0", "channel": "總經政策", "tag": "CPI 落地", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨債 ETF，直接反映通膨預期的定價"}, {"t": "TLT", "n": "20 年期公債 ETF，長端對通膨路徑最敏感"}], "en": "July CPI came in at +0.1% month over month and 3.4% year over year, down a tenth from June; core rose 0.2% monthly and 2.5% annually, also down a tenth. Shelter accounted for about two-thirds of the headline increase, with food also up 0.1%. Underneath, the mix is uneven: airfares accelerated 2.2%, medical care rose 0.4%, used cars 0.4%, while gasoline is still up 24.6% and fuel oil 39.1% over the year.", "zh": "7 月 CPI 月增 0.1%、年增 3.4%，較 6 月降 0.1 個百分點；核心月增 0.2%、年增 2.5%，同樣降 0.1 個百分點。住房項貢獻了整體漲幅約三分之二，食品同樣月增 0.1%。但底下的組成並不平均：機票月增 2.2% 加速，醫療照護漲 0.4%，二手車與卡車漲 0.4%，而汽油年增仍達 24.6%、燃油年增 39.1%。降溫的是平均值，能源那條線根本沒退。", "url": "https://www.cnbc.com/2026/08/12/cpi-inflation-report-july-2026.html"},
    {"id": "macro_1", "channel": "總經政策", "tag": "升息定價", "color": "#7C6AF7", "stocks": [{"t": "SHY", "n": "1 至 3 年期公債 ETF，短端政策預期的溫度計"}, {"t": "KRE", "n": "區域銀行 ETF，存款成本直接吃利率決策"}, {"t": "XLF", "n": "金融類股，利率路徑轉向的整體受益或受害端"}], "en": "Fed pricing moved the way you would expect from a report that behaved. Odds of a September hike fell to about 42% on CME FedWatch, with roughly 60% now assigned to holding at the current 3.50%-3.75% range — a week ago the hold camp was only one in three. Two things drove it: July's net job loss took the immediacy out of tightening, and headline inflation eased. What keeps a third of the market betting on a hike is the energy pass-through still working its way through.", "zh": "Fed 定價的移動方向，跟一份「規矩」的數據該產生的結果一致。CME FedWatch 顯示 9 月升息機率降到約 42%，維持在目前 3.50% 至 3.75% 區間的機率升到約六成——而一週前站在「不動」這邊的只有三分之一。推動的有兩件事：7 月非農淨減少讓緊縮的急迫性下降，加上整體通膨回落。仍有約三分之一的資金押升息，理由是能源價格的傳導還沒走完。", "url": "https://www.cnbc.com/2026/08/12/cpi-inflation-report-july-2026.html"},
    {"id": "macro_2", "channel": "總經政策", "tag": "殖利率曲線", "color": "#7C6AF7", "stocks": [{"t": "GLD", "n": "黃金 ETF，實質利率與政策不確定性的對照資產"}, {"t": "UUP", "n": "美元指數 ETF，利差預期改變時最先反映"}], "en": "The bond market's response deserves a closer look than the equity market's. Ahead of the print the 10-year sat at 4.682% and the 30-year at 5.231%; after CPI the 10-year eased to about 4.65% while the long bond barely moved. So the short end took the hint and the long end did not. Anything whose valuation depends on long rates — REITs, utilities, long-duration credit — did not get the relief the headline seemed to promise.", "zh": "債市的反應比股市的反應更值得看。數據公布前十年期公債殖利率在 4.682%、三十年期在 5.231%；CPI 出來後十年期降到約 4.65%，長債幾乎沒動。也就是說，短端聽懂了、長端沒有。凡是估值吃長端利率的資產——不動產信託、公用事業、長天期信用債——並沒有拿到這則標題看起來承諾的那份紓解。判讀利率不能只看一個點，要看整條曲線誰動了。", "url": "https://www.cnbc.com/2026/08/12/treasury-yields-inflation-cpi-data.html"},
    {"id": "sector_0", "channel": "產業風向", "tag": "板塊輪動", "color": "#4EABA4", "stocks": [{"t": "XLP", "n": "必需消費類股，目前落在領先象限"}, {"t": "XLI", "n": "工業類股，與原物料、能源同列領先"}, {"t": "XLU", "n": "公用事業，突破阻力並站上三個標準差以上"}], "en": "Relative-rotation readings currently place Consumer Staples, Industrials, Materials and Energy in the leading quadrant, with Real Estate and Utilities improving — XLU in particular has pushed well beyond its three-standard-deviation band, a marked change in sentiment toward a sector nobody wanted six months ago. Financials sit in the lagging quadrant on some measures while showing recent strength on others. The composition is defensive plus inflation hedges, not growth.", "zh": "目前的相對輪動讀數把必需消費、工業、原物料與能源放在領先象限，不動產與公用事業則在改善中——其中公用事業更是突破阻力、站上三個標準差以上，對一個六個月前沒人要的板塊來說，這是情緒的明顯轉向。金融在某些量測裡仍落在落後象限，在另一些裡則顯示近期轉強。整體組成是「防禦加通膨避險」，不是成長。", "url": "https://www.investing.com/analysis/sector-rotation-a-guide-to-the-sp-500-momentum-status-200675903"},
    {"id": "sector_1", "channel": "產業風向", "tag": "電力散熱", "color": "#4EABA4", "stocks": [{"t": "VRT", "n": "Vertiv，資料中心電力與散熱設備供應商"}, {"t": "PWR", "n": "Quanta Services，電網與輸配電工程承包"}, {"t": "SMCI", "n": "Super Micro，伺服器組裝端的量能指標"}], "en": "Cisco's $9.3B of fiscal 2026 AI orders and CoreWeave's expansion are the same demand seen from two angles, and both eventually land on the same downstream suppliers: power, cooling, grid engineering and server assembly. That is the practical reason AI capex has stopped being a mega-cap-only trade. The caveat worth holding onto is that orders are not revenue — for equipment and engineering vendors the gap between the two is measured in years, not quarters.", "zh": "思科 2026 年度 93 億美元的 AI 訂單，跟 CoreWeave 的擴張，是同一股需求的兩個角度，而兩者最後都會落到同一批下游供應商身上：電力、散熱、電網工程與伺服器組裝。這就是 AI 資本支出不再只是大型股交易的實際原因。要記住的但書是：訂單不等於營收，對設備與工程承包商而言，這兩者之間的距離是用年計、不是用季計。", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262098676-cisco-csco-q4-fy2026-earnings-9-billion-ai-orders-networking-124-resistance-tradingkey"},
    {"id": "sector_2", "channel": "產業風向", "tag": "醫療走弱", "color": "#4EABA4", "stocks": [{"t": "XLV", "n": "醫療類股，在相對輪動裡落入走弱象限"}, {"t": "MD", "n": "Pediatrix Medical，財報超標仍跌 12.3% 的樣本"}, {"t": "IHI", "n": "醫療器材 ETF，次產業裡體質分歧最大的一塊"}], "en": "Health Care has slipped into the weakening quadrant, and there is a clean case study for what that feels like at the single-stock level. Pediatrix Medical beat on revenue and adjusted EPS, reaffirmed full-year adjusted EBITDA guidance of $280-300M, and still fell 12.3%. When a sector loses its bid, beating the estimate stops being enough — the market starts demanding an answer on the trend instead, and a reaffirmed guide reads as a ceiling rather than a floor.", "zh": "醫療保健已滑落到走弱象限，而個股層級有一個很乾淨的案例可以說明那是什麼感覺。Pediatrix Medical 營收與調整後每股盈餘雙雙超標，也重申全年調整後 EBITDA 指引 2.8 至 3.0 億美元，股價仍下跌 12.3%。當一個板塊失去買盤，「贏過預期」就不再夠用，市場開始改問趨勢；而一份「重申」的財測，會被讀成天花板而不是地板。", "url": "https://markets.financialcontent.com/stocks/article/stockstory-2026-8-4-pediatrix-medical-groups-nysemd-q2-cy2026-beats-on-revenue-but-stock-drops-123"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "最佳年份", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，今年 20% 漲幅為 2003 年以來最佳"}, {"t": "VTWO", "n": "另一檔羅素 2000 ETF，費用率不同的同軌道工具"}], "en": "The Russell 2000 is up 20% in 2026, its strongest year in 23 years, and it has been outpacing the S&P 500 for months rather than days. The driver is specific: investors have looked past the Magnificent 7 for the next layer of AI beneficiaries, and small caps are where that search lands. Worth noting for anyone arriving now — a 23-year-best run is a description of what already happened, not a forecast of what comes next.", "zh": "羅素 2000 今年上漲 20%，是 23 年來最強的一年，而且領先標普 500 已經是以月計、不是以日計。驅動力很明確：投資人越過七巨頭去找下一層 AI 受惠者，而小型股正是這種搜尋的落點。對現在才要進場的人，有一句要記住——「23 年來最佳」是對已經發生的事情的描述，不是對接下來會發生什麼的預測。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-outpacing-p-500-163007242.html"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "品質分歧", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素 2000 成長 ETF，未獲利成分股集中的那一端"}, {"t": "IWN", "n": "羅素 2000 價值 ETF，體質較實但漲幅落後"}, {"t": "IJR", "n": "標普小型股 ETF，成分股要求正獲利，可當品質對照"}], "en": "Inside the small-cap rally is a split worth knowing about. Unprofitable Russell 2000 companies have surged 154% since mid-2025, dwarfing the 34% gain of their profitable peers — investors have been paying up for AI exposure over current earnings. That ratio is the single most useful health check on this rally: when the money losers outrun the earners by more than four to one, what is being bought is optionality, and optionality is the first thing repriced when rates move against it.", "zh": "小型股這一波漲勢裡面，有一個值得知道的分歧。羅素 2000 中未獲利的成分股自 2025 年中以來大漲 154%，遠遠超過有獲利同儕的 34%——投資人一直在為「AI 曝險」付溢價，而不是為當下的盈餘。這個比率是檢驗這波漲勢體質最有用的單一指標：當虧錢的公司跑贏賺錢的公司四倍以上，被買的是選擇權價值，而選擇權價值正是利率一轉向就最先被重新定價的東西。", "url": "https://247wallst.com/investing/2026/07/16/the-russell-2000-is-having-its-best-year-in-23-years-heres-why-small-caps-are-winning-again/"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "新低清單", "color": "#5B8ED6", "stocks": [{"t": "APP", "n": "AppLovin，市值約 1,075 億美元卻落在 52 週新低名單首位"}, {"t": "IWV", "n": "羅素 3000 ETF，這份新低清單的母體"}], "en": "On Tuesday, 15 Russell 3000 names printed 52-week lows, and the largest by market value was AppLovin at roughly $107.5B — a company with trailing revenue growth of 60.6% trading at 24.3 times earnings. That combination is the point of this card. A 52-week-low list is a price list, not a value list; it mixes broken businesses with good ones whose expectations got ahead of them. The screen tells you where to look, never what to conclude.", "zh": "週二有 15 檔羅素 3000 成分股創下 52 週新低，其中市值最大的是 AppLovin，約 1,075 億美元——一家近十二個月營收成長 60.6%、本益比 24.3 倍的公司。這個組合正是這張卡的重點。52 週新低清單是一份價格清單，不是價值清單；它把體質壞掉的公司，和體質沒壞、只是預期先跑太快的公司混在一起。篩選器告訴你去哪裡看，從來不告訴你該下什麼結論。", "url": "https://www.trefis.com/stock/spy/articles-v3/611104/stocks-at-52-week-lows-tuesdays-full-list/2026-08-12"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "訂單時差", "color": "#5B8ED6", "stocks": [{"t": "MLR", "n": "Miller Industries，軍方訂單逾 2 億美元但 2028 至 2029 才認列"}, {"t": "AEHR", "n": "Aehr Test Systems，有效在手訂單 1.006 億美元"}, {"t": "NWPX", "n": "NWPX Infrastructure，水管在手訂單 4.23 億美元"}], "en": "Small caps trade on backlog headlines far more than large caps do, so the gap between an order and revenue is worth measuring every time. Miller Industries has military commitments above $200M — but production starts in 2027 with most revenue landing in 2028-2029. Aehr carries $100.6M of effective backlog against fiscal 2027 revenue guidance of $130-150M. NWPX ended the quarter with $423M of water transmission backlog versus $348M a year ago. Same word, three completely different conversion clocks.", "zh": "小型股比大型股更常靠「在手訂單」的標題交易，所以訂單與營收之間的時間差，每一次都值得量清楚。Miller Industries 的軍方承諾逾 2 億美元，但要 2027 年才開始生產、大部分營收落在 2028 至 2029 年；Aehr 的有效在手訂單 1.006 億美元，對應的是 2027 年度 1.3 至 1.5 億的營收指引；NWPX 季底水管在手訂單 4.23 億美元，去年同期為 3.48 億。同一個名詞，三種完全不同的轉換速度。", "url": "https://www.investing.com/news/company-news/miller-industries-q2-2026-slides-revenue-beats-military-pipeline-grows-93CH-4843595"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "估值提醒", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普小型股 ETF，用來衡量小型股整體估值水位"}, {"t": "IWO", "n": "羅素 2000 成長 ETF，本波漲幅集中的一端"}], "en": "The standard argument for small caps is that large caps are historically expensive while small caps are historically cheap. It has been a good argument for two years. The honest update is that it is now weaker than it was in January: after a 20% run, the discount that made the case has narrowed, and the narrowing happened fastest in exactly the unprofitable cohort that rose 154%. A valuation argument decays as it works — that is the nature of it, and it is the part people forget to re-check.", "zh": "支持小型股的標準論點是：大型股在歷史上偏貴、小型股在歷史上偏便宜。過去兩年這個論點很好用。誠實的更新是，它現在比 1 月時弱了：漲了 20% 之後，當初支撐這個論點的折價已經收窄，而且收窄最快的，正好就是那群漲了 154% 的未獲利公司。估值論點會在它生效的同時自我消耗——這是它的本質，也是大家最常忘記回頭重算的一段。", "url": "https://www.nerdwallet.com/investing/learn/understanding-small-cap-stocks"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "驗證通過", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Q3 財報的獲利延續性與庫藏股實際執行均價", "stocks": [{"t": "ALLT", "n": "Allot，Q2 營收 2,770 萬美元年增 15%，每股盈餘超預估 50%"}], "en": "The pool's designated test day arrived and Allot passed it. The Israeli network-intelligence and security vendor, which sells security-as-a-service to telecom carriers, reported Q2 revenue of $27.7M, up 15% from $24.1M, with GAAP net income of $2.6M, non-GAAP net income of $4.6M, diluted non-GAAP EPS of $0.09 against a $0.06 consensus, and $8.5M of operating cash flow. CEO Eyal Harari called it a fourth consecutive quarter of double-digit growth — which is exactly the claim that had no fresh verification before today. What remains unverified is the $40M buyback: an authorization is not an executed purchase, and the average price still has to show up in a filing. Carrier capex stays cyclical and Israeli geopolitical risk is real. A research lead, not investment advice.", "zh": "雷達池訂下的決勝日到了，Allot 過關。這家以色列的網路智慧與資安服務商、主力是賣給電信商的資安即服務，第二季營收 2,770 萬美元、自去年同期的 2,410 萬年增 15%，GAAP 淨利 260 萬美元，非 GAAP 淨利 460 萬、稀釋後非 GAAP 每股盈餘 0.09 美元，遠勝市場預估的 0.06，營運現金流 850 萬美元。執行長 Eyal Harari 說這是連續第四季雙位數成長——而這正是今天以前完全沒有新一季驗證的那個說法。尚未驗證的是那筆 4,000 萬美元庫藏股：授權不等於已買進，實際執行的股數與均價還要等申報文件。電信商資本支出的循環性與以色列地緣風險都沒有消失。這是研究線索，不是投資建議。", "url": "https://www.stocktitan.net/news/ALLT/allot-announces-second-quarter-2026-financial-p68hbgasha4z.html"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "水利基建", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Q3 財報的在手訂單轉換率與自由現金流指引達成度", "stocks": [{"t": "NWPX", "n": "NWPX Infrastructure，每股 1.62 美元超預估 1.35，股價仍承壓"}], "en": "NWPX Infrastructure makes large-diameter steel water pipe and precast concrete products for municipal water projects — an industry with no story and almost no coverage. Q2 EPS came in at $1.62 against a $1.35 consensus, revenue rose 19.7% to $159.5M ahead of the $154.7M estimate, gross profit grew 35.5% with margin expanding 250 basis points to 21.5%, and net income jumped 74.7% to $15.8M. Management raised full-year free cash flow guidance to $56-65M from $50-56M. The classic radar pattern is that the stock stayed under pressure anyway. The bear case: water transmission backlog slipped to $423M from $430M sequentially, municipal projects are lumpy and budget-driven, and one strong quarter does not establish a trend. A research lead, not investment advice.", "zh": "NWPX Infrastructure 做的是市政供水工程用的大口徑鋼製水管與預鑄混凝土產品，一個沒有故事、幾乎沒人覆蓋的產業。第二季每股盈餘 1.62 美元，勝過市場預估的 1.35；營收年增 19.7% 至 1.595 億美元，高於預估的 1.547 億；毛利年增 35.5%，毛利率擴張 250 個基點到 21.5%；歸屬普通股東淨利年增 74.7% 至 1,580 萬美元。管理層把全年自由現金流指引從 5,000 至 5,600 萬上修到 5,600 至 6,500 萬美元。而最典型的雷達型態是：股價依然承壓。反方要看清楚——水管在手訂單自上季的 4.30 億小幅降到 4.23 億，市政專案本來就是塊狀且吃預算，一個好季度不構成趨勢。這是研究線索，不是投資建議。", "url": "https://www.quiverquant.com/news/NWPX+Infrastructure+(NWPX)+Releases+Q2+2026+Earnings:+Revenue+and+EPS+Beat+Expectations"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "測試設備", "color": "#C9A227", "status": "RADAR · 下一個驗證點 下一季在手訂單能否支撐 1.3 至 1.5 億的年度指引", "stocks": [{"t": "AEHR", "n": "Aehr Test Systems，紀錄訂單 6,070 萬美元，2027 年度指引年增 160% 至 200%"}], "en": "Aehr Test Systems makes wafer-level and package-level burn-in equipment — the machines that stress-test chips before they ship. It is a micro cap in a niche most people have never heard of, and it is honestly only half-neglected now: the stock ripped 27-31% after fiscal Q4. Revenue was $18.8M with record quarterly bookings of $60.7M and $100.6M of effective backlog. Fiscal 2027 guidance is $130-150M, implying 160-200% growth, with pre-tax non-GAAP net income of 18-22% of revenue, and it excludes any contribution from memory or the recently completed AI benchmark customer. Bear case first: a single-digit-million revenue base means one delayed program moves the whole year, guidance of this slope carries no room for error, and the repricing already happened in one session. A research lead, not investment advice.", "zh": "Aehr Test Systems 做的是晶圓級與封裝級的老化測試設備，也就是晶片出貨前用來做壓力測試的機台。它是一檔落在多數人沒聽過的利基裡的微型股，而且要誠實說：它現在只能算「半忽視」——會計年度第四季財報後股價單日大漲 27% 至 31%。當季營收 1,880 萬美元，單季訂單創 6,070 萬美元紀錄，有效在手訂單 1.006 億美元。2027 年度指引 1.3 至 1.5 億美元，意味著年增 160% 至 200%，稅前非 GAAP 淨利率目標 18% 至 22%，而且這份指引還不含記憶體市場與剛完成的 AI 標竿客戶。反方先講：營收基數只有千萬美元級，一個專案遞延就會撼動整年；這種斜率的指引沒有容錯空間；而且重新定價在一個交易日內就已經發生了。這是研究線索，不是投資建議。", "url": "https://www.stocktitan.net/news/AEHR/aehr-test-systems-reports-fiscal-2026-fourth-quarter-and-full-year-aytbj239efe5.html"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "拖吊設備", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Q3 財報毛利率能否回到歷史 13% 中段", "stocks": [{"t": "MLR", "n": "Miller Industries，營收 2.4 億美元超預估 2.129 億，每股盈餘年減 13.7%"}], "en": "Miller Industries builds towing and recovery equipment — wreckers and car carriers. It is a niche leader with strong cash generation and almost nobody writes about it. Q2 revenue was $240.0M, up 12.1% year over year and 32.7% sequentially, well ahead of the $212.9M estimate. But profit went the other way: net income fell 14.1% to $7.3M and diluted EPS dropped 13.7% to $0.63, though still above the $0.37 estimate. Management reaffirmed 2026 revenue guidance of $850-900M and expects gross margin back to the historical mid-13% range. What is changing is the mix — military commitments above $200M plus an €8M French expansion and a new 200,000-square-foot Tennessee plant targeted for late 2027. The bear case is the whole point: revenue up, margin down, and the military revenue does not arrive until 2028-2029. A research lead, not investment advice.", "zh": "Miller Industries 造的是拖吊與救援設備，也就是拖吊車與載運車。它是這個利基市場的龍頭、現金產生能力強，卻幾乎沒有人在寫它。第二季營收 2.40 億美元，年增 12.1%、季增 32.7%，遠高於市場預估的 2.129 億。但獲利走的是反方向：淨利年減 14.1% 至 730 萬美元，稀釋後每股盈餘年減 13.7% 至 0.63 美元，儘管仍高於預估的 0.37。管理層重申 2026 年營收指引 8.5 至 9.0 億美元，並預期毛利率回到歷史的 13% 中段。正在改變的是業務組合——軍方承諾逾 2 億美元，加上 800 萬歐元的法國擴廠與一座逾 20 萬平方英尺的田納西州新廠，目標 2027 年底投產。反方就是重點本身：營收上去、毛利下來，而軍方營收要 2028 至 2029 年才會到。這是研究線索，不是投資建議。", "url": "https://www.stocktitan.net/news/MLR/miller-industries-reports-2026-second-quarter-s7xhr51yizvp.html"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "社區銀行", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Q3 財報淨息差能否守住 3.99%、買回速度是否延續", "stocks": [{"t": "STBA", "n": "S&T Bancorp，每股 1.02 美元年增 22.9%，淨息差擴大到 3.99%"}], "en": "S&T Bancorp is a Pennsylvania community bank — the kind of name that gets traded as one undifferentiated bet on rates rather than examined on its own. Q2 net income was $36.6M, or $1.02 per diluted share, up 8.5% sequentially and 22.9% year over year, beating estimates by 8.8%, though revenue of $105.24M slightly missed. Net interest income rose to $90.4M with net interest margin expanding to 3.99% and the efficiency ratio improving to 55.52%. The capital allocation is the cleaner signal: a new $100M repurchase authorization backed by 1.1 million shares actually bought in the quarter at an average $44.24, and nearly 3.2 million shares over three quarters — execution, not just permission. Risks: commercial real estate exposure, deposit-cost pressure, and a margin that benefits from a rate path that can reverse. A research lead, not investment advice.", "zh": "S&T Bancorp 是賓州的社區銀行，正是那種被當成「對利率的單一賭注」整批交易、沒人單獨檢查的名字。第二季淨利 3,660 萬美元、稀釋後每股 1.02 美元，季增 8.5%、年增 22.9%，超出市場預估 8.8%，但營收 1.0524 億美元略微不如預期。淨利息收入升至 9,040 萬美元，淨息差擴大到 3.99%，成本收入比改善到 55.52%。資本配置是更乾淨的訊號：新授權 1 億美元庫藏股，而背書是本季實際買回 110 萬股、均價 44.24 美元，近三季累計買回近 320 萬股——這是執行，不只是許可。風險在商用不動產曝險、存款成本壓力，以及那個吃利率路徑、隨時可能反轉的息差。這是研究線索，不是投資建議。", "url": "https://www.chartmill.com/news/STBA/Chartmill-51506-ST-Bancorp-NASDAQSTBA-Stock-Rises-on-Earnings-Beat-and-New-100M-Buyback-Program"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "利率條件", "color": "#C9A227", "status": "RADAR · 下一個驗證點 長端殖利率是否跟進下行，以及 6,030 萬美元剩餘額度的執行速度", "stocks": [{"t": "AHRT", "n": "AH Realty Trust，今年已買回約 470 萬股、均價 5.78 美元"}, {"t": "ATLO", "n": "Ames National，淨息差連三季擴張至 3.18%"}], "en": "Two pool names were logged with an explicit external check tied to today, so today is when it gets answered. AH Realty Trust, a small REIT whose profit comes mainly from net interest income, was filed under neglect partly because long-end yields at multi-decade highs made institutions avoid the whole sector; its verification point was written as whether the 30-year would follow the short end lower after CPI. The answer is no — the 10-year eased to about 4.65% while the 30-year barely moved from 5.231%. Ames National's thesis had the mirror-image dependency, with its margin improvement partly attributable to falling funding costs. So one tailwind stayed open and the other did not. Neither company did anything this week; only the environment moved, and only halfway. A research lead, not investment advice.", "zh": "池內有兩檔標的當初就寫下了一項綁在今天的外部檢查，所以今天就是回答的日子。AH Realty Trust 是一檔獲利主要來自淨利息收入的小型不動產信託，被歸入忽視的原因之一，就是長端殖利率在多年高點使法人整批迴避這個族群；它的驗證點寫的是「CPI 之後三十年期是否跟著短端一起降」。答案是沒有——十年期降到約 4.65%，三十年期則幾乎沒有從 5.231% 動過。Ames National 的論點有一個鏡像的依賴，它的息差改善有一部分要歸因於資金成本下降。所以一條順風還開著、另一條沒有。這兩家公司本週什麼都沒做，動的只有環境，而且只動了一半。這是研究線索，不是投資建議。", "url": "https://www.cnbc.com/2026/08/12/treasury-yields-inflation-cpi-data.html"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "整體方向", "color": "#6DB56D", "stocks": [{"t": "SPY", "n": "標普 500 ETF，內部人整體站在賣方的那個市場"}, {"t": "XLK", "n": "科技類股，唯一出現紀錄級高管買進的板塊"}], "en": "Start with the base rate before reading any single filing. Across the tracked universe as of Aug 9 there were 1,910 open-market sale transactions against just 40 purchases — roughly 48 sales for every buy by Form 4 count. Only 8 of 149 tracked companies had an officer buy on the open market. Against that backdrop one countercurrent stands out: 28 executives at companies inside the technology sector ETF have bought their own stock in the past six months, the highest count on record. Insiders are selling almost everywhere except the one place everyone assumes is overheated.", "zh": "讀任何一筆申報之前，先看整體的基準比率。截至 8 月 9 日，被追蹤的範圍裡有 1,910 筆公開市場賣出、對上僅 40 筆買進，以 Form 4 筆數計算約是 48 賣比 1 買；149 家被追蹤公司中，只有 8 家出現高階主管的公開市場買進。在這個背景下，有一條逆流特別顯眼：科技類股 ETF 成分公司中，過去六個月有 28 位高階主管買進自家股票，是有紀錄以來最高。內部人幾乎在每個地方都在賣，唯獨在大家都假設過熱的那個地方在買。", "url": "https://finance.yahoo.com/markets/article/a-record-number-of-tech-stock-insiders-are-buying-their-own-shares-in-2026-133810825.html"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "群聚訊號", "color": "#6DB56D", "stocks": [{"t": "TSM", "n": "台積電 ADR，90 天內 3 位不同內部人買進，居大型股之首"}, {"t": "SOXX", "n": "半導體 ETF，這則群聚訊號所在的產業"}], "en": "Cluster buys are rare enough that scarcity is part of the signal. In the trailing 90-day window only 2 of 149 tracked large caps registered one at all, led by Taiwan Semiconductor's ADR with three distinct insider buyers. Two caveats before reading anything into it. Cluster-buy statistics historically carry more weight in small and mid caps, where insiders hold a larger share of what they know; and for a foreign private issuer, disclosure timing and rules differ from a domestic Form 4 filer, so the comparison is not apples to apples.", "zh": "群聚買進罕見到「稀有」本身就是訊號的一部分。在過去 90 天的窗口裡，149 家被追蹤的大型股中只有 2 家出現群聚買進，其中以台積電 ADR 的 3 位不同買方居首。讀它之前有兩個但書。第一，群聚買進的統計意義在中小型股身上歷來更強，因為那裡的內部人握有的資訊佔比更高；第二，外國私人發行人的揭露時點與規則跟美國本土的 Form 4 申報人不同，兩者不能直接類比。", "url": "https://tradune.com/statistics/"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "13F 截止", "color": "#6DB56D", "stocks": [{"t": "BRK.B", "n": "波克夏，每季 13F 最被逐行拆解的一份申報"}, {"t": "ARKK", "n": "方舟創新 ETF，持股每日公開，可對照 13F 的延遲代價"}], "en": "Friday Aug 14 is the deadline for Q2 13F filings, covering positions as of June 30. It is the loudest institutional-flow event of the quarter and also the most misread, so hold three limits in mind. The data is already 45 days stale, and in a quarter where the Russell 2000 ran hard, that is a long time. It shows only long US-listed equity positions — no shorts, no bonds, no foreign listings, no cash. And options can appear at notional values that make a small hedge look like a large conviction bet.", "zh": "8 月 14 日週五是第二季 13F 的申報截止日，揭露的是 6 月 30 日當下的持股。這是每季最吵的法人資金流事件，也是最常被誤讀的一個，所以要記住三項限制。第一，資料本身已經有 45 天的延遲，而在一個羅素 2000 大漲的季度裡，45 天是很長的時間。第二，它只顯示美股的多頭部位——沒有放空、沒有債券、沒有海外掛牌、也沒有現金。第三，選擇權可能以名目金額呈現，讓一筆小避險看起來像一個大信念。", "url": "https://13f.info/newest"},
    {"id": "week_0", "channel": "本週事件", "tag": "數據接力", "color": "#C97DD4", "stocks": [{"t": "XRT", "n": "零售類股 ETF，週五 7 月零售銷售的直接標的"}, {"t": "WMT", "n": "沃爾瑪，消費端量價分離最常被引用的觀察窗"}, {"t": "TGT", "n": "Target，非必需消費佔比較高，對消費降溫更敏感"}], "en": "The data calendar does not stop with CPI. Thursday Aug 13 at 8:30 a.m. ET brings July PPI, forecast at +0.2% against a prior -0.3%, plus initial jobless claims at a forecast 202,000 versus 199,000. PPI is the one to watch: it is where the energy pass-through shows up before it reaches consumers, and it is the reason a third of the market still prices a September hike. Friday Aug 14 delivers July retail sales, the check on whether cooler prices came with weaker spending.", "zh": "數據行事曆沒有在 CPI 就停下來。週四 8 月 13 日美東上午 8:30 公布 7 月 PPI，預估月增 0.2%、前值為月減 0.3%，同時發布初領失業金人數，預估 20.2 萬、前值 19.9 萬。PPI 是這一組裡最該盯的：能源價格的傳導會先出現在生產端、再走到消費端，這也正是市場仍有三分之一資金押 9 月升息的理由。週五 8 月 14 日則是 7 月零售銷售，用來檢查物價降溫是否伴隨消費同步走弱。", "url": "https://www.investing.com/news/stock-market-news/ppi-and-jobless-claims-highlight-economic-data-due-thursday-93CH-4855846"},
    {"id": "week_1", "channel": "本週事件", "tag": "設備財報", "color": "#C97DD4", "stocks": [{"t": "AMAT", "n": "應用材料，週四公布會計年度第三季"}, {"t": "LRCX", "n": "科林研發，蝕刻與沉積設備的同業對照"}, {"t": "KLAC", "n": "科磊，量測檢測端，通常最早看到產能規劃變化"}], "en": "Applied Materials reports fiscal Q3 on Thursday Aug 13, and after Cisco's numbers the question is specific rather than general. Cisco booked $9.3B of AI orders for fiscal 2026 and guided fiscal 2027 AI revenue to $6.5-7B; that demand has to be built with something. Semiconductor capital equipment sits one layer further upstream than networking, which makes it the earlier signal — if AI orders are real and durable, equipment bookings show it first, and if they are being pulled forward, equipment shows that first too.", "zh": "應用材料在 8 月 13 日週四公布會計年度第三季，而在思科的數字出來之後，這場財報要回答的問題變得非常具體、而不再籠統。思科 2026 年度拿下 93 億美元 AI 訂單、並把 2027 年度 AI 營收目標訂在 65 至 70 億美元，這些需求總得用東西蓋出來。半導體資本設備比網通設備更上游一層，因此是更早的訊號——如果 AI 訂單是真且持久的，設備接單會先反映；如果是提前拉貨，設備也會先反映。", "url": "https://www.investing.com/news/stock-market-news/ppi-and-jobless-claims-highlight-economic-data-due-thursday-93CH-4855846"},
    {"id": "eval_0", "channel": "今日評估", "tag": "今日一問", "color": "#E8A838", "status": "DISCUSS · 讀完到最後一頁，複製 PROMPT 找 CLAUDE 復盤", "stocks": [{"t": "QQQ", "n": "那斯達克 100，短端利率紓解的最大受惠者"}, {"t": "XLU", "n": "公用事業，吃長端利率、卻在輪動裡轉強的矛盾點"}], "en": "The one thing worth sitting with today is what the bond market did not do. CPI behaved, September hike odds fell to about 42%, and the 10-year eased to roughly 4.65% — but the 30-year barely moved from 5.231%. The short end accepted the report and the long end did not. That split matters because two very different groups of assets are being priced off two different curves: risk appetite runs on the short end, while REITs, utilities and anything long-duration run on the long end. Equities rallied on the half of the curve that moved. So which end do you think is right — is the long bond pricing inflation the CPI print has not caught yet, or is it just pricing supply?", "zh": "今天最值得坐下來想的，是債市沒有做的那件事。CPI 表現規矩、9 月升息機率降到約 42%、十年期公債殖利率降到約 4.65%——但三十年期幾乎沒有從 5.231% 動過。短端接受了這份數據，長端沒有。這個分裂之所以重要，是因為兩群性質完全不同的資產正被兩條不同的曲線定價：風險偏好吃短端，而不動產信託、公用事業以及所有長天期資產吃長端。股市漲的，是曲線上有動的那一半。所以你認為哪一端是對的——長債是在定價一個 CPI 還沒抓到的通膨，還是只是在定價發債供給？", "url": "https://www.cnbc.com/2026/08/12/treasury-yields-inflation-cpi-data.html"}
];

})();

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>

      </div>

      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>

  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/13/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v7.4</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
