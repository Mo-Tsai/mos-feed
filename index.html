/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {

  :root[data-theme="dark"] {

    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;

  body::before {

    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }

    15% { opacity: 1; }
    70% { opacity: 1; }

  ::-webkit-scrollbar { width: 2px; }

  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }
  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }
  .source-link { position: relative; display: inline-block; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }

  {"id": "earn_2", "channel": "財報速報", "tag": "Altria 考慮出價", "color": "#E8786A", "zh": "菸草業可能有大型併購：Altria（MO）11/26 確認正考慮收購英國 Imperial Brands，若出價很可能全現金，目前尚未出價；Imperial 則表示沒有收到任何接洽或提案。依英國收購規則，Altria 要在 12/24 倫敦時間下午 5 點前表態。一家報導指出 Altria 已有約 210 億美元淨負債，融資方式是第一個疑問。", "en": "Altria (MO) confirmed on Nov. 26 that it is considering an offer, likely all cash, for Britain's Imperial Brands, with no bid yet. Imperial says it has received no approach or proposal. UK takeover rules give Altria until 5 p.m. London time on Dec. 24 to firm up or walk away. One report notes Altria already carries about $21 billion of net debt, so financing is the first question.", "url": "https://www.benzinga.com/m-a/26/11/63669426/altria-confirms-potential-takeover-discussions-for-british-rival-imperial-brands", "stocks": [{"t": "MO", "n": "確認考慮收購，週五盤前約 -2%"}, {"t": "PM", "n": "美股菸草同業對照"}, {"t": "BTI", "n": "英美菸草 ADR，同業整併題材"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "12 月升息幾乎定價", "color": "#7C6AF7", "zh": "利率市場對 12/8 至 9 日升息 1 碼的定價，不同來源寫約 99%。背景是 11/25 公布的 10 月 PCE：整體年增 3.8%、核心 3.3%（預期 3.2%），實質消費支出小幅下降。升息本身意外不大，週五 12/4 的就業數字比較可能影響市場對 2027 年初路徑的看法。", "en": "Rate markets price a quarter-point hike at the Dec. 8-9 meeting at about 99%, according to several reports. Behind it, October PCE released Nov. 25 showed headline inflation at 3.8% and core at 3.3% versus 3.2% expected, while real spending slipped. The hike itself would be little surprise; the Dec. 4 jobs report is more likely to shape the early-2027 path.", "url": "https://www.cnbc.com/2026/11/25/pce-inflation-report-october-2026.html", "stocks": [{"t": "SHY", "n": "短天期公債 ETF，升息定價最直接"}, {"t": "XLF", "n": "金融類股 ETF，利率路徑敏感族群"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "中國護盤晶片股", "color": "#7C6AF7", "zh": "據媒體引述 Wind 資料，中國中證半導體指數週五單日 +17.6%（有的寫 17.4%），刷新紀錄；導火線是官媒公布的政府會議內容暗示會出手止住股市長跌，並提高國家資金角色。幅度非常罕見，我只看到媒體轉述，請自行核對指數資料。政策推動的急漲，重點看後續資金是否真的進場。", "en": "Media citing Wind data report China's CSI semiconductor index jumped a record 17.6% on Friday (some say 17.4%) after a state-media readout of a government meeting signaled action against the long market slide and a bigger role for state funds. The size is extraordinary and I have only media accounts, so verify the index data. For a policy-driven spike, the test is whether the money actually arrives.", "url": "https://mlq.ai/news/chinas-chip-stocks-post-record-176-one-day-gain-on-state-support-pledge/", "stocks": [{"t": "KWEB", "n": "中國網路股 ETF，觀察情緒外溢"}, {"t": "MCHI", "n": "中國股票 ETF"}, {"t": "SMH", "n": "美國半導體 ETF，中國國產替代的對照"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "OPEC+ 週日開會", "color": "#7C6AF7", "zh": "週日（11/29）OPEC+ 部長會議，路透消息人士的說法是原則同意 2027 年第一季產量目標不變，部長尚未拍板。週五布蘭特盤中報價約 96 至 97 美元，另一家寫收低到 94.15，各來源差距大。荷姆茲與沙烏地設施的威脅仍在，週一開盤要看的是實際決議與航運消息。", "en": "OPEC+ ministers meet Sunday, Nov. 29. Reuters sources say there is an agreement in principle to hold first-quarter 2027 output targets, pending a ministerial decision. Friday Brent quotes ran around $96-$97 intraday, while another outlet reports a drop to $94.15. With threats to Hormuz and Saudi facilities unresolved, watch the actual decision and shipping news at Monday's open.", "url": "https://financefeeds.com/brent-crude-oil-price-96-30-friday-opec-plus-set-to-hold-q1-output-sunday-bull-100-bear-92-57/", "stocks": [{"t": "USO", "n": "紐約原油 ETF，週五約 -1%"}, {"t": "XOM", "n": "大型整合油公司"}, {"t": "OXY", "n": "對油價敏感度較高的產油商"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "貴金屬礦商回彈", "color": "#4EABA4", "zh": "金屬股週五跟著金屬價格回彈：CNBC 午盤時黃金期貨漲逾 2%、白銀 +7.4%、銅 +3%，Newmont +4.1%、AngloGold +4.7%、Coeur +6.8%。其他報導稱金價是從約 14 至 15 個月低點反彈，各家收盤價不一致。礦商剛經歷重挫，單日反彈還不能當趨勢反轉。", "en": "Miners bounced with metals on Friday. At midday CNBC showed gold futures up more than 2%, silver 7.4% and copper 3%, with Newmont up 4.1%, AngloGold 4.7% and Coeur 6.8%. Other reports describe gold rebounding from a 14- to 15-month low, with differing closing prices. After the recent rout, one day is not a trend change.", "url": "https://www.cnbc.com/2026/11/27/stocks-moving-the-most-today-live-updates.html", "stocks": [{"t": "GDX", "n": "金礦股 ETF，前段時間重挫後回彈"}, {"t": "NEM", "n": "最大金礦商之一，午盤 +4.1%"}, {"t": "CDE", "n": "銀金礦商，午盤 +6.8%"}, {"t": "SLV", "n": "白銀 ETF，銀價漲幅大於黃金"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "中游併購傳聞", "color": "#4EABA4", "zh": "天然氣中游又有併購題材：彭博報導 Targa Resources 正洽談收購 Kinetik，尚未成交；Kinetik 收盤 +9.25%，Targa 午盤小跌近 1%。路透 9 月就報過 Kinetik 在探索出售。傳聞價與最終條件都未知，追價者承擔的是談判破局的跌幅。", "en": "Midstream M&A is back: Bloomberg reports Targa Resources is in talks to buy Kinetik, with no deal yet. Kinetik closed up 9.25%, while Targa was down nearly 1% at midday. Reuters had reported in September that Kinetik was exploring a sale. Price and terms are unknown, and chasers carry the downside if talks fail.", "url": "https://www.cnbc.com/2026/11/27/stocks-moving-the-most-today-live-updates.html", "stocks": [{"t": "KNTK", "n": "收盤 +9.25%，收購傳聞標的"}, {"t": "TRGP", "n": "傳聞買方，午盤小跌"}, {"t": "AMLP", "n": "中游能源 ETF"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "黑五線上消費", "color": "#4EABA4", "zh": "零售旺季數字陸續出來。Adobe 估感恩節線上消費約 71 億美元（+10.4%），高於它先前預測的 69 億；黑五預測是 129 億（+9.2%），實績通常隔天公布。亞馬遜週五漲約 4%，非必需消費是尾盤最強類股（約 +2.6%）；Adobe 只量線上，看不到實體店。", "en": "Holiday data is arriving. Adobe puts Thanksgiving online spending at about $7.1 billion (+10.4%), above its $6.9 billion forecast, and projects $12.9 billion for Black Friday (+9.2%), with actuals usually published the next day. Amazon rose about 4% and consumer discretionary led late trading at roughly +2.6%. Adobe measures online only, not stores.", "url": "https://stocktwits.com/news-articles/markets/equity/adbe-stock-on-track-for-4-day-rally-adobe-reports-surge-in-ai-traffic-7-1-b-thanksgiving-sales/cNb6GnOR9Va", "stocks": [{"t": "AMZN", "n": "週五約 +4%，道瓊領漲"}, {"t": "XRT", "n": "零售 ETF，旺季表現指標"}, {"t": "ADBE", "n": "消費數據發布方"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "羅素週漲 6.5%", "color": "#5B8ED6", "zh": "Russell 2000 週五收 2,750.30（+1.71%），整週從 2,581.79 漲約 6.5%。IWM 當天約 +1.8%。漲幅跟那斯達克的 6.7% 相近，表示這週回補不只在大型科技。收盤數字來自彙整網站，與 Yahoo 報價一致。", "en": "The Russell 2000 closed Friday at 2,750.30 (+1.71%), up about 6.5% for the week from 2,581.79, with IWM up about 1.8% on the day. That is close to the Nasdaq's 6.7% weekly gain, so the rebound reached beyond megacap tech. The close comes from aggregators and matches Yahoo's quote.", "url": "https://www.ad-hoc-news.de/boerse/news/marktberichte/russell-2000-closes-1-71-prozent-higher-as-ai-fears-ease/70563104", "stocks": [{"t": "IWM", "n": "Russell 2000 ETF，週五約 +1.8%"}, {"t": "IWO", "n": "小型成長股 ETF，對 AI 情緒較敏感"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "Tronox 無消息大漲", "color": "#5B8ED6", "zh": "鈦白粉廠 Tronox（TROX）週五 +12.3%，GuruFocus 指出沒有公司消息。前幾天執行長 Romano 以約 1.86 美元買 7.5 萬股（約 13.9 萬美元），另一位高階主管也買約 2 萬美元；股價仍比 52 週高點低約八成。資料打架：Investing.com 寫公開市場買進，GuruFocus 寫是預定交易計畫。", "en": "Titanium dioxide producer Tronox (TROX) rose 12.3% Friday with no company news, per GuruFocus. Days earlier CEO Romano bought 75,000 shares near $1.86 (about $139,000) and another executive about $20,000; the stock remains roughly 80% below its 52-week high. Sources conflict: Investing.com calls it an open-market buy, GuruFocus says it was a pre-planned trade.", "url": "https://gurufocus.com/news/9228812/tronox-trox-stock-is-up-123-today-without-company-news", "stocks": [{"t": "TROX", "n": "週五 +12.3%，執行長近期買進"}, {"t": "CC", "n": "同屬鈦白粉化工的 Chemours"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "Ero 停工逆勢跌", "color": "#5B8ED6", "zh": "銅價週五上漲約 3%，銅礦商 Ero Copper（ERO）卻下跌：巴西帕拉州環保機關下令後，公司暫停 Tucuma 礦場全部採選作業，復工要等補救方案審核通過。盤中跌幅各來源約 4% 至 5%。礦股的公司個別風險，可以蓋過商品價格利多。", "en": "Copper rose about 3% Friday, yet Ero Copper (ERO) fell after suspending all mining and processing at its Tucuma operation on an order from Para state's environmental agency; restarting needs approval of a remediation plan. Reported declines ranged from about 4% to 5%. In mining stocks, company-specific risk can outweigh a commodity rally.", "url": "https://marketbeat.com/instant-alerts/price-ero-copper-nyse-ero-shares-gap-down-should-you-sell-2026-11-27", "stocks": [{"t": "ERO", "n": "Tucuma 礦停工，盤中約 -4% 至 -5%"}, {"t": "COPX", "n": "銅礦股 ETF，對照族群走勢"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "查不到催化劑", "color": "#5B8ED6", "zh": "週五還有兩檔大漲但我查不到公司層面原因：生技 Vera Therapeutics 午盤約 +13% 至 +16%（各時點不同），Gunnison Copper 約 +22%。後者可能跟銅相關題材一起漲，但報導沒有給公司催化劑。半日盤量薄，沒有原因的大漲先當雜訊，週一看量能否延續。", "en": "Two big movers lacked a company-specific reason in my search: biotech Vera Therapeutics was up roughly 13%-16% intraday, and Gunnison Copper about 22%. The latter may have ridden copper-linked buying, but no company catalyst was reported. In a thin half session, treat unexplained spikes as noise until volume confirms them Monday.", "url": "https://businessupturn.com/usa/money/us-markets/midday-movers-gunnison-copper-surges-22-as-xp-inc-and-vera-therapeutics-also-shine/", "stocks": [{"t": "VERA", "n": "午盤大漲，未見公司公告原因"}, {"t": "GCUMF", "n": "Gunnison Copper 場外交易代號，約 +22%"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "判讀：反彈品質", "color": "#5B8ED6", "zh": "判讀：一週 +6.5% 看起來很強，但先分三件事。一是起點很低，前一週剛重挫；二是週五只開半天，參與的人少；三是 10 年期殖利率仍約 4.94%，浮動利率債多的小公司壓力沒變。比較含獲利門檻的 IJR 與 Russell 2000 的 IWM，可以看出資金買的是體質還是跌深。", "en": "A reading tip: a 6.5% week looks strong, but separate three things. The starting point followed a sharp drop, Friday was a half session, and the 10-year yield near 4.94% still pressures small firms with floating-rate debt. Comparing the profit-screened IJR with the Russell 2000 tracker IWM shows whether money is buying quality or just the most beaten-down names.", "url": "https://www.ad-hoc-news.de/boerse/news/marktberichte/russell-2000-closes-1-71-prozent-higher-as-ai-fears-ease/70563104", "stocks": [{"t": "IJR", "n": "S&P 600 ETF，納入有獲利門檻"}, {"t": "VTWO", "n": "Russell 2000 ETF，含較多虧損公司"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "IES 董事買進", "color": "#C9A227", "zh": "新名字 IES Holdings（IESC），做資料中心與建築的機電工程。董事 David Gendell 11/24 以 163.25 美元買 4,000 股（約 65 萬美元），執行長也小買約 4.1 萬美元；公司 11/20 公布 2026 會計年度營收 44.8 億（+33%）、積壓訂單 49.6 億（併購 DBM 另增約 26 億），並加碼 3.5 億庫藏股。忽視面證據偏弱（分析師覆蓋與股價反應我沒核實）；風險是高度押資料中心、約三成積壓訂單開工前不具約束力。研究線索，非投資建議。", "en": "New name: IES Holdings (IESC), an electrical and mechanical contractor for data centers and buildings. Director David Gendell bought 4,000 shares at $163.25 (about $650,000) on Nov. 24 and the CEO about $41,000. On Nov. 20 the company reported fiscal 2026 revenue of $4.48 billion (+33%), backlog of $4.96 billion (DBM adds about $2.6 billion) and $350 million more in buybacks. Neglect evidence is weak (coverage and price reaction unverified); risks are data-center concentration and roughly 30% of backlog being unenforceable before work starts. A research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001048268/000104826826000176/q42026pressrelease-septemb.htm", "stocks": [{"t": "IESC", "n": "董事 11/24 買約 65 萬美元，財年營收 +33%"}], "status": "RADAR · 下一個驗證點 約 2027/2 初 Q1 財報"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "紙板廠董事買進", "color": "#C9A227", "zh": "新名字 Clearwater Paper（CLW），生產包裝紙板。董事 Toeldte 11/24 透過家族信託以 16.50 美元買 7,617 股（約 12.6 萬美元），當時股價 90 天跌約 20%；第三季調整後 EBITDA 2,400 萬（去年 1,800 萬），持續營業淨損從 5,400 萬縮到 200 萬。反方：第四季 EBITDA 指引降到 1,000 至 2,000 萬、紙板均價年減 4%、Augusta 廠季末出過重大運轉中斷。研究線索，非投資建議。", "en": "New name: Clearwater Paper (CLW), a paperboard maker. Director Toeldte bought 7,617 shares at $16.50 (about $126,000) through a family trust on Nov. 24, after a roughly 20% 90-day slide. Q3 adjusted EBITDA rose to $24 million from $18 million and the continuing-operations loss narrowed to $2 million from $54 million. Against that, Q4 EBITDA guidance is $10-20 million, paperboard prices fell 4% year over year and the Augusta mill had a major late-quarter disruption. A research lead, not investment advice.", "url": "https://www.investing.com/news/insider-trading-news/clearwater-paper-director-buys-125688-in-company-stock-93CH-5051852", "stocks": [{"t": "CLW", "n": "董事 11/24 買約 12.6 萬美元，Q4 指引偏弱"}], "status": "RADAR · 下一個驗證點 約 2027/2 Q4 財報"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "Quanterix 董座出手", "color": "#C9A227", "zh": "新名字 Quanterix（QTRX），做超高靈敏度生物標記檢測儀器與試劑。董事會主席 Donnelly 11/24 在公開市場以均價 2.17 美元買 25 萬股（約 54 萬美元）。第三季營收 3,500 萬、季增 6.3% 但年減約 13%，全年指引收在 1.42 億至 1.46 億，遠低於年初的 1.69 億至 1.74 億；現金類資產 8,070 萬，前一季 9,690 萬。拐點只有一季季增，燒錢是最大風險。研究線索，非投資建議。", "en": "New name: Quanterix (QTRX), maker of ultra-sensitive biomarker detection instruments and reagents. Chair Donnelly bought 250,000 shares on the open market at an average $2.17 (about $542,000) on Nov. 24. Q3 revenue of $35 million rose 6.3% sequentially but fell about 13% year over year, and full-year guidance of $142-146 million is far below the early-year $169-174 million. Cash and securities fell to $80.7 million from $96.9 million. One sequential uptick is the only inflection, and cash burn is the main risk. A research lead, not investment advice.", "url": "https://ir.quanterix.com/news-releases/news-release-details/quanterix-releases-financial-results-third-quarter-2026", "stocks": [{"t": "QTRX", "n": "主席 11/24 買約 54 萬美元，全年指引下修"}], "status": "RADAR · 下一個驗證點 約 2027/3 Q4 財報"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "AFC 創辦人加碼", "color": "#C9A227", "zh": "池內追蹤 AFC Gamma（AFCG），大麻產業抵押放款起家。創辦人 Tannenbaum 11/23 至 24 日以約 3.37 至 3.49 美元再買約 10.5 萬股，另一位同姓高層買 2,000 股。第三季每股淨值 8.55 美元（單季 +0.30、連三季成長），季中以均價 3.46 回購約 100 萬美元；買價約是淨值的四成。不良貸款比率我仍沒查到，這是當初設定的核心驗證點；配息只有 0.05。研究線索，非投資建議。", "en": "Pool follow-up: AFC Gamma (AFCG), which began as a cannabis mortgage lender. Founder Tannenbaum bought about 105,000 more shares at roughly $3.37-$3.49 on Nov. 23-24, and another executive with the same surname bought 2,000. Q3 net asset value was $8.55 a share (+$0.30, a third straight gain), and the firm repurchased about $1 million at $3.46; the purchase price is about 40% of NAV. I still have no non-accrual figure, the core checkpoint, and the dividend is only $0.05. A research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/1822523/000162828026070591/afcg-2026115xex991afcgearn.htm", "stocks": [{"t": "AFCG", "n": "池內追蹤：創辦人再買約 36 萬美元"}], "status": "RADAR · 下一個驗證點 約 2027/3 Q4 財報（不良貸款）"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "Donegal 驗證未過", "color": "#C9A227", "zh": "池內追蹤 Donegal Group（DGICA），賓州區域產險。持股逾一成的母公司 11/20 至 25 日又買約 3.75 萬股、約 71 萬美元。但入池時設的兩個驗證點沒過：第三季綜合率 96.5%（目標 96% 以下，去年 95.9%），淨已賺保費仍年減 3.0%；淨利 1,820 萬，低於去年 2,010 萬。有分析估排除準備金回沖與天候因素後綜合率約 98.7%。母公司買進不能代替承保改善。研究線索，非投資建議。", "en": "Pool follow-up: Donegal Group (DGICA), a Pennsylvania regional property insurer. Its more-than-10% parent bought about 37,500 more shares, roughly $713,000, on Nov. 20-25. But both original checkpoints failed: the Q3 combined ratio was 96.5% (target under 96%, 95.9% a year earlier) and net premiums earned still fell 3.0%; net income dropped to $18.2 million from $20.1 million. One analysis puts the ratio near 98.7% excluding reserve releases and weather effects. Parent buying is no substitute for better underwriting. A research lead, not investment advice.", "url": "https://www.nasdaq.com/press-release/donegal-group-inc-announces-third-quarter-and-first-nine-months-2026-results-2026-10", "stocks": [{"t": "DGICA", "n": "母公司續買約 71 萬美元，Q3 綜合率未達標"}], "status": "RADAR · 下一個驗證點 約 2027/2 Q4 財報"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "Prenetics 高層再買", "color": "#C9A227", "zh": "池內追蹤 Prenetics（PRE），主力是保健品牌 IM8。公司公告執行長與兩位財務主管 11/20 至 24 日以均價約 9.92 美元買 127,435 股（約 126 萬美元）。第三季營收 6,410 萬（+228%）、IM8 6,290 萬（+266%），維持全年 2.2 億至 2.3 億指引與 2027 年 IM8 逾 4 億目標。反方：單季淨損 2,540 萬、調整後 EBITDA 虧 1,270 萬，營收又高度集中單一品牌。研究線索，非投資建議。", "en": "Pool follow-up: Prenetics (PRE), whose main business is the IM8 supplement brand. The company says its CEO and two finance chiefs bought 127,435 shares at about $9.92 (roughly $1.26 million) on Nov. 20-24. Q3 revenue was $64.1 million (+228%), IM8 $62.9 million (+266%), with full-year guidance of $220-230 million and a $400 million-plus 2027 IM8 target maintained. Against that: a $25.4 million quarterly net loss, a $12.7 million adjusted EBITDA loss and heavy reliance on one brand. A research lead, not investment advice.", "url": "https://www.globenewswire.com/news-release/2026/11/25/3410187/0/en/prenetics-im8-leadership-purchases-1-26-million-of-shares-following-third-quarter-results.html", "stocks": [{"t": "PRE", "n": "池內追蹤：高層買約 126 萬美元，虧損仍大"}], "status": "RADAR · 下一個驗證點 約 12 月 IM8 月營收與虧損收斂"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "Saba 買封閉基金", "color": "#6DB56D", "zh": "維權投資人 Saba Capital 在申報中大買封閉型基金：11/24 買 Destiny Tech100（DXYZ）約 20.9 萬股、約 506 萬美元，也買 MXF、ECF 等。它 11/20 的 13D 揭露持股 7.58%、稱股價低估；另一份修正件寫 10.53%，數字對不起來。這類買進押的是折價收斂與治理施壓，跟公司高層看好營運是兩回事。", "en": "Activist Saba Capital has been buying closed-end funds: about 209,000 shares of Destiny Tech100 (DXYZ), roughly $5.06 million, on Nov. 24, plus funds such as MXF and ECF. Its Nov. 20 13D showed a 7.58% stake and called the shares undervalued, while an amended filing shows 10.53%, which does not reconcile. This bet is on a narrowing discount and governance pressure, not insiders' view of operations.", "url": "https://www.tradingview.com/news/tradingview:901614ff2e7f7:0-boaz-r-weinstein-signals-activist-plans-at-destiny-tech100-with-7-58-stake/", "stocks": [{"t": "DXYZ", "n": "Saba 11/24 買約 506 萬美元"}, {"t": "MXF", "n": "墨西哥封閉型基金，同批買進"}, {"t": "ECF", "n": "可轉債封閉型基金，同批買進"}]},
  {"id": "insider_1", "channel": "內部人動向", "tag": "董事級大額連買", "color": "#6DB56D", "zh": "金額較大的兩組：董事法人 Docler Holding 11/23 至 25 日連三天買 PLBY 共約 148 萬股、約 170 萬美元。海底礦產公司 TMC 的董事 Karkar 11/24 買 50 萬股約 81 萬美元，執行長隔天再買約 3.3 萬。Karkar 那筆來自彙整站摘要、未核對原件；兩家都屬高波動公司，大股東買進不代表基本面轉好。", "en": "Two larger sets: director entity Docler Holding bought about 1.48 million PLBY shares, roughly $1.70 million, over Nov. 23-25. At seabed-minerals firm TMC, director Karkar bought 500,000 shares for about $805,000 on Nov. 24 and the CEO about $33,000 the next day. The Karkar trade comes from an aggregator summary I have not checked against the filing. Both stocks are volatile, and big-holder buying does not mean fundamentals improved.", "url": "https://finviz.com/insidertrading", "stocks": [{"t": "PLBY", "n": "董事法人三天買約 170 萬美元"}, {"t": "TMC", "n": "董事與執行長接連買進"}]},
  {"id": "insider_2", "channel": "內部人動向", "tag": "判讀：看交易性質", "color": "#6DB56D", "zh": "判讀：同樣叫內部人買進，性質可能差很多。Atlassian 共同創辦人 Cannon-Brookes 有整理指出 11/11 那批屬 8/9 就設定的預定交易計畫，11/25 約 186 萬美元那筆是否同一計畫要看原件；PainReform（PRFX）臨時執行長 11/4 至 13 日的幾筆拖到 11/27 才申報。看 Form 4 先確認三件事：代碼是不是 P、有沒有 10b5-1 註記、交易日離今天多遠。", "en": "Not all insider buys are alike. One tracker says Atlassian co-founder Cannon-Brookes's Nov. 11 purchases were made under a plan set on Aug. 9; whether the roughly $1.86 million bought on Nov. 25 falls under it needs the filing. At PainReform (PRFX), the interim CEO's Nov. 4-13 purchases were not filed until Nov. 27. On any Form 4, check three things: whether the code is P, whether a 10b5-1 plan is noted, and how old the trade date is.", "url": "https://amberallocates.substack.com/p/insider-flow-november-514-2026", "stocks": [{"t": "TEAM", "n": "先前批次屬預定計畫，需核對原件"}, {"t": "PRFX", "n": "11 月上旬交易延到 11/27 申報"}]},
  {"id": "capitol_0", "channel": "政要持股", "tag": "五人同日賣出", "color": "#B5654D", "zh": "五位眾議員（Pelosi、Kean、Cohen、Julie Johnson、Kustoff）都申報 10/7 賣出 Warner Bros. Discovery。Pelosi 那筆是配偶帳戶、5 萬至 10 萬美元，附註寫明是 Paramount Skydance 併購的現金款。併購案 10/6 完成、每股約 31 美元現金，這是持股被換成現金，沒有看空判斷可解讀。同日多人賣出，先查有沒有公司事件。", "en": "Five House members (Pelosi, Kean, Cohen, Julie Johnson and Kustoff) reported selling Warner Bros. Discovery on Oct. 7. Pelosi's, in a spouse account at $50,001-$100,000, is explicitly noted as cash proceeds from the Paramount Skydance merger. The deal closed Oct. 6 at about $31 a share in cash, so holdings were converted to cash and there is no bearish view to read. When many sell on one day, check for a corporate event first.", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035780.pdf", "stocks": [{"t": "SKYD", "n": "合併後的 Skydance，併購完成後掛牌"}, {"t": "XLC", "n": "通訊服務類股 ETF，媒體整併所屬板塊"}]},
  {"id": "capitol_1", "channel": "政要持股", "tag": "判讀：誰的帳戶", "color": "#B5654D", "zh": "判讀：看是哪個帳戶。眾議員 Hern 11/24 這份申報的交易分屬家族基金會、家族可撤銷信託與個人退休帳戶，除了賣 ASML、Phillips 66 等股票，也列有一筆 1.5 萬至 5 萬美元的地方教育債券買進。Meuser 同日申報的 Nvidia 部分賣出（1,001 至 15,000 美元）屬配偶帳戶。金額是區間、最長可延 45 天申報，跟單者買到的是舊價位。", "en": "Check whose account it is. Rep. Hern's Nov. 24 report spreads trades across a family foundation, a revocable family trust and an IRA, selling stocks including ASML and Phillips 66 and also listing a $15,001-$50,000 municipal education bond purchase. Rep. Meuser's partial Nvidia sale ($1,001-$15,000), filed the same day, sits in a spouse account. Amounts are ranges and filings can lag 45 days, so copiers get old prices.", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20036875.pdf", "stocks": [{"t": "ASML", "n": "Hern 基金會帳戶部分賣出"}, {"t": "PSX", "n": "Hern 基金會帳戶部分賣出"}, {"t": "NVDA", "n": "Meuser 配偶帳戶部分賣出"}]},
  {"id": "week_0", "channel": "本週事件", "tag": "就業週登場", "color": "#C97DD4", "zh": "下週總經：週一（11/30）芝加哥 PMI；週二（12/1）ISM 製造業（預期 55.2、前值 55.5）與 JOLTS；週三 ADP（預期 +8 萬）；週四 ISM 服務業（預期 54.5）；週五（12/4）非農，路透引述的調查預期約 +9 萬、失業率 4.1%，10 月是 +16.5 萬。之後 12/8 至 9 日開 FOMC。各家預估略有出入。", "en": "Next week's data: Chicago PMI Monday (Nov. 30); ISM manufacturing (expected 55.2, prior 55.5) and JOLTS Tuesday; ADP Wednesday (+80,000 expected); ISM services Thursday (54.5 expected); and payrolls Friday (Dec. 4), where a poll cited by Reuters sees about +90,000 and 4.1% unemployment after October's +165,000. The FOMC meets Dec. 8-9. Forecasts vary by source.", "url": "https://wncy.com/2026/11/27/sliding-stock-market-confronts-jobs-data-rate-view-as-next-tests/", "stocks": [{"t": "SPY", "n": "非農與 ISM 的大盤反應指標"}, {"t": "IEF", "n": "7 至 10 年公債 ETF，就業數字敏感"}]},
  {"id": "week_1", "channel": "本週事件", "tag": "晶片軟體與零售財報", "color": "#C97DD4", "zh": "下週重點財報：Marvell（MRVL）12/1 盤後；Salesforce（CRM）、Snowflake（SNOW）、Five Below（FIVE）12/2 盤後；Kroger（KR）與 Dollar General（DG）12/3 盤前、Ulta（ULTA）12/3 盤後。看點是 AI 晶片訂單能否支撐這週反彈、軟體公司的 AI 收入，以及折扣零售的客流。日期請以公司網站為準。", "en": "Key earnings: Marvell (MRVL) after the close Dec. 1; Salesforce (CRM), Snowflake (SNOW) and Five Below (FIVE) after the close Dec. 2; Kroger (KR) and Dollar General (DG) before the open Dec. 3, with Ulta (ULTA) that evening. Watch whether AI chip orders support this week's bounce, software firms' AI revenue and discount-retail traffic. Confirm dates with each company.", "url": "https://www.stocktitan.net/articles/earnings-calendar-week-of-november-30-2026", "stocks": [{"t": "MRVL", "n": "12/1 財報，客製 AI 晶片訂單"}, {"t": "CRM", "n": "12/2 財報，AI 產品收入"}, {"t": "SNOW", "n": "12/2 財報，資料平台需求"}, {"t": "DG", "n": "12/3 財報，低價零售客流"}]},
  {"id": "eval_0", "channel": "今日評估", "tag": "反彈還要過關", "color": "#E8A838", "zh": "今天最值得注意的是：一週大漲約 6%，兩週合計仍在水下，而且週五股市上漲時殖利率也回到約 4.94%。這波回補由晶片與記憶體帶頭，量能是半日盤。下週的檢驗很具體：12/1 Marvell 財報、12/4 非農。你覺得哪一個比較能決定這波反彈能不能延續？", "en": "The key point today: a roughly 6% week still leaves the two-week tally under water, and yields climbed back to about 4.94% even as stocks rose. Chips and memory led the recovery, on half-day volume. Next week offers concrete tests, Marvell's results on Dec. 1 and payrolls on Dec. 4. Which do you think will decide whether the rebound lasts?", "url": "https://finance.yahoo.com/markets/stocks/articles/stock-market-today-major-indexes-140450439.html", "stocks": [{"t": "SOXX", "n": "半導體 ETF，本輪反彈領頭羊"}, {"t": "TLT", "n": "長天期公債 ETF，反映殖利率走向"}], "status": "討論 · 反彈靠財報還是靠就業數字？"},
