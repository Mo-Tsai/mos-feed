<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "三連黑", "color": "#E05C5C", "zh": "週二（8/18）美股收出第三根連續黑K：標普 500 跌 0.69% 收在 7,691.76，那斯達克跌 1.33% 至 26,289.71，道瓊相對抗跌、只跌 0.22% 收 53,343.40。三大指數的跌幅差距本身就是今天最重要的訊息——道瓊的權值偏工業與金融，那斯達克的權值偏半導體與 AI，兩者拉開超過一個百分點，代表這不是全面性的risk-off，而是資金在指數內部換位子。上週才創新高的標普，三天就把漲幅吐了回去。", "en": "U.S. stocks closed lower for a third straight session on Tuesday (8/18): the S&P 500 fell 0.69% to 7,691.76, the Nasdaq Composite dropped 1.33% to 26,289.71 and the Dow held up better, slipping just 0.22% to 53,343.40. The spread between those three numbers is the most important information of the day — the Dow leans industrial and financial, the Nasdaq leans semiconductor and AI, and more than a percentage point between them says this was not broad risk-off but capital changing seats inside the index. The S&P, at a record high only last week, has given back that move in three days.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-tuesday-august-18-dow-sp-500-nasdaq-080822735.html", "stocks": [{"t": "SPY", "n": "標普 500 ETF，對應指數 -0.69% 收 7,691.76，連三日下跌"}, {"t": "QQQ", "n": "那斯達克 100 ETF，對應指數 -1.33%，跌幅為三大指數之最"}, {"t": "DIA", "n": "道瓊 ETF，對應指數僅 -0.22%，工業與金融權值撐住盤面"}]},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "晶片重挫", "color": "#E05C5C", "zh": "拖累那斯達克的是半導體：市場關注的費城半導體指標單日重挫 5.5%，美光跌 7.6%、是標普 500 最大的單一拖累來源。光通訊與 AI 基建相關個股跌得更兇——Coherent 跌約 12%、Lumentum 跌約 9%、Ciena 跌約 10%、Teradyne 跌 9%、CoreWeave 跌 9%。分析師給的理由有三層：AI 基礎建設的融資方式令人不安、中國晶片自製能力推進、以及今年漲太多之後的估值疑慮。", "en": "Semiconductors did the damage to the Nasdaq: a closely watched gauge of chip stocks fell 5.5% on the day, with Micron down 7.6% and the single largest drag on the S&P 500. Optical and AI-infrastructure names fell harder still — Coherent lost about 12%, Lumentum about 9%, Ciena roughly 10%, Teradyne 9% and CoreWeave 9%. Analysts pointed to three layers of concern: unease about how AI infrastructure is being financed, China's advancing domestic chip capability, and valuation questions after a very large run this year.", "url": "https://finance.yahoo.com/technology/ai/articles/u-chip-stocks-extend-losses-092307317.html", "stocks": [{"t": "SOXX", "n": "半導體 ETF，對應族群單日重挫 5.5%，是今年最強角落的急煞"}, {"t": "MU", "n": "美光跌 7.6%，記憶體端跌最重，也是標普 500 最大單一拖累"}, {"t": "COHR", "n": "Coherent 跌約 12%，光通訊是 AI 資本支出疑慮的第一線"}, {"t": "TER", "n": "泰瑞達跌 9%，測試設備端反映的是客戶端擴產節奏被質疑"}]},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "全球債市", "color": "#E05C5C", "zh": "真正的壓力源不在美國，而是全球長端同步走高。美國三十年期公債殖利率盤中觸及 5.323%、收在 5.32% 附近，是 2007 年以來最高；日本十年期公債殖利率跳到 2.93%，創 1996 年以來新高，市場已在定價日本央行最快九月升息；德國與英國的長天期利率也同步升到數十年高點。當四個主要經濟體的長端同時創高，這就不是任何一國的財政故事，而是全球期限溢價在集體重新定價。", "en": "The real pressure came not from the U.S. alone but from long-end yields rising worldwide. The 30-year Treasury yield touched 5.323% intraday and settled near 5.32%, its highest since 2007. Japan's 10-year JGB yield jumped to 2.93%, a high since 1996, with markets already pricing a possible Bank of Japan hike as soon as September, while long-dated German and UK yields also hit multidecade highs. When the long end in four major economies makes new highs at once, this stops being any one country's fiscal story and becomes a collective repricing of the global term premium.", "url": "https://www.bnnbloomberg.ca/business/economics/2026/08/18/bond-markets-from-us-to-japan-whacked-as-inflation-and-fiscal-worries-take-hold/", "stocks": [{"t": "TLT", "n": "20 年期以上美債 ETF，三十年期殖利率觸及 5.323%、創 2007 年以來新高"}, {"t": "IEF", "n": "7-10 年期美債 ETF，中天期同步承壓但幅度小於長端"}, {"t": "EWJ", "n": "日本股市 ETF，日本十年期 2.93% 創 1996 年來高點，升息預期升溫"}]},
    {"id": "overnight_4", "channel": "隔夜盤勢", "tag": "私募出手", "color": "#E05C5C", "zh": "跌勢中最亮的一則是併購：華爾街日報報導 KKR 對天然氣與電力配送商 UGI 提出約 90 億美元、每股 42.50 美元的收購要約，較週一收盤溢價 21.1%，UGI 股價一度跳漲逾 12%，KKR 自己則跌約 1%。這則新聞的意義超出單一公司——AI 資料中心把用電需求推上來，讓「無聊的」天然氣與電力配送資產重新變成私募資金眼中的稀缺標的。要注意的是這只是提案，尚未保證成交。", "en": "The brightest item in a down session was M&A: the Wall Street Journal reported that KKR has offered about $9 billion, or $42.50 a share, for natural gas and electricity distributor UGI — a 21.1% premium to Monday's close. UGI jumped more than 12% while KKR itself slipped around 1%. The significance runs beyond one company: electricity demand from AI data centres has turned dull gas and power distribution assets back into scarce targets in private equity's eyes. Note that this is a proposal and does not yet guarantee a deal.", "url": "https://seekingalpha.com/news/4634409-kkr-makes-9b-takeover-bid-for-gas-and-electricity-distributor-ugi-wsj", "stocks": [{"t": "UGI", "n": "賓州能源配送商，服務約 70 萬戶，收購價每股 42.50 美元、溢價 21.1%"}, {"t": "KKR", "n": "出價方，消息當日自身股價跌約 1%，反映市場對出價高低的看法"}, {"t": "XLU", "n": "公用事業 ETF，資料中心用電需求正在改寫這個板塊的評價邏輯"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "超標卻平淡", "color": "#E8786A", "zh": "Home Depot 週二盤前交出優於預期的第二季：調整後每股盈餘 4.92 美元、優於預估約 0.19 美元，營收 478.6 億美元也高於預估的 472.3 億，同店銷售成長 1.7%、是 2022 年底以來最好，線上銷售成長 11%。但股價盤前只漲 0.75% 到 340.40 美元。原因藏在最後一句：管理層維持而非上調全年展望，同店銷售仍只給持平到 +2%。在一個房市疲弱的市場裡搶市佔是真的，但市場要的是加碼，不是重申。", "en": "Home Depot beat before Tuesday's open: adjusted EPS of $4.92 came in about $0.19 above consensus, revenue of $47.86 billion topped the $47.23 billion estimate, comparable sales rose 1.7% — the best since late 2022 — and online sales grew 11%. The stock rose only 0.75% pre-market to $340.40. The reason is in the last line: management reaffirmed rather than raised full-year guidance, still guiding comparable sales flat to up 2%. Taking share in a weak home-improvement market is real, but what the market wanted was an upgrade, not a repeat.", "url": "https://www.cnbc.com/2026/08/18/home-depot-hd-q2-2026-earnings.html", "stocks": [{"t": "HD", "n": "調整後每股 4.92 美元、營收 478.6 億，同店 +1.7%，盤前僅漲 0.75%"}, {"t": "LOW", "n": "羅氏今天（8/19）交卷，市場預估每股 4.25 美元、營收 239.9 億"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "先買後付轉弱", "color": "#E8786A", "zh": "週二跌最兇的不是晶片股，是 Klarna——這家先買後付（BNPL）業者因第三季與全年指引轉弱，單日重挫 21%。BNPL 的商業模式本質上是「消費者的短期信用需求」與「壞帳率」兩條曲線在賽跑，指引下修通常意味著至少其中一條開始不利。把它跟七月零售銷售月減 0.6%、密大信心走弱放在一起看，這是同一個故事的三個切面：不是消費者不買，是買的方式與代價正在改變。", "en": "The worst performer on Tuesday was not a chip stock but Klarna — the buy-now-pay-later lender fell 21% after guiding third-quarter and full-year results below expectations. The BNPL model is essentially a race between two curves, consumers' demand for short-term credit and the default rate, and cut guidance usually means at least one of them has turned unfavourable. Read alongside July retail sales falling 0.6% and softening Michigan sentiment, these are three views of one story: consumers have not stopped buying, but how they buy and what it costs them is changing.", "url": "https://www.cnbc.com/2026/08/18/stocks-making-the-biggest-moves-midday-meta-amlx-bidu-klar.html", "stocks": [{"t": "KLAR", "n": "Klarna，第三季與全年指引低於預期，單日重挫 21%"}, {"t": "AFRM", "n": "Affirm，美國 BNPL 同業，Klarna 的指引是整個次產業的領先指標"}]},
    {"id": "earn_3", "channel": "財報速報", "tag": "今日雙棒", "color": "#E8786A", "zh": "今天（8/19）盤前是零售財報週的第二棒，Target 與 Lowe's 同日交卷。Target 市場預估每股 2.30 美元，它的第一季同店銷售成長 5.6%、來客數成長 4.4%，第二季店客流仍成長 4.7%，是可選消費最乾淨的讀數；Lowe's 預估每股 4.25 美元、營收 239.9 億美元，跟昨天的 Home Depot 是一組對照。若 Lowe's 的同店明顯輸給 Home Depot 的 1.7%，那就不是行業問題，是公司問題。", "en": "Today (8/19) brings the second leg of retail earnings week, with Target and Lowe's both reporting before the open. Target is expected to earn $2.30 a share; its first-quarter comparable sales rose 5.6% with traffic up 4.4%, and store visits were still up 4.7% in the second quarter, making it the cleanest read on discretionary spending. Lowe's is forecast at $4.25 a share on revenue of $23.99 billion, and pairs directly with yesterday's Home Depot print. If Lowe's comparable sales come in well short of Home Depot's 1.7%, that is not an industry problem but a company one.", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262110009-weekly-preview-fed-walmart-target-home-depot-earnings-us-consumer-tradingkey", "stocks": [{"t": "TGT", "n": "今天盤前公布，預估每股 2.30 美元；Q2 店客流仍年增 4.7%"}, {"t": "LOW", "n": "今天盤前公布，預估每股 4.25 美元、營收 239.9 億，與 HD 直接對照"}, {"t": "WMT", "n": "明天（8/20）壓軸，代表的是低收入族群的消費體溫"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "FOMC 紀要", "color": "#7C6AF7", "zh": "今天（8/19）公布的七月會議紀要，是本週最大的單一變數。七月聯準會以 9 比 3 決定按兵不動，把利率維持在 3.50% 至 3.75%，但克里夫蘭的哈瑪克、明尼亞波利斯的卡什卡里、達拉斯的羅根三位地區聯準銀行總裁同時投票主張升息一碼——這是 2016 年 9 月以來第一次有三位委員在同一個方向上聯合異議。市場目前把九月升息機率放在 31% 附近，紀要要回答的是：這三票是孤立的，還是桌上有更多人被說服。", "en": "The July meeting minutes released today (8/19) are the week's single biggest variable. The Fed voted 9-3 in July to hold rates at 3.50% to 3.75%, but Cleveland's Hammack, Minneapolis's Kashkari and Dallas's Logan all voted for a quarter-point hike — the first time since September 2016 that three policymakers have dissented in the same direction together. Markets currently put September hike odds near 31%, and the minutes have one question to answer: were those three isolated, or were more people around the table persuaded.", "url": "https://www.cnbc.com/2026/07/29/fed-rate-decision-july-2026.html", "stocks": [{"t": "IEF", "n": "7-10 年期公債 ETF，紀要的鷹派程度會直接反映在中天期殖利率"}, {"t": "KRE", "n": "區域銀行 ETF，升息對淨息差是短多、對存款成本與信用品質是長空"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "赤字與通膨", "color": "#7C6AF7", "zh": "長端殖利率創 19 年新高的兩個燃料，一個是財政、一個是通膨。財政面，美國七月的單月財政赤字是 2021 年 3 月以來最高；通膨面，年增率已經連續五年以上高於聯準會 2% 的目標，中東衝突推升的油價又給它續了一把柴。這兩件事的共同點是都跟景氣循環無關——它們是結構性的，也因此殖利率不會因為經濟數據轉弱就自動回落。黃金站上每盎司 4,477 美元附近，反映的正是同一組擔憂。", "en": "Two fuels are driving the long end to a 19-year high: fiscal and inflation. On the fiscal side, the U.S. monthly budget deficit in July was the largest since March 2021. On inflation, the annual rate has been above the Fed's 2% target for more than five years, and oil prices lifted by the Middle East conflict have added fresh fuel. What these two have in common is that neither is cyclical — both are structural, which is why yields will not automatically fall back just because the economic data softens. Gold near $4,477 an ounce reflects the same set of worries.", "url": "https://www.cnbc.com/2026/08/18/treasury-yields-.html", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，赤字與通膨兩股力量同時把長端往上推"}, {"t": "GLD", "n": "黃金 ETF，現貨約 4,477 美元，避險與抗通膨需求疊加"}]},
    {"id": "macro_3", "channel": "總經政策", "tag": "日本變數", "color": "#7C6AF7", "zh": "今年最容易被美股投資人忽略的總經變數，是日本。日本十年期公債殖利率跳到 2.93%，創 1996 年以來新高，而且是在 GDP 數據弱於預期的情況下發生——市場定價的是通膨與日本央行最快九月升息，不是景氣轉強。這件事對美股的傳導路徑很具體：日本長年是全球最大的資金輸出國，當本國殖利率變得有吸引力，那些原本流向美國公債與美股的資金就有了留在家裡的理由。", "en": "The macro variable most easily overlooked by U.S. equity investors this year is Japan. The 10-year JGB yield has jumped to 2.93%, a high since 1996, and it happened despite weaker-than-expected GDP — markets are pricing inflation and a possible Bank of Japan hike as early as September, not stronger growth. The transmission to U.S. equities is concrete: Japan has long been the world's largest exporter of capital, and once domestic yields become attractive, money that used to flow into Treasuries and U.S. stocks has a reason to stay home.", "url": "https://tradingeconomics.com/japan/government-bond-yield", "stocks": [{"t": "EWJ", "n": "日本股市 ETF，十年期 2.93% 創 1996 年來高，升息預期是雙面刃"}, {"t": "FXY", "n": "日圓 ETF，日本升息預期升溫時，套利交易的回補壓力會先反映在匯率"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "醫療領跑", "color": "#4EABA4", "zh": "今年最安靜、也最持久的輪動發生在醫療保健。XLV 的十二個月報酬達 16.0%，在八月領先所有類股，靠的不是題材而是三件很無聊的事：約 18 倍的預估本益比、0.65 至 0.75 的低 beta，以及第二季普遍優於預期的財報。資金流也支持這個說法——七月底到八月初，美國成長型基金淨流出 71.8 億美元，價值型基金則連三週每週淨流入約 30 億美元。當長端殖利率創新高，低估值與低波動就從缺點變成了優點。", "en": "The quietest and most persistent rotation of the year has been into healthcare. XLV posted a 16.0% twelve-month return, leading all sectors in August, and it got there not on a narrative but on three dull facts: a forward P/E of roughly 18, a beta of 0.65 to 0.75, and broadly better-than-expected second-quarter earnings. Fund flows agree — U.S. growth funds saw $7.18 billion of net outflows from late July into early August while value funds took in roughly $3.0 billion a week for three straight weeks. When long yields make new highs, low valuation and low volatility stop being drawbacks.", "url": "https://algolabhk.com/en/blogs/august-sector-focus", "stocks": [{"t": "XLV", "n": "醫療保健 ETF，十二個月報酬 16.0%，八月領先所有類股"}, {"t": "MRNA", "n": "莫德納，代表醫療內部「有題材」的那一半，今年資金明顯偏好"}, {"t": "AMGN", "n": "安進，代表成熟現金流的那一半，同期表現落後，是分歧的另一端"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "油價僵局", "color": "#4EABA4", "zh": "能源類股的續強建立在一個還沒解開的僵局上：布蘭特原油結算價逼近每桶 91 美元，西德州原油升向 85 美元，理由是荷姆茲海峽的談判沒有進展。伊朗表態除非華府接受條件，否則海峽維持關閉；川普則說美國對該水道有「完全控制」。能源總署預期海峽的嚴重通行限制會持續整個八月，該區域的原油產量要到 2027 年初才會回到衝突前水準。這代表油價的支撐是供給端的，不是需求端的——這種上漲對整體經濟是成本，不是訊號。", "en": "Energy's continued strength rests on an unresolved standoff: Brent settled just below $91 a barrel and WTI rose toward $85 as talks over the Strait of Hormuz went nowhere. Iran says the strait stays closed unless Washington meets its conditions, while President Trump says the U.S. has total control of the waterway. The EIA expects severe constraints on Hormuz transits to persist through August, with regional crude output returning to pre-conflict levels only in early 2027. That means the support under oil is supply-side, not demand-side — and this kind of rally is a cost to the broader economy, not a signal from it.", "url": "https://www.cnbc.com/2026/08/11/hormuz-oil-prices-us-iran.html", "stocks": [{"t": "XLE", "n": "能源類股 ETF，布蘭特近 91 美元支撐類股，但支撐來自供給中斷"}, {"t": "APA", "n": "APA Corp，中型獨立探勘生產商，對油價的營運槓桿高於整合型油商"}]},
    {"id": "sector_3", "channel": "產業風向", "tag": "銀行轉機", "color": "#4EABA4", "zh": "在債市這麼難看的一週，區域銀行反而是強勢的一角。第二季的財報顯示淨利息收入止穩、信用損失提列受控，更關鍵的是數據暗示存款成本可能已經觸頂——過去一年壓垮區域銀行利差的那場搶錢大戰，正在降溫。上週五有 55 檔羅素 3000 小型股創 52 週新高，其中 13 檔來自區域銀行，是所有產業裡最多的。這是一個典型的「壞消息不再變壞」型行情，不需要成長，只需要停止惡化。", "en": "In a brutal week for bonds, regional banks were one of the strong corners. Second-quarter results showed net interest income stabilising and credit loss provisions contained, and more importantly the data suggested deposit costs may have peaked — the fierce competition for cash that squeezed regional bank margins over the past year is cooling. Of the 55 Russell 3000 small caps making 52-week highs last Friday, 13 were regional banks, more than any other industry. This is the classic pattern where bad news simply stops getting worse: it needs no growth, only an end to deterioration.", "url": "https://www.trefis.com/stock/spy/articles-v3/611649/55-small-cap-stocks-just-made-new-52-week-highs/2026-08-17", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，存款成本觸頂的訊號是這一波的核心論點"}, {"t": "NBBK", "n": "NB Bancorp，創 52 週新高 23.47 美元，淨息差改善加持續買回股票"}, {"t": "CARE", "n": "Carter Bankshares，創新高 35.52 美元，整併題材與營運改善並行"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "年度最佳", "color": "#5B8ED6", "zh": "小型股是今年最被低估的故事。羅素 2000 年初至今上漲約 17% 至 21%，是 2003 年以來最好的年度表現，年初那一段更是 1991 年以來最強的開局。上週五有 55 檔羅素 3000 的小型股同時創 52 週新高，產業分布以區域銀行、工業與基礎建設為主，不是科技。這說明小型股這一輪的驅動力來自國內經濟活動與利差修復，而不是 AI 題材的外溢——也因此它跟那斯達克這幾天的走勢才會脫鉤。", "en": "Small caps are the most underrated story of the year. The Russell 2000 is up roughly 17% to 21% year to date, its best annual showing since 2003, and its start to the year was the strongest since 1991. Last Friday 55 Russell 3000 small caps made 52-week highs together, concentrated in regional banks, industrials and infrastructure rather than technology. That says this small-cap move is driven by domestic economic activity and repairing interest margins rather than spillover from the AI theme — which is exactly why it has decoupled from the Nasdaq over the past few days.", "url": "https://seekingalpha.com/article/4920445-russell-2000-soars-21-percent-ytd-4-top-small-cap-stocks", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，今年約 +17% 至 21%，最佳年度表現自 2003 年以來"}, {"t": "IJR", "n": "標普小型股 600 ETF，成分要求獲利，與 IWM 的體質差異值得對照"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "生技噴出", "color": "#5B8ED6", "zh": "過去一個月標普 500 只漲 3.4%，AbCellera Biologics 卻漲了 84.7%，是上週五創 52 週新高的 55 檔小型股裡最猛的一檔。這家公司做的是抗體藥物發現平台，屬於典型的「二元結果」型生技——它的股價不是由本益比決定，是由臨床或合作進展的有無決定。要提醒的是，小型生技的 80% 漲幅跟大型股的 80% 漲幅意義完全不同：前者常常只是把之前跌掉的一段補回來，看漲幅之前先看它離歷史高點還有多遠。", "en": "The S&P 500 returned just 3.4% over the past month while AbCellera Biologics gained 84.7%, the strongest of the 55 small caps that made 52-week highs last Friday. AbCellera runs an antibody drug-discovery platform — a classic binary-outcome biotech whose share price is set not by an earnings multiple but by the presence or absence of clinical and partnership progress. Worth remembering: an 80% move in a small biotech means something entirely different from an 80% move in a large cap. The former is often just recovering ground already lost, so check how far it still sits below its all-time high before reading the percentage.", "url": "https://www.trefis.com/stock/spy/articles-v3/611649/55-small-cap-stocks-just-made-new-52-week-highs/2026-08-17", "stocks": [{"t": "ABCL", "n": "AbCellera，過去一個月 +84.7%，同期標普 500 僅 +3.4%"}, {"t": "XBI", "n": "生技 ETF，等權重設計，是判斷生技是全面回暖還是個股獨秀的參照"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "基建在手單", "color": "#5B8ED6", "zh": "Construction Partners 是這一輪小型股行情最不性感、也最實在的樣本：一家做公路與基礎建設施工的公司，靠著 30.9 億美元的紀錄在手訂單推升股價。在手訂單（backlog）之所以是小型工業股最值得看的一個數字，是因為它把未來的營收先寫進帳上，等於降低了獲利預估的不確定性。但同一個數字也有陷阱——訂單金額成長不等於利潤成長，要同時看毛利率有沒有跟上，否則接的只是低利潤的量。", "en": "Construction Partners is the least glamorous and most substantive sample of this small-cap move: a road and infrastructure contractor whose shares have run on a record $3.09 billion project backlog. Backlog is the single most useful number in a small industrial because it books future revenue in advance, which lowers the uncertainty in earnings estimates. The same number carries a trap, though — a growing order book is not the same as growing profit. Check whether gross margin is keeping pace, or the company is simply taking on low-margin volume.", "url": "https://markets.financialcontent.com/stocks/article/marketminute-2026-3-24-the-great-rotation-russell-2000-outshines-mega-caps-as-domestic-small-caps-take-the-reins-in-2026", "stocks": [{"t": "ROAD", "n": "Construction Partners，在手訂單 30.9 億美元創紀錄，公路施工為主"}, {"t": "MTZ", "n": "MasTec，同屬基礎建設施工，規模較大，可作為訂單週期的對照組"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "賣鏟子的", "color": "#5B8ED6", "zh": "AAON 是「賣鏟子」邏輯在資料中心題材上最乾淨的一個中小型案例：它做高效能空調與冷卻設備，在手訂單年增 110%，需求來自資料中心的散熱。這條路徑的吸引力在於它不需要押注哪家 AI 公司會贏——只要蓋機房，冷卻設備就要買。風險則在於它跟資本支出週期完全綁定：昨天半導體族群下跌的理由正是「AI 基建的融資方式令人不安」，若那個疑慮成真，最先被砍的就是這種設備訂單。", "en": "AAON is the cleanest mid-small-cap expression of the picks-and-shovels logic in the data centre theme: it builds high-efficiency air conditioning and cooling equipment, and its backlog is up 110% year over year on data centre cooling demand. The appeal is that it requires no bet on which AI company wins — if the halls get built, the cooling gets bought. The risk is that it is entirely tied to the capital spending cycle, and the very reason semiconductors sold off yesterday was unease about how AI infrastructure is financed. If that worry proves out, equipment orders like these are the first thing cut.", "url": "https://markets.financialcontent.com/stocks/article/marketminute-2026-3-24-the-great-rotation-russell-2000-outshines-mega-caps-as-domestic-small-caps-take-the-reins-in-2026", "stocks": [{"t": "AAON", "n": "在手訂單年增 110%，高效能冷卻設備，資料中心是主要拉力"}, {"t": "VRT", "n": "Vertiv，資料中心電力與散熱的大型同業，可對照訂單能見度"}]},
    {"id": "small_5", "channel": "小型股風雲", "tag": "判讀知識", "color": "#5B8ED6", "zh": "今天值得學的一件事：為什麼長端殖利率創 19 年新高，小型股反而在創高？直覺會說小型股負債多、對利率最敏感才對。關鍵在於利率的「哪一段」在動——這一波動的是長端，而小型股的借款以浮動利率與中短天期銀行貸款為主，跟三十年期公債的關聯遠低於大型股的長期公司債。此外小型股的營收約八成來自美國本土，全球期限溢價重定價對它們的直接衝擊，也小於營收遍布全球的大型股。", "en": "Something worth learning today: why are small caps making highs while the long yield hits a 19-year high? Intuition says small caps carry more debt and should be the most rate-sensitive. The key is which part of the curve is moving — this move is at the long end, while small caps borrow mainly through floating-rate and short-to-medium-term bank loans, far less linked to the 30-year Treasury than large caps' long-dated corporate bonds. On top of that, roughly 80% of small-cap revenue comes from inside the United States, so a repricing of the global term premium hits them less directly than it hits globally exposed large caps.", "url": "https://www.investing.com/analysis/small-caps-are-quietly-winning-while-mega-caps-wobble-200684618", "stocks": [{"t": "IWO", "n": "羅素 2000 成長型 ETF，含較多無盈利公司，對利率最敏感的一段"}, {"t": "IWN", "n": "羅素 2000 價值型 ETF，銀行與工業權重高，是這一波領漲的那一半"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "化工谷底", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11/初 Q3 財報", "zh": "Huntsman 是做聚氨酯與特化材料的老牌化工廠，股價從 2022 年高點 41.65 美元一路跌到個位數、五年跌超過五成，是市場最不想碰的那種循環股。為什麼被忽視：化工在中國與中東新產能開出後陷入長期殺價，去庫存拖了三年，賣方早已放棄追蹤故事。什麼正在改變：董事長兼執行長 Peter Huntsman 於 8 月 3 日以均價 9.81 美元自掏腰包買進 100,000 股，過去十二個月內部人已有三次買進；公司同時強調漲價紀律，並有與 Olin 的併購綜效可期。風險與反方：循環底部可以比任何人的耐心更長，內部人買進在化工股史上失準過很多次，且中東物流成本正在上升。這是研究線索，不是投資建議。", "en": "Huntsman is an old-line maker of polyurethanes and specialty chemicals whose shares have fallen from a 2022 peak of $41.65 into single digits, down more than half over five years — exactly the kind of cyclical the market does not want to touch. Why it is ignored: chemicals entered a long price war after new Chinese and Middle Eastern capacity came online, destocking dragged on for three years, and the sell side largely gave up on the story. What is changing: Chairman and CEO Peter Huntsman bought 100,000 shares of his own company on 3 August at an average $9.81, the third insider purchase in twelve months, while management emphasises pricing discipline and merger synergies with Olin. Risks and the other side: a cyclical trough can outlast anyone's patience, insider buying has misfired often in chemicals, and Middle East logistics costs are rising. This is a research lead, not investment advice.", "url": "https://seekingalpha.com/article/4936402-huntsman-undervalued-with-free-cash-flow-poised-for-an-inflection", "stocks": [{"t": "HUN", "n": "執行長 8/3 以均價 9.81 美元買進 100,000 股，持股增至 725.6 萬股"}, {"t": "OLN", "n": "Olin，併購綜效的另一方，兩者的價格紀律是同一個論點的兩面"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "十三年掛牌外", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月 Q3 財報", "zh": "Private Bancorp of America 是加州 CalPrivate Bank 的控股公司，總資產 27.1 億美元。為什麼被忽視：它在場外市場 OTCQX 掛了超過十三年，機構因為流動性與合規門檻幾乎買不了，這是結構性、而非基本面的忽視。什麼正在改變：7 月 29 日納斯達克核准上市，7 月 30 日正式在 Nasdaq Global Select 掛牌，代號 PBAM；同時第二季淨利 1,310 萬美元、每股 2.27 美元，優於上季的 2.07 與去年同期的 1.77，淨息差維持在 5% 以上，逾放與逾期放款雙雙下降。風險與反方：升板本身不創造獲利，只是把買方名單變長；5% 以上的淨息差在同業中偏高，通常伴隨較高的放款風險；加州商用不動產仍是懸念。這是研究線索，不是投資建議。", "en": "Private Bancorp of America is the holding company for California's CalPrivate Bank, with $2.71 billion in total assets. Why it is ignored: it traded on the OTCQX over-the-counter market for more than thirteen years, where liquidity and compliance thresholds keep most institutions out — structural neglect rather than fundamental neglect. What is changing: Nasdaq approved its listing on 29 July and the shares began trading on the Nasdaq Global Select Market on 30 July under PBAM. Second-quarter net income was $13.1 million, or $2.27 per diluted share, up from $2.07 the prior quarter and $1.77 a year earlier, with net interest margin holding above 5% and both non-performing and past-due loans declining. Risks and the other side: an uplisting creates no earnings, it only lengthens the buyer list; a margin above 5% is high for the peer group and usually comes with higher lending risk; and California commercial real estate remains an open question. This is a research lead, not investment advice.", "url": "https://www.globenewswire.com/news-release/2026/07/29/3335612/0/en/private-bancorp-of-america-inc-announces-uplisting-to-nasdaq-global-select-market.html", "stocks": [{"t": "PBAM", "n": "7/30 由 OTCQX 升板至 Nasdaq Global Select；Q2 每股 2.27 美元、淨息差 >5%"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "冷門資產類別", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報與買回執行", "zh": "Abacus Global Management 做的是壽險保單二級市場——向保戶收購仍在有效期的壽險保單、持有到期。為什麼被忽視：這個資產類別本身冷門到大多數分析師沒有可比公司可用，估值模型也跟一般保險股不同。什麼正在改變：第一季營收 5,940 萬美元、年增約 35%，歸屬淨利 1,730 萬升到 730 萬美元，總資產 8.298 億含 3.928 億的保單公允價值；董事會授權 1 億美元庫藏股並自 8 月 17 日啟動，第一季本身已買回 1,450 萬美元，是「有在執行」而非只授權。另外公司正把保單資產代幣化上鏈，目標年底前完成。風險與反方：2.528 億美元商譽佔總資產比重不低；保單公允價值高度依賴壽命假設，假設一動獲利就動；代幣化目前是敘事，還沒證明能降低資金成本。這是研究線索，不是投資建議。", "en": "Abacus Global Management operates in the life settlement market, buying in-force life insurance policies from policyholders and holding them to maturity. Why it is ignored: the asset class is obscure enough that most analysts have no comparable company to work from, and its valuation model differs from ordinary insurance stocks. What is changing: first-quarter revenue of $59.4 million was up roughly 35% year over year and net income attributable to the company rose to $7.3 million, on total assets of $829.8 million including $392.8 million of policies at fair value. The board authorised a $100 million buyback starting 17 August, and the company had already repurchased $14.5 million in the first quarter — execution, not just authorisation. It is also tokenising its policy assets on chain, targeting completion by year end. Risks and the other side: $252.8 million of goodwill is a meaningful share of assets; policy fair values depend heavily on longevity assumptions, and earnings move when those assumptions move; tokenisation is still narrative rather than proven cost-of-capital relief. This is a research lead, not investment advice.", "url": "https://www.stocktitan.net/sec-filings/ABL/10-q-abacus-global-management-inc-quarterly-earnings-report-eeef2ccc2f73.html", "stocks": [{"t": "ABL", "n": "Q1 營收 5,940 萬（+35%）、淨利 730 萬；1 億庫藏股 8/17 啟動"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "黃金小廠", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Bilboes 6 億美元融資包定案", "zh": "Caledonia Mining 是在辛巴威經營 Blanket 金礦的小型金礦商，同時在紐約與倫敦 AIM 掛牌。為什麼被忽視：辛巴威的國家風險讓多數法人直接把它排除在投資範圍外，市值與流動性又小到賣方不覆蓋。什麼正在改變：第二季黃金產量約 17,400 盎司、較上季成長 18%，礦石品位從每噸 2.5 克回升到接近 2.9 克，全年 72,000 至 76,500 盎司的指引維持不變且下半年權重較高；董事長 July Ndlovu 於 8 月 13 日以每股 23.03 美元買進 21,400 股，持股增至 250,489 股。而金價正好在每盎司 4,477 美元附近的高檔。風險與反方：Bilboes 擴產案要籌約 6 億美元，對這個規模的公司是巨大的稀釋或舉債風險，且首次產金要等到 2028 年底、2029 年才是第一個完整年度——中間有太多事會變。這是研究線索，不是投資建議。", "en": "Caledonia Mining operates the Blanket gold mine in Zimbabwe and is listed in both New York and on London's AIM. Why it is ignored: Zimbabwe country risk puts it outside most institutional mandates outright, and its market cap and liquidity are too small for sell-side coverage. What is changing: second-quarter gold output of roughly 17,400 ounces was up 18% from the prior quarter as grade recovered from 2.5 to just under 2.9 grams per tonne, with full-year guidance of 72,000 to 76,500 ounces unchanged and weighted to the second half. Chairman July Ndlovu bought 21,400 shares at $23.03 on 13 August, lifting his holding to 250,489 shares. And gold sits high, near $4,477 an ounce. Risks and the other side: the Bilboes expansion requires a funding package of about $600 million, an enormous dilution or leverage risk for a company this size, and first gold is not due until late 2028 with 2029 the first full year — a great deal can change in between. This is a research lead, not investment advice.", "url": "https://www.proactiveinvestors.com/companies/news/1096799/caledonia-mining-s-q2-gold-output-jumps-18-ceo-says-it-s-all-about-the-grade-1096799.html", "stocks": [{"t": "CMCL", "n": "Q2 產量約 17,400 盎司（+18%）；董事長 8/13 以 23.03 美元買進 21,400 股"}, {"t": "GLD", "n": "黃金 ETF，金價約 4,477 美元是這個論點的外部順風"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 8/27 Q2 財報（日期已確認）", "zh": "雷達池內的 Movado 有一個資訊要更正。這家手錶集團旗下有自有品牌與 Coach、Tommy、Lacoste、HUGO 的授權錶款，7 月 22 日入池時記錄的財報日在 8 月 20 日與 8 月 27 日之間有分歧，現在可以確認：下一份財報是 8 月 27 日，也就是下週四，不是明天。這件事重要的原因很單純——如果照舊資料在明天等，會白等一週，也可能因為看不到數字而誤判。要看的三件事不變：每股盈餘回升是否有營收成長支撐（上一季 0.32 美元對預估 0.07）、授權品牌業務對營收與獲利的實際貢獻，以及管理層是否給出 FY2027 指引。風險與反方：股價已從 52 週低點反彈、目前約 38.5 美元對高點 39.85，抽屜裡的安全邊際比入池時薄了。這是研究線索，不是投資建議。", "en": "One correction on Movado, already in the radar pool. The watch group owns its own brands and holds licences for Coach, Tommy Hilfiger, Lacoste and HUGO. When it entered the pool on 22 July, its reporting date was recorded ambiguously between 20 and 27 August; that can now be confirmed as 27 August, next Thursday, not tomorrow. This matters for a simple reason: waiting on the old date means waiting a week for nothing, and possibly misreading the situation because the numbers never appear. The three things to check are unchanged — whether the earnings recovery is backed by revenue growth (last quarter's $0.32 against a $0.07 estimate), what the licensed-brand business actually contributes to revenue and profit, and whether management issues FY2027 guidance. Risks and the other side: the shares have already rebounded from their 52-week low to around $38.50 against a high of $39.85, so the margin of safety is thinner than it was at entry. This is a research lead, not investment advice.", "url": "https://www.wallstreetzen.com/stocks/us/nyse/mov/earnings", "stocks": [{"t": "MOV", "n": "財報日確認為 8/27（非 8/20）；股價約 38.5 美元、52 週高 39.85"}]},
    {"id": "radar_6", "channel": "忽視雷達", "tag": "分拆滿月", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月首份獨立季報", "zh": "池內的 ADI Global Distribution 分拆滿半個月，細節可以補齊了。它是北美最大的低壓產品專業通路商，做的是保全、消防與住宅影音設備的批發配送。分拆機制：Resideo 股東以每持有 2 股 Resideo 換得 1 股 ADI，登記日 7 月 20 日，8 月 4 日起以 ADIG 在紐約證交所正常交易。為什麼被忽視：分拆股在掛牌初期普遍面臨機械性賣壓——原股東多半是為了 Resideo 而持有，不會為了一家通路商留下，這種賣壓跟公司好壞無關。什麼正在改變：獨立後管理層的資本配置終於自己說了算，第一份完整季報預計 11 月。風險與反方：低壓通路是低毛利、重營運資金的生意，獨立後的去槓桿節奏還沒被檢驗，且目前僅有極少數賣方覆蓋。這是研究線索，不是投資建議。", "en": "Half a month on from its spin-off, the details on pool member ADI Global Distribution can now be filled in. ADI is North America's largest specialty distributor of professionally installed low-voltage products, wholesaling security, fire and life safety, and residential audio-visual equipment. The mechanics: Resideo shareholders received one ADI share for every two Resideo shares held, with a record date of 20 July, and ADI began regular-way trading on the NYSE under ADIG on 4 August. Why it is ignored: newly spun-off shares routinely face mechanical selling, because original holders owned the parent and have no reason to keep a distributor — pressure that has nothing to do with the business. What is changing: as a standalone, management finally controls its own capital allocation, with a first full quarterly report expected in November. Risks and the other side: low-voltage distribution is a low-margin, working-capital-heavy business, the post-separation deleveraging path is untested, and sell-side coverage is currently minimal. This is a research lead, not investment advice.", "url": "https://www.prnewswire.com/news-releases/resideo-technologies-completes-spin-off-of-adi-global-distribution-302841699.html", "stocks": [{"t": "ADIG", "n": "8/4 起於紐約證交所正常交易；每 2 股 Resideo 換 1 股，登記日 7/20"}, {"t": "REZI", "n": "Resideo，分拆母公司，兩者的相對走勢是判斷賣壓是否消化完的線索"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "櫃體群聚", "color": "#6DB56D", "zh": "雷達池內的 MasterBrand 出現內部人群聚訊號。這家北美最大的廚浴櫃體製造商，執行長 R. Banyard 買進 60,000 股、金額約 50.58 萬美元，持股增至 1,831,788 股；之後另有一位內部人跟進買進。群聚（cluster）之所以比單筆買進更有訊息量，是因為單一高階主管的買進可能只是薪酬結構或形象操作，但兩位以上、在相近價位、各自掏錢，代表的是同一份內部資訊被多個人做出相同判讀。判讀提醒：櫃體業跟房市裝修週期高度綁定，昨天 Home Depot 的同店只有 +1.7%，這個群聚訊號目前還沒有外部需求數據背書。", "en": "Pool member MasterBrand has produced a cluster insider signal. At North America's largest kitchen and bath cabinet maker, CEO R. Banyard bought 60,000 shares for roughly $505,800, lifting his holding to 1,831,788 shares, and a second insider subsequently bought as well. A cluster carries more information than a single purchase because one executive buying may reflect nothing more than compensation structure or optics, whereas two or more people paying their own money at similar prices means the same internal information has been read the same way by several people. A caution on reading it: cabinets are tightly bound to the housing renovation cycle, and with Home Depot's comparable sales at just 1.7% yesterday, this cluster has no external demand data behind it yet.", "url": "https://www.gurufocus.com/news/8897598/insider-buying-r-banyard-acquires-60000-shares-of-masterbrand-inc-mbc", "stocks": [{"t": "MBC", "n": "執行長買進 60,000 股約 50.58 萬美元，持股增至 1,831,788 股"}, {"t": "AMWD", "n": "American Woodmark，櫃體同業，是判斷這是產業訊號還是公司訊號的對照"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "庫藏股潮", "color": "#6DB56D", "zh": "八月上旬出現一波中小型股庫藏股授權：FIGS 於 8 月 6 日再加碼 1 億美元、總授權上調到 2 億；Marqeta 於 8 月 3 日新增 1.5 億美元；Abacus Global 的 1 億美元計畫自 8 月 17 日開始執行。這波集中出現不是巧合——當長端殖利率創新高、外部融資變貴，管理層買回自家股票的相對報酬率就上升了。但一定要記住這條判讀原則：授權不等於執行。授權只是一張許可證，真正該追的是下一份 10-Q 裡的實際買回股數與均價，兩者差距很大的公司相當多。", "en": "Early August brought a wave of small and mid-cap buyback authorisations: FIGS added another $100 million on 6 August, taking its total authorisation to $200 million; Marqeta added $150 million on 3 August; and Abacus Global's $100 million programme began on 17 August. The clustering is not coincidence — with long yields at new highs and external financing more expensive, the relative return on management buying its own shares goes up. But hold on to this rule of interpretation: authorisation is not execution. An authorisation is only a permission slip, and what actually matters is the share count and average price of repurchases in the next 10-Q. The gap between the two is large at a great many companies.", "url": "https://www.investing.com/news/company-news/abacus-global-authorizes-100-million-share-buyback-program-93CH-4859086", "stocks": [{"t": "FIGS", "n": "8/6 加碼 1 億美元、總授權升至 2 億，醫護服飾直營品牌"}, {"t": "MQ", "n": "Marqeta，8/3 新增 1.5 億美元授權，發卡基建平台"}]},
    {"id": "insider_3", "channel": "內部人動向", "tag": "13F 落後值", "color": "#6DB56D", "zh": "第二季 13F 已於 8 月 14 日截止申報，兩件事最值得看。波克夏把 Alphabet 的 C 股持股在單季內放大超過七倍，A 股（GOOGL）也從 5,425 萬股增至 7,879 萬股、增幅 45%；而 Ackman 的 Pershing Square 則反向清空 Alphabet，同時把持股從 10 檔擴大到 14 檔，新建 Visa、Mastercard、S&P Global 與 Netflix 部位。判讀提醒：13F 揭露的是六月底的照片，落後現實 45 天以上，且只揭露多頭部位、不含放空與衍生品。兩位知名投資人在同一檔股票上做相反的事，本身就說明了不該把 13F 當作抄作業的清單。", "en": "Second-quarter 13F filings were due on 14 August, and two things stand out. Berkshire Hathaway increased its Alphabet Class C holding more than sevenfold in a single quarter and raised its Class A stake (GOOGL) from 54.25 million to 78.79 million shares, up 45%. Meanwhile Bill Ackman's Pershing Square did the opposite, exiting Alphabet entirely while expanding from 10 to 14 positions with new stakes in Visa, Mastercard, S&P Global and Netflix. A caution on reading them: a 13F is a photograph of 30 June, at least 45 days behind reality, and it discloses only long positions, excluding shorts and derivatives. Two well-known investors doing opposite things in the same stock is itself the argument against treating 13Fs as a list to copy.", "url": "https://hedgefundalpha.com/news/q2-2026-13f-roundup/", "stocks": [{"t": "GOOGL", "n": "波克夏 A 股持股由 5,425 萬增至 7,879 萬股（+45%），Ackman 則全數出清"}, {"t": "BRK.B", "n": "波克夏 B 股，Alphabet 已成為其單季加碼幅度最大的部位之一"}, {"t": "V", "n": "Visa，Pershing Square 第二季新建部位之一，屬支付基礎建設"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "總經行事曆", "color": "#C97DD4", "zh": "接下來五個交易日的總經行事曆，前重後輕。今天（8/19）的七月 FOMC 會議紀要是全週最大變數，市場要從字裡行間判斷那三張升息異議票的孤立程度，直接影響九月 15 至 16 日會議的定價（目前升息機率約 31%）。紀要之後，本週剩下的重點回到每週初領失業金與聯準會官員談話，能撼動大盤的新數據不多——這意味著在下一份通膨或就業數據出來之前，殖利率與油價會繼續主導盤面節奏。", "en": "The macro calendar over the next five trading days is front-loaded. Today's (8/19) minutes from the July FOMC meeting are the week's biggest variable, with markets reading between the lines to judge how isolated those three hike dissents were — which feeds straight into pricing for the 15-16 September meeting, currently around 31% odds of a hike. After the minutes, the rest of the week comes down to weekly jobless claims and Fed speakers, with little new data capable of moving the index. That means yields and oil will keep setting the rhythm until the next inflation or employment print arrives.", "url": "https://www.interactivecrypto.com/fomc-minutes-on-august-19-set-to-clarify-fed-s-rate-path-amid-mixed-economic-signals-aug-2026", "stocks": [{"t": "SHY", "n": "1-3 年期公債 ETF，最貼近聯準會政策利率預期，紀要鷹派程度直接反映在這裡"}, {"t": "UUP", "n": "美元指數 ETF，九月升息機率若從 31% 上調，美元通常先動"}]},
    {"id": "week_2", "channel": "本週事件", "tag": "零售壓軸", "color": "#C97DD4", "zh": "零售財報週今天進入下半場：Target 與 Lowe's 今天盤前，Walmart 明天（8/20）壓軸。三家報的都是七月零售銷售月減 0.6% 的那一段時間，所以真正該讀的不是各自的數字，而是三者之間的差距。Walmart 以生鮮與低價為主，代表的是低收入族群的消費體溫；Target 偏可選消費，代表的是「還有沒有餘裕」；Lowe's 則是房市裝修的即時讀數。如果 Walmart 好、Target 差，那不是消費衰退，是消費降級——這兩件事對持股的意義完全不同。", "en": "Retail earnings week reaches its second half today: Target and Lowe's report before the open, with Walmart closing it out tomorrow (8/20). All three cover the same stretch in which July retail sales fell 0.6%, so what to read is not each company's number but the gaps between them. Walmart, weighted to groceries and value, is the temperature reading on lower-income households; Target skews discretionary and shows whether there is still room to spend; Lowe's is a live read on housing renovation. If Walmart is strong and Target is weak, that is not a consumer recession but a consumer trade-down — and the two mean very different things for what you hold.", "url": "https://stocksdownunder.com/walmart-target-home-depot-earnings-consumer/", "stocks": [{"t": "WMT", "n": "明天（8/20）壓軸，生鮮與低價為主，是低收入族群的消費體溫計"}, {"t": "XRT", "n": "零售 ETF，成分分散，是判讀「降級 vs 衰退」的整體對照"}]},
    {"id": "eval_1", "channel": "今日評估", "tag": "今日評估", "color": "#E8A838", "status": "讀完了？點下面的按鈕跟 AI 討論今天的重點", "zh": "今天最值得注意的一件事，是長端殖利率創高這件事已經不再是美國自己的故事。美國三十年期觸及 5.323% 創 2007 年來高、日本十年期 2.93% 創 1996 年來高、德國與英國的長天期同步升到數十年高點——四個主要經濟體同時發生，代表市場在集體重估「把錢借給政府三十年」的價格。而在同一天，AI 半導體重挫 5.5%、小型股與醫療保健卻站在高檔，錢並沒有離開股市，只是換了停車位。我的問題是：如果全球期限溢價的重定價才剛開始，那麼「往低估值、低波動、國內收入的地方躲」這個策略，撐得過幾季？還是它其實只是同一個泡沫的下一個房間？", "en": "The single most notable thing today is that the long-yield story has stopped being America's alone. The U.S. 30-year touched 5.323%, its highest since 2007; Japan's 10-year hit 2.93%, a high since 1996; and long-dated German and UK yields reached multidecade highs — four major economies at once, which means the market is collectively repricing what it costs to lend a government money for thirty years. On the same day AI semiconductors fell 5.5% while small caps and healthcare sat near highs: money did not leave equities, it changed parking spaces. My question is this. If the repricing of the global term premium is only beginning, how many quarters does the hide-in-low-valuation, low-volatility, domestic-revenue strategy actually survive? Or is it simply the next room in the same bubble?", "url": "https://www.cnbc.com/2026/08/18/30-year-treasury-yield-three-things-that-could-drive-it-even-higher.html", "stocks": [{"t": "SPY", "n": "標普 500 ETF，連三日下跌但距上週高點僅約 1%，跌勢尚屬有序"}, {"t": "IWM", "n": "羅素 2000 ETF，在長端創高的同時仍在高檔，是今天最大的認知落差"}]},
];

// 「資金流向」是特殊分頁:嵌 TradingView 即時熱力圖,不吃 CARDS、每日排程不用動它
const TODAY_SUBS = ["全部", ...CHANNELS.map(c => c.key), "資金流向"];

// 內容指紋:CARDS 一換(每日排程更新)就變,閱讀進度 key 跟著換 → 新的一天自動從第 1 張開始讀。
// 排程只要照常抽換 CARDS 就好,不用額外維護日期。
const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

// ===== 資金流向(TradingView 官方嵌入元件,即時資料,每日排程不需更新) =====
function HeatmapView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",
        blockSize: "market_cap_basic", blockColor: "change",
        locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true,
        hasSymbolTooltip: true, isMonoSize: false,
        width: "100%", height: "100%"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 10px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>S&P 500 · 即時資金流向</span>
        <a href="https://finviz.com/map?t=sec&st=d1" target="_blank" rel="noopener noreferrer" className="source-link">Finviz 完整版 ↗</a>
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ flex:1, minHeight:0 }} />
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/19/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v8.0</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
