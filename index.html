<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "休市的一天", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普500 ETF，上週五收在7,718.60點、週線僅漲0.1%"}, {"t": "VTWO", "n": "Vanguard 羅素2000 ETF，上週收在3,052.85點的紀錄新高"}, {"t": "TLT", "n": "長天期公債 ETF，債市今天同步休市、殖利率定價暫停一天"}], "en": "US stock and bond markets are closed all day for Labor Day and reopen on 8 September. The week has only four sessions but carries two inflation prints, an ECB decision, an Apple product event and Oracle's results, so the information density is roughly double a normal week. The S&P 500 ended Friday at 7,718.60, up just 0.1% for the week, while the Russell 2000 closed that same week at a record 3,052.85. A closed market does not mean nothing is happening; it means prices are parked while the information keeps arriving.", "zh": "今天是勞動節，美股與美債市場全天休市，要到九月八日才重新開盤。這一週只有四個交易日，卻擠進了兩份通膨數據、歐洲央行決議、蘋果發表會與甲骨文財報，資訊密度是平常週的一倍以上。上週五標普五百收在七千七百一十八點六零、整週只漲百分之零點一；羅素兩千則在同一週收在三千零五十二點八五的紀錄新高。休市不代表沒事發生，只代表價格暫時停在原地等資訊。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "亞歐照常開門", "color": "#E05C5C", "stocks": [{"t": "EWJ", "n": "日本股市 ETF，日經上週五收65,158點、單日漲1.47%"}, {"t": "EWH", "n": "香港股市 ETF，恆生指數在25,213點附近整理"}, {"t": "VGK", "n": "歐洲股市 ETF，倫敦與泛歐今天照常交易"}], "en": "With Wall Street shut, London, Hong Kong and Tokyo all trade normally today, so global price discovery is handed entirely to Asia and Europe for one session. The Nikkei 225 rose 944 points, or 1.47%, on Friday to close at 65,158, while the Hang Seng hovered near 25,213. For US investors, today's Asian and European closes are the only fresh information before Tuesday's open, and energy and shipping names are usually where that reaction shows up first.", "zh": "美股休市，但倫敦、香港與東京今天都照常交易，等於這一天的全球價格發現完全交給亞洲與歐洲。上週五日經二二五指數上漲九百四十四點、漲幅百分之一點四七，收在六萬五千一百五十八點；恆生指數則在兩萬五千兩百一十三點附近整理。對美股投資人來說，今天亞歐盤的收盤價是明天開盤前唯一的新資訊，其中又以能源與航運類股的反應最值得先看。", "url": "https://tradingeconomics.com/japan/stock-market"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "能源獨走", "color": "#E05C5C", "stocks": [{"t": "XLE", "n": "能源類股 ETF，今年以來漲42.32%、本益比僅13.0倍"}, {"t": "XLC", "n": "通訊服務類股 ETF，今年以來仍是負報酬"}, {"t": "XLY", "n": "非核心消費類股 ETF，今年以來表現全類股最弱"}], "en": "Zoom out and the real winner of 2026 is not technology but energy. The energy sector is up 42.32% year to date on a price/earnings ratio of just 13.0x, the cheapest sector on the board, with a 16.3% return on equity and a 2.4% dividend yield. Communication services and consumer discretionary, by contrast, are still negative for the year. The rotation out of narrative and into the physical economy has been running for most of the year, not just for the past week.", "zh": "把時間拉長看，二零二六年真正的贏家不是科技股而是能源股。能源類股今年以來上漲百分之四十二點三二，本益比只有十三倍，是所有類股裡最便宜的一塊，股東權益報酬率百分之十六點三、股利率百分之二點四。相對的，通訊服務與非核心消費這兩個類股今年以來還是負報酬。市場把錢從「故事」搬到「實體經濟」的動作，已經走了大半年，不是上週才開始。", "url": "https://www.investing.com/news/stock-market-news/sp-500-sector-performance-energy-leads-with-42-ytd-gain-in-2026-93CH-4883146"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "第一百九十天", "color": "#E05C5C", "stocks": [{"t": "BNO", "n": "布蘭特原油 ETF，油價約95.83美元、比戰前高約兩成"}, {"t": "OIH", "n": "油田服務 ETF，供給受限讓服務需求集中到非中東產區"}, {"t": "CVX", "n": "大型綜合油商，上游油價與下游加工利差同時走高"}], "en": "The Strait of Hormuz disruption is now on day 190, and it is the real engine behind this year's oil price. Brent was around $95.83 on 6 September, roughly 20% above the pre-war level near $72, while daily commodity transits through the strait have fallen to 11-12 vessels against a pre-war baseline of 100-140, leaving traffic at 10-15% of normal. Reconstructed Persian Gulf exports run at 15-16 million barrels a day, some 7-8 million below pre-war levels, and charter rates for tankers transiting the strait now exceed $500,000 per day.", "zh": "荷姆茲海峽的斷流已經進入第一百九十天，這才是今年油價真正的引擎。九月六日布蘭特原油約九十五點八三美元，比戰前的七十二美元高出約兩成；目前每天通過海峽的商船只剩十一到十二艘，戰前是一百到一百四十艘，等於只有正常量的一到一成半。波斯灣出口重建後約為一天一千五百到一千六百萬桶，比戰前少了七百到八百萬桶，而通過海峽的油輪日租金已經站上五十萬美元。", "url": "https://global-energy-flow.com/hormuz/"},
    {"id": "earn_0", "channel": "財報速報", "tag": "獲利創高本業縮", "color": "#E8786A", "stocks": [{"t": "GME", "n": "9/8 公布完整財報，初步淨利2.9-3.1億但營收從9.72億掉到7.8-8.0億"}, {"t": "EBAY", "n": "遊戲驛站持有其股權與衍生部位，貢獻約2.38億美元評價利益"}], "en": "GameStop has already pre-announced its second-quarter figures, and the headline is flattering while the composition is not. Net income of roughly $290-310 million compares with $168.6 million a year earlier, yet about $238 million of that came from gains on its eBay equity stake and related derivative positions. Sales over the same quarter fell to between $780 million and $800 million from $972.2 million. The full report lands on 8 September, and the number that matters is not earnings per share but how much of the core business is left.", "zh": "遊戲驛站已經先公布第二季初步數字，帳面漂亮但構成很微妙：單季淨利約兩億九千萬到三億一千萬美元，遠高於去年同期的一億六千八百六十萬，但其中大約兩億三千八百萬美元來自它持有的 eBay 股權與衍生性部位的評價利益。同一季營收卻從九億七千兩百二十萬美元掉到七億八千萬至八億美元之間。完整財報九月八日公布，屆時要看的不是每股盈餘，而是本業還剩下多少。", "url": "https://www.tipranks.com/news/gamestop-sets-september-8-earnings-date-as-ebay-stake-boosts-second-quarter-profits"},
    {"id": "earn_1", "channel": "財報速報", "tag": "發表節奏拆兩檔", "color": "#E8786A", "stocks": [{"t": "AAPL", "n": "9/9 發表會，標準版 iPhone 18 延到2027年春季、發表節奏拆成兩檔"}, {"t": "SWKS", "n": "射頻前端元件供應商，出貨節奏跟著蘋果拉貨曲線走"}, {"t": "CRUS", "n": "音訊與電源管理晶片商，營收高度集中於單一客戶"}], "en": "Apple has confirmed a 9 September event called Surprise and Shine, where the iPhone 18 Pro and Pro Max, the company's first foldable iPhone, and the Apple Watch Series 12 and Ultra 4 are expected. The structural change is that the standard iPhone 18 will not launch in September at all, slipping to spring 2027, which effectively splits Apple's single annual launch into two waves. Pre-orders open 12 September with shipments from 18 September, and that timeline sets the fourth-quarter build schedule for the entire supply chain.", "zh": "蘋果已經確認九月九日舉行名為 Surprise and Shine 的發表會，預期推出 iPhone 18 Pro 與 Pro Max、第一支折疊式 iPhone，以及 Apple Watch Series 12 與 Ultra 4。真正的結構性改變是：標準版 iPhone 18 不在九月推出，要延到二零二七年春季，等於蘋果把單一年度的發表會拆成春秋兩檔。預購九月十二日開始、九月十八日上市，這條時間軸會直接決定第四季供應鏈的拉貨節奏。", "url": "https://www.macrumors.com/2026/08/27/apple-event-announced-six-new-products/"},
    {"id": "earn_2", "channel": "財報速報", "tag": "同一晚四種需求", "color": "#E8786A", "stocks": [{"t": "CASY", "n": "9/8 盤後財報，中西部便利商店與加油站，油品利差是變數"}, {"t": "CHWY", "n": "9/9 盤前財報，線上寵物用品，看可選消費的黏著度"}, {"t": "TTAN", "n": "9/8 盤後財報，藍領服務業派工軟體，反映水電空調工班接單量"}], "en": "Four companies report after the close on 8 September, and each speaks for a different slice of demand: Casey's runs Midwestern convenience stores and fuel, Chewy sells pet supplies online, Braze sells marketing automation software, and ServiceTitan sells dispatch software to trades businesses such as plumbing and HVAC. Read together on a single evening, convenience spending, pet budgets, corporate marketing spend and blue-collar job volumes give a cross-section of real demand that no single macro release can match.", "zh": "九月八日盤後有四家公司同時交卷，而且分別代表四塊不同的需求：Casey's 是中西部便利商店與加油站、Chewy 是線上寵物用品、Braze 是行銷自動化軟體、ServiceTitan 則是賣給水電空調等藍領服務業的派工軟體。同一個晚上把便利消費、寵物支出、企業行銷預算與藍領工班的接單量放在一起看，比任何一份總經數據都更接近真實需求的橫切面。", "url": "https://247wallst.com/cards/tuesday-carries-the-week-gamestop-casey-s-braze-and-servi-dlng-earnings-calendar-01m1pnwtd1bdyv04sfnm7a4c1e"},
    {"id": "macro_0", "channel": "總經政策", "tag": "聯準會的算術", "color": "#7C6AF7", "stocks": [{"t": "BIL", "n": "一至三個月國庫券 ETF，直接反映政策利率路徑的重新定價"}, {"t": "TIP", "n": "抗通膨公債 ETF，PCE年增3.7%、六個月年化4.1%是它的定價基礎"}], "en": "The Fed's preferred inflation gauge still looks bad: the PCE price index rose 0.2% in July for a 3.7% annual rate, and the six-month annualised pace is 4.1%, both far above the 2% target. After Kevin Warsh used Jackson Hole to commit publicly to fighting inflation, market pricing for the 15-16 September meeting flipped from roughly a 70% chance of no change to something like a 56-66% chance of a quarter-point hike. That is a sharp reversal after three cuts in 2026 took the funds rate down to 3.50-3.75%.", "zh": "聯準會偏好的物價指標依然難看：個人消費支出物價指數七月月增百分之零點二、年增率百分之三點七，若只看最近六個月的年化速度更是百分之四點一，都遠高於百分之二的目標。華許在傑克森洞明確表態要壓通膨之後，市場對九月十五、十六日會議的定價，從原本近七成押「不動」翻轉成大約五成六到六成六押「升一碼」。這是二零二六年連降三次、把利率壓到百分之三點五至三點七五之後的大轉彎。", "url": "https://www.cnbc.com/2026/08/31/markets-see-warsh-endorsing-a-rate-hike-in-september-not-everyone-is-convinced.html"},
    {"id": "macro_1", "channel": "總經政策", "tag": "沒有官方翻譯", "color": "#7C6AF7", "stocks": [{"t": "IEF", "n": "七至十年期公債 ETF，兩份通膨數據直接決定中天期殖利率"}, {"t": "FXE", "n": "歐元 ETF，9/10 歐洲央行決議是本週唯一的非美央行事件"}], "en": "Everything in this week is crammed into its last two days: 10 September brings August producer prices, the ECB rate decision and August existing home sales, and 11 September brings the August consumer price index. Complicating matters, Fed officials are already inside the pre-meeting blackout and stay quiet until 17 September, so when those prints land there is nobody from the central bank to interpret them. The market has to translate inflation data into hike probabilities entirely on its own, inside forty-eight hours.", "zh": "這一週的資訊全部擠在最後兩天：九月十日一次公布八月生產者物價指數、歐洲央行利率決議與八月成屋銷售，九月十一日再公布八月消費者物價指數。更麻煩的是聯準會官員已經進入會前靜默期，要到九月十七日才解禁，所以這兩份數據落地時，沒有任何一位官員出來替市場翻譯。等於市場要在四十八小時內自己把通膨數字換算成升息機率。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar"},
    {"id": "macro_2", "channel": "總經政策", "tag": "降完再升的代價", "color": "#7C6AF7", "stocks": [{"t": "FLOT", "n": "浮動利率投資級債 ETF，票息隨基準利率上調而受惠"}, {"t": "BKLN", "n": "優先擔保浮動利率貸款 ETF，借款人成本上升是它的收益來源"}, {"t": "GLD", "n": "黃金 ETF，押的是政策路徑可信度被折價"}], "en": "The awkward part of this repricing is that the Fed only cut three times in 2026, taking the funds rate down to 3.50-3.75%, and the market is now betting it hikes straight back in September. For floating-rate borrowers the round trip is itself a cost: loan coupons follow the benchmark, but the time and fees spent renegotiating never come back. That is also why gold and floating-rate assets attracted buyers in the same week; both are pricing the same thing, which is a discount applied to the credibility of the policy path.", "zh": "這一輪定價最尷尬的地方在於，聯準會二零二六年才連續降了三碼、把利率帶到百分之三點五至三點七五，現在市場卻在押它九月就要升回去。對浮動利率借款人來說，這種來回本身就是成本：貸款利率跟著基準走，但重新談判花掉的時間與費用不會退回來。這也解釋了為什麼黃金與浮動利率資產會在同一週同時有買盤，兩者押的其實是同一件事，也就是政策路徑的可信度正在被折價。", "url": "https://www.forbes.com/sites/digital-assets/2026/08/31/cme-fedwatch-provides-a-66-chance-fed-will-hike-rates-in-september/"},
    {"id": "sector_0", "channel": "產業風向", "tag": "瓶頸不是鋼", "color": "#4EABA4", "stocks": [{"t": "GEV", "n": "電力設備商，總積壓訂單逾1,000億美元、其中設備386億"}, {"t": "HUBB", "n": "電網與變電站元件供應商，交期拉長直接轉成訂價權"}, {"t": "POWL", "n": "中小型配電盤與開關設備商，資料中心與煉油廠是主要客戶"}], "en": "Grid equipment lead times have stretched far enough to change investment logic: large power transformers now average about 128 weeks from order to delivery, and substation transformers have gone from roughly 140 weeks in 2023 to more than 160 weeks. GE Vernova has disclosed a total backlog above $100 billion, including $38.6 billion in equipment, the largest power-equipment backlog on record. Roughly 7 GW of planned US data centre capacity was delayed or cancelled across 2025 and 2026 because of power infrastructure, and the binding constraint is not electrical steel but a US workforce of only about 15,000 people who hand-wind copper coils.", "zh": "電網設備的交期已經長到會改寫投資邏輯：大型電力變壓器平均從下單到交貨約一百二十八週，變電站變壓器更從二零二三年的約一百四十週拉長到超過一百六十週。奇異威能公布的總積壓訂單超過一千億美元，其中設備部分三百八十六億美元，是史上最大的電力設備積壓。二零二五到二零二六年間，美國約有七 GW 的資料中心規劃因為電力設備延後或取消，而真正的瓶頸不是取向矽鋼片，是全美只有約一萬五千人的手工繞線技工。", "url": "https://www.utilitydive.com/news/reshore-electrical-equipment-backlogs-transformer-breaker-nema/749265/"},
    {"id": "sector_1", "channel": "產業風向", "tag": "柴油裂解價差", "color": "#4EABA4", "stocks": [{"t": "MPC", "n": "大型獨立煉油商，無上游、獲利完全來自加工利差"}, {"t": "PSX", "n": "煉油與中游能源商，餾分油庫存處在1951年以來同期低點"}, {"t": "CRAK", "n": "全球煉油商 ETF，7月單月上漲逾21%"}], "en": "The US Gulf Coast ultra-low sulphur diesel crack against WTI hit a record $102 per barrel on 17 August, against a pre-crisis norm of just $15-25. At the same time US distillate inventories sat near 107.1 million barrels, the lowest for that point in the year since 1996 and the lowest August level since 1951. That is a direct positive for independent refiners with no upstream production, whose entire margin is the processing spread, and a refiner-focused ETF gained more than 21% in July alone.", "zh": "美國墨西哥灣超低硫柴油對西德州原油的裂解價差，在八月十七日創下每桶一百零二美元的歷史紀錄，而危機前的正常區間只有十五到二十五美元。同一時間，美國餾分油庫存約一億零七百一十萬桶，是一九九六年以來同期最低，若只看八月單月更是一九五一年以來最低。這對沒有上游、純賺加工利差的獨立煉油商是直接的利多，煉油商指數型基金七月單月就上漲逾百分之二十一。", "url": "https://rbnenergy.com/daily-posts/blog/100bbl-diesel-crack-or-how-2026-exposed-fragility-global-refining"},
    {"id": "sector_2", "channel": "產業風向", "tag": "貨改走鐵路", "color": "#4EABA4", "stocks": [{"t": "HUBG", "n": "複合運輸整合商，貨從卡車轉鐵路的直接受惠者"}, {"t": "UNP", "n": "西部鐵路龍頭，今年前30週複合運輸量年增3.8%"}, {"t": "JBHT", "n": "同時經營卡車與複合運輸，內部替代效應最明顯"}], "en": "When diesel gets expensive enough, the mode of transport itself changes. US intermodal volume rose 3.8% year on year to more than 8.4 million units through the first thirty weeks of 2026, June set a record for monthly average weekly volume, and container and trailer loadings in the last week of May were up 11.5% year on year. The reason is blunt: on lanes of roughly 550 to 1,500 miles, rail runs 20-30% cheaper than truck, while truckload capacity has kept shrinking through carrier exits and tighter enforcement, pushing spot rates to record levels.", "zh": "柴油貴到某個程度，運輸方式本身就會換。今年前三十週美國複合運輸量年增百分之三點八、超過八百四十萬個單位，六月更創下單月週均量的紀錄；五月最後一週的貨櫃與拖車量年增百分之十一點五。原因很直白：在八百八十公里到兩千四百公里這個長程區間，走鐵路比走卡車便宜兩成到三成，而卡車運力今年因為業者退出與法規稽查持續縮減，現貨運價已經來到紀錄水準。", "url": "https://www.freightwaves.com/news/trucking-slowdown-the-real-reason-intermodal-shift-data-explains"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "創高與升息同週", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，收在3,052.85點紀錄新高、今年以來漲23%"}, {"t": "RSP", "n": "等權重標普 ETF，可對照大型股內部的廣度是否同步改善"}], "en": "The Russell 2000 closed last week at a record 3,052.85, up 23% year to date, 9.1 percentage points ahead of the S&P 500 and up 25% over twelve months. The contradiction is that in the same week the market pushed the odds of a September hike to roughly two in three. Small caps are normally the group most exposed to rising rates because they carry more floating-rate debt. An index making highs while rates are repriced upward means what is being bought is not a rate-cut story but something else.", "zh": "羅素兩千指數上週收在三千零五十二點八五的紀錄新高，今年以來漲幅百分之二十三，領先標普五百九點一個百分點，過去十二個月漲百分之二十五。矛盾的是，同一週市場對九月升息的定價站上了約三分之二。小型股通常是最怕升息的一群，因為浮動利率負債比例高。指數在創高、利率在往上，兩件事同時成立，代表市場買的並不是「利率會降」，而是別的東西。", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "微型股更兇", "color": "#5B8ED6", "stocks": [{"t": "IWC", "n": "微型股 ETF，過去12個月微型股指數報酬45.7% vs 大盤22.8%"}, {"t": "IWM", "n": "羅素2000 ETF，同期漲幅明顯落後微型股，是最好的對照組"}], "en": "Even less noticed than small caps are micro caps. In the twelve months to 17 August, the Morningstar US Micro Cap Index returned 45.7% against 22.8% for the broad market, more than double. Almost none of this gets discussed in mainstream coverage, because micro caps have no index futures, little institutional positioning and very few brokers writing about them. They are also the most fragile part of the market: when liquidity tightens, gains of that size unwind faster than they were made.", "zh": "比小型股更被忽略的是微型股。截至八月十七日的過去十二個月，晨星美國微型股指數報酬率百分之四十五點七，同期整體市場只有百分之二十二點八，差距超過一倍。這件事幾乎沒有被主流媒體討論，因為微型股沒有指數期貨、沒有大型法人部位，也沒有幾家券商在寫報告。但它同時也是最脆弱的一段：一旦流動性收縮，這種漲幅回吐的速度會比它上漲時更快。", "url": "https://www.morningstar.com/funds/these-tiny-stocks-are-quietly-outperforming-market"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "折價要打折看", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素2000成長股 ETF，虧損公司比重最高的一塊"}, {"t": "CALF", "n": "以自由現金流殖利率選股的小型股 ETF，可對照本益比失真的問題"}], "en": "Small caps trade around 18.11x earnings, roughly a 34.5% discount to large caps, which looks cheap. That cheapness rests on an assumption: consensus expects the Russell 2000 to deliver about 43% earnings growth over the next twelve months. Small-cap consensus estimates have long skewed optimistic, and a meaningful share of the index consists of companies that still lose money, so once the denominator is negative or near zero the P/E itself stops meaning much. Enterprise value to sales, or free cash flow yield, is a far more honest lens for this group.", "zh": "小型股目前本益比約十八點一一倍，相對大型股折價約三成四點五，看起來便宜。但這個便宜建立在一個假設上：市場預期羅素兩千未來十二個月的盈餘年增率高達四成三。小型股的共識預估長期以來就偏樂觀，而且指數成分中有相當比例是還在虧錢的公司，一旦分母是負數或接近零，本益比這個數字本身就會失真。看小型股估值時，改用企業價值對營收、或自由現金流殖利率會誠實得多。", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "柴油帳單記誰頭上", "color": "#5B8ED6", "stocks": [{"t": "HTLD", "n": "小型冷藏與乾貨卡車業者，燃油成本佔比高、議價力弱"}, {"t": "MRTN", "n": "小型冷藏卡車業者，長途運輸受柴油價格影響最直接"}, {"t": "WERN", "n": "中型卡車與物流業者，可對照規模是否真的帶來成本優勢"}], "en": "With diesel cracks at records, the bill lands on small trucking companies. Contract rate adjustments in this group typically lag fuel surcharges, fleets are small enough to have little pricing power, and unlike the majors they cannot lock in fuel through long-term supply contracts. Part of this year's accelerated carrier exit rate traces straight back to that squeeze. To gauge how real the pressure is, watching the operating margins of a few pure-play truckers is more direct than watching any rate index.", "zh": "柴油裂解價差創紀錄，成本最後是記在小型卡車業者頭上。這一族群的合約運價調整通常落後燃油附加費，車隊規模小、議價力弱，而且不像大型業者能用長約鎖住油價。今年卡車業者退出市場的速度加快，有一部分原因就在這裡。要判斷這個壓力有多真，比起看運價指數，直接看幾家純卡車業者的營業利益率變化更直接。", "url": "https://www.freightwaves.com/news/some-diesel-analysts-are-warning-of-a-supply-crunch-nobody-in-washington-is-talking-about-here-is-what-holds-up-and-what-it-could-mean-for-q4"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "創高不等於你會賺", "color": "#5B8ED6", "stocks": [{"t": "VB", "n": "全市場小型股 ETF，成分數量最多、最接近母體"}, {"t": "IJR", "n": "標普600小型股 ETF，成分股須有連續獲利紀錄，品質門檻較高"}], "en": "This is the most commonly misread thing about small caps: a record high in the Russell 2000 tells you less than you think about whether your particular small cap will rise. Three reasons. The index is market-cap weighted, so gains concentrate in constituents that have already grown large; annual reconstitution drops the worst fallers and adds the risers, building in survivorship bias; and different indices covering the same universe use different rules, with the S&P 600 requiring a record of profitability and therefore carrying better-quality constituents by construction. When you see small caps at a record, the first question is which pool.", "zh": "這是小型股最常被誤讀的一件事：羅素兩千創新高，跟你手上那一檔小型股會不會漲，關聯比想像中低。原因有三個。指數是市值加權，漲幅集中在少數已經長大的成分股；指數每年重組會把跌太多的踢掉、把漲上來的納入，天生帶有存活者偏誤；而追蹤同一群公司的不同指數規則也不同，標普六百要求連續獲利，成分品質天生較好。看到「小型股創高」時，第一個要問的是哪一個池子。", "url": "https://www.proshares.com/browse-all-insights/insights/is-the-small-cap-slumber-over"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新上池", "color": "#C9A227", "stocks": [{"t": "JYNT", "n": "連鎖整脊診所加盟商，Q2營收年增14%至1,520萬、淨利轉正65.3萬"}], "en": "The Joint Corp runs the largest chiropractic clinic franchise in the US, built on walk-in visits and monthly membership pricing. Its neglect is textbook: a market value near $140 million, only about four analysts covering it, and an unglamorous industry. What is changing is the model, as the company sells corporate clinics back to franchisees and converts into a capital-light royalty franchisor: second-quarter revenue rose 14% to $15.2 million, consolidated net income turned positive at $653,000, and operating cash flow grew 152%. Large holder Charles Jobson bought over $1 million at an average $8.57 in May and added roughly $572,000 at $9.11 on 4 September. The risk is that same-clinic membership growth at the franchisee level is the real engine, and if it stays weak once the transition is done, going capital-light merely moves the problem onto franchisees. This is a research lead, not investment advice.", "zh": "The Joint Corp 是美國最大的連鎖整脊診所品牌，主打不用預約、月費會員制的門診。它被忽視的原因很典型：市值只有一億四千萬美元上下、只有約四位分析師覆蓋、產業本身不性感。正在改變的是商業模式：公司把直營診所賣回給加盟主、轉成純收權利金的輕資產加盟商，第二季營收年增百分之十四、來到一千五百二十萬美元，合併淨利轉正為六十五萬三千美元，營運現金流年增百分之一百五十二。大股東 Charles Jobson 五月以均價八點五七美元買進逾一百萬美元後，九月四日再以九點一一美元加碼約五十七萬美元。風險是：加盟端的同店會員成長才是真正的引擎，若轉型完成後同店仍疲弱，輕資產只是把問題轉嫁給加盟主。這是研究線索，不是投資建議。", "url": "https://www.tipranks.com/news/company-announcements/joint-corp-earnings-call-highlights-profitable-shift", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（轉型完成後的同店會員成長率）"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "被標題誤讀", "color": "#C9A227", "stocks": [{"t": "GBX", "n": "鐵路貨車製造與租賃商，自有租賃車隊2.06萬輛、使用率99%"}], "en": "Greenbrier builds and leases railcars. The market files it under cyclical manufacturing, so when third-quarter revenue fell from $842.7 million to $576.5 million the share reaction followed the cyclical script. What gets missed is the other half: the owned lease fleet has grown to 20,600 railcars at 99% utilisation, and 60% of global orders now arrive attached to a lease origination, meaning the manufacturing arm feeds the leasing arm and converts one-off sale prices into recurring rent. Full-year EPS guidance is $3.00 to $3.15. The risks are real: a 32% revenue decline is not trivial, tariffs and deferred orders hit manufacturing directly, and expanding the lease fleet consumes capital. This is a research lead, not investment advice.", "zh": "Greenbrier 做的是鐵路貨車製造與租賃。市場給它的標籤是「景氣循環製造業」，所以第三季營收從八億四千兩百七十萬掉到五億七千六百五十萬美元時，股價反應就照循環股的劇本走。被忽略的是另外半邊：它自有的租賃車隊已擴大到兩萬零六百輛、使用率百分之九十九，而且全球訂單中有六成是搭配租賃承作一起進來的，等於製造部門正在替租賃部門導流，把一次性售價轉成長期租金。全年每股盈餘指引三點零零到三點一五美元。風險也很實在：營收年減三成二不是小事，關稅與客戶延單會直接砸在製造端，而租賃車隊要再擴大就得吃資本支出。這是研究線索，不是投資建議。", "url": "https://www.stocktitan.net/sec-filings/GBX/8-k-greenbrier-companies-inc-reports-material-event-9810c051108c.html", "status": "RADAR · 下一個驗證點 10 月 FY2026 第四季財報（租賃營收佔比與車隊使用率能否守住99%）"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "公司自己說會降", "color": "#C9A227", "stocks": [{"t": "ASC", "n": "成品油輪與化學品輪業者，Q2 MR現貨日收51,870美元、Q3指引僅29,600"}], "en": "Ardmore Shipping operates product and chemical tankers, carrying exactly the refined barrels that are scarce right now. It is overlooked because it is small and because shipowners get filed under unpredictable cyclicals. What is changing is trade geography: the Hormuz disruption and Russian diesel export restrictions have lengthened voyages across the refined products trade, taking second-quarter MR spot time charter equivalent rates to $51,870 per day, close to three times the company's cash breakeven, on adjusted EPS of $1.18 and revenue of $116.2 million. To its credit, the company published the counter-argument itself: third-quarter MR guidance is only $29,600 per day with 45% of revenue days fixed. Buying after a peak-rate quarter and then absorbing guidance at roughly half that level is the classic shipping trap. This is a research lead, not investment advice.", "zh": "Ardmore Shipping 經營成品油輪與化學品輪，載的正是柴油、航空燃油這類目前最缺的精煉油品。它被忽視的原因是市值小，而且船東股常被歸類為「不可預測的循環股」。正在改變的是航線結構：荷姆茲斷流與俄羅斯柴油出口限制，把全球油品貿易的航程整體拉長，第二季 MR 型現貨等價期租收入來到每天五萬一千八百七十美元、接近公司現金損益兩平點的三倍，單季調整後每股盈餘一點一八美元、營收一億一千六百二十萬美元。難得的是公司自己把反方論點寫了出來：第三季 MR 指引只有每天兩萬九千六百美元，已訂船期覆蓋四成五。買在高運價季報之後、卻要承受指引接近腰斬，這是航運股最典型的陷阱。這是研究線索，不是投資建議。", "url": "https://www.investing.com/news/company-news/ardmore-q2-2026-slides-rates-triple-breakeven-on-supply-disruptions-93CH-4821104", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報（實現的 MR 等價期租收入是否高於 29,600 美元指引）"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "明天就開獎", "color": "#C9A227", "stocks": [{"t": "AVO", "n": "酪梨與藍莓種植配銷商，9/8 盤後財報、共識 EPS 0.12 美元"}], "en": "Pool name Mission Produce reports fiscal third-quarter results after the close tomorrow, 8 September, the first validation point in the pool actually to come due. The company grows, packs and distributes avocados and blueberries, and it is overlooked largely because the produce-company label makes the market assume it is a passive price taker. Consensus expects EPS of $0.12 on revenue of $367.58 million. The checks written when it entered the pool have not changed: whether average avocado pricing recovers, whether gross margin expands, and whether the international farming segment is still a drag. The report is the answer, and the decision to keep it or downgrade it comes afterwards. This is a research lead, not investment advice.", "zh": "池內的 Mission Produce 明天，也就是九月八日盤後，公布會計年度第三季財報，這是雷達池裡第一個真正到期的驗證點。它做的是酪梨與藍莓的種植、採後處理與行銷配銷，被忽視的原因是「農產品公司」這個標籤，讓市場預設它只是價格的被動接受者。市場共識預估每股盈餘零點一二美元、營收三億六千七百五十八萬美元。入池時寫下的檢查項目一項都沒變：酪梨均價是否回升、毛利率能否擴張、以及國際農場部門是否還在拖累。財報就是答案，看完再決定要留在池內還是降級。這是研究線索，不是投資建議。", "url": "https://www.globenewswire.com/news-release/2026/08/25/3350869/0/en/mission-produce-to-release-fiscal-third-quarter-2026-financial-results-on-tuesday-september-8-2026.html", "status": "RADAR · 下一個驗證點 2026-09-08 盤後 FQ3 財報（共識 EPS 0.12 美元、營收 3.676 億）"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "改的是風險欄", "color": "#C9A227", "stocks": [{"t": "RM", "n": "非優級消費金融業者，客群同時承受升息與高油價兩股壓力"}], "en": "Pool name Regional Management is a non-prime consumer lender whose customers are mostly households with modest credit scores and thin income buffers. The thesis on entry was improving underwriting quality and a peak in charge-offs. What needs rewriting today is the risk column, not the thesis: the market is pricing a September hike while diesel and gasoline sit near highs, and for this borrower base both push the same way, since rising commuting costs erode repayment capacity first and only later show up in the 30-day delinquency rate. That kind of exogenous variable appears nowhere in the financial statements, but it turns up in delinquency data three to six months early. This is a research lead, not investment advice.", "zh": "池內的 Regional Management 是非優級消費金融業者，客戶多半是信用分數不高、收入沒有太多緩衝的家庭。入池時的論點是承作品質改善、沖銷率見頂。今天要改寫的是風險欄而不是論點欄：市場正在押九月升息，而柴油與汽油價格同時處在高檔，這兩件事對它的客群是同一個方向的壓力，因為通勤成本上升會先侵蝕還款能力，之後才反映到三十天逾期率上。這種外生變數不會出現在財報的任何一行，卻會提早三到六個月出現在逾期數字裡。這是研究線索，不是投資建議。", "url": "https://www.forbes.com/sites/digital-assets/2026/08/31/cme-fedwatch-provides-a-66-chance-fed-will-hike-rates-in-september/", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報（沖銷率與30天逾期率，燃油成本傳導約落後三到六個月）"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池子變大之後", "color": "#C9A227", "stocks": [{"t": "AEHR", "n": "池內已標降級觀察，晶圓級與封裝級老化測試設備商"}, {"t": "ERII", "n": "池內已標降級觀察，海水淡化壓力交換器製造商"}], "en": "The neglect radar pool now holds more than a hundred names, and that is itself worth stopping to examine. Past a certain size a watchlist stops being a list and becomes noise: every name has a thesis and a next validation point, but attention does not scale proportionally. There is only one real test of whether a pool is healthy, which is whether anyone actually goes back and checks the answer when a validation point comes due. Names such as Aehr Test Systems and Energy Recovery are already marked as downgraded-to-watch, which is the correct action; conversely, a stock whose last three validation points were all skipped has effectively eliminated itself and nobody has pressed delete. With markets closed today, this is a good day to delete things.", "zh": "忽視雷達池目前已經有超過一百檔名字，這件事本身就值得停下來檢查。觀察清單一旦超過某個規模，它就不再是清單而是雜訊：每一檔都有論點、都有下一個驗證點，但人的注意力並沒有跟著等比放大。判斷一個池子健不健康只有一個標準，就是驗證點到期時，有沒有真的回去對答案。池內像 Aehr Test Systems 與 Energy Recovery 已經被標成「降級觀察」，那是正確的動作；相對的，如果一檔股票連續三個驗證點都被跳過，它其實已經自動出局，只是沒有人去按刪除。今天休市，正好是回頭刪東西的日子。", "url": "https://app.notion.com/p/6ae9be8507e24aaf85a9a8af4b69fcf0", "status": "RADAR · 池內逾 100 檔，汰除標準是「驗證點到期時有沒有回頭對答案」"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "兩種買法", "color": "#6DB56D", "stocks": [{"t": "AVGO", "n": "董事以872.03美元買進11,000股、總額約959萬美元"}, {"t": "GSAT", "n": "董事長以1.52美元買進508萬股、總額約772萬美元"}], "en": "Between 4 and 8 September there were two insider purchases of similar size but opposite character. A Broadcom director bought 11,000 shares at $872.03 for roughly $9.59 million, while the chairman of Globalstar bought 5,080,416 shares at $1.52 for about $7.72 million. The first is an add-on in a high-priced stock: large in dollars, barely a change in ownership percentage. The second materially increases the number of shares held in a low-priced name. Seven or eight million dollars each, but the signal strength is not comparable.", "zh": "九月四日到八日之間有兩筆規模相近、性質卻完全相反的內部人買進。博通一位董事以每股八百七十二點零三美元買進一萬一千股，總額約九百五十九萬美元；Globalstar 董事長則以每股一點五二美元買進五百零八萬零四百一十六股，總額約七百七十二萬美元。前者是在高價股上加碼，金額大但持股比例的變化極小；後者是在低價股上大幅增加股數，對持股結構的影響顯著。同樣是七、八百萬美元，訊號強度不能等量齊觀。", "url": "https://www.tipranks.com/news/the-fly/fly-insider-ingredion-adp-among-weeks-notable-insider-trades"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "腰斬時進場", "color": "#6DB56D", "stocks": [{"t": "KLAR", "n": "執行長在財報後股價重挫時買進近1,000萬美元"}, {"t": "BABA", "n": "執行長與董事長合計買進約1,500萬美元"}], "en": "A separate thread this year is chief executives buying with their own money after sharp declines. Klarna's Sebastian Siemiatkowski bought nearly $10 million after a post-earnings drop, while Alibaba's chief executive Eddie Wu and chairman Joseph Tsai together bought about $15 million. These purchases share a profile: they follow a large decline, they are made by the people who know the business best, and the sums are meaningful relative to personal wealth. What they are notoriously bad at is timing, because insiders know the operations but not when the market will be willing to re-rate them.", "zh": "今年另一條線是執行長在股價大跌之後自掏腰包。Klarna 執行長 Sebastian Siemiatkowski 在財報後股價重挫時買進近一千萬美元；阿里巴巴執行長吳泳銘與董事長蔡崇信則合計買進約一千五百萬美元。這類買進的共同特徵是：發生在股價大跌之後、由最了解公司的人執行、而且金額對個人而言不算小。要注意的是它們對「時機」的預測力向來很差，因為內部人知道公司的營運狀況，卻不知道市場什麼時候願意重新給評價。", "url": "https://finance.yahoo.com/markets/stocks/articles/3-ceos-buying-millions-dollars-112500691.html"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "金額不是強度", "color": "#6DB56D", "stocks": [{"t": "INGR", "n": "副總以98.50美元買進3,000股、約29.6萬美元，屬公開市場買進"}, {"t": "JYNT", "n": "大股東9/4以9.11美元加碼約57萬美元，是五月之後的第二次買進"}], "en": "Three easy mistakes when reading Form 4 filings. First, looking only at dollar size: an Ingredion vice-president bought just 3,000 shares for $295,500, but it was an open-market purchase and a meaningful sum for an operating executive. Second, ignoring clustering: one insider buying has far less predictive power than three or more buying separately. Third, confusing timeliness: Form 4 must be filed within two business days of the trade, while congressional disclosures allow forty-five days, a gap in freshness of more than twentyfold that makes the two impossible to read on the same table.", "zh": "讀 Form 4 有三個容易犯的錯。第一是只看金額：Ingredion 一位副總只買了三千股、二十九萬五千五百美元，但那是公開市場買進，而且對一位營運主管來說是實質金額。第二是忽略群聚：單一內部人買進的預測力，遠低於三位以上分頭買進。第三是搞混時效：Form 4 規定交易後兩個工作日內申報，政要的申報期限卻是四十五天，兩者的資訊新鮮度差了二十倍以上，不能放在同一張表上比較。", "url": "https://www.gurufocus.com/insider/summary"},
    {"id": "capitol_0", "channel": "政要持股", "tag": "三十八買零賣", "color": "#B5654D", "stocks": [{"t": "HUBB", "n": "申報前四大之一，電網與變電站元件商，交期拉長帶來訂價權"}, {"t": "CHRW", "n": "申報前四大之一，貨運承攬商，卡車轉鐵路過程中的中介角色"}, {"t": "LTH", "n": "申報前四大之一，高階健身俱樂部營運商，體驗型消費代表"}], "en": "The House Clerk's filing index shows that April McClain Delaney of Maryland's sixth district reported 39 transactions over the past ninety days, of which 38 were purchases and none were sales, in an aggregate range of $207,039 to $1,005,000, since disclosures give bands and never exact figures. What is worth looking at is not the name but the mix: the four largest positions are fitness club operator Life Time, grid and substation components maker Hubbell, Formula One rights holder Liberty Media, and freight broker C.H. Robinson. That is money placed on the physical economy and experiential consumption, and it contains no mega-cap technology name at all.", "zh": "眾議院書記官的申報索引顯示，馬里蘭州第六選區的 April McClain Delaney 在過去九十天內申報了三十九筆交易，其中三十八筆是買進、零筆賣出，金額區間落在二十萬七千零三十九美元到一百萬五千美元之間，因為申報只給區間、從不給確切數字。值得看的不是名字而是組合：前四大標的分別是健身俱樂部營運商 Life Time、電網與變電站元件商 Hubbell、一級方程式賽車轉播權公司 Liberty Media，以及貨運承攬商 C.H. Robinson。這是一組把錢押在實體經濟與體驗型消費的部位，裡面沒有任何一檔超大型科技股。", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure"},
    {"id": "capitol_1", "channel": "政要持股", "tag": "四十五天的價差", "color": "#B5654D", "stocks": [{"t": "XOM", "n": "奧克拉荷馬州議員申報的前四大標的之一，能源類股今年以來領漲"}, {"t": "BNO", "n": "布蘭特原油 ETF，七月中到九月初的價差就是申報延遲的成本"}], "en": "The biggest limitation of congressional holdings data is timeliness. Filings that arrived on 1 and 2 September may cover trades executed as early as mid-July, because the rules allow forty-five days. Against this year's tape that lag is concrete: WTI sat in the high seventies to high eighties in mid-July and closed last Friday at $91.48. Anyone buying energy exposure on the back of a disclosure is buying at someone else's price from forty-five days ago. Add that disclosures give only dollar bands and that most trades are executed in spouse or trust accounts, and the correct use of this data is to see what themes real money has been placed on, never to treat it as a buy or sell signal.", "zh": "政要持股資料最大的限制是時效。九月一日與九月二日剛送進來的幾份申報，涵蓋的交易可能早在七月中就已經執行完畢，因為法規給的申報期限是四十五天。放到今年的行情裡看，這個時間差很具體：七月中西德州原油還在七十幾到八十幾美元，上週五已經是九十一點四八美元。也就是說，看到申報才跟著買能源部位的人，買到的是別人四十五天前的價位。再加上申報只給金額區間、多數交易由配偶或信託帳戶執行，這份資料的正確用法是看「有人用真錢押了什麼主題」，而不是當成買賣訊號。", "url": "https://www.congress.gov/crs_external_products/R/HTML/R47818.html"},
    {"id": "week_0", "channel": "本週事件", "tag": "四天兩份通膨", "color": "#C97DD4", "stocks": [{"t": "SPY", "n": "標普500 ETF，本週只有四個交易日卻有兩份通膨數據"}, {"t": "IEF", "n": "七至十年期公債 ETF，9/10 PPI 與 9/11 CPI 是本週的定價核心"}], "en": "The week has just four sessions. Markets reopen on 8 September; 10 September brings August producer prices, the ECB rate decision and August existing home sales together; and 11 September brings the August consumer price index. The FOMC meets on 15-16 September, and the officials' blackout does not lift until 17 September. In other words, the market has to decide whether September brings a hike using two data points inside forty-eight hours, with no official translation available.", "zh": "這一週只有四個交易日。九月八日復市，九月十日一次公布八月生產者物價指數、歐洲央行利率決議與八月成屋銷售，九月十一日再公布八月消費者物價指數。九月十五、十六日就是聯邦公開市場委員會會議，而官員的靜默期要到九月十七日才解除。換句話說，市場要在沒有官方翻譯的情況下，用四十八小時內的兩份數據，決定九月到底升不升息。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar"},
    {"id": "week_1", "channel": "本週事件", "tag": "三天全部到齊", "color": "#C97DD4", "stocks": [{"t": "ORCL", "n": "9/10 盤後財報，今年以來跌近20%、過去12個月跌約30%"}, {"t": "ADBE", "n": "9/10 盤後財報，與甲骨文同一晚，是軟體族群的第二個檢查點"}, {"t": "KR", "n": "9/11 財報，食品通膨與客單價的第一手數據"}], "en": "Corporate information is crammed into the same three days. GameStop, Casey's, Braze and ServiceTitan report after the close on 8 September; Chewy reports before the open on 9 September, the same day as Apple's product event; Oracle and Adobe both report after the close on 10 September; and Kroger follows on 11 September. Oracle is the one to watch, since the stock is down nearly 20% year to date and roughly 30% over twelve months as the market has begun to question visibility on its cloud and AI backlog, making this report its chance to answer.", "zh": "企業端的資訊也擠在同樣三天。九月八日盤後有遊戲驛站、Casey's、Braze 與 ServiceTitan，九月九日盤前有 Chewy、同一天下午是蘋果的產品發表會，九月十日盤後甲骨文與 Adobe 同時交卷，九月十一日輪到克羅格。甲骨文特別值得盯，因為它的股價今年以來已經跌了近兩成、過去十二個月跌約三成，市場對它的雲端與人工智慧訂單能見度開始起疑，這一份財報就是它的辯護機會。", "url": "https://seekingalpha.com/article/4943211-oracle-adobe-results-in-focus-as-earnings-season-winds-down"},
    {"id": "eval_0", "channel": "今日評估", "tag": "矛盾在哪裡", "color": "#E8A838", "stocks": [{"t": "XLE", "n": "能源類股今年以來漲42.32%，代表成本端的上升是真實的"}, {"t": "IWC", "n": "微型股過去12個月漲45.7%，代表風險偏好也是真實的"}], "en": "Markets are closed today, but there is one contradiction worth thinking through while there are no quotes to react to. Roughly two-in-three odds of a Fed hike, Brent near $95, and a record diesel crack are all signals of rising real-economy costs; yet the Russell 2000 set a record 3,052.85 in the same week and micro caps are up 45.7% over twelve months. Either small caps are betting that rising costs get passed through, or they are betting the hike pricing is wrong. Those two bets require completely different things to happen next, and it is worth deciding which one your own positions are actually making.", "zh": "今天市場休市，但有一個矛盾值得在沒有報價干擾的時候想清楚：聯準會升息機率約三分之二、布蘭特原油九十五美元、柴油裂解價差創歷史紀錄，這三件事都是實體成本上升的訊號；可是羅素兩千卻在同一週創下三千零五十二點八五的紀錄新高，微型股過去十二個月更漲了百分之四十五點七。要嘛小型股在押「成本上升會轉嫁出去」，要嘛它在押「這波升息定價會落空」。這兩個賭注需要的後續發展完全不同，值得回頭確認自己的持股實際上押的是哪一個。", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/", "status": "DISCUSS · 小型股創高與升息定價同時成立，你認為它在押哪一個？"},
];

})();

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/07/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v10.2</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
