/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;

    --noise-opacity: 0.035;

  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;

  }
  body::before {

    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }

    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }

  ::-webkit-scrollbar { width: 2px; }

  /* 鍵盤焦點:看得到目前在哪一顆 */
  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }

  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }
  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }

    {"id": "earn_0", "channel": "財報速報", "tag": "Nike 銷售不如預期", "color": "#E8786A", "zh": "Nike 第一財季營收 112.1 億美元，年減 4.3%，低於預期的 113.2 億；毛利率改善 60 個基點到 42.8%，每股盈餘 0.48 美元。但財測才是重點：2027 會計年度營收預期高個位數下滑，調整後每股盈餘 1.15 至 1.35 美元，並宣布「Pace」營運計畫（2031 年前省 25 億美元）與後續裁員。週五股價約跌 6%，今年以來已累計約 45%。", "en": "Nike's fiscal Q1 revenue was $11.21 billion, down 4.3% and below the $11.32 billion consensus; gross margin improved 60 bps to 42.8% and EPS was $0.48. The guide was the problem: fiscal 2027 revenue is expected to fall by a high-single-digit percentage with adjusted EPS of $1.15 to $1.35, plus a 'Pace' plan targeting $2.5 billion of savings by 2031 and more layoffs. Shares fell about 6% Friday and are down roughly 45% this year.", "url": "https://www.cnbc.com/2026/10/02/nike-nke-stock-q1-earnings-layoffs.html", "stocks": [{"t": "NKE", "n": "第一財季營收 112.1 億美元，財測高個位數下滑，週五約 -6%"}, {"t": "LULU", "n": "同業 Lululemon，週五股價大致持平"}, {"t": "ONON", "n": "同業 On Holding，週五股價大致持平"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "特斯拉 Q3 交車超預期", "color": "#E8786A", "zh": "特斯拉公布第三季交車 486,532 輛，高於市場預期的約 463,000 輛，股價週五漲約 4%。福特同期公布第三季美國輕型車銷量 507,395 輛。財報季還沒正式開始，這類「交車與銷量」數字是未來兩週最早可驗證的需求訊號；但交車量不等於獲利，真正的毛利要等月底財報。", "en": "Tesla reported third-quarter deliveries of 486,532 vehicles versus the roughly 463,000 expected, and the shares rose about 4% on Friday. Ford reported U.S. light-vehicle sales of 507,395 for the quarter. With earnings season not yet started, delivery and sales counts are the earliest demand checks, but deliveries are not profit and margins have to wait for the reports.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-2-dow-sp-500-nasdaq-september-jobs-report-080623878.html", "stocks": [{"t": "TSLA", "n": "Q3 交車 486,532 輛，高於預期約 463,000 輛，週五約 +4%"}, {"t": "F", "n": "福特 Q3 美國輕型車銷量 507,395 輛，汽車需求的另一個參照"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "百事財報前的超賣", "color": "#E8786A", "zh": "下週四（10/8）早上 6 點 PepsiCo 公布第三季財報，市場預期每股盈餘 2.30 美元（與去年持平）、營收約 250 億美元（+4.3%）；公司第四季預期為每股 2.43 美元、營收約 303 億美元。技術面上股價近期跌破 128 美元支撐，RSI 低於 30、貼近布林通道下緣，選擇權隱含財報後約 4% 的波動。這是「期望已經很低」的財報，好壞反應都可能被放大。", "en": "PepsiCo reports third-quarter results at 6 a.m. Thursday Oct. 8 with consensus EPS of $2.30 (flat year on year) and revenue of about $25 billion (+4.3%); fourth-quarter expectations are EPS of $2.43 and revenue of about $30.3 billion. Technically the stock recently broke below $128 support, with RSI under 30 and price near the lower Bollinger band, and options imply a post-earnings move of about 4%. Expectations are already low, so either reaction can be amplified.", "url": "https://www.cmcmarkets.com/en-gb/news-and-analysis/the-week-ahead-us-ism-services-fed-minutes-pepsico-earnings", "stocks": [{"t": "PEP", "n": "10/8 早 6 點公布，EPS 預期 2.30 美元、營收約 250 億；跌破 128 美元支撐、RSI 低於 30"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "非農只增 2.9 萬", "color": "#7C6AF7", "zh": "9 月非農新增就業僅 2.9 萬人，遠低於 8.4 萬至 9 萬的預期，失業率從 4.1% 升到 4.2%。平均時薪月增只有 0.1%、年增 3.0%，低於約 3.4% 的通膨，也就是實質薪資在縮水。這份報告同時解釋了兩件事：為什麼升息機率驟降，也為什麼消費類股（Nike 等）的財測偏保守。", "en": "September payrolls rose by just 29,000 against forecasts of 84,000 to 90,000, and unemployment ticked up from 4.1% to 4.2%. Average hourly earnings rose only 0.1% on the month and 3.0% on the year, below inflation of about 3.4%, so real wages are shrinking. That explains both the sharp drop in hike odds and the cautious guidance from consumer names such as Nike.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-2-dow-sp-500-nasdaq-september-jobs-report-080623878.html", "stocks": [{"t": "XLY", "n": "非必需消費 ETF，實質薪資下滑時最先被檢驗的板塊"}, {"t": "XRT", "n": "零售類股 ETF，同樣依賴消費者實質購買力"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "10 月升息機率約 17%", "color": "#7C6AF7", "zh": "10 月升息的機率在非農後降到約 16% 至 17%（預測市場與 CME 口徑略有差異），一週前還在 36% 到將近 70% 之間，主要因為週三公布的個人消費支出物價（PCE）低於預期，加上週五的弱就業。下一個關鍵是 10 月 28 日的 FOMC；在那之前，10 月 7 日的會議紀要會顯示委員們到底有多少人支持再升息。", "en": "The odds of an October hike fell to about 16% to 17% after the jobs report (prediction markets and CME differ slightly), versus between 36% and nearly 70% a week ago, helped by Wednesday's softer PCE inflation and Friday's weak payrolls. The next real test is the Oct. 28 FOMC; before that, the Oct. 7 minutes should show how many officials back another hike.", "url": "https://www.cnbc.com/2026/10/02/fed-rate-hike-odds-decline-after-september-jobs-report.html", "stocks": [{"t": "TLT", "n": "長天期美債 ETF，升息預期降溫是它的主要支撐"}, {"t": "XLF", "n": "金融類股 ETF，一週約 -2.45%，是表現最差的兩個板塊之一"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "製造業物價分項 77.9", "color": "#7C6AF7", "zh": "ISM 製造業指數的物價分項高達 77.9，顯示投入成本壓力仍然很大；加上布蘭特原油約 102 美元，通膨的上游並沒有降溫，G7 釋出儲油只是緩衝。10 月 5 日的 ISM 服務業指數預期約 55.1 至 55.7（前值 55.4），其中的物價分項同樣會被拿來檢驗：如果服務業物價也偏高，市場對「不會再升息」的定價就會被挑戰。", "en": "The prices-paid component of the ISM manufacturing index hit 77.9, showing input-cost pressure is still heavy, and with Brent near $102 the upstream of inflation has not cooled; the G7 release is only a cushion. ISM services on Oct. 5 is expected around 55.1 to 55.7 (prior 55.4), and its price component will be scrutinised: if services prices are also hot, the 'no more hikes' pricing will be challenged.", "url": "https://www.cmcmarkets.com/en-gb/news-and-analysis/the-week-ahead-us-ism-services-fed-minutes-pepsico-earnings", "stocks": [{"t": "USO", "n": "原油 ETF，投入成本與通膨的上游變數"}, {"t": "TIP", "n": "抗通膨債券 ETF，通膨預期變動時的對照指標"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "科技與 AI 領漲", "color": "#4EABA4", "zh": "上週表現最好的板塊是科技（約 +1.44%），輝達週五漲約 2.5%、盤中創下 237.87 美元的歷史新高，市值約 5.72 兆美元，博通、超微與 Alphabet 也受惠於升息預期降溫。這是典型的「利率預期下降，成長股先反應」。要留意的是，領漲的集中在少數大型股，上漲的寬度（等權重指數相對表現）才是判斷行情是否健康的關鍵。", "en": "Technology was the best sector last week (about +1.44%); Nvidia rose roughly 2.5% on Friday to an intraday record of $237.87, a market value near $5.72 trillion, and Broadcom, AMD and Alphabet also gained as hike expectations cooled. It is the classic pattern of falling rate expectations lifting growth first. The leadership is narrow, so breadth (equal-weight versus cap-weight) is the real health check.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-2-dow-sp-500-nasdaq-september-jobs-report-080623878.html", "stocks": [{"t": "NVDA", "n": "週五約 +2.5%，盤中新高 237.87 美元，市值約 5.72 兆美元"}, {"t": "AVGO", "n": "博通，受惠升息預期降溫"}, {"t": "AMD", "n": "超微，同為週五 AI 晶片領漲股"}, {"t": "GOOGL", "n": "Alphabet，週五同步受惠"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "醫療股一週重挫", "color": "#4EABA4", "zh": "醫療類股上週下跌約 2.57%，是表現最差的板塊，成分股中的嬌生一週跌約 4.4%，週五收 256.03 美元。在科技領漲的當週，防禦型的醫療股被賣、資金轉去高成長，意味市場短期不想要防禦，而是在押「利率不會再升」。但醫療股的相對弱勢若延續到財報季，要區分是資金輪動還是藥價政策等基本面壓力。", "en": "Health care fell about 2.57% last week, the worst sector, and Johnson & Johnson dropped about 4.4% on the week to $256.03 on Friday. With tech leading, defensive health care was sold as money rotated toward growth, a bet that rates will not rise further. If the weakness persists into earnings season, the question is whether it is rotation or fundamental pressure such as drug-pricing policy.", "url": "https://morningstar.com/markets/weekly-market-update-stocks-little-changed-tech-sector-gains-while-healthcare-falls", "stocks": [{"t": "XLV", "n": "醫療類股 ETF，上週約 -2.57%，是最弱板塊"}, {"t": "JNJ", "n": "嬌生，一週約 -4.4%，週五收 256.03 美元"}, {"t": "IBB", "n": "生技 ETF，對利率與風險偏好更敏感，可與 XLV 對照"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "儲能公司砍財測", "color": "#4EABA4", "zh": "儲能系統商 Fluence Energy 在 9 月 16 日把本財年營收預期從約 30 億美元下修到約 24 億美元，調整後 EBITDA 預期從約 -1,000 萬美元惡化到約 -2 億美元，原因是休士頓代工廠爬坡延遲與美國供應鏈問題。摩根大通、加拿大皇家銀行與 BMO 都調降目標價，多家律師事務所宣布調查。AI 資料中心與電網需求帶動儲能訂單，但「訂單多不等於交得出去」。", "en": "Energy-storage maker Fluence Energy cut fiscal-year revenue guidance on Sept. 16 from about $3.0 billion to about $2.4 billion and worsened adjusted EBITDA guidance from about -$10 million to about -$200 million, citing delays ramping its Houston contract facility and U.S. supply-chain problems. JPMorgan, RBC and BMO lowered price targets and several law firms announced investigations. Demand for storage is strong, but orders are not deliveries.", "url": "https://www.benzinga.com/trading-ideas/movers/26/09/61850455/fluence-energy-shares-slide-as-analysts-lower-targets-on-guidance-cut", "stocks": [{"t": "FLNC", "n": "財測營收下修至約 24 億美元，調整後 EBITDA 約 -2 億美元"}, {"t": "TAN", "n": "太陽能 ETF，清潔能源板塊的整體參照"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000 與銀行", "color": "#5B8ED6", "zh": "羅素 2000 週五漲 0.94% 收 2,832，比標普 500 的 0.73% 多一些；區域銀行 ETF（KRE）漲 1.19% 收 70.78 美元。但整週來看，金融類股約下跌 2.45%，是最弱的兩個板塊之一。區域銀行占羅素 2000 的權重超過兩成，所以小型股今年的相對表現，很大一部分是在賭「殖利率曲線變陡、併購回溫」這個銀行故事。", "en": "The Russell 2000 rose 0.94% on Friday to 2,832, ahead of the S&P 500's 0.73%, and the regional bank ETF (KRE) gained 1.19% to $70.78. Over the week, though, financials fell about 2.45%, one of the two weakest sectors. Regional banks make up more than a fifth of the Russell 2000, so small-cap relative performance this year leans heavily on a steeper curve and a pickup in deals.", "url": "https://markets.financialcontent.com/stocks/quote?Symbol=321%3A3306043", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週五 +0.94%"}, {"t": "IJR", "n": "標普小型股 600 ETF，相對 IWM 排除未獲利公司，品質偏高"}, {"t": "KRE", "n": "區域銀行 ETF，週五 +1.19% 收 70.78 美元"}, {"t": "XLF", "n": "金融類股 ETF，一週約 -2.45%"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "判讀：小型股漲幅靠誰", "color": "#5B8ED6", "zh": "判讀提醒：過去 12 個月 IWM 約 +15.4%、KRE 約 +12.7%，兩者的差距不大，因為區域銀行占小型股指數超過兩成。這代表「買小型股」在一定程度上等於「買銀行」；如果你本來就持有區域銀行，加碼小型股指數會讓單一板塊的暴露更集中。想分散，可以對照 IJR（要求獲利）或市值加權以外的版本，看底層持股的板塊分布。", "en": "Reading note: over the past 12 months IWM returned about +15.4% and KRE about +12.7%, a small gap, because regional banks are more than a fifth of the small-cap index. Buying small caps is partly buying banks; if you already hold regional banks, adding the index concentrates the exposure further. To diversify, compare IJR (which requires profitability) or non-cap-weighted versions and check sector weights underneath.", "url": "https://markets.financialcontent.com/stocks/quote?Symbol=321%3A3306043", "stocks": [{"t": "VTWO", "n": "Vanguard 羅素 2000 ETF，與 IWM 追蹤同一指數，費用不同"}, {"t": "IJR", "n": "標普小型股 600，成分股需連續獲利，銀行與工業占比與 IWM 不同"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "微型股的流動性", "color": "#5B8ED6", "zh": "判讀提醒：DLH Holdings（DLHC）10/1 有持股逾 10% 的 Mink Brook 以約 3.70 美元買進近 20 萬股，金額約 74 萬美元，市值大約只有 5,000 萬美元出頭，且 Mink Brook 已持有約 19.9%。微型股的風險不只是公司本身，還有流動性：單一股東持股近兩成時，進出都可能造成價格明顯變動，掛單時要看成交量與買賣價差。", "en": "Reading note: a 10% holder, Mink Brook, bought nearly 200,000 DLH Holdings (DLHC) shares at about $3.70 for roughly $740,000, in a company with a market value of only about $50 million-plus, and it already owns about 19.9%. Micro-cap risk is not only the business but liquidity: when one holder has nearly a fifth, entries and exits can move the price, so check volume and the bid-ask spread.", "url": "https://www.stocktitan.net/sec-filings/DLHC/schedule-13g-a-dlh-holdings-corp-amended-passive-investment-disclosur-ef2872382699.html", "stocks": [{"t": "IWC", "n": "微型股 ETF，用來對照微型股整體的流動性與波動"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "區域銀行財報倒數", "color": "#5B8ED6", "zh": "大型銀行的財報預計在 10 月 14 日 CPI 前後那一週登場，區域銀行通常隨後；今年的看點是淨利差（放貸收益減存款成本）是否像小型銀行 LCNB 那樣擴張（LCNB 第二季淨利息收入 1,979 萬美元，去年同期 1,754 萬美元；本益比約 10.8 倍），以及長天期殖利率 5% 以上對銀行持有債券未實現損失的影響。銀行在財報前往往先反應利率，所以今天的 KRE 價格已經包含了一部分預期。", "en": "Large banks are expected to report around the Oct. 14 CPI week, with regional banks usually following; the watch points are whether net interest margins widen as at small bank LCNB (Q2 net interest income $19.79 million versus $17.54 million a year ago; P/E about 10.8) and how 5%-plus long yields affect unrealised losses on bond holdings. Banks tend to move on rates ahead of earnings, so KRE already carries some of the expectation.", "url": "https://simplywall.st/stocks/us/capital-goods/nasdaq-flnc/fluence-energy/news/undervalued-small-caps-with-insider-activity-to-explore-in-o-2/amp", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，財報前先反應利率與淨利差預期"}, {"t": "LCNB", "n": "市值約 1.8 億美元，Q2 淨利息收入 1,979 萬 vs 1,754 萬，本益比約 10.8 倍"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "判讀：Nayax 的買賣對比", "color": "#5B8ED6", "zh": "判讀提醒：Nayax（NYAX）執行長兼董事長 Nechmad 9/24 到 9/30 連續買進，累計約 195,594 股、約 880 萬美元，均價在 44 到 45 美元之間，過去一年只買沒賣。但同一時間公司其他高階主管在過去六個月賣出的筆數遠多於買進。單一創辦人買進，同時兼具控制權意義，不能直接當成「全公司內部人看多」。", "en": "Reading note: Nayax (NYAX) CEO and chairman Nechmad bought continuously from Sept. 24 to Sept. 30, about 195,594 shares or roughly $8.8 million at $44 to $45, and has sold nothing in the past year. Meanwhile other executives sold far more often than they bought over six months. A single founder buying also carries a control motive, so it should not be read as the whole insider group being bullish.", "url": "https://www.marketbeat.com/instant-alerts/insider-nayax-nasdaq-nyax-ceo-purchases-24146-shares-of-company-stock-2026-09-30/", "stocks": [{"t": "NYAX", "n": "創辦人兼執行長 9/24 至 9/30 累計買進 195,594 股，約 880 萬美元"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "策略投資人與 10% 股東加碼", "color": "#C9A227", "zh": "這家公司做什麼：Anteris 開發 DurAVR 經導管主動脈瓣膜（TAVR），2026 年 1 月獲美敦力 9,000 萬美元策略投資，連同公開發行共募得約 3.2 億美元。為什麼被忽視：它是尚未商業化的醫材公司，雙掛牌（澳洲與那斯達克），美國賣方覆蓋有限。什麼正在改變：PARADIGM 關鍵性試驗（約 1,000 人、與現有 TAVR 比較）已於 2025 年第四季開始收案，2026 年 4 月取得美國醫療保險給付資格，5 月起在美國收案；10 大股東 L1 Capital 10/1 又買進 322,940 股，約 245 萬美元。風險與反方：尚無營收，第一季現金流出 2,870 萬美元，試驗結果與融資稀釋決定成敗，另外近六個月也有 13 筆賣出紀錄。以上是研究線索，不是投資建議。", "en": "What it does: Anteris develops the DurAVR transcatheter aortic valve (TAVR) and raised about $320 million in total this year, including a $90 million strategic investment from Medtronic in January. Why ignored: it is a pre-commercial device company dual-listed in Australia and the U.S. with thin U.S. coverage. What is changing: the PARADIGM pivotal trial (about 1,000 patients versus current TAVRs) began enrolling in Q4 2025, U.S. Medicare coverage for trial procedures was secured in April and U.S. enrolment began in May; large holder L1 Capital bought another 322,940 shares (about $2.45 million) on Oct. 1. Risks: no revenue, a $28.7 million Q1 cash outflow, dependence on trial results and dilution, and 13 insider sales in six months. This is a research lead, not investment advice.", "url": "https://www.stocktitan.net/sec-filings/AVR/10-q-anteris-technologies-global-corp-quarterly-earnings-report-afac191ff80b.html", "stocks": [{"t": "AVR", "n": "DurAVR 經導管心臟瓣膜，PARADIGM 約 1,000 人試驗收案中；L1 Capital 10/1 買進約 245 萬美元"}], "status": "RADAR · 新名字 下一個驗證點 11 月 Q3 財報與 PARADIGM 入組進度"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "微型股的大股東加碼", "color": "#C9A227", "zh": "這家公司做什麼：DLH Holdings 為美國聯邦政府（國防、退伍軍人、衛生部門）提供醫療照護與公共衛生的專業服務。為什麼被忽視：市值約 5,000 萬美元、股價約 3.70 美元，且近一季財報失望，沒有人會主動追蹤。什麼正在改變：持股約 19.9% 的 Mink Brook 在 10/1 又買進近 20 萬股（約 74 萬美元），六個月內累計買進 62 筆、賣出 1 筆；調整後 EBITDA 率 7.7%、自由現金流 420 萬美元，債務降到 1.287 億美元（單季減少 400 萬美元）。風險與反方：該季每股虧損 1.16 美元、營收 4,420 萬美元遠低於預期的 5,300 萬美元，高槓桿加上聯邦合約續約不確定。以上是研究線索，不是投資建議。", "en": "What it does: DLH Holdings provides healthcare and public-health services to U.S. federal agencies, including defense, veterans and health departments. Why ignored: market value near $50 million, a price around $3.70 and a disappointing latest quarter, so few follow it. What is changing: 19.9% holder Mink Brook bought nearly 200,000 more shares (about $740,000) on Oct. 1, with 62 purchases and one sale in six months; adjusted EBITDA margin was 7.7%, free cash flow $4.2 million, and debt fell to $128.7 million, down $4 million in the quarter. Risks: the quarter showed a $1.16 per-share loss on $44.2 million of revenue versus $53 million expected, high leverage and federal contract renewals. This is a research lead, not investment advice.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+October+02,+2026", "stocks": [{"t": "DLHC", "n": "約 3.70 美元，Mink Brook 持股約 19.9%，六個月買 62 筆賣 1 筆"}], "status": "RADAR · 新名字 下一個驗證點 FY2026 年度財報（預期 12 月）"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "Allied Paving 交割完成", "color": "#C9A227", "zh": "這家公司做什麼：Cardinal Infrastructure（CDNL）是美國東南部的土方與基礎建設工程承包商。為什麼被忽視：2025 年底才上市、分析師覆蓋有限，8/11 因毛利率目標下修三天跌 42%，之後被多家律師事務所貼上調查標籤。什麼正在改變：10/1 以約 1.15 億美元（約 8,900 萬美元現金加約 100 萬股）完成 Allied Paving 收購，帶來約 1 億美元營收基礎與自有鋪路能力；第二季營收 2.269 億美元（+114%），全年營收指引上調到 8.8 至 9 億美元；8/14 創辦人與多位主管自費買進約 854 萬美元。風險與反方：仍有律所調查、分包與租賃成本壓縮毛利、收購後整合與融資壓力，且尚未穩定獲利。以上是研究線索，不是投資建議。", "en": "What it does: Cardinal Infrastructure (CDNL) is a southeastern U.S. site-development and infrastructure contractor. Why ignored: it listed only at the end of 2025, has limited coverage, and fell 42% in three days on Aug. 11 after trimming its margin target, then drew law-firm investigations. What is changing: on Oct. 1 it closed the Allied Paving acquisition for about $115 million (about $89 million cash plus roughly 1 million shares), adding about $100 million of revenue and self-perform paving; Q2 revenue was $226.9 million (+114%), full-year guidance was raised to $880 to $900 million, and on Aug. 14 the founder and other executives bought about $8.54 million with their own money. Risks: ongoing law-firm probes, margin pressure from subcontractor and rental costs, integration and financing strain, and no steady profit yet. This is a research lead, not investment advice.", "url": "https://www.tipranks.com/news/company-announcements/cardinal-infrastructure-acquires-allied-paving-to-expand-georgia", "stocks": [{"t": "CDNL", "n": "10/1 完成 Allied Paving 收購（約 1.15 億美元），全年營收指引 8.8 至 9 億美元"}], "status": "RADAR · 池內回鍋 下一個驗證點 12/2 前後 Q3 財報的 EBITDA 率"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "創辦人連買四天", "color": "#C9A227", "zh": "這家公司做什麼：Nayax 提供無人化收款平台，從自動販賣機、洗車機到電動車充電樁，賣刷卡機並收取遠端管理與交易訂閱費。為什麼被忽視：以色列公司、雙掛牌（那斯達克與特拉維夫），被歸類為支付股，實際是硬體加訂閱的混合模式。什麼正在改變：執行長兼董事長 Nechmad 9/24 買進 104,511 股（約 461 萬美元、均價 44.09），9/28 至 9/30 又陸續買進，累計 195,594 股、約 880 萬美元，過去一年沒有賣出。風險與反方：同期公司其他高階主管在六個月內賣出筆數遠多於買進，創辦人買進也兼具控制權意義，且裝機量與手續費率都影響毛利。以上是研究線索，不是投資建議。", "en": "What it does: Nayax offers an unattended-payments platform covering vending machines, car washes and EV chargers, selling card readers and charging subscription and transaction fees for remote management. Why ignored: an Israeli company dual-listed on Nasdaq and Tel Aviv, filed under payments although it is a hardware-plus-subscription mix. What is changing: CEO and chairman Nechmad bought 104,511 shares on Sept. 24 (about $4.61 million at $44.09) and kept buying through Sept. 30, a total of 195,594 shares or roughly $8.8 million, with no sales in a year. Risks: other executives sold far more often than they bought over six months, a founder's buying also carries a control motive, and hardware margin depends on installed base and fee rates. This is a research lead, not investment advice.", "url": "https://www.marketbeat.com/instant-alerts/insider-nayax-nasdaq-nyax-stock-insider-yair-nechmad-buys-22789-shares-2026-09-30/", "stocks": [{"t": "NYAX", "n": "創辦人兼執行長累計買進 195,594 股，約 880 萬美元，均價 44 至 45 美元"}], "status": "RADAR · 池內回鍋 下一個驗證點 11 月 Q3 財報的經常性訂閱營收占比"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "跌破前低後再加碼", "color": "#C9A227", "zh": "這家公司做什麼：Group 1 Automotive（GPI）是美國與英國的汽車經銷集團，賣新車、二手車，維修保養與零件才是穩定利潤來源。為什麼被忽視：經銷商被整批歸為景氣循環股，利率一升就被丟掉，沒人把售後服務單獨估值。什麼正在改變：10% 股東兼董事 Conifer 在 9/30 又買進，成交價約 242 美元，已經低於先前入池時的 52 週低點 246.21 美元；其持股約 191 萬股，約占公司 16.04%、占該基金投組 68.81%，近六個月有 98 次買進、0 次賣出。風險與反方：Conifer 是財務投資人，不是經營層，買進反映估值判斷；新車毛利若結構性下滑、利率持續上行都會壓抑獲利。以上是研究線索，不是投資建議。", "en": "What it does: Group 1 Automotive (GPI) is a U.S. and U.K. dealership group selling new and used cars, with service and parts as the stable profit source. Why ignored: dealers get lumped together as cyclicals and sold when rates rise, with nobody valuing the service business separately. What is changing: 10% holder and director Conifer bought again on Sept. 30 at about $242, below the 52-week low of $246.21 noted when it entered the pool; it holds about 1.91 million shares, around 16.04% of the company and 68.81% of its portfolio, with 98 buys and no sales in six months. Risks: Conifer is a financial investor, not management, so the buying reflects valuation; structurally lower new-car margins and rising rates could suppress earnings. This is a research lead, not investment advice.", "url": "https://www.marketbeat.com/instant-alerts/insider-group-1-automotive-nyse-gpi-stock-insider-conifer-management-llc-purchases-68648-shares-2026-09-30/", "stocks": [{"t": "GPI", "n": "約 242 美元，已低於先前 52 週低點 246.21；Conifer 持股約 16.04%"}], "status": "RADAR · 池內回鍋 下一個驗證點 10 月下旬 Q3 財報的售後服務毛利率"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "大股東在更低價再加碼", "color": "#C9A227", "zh": "這家公司做什麼：QVC Group（QVCG）是電視與直播購物平台 QVC、HSN 的母公司，2026 年完成債務重整。為什麼被忽視：重整後新股權幾乎沒有分析師覆蓋，電視購物被視為衰退產業與價值陷阱。什麼正在改變：持股逾一成的 GoldenTree 在 9/24 又買進 80,024 股、成交價 14.35 美元，總持股增至約 1,107 萬股；成交價低於 9/8 同一方買進的 16.25 美元與 8 月的約 15.2 美元。風險與反方：GoldenTree 的成本多半來自重整時債權轉股，加碼不等於市價便宜；本業營收衰退未止，企業價值約 61 億美元仍有債務；它的目標若是控制權，小股東未必分到同等溢價。以上是研究線索，不是投資建議。", "en": "What it does: QVC Group (QVCG) owns the TV and live-shopping platforms QVC and HSN and completed a debt restructuring in 2026. Why ignored: the post-restructuring equity has almost no analyst coverage and TV shopping is seen as a declining industry and a value trap. What is changing: holder GoldenTree, with more than 10%, bought another 80,024 shares on Sept. 24 at $14.35, lifting its stake to about 11.07 million shares; the price is below the $16.25 it paid on Sept. 8 and the roughly $15.2 of August. Risks: GoldenTree's cost basis largely comes from debt-for-equity conversion, so adding is not proof the market price is cheap; revenue is still declining and enterprise value of about $6.1 billion carries debt; and if its aim is control, minority holders may not share an equal premium. This is a research lead, not investment advice.", "url": "https://www.gurufocus.com/news/9108392/goldentree-asset-management-lp-adds-80024-shares-of-qvc-group-inc-qvcg", "stocks": [{"t": "QVCG", "n": "GoldenTree 9/24 以 14.35 美元加碼 80,024 股，總持股約 1,107 萬股"}], "status": "RADAR · 池內回鍋 下一個驗證點 Q3 財報的串流與直播通路銷售占比"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "同日多人買進", "color": "#6DB56D", "zh": "9/30 有兩組「同日多人」買進值得對照：Xenon Pharmaceuticals（XENE）執行長 Ian Mortimer 買進約 110 萬美元、財務長 Kelly Thomas 約 56 萬美元；Simon Property（SPG）四位董事同日買進，金額分別約 4.7 萬、9.7 萬、7.4 萬與 1.3 萬美元。判讀：兩者都是群聚，但分量不同，Xenon 是經營層的六位數至七位數買進，SPG 則是董事的小額表態，近乎儀式性。看群聚時永遠要同時看金額與角色。", "en": "Two same-day groups on Sept. 30 are worth comparing: Xenon Pharmaceuticals (XENE) CEO Ian Mortimer bought about $1.1 million and CFO Kelly Thomas about $560,000, while four Simon Property (SPG) directors bought about $47,000, $97,000, $74,000 and $13,000. Both are clusters but with different weight: Xenon is management buying in the six to seven figures, SPG is small director gestures that are nearly ceremonial. With clusters, always read amount and role together.", "url": "https://www.thedesperatetrader.com/insider-buying", "stocks": [{"t": "XENE", "n": "執行長買進約 110 萬美元、財務長約 56 萬美元；近六個月買賣比 2 買 5 賣"}, {"t": "SPG", "n": "四位董事同日買進，金額從 1.3 萬到 9.7 萬美元"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "GameStop 執行長大買", "color": "#6DB56D", "zh": "GameStop（GME）董事長兼執行長 Ryan Cohen 累計四筆買進約 260 萬股、約 5,730 萬美元；另有董事 Nat Turner 買進約 25.5 萬美元、Lawrence Cheng 買進約 103 萬美元，近六個月合計 9 次買進、4 次賣出。判讀：金額大、多人跟進，這是少見的強群聚；但 GameStop 本業與估值不是靠內部人買進決定，買進同時也兼具「控制權與訊號管理」的味道，要分開看。", "en": "GameStop (GME) chairman and CEO Ryan Cohen made four purchases totaling about 2.6 million shares, roughly $57.3 million; director Nat Turner bought about $255,000 and Lawrence Cheng about $1.03 million, and over six months there were nine buys and four sells in total. Large size and follow-through make this a rare strong cluster, but GameStop's business and valuation are not decided by insider buying, and it also carries a flavour of control and signalling, so read them separately.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+October+02,+2026", "stocks": [{"t": "GME", "n": "執行長累計約 260 萬股、約 5,730 萬美元；兩位董事同步買進"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "判讀：買進的分量", "color": "#6DB56D", "zh": "判讀提醒：同樣叫「內部人買進」，分量差很多。SPG 董事 1.3 萬美元與 GameStop 執行長 5,700 萬美元是兩個世界；而 Group 1 Automotive（GPI）的 Conifer、DLH（DLHC）的 Mink Brook 是持股逾 10% 的大股東，在 Form 4 裡也算內部人，但它們是財務投資人而不是經營層。看這類資料時要問三件事：誰買、買多少、以及買進占他自己資產的比重。", "en": "Reading note: 'insider buying' can mean very different things. A $13,000 SPG director buy and a $57 million GameStop CEO buy are different worlds, and Conifer at Group 1 Automotive (GPI) and Mink Brook at DLH (DLHC) are 10%-plus holders who count as insiders on Form 4 but are financial investors, not management. Ask three questions: who is buying, how much, and what share of their own assets it is.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+October+01,+2026", "stocks": [{"t": "SPG", "n": "董事單筆最小 1.3 萬美元，示範小額表態的尺度"}, {"t": "GPI", "n": "Conifer 是 10% 以上財務投資人，持股約 16%，近六個月 98 買 0 賣"}, {"t": "DLHC", "n": "Mink Brook 是持股約 19.9% 的大股東，不是經營層"}]},
