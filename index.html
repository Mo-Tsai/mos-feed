<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "窄到不能再窄", "color": "#E05C5C", "zh": "指數收紅不代表市場收紅。上週十一個類股裡有七個下跌，指數還是漲，是因為科技一個類股扛了全部——科技週線漲 3.6%、通訊服務漲 1.9%，同一時間公用事業跌 4.3%、能源跌 3.8%。最能說明結構的是這組對照：等權重標普 500 週線跌 1.1%，市值加權的標普 500 漲 1.2%。兩個數字之間的 2.3 個百分點，就是這輪行情集中在少數幾檔大型股的程度。", "en": "A green index is not a green market. Seven of 11 sectors fell last week and the index still rose, because technology carried it alone: tech +3.6% and communication services +1.9%, against utilities -4.3% and energy -3.8%. The cleanest illustration of the structure is this pair: the equal-weight S&P 500 fell 1.1% on the week while the cap-weighted S&P 500 rose 1.2%. That 2.3-point gap is a direct measure of how concentrated this rally has become.", "url": "https://lanceroberts.substack.com/p/bull-bear-report-week-of-september-729", "stocks": [{"t": "RSP", "n": "等權重標普 500；週線 -1.1%，與市值加權差 2.3 個百分點"}, {"t": "XLK", "n": "科技類股 ETF；週線 +3.6%，是唯一撐住指數的力量"}, {"t": "XLU", "n": "公用事業 ETF；週線 -4.3%，對利率最敏感的一群"}]},
    {"id": "earn_0", "channel": "財報速報", "tag": "會員還撐得住", "color": "#E8786A", "zh": "好市多（Costco）上週四盤後公布本會計年度第四季，營收 957.2 億美元、優於市場預期的 948.8 億，每股盈餘 6.75 美元也高於預期的 6.53 美元。財務長 Gary Millerchip 說會員「非常有韌性」，只要看得到價值仍願意花在非必需品上。但同一場電話會議裡也有一句話值得記下來：這一季非食品類的通膨上升，主因是消費電子的記憶體成本、汽油與石化相關品項。記憶體漲價已經從晶片股的好消息，變成零售商的成本。", "en": "Costco reported fiscal Q4 after Thursday's close with revenue of $95.72 billion against estimates of $94.88 billion and EPS of $6.75 versus $6.53 expected. CFO Gary Millerchip described members as \"very resilient,\" still willing to spend on discretionary items where they see value. One line from the call is worth keeping: non-food inflation rose in the quarter, driven mainly by memory costs in consumer electronics, plus gas and petroleum-based items. Memory pricing has crossed over from a chip-stock tailwind into a retailer's cost line.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-september-25-dow-sp-500-nasdaq-081738529.html", "stocks": [{"t": "COST", "n": "FQ4 營收 957.2 億、EPS 6.75 美元，雙雙優於預期"}, {"t": "BBY", "n": "消費電子零售商；記憶體成本推升的非食品通膨直接打在它的毛利上"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "被推遲的轉機", "color": "#E8786A", "zh": "美銀上週五把耐吉（Nike）降評到「表現落後」，目標價下修到 30 美元，而當天股價在 36 美元附近、今年以來已經跌 43%，回到 2014 年的水位。美銀團隊的理由不是單季數字，是時間表：北美的批發賣出（sell-through）還沒有驗證較強的鋪貨、通路庫存偏高，中國減少電商合作夥伴的鋪貨、歐洲同時面對總經與競爭壓力，所以把營收轉機推遲到 2028 會計年度。耐吉本週四公布財報，這份降評等於先把門檻標在那裡。", "en": "Bank of America downgraded Nike to Underperform on Friday and cut its target to $30, with the stock near $36 — down 43% year to date and back at 2014 levels. The call is about timing rather than one quarter: North American wholesale sell-through has yet to validate stronger sell-in, channel inventory is elevated, China ecom partner distribution has been reduced against weaker sportswear trends, and Europe faces both macro and competitive pressure, so BofA pushed the sales turnaround out to fiscal 2028. Nike reports Thursday, and this downgrade sets the bar beforehand.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-september-25-dow-sp-500-nasdaq-081738529.html", "stocks": [{"t": "NKE", "n": "遭美銀降至表現落後、目標價 30 美元；年初至今 -43%，本週四公布財報"}, {"t": "DECK", "n": "旗下 HOKA 是北美跑鞋通路上瓜分耐吉份額的一方"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "最重的一張考卷", "color": "#E8786A", "zh": "本週最關鍵的財報是美光（Micron），時間在週三盤後。市場對這一季的預估是營收 508 億美元、年增將近 350%，公司自己給的非一般公認會計原則每股盈餘指引是 30 至 32 美元、毛利率 86%——這是一個已經被定價成「短缺會延續」的數字。八月 DRAM 與 NAND 現貨價續創新高，DRAM 現貨自一月以來漲 52%，2026 年的高頻寬記憶體產能已全數售罄、HBM4 正在為輝達的 Vera Rubin 平台出貨。風險在另一頭：預期這麼高，只要管理層對 HBM 定價或需求持續性的用詞放軟一點，就算數字超標也可能出現「利多出盡」。", "en": "The most consequential report this week is Micron, Wednesday after the close. Consensus looks for revenue of about $50.8 billion, up nearly 350% year over year, against company guidance of $30-32 non-GAAP EPS and an 86% gross margin — numbers that already price in a continuing shortage. DRAM and NAND spot prices set records again in August, with DRAM spot up 52% since January; 2026 HBM supply is fully booked and HBM4 is shipping for NVIDIA's Vera Rubin platform. The risk sits on the other side: with expectations this high, any softening in management's language on HBM pricing or demand durability could trigger a sell-the-news reaction even on a beat.", "url": "https://www.investing.com/news/stock-market-news/micron-earnings-outlook-what-to-watch-ahead-of-the-september-30-report-93CH-4911385", "stocks": [{"t": "MU", "n": "週三盤後財報；市場估營收 508 億、年增近 350%，毛利率指引 86%"}, {"t": "WDC", "n": "同屬儲存供應鏈；NAND 價格與資料中心 SSD 需求跟著美光的說法走"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "升息後第一份", "color": "#7C6AF7", "zh": "聯準會九月已經升息，本週三公布的八月個人消費支出（PCE）物價指數，是升息之後第一份重量級的通膨讀數。PCE 是聯準會偏好的指標，這次要回答的問題很直接：它是驗證了聯準會「通膨仍然頑固」的擔憂，還是給了決策者對下一次升息更有耐心的理由。個人所得與支出同日公布，是需求端的對照組——若所得撐住、支出不退，通膨黏性的說法就更難反駁。", "en": "The Fed already raised rates in September, and Wednesday's August PCE price index is the first heavyweight inflation print since. PCE is the Fed's preferred gauge, and the question is direct: does it validate the Fed's concern that inflation remains stubborn, or does it give policymakers room to be more patient about the next hike? Personal income and spending land the same morning as the demand-side check — if income holds and spending does not retreat, the sticky-inflation case gets harder to argue against.", "url": "https://letterstoayounginvestor.substack.com/p/weekly-economic-calendar-september-fe2", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF；PCE 讀數直接改變損益兩平通膨率的定價"}, {"t": "SHY", "n": "1-3 年期美債 ETF；短天期最貼近下一次升息與否的預期"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "週五最重", "color": "#7C6AF7", "zh": "本週真正的壓軸是週五的九月就業報告，失業率市場預期持平在 4.1%。前面三天是暖身：週二的職缺與勞動力流動調查（JOLTS）看「低雇用、低解雇」這個格局有沒有鬆動，週三的 ADP 民間就業給一個不完美的先行值，週四的初領失業金看雇主是不是還捨不得裁人。八月的就業報告偏強，聯準會九月才敢升息；若九月再交出一份穩健的數字，緊縮的理由就更充分，反過來若失業率上升、工時下滑或前值被下修，這個論述會立刻鬆動。", "en": "The real main event is Friday's September employment report, with the unemployment rate expected to hold at 4.1%. The three days before it are warm-ups: Tuesday's JOLTS tests whether the \"low hire, low fire\" regime is cracking, Wednesday's ADP gives an imperfect early read, and Thursday's initial claims show whether employers are still reluctant to fire. August's stronger report is part of why the Fed felt able to hike in September; another solid print strengthens the tightening case, while rising unemployment, falling hours or downward revisions would undercut it immediately.", "url": "https://letterstoayounginvestor.substack.com/p/weekly-economic-calendar-september-fe2", "stocks": [{"t": "RHI", "n": "人力派遣與專業招募商；就業市場鬆動時最早反映在它的營收"}, {"t": "MAN", "n": "全球人力資源服務商；「低雇用、低解雇」正是它最難賺錢的環境"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "好消息變壞消息", "color": "#7C6AF7", "zh": "上週三的標普全球快報採購經理人指數（PMI）把市場的邏輯整個翻過來：綜合指數升到 58.4，是 2021 年 7 月以來最高，服務業 58.7、製造業 57.0，新訂單與就業都強。放在「會不會衰退」的問題上這是好消息；放在「經濟有沒有降溫到足以壓下通膨」的問題上，這是升息的理由。同一週密西根大學九月消費者信心終值只有 48.1，年減 13%，一年期通膨預期從 4.0% 跳到 4.6%。企業在擴張、消費者在哀號，這兩件事同時為真，正是這個階段最難處理的地方。", "en": "Wednesday's S&P Global flash PMI inverted the market's logic: the composite rose to 58.4, the highest since July 2021, with services at 58.7 and manufacturing at 57.0, and both new orders and employment strong. Against the question \"are we heading into recession?\" that is good news; against the question \"is the economy cooling enough to bring inflation down?\" it is an argument for another hike. The same week, the University of Michigan's final September sentiment reading came in at 48.1, down 13% year over year, with one-year inflation expectations jumping from 4.0% to 4.6%. Businesses expanding while consumers feel terrible — both true at once, and that is what makes this stage hard.", "url": "https://letterstoayounginvestor.substack.com/p/weekly-economic-calendar-september-fe2", "stocks": [{"t": "GLD", "n": "黃金 ETF；一年期通膨預期跳到 4.6% 是它的直接題材"}, {"t": "UUP", "n": "美元指數 ETF；升息預期與強勁 PMI 同向推升美元"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "AI 錢流外溢", "color": "#4EABA4", "zh": "9 月 24 日 Akamai 宣布與 Anthropic 簽下七年、115.6 億美元的雲端服務承諾，是這家成立 28 年的公司史上最大一筆合約，股價當日大漲約 20%。合約還留了擴張條款，最多可再加 90 億美元、總額逼近 200 億；Akamai 同時發給 Anthropic 一份認股權證，最多可換得其 5% 流通股，初始承諾下預計約 2% 會生效。代價是資本支出：對應這 115.6 億美元的建置成本估計約 55 億，2026 年開始蓋、營收要到 2027 下半年才進來。AI 的資本流已經流出超大規模雲端業者，開始重塑內容傳遞網路這種「舊」基礎建設的估值。", "en": "On September 24, Akamai announced a seven-year, $11.6 billion cloud services commitment from Anthropic — the largest contract in the company's 28-year history — and the stock jumped about 20%. The deal can expand by a further $9 billion toward roughly $20 billion, and Akamai issued Anthropic a warrant for up to 5% of its outstanding stock, with about 2% expected to vest under the initial commitment. The cost is capex: roughly $5.5 billion tied to the $11.6 billion commitment, with the buildout starting in 2026 and revenue only arriving in the second half of 2027. AI capital has moved past the hyperscalers and is now repricing \"old\" infrastructure like content delivery networks.", "url": "https://www.akamai.com/newsroom/press-release/akamai-announces-11-6-billion-multi-year-agreement-with-anthropic-to-support-growing-demand", "stocks": [{"t": "AKAM", "n": "合約主角；115.6 億美元七年承諾，公司史上最大，消息日大漲約 20%"}, {"t": "VRT", "n": "資料中心電力與散熱供應商；這類建置案是它的訂單來源"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "利率的受害者", "color": "#4EABA4", "zh": "上週被打得最重的兩個族群是公用事業（-4.3%）與不動產，理由只有一個：它們對利率最敏感。當十年期美債殖利率站上 5.18%、三十年期回到 2004 年的水位，這些靠穩定現金流與高配息吸引資金的資產，折現率與機會成本同時變差。這件事有對稱性值得記著——正因為它們是被殖利率壓下去的，一旦殖利率出現像樣的回落，資金最快回頭的也會是這兩個族群。", "en": "The two hardest-hit groups last week were utilities (-4.3%) and real estate, for one reason: they are the most rate-sensitive parts of the market. With the 10-year Treasury yield above 5.18% and the 30-year back at 2004 levels, assets that attract capital through stable cash flow and high payouts get hit on both the discount rate and the opportunity cost. The symmetry is worth remembering — precisely because yields pushed them down, these are also the groups money would rotate back into fastest on any meaningful pullback in yields.", "url": "https://lanceroberts.substack.com/p/bull-bear-report-week-of-september-729", "stocks": [{"t": "XLU", "n": "公用事業 ETF；上週跌 4.3%，全類股最弱"}, {"t": "VNQ", "n": "不動產投資信託 ETF；與公用事業同屬上週最受壓的一群"}, {"t": "AMT", "n": "電塔 REIT；長天期租約＋高負債，對三十年期殖利率特別敏感"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "化工的另一端", "color": "#4EABA4", "zh": "能源價格劇烈波動的同時，基礎化工走的是反方向。Olin 九月下旬股價觸及 52 週低點 16.35 美元，距離 52 週高點 30.46 美元跌掉 45%。第二季調整後每股虧損 0.12 美元、營收 17.4 億，市場原本預期是獲利 0.12 美元、營收 18.1 億；氯鹼與乙烯基部門營收因價格與量雙減而少了 3.276 億美元，環氧樹脂部門則靠量價齊揚多了 1.148 億。富國銀行把評等降到中性，RBC 與 Truist 的目標價下修到 20 美元。原料成本高、終端需求弱，是工業循環股現在最典型的夾殺。", "en": "While energy prices whipsawed, commodity chemicals went the other way. Olin touched a 52-week low of $16.35 in late September, 45% below its 52-week high of $30.46. Q2 adjusted EPS came in at a loss of $0.12 on revenue of $1.74 billion, against consensus for a $0.12 profit on $1.81 billion; Chlor Alkali Products and Vinyls sales fell $327.6 million on lower pricing and volumes, while Epoxy rose $114.8 million on higher volumes and pricing. Wells Fargo cut the stock to Equal Weight and RBC and Truist trimmed targets to $20. High input costs and weak end demand is the classic squeeze on industrial cyclicals right now.", "url": "https://www.investing.com/news/company-news/olin-stock-hits-52week-low-at-1635-usd-93CH-4916021", "stocks": [{"t": "OLN", "n": "9 月下旬觸及 52 週低點 16.35 美元，較高點 -45%；Q2 由盈轉虧"}, {"t": "DOW", "n": "同屬基礎化工；乙烯與衍生品價格壓力與 Olin 同源"}, {"t": "WLK", "n": "氯乙烯與建材化工；氯鹼價格走弱的另一個直接對照"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "唯一說得通的", "color": "#5B8ED6", "zh": "上週最容易解釋的一條線，是羅素 2000。標普 500 漲 1.2%、那斯達克漲 2.1%、道瓊漲 0.3%，小型股指數卻跌 0.8%。原因不是故事，是算術：規模小的公司沒有能力吸收更高的借款成本，而十年期殖利率剛剛收在 2007 年 7 月以來最高。當指數層面的漲跌開始由「誰付得起利息」決定，市值就不只是一個分類標籤，而是一個現金流變數。", "en": "The easiest line to explain last week was the Russell 2000. The S&P 500 rose 1.2%, the Nasdaq 2.1% and the Dow 0.3%, while the small-cap index fell 0.8%. The reason is arithmetic rather than narrative: smaller companies have less ability to absorb higher borrowing costs, and the 10-year yield just closed at its highest since July 2007. When index-level returns start being decided by who can afford the interest, market cap stops being a label and becomes a cash-flow variable.", "url": "https://letterstoayounginvestor.substack.com/p/weekly-economic-calendar-september-fe2", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF；上週 -0.8%，四大指數唯一收黑"}, {"t": "VTWO", "n": "另一檔追蹤羅素 2000 的低費用 ETF，可對照追蹤誤差"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "浮動利率的算術", "color": "#5B8ED6", "zh": "小型股在升息環境裡吃虧，有一個可以量化的原因。高盛的統計是：羅素 2000 成分股裡約 32% 持有浮動利率負債，標普 500 只有約 6%；另有機構用債務金額計算，得出小型股約四成負債是浮動利率、大型股不到一成。差別在於，浮動利率負債的利息會隨基準利率即時重設，不需要等到再融資。更緊的是到期牆——2026 年約有 3,680 億美元的小型股債務到期，而現在的再融資利率接近 6.5%，換掉的是當年 1% 到 2% 的舊約。", "en": "There is a quantifiable reason small caps suffer in a hiking cycle. Goldman Sachs puts roughly 32% of Russell 2000 companies as holding floating-rate debt against about 6% of S&P 500 companies; other estimates measured by debt value put small caps near 40% floating versus under 10% for large caps. The distinction matters because floating-rate interest resets with the benchmark immediately, without waiting for refinancing. Tighter still is the maturity wall: roughly $368 billion of small-cap debt matures in 2026, and refinancing now costs near 6.5%, replacing paper originally struck at 1-2%.", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment", "stocks": [{"t": "BKLN", "n": "優先擔保浮動利率貸款 ETF；最直接反映浮動利率負債定價的工具"}, {"t": "HYG", "n": "高收益公司債 ETF；小型股再融資成本的信用面對照"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "一筆賣單的重量", "color": "#5B8ED6", "zh": "小型股最容易被忽略的風險不是基本面，是籌碼。上週四到週五的申報裡，單筆最大的交易是 Aspen Aerogels 的 10% 持股人 Wood River Capital 出售 1,228 萬股、金額約 5,810 萬美元——這筆金額放在大型股裡不起眼，放在一檔小型股身上就是一道明確的供給壓力。這類「大股東退出」與經營團隊賣股不同：它未必代表對基本面的判斷，但它確實會在一段時間內壓住股價，而且通常不只一次。看小型股要把持股結構當成基本面的一部分。", "en": "The most overlooked risk in small caps is not fundamentals but the share register. In Thursday-to-Friday filings, the single largest transaction was 10% owner Wood River Capital selling 12.28 million shares of Aspen Aerogels for roughly $58.1 million — unremarkable in a megacap, but a clear supply overhang for a small cap. This kind of large-holder exit differs from management selling: it does not necessarily express a view on fundamentals, but it does cap the stock for a stretch, and it rarely happens only once. For small caps, treat the ownership structure as part of the fundamentals.", "url": "https://www.everhint.com/insider-trading-hints-signals-september-25-2026-midday-update-last-24-hours-pacific-time/", "stocks": [{"t": "ASPN", "n": "10% 持股人賣出 1,228 萬股、約 5,810 萬美元，為當期單筆最大交易"}, {"t": "SHLS", "n": "同屬小市值潔淨能源供應鏈；大股東籌碼結構是同類型的風險來源"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "低點名單怎麼用", "color": "#5B8ED6", "zh": "9 月 18 日當天，美加兩地有 83 檔股票同時觸及 52 週低點；以小型股而言，名單上市值最大的是 Olin，其後是 Applied Aerospace & Defense 與 Centuri Holdings。這種名單的正確用法是篩選的起點，不是買進清單——同樣在低點，有的是循環觸底、有的是結構性衰退，價格本身分不出來。可以拿來分辨的是三件事：現金流是否仍為正、負債結構有沒有在 2027 年前的到期牆上、以及最近一季的營收是否只是「跌得比較慢」而不是「止跌」。", "en": "On September 18, 83 US- and Canada-listed stocks hit 52-week lows at once; among small caps, the largest by market value was Olin, followed by Applied Aerospace & Defense and Centuri Holdings. The right use of a list like this is as a screening starting point, not a buy list — at the same low, some names are cyclical troughs and others are structural decline, and price alone cannot tell them apart. Three things can: whether cash flow is still positive, whether the debt schedule sits on the pre-2027 maturity wall, and whether the latest quarter shows revenue actually stabilizing rather than merely falling more slowly.", "url": "https://www.trefis.com/stock/spy/articles/615975/the-52-week-low-list-83-names-on-friday/2026-09-21", "stocks": [{"t": "IJR", "n": "標普小型股 600 ETF；成分股的獲利門檻比羅素 2000 嚴，可作品質對照"}, {"t": "OLN", "n": "52 週低點名單上市值最大的小型股，是這類名單的典型樣本"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "兩個相反的數字", "color": "#5B8ED6", "zh": "同一個星期，小型股同時出現兩種說法：一種說羅素 2000 到 9 月 21 日為止今年漲 15.9%、贏過標普 500 的 13.4%，獲利改善加上多年落後、還有輪動空間；另一種說它已經吐光年初的漲幅，浮動利率負債與殖利率飆升正在打垮它。兩邊都不算說謊，差別在量尺——前者比的是年初至今的累積報酬，後者講的是最近幾週的動能與信用結構。看小型股統計數字，先問三件事：算的是哪一段時間、用的是哪一個指數（羅素 2000 與標普小型股 600 的獲利門檻不同）、以及是市值加權還是等權重。", "en": "In the same week, small caps came with two opposite descriptions: one has the Russell 2000 up 15.9% year to date through September 21, ahead of the S&P 500's 13.4%, with improving earnings and years of underperformance leaving room to rotate; the other has it giving back its yearly gains as floating-rate debt and the yield spike batter it. Neither is lying — they use different rulers. The first measures cumulative year-to-date return, the second recent momentum and credit structure. Before trusting any small-cap statistic, ask three things: what window, which index (the Russell 2000 and the S&P SmallCap 600 apply different profitability screens), and cap-weighted or equal-weighted.", "url": "https://investorplace.com/hypergrowthinvesting/2026/09/the-small-cap-comeback-may-be-earlier-than-it-looks/", "stocks": [{"t": "IWO", "n": "羅素 2000 成長股 ETF；與價值股分開看才知道漲跌來自哪一邊"}, {"t": "IWN", "n": "羅素 2000 價值股 ETF；利率敏感的金融與不動產權重較高"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "自己人加碼", "color": "#C9A227", "zh": "Goosehead Insurance（GSHD）用加盟制經營個人與商用產物保險經紀，截至 6 月 30 日有 898 家加盟店在營運。它被忽視的方式不是沒人看，而是被放棄：股價今年以來跌超過 40%，光是九月下旬那一週就跌了 18%。正在改變的是持股結構——Durable Capital Partners（同時是 10% 股東與董事）在 9 月 22 日以每股 47.32 美元買進 15 萬股、金額約 710 萬美元，買完持有 272 萬股，而當時市價約 43.65 美元，也就是這筆買進一成交就是帳面虧損；同期營收仍維持約 18% 成長。反方論點要寫清楚：10% 大股東的買進可能出於部位管理而非資訊優勢，加盟店的留存率與新開店速度才是這個商業模式的真正變數，而保險經紀的成長在費率循環轉向時會失速。這是研究線索，不是投資建議。", "en": "Goosehead Insurance (GSHD) runs personal and commercial property-and-casualty insurance brokerage through a franchise model, with 898 operating franchises as of June 30. It is neglected less by absence of coverage than by abandonment: the stock is down over 40% year to date, including an 18% drop in a single late-September week. What is changing is the register — Durable Capital Partners, both a 10% owner and a director, bought 150,000 shares at $47.32 on September 22 for about $7.1 million, taking its stake to 2,720,260 shares, while the market price sat near $43.65, meaning the purchase was underwater on execution; revenue growth is still running near 18%. The counterargument matters: a 10% holder's purchase can be position management rather than information, franchise retention and new-store pace are the real variables in this model, and brokerage growth stalls when the rate cycle turns. This is a research lead, not investment advice.", "url": "https://www.investing.com/news/insider-trading-news/durable-capital-partners-buys-71m-in-goosehead-insurance-shares-93CH-4916301", "status": "RADAR · 下一個驗證點 10 月下旬 Q3 財報（加盟店淨增家數與留存率）", "stocks": [{"t": "GSHD", "n": "10% 股東兼董事 9/22 以 47.32 美元買進 15 萬股；股價年初至今 -40%"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "分拆後的孤兒", "color": "#C9A227", "zh": "Centuri Holdings（CTRI）替天然氣與電力公用事業做管線與電網的工程施作，2025 年 9 月 Southwest Gas 出清最後 2,736 萬股後完全獨立。它符合「雙重忽視」的兩個條件：分拆後沒有母公司背書、覆蓋分析師稀少，而且在九月初就已經出現在小型股 52 週低點名單上。正在改變的是訂單：2026 年第一季營收年增 31%、毛利年增 76%、單季新接單 13 億美元，在手訂單來到歷史新高的 65 億美元、年增 44%，其中約 85% 綁在長期主服務合約（MSA）底下；管理層提出的「Vision One Centuri」計畫，目標是 2029 年前營收年複合成長 10% 至 15%、毛利率 8.7% 至 9.7%。反方論點：負債偏高，在 5% 以上的利率環境裡利息費用會吃掉毛利改善；在手訂單不等於營收，MSA 只是框架、實際動工量由公用事業的資本支出節奏決定。這是研究線索，不是投資建議。", "en": "Centuri Holdings (CTRI) performs pipeline and grid construction for gas and electric utilities, and became fully independent in September 2025 when Southwest Gas sold its final 27,362,210 shares. It meets both neglect tests: no parent sponsorship after the separation, thin analyst coverage, and a place on the small-cap 52-week-low list in early September. What is changing is the order book: Q1 2026 revenue rose 31% year over year, gross profit 76%, with $1.3 billion of quarterly bookings taking backlog to a record $6.5 billion, up 44%, roughly 85% of it under long-term master service agreements; management's \"Vision One Centuri\" plan targets a 10-15% revenue CAGR and an 8.7-9.7% gross margin by 2029. The counterargument: leverage is high, and at 5%-plus rates interest expense can eat the margin improvement; backlog is not revenue, and an MSA is a framework whose actual work volume is set by utility capex pacing. This is a research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/capital-goods/nyse-ctri/centuri-holdings/news/evaluating-centuri-holdings-ctri-after-q1-2026-earnings-beat", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（在手訂單轉換為營收的速度＋利息費用）", "stocks": [{"t": "CTRI", "n": "在手訂單 65 億美元創高、年增 44%；2025/09 自 Southwest Gas 完全分拆"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "三天的壓力測試", "color": "#C9A227", "zh": "Select Water Solutions（WTTR）處理油田產出水的回收、處理與再利用，並在二疊紀盆地自建水利管網。它入池的論點是「從週期股變基建股」——若長約型的水利基礎建設部門營收占比持續上升，它的評價就不該再跟著油價走。上週剛好給了這個論點一次免費的壓力測試：布蘭特原油四天內從 108 美元跌到 98 美元以下，若 WTTR 的股價跟著油價同幅擺動，就代表市場還沒買單「基建化」這件事。反方論點：長約可以綁住量，綁不住頁岩業者的資本支出決心；油價若在低檔停留一季以上，鑽井數下滑最終還是會傳導到產出水的量。這是研究線索，不是投資建議。", "en": "Select Water Solutions (WTTR) handles the recycling, treatment and reuse of oilfield produced water and is building its own water pipeline network in the Permian. The thesis behind its place in the pool is a shift from cyclical to infrastructure — if the long-contract water infrastructure segment keeps rising as a share of revenue, its valuation should stop tracking crude. Last week handed that thesis a free stress test: Brent fell from $108 to below $98 in four days, and if WTTR's shares swung with it, the market has not yet bought the infrastructure reframing. The counterargument: long contracts lock in volume but not shale operators' capex resolve, and if oil stays low for a quarter or more, falling rig counts eventually feed through to produced-water volumes. This is a research lead, not investment advice.", "url": "https://stockanalysis.com/stocks/wttr/", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（水利基建部門營收占比與長約收入占比）", "stocks": [{"t": "WTTR", "n": "油田產出水處理與水利管網；上週油價四天回落 10 美元是它的即時壓力測試"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "航道要開了", "color": "#C9A227", "zh": "Teekay Tankers（TNK）是蘇伊士型與阿芙拉型原油輪的船東，以現貨運價賣航次，是少數把景氣直接寫在日費上的公司。上週五出現一個對它方向明確的消息：美伊傳出在談「分階段協議」，可能重新開放荷姆茲海峽，油價因此單日大跌。這對油輪股是兩面刃——海峽關閉期間的繞道航程拉長了噸海里需求、把運價撐在高檔，重新開放等於這個溢價開始消退；但同時中東出口量回升又會增加航次。真正要看的不是新聞，是新簽合約的日費水準：若新約日費明顯低於在手合約，代表市場已經在定價「溢價結束」。這是研究線索，不是投資建議。", "en": "Teekay Tankers (TNK) owns Suezmax and Aframax crude tankers and sells voyages at spot rates, making it one of the few companies whose cycle is written directly into its day rates. Friday brought a directionally clear headline: reports of a US-Iran \"phased deal\" that could reopen the Strait of Hormuz, which knocked oil sharply lower on the day. For tanker owners this cuts both ways — the closure lengthened voyages and lifted ton-mile demand, holding rates high, so reopening means that premium starts to fade, even as recovering Middle East export volumes add voyages. What to watch is not the headline but the day rates on newly signed contracts: if new fixtures print clearly below the existing book, the market is already pricing the premium's end. This is a research lead, not investment advice.", "url": "https://simplywall.st/article/what-happens-to-energy-stocks-as-the-fix-gets-built", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報（新簽合約日費 vs 在手合約日費）", "stocks": [{"t": "TNK", "n": "蘇伊士／阿芙拉型油輪船東；荷姆茲海峽若重啟，運價溢價將直接消退"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "非優級的考驗", "color": "#C9A227", "zh": "OppFi（OPFI）是替非優級（non-prime）消費者做小額放款的金融科技業者，市值小、覆蓋少，論點建立在「信用模型能在升息週期裡守住損失率」。上週的兩個數字讓這個論點提前被檢驗：密西根大學消費者信心終值 48.1、年減 13%，一年期通膨預期從 4.0% 跳到 4.6%，而三十年期房貸利率來到 7.49%。對非優級客群而言，升息同時抬高放款業者的資金成本與借款人的違約機率，是雙向擠壓。另一條線是併購：收購 BNC National Bank 若能如期在 2026 年第四季交割並取得監管核准，資金成本結構會整個改寫。反方論點：非優級放款在景氣轉折時的損失率上升往往落後兩到三季，現在的數字不能代表明年。這是研究線索，不是投資建議。", "en": "OppFi (OPFI) lends small amounts to non-prime consumers as a small, thinly covered fintech, and its thesis rests on the credit model holding loss rates through a hiking cycle. Two numbers last week tested that early: final University of Michigan sentiment at 48.1, down 13% year over year, with one-year inflation expectations jumping from 4.0% to 4.6%, and the 30-year mortgage rate at 7.49%. For a non-prime book, higher rates squeeze from both sides at once, raising the lender's cost of funds and the borrower's probability of default. The other thread is M&A: if the BNC National Bank acquisition closes in Q4 2026 with regulatory approval, the funding-cost structure is rewritten. The counterargument: non-prime loss rates typically lag a turn in the cycle by two to three quarters, so today's numbers say little about next year. This is a research lead, not investment advice.", "url": "https://stockanalysis.com/stocks/opfi/", "status": "RADAR · 下一個驗證點 BNC National Bank 併購 2026 Q4 交割＋Q3 財報信用損失率", "stocks": [{"t": "OPFI", "n": "非優級消費信貸；升息同時抬高它的資金成本與客戶違約率"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "峰會沒解決", "color": "#C9A227", "zh": "United States Antimony（UAMY）在美國本土開採與冶煉銻——彈藥底火、阻燃劑與半導體用得到的關鍵金屬，過去長年是無人聞問的微型礦業股。它的論點高度綁在一個日期：中國對美的銻等關鍵金屬出口禁令暫停，到 11 月 27 日到期。上週五川習峰會結束，結果是「維持現狀數個月」，加上十一月在深圳另開一場 AI 安全峰會，並沒有處理關鍵礦物出口管制——對 UAMY 而言，這等於把不確定性原封不動留到 11/27。反方論點要誠實：這是事件驅動、不是營運改善，微型礦業股的產能爬坡常常慢於承諾，而政策若在最後一刻延長暫停，論點會在一天之內消失。這是研究線索，不是投資建議。", "en": "United States Antimony (UAMY) mines and smelts antimony domestically — a critical metal used in ammunition primers, flame retardants and semiconductors — and has long been an ignored micro-cap miner. Its thesis is tightly bound to one date: China's suspension of its antimony and critical-metals export ban on the US expires on November 27. Friday's Trump-Xi summit ended with the trade relationship held at status quo for several months plus a separate AI safety summit in Shenzhen in November, and did not address critical-minerals export controls — which for UAMY leaves the uncertainty sitting untouched until November 27. The counterargument should be stated plainly: this is event-driven rather than operational improvement, micro-cap miners routinely ramp slower than promised, and a last-minute extension of the suspension would erase the thesis in a day. This is a research lead, not investment advice.", "url": "https://finance.yahoo.com/markets/article/us-china-summit-ends-with-little-progress-on-trade-and-ai--other-than-2-new-deadlines-174257772.html", "status": "RADAR · 下一個驗證點 11/27 中國關鍵金屬出口禁令暫停到期", "stocks": [{"t": "UAMY", "n": "美國本土銻礦與冶煉；川習峰會未處理關鍵礦物管制，11/27 期限照舊"}]},
    {"id": "insider_0", "channel": "內部人動向", "tag": "科技高層在賣", "color": "#6DB56D", "zh": "上週四到週五的 24 小時內部人申報，呈現一個很難忽略的形狀：賣出 44 筆、金額約 1.485 億美元，買進只有 18 筆、約 1,280 萬美元，金額比約 11.6 比 1。而且賣方集中在科技業的最高層——CoreWeave 執行長 Intrator 賣出 2,670 萬美元、財務長 Agrawal 同日賣出 484 萬；Robinhood 執行長 Tenev 賣出 3,010 萬；Workday 共同創辦人兼 10% 股東 Duffield 賣出 1,910 萬。這不是一兩個人的流動性需求，是同一個產業六家公司在同一個 24 小時內的一致動作。", "en": "Insider filings over the 24 hours to Friday formed a shape hard to ignore: 44 sales worth roughly $148.5 million against just 18 purchases worth about $12.8 million, a ratio near 11.6 to 1 by dollar value. The sellers cluster at the very top of tech — CoreWeave CEO Intrator sold $26.7 million and CFO Agrawal $4.84 million the same day; Robinhood CEO Tenev sold $30.1 million; Workday co-founder and 10% owner Duffield sold $19.1 million. This is not one or two people managing liquidity; it is six companies in one industry moving the same way inside a single 24-hour window.", "url": "https://www.everhint.com/insider-trading-hints-signals-september-25-2026-midday-update-last-24-hours-pacific-time/", "stocks": [{"t": "CRWV", "n": "執行長與財務長同日賣出，合計約 3,150 萬美元"}, {"t": "HOOD", "n": "執行長 Tenev 單筆賣出 3,010 萬美元，當期最大個人交易之一"}, {"t": "WDAY", "n": "共同創辦人兼 10% 股東 Duffield 賣出 1,910 萬美元"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "賣有很多理由", "color": "#6DB56D", "zh": "看到上面那組數字，要先把判讀規則擺回來，不然很容易誤讀。第一，賣出有很多理由——稅務、分散、行使選擇權、事先設定的 10b5-1 預定交易計畫；買進基本上只有一個理由。第二，看的是群聚而不是單筆：Snowflake 同一個申報窗口裡董事賣 1,695 萬、營收長賣 25.4 萬，兩個人同時動，比一個人賣兩倍金額更有訊息量。第三，鎖定期解禁與新上市公司的早期賣壓，在統計上會長期讓科技業看起來「內部人都在賣」，要先把這一層扣掉再談判斷。", "en": "Before reading anything into those numbers, put the interpretation rules back in place. First, selling has many reasons — taxes, diversification, option exercises, pre-arranged 10b5-1 plans — while buying has essentially one. Second, look at clusters rather than single trades: at Snowflake in the same filing window a director sold $16.95 million and the CRO $253,953, and two people moving together carries more information than one person selling twice as much. Third, lockup expirations and early post-IPO supply structurally make tech look like \"insiders are always selling,\" and that layer has to be stripped out before drawing any conclusion.", "url": "https://www.everhint.com/insider-trading-hints-signals-september-25-2026-midday-update-last-24-hours-pacific-time/", "stocks": [{"t": "SNOW", "n": "董事與營收長同窗口賣出，是「群聚賣出」的教科書樣本"}, {"t": "CRWD", "n": "執行長 Kurtz 賣出約 506 萬美元；單筆規模不大但屬同一波"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "買方那一側", "color": "#6DB56D", "zh": "賣壓之中，買方只有幾筆值得看，而且共同點是「同一家公司有兩個人一起動」。Dick's Sporting Goods 出現財務長 Navdeep Gupta 買進 100 萬美元、董事 Larry Fitzgerald Jr. 買進 24.49 萬美元的同日群聚買進；Howard Hughes Holdings 則有內部人 Andrew Davis 在 9 月 23 日買進 1,000 股，買完持有 32,530 股，而該公司 9 月 30 日要開股東會、由執行董事長 Bill Ackman 與投資長 Ryan Israel 說明策略。金額都不大，但群聚買進在歷史上比單筆大額買進更能預測，因為它代表的是共識而不是個人處境。", "en": "Amid the selling, only a few purchases are worth reading, and they share one feature: two people at the same company moving together. At Dick's Sporting Goods, CFO Navdeep Gupta bought $1 million and director Larry Fitzgerald Jr. $244,906 on the same day. At Howard Hughes Holdings, insider Andrew Davis bought 1,000 shares on September 23, taking his holding to 32,530, ahead of a September 30 shareholder meeting at which Executive Chairman Bill Ackman and CIO Ryan Israel will lay out strategy. The dollar amounts are small, but cluster buying has historically been more predictive than a single large purchase, because it reflects shared conviction rather than one person's circumstances.", "url": "https://www.gurufocus.com/news/9096620/howard-hughes-holdings-hhh-insider-andrew-davis-buys-1000-shares", "stocks": [{"t": "DKS", "n": "財務長與董事同日買進，合計約 124 萬美元，為當期少見的群聚買進"}, {"t": "HHH", "n": "內部人 9/23 買進 1,000 股；9/30 股東會由 Ackman 說明策略"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "同一個名字", "color": "#B5654D", "zh": "這一期最值得看的不是單筆大額交易，是重複出現的名字。攤開眾議院書記官近 90 天的申報彙整，Accenture（ACN）同時出現在多位議員申報清單的前四大標的裡——Gilbert Cisneros（CA31，139 筆申報）、Julie Johnson（TX32，73 筆）、Dan Newhouse（WA04，19 筆）、Kelly Morrison（MN03，8 筆）與 Scott Franklin（FL18，6 筆）都有；而 CapitolExposed 對 9 月 21 日當週申報給出的最高衝突分數，正是 Scott Franklin 的一筆 ACN 買進（30%）。底下那個 thesis 不難看出來：這些錢押的是「政府與企業的 IT 顧問與系統整合支出不會被 AI 砍掉，反而會因為導入需求增加」。ACN 本週四公布財報，這個假設會被直接檢驗。", "en": "The thing worth reading in this batch is not a single large trade but a name that keeps recurring. Across the House Clerk's 90-day filing aggregation, Accenture (ACN) appears among the top four holdings for several members at once — Gilbert Cisneros (CA31, 139 filings), Julie Johnson (TX32, 73), Dan Newhouse (WA04, 19), Kelly Morrison (MN03, 8) and Scott Franklin (FL18, 6). CapitolExposed's highest conflict score for the week to September 21 was also an ACN purchase by Scott Franklin, at 30%. The underlying thesis is not hard to read: this money is positioned for government and enterprise IT consulting and systems-integration spending to survive AI rather than be cut by it, with implementation demand rising. ACN reports Thursday, which tests the assumption directly.", "url": "https://www.capitolexposed.com/news/weekly-roundup-2026-w39", "stocks": [{"t": "ACN", "n": "多位議員申報清單前四大重複出現；本週四公布財報"}, {"t": "MSFT", "n": "當期最大單筆是 Gottheimer 8/14 的 MSFT 賣出，申報區間上限 100 萬美元"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "四件事先知道", "color": "#B5654D", "zh": "這個頻道的資料來源是 STOCK Act 的定期交易報告（PTR），跟內部人動向的 Form 4 是兩套東西，讀法也不一樣。9 月 21 日當週共有 9 位議員申報 39 筆交易（19 筆買進、15 筆賣出、5 筆交換或部分賣出），其中 25 筆是配偶、受扶養子女或聯名帳戶執行的——也就是說，超過六成根本不是議員本人下的單。另外三件事：申報期限是 45 天、資料庫中位數落差接近四週，所以你看到的價位早就不是他買的價位；金額只有寬區間沒有數字，「100 萬美元」是他勾選的級距上限而非成交金額；申報是成批到達的，一個「冷清的星期」是申報節奏，不是市場安靜。", "en": "This channel's source is the STOCK Act Periodic Transaction Report, a different instrument from the Form 4 used in the insider channel, and it reads differently. In the week to September 21, nine members filed 39 transactions (19 purchases, 15 sales, 5 exchanges or partial sales), of which 25 were executed for a spouse, dependent child or joint account — meaning more than six in ten were not placed by the member. Three more things: the filing deadline is 45 days and the database's median gap is closer to four weeks, so the price you see is not the price they paid; amounts come only as wide bands, so \"$1.0 million\" is the top of the box checked, not the trade size; and filings arrive in bursts, so a quiet week is a filing pattern, not a quiet market.", "url": "https://www.capitolexposed.com/news/weekly-roundup-2026-w39", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報標的的 ETF；可用來看「跟單」實際績效"}, {"t": "GOP", "n": "追蹤共和黨籍議員申報標的的 ETF；與 NANC 對照才看得出風格差異"}]},
    {"id": "week_0", "channel": "本週事件", "tag": "四天四個數字", "color": "#C97DD4", "zh": "這一週的總經行事曆密度罕見，而且每一天都在測試同一個命題：聯準會九月升息的前提站不站得住。週二是八月職缺與勞動力流動調查（JOLTS）加上九月諮商會消費者信心；週三是 ADP 民間就業、八月 PCE 物價指數與個人所得支出；週四是初領失業金加上供應管理協會（ISM）製造業指數——上週標普全球快報 PMI 意外強勁，這次要看 ISM 是印證還是打臉；週五是九月就業報告。往後看，10 月 5 日是 ISM 服務業、10 月 7 日公布九月會議紀要，下一次利率決策會議在 10 月 27 至 28 日。", "en": "This week's macro calendar is unusually dense, and each day tests the same proposition: whether the premise behind the Fed's September hike holds. Tuesday brings August JOLTS and the September Conference Board consumer confidence index; Wednesday brings ADP private payrolls, the August PCE price index and personal income and spending; Thursday brings initial claims plus the ISM manufacturing index, which either confirms or contradicts last week's surprisingly strong S&P Global flash PMI; Friday brings the September employment report. Looking further out, ISM services lands October 5, the September meeting minutes October 7, and the next rate decision falls on October 27-28.", "url": "https://letterstoayounginvestor.substack.com/p/weekly-economic-calendar-september-fe2", "stocks": [{"t": "SHY", "n": "1-3 年期美債 ETF；四份數據會直接改寫 10/27-28 會議的定價"}, {"t": "XLF", "n": "金融類股 ETF；就業與通膨數據同時決定利差與信用成本"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "四家公司", "color": "#C97DD4", "zh": "財報進入十月才會密集，這一週只有四家值得排進行事曆，但每一家測的東西都不同。週二是嘉年華郵輪（Carnival），看的是在汽油近 4.5 美元、消費者信心 48.1 的環境下，旅遊這種可選消費還剩多少韌性。週三盤後是美光，本週最重的一張考卷。週四同一天有埃森哲（Accenture）與耐吉：前者驗證企業 IT 顧問支出在 AI 時代是被砍還是被加，後者則是在美銀降評、目標價 30 美元的壓力下交卷。四家分別對應消費、半導體、企業支出與品牌零售，等於一次掃過四個不同的需求端。", "en": "Earnings only get dense in October, and just four companies belong on this week's calendar — but each tests something different. Tuesday is Carnival, a read on how much resilience discretionary travel retains with gas near $4.50 and consumer sentiment at 48.1. Wednesday after the close is Micron, the heaviest report of the week. Thursday brings Accenture and Nike on the same day: the first tests whether enterprise IT consulting spend is being cut or expanded in the AI era, the second reports under the pressure of a fresh BofA downgrade and a $30 target. Consumer, semiconductors, enterprise spending and branded retail — four different demand ends in one week.", "url": "https://www.kiplinger.com/investing/stocks/17494/next-week-earnings-calendar-stocks", "stocks": [{"t": "CCL", "n": "週二財報；高油價與低消費者信心下的可選消費風向球"}, {"t": "MU", "n": "週三盤後；本週最關鍵的單一事件"}, {"t": "ACN", "n": "週四財報；企業 IT 顧問支出在 AI 時代的檢驗"}, {"t": "NKE", "n": "週四財報；美銀剛降評至表現落後、目標價 30 美元"}]},

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/28/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v12.5</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
