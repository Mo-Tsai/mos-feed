/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;
    --text-tertiary: #6b6863; --divider: #ddd9d1;
    --noise-opacity: 0.035;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  /* 鍵盤焦點:看得到目前在哪一顆 */
  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }

  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }
  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }
  .source-link { position: relative; display: inline-block; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }

  .az-input { width:100%; background:var(--bg); border:1px solid var(--divider); color:var(--text); padding:9px 10px; font-family:'Courier New',monospace; font-size:12px; outline:none; -webkit-appearance:none; appearance:none; border-radius:0; }

  .nav-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; gap:4px; padding:8px 12px 12px; background:var(--bg); border-top:1px solid var(--divider); z-index:50; }
  .nav-btn { background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:16px; cursor:pointer; padding:10px 18px; min-height:44px; min-width:40px; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; line-height:1; }
  .nav-btn-icon { padding:10px 14px; font-size:14px; }

  .nav-btn-lang { padding:10px 11px; font-size:12px; letter-spacing:0.06em; color:var(--text-secondary); min-width:40px; }

  .nav-btn:hover { border-color:var(--text-secondary); color:var(--text); }
  .nav-btn:active { background:var(--bg-elevated); }
  .nav-btn:disabled { opacity:0.3; cursor:default; border-color:var(--divider); color:var(--text-tertiary); }
  .nav-count { font-family:'Courier New',monospace; font-size:11px; letter-spacing:0.1em; color:var(--text-tertiary); text-transform:uppercase; white-space:nowrap; }

</style>

    {"id": "earn_1", "channel": "財報速報", "tag": "週二盤前：GE 航太、RTX、通用汽車、諾斯洛普", "color": "#E8786A", "zh": "美東週二（10/20）盤前（台北週二晚間）最密集：GE 航太（共識 EPS 2.02 美元）、RTX（1.78）、通用汽車（3.52）、3M（2.41）、諾斯洛普（7.22），另有 Halliburton、Synchrony 與 KeyCorp。航太與國防看訂單和供應鏈，通用汽車值得留意油價走高對成本與需求的影響，Halliburton 則是油價上漲能否帶動油服支出的直接線索。以上共識是日曆網站整理的預估值，不是公司指引。", "en": "Tuesday Oct. 20 before the open (Tuesday evening in Taipei) is the densest slot: GE Aerospace (consensus EPS $2.02), RTX ($1.78), GM ($3.52), 3M ($2.41) and Northrop Grumman ($7.22), plus Halliburton, Synchrony and KeyCorp. Aerospace and defence readers watch orders and supply chains, GM is worth watching for how higher oil affects cost and demand, and Halliburton is a direct clue on whether pricier oil lifts service spending. Consensus figures come from an earnings calendar, not company guidance.", "url": "https://www.stocktitan.net/articles/earnings-calendar-week-of-october-19-2026", "stocks": [{"t": "GE", "n": "GE 航太，共識 EPS 2.02 美元"}, {"t": "RTX", "n": "RTX，共識 EPS 1.78 美元"}, {"t": "GM", "n": "通用汽車，共識 EPS 3.52 美元"}, {"t": "NOC", "n": "諾斯洛普，共識 EPS 7.22 美元"}, {"t": "HAL", "n": "Halliburton，油服，共識 EPS 0.58 美元"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "週二盤後：Netflix、Intuitive Surgical、Capital One、聯合航空、Chubb", "color": "#E8786A", "zh": "週二盤後有五家不同產業的公司：Netflix（共識 EPS 0.82 美元，電話會議 4:45 p.m. ET）、手術機器人 Intuitive Surgical（2.13）、信用卡銀行 Capital One（5.45）、聯合航空（2.60）與產險 Chubb（6.53）。這一組剛好涵蓋訂閱消費、醫院資本支出、信用品質、油價與旅遊需求、保險定價，一晚可以看到五種不同的景氣面向。", "en": "Tuesday after the close brings five very different companies: Netflix (consensus EPS $0.82, call at 4:45 p.m. ET), surgical-robot maker Intuitive Surgical ($2.13), card lender Capital One ($5.45), United Airlines ($2.60) and insurer Chubb ($6.53). Together they cover subscription spending, hospital capex, credit quality, fuel and travel demand and insurance pricing, five different economic angles in one evening.", "url": "https://www.stocktitan.net/articles/earnings-calendar-week-of-october-19-2026", "stocks": [{"t": "NFLX", "n": "Netflix，共識 EPS 0.82 美元"}, {"t": "ISRG", "n": "Intuitive Surgical，共識 EPS 2.13 美元"}, {"t": "COF", "n": "Capital One，信用卡與消費信貸，共識 EPS 5.45 美元"}, {"t": "UAL", "n": "聯合航空，共識 EPS 2.60 美元，油價敏感"}, {"t": "CB", "n": "Chubb，共識 EPS 6.53 美元"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "9 月 CPI 3.7%，Fed 9/16 已升息", "color": "#7C6AF7", "zh": "9 月 CPI 年增 3.7%（預期 3.6%），核心 2.6%（預期 2.5%），汽油單月上漲 9.1%，貢獻超過一半的漲幅。聯準會 9/16 把利率升到 3.75% 至 4.00%，是 2023 年以來第一次升息。CPI 公布後，10 月再升息的機率從約 22% 升到約 44% 至 50%（各來源不同），市場對 12 月再升的預期更高。", "en": "September CPI rose 3.7% from a year earlier (3.6% expected) and core inflation was 2.6% (2.5% expected), with gasoline up 9.1% on the month and accounting for more than half of the rise. The Fed lifted its range to 3.75% to 4.00% on Sept. 16, its first increase since 2023. After the report, odds of another hike this month rose from about 22% to roughly 44% to 50% depending on the source, and a December increase is expected with even more conviction.", "url": "https://tradingeconomics.com/united-states/government-bond-yield/news/591950", "stocks": [{"t": "SHY", "n": "短天期公債 ETF，最直接反映升息預期"}, {"t": "XLF", "n": "金融類股 ETF，受利率路徑與淨利差影響"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "十年期殖利率約 5.2% 至 5.3%", "color": "#7C6AF7", "zh": "十年期公債殖利率 10/7 曾觸及 5.35%，是 24 年來高點，CPI 後在 5.2% 至 5.3% 之間震盪（各來源數字略有不同）。週一報導標題提到殖利率回落，但我們沒查到具體數字。殖利率高，代表成長股和高估值股的折現壓力大，這是近期科技股回檔常被提到的背景，但這是相關性，不是證明因果。", "en": "The 10-year Treasury yield hit 5.35% on Oct. 7, a 24-year high, and has hovered between 5.2% and 5.3% since the CPI report (sources differ slightly). A Monday headline mentioned lower yields but no figure was found. High yields raise the discount rate on growth and richly valued stocks, a backdrop often cited for the recent tech pullback, though that is correlation, not proof of cause.", "url": "https://www.tmgm.com/de/analysis/market-news/article/us-treasury-yields-hit-24-year-highs-as-10-year-tests-535-202610071450", "stocks": [{"t": "TLT", "n": "20 年以上公債 ETF，殖利率上升時價格承壓"}, {"t": "IEF", "n": "7 至 10 年公債 ETF，對應十年期殖利率"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "本週 Fed 靜默期，Williams：今年再升一次可能就夠", "color": "#7C6AF7", "zh": "聯準會 10/27 至 10/28 開會，本週涵蓋在會前靜默期內，官員預期不會用談話帶動市場。紐約聯準銀行總裁 Williams 10/13 表示，今年再升息一次可能就夠，目前不預期 2027 年再加息。這個說法與市場對 12 月升息的定價並不衝突，但也說明央行內部對升息幅度的看法並不一致。", "en": "The Fed meets Oct. 27 to 28 and this week falls inside its pre-meeting quiet period, so officials are not expected to move markets with speeches. New York Fed President John Williams said on Oct. 13 that one more hike this year may be enough and he does not expect more in 2027. That fits a December hike being priced in, but also shows views inside the Fed on how far to go are not uniform.", "url": "https://www.roic.ai/news/investors-pile-into-long-term-treasuries-ahead-of-cpi-and-fed-decision-10-13-2026", "stocks": [{"t": "BIL", "n": "1 至 3 個月國庫券 ETF，政策利率的最直接參照"}, {"t": "IEF", "n": "7 至 10 年公債 ETF，反映中長期利率預期"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "能源：油價再衝，油氣股年初至今約 +37%（10/1）", "color": "#4EABA4", "zh": "週一油價上漲逾 2%，能源股是這一波最直接的受惠者；一份 10/1 的盤勢整理列出能源類股年初至今約上漲 37%，那是 10/1 的數字，不是週一的。這也使能源股成為近期少數沒被科技賣壓拖累的板塊。要留意的反向風險：油價推升通膨，會讓聯準會更難降息，反過來壓抑其他板塊。", "en": "Oil rose more than 2% on Monday, making energy the most direct beneficiary; a market recap from Oct. 1 lists the sector up roughly 37% year to date, a figure from Oct. 1 rather than Monday. That has left energy as one of the few sectors not dragged down by the tech selloff. The reverse risk is that pricier oil feeds inflation, makes rate cuts harder for the Fed and so weighs on other sectors.", "url": "https://tapeboard.com/blog/market-pulse-2026-10-01", "stocks": [{"t": "XLE", "n": "能源類股 ETF，10/1 整理列年初至今約 +37%"}, {"t": "VLO", "n": "Valero，煉油，10/22 盤前財報共識 EPS 21.23 美元"}, {"t": "HAL", "n": "Halliburton，油服，10/20 盤前財報"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "半導體 vs 軟體：夏季起的輪動還在延續", "color": "#4EABA4", "zh": "Danske Bank 在 8 月初指出，夏季股市指數大致持平，但板塊輪動很劇烈：能源受惠於油價，軟體明顯強於半導體。到了 10 月中，IG 的分析師也提到非科技股走強，顯示資金在往科技以外移動。上週晶片 ETF 下跌 11.8%，與這條輪動主線一致，但晶片賣壓是否見底還要看本週財報。", "en": "Danske Bank noted in early August that indexes were roughly flat over the summer while sector rotation was sharp: energy was supported by oil and software clearly outperformed semiconductors. By mid-October an IG analyst also pointed to strength outside tech, suggesting money is moving beyond the sector. Last week's 11.8% drop in the semiconductor ETF fits that rotation theme, but whether the selling has bottomed depends on this week's earnings.", "url": "https://www.fxstreet.com/news/equities-sector-rotations-shape-summer-performance-danske-bank-202608030711", "stocks": [{"t": "IGV", "n": "軟體類股 ETF，夏季起相對半導體走強的代表"}, {"t": "SMH", "n": "半導體 ETF，上週賣壓的觀察指標"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "產險：費率仍在上調，W.R. Berkley 綜合比率 90.8%", "color": "#4EABA4", "zh": "W.R. Berkley 第三季除工傷險外平均費率上調約 4.0%，綜合比率 90.8%（扣除災損前 88.1%），淨投資收入 3.835 億美元。意思是承保本身仍有利潤，高利率環境又讓投資收益增加。週二盤後的 Chubb 會是第二個檢查點，看產險費率上調的動能是否擴散到其他公司。", "en": "W.R. Berkley's third-quarter rates rose about 4.0% excluding workers' comp, with a 90.8% combined ratio (88.1% before catastrophe losses) and net investment income of $383.5 million. Underwriting is still profitable and high interest rates add investment income. Chubb on Tuesday after the close is the second checkpoint on whether rate momentum is spreading across property-casualty insurers.", "url": "https://www.sec.gov/Archives/edgar/data/0000011544/000001154426000046/wrb93020268-kex991.htm", "stocks": [{"t": "WRB", "n": "W.R. Berkley，費率上調約 4.0%，綜合比率 90.8%"}, {"t": "CB", "n": "Chubb，10/20 盤後財報，共識 EPS 6.53 美元"}, {"t": "KIE", "n": "保險類股 ETF，用來看產業整體走勢"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000：上週五 2,721.37，週跌 3.0%", "color": "#5B8ED6", "zh": "羅素 2000 上週五收 2,721.37（-1.7%），整週下跌 3.0%，年初至今約 +9.6%，落後於道瓊但差距在縮小。週一的小型股表現我們只查到一份早盤讀數（約 -1.66%），沒有收盤數字，所以不下結論。小型股對利率最敏感，殖利率在 5.2% 以上時，它的反彈通常需要長天期利率先降溫。", "en": "The Russell 2000 closed Friday at 2,721.37 (-1.7%), lost 3.0% for the week and is up about 9.6% year to date. For Monday only an early reading (about -1.66%) turned up with no close, so no conclusion is drawn. Small caps are the most rate-sensitive group, and with the 10-year yield above 5.2% a lasting rebound usually needs long-dated rates to cool first.", "url": "https://www.lanacion.com.ar/usa/how-major-us-stock-indexes-fared-friday-10162026-nid16102026/", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，上週五 -1.7%"}, {"t": "IJR", "n": "標普小型 600 ETF，品質篩選較嚴的小型股對照"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "區域銀行財報週：Zions、Western Alliance、KeyCorp 等", "color": "#5B8ED6", "zh": "週一有 Fifth Third、Zions、Western Alliance、Wintrust、BOK Financial 與 FNB 報告，週二盤前輪到 KeyCorp、Ally 與 Synchrony，盤後有 East West Bancorp。區域銀行是羅素 2000 的重要成分，它們的存放款利差、信用損失與商辦不動產曝險，會影響整個小型股指數。本週這一批財報，是判斷銀行股能否撐住小型股的第一手資料。", "en": "Monday brought Fifth Third, Zions, Western Alliance, Wintrust, BOK Financial and FNB, Tuesday morning has KeyCorp, Ally and Synchrony, and East West Bancorp follows after the close. Regional banks are a big part of the Russell 2000, so their net interest margins, credit losses and commercial real estate exposure move the whole small-cap index. This week's batch is the first hard evidence on whether banks can hold small caps up.", "url": "https://www.stocktitan.net/articles/earnings-calendar-week-of-october-19-2026", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，小型股指數的重要驅動"}, {"t": "ZION", "n": "Zions，週一財報"}, {"t": "WAL", "n": "Western Alliance，週一財報"}, {"t": "KEY", "n": "KeyCorp，10/20 盤前財報，共識 EPS 0.46 美元"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "判讀：為什麼利率與銀行股決定小型股的方向", "color": "#5B8ED6", "zh": "羅素 2000 的成分裡，金融股（尤其是區域銀行）占比高，而且許多公司靠浮動利率借款，所以利率往上，同時壓低估值與獲利。看小型股的新聞時，要先分清是指數漲跌還是少數個股：指數被銀行股與利率左右，個股才有自己的故事。這一頁的判讀並非預測，只是提醒不要把羅素 2000 的漲跌直接當成小型股公司的基本面。", "en": "Financials, especially regional banks, are a large share of the Russell 2000, and many members borrow at floating rates, so higher rates hit both valuations and earnings. When reading small-cap news, separate index moves from single-stock stories: the index is driven by banks and rates, while individual companies have their own narratives. This is a reading aid, not a forecast; do not treat Russell 2000 moves as company fundamentals.", "url": "https://www.marketbeat.com/articles/regional-banking-sector-near-a-critical-inflection-point/", "stocks": [{"t": "VB", "n": "小型股 ETF，成分比 IWM 更廣"}, {"t": "XLF", "n": "金融類股 ETF，與小型股共享銀行股曝險"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "Bank of Marin（BMRC）：估值折價，10/26 預計開 Q3 電話會議", "color": "#C9A227", "zh": "Bank of Marin 是加州北灣（Marin County）的社區銀行，這次再上卡的理由是它出現在 10 月「低估值加內部人買進」的篩選名單上；Simply Wall St 的模型估算股價比合理價低約 34.9%（這是模型估計，不是事實）。依我們先前的紀錄，10/26 召開第三季電話會議，是下一個驗證點。風險：社區銀行集中在單一區域，商辦不動產與存款成本是主要問題，而且這份名單沒有交代買進人與金額。這是研究線索，不是投資建議。", "en": "Bank of Marin is a community bank in Marin County in the northern Bay Area. It is back on the radar because it appears on an October screen of undervalued small caps with insider buying; Simply Wall St's model puts the shares about 34.9% below fair value, which is a model estimate rather than a fact. By our earlier notes the Q3 call is on Oct. 26, the next checkpoint. Risks: a single-region lender exposed to commercial real estate and deposit costs, and the screen does not say who bought or how much. This is a research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/diversified-financials/nyse-rm/regional-management/news/october-2026s-best-undervalued-small-caps-with-insider-buyin", "stocks": [{"t": "BMRC", "n": "Bank of Marin，北加州社區銀行，模型估算折價約 34.9%"}, {"t": "KRE", "n": "區域銀行 ETF，同族群的對照"}], "status": "RADAR · 下一個驗證點 10/26 Q3 電話會議（依先前紀錄）"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "Regional Management（RM）：本益比 6.8 倍，公司回購 500 萬美元", "color": "#C9A227", "zh": "Regional Management 做的是小額分期放款給信用較弱的消費者。Simply Wall St 的資料顯示市值約 2.2 億美元、本益比 6.8 倍、模型估算折價約 28%，公司近期還以 500 萬美元買回 136,325 股，全年稀釋每股盈餘成長指引為 10% 至 13%。要注意回購是公司買，不是內部人買。風險：它完全靠對外借款融資，沒有存款當緩衝，信用循環轉弱時壓力會放大。這是研究線索，不是投資建議。", "en": "Regional Management makes small installment loans to lower-credit consumers. Simply Wall St lists a market cap of about $0.22 billion, a 6.8x P/E, a model-estimated discount of about 28%, a recent $5 million buyback of 136,325 shares and full-year diluted EPS growth guidance of 10% to 13%. Note the buyback is the company's, not an insider's. Risk: it funds itself entirely with outside borrowing and has no deposit cushion, which magnifies stress if the credit cycle turns. This is a research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/diversified-financials/nyse-rm/regional-management/news/october-2026s-best-undervalued-small-caps-with-insider-buyin", "stocks": [{"t": "RM", "n": "Regional Management，小額消費貸款，本益比約 6.8 倍"}], "status": "RADAR · 下一個驗證點 Q3 財報（日期待確認）"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "Enovis（ENOV）：股價銷售比 0.5 倍，模型折價約 41.6%", "color": "#C9A227", "zh": "Enovis 是骨科與復健器材公司。Simply Wall St 的篩選顯示它的股價銷售比約 0.5 倍、模型估算折價約 41.6%，本益比欄位是 NA，通常表示帳面沒有正的獲利。這個折價是模型估計，不是共識目標價。把它放進雷達是因為它屬於醫療器材這個不是這幾天焦點的產業，但目前我們沒有查到近期新的催化事件。風險：帳面未獲利、需要看下一次財報驗證改善。這是研究線索，不是投資建議。", "en": "Enovis makes orthopaedic and rehabilitation devices. Simply Wall St's screen shows a price-to-sales ratio of about 0.5 and a model-estimated discount of about 41.6%, with P/E listed as NA, which usually means no positive earnings on the books. The discount is a model estimate, not a consensus target. It is on the radar as a medical-device name outside this week's headlines, but no new catalyst was found. Risk: no reported profit, so the next earnings report must show improvement. This is a research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/diversified-financials/nyse-rm/regional-management/news/october-2026s-best-undervalued-small-caps-with-insider-buyin", "stocks": [{"t": "ENOV", "n": "Enovis，骨科與復健器材，P/S 約 0.5 倍"}], "status": "RADAR · 下一個驗證點 下次財報（日期待確認）"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "社區銀行董事小額買進：BayCom、Oak Valley", "color": "#6DB56D", "zh": "能查證的近期案例多是社區銀行董事的小額買進：BayCom（BCML）董事 Michael Perdue 在 7/31 以每股 30.17 美元買進約 5,000 股，金額約 15.1 萬美元，另一位董事 Robert Laverne 在 8/20 買進約 3 萬美元；Oak Valley Bancorp（OVLY）董事 Gary Strong 在 7/27 以每股 32.50 美元買進 2,000 股。這些是 7、8 月的申報，不是最新一週的案例，金額也很小。小額買進可以當作董事願意拿自己的錢放進公司，但不能直接解讀為股價即將上漲。", "en": "The verifiable recent cases are small director purchases at community banks: BayCom (BCML) director Michael Perdue bought about 5,000 shares at $30.17 on July 31, roughly $151,000, and fellow director Robert Laverne bought about $30,000 on Aug. 20; Oak Valley Bancorp (OVLY) director Gary Strong bought 2,000 shares at $32.50 on July 27. These are July and August filings, not last week's, and the amounts are small. A small purchase shows directors putting their own money in, but it does not mean the shares are about to rise.", "url": "https://arkolith.com/filing/0001437749-26-025356", "stocks": [{"t": "BCML", "n": "BayCom，董事 7/31 買進約 5,000 股"}, {"t": "OVLY", "n": "Oak Valley Bancorp，董事 7/27 買進 2,000 股"}]},
