<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

  {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "加拿大反擊", "color": "#E05C5C", "stocks": [{"t": "CP", "n": "加拿大太平洋堪薩斯城，唯一貫穿美加墨的跨境鐵路"}, {"t": "MGA", "n": "Magna，加拿大最大汽車零件商，關稅風險直接曝險"}, {"t": "DE", "n": "迪爾，農機出口是報復清單的典型目標品項"}], "en": "Canada answered Washington's new tariffs with its own: retaliatory duties of 15% to 50% on roughly $20 billion of American goods, effective September 8. The detail that matters is what both sides left out. Oil was excluded from both countries' tariff lists despite being by far the largest single item in the trade relationship. That exclusion tells you where the real pain threshold sits, and it is why the equity market treated the escalation as noise rather than a shock.", "zh": "加拿大對美方的新關稅做出反擊，宣布對約 200 億美元的美國商品課徵 15% 至 50% 的報復性關稅，9 月 8 日生效。真正值得注意的是雙方都「沒有列進去」的東西：石油在兩國的清單上都被排除，而石油正是美加貿易中金額最大的單一品項。這個豁免等於畫出了雙方真正的痛點界線，也解釋了為什麼股市把這次升溫當成雜訊而不是衝擊。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-tuesday-august-25-dow-sp-500-nasdaq-080527092.html"},
  {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "殖利率退潮", "color": "#E05C5C", "stocks": [{"t": "TLT", "n": "20年期以上公債ETF，10 年期殖利率降 6 個基點至 4.63%"}, {"t": "GLD", "n": "黃金ETF，金價漲 22.20 美元、0.47% 至 4,716.70 美元"}, {"t": "USO", "n": "原油ETF，西德州原油跌 1.19 美元、1.44% 至 81.17 美元"}], "en": "The bond market did the quiet work on Tuesday. The 10-year Treasury yield fell six basis points to 4.63% and the 30-year eased to 5.17%, taking pressure off equity valuations. Gold rose 0.47% to $4,716.70 while WTI crude slid 1.44% to $81.17, extending the retreat that began when the Iran sanctions package landed. Falling yields plus falling oil is the combination equities like best, and it explains a green tape on a day with hostile trade headlines.", "zh": "週二真正在幕後出力的是債市。10 年期美國公債殖利率降了 6 個基點到 4.63%，30 年期也降到 5.17%，等於替股票的評價鬆綁。同時黃金漲 0.47% 至 4,716.70 美元，西德州原油則跌 1.44% 到 81.17 美元，延續伊朗制裁方案公布後的回落。殖利率跌加上油價跌，是股市最喜歡的組合，也解釋了為什麼在貿易利空的日子裡盤面還能收紅。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-tuesday-august-25-dow-sp-500-nasdaq-080527092.html"},
  {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "七連黑中止", "color": "#E05C5C", "stocks": [{"t": "NVDA", "n": "輝達漲約 2%，中止連續七個交易日的跌勢"}, {"t": "SOXX", "n": "半導體ETF，本月費城半導體指數已漲逾 10%"}, {"t": "MU", "n": "美光，記憶體是這波晶片反彈中彈性最大的一環"}], "en": "Nvidia rose about 2% on Tuesday, snapping a seven-session losing streak just hours before it reports. That is a positioning move, not an information move: nothing new about the business was disclosed, traders simply stopped selling into the print. Worth keeping in mind when the number lands tonight, a stock that fell seven days straight and then bounced into the event has a different reaction function than one that rallied into it.", "zh": "輝達週二漲約 2%，中止了連續七個交易日的跌勢，而且就發生在財報前幾個小時。這是部位的移動，不是資訊的移動：公司沒有揭露任何新消息，只是交易者停止在財報前繼續賣。今晚數字出來時值得記住這一點，一檔連跌七天才反彈進入事件的股票，跟一檔一路漲進事件的股票，對同一份財報的反應函數是不一樣的。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-25-2026"},
  {"id": "earn_0", "channel": "財報速報", "tag": "今晚壓軸", "color": "#E8786A", "stocks": [{"t": "NVDA", "n": "今晚盤後，共識營收 920.7 億、EPS 2.09 美元"}, {"t": "SNPS", "n": "新思科技，同晚財報，EDA 需求的對照組"}, {"t": "AVGO", "n": "博通，自研加速器路線的最大受惠者，會被拿來對照"}], "en": "Nvidia reports after the close tonight. Consensus is $92.07B of revenue and adjusted EPS of $2.09 against $1.05 a year ago, versus company guidance issued in May of $91B plus or minus 2%. Almost all the growth is expected from data centre, so the call turns on the Blackwell ramp and next-quarter guidance rather than the headline beat. Synopsys reports the same evening, which gives a second read on the same demand chain within an hour.", "zh": "輝達今晚盤後公布財報，市場共識是營收 920.7 億美元、調整後每股獲利 2.09 美元，去年同期只有 1.05 美元；公司五月自己給的指引是 910 億美元上下 2%。成長幾乎全部來自資料中心，所以法說會的勝負點在 Blackwell 平台的放量進度與下一季指引，而不是表面上有沒有超預期。新思科技同一晚登場，等於在一小時內就能對同一條需求鏈取得第二個讀數。", "url": "https://seekingalpha.com/article/4939733-nvidia-earnings-preview-q2-2027"},
  {"id": "earn_1", "channel": "財報速報", "tag": "三成蒸發", "color": "#E8786A", "stocks": [{"t": "DKS", "n": "迪克體育用品，週二暴跌約 30%，2023 年以來最慘單日"}, {"t": "NKE", "n": "耐吉，同日跌約 3%，被視為運動鞋通路降價的源頭之一"}, {"t": "LULU", "n": "露露檸檬，同日跌約 4%，運動服飾促銷壓力的連坐股"}], "en": "Dick's Sporting Goods fell about 30% on Tuesday, its worst day since 2023. Q2 net sales were $5.59B with adjusted EPS of $3.53 against $3.78 expected, but the damage came from guidance: full-year adjusted EPS was cut to $11.00-$12.00 versus a $14.20 consensus. The cause is the Foot Locker acquisition, whose pro forma comps fell 3.6% on heavy exposure to legacy footwear silhouettes and launch product. Nike fell 3% and Lululemon 4% in sympathy.", "zh": "迪克體育用品週二暴跌約 30%，是 2023 年以來最慘的單日。第二季淨營收 55.9 億美元、調整後每股獲利 3.53 美元，低於預期的 3.78 美元，但真正的殺傷力來自指引：全年調整後每股獲利被砍到 11.00 至 12.00 美元，市場共識原本是 14.20 美元。禍首是併購來的 Foot Locker，其備考同店銷售衰退 3.6%，因為它過度依賴舊款鞋型與限量發售商品。耐吉與露露檸檬分別跟跌 3% 與 4%。", "url": "https://www.cnbc.com/2026/08/25/dicks-sporting-goods-dks-earnings-q2-2026.html"},
  {"id": "earn_2", "channel": "財報速報", "tag": "超預期卻跌", "color": "#E8786A", "stocks": [{"t": "INTU", "n": "財捷，FQ4 每股獲利 4.03 美元、超預期 22%，股價仍跌 3.37%"}, {"t": "ADSK", "n": "歐特克，週四盤後接棒，同屬訂閱制軟體對照組"}, {"t": "CRM", "n": "賽富時，今晚盤後公布，市場拿來檢驗同一個問題"}], "en": "Intuit reported fiscal Q4 EPS of $4.03 against $3.29 expected, a 22% beat, and the stock still fell 3.37%. The explanation is in the shape of the guidance rather than the quarter: full-year revenue growth of 13% to 14% to about $21.35B is a deceleration, and the stock had already rebounded roughly 24% in a month while sitting 44% below its $705 high. A beat into a rebound with slowing forward growth is a classic sell-the-news setup.", "zh": "財捷公布會計年度第四季每股獲利 4.03 美元，遠高於預期的 3.29 美元、超出 22%，股價卻仍跌 3.37%。原因不在這一季而在指引的形狀：全年營收成長 13% 至 14% 到約 213.5 億美元，是明顯的減速；而且股價一個月內已經反彈約 24%，同時仍比 705 美元的高點低 44%。「超預期＋成長減速＋股價已先反彈」，就是典型的利多出盡結構。", "url": "https://247wallst.com/investing/2026/08/25/live-will-intuits-q4-earnings-tonight-extend-the-stocks-25-rebound/"},
  {"id": "macro_0", "channel": "總經政策", "tag": "今早 PCE", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債ETF，最直接對應 PCE 年增率的定價"}, {"t": "SHY", "n": "短天期公債ETF，對 9 月會議的降息定價最敏感"}, {"t": "XLU", "n": "公用事業類股，長期利率一動就跟著動的防禦部位"}], "en": "The July PCE report lands at 8:30 a.m. ET today, alongside the second estimate of Q2 GDP. FactSet consensus has headline PCE up just 0.07% on the month but rising to 3.6% year on year, with core at 0.18% monthly and 3.20% annually. The Fed's September meeting is on the 15th and 16th, so today's number plus the August CPI on September 11 are the last two full readings the committee gets. Inflation has now run above target for roughly five years.", "zh": "7 月 PCE 物價報告今天美東時間早上 8 點半發布，同一時間還有第二季 GDP 的第二次估計值。FactSet 的共識是整體 PCE 月增僅 0.07%，但年增率會升到 3.6%；核心月增 0.18%、年增 3.20%。Fed 的 9 月會議在 15 至 16 日，所以今天這個數字加上 9 月 11 日的 8 月 CPI，就是委員會能拿到的最後兩份完整讀數。要記得，通膨已經連續約五年高於目標。", "url": "https://www.morningstar.com/economy/pce-inflation-likely-edge-higher-july"},
  {"id": "macro_1", "channel": "總經政策", "tag": "消費轉冷", "color": "#7C6AF7", "stocks": [{"t": "XHB", "n": "房屋建築ETF，最直接反映新屋銷售崩跌"}, {"t": "DHI", "n": "霍頓房屋，全美最大建商，降價保量的代表"}, {"t": "LEN", "n": "萊納建設，手握逾 52.3 萬塊地與逾 50 億美元流動性"}], "en": "Two soft prints landed together on Tuesday. The Conference Board's consumer confidence index slipped 0.8 points to 89.4, a seven-month low, and the Expectations sub-index dropped 5.8 points to 68.2 — below the 80 line the Board itself associates with recession within a year. New home sales fell 10.5% to a 607,000 annual rate, also the weakest since January, with the median new home price down to $393,800, a four-year low. Mortgage rates near 6.77% are doing the damage.", "zh": "週二有兩份偏軟的數據同時落地。經濟諮商理事會的消費者信心指數降 0.8 點至 89.4，是七個月新低，其中「預期」分項更重跌 5.8 點到 68.2，低於該機構自己定義的「一年內衰退」門檻 80。同日新屋銷售月減 10.5% 至年化 607,000 戶，同樣是 1 月以來最弱，新屋中位數價格降到 393,800 美元、四年新低。真正的元凶是仍在 6.77% 附近的房貸利率。", "url": "https://continuumeconomics.com/a/9d59ca31/us-july-new-home-sales-august-consumer-confidence-both-weakest-since-january-mixed-detail"},
  {"id": "macro_2", "channel": "總經政策", "tag": "框架審查", "color": "#7C6AF7", "stocks": [{"t": "UUP", "n": "美元指數ETF，鷹派意外時最直接的反應標的"}, {"t": "IEF", "n": "7至10年期公債ETF，框架若改寫會重定價的中段"}, {"t": "XLF", "n": "金融類股，殖利率曲線形狀改變的主要受益或受害方"}], "en": "Fed Chair Kevin Warsh gives his first Jackson Hole speech on Friday. He has already told reporters it will frame big-picture questions rather than offer near-term guidance, and he has convened 15 outside experts to review the Fed's policy framework with recommendations due by year-end. The live question is whether average inflation targeting, adopted under Powell in 2020, survives. A Bank of America survey found 69% of fund managers expect a neutral tone, which means neutral is already in the price.", "zh": "Fed 主席 Warsh 週五將發表他上任後的第一場傑克遜洞演講。他先前已對記者表示，這場演講會處理「大格局的問題」，而不是給短期指引；他同時找來 15 位外部專家審查 Fed 的政策框架，建議報告年底出爐。真正待決的問題是 2020 年 Powell 任內採用的「平均通膨目標制」還保不保得住。美國銀行調查顯示 69% 的基金經理人預期演講基調中性，也就是說中性早已被定價。", "url": "https://www.xtb.com/en/education/jackson-hole-2026-warsh-fed-speech"},
  {"id": "sector_0", "channel": "產業風向", "tag": "最強八月", "color": "#4EABA4", "stocks": [{"t": "SOXX", "n": "半導體ETF，費半本月漲逾 10%，可望寫下 2003 年來最強八月"}, {"t": "AMD", "n": "超微，本波反彈的領漲股之一，AI 展望帶動"}, {"t": "MRVL", "n": "博通得，週二漲 5%，多家華爾街機構調高目標價"}], "en": "Semiconductors have reversed July's collapse so violently that August 2026 is on track to be the sector's strongest August since 2003. The PHLX Semiconductor index is up more than 10% this month after July delivered its worst monthly decline since the 2008 crisis, when the group shed over a fifth of its value on doubts that AI data-centre capex would convert into chipmaker revenue. Nothing has resolved that doubt yet; tonight's Nvidia guidance is the first real test of it.", "zh": "半導體把七月的崩跌反轉得極為猛烈，2026 年八月正朝著「2003 年以來最強八月」邁進。費城半導體指數本月已漲逾 10%，而七月才剛創下 2008 年金融海嘯以來最差的單月表現，當時整個族群從高點蒸發逾五分之一，理由是市場懷疑 AI 資料中心的資本支出能否轉化成晶片商的營收。這個懷疑到現在都還沒被解決，今晚輝達的指引就是第一次真正的檢驗。", "url": "https://primexbt.com/news/semiconductor-stocks-poised-for-best-august-in-over-20-years/"},
  {"id": "sector_1", "channel": "產業風向", "tag": "mRNA 翻身", "color": "#4EABA4", "stocks": [{"t": "MRNA", "n": "莫德納，單日曾漲 125.9%、市值一天增加 450 億美元"}, {"t": "MRK", "n": "默沙東，Keytruda 是這次三期試驗的搭配用藥與合作方"}, {"t": "XBI", "n": "生技ETF，等權重結構讓它比大型藥廠更能吃到族群溢出"}], "en": "Moderna's personalised mRNA cancer vaccine intismeran autogene, paired with Merck's Keytruda, hit its endpoints in a late-stage melanoma trial. It is the first successful Phase 3 cancer readout for mRNA. The stock rose as much as 125.9% in a session, adding about $45 billion of market value, and Bank of America lifted its target from $40 to $170. Note the gap that creates: the average Wall Street target of $78.78 now sits roughly 46% below the price, so most analysts have not yet moved.", "zh": "莫德納的個人化 mRNA 癌症疫苗 intismeran autogene 搭配默沙東的 Keytruda，在黑色素瘤後期試驗中達到主要終點，這是 mRNA 技術第一次拿到成功的三期癌症讀數。股價單日一度大漲 125.9%、市值一天增加約 450 億美元，美國銀行把目標價從 40 美元一口氣調到 170 美元。要注意這造成的落差：華爾街平均目標價 78.78 美元，如今比股價低了約 46%，代表多數分析師還沒調整。", "url": "https://www.biopharmadive.com/news/moderna-merck-intismeran-melanoma-vaccine-stock-reaction/828332/"},
  {"id": "sector_2", "channel": "產業風向", "tag": "鞋類降價戰", "color": "#4EABA4", "stocks": [{"t": "XRT", "n": "零售類股ETF，等權重結構對單一通路爆雷特別敏感"}, {"t": "ONON", "n": "On Holding，新世代跑鞋品牌，市佔正從舊款鞋型手中拿走"}, {"t": "DECK", "n": "Deckers，旗下 Hoka 同屬吃掉傳統鞋型份額的一方"}], "en": "The Dick's blow-up is not really a retail story, it is a product-cycle story. Management blamed heightened promotional activity in footwear and apparel plus underperforming launches, and Foot Locker's greater dependence on legacy silhouettes and retro product. That is a precise description of share moving away from heritage sneaker lines toward newer performance brands. When the buyer of that exposure has to discount to clear it, the winners of the same shift are on the other side of the trade.", "zh": "迪克體育用品的爆雷，本質上不是零售的故事，而是產品週期的故事。管理層把責任歸給鞋類與服飾的促銷戰加劇、新品發售表現不如預期，以及 Foot Locker 過度依賴舊款鞋型與復刻商品。這其實是在精確描述一件事：市佔正從經典球鞋產品線流向較新的機能性品牌。當被迫降價清庫存的是通路端，這場位移的贏家就站在交易的另一邊。", "url": "https://wwd.com/footwear-news/shoe-industry-news/dicks-sporting-goods-dks-q2-2026-earnings-foot-locker-stock-1239148792/"},
  {"id": "small_0", "channel": "小型股風雲", "tag": "再創新高", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，指數上週五收在 3,068.54 的歷史新高"}, {"t": "IJR", "n": "標普600小型股ETF，只收錄有盈利的公司，是另一種讀法"}], "en": "The Russell 2000 closed at a record 3,068.54 on Friday and is now up more than 23% year to date, ahead of the Nasdaq 100's 19% and leading the S&P 500 by 9.1 percentage points. It is the index's best start to a year since 1991. That is a genuinely unusual configuration: small caps normally lag when the megacap complex is the market's engine, so leadership changing hands this decisively is information about breadth, not just about small caps.", "zh": "羅素 2000 指數上週五收在 3,068.54 的歷史新高，年初至今漲幅已超過 23%，領先那斯達克 100 的 19%，也比標普 500 多出 9.1 個百分點，是 1991 年以來最強的年度開局。這是相當罕見的組合：當大型科技股是市場引擎時，小型股通常會落後，所以領導權轉手轉得這麼徹底，透露的其實是市場廣度的訊息，而不只是小型股自己的事。", "url": "https://www.benzinga.com/etfs/specialty-etfs/26/08/61181756/quick-spark-russell-2000-hits-new-record-highs-beats-nasdaq-100-in-2026"},
  {"id": "small_1", "channel": "小型股風雲", "tag": "三個引擎", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素2000成長股ETF，對降息與資本支出誘因最敏感的一端"}, {"t": "KRE", "n": "區域銀行ETF，小型股放款端，降息直接改善利差與信用成本"}], "en": "Three engines are pushing small caps at once, and they are worth separating. First, Fed cuts flow straight through to floating-rate debt, which small caps carry far more of than large caps. Second, domestic fiscal policy: the One Big Beautiful Bill Act's 100% bonus depreciation and R&D expensing provisions favour capital-intensive domestic operators. Third, a valuation discount to large caps that had widened to a 30-year extreme is simply being corrected. Only the first is reversible on a single data print.", "zh": "目前同時有三個引擎在推小型股，值得把它們拆開看。第一，Fed 降息會直接傳導到浮動利率債務，而小型股背的浮動利率債遠多於大型股。第二是國內財政政策，「One Big Beautiful Bill Act」的 100% 加速折舊與研發費用化條款，對資本密集的本土營運者特別有利。第三是對大型股的估值折價已擴大到三十年極端，如今只是在修正。三者之中只有第一項會被單一份數據翻盤。", "url": "https://tickeron.com/trading-investing-101/the-small-cap-seasonality-forecast-why-may-june-and-july-2026-may-be-the-most-powerful-window-for-stocks-in-generation/"},
  {"id": "small_2", "channel": "小型股風雲", "tag": "到期牆", "color": "#5B8ED6", "stocks": [{"t": "HYG", "n": "高收益債ETF，小型股再融資成本的即時風向球"}, {"t": "IWN", "n": "羅素2000價值股ETF，債務負擔較重的一端集中在這裡"}], "en": "Here is the other side of the same trade. Small caps face roughly a $368 billion maturity wall in 2026: debt issued in the zero-rate era now has to roll over at something near 6.5%, against the 1% to 2% coupons it is replacing. That is a permanent step-up in interest expense that no single rate cut undoes, and it lands on the companies least able to absorb it. The bull case and the bear case here are made of the same material, which is leverage.", "zh": "這是同一筆交易的另一面。小型股在 2026 年面對約 3,680 億美元的到期牆：零利率時代發行的債務，現在必須以接近 6.5% 的成本展期，而它取代的是票面 1% 到 2% 的舊債。這是利息費用的永久性跳升，不是降息一碼兩碼就能抵銷，而且落在最沒有能力吸收它的公司身上。多方論點與空方論點在這裡其實是同一種材料做的，那就是槓桿。", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment"},
  {"id": "small_3", "channel": "小型股風雲", "tag": "折價的真相", "color": "#5B8ED6", "stocks": [{"t": "VIOO", "n": "先鋒標普600 ETF，指數規則要求連續獲利才能納入"}, {"t": "IJR", "n": "標普600小型股ETF，與羅素2000 的成分差異就是這張卡的重點"}], "en": "The headline number everyone quotes is that small caps trade at a 34.5% earnings-multiple discount to large caps. Before treating that as cheapness, note what sits inside the Russell 2000: a large share of its members are not profitable at all, which distorts any aggregate earnings multiple upward and then makes the discount look wider than the comparable-company reality. The S&P 600, which requires a track record of positive earnings for inclusion, is the cleaner denominator. Same asset class, different pool.", "zh": "大家引用的標題數字是：小型股的本益比對大型股折價 34.5%。在把它當成「便宜」之前，先看看羅素 2000 裡面裝了什麼——其中相當高比例的成分股根本沒有獲利，這會把整體的本益比往上扭曲，接著讓折價看起來比同質公司之間的真實差距更寬。標普 600 因為納入規則要求連續正獲利，是比較乾淨的分母。同一個資產類別，不同的池子。", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/"},
  {"id": "small_4", "channel": "小型股風雲", "tag": "廣度檢查", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，指數創高時要回頭檢查是幾檔股票撐的"}, {"t": "XSMO", "n": "小型股動能ETF，動能因子集中度是廣度的反面指標"}], "en": "A useful discipline when an index sets records: count how many names are actually doing it. On Monday, 32 small caps with market values above $2 billion printed 52-week highs. That is a real number you can track daily, and it is more informative than the index level, because a record made by 32 names is a different animal from a record made by six. Narrowing breadth beneath a rising index is the standard early warning, and it costs nothing to check.", "zh": "當指數創新高時，有一個很實用的紀律：去數到底有幾檔股票真的在創高。週一有 32 檔市值超過 20 億美元的小型股寫下 52 週新高。這是一個可以每天追蹤的實際數字，而且比指數點位本身更有資訊量，因為由 32 檔撐起來的新高，跟由 6 檔撐起來的新高，是完全不同的東西。指數上漲但廣度收窄，是最標準的早期警訊，而檢查它不花你任何成本。", "url": "https://www.trefis.com/stock/spy/articles-v3/612776/the-52-week-high-list-32-small-cap-names-on-monday/2026-08-25"},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月初 Q3 財報與重建業務市佔數字", "stocks": [{"t": "ENOV", "n": "Enovis，市值約 15 億美元，8/24 收 25.21 美元"}], "en": "Enovis makes orthopaedic implants and bracing products, split between reconstructive surgery and prevention and recovery. It is ignored because a series of goodwill impairments after its 2022 separation from Colfax turned the story toxic and pushed generalists out. What is changing: net losses narrowed from $92.71M to $9.95M year on year, the reconstructive segment is taking share, and on August 13 director Daniel Pryor bought about 10,000 shares near $28.90 — roughly 9.3% of his direct holding and above today's $25.21 price. Risks: a $1.5B market cap with meaningful leverage, hospital capex sensitivity, and an impairment history that means the market will demand several clean quarters before re-rating. Research lead, not investment advice.", "zh": "Enovis 做骨科植入物與護具，業務分成重建手術與預防復健兩塊。它被忽視的原因是 2022 年從 Colfax 分拆後接連認列商譽減損，把故事弄髒了，一般型基金因此退場。正在改變的是：年對年淨損從 9,271 萬美元收窄到 995 萬美元，重建業務正在拿市佔；而 8 月 13 日董事 Daniel Pryor 以約 28.90 美元買進約 10,000 股，占他個人直接持股的 9.3%，而且買在高於目前 25.21 美元的價位。風險是：市值僅約 15 億美元、槓桿不低、營收吃醫院資本支出的臉色，加上減損前科讓市場會要求連續幾季乾淨的數字才肯重估。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/healthcare/nyse-enov/enovis"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月下旬 Q3 財報的淨利差與存款成本", "stocks": [{"t": "FSBC", "n": "Five Star Bancorp，加州沙加緬度社區銀行控股公司"}], "en": "Five Star Bancorp is a Sacramento-based community bank, the kind of name almost no sell-side desk covers. It is ignored for structural reasons: small community banks have been treated as one undifferentiated risk bucket since 2023, so individual results barely register. What is changing: Q2 2026 net interest income rose to $46.08M from $36.52M a year earlier, net income to $19.4M from $14.51M, and executives have been buying shares in the open market over recent months. Risks: commercial real estate concentration typical of the model, deposit competition if cuts arrive slower than priced, and a single regional economy carrying the whole loan book. Research lead, not investment advice.", "zh": "Five Star Bancorp 是加州沙加緬度的社區銀行控股公司，屬於幾乎沒有賣方分析師覆蓋的名字。它被忽視有結構性原因：自 2023 年以來，小型社區銀行被市場當成一個不加區分的風險籃子，個別公司的業績根本進不了視線。正在改變的是：2026 年第二季淨利息收入從去年同期的 3,652 萬美元升到 4,608 萬美元，淨利從 1,451 萬升到 1,940 萬美元，且高階主管近幾個月持續在公開市場買進自家股票。風險是：這種模式典型的商用不動產集中度、若降息比定價來得慢會有存款競爭壓力，以及整本放款簿押在單一區域經濟上。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/banks/nasdaq-fsbc/five-star-bancorp/news/exploring-undervalued-small-caps-with-insider-action-in-augu-1"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "status": "RADAR · 下一個驗證點 是否出現第二位內部人跟進買進", "stocks": [{"t": "BKKT", "n": "Bakkt，8/18 董事買進 296,567 股、金額 211 萬美元"}], "en": "Bakkt runs crypto custody and trading infrastructure sold to institutions rather than to retail. It is ignored because the story is treated as a failed 2021 SPAC and the price action has kept generalists away; the stock is down 33% over six months and sits near a 52-week low of $6.75. What is changing: on August 18, director Michael Alfred bought 296,567 Class A shares at a weighted-average $7.12, a $2.11 million open-market purchase at prices from $6.88 to $7.32. Risks: the business is levered to crypto activity levels rather than to its own execution, one director is not a cluster, and a name this beaten down can stay beaten down. Research lead, not investment advice.", "zh": "Bakkt 做的是賣給機構、而非散戶的加密資產保管與交易基礎設施。它被忽視的原因是市場把它當成 2021 年失敗的 SPAC 案例，加上股價表現把一般型投資人都趕跑了：半年跌 33%，目前貼著 52 週低點 6.75 美元。正在改變的是：8 月 18 日董事 Michael Alfred 以加權平均 7.12 美元買進 296,567 股 A 類普通股，公開市場金額 211 萬美元，成交區間 6.88 至 7.32 美元。風險是：這門生意的槓桿掛在幣圈活躍度而不是自身執行力上，一位董事不構成群體買進，而且跌成這樣的名字可以繼續跌很久。這是研究線索，不是投資建議。", "url": "https://www.insiderscreener.com/en/sec-form-4"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 已到！今早盤前財報與 9:00 法說會", "stocks": [{"t": "MOV", "n": "Movado Group，今早盤前公布 FY2027 Q2、9:00 法說會"}], "en": "Movado's validation point is today. The group reports fiscal Q2 2027 before the open with the call at 9:00 a.m. ET; CEO Efraim Grinberg and CFO Sallie DeMarsilis present. Consensus looks for revenue growth of about 1.5%, decelerating from 3.1% a year ago and from the 8.1% growth and $142.4M it delivered last quarter. The pool thesis rests on the licensed-brand portfolio plus the Kate Spade licence effective July 2026, whose first full-year revenue contribution does not arrive until fiscal 2028. So the question today is not whether Kate Spade shows up in the numbers — it cannot yet — but whether management gives FY2027 guidance at all. Research lead, not investment advice.", "zh": "Movado 的驗證點就是今天。集團在美股開盤前公布 FY2027 第二季財報，美東時間 9:00 由執行長 Grinberg 與財務長 DeMarsilis 主持法說會。市場共識是營收成長約 1.5%，比去年同期的 3.1% 減速，也遠低於上一季 8.1% 成長、1.424 億美元的表現。池內論點靠的是授權品牌組合加上 2026 年 7 月生效的 Kate Spade 授權，而那條線的第一個完整年度貢獻要到 FY2028 才會出現。所以今天的問題不是 Kate Spade 有沒有出現在數字裡（現在還不可能），而是管理層這次到底給不給 FY2027 指引。這是研究線索，不是投資建議。", "url": "https://www.businesswire.com/news/home/20260819718785/en/Movado-Group-Inc.-Announces-Date-of-Conference-Call-and-Webcast-for-Second-Quarter-Fiscal-Year-2027-Results"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報的現金消耗速度", "stocks": [{"t": "ZNTL", "n": "Zentalis，8/14 由 10% 股東買進 433.5 萬股、金額 1,517 萬美元"}], "en": "A large new data point on a pool name. On August 14, Walters Group — a director and 10% owner of Zentalis Pharmaceuticals — acquired 4,335,000 shares at $3.50 each, a $15.17 million open-market purchase, against a recent price of $3.83. Size is what makes this different from a token director buy: it is a capital allocation decision by a holder who already knows the pipeline. The reason the name is ignored has not changed — clinical-stage biotech with no revenue and binary readouts. Risks: cash runway, trial outcomes that can halve the equity overnight, and the fact that a 10% owner buying more is also a concentration risk for everyone else. Research lead, not investment advice.", "zh": "池內名字出現一筆分量很重的新證據。8 月 14 日，Zentalis 的董事兼 10% 股東 Walters Group 以每股 3.50 美元買進 4,335,000 股，公開市場金額 1,517 萬美元，而近期股價是 3.83 美元。讓這筆跟一般象徵性董事買進不同的是規模：這是一個早就了解管線的持有人所做的資本配置決策。它被忽視的原因沒有變——臨床階段生技、沒有營收、結果是二元的。風險是現金可撐時間、試驗結果可能一夜砍半，以及 10% 股東繼續加碼對其他人來說同時也是集中度風險。這是研究線索，不是投資建議。", "url": "https://www.insiderscreener.com/en/sec-form-4"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報的沖銷率與 30 天逾期率", "stocks": [{"t": "RM", "n": "Regional Management，非優級消費信貸業者，池內 8/21 入池"}], "en": "Regional Management lends to non-prime consumers, and yesterday's macro prints put it directly in the crosshairs. Consumer confidence at a seven-month low with the Expectations index at 68.2 is exactly the environment where non-prime credit costs rise first, because that borrower has the least buffer. It stays in the pool for the reasons it entered — thin coverage, insider activity in recent months, a valuation that already assumes stress. But the honest reading today is that the bear case just got fresh evidence and the bull case did not. Watch charge-offs and 30-day delinquency in the Q3 report, not the earnings headline. Research lead, not investment advice.", "zh": "Regional Management 放款給非優級（non-prime）消費者，而昨天的總經數據直接把它推到火線上。消費者信心來到七個月低點、預期分項只剩 68.2，正是非優級信貸成本最先上升的環境，因為這群借款人的緩衝最薄。它留在池內的理由沒變——覆蓋稀少、近幾個月有內部人動作、估值已經反映了壓力。但今天誠實的讀法是：空方論點剛拿到新證據，多方論點沒有。第三季財報要看的是沖銷率與 30 天逾期率，不是每股獲利的標題。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/diversified-financials/nyse-rm/regional-management/news/undervalued-small-caps-with-insider-activity-to-explore-in-a"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "執行長連買", "color": "#6DB56D", "stocks": [{"t": "KURA", "n": "Kura Oncology，執行長八天內兩度買進各 10 萬股"}], "en": "Kura Oncology's CEO Troy Wilson bought 100,000 shares on August 17 at a weighted-average $11.12, about $1.11 million, and then bought another 100,000 on August 24 at $12.39, about $1.24 million, in trades ranging from $11.47 to $12.85. The shape matters more than the size: he paid up on the second purchase, eight days later, into a rising price. That is the version of insider buying with the least ambiguity — an executive who could have waited, choosing not to. The stock rose 10.5% in Tuesday's premarket. Kura's lead asset is the menin inhibitor ziftomenib for acute myeloid leukaemia.", "zh": "Kura Oncology 執行長 Troy Wilson 在 8 月 17 日以加權均價 11.12 美元買進 10 萬股、約 111 萬美元，接著 8 月 24 日又買 10 萬股、均價 12.39 美元、約 124 萬美元，成交區間 11.47 至 12.85 美元。形狀比金額更值得看：他在八天後的第二筆買在更高的價格、追著上漲的股價買。這是內部人買進裡歧義最少的一種——一個本來可以再等的高階主管，選擇不等。該股週二盤前一度漲 10.5%。Kura 的主力資產是治療急性骨髓性白血病的 menin 抑制劑 ziftomenib。", "url": "https://www.fool.com/coverage/filings/2026/08/25/kura-oncology-ceo-buys-100-000-shares-for-usd1-2-million-does-this-large-buy-bode-well-for-shares-in-2026/"},
  {"id": "insider_1", "channel": "內部人動向", "tag": "逆風買進", "color": "#6DB56D", "stocks": [{"t": "MBC", "n": "MasterBrand，執行長 8 月初買進 6 萬股、約 50.58 萬美元"}], "en": "MasterBrand's CEO R. Banyard bought 60,000 shares in early August for roughly $505,800. The context is what makes it readable: MasterBrand makes kitchen and bath cabinets, so its end market is exactly the housing demand that just printed a 10.5% drop in new home sales and a four-year low in the median new home price. A CEO buying into that data is either seeing something in order books that the macro series has not caught, or is early. Both are possible, and only the next two quarters separate them.", "zh": "MasterBrand 執行長 R. Banyard 在 8 月初買進 6 萬股，金額約 50.58 萬美元。真正讓這筆交易可讀的是它的背景：MasterBrand 做的是廚房與浴室櫃體，終端市場正好就是剛剛印出「新屋銷售月減 10.5%、新屋中位數價格四年新低」的那個住宅需求。執行長在這種數據下買進，要嘛是他從訂單簿裡看到總經數列還沒捕捉到的東西，要嘛就是他買太早。兩種都有可能，而能分辨它們的只有接下來兩季的數字。", "url": "https://simplywall.st/stocks/us/capital-goods/nyse-mbc/masterbrand/news/undervalued-small-caps-with-insider-buying-to-watch-in-augus-1"},
  {"id": "insider_2", "channel": "內部人動向", "tag": "判讀提醒", "color": "#6DB56D", "stocks": [{"t": "SONO", "n": "Sonos，3 至 6 月買回 199 萬股、3,014 萬美元"}, {"t": "EVTC", "n": "Evertec，Q2 買回 190.7 萬股、4,710 萬美元，8/4 再加碼 1.5 億額度"}], "en": "Two calibration points for reading everything above. First, the base rate: across one tracked universe in early August there were 1,910 open-market insider sales against 40 purchases, only 8 of 149 companies had any officer buy, and only 2 of 149 had a cluster buy in the trailing 90 days. Insider buying is rare by construction, which is precisely why a single purchase carries signal. Second, do not confuse buybacks with insider buying. Sonos repurchased 1.99 million shares for $30.14M and Evertec bought back $47.1M in Q2 and added $150M of authorisation on August 4 — that is company money and a board decision, not an executive's own capital at risk.", "zh": "給上面所有內容兩個校準點。第一是基準率：八月初某個追蹤範圍內，公開市場的內部人賣出有 1,910 筆、買進只有 40 筆，149 家公司裡只有 8 家出現任何一位高階主管買進，過去 90 天內有群體買進的更只有 2 家。內部人買進在結構上就是稀少的，這正是單一筆買進之所以帶有訊號的原因。第二，不要把庫藏股跟內部人買進混為一談。Sonos 買回 199 萬股、3,014 萬美元，Evertec 第二季買回 4,710 萬美元並在 8 月 4 日再加 1.5 億美元額度——那是公司的錢與董事會的決定，不是高階主管自己掏出來承擔風險。", "url": "https://openinsider.com/latest-cluster-buys"},
  {"id": "capitol_0", "channel": "政要持股", "tag": "押 AI 電力", "color": "#B5654D", "stocks": [{"t": "BE", "n": "Bloom Energy，申報買進 1.5 萬股加 200 口 100 美元履約價買權"}, {"t": "INTC", "n": "英特爾，申報買進 1 萬股加 50 口 50 美元履約價買權"}], "en": "A disclosure filed August 24 shows the Pelosi household acquired 15,000 Bloom Energy Class A shares in two transactions on July 24 and July 28, plus two lots of 100 call options, both at a $100 strike expiring June 2027. The same filing shows 10,000 Intel shares bought July 24 in the $500,001 to $1,000,000 band, plus 50 Intel calls at a $50 strike expiring June 17, 2027. Combined reported value is roughly $4.25M to $14.5M. Read as a thesis rather than as a name: this is money positioned on AI power generation and on domestic chip manufacturing, with an expiry that says the payoff is expected within about ten months.", "zh": "8 月 24 日申報的一份揭露顯示，Pelosi 家戶在 7 月 24 日與 7 月 28 日分兩筆買進 15,000 股 Bloom Energy A 類股，另加兩組各 100 口買權，履約價都是 100 美元、2027 年 6 月到期。同一份申報還顯示 7 月 24 日買進 1 萬股英特爾，落在 50 萬至 100 萬美元的申報區間，另有 50 口履約價 50 美元、2027 年 6 月 17 日到期的英特爾買權。合計申報價值約 425 萬至 1,450 萬美元。把它當作一個主題而不是兩個代號來讀：這筆錢押的是 AI 發電與美國本土晶片製造，而到期日等於在說，預期兌現的時間大約在十個月內。", "url": "https://seekingalpha.com/news/4636268-nancy-pelosi-discloses-new-buys-of-intel-bloom-energy"},
  {"id": "capitol_1", "channel": "政要持股", "tag": "判讀卡", "color": "#B5654D", "stocks": [{"t": "NANC", "n": "追蹤民主黨議員申報持股的 ETF，本身就是這個延遲問題的產品化"}, {"t": "BE", "n": "以本例來說，跟單者買到的是七月底的價格結構"}], "en": "Four things to hold onto when reading any PTR. One: the 45-day filing window means you are always reading history — these trades executed July 24 and 28 and surfaced August 24, so anyone acting on the headline is buying a month of price movement later. Two: amounts are ranges, not numbers, which is why the same filing can be reported as $4.25M or $14.5M. Three: these were executed by a spouse, Paul Pelosi, and disclosed under House spousal rules, so the member need not have chosen them. Four: with options, the strike and expiry carry the real information — a $100 strike expiring June 2027 states a required magnitude and a deadline that plain share ownership never does.", "zh": "讀任何一份 PTR 時要抓住四件事。第一，45 天的申報窗口代表你讀到的永遠是歷史——這幾筆在 7 月 24 與 28 日成交、8 月 24 日才曝光，照著標題跟單的人買到的是一個月後的價格。第二，金額只有區間、沒有數字，這就是為什麼同一份申報可以被說成 425 萬、也可以被說成 1,450 萬美元。第三，這些是由配偶 Paul Pelosi 執行、依眾議院配偶規則申報，議員本人未必參與選股。第四，遇到選擇權時，履約價與到期日才是真正的資訊量——履約價 100 美元、2027 年 6 月到期，等於同時說出了「需要漲多少」與「期限在哪」，這是單純持股永遠不會告訴你的。", "url": "https://congressflow.com/learn/how-congress-trades-stocks"},
  {"id": "week_0", "channel": "本週事件", "tag": "數據行事曆", "color": "#C97DD4", "stocks": [{"t": "SPY", "n": "標普500 ETF，今早 8:30 兩份數據同時落地的主要曝險"}, {"t": "TLT", "n": "長天期公債ETF，週五 Warsh 演講的最大波動來源"}], "en": "The macro calendar for the rest of the week. Today at 8:30 a.m. ET, two releases land together: July PCE, with consensus at 0.07% monthly and 3.6% annually headline, 0.18% and 3.20% core, and the second estimate of Q2 GDP, where the advance print was 1.5% annualised on stronger consumer spending, investment and exports offset by lower government spending. Then Friday, Warsh's Jackson Hole debut. The Fed's September meeting is on the 15th and 16th, which makes today's inflation print one of only two full readings the committee still gets.", "zh": "本週剩下的總經行事曆。今天美東時間早上 8 點半有兩份數據同時落地：7 月 PCE，共識為整體月增 0.07%、年增 3.6%，核心月增 0.18%、年增 3.20%；以及第二季 GDP 的第二次估計值，首次估計為年化 1.5%，靠的是消費、投資與出口成長，被政府支出減少部分抵銷。接著是週五 Warsh 的傑克遜洞首演。Fed 的 9 月會議在 15 至 16 日，這讓今天的通膨數字成為委員會僅剩兩份完整讀數的其中一份。", "url": "https://www.bea.gov/news/2026/gdp-advance-estimate-2nd-quarter-2026"},
  {"id": "week_1", "channel": "本週事件", "tag": "財報行事曆", "color": "#C97DD4", "stocks": [{"t": "CRWD", "n": "CrowdStrike，今晚盤後，新增 ARR 指引 2.84 至 2.86 億美元"}, {"t": "WDAY", "n": "Workday，週四盤後，企業 HR 預算的溫度計"}, {"t": "MRVL", "n": "博通得，週四盤後，資料中心自研晶片的風向球"}], "en": "Tonight is the crowded slot: Nvidia, Salesforce, CrowdStrike and Synopsys all report after the close within roughly the same hour. Thursday after the close brings Marvell, Autodesk and Workday. Taken together these are two distinct questions on one evening — whether AI hardware demand is still compounding, and whether enterprise software budgets are still expanding while that hardware spend consolidates. The second question is the one with less coverage and arguably more read-through for the rest of the market.", "zh": "今晚是最擁擠的時段：輝達、賽富時、CrowdStrike 與新思科技全都在盤後、幾乎同一個小時內公布財報。週四盤後則輪到博通得、歐特克與 Workday。合起來看，這一晚其實在問兩個不同的問題——AI 硬體需求是否還在複利成長，以及在硬體支出盤整的同時，企業軟體預算是否還在擴張。第二個問題被討論得少很多，但對市場其他部分的參考價值可能更大。", "url": "https://www.benzinga.com/markets/market-summary/26/08/61373202/top-sp-500-index-stocks-to-watch-this-week-crowdstrike-salesforce-workday"},
  {"id": "eval_0", "channel": "今日評估", "tag": "值得深想", "color": "#E8A838", "status": "DISCUSS · 讀完到最後一頁，複製 PROMPT 找 CLAUDE 復盤", "stocks": [{"t": "QQQ", "n": "那斯達克100 ETF，舊領導的載體，今晚由輝達代表出賽"}, {"t": "XLV", "n": "醫療類股ETF，新領導的載體，靠的是臨床數據不是資本支出"}, {"t": "MRNA", "n": "莫德納，單一事件就重寫整個族群敘事的示範"}], "en": "The thing worth noticing today is that two different markets are being asked to justify themselves within twelve hours. This morning's PCE tests the rate path that small caps and healthcare have been rallying on; tonight's Nvidia guidance tests the capex path that semiconductors just rallied 10% in a month on. What makes it interesting is that these two engines have started moving independently — the Russell 2000 set a record while semis were having their worst month since 2008, and healthcare produced a 125% single-day move on a clinical readout with no macro content at all. Open question: if leadership really has rotated from capex stories to rate-and-data stories, which of today's two events should actually matter more to you, and does your current positioning agree with your answer?", "zh": "今天最值得注意的，是有兩個不同的市場要在十二小時內各自為自己辯護。今早的 PCE 檢驗的是小型股與醫療類股一路漲上來所依賴的利率路徑；今晚輝達的指引檢驗的則是半導體一個月漲 10% 所依賴的資本支出路徑。有意思的地方在於這兩個引擎已經開始各走各的——羅素 2000 創新高的同時，半導體正在經歷 2008 年以來最差的單月；而醫療類股靠一份完全沒有總經成分的臨床讀數，就做出單日 125% 的走勢。開放式問題：如果市場的領導權真的已經從「資本支出故事」轉到「利率與數據故事」，那今天這兩個事件裡，哪一個對你來說才該更重要？而你現在的部位同意你的答案嗎？", "url": "https://www.investing.com/analysis/russell-2000-at-record-highs-can-small-caps-lead-through-fed-transition-200678782"}
];

const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();
const lsKeyFor = (sub) => "mosfeed_" + BRIEF_ID + "_" + sub;

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/26/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v8.9</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
