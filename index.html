(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';

  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');

    {"id": "macro_0", "channel": "總經政策", "tag": "聯準會 10/28 決策：維持不動是共識，12 月升息才是焦點", "color": "#7C6AF7", "zh": "FOMC 將於 10 月 27、28 日開會，28 日下午 2 點公布決策。聯邦基金利率目前在 3.75% 至 4.00%（9 月升息，為 2023 年 7 月以來首次）；利率期貨顯示 10 月維持不動的機率約 90% 至 92%，12 月升息的定價各家不同（約 55% 到 85%）。FXStreet 指出，若鷹派持平後 PCE 與 GDP 又超預期，美元動能可能再起；主席華許（Kevin Warsh）的記者會是市場最看重的片段。", "en": "The FOMC meets Oct. 27 and 28, with the decision at 2 p.m. ET on the 28th. The fed funds range is 3.75% to 4.00% after a September hike, the first since July 2023; futures price roughly a 90% to 92% chance of a hold in October, while December hike odds vary by source (about 55% to 85%). FXStreet notes that a hawkish hold followed by hot PCE and GDP data could revive dollar momentum, and Chair Kevin Warsh's press conference is the key moment for markets.", "url": "https://www.fxstreet.com/analysis/week-ahead-central-bank-and-earnings-bonanza-could-roil-markets-202610230935", "stocks": [{"t": "TLT", "n": "長天期美債 ETF，對利率路徑最敏感"}, {"t": "UUP", "n": "美元指數 ETF，鷹派持平的受惠方向"}, {"t": "SHY", "n": "短天期美債 ETF，反映 12 月升息定價"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "通膨壓力的拼圖：油價創高、消費者信心 48.0", "color": "#7C6AF7", "zh": "密大消費者信心終值 48.0，高於預期的 46.3 但仍在歷史低檔；標普服務業 PMI 初值 57.9，與預期 58.0 幾乎一致，代表服務業仍擴張。同時布蘭特 116.72 美元、十年期殖利率 4.99%，市場同時面對成本上升與融資成本上升。這是我們的整理：能源推升的通膨預期，會讓 10/29 的 PCE 物價指數比平常更被放大檢視。", "en": "Final University of Michigan sentiment came in at 48.0 versus 46.3 expected, still historically low; flash S&P Global services PMI was 57.9 versus 58.0 expected, so services remain in expansion. Brent at $116.72 and a 10-year yield of 4.99% mean markets face rising costs and rising financing costs at once. Our synthesis: energy-driven inflation expectations will make the Oct. 29 PCE price index more closely scrutinized than usual.", "url": "https://investinglive.com/news/investinglive-americas-market-news-wrap-war-worries-boost-oil-to-the-highest-since-may/", "stocks": [{"t": "XLE", "n": "能源 ETF，油價創高下的受惠板塊"}, {"t": "XLY", "n": "非必需消費 ETF，消費者信心低檔最敏感"}, {"t": "TIP", "n": "抗通膨債券 ETF，通膨預期代理指標"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "FOMC 會議紀要：年內再升息一次仍屬適當，時機未定", "color": "#7C6AF7", "zh": "10 月 7 日公布的會議紀要顯示，多數官員認為今年內再升息一次可能適當，但時機未定。紐約聯準銀行總裁威廉斯與副主席傑佛遜強調要先看後續數據；達拉斯聯準銀行總裁洛根則主張至少再升息兩次。這張卡是政策背景：10/28 的決策不只看升不升，還要看聲明與記者會是否把 12 月升息寫成基本情境。", "en": "Minutes released Oct. 7 showed most officials saw another hike this year as likely appropriate, though timing is uncertain. New York Fed President Williams and Vice Chair Jefferson stressed assessing incoming data first, while Dallas Fed President Logan argues for at least two more quarter-point hikes. The takeaway is policy context: the Oct. 28 decision hinges less on hike versus hold than on whether the statement and press conference make a December hike the base case.", "url": "https://www.roic.ai/news/fed-minutes-signal-another-2026-hike-likely-appropriate-but-timing-remains-uncertain-10-07-2026", "stocks": [{"t": "TLT", "n": "長天期美債 ETF，對升息路徑敏感"}, {"t": "KRE", "n": "區域銀行 ETF，對利率與存款成本敏感"}, {"t": "XLU", "n": "公用事業 ETF，高利率下的估值壓力板塊"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "資安股逆勢走強：預算調查成催化劑", "color": "#4EABA4", "zh": "週五資安類股在大盤走弱時逆勢上漲：SailPoint、Cloudflare、Palo Alto Networks 各漲超過 7%，Yahoo 財經引述 Evercore ISI 的調查，指出企業資安預算展望轉強。這張卡的重點是訊號來源：一份券商調查而非公司財報，單日反應可能過度，要看下週以後的財報與指引是否印證。", "en": "Cybersecurity shares rose against a weak market on Friday: SailPoint, Cloudflare and Palo Alto Networks each gained more than 7%, with Yahoo Finance citing an Evercore ISI survey that points to stronger enterprise security budgets. The key point is the signal source: a broker survey rather than company results, so the one-day reaction may be overdone and needs confirmation from upcoming earnings and guidance.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-23-dow-sp-500-nasdaq-tesla-meta-093000521.html", "stocks": [{"t": "PANW", "n": "Palo Alto Networks，漲逾 7%"}, {"t": "NET", "n": "Cloudflare，漲逾 7%"}, {"t": "SAIL", "n": "SailPoint，漲逾 7%，身分安全"}, {"t": "CRWD", "n": "CrowdStrike，資安同業對照"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "油價創高的兩面：能源受惠，航空承壓", "color": "#4EABA4", "zh": "布蘭特到 116.72 美元的同時，航空股明顯走弱：聯合、達美、美國航空因燃油成本上升下跌；能源類股則是這波行情的直接受惠板塊。油價對板塊的影響不是對稱的：航空的燃油成本佔營業成本比重高，油價每漲一段，獲利預期都要重算；能源股則要看價格能否維持，而不是只看單日。", "en": "With Brent at $116.72, airline shares weakened visibly: United, Delta and American fell on higher fuel costs, while energy stocks were the direct beneficiaries. Oil's effect is not symmetric: fuel is a large share of airline operating costs, so each leg up forces earnings estimates to be recalculated, while energy stocks depend on whether prices hold rather than on a single day.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-23-dow-sp-500-nasdaq-tesla-meta-093000521.html", "stocks": [{"t": "UAL", "n": "聯合航空，燃油成本上升走弱"}, {"t": "DAL", "n": "達美航空，同上"}, {"t": "XLE", "n": "能源 ETF，油價創高的受惠板塊"}, {"t": "JETS", "n": "航空 ETF，板塊整體壓力"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "電信與衛星：星鏈傳聞牽動電信與鐵塔", "color": "#4EABA4", "zh": "電信類股週五下跌，原因是報導稱馬斯克計畫把星鏈延伸到手機服務，可能自建基地台或購買現有空間；另有報導說 SpaceX 洽談租用約 8 萬座美國基地台空間。這張卡是題材觀察：兩則都是報導與傳聞，尚無最終協議，電信與鐵塔業者受到的實際衝擊要看合約條件。", "en": "Telecom shares fell Friday on reports that Elon Musk plans to extend Starlink into phone service, possibly by building towers or buying space on existing ones; separately, reports said SpaceX is in talks to lease space on about 80,000 US cell sites. This is a themes-watch card: both are reports and rumors with no final agreement, so the real impact on carriers and tower owners depends on contract terms.", "url": "https://investinglive.com/news/investinglive-americas-market-news-wrap-war-worries-boost-oil-to-the-highest-since-may/", "stocks": [{"t": "T", "n": "AT&T，電信業者，受星鏈傳聞壓力"}, {"t": "VZ", "n": "Verizon，同上"}, {"t": "AMT", "n": "American Tower，鐵塔業者，租賃條件是關鍵"}, {"t": "TMUS", "n": "T-Mobile，10/28 財報，電信同業"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "兩日對照：羅素 2000 比那斯達克抗跌", "color": "#5B8ED6", "zh": "羅素 2000 週四上漲 0.11% 至 2,784.03，週五下跌 0.29% 至 2,775.90，兩天累計約 -0.18%，同期那斯達克綜合指數跌了約 2.8%；Chartmill 指出週四平均個股其實收高。這代表小型股這次沒有被 AI 資本支出疑慮拖累，但週五它跟著大盤收低，也說明小型股不是避風港：利率與油價才是它的主要壓力來源。", "en": "The Russell 2000 rose 0.11% to 2,784.03 on Thursday and fell 0.29% to 2,775.90 on Friday, about -0.18% over two days, while the Nasdaq Composite fell roughly 2.8% over the same stretch; Chartmill noted that the average stock actually closed higher Thursday. Small caps were not dragged down by AI capex doubts this time, yet Friday's decline shows they are no safe haven: rates and oil are their main pressure points.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-23-dow-sp-500-nasdaq-tesla-meta-093000521.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，兩日約 -0.18%"}, {"t": "IJR", "n": "標普小型 600 ETF，品質較高的小型股對照"}, {"t": "QQQ", "n": "那斯達克 100 ETF，兩日大幅落後的對照"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "判讀知識：殖利率逼近 5%，小型股為什麼更敏感", "color": "#5B8ED6", "zh": "小型股對利率更敏感有兩個結構原因：第一，羅素 2000 成分公司負債中浮動利率比重較高，十年期殖利率貼近 5% 時，利息費用會更快侵蝕獲利；第二，常見估計是約四成成分公司尚未獲利，估值靠遠期成長，折現率上升時被壓縮得更多。這是資訊整理，數字是常見估計，個別公司差異很大。", "en": "Small caps are more rate-sensitive for two structural reasons. First, Russell 2000 constituents tend to carry a higher share of floating-rate debt, so a 10-year yield near 5% erodes earnings faster through interest expense. Second, commonly cited estimates put about 40% of constituents as unprofitable, with valuations leaning on distant growth that gets compressed more when discount rates rise. This is information only; the figures are common estimates and companies vary widely.", "url": "https://www.nasdaq.com/articles/vanguard-russell-2000-etf-insider-buying-index-registering-11.0", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，對利率最敏感的廣泛代表"}, {"t": "KRE", "n": "區域銀行 ETF，小型金融股的利率敏感度對照"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "IWM 的交易紀錄：新增 Axos，減碼 Moog", "color": "#5B8ED6", "zh": "GuruFocus 整理的 iShares 羅素 2000 ETF（IWM）交易紀錄顯示，10 月 21 日新增 Axos Financial（AX）、減持 Moog（MOG.A）；另有一則指出同一個交易日 IWM 賣出約 9.32 億美元、買進僅 150 萬美元，反映當日淨贖回壓力。這張卡的重點是 ETF 的買賣是機械式的資金流，不代表基金經理對個股的看法。", "en": "GuruFocus's trade log for the iShares Russell 2000 ETF (IWM) shows it added Axos Financial and trimmed Moog on Oct. 21; a separate report notes that day's activity was about $931.9 million of sales against only $1.5 million of buys, reflecting net redemption pressure. The point is that ETF trades are mechanical flows and do not signal a fund manager's view on a stock.", "url": "https://www.gurufocus.com/news/9139259/ishares-russell-2000-iwm-adds-axos-financial-cuts-moog-on-wednesday", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，當日淨賣出約 9.32 億美元"}, {"t": "AX", "n": "Axos Financial，被 IWM 新增"}, {"t": "MOG.A", "n": "Moog，被 IWM 減持"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "下週輪到中小型財報：SoFi、Enphase、Twilio、EQT", "color": "#5B8ED6", "zh": "下週財報名單中有幾個中小型代表：SoFi（SOFI，金融科技）、Enphase Energy（ENPH，太陽能微型逆變器）、Twilio（TWLO，通訊雲端）、EQT（EQT，天然氣）。這些公司對利率與融資成本的敏感度各不相同，財報前後的波動通常比大型股更大，這張卡只是日程提醒，具體日期要以公司公告為準。", "en": "Next week's earnings list includes several small and mid-cap names: SoFi (fintech), Enphase Energy (solar microinverters), Twilio (communications cloud) and EQT (natural gas). Their sensitivity to rates and financing costs differs, and moves around earnings are usually larger than for mega caps. This is a calendar reminder only; exact dates depend on company announcements.", "url": "https://www.schaeffersresearch.com/content/news/2026/10/22/the-week-ahead-wall-street-awaits-october-fed-decision", "stocks": [{"t": "SOFI", "n": "SoFi，下週財報，對利率敏感的金融科技"}, {"t": "ENPH", "n": "Enphase，下週財報，太陽能"}, {"t": "TWLO", "n": "Twilio，下週財報，通訊雲端"}, {"t": "EQT", "n": "EQT，下週財報，天然氣"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "Gentherm（THRM）：合併完成，庫藏股開始動用", "color": "#C9A227", "zh": "這家公司做什麼：溫控座椅等車用熱管理，10/1 完成與 Modine Performance Technologies 的合併。為什麼被忽視：合併剛完成、新事業與舊事業混在一起，分析師模型還在重做。什麼正在改變：第一份合併後財報顯示營收 4.05 億美元、淨槓桿約 0.4 倍，並已買回 6,000 萬美元股票，新授權 4 億美元還剩約 3.4 億美元（SEC 8-K）。風險與反方：整合執行、車市循環與新股東持股結構；財報只有一季，趨勢尚未確立。這是研究線索，不是投資建議。", "en": "What it does: automotive thermal management such as heated and cooled seats, which completed its combination with Modine Performance Technologies on Oct. 1. Why neglected: the merger just closed and the two businesses are blended, so analyst models are still being rebuilt. What is changing: the first combined report shows revenue of $405 million, net leverage of about 0.4x and $60 million of shares already repurchased, with about $340 million left on a new $400 million authorization (SEC 8-K). Risks and counterpoints: integration execution, the auto cycle and the new shareholder base; it is only one quarter, so no trend yet. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0000903129/000119312526428275/thrm-ex99_1.htm", "stocks": [{"t": "THRM", "n": "Gentherm，合併後首季營收 4.05 億美元，庫藏股動用"}], "status": "RADAR · 下一個驗證點：新股東 13F 變化與下季指引"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "Shore Bancshares（SHBI）：淨息差升到 3.78%，但撥備跳升", "color": "#C9A227", "zh": "這家公司做什麼：馬里蘭州社區銀行控股公司。為什麼被忽視：市值小、覆蓋少。什麼正在改變：第三季淨息差升至 3.78%（第二季 3.70%、去年同期 3.41%），淨利息收入 5,510 萬美元；上一個驗證點是 3.70% 能否守住，答案是守住並提高（SEC 8-K）。風險與反方：扣除加速攤銷收益後淨息差只從 3.45% 到 3.50%，提升多來自一次性；信用損失撥備從 90 萬美元跳到 530 萬美元。這是研究線索，不是投資建議。", "en": "What it does: a Maryland community bank holding company. Why neglected: small market cap and thin coverage. What is changing: third-quarter net interest margin rose to 3.78% (3.70% last quarter, 3.41% a year ago) with net interest income of $55.1 million; the prior checkpoint was whether 3.70% could hold, and it held and improved (SEC 8-K). Risks and counterpoints: excluding accelerated accretion, the margin only moved from 3.45% to 3.50%, so much of the lift is one-time, and the credit loss provision jumped from $0.9 million to $5.3 million. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001035092/000103509226000058/shbi-20260930xexx991.htm", "stocks": [{"t": "SHBI", "n": "Shore Bancshares，淨息差 3.78%，撥備 530 萬美元"}, {"t": "KRE", "n": "區域銀行 ETF，對照"}], "status": "RADAR · 下一個驗證點：不含加速攤銷的淨息差與撥備走勢"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "OBOOK（OWLS）執行長公開市場買進", "color": "#6DB56D", "zh": "OBOOK Holdings（OWLS）執行長 Chun Wang 於 10 月 19 日在公開市場買進 12,192 股，價格約 4.27 美元，市值約 3.76 億美元（GuruFocus 整理的 SEC 申報）。金額約 5.2 萬美元，不大，但屬於執行長自掏腰包買進，不是選擇權行使。判讀提醒：單筆買進不是群聚，要看是否有第二位以上的內部人跟進。", "en": "OBOOK Holdings (OWLS) CEO Chun Wang bought 12,192 shares in the open market on Oct. 19 at about $4.27, with a market cap near $376 million, per GuruFocus's summary of the SEC filing. At about $52,000 the amount is small, but it is the CEO paying with his own money rather than exercising options. Caution: a single purchase is not a cluster, so watch for second and third insiders joining.", "url": "https://www.gurufocus.com/news/9134272/obook-holdings-inc-owls-ceo-chun-wang-buys-12192-shares-in-openmarket-purchase", "stocks": [{"t": "OWLS", "n": "OBOOK，執行長買進 12,192 股，約 4.27 美元"}]},
