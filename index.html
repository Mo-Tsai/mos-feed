/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {

    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;

  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;

  body::before {

    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }

  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }

    {"id": "earn_0", "channel": "財報速報", "tag": "Netflix：10/20 盤後公布第三季", "color": "#E8786A", "zh": "Netflix 預計在 10/20（週二）美股收盤後公布第三季財報，公司於 9/14 的投資人關係公告中已確認日期，通常在美東時間下午 4:01 發布、隨後有管理層訪談。這是下週串流與消費科技類最受矚目的一份，在科技股連兩週走弱的背景下，市場會看高預期能否被兌現。這裡不列共識預期數字，因為搜尋結果沒有可核對的 2026 年數據。", "en": "Netflix is due to report third-quarter results after the close on Tuesday, Oct. 20, a date the company confirmed in a Sept. 14 investor-relations release; results usually post at 4:01 p.m. ET with a management interview afterwards. It is the most-watched streaming and consumer-tech report next week, with tech down two weeks in a row and expectations high. No consensus figures are quoted because the search did not return verifiable 2026 numbers.", "url": "https://www.insiderfinance.io/news/netflix-q3-2026-earnings-oct-20", "stocks": [{"t": "NFLX", "n": "Netflix，10/20 盤後財報，串流龍頭"}, {"t": "DIS", "n": "迪士尼，串流競爭對手，可比較訂閱趨勢"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "Tesla：10/21 盤後公布第三季", "color": "#E8786A", "zh": "Tesla 公告第三季財報將於 10/21（週三）美股收盤後發布，電話會議與網路直播在美東時間下午 5:30（中部 4:30）。Tesla 的投資故事同時牽涉汽車毛利、儲能與自動駕駛的敘事，在 AI 疑慮壓著高估值股的這週，財報後的反應可能被放大。有網站曾列出 10/28 的預估日期，但那只是未確認的推算，應以公司公告的 10/21 為準。", "en": "Tesla said it will report third-quarter results after the U.S. close on Wednesday, Oct. 21, with the webcast at 5:30 p.m. ET (4:30 p.m. Central). The story spans auto margins, energy storage and autonomy, so in a week when AI worries are pressing on richly valued stocks the post-earnings move could be magnified. One site listed Oct. 28 but that was an unconfirmed estimate; the company's Oct. 21 date governs.", "url": "https://www.sec.gov/Archives/edgar/data/0001318605/000162828026064366/exhibit991111111.htm", "stocks": [{"t": "TSLA", "n": "Tesla，10/21 盤後財報"}, {"t": "RIVN", "n": "Rivian，電動車同業，可比較需求與毛利"}, {"t": "ENPH", "n": "Enphase，儲能與太陽能題材的對照"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "下週其他重點：Lam Research、WD、P&G、Amex", "color": "#E8786A", "zh": "外匯週報的下週預告列出，除了 Tesla 與 Netflix，還有半導體設備商 Lam Research、儲存廠 Western Digital、日用品龍頭 P&G 與信用卡公司 Amex 要公布財報（各自的確切日期請以公司公告為準）。這幾家分屬 AI 供應鏈、消費必需品與金融，剛好涵蓋本週資金輪動的兩端：被賣的高估值科技，以及被買的防禦型族群。大型科技股的財報要等到再下一週。", "en": "A weekly FX outlook lists Lam Research, Western Digital, Procter & Gamble and American Express among next week's reporters alongside Tesla and Netflix; exact dates should be checked against company announcements. They cover the AI supply chain, consumer staples and financials, spanning both ends of this week's rotation: richly valued tech being sold and defensive groups being bought. Big tech reports the week after.", "url": "https://www.fxstreet.com/analysis/week-ahead-stocks-seek-direction-as-earnings-take-centre-stage-202610160855", "stocks": [{"t": "LRCX", "n": "Lam Research，晶圓設備，AI 資本支出的受益指標"}, {"t": "WDC", "n": "Western Digital，儲存，AI 資料中心需求"}, {"t": "PG", "n": "寶僑，日用品龍頭，防禦型代表"}, {"t": "AXP", "n": "美國運通，信用卡，消費力的風向球"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "聯準會：10/28 決策前進入靜默期", "color": "#7C6AF7", "zh": "下週聯準會官員進入會前靜默期，公開談話會明顯減少，下一個關鍵日期是 10/28 的決策會議。聯準會已在 9/16 升息一碼到 3.75%–4.00%，主席華許上週五沒有預告 10 月動向，市場價格偏向維持不變。外匯週報也預期聯準會與歐洲央行約十天後都按兵不動。靜默期內沒有官員談話可以參考，市場會更依賴經濟數據與油價來推測 12 月。", "en": "Fed officials enter their pre-meeting blackout next week, so public remarks will thin out ahead of the Oct. 28 decision. The Fed hiked a quarter point to 3.75%-4.00% on Sept. 16, Chair Warsh gave no hint on October on Friday, and markets lean toward a hold. An FX weekly also expects both the Fed and the ECB to stand pat in about ten days. With no Fedspeak, markets will lean on data and oil to handicap December.", "url": "https://www.axios.com/2026/10/16/warsh-federal-reserve-interest-rates", "stocks": [{"t": "SHY", "n": "1–3 年期公債 ETF，對短端利率預期最敏感"}, {"t": "TLT", "n": "長天期公債 ETF，對 12 月升息定價敏感"}, {"t": "XLF", "n": "金融板塊 ETF，利率路徑影響淨利差"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "公債拍賣：下週有 20 年期標售", "color": "#7C6AF7", "zh": "下週的美國行事曆裡有一場 20 年期公債標售，在十年期殖利率剛從 5.364% 的高點回落到約 5% 的時候，標售的需求強弱會被當成長端利率是否穩定的測試。美國財政赤字與債務規模是今年殖利率走高的背景因素之一。標售結果可看得標利率與投標倍數，但單次結果不足以改變趨勢，要和聯準會 10/28 的訊息一起看。", "en": "Next week's U.S. calendar includes a 20-year Treasury auction. With the 10-year yield just off its 5.364% peak and near 5%, demand at the auction will be read as a test of whether long-end rates are stabilising. Federal deficits and debt loads are part of the backdrop to this year's higher yields. Look at the stop-out yield and bid-to-cover, but one auction will not change the trend and should be read with the Fed on Oct. 28.", "url": "https://www.fxstreet.com/analysis/week-ahead-stocks-seek-direction-as-earnings-take-centre-stage-202610160855", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，標售直接相關"}, {"t": "IEF", "n": "7–10 年期公債 ETF，十年期殖利率代表"}, {"t": "KRE", "n": "區域銀行 ETF，持有大量公債與長天期資產"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "政治風險：期中選舉剩 20 天", "color": "#7C6AF7", "zh": "外匯週報提醒，美國期中選舉只剩 20 天，目前民調顯示民主黨可能奪回眾議院，市場把它視為未來財政與立法可能陷入僵局的風險。這類政治訊號通常不會立刻改變單一個股的獲利，但會影響對關稅、補貼與國防預算的預期。在升息、油價與 AI 疑慮同時存在的環境，選舉只是額外的不確定性，不是主因。", "en": "The FX weekly notes that U.S. midterm elections are 20 days away, with Democrats polling to retake the House, which markets treat as a risk of fiscal and legislative gridlock. Such signals rarely change a single company's earnings directly, but they shape expectations on tariffs, subsidies and defense spending. With rate hikes, oil and AI worries all in play, the election is added uncertainty rather than the main driver.", "url": "https://www.fxstreet.com/analysis/week-ahead-stocks-seek-direction-as-earnings-take-centre-stage-202610160855", "stocks": [{"t": "ITA", "n": "航太國防 ETF，對國防預算預期敏感"}, {"t": "XLU", "n": "公用事業 ETF，對補貼與政策方向敏感"}, {"t": "SPY", "n": "大盤 ETF，政治不確定性的整體寄託"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "科技：那指連兩週下跌，預期墊太高", "color": "#4EABA4", "zh": "外匯週報指出，那斯達克 100 與科技股 10 月以來走弱，已經連續第二週收黑；它同時提醒，市場對 AI 概念股的獲利預期可能設得太高。持續的科技賣壓如果擴散，可能波及比特幣等其他風險資產，並支撐美元與公債。這週半導體 ETF 單日跌 4.14%，而財報季才剛開始，下週 Lam Research、Western Digital 的財報會是 AI 供應鏈的下一個檢驗。", "en": "The FX weekly says the Nasdaq 100 and tech stocks have weakened since the start of October and just posted a second straight weekly loss, and warns that earnings expectations for the AI trade may be too high. A persistent tech sell-off could spread to other risk assets such as bitcoin while supporting the dollar and bonds. The semiconductor ETF fell 4.14% on Friday alone, and next week's Lam Research and Western Digital reports are the next test of the AI supply chain.", "url": "https://www.fxstreet.com/analysis/week-ahead-stocks-seek-direction-as-earnings-take-centre-stage-202610160855", "stocks": [{"t": "XLK", "n": "科技板塊 ETF，連兩週走弱"}, {"t": "SOXX", "n": "半導體 ETF，單日 -4.14%"}, {"t": "IBIT", "n": "比特幣現貨 ETF，風險資產外溢的觀察點"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "能源與國防：地緣風險直接寫在漲幅榜", "color": "#4EABA4", "zh": "能源與國防是這週少數同步走強的族群：週五標普漲幅榜上有 FANG、EOG、EQT、APA 等油氣探勘生產股，以及 RTX 與諾斯洛普格魯曼。驅動力是荷姆茲海峽的航運風險、美國原油庫存大減，以及美伊談判停滯與胡塞武裝攻擊沙烏地。風險在於這類走勢高度依賴地緣消息，一旦局勢緩解，油價與相關股票可能快速回吐；而且高油價是通膨的上游，會抵銷部分利率預期的緩和。", "en": "Energy and defense were among the few groups to strengthen together this week: Friday's S&P gainers included explorers and producers such as FANG, EOG, EQT and APA, plus RTX and Northrop Grumman. The drivers are shipping risk in the Strait of Hormuz, a large draw in U.S. crude stocks, stalled US-Iran talks and Houthi attacks on Saudi Arabia. The risk is that such moves depend on geopolitical headlines and can reverse fast if tensions ease, and high oil also feeds inflation, offsetting some of the easing in rate expectations.", "url": "https://www.chartmill.com/news/DDOG/Chartmill-56349-SP-500-Top-Movers-Todays-Gainers-and-Losers", "stocks": [{"t": "XLE", "n": "能源板塊 ETF"}, {"t": "ITA", "n": "航太國防 ETF"}, {"t": "EQT", "n": "EQT，天然氣生產商，週五漲幅榜"}, {"t": "NOC", "n": "諾斯洛普格魯曼，國防，週五漲幅榜"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000 修正：週五 -1.03% 收 2,738.83", "color": "#5B8ED6", "zh": "羅素 2000 週五下跌 1.03% 收 2,738.83，單週下跌 2.43%，較 8 月高點約 3,063 回落約 10.6%（依一份分析所引的高點推算），已經進入技術性修正區。彭博與 CNBC 都把原因歸於通膨、利率上升與資金回到大型科技的情緒轉變，但這週科技股本身也在大跌，顯示小型股承受的是利率面的壓力，不是單純的資金輪動。週四它曾單日大漲 1.38%，週五就全數吐回。", "en": "The Russell 2000 fell 1.03% on Friday to 2,738.83 and 2.43% on the week, about 10.6% below the roughly 3,063 August high cited in one analysis, which puts it in technical correction territory. Bloomberg and CNBC pointed to inflation, higher rates and a shift back to big tech, yet tech itself sold off hard this week, suggesting small caps are under pressure from rates rather than simple rotation. The index jumped 1.38% on Thursday and gave it all back on Friday.", "url": "https://cnbc.com/2026/10/15/small-cap-stocks-slide-into-correction-territory.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，修正區"}, {"t": "IJR", "n": "標普小型 600 ETF，品質較高的小型股對照"}, {"t": "KRE", "n": "區域銀行 ETF，小型金融股的代表"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "判讀：分拆股的第一個月，常常是被迫賣出的月份", "color": "#5B8ED6", "zh": "一份較早期的研究（Thomson Financial 對約 200 件分拆案的統計）顯示，分拆新股在上市後一個月的中位數報酬約 -2.1%，之後三個月回升約 1.6%。常見的解釋是母公司股東與指數基金不一定想持有新公司，造成早期賣壓，之後隨分析師開始追蹤才慢慢被重新定價。這是歷史統計，不是預測；每一件分拆案的資產、債務與管理團隊差異極大，要逐案看資料。", "en": "An older study of about 200 spin-offs by Thomson Financial found the median new stock fell about 2.1% in the first month and then rose about 1.6% over the following three months. A common explanation is that parent shareholders and index funds may not want the new shares, creating early selling pressure, with repricing as analysts begin to cover the stock. This is historical, not a forecast, and each spin-off differs in assets, debt and management.", "url": "https://www.crossingwallstreet.com/archives/2007/page/27", "stocks": [{"t": "MSGR", "n": "MSG Rangers，10/26 前後完成分拆的案例"}, {"t": "THRM", "n": "Gentherm，10/1 合併後股本接近翻倍的事件型案例"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "MSG Rangers（MSGR）：紀錄日 10/20，分拆預計 10/26", "color": "#C9A227", "zh": "MSG Sports 董事會批准把紐約遊騎兵（Rangers）及其附屬事業分拆為獨立公司 MSG Rangers，紀錄日是 10/20，預計 10/26 前後完成，每持有兩股 MSG Sports 股票可得一股 MSGR，不需任何動作。母公司會改名為 MSG Knickerbockers（代號 MSGK），新公司將在紐約證交所以 MSGR 掛牌；有資料指出預發行（when-issued）交易自 10/21 開始，但官方新聞稿沒有寫明，請以交易所公告為準。被忽視的原因：新分拆股還沒有分析師覆蓋，早期常有被動賣壓。風險：單一球隊事業的收入集中在門票、轉播與贊助。這是研究線索，不是投資建議。", "en": "MSG Sports' board approved spinning off the New York Rangers business as MSG Rangers, with a record date of Oct. 20 and completion expected around Oct. 26; holders get one MSGR share for every two MSG Sports shares with no action needed. The parent will be renamed MSG Knickerbockers (MSGK) and the new company will list on the NYSE as MSGR. One source says when-issued trading begins Oct. 21 but the official release does not state it, so check exchange notices. Why overlooked: no analyst coverage yet and early passive selling is common. Risk: a single-team business concentrated in gate, media and sponsorship revenue. This is a research lead, not investment advice.", "url": "https://s23.q4cdn.com/716592820/files/doc_news/2026/10/Press-Release-Spin-MSGS-Board-Approval-FINAL.pdf", "stocks": [{"t": "MSGR", "n": "MSG Rangers，新分拆公司，紀錄日 10/20"}, {"t": "MSGS", "n": "MSG Sports，母公司，分拆後改名 MSG Knickerbockers"}], "status": "RADAR · 下一個驗證點 10/20 紀錄日、10/26 完成分拆"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "Gentherm（THRM）：合併後首季，10/22 開電話會議", "color": "#C9A227", "zh": "Gentherm 做座椅溫控與熱管理，10/1 完成與 Modine Performance Technologies 的合併，新發行 23,735,961 股、換股比例 0.44619，合併後約 43.62% 股份由 Modine 股東持有。公司已公告 10/22（週四）美東早上 8:00 召開第三季電話會議，這是合併後的第一季。被忽視的原因不算典型：分析師覆蓋約四買四持有，重點在於股本接近翻倍帶來的換手。風險：整合風險與股本稀釋，我沒有找到實際賣壓資料。這是研究線索，不是投資建議。", "en": "Gentherm makes seat climate and thermal-management products and closed its combination with Modine Performance Technologies on Oct. 1, issuing 23,735,961 new shares at an exchange ratio of 0.44619, leaving about 43.62% held by former Modine holders. It will hold its third-quarter call on Thursday Oct. 22 at 8:00 a.m. ET, the first quarter after the deal. The neglect case is atypical: analysts are roughly four buy and four hold, and the angle is the share turnover from a near-doubled share count. Risks: integration and dilution, and I found no data on actual selling pressure. This is a research lead, not investment advice.", "url": "https://www.quiverquant.com/news/Gentherm+to+Report+Third+Quarter+2026+Financial+Results+on+October+22%2C+2026", "stocks": [{"t": "THRM", "n": "Gentherm，10/22 美東 8:00 Q3 電話會議"}, {"t": "MOD", "n": "Modine，合併對手方，其股東取得 THRM 股份"}], "status": "RADAR · 下一個驗證點 10/22 Q3 財報（合併後首季）"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "Shore Bancshares（SHBI）：10/22 財報看淨利差能否守住 3.70%", "color": "#C9A227", "zh": "Shore Bancshares 是美國東部的社區銀行控股公司，分析師覆蓋稀疏。拐點證據：董事 Esham 在 2 月買進 5,000 股、約 10 萬美元；第二季淨利差擴大 6 個基點到 3.70%。預計 10/22 公布第三季財報，重點是淨利差能不能守住。風險：第二季淨利差有一部分來自貸款提前還款的一次性收益，而且內部人買進並非連續。Simply Wall St 的模型估算約有 36.6% 折價，僅供參考。這是研究線索，不是投資建議。", "en": "Shore Bancshares is a U.S. East Coast community bank holding company with thin analyst coverage. Turning-point evidence: director Esham bought 5,000 shares, about $100,000, in February, and second-quarter net interest margin widened 6 basis points to 3.70%. Third-quarter results are expected Oct. 22, with the question being whether the margin holds. Risks: part of the Q2 margin came from one-time loan prepayment gains, and the insider buying was not continuous. A Simply Wall St model estimates a 36.6% discount, for reference only. This is a research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/banks/nasdaq-shbi/shore-bancshares/news/insider-buys-additional-us101k-in-shore-bancshares-stock", "stocks": [{"t": "SHBI", "n": "Shore Bancshares，社區銀行，淨利差 3.70%"}, {"t": "KRE", "n": "區域銀行 ETF，同業情緒對照"}], "status": "RADAR · 下一個驗證點 10/22 Q3 財報"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "Kemper（KMPR）：加價與收緊承保，等第三季綜合成本率", "color": "#C9A227", "zh": "Kemper 經營特殊型汽車保險與壽險。股價從一年前約 49 美元掉到 8 月約 26.5 美元，市值約 35 億美元，第二季淨損 4.65 億美元。拐點證據：8 月財報後執行長（約 8 萬美元）、董事 Laderman（約 10.6 萬美元）與法務長都買進，新任執行長 6/1 到任，策略轉為加價與收緊承保。風險：第二季特殊型個人車險綜合成本率 105.0%（加州 107.3%），內部人買進金額相對市值很小。第三季財報日期尚待確認，要看綜合成本率能否回到 100% 以下。這是研究線索，不是投資建議。", "en": "Kemper writes nonstandard auto and life insurance. The stock fell from about $49 a year ago to about $26.5 in August, a market value near $3.5 billion, after a $465 million second-quarter net loss. Turning-point evidence: after the August results the CEO (about $80,000), director Laderman (about $106,000) and the general counsel bought shares, and a new CEO who started June 1 shifted to rate increases and tighter underwriting. Risks: Q2 nonstandard personal auto combined ratio was 105.0% (107.3% in California), and the insider purchases are small versus market value. The Q3 date is still to be confirmed; the test is whether the combined ratio returns below 100%. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0000860748/000086074826000084/kmpr-20260630.htm", "stocks": [{"t": "KMPR", "n": "Kemper，特殊型車險，Q2 綜合成本率 105.0%"}, {"t": "ALL", "n": "Allstate，車險大型同業，可比較費率與賠付趨勢"}], "status": "RADAR · 下一個驗證點 Q3 財報（日期待確認）：綜合成本率是否低於 100%"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "Sky Harbour（SKYH）：財務長連續小額買進，仍待核對", "color": "#6DB56D", "zh": "雷達池追蹤的 Sky Harbour 是商務航空機庫園區的開發商與出租方。池內紀錄顯示財務長 Francisco Gonzalez 在 8/18、9/11、9/30 與 10/1 連續四次買進，每次約 1,000–1,600 股、價格 9.40–10.05 美元，靠近 52 週區間（8.22–11.70）的下緣。但單筆金額只有約 1.5 萬美元，無法得知動機，而且追蹤站另列的 3,850 股、9.25 美元那筆尚未核對 Form 4。重點是「連續」而不是「金額」，下一個驗證點是 11 月財報與下一次 Form 4。", "en": "The radar pool tracks Sky Harbour, a developer and lessor of business-aviation hangar campuses. Pool notes show CFO Francisco Gonzalez bought four times, on Aug. 18, Sept. 11, Sept. 30 and Oct. 1, about 1,000-1,600 shares each at $9.40-$10.05, near the low end of the 52-week range of $8.22-$11.70. Each purchase is only about $15,000 so motives are unknowable, and a separate 3,850-share buy at $9.25 on a tracker site has not been checked against Form 4. The point is the repetition, not the size; the next checks are the November results and the next Form 4.", "url": "https://www.insidertrades.com/alerts/nyse-skyh-insider-buying-and-selling-2026-08-20/", "stocks": [{"t": "SKYH", "n": "Sky Harbour，財務長四次買進，金額小"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "判讀：內部人買進要先看是不是財報後的視窗", "color": "#6DB56D", "zh": "上市公司的內部人在財報公布前後通常有交易封閉期，所以公開市場的買進多半集中在財報之後的視窗，這也是為什麼 Kemper 的買進出現在 8 月財報之後。另外，10b5-1 計畫是事先安排好的交易，信號比自主決定弱；只有交易代碼 P 才是公開市場買進，選擇權行使或授予不算。實務上應優先看：多位內部人、在短時間內、金額相對自己持股夠大、且價格接近低點。仍須回到 EDGAR 的 Form 4 核對。", "en": "Insiders typically face trading blackout periods around earnings, so open-market buys cluster in the window after results, which is why Kemper's purchases came after its August report. Trades under a 10b5-1 plan are pre-arranged and carry a weaker signal, and only transaction code P marks an open-market purchase, not option exercises or grants. In practice look for several insiders, in a short span, with amounts meaningful relative to their holdings and near price lows, and always verify on EDGAR Form 4.", "url": "https://www.heygotrade.com/en/blog/insider-buying-bullish-signal-how-to-track-without-bloomberg/", "stocks": [{"t": "KMPR", "n": "Kemper，8 月財報後三位內部人買進的例子"}, {"t": "SHBI", "n": "Shore，2 月董事買進，非連續"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "一組有主題的申報：Pelosi 近 90 天 6 筆買進，集中在 BE 與 INTC", "color": "#B5654D", "zh": "依眾議院書記官的官方 PTR 索引，我們彙整近 90 天的申報：Nancy Pelosi 共 6 筆，全是買進，標的只有兩檔，Bloom Energy（BE）與 Intel（INTC），金額區間合計約 375 萬至 1,350 萬美元，最新一份申報日為 10/2。這是少數筆數少、但主題集中的名單：押的是 AI 用電需求與本土晶片、能源。PTR 只給金額區間，且可延遲 45 天申報，所以它是有人用真錢投票給某個主題的紀錄，不是買賣訊號。", "en": "In the House Clerk's official PTR index for the past 90 days, Nancy Pelosi filed 6 transactions, all buys, in just two names, Bloom Energy (BE) and Intel (INTC), with a combined value range of roughly $3.75 million to $13.5 million; the latest filing is dated Oct. 2. It is one of the few lists with few trades but a clear theme, AI power demand and domestic chips and energy. PTRs give only value ranges and can be filed up to 45 days late, so this records someone voting a theme with real money, not a trading signal.", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035553.pdf", "stocks": [{"t": "BE", "n": "Bloom Energy，燃料電池，AI 資料中心供電題材"}, {"t": "INTC", "n": "Intel，本土晶片製造與政府支持題材"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "判讀：筆數多不等於金額大，Cisneros 126 筆對 Pelosi 6 筆", "color": "#B5654D", "zh": "同一份 90 天名單裡，Gilbert Cisneros 申報了 126 筆交易（96 筆買進、28 筆賣出，涉及 107 檔不同代號），金額區間約 55 萬至 293 萬美元；Kevin Hern 有 78 筆，其中 74 筆是賣出。對照 Pelosi 只有 6 筆卻達 375 萬至 1,350 萬美元，說明追蹤誰最活躍和追蹤誰押得最重是兩回事。多數交易由配偶或信託帳戶執行，跟單者實際買到的是別人最多 45 天前的價位。這個頻道只寫誰申報了什麼，不做動機推論。", "en": "In the same 90-day list Gilbert Cisneros filed 126 transactions (96 buys and 28 sells across 107 distinct tickers) with a value range of about $547,000 to $2.93 million, and Kevin Hern filed 78, of which 74 were sales. Against Pelosi's 6 trades worth $3.75 million to $13.5 million, tracking who is most active and who is betting the heaviest are different questions. Many trades are made through spouse or trust accounts, and anyone copying them buys at prices up to 45 days stale. This channel only reports who filed what, with no inference about motive.", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035622.pdf", "stocks": [{"t": "EPAC", "n": "Enerpac，Cisneros 申報的前幾檔之一"}, {"t": "ALKS", "n": "Alkermes，醫療，Cisneros 申報的前幾檔之一"}, {"t": "BSX", "n": "波士頓科學，Hern 申報的前幾檔之一"}]},
    {"id": "week_0", "channel": "本週事件", "tag": "下週數據：中國經濟數據、美國房市、加拿大 CPI", "color": "#C97DD4", "zh": "下週的總經行事曆：週一（10/19）中國公布 9 月新屋價格、零售銷售、工業生產與第三季 GDP；週二（10/20）美國公布新屋開工與建築許可；週三加拿大公布 CPI，可能影響加拿大央行升息預期；週五（10/23）歐元區公布初值 PMI，並有美國 PMI 與密大信心終值。英國的勞動市場、通膨與零售銷售也集中在下週，是英國央行升息預期的關鍵。這裡不列共識預期，因為來源沒有可核對的 2026 年數字。", "en": "Next week's macro calendar: on Monday Oct. 19 China releases September new home prices, retail sales, industrial output and Q3 GDP; on Tuesday Oct. 20 U.S. housing starts and permits; on Wednesday Canadian CPI, which could move Bank of Canada hike bets; and on Friday Oct. 23 preliminary eurozone PMIs plus U.S. PMIs and the final University of Michigan sentiment. UK labour, inflation and retail sales also land next week, key for Bank of England hike bets. No consensus figures are given because the sources had no verifiable 2026 numbers.", "url": "https://www.fxstreet.com/analysis/week-ahead-stocks-seek-direction-as-earnings-take-centre-stage-202610160855", "stocks": [{"t": "FXI", "n": "中國大型股 ETF，週一中國數據的直接觀察"}, {"t": "XHB", "n": "美國房屋建築商 ETF，週二新屋開工"}, {"t": "EWC", "n": "加拿大 ETF，週三加拿大 CPI"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "下週財報：週一銀行與藥廠，週二工業航太，週三 Tesla", "color": "#C97DD4", "zh": "週一（10/19）盤前有 Abbott、AT&T、BankUnited、CME、Danaher，Fifth Third 也預計週一盤前公布；週二（10/20）清單很長，包括 GE Aerospace、RTX、3M、通用汽車、諾斯洛普格魯曼、Halliburton，以及盤後的 Netflix；週三（10/21）盤後是 Tesla。Meta 的日期各來源說法不一，外匯週報稱大型科技在再下一週，請以公司公告為準。週四（10/22）早上有 Gentherm 與 Shore Bancshares 這兩檔雷達池名字。", "en": "On Monday Oct. 19 before the open Abbott, AT&T, BankUnited, CME and Danaher report, with Fifth Third also expected; Tuesday Oct. 20 brings a long list including GE Aerospace, RTX, 3M, General Motors, Northrop Grumman and Halliburton, with Netflix after the close; Wednesday Oct. 21 after the close is Tesla. Sources differ on Meta's date, and the FX weekly places big tech the week after, so check the company announcement. Thursday Oct. 22 brings two radar-pool names, Gentherm and Shore Bancshares.", "url": "https://www.kiplinger.com/investing/stocks/17494/next-week-earnings-calendar-stocks", "stocks": [{"t": "GE", "n": "GE Aerospace，10/20 盤前，航太循環"}, {"t": "RTX", "n": "RTX，10/20 盤前，國防與商用航太"}, {"t": "FITB", "n": "Fifth Third，10/19 盤前，區域銀行風向"}, {"t": "GM", "n": "通用汽車，10/20 盤前，汽車需求與關稅"}]},
