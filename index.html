<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====

  { key: "財報速報", color: "#E8786A" },

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
  {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "收平待變", "color": "#E05C5C", "stocks": [{"t": "DIA", "n": "道瓊ETF，道瓊跌 113.52 點、0.21% 收 53,463.88"}, {"t": "SPY", "n": "標普500 ETF，指數僅跌 1.58 點、0.02% 收 7,675.70"}, {"t": "QQQ", "n": "那斯達克100 ETF，那指綜合跌 21.10 點、0.08% 收 26,130.20"}], "en": "US stocks finished Wednesday essentially flat. The Dow fell 113.52 points, or 0.21%, to 53,463.88; the S&P 500 slipped just 1.58 points, or 0.02%, to 7,675.70; and the Nasdaq Composite eased 21.10 points, or 0.08%, to 26,130.20. Two things pinned the tape: July PCE came in slightly hot on the headline, and nobody wanted a position before Nvidia reported after the bell. A one-point move in the S&P is not indecision about direction, it is a market that has decided to wait.", "zh": "週三美股基本上收平：道瓊跌 113.52 點、跌 0.21% 收 53,463.88，標普 500 只跌 1.58 點、跌 0.02% 收 7,675.70，那斯達克綜合指數跌 21.10 點、跌 0.08% 收 26,130.20。把盤面釘住的有兩件事：7 月 PCE 的整體數字略高於預期，以及沒有人想在輝達盤後財報前留部位。標普只動一個點不是對方向沒共識，而是市場決定先不動。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-wednesday-august-26-dow-sp-500-nasdaq-081834782.html"},
  {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "商品沉默", "color": "#E05C5C", "stocks": [{"t": "GLD", "n": "黃金ETF，金價 4,657.00 美元、微漲 0.08%"}, {"t": "USO", "n": "原油ETF，西德州原油 82.07 美元、跌 0.19%"}, {"t": "TLT", "n": "20年期以上公債ETF，長天期殖利率是本週最大的變數"}], "en": "The commodity complex was as quiet as equities. Gold ticked up 0.08% to $4,657.00, WTI crude eased 0.19% to $82.07, and bitcoin slipped 0.19% to $78,723. Note what did not happen: a hot headline PCE print did not push gold up or oil down in any meaningful way. When every asset class refuses to react to real data, the market is telling you the data it actually cares about has not arrived yet.", "zh": "商品市場跟股市一樣安靜：黃金微漲 0.08% 至 4,657.00 美元，西德州原油跌 0.19% 至 82.07 美元，比特幣跌 0.19% 至 78,723 美元。值得注意的是「沒發生的事」——整體 PCE 高於預期，卻沒有把金價推上去、也沒有把油價壓下來。當每個資產類別都拒絕對真實數據做反應，市場其實在告訴你：它真正在等的數據還沒到。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-wednesday-august-26-dow-sp-500-nasdaq-081834782.html"},
  {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "和解定價", "color": "#E05C5C", "stocks": [{"t": "META", "n": "與 29 州達成 167 億美元社群成癮訴訟和解"}, {"t": "PINS", "n": "同屬社群平台，青少年使用時長規範的連帶對象"}, {"t": "SNAP", "n": "市值較小，同類監管成本對它的相對衝擊更大"}], "en": "Meta settled a social media addiction suit brought by 29 states for $16.7 billion, agreeing to daily usage limits and stronger age verification for teenagers. The number is large but the structural part matters more: Meta has now accepted product-level constraints on how minors use its apps, which is a permanent change to the engagement math rather than a one-off charge. Smaller platforms carrying the same regulatory exposure on a much smaller revenue base are the ones to watch.", "zh": "Meta 與 29 個州達成社群成癮訴訟的和解，金額 167 億美元，同時同意對青少年實施每日使用時間上限與更嚴格的年齡驗證。金額很大，但真正重要的是結構性的那一半：Meta 等於接受了「產品層級」的未成年使用限制，這是對互動時長模型的永久性改動，而不是一次性的認列費用。接下來要看的是那些承擔同樣監管風險、但營收基期小得多的平台。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-wednesday-august-26-dow-sp-500-nasdaq-081834782.html"},
  {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "稀釋換算力", "color": "#E05C5C", "stocks": [{"t": "BABA", "n": "8/26 完成 102 億美元配售，宣布當週股價一度重挫 10%"}, {"t": "JD", "n": "同屬中概電商，被連帶當成資金撤出的提款機"}, {"t": "PDD", "n": "不走重資本 AI 路線，成為這次稀釋事件的相對受益者"}], "en": "Alibaba completed its HK$80 billion placement on August 26, selling 710 million new shares at HK$112.70 to raise about $10.2 billion, with 100% of proceeds earmarked for AI infrastructure. Shares fell roughly 10% when the pricing landed, days after the company reported a 75% profit drop driven by that same AI spending. This is the cleanest example this year of a company openly choosing dilution now over capacity constraints later, and letting shareholders price the trade-off.", "zh": "阿里巴巴在 8 月 26 日完成 800 億港元的股份配售，以每股 112.70 港元發行 7.1 億股新股、募資約 102 億美元，並言明所得資金 100% 投入 AI 基礎建設。定價公布當天股價一度重挫約 10%，而在那之前幾天，公司才剛公布因為同一筆 AI 支出導致獲利年減 75%。這是今年最乾淨的一個案例：公司公開選擇「現在稀釋」而不是「以後算力不夠」，然後讓股東自己去替這個取捨定價。", "url": "https://www.cnbc.com/2026/08/24/alibaba-share-placement-drop-ai-hong-kong.html"},
  {"id": "earn_0", "channel": "財報速報", "tag": "輝達交卷", "color": "#E8786A", "stocks": [{"t": "NVDA", "n": "Q2 營收 962 億美元、年增 106%，盤後漲約 4.3% 至 218.67 美元"}, {"t": "TSM", "n": "所有 Blackwell 晶片的代工方，直接吃到這條產能"}, {"t": "VRT", "n": "資料中心電力與散熱設備，資本支出往下游外溢的第一站"}], "en": "Nvidia reported Q2 FY2027 revenue of $96.2 billion, up 106% year-over-year and 18% sequentially, with data centre revenue at $89.0 billion, up 117%. Gross margin was 75.0% and GAAP net income $59.7 billion. Guidance for Q3 is $108.0 billion plus or minus 2%, and the single most important line is that this figure assumes zero data centre compute revenue from China. Shares rose about 4.3% to $218.67 after hours on 1.5 times normal volume.", "zh": "輝達公布 FY2027 第二季財報：營收 962 億美元、年增 106%、季增 18%，其中資料中心 890 億美元、年增 117%，毛利率 75.0%，GAAP 淨利 597 億美元。下一季指引給到 1,080 億美元上下 2%，而整份財報最關鍵的一句話是：這個數字「不假設任何來自中國的資料中心運算營收」。等於管理層把最大的政治不確定性直接從模型裡拿掉。盤後股價漲約 4.3% 到 218.67 美元，成交量是平常的 1.5 倍。", "url": "https://www.stocktitan.net/news/NVDA/nvidia-announces-financial-results-for-second-quarter-fiscal-98x41cxh35vk.html"},
  {"id": "earn_1", "channel": "財報速報", "tag": "資安加速", "color": "#E8786A", "stocks": [{"t": "CRWD", "n": "營收 14.7 億美元、年增 26%，盤後一度漲 12%"}, {"t": "PANW", "n": "同為平台型資安商，被拿來對照淨新增訂閱動能"}, {"t": "S", "n": "SentinelOne，端點防護的小型競爭者，會被連帶重評價"}], "en": "CrowdStrike posted Q2 FY2027 revenue of $1.47 billion, up 26%, and adjusted EPS of $0.31, both ahead of the $1.44 billion and $0.29 consensus. The number that moved the stock was net new ARR of $332.8 million, a company record and up 51% year-over-year, taking total ARR to $5.84 billion. Management lifted full-year net new ARR growth guidance by 630 basis points to 34% at the midpoint. Shares jumped as much as 12% in extended trading.", "zh": "CrowdStrike 公布 FY2027 第二季營收 14.7 億美元、年增 26%，調整後每股獲利 0.31 美元，雙雙超過市場預期的 14.4 億與 0.29 美元。真正推動股價的是淨新增年度經常性收入 3.328 億美元——公司史上最高、年增 51%，把總 ARR 推到 58.4 億美元。管理層同時把全年淨新增 ARR 成長指引的中位數上調 630 個基點到 34%。盤後股價一度漲 12%。", "url": "https://qz.com/crowdstrike-earnings-q2-fiscal-2027-revenue-arr-guidance-082626"},
  {"id": "earn_2", "channel": "財報速報", "tag": "退稅暴衝", "color": "#E8786A", "stocks": [{"t": "ANF", "n": "Abercrombie & Fitch 週三暴漲 35.67%，EPS 4.17 美元遠超預估 1.98"}, {"t": "AEO", "n": "American Eagle，同客層青少年服飾的直接對照組"}, {"t": "URBN", "n": "Urban Outfitters，同樣有進口成本曝險的中價位服飾商"}], "en": "Abercrombie & Fitch surged 35.67% on Wednesday after Q2 EPS of $4.17 blew past the $1.98 consensus on record second-quarter net sales of $1.27 billion, up 5%. Read the composition before extrapolating: about $100 million of tariff refunds flowed through as a reduction in cost of sales and contributed an estimated $1.75 per diluted share. The core business did beat on its own, and management raised full-year EPS guidance to $13.10-$13.60 from $10.20-$11.00 while committing to at least $500 million of buybacks.", "zh": "Abercrombie & Fitch 週三暴漲 35.67%，第二季每股獲利 4.17 美元遠遠超過市場預估的 1.98 美元，淨銷售額 12.7 億美元、年增 5%，創同期新高。但外推之前要先拆結構：約 1 億美元的關稅退稅是以「銷貨成本的減項」認列，估計貢獻了每股 1.75 美元。扣掉這塊，本業本身確實也超預期，管理層同時把全年 EPS 指引從 10.20-11.00 美元上調到 13.10-13.60 美元，並承諾今年至少買回 5 億美元股票。", "url": "https://finance.yahoo.com/markets/stocks/articles/abercrombie-fitch-raises-full-outlook-131700391.html"},
  {"id": "macro_0", "channel": "總經政策", "tag": "黏著通膨", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債ETF，核心 PCE 年增 3.3% 仍遠高於 2% 目標"}, {"t": "SHY", "n": "1-3年期公債ETF，短端最直接反映降息路徑的定價"}, {"t": "XLP", "n": "必需消費ETF，商品價格月減 0.1%、服務月增 0.3% 的分化受害方"}], "en": "July PCE landed on Wednesday morning. Headline rose 3.7% year-over-year, slightly above forecast, while core PCE rose 0.2% on the month and 3.3% annually, both in line. The split underneath is the story: goods prices fell 0.1% on the month while services rose 0.3%. Goods disinflation is doing the work and services are refusing to cooperate, which is exactly the composition that makes a rate-cutting case hard to argue in public.", "zh": "7 月 PCE 物價數據在週三早上落地：整體年增 3.7%，略高於預期；核心 PCE 月增 0.2%、年增 3.3%，兩個都符合預期。真正的故事在底下的分化——商品價格月減 0.1%，服務價格月增 0.3%。也就是說，通膨降溫的功勞全在商品端，服務端完全不配合。這正是最難公開替降息辯護的組合：數字看起來不算失控，但下降的動能來自最容易反轉的那一半。", "url": "https://www.cnbc.com/2026/08/26/feds-preferred-inflation-gauge-shows-core-prices-rose-3point3percent-annually-in-july.html"},
  {"id": "macro_1", "channel": "總經政策", "tag": "首演在即", "color": "#7C6AF7", "stocks": [{"t": "KRE", "n": "區域銀行ETF，支付與金融創新政策的直接對象"}, {"t": "COIN", "n": "Coinbase，年會主題點名支付創新，法規語氣影響最大的一檔"}, {"t": "PYPL", "n": "PayPal，傳統數位支付方，被新支付軌道兩面夾擊"}], "en": "The Jackson Hole symposium runs August 27 to 29, and Fed Chair Kevin Warsh delivers his first keynote as Chair on Friday at 10:00 a.m. ET. The theme this year is Financial Innovation: Implications for Payments and Policy, which is unusually specific. A first keynote is where a new Chair lays out how he thinks rather than what the committee decided, so the framing of inflation persistence and of the long end of the curve will matter more than any rate hint.", "zh": "傑克遜洞年會 8 月 27 日至 29 日舉行，Fed 主席 Kevin Warsh 將在週五美東時間上午 10 點發表他就任主席後的第一場主題演說。今年的主題是「金融創新：對支付與政策的意涵」，題目訂得異常具體。新主席的第一場演說通常不是在講委員會決定了什麼，而是在攤開他怎麼想事情——所以他如何描述通膨的黏著性、如何看待殖利率曲線的長端，會比任何利率暗示都更值得逐字讀。", "url": "https://www.mnimarkets.com/articles/chair-warsh-to-give-jackson-hole-keynote-speech-aug-28-at-10am-et-1787258124058"},
  {"id": "macro_2", "channel": "總經政策", "tag": "消費縮手", "color": "#7C6AF7", "stocks": [{"t": "XRT", "n": "零售ETF，7 月消費者面對持續漲價已開始縮手"}, {"t": "DG", "n": "Dollar General，消費降級時的資金流入方"}, {"t": "LOW", "n": "Lowe's，大額耐久財支出對利率與信心最敏感"}], "en": "The same PCE release carried a second message that got less attention: consumers pulled back on spending in July in the face of continuing price pressures. That pairing, sticky services inflation plus a spending pullback, is the uncomfortable one, because it removes the easy story where strong demand justifies high prices. Today at 8:30 a.m. ET brings initial jobless claims for the week ended August 22, the advance goods trade balance, and wholesale and retail inventories.", "zh": "同一份 PCE 報告裡還有一個比較少人談的訊息：面對持續的價格壓力，消費者在 7 月縮手了。「服務通膨黏著」加上「消費支出走弱」是最不舒服的組合，因為它把「需求強勁所以漲價合理」這個好講的故事拿掉了。今天美東時間早上 8:30 會公布截至 8 月 22 日當週的初領失業金人數、7 月商品貿易帳初值，以及批發與零售庫存。", "url": "https://us.cnn.com/2026/08/26/economy/pce-consumer-spending-inflation-july"},
  {"id": "sector_0", "channel": "產業風向", "tag": "晶片轉單", "color": "#4EABA4", "stocks": [{"t": "SOXX", "n": "半導體ETF，費城半導體指數本月已漲逾 10%"}, {"t": "MU", "n": "美光，記憶體是資料中心資本支出彈性最大的一環"}, {"t": "AMAT", "n": "應用材料，設備端吃的是產能擴張而非單季出貨"}], "en": "Semiconductors had already run more than 10% this month going into Wednesday's print, which is why the sector's next move is more about positioning than about the number itself. The useful split now is between compute silicon, memory, and equipment. Memory carries the most torque to a data centre capex cycle because it scales with system count, while equipment makers get paid on capacity decisions that are made quarters ahead of any single shipment.", "zh": "半導體在週三財報前，本月已經漲了超過 10%，所以這個板塊接下來的動作，關鍵在部位而不在數字本身。現在比較有用的切法，是把運算晶片、記憶體、設備分開看。記憶體對資料中心資本支出的彈性最大，因為它是跟著系統台數等比例放大的；設備商賺的則是「產能決策」的錢，而產能決策往往比任何一季的出貨早好幾個季度就拍板。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-wednesday-august-26-dow-sp-500-nasdaq-081834782.html"},
  {"id": "sector_1", "channel": "產業風向", "tag": "輪動換手", "color": "#4EABA4", "stocks": [{"t": "XLE", "n": "能源類股ETF，近期以 1.76% 漲幅在十一個板塊中居首"}, {"t": "XLV", "n": "醫療類股ETF，緊追在後上漲 1.60%"}, {"t": "XLK", "n": "科技類股ETF，動能相對轉弱，資金正在往外擴散"}], "en": "Sector leadership has been shifting. Energy led the eleven S&P sectors with a 1.76% gain, followed by health care at 1.60%, while technology and industrials lost relative momentum. The mechanism worth understanding is not that money is leaving AI, it is that money is moving down the AI chain, from hardware suppliers toward software applications and toward the end industries that will use the capacity. Broadening leadership usually extends a cycle rather than ending it.", "zh": "板塊的領導權正在換手：能源以 1.76% 的漲幅在標普十一個板塊中居首，醫療以 1.60% 緊追在後，科技與工業的相對動能則轉弱。值得理解的機制不是「錢在離開 AI」，而是「錢在沿著 AI 這條鏈往下走」——從硬體供應商，往軟體應用、再往最終會使用這些算力的產業移動。領導權變寬通常是把循環拉長，而不是把循環結束掉。", "url": "https://kalkine.com/news/premium/us-sector-performance-analysis-energy-and-health-care-lead-as-technology-retreats"},
  {"id": "sector_2", "channel": "產業風向", "tag": "電力瓶頸", "color": "#4EABA4", "stocks": [{"t": "ETN", "n": "伊頓，資料中心配電與電力管理設備的主要供應商"}, {"t": "PWR", "n": "Quanta Services，電網與輸配電工程承包，吃的是併網排隊"}, {"t": "GEV", "n": "GE Vernova，發電設備端，燃氣與電網訂單能見度最長"}], "en": "When a chipmaker guides to $108 billion of quarterly revenue, the binding constraint stops being silicon and becomes electricity. Every rack needs interconnection, distribution gear, and cooling, and the queue for grid connection is now measured in years in several US regions. This is why the power equipment and grid engineering names have started to trade as AI derivatives, with the difference that their order books have far longer visibility than a chip cycle does.", "zh": "當一家晶片公司把單季營收指引給到 1,080 億美元，真正的瓶頸就不再是矽，而是電。每一座機櫃都要併網、要配電設備、要散熱，而美國好幾個區域的併網排隊時間現在是以「年」計算的。這就是為什麼電力設備與電網工程的公司開始被當成 AI 的衍生標的來交易——差別在於，它們的訂單能見度比晶片循環長得多。", "url": "https://www.stocktitan.net/news/NVDA/nvidia-announces-financial-results-for-second-quarter-fiscal-98x41cxh35vk.html"},
  {"id": "small_0", "channel": "小型股風雲", "tag": "23年最強", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，指數 8/13 收 3,052.85，是 2026 年第 27 次歷史新高"}, {"t": "VTWO", "n": "Vanguard 羅素2000 ETF，同一個池子的低費率選擇"}, {"t": "RSP", "n": "標普500等權重ETF，市場廣度擴散的另一個觀察窗"}], "en": "The Russell 2000 is having its best year since 2003. It set a record close of 3,052.85 on August 13, its 27th record of 2026, and is up 23% on the year, leading the S&P 500 by 9.1 percentage points. The driver is not a single theme. It is a historic valuation gap closing, a stabilising rate environment, and an AI narrative that has moved from hardware buildout toward the companies that will use the capacity.", "zh": "羅素 2000 正在走 2003 年以來最強的一年。它在 8 月 13 日收在 3,052.85 的歷史新高，是 2026 年的第 27 次新高，年內漲幅 23%，領先標普 500 達 9.1 個百分點。推動它的不是單一主題，而是三件事同時發生：歷史級距的估值差在收斂、利率環境趨於穩定，以及 AI 的敘事重心從「硬體建置」往「誰會用到這些算力」移動。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
  {"id": "small_1", "channel": "小型股風雲", "tag": "折價三成", "color": "#5B8ED6", "stocks": [{"t": "MDY", "n": "標普400中型股ETF，估值位置介於大小型股之間"}, {"t": "SPY", "n": "標普500 ETF，大型股本益比約 29.32 倍"}, {"t": "IJR", "n": "標普600小型股ETF，成分股有獲利門檻，是較嚴格的小型股樣本"}], "en": "Even after the run, the main small-cap ETF trades at 19.21 times earnings against 29.32 times for its large-cap equivalent, a 34.5% discount. A discount that wide is not automatically an opportunity. Part of it is structural, because small caps carry more leverage, more cyclicality, and a meaningful share of companies that do not earn money at all. The question is whether the current gap is wider than that structural penalty justifies.", "zh": "即使已經漲了這麼多，主要的小型股 ETF 本益比仍只有 19.21 倍，相對大型股的 29.32 倍是 34.5% 的折價。但折價這麼寬並不自動等於機會。其中有一部分是結構性的：小型股的財務槓桿更高、景氣連動更強，而且指數裡有相當比例的公司根本不賺錢。真正該問的是——目前這個差距，有沒有寬到超過這些結構性懲罰本來就該有的幅度。", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/"},
  {"id": "small_2", "channel": "小型股風雲", "tag": "獲利翻身", "color": "#5B8ED6", "stocks": [{"t": "IWN", "n": "羅素2000價值型ETF，獲利改善對價值端的槓桿最大"}, {"t": "IWO", "n": "羅素2000成長型ETF，成長端已先反映預期"}, {"t": "VB", "n": "Vanguard 小型股ETF，年內表現領先標普500約 6 個百分點"}], "en": "The fundamental case behind the price move is earnings, not multiple expansion alone. Small-cap earnings growth is forecast to accelerate to 18% in 2026 and another 18% in 2027, which would be the first time in several years that small-cap earnings growth exceeds large-cap growth. That is the variable to track, because a rally driven by earnings can survive a rate scare, while one driven purely by rotation cannot.", "zh": "撐住這波價格的基本面理由是獲利，而不只是評價擴張。小型股的獲利成長預估在 2026 年加速到 18%，2027 年再成長 18%，如果成真，這會是好幾年來小型股獲利成長首度超越大型股。這是真正該追蹤的變數：由獲利推動的漲勢撐得住一次利率驚嚇，純粹由資金輪動推動的漲勢撐不住。", "url": "https://www.fool.com/investing/2026/08/26/small-cap-stocks-waiting-years-moment-is-it-here/"},
  {"id": "small_3", "channel": "小型股風雲", "tag": "兩端拉扯", "color": "#5B8ED6", "stocks": [{"t": "CAPR", "n": "Capricor Therapeutics，週三漲 21.9%，當日最大贏家"}, {"t": "PACB", "n": "Pacific Biosciences，同日基因定序小型股跟漲"}, {"t": "DKS", "n": "Dick's Sporting Goods，本週稍早重挫 30.7%，反向教材"}], "en": "Under a flat index, the individual dispersion was enormous. Capricor Therapeutics led all gainers at plus 21.9% while Dick's Sporting Goods sat at the other extreme after a 30.7% collapse earlier in the week. This is what a stock-picker's tape looks like: the index tells you almost nothing about what any single position did. In a week where the benchmark moved a point, individual names moved 20 to 30 percent on their own catalysts.", "zh": "在一個收平的指數底下，個股的離散度大得驚人。Capricor Therapeutics 以漲 21.9% 居當日之冠，而 Dick's Sporting Goods 在本週稍早暴跌 30.7% 站在另一個極端。這就是「選股者的盤」長什麼樣子：指數幾乎沒告訴你任何一檔部位發生了什麼事。在一個大盤只動一個點的星期裡，個股靠自己的催化劑動了 20% 到 30%。", "url": "https://www.trefis.com/stock/spy/articles/612935/market-movers-winners-capr-rr-pacb-losers-dks-aiai-shoe/2026-08-26"},
  {"id": "small_4", "channel": "小型股風雲", "tag": "池子不同", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普600小型股ETF，納入前要求近四季合計獲利為正"}, {"t": "VTWO", "n": "羅素2000 ETF，純市值排序、不看獲利，成分股體質更雜"}, {"t": "XSMO", "n": "小型股動能ETF，第三種切法：只挑趨勢最強的那一群"}], "en": "A practical distinction that gets glossed over: the Russell 2000 ranks purely by market capitalisation, while the S&P SmallCap 600 requires a company to have positive trailing earnings before it can be added. The same asset class, two very different pools. When you read that small caps are up 23%, ask which index, because the unprofitable tail is exactly the part that rallies hardest on rate-cut hope and falls hardest when that hope is withdrawn.", "zh": "有一個常被略過但很實用的分別：羅素 2000 是純粹按市值排序納入的，而標普 600 小型股指數要求公司近四季合計獲利為正才有資格進榜。同一個資產類別，兩個體質差很多的池子。所以當你看到「小型股漲 23%」，先問是哪一個指數——因為那條「不賺錢的尾巴」正好是降息預期升溫時漲最兇、預期收回時跌最重的那一段。", "url": "https://www.nerdwallet.com/investing/learn/understanding-small-cap-stocks"},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "驗證點到", "color": "#C9A227", "stocks": [{"t": "MOV", "n": "Movado Group，Q2 調整後 EPS 0.54 美元遠超預估 0.35，股價開盤後漲約 5%"}], "en": "Movado Group makes and licenses watches (Movado, Ebel, plus licensed Coach, Tommy Hilfiger, Lacoste and HUGO). Yesterday's validation point delivered: Q2 FY2027 adjusted EPS of $0.54 against $0.35 consensus, revenue of $169.8 million up 4.9% against $164.2 million expected, and shares up about 5% after the open. The drivers were higher average selling prices, less promotional activity, and a genuine watch revival among Gen Z buyers. Management still declines to give a full-year outlook but guided second-half revenue to mid-single-digit growth and 55.6% gross margin excluding further tariff refunds. Risk stays where it was: discretionary spending is the first thing cut in a downgrade cycle, Middle East tourism is a live headwind, and the Kate Spade licence contributes nothing until FY2028. This is a research lead, not investment advice.", "zh": "Movado Group 做的是手錶：自有品牌 Movado、Ebel，加上 Coach、Tommy Hilfiger、Lacoste、HUGO 的授權錶。昨天的驗證點交卷了——FY2027 第二季調整後每股獲利 0.54 美元，遠高於市場預估的 0.35 美元；營收 1.698 億美元、年增 4.9%，也高於預估的 1.642 億；股價開盤後漲約 5%。推力來自平均售價提升、促銷減少，以及 Z 世代把傳統手錶當時尚配件的真實回潮。管理層仍然拒絕給全年指引，但預期下半年營收中個位數成長、毛利率 55.6%（不含後續關稅退稅）。風險沒有變：高單價可選消費是消費降級時最先被砍的一塊，中東觀光是進行式的逆風，而 Kate Spade 授權要到 FY2028 才有實質貢獻。這是研究線索，不是投資建議。", "url": "https://seekingalpha.com/news/4636965-movado-ticks-higher-after-q2-earnings-beat-estimates", "status": "RADAR · 下一個驗證點 11/下旬 FY27 Q3 財報（假期旺季）"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "董座加碼", "color": "#C9A227", "stocks": [{"t": "BORR", "n": "Borr Drilling，董事長 Tor Olav Troim 於 8/25 買進 200,000 股、約 87.5 萬美元"}], "en": "Borr Drilling is a pure-play offshore driller operating shallow-water jackup rigs, a corner of energy that essentially no generalist follows. The new evidence: chairman Tor Olav Troim bought 200,000 shares on August 25 for roughly $874,620, or about $4.37 per share. Troim is the founder-adjacent operator behind the company rather than a passive board member, which raises the signal value of an open-market purchase at this size. Why it is ignored: jackup day rates are opaque, the sector carries heavy debt from the last cycle, and offshore drilling has been structurally out of favour since 2015. Risks are real, including refinancing exposure, contract gaps between rig assignments, and direct sensitivity to oil at $82. This is a research lead, not investment advice.", "zh": "Borr Drilling 是純做淺水自升式（jackup）鑽井平台的離岸鑽井業者，這個角落基本上沒有任何綜合型分析師在追。新增的證據是：董事長 Tor Olav Troim 在 8 月 25 日於公開市場買進 200,000 股、約 87.5 萬美元，換算每股約 4.37 美元。Troim 不是被動的董事，而是這家公司背後實際的經營主導者，這讓這種規模的公開市場買進更有訊號價值。它為什麼被忽視：jackup 的日租金報價不透明、產業還揹著上個循環留下的沉重負債，而且離岸鑽井從 2015 年之後就一直不受待見。風險同樣具體：再融資曝險、鑽井平台合約之間的空窗期，以及對 82 美元油價的直接敏感度。這是研究線索，不是投資建議。", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+August+25,+2026", "status": "RADAR · 下一個驗證點 Q3 財報與新約公告"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "軍火加訂", "color": "#C9A227", "stocks": [{"t": "NPK", "n": "National Presto，8/13 宣布 40mm 系統與小直徑炸彈彈頭合計 1.591 億美元新增訂單"}], "en": "National Presto Industries is the odd company that sells pressure cookers and small appliances alongside a defence segment that makes 40mm ammunition systems. On August 13 the US Army exercised year-five options on subsidiary AMTEC's five-year 40mm contract, and subsidiary Spectra Technologies received a Boeing subcontract for Small Diameter Bomb warheads. The two awards total $159.1 million. Why it is ignored: the housewares brand buries the defence story, coverage is minimal, and the share count is tiny. Risks include lumpy government order timing, an appliance segment with structurally thin margins, and a controlling family ownership structure that limits outside influence. This is a research lead, not investment advice.", "zh": "National Presto Industries 是一家奇怪的公司：一邊賣壓力鍋與小家電，一邊透過國防部門生產 40mm 彈藥系統。8 月 13 日美國陸軍對子公司 AMTEC 的五年期 40mm 系統合約行使了第五年的選擇權，另一家子公司 Spectra Technologies 則拿到波音「小直徑炸彈」彈頭的分包訂單，兩筆合計 1.591 億美元。它為什麼被忽視：家用品牌的形象把國防這條線完全蓋掉了，分析師覆蓋極少，流通股數也很小。風險包括政府訂單的時點極不平均、家電部門結構性毛利偏薄，以及家族控股結構讓外部股東幾乎沒有影響力。這是研究線索，不是投資建議。", "url": "https://www.sec.gov/Archives/edgar/data/0000080172/000143774926028014/ex_1005284.htm", "status": "RADAR · 下一個驗證點 11月 Q3 財報"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "新股冷灶", "color": "#C9A227", "stocks": [{"t": "MAIR", "n": "Madison Air Solutions，8/25 內部人買進 20,000 股、約 55.68 萬美元，價位貼近 27 美元的 IPO 價"}], "en": "Madison Air Solutions makes air management and cooling equipment through Nortek Air Solutions, Nortek Data Center Cooling, AprilAire and Big Ass Fans. It listed on the NYSE on April 16 at $27, raising $2.2 billion, the largest US IPO of 2026 and the largest industrials IPO since UPS in 1999. The new evidence: an insider bought 20,000 shares on August 25 for about $556,800, roughly $27.84 per share, meaning the stock is back near its offer price four months after listing. About half of 2025 net sales came from replacement and upgrade demand and roughly 10% from aftermarket parts, which is a more durable revenue base than a pure capex story. Why it is ignored: four months of trading history, coverage only just initiated, and it is filed under industrials rather than AI. Risks include lock-up expiry supply, majority control by Madison Industries Holdings, and direct exposure to the data centre capex cycle. This is a research lead, not investment advice.", "zh": "Madison Air Solutions 做的是空氣管理與冷卻設備，旗下品牌包括 Nortek Air Solutions、Nortek Data Center Cooling、AprilAire 與 Big Ass Fans，客戶場景涵蓋資料中心、半導體廠、辦公與住宅。它在 4 月 16 日以每股 27 美元掛牌紐約證交所，募資 22 億美元，是 2026 年美國最大的 IPO，也是工業股自 1999 年 UPS 以來最大的一樁。新增證據是：8 月 25 日有內部人在公開市場買進 20,000 股、約 55.68 萬美元，換算每股約 27.84 美元——等於掛牌四個月後，股價又回到承銷價附近。另一個值得看的結構是：2025 年約一半的淨銷售額來自更換與升級需求、約 10% 來自售後零件與服務，這比純粹吃資本支出的營收基礎耐久得多。它為什麼被忽視：只有四個月的交易歷史、分析師覆蓋剛起步，而且它被歸在工業股而不是 AI 概念。風險包括 IPO 鎖定期解禁的賣壓、母公司 Madison Industries Holdings 的控股結構，以及對資料中心資本支出循環的直接曝險。這是研究線索，不是投資建議。", "url": "https://www.renaissancecapital.com/IPO-Center/News/118343/Airflow-products-manufacturer-Madison-Air-Solutions-prices-IPO-at-$27-the-h", "status": "RADAR · 下一個驗證點 11月 Q3 財報與鎖定期解禁日"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "三人同買", "color": "#C9A227", "stocks": [{"t": "BRLT", "n": "Brilliant Earth，執行長、執行董事長、財務長於 8/18-8/19 同時在 1.25 美元附近買進"}], "en": "Brilliant Earth Group sells engagement rings and fine jewellery direct to consumer, with an ethically-sourced positioning. The stock trades around $1.25 near its 52-week low of $1.00, down 36% over the past year. Two pieces of new evidence arrived together: Q2 adjusted EPS of $0.03 beat a consensus loss of $0.004 on revenue of $115.1 million against $111.5 million expected, and between August 18 and 19 the CEO, the executive chairman and the CFO all bought shares on the open market. Be honest about the size, though: each purchase was in the $12,000 to $14,000 range, so the signal is that three officers acted together, not that any of them committed serious personal capital. Risks are heavy: record gold prices raise input costs, lab-grown stones compress natural diamond pricing, the market cap is small enough that liquidity is a real constraint, and a dollar-priced stock carries listing-standard risk. This is a research lead, not investment advice.", "zh": "Brilliant Earth Group 做的是直接面對消費者的訂婚戒與精品珠寶，主打來源可追溯的道德採購定位。股價目前約 1.25 美元，逼近 52 週低點 1.00 美元，過去一年跌了 36%。這次有兩個證據同時出現：第二季調整後每股獲利 0.03 美元，優於市場預估的每股虧損 0.004 美元，營收 1.151 億美元也高於預估的 1.115 億；而在 8 月 18 到 19 日，執行長 Beth Gerstein、執行董事長 Eric Grossberg 與財務長 Jeffrey Kuo 三人同時在公開市場買進。但金額要誠實講：每個人都只買了 1.2 萬到 1.4 萬美元等級，所以訊號在於「三位高管同時動作」，不在於任何一位押上了有份量的個人資金。風險很重：金價創高推升原料成本、實驗室培育鑽石正在壓縮天然鑽的定價、市值小到流動性本身就是限制，而且股價只有一美元出頭，還有掛牌標準的風險。這是研究線索，不是投資建議。", "url": "https://www.stocktitan.net/sec-filings/BRLT/form-4-brilliant-earth-group-inc-insider-trading-activity-50eb9ed629a0.html", "status": "RADAR · 下一個驗證點 11月 Q3 財報"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "改頭換面", "color": "#C9A227", "stocks": [{"t": "PRE", "n": "Prenetics Global，執行長與財務長 8/20-8/25 合計買進 100 萬美元，期間零賣出"}], "en": "Prenetics Global started as a genetic testing company and has effectively become a supplements business through its IM8 brand. Q2 revenue was $46.5 million, up about 288% year-over-year, of which IM8 contributed $45.0 million, up about 359%, a sixth consecutive record quarter. July alone produced $20.9 million of IM8 revenue, an annualised run-rate near $251 million, and the company recorded its first month of positive consolidated adjusted free cash flow. Full-year guidance was raised to $220-230 million and 2027 guidance introduced above $400 million. The new evidence: CEO Danny Yeung and CFO Brian Rosin bought a combined $1.0 million on the open market between August 20 and 25, bringing management purchases since November 2025 to roughly $3.75 million with no sales in that period. Risks are concentrated and obvious: essentially one brand, low barriers to entry in supplements, dependence on celebrity endorsement, and growth rates that mathematically must decelerate. This is a research lead, not investment advice.", "zh": "Prenetics Global 原本是做基因檢測的，現在實質上已經變成一家保健品公司，靠的是旗下的 IM8 品牌。第二季營收 4,650 萬美元、年增約 288%，其中 IM8 貢獻 4,500 萬、年增約 359%，是連續第六個創紀錄的季度。光是 7 月單月 IM8 就做了 2,090 萬美元，年化約 2.51 億，同時公司錄得第一個合併調整後自由現金流為正的月份。全年營收指引上調到 2.2 至 2.3 億美元，並首度給出 2027 年 4 億美元以上的指引。新增證據是：執行長 Danny Yeung 與財務長 Brian Rosin 在 8 月 20 到 25 日於公開市場合計買進 100 萬美元；加上 2025 年 11 月的約 145 萬與 2026 年 2 月的約 130 萬，管理層期間累計買進約 375 萬美元、且完全沒有賣出。風險很集中也很明顯：營收幾乎押在單一品牌、保健品的進入門檻低、對名人代言的依賴度高，而且這種成長率在數學上必然要減速。這是研究線索，不是投資建議。", "url": "https://www.globenewswire.com/news-release/2026/08/26/3351356/0/en/prenetics-im8-ceo-and-cfo-purchase-1-0-million-of-shares-in-the-open-market-following-second-quarter-results.html", "status": "RADAR · 下一個驗證點 11月 Q3 財報與 IM8 月營收"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "自己買回", "color": "#6DB56D", "stocks": [{"t": "BABA", "n": "董事長蔡崇信買進約 1,030 萬美元，執行長吳泳銘買約 500 萬美元"}, {"t": "BIDU", "n": "同樣重押 AI 資本支出的中概對照組"}, {"t": "KWEB", "n": "中國網路ETF，衡量這次事件對整體板塊情緒的擴散"}], "en": "Alibaba priced a $10.2 billion placement on August 23 and the shares fell about 10%. Within days chairman Joseph Tsai bought roughly $10.3 million of stock on the open market and CEO Eddie Wu bought about $5 million, with executives buying around $15 million in total. Read it precisely: this is management buying the dilution they themselves caused, which is a statement that they believe the AI spend will earn its cost of capital. It is not new information about the business, and it is not a floor.", "zh": "阿里巴巴在 8 月 23 日為 102 億美元的配售定價，股價隨即下跌約 10%。幾天之內，董事長蔡崇信在公開市場買進約 1,030 萬美元的股票，執行長吳泳銘買進約 500 萬美元，高管合計約 1,500 萬美元。要精確地解讀這件事：這是管理層在買他們自己造成的稀釋，等於在表態「我們相信這筆 AI 支出賺得回資金成本」。它不是關於這門生意的新資訊，也不是一個價格底部。", "url": "https://finance.yahoo.com/markets/stocks/articles/alibaba-diluted-shareholders-ai-insiders-203025926.html"},
  {"id": "insider_1", "channel": "內部人動向", "tag": "百萬押注", "color": "#6DB56D", "stocks": [{"t": "TTMI", "n": "TTM Technologies，執行長 Edwin Roks 於 8/25 買進 10,000 股、約 111.8 萬美元"}, {"t": "BHE", "n": "Benchmark Electronics，同屬電子製造服務的中小型對照組"}, {"t": "SANM", "n": "Sanmina，另一家吃資料中心與國防兩條線的代工廠"}], "en": "TTM Technologies CEO Edwin Roks bought 10,000 shares on August 25 for roughly $1,117,700, about $111.77 per share. TTM makes printed circuit boards for customers spanning aerospace and defence and data centre infrastructure, so it sits at the intersection of the two spending cycles that are currently running hardest. The detail that gives this weight is the size relative to a CEO's typical annual compensation. A seven-figure open-market purchase is not a governance gesture, it is a position.", "zh": "TTM Technologies 執行長 Edwin Roks 在 8 月 25 日買進 10,000 股，金額約 111.8 萬美元，換算每股約 111.77 美元。TTM 做的是印刷電路板，客戶橫跨航太國防與資料中心基礎建設，剛好卡在目前跑得最兇的兩條支出循環的交叉點上。讓這筆買進有份量的細節是「相對規模」——七位數的公開市場買進，相對於一位執行長的年度薪酬並不是小數目，那不是做給治理看的姿態，那是一個部位。", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+August+26,+2026"},
  {"id": "insider_2", "channel": "內部人動向", "tag": "怎麼看懂", "color": "#6DB56D", "stocks": [{"t": "BRLT", "n": "三位高管同時買，但每人只有 1.2-1.4 萬美元"}, {"t": "PRE", "n": "執行長與財務長合計 100 萬美元，且期間零賣出"}, {"t": "OPEN", "n": "Opendoor，執行長 8/14 買進 27,625 股、約 10 萬美元"}], "en": "Three rules for reading Form 4 filings, using this week's examples. First, size relative to the person's compensation matters more than the absolute number, which is why three officers each buying $13,000 is a weaker signal than one CFO buying $500,000. Second, cluster buying, meaning several insiders acting within days of each other, is the strongest single pattern available. Third, and most important: insiders tell you they think the stock is cheap. They do not tell you when the market will agree, and they are frequently early by quarters.", "zh": "用這週的例子講三條讀 Form 4 的規則。第一，相對規模比絕對金額重要——三位高管各買 1.3 萬美元，訊號強度其實弱於一位財務長買 50 萬美元。第二，「集群買進」（幾位內部人在幾天之內先後動作）是這個資料集裡最強的單一型態，因為它排除了個人流動性需求這個雜訊。第三也最重要：內部人只告訴你他們認為股價便宜，不會告訴你市場什麼時候會同意——他們經常早了好幾個季度。", "url": "https://www.nasdaq.com/articles/1-insider-signal-every-trader-should-know-1"},
  {"id": "capitol_0", "channel": "政要持股", "tag": "押電不押晶", "color": "#B5654D", "stocks": [{"t": "BE", "n": "Bloom Energy，7/24 買進 10,000 股（申報 100 萬-500 萬美元）＋ 200 口 2027/6 到期買權"}, {"t": "INTC", "n": "英特爾，同日買進 10,000 股（50 萬-100 萬）＋ 50 口履約價 50 美元買權"}, {"t": "PLUG", "n": "Plug Power，同屬燃料電池，用來對照這個主題的其他表達方式"}], "en": "A periodic transaction report filed with the House Clerk on August 21 disclosed a new Bloom Energy position in Nancy Pelosi's household, executed by her spouse on July 24: 10,000 shares disclosed at $1,000,001 to $5,000,000, plus 100 call options struck at $100 expiring June 17, 2027, with a second tranche of another 100 calls at the same strike and expiry plus roughly 5,000 shares. The same day added 10,000 Intel shares and 50 calls struck at $50, also expiring June 2027. What the structure says: both are long-dated out-of-the-money calls paired with stock, which is a bet on AI electricity generation and on US chip onshoring as multi-year themes, not on any single quarter's results.", "zh": "8 月 21 日向眾議院書記官申報的定期交易報告（PTR）揭露，Nancy Pelosi 家庭新增了 Bloom Energy 的部位，由其配偶在 7 月 24 日執行：買進 10,000 股（申報區間 100 萬至 500 萬美元），加上 100 口履約價 100 美元、2027 年 6 月 17 日到期的買權；第二批又加了 100 口同履約價同到期的買權與約 5,000 股。同一天還買了英特爾 10,000 股與 50 口履約價 50 美元、同樣 2027 年 6 月到期的買權。這個部位結構在說什麼：兩筆都是「長天期價外買權＋正股」的組合，押的是 AI 用電（燃料電池就地供電）與美國晶片在地製造這兩個要跨年度才會兌現的主題，而不是任何一季的財報。", "url": "https://www.thestreet.com/investing/stocks/nancy-pelosi-buys-intc-intel-stock-be-bloom-energy-stock"},
  {"id": "capitol_1", "channel": "政要持股", "tag": "延遲四五天", "color": "#B5654D", "stocks": [{"t": "NANC", "n": "追蹤民主黨議員申報部位的ETF，可在「政要績效」分頁看它與大盤的比較"}, {"t": "GOP", "n": "對應共和黨議員申報部位的ETF"}, {"t": "VOO", "n": "標普500 ETF，這兩檔真正該比較的基準"}], "en": "Why this channel is not a trading signal, in four mechanics. The STOCK Act allows 45 days to file, so a July 24 trade only became public on August 21, and anyone following along buys at a price set a month later. Amounts are disclosed only in wide bands such as $1,000,001 to $5,000,000, so you cannot compute position weight. Most transactions are executed in spousal or trust accounts, meaning the member may not have made the decision. The genuinely informative fields are the option strike and expiry, because those two numbers state an explicit assumption about price and time.", "zh": "為什麼這個頻道不是買賣訊號，有四個機制上的理由。第一，STOCK Act 給的申報期限是 45 天，所以 7 月 24 日的交易到 8 月 21 日才公開，跟單的人買到的是一個月之後的價位。第二，金額只有寬區間（例如 100 萬到 500 萬美元），你算不出它佔資產的比重，也就無法判斷這是重押還是零頭。第三，多數交易是在配偶或信託帳戶裡執行的，議員本人未必參與決策。第四，真正有資訊量的欄位是選擇權的履約價與到期日——那兩個數字明確寫出了對價格與時間的假設。這個頻道要看的是「有人用真錢投票給某個主題」，不是誰有內線。", "url": "https://congressflow.com/learn/how-congress-trades-stocks"},
  {"id": "week_0", "channel": "本週事件", "tag": "五天行事曆", "color": "#C97DD4", "stocks": [{"t": "TLT", "n": "長天期公債ETF，週五演說對長端曲線的影響最直接"}, {"t": "IEF", "n": "7-10年期公債ETF，中段曲線反映的是降息路徑"}, {"t": "UUP", "n": "美元指數ETF，傑克遜洞的語氣通常先反映在匯率上"}], "en": "The next five sessions. Today, August 27: initial jobless claims for the week ended August 22, the advance goods trade balance, and wholesale and retail inventories, all at 8:30 a.m. ET, with the Jackson Hole symposium opening. Friday August 28: Warsh's keynote at 10:00 a.m. ET, the single largest scheduled risk event of the week. Monday August 31 is month-end. Tuesday September 1 brings ISM Manufacturing, and Wednesday September 2 brings JOLTS job openings, factory orders and the Fed Beige Book.", "zh": "接下來五個交易日的行事曆。今天 8 月 27 日：美東時間早上 8:30 公布截至 8 月 22 日當週的初領失業金人數、7 月商品貿易帳初值，以及批發與零售庫存，同時傑克遜洞年會開幕。8 月 28 日週五：Warsh 上午 10 點的主題演說，是本週規模最大的排定風險事件。8 月 31 日週一是月底作帳日。9 月 1 日週二 ISM 製造業指數，9 月 2 日週三則有 JOLTS 職缺數、工廠訂單與 Fed 褐皮書。", "url": "https://us.econoday.com/byweek"},
  {"id": "week_1", "channel": "本週事件", "tag": "財報接棒", "color": "#C97DD4", "stocks": [{"t": "LULU", "n": "Lululemon，今晚 8/27 盤後公布財報，高價運動服飾的需求體溫計"}, {"t": "CRM", "n": "Salesforce，下週登場，企業軟體導入 AI 後的變現進度"}, {"t": "AVGO", "n": "博通，下週登場，AI 客製化晶片路線的第二個讀數"}], "en": "Earnings do not stop with Nvidia. Lululemon reports after the close tonight, which is the cleanest read available on whether premium discretionary demand is holding up now that consumers have pulled back on spending. Next week brings Salesforce, the best single gauge of whether enterprises are converting AI pilots into paid seats, and Broadcom, whose custom accelerator business is the main structural alternative to buying merchant GPUs.", "zh": "財報不會因為輝達交完卷就結束。Lululemon 今晚盤後公布，這是目前能拿到最乾淨的讀數，用來看在消費者已經開始縮手的情況下，高價可選消費的需求還撐不撐得住。下週則有 Salesforce——判斷企業有沒有把 AI 試點真的轉成付費席次的最佳單一指標；以及博通，它的客製化加速器業務是「不買現成 GPU」這條路線最主要的結構性替代方案。", "url": "https://earningscountdown.com/calendar/"},
  {"id": "eval_0", "channel": "今日評估", "tag": "最值得注意", "color": "#E8A838", "stocks": [{"t": "NVDA", "n": "Q3 指引 1,080 億美元，且明說不含任何中國資料中心運算營收"}, {"t": "QQQ", "n": "那斯達克100 ETF，今年被羅素2000 反超的那一邊"}, {"t": "IWM", "n": "羅素2000 ETF，年內漲 23%、領先標普500 達 9.1 個百分點"}], "en": "The single most notable thing today is one sentence in Nvidia's guidance: $108 billion for Q3, assuming zero data centre compute revenue from China. Management removed the largest political variable from the model rather than hedging around it, which means the number is either conservative or the China business is already written off internally. Now the open question worth sitting with. If AI hardware keeps beating and the share price reaction keeps getting colder each time, is the market disbelieving the durability of that growth, or has it simply already been paid for? Follow that thread and you land on the year's real anomaly: the thing actually going up is the Russell 2000, not the Nasdaq 100. Those may be the same fact seen from two directions.", "zh": "今天最值得注意的是輝達指引裡的一句話：第三季 1,080 億美元，而且「不假設任何來自中國的資料中心運算營收」。管理層沒有繞著這個變數打太極，而是直接把最大的政治不確定性從模型裡拿掉——這代表這個數字要嘛是保守的，要嘛就是中國業務在內部已經被當成歸零處理了。接著是值得坐下來想一想的開放式問題：如果 AI 硬體端持續超預期，但股價的反應一次比一次冷，那是市場不相信這個成長撐得久，還是價格早就把它算進去了？順著這條線往下想，你會撞上今年真正的異常：真正在漲的是羅素 2000，不是那斯達克 100。這兩件事，很可能是同一件事的兩個看法。", "url": "https://www.stocktitan.net/news/NVDA/nvidia-announces-financial-results-for-second-quarter-fiscal-98x41cxh35vk.html", "status": "討論起點 · 今天最值得追的一條是什麼？"},
];

// 「資金流向」「政要績效」是特殊分頁,不吃 CARDS、卡片版型完全不適用
const TODAY_SUBS = ["全部", ...CHANNELS.map(c => c.key), "資金流向", "政要績效"];

// 個別議員申報彙整。來源是眾議院書記官的官方 PTR 索引與 PDF,由 tools/capitol_roster.py

// 排程只要照常抽換 CARDS 就好,不用額外維護日期。
const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();
const lsKeyFor = (sub) => "mosfeed_" + BRIEF_ID + "_" + sub;

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/27/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v9.0</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
