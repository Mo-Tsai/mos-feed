<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "small_0", "channel": "小型股風雲", "tag": "小型股跟跌", "color": "#5B8ED6", "zh": "羅素 2000 週二跌 0.76% 至 2,870.29 點，跌幅與那斯達克相當、大於標普 500。小型股今年以來仍領先大盤、漲幅約兩成，但升息對它們的傷害比大型股更直接：營收以美國內需為主、借款利率多半浮動。區域銀行同樣承受長端殖利率走高的壓力，存款成本與商用不動產貸款品質會再被拿出來檢視。", "en": "The Russell 2000 fell 0.76% to 2,870.29 Tuesday, matching the Nasdaq's decline and trailing the S&P 500. Small caps are still up about 20% this year, ahead of the broad market, but a hike hits them harder: revenue is mostly domestic and much of their debt is floating-rate. Regional banks also feel the pressure of rising long-term yields, putting deposit costs and commercial real estate loan quality back under scrutiny.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-tuesday-september-15-dow-sp-500-nasdaq-081307838.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，跌 0.76%，收 2,870 點"}, {"t": "KRE", "n": "區域銀行 ETF，長端殖利率上行壓力"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "浮動利率債的帳", "color": "#5B8ED6", "zh": "小型股判讀：為什麼升息對羅素 2000 特別傷。據統計，羅素 2000 成分股約三成債務綁浮動利率，標普 500 只有約 6%；利息支出已吃掉羅素 2000 公司約 31% 的 EBITDA，是 2020 年的兩倍。更麻煩的是約四成成分股的營業利益不夠付利息，靠借新還舊維持，而 2026 年還有約 3,680 億美元債務到期要再融資。這也是為什麼同樣是小型股，有獲利門檻的標普 600 通常比羅素 2000 抗跌。", "en": "Small-cap lesson: why hikes hurt the Russell 2000 in particular. Roughly 30% of Russell 2000 debt is floating-rate versus about 6% for the S&P 500, and interest expense now consumes about 31% of EBITDA, double the 2020 level. Worse, some 40% of members cannot cover interest with operating profit and rely on rolling debt, with about $368 billion maturing in 2026. That is why the S&P 600, which requires profitability, usually holds up better than the Russell 2000.", "url": "https://247wallst.com/investing/2026/07/07/will-the-federal-reserve-crush-the-small-cap-stock-revival/", "stocks": [{"t": "IJR", "n": "標普小型 600 ETF，有獲利門檻、債務體質較佳"}, {"t": "IWM", "n": "羅素 2000 ETF，含較多未獲利、浮動利率負債公司"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "無人機拿到執照", "color": "#5B8ED6", "zh": "微型股 First Breach（市值約 3,580 萬美元）週二大漲 54.9%，原因是取得美國菸酒槍炮及爆裂物管理局（ATF）第 23 類聯邦爆裂物執照，效期到 2029 年 9 月。這張執照讓它能進口與處理爆裂物材料，用於「可消耗型攻擊無人機」的研發與製造；公司原本做彈藥，8 月才完成第一架原型機試飛，目標 2027 年第二季開始量產、週產能 2,500 架以上。執照是門票不是訂單，距離量產還有一年多，流動性與增資稀釋風險都要算進去。", "en": "Micro-cap First Breach, worth about $35.8 million, jumped 54.9% Tuesday after securing a Type 23 Federal Explosives License from the ATF, valid through September 2029. The license lets it import and handle explosive materials for developing and building attritable strike drones; the ammunition maker only flew its first prototype in August and targets production from the second quarter of 2027 at more than 2,500 drones a week. A license is a ticket, not an order, and with production over a year away, liquidity and dilution risk must be weighed.", "url": "https://www.stocktitan.net/news/FBDT/first-breach-completes-first-flight-of-drone-prototype-and-advances-3q1ho9rq7fr6.html", "stocks": [{"t": "FBDT", "n": "First Breach，取得爆裂物執照，單日漲 54.9%"}, {"t": "ITA", "n": "航太國防 ETF，無人機是國防預算新主題"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "增資反而漲", "color": "#5B8ED6", "zh": "生技股 Tyra Biosciences 以每股 22.03 美元發行普通股與預先付款認股權證，募資約 4 億美元，股價週一反而上漲約 14%。一般增資會稀釋股東、股價多半下跌，這次反漲的原因在結構：募資規模接近公司市值的四分之一，卻能用接近市價的價格一次賣完，代表有大型生技基金願意進場；資金用途是推進膀胱與上泌尿道癌症藥物 dabogratinib 的開發。判讀小型生技增資，看的是「誰買、多少折價、錢夠撐到哪個數據點」，不是看增資本身。", "en": "Tyra Biosciences priced about $400 million of common stock and pre-funded warrants at $22.03 a share, and its stock rose about 14% on Monday. Offerings usually dilute holders and push shares down; this one rallied because of its structure: raising roughly a quarter of the company's market value near the market price signals demand from large biotech funds, with proceeds funding dabogratinib in urothelial and bladder cancers. With small biotech raises, what matters is who bought, the discount and how far the cash reaches, not the offering itself.", "url": "https://www.prnewswire.com/news-releases/tyra-announces-pricing-of-400-million-underwritten-offering-of-common-stock-and-pre-funded-warrants-302877534.html", "stocks": [{"t": "TYRA", "n": "Tyra Biosciences，募資 4 億美元、股價反漲約 14%"}, {"t": "XBI", "n": "生技股 ETF，中小型生技的籌資溫度計"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "兩天來回三成", "color": "#5B8ED6", "zh": "量子運算軟體股 Horizon Quantum 週一從 15.22 美元跌到 11.79 美元、單日跌逾兩成，週二公司發布「澄清部分資訊」的聲明後又大漲 27.66%，市值約 5.6 億美元。兩天來回三成、但基本面沒有新數字，這是題材型小型股的典型走勢：流通股少、散戶與短線資金集中，一則傳言或一份澄清就能讓股價劇烈擺盪。看這類股票先確認三件事：流通股本多大、有沒有待解禁或可轉債、公司澄清的到底是營運事實還是市場傳聞。", "en": "Quantum software stock Horizon Quantum fell from $15.22 to $11.79 on Monday, down more than 20%, then jumped 27.66% Tuesday after the company issued a statement clarifying certain information, leaving it worth about $560 million. A 30% round trip in two days with no new fundamentals is typical of theme-driven small caps: a small float and concentrated retail and short-term money let one rumor or clarification swing the price. Check the float, any pending unlocks or convertibles, and whether the clarification concerns operations or market rumors.", "url": "https://www.stocktitan.net/rankings/top-news/gainers/2026-09", "stocks": [{"t": "HQ", "n": "Horizon Quantum，週一跌逾兩成、週二澄清後漲 27.66%"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新名字 · 三位高管同日買", "color": "#C9A227", "zh": "Redwood Trust 是美國住宅抵押貸款業者，旗下 Sequoia 做大額非機構房貸、Aspire 做非 QM 房貸、CoreVest 做出租房投資人貸款，把貸款買進後證券化或轉賣。為什麼被忽視：房貸 REIT 在殖利率 5% 的環境整個類別被拋棄，股價 3.84 美元只有第二季帳面價值 6.90 美元的約 0.56 倍，第二季還小虧。什麼正在改變：9/15 執行長 Abate 買進 10 萬股、財務長 Carillo 買 26,065 股、董事 Kubicek 買 5 萬股，均價約 3.84 至 3.85 美元，三人合計約 67.7 萬美元；第二季 Aspire 鎖價量季增 31% 至創紀錄 21 億美元，毛利從 73 個基點升到 101 個基點；季配息維持 0.18 美元，連續第 109 季配息。風險與反方論點：以現價計配息殖利率接近 19%，高得不尋常，通常代表市場懷疑配息守不住；帳面價值季減（7.12 美元降到 6.90 美元）；Sequoia 鎖價量季減 15%；轉換價 4.90 美元的 7% 可轉債有稀釋可能。這是研究線索，不是投資建議。", "en": "Redwood Trust is a U.S. residential mortgage finance company: Sequoia buys jumbo non-agency loans, Aspire handles non-QM loans and CoreVest lends to rental-property investors, with loans securitized or sold. Why it's ignored: mortgage REITs as a group have been dumped with 5% yields, the stock at $3.84 trades at about 0.56 times second-quarter book value of $6.90, and it posted a small loss. What's changing: on Sept. 15 CEO Christopher Abate bought 100,000 shares, CFO Brooke Carillo 26,065 and director Greg Kubicek 50,000, at about $3.84 to $3.85, roughly $677,000 combined; Aspire lock volume rose 31% to a record $2.1 billion with gain-on-sale margins up from 73 to 101 basis points; the $0.18 quarterly dividend, its 109th straight, was held. Risks and counterpoints: a yield near 19% is unusually high and signals doubt about sustainability; book value fell from $7.12; Sequoia locks fell 15%; 7% convertibles with a $4.90 conversion price could dilute. This is a research lead, not investment advice.", "url": "https://www.redwoodtrust.com/investor-relations/news-events/press-releases/detail/384/redwood-trust-reports-second-quarter-financial-results", "stocks": [{"t": "RWT", "n": "Redwood Trust，執行長、財務長、董事 9/15 同日買進約 67.7 萬美元"}], "status": "RADAR · 下一個驗證點 10 月底 Q3 財報：帳面價值能否守住 6.90 美元、0.18 美元配息是否維持"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新名字 · 執行長百萬加碼", "color": "#C9A227", "zh": "G-III 是服裝批發與品牌商，擁有 DKNY、Donna Karan、Karl Lagerfeld，9/1 完成收購 Marc Jacobs。為什麼被忽視：過去營收大塊來自 PVH 授權的 Calvin Klein 與 Tommy Hilfiger，這兩個授權今年底前退場，市場把它當成「失去主力品牌的代工商」，財報優於預期隔天股價仍跌 3.7%。什麼正在改變：第二季營收年減 10% 至 5.54 億美元，但毛利率大增 440 個基點到 45.2%，非 GAAP 每股盈餘 0.26 美元超過指引上緣並上調全年獲利指引；管理層說 12 億美元將流失的營收中已補回 7 億、而且毛利更高；帳上現金 5.29 億美元。9/14 創辦人兼執行長 Morris Goldfarb 以均價 27.94 美元買進 4 萬股、約 112 萬美元。風險與反方論點：Goldfarb 直接持股約 453 萬股，這筆買進占比不到 1%，他過去也曾大額賣股；自有品牌能否完全補上授權缺口尚未證明；公司表示本年度不再買回股票；百貨通路疲弱與關稅成本。這是研究線索，不是投資建議。", "en": "G-III is an apparel wholesaler and brand owner with DKNY, Donna Karan and Karl Lagerfeld, and it closed its Marc Jacobs acquisition on Sept. 1. Why it's ignored: much of its revenue came from PVH-licensed Calvin Klein and Tommy Hilfiger, both ending by year-end, so the market treats it as a licensee losing its core brands, and the stock fell 3.7% after a beat. What's changing: second-quarter sales fell 10% to $554 million, but gross margin jumped 440 basis points to 45.2%, non-GAAP EPS of $0.26 topped guidance and full-year profit guidance was raised; management says $700 million of the $1.2 billion being lost is already replaced at higher margins, with $529 million in cash. On Sept. 14 founder and CEO Morris Goldfarb bought 40,000 shares at $27.94, about $1.12 million. Risks and counterpoints: the purchase is under 1% of his roughly 4.53 million direct shares and he has sold heavily before; owned brands have yet to fully fill the gap; no more buybacks this fiscal year; weak department stores and tariffs. This is a research lead, not investment advice.", "url": "https://www.globenewswire.com/news-release/2026/09/02/3354961/0/en/g-iii-apparel-group-ltd-reports-second-quarter-fiscal-2027-results-and-raises-earnings-guidance.html", "stocks": [{"t": "GIII", "n": "G-III，執行長 9/14 買進約 112 萬美元，授權退場陰影下毛利率創高"}], "status": "RADAR · 下一個驗證點 12 月 Q3 財報：營收年減幅度是否收斂、45% 毛利率能否延續"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "新名字 · 獲利大超預期", "color": "#C9A227", "zh": "Radiant Logistics 是非資產型第三方物流商，做貨運代理、卡車仲介與報關，市值約 3.8 億美元。為什麼被忽視：市值小、分析師少，物流業低迷兩年，全年調整後 EBITDA 仍年減 5.4%，媒體幾乎不報。什麼正在改變：9/14 公布會計年度第四季，每股盈餘 0.15 美元、市場預估 0.06 美元，營收 2.614 億美元年增 18.5%、高於預估的 2.316 億美元；調整後 EBITDA 年增 31.6%、利潤率擴張 240 個基點；公司零淨負債，信貸額度擴大到 2 億美元、含 1 億美元併購額度，執行長認為國內貨運市場可能迎來較持久的復甦。風險與反方論點：股價 9/15 已大漲 19.49%，「好消息沒反應」這一條不再成立；本益比約 25 倍不算便宜；貨運景氣循環、關稅政策、承運商審核的訴訟責任都在，部分營收來自救災等暫時性業務。這是研究線索，不是投資建議。", "en": "Radiant Logistics is an asset-light third-party logistics firm offering freight forwarding, truck brokerage and customs services, with a market value of about $380 million. Why it's ignored: small size, thin analyst coverage and a two-year freight slump, with full-year adjusted EBITDA still down 5.4%. What's changing: fiscal fourth-quarter EPS released Sept. 14 was $0.15 versus $0.06 expected, revenue rose 18.5% to $261.4 million versus $231.6 million expected, adjusted EBITDA rose 31.6% with margins up 240 basis points; it has zero net debt and an expanded $200 million credit facility with $100 million of acquisition capacity, and the CEO sees a potentially durable domestic freight recovery. Risks and counterpoints: the stock already jumped 19.49% on Sept. 15, so the no-reaction signal no longer applies; about 25 times earnings is not cheap; freight cyclicality, tariffs, carrier-vetting liability and temporary disaster-relief revenue remain. This is a research lead, not investment advice.", "url": "https://www.prnewswire.com/news-releases/radiant-logistics-announces-results-for-the-fourth-fiscal-quarter-and-year-ended-june-30-2026-302878063.html", "stocks": [{"t": "RLGT", "n": "Radiant Logistics，每股盈餘 0.15 美元遠超預估 0.06 美元，9/15 漲 19.49%"}], "status": "RADAR · 下一個驗證點 11 月 FQ1 財報：有機成長能否從約 8% 加速、併購額度是否動用"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "新名字 · 轉虧為盈", "color": "#C9A227", "zh": "Vera Bradley 是美國印花包袋與配件品牌，市值約 8,650 萬美元。為什麼被忽視：微型市值、營收連年下滑，分析師與媒體幾乎不再追蹤，市場把它當成過氣品牌。什麼正在改變：9/15 公布 FY27 第二季，合併營收年增 1.1% 至 7,160 萬美元、連續兩季成長，其中直營通路年增 8% 至 6,540 萬美元；持續營運淨利 450 萬美元、每股 0.15 美元，去年同期虧損 470 萬美元；現金 3,420 萬美元、去年同期只有 1,520 萬美元，信貸額度沒有動用；重申全年營收與營業利益率指引。風險與反方論點：股價當天已大漲 34.54%，追價風險高；批發通路營收大減 39.4%，成長全靠直營；單季轉盈能否延續要看假期季，消費轉弱與關稅成本都是變數。這是研究線索，不是投資建議。", "en": "Vera Bradley is a U.S. brand of printed bags and accessories with a market value of about $86.5 million. Why it's ignored: a micro-cap with years of falling sales, little analyst or media coverage and a reputation as a faded brand. What's changing: fiscal 2027 second-quarter results on Sept. 15 showed revenue up 1.1% to $71.6 million, a second straight quarter of growth, with direct sales up 8% to $65.4 million; income from continuing operations was $4.5 million, or $0.15 a share, versus a $4.7 million loss a year earlier; cash rose to $34.2 million from $15.2 million with no borrowings, and full-year sales and margin guidance was reaffirmed. Risks and counterpoints: the stock already jumped 34.54% that day; indirect revenue fell 39.4%, so growth relies on direct channels; whether profits last depends on the holiday quarter, weaker consumers and tariffs. This is a research lead, not investment advice.", "url": "https://www.globenewswire.com/news-release/2026/09/15/3362032/17650/en/vera-bradley-announces-second-quarter-fiscal-year-2027-results.html", "stocks": [{"t": "VRA", "n": "Vera Bradley，第二季轉虧為盈、現金翻倍，財報日漲 34.54%"}], "status": "RADAR · 下一個驗證點 12 月 FY27 Q3 財報：假期季直營成長能否維持、獲利是否連續兩季為正"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新 · 大股東換手", "color": "#C9A227", "zh": "CPI Card Group 做金融卡製造與個人化發卡服務，入池時的論點是營收年增 14.9%、淨利年增 293% 加上指引上調。新動態：私募基金 Parallel49 旗下兩檔 Tricor 第四號基金透過公開承銷，以每股 21.50 美元出售約 269 萬股、約 5,490 萬美元，公司本身沒有拿到任何資金；9/14 同屬 Tricor 體系的新持股載體 Tricor PMT25 以同價承接 52.5 萬股、約 1,129 萬美元，持股增至約 270 萬股，董事 Nicholas Peters 買進 25 萬美元、Ravi Mallela 買進 2.15 萬美元。怎麼讀：這比較像舊基金到期出場、新基金部分接手，董事願意在發行價跟著買，代表內部人不認為 21.50 美元偏貴。風險與反方論點：賣出金額是買進的近五倍，市場淨增約 200 萬股流通籌碼，短期可能壓股價；論點核心仍是毛利率能否止跌。這是研究線索，不是投資建議。", "en": "CPI Card Group makes payment cards and provides card personalization; it entered the pool on 14.9% revenue growth, a 293% profit jump and raised guidance. New development: two Tricor Fund IV entities managed by Parallel49 sold about 2.69 million shares at $21.50 in an underwritten offering, roughly $54.9 million, with no proceeds to the company; on Sept. 14 Tricor PMT25, a newer Tricor vehicle, bought 525,000 shares at the same price, about $11.3 million, lifting its stake to about 2.7 million shares, while directors Nicholas Peters bought $250,000 and Ravi Mallela $21,500. How to read it: an older fund exiting with a new vehicle partly stepping in, and directors buying at the offering price suggests insiders don't see $21.50 as rich. Risks and counterpoints: sales were nearly five times purchases, adding about 2 million shares of float that may weigh on the stock; the thesis still hinges on gross margin. This is a research lead, not investment advice.", "url": "https://www.investing.com/news/insider-trading-news/tricor-pmt25-holdings-10-owner-buys-113m-of-cpi-card-group-shares-93CH-4900744", "stocks": [{"t": "PMTS", "n": "CPI Card Group，舊基金賣 5,490 萬美元、新載體與兩位董事以 21.50 美元承接"}], "status": "RADAR · 池內更新 · 下一個驗證點 11 月 Q3 財報：毛利率能否止跌回升、股價能否守住 21.50 美元發行價"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "新名字 · 營收跌獲利升", "color": "#C9A227", "zh": "Designer Brands 是美國折扣鞋履零售商 DSW 的母公司，另有 Topo Athletic 等自有品牌，市值約 3.3 億美元。為什麼被忽視：實體鞋店被歸類成夕陽產業，同店銷售還在衰退，分析師與媒體關注度低，股價長期貼著低檔。什麼正在改變：第二季（至 8/1）營收年減 1.2% 至 7.306 億美元、同店銷售年減 2.4%，但淨利年增 66.7% 至 1,760 萬美元、每股 0.31 美元；報表毛利率從 43.6% 升到 50.0%，調整後 47.9%；全年調整後每股盈餘指引從 0.28 至 0.38 美元大幅上調到 0.47 至 0.52 美元，營收指引也從「減 1% 到增 1%」改為「持平到增 1%」，管理層說第三季開局正向。風險與反方論點：財報日 9/10 股價已漲 14.75%；營收與同店銷售仍在下滑，獲利改善主要來自毛利率與成本，這種改善有天花板；報表毛利率含一次性因素，調整後數字才是基準；關稅與消費轉弱直接衝擊鞋類。這是研究線索，不是投資建議。", "en": "Designer Brands is the parent of U.S. discount footwear chain DSW, with owned brands such as Topo Athletic, and a market value of about $330 million. Why it's ignored: brick-and-mortar shoe stores are seen as a sunset industry, comparable sales are still falling, and coverage is thin. What's changing: second-quarter sales through Aug. 1 fell 1.2% to $730.6 million with comps down 2.4%, but net income rose 66.7% to $17.6 million, or $0.31 a share; reported gross margin rose from 43.6% to 50.0%, or 47.9% adjusted; full-year adjusted EPS guidance jumped from $0.28-$0.38 to $0.47-$0.52 and the sales outlook improved to flat to up 1%, with management citing a positive start to the third quarter. Risks and counterpoints: the stock already rose 14.75% on Sept. 10; sales and comps are still shrinking, so margin-driven gains have a ceiling; reported margin includes one-time items; tariffs and weaker consumers hit footwear directly. This is a research lead, not investment advice.", "url": "http://www.prnewswire.com/news-releases/designer-brands-inc-reports-second-quarter-of-2026-financial-results-302874349.html", "stocks": [{"t": "DBI", "n": "Designer Brands，淨利年增 66.7%、全年每股盈餘指引上調約四成"}], "status": "RADAR · 下一個驗證點 12 月 Q3 財報：同店銷售能否止跌、47.9% 調整後毛利率能否延續"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "執行長自掏腰包", "color": "#6DB56D", "zh": "Devon Energy 執行長 Clay Gaspar 9/14 以 51.07 至 51.09 美元買進 3,913 股、約 20 萬美元，直接持股升至 61.9 萬股。值得注意的是 4 天前（9/10）他才獲配 53,979 股限制型股票、分三年歸屬；公司發的股票不花錢，自己掏錢買才算表態。時點落在布蘭特期貨 105 美元以上、實貨油價破 130 美元之際。判讀提醒：20 萬美元只占他持股市值（約 3,160 萬美元）的約 0.6%，是方向性訊號，不是重押。", "en": "Devon Energy CEO Clay Gaspar bought 3,913 shares at $51.07 to $51.09 on Sept. 14, about $200,000, lifting his direct stake to 619,000 shares. Notably, just four days earlier he received 53,979 restricted shares vesting over three years; granted stock costs nothing, while buying with his own cash is a statement. The timing came with Brent futures above $105 and physical crude over $130. Caveat: $200,000 is only about 0.6% of his roughly $31.6 million stake, a directional signal rather than a big bet.", "url": "https://www.investing.com/news/insider-trading-news/devon-energy-ceo-clay-gaspar-buys-199876-in-company-stock-93CH-4900707", "stocks": [{"t": "DVN", "n": "Devon Energy，執行長以約 51 美元買進 20 萬美元"}, {"t": "XOP", "n": "油氣探勘生產 ETF，頁岩油同業對照"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "大股東連續買", "color": "#6DB56D", "zh": "美國與英國汽車經銷集團 Group 1 Automotive 的董事兼 10% 大股東 Conifer Management，9/3 與 9/4 以 277.95 至 305.83 美元買進 140,810 股、約 4,060 萬美元，9/11 再買約 1,338 萬美元；內部人追蹤網站把近期合計列為約 6,430 萬美元，是全市場第二大的內部人買進。買完後直接持股約 141 萬股、市值近 4 億美元，但這批買進只讓持股增加約 3.5%。判讀提醒：金額大、連續買，是強訊號；但買家是投資機構而非經營團隊，押的是長期估值，不是下一季新車銷量。", "en": "Conifer Management, a director and 10% owner of U.S. and U.K. auto dealer Group 1 Automotive, bought 140,810 shares at $277.95 to $305.83 on Sept. 3 and 4, about $40.6 million, then about $13.4 million more on Sept. 11; trackers tally roughly $64.3 million, the second-largest insider buying in the market. It now directly holds about 1.41 million shares worth nearly $400 million, though the purchases lifted its stake only about 3.5%. Caveat: large, repeated buying is a strong signal, but the buyer is an investment firm, not management, betting on long-term value rather than next quarter's car sales.", "url": "https://www.investing.com/news/insider-trading-news/conifer-management-acquires-406m-in-group-1-automotive-gpi-shares-93CH-4892552", "stocks": [{"t": "GPI", "n": "Group 1 Automotive，大股東 Conifer 近期合計買進約 6,430 萬美元"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "小額買進怎麼讀", "color": "#6DB56D", "zh": "9/15 的 Form 4 名單裡有兩筆小額買進：服飾集團 Oxford Industries（Tommy Bahama 母公司）執行副總 Scott Grassmyer 買約 3 萬美元，學校家具龍頭 Virco 執行副總 Douglas Virtue 買約 1.8 萬美元。Virco 第二季營收 8,750 萬美元、年減約 5%，營業利益 1,050 萬美元（去年 1,540 萬），毛利率仍有 40%，學校預算不確定是主因。判讀提醒：這種金額比較像「表態不賣」而非「押注反轉」；強訊號是多位內部人短時間接力買，或單筆占個人持股明顯比例。小額買進適合先放進觀察清單，等第二位內部人跟進再升級。", "en": "Two small purchases appeared in Sept. 15 Form 4 filings: Scott Grassmyer, an EVP at apparel group Oxford Industries, parent of Tommy Bahama, bought about $30,000, and Douglas Virtue, an EVP at school furniture leader Virco, bought about $18,000. Virco's second-quarter sales were $87.5 million, down about 5%, with operating income of $10.5 million versus $15.4 million and a 40% gross margin, hurt by school budget uncertainty. Caveat: amounts like these read more as 'not selling' than betting on a turn; strong signals are clusters of insiders or purchases large relative to holdings. Watchlist them and upgrade if a second insider follows.", "url": "https://www.thedesperatetrader.com/insider-buying", "stocks": [{"t": "OXM", "n": "Oxford Industries，執行副總買進約 3 萬美元"}, {"t": "VIRC", "n": "Virco，執行副總買進約 1.8 萬美元，第二季營收年減約 5%"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "同一天賣十多檔", "color": "#B5654D", "zh": "眾議員 April McClain Delaney（民主黨、馬里蘭州）9/9 至 9/10 申報的交易報告，結構比單筆金額有看頭：8/25 同一天賣出十多檔個股，TransDigm、Wabtec、Viking、Trimble、STERIS、Somnigroup、Signet、Paychex 各 10 萬至 25 萬美元，另有追蹤網站列出 Martin Marietta 與 ITT 各 25 萬至 50 萬美元，以及 Tractor Supply、Middleby、Teledyne 等小額。標的橫跨航太零件、鐵路設備、建材、醫療滅菌與珠寶零售，沒有單一主題，共同點是都屬於「高品質、估值偏高的中大型股」。這個部位結構比較像帳戶層級的整體減碼或再平衡，而不是看空某個產業；方向也跟她 5 月小額買進 TransDigm 與 Martin Marietta 相反。", "en": "Rep. April McClain Delaney (D-Md.) filed reports on Sept. 9 and 10 whose structure matters more than any single trade: on Aug. 25 she sold more than ten stocks, including TransDigm, Wabtec, Viking, Trimble, STERIS, Somnigroup, Signet and Paychex at $100,001 to $250,000 each, with trackers also listing Martin Marietta and ITT at $250,001 to $500,000 and smaller sales of Tractor Supply, Middleby and Teledyne. The names span aerospace parts, rail equipment, building materials, sterilization and jewelry retail, with no single theme beyond high-quality, richly valued mid and large caps. It looks like an account-level trim or rebalance rather than a sector call, and it reverses her small May purchases of TransDigm and Martin Marietta.", "url": "https://www.marketbeat.com/instant-alerts/congress-rep-april-mcclain-delaney-sells-transdigm-group-incorporated-nyse-tdg-stock-2026-09-11/", "stocks": [{"t": "TDG", "n": "TransDigm，航太零件，申報賣出 10 萬至 25 萬美元"}, {"t": "MLM", "n": "Martin Marietta，建材，申報賣出 25 萬至 50 萬美元"}, {"t": "SIG", "n": "Signet，珠寶零售，申報賣出 10 萬至 25 萬美元"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "區間算不出股數", "color": "#B5654D", "zh": "政要持股判讀：申報金額只有寬區間，第三方網站的「持股估值」要打折看。以 Delaney 賣出 TransDigm 為例，申報書只寫 10 萬至 25 萬美元，但有財經網站換算成「賣出後仍持有 21,548 股、價值 2,664 萬美元、持股減少 31.98%」，這些數字是資料商用區間與假設推算出來的，原始申報並沒有股數。時間差也要看清楚：這批交易 8/25 成交、9/9 申報，只隔 15 天；同週共和黨眾議員 Brandon Gill 申報 8/13 買進標普 500 等權重 ETF（5 萬至 10 萬美元），隔了 28 天。跟單者就算申報當天看到，買到的也是別人半個月到一個半月前的價位。", "en": "Reading congressional trades: disclosures give only broad ranges, so third-party 'holding values' deserve skepticism. For Delaney's TransDigm sale the filing says $100,001 to $250,000, yet one site converted it into '21,548 shares remaining, worth $26.64 million, a 31.98% reduction'; those figures are vendor estimates from ranges and assumptions, as the filing lists no share counts. Timing matters too: these trades executed Aug. 25 and were filed Sept. 9, just 15 days later, while Rep. Brandon Gill (R) disclosed an Aug. 13 purchase of an equal-weight S&P 500 ETF ($50,001 to $100,000) after 28 days. Even a same-day follower buys at prices two to six weeks old.", "url": "https://us.trendlyne.com/us/politicians/recent-trades/", "stocks": [{"t": "RSP", "n": "標普 500 等權重 ETF，Gill 申報買進 5 萬至 10 萬美元"}, {"t": "TDG", "n": "TransDigm，第三方持股估值是推算，非申報原文"}]},
    {"id": "week_0", "channel": "本週事件", "tag": "決議週倒數", "color": "#C97DD4", "zh": "接下來三天的總經時間表（台灣時間）：週三晚間 8:30 公布 8 月零售銷售，週四凌晨 2 點利率決議、2:30 華許記者會；週四晚間 8:30 公布初領失業金、8 月新屋開工與建築許可、9 月費城聯儲製造業指數，市場預估初領失業金從 33.2 萬人降到 30.9 萬人；週五晚間是工業生產，同時是三巫日。零售銷售是決議前最後一份消費數據，而先行訊號並不一致：美銀信用卡資料顯示 8 月刷卡消費年增 4.5%，NRS 追蹤的同店銷售卻年減 1.1%。", "en": "The macro schedule for the next three days (Taiwan time): August retail sales at 8:30 p.m. Wednesday, the Fed decision at 2 a.m. Thursday and Warsh's press conference at 2:30; jobless claims, August housing starts and permits and the September Philadelphia Fed index at 8:30 p.m. Thursday, with claims expected to fall to 309,000 from 332,000; and industrial production Friday evening, a triple-witching day. Retail sales are the last consumer read before the decision, and early signals conflict: Bank of America card spending rose 4.5% in August, while NRS-tracked same-store sales fell 1.1%.", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar", "stocks": [{"t": "XRT", "n": "零售類股 ETF，週三零售銷售直接對應"}, {"t": "ITB", "n": "住宅建商 ETF，週四新屋開工在決議後公布"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "FedEx 看什麼", "color": "#C97DD4", "zh": "本週財報重心是 9/17 美股盤後的 FedEx，市場預估每股盈餘約 3.9 美元、營收約 218 億美元，這是 6 月分拆 FedEx Freight 後第一份完整季報，數字不能直接和去年比。要看三件事：國際包裹量有沒有受關稅與電商放緩拖累、燃油附加費能否跟上 105 美元以上的油價、管理層對年底旺季的說法。這份財報也是其他貨運股的溫度計：Radiant Logistics 剛說國內貨運可能迎來較持久的復甦，FedEx 若給出相反訊號，類股的復甦敘事就要打折。下週還有 General Mills（9/23）與 Darden（9/24 盤前）。", "en": "This week's key report is FedEx after the bell on Sept. 17, with consensus near $3.90 a share on about $21.8 billion in revenue; it is the first full quarter since the June spin-off of FedEx Freight, so year-ago comparisons don't line up. Watch three things: whether international parcel volume is hit by tariffs and slower e-commerce, whether fuel surcharges keep pace with oil above $105, and management's peak-season outlook. It is also a thermometer for freight stocks: Radiant Logistics just described a potentially durable domestic recovery, and a contrary FedEx read would undercut that story. General Mills (Sept. 23) and Darden (Sept. 24, premarket) follow next week.", "url": "https://www.thestreet.com/markets/general-mills-darden-fedex-earnings-could-reveal-inflation-trends", "stocks": [{"t": "FDX", "n": "FedEx，9/17 盤後財報，分拆後首份完整季報"}, {"t": "FDXF", "n": "FedEx Freight，前子公司，對照工業貨量讀數"}, {"t": "GIS", "n": "General Mills，財報在下週 9/23"}]},

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/16/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v11.1</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
