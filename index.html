<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },

  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "週線收官", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普500 ETF，週線僅漲0.1%，指數收7,718.60點"}, {"t": "DIA", "n": "道瓊 ETF，週線跌0.3%，三大指數中最弱"}, {"t": "QQQ", "n": "那斯達克 ETF，週線漲0.4%，是唯一收紅的主要指數"}], "en": "August payrolls came in at 162,000 against a consensus near 53,000, with unemployment steady at 4.1%. Under a Fed chaired by Kevin Warsh and focused on inflation rather than cushioning employment, a hot labour print is the hawkish outcome, so stocks closed lower on the day. Over the full week almost nothing changed: the S&P 500 finished at 7,718.60, up just 0.1%, the Dow lost 0.3% and the Nasdaq gained 0.4%. The path mattered more than the destination, with an early dip, a mid-week rebound on dovish Waller remarks, and a Friday give-back.", "zh": "上週五的八月非農就業新增十六萬兩千人，市場原本只預估五萬三千人，失業率仍守在百分之四點一。在華許主政、以壓通膨為優先的聯準會底下，就業強反而是鷹派結果，所以股市當天收黑。整週算下來卻幾乎沒動：標普五百收在七千七百一十八點六零、週線僅漲百分之零點一，道瓊跌百分之零點三，那斯達克漲百分之零點四。市場其實是先跌、中間因為沃勒偏鴿而反彈、週五又全部吐回去。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-04-2026"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "殖利率翻盤", "color": "#E05C5C", "stocks": [{"t": "SHY", "n": "短天期公債 ETF，兩年期殖利率4.377%是這輪定價的主戰場"}, {"t": "TLT", "n": "長天期公債 ETF，十年期升到4.784%，長端反而動得少"}, {"t": "UUP", "n": "美元指數 ETF，指數被推上99.2"}], "en": "The bond market reacted far more violently than equities. The two-year Treasury yield jumped more than four basis points to 4.377%, touching its highest level since January 2025 intraday, while the ten-year added over two basis points to 4.784%. Fed funds futures moved from roughly a 52% chance of a September hike before the release to about 59% after, and the dollar index was pushed to around 99.2. The action was concentrated at the front end rather than the long end, which says the market repriced the next few months rather than its long-run inflation view.", "zh": "債市對這份就業數據的反應比股市大得多。兩年期公債殖利率跳升逾四個基點到百分之四點三七七，盤中一度創下二零二五年一月以來最高；十年期升逾兩個基點到百分之四點七八四。聯邦資金期貨對九月升息的定價，從數據公布前的約五成二直接跳到約五成九，美元指數也被推上九十九點二。短天期利率是這輪定價的主戰場，長天期反而動得少，代表市場調整的是「接下來幾個月」而不是「長期通膨預期」。", "url": "https://www.cnbc.com/2026/09/04/treasurys-bonds-nonfarm-payrolls-unemployment-data.html"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "三檔重摔", "color": "#E05C5C", "stocks": [{"t": "GWRE", "n": "保險核心系統軟體商，指引偏低跌22.2%"}, {"t": "LULU", "n": "運動服飾品牌，營收未達標並下修財測，跌18%"}, {"t": "NOW", "n": "企業流程軟體龍頭，軟體族群當日普遍遭獲利了結"}], "en": "The real story on Friday was not the index but three separate double-digit collapses, each with an unrelated cause. Guidewire fell 22.2% after a beat was overshadowed by soft first-quarter revenue guidance, Lululemon dropped 18% on a revenue miss, deteriorating comparable sales and a cut full-year outlook, and Fair Isaac sank 17.5% because of a single government directive. Software names including ServiceNow, Snowflake and Workday also saw profit taking on the same session. In one day the market demonstrated three different ways a stock can be repriced: guidance, demand, and policy.", "zh": "週五盤面上真正的故事不在指數，而在三檔各自重摔的個股，而且三個原因彼此無關。Guidewire 大跌百分之二十二點二，因為財報超標但下一季營收指引偏低；Lululemon 跌百分之十八，因為營收未達標、同店銷售惡化並且下修全年財測；Fair Isaac 跌百分之十七點五，原因是一紙政府命令。同一天軟體族群也普遍被獲利了結，ServiceNow、Snowflake、Workday 都走弱。單日之內，指引、需求與政策三種殺傷力同時示範了一次。", "url": "https://investrade.com/mid-morning-look-september-04-2026/"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "油與柴油", "color": "#E05C5C", "stocks": [{"t": "XLE", "n": "能源股 ETF，油價週漲近一成的直接受惠板塊"}, {"t": "VLO", "n": "煉油商代表，柴油創新高對煉油價差是直接順風"}, {"t": "USO", "n": "原油 ETF，西德州原油收每桶91.48美元"}], "en": "Commodities, not equities, were the week's epicentre. With the US and Iran resuming military exchanges in the seventh month of their conflict, Brent rose roughly 7-8% on the week to settle at $96.28 and WTI gained close to 10% to $91.48, the largest weekly advances for both since the week ended July 20. More telling than crude was diesel, which hit a record high, meaning the shock has already passed through into refined products. Only four commodity vessels transited the Strait of Hormuz on Thursday, against a ten-day average of about fifteen.", "zh": "商品這一週才是真正的震央。美伊在衝突的第七個月重啟軍事交火，美國空襲、伊朗反擊美軍基地並攻擊通過荷姆茲海峽的船隻，布蘭特原油週漲約百分之七至八、收在每桶九十六點二八美元，西德州原油週漲近百分之十、收九十一點四八美元，雙雙寫下七月二十日當週以來最大週漲幅。更值得注意的是柴油價格創下新高，那代表衝擊已經從原油傳導到成品油。週四通過荷姆茲海峽的商品船只有四艘，遠低於十日均值約十五艘。", "url": "https://www.cnbc.com/2026/09/04/oil-set-for-steepest-weekly-gain-over-renewed-us-iran-tensions.html"},
    {"id": "earn_0", "channel": "財報速報", "tag": "指引定生死", "color": "#E8786A", "stocks": [{"t": "GWRE", "n": "財報超標但下一季指引偏低，單日跌22.2%"}, {"t": "PGR", "n": "大型產險公司，是這類核心系統的終端客戶，指引疲軟等於保險業資訊支出放緩"}], "en": "Guidewire's fiscal fourth quarter was a beat on both revenue and earnings, yet the stock collapsed 22.2% on Friday. The single reason was a first-quarter fiscal 2027 revenue outlook that came in below expectations. The company sells core systems to property and casualty insurers, which makes it infrastructure spending for the insurance industry, and clients typically decide on that spending one or two quarters ahead of the cycle. So the guidance is not only a read on one software vendor, it is also a read on how willing insurers are to spend.", "zh": "Guidewire 交出的第四季財報是超標的，營收與獲利都比市場預期好，但股價週五重摔百分之二十二點二。原因只有一個：二零二七會計年度第一季的營收展望低於市場預期。這家公司賣的是產險公司的核心系統，屬於保險業的資訊基礎建設，客戶決定要不要花這筆錢通常領先景氣一兩個季度。所以這份指引的意義不只是一家軟體公司的業績，它也是保險業資本支出意願的一個讀數。", "url": "https://www.chartmill.com/news/TMCWW/Chartmill-54400-Premarket-Stock-Movers-for-Friday-September-4-2026-Top-Gainers-and-Losers"},
    {"id": "earn_1", "channel": "財報速報", "tag": "消費分層", "color": "#E8786A", "stocks": [{"t": "LULU", "n": "第三季營收未達標、下修全年財測，跌18%"}, {"t": "NKE", "n": "運動服飾同業對照組，需求分層的另一個觀察點"}, {"t": "ANF", "n": "中價位服飾零售商，可選消費被砍時的相對受害者"}], "en": "Lululemon's 18% Friday decline was the heaviest single blow to consumer names this quarter. Third-quarter revenue missed, comparable sales deteriorated and the company cut its full-year outlook, and three things happening together are hard to dismiss as one noisy quarter. Worth placing alongside it is that energy and consumer staples were at or near record levels in the same week. That pattern suggests US consumption is not weakening across the board but separating into tiers, with staples still being bought while discretionary premium apparel gets cut.", "zh": "Lululemon 週五跌百分之十八，是這一季消費類股最重的一記。第三季營收未達市場預期、同店銷售惡化，公司同時下修全年財測，三件事一起發生就不容易被解讀成單季雜訊。值得放在旁邊看的是，同一週能源與必需消費類股卻分別逼近或創下新高。這說明目前的美國消費不是全面轉弱，而是分層：民生必需的部分還在花，可選的高價服飾正在被砍。", "url": "https://www.cnbc.com/2026/09/03/stock-market-today-live-updates.html"},
    {"id": "earn_2", "channel": "財報速報", "tag": "軟體重訂價", "color": "#E8786A", "stocks": [{"t": "IGV", "n": "軟體股 ETF，整個族群在殖利率上行時同步承壓"}, {"t": "ZS", "n": "資安軟體商，財報後走弱的其中一檔"}, {"t": "PATH", "n": "自動化流程軟體商，同樣在財報後被賣"}], "en": "Lining up last week's post-earnings software declines shows this is not a company-specific problem. Asana, eGain, Guidewire, UiPath and Zscaler all fell after reporting, and on Friday even names that had not reported, including Monday.com, ServiceNow, Snowflake and Workday, were sold on profit taking. In the same week yields rose and the odds of a September hike rose, which lands directly on the valuation of long-duration cash flows. The revenue growth is still there, but the multiple the market will pay for that growth is being renegotiated.", "zh": "把上週財報後下跌的軟體公司排在一起看，會發現這不是個別公司的問題。Asana、eGain、Guidewire、UiPath、Zscaler 財報後全數走弱，週五連沒發財報的 Monday.com、ServiceNow、Snowflake、Workday 也一起被獲利了結。同一週殖利率往上、升息機率往上，這對長天期現金流的軟體股是估值端的直接壓力。營收成長還在，但市場願意為那個成長付的倍數正在被重新談判。", "url": "https://seekingalpha.com/article/4943211-oracle-adobe-results-in-focus-as-earnings-season-winds-down"},
    {"id": "macro_0", "channel": "總經政策", "tag": "定價來回", "color": "#7C6AF7", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，整週在鴿派與鷹派定價之間來回"}, {"t": "UUP", "n": "美元指數 ETF，週五定價轉鷹後被推上99.2"}], "en": "The market repriced the Fed twice in one week. It started defensive on geopolitical risk and the oil spike, rallied mid-week when Governor Waller struck a dovish tone and yields eased, then flipped fully hawkish on Friday's payrolls, with September hike odds moving from about 52% to roughly 59%. Note that quoted probabilities vary widely by source, with one desk showing 82% on September 2 and another around 43%, differences that come from sampling time and contract choice. The number to remember is not which quote is right but that this probability can travel more than ten points inside a single week.", "zh": "這一週市場對聯準會的定價來回擺盪了兩次。週初因為地緣風險與油價跳升而偏空，週中理事沃勒發表偏鴿談話讓殖利率回落、股市反彈，週五非農一出又全部翻回鷹派，九月升息機率從約五成二跳到約五成九。要注意的是各家報價口徑差很多，有機構在九月二日算出高達八成二、也有算出約四成三的，差異來自取樣時點與合約選擇。真正該記住的不是哪個數字對，而是這個機率在一週內能上下移動十幾個百分點。", "url": "https://www.schwab.com/learn/story/stock-market-update-open"},
    {"id": "macro_1", "channel": "總經政策", "tag": "兩份數據", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，兩份數據的直接定價標的"}, {"t": "IEF", "n": "中天期公債 ETF，CPI 當天最容易出現跳空的區間"}], "en": "The coming week's weight sits almost entirely on two inflation prints. The Producer Price Index lands before the open on Thursday September 10 and the Consumer Price Index before the open on Friday September 11, followed by the September 15-16 policy meeting and an updated dot plot. The complication is that the officials' quiet period began on September 5 and runs through September 17, so if either print surprises there is no official commentary available to soften it in either direction. Last week's near 10% move in crude also feeds straight into the energy component of both readings.", "zh": "接下來這一週的重量全壓在兩份通膨數據上。生產者物價指數在九月十日週四開盤前公布，消費者物價指數在九月十一日週五開盤前公布，然後就是九月十五、十六日的利率會議與更新的點陣圖。麻煩在於官員的靜默期已經從九月五日開始、要到九月十七日才解除，也就是說如果數據意外，中間沒有任何官方談話可以往任一方向緩衝。而且上週油價才漲了近一成，那會直接進到這兩份數據的能源項裡。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar"},
    {"id": "macro_2", "channel": "總經政策", "tag": "強勢美元", "color": "#7C6AF7", "stocks": [{"t": "GLD", "n": "黃金 ETF，實質利率預期上行時的直接受害者"}, {"t": "EEM", "n": "新興市場 ETF，強勢美元加高油價是雙重逆風"}], "en": "The dollar index was pushed to 99.2 after payrolls, with gold and bitcoin sold at the same time, a very typical pairing: when expected real rates rise, non-yielding assets lose relative appeal. The effect spills outward, because dollar-priced commodities become more expensive for non-US buyers and crude is already elevated. For markets outside the United States, in other words, this single week delivered imported inflation and a higher cost of capital simultaneously. If Friday's CPI runs hot again, that combination tightens further.", "zh": "非農公布後美元指數被推上九十九點二，黃金與比特幣同步被打，這是一個很典型的組合：實質利率預期往上，不生息資產就會失去相對吸引力。這件事的影響會外溢，因為以美元計價的商品對非美國家會變貴，而目前油價本來就在高檔。也就是說，對美國以外的市場來說，這一週同時發生了輸入性通膨與資金成本上升兩件事。若下週五的消費者物價指數再度超標，這個組合會更緊。", "url": "https://www.capitalstreetfx.com/market-analysis/dollar-and-yields-jump-4-september-2026/"},
    {"id": "sector_0", "channel": "產業風向", "tag": "護城河被拆", "color": "#4EABA4", "stocks": [{"t": "FICO", "n": "信用評分供應商，房貸評分獨占地位被行政命令打破，單日重摔"}, {"t": "TRU", "n": "三大信用資料局之一，當日跌約9%"}, {"t": "EFX", "n": "三大信用資料局之一，當日跌約8%"}], "en": "Federal Housing Finance Agency Director Bill Pulte last Friday ordered Fannie Mae and Freddie Mac to accept VantageScore 4.0 from all mortgage originators effective immediately, expanding what had been a pilot capped at fifty lenders into a market-wide mandate. The stated rationale was that the price of a single credit score has risen 1,800% since 2020. Fair Isaac fell roughly 17.5% to 21%, TransUnion about 9%, Equifax about 8% and London-listed Experian about 4.6%. The lesson worth keeping: a moat granted by regulation can be withdrawn by regulation in a single morning.", "zh": "聯邦住房金融局局長普爾特上週五直接下令房利美與房地美即刻起接受所有房貸業者提交的 VantageScore 4.0 信用評分，把原本上限五十家業者的試點一次擴大到全市場。理由是自二零二零年以來單筆信用評分的價格上漲了百分之一千八百。消息一出 Fair Isaac 跌約百分之十七點五至二十一，環聯跌約百分之九、易速傳真跌約百分之八、英國掛牌的 Experian 跌約百分之四點六。這是本週最值得記住的一課：由法規或制度授予的護城河，也可以由法規在一個早上收回。", "url": "https://www.mpamag.com/us/mortgage-industry/industry-trends/fhfa-opens-vantagescore-40-to-all-gse-lenders-immediately/588772"},
    {"id": "sector_1", "channel": "產業風向", "tag": "運費才是主角", "color": "#4EABA4", "stocks": [{"t": "INSW", "n": "國際海運油輪股東，現貨運價直接進損益"}, {"t": "STNG", "n": "成品油輪船東，柴油創新高與航程拉長的雙重受惠者"}, {"t": "FRO", "n": "超大型油輪船東，日租金逼近每天50萬美元的主要曝險"}], "en": "Hormuz disruption pushed tanker equities to decade highs last week, and the true record was set in freight rather than in crude. Very large crude carriers on the benchmark Middle East to Asia route approached $500,000 a day, with a print near $438,483. In the Atlantic basin mid-sized tankers averaged about $91,000 a day, roughly 50% above the previous record, with Suezmaxes near $109,000 and Aframax LR2s about $74,100. Crude prices express expectations about supply, while freight expresses whether ships are willing to sail today, which makes rates the more immediate thermometer of this shock.", "zh": "荷姆茲海峽的亂局讓油輪類股上週衝上十年新高，而真正創紀錄的其實不是油價、是運費。中東到亞洲基準航線的超大型油輪日租金一度逼近每天五十萬美元、實際成交在四十三萬八千四百八十三美元附近；大西洋盆地的中型油輪平均約每天九萬一千美元、比先前紀錄高出約五成，其中蘇伊士型約十萬九千美元、阿芙拉型約七萬四千一百美元。原油價格反映的是供給預期，運費反映的是「現在有沒有船敢走」，後者才是這波衝擊的即時體溫計。", "url": "https://www.cnbc.com/2026/09/03/shipping-hormuz-tankers-earnings-freight-rates-iran-trump-crude-china-stocks.html"},
    {"id": "sector_2", "channel": "產業風向", "tag": "輪動已成形", "color": "#4EABA4", "stocks": [{"t": "XLU", "n": "公用事業 ETF，資料中心用電需求下的今年強勢股之一"}, {"t": "XLP", "n": "必需消費 ETF，與能源同步走到歷史高點附近"}, {"t": "XLE", "n": "能源股 ETF，年初至今漲逾22%，今年最強板塊"}], "en": "Laying out this year's sector performance shows leadership changed some time ago. Energy is up more than 22% year to date, with energy, utilities and consumer staples all at or near record levels, while technology, communication services and consumer discretionary cool. Industrials are supported by capital spending on electricity capacity, data centre related construction, defence and energy, and that same spending spills into materials. The setup has a precondition, though: it works best when inflation and rates rise while growth holds up, and it loses its pivot if growth slows materially.", "zh": "把今年的板塊表現攤開來看，領導權早就換人了。能源類股年初至今漲逾百分之二十二，能源、公用事業與必需消費同時走到歷史新高附近，而科技、通訊服務與可選消費則在降溫。工業股背後有電力容量、資料中心相關基建、國防與能源的資本支出在撐，這條線同時外溢到原物料。但這套組合有個前提：它在通膨與利率往上、成長又沒垮的環境裡最舒服，一旦成長明顯放慢，這個劇本會失去支點。", "url": "https://www.investing.com/analysis/sector-rotation-intensifies-value-outperforms-growth-in-2026-market-split-200675093"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "背離的一週", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，週五逆勢收漲0.27%至2,976.16點"}, {"t": "DIA", "n": "道瓊 ETF，本週稍早與羅素出現今年最大單日落差"}], "en": "Small caps sent two contradictory signals last week. On Friday, the day payrolls landed hot and hike odds jumped, the Russell 2000 still closed up 0.27% at 2,976.16. Yet earlier in the same week the index produced the widest single-day gap against the Dow so far in 2026, falling 1.23% while the Dow rose 0.37%. The same basket of stocks was traded twice inside one week, once as a beneficiary of a strong economy and once as a victim of higher rates. That contradiction will not be forced to resolve until Friday's CPI.", "zh": "小型股上週給了兩個互相矛盾的訊號。週五非農公布、升息機率跳升的那一天，羅素二千指數反而逆勢收漲百分之零點二七至二千九百七十六點一六；但同一週稍早，卻出現了二零二六年至今道瓊與羅素二千最大的單日落差，羅素跌百分之一點二三、道瓊反而漲百分之零點三七。同一批股票在同一週被當成「景氣受惠者」和「利率受害者」交易了兩次。這個矛盾要等到本週五的消費者物價指數才會被迫解決。", "url": "https://pomegra.io/news/dow-vs-russell-2000-2026s-sharpest-single-day-split"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "浮動利率", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普小型股600 ETF，同樣受浮動利率負債結構影響"}, {"t": "KRE", "n": "區域銀行 ETF，是小型股最主要的浮動利率放款來源"}], "en": "If one number explains why small caps fear rate hikes, it is the debt structure. Roughly 40% of Russell 2000 constituent debt is floating rate against under 10% for the S&P 500, which means a policy move shows up in small-cap interest expense within the same quarter while large caps can shelter behind existing fixed-rate bonds for years. Bank of America estimates each additional quarter-point hike erodes Russell 2000 operating earnings by about 2%. That is why the September 11 CPI print carries far more weight for small caps than it does for the S&P 500.", "zh": "如果要用一個數字解釋小型股為什麼特別怕升息，那就是負債結構。羅素二千成分公司約有四成的債務是浮動利率，標普五百則不到一成，換句話說政策利率一動，小型股的利息費用當季就會反映，大型公司卻可以躲在既有的固定利率債券後面好幾年。美銀估算，每多升一碼，羅素二千的營業獲利大約會被侵蝕百分之二。這就是為什麼九月十一日的消費者物價指數對小型股的意義，比對標普五百大得多。", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "便宜已收斂", "color": "#5B8ED6", "stocks": [{"t": "IWN", "n": "羅素2000價值型 ETF，今年相對強勢的主要來源"}, {"t": "IWO", "n": "羅素2000成長型 ETF，估值收斂後彈性較小的一側"}], "en": "Small caps have actually won this year. The Morningstar US Small Cap Market Index outperformed the broad US market by more than three percentage points in the first half and beat large caps by more than five, a stretch of relative strength that has been rare for years. The same research warns that precisely because of the run, small caps as a group no longer look as undervalued as they did in January and the discount has visibly narrowed. The implication for stock selection is direct: the phase of buying the asset class is over, and only individual names are still cheap.", "zh": "小型股今年其實贏了。晨星美國小型股指數在上半年就贏了整體市場逾三個百分點、贏大型股逾五個百分點，這是多年來少見的相對強勢。但同一份研究也提醒，正因為漲過了，小型股整體已經不像年初那麼便宜，折價空間明顯收斂。這對選股的意義很直接：從「買整個資產類別」的階段，進入「只有個別公司還便宜」的階段，指數型的做法會愈來愈難再複製上半年的成績。", "url": "https://www.morningstar.com/stocks/best-small-cap-stocks-buy-today"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "抗跌的理由", "color": "#5B8ED6", "stocks": [{"t": "PSC", "n": "小型股主動型 ETF，成分偏向本土營收來源的公司"}, {"t": "VTWO", "n": "羅素2000 ETF，另一檔追蹤同一指數的低費用選擇"}], "en": "There is a structural explanation worth keeping for why small caps held up on Friday despite a hawkish print. Small-cap revenue is largely domestic, so strong employment is a genuine tailwind on the sales line, and that force offsets the headwind from rates. The asymmetry is in timing: the revenue benefit shows up in reported results one or two quarters later, while the interest expense hits the very next quarter. Friday's resilience therefore does not mean the market judged small caps safe, only that the two forces are offset along the calendar.", "zh": "小型股週五為什麼在鷹派數據下反而抗跌，有一個結構性的解釋值得留著。小型股的營收多半來自美國本土，所以強勁就業對它們的營收面是真實的順風，這股力量會跟利率面的逆風對衝。差別在於營收的好處要一兩季後才會出現在財報上，利息成本的壞處卻是下一季就結算。也就是說週五的抗跌不代表市場判斷小型股安全，而是兩股力量剛好在時間軸上錯開了。", "url": "https://www.investing.com/analysis/small-caps-are-quietly-winning-while-mega-caps-wobble-200684618"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "池子不一樣", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，成分不要求納入前連續獲利"}, {"t": "IJR", "n": "標普小型股600 ETF，納入前需有連續獲利紀錄"}], "en": "Many people treat the Russell 2000 and the S&P SmallCap 600 as the same thing, but their entry criteria differ substantially. The S&P 600 requires a record of consecutive profitability before inclusion while the Russell 2000 imposes no such screen, so a meaningful share of its constituents are still unprofitable at the operating level. Rising rates amplify that difference, because unprofitable companies survive on external financing and financing cost is currently the least predictable variable. When a headline says small caps rallied, the first question is which of the two pools it means.", "zh": "很多人把羅素二千和標普小型股六百當成同一件事，但它們的入池標準差很多。標普六百要求公司在納入前必須有連續獲利紀錄，羅素二千沒有這個門檻，所以裡面有相當比例的成分股本業還在虧錢。這在利率往上的環境會被放大：沒有獲利的公司要靠外部融資活著，而融資成本正是現在最不確定的變數。所以看到「小型股上漲」這種標題時，第一件事是問它指的是哪一個池子。", "url": "https://www.equiti.com/sc-en/news/trade-reviews/russell-2000-gains-and-2026-technical-outlook/"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新上池", "color": "#C9A227", "stocks": [{"t": "MFP", "n": "本卡主角，七月分拆掛牌的食品加工設備商，首季超標但盤後仍跌1.8%"}, {"t": "MIDD", "n": "分拆母公司 Middleby，一比一配股是被動賣壓的來源"}], "en": "Midera Food Processing makes processing equipment and automation for protein, bakery and snack producers, with more than thirty brands, over 100,000 units installed globally and about 2,800 employees, spun off from Middleby on July 6 and listed on Nasdaq on July 7. The neglect is structural: a one-for-one distribution handed institutional holders of the parent a pile of a much smaller company, index and mandate rules created forced selling, and two months in the analyst coverage is still thin. What is changing is the first standalone quarter reported August 13: revenue of $245 million, up 13%, with estimated standalone adjusted EBITDA of $42 million above the top of its own guidance, full-year revenue guidance raised to $935-965 million and EBITDA to $160-176 million, plus a $50 million buyback authorisation. The counter-case is equally clear: organic growth lags headline growth, meaning much of it comes from acquisitions and backlog conversion; the $1.0 billion revolving facility signed at separation is both a ceiling and a temptation on leverage; and processing equipment is capital goods, so customer expansion decisions slip with the cycle. This is a research lead, not investment advice.", "zh": "Midera Food Processing 做的是給肉品、烘焙與零食廠用的食品加工設備與自動化，旗下超過三十個品牌、全球裝機超過十萬台、員工約兩千八百人，七月六日才從 Middleby 分拆完成、七月七日在那斯達克掛牌。被忽視的原因很結構性：一比一配股讓原本持有母公司的法人被動拿到一堆小公司股票、指數與委任範圍造成賣壓，加上上市才兩個月、分析師覆蓋還很薄。正在改變的是它的第一份獨立季報：八月十三日公布單季營收二點四五億美元、年增百分之十三，估算的獨立調整後 EBITDA 四千二百萬美元超過自家指引上緣，全年營收指引上調到九點三五至九點六五億美元、EBITDA 上調到一點六至一點七六億美元，董事會另外核准五千萬美元庫藏股。風險與反方論點也很清楚：有機成長明顯落後整體成長，代表相當部分來自併購與在手訂單消化；分拆時簽下的十億美元循環信用額度是槓桿的上限也是誘惑；食品加工設備是資本財，客戶的擴廠決策會隨景氣延後。這是研究線索，不是投資建議。", "url": "https://www.investing.com/news/company-news/midera-q2-2026-slides-spinoff-debut-beats-guidance-organic-growth-lags-93CH-4859494", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（看拆掉併購後的有機成長率）"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "整個產業被忽視", "color": "#C9A227", "stocks": [{"t": "NSP", "n": "本卡主角之一，執行長二零二六年三度買進自家股票，股價一度腰斬"}, {"t": "TNET", "n": "同業第二條腿，保險成本率由88%改善到84%、董事五月買進"}], "en": "This card is about an industry rather than a company: professional employer organisations, the firms that run payroll, benefits and health plans for small businesses. Insperity has fallen more than 50% from its highs, and chief executive Paul Sarvadi bought his own stock three times in 2026, roughly $4.6 million for 201,987 shares in March, about $2.87 million for 100,000 shares in May, and about $7.93 million for 233,000 shares in June. Peer TriNet supplies a second leg: first-quarter revenue of $1.226 billion was down 5% with average worksite employees down 12%, yet the insurance cost ratio improved from 88% to 84%, and director Brian Evanko bought 5,000 shares for about $188,500 on May 18. What is changing is the pricing logic of the industry, as operators deliberately reprice unprofitable health-benefit clients away, which guarantees ugly revenue and headcount in the short run but leaves better economics on every client who stays. The counter-case: attrition may not stop, medical cost trend remains outside their control, insider buying does not guarantee revenue troughs, and Sarvadi has been buying since March without the stock stabilising. This is a research lead, not investment advice.", "zh": "這一張講的不是一家公司，而是一整個被市場放棄的行業：專業僱主組織，也就是替中小企業代管薪資、福利與健保的外包業者。Insperity 股價一度自高點腰斬逾五成，執行長薩瓦迪在二零二六年三度進場買自家股票，三月買進二十萬一千九百八十七股約四百六十萬美元、五月買十萬股約二百八十七萬美元、六月買二十三萬三千股約七百九十三萬美元。同業 TriNet 的數字則提供了第二條腿：第一季營收十二點二六億美元、年減百分之五，服務員工數少了百分之十二，但保險成本率從百分之八十八改善到百分之八十四，董事伊凡科於五月十八日買進五千股約十八萬八千五百美元。正在改變的是這個行業的定價邏輯：業者主動把虧錢的健保客戶漲價趕走，短期營收與人數一定難看，但每一位留下來的客戶利潤更好。風險與反方論點：客戶流失可能停不下來、健保成本仍然不可控、內部人買進不等於營收能止跌，而且薩瓦迪自三月起就一路買、股價至今並未止穩。這是研究線索，不是投資建議。", "url": "https://www.fool.com/coverage/filings/2026/06/09/is-insperity-stock-a-buy-after-its-ceo-purchased-shares-worth-usd7-9-million/", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報（看服務員工數能否止跌）"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "外部驗證到位", "color": "#C9A227", "stocks": [{"t": "TNK", "n": "池內名字，現貨油輪船東，蘇伊士型現貨均價約每天10.9萬美元"}], "en": "Teekay Tankers entered the pool on September 2 with a simple business: it owns Suezmax and Aframax crude tankers and sells voyages at spot rates. The verification point recorded at entry was the realised rate on third-quarter booked days, with the company having disclosed about 44% of Suezmax spot days fixed above $100,000 per day. Last week's Hormuz disruption turned that into externally observable fact, with Atlantic basin Suezmaxes averaging roughly $109,000 a day, mid-sized tankers about 50% above the prior record, and tanker equities hitting decade highs, on top of the company's own record second quarter of $194 million adjusted net income, or $5.56 per share. The counter-case must be stated plainly: this is a war premium rather than structural demand, and rates fall quickly on a ceasefire or a reopened strait; a spot owner has no contract protection, so the move down is as fast as the move up; and a great deal is already in the price. This is a research lead, not investment advice.", "zh": "Teekay Tankers 是九月二日入池的名字，做的事情很單純：擁有蘇伊士型與阿芙拉型原油輪，用現貨運價一趟一趟賣航次。入池時記下的驗證點是「第三季已訂船期的實現價格」，當時公司揭露蘇伊士型已訂約四成四船期、均價每天超過十萬美元。上週荷姆茲亂局把這個數字變成外部可查的事實：大西洋盆地蘇伊士型現貨均價約每天十萬九千美元、中型油輪整體比先前紀錄高出約五成，油輪類股同步衝上十年新高，第二季公司本身已交出調整後淨利一億九千四百萬美元、每股五點五六美元的紀錄。風險與反方論點必須寫清楚：這是戰爭溢價，不是結構性需求，停火或荷姆茲恢復通行時運價會很快回落；現貨船東沒有長約保護，好起來快、壞下去也快；而且股價已經反映了很多。這是研究線索，不是投資建議。", "url": "https://www.lloydslist.com/LL1156757/Atlantic-aframax-and-suezmax-spike-highlights-severity-of-Hormuz-chaos", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報（實現運價與已訂船期比例）"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "stocks": [{"t": "BORR", "n": "池內名字，淺水自升式鑽井平台業者，董事長八月二十五日買進20萬股"}], "en": "Borr Drilling entered the pool on August 20 as an offshore driller that operates only shallow-water jackup rigs, a textbook case of double neglect with a micro to small market capitalisation, low media volume and thin coverage. The first signal after entry was chairman Tor Olav Troim buying 200,000 shares in the open market on August 25 for about $874,620, near $4.37 per share. Last week supplied a second external condition, with WTI settling at $91.48 after a near 10% weekly gain, a level at which the renegotiation room on shallow-water drilling contracts looks materially different. The counter-case: the industry is deeply cyclical and the balance sheet carries meaningful debt, so the thesis needs rereading if crude returns below $80; one chairman buying is a signal but not a cluster; and contract repricing typically lags the oil price by several quarters. This is a research lead, not investment advice.", "zh": "Borr Drilling 是八月二十日入池的離岸鑽井業者，只做淺水自升式鑽井平台，屬於典型的雙重忽視：微型到小型市值、媒體聲量低、覆蓋薄。入池後的第一個訊號是董事長特羅伊姆在八月二十五日於公開市場買進二十萬股、金額約八十七萬四千六百二十美元，每股約四點三七美元。上週提供了第二個外部條件：西德州原油收在每桶九十一點四八美元、週漲近一成，油價站在這個水位時，淺水鑽井合約的重新議價空間會明顯不同。風險與反方論點：這個產業高度週期、公司負債結構偏重，油價一旦回到八十美元以下論點就要重審；董事長買進是訊號但只有一位、不構成群聚；而且合約的重新定價通常落後油價好幾個季度。這是研究線索，不是投資建議。", "url": "https://tradingeconomics.com/commodity/crude-oil", "status": "RADAR · 下一個驗證點 是否出現第二位內部人跟進買進"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "訂單能見度", "color": "#C9A227", "stocks": [{"t": "NPK", "n": "池內名字，家電加國防的混合體，八月合計拿到1.591億美元訂單"}], "en": "National Presto is an odd-looking company, selling pressure cookers and small appliances on one side while making ammunition through its defence segment on the other. That hybrid is precisely why the market ignores it, since it fits neither the consumer nor the defence basket and is hard to place in any sector screen. What is changing is the order book: on August 13 the US Army exercised the fifth-year option on subsidiary AMTEC's current five-year 40mm systems contract, and another subsidiary, Spectra Technologies, received a Boeing subcontract to produce the warhead for the Small Diameter Bomb programme, together worth $159.1 million. The counter-case: defence awards are options rather than guaranteed volume and exercising is not shipping; the housewares side still drags on blended margin; and a one-off announcement is only news until it turns into revenue in a later quarter. This is a research lead, not investment advice.", "zh": "National Presto 是一家外表很怪的公司：一邊賣壓力鍋與小家電，一邊透過國防事業群做彈藥。市場忽視它的原因也正是這個混合體，因為它同時不像消費股也不像國防股，很難放進任何一個類股籃子裡。正在改變的是訂單：八月十三日美國陸軍對子公司 AMTEC 現行五年期四十毫米系統合約行使第五年選擇權，另一家子公司 Spectra Technologies 拿到波音小直徑炸彈計畫的彈頭生產分包，兩案合計一億五千九百一十萬美元。風險與反方論點：國防合約是選擇權而非保證量，行使不等於出貨；消費家電那一側仍在拖累整體毛利；而且這種一次性公告若沒有在後續季報變成營收，就只是新聞。這是研究線索，不是投資建議。", "url": "https://www.sec.gov/Archives/edgar/data/0000080172/000143774926028014/npk20260814_8k.htm", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（訂單能否轉為營收）"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "別把 beta 當驗證", "color": "#C9A227", "stocks": [{"t": "WTTR", "n": "池內名字，油田產出水處理商，論點與油價無關而在長約占比"}], "en": "Select Water Solutions handles the treatment, transport and recycling of produced water from oilfields, and the pool thesis is that it is turning from a cyclical into an infrastructure business through long-term contracted revenue and a rising share from its water infrastructure segment. Crude rose nearly 10% last week and the whole oilfield services group rallied with it, which is exactly when it is easiest to mistake sector beta for thesis validation. In fact this name's verification points have almost nothing to do with the oil price: what matters is the share of contracted revenue, construction progress on the nineteen-mile pipeline and the capital spending cadence, and none of those improve early because WTI cleared $91. The counter-case: sustained high crude genuinely lifts drilling activity and water volumes, but that also tilts the revenue mix further toward the cyclical side, diluting the original thesis. This is a research lead, not investment advice.", "zh": "Select Water Solutions 做的是油田產出水的處理、輸送與回收，池內論點是「它正在從週期股變成基建股」，靠的是長約收入與水利基礎建設部門的營收占比往上。上週油價週漲近一成，整個油服板塊跟著漲，這時候最容易犯的錯誤就是把板塊 beta 當成論點被驗證了。實際上這張卡的驗證點跟油價幾乎無關：要看的是長約收入占比、十九英里管線的興建進度與資本支出節奏，那些數字不會因為西德州原油站上九十一美元就提前變好。風險與反方論點：油價若持續高檔，客戶的鑽井活動確實會回溫、對水量有幫助，但這正好會讓營收結構更偏向週期性那一側，反而稀釋原本的論點。這是研究線索，不是投資建議。", "url": "https://www.eia.gov/outlooks/steo/report/global_oil.php", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（水利基建部門營收占比）"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "科技業破紀錄", "color": "#6DB56D", "stocks": [{"t": "XLK", "n": "科技類股 ETF，內部人買進家數創紀錄的族群"}, {"t": "IGV", "n": "軟體股 ETF，這波內部人買進的主要分布區間"}], "en": "One signal set a record in 2026: the number of technology insiders buying. Over the six months through July, twenty-eight technology company executives bought their own stock in the open market, an unusually high density for the group in recent years. Reading it correctly starts with one asymmetry: there are a hundred reasons an insider sells, including taxes, diversification and option exercises, but usually only one reason to buy. A record density does not mean prices must rise, it means the people who know the internal numbers best concluded at the same time that the current price sits below what they can see.", "zh": "有一個訊號在二零二六年被刷新了紀錄：科技類股的內部人買進家數。統計到七月為止的過去六個月，有二十八位科技公司高階主管在公開市場買進自家股票，這是這個族群多年來罕見的密度。要正確解讀它，得先記住一件事：內部人賣出的理由有一百種，包括繳稅、分散、行使選擇權，但買進的理由通常只有一種。密度創新高代表的不是股價一定會漲，而是這批最了解公司內部數字的人，同時認為現在的價格比他們看到的價值低。", "url": "https://finance.yahoo.com/markets/article/a-record-number-of-tech-stock-insiders-are-buying-their-own-shares-in-2026-133810825.html"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "腰斬價進場", "color": "#6DB56D", "stocks": [{"t": "CSGP", "n": "商用不動產資料平台，執行長買進8.3萬股、每股約29.89美元"}, {"t": "AMRZ", "n": "北美建材集團，董事長兼執行長九月二日買進1.5萬股"}], "en": "One cluster of cases from last week is worth recording, unified by chief executives stepping in after their own stock had been halved. CoStar chief executive Andrew Florance bought 83,000 shares near $29.89 apiece in a stock down roughly 50% this year. Amrize chairman and chief executive Jan Philipp Jenisch bought 15,000 shares on September 2 for an estimated $637,950. These are sizeable companies, so this is not the symbolic gesture of a micro-cap director. The caveat: chief executives are usually good at judging their own operations and much less reliably good at timing a bottom in the share price, and those are different skills.", "zh": "上週有一組案例值得記下來，共同點是執行長在自家股票被砍掉一半之後進場。CoStar 的執行長弗洛倫斯買進八萬三千股、每股約二十九點八九美元，這檔今年跌約五成。Amrize 的董事長兼執行長耶尼希在九月二日買進一萬五千股、估算金額約六十三萬七千九百五十美元。這些都是市值不小的公司，代表這波買進不是微型股董事的象徵性動作。要留意的是，執行長對公司營運的判斷通常很準，對股價落底的時機卻不見得，兩者是不同的能力。", "url": "https://finance.yahoo.com/markets/stocks/articles/3-ceos-buying-millions-dollars-112500691.html"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "怎麼讀才對", "color": "#6DB56D", "stocks": [{"t": "NSP", "n": "本週最典型的相對規模案例，執行長年內三度大額買進"}, {"t": "BORR", "n": "單一董事長買進的案例，尚未構成群聚訊號"}], "en": "Reading insider buying properly depends on three tests that matter more than the headline dollar amount. First, relative size: a small-cap director buying $25,000 when annual board fees are $30,000 is a real commitment, while the same sum from a large-cap executive means almost nothing. Second, clustering: the convention is that three or more distinct insiders buying in the open market within seven to fourteen days constitutes a cluster, and a single buyer carries far less weight. Third, the boundary of the statistical effect: research shows stocks with heavy insider buying outperformed the market by roughly 7.5 percentage points over the following twelve months, with the effect concentrated in small and mid caps and absent in large caps.", "zh": "內部人買進要看得懂，有三個判準比金額本身更重要。第一是相對規模：一位小型股董事買進兩萬五千美元、而他一年的董事酬勞只有三萬美元，那才是真的承諾；同樣的金額出現在大型股高管身上幾乎沒有意義。第二是群聚：業界通常把七到十四天內三位以上不同內部人的公開市場買進視為群聚訊號，單一個人的買進強度低很多。第三是統計效果的邊界，研究顯示重內部人買進的股票在後續十二個月約贏大盤七點五個百分點，而且效果集中在中小型股，套到大型股身上就會失效。", "url": "https://markettriage.com/insider-trading-signals"},
    {"id": "capitol_0", "channel": "政要持股", "tag": "押 AI 電力", "color": "#B5654D", "stocks": [{"t": "BE", "n": "燃料電池發電系統商，本次申報買進1.5萬股加200口2027年到期買權"}, {"t": "INTC", "n": "半導體大廠，本次申報買進1萬股加100口買權，同時也是 Bloom 的客戶"}], "en": "One set of filings disclosed on August 24 is worth reading because the underlying theme has substance. The Pelosi household acquired 15,000 Bloom Energy shares across two transactions on July 24 and July 28, plus 200 call options struck at $100 expiring June 17, 2027. On the same day it bought 10,000 Intel shares and 100 calls struck at $50 with the same expiry. Using the disclosure ranges, the combined commitment works out to roughly $4.25 million to $14.5 million. The logic connecting the two names is data centre power: Intel is itself a Bloom customer for data centre power systems, so this is not two separate bets but the upstream and downstream of one theme.", "zh": "八月二十四日揭露的一組申報值得看，因為底下的主題有內容。裴洛西家戶於七月二十四日與七月二十八日兩筆交易取得 Bloom Energy 一萬五千股，另外買進兩百口履約價一百美元、二零二七年六月十七日到期的買權；同一天也買進英特爾一萬股，以及一百口履約價五十美元、同一到期日的買權。依申報區間推算，合計約四百二十五萬至一千四百五十萬美元。這兩檔連在一起的邏輯是資料中心電力：英特爾本身就是 Bloom 資料中心供電系統的客戶，所以這不是兩筆分開的押注，而是同一個主題的上下游。", "url": "https://www.thestreet.com/investing/stocks/nancy-pelosi-buys-intc-intel-stock-be-bloom-energy-stock"},
    {"id": "capitol_1", "channel": "政要持股", "tag": "資訊在哪裡", "color": "#B5654D", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報部位的 ETF，同樣受45天延遲影響"}, {"t": "GOP", "n": "追蹤共和黨籍議員申報部位的 ETF，可與前者對照主題差異"}], "en": "The information in this channel is never in who bought, it is in how they bought and when you were allowed to know. The trades above were executed on July 24 and 28 and disclosed on August 24, a gap of about a month against a statutory ceiling of forty-five days, so anyone copying the trade is buying at a price that is a month stale. Amounts come only as wide bands rather than exact figures, and $4.25 million to $14.5 million spans more than a threefold range. The real information sits in the option structure: strikes at $100 and $50 with a common June 17, 2027 expiry effectively put a ten-month clock on the theme rather than an open-ended opinion. This describes what the position structure assumes, and is not a suggestion to follow it.", "zh": "這一頻道的資訊量從來不在「誰買了」，而在「怎麼買」以及「你什麼時候才知道」。上面那筆的交易日是七月二十四與二十八日、揭露日是八月二十四日，中間隔了一個月，而法定上限是四十五天，所以任何跟單者買到的都是別人一個月前的價位。金額只有寬區間、沒有精確數字，四百二十五萬到一千四百五十萬中間差了三倍多。真正有資訊量的是選擇權的結構：履約價一百美元與五十美元、到期日都是二零二七年六月十七日，那等於申報人替這個主題設了一個約十個月的時限，而不只是「看好」。這裡只描述部位結構代表什麼假設，不做任何跟單建議。", "url": "https://www.congress.gov/crs_external_products/R/HTML/R47818.html"},
    {"id": "week_0", "channel": "本週事件", "tag": "四天週", "color": "#C97DD4", "stocks": [{"t": "SPY", "n": "標普500 ETF，四天交易日內要消化兩份通膨數據"}, {"t": "QQQ", "n": "那斯達克 ETF，長天期評價對 CPI 最敏感的一側"}], "en": "This is a compressed week. Markets are closed Monday September 7 for Labor Day, leaving four trading sessions, yet the two heaviest inflation releases sit in the final two: the Producer Price Index before Thursday's open on September 10 and the Consumer Price Index before Friday's open on September 11. The September 15-16 policy meeting and an updated dot plot follow immediately after. The officials' quiet period runs from September 5 to September 17, so the data will land with no official voice available to shade it, leaving the market to absorb it alone and concentrating volatility into Thursday and Friday.", "zh": "本週是被壓縮過的一週。九月七日週一是勞動節、美股休市，交易只有四天，但兩份最重的通膨數據都排在最後兩天：九月十日週四開盤前的生產者物價指數、九月十一日週五開盤前的消費者物價指數。接著就是九月十五、十六日的利率會議與更新的點陣圖。官員靜默期自九月五日起、到九月十七日才解除，這代表數據落地時沒有任何官方聲音可以修飾，市場只能自己消化，波動容易集中在週四與週五。", "url": "https://www.investing.com/analysis/economic-week-ahead-cpi-ppi-and-retail-sales-to-test-fed-rate-outlook-200685465"},
    {"id": "week_1", "channel": "本週事件", "tag": "同一晚交卷", "color": "#C97DD4", "stocks": [{"t": "ORCL", "n": "9/10 晚間公布 FY2027 第一季，重點在雲端基礎建設營收"}, {"t": "ADBE", "n": "同晚公布第三季，重點在漲價與訂閱能否守住"}, {"t": "KR", "n": "同週公布財報的連鎖超市，可對照必需消費強度"}], "en": "Earnings season is winding down, but this week carries an interesting arrangement: Oracle's fiscal first quarter of 2027 and Adobe's third quarter both land on the evening of Thursday September 10. The two companies sit at opposite ends of the artificial intelligence narrative. Oracle is on the picks-and-shovels side, where the market watches cloud infrastructure revenue and the pace of data centre expansion. Adobe is on the side facing questions about erosion from generative tools, where the market watches whether pricing gains and subscriptions hold. Getting both answers on one night should be useful for pricing technology broadly. Kroger also reports, offering a read on consumer strength.", "zh": "財報季已近尾聲，但本週有一個很有意思的安排：甲骨文的二零二七會計年度第一季與 Adobe 的第三季，兩份財報都排在九月十日週四同一個晚上。這兩家公司剛好站在人工智慧敘事的兩端——甲骨文是賣鏟子的那一邊，市場只看雲端基礎建設營收與資料中心擴張速度；Adobe 是被質疑會被生成式工具侵蝕的那一邊，市場要看的是漲價與訂閱是否守得住。同一晚同時給出兩個答案，對整體科技股的定價會很有參考價值。另外零售端還有克羅格的財報可以對照消費強度。", "url": "https://www.barchart.com/story/news/4358451/adobe-to-announce-q3-fy2026-earnings-results-on-sept-10-2026"},
    {"id": "eval_0", "channel": "今日評估", "tag": "震央不在財報", "color": "#E8A838", "stocks": [{"t": "FICO", "n": "被一紙行政命令拿掉護城河的代表，單日跌約17.5%至21%"}, {"t": "TNK", "n": "被地緣風險推上十年新高的代表，運價才是真正的紀錄"}], "en": "Looking back at the full week, the thing most worth noting is that the two events which actually moved asset prices were not earnings. The first was an administrative order: the FHFA director opened the door to VantageScore and, in one morning, removed Fair Isaac's monopoly in mortgage scoring, taking nearly a fifth of its market value with it. The second was the Strait of Hormuz, where the record was set not in the oil price but in freight, with Suezmax spot averaging roughly $109,000 a day. Both point to the same reminder: the largest variables right now sit outside corporate income statements, in policy and geopolitical shocks that come with no guidance to model. So the question is this: if your thesis rests entirely on how well a company executes, have you priced the risk that someone changes the rules of the game with a single sentence?", "zh": "回頭看整週，最值得注意的一件事是：這一週真正移動了資產價格的兩件事，都不是財報。第一件是一紙行政命令，聯邦住房金融局局長開放 VantageScore，一個早上就把 Fair Isaac 在房貸評分上的獨占拿掉，市值跟著蒸發近兩成。第二件是荷姆茲海峽，它創紀錄的不是油價而是運費，蘇伊士型油輪現貨均價來到每天約十萬九千美元。這兩件事共同指向同一個提醒：目前市場最大的變數不在企業損益表裡，而在政策與地緣的外生衝擊，而那些東西沒有財測可以參考。所以問題是：如果你手上的持股論點完全建立在公司自己做得好不好，你有沒有評估過「有人一句話就改變遊戲規則」的風險？", "url": "https://www.benzinga.com/news/politics/26/09/61622054/fico-stock-falls-pre-market-after-bill-pulte-declares-no-more-to-ficos-mortgage-scoring-monopoly-orders-fannie-mae-freddie-mac-to-open-door-to-vantagescore", "status": "DISCUSS · 政策與地緣的外生風險，你的持股論點有沒有算進去？"},

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/06/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v10.1</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
