// ===== AZURE TTS =====
let _azToken = null, _azTokenExp = 0, _azAbort = null;
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
function azureStop() { if (_azAbort) { _azAbort.abort(); _azAbort = null; } }
async function azureSpeak(text, { rate='0%', onStart, onEnd, onError }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const voice = localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural';
  if (!key) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const token = await _getAzToken(key, region, ctrl.signal);
    const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'><voice name='${voice}'><prosody rate='${rate}'>${_xmlEsc(text)}</prosody></voice></speak>`;
    const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method:'POST', signal:ctrl.signal,
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
      body:ssml
    });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (ctrl.signal.aborted) return true;
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    if (onError) onError(e);
    return false;
  }
}

const CARDS = [
    { "id": "overnight_0", "channel": "隔夜盤勢", "tag": "指數總覽", "color": "#E05C5C", "stocks": [ { "t": "MSFT", "n": "Azure 數字炸裂帶動那斯達克終結六連跌" }, { "t": "SPY", "n": "S&P 500 收 7,437.64、漲 1.7%" }, { "t": "QQQ", "n": "那斯達克飆 2.8% 收 25,122.18" }, { "t": "DIA", "n": "道瓊漲 613.92 點收 52,208.06" } ], "en": "Wall Street roared back Thursday. The Dow jumped 613.92 points (+1.2%) to 52,208.06, the S&P 500 added 1.7% to 7,437.64, and the Nasdaq surged 2.8% to 25,122.18 — snapping a six-day losing streak. Microsoft did the heavy lifting after blowout Azure numbers, dragging semiconductors up with it. A day after the Fed held steady, the tape voted for growth.", "zh": "週四華爾街強勢反攻。道瓊大漲 613.92 點（+1.2%）收 52,208.06，S&P 500 漲 1.7% 收 7,437.64，那斯達克飆 2.8% 收 25,122.18，終結六連跌。主要推力來自微軟——Azure 數字炸裂，順勢把半導體一起拉上去。Fed 前一天按兵不動，隔天盤面用上漲投了成長一票。", "ja": "木曜、ウォール街は力強く反発。ダウは613.92ポイント高（+1.2%）の52,208.06、S&P500は1.7%高の7,437.64、ナスダックは2.8%高の25,122.18で6日続落を止めた。牽引役はマイクロソフト——Azureの数字が圧巻で半導体も道連れに押し上げた。FRBが据え置いた翌日、相場は成長に一票を投じた。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-july-30-dow-sp-500-nasdaq-082255995.html" },
    { "id": "overnight_1", "channel": "隔夜盤勢", "tag": "個股動向", "color": "#E05C5C", "stocks": [ { "t": "MSFT", "n": "盤中飆漲創單日市值增幅紀錄" }, { "t": "META", "n": "資本支出嚇跑資金重挫約 10%" }, { "t": "FTNT", "n": "帳單強勁盤後漲逾 12%" }, { "t": "AMZN", "n": "AI 帶動超標盤後漲 8%" }, { "t": "VRT", "n": "營收不及預期跌 9%" } ], "en": "Dispersion was brutal. Microsoft posted its largest single-day value gain on record, up ~16%. Fortinet leapt 12%+ on strong billings. Amazon jumped 8% after hours on an AI-fed beat. But Meta cratered ~10% and Vertiv sank 9% — the crowd rewarded results and punished spending in the same session.", "zh": "個股分化極端。微軟寫下單日市值增幅歷史紀錄，漲約 16%。Fortinet 帳單強勁跳漲逾 12%。亞馬遜盤後受 AI 帶動的超標財報推升 8%。但 Meta 崩約 10%、Vertiv 跌 9%——同一天，市場獎勵成績、懲罰花錢。", "ja": "個別株の分散が激しい。マイクロソフトは1日の時価総額増加で過去最大、約16%高。Fortinetは好調な請求額で12%超上昇。アマゾンはAI主導の上振れで時間外8%高。一方Metaは約10%安、Vertivは9%安——同じ日に市場は結果を報い、支出を罰した。", "url": "https://www.fool.com/coverage/stock-market-today/2026/07/30/stock-market-today-july-30-amazon-soars-over-8-after-hours-on-earnings-beat/" },
    { "id": "overnight_2", "channel": "隔夜盤勢", "tag": "風險事件", "color": "#E05C5C", "stocks": [ { "t": "SPY", "n": "關稅升至 15% 上限成本壓力擴散" }, { "t": "TLT", "n": "通膨黏著、殖利率承壓" } ], "en": "The macro overhang hasn't gone anywhere. Trump's 10% baseline tariff under Section 122 has been ratcheted toward the 15% statutory ceiling, leaving the most expensive trade regime in memory. So far earnings strength has papered over it, but importers with weak pricing power are already seeing margin compression. Resilient — until it isn't.", "zh": "總經陰影沒散。川普依 Section 122 祭出的 10% 基準關稅已朝 15% 法定上限逼近，形成近年最貴的貿易環境。目前財報強勢暫時蓋過雜音，但仰賴進口、定價權弱的公司已開始被壓縮毛利。看似有韌性——直到撐不住那天。", "ja": "マクロの重しは消えていない。トランプ政権がSection 122で導入した10%の基準関税は法定上限の15%へ引き上げられ、近年で最も割高な貿易環境になった。今は好決算が覆い隠しているが、価格転嫁力の弱い輸入依存企業はすでにマージンを圧迫されている。強靭に見える——その日が来るまでは。", "url": "https://www.ebc.com/forex/how-are-tariffs-affecting-inflation-and-stock-markets-in-2026" },
    { "id": "earn_0", "channel": "財報速報", "tag": "雲端超標", "color": "#E8786A", "stocks": [ { "t": "MSFT", "n": "Azure 固定匯率成長 43% 碾壓預期" }, { "t": "AMZN", "n": "AWS/AI 支出開始回收盤後大漲" }, { "t": "NVDA", "n": "半導體受惠雲端資本支出" } ], "en": "Cloud carried the day. Microsoft reported revenue of $90.01B (est. $87.62B) with Azure up 43% in constant currency, well past the ~40% Street bar — shares +15%. Amazon followed with a beat that showed its heavy AI infrastructure spend is finally converting to results, up 8% after hours. When hyperscaler demand prints, the whole chip complex follows.", "zh": "雲端撐起全場。微軟營收 90.01 億美元（預期 87.62 億），Azure 固定匯率成長 43%，遠超市場約 40% 的門檻，股價漲 15%。亞馬遜跟進超標，證明沉重的 AI 基建支出終於開始變現，盤後漲 8%。當雲端巨頭需求開出來，整條晶片鏈跟著走。", "ja": "クラウドが相場を支えた。マイクロソフトは売上高900.1億ドル（予想876.2億）、Azureは固定為替で43%増と市場の約40%を大きく上回り株価は15%高。アマゾンも上振れで、重いAIインフラ投資がようやく成果に変わりつつあることを示し時間外8%高。ハイパースケーラーの需要が出れば半導体全体が追随する。", "url": "https://www.cnbc.com/2026/07/29/stock-market-today-live-updates.html" },
    { "id": "earn_1", "channel": "財報速報", "tag": "指引失望", "color": "#E8786A", "stocks": [ { "t": "AAPL", "n": "超標但服務不及、供應限制指引盤後挫" }, { "t": "META", "n": "EPS 未達、資本支出上調重壓" } ], "en": "Two beats the market hated. Apple topped with revenue of $109.42B and EPS of $2.02 (est. $1.89), iPhone +22% — but Services of $30.7B missed the $31.22B bar and 'supply constraint' guidance sent it down ~8% after hours. Meta beat on revenue yet missed EPS at $6.18 and lifted 2026 capex to $130-145B, cratering free cash flow to $784M from $8.5B. Beating isn't enough anymore.", "zh": "兩份市場討厭的超標財報。蘋果營收 109.42 億、EPS 2.02（預期 1.89）、iPhone 成長 22%——但服務收入 30.7 億不及 31.22 億預期，加上『供應限制』的疲弱指引，盤後挫約 8%。Meta 營收超標卻 EPS 只有 6.18 未達標，還把 2026 資本支出上調到 1,300-1,450 億，自由現金流從 85 億暴跌到 7.84 億。現在光是超標已經不夠。", "ja": "市場が嫌った2つの上振れ。アップルは売上高1,094.2億ドル、EPS2.02ドル（予想1.89）、iPhone22%増——だがサービス収入307億ドルは312.2億の予想に届かず、『供給制約』の弱い見通しで時間外約8%安。Metaは増収でもEPSは6.18ドルで未達、2026年設備投資を1,300-1,450億ドルへ引き上げ、フリーキャッシュフローは85億から7.84億へ急減。もはや上振れだけでは足りない。", "url": "https://www.cnbc.com/2026/07/30/apple-earnings-live-updates.html" },
    { "id": "macro_0", "channel": "總經政策", "tag": "Fed按兵", "color": "#7C6AF7", "stocks": [ { "t": "TLT", "n": "殖利率對 Fed 可信度打問號" }, { "t": "SPY", "n": "利率維持 3.50-3.75%" } ], "en": "The Fed held at 3.50%-3.75%, but the vote frayed: nine to hold, three dissenting for a hike as inflation stays sticky. Chair Warsh pledged to act 'if needed' yet offered no dot plot and no forward hints — 'not in the forecasting business.' The bond market is openly questioning his credibility. A hold that satisfied no one.", "zh": "Fed 維持利率在 3.50%-3.75%，但投票分裂：九票維持、三票主張升息，因通膨依舊黏著。主席 Warsh 承諾『必要時』會出手，卻不給點陣圖、不給前瞻指引——『我們不做預測』。債市正公開質疑他的可信度。一個誰都不滿意的按兵不動。", "ja": "FRBは3.50%-3.75%で据え置いたが票は割れた：据え置き9、利上げ支持の反対3——インフレの粘着が背景だ。ウォーシュ議長は『必要なら』動くと約束しつつ、ドットプロットもフォワードガイダンスも示さず『予測はしない』。債券市場は彼の信頼性を公然と疑い始めた。誰も満足しない据え置きだ。", "url": "https://www.cnbc.com/2026/07/29/kevin-warsh-fed-treasury-yields-inflation-credibility-interest-rates.html" },
    { "id": "macro_1", "channel": "總經政策", "tag": "數據矛盾", "color": "#7C6AF7", "stocks": [ { "t": "SPY", "n": "通膨與就業數據拉扯政策" }, { "t": "TLT", "n": "核心 PCE 3.4% 讓降息更難" } ], "en": "The data cut both ways. Core PCE has accelerated to 3.4% (from 3.0% in December), keeping the Fed boxed in above its 2% target. Yet initial jobless claims fell to 187,000 — the lowest in nearly 60 years — signaling full employment and zero labor-market cracks. Hot inflation plus a rock-solid job market is the hardest backdrop for rate cuts.", "zh": "數據兩邊拉扯。核心 PCE 已升到 3.4%（去年 12 月為 3.0%），把 Fed 卡在 2% 目標之上動彈不得。但初領失業金人數降到 18.7 萬——近 60 年最低——顯示充分就業、勞動市場毫無裂縫。通膨發燙加上就業鐵板一塊，是最難降息的組合。", "ja": "データは両にらみ。コアPCEは3.4%へ加速（昨年12月は3.0%）、FRBを2%目標の上に釘付けにする。一方、新規失業保険申請は18.7万件——約60年ぶりの低水準——で完全雇用と労働市場に亀裂なしを示す。熱いインフレと盤石の雇用は、利下げに最も難しい組み合わせだ。", "url": "https://www.investing.com/news/stock-market-news/core-pce-price-index-gdp-and-jobless-claims-due-thursday-93CH-4821457" },
    { "id": "sector_0", "channel": "產業風向", "tag": "市場擴散", "color": "#4EABA4", "stocks": [ { "t": "IWM", "n": "資金轉向小型股" }, { "t": "XLV", "n": "醫療保健受惠輪動" }, { "t": "XLF", "n": "金融接棒" }, { "t": "XLI", "n": "工業納入新主導" } ], "en": "Leadership is finally broadening. After years of narrow mega-cap dominance, breadth is spreading into small caps, healthcare, financials, and industrials — the parts of the market that were left for dead. The rotation rewards diversification and punishes the crowded AI-only trade. If it holds, it's the healthiest tape structure in years.", "zh": "市場主導權終於擴散。在超大型股獨大多年之後，動能開始擴散到小型股、醫療保健、金融與工業——這些原本被判死刑的角落。這場輪動獎勵分散、懲罰過度擁擠的純 AI 交易。若能延續，這是多年來最健康的盤面結構。", "ja": "主導権がようやく広がってきた。長年の超大型株一極集中の後、幅は小型株・ヘルスケア・金融・資本財へ広がる——見捨てられていた領域だ。このローテーションは分散を報い、混雑したAI一辺倒の取引を罰する。続けば、ここ数年で最も健全な相場構造だ。", "url": "https://www.vaneck.com/us/en/blogs/thematic-investing/the-state-of-us-sector-investing-in-mid-2026/" },
    { "id": "sector_1", "channel": "產業風向", "tag": "AI外溢", "color": "#4EABA4", "stocks": [ { "t": "SOXX", "n": "半導體受惠資本支出" }, { "t": "NVDA", "n": "AI 晶片核心" }, { "t": "SRVR", "n": "資料中心 REIT 受益" }, { "t": "XLI", "n": "工業自動化承接支出" } ], "en": "AI capex is spilling out of the hyperscalers. Second-order winners — semiconductor makers, data-center REITs, industrial-automation firms — are now capturing more of a spend forecast above $1.3 trillion in 2026. The risk sits in concentration: chips are ~42% of the S&P tech sector and ~20% of the whole index, so passive money is one giant AI-adjacent bet. Broadening beneficiaries, narrowing safety.", "zh": "AI 資本支出正從雲端巨頭外溢。第二層受惠者——半導體廠、資料中心 REIT、工業自動化——正吃下 2026 年上看 1.3 兆美元的支出流。風險在集中度：晶片占 S&P 科技類股約 42%、占整體指數約 20%，被動資金等於押了一注巨大的 AI 鄰接賭注。受惠面在擴大，安全邊際在縮小。", "ja": "AI設備投資はハイパースケーラーから外へ溢れ出している。第二層の勝者——半導体、データセンターREIT、産業オートメーション——が2026年に1.3兆ドル超と見込まれる支出をより多く取り込む。リスクは集中度：半導体はS&Pテック業種の約42%、指数全体の約20%を占め、パッシブ資金は巨大なAI隣接の一点賭けになっている。受益は広がり、安全余地は狭まる。", "url": "https://www.ssga.com/us/en/individual/insights/sector-market-perspectives-q3-2026" },
    { "id": "small_0", "channel": "小型股風雲", "tag": "R2K動態", "color": "#5B8ED6", "stocks": [ { "t": "IWM", "n": "Russell 2000 締造 1991 以來最強上半年" }, { "t": "IJR", "n": "S&P 600 小型股同步走強" }, { "t": "SOXX", "n": "晶片領漲小型段" } ], "en": "The Russell 2000 is having a year. Up roughly 22% in 2026, it just booked its best first half since 1991, pushing toward 2,980 with chips leading the charge. After a decade of being the market's underdog, small caps are running the tape. The question is whether the move has legs or is front-running rate cuts that may not come.", "zh": "Russell 2000 迎來大年。2026 年至今漲約 22%，締造 1991 年以來最強上半年，指數逼近 2,980，晶片領軍。當了十年市場魯蛇之後，小型股正主導盤面。問題是：這波有沒有續航力，還是提前反映了未必會來的降息。", "ja": "ラッセル2000が当たり年だ。2026年はこれまで約22%高、1991年以来最高の上半期を記録し、半導体を先頭に2,980へ迫る。10年来の負け組だった小型株が相場を主導している。問題は、この動きに持続力があるのか、それとも来ないかもしれない利下げを先取りしているだけなのかだ。", "url": "https://www.ibtimes.com.au/russell-2000-index-small-cap-rally-2026-1872366" },
    { "id": "small_1", "channel": "小型股風雲", "tag": "催化劑", "color": "#5B8ED6", "stocks": [ { "t": "IWM", "n": "Fed 按兵、軟著陸支撐小型股" }, { "t": "KRE", "n": "區域銀行對利率敏感" } ], "en": "The catalyst is rates plus a soft landing. Small caps carry more floating-rate debt, so the Fed's hold at 3.50%-3.75% — after 2025's cuts — is direct oxygen for balance sheets. Every sign of cooling inflation without recession feeds the trade. The flip side: a genuine inflation re-acceleration would hit these names first and hardest.", "zh": "催化劑是利率加軟著陸。小型股背負較多浮動利率債務，因此 Fed 在 2025 年降息後維持 3.50%-3.75%，等於直接給資產負債表供氧。每一個『通膨降溫但不衰退』的訊號都在餵養這筆交易。反面是：真正的通膨再加速，會最先、最重地打到這些股。", "ja": "催化剤は金利プラス軟着陸だ。小型株は変動金利債務を多く抱えるため、2025年の利下げ後にFRBが3.50%-3.75%で据え置いたことはバランスシートへの直接の酸素になる。景気後退を伴わないインフレ鈍化の兆しが取引を後押しする。裏を返せば、本物のインフレ再加速はこれらの銘柄を最初に最も強く直撃する。", "url": "https://www.ibtimes.com.au/russell-2000-index-surges-small-cap-resilience-2026-1870784" },
    { "id": "small_2", "channel": "小型股風雲", "tag": "投資教育", "color": "#5B8ED6", "stocks": [ { "t": "IWM", "n": "理解「大輪動」的核心指標" }, { "t": "SPY", "n": "小型股 vs 大型股相對強弱" } ], "en": "A word on the 'Great Rotation.' It's the idea that money leaves crowded mega-cap tech and flows into cheaper, domestic, rate-sensitive small caps when the macro backdrop shifts. It doesn't require mega-caps to fall — only for the neglected 90% of the market to catch a bid. For years it was a false dawn; 2026 is the first time the relative strength has actually stuck. Watch relative performance, not headlines.", "zh": "談談『大輪動』。核心概念是：當總經背景轉變，資金會離開擁擠的超大型科技股，流向更便宜、更本土、更對利率敏感的小型股。它不需要大型股下跌——只需要被忽視的那 90% 市場開始有人買。過去幾年這都是假黎明；2026 是相對強弱第一次真的站住。看相對表現，別看標題。", "ja": "『グレート・ローテーション』について一言。マクロ環境が変わると、資金は混雑した超大型テックを離れ、割安で内需・金利感応度の高い小型株へ向かう、という考え方だ。大型株が下がる必要はなく、見捨てられた市場の90%に買いが入ればいい。数年間は空の夜明けだったが、2026年は相対強度が初めて定着した年だ。見出しではなく相対パフォーマンスを見よ。", "url": "https://markets.financialcontent.com/stocks/article/marketminute-2026-3-20-small-cap-rotation-the-great-rotation-of-2026-why-the-russell-2000-is-finally-outperforming-megacaps" },
    { "id": "radar_0", "channel": "忽視雷達", "tag": "內部人買", "color": "#C9A227", "stocks": [ { "t": "VIA", "n": "公共運輸調度軟體、董事開放市場買進" } ], "status": "RADAR · 下一個驗證點 [Q2 財報 platform 營收是否達 $550M 軌道]", "en": "Via Transportation runs software for public transit and paratransit — unglamorous, under-covered. The signal: director Nechemia Peres bought 25,000 shares for $367,500 on the open market, an insider putting real cash in. Fundamentals are turning — Q1 revenue rose to $127M from $99M, platform revenue guided up to $550M for 2026 — but the company is still unprofitable and leans on external borrowing. This is not a buy recommendation; it's a research lead.", "zh": "Via Transportation 做的是公共運輸與復康巴士的調度軟體——不性感、覆蓋率低。訊號在於：董事 Nechemia Peres 在公開市場買進 2.5 萬股、金額 36.75 萬美元，是內部人真金白銀進場。基本面在轉——Q1 營收從 9,900 萬升到 1.27 億，平台營收 2026 年上看 5.5 億——但公司仍未獲利、仰賴外部借款。這不是買進建議，是研究線索。", "ja": "Via Transportationは公共交通・福祉輸送向けソフトを手掛ける——地味でカバレッジが薄い。シグナルは、取締役Nechemia Peresが公開市場で2.5万株・36.75万ドルを買ったこと、内部者の現金投入だ。ファンダは好転——Q1売上高は9,900万から1.27億ドルへ、プラットフォーム収入は2026年に5.5億ドルへ引き上げ——だが依然赤字で外部借入に依存する。これは買い推奨ではなく、研究の手がかりだ。", "url": "https://simplywall.st/stocks/us/real-estate/nyse-csr/centerspace/news/undervalued-small-caps-with-insider-buying-in-july-2026" },
    { "id": "radar_1", "channel": "忽視雷達", "tag": "回購訊號", "color": "#C9A227", "stocks": [ { "t": "HDSN", "n": "製冷劑回收再售、回購 41.6 萬股" } ], "status": "RADAR · 下一個驗證點 [下季製冷劑回收量與毛利]", "en": "Hudson Technologies reclaims and resells refrigerants — a regulatory-driven niche that Wall Street mostly ignores. The tell: a buyback of 416,480 shares for $2.49M, management betting on its own long-term value as HFC phase-downs tighten supply. The risk is cyclicality — refrigerant pricing swings hard and can compress margins fast. Not a buy call; a thread worth pulling.", "zh": "Hudson Technologies 做製冷劑的回收與再售——一個由法規驅動、華爾街基本無視的利基。徵兆是：回購 41.6 萬股、金額 249 萬美元，管理層在 HFC 逐步淘汰、供給收緊之際押注自身長期價值。風險是週期性——製冷劑價格波動劇烈，毛利可能快速被壓縮。不是買進建議，是值得拉開的線頭。", "ja": "Hudson Technologiesは冷媒の回収・再販を手掛ける——規制主導のニッチで、ウォール街はほぼ無視している。兆候は41万6,480株・249万ドルの自社株買いで、HFC段階的削減で供給が締まる中、経営陣が自らの長期価値に賭けている。リスクは循環性——冷媒価格は激しく変動しマージンを急速に圧迫しうる。買い推奨ではなく、引く価値のある糸口だ。", "url": "https://simplywall.st/stocks/us/capital-goods/nasdaq-erii/energy-recovery/news/top-undervalued-small-caps-with-insider-buying-in-july-2026" },
    { "id": "radar_2", "channel": "忽視雷達", "tag": "REIT轉機", "color": "#C9A227", "stocks": [ { "t": "CSR", "n": "中型公寓 REIT、內部人買進＋資產出售計畫" } ], "status": "RADAR · 下一個驗證點 [$240-245M 資產出售是否於年底達成]", "en": "Centerspace is a mid-market apartment REIT nobody talks about. Despite a Q1 net loss of $12.83M, insiders have been buying, and management has telegraphed $240-245M of asset sales by year-end to sharpen the portfolio toward higher-quality markets. If multifamily fundamentals firm, the setup has optionality. But leverage and a soft rental cycle are real risks. Research lead, not a recommendation.", "zh": "Centerspace 是一檔沒人討論的中型公寓 REIT。儘管 Q1 淨虧損 1,283 萬，內部人一直在買，管理層也預告年底前將出售 2.4-2.45 億美元資產，把投資組合聚焦到更高品質的市場。若多戶型基本面回穩，這個佈局有選擇權價值。但槓桿與疲軟的租金週期是實質風險。研究線索，不是建議。", "ja": "Centerspaceは誰も話題にしない中規模のアパートREITだ。Q1に1,283万ドルの純損失を計上しながら内部者は買いを続け、経営陣は年末までに2.4-2.45億ドルの資産売却を予告、ポートフォリオをより質の高い市場へ絞る。集合住宅のファンダが固まれば妙味がある。だがレバレッジと軟調な賃料サイクルは実際のリスクだ。研究の手がかりであり推奨ではない。", "url": "https://simplywall.st/stocks/us/real-estate/nyse-csr/centerspace/news/undervalued-small-caps-with-insider-buying-in-july-2026" },
    { "id": "radar_3", "channel": "忽視雷達", "tag": "指數納入", "color": "#C9A227", "stocks": [ { "t": "ERII", "n": "壓力交換能量回收、納入 Russell 價值指數＋內部人回購" } ], "status": "RADAR · 下一個驗證點 [商譽減損後的獲利能力修復]", "en": "Energy Recovery makes pressure-exchange energy-recovery devices for desalination and industrial fluid flow — a real moat, a tiny float. It was added to multiple Russell Value indices on June 27, a passive-flow tailwind. Insiders repurchased 960,303 shares for $10.66M. But Q1 was ugly: $9.71M sales, a $12.25M net loss and a goodwill impairment. Signal and scar tissue in the same name. Not advice — a lead.", "zh": "Energy Recovery 做的是海水淡化與工業流體的壓力交換能量回收裝置——有真護城河、流通盤很小。6 月 27 日被納入多個 Russell 價值指數，帶來被動資金順風。內部人回購 96 萬股、金額 1,066 萬美元。但 Q1 很難看：營收 971 萬、淨虧 1,225 萬，還有商譽減損。同一檔股票裡，訊號與傷疤並存。不是建議，是線索。", "ja": "Energy Recoveryは海水淡水化や産業流体向けの圧力交換式エネルギー回収装置を作る——本物の堀に、極小の浮動株。6月27日に複数のラッセル・バリュー指数へ採用され、パッシブ資金の追い風を得た。内部者は96万303株・1,066万ドルを買い戻した。だがQ1は醜い：売上971万、純損失1,225万ドル、のれん減損も。同じ銘柄にシグナルと傷跡が同居する。助言ではなく手がかりだ。", "url": "https://simplywall.st/stocks/us/capital-goods/nasdaq-erii/energy-recovery/news/top-undervalued-small-caps-with-insider-buying-in-july-2026" },
    { "id": "insider_0", "channel": "內部人動向", "tag": "群聚買進", "color": "#6DB56D", "stocks": [ { "t": "VIA", "n": "近月內部人買進個案" }, { "t": "CSR", "n": "同屬內部人買進小型股池" }, { "t": "ERII", "n": "內部人回購標的" } ], "en": "Cluster buying is the signal worth respecting. When a CEO, CFO, and directors all buy around the same window, it historically beats any single purchase — insiders diversify their own wealth away from their employer, so coordinated buying is a loud vote of confidence. A July screen flagged 64 undervalued small caps with insider buying. The filter to trust: a 'P' code on the Form 4, meaning cash paid at market, not an option grant.", "zh": "群聚買進才是值得尊重的訊號。當執行長、財務長與董事在同一時間窗口一起買，歷史上勝過任何單一買單——內部人本該把財富分散離開自家公司，因此協同買進是一張很大聲的信心票。7 月一份篩選抓出 64 檔有內部人買進的被低估小型股。要信的過濾條件：Form 4 上的『P』碼，代表用現金依市價買進，而非選擇權授予。", "ja": "クラスター買いこそ尊重すべきシグナルだ。CEO・CFO・取締役が同じ時期にそろって買うと、歴史的に単独購入を上回る——内部者は本来、資産を勤務先から分散させるはずで、協調買いは大きな信任票だ。7月のスクリーンは内部者買いのある割安小型株を64銘柄抽出した。信頼すべきフィルターはForm 4の『P』コード——付与ではなく現金での市場価格購入を意味する。", "url": "https://www.stockinsider.io/" },
    { "id": "insider_1", "channel": "內部人動向", "tag": "Form4解讀", "color": "#6DB56D", "stocks": [ { "t": "SPY", "n": "內部人數據是市場情緒的另一面鏡子" } ], "en": "Read Form 4 like a pro. Insiders must file within two business days of a trade, so the data is near-real-time. The critical distinction: open-market purchases (code 'P') use the insider's own cash and carry signal; option exercises and grants (codes 'M'/'A') are compensation and carry almost none. Selling is noisy — people sell for taxes, houses, divorces. Buying is cleaner: there's really only one reason to buy.", "zh": "像行家一樣讀 Form 4。內部人必須在交易後兩個工作日內申報，所以資料近乎即時。關鍵區別：公開市場買進（代碼『P』）用的是內部人自己的錢、帶有訊號；選擇權行使與授予（代碼『M』/『A』）屬於薪酬、幾乎沒有訊號。賣出很雜——有人為了稅、買房、離婚而賣。買進乾淨得多：買，其實只有一個理由。", "ja": "Form 4はプロのように読む。内部者は取引後2営業日以内に提出義務があり、データはほぼリアルタイムだ。決定的な違い：公開市場での購入（コード『P』）は内部者自身の現金でシグナル性がある。オプション行使・付与（『M』『A』）は報酬でほぼシグナルなし。売りはノイズが多い——税金・住宅・離婚で売る。買いはより明快だ——買う理由は本質的に一つしかない。", "url": "https://www.britannica.com/money/insider-transaction-reporting" },

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  const speakWord = React.useCallback(async (word) => {
    const ok = await azureSpeak(word, { rate:'-15%' });
    if (!ok) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US"; u.rate = 0.82;
      const voices = speechSynthesis.getVoices();
      const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
      if (picked) u.voice = picked;
      speechSynthesis.speak(u);
    }
  }, []);

  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      return;
    }
    setSpeaking(true);
    const ok = await azureSpeak(card.en, {
      rate: '-5%',
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
    if (!ok) {
      const u = new SpeechSynthesisUtterance(card.en);
      u.lang = "en-US"; u.rate = 0.88; u.pitch = 1.0; u.volume = 1.0;
      const tryVoices = () => {
        const voices = speechSynthesis.getVoices();
        const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
        if (picked) u.voice = picked;
      };
      if (speechSynthesis.getVoices().length > 0) tryVoices();
      else { speechSynthesis.onvoiceschanged = () => { tryVoices(); speechSynthesis.onvoiceschanged = null; }; }
      u.onend = () => setSpeaking(false);
      u.onerror = () => setSpeaking(false);
      speechSynthesis.speak(u);
    }
  }, [card.en, speaking]);

  // Stop speaking & close popup when card changes
  React.useEffect(() => {
    return () => {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀全文"} style={{ marginLeft:"auto" }}>{speaking ? "■" : "🔊"}</button>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          {lang === "ja"
            ? <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"15px", lineHeight:1.9, color:"var(--text-secondary)", margin:0, maxWidth:"46ch", fontWeight:300 }}>{card.ja || card.en}</p>
            : <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>}
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("ja"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="ja" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="ja" ? "close ↑" : "日本語 ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});

      const ta = document.createElement("textarea");

        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Region</div>
          <input className="az-input" value={region} onChange={e=>setRegion(e.target.value)} placeholder="eastus" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Voice</div>
          <select className="az-input" value={voice} onChange={e=>setVoice(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="en-US-AriaNeural">Aria（女）自然流暢</option>
            <option value="en-US-JennyNeural">Jenny（女）清晰</option>
            <option value="en-US-GuyNeural">Guy（男）沉穩</option>
            <option value="en-US-DavisNeural">Davis（男）個性</option>
            <option value="en-US-TonyNeural">Tony（男）自信</option>
          </select>
        </div>
        <div style={{ display:'flex',gap:'8px' }}>
          <button onClick={handleSave} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--divider)',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>儲存</button>
          <button onClick={handleTest} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--text-secondary)',color:'var(--text-secondary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>測試</button>
        </div>
        {status && <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',color:'var(--text-tertiary)',letterSpacing:'0.1em' }}>{status}</div>}
        <div style={{ marginTop:'auto',fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.7,paddingTop:'8px',borderTop:'1px solid var(--divider)' }}>Key 存於 localStorage<br/>未設定時退回瀏覽器 TTS</div>
      </div>
    </>,
    document.body
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;

  const [resumeMsg, setResumeMsg] = useState(null);
  const lsKey = "mosfeed_Today_" + todaySub;

  // Read localStorage on tab/sub change
  React.useEffect(() => {
    const key = "mosfeed_Today_" + todaySub;
    try {
      const saved = parseInt(localStorage.getItem(key), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") go(idx + 1);
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(idx - 1);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 07/31/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v5.3</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
      >
        {atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} />
          </div>
        )}
      </div>

      {/* Nav bar */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => go(idx - 1)} disabled={idx === 0}>←</button>
        <span className="nav-count">{atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn" onClick={() => go(idx + 1)} disabled={atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
