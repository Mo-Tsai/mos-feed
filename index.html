/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {

    --text: #1c1a17; --text-secondary: #5e5b56;

    --noise-opacity: 0.035;

  }
  :root[data-theme="dark"] {

    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;

  html { -webkit-text-size-adjust: 100%; background: var(--bg); }

    background: var(--bg); -webkit-font-smoothing: antialiased;

  body::before {

    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;

  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }

    70% { opacity: 1; }

  {"id": "earn_1", "channel": "財報速報", "tag": "Alphabet 失望", "color": "#E8786A", "zh": "Alphabet 盤後下跌約 8.6%：營收約 1,112 億美元大致符合預期，但每股盈餘 2.12 美元，遠低於預期的約 2.99 至 3.01 美元，淨利從去年同期的 349 億美元降到 261.7 億美元。據 StockTitan 整理，搜尋營收成長從 17% 放緩到 12%、資本支出 514 億美元；同一來源稱 Google Cloud 年增 103%，這個數字偏高，建議對照公司新聞稿。", "en": "Alphabet fell about 8.6% after hours: revenue of roughly $111.2 billion was broadly in line, but EPS of $2.12 was far below the roughly $2.99 to $3.01 consensus, and net income fell to $26.17 billion from $34.90 billion a year earlier. StockTitan's summary cites search growth slowing to 12% from 17% and capex of $51.4 billion; it also says Google Cloud grew 103%, a figure that looks too high and should be checked against the company release.", "url": "https://www.stocktitan.net/articles/stock-market-today-live-october-28-2026", "stocks": [{"t": "GOOGL", "n": "Alphabet，盤後約 -8.6%，每股盈餘大幅低於預期"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "Fortinet 重挫", "color": "#E8786A", "zh": "資安廠 Fortinet 盤後暴跌約 25.6%：第三季營收年增 20% 至 20.8 億美元，並把 2026 年營收成長預估上調到 20%，但這是今年三次上調中幅度最小的一次，服務營收預估還被下修。其他盤後動向：二手車平台 Carvana 在營收創高後漲約 9.6%，eBay 營收成長 14% 後漲約 4.7%。", "en": "Cybersecurity group Fortinet plunged about 25.6% after hours: third-quarter revenue rose 20% to $2.08 billion and it lifted its 2026 revenue growth outlook to 20%, but that was the smallest of its three raises this year and the service revenue outlook was cut. Elsewhere, Carvana rose about 9.6% on record revenue and eBay about 4.7% after revenue grew 14%.", "url": "https://www.stocktitan.net/articles/stock-market-today-live-october-28-2026", "stocks": [{"t": "FTNT", "n": "Fortinet，盤後約 -25.6%，上調幅度最小且下修服務營收"}, {"t": "CVNA", "n": "Carvana，盤後約 +9.6%，營收創高"}, {"t": "EBAY", "n": "eBay，盤後約 +4.7%，營收成長 14%"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "Fed 維持不動", "color": "#7C6AF7", "zh": "聯準會以 10 比 2 投票維持利率在 3.75% 至 4.00%，克里夫蘭聯銀總裁 Hammack 與理事 Cook 兩人投反對票，主張升息 0.25 個百分點。聲明稱經濟活動以強勁步伐擴張、通膨仍高。交易員預期 12 月 9 日升息的機率約 85%，並預期利率到 2027 年 9 月接近 4.7%。", "en": "The Fed voted 10 to 2 to hold its policy rate at 3.75% to 4.00%; Cleveland Fed President Hammack and Governor Cook dissented in favor of a quarter-point hike. The statement said activity is expanding at a strong pace and inflation remains elevated. Traders put the odds of a December 9 hike at about 85% and see the rate near 4.7% by September 2027.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-wednesday-october-28-dow-sp-500-nasdaq-fed-meeting-decision-big-tech-earnings-130508769.html", "stocks": [{"t": "TLT", "n": "長天期美債 ETF，升息預期壓著長債"}, {"t": "SHY", "n": "短天期美債 ETF，對政策利率最敏感"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "Warsh 改會議", "color": "#7C6AF7", "zh": "聯準會主席 Warsh 宣布 2027 年會少開一次政策會議，那一次改為討論長期策略，不表決利率也不發聲明；他表示一年八次會議是適當的頻率，並說「制定政策需要在及時、定期、資訊豐富的間隔下評估近期發展」。這是制度面的調整，對短線利率路徑沒有直接影響，但值得追蹤是否改變市場對聯準會溝通節奏的預期。", "en": "Fed Chair Warsh said the Fed will hold one fewer policy meeting in 2027; that meeting will focus on long-term strategy, with no rate vote or policy statement. He said eight meetings a year is the right frequency and that getting policy right involves assessing near-term developments at timely, regular, information-rich intervals. This is an institutional change with no direct effect on the near-term rate path, but worth watching for any shift in expectations about Fed communication.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-wednesday-october-28-dow-sp-500-nasdaq-fed-meeting-decision-big-tech-earnings-130508769.html", "stocks": [{"t": "SHY", "n": "短天期美債 ETF，利率預期的觀察窗口"}, {"t": "XLF", "n": "金融類股 ETF，對利率路徑最敏感的板塊之一"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "五厘關卡", "color": "#7C6AF7", "zh": "十年期殖利率升到約 5.03% 至 5.05%，加上升息預期，債務融資的 AI 資本支出多了一層利息成本的檢驗。微軟本季資本支出 452 億美元、Alphabet 514 億美元，市場對兩者反應截然不同；甲骨文則用「2029 財年自由現金流轉正並超過 300 億美元」的目標來安撫市場。殖利率站穩 5% 以上時，資本支出的報酬證據會被看得更嚴。", "en": "The 10-year yield rose to about 5.03% to 5.05%, and with hike expectations, debt-financed AI capital spending faces a higher interest-cost test. Microsoft spent $45.2 billion on capex this quarter and Alphabet $51.4 billion, and the market reacted very differently; Oracle calmed investors with a target of free cash flow above $30 billion in fiscal 2029. With yields holding above 5%, the evidence of returns on capex gets scrutinized harder.", "url": "https://investrade.com/market-review-october-28-2026/", "stocks": [{"t": "IEF", "n": "7 至 10 年期美債 ETF，十年期殖利率站上 5%"}, {"t": "ORCL", "n": "甲骨文，以自由現金流目標回應資本支出疑慮"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "電力與散熱", "color": "#4EABA4", "zh": "AI 資料中心的電力與散熱設備續強：Vertiv 第三季營收年增 61%，並上調全年預期；GE Vernova 第三季優於預期、上調 2026 年營收預期，同時宣布以 90 億美元收購 Trench Group。這類公司賣的是「蓋資料中心與電網」的鏟子，業績來自客戶的資本支出，所以也繫於客戶是否繼續花錢。", "en": "Power and cooling equipment for AI data centers stayed strong: Vertiv's third-quarter revenue rose 61% and it raised its full-year outlook; GE Vernova beat third-quarter estimates, raised its 2026 revenue view and agreed to buy Trench Group for $9 billion. These firms sell the shovels for data centers and the grid, so their results depend on customers continuing to spend.", "url": "https://investrade.com/market-review-october-28-2026/", "stocks": [{"t": "VRT", "n": "Vertiv，beat and raise，單日 +16.6%"}, {"t": "GEV", "n": "GE Vernova，上調營收預期並宣布 90 億美元收購"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "煉油賺錢", "color": "#4EABA4", "zh": "煉油股在高油價與高煉油利潤下繳出強勁成績：Phillips 66 第三季調整後每股盈餘 14.08 美元，遠高於預期的 11.73 美元；HF Sinclair（DINO）創下單季獲利紀錄並任命新執行長。能源板塊在盤中小幅領先，但油價若回落，煉油利潤是最先被重新定價的部分。", "en": "Refiners posted strong results on high oil prices and refining margins: Phillips 66's third-quarter adjusted EPS was $14.08 against an expected $11.73, and HF Sinclair (DINO) posted a record quarterly profit and named a new CEO. Energy was slightly ahead midday, but if oil retreats, refining margins are the first thing to be repriced.", "url": "https://investrade.com/market-review-october-28-2026/", "stocks": [{"t": "PSX", "n": "Phillips 66，調整後每股盈餘 14.08 美元優於預期"}, {"t": "DINO", "n": "HF Sinclair，單季獲利創紀錄"}, {"t": "XLE", "n": "能源類股 ETF，盤中小幅領先"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "醫療領漲", "color": "#4EABA4", "zh": "醫療是盤中領先的板塊（約 +1.04%）：禮來的 retatrutide 在大型糖尿病試驗中表現優於 Ozempic；Genmab 的癌症藥物在第三期試驗中將死亡風險降低 50%，股價大漲 28.3%；百健財報優於預期並上調全年每股盈餘預期。反面例子是波士頓科學下調 2026 年每股盈餘預期，顯示醫療內部仍是個別公司的故事。", "en": "Health care led midday (about +1.04%): Eli Lilly's retatrutide outperformed Ozempic in a large diabetes study; Genmab's cancer drug cut the risk of death by 50% in a phase 3 trial and the stock jumped 28.3%; Biogen beat estimates and raised its 2026 EPS outlook. On the other side, Boston Scientific cut its 2026 EPS guidance, a reminder that health care moves stock by stock.", "url": "https://investrade.com/market-review-october-28-2026/", "stocks": [{"t": "LLY", "n": "禮來，retatrutide 試驗結果，今天另有財報"}, {"t": "GMAB", "n": "Genmab，第三期試驗降低死亡風險 50%，+28.3%"}, {"t": "BIIB", "n": "百健，財報優於預期並上調預期"}, {"t": "BSX", "n": "波士頓科學，下調 2026 年每股盈餘預期"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "羅素跑贏", "color": "#5B8ED6", "zh": "羅素 2000 週三上漲 0.41% 收 2,830.51，略高於標普 500 的 0.28%，前一天是 2,818.87。小型股對利率最敏感，十年期殖利率站上 5% 又有升息預期，能守住漲幅算是不錯的訊號；不過有一則評論稱當天小型股走弱，與收盤表格不一致，建議以指數實際收盤為準。", "en": "The Russell 2000 gained 0.41% to 2,830.51 on Wednesday, slightly ahead of the S&P 500's 0.28%, from 2,818.87 the day before. Small caps are the most rate-sensitive, so holding gains with the 10-year above 5% and hike expectations is a decent sign; one commentary said small caps were weak that day, which conflicts with the closing table, so rely on the actual index close.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-wednesday-october-28-dow-sp-500-nasdaq-fed-meeting-decision-big-tech-earnings-130508769.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，+0.41%"}, {"t": "IJR", "n": "標普小型 600 ETF，品質較高的小型股池"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "併購出價", "color": "#5B8ED6", "zh": "三則併購新聞同日出現：Trian 提議以每股 7.35 美元現金私有化溫蒂漢堡（約 14 億美元，非約束性），股價大漲 15.1%；Monomoy 對 LCI Industries 提出每股 101 美元的非約束性收購提議，股價漲 8.4%；Investrade 另記載 Ultralife 同意被 EnerSys 以每股 16 美元現金收購。非約束性提議不保證成交，股價通常會停在出價之下。", "en": "Three takeover items surfaced on the same day: Trian proposed taking Wendy's private at $7.35 per share in cash (about $1.4 billion, non-binding), and the stock jumped 15.1%; Monomoy made a non-binding $101-per-share offer for LCI Industries, up 8.4%; Investrade also records Ultralife agreeing to be acquired by EnerSys for $16 per share in cash. Non-binding proposals do not guarantee a deal, and shares usually trade below the offer.", "url": "https://www.stocktitan.net/articles/stock-market-today-live-october-28-2026", "stocks": [{"t": "WEN", "n": "溫蒂漢堡，Trian 每股 7.35 美元現金提議，+15.1%"}, {"t": "LCII", "n": "LCI Industries，Monomoy 每股 101 美元提議，+8.4%"}, {"t": "ULBI", "n": "Ultralife，同意以每股 16 美元現金被收購"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "醫材放量", "color": "#5B8ED6", "zh": "神經修復醫材商 Axogen 第三季營收 7,580 萬美元，年增 26.2%，把全年營收預估上調到至少成長 29%（約 2.9 億美元）；調整後 EBITDA 1,340 萬美元，去年同期 920 萬美元，毛利率則從 76.6% 降到 74.8%。公司增資後現金增至 3.5 億美元，用於 10 月 1 日完成的 BioCircuit 收購。股價單日漲 31.5%，這類大漲後要留意增資稀釋。", "en": "Nerve-repair device maker Axogen reported third-quarter revenue of $75.8 million, up 26.2%, and raised its full-year outlook to at least 29% growth (about $290 million); adjusted EBITDA was $13.4 million versus $9.2 million a year ago, while gross margin slipped to 74.8% from 76.6%. Cash rose to $350.1 million after an equity offering that funded the BioCircuit acquisition closed October 1. The stock jumped 31.5%, and after such moves dilution from equity raises deserves attention.", "url": "https://www.sec.gov/Archives/edgar/data/0000805928/000080592826000106/ex991axgnearningsreleaseda.htm", "stocks": [{"t": "AXGN", "n": "Axogen，營收 +26.2%，全年預估上調"}, {"t": "KIDS", "n": "OrthoPediatrics，另據 StockTitan 單日約 +29.3%（創紀錄營收）"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "太陽能分歧", "color": "#5B8ED6", "zh": "太陽能族群走弱：微型逆變器大廠 Enphase 下跌約 16%，第三季每股盈餘不如預期，第四季營收預估 2.25 億至 2.55 億美元遠低於預期；SolarEdge 同日下跌約 8.3%，StockTitan 沒有找到公司公告可解釋。這類股票對利率與補貼政策都很敏感，十年期殖利率在 5% 以上時估值壓力更大。", "en": "Solar names weakened: microinverter maker Enphase fell about 16% after missing third-quarter EPS and guiding fourth-quarter sales to $225 million to $255 million, well below expectations; SolarEdge fell about 8.3% the same day, with no company announcement found to explain it. These stocks are sensitive to both interest rates and subsidy policy, and valuation pressure is greater with the 10-year above 5%.", "url": "https://www.stocktitan.net/articles/stock-market-today-live-october-28-2026", "stocks": [{"t": "ENPH", "n": "Enphase，約 -16%，第四季營收預估低於預期"}, {"t": "SEDG", "n": "SolarEdge，約 -8.3%，未找到公司消息"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "判讀：大漲大跌", "color": "#5B8ED6", "zh": "小型股單日動輒 15% 至 40% 的漲跌，常見原因有三種：財測或財報落差（Landstar 因保險成本下跌 17.8%）、募資稀釋（Rapport 以每股 21 美元發行約 1.75 億美元新股後跌 18.3%）、以及生技的試驗結果（Bicara 單日跌 44.2%，StockTitan 沒找到原因）。看到大漲大跌先找「公告了什麼」，找不到原因就不要當成訊號，因為薄量股票的價格本來就會被少數交易推動。", "en": "Single-day moves of 15% to 40% in small caps usually come from three sources: guidance or earnings gaps (Landstar fell 17.8% on insurance costs), dilution (Rapport fell 18.3% after pricing a roughly $175 million offering at $21), and biotech trial results (Bicara fell 44.2% with no reason found by StockTitan). When you see a big move, find out what was announced first; if no reason can be found, do not treat it as a signal, since thinly traded stocks can be moved by a few trades.", "url": "https://www.stocktitan.net/articles/stock-market-today-live-october-28-2026", "stocks": [{"t": "RAPP", "n": "Rapport Therapeutics，-18.3%，每股 21 美元增資"}, {"t": "LSTR", "n": "Landstar，-17.8%，保險成本壓低獲利"}, {"t": "XBI", "n": "生技 ETF，小型生技波動的觀察窗口"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "Gentherm 回購", "color": "#C9A227", "zh": "Gentherm（THRM，座椅與熱管理系統供應商）10/22 公布第三季：營收 4.051 億美元、年增 4.7%，GAAP 淨損 260 萬美元（去年同期獲利 1,490 萬美元），調整後每股盈餘 0.33 美元，去年同期 0.73 美元。公司 10 月已買回 6,000 萬美元的股票，授權額度還剩約 3.4 億美元。內部人買進一事有衝突：Monitor Insiders 列出 10/23 兩位內部人以 26.50 美元買進約 66.3 萬美元，Quiver 的摘要則稱過去 6 個月沒有買進，需查 EDGAR。風險：獲利明顯下滑，回購不等於基本面改善。本卡是研究線索，不是投資建議。", "en": "Gentherm (THRM, seat and thermal-management supplier) reported third-quarter results on 10/22: revenue of $405.1 million, up 4.7%, a GAAP net loss of $2.6 million (versus $14.9 million profit a year earlier), and adjusted EPS of $0.33 versus $0.73. It repurchased $60 million of stock in October with about $340 million of authorization remaining. Insider buying is disputed: Monitor Insiders lists two insiders buying about $663,000 at $26.50 on 10/23, while a Quiver summary says no purchases in six months, so check EDGAR. Risk: earnings fell sharply, and buybacks do not equal improving fundamentals. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0000903129/000119312526428275/thrm-ex99_1.htm", "stocks": [{"t": "THRM", "n": "Gentherm，營收 4.051 億美元，調整後每股盈餘 0.33 美元，10 月回購 6,000 萬美元"}], "status": "RADAR · 下一個驗證點 EDGAR 確認內部人買進"},
