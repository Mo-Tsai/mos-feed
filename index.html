<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "非農震撼", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普500 ETF，指數跌0.38%收7,718.60點"}, {"t": "DIA", "n": "道瓊 ETF，跌271.86點、收53,414.26點，三大指數最弱"}, {"t": "QQQ", "n": "那斯達克 ETF，跌0.29%收26,506.99點，相對抗跌"}], "en": "The August jobs report blew past expectations and stocks fell. Nonfarm payrolls rose 162,000 versus the 53,000 economists polled by Dow Jones had forecast, while the unemployment rate held at 4.1%. The S&P 500 slipped 0.38% to 7,718.60, the Dow lost 271.86 points to 53,414.26, and the Nasdaq eased 0.29% to 26,506.99. Good news on jobs was bad news for stocks because it revived the case for the Fed to tighten rather than ease.", "zh": "八月非農就業遠超預期，股市反而收黑。非農新增十六萬兩千人，市場原本只預估五萬三千人，失業率則持平在百分之四點一。標普五百跌百分之零點三八收在7,718.60點，道瓊跌271.86點收53,414.26點是三大指數中最弱的一個，那斯達克跌百分之零點二九收26,506.99點。就業數據好，股市卻跌，原因是這份報告把「聯準會該收緊而不是放鬆」的劇本重新推回檯面。", "url": "https://www.cnbc.com/2026/09/04/jobs-report-august-2026.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "殖利率跳升", "color": "#E05C5C", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，殖利率跳升時承壓"}, {"t": "XLF", "n": "金融股 ETF，升息預期回溫對銀行利差是順風"}, {"t": "JPM", "n": "大型銀行代表，利率上行環境下的直接受益者"}], "en": "The bond market did the real repricing. Treasury yields jumped after the payrolls print, with the two-year yield reaching its highest level since January 2025 as traders pulled forward the odds of tighter policy. Fed funds futures moved to price a 58% chance of a hike at the September meeting, according to the CME FedWatch tool. Just two days earlier the market had been leaning the other way after dovish remarks from Governor Christopher Waller.", "zh": "真正把價格重算一遍的是債市。非農公布後公債殖利率全面跳升，兩年期殖利率升到2025年1月以來的最高水準，因為交易員把緊縮的時間表往前挪。根據芝商所FedWatch工具，聯邦資金期貨對九月會議升息的定價已經來到百分之五十八。值得注意的是兩天前市場還在往反方向靠，當時的理由是聯準會理事沃勒偏鴿的談話——同一週之內，定價來回擺盪了兩次。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-04-2026"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "油金齊揚", "color": "#E05C5C", "stocks": [{"t": "XLE", "n": "能源股 ETF，油價週線大漲的直接受惠板塊"}, {"t": "GLD", "n": "黃金 ETF，金價在每盎司4,500美元附近"}, {"t": "SLB", "n": "油田服務龍頭，鑽探活動與油價高度連動"}], "en": "Commodities were the week's quiet winner. West Texas Intermediate crude traded near 91 dollars a barrel on Friday and was on track for a weekly gain of roughly 9%, driven by renewed hostilities in the Middle East and uncertainty over shipping through the Strait of Hormuz. Gold held near 4,500 dollars an ounce. An oil move of this size matters beyond the energy sector because it feeds directly into the inflation data the Fed is about to price.", "zh": "商品市場是這週安靜的贏家。西德州原油週五在每桶91美元附近，全週漲幅約百分之九，推力是中東衝突再起以及荷姆茲海峽航運的不確定性。黃金則守在每盎司4,500美元附近。這種幅度的油價上漲意義不只在能源股，因為它會直接進到接下來的通膨數據裡——在市場已經把升息機率推到五成八的此刻，油價等於是在同一個方向上再加一把力。", "url": "https://tradingeconomics.com/commodity/crude-oil"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "賣壓結構", "color": "#E05C5C", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，逆勢漲0.27%收2,976.16點"}, {"t": "DIA", "n": "道瓊 ETF，跌0.51%，利率敏感的價值型大型股最受傷"}, {"t": "QQQ", "n": "那斯達克 ETF，跌0.29%，科技股相對守住"}, {"t": "LULU", "n": "下修全年財測後重挫17.38%收100.61美元，當日最受矚目的單一跌幅"}], "en": "The shape of the selling matters more than its size. The Dow fell hardest at 0.51%, the Nasdaq held up best at 0.29%, and the Russell 2000 actually rose 7.89 points or 0.27% to 2,976.16. That is not the signature of a panic; it is a rotation out of rate-sensitive large-cap value. Lululemon was the day's standout single-stock move, closing down 17.38% at 100.61 dollars after cutting full-year revenue guidance to a range of 10.35 to 10.50 billion dollars.", "zh": "賣壓的形狀比它的大小更值得看。道瓊跌百分之零點五一最重，那斯達克跌百分之零點二九最輕，而羅素2000反而漲7.89點、收在2,976.16點。這不是恐慌性殺盤的樣子，比較像是資金從利率敏感的價值型大型股裡退出來。當日最受矚目的單一個股是Lululemon，收盤重挫百分之十七點三八至100.61美元，理由是把全年營收財測砍到103.5億至105億美元區間。", "url": "https://www.fool.com/coverage/stock-market-today/2026/09/04/stock-market-today-sept-4-lululemon-plummets-17-after-slashing-guidance/"},
    {"id": "earn_0", "channel": "財報速報", "tag": "Samsara 飆漲", "color": "#E8786A", "stocks": [{"t": "IOT", "n": "盤中漲5.33%收38.75美元，盤後再漲16.39%至45.10美元"}, {"t": "TRMB", "n": "車隊與工業物聯網同業，可作為對照組"}], "en": "Samsara was Friday's after-hours winner. The industrial software company reported adjusted earnings of 0.20 dollars a share on revenue of 508.4 million dollars, against consensus of 0.16 dollars and 483.27 million. Revenue grew 30% year over year and annual recurring revenue reached 2.1 billion dollars. The stock rose 5.33% in the regular session to 38.75 dollars, then added another 16.39% after hours to 45.10 dollars, near the top of its 52-week range.", "zh": "Samsara是週五盤後最大的贏家。這家做工業物聯網軟體的公司繳出調整後每股獲利0.20美元、營收5.084億美元，兩項都超過市場預估的0.16美元與4.8327億美元。營收年增百分之三十，年度經常性收入來到21億美元。股價盤中先漲百分之五點三三收在38.75美元，盤後再衝百分之十六點三九到45.10美元，逼近52週高點。在一個因為升息預期而收黑的日子裡，這種反應說明市場對「還在加速的成長」仍然願意付溢價。", "url": "https://www.benzinga.com/markets/earnings/26/09/61617180/samsara-stock-jumps-as-q2-print-beats-expectations"},
    {"id": "earn_1", "channel": "財報速報", "tag": "DocuSign 上修", "color": "#E8786A", "stocks": [{"t": "DOCU", "n": "每股獲利1.16美元超預期，盤後漲3.61%至68.35美元"}, {"t": "ADBE", "n": "電子簽章與文件流程的競爭者，本週稍晚也將公布財報"}], "en": "DocuSign also beat, but the market's reward was far smaller. Earnings came in at 1.16 dollars a share against the 1.08 dollars analysts expected, and revenue of 875.7 million dollars topped the 867.2 million consensus. More importantly the company raised its annual recurring revenue growth outlook to a range of 8.5% to 9.0%, up from the 8.0% it had guided in each of the prior two years. Shares rose 3.61% after hours to 68.35 dollars from a close of 65.97.", "zh": "DocuSign同樣超標，但市場給的獎賞小得多。每股獲利1.16美元優於預估的1.08美元，營收8.757億美元也高於共識的8.672億美元。更值得看的是它把年度經常性收入的成長財測上修到百分之八點五至九點零，而前兩年給的都是百分之八。股價盤後從收盤價65.97美元漲百分之三點六一到68.35美元。這是一家從「停止減速」走到「開始加速」的公司，但市場顯然還在等更多證據。", "url": "https://www.investing.com/news/stock-market-news/docusign-shares-soar-on-strong-q2-print-upbeat-arr-guidance-4888506"},
    {"id": "earn_2", "channel": "財報速報", "tag": "獎賞的差距", "color": "#E8786A", "stocks": [{"t": "IOT", "n": "營收年增30%，盤後獲得16.39%的獎賞"}, {"t": "DOCU", "n": "財測上修0.75個百分點，盤後只漲3.61%"}, {"t": "CRM", "n": "大型 SaaS 對照組，說明成長溢價的分層"}], "en": "Two software companies beat on the same evening and the market paid one of them four times more. Samsara grew revenue 30% and gained 16.39% after hours; DocuSign nudged its recurring revenue outlook up by three quarters of a percentage point and gained 3.61%. The lesson is not that one report was better in an absolute sense. It is that in a market repricing toward higher rates, investors pay for acceleration and merely tolerate stabilization, because higher discount rates punish cash flows that arrive slowly.", "zh": "兩家軟體公司在同一個晚上都超標，市場付給其中一家的獎賞是另一家的四倍多。Samsara營收年增百分之三十，盤後漲百分之十六點三九；DocuSign把經常性收入財測往上挪了零點七五個百分點，盤後只漲百分之三點六一。差別不在於哪一份財報「比較好」，而在於：當市場正把利率往上重新定價時，投資人願意為「加速」付錢，對「止穩」則只是勉強接受。折現率愈高，來得愈慢的現金流就被打得愈兇。", "url": "https://www.investing.com/news/transcripts/earnings-call-transcript-samsara-tops-q2-2026-estimates-shares-jump-16-93CH-4888649"},
    {"id": "macro_0", "channel": "總經政策", "tag": "非農拆解", "color": "#7C6AF7", "stocks": [{"t": "EAT", "n": "連鎖餐飲代表，餐飲與酒吧單月增加5.9萬個工作"}, {"t": "DRI", "n": "餐飲集團，同屬八月就業成長的主要來源產業"}, {"t": "ADP", "n": "人力資源與薪資處理服務，就業市場的直接代理指標"}], "en": "The headline number and the trend tell different stories. August's 162,000 gain far outpaced the 31,000 monthly average of the prior twelve months, which is why it landed as such a shock. But the composition was narrow: restaurants and bars added 59,000 jobs, with the rest concentrated in local government education. Information-related sectors actually lost jobs. A single month driven by food service is a thinner foundation than the headline implies.", "zh": "標題數字與趨勢講的是兩個不同的故事。八月新增十六萬兩千人，遠高於過去十二個月每月平均的三萬一千人，這是它之所以造成衝擊的原因。但組成很窄：餐飲與酒吧一口氣增加五萬九千個工作，其餘主要集中在地方政府的教育部門，資訊相關產業則是減少的。換句話說，這是一個由餐飲業撐起來的單月數字，地基比標題看起來薄。要判斷勞動市場是否真的轉強，還需要看九月與十月能不能延續。", "url": "https://www.upi.com/Top_News/US/2026/09/04/nonfarm-payrolls-bureau-labor-statistics-august-2026/8801788532242/"},
    {"id": "macro_1", "channel": "總經政策", "tag": "靜默期開始", "color": "#7C6AF7", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，靜默期內對數據最敏感"}, {"t": "SHY", "n": "短天期公債 ETF，兩年期殖利率創2025年1月以來新高"}, {"t": "KRE", "n": "區域銀行 ETF，利率路徑的高貝他代表"}], "en": "From Saturday, September 5, Fed officials enter the blackout period ahead of the September 15-16 FOMC meeting, and it runs through September 17. That means no official can speak publicly to steer expectations for the next ten days. Given how violently pricing swung this week on Waller's comments and then the payrolls print, the absence of that steering mechanism leaves only two data points to trade on, and raises the odds of outsized moves around each of them.", "zh": "從九月五日星期六開始，聯準會官員進入九月十五日至十六日利率會議前的靜默期，一路持續到九月十七日。這代表接下來十天沒有任何官員可以公開發言去引導市場預期。考慮到這一週的定價光是因為沃勒的談話與非農數據就來回擺盪了兩次，少了官員的口頭引導，市場只剩下兩個數據可以交易。這通常意味著每一個數據公布當下的波動會被放大。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar"},
    {"id": "macro_2", "channel": "總經政策", "tag": "AI 與白領", "color": "#7C6AF7", "stocks": [{"t": "ACN", "n": "顧問服務龍頭，白領專業服務的直接暴露"}, {"t": "IBM", "n": "企業 IT 服務，資訊業就業變化的觀察對象"}, {"t": "ADP", "n": "薪資與人力數據供應商，可交叉驗證官方統計"}], "en": "One line in the jobs report deserves more attention than it got. While food service and local government education drove the gains, information-related sectors lost jobs, and the loss was attributed in part to AI investment displacing roles. This is worth watching not as a verdict but as a question: monthly official statistics are noisy and a single month proves nothing. But if the pattern repeats across several reports, it becomes a structural story rather than a rounding error.", "zh": "就業報告裡有一行值得比它得到的關注更多。在餐飲與地方政府教育撐起成長的同時，資訊相關產業的就業是減少的，而這個減少被部分歸因於AI投資取代了某些職位。這件事值得放在觀察名單上，但現在還不該當成結論：官方月度統計本來就有雜訊，單一個月證明不了任何事。真正的判準是接下來幾份報告會不會重複同樣的方向——如果會，它就從統計誤差變成結構故事。", "url": "https://www.upi.com/Top_News/US/2026/09/04/nonfarm-payrolls-bureau-labor-statistics-august-2026/8801788532242/"},
    {"id": "sector_0", "channel": "產業風向", "tag": "半導體集中度", "color": "#4EABA4", "stocks": [{"t": "SOXX", "n": "半導體 ETF，反映整個板塊的集中度風險"}, {"t": "AVGO", "n": "大型半導體權值股，AI 訂單的核心受惠者"}, {"t": "MU", "n": "記憶體大廠，本波漲勢的主要推力之一"}], "en": "A structural fact about the index deserves repeating. Semiconductor stocks now make up roughly 42% of the S&P 500 technology sector and about 20% of the entire index. That means an investor holding a plain index fund is making a far more concentrated bet on AI-adjacent chip names than the word diversified suggests. This is not a bearish call on semis; it is a statement about what passive exposure actually contains right now.", "zh": "關於指數結構有一個事實值得重複講。半導體股現在約佔標普五百科技板塊的百分之四十二，佔整個指數約百分之二十。這代表一個只買指數型基金的投資人，實際上在AI相關晶片股上的押注遠比「分散投資」這四個字聽起來要集中得多。這不是在看空半導體，而是在說明：現在的被動部位裡到底裝了什麼。當板塊回檔時，指數受到的牽動會比多數人預期的大。", "url": "https://articles.stockcharts.com/article/sector-rotation-just-changed-heres-whats-leading/"},
    {"id": "sector_1", "channel": "產業風向", "tag": "能源與電力", "color": "#4EABA4", "stocks": [{"t": "XLE", "n": "能源股 ETF，油價與資金流雙重順風"}, {"t": "XLU", "n": "公用事業 ETF，AI 資料中心電力需求的受惠者"}, {"t": "NRG", "n": "獨立發電商，電力需求成長的直接標的"}], "en": "Energy and utilities are carrying a tailwind from two different directions at once. Oil prices are elevated on Middle East supply risk, which lifts energy earnings directly. Separately, AI data center power demand is a multi-year structural driver for utilities and independent power producers, and it does not depend on the oil price at all. Both sectors have recently pushed to new highs, and the relative strength has come at the expense of technology momentum.", "zh": "能源與公用事業同時受到兩個方向的順風，而這兩個方向彼此無關。一邊是油價因中東供給風險而墊高，直接推升能源股的獲利；另一邊是AI資料中心的電力需求，這是一個跨年度的結構性驅動力，對公用事業與獨立發電商有利，而且完全不看油價臉色。兩個板塊近期都改寫高點，這股相對強勢是從科技股的動能裡拿走的。判讀重點是：這兩條線的持續性不一樣，油價是週期，電力需求是結構。", "url": "https://www.vaneck.com/us/en/blogs/thematic-investing/the-state-of-us-sector-investing-in-mid-2026/"},
    {"id": "sector_2", "channel": "產業風向", "tag": "商品退、體驗撐", "color": "#4EABA4", "stocks": [{"t": "XLY", "n": "非必需消費 ETF，商品類消費的整體代表"}, {"t": "LULU", "n": "高價運動服飾，下修財測是這條線最新的證據"}, {"t": "XLP", "n": "必需消費 ETF，消費降級時的相對防禦位置"}], "en": "The consumer is not disappearing, but the money is moving. Spending on fast-casual dining and big-ticket items such as homes, autos and high-end appliances has softened, and consumers report the strongest intent to cut back on accessories, jewelry and home decor. What is still holding up is restaurants, take-away food, beauty and streaming. The pattern is a shift from goods toward lower-cost experiences, driven by inflation, housing costs and borrowing expenses.", "zh": "消費者沒有消失，但錢在移動。快休閒餐飲與大額支出（房子、汽車、高階家電）都在轉弱，消費者自陳最想砍的支出是配件、珠寶與家飾。仍然撐得住的是餐廳、外帶食物、美妝與串流。整體的形狀是「從商品移向較低價的體驗」，背後的原因是通膨、居住成本與借貸成本三者疊加。這也解釋了為什麼高單價服飾會是最先出事的一環，而它同時是本週最劇烈的單一個股跌幅來源。", "url": "https://www.mckinsey.com/industries/consumer-packaged-goods/our-insights/the-state-of-the-us-consumer"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "逆勢收紅", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，週五漲0.27%、年初以來漲逾20%"}, {"t": "VTWO", "n": "另一檔追蹤羅素2000的 ETF，可作為成本對照"}], "en": "The Russell 2000 rose 0.27% to 2,976.16 on a day when all three large-cap indexes fell. Zoom out and the divergence is even starker: the small-cap index is up roughly 20% in 2026, its best year since 2003. The textbook reaction to rising rate-hike odds is for small caps to underperform, because they carry more floating-rate debt. That the opposite happened on Friday is the single most interesting thing in the session.", "zh": "羅素2000在三大指數全黑的一天漲百分之零點二七、收在2,976.16點。把鏡頭拉遠，這個背離更明顯：小型股指數2026年以來漲幅約百分之二十，是2003年以來最好的一年。教科書的反應應該是：升息機率上升時小型股要跌得更多，因為它們的浮動利率負債比重高。週五出現的卻是完全相反的結果，這是整個交易日裡最值得追究的一件事。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "晶片股當引擎", "color": "#5B8ED6", "stocks": [{"t": "AEHR", "n": "晶圓級老化測試設備，今年漲幅逾400%（已在雷達池內）"}, {"t": "ICHR", "n": "半導體設備次系統供應商，同屬漲逾400%之列"}, {"t": "MXL", "n": "類比與混訊晶片商，今年同樣漲逾400%"}], "en": "The engine behind the small-cap rally has a name, and it is not the Fed. Chip-related companies account for 16 of the Russell 2000's 50 best-performing stocks this year, including Aehr Test Systems, Ichor Holdings and MaxLinear, each of which has rallied more than 400%. Investors looking past the mega-cap AI names for the next layer of beneficiaries have found them at the small-cap end of the semiconductor supply chain. Note that a 400% move means these are no longer cheap or ignored.", "zh": "撐起小型股這波漲勢的引擎有名有姓，而且不是聯準會。今年羅素2000表現最好的五十檔股票裡，有十六檔跟晶片相關，其中Aehr Test Systems、Ichor Holdings與MaxLinear三檔漲幅都超過百分之四百。資金在大型AI股之外尋找「下一層受惠者」，而它找到的地方就是半導體供應鏈的小型股端。但要提醒的是：漲了四倍之後，這些名字已經既不便宜、也不再被忽視了。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "獲利面體檢", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普600小型股 ETF，前瞻本益比約16倍"}, {"t": "SLYV", "n": "標普600價值型 ETF，估值折價更明顯的一端"}], "en": "Behind the price action there is an earnings story worth checking. For the small-cap S&P 600 index, second-quarter total earnings rose 16.9% year over year on 7.8% higher revenues, with 71% of companies beating EPS estimates. On valuation, the S&P 600 trades at a forward price-to-earnings ratio of about 16, below the 18-plus readings it regularly carried before the pandemic. Earnings growth plus a below-average multiple is a more durable base than momentum alone.", "zh": "價格之外，獲利面也該一起體檢。標普600小型股指數第二季總獲利年增百分之十六點九、營收年增百分之七點八，其中百分之七十一的公司每股獲利超越預估。估值方面，標普600的前瞻本益比約十六倍，低於疫情前經常維持的十八倍以上。獲利在成長、倍數又低於長期平均，這個組合比單純的動能更耐用。這也是判斷這波小型股行情屬於「重新評價」還是「純資金行情」的關鍵分野。", "url": "https://www.zacks.com/featured-articles/301/best-small-cap-stocks"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "利率脆弱性", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素2000成長型 ETF，AI 供應鏈題材集中的一端"}, {"t": "IWN", "n": "羅素2000價值型 ETF，浮動利率負債壓力較集中的一端"}], "en": "Here is the tension worth holding in mind. Small caps carry a much higher share of floating-rate debt than large caps, which means every upward revision to the rate path raises their interest expense in real time rather than at refinancing. That is the mechanical reason small caps normally fall when hike odds rise. Friday broke that link, which leaves two possible readings: either the AI supply chain story is now the dominant driver, or the market has not finished repricing small caps for this rate path.", "zh": "這裡有一個值得放在心裡的張力。小型股的浮動利率負債比重遠高於大型股，這代表利率路徑每往上修一次，它們的利息費用是即時上升的，而不是等到再融資才反映。這就是小型股在升息機率上升時通常會跌得更重的機械原因。週五打破了這個連結，於是只剩兩種讀法：要嘛AI供應鏈的故事已經強到蓋過利率，要嘛市場對小型股的重新定價還沒做完。這兩種讀法會導向完全不同的部位。", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "池子的差異", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普600 ETF，成分股須有獲利門檻，體質較篩選過"}, {"t": "PSC", "n": "微型股 ETF，流動性與波動度都在另一個級距"}], "en": "A practical note on which small-cap pool you are actually in. The S&P 600 requires companies to be profitable to be included; the Russell 2000 does not, and typically holds a meaningful share of loss-making companies. That single rule difference explains much of the performance gap between the two indexes in any given year. Below both sits the micro-cap pool, where thinner liquidity means the same piece of good news produces a larger price move and a much harder exit.", "zh": "關於「你到底在哪一個小型股池子裡」的實務提醒。標普600要求成分公司必須獲利才能被納入，羅素2000沒有這個門檻，因此裡面通常有相當比重的虧損公司。光是這一條規則的差異，就能解釋兩個指數在任何一年裡的多數績效落差。再往下還有微型股這個池子，流動性更薄，代表同一則利多會推出更大的價格波動，但也代表要退出時的難度完全不同。買進容易賣出難，是這一層最常被低估的成本。", "url": "https://www.nerdwallet.com/investing/learn/understanding-small-cap-stocks"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新上池", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報", "stocks": [{"t": "SMID", "n": "Smith-Midland，預鑄混凝土製品商，股價逼近52週低點24.63美元"}], "en": "Smith-Midland makes precast concrete products, principally highway safety barriers and the SlenderWall building panel system, from plants in Virginia and the Carolinas. It is a micro-cap with almost no analyst coverage and effectively zero media presence. What changed: CEO Ashley Smith bought 2,000 shares on September 1 at 26.87 dollars, totaling 53,740 dollars and taking his direct holding to 180,539 shares. A day later director Matthew Smith bought 2,000 shares at 27.15 dollars, or 54,300 dollars. The stock is down 36% over the past year and near its 52-week low of 24.63 dollars. Risks: the buyers share a surname with the company, so this is family conviction rather than independent outside validation; revenue is project-based and lumpy; and micro-cap liquidity is thin. This is a research lead, not investment advice.", "zh": "Smith-Midland做的是預鑄混凝土製品，主力是高速公路安全護欄與SlenderWall外牆板系統，廠區在維吉尼亞州與南北卡羅來納州。它是一檔幾乎沒有分析師覆蓋、媒體聲量近乎零的微型股。正在改變的事：執行長Ashley Smith於九月一日以每股26.87美元買進兩千股、共53,740美元，持股增至180,539股；隔天董事Matthew Smith再以27.15美元買進兩千股、共54,300美元。股價過去一年跌百分之三十六，逼近52週低點24.63美元。風險與反方論點：兩位買方與公司同姓，這是家族內部的信心而不是獨立第三方的驗證；營收屬專案型、季度之間跳動大；微型股流動性薄，進出成本高。這是研究線索，不是投資建議。", "url": "https://www.investing.com/news/insider-trading-news/smith-midland-ceo-ashley-smith-buys-53740-in-company-stock-93CH-4889893"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（營收能否認列 DLA 訂單）", "stocks": [{"t": "UAMY", "n": "美國本土銻礦與冶煉，九月初出現董事與高階主管群聚買進"}], "en": "United States Antimony mines and smelts antimony domestically, a critical mineral used in ammunition primers, flame retardants and batteries. It has been in the radar pool since September 1 on the thesis that policy-driven orders would start converting into revenue. What changed this week: a director and the EVP and Chief Mining Engineer both bought shares in early September, roughly 193,000 dollars combined, and the company announced a sizable buyback following a weak quarter. Risks: the buyback follows a quarter that missed, which can be a way of supporting a price rather than a signal of confidence; the entire thesis still depends on government orders converting, which has not yet shown up in the revenue line. Research lead only, not investment advice.", "zh": "United States Antimony在美國本土開採並冶煉銻，這是一種用於彈藥底火、阻燃劑與電池的關鍵礦物。它自九月一日進入雷達池，論點是「政策訂單開始變成營收」。本週的新變化：九月初一位董事與執行副總暨總礦務工程師雙雙買進，合計約十九萬三千美元；同時公司在一個疲弱的季度之後宣布了大規模庫藏股。風險與反方論點：庫藏股緊接在財報未達標之後出現，這可能是在撐價而不是信心的訊號；整個論點仍然壓在「政府訂單能否轉成營收」這一件事上，而這件事到目前為止還沒有出現在營收數字裡。這是研究線索，不是投資建議。", "url": "https://www.timothysykes.com/news/united-states-antimony-corporation-uamy-news-2026_09_02/"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "三天後交卷", "color": "#C9A227", "status": "RADAR · 下一個驗證點 9/8 盤後 FQ3 財報", "stocks": [{"t": "AVO", "n": "Mission Produce，酪梨與藍莓的種植行銷配銷商，9/8 盤後公布財報"}], "en": "Mission Produce grows, markets and distributes avocados and blueberries, with a market value around one billion dollars and thin coverage relative to its size. It entered the pool on August 1 with a clearly dated decision point, and that date is now three days away: fiscal third-quarter results after the close on September 8. The question the report has to answer is narrow. Have avocado average selling prices recovered and has gross margin repaired, which is the test of whether management's description of the weakness as temporary holds up. Also worth checking: how much of the 100 million dollar buyback authorization was actually executed and at what average price. Risks: agricultural pricing is outside management's control and a single quarter of weather or supply shift can override any operational improvement. Research lead only, not investment advice.", "zh": "Mission Produce從事酪梨與藍莓的種植、行銷與配銷，市值約十億美元，以這個規模來說分析師覆蓋偏薄。它八月一日入池時就設了一個有明確日期的決勝點，而那個日期只剩三天：九月八日盤後公布會計年度第三季財報。這份報告要回答的問題很窄——酪梨均價是否回升、毛利率能否修復，這是檢驗管理層「衰弱只是暫時性」說法站不站得住的依據。另外要看的是一億美元庫藏股實際買回了多少股、均價多少。風險與反方論點：農產品價格不在管理層控制範圍內，單季的天候或供給變化就足以蓋過任何營運面的改善。這是研究線索，不是投資建議。", "url": "https://stockanalysis.com/stocks/avo/"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "訊號的極限", "color": "#C9A227", "status": "RADAR · 列觀察不列論點，等基本面第二條腿", "stocks": [{"t": "QNRX", "n": "Quoin Pharmaceuticals，9/1 執行長、營運長、財務長與董事同步買進約28萬美元"}, {"t": "ADV", "n": "雷達池內的反面教材：執行長一年18次買進、零賣出，最後驗證失敗"}], "en": "On September 1, Quoin Pharmaceuticals saw its CEO, COO, CFO and a director all buy shares on the same day, roughly 280,000 dollars combined. By the textbook this is the strongest form of the signal: academic work finds cluster purchases, defined as three or more insiders buying within a five-day window, generate roughly twice the excess return of single-insider buys over 21 trading days. So why is this an observation rather than a thesis? Because this pool already ran that experiment. Advantage Solutions had 18 CEO purchases and zero sales across a year, and it failed its verification point anyway, because insider buying was the only leg the argument stood on. Without a second, independent line of fundamental evidence, a cluster buy tells you what management believes, not what the business is doing. Research lead only, not investment advice.", "zh": "九月一日，Quoin Pharmaceuticals的執行長、營運長、財務長與一位董事在同一天買進自家股票，合計約二十八萬美元。按教科書，這是這個訊號最強的形態：學術研究顯示「群聚買進」（五個交易日內三位以上內部人買進）在二十一個交易日的超額報酬約為單一內部人買進的兩倍。那為什麼今天只把它列成觀察、不列成論點？因為這個池子已經做過這個實驗。Advantage Solutions的執行長一年內買了十八次、一次沒賣，最後仍然在驗證點失敗，原因就是整個論點只有「內部人買進」這一條腿。少了第二條獨立的基本面證據，群聚買進告訴你的是管理層相信什麼，不是這門生意正在發生什麼。這是研究線索，不是投資建議。", "url": "https://www.everhint.com/insider-trading-signals-september-02-2026/"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "忽視已反轉", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月 FQ1 財報（在手訂單能否續增）", "stocks": [{"t": "AEHR", "n": "晶圓級老化測試設備，今年漲逾400%，已從忽視股變成擁擠股"}], "en": "Aehr Test Systems entered this pool on August 13 as a neglected name in wafer-level burn-in test equipment. It is now one of the Russell 2000's best performers of the year, up more than 400%. That success creates a different problem worth stating plainly: the neglect that formed the original thesis is gone. A stock followed by momentum funds and screened by every small-cap chip list is no longer mispriced through inattention, and the margin of safety that came from being ignored has been spent. The next verification point is the fiscal first-quarter report around October, where backlog needs to keep growing from 100.6 million dollars. Risks: at this valuation the report has to be excellent merely to hold the price, and disappointment is punished from a much higher base. Research lead only, not investment advice.", "zh": "Aehr Test Systems在八月十三日以「被忽視的晶圓級老化測試設備商」進入這個池子。它現在是羅素2000今年表現最好的股票之一，漲幅超過百分之四百。這個成功帶來一個必須講清楚的新問題：當初構成論點的「被忽視」已經消失了。一檔被動能基金追蹤、出現在每一份小型晶片股清單上的股票，不再是因為沒人看而被錯誤定價，來自無人注意的安全邊際已經花掉了。下一個驗證點是十月左右的會計年度第一季財報，在手訂單要能從一億零六十萬美元續增。風險：在這個估值上，財報必須很好才只是「維持股價」，而失望會從高很多的基準往下打。這是研究線索，不是投資建議。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "外部檢查過關", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（營運現金流能否轉正）", "stocks": [{"t": "BATL", "n": "Battalion Oil，微型市值油氣生產商，入池時設的油價門檻已通過"}, {"t": "AMPY", "n": "同屬微型油氣的池內標的，同樣受惠於油價環境"}], "en": "Battalion Oil is a micro-cap oil and gas producer that entered the pool on September 1. Its thesis carried two external checks that had to clear before the fundamentals even mattered: WTI holding above 80 dollars, and a second insider following the first. Both cleared on September 2, and this week's move takes the check further, with crude trading near 91 dollars after a roughly 9% weekly gain on Middle East supply risk. That means the commodity environment is now about as favorable as this thesis could ask for, which shifts the burden entirely onto execution. The November third-quarter report has to show operating cash flow turning positive. Risks: if cash flow cannot turn positive with oil near 91 dollars, the problem is the company rather than the cycle, and micro-cap energy carries both liquidity and balance-sheet risk. Research lead only, not investment advice.", "zh": "Battalion Oil是一檔九月一日入池的微型市值油氣生產商。它的論點帶了兩個外部檢查，必須先通過、基本面才談得上：西德州原油守住八十美元，以及出現第二位內部人跟進。兩項都在九月二日通過，而本週的行情把這個檢查推得更遠——原油因中東供給風險週漲約百分之九，來到每桶91美元附近。這代表商品環境已經好到這個論點所能要求的程度，於是舉證責任完全落到執行力上。十一月的第三季財報必須看到營運現金流轉正。風險與反方論點：如果在油價91美元的環境下現金流仍然無法轉正，問題就在公司而不在景氣循環；微型油氣同時帶有流動性風險與資產負債表風險。這是研究線索，不是投資建議。", "url": "https://oilprice.com/"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "賣壓壓倒買盤", "color": "#6DB56D", "stocks": [{"t": "CAT", "n": "執行長領頭的獲利了結名單之一"}, {"t": "SNPS", "n": "執行董事長賣出，屬同一波科技股減碼"}, {"t": "ABNB", "n": "策略長賣出，消費科技端的獲利了結"}], "en": "The aggregate picture in early September leans heavily one way. On September 2 alone, insider disposals topped 175 million dollars against just 2.6 million dollars of purchases, with C-suite executives at Caterpillar, Synopsys and Airbnb among those selling into strength across technology, healthcare and energy. Context matters when reading this: selling has many innocent explanations including scheduled 10b5-1 plans, diversification and tax planning, which is why disposals are far weaker evidence than purchases. But a ratio this lopsided still describes the mood at the top.", "zh": "九月初的總體圖像明顯偏向一邊。光是九月二日這一天，內部人賣出金額就超過一億七千五百萬美元，買進只有兩百六十萬美元；Caterpillar、Synopsys與Airbnb的高階主管都在其中，賣出範圍橫跨科技、醫療與能源。讀這個數字要帶上背景：賣出有很多無辜的解釋，包括預先排定的10b5-1計畫、資產分散與稅務規劃，這也是為什麼賣出的證據力遠低於買進。但一個這麼懸殊的比例，仍然說明了公司高層此刻的心情。", "url": "https://www.everhint.com/insider-trading-signals-september-02-2026/"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "什麼算群聚", "color": "#6DB56D", "stocks": [{"t": "SMID", "n": "執行長9/1、董事9/2連續兩天買進，屬五日內的群聚形態"}, {"t": "QNRX", "n": "執行長、營運長、財務長與董事同日買進，是最完整的群聚形態"}], "en": "Since the term gets used loosely, here is the working definition. A cluster buy is when three or more insiders at the same company independently purchase shares within a five-day window. The distinction matters because academic research finds cluster purchases generate roughly twice the excess return of single-insider buys over a 21-trading-day horizon, reflecting conviction shared across leadership rather than one person's view. By that standard Quoin's four-person same-day purchase is the fuller pattern, while Smith-Midland's two buyers across two days is the weaker one. Neither definition says anything about whether the underlying business is improving.", "zh": "這個詞被用得很鬆，所以先把定義說清楚。所謂「群聚買進」，指的是同一家公司有三位以上內部人在五個交易日內各自獨立買進股票。這個區分之所以重要，是因為學術研究發現群聚買進在二十一個交易日的超額報酬約為單一內部人買進的兩倍，反映的是整個領導層共有的信心，而不是一個人的看法。按這個標準，Quoin四個人同一天買進是比較完整的形態，Smith-Midland兩個人跨兩天買進則是比較弱的一種。但要記得：這兩個定義都沒有告訴你這門生意本身有沒有變好。", "url": "https://www.form4api.com/guides/cluster-buy-signals"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "兩套制度", "color": "#6DB56D", "stocks": [{"t": "UAMY", "n": "Form 4 走兩個工作日申報，所以九月初的買進本週就能讀到"}, {"t": "ERII", "n": "池內教訓：董事以8.88美元加碼後，公司仍在下一季大幅衰退"}], "en": "Two disclosure systems get confused constantly, so it is worth separating them. Corporate insiders file Form 4 within two business days of a trade, which is why the early-September purchases at US Antimony and Smith-Midland are readable this week. Members of Congress file Periodic Transaction Reports under the STOCK Act with up to a 45-day lag, so those disclosures describe a much older price. And on either system, the sharpest caution comes from this pool's own record: an Energy Recovery director bought at 8.88 dollars, and the company then reported a 57% revenue decline. Insiders can be both early and wrong.", "zh": "兩套揭露制度經常被混為一談，值得分開講。公司內部人走的是Form 4，交易後兩個工作日內就要申報，這也是為什麼United States Antimony與Smith-Midland在九月初的買進，本週就能讀到。國會議員走的是STOCK法案下的定期交易報告，最長可延遲四十五天，所以那些揭露描述的是老得多的價位。而不論哪一套制度，最尖銳的提醒來自這個池子自己的紀錄：Energy Recovery的董事在8.88美元加碼，公司下一季的營收年減百分之五十七。內部人可以既早又錯。", "url": "https://www.congress.gov/crs_external_products/TE/HTML/TE10073.html"},
    {"id": "capitol_0", "channel": "政要持股", "tag": "單向加碼", "color": "#B5654D", "stocks": [{"t": "NVDA", "n": "該申報中的持有標的之一，AI 運算的核心部位"}, {"t": "MSFT", "n": "同一份申報中的雲端與 AI 平台部位"}, {"t": "GOOGL", "n": "同一份申報中的另一檔大型科技持股"}, {"t": "AMAT", "n": "另一位眾議員新申報中的半導體設備部位"}], "en": "The most recent filing worth reading is from Representative Cleo Fields of Louisiana's 6th district, processed September 2. Its structure is unusual: nine transactions, all purchases, no sales at all, in an amount band running from about 9,000 to 135,000 dollars, concentrated in Nvidia, Microsoft and Alphabet. What that position expresses is a single undiversified view that AI compute infrastructure keeps compounding, with no hedge and no trimming. A separate new filing from Representative John McGuire of Virginia's 5th district points the same direction through Applied Materials, BlackRock and Nvidia. Two filers is a coincidence, not a trend, but the shape of the bet is legible.", "zh": "當期最值得讀的一份申報來自路易斯安那州第六選區眾議員Cleo Fields，於九月二日處理完成。它的結構不尋常：九筆交易全部是買進、沒有任何賣出，金額區間約在九千至十三萬五千美元，標的集中在輝達、微軟與Alphabet。這個部位表達的是一個沒有分散、也沒有對沖的單一觀點——AI運算基礎設施會繼續複利成長。另一份來自維吉尼亞州第五選區眾議員John McGuire的新申報，透過應用材料、貝萊德與輝達指向同一個方向。兩位申報人是巧合而不是趨勢，但這筆錢在押什麼主題，是讀得出來的。", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure"},
    {"id": "capitol_1", "channel": "政要持股", "tag": "讀法提醒", "color": "#B5654D", "stocks": [{"t": "NANC", "n": "追蹤民主黨議員申報持股的 ETF，可在「政要績效」分頁對照"}, {"t": "GOP", "n": "追蹤共和黨議員申報持股的 ETF，同一分頁可比較"}], "en": "Four structural facts should sit between these filings and any conclusion. First, the STOCK Act allows up to 45 days before disclosure, so a filing read today describes a price from mid-to-late July, and this week alone the rate outlook flipped twice. Second, amounts are disclosed only as wide bands, so a precise-looking figure like 9,009 dollars is the sum of band floors, not an actual dollar amount. Third, many trades are executed in spouse or trust accounts and may not reflect the member's own decision. Fourth, where options appear, the strike and expiry carry the real information and a plain purchase notice discards it. The honest framing is that someone voted for a theme with real money, on a delay.", "zh": "在這些申報與任何結論之間，應該擺上四個結構性事實。第一，STOCK法案允許最長四十五天才揭露，所以今天讀到的申報描述的是七月中下旬的價位，而光是這一週，利率預期就翻轉了兩次。第二，金額只揭露寬區間，所以像「9,009美元」這種看起來很精確的數字，其實是各級距下限的加總，不是真實金額。第三，許多交易是在配偶或信託帳戶執行，未必反映議員本人的決定。第四，若涉及選擇權，真正有資訊量的是履約價與到期日，而一則「買進」通知會把這些丟掉。誠實的說法是：有人用真錢投票給某個主題，而且是延遲的。", "url": "https://www.congress.gov/crs_external_products/R/HTML/R47818.html"},
    {"id": "week_0", "channel": "本週事件", "tag": "數據週", "color": "#C97DD4", "stocks": [{"t": "SPY", "n": "標普500 ETF，兩份通膨數據的主要定價標的"}, {"t": "IEF", "n": "中天期公債 ETF，CPI 當天的波動核心"}], "en": "Two inflation prints land before the Fed decides. The Producer Price Index is released before Thursday's open and the Consumer Price Index before Friday's open, and they arrive with officials already in the blackout period that began Saturday. The FOMC then meets September 15 and 16, with an updated dot plot. The setup is unusually loaded: markets are pricing a 58% chance of a hike, oil just gained about 9% on the week, and there is no official commentary available to soften a surprise in either direction.", "zh": "聯準會做決定之前，還有兩份通膨數據要落地。生產者物價指數在週四開盤前公布，消費者物價指數在週五開盤前公布，而它們抵達時官員已經處於週六開始的靜默期。接著是九月十五日與十六日的利率會議，並會更新點陣圖。這個組合的張力不尋常：市場已經把升息機率定價到五成八，油價本週才剛漲約百分之九，而且沒有任何官方談話可以在數據意外時往任一方向緩衝。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar"},
    {"id": "week_1", "channel": "本週事件", "tag": "財報接力", "color": "#C97DD4", "stocks": [{"t": "ORCL", "n": "本週登場，市場看的是 AI 資本支出與雲端訂單能見度"}, {"t": "ADBE", "n": "本週登場，市場看的是 AI 功能能否轉成訂閱定價"}, {"t": "KR", "n": "連鎖超市，可交叉驗證消費降級的走向"}, {"t": "AVO", "n": "雷達池標的，9/8 盤後公布會計年度第三季財報"}], "en": "The earnings calendar offers a useful contrast this week. Oracle and Adobe both report, and together they frame the two halves of the AI question: Oracle speaks to capital expenditure and cloud capacity commitments, the spending side, while Adobe speaks to whether AI features can actually be converted into subscription pricing, the monetization side. Kroger also reports and provides a direct read on whether the shift away from goods spending is showing up at the grocery level. And from the radar pool, Mission Produce reports after the close on September 8.", "zh": "本週的財報行事曆提供了一組有用的對照。甲骨文與Adobe都要公布，兩者合起來剛好框住AI問題的兩半：甲骨文講的是資本支出與雲端產能承諾，也就是「花錢」那一側；Adobe講的是AI功能到底能不能轉換成訂閱定價，也就是「收錢」那一側。Kroger同樣公布財報，可以直接交叉驗證消費從商品移開的趨勢有沒有反映在超市端。另外，雷達池裡的Mission Produce在九月八日盤後交卷。", "url": "https://seekingalpha.com/news/4147628-earnings-week-ahead-adobe-oracle-kroger-gamestop-and-more"},
    {"id": "eval_0", "channel": "今日評估", "tag": "今日評估", "color": "#E8A838", "status": "讀完了。往下滑有討論按鈕，可以把今天的問題丟給 AI 一起想", "stocks": [{"t": "RSP", "n": "標普500等權重 ETF，用來檢查漲跌是否集中在少數權值股"}, {"t": "VTI", "n": "全市場 ETF，涵蓋大中小型股的整體樣貌"}], "en": "The single most notable thing today is a contradiction, not a data point. The market moved the September meeting from lean-hold to a 58% chance of a hike inside 48 hours, and on the very same session the Russell 2000 closed higher while all three large-cap indexes fell. Small caps carry more floating-rate debt, so a hawkish repricing should hurt them most. Both facts cannot be fully right. Either the AI supply chain story has become strong enough to override the rate path for small caps, or the small-cap complex simply has not finished repricing yet. The open question: which of those two readings are you willing to take a position on before CPI lands on Friday?", "zh": "今天最值得注意的不是某個數字，而是一個矛盾。市場在四十八小時內把九月會議從「傾向不動」改成「五成八機率升息」，而就在同一個交易日，羅素2000收紅、三大指數卻全黑。小型股的浮動利率負債比重更高，鷹派的重新定價理論上該傷它最重。這兩件事不可能同時完全成立：要嘛AI供應鏈的故事已經強到蓋過小型股的利率路徑，要嘛小型股根本還沒開始把這條路徑算進去。開放問題留給你：在週五消費者物價指數落地之前，這兩種讀法你願意押哪一邊？", "url": "https://www.cnbc.com/2026/09/04/jobs-report-august-2026.html"},
];

// 排程只要照常抽換 CARDS 就好,不用額外維護日期。
const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();
const lsKeyFor = (sub) => "mosfeed_" + BRIEF_ID + "_" + sub;

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {

  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>

  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/05/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v10.0</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
