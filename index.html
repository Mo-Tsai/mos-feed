/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;
    --text-tertiary: #6b6863; --divider: #ddd9d1;
    --noise-opacity: 0.035;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  /* 鍵盤焦點:看得到目前在哪一顆 */
  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }
  .tab-nav button { background: none; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: Georgia, serif; transition: all 0.3s ease; padding: 0; line-height: 1.2; }
  .sub-pill { background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 0 4px; min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; white-space: nowrap; transition: all 0.2s ease; border-bottom: 1px solid transparent; }
  .swipe-area { position: relative; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .card-slide { position: absolute; inset: 0; padding: 16px 32px 96px; display: flex; flex-direction: column; justify-content: flex-start; transition: transform 0.3s ease, opacity 0.3s ease; will-change: transform, opacity; overflow-y: auto; }
  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }
  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }
  .source-link { position: relative; display: inline-block; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }

  .theme-toggle { position: fixed; top: 12px; z-index: 100; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; font-size: 17px; color: var(--text-tertiary); padding: 0; line-height: 1; transition: color 0.3s ease; font-family: 'Courier New', monospace; }
  .theme-toggle:hover { color: var(--text-secondary); }
  .icon-btn { background: none; border: none; cursor: pointer; color: var(--text-tertiary); min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; }

  [data-theme="dark"] .word-popup { box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .az-input { width:100%; background:var(--bg); border:1px solid var(--divider); color:var(--text); padding:9px 10px; font-family:'Courier New',monospace; font-size:12px; outline:none; -webkit-appearance:none; appearance:none; border-radius:0; }

  .az-input:focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 1px; }
  .nav-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; gap:4px; padding:8px 12px 12px; background:var(--bg); border-top:1px solid var(--divider); z-index:50; }
  .nav-btn { background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:16px; cursor:pointer; padding:10px 18px; min-height:44px; min-width:40px; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; line-height:1; }

  .nav-btn-lang { padding:10px 11px; font-size:12px; letter-spacing:0.06em; color:var(--text-secondary); min-width:40px; }

  .nav-btn:hover { border-color:var(--text-secondary); color:var(--text); }
  .nav-btn:active { background:var(--bg-elevated); }
  .nav-btn:disabled { opacity:0.3; cursor:default; border-color:var(--divider); color:var(--text-tertiary); }
  .nav-count { font-family:'Courier New',monospace; font-size:11px; letter-spacing:0.1em; color:var(--text-tertiary); text-transform:uppercase; white-space:nowrap; }

</style>

  {"id": "earn_0", "channel": "財報速報", "tag": "Moderna", "color": "#E8786A", "zh": "Moderna 週五公布第三季：營收約 13 億美元、年增 29%，GAAP 淨利約 2 億美元、每股 0.38 美元；公司把 2026 年營收成長預期上調到 15% 到 25%（原本是最多 10%），並下修營運費用約 2 億美元，年底現金預期 81 億到 83 億美元。執行長把成長歸因於流感疫苗 mFLUSIVA 在美國獲批與黑色素瘤第三期數據。財報前市場共識約 8.8 億美元，但那個數字可能過時，股價反應我沒查到。", "en": "Moderna reported Q3 on Friday: revenue of about $1.3 billion, up 29%, GAAP net income of about $0.2 billion and GAAP EPS of $0.38. It raised 2026 revenue growth guidance to 15% to 25% (from up to 10%), cut GAAP operating expenses by about $0.2 billion, and expects year-end cash of $8.1 to $8.3 billion. The CEO credited the US approval of the flu vaccine mFLUSIVA and positive Phase 3 melanoma data. Pre-report consensus was about $882 million, though that figure may be stale; I did not find the share reaction.", "url": "https://www.sec.gov/Archives/edgar/data/0001682852/000168285226000194/exhibit9912026q3pressrelea.htm", "stocks": [{"t": "MRNA", "n": "Q3 營收約 13 億美元，全年成長預期上調到 15% 到 25%"}]},
  {"id": "earn_1", "channel": "財報速報", "tag": "Vistra", "color": "#E8786A", "zh": "Vistra 週五公布第三季：GAAP 淨利 11.4 億美元（含 5.59 億美元未實現避險利得），營運調整後 EBITDA 23.78 億美元、年增逾 50%。公司上調 2026 年 EBITDA 指引到 71 億至 75 億美元，首度給出 2027 年 77 億至 85 億美元，並新增 15 億美元庫藏股授權；Cogentrix 約 5,500 百萬瓦的天然氣電廠已在 10 月完成併購。財報前共識約為每股 3.01 美元，股價反應我沒查到。", "en": "Vistra reported Q3 on Friday: GAAP net income of $1.14 billion (including a $559 million unrealized hedge gain) and ongoing-operations adjusted EBITDA of $2.378 billion, up more than 50%. It raised 2026 EBITDA guidance to $7.1 to $7.5 billion, gave first 2027 guidance of $7.7 to $8.5 billion, and added a $1.5 billion buyback authorization; the Cogentrix deal, about 5,500 MW of gas-fired capacity, closed in October. Pre-report consensus was about $3.01 per share; I did not find the share reaction.", "url": "https://www.sec.gov/Archives/edgar/data/0001692819/000169281926000023/vistra-20260930xearningsre.htm", "stocks": [{"t": "VST", "n": "2026 EBITDA 指引上調到 71 億至 75 億美元，新增 15 億美元庫藏股"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "Humana", "color": "#E8786A", "zh": "Humana 週五公布第三季，把 2026 年調整後每股盈餘指引上調到至少 9.50 美元（原本是至少 9.00 美元）。管理層說 2027 年的個人 Medicare Advantage 投標策略，有助於在 2028 年達成稅前利潤率至少 3% 的承諾，並把 2028 年的產品與費用管理在接近前四分之一星等的水準。我只查到指引與管理層談話，季度實際數字與股價反應沒有查到。", "en": "Humana reported Q3 on Friday and raised its 2026 adjusted EPS guidance to at least $9.50 from at least $9.00. Management said its 2027 individual Medicare Advantage bid approach should help reach its commitment of a sustainable pre-tax margin of at least 3% in 2028, and that it will manage 2028 products and expenses to a level approximating top-quartile Star Ratings. I found only the guidance and prepared remarks; the quarterly actuals and the share reaction were not found.", "url": "https://www.sec.gov/Archives/edgar/data/0000049071/000004907126000064/a3q2026humanaincpostedrema.htm", "stocks": [{"t": "HUM", "n": "2026 調整後 EPS 指引上調到至少 9.50 美元"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "非農大幅超預期", "color": "#7C6AF7", "zh": "10 月非農新增 16.5 萬人，預期只有約 6.5 萬到 7 萬人；失業率降到 4.1%（預期 4.2%），時薪月增 0.4%。近三個月平均新增 13.7 萬人，過去 12 個月平均只有 4.8 萬人，而報導說損益兩平約在每月 3 萬人。前幾個月的修正幅度各報導說法不一，細節請以勞工統計局原文為準。就業強勁對股市是好消息，卻也是升息預期升溫的原因。", "en": "October nonfarm payrolls rose 165,000 against expectations of about 65,000 to 70,000; unemployment fell to 4.1% (4.2% expected) and wages rose 0.4% on the month. The three-month average gain is 137,000 while the 12-month average is only 48,000, and a report puts breakeven at about 30,000 a month. Reports differ on the size of prior-month revisions, so check the BLS release. Strong jobs are good news for the economy, but also the reason rate-hike expectations are rising.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-november-6-dow-sp-500-nasdaq-jobs-report-earnings-135953863.html", "stocks": [{"t": "IWM", "n": "小型股對利率最敏感，非農後的反應"}, {"t": "TLT", "n": "長天期美債 ETF，殖利率走勢"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "升息預期", "color": "#7C6AF7", "zh": "報導說這份就業數字讓市場更確定聯準會 12 月會升息，官員的焦點是偏高的通膨；報導引用的通膨率是 3.1%，時薪成長 0.4% 已經追上物價。另外 9 月核心 CPI 年增 2.6%，高於預期的 2.5%。十年期殖利率 4.859% 接近 5%，而週四股市重挫時殖利率一度下降，今天卻跟著就業數字回升，顯示債市與股市現在是看不同的故事。", "en": "A report says the jobs data solidified expectations for a Fed hike in December, with officials focused on elevated inflation; it cites inflation at 3.1%, and the 0.4% wage gain has caught up with prices. September core CPI rose 2.6% year over year, above the 2.5% forecast. The 10-year yield at 4.859% is near 5%; it fell during Thursday's rout but rose with the jobs data, a sign bonds and stocks are reading different stories.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-november-6-dow-sp-500-nasdaq-jobs-report-earnings-135953863.html", "stocks": [{"t": "IEF", "n": "7-10 年美債 ETF，十年期殖利率 4.859%"}, {"t": "XLF", "n": "金融類股 ETF，升息預期對銀行淨息差的影響"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "選後資料中心政策", "color": "#7C6AF7", "zh": "報導把週四重挫的觸發點指向民主黨贏得國會控制權，市場擔心資料中心與 AI 支出的政策風險。新當選的幾位州長承諾暫停興建，德州州長則說已核准的專案可以完工。昨天的資料還有：41 項地方資料中心投票案中有 40 項遭否決。政策風險不會一天消化完，之後要看的是各州的實際行政命令，而不是競選承諾。", "en": "A report points to Democrats winning control of Congress as the trigger for Thursday's rout, with the market worried about policy risk for data centers and AI spending. Several newly elected governors pledged to pause construction, while the Texas governor said already-permitted projects can finish. Yesterday's data also showed voters rejected 40 of 41 local data-center ballot measures. Policy risk will not be absorbed in a day; what matters next is actual state executive orders, not campaign pledges.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-november-6-dow-sp-500-nasdaq-jobs-report-earnings-135953863.html", "stocks": [{"t": "CEG", "n": "核能發電商，資料中心用電需求的受惠者也是政策風險承受者"}, {"t": "SMH", "n": "半導體 ETF，AI 資本支出預期的指標"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "科技與能源週線", "color": "#4EABA4", "zh": "報導說標普 500 本週是 6 月以來最差的一週，其中科技類股（XLK）一週下跌約 7%、能源類股（XLE）下跌約 11%。兩者是不同的原因：科技是 AI 資本支出與政策風險，能源是油價從高點回落。布蘭特雖然已跌破 100 美元，但中東戰事再升級的風險還沒有解除，所以能源的跌幅不等於風險消失。", "en": "A report says the S&P 500 had its worst week since June, with technology (XLK) down about 7% and energy (XLE) down about 11% for the week. The reasons differ: tech on AI capex and policy risk, energy on oil retreating from its highs. Brent has fallen below $100, but the risk of renewed Middle East escalation has not gone away, so energy's drop does not mean the risk is gone.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-november-6-dow-sp-500-nasdaq-jobs-report-earnings-135953863.html", "stocks": [{"t": "XLK", "n": "科技類股 ETF，本週約 -7%"}, {"t": "XLE", "n": "能源類股 ETF，本週約 -11%"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "電力股的折價", "color": "#4EABA4", "zh": "Vistra 在財報前的開盤價約 140.63 美元，遠低於 52 週高點 198.82 美元，也就是說市場在財報之前，已經先反映了資料中心政策的風險。財報給的是另一面：2026 與 2027 年 EBITDA 指引都往上、庫藏股增加。電力股夾在兩股力量之間：用電需求的長期故事，與各州限制新資料中心的政策風險；7 月紐約州已宣布一年期的大型資料中心暫停許可。", "en": "Vistra was trading around $140.63 before its report, far below its 52-week high of $198.82, so the market had already priced in data-center policy risk before earnings. The report showed the other side: higher EBITDA guidance for 2026 and 2027 and a bigger buyback. Power stocks sit between two forces: the long-term demand story and state-level limits on new data centers; in July New York announced a one-year pause on permits for large data centers.", "url": "https://www.tikr.com/blog/vistra-stock-is-down-28-over-the-past-year-discount-or-warning-sign", "stocks": [{"t": "VST", "n": "財報前價位約 140.63 美元，52 週高點 198.82 美元"}, {"t": "CEG", "n": "7 月紐約暫停大型資料中心許可時的主要受影響股"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "AI 雲與礦工", "color": "#4EABA4", "zh": "比特幣挖礦轉做 AI 雲的 IREN 週五盤中最多上漲約 20%，前一天曾下跌約 17%。這季 AI 營收 2 億美元，前一季是 7,100 萬美元、去年同期只有 700 萬美元；但單季虧損 2.63 億美元比分析師預期更大，股價今年累計仍下跌逾 50%。這是典型的成長與獲利之間的拉鋸：營收三級跳，現金消耗也很快。", "en": "IREN, the bitcoin miner turned AI cloud provider, rose as much as about 20% on Friday after falling about 17% the day before. AI revenue was $200 million this quarter, versus $71 million last quarter and $7 million a year earlier, but the quarterly loss of $263 million was wider than analysts expected and the stock is still down more than 50% this year. A classic tension between growth and profit: revenue is stepping up fast, and so is cash burn.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-november-6-dow-sp-500-nasdaq-jobs-report-earnings-135953863.html", "stocks": [{"t": "IREN", "n": "AI 營收 2 億美元，單季虧損 2.63 億美元"}, {"t": "IBIT", "n": "比特幣現貨 ETF，比特幣約 7.6 萬美元"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000", "color": "#5B8ED6", "zh": "羅素 2000 週五上漲 0.89% 收 2,754.11，比週四收盤 2,729.89 多了 24.22 點。週四它下跌約 4.45%，所以週五只是小幅反彈。小型股對利率最敏感，12 月升息的預期升高時，浮動利率負債較多的公司壓力最大，今天的反彈要連同下週的 CPI 一起看。", "en": "The Russell 2000 gained 0.89% on Friday to 2,754.11, up 24.22 points from Thursday's 2,729.89 close. It had fallen about 4.45% on Thursday, so Friday was only a modest bounce. Small caps are the most rate-sensitive; if December hike expectations rise, companies with more floating-rate debt feel it most, so this bounce should be read together with next week's CPI.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-november-6-dow-sp-500-nasdaq-jobs-report-earnings-135953863.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週五 +0.89%"}, {"t": "IJR", "n": "標普小型股 600 ETF，品質篩選較嚴"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "太空與核能題材", "color": "#5B8ED6", "zh": "週五的熱門漲幅榜上有 Firefly Aerospace（FLY）約 +35%、Oklo（OKLO）約 +22%、Rocket Lab（RKLB）約 +16%。這份名單來自單一來源的快照，時間點不明確，我也沒有查到各自的催化劑，所以只能說：在大型 AI 股重挫的一天，太空與核能這類小型題材股走出了相反的方向。這類股票通常波動極大，單日漲幅不代表趨勢。", "en": "Friday's trending gainers included Firefly Aerospace (FLY) up about 35%, Oklo (OKLO) up about 22% and Rocket Lab (RKLB) up about 16%. The list is a single-source snapshot with unclear timing, and I did not find each company's catalyst, so all I can say is that on a day of heavy selling in large AI stocks, small space and nuclear names moved the other way. These stocks are extremely volatile, and one day's gain is not a trend.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-november-6-dow-sp-500-nasdaq-jobs-report-earnings-135953863.html", "stocks": [{"t": "FLY", "n": "快照約 +35%，催化劑未查到"}, {"t": "OKLO", "n": "快照約 +22%，核能題材"}, {"t": "RKLB", "n": "快照約 +16%，太空題材"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "跌幅榜", "color": "#5B8ED6", "zh": "同一份快照的跌幅榜上有 DraftKings（DKNG）約 -21% 與 iRhythm（IRTC）約 -30%。DraftKings 是前一晚下調全年營收指引（63.5 億到 65.5 億美元）後的反應，前面的卡片提過；iRhythm 的原因我沒有查到，不猜。共通的提醒是：財報後的大跌，通常來自指引而不是當季數字，指引放在第一個看。", "en": "The same snapshot's decliners include DraftKings (DKNG) down about 21% and iRhythm (IRTC) down about 30%. DraftKings is the reaction to its cut of full-year revenue guidance (to $6.35 to $6.55 billion) the night before, covered in an earlier card; I did not find the reason for iRhythm and will not guess. The shared lesson: big post-earnings drops usually come from guidance, not the quarter's numbers, so read guidance first.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-november-6-dow-sp-500-nasdaq-jobs-report-earnings-135953863.html", "stocks": [{"t": "DKNG", "n": "全年營收指引下調後約 -21%"}, {"t": "IRTC", "n": "快照約 -30%，原因未查到"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "利率與小型股", "color": "#5B8ED6", "zh": "小型股判讀知識：羅素 2000 裡有相當比例的公司仍然虧損或槓桿偏高，所以對利率的反應比大型股明顯。週四它跌了約 4.45%，週五只回補 0.89%。看小型股不要只看指數漲跌，可以對照價值型（IWN）與成長型（IWO）：升息預期上升的日子，兩者的差距常常能看出市場是在擔心利息成本，還是擔心成長故事。", "en": "A small-cap reading note: a meaningful share of Russell 2000 companies are still unprofitable or highly levered, so they react to rates more than large caps. It fell about 4.45% on Thursday and recovered only 0.89% on Friday. Do not look only at the index; compare value (IWN) with growth (IWO): on days when hike expectations rise, the gap often shows whether the market worries about interest costs or about the growth story.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-november-6-dow-sp-500-nasdaq-jobs-report-earnings-135953863.html", "stocks": [{"t": "IWN", "n": "羅素 2000 價值型 ETF"}, {"t": "IWO", "n": "羅素 2000 成長型 ETF"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "恐慌日的流動性", "color": "#5B8ED6", "zh": "小型股判讀知識：市場恐慌的日子，小型股的買賣價差會放大、成交量集中在尾盤，所以單日收盤價不一定能代表實際成交得到的價位。ETF 的價格也可能和淨值出現小幅折溢價。實務上的做法是：在波動大的日子不追單日漲跌，改看一週或一個月的趨勢，並確認自己關心的個股平均日成交金額夠不夠大。", "en": "A small-cap reading note: on panic days, bid-ask spreads on small caps widen and volume bunches into the close, so a daily closing price does not always reflect what you could actually trade at. ETF prices can also trade at small premiums or discounts to net asset value. In practice, do not chase one-day moves on volatile days; look at weekly or monthly trends, and check that a stock you care about trades enough dollars a day.", "url": "https://www.kiplinger.com/investing/stocks/nasdaq-adds-264-points-in-tech-rebound-but-ends-the-week-lower-stock-market-today", "stocks": [{"t": "VB", "n": "Vanguard 小型股 ETF，另一個小型股基準"}, {"t": "IJR", "n": "標普小型股 600 ETF"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "BW 財報前", "color": "#C9A227", "zh": "Babcock & Wilcox（BW）做鍋爐與發電設備，池內記錄市值約 3.2 億美元。被忽視的原因是仍在虧損、資料中心電力題材被大型股蓋過。正在改變的：8 月與 Siemens Energy 簽約製造 20 組蒸汽渦輪發電機（對應 1GW），執行長與董事在 8 月以約 9.5 到 9.65 美元買進。風險很大：11/2 的報導說股價約 4.27 美元，較高點跌約 64%，預期第三季營收比第二季的 3.197 億美元少約三分之一，積壓訂單從 28 億降到 26 億美元。財報 11/9 盤後公布。以上是研究線索，不是投資建議。", "en": "Babcock & Wilcox (BW) makes boilers and power equipment, with a pool-recorded market cap of about $320 million. It is ignored because it still loses money and its data-center power theme is overshadowed by large caps. What is changing: in August it signed with Siemens Energy to build 20 steam turbine generators (about 1GW), and the CEO and a director bought at about $9.50 to $9.65. The risk is large: a Nov 2 report puts the stock near $4.27, about 64% below its high, expects Q3 revenue to fall roughly a third from Q2's $319.7 million, and backlog slipped from $2.8 billion to $2.6 billion. It reports Nov 9 after the close. This is a research lead, not investment advice.", "url": "https://finviz.com/news/413760/babcock-wilcox-must-prove-its-backlog-boom-is-real-after-a-64-stock-collapse", "stocks": [{"t": "BW", "n": "11/9 盤後財報，股價約 4.27 美元，積壓訂單 26 億美元"}], "status": "RADAR · 下一個驗證點 11/9 盤後 Q3：新訂單與積壓訂單"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "TH 資料中心宿舍", "color": "#C9A227", "zh": "Target Hospitality（TH）提供偏遠工地的模組化宿舍與餐飲後勤，聽起來像旅館、財報像租賃、客戶像工程公司，所以沒有乾淨的同業可比。正在改變的是客戶從油氣田轉向資料中心：與前五大超大規模業者簽下德州北部資料中心合約，最低承諾營收超過 5.5 億美元，約五年到 2031 年第一季。11/2 的財報預覽預期第三季營收約 1.202 億美元（去年同期 9,940 萬）、每股持平，資本支出指引拉高到 4.9 億至 5.1 億美元。風險：9 月私募股東以 18.50 美元出脫 1,400 萬股，營收集中在少數合約。預覽稿沒有載明財報日。以上是研究線索，不是投資建議。", "en": "Target Hospitality (TH) provides modular lodging and catering for remote work sites; it sounds like a hotel, reports like a lessor and has customers like a contractor, so it has no clean peers. What is changing is the customer base moving from oil fields to data centers: it signed a North Texas data-center hub contract with a top-five hyperscaler with over $550 million of committed minimum revenue over about five years through Q1 2031. A Nov 2 preview expects Q3 revenue of about $120.2 million (vs $99.4 million a year ago) and breakeven EPS, with capex guidance raised to $490 to $510 million. Risks: private holders sold 14 million shares at $18.50 in September, and revenue is concentrated in a few contracts. The preview did not state the report date. This is a research lead, not investment advice.", "url": "https://finviz.com/news/413668/target-hospitality-must-show-its-data-center-ramp-is-reaching-the-income-statement", "stocks": [{"t": "TH", "n": "資料中心合約最低承諾營收逾 5.5 億美元，資本支出指引 4.9 億至 5.1 億美元"}], "status": "RADAR · 下一個驗證點 Q3 財報（日期未載明）：新合約是否進入損益表"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "VYLR 分拆", "color": "#C9A227", "zh": "Vylor（VYLR）是 Corteva 在 10/1 分拆出來的種子與基因公司，在 NYSE 獨立交易。被忽視的原因：新公司沒有獨立的分析師模型與歷史股價，分拆股常因母公司股東被動賣出而出現短期賣壓。正在改變：種子事業第一次有獨立估值，有報導說它 2025 年營收約 100 億美元、EBITDA 約 30 億美元。風險：部分州政府週四對 Corteva 與 Vylor 提告，主張分拆是為了規避環境污染（永久化學物質）的歷史負債；農業景氣也在下行。首份財報 11/11 收盤後公布，法說會 11/12 早上 9 點。以上是研究線索，不是投資建議。", "en": "Vylor (VYLR) is the seed and genetics company Corteva spun off on Oct 1 and now trades independently on the NYSE. It is ignored because a new company has no standalone analyst models or price history, and spin-offs often see short-term selling from parent holders. What is changing: the seed business gets its own valuation for the first time, with one report citing about $10 billion of 2025 revenue and about $3 billion of EBITDA. Risks: a group of states sued Corteva and Vylor on Thursday, alleging the spin-off was meant to avoid legacy liabilities tied to forever chemicals, and the farm cycle is weakening. Its first earnings come after the close on Nov 11, with a call on Nov 12 at 9:00 a.m. This is a research lead, not investment advice.", "url": "https://finviz.com/news/397609/vylor-completes-spin-launches-as-a-standalone-advanced-seed-and-genetics-market-leader", "stocks": [{"t": "VYLR", "n": "首份財報 11/11 盤後，州政府提告是新增風險"}], "status": "RADAR · 下一個驗證點 11/11 盤後首份財報與訴訟進展"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "LTRX 財報前", "color": "#C9A227", "zh": "Lantronix（LTRX）做工業物聯網與無人系統模組，市值約 1.3 億美元的微型股，過去有股權稀釋、本益比為負。正在改變：無人系統業務 FY2026 營收 1,260 萬美元，管理層預期 FY2027 約 2,500 萬美元以上；財年末現金 6,000 萬美元、無負債；董事在 9 月買進 1.5 萬股。財報 11/9（週一）盤後公布，電話會議美東 4:30 p.m.；公司指引每股盈餘 0.04 到 0.06 美元，MarketBeat 彙整的預期是 0.04 美元、營收約 3,198 萬美元。上一季公司以 0.04 對 0.03 的預期與營收 3,115 萬對 3,069 萬雙雙超預期。以上是研究線索，不是投資建議。", "en": "Lantronix (LTRX) makes industrial IoT and unmanned-systems modules; it is a micro cap of about $130 million with a history of dilution and negative earnings. What is changing: unmanned-systems revenue was $12.6 million in FY2026 and management expects about $25 million or more in FY2027; it ended the year with $60 million in cash and no debt; a director bought 15,000 shares in September. It reports Monday Nov 9 after the close with a call at 4:30 p.m. ET; company guidance is EPS of $0.04 to $0.06, and the MarketBeat consensus is $0.04 on revenue of about $31.98 million. Last quarter it beat on both, with EPS of $0.04 vs $0.03 and revenue of $31.15 million vs $30.69 million. This is a research lead, not investment advice.", "url": "https://finviz.com/news/406284/lantronix-to-report-fiscal-2027-first-quarter-results-on-nov-9-2026", "stocks": [{"t": "LTRX", "n": "11/9 盤後，預期每股 0.04 美元、營收約 3,198 萬美元"}], "status": "RADAR · 下一個驗證點 11/9 盤後 FY2027 Q1"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "AIRG 財報前", "color": "#C9A227", "zh": "Airgain（AIRG）做無線天線與數據機模組，小型、現金少、長期虧損，營收曾連續多季下滑。正在改變：Q2 營收 1,370 萬美元，季增 19%、年增 0.7%，是六季來首次年增，營收超過分析師預期的 1,345 萬；Q3 營收指引 1,425 萬到 1,625 萬美元、非 GAAP 每股盈餘約 0.04 美元，當時分析師預期較低（每股 0.02、營收 1,490 萬）。風險：6/30 現金只有 760 萬美元、Q3 毛利率指引下調到 41.5% 到 44.5%，消費型業務受供給限制。財報預定 11/10 前後（日期以公司公告為準）。以上是研究線索，不是投資建議。", "en": "Airgain (AIRG) makes wireless antennas and modem modules; it is small, thinly funded and has lost money for years, with revenue falling for several quarters. What is changing: Q2 revenue was $13.7 million, up 19% on the quarter and 0.7% on the year, the first year-on-year gain in six quarters and above the $13.45 million analysts expected; Q3 guidance is revenue of $14.25 to $16.25 million and non-GAAP EPS of about $0.04, when analysts were lower (EPS $0.02, revenue $14.9 million). Risks: cash was only $7.6 million at 6/30, Q3 gross margin guidance was cut to 41.5% to 44.5%, and the consumer business faces supply constraints. The report is expected around Nov 10 (check the company announcement). This is a research lead, not investment advice.", "url": "https://www.marketbeat.com/instant-alerts/airgain-nasdaqairg-issues-q3-2026-earnings-guidance-2026-08-05/", "stocks": [{"t": "AIRG", "n": "Q3 營收指引 1,425 萬到 1,625 萬美元，六季來首次年增"}], "status": "RADAR · 下一個驗證點 11/10 前後 Q3 財報"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "AVR 心臟瓣膜", "color": "#C9A227", "zh": "Anteris Technologies（AVR）開發經導管主動脈瓣膜 DurAVR，澳洲與那斯達克雙掛牌、尚未商業化，被當成純研發股，沒有人把策略投資人的動作拆開看。正在改變：1 月美敦力策略投資 9,000 萬美元（連同公開發行共募約 3.2 億美元）；PARADIGM 關鍵性試驗（約 1,000 人）從 5 月起在美國收案；10% 以上股東 L1 Capital 在 10/1 買進 32.3 萬股、約 245 萬美元。風險：沒有營收，Q1 現金流出約 2,870 萬美元，成敗取決於試驗結果與後續融資稀釋，近六個月也有 13 筆賣出紀錄。以上是研究線索，不是投資建議。", "en": "Anteris Technologies (AVR) is developing DurAVR, a transcatheter aortic valve; it is dual-listed in Australia and on Nasdaq, pre-commercial, and treated as a pure R&D stock, with nobody unpacking the strategic investors' moves. What is changing: Medtronic made a $90 million strategic investment in January (about $320 million raised including a public offering); the PARADIGM pivotal trial (about 1,000 patients) has enrolled in the US since May; and 10% holder L1 Capital bought 322,940 shares, about $2.45 million, on Oct 1. Risks: no revenue, Q1 cash outflow of about $28.7 million, results depend on trial outcomes and dilution from later financing, and there were also 13 sales in the past six months. This is a research lead, not investment advice.", "url": "https://www.stocktitan.net/sec-filings/AVR/10-q-anteris-technologies-global-corp-quarterly-earnings-report-afac191ff80b.html", "stocks": [{"t": "AVR", "n": "美敦力投資 9,000 萬美元，PARADIGM 試驗收案中"}], "status": "RADAR · 下一個驗證點 Q3 財報與 PARADIGM 入組進度"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "Embecta 四人同買", "color": "#6DB56D", "zh": "Embecta（EMBC）是從 BD 分拆出來的胰島素筆針與針筒公司，股價約 5 美元、分析師共識偏減碼、還有證券訴訟。池內記錄的內部人動作：8/12 四位內部人同日自費買進，執行長 Kurdikar 3 萬股（均價 4.70 美元）、財務長 2 萬股、Mann 2 萬股、董事 Hombach 4.5 萬股，12 個月只買不賣。要注意這是三個月前的申報，不是新的，而且買進金額都不大；風險包括糖尿病護理競爭、負債與訴訟。財報預計在 11 月下旬（去年是 11/25）。", "en": "Embecta (EMBC) is the insulin pen-needle and syringe company spun off from BD, with a stock near $5, a cautious analyst consensus and a securities lawsuit. The pool's record of insider action: on Aug 12 four insiders bought with their own money on the same day, CEO Kurdikar 30,000 shares (average $4.70), the CFO 20,000, Mann 20,000 and director Hombach 45,000, with only buys and no sales over 12 months. Note these filings are three months old, not new, and the amounts are modest; risks include diabetes-care competition, debt and litigation. Earnings are expected in late November (last year Nov 25).", "url": "https://www.marketbeat.com/instant-alerts/jeffrey-mann-purchases-20000-shares-of-embecta-nasdaqembc-stock-2026-08-13/", "stocks": [{"t": "EMBC", "n": "8/12 四位內部人同日買進，12 個月只買不賣"}]},
  {"id": "insider_1", "channel": "內部人動向", "tag": "Enovis 執行長買進", "color": "#6DB56D", "zh": "Enovis（ENOV）做骨科與復健器材，股價今年多在 20 美元上下、6 月接近近 12 個月低點，財報優於預期仍未被獎勵。池內記錄：執行長 McDonald 在 9 月買進 13,035 股（約 24.96 萬美元），行政長 Engert 自 2 月起多次買進、9 月再買約 7,598 股，各來源的股數有出入，以 Form 4 為準。反方論點：分析師目標價共識約 44.5 美元，覆蓋並不稀少，醫材需求與利率環境壓抑估值。這是 9 月的申報，不是本週的新消息。", "en": "Enovis (ENOV) makes orthopedic and rehab devices; the stock has mostly traded around $20 this year, near its 12-month low in June, and better-than-expected results have not been rewarded. The pool's record: CEO McDonald bought 13,035 shares (about $249,600) in September, and executive Engert has bought repeatedly since February, adding about 7,598 shares in September; sources differ on share counts, so rely on Form 4. Counterpoint: the analyst target consensus is about $44.50, so coverage is not thin, and device demand and rates weigh on valuation. These are September filings, not news from this week.", "url": "https://www.insidertrades.com/alerts/nyse-enov-insider-buying-and-selling-2026-09-05/", "stocks": [{"t": "ENOV", "n": "執行長 9 月買進 13,035 股，約 24.96 萬美元"}]},
  {"id": "insider_2", "channel": "內部人動向", "tag": "買進要看時間與金額", "color": "#6DB56D", "zh": "判讀提醒：常見的叢集買進定義是 30 天內三位以上內部人買進，或 7 天內兩位以上。但買進的時間距離與金額更重要。例如 E.W. Scripps（SSP）的執行長與多位董事從 3 月起連續買進，但近季每股虧損 0.06 美元，遠差於預期獲利，債務也重；Euroseas（ESEA）的董事買進只有 500 股與 1,050 股，金額很小。小額買進或例行計畫都可能只是個人流動性，不要把「有人買」直接當成「該買」。", "en": "A reading note: a common definition of a cluster buy is three or more insiders within 30 days, or two or more within 7 days. But timing and size matter more. For example, E.W. Scripps (SSP) saw its CEO and several directors buy repeatedly from March, yet the latest quarter showed a loss of $0.06 per share against an expected profit, and debt is heavy; at Euroseas (ESEA) a director bought only 500 and 1,050 shares, very small amounts. Small buys or routine plans can reflect personal liquidity, so do not read someone bought as you should buy.", "url": "https://www.insidertrades.com/alerts/nasdaq-ssp-insider-buying-and-selling-2026-03-06", "stocks": [{"t": "SSP", "n": "3 月起連續買進，近季每股虧損 0.06 美元"}, {"t": "ESEA", "n": "董事買進僅 500 股與 1,050 股"}]},
  {"id": "capitol_0", "channel": "政要持股", "tag": "最新申報", "color": "#B5654D", "zh": "眾議員 Josh Gottheimer（NJ-05）在 11/5 又有申報。依眾議院書記官 PTR 索引整理，他過去 90 天共有 22 筆交易（14 買、8 賣），金額區間合計約 151.8 萬到 327 萬美元，出現最多的是微軟（MSFT）與應用材料（AMAT）。這只代表他申報了什麼，這些交易發生在最多 45 天以前，不能用來解讀今天的市場，也不代表任何意圖。應用材料預定 11/12 盤後公布財報。", "en": "Rep. Josh Gottheimer (NJ-05) filed again on Nov 5. Based on the House Clerk's PTR index, he reported 22 transactions in the past 90 days (14 buys, 8 sells), with combined amount ranges of about $1.518 million to $3.27 million, with Microsoft (MSFT) and Applied Materials (AMAT) the most frequent. This only shows what he reported; the trades happened up to 45 days ago, so they cannot be used to read today's market, and imply nothing about intent. Applied Materials is scheduled to report on Nov 12 after the close.", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure", "stocks": [{"t": "MSFT", "n": "申報中出現次數最多的個股之一"}, {"t": "AMAT", "n": "申報中出現次數最多的個股之一，11/12 盤後財報"}]},
  {"id": "capitol_1", "channel": "政要持股", "tag": "判讀限制", "color": "#B5654D", "zh": "判讀國會申報的限制：議員有最多 45 天可以申報，所以申報時的價位可能已是一個半月前；金額只有寬區間，沒有精確數字；很多交易由配偶或信託帳戶執行，申報也不會告訴你是誰決定的；選擇權要看履約價與到期日才有資訊。在週四這樣的急跌之後，不要把一個月前的申報當成今天的證據，更不要把它當成跟單訊號。", "en": "Reading congressional filings has limits: members have up to 45 days to file, so the price at disclosure may be a month and a half old; amounts come as wide ranges, not exact figures; many trades run through spouse or trust accounts, and filings do not reveal who decided; and options only carry information once you see strike and expiry. After a sharp drop like Thursday's, do not treat a month-old filing as evidence about today, and never as a copy-trading signal.", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure", "stocks": [{"t": "NANC", "n": "追蹤民主黨議員持股的 ETF"}, {"t": "GOP", "n": "追蹤共和黨議員持股的 ETF"}]},
  {"id": "week_0", "channel": "本週事件", "tag": "CPI 與假日", "color": "#C97DD4", "zh": "下週的總經重點是 10 月 CPI（預定 11/10，週二）與 PPI，11/11 是退伍軍人節。9 月核心 CPI 年增 2.6%（高於預期的 2.5%），10 月的市場共識我沒有查到，不列數字。這次 CPI 的重要性比平常高：就業數字已讓 12 月升息的預期升溫，如果通膨也偏高，升息預期可能再提高。數字公布後 30 分鐘內的價格通常最亂，那不是結論。", "en": "Next week's macro focus is October CPI (scheduled Nov 10, Tuesday) and PPI, with Nov 11 Veterans Day. September core CPI rose 2.6% year over year (above the 2.5% forecast); I did not find a consensus for October and list no figure. This CPI matters more than usual: the jobs data has already raised December hike expectations, and if inflation is also high, those expectations could rise further. Prices in the first 30 minutes after release are usually the messiest and are not the conclusion.", "url": "https://thriveinmarkets.com/calendar/2026-11-09/", "stocks": [{"t": "TIP", "n": "抗通膨債券 ETF，通膨預期的指標"}, {"t": "TLT", "n": "長天期美債 ETF，CPI 後的第一個反應"}]},
