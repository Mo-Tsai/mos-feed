/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

  {"id": "earn_1", "channel": "財報速報", "tag": "Meta 與 Lam", "color": "#E8786A", "zh": "本週最大的財報衝擊是 Meta：公司把 2026 年資本支出下限拉到 1,350 億美元，股價單日重摔約 7%，隔天再跌約 1%。Lam Research 的財報同樣讓投資人失望，兩者一起把週四的那斯達克拖到 6 月以來最大跌幅。教訓不在單一公司，而在市場開始要求 AI 支出要有看得見的回報，這個標準將在下週微軟、Alphabet、亞馬遜身上再測一次。", "en": "The biggest earnings shock of the week was Meta: it lifted its 2026 capital expenditure floor to $135 billion, the stock dropped about 7% in one session and slipped another 1% the next day. Lam Research also disappointed, and together they dragged the Nasdaq to its biggest one-day fall since June. The lesson is less about one company than about the market demanding visible returns on AI spending, a test that Microsoft, Alphabet and Amazon face next week.", "url": "https://www.cnbc.com/2026/10/22/meta-stock-q3-earnings-free-cash-flow.html", "stocks": [{"t": "META", "n": "Meta，資本支出下限 1,350 億美元，股價約 -7%"}, {"t": "LRCX", "n": "Lam Research，財報令人失望"}, {"t": "NVDA", "n": "輝達，AI 資本支出鏈的指標"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "聯準會", "color": "#7C6AF7", "zh": "聯準會 10 月 28 日（週三）公布決策，利率目前在 3.75% 至 4.00%，9 月才剛升息。利率期貨顯示本次再升息的機率約 5%，12 月升息的機率約 80%（各家定價不一）。華許（Kevin Warsh）主席的記者會是焦點，威廉斯等官員已表態不傾向連續升息，節奏約每季一次。決策日離 11 月 3 日期中選舉不到一週，是另一個變數。", "en": "The Fed announces its decision Wednesday, Oct. 28, with rates at 3.75% to 4.00% after a September hike. Futures imply about a 5% chance of another hike this week and roughly an 80% chance in December, though pricing varies by source. Chair Kevin Warsh's press conference is the focus; Williams and others have pushed back on back-to-back hikes, suggesting about one per quarter. The meeting falls less than a week before the Nov. 3 midterm elections.", "url": "https://finwire.io/news/stock-markets-news/wall-streets-week-ahead-earnings-flood-fed-meeting-pose-pivotal-tests-for-rickety-ai-market-rally", "stocks": [{"t": "TLT", "n": "長天期美債 ETF，對利率路徑最敏感"}, {"t": "UUP", "n": "美元指數 ETF，鷹派持平的受惠方向"}, {"t": "SHY", "n": "短天期美債 ETF，反映 12 月升息定價"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "全球央行週", "color": "#7C6AF7", "zh": "不只聯準會：加拿大央行週三被預期升息 25 個基點（機率約 80%，但 9 月失業率升到 6.5%、CPI 低於預期）；紐西蘭央行週三升息也幾乎被完全定價，不過第三季 CPI 從 4.1% 降到 3.7%，指引有偏鴿風險。歐洲央行週四預期按兵不動，焦點是拉加德對 12 月的暗示；日本央行週五預期維持，12 月升息在討論範圍內。多國同時在升息邊緣，是這一週美元與債市的共同背景。", "en": "It is not only the Fed: the Bank of Canada is expected to hike 25 bps on Wednesday (about 80% odds, despite unemployment rising to 6.5% and a soft CPI), and a Reserve Bank of New Zealand hike is nearly fully priced, though Q3 CPI eased from 4.1% to 3.7%, leaving dovish-guidance risk. The ECB is expected to hold Thursday with focus on Lagarde's December hints, and the Bank of Japan is expected to hold Friday with a December hike on the table. Several central banks sitting at the edge of hikes is the shared backdrop for the dollar and bonds.", "url": "https://www.fxstreet.com/analysis/week-ahead-central-bank-and-earnings-bonanza-could-roil-markets-202610230935", "stocks": [{"t": "FXE", "n": "歐元 ETF，歐洲央行週四決策"}, {"t": "FXY", "n": "日圓 ETF，日本央行週五記者會"}, {"t": "FXC", "n": "加幣 ETF，加拿大央行週三決策"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "PCE 與 GDP", "color": "#7C6AF7", "zh": "週四（10/29）同時公布第三季 GDP 初值與 9 月 PCE：核心 PCE 預期年增 3.1%，GDP 預期年增 3.2%（年化）；另有報導把整體通膨預期放在 3.6% 到 3.7%，不同來源口徑不同。這兩份數據在聯準會決策後一天公布，若通膨高於預期，等於替 12 月升息加碼。同週還有 2、5、7 年期公債標售，需求偏弱會直接推升殖利率。", "en": "Thursday (Oct. 29) brings advance Q3 GDP and September PCE together: core PCE is expected up 3.1% year on year and GDP up 3.2% annualized, while another outlet puts headline inflation at 3.6% to 3.7%, so sources differ on the measure. Arriving a day after the Fed decision, a hot print would add weight to a December hike. The week also includes 2-, 5- and 7-year Treasury auctions, where weak demand would push yields higher.", "url": "https://www.fxstreet.com/analysis/week-ahead-central-bank-and-earnings-bonanza-could-roil-markets-202610230935", "stocks": [{"t": "TIP", "n": "抗通膨債券 ETF，通膨數據的直接對照"}, {"t": "IEF", "n": "7 至 10 年期美債 ETF，標售與殖利率反應"}, {"t": "XLU", "n": "公用事業類股 ETF，利率敏感的防禦板塊"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "資安逆勢", "color": "#4EABA4", "zh": "週五資安類股在大盤走弱時逆勢上漲：SailPoint、Cloudflare、Palo Alto Networks 各漲超過 7%，Yahoo 財經引述 Evercore ISI 的調查，指出企業資安預算展望轉強。這張卡的重點是訊號來源：一份券商調查而非公司財報，單日反應可能過度，要看之後的財報與指引是否印證。", "en": "Cybersecurity stocks rose against a weak tape on Friday: SailPoint, Cloudflare and Palo Alto Networks each gained more than 7%, with Yahoo Finance citing an Evercore ISI survey pointing to stronger enterprise security budgets. The signal is a brokerage survey rather than company results, so the one-day reaction may be exaggerated and needs confirmation from upcoming earnings and guidance.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-23-dow-sp-500-nasdaq-tesla-meta-093000521.html", "stocks": [{"t": "PANW", "n": "Palo Alto Networks，漲逾 7%"}, {"t": "NET", "n": "Cloudflare，漲逾 7%"}, {"t": "SAIL", "n": "SailPoint，漲逾 7%，身分安全"}, {"t": "CRWD", "n": "CrowdStrike，資安同業對照"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "能源與航空", "color": "#4EABA4", "zh": "布蘭特站上 116.72 美元的同時，航空股明顯走弱：聯合、達美、美國航空因燃油成本上升下跌；能源類股則是這波行情的直接受惠板塊。油價對板塊的影響是同一個數字的兩面，下週艾克森美孚與雪佛龍財報，會是檢驗能源獲利是否真的跟上油價的時刻。", "en": "With Brent at $116.72, airlines weakened sharply: United, Delta and American fell on higher fuel costs, while energy stocks were the direct beneficiaries. The oil move is two sides of one number. Exxon and Chevron report next week, which will show whether energy earnings are really keeping pace with crude.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-23-dow-sp-500-nasdaq-tesla-meta-093000521.html", "stocks": [{"t": "UAL", "n": "聯合航空，燃油成本上升走弱"}, {"t": "DAL", "n": "達美航空，同上"}, {"t": "XOM", "n": "艾克森美孚，下週財報"}, {"t": "CVX", "n": "雪佛龍，下週財報"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "兩日對照", "color": "#5B8ED6", "zh": "羅素 2000 週四上漲 0.11% 至 2,784.03，週五下跌 0.29% 至 2,775.90，兩天累計約 -0.18%，同期那斯達克與道瓊各自經歷更大的單日跌幅。小型股沒有直接暴露在 AI 資本支出的疑慮裡，但對利率與融資成本更敏感，所以週五殖利率貼近 5% 時一樣受壓。", "en": "The Russell 2000 rose 0.11% to 2,784.03 on Thursday and fell 0.29% to 2,775.90 on Friday, about -0.18% over two days, while the Nasdaq and Dow each suffered larger single-day drops. Small caps are less exposed to AI-capex doubts but more sensitive to rates and financing costs, so they still slipped when yields neared 5%.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-23-dow-sp-500-nasdaq-tesla-meta-093000521.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，兩日約 -0.18%"}, {"t": "IJR", "n": "標普小型 600 ETF，品質較高的小型股對照"}, {"t": "QQQ", "n": "那斯達克 100 ETF，大型成長股對照"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "判讀知識", "color": "#5B8ED6", "zh": "小型股對利率更敏感有兩個結構原因：第一，羅素 2000 成分公司負債中浮動利率比重較高，十年期殖利率貼近 5% 時，利息費用會更快侵蝕獲利；第二，小型股中銀行占比大，淨息差、存款成本與商用不動產風險都會被放大檢視。所以聯準會 12 月是否再升息，對小型股的影響通常比對大型股直接。這是判讀框架，不是預測。", "en": "Small caps are more rate-sensitive for two structural reasons: first, Russell 2000 companies carry more floating-rate debt, so a 10-year yield near 5% eats into earnings faster; second, banks make up a large share of the index, putting net interest margins, deposit costs and commercial real estate risk under the microscope. A December Fed hike therefore tends to matter more directly for small caps. This is an interpretive framework, not a forecast.", "url": "https://www.nasdaq.com/articles/vanguard-russell-2000-etf-insider-buying-index-registering-11.0", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，利率敏感度的代表"}, {"t": "KRE", "n": "區域銀行 ETF，淨息差與存款成本的指標"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "下週中小型財報", "color": "#5B8ED6", "zh": "下週財報名單中有幾個中小型代表：SoFi（SOFI，金融科技）、Enphase Energy（ENPH，太陽能微型逆變器）、Twilio（TWLO，通訊雲端）、EQT（EQT，天然氣）。這些公司對利率與融資成本的敏感度各不相同，財報前後的波動通常比大型股更大；這張卡只是日程提醒，具體日期要以公司公告為準。", "en": "Several small and mid-cap names report next week: SoFi (fintech), Enphase Energy (solar microinverters), Twilio (communications cloud) and EQT (natural gas). Their sensitivity to rates and financing costs differs, and moves around earnings are usually larger than for mega caps. This is a calendar reminder only; confirm dates with company announcements.", "url": "https://www.schaeffersresearch.com/content/news/2026/10/22/the-week-ahead-wall-street-awaits-october-fed-decision", "stocks": [{"t": "SOFI", "n": "SoFi，下週財報，對利率敏感的金融科技"}, {"t": "ENPH", "n": "Enphase，下週財報，太陽能"}, {"t": "TWLO", "n": "Twilio，下週財報，通訊雲端"}, {"t": "EQT", "n": "EQT，下週財報，天然氣"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "Bank of Marin", "color": "#C9A227", "zh": "這家公司做什麼：加州北灣（Marin County）的社區銀行，服務當地中小企業與屋主。為什麼被忽視：市值不到 5 億美元，幾乎沒有大型券商追蹤，只在「便宜小型銀行」篩選裡偶爾出現。什麼正在改變：9 月內部人 Gary Strong 買進 2,000 股、約 6.5 萬美元，個人持股一口氣增加 16%；公司已確認 10/26（週一）召開第三季電話會議。風險：單一內部人買進的統計意義有限，加州商用不動產曝險要逐筆檢查，升息定價反轉也會壓淨息差。這是研究線索，不是投資建議。", "en": "What it does: a community bank in Marin County, north of San Francisco, serving local small businesses and homeowners. Why it is overlooked: market cap under $500 million with almost no major broker coverage. What is changing: in September insider Gary Strong bought 2,000 shares (about $65,000), raising his holding 16%; the company has confirmed its Q3 call for Monday, Oct. 26. Risks: one insider buy has limited statistical weight, California commercial real estate exposure needs line-by-line checking, and rate repricing can squeeze margins. This is a research lead, not investment advice.", "url": "https://www.investing.com/news/company-news/bank-of-marin-q2-2026-slides-margin-expands-earnings-beat-93CH-4814774", "stocks": [{"t": "BMRC", "n": "Bank of Marin，10/26 電話會議，內部人買進使持股 +16%"}, {"t": "KRE", "n": "區域銀行 ETF，同業對照"}], "status": "RADAR · 下一個驗證點 10/26 Q3 電話會議"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "Alerus", "color": "#C9A227", "zh": "這家公司做什麼：北達科他與明尼蘇達的社區銀行，另有退休金計畫管理與財富管理的手續費業務，約一半獲利來自手續費。為什麼被忽視：市值小，追蹤券商只有少數幾家，又不符合純社區銀行的分類。什麼正在改變：董事會通過 125 萬股庫藏股授權並已實際買回，季配息調到每股 0.22 美元，管理層給出可驗證的全年指引。風險：9 月提交的 2 億美元儲架註冊隨時可能增資，與庫藏股是相反訊號。這是研究線索，不是投資建議。", "en": "What it does: a community bank in North Dakota and Minnesota with retirement-plan administration and wealth management, where about half of earnings are fee-based. Why it is overlooked: small market cap, only a handful of covering brokers, and it does not fit the pure community-bank label. What is changing: the board authorized a 1.25 million share buyback that is already being executed, the quarterly dividend moved to $0.22, and management gave verifiable full-year guidance. Risk: a $200 million shelf registration filed in September could mean an equity raise, the opposite signal to buybacks. This is a research lead, not investment advice.", "url": "https://www.investing.com/news/transcripts/earnings-call-transcript-alerus-financial-q1-2026-beats-estimates-stock-up-93CH-4650781", "stocks": [{"t": "ALRS", "n": "Alerus Financial，庫藏股與手續費業務，約 10/29 財報"}, {"t": "KRE", "n": "區域銀行 ETF，同業對照"}], "status": "RADAR · 下一個驗證點 約 10/29 Q3 財報（日期待公司確認）"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "Lantronix", "color": "#C9A227", "zh": "這家公司做什麼：工業物聯網與無人系統模組（Spotter、Open-Q 8550CS）。為什麼被忽視：市值約 1.3 億美元的微型股，過去有股權稀釋、本益比為負。什麼正在改變：無人系統業務 FY2026 營收 1,260 萬美元，管理層預期 FY2027 約 2,500 萬美元以上，占營收 15% 至 20%；財年末現金 6,000 萬美元、無負債；董事 Saleel Awsare 9 月買進 15,000 股約 7.77 萬美元。風險：規模極小、稀釋歷史、無人機題材估值波動。這是研究線索，不是投資建議。", "en": "What it does: industrial IoT and unmanned-systems modules (Spotter, Open-Q 8550CS). Why it is overlooked: a micro cap of about $130 million with a history of dilution and negative earnings. What is changing: unmanned-systems revenue was $12.6 million in FY2026 and management expects about $25 million or more in FY2027, 15% to 20% of sales; year-end cash was $60 million with no debt; director Saleel Awsare bought 15,000 shares (about $77,700) in September. Risks: tiny scale, dilution history and volatile drone-theme valuations. This is a research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/tech/nasdaq-ltrx/lantronix", "stocks": [{"t": "LTRX", "n": "Lantronix，無人系統業務放量，董事買進"}], "status": "RADAR · 下一個驗證點 11 月上旬 FY2027 Q1 財報"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "MSG Rangers", "color": "#C9A227", "zh": "這家公司做什麼：由 MSG Sports 分拆出來的紐約遊騎兵（Rangers）業務，MSG Sports 將更名為 MSG Knickerbockers（MSGK）。為什麼被忽視：分拆案常有被動賣壓與覆蓋不足。什麼正在改變：登記日 10/20、每 2 股換 1 股，預發行交易預計 10/21、正式交易預計 10/27（週二）。風險：仍需 Form 10 生效、聯盟批准與稅務意見，另有控股家族的治理折價。這是研究線索，不是投資建議。", "en": "What it does: the New York Rangers business being spun off from MSG Sports, which will be renamed MSG Knickerbockers (MSGK). Why it is overlooked: spin-offs often face forced selling and thin coverage. What is changing: record date Oct. 20, one new share for every two, when-issued trading expected Oct. 21 and regular-way trading expected Oct. 27. Risks: it still needs Form 10 effectiveness, league approval and a tax opinion, plus a governance discount from family control. This is a research lead, not investment advice.", "url": "https://insidersport.com/2026/10/01/msg-to-split-knicks-and-rangers/", "stocks": [{"t": "MSGR", "n": "MSG Rangers，10/27 預計正式交易"}, {"t": "MSGS", "n": "MSG Sports，母公司，將更名 MSG Knickerbockers"}], "status": "RADAR · 下一個驗證點 10/27 預計正式交易"},
