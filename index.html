<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;
    --text-tertiary: #8a8680; --divider: #ddd9d1;
    --noise-opacity: 0.035;
  }
  [data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #6a6663; --divider: #2e2a24;
    --noise-opacity: 0.06;
  }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }
  .tab-nav button { background: none; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: Georgia, serif; transition: all 0.3s ease; padding: 0; line-height: 1.2; }
  .sub-pill { background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 0; transition: all 0.2s ease; border-bottom: 1px solid transparent; }
  .swipe-area { position: relative; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .card-slide { position: absolute; inset: 0; padding: 16px 32px 80px; display: flex; flex-direction: column; justify-content: flex-start; transition: transform 0.3s ease, opacity 0.3s ease; will-change: transform, opacity; overflow-y: auto; }
  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .source-link { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }
  .source-link:hover { color: var(--text-secondary); border-color: var(--text-secondary); }
  .end-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; height: 100%; }
  .end-btn { padding: 12px 28px; background: none; border: 1px solid var(--divider); color: var(--text-tertiary); font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; transition: all 0.25s ease; }
  .end-btn:hover { border-color: var(--text-secondary); color: var(--text-secondary); }
  .progress-bar { font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 0.14em; color: var(--text-tertiary); text-transform: uppercase; }
  .theme-toggle { position: fixed; top: 28px; right: 12px; z-index: 100; background: none; border: none; cursor: pointer; font-size: 13px; color: var(--text-tertiary); padding: 4px; line-height: 1; transition: color 0.3s ease; font-family: 'Courier New', monospace; }
  .theme-toggle:hover { color: var(--text-secondary); }
  .rule { height: 1px; background: var(--divider); }
  .running-header { font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-tertiary); }
  .word-popup { position: fixed; z-index: 200; background: var(--bg-elevated); border: 1px solid var(--divider); border-radius: 8px; padding: 12px 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); min-width: 120px; max-width: 260px; }
  .word-popup-word { font-family: Georgia, serif; font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .word-popup-trans { font-family: system-ui, -apple-system, 'PingFang TC', sans-serif; font-size: 14px; color: var(--text-secondary); line-height: 1.6; font-weight: 300; }
  .speak-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--text-tertiary); padding: 2px; transition: color 0.2s; line-height: 1; }
  .speak-btn:hover { color: var(--text-secondary); }
  .speak-btn.active { color: var(--text); }
  .clickable-word { cursor: pointer; border-radius: 2px; transition: background 0.15s; }
  .clickable-word:hover { background: var(--bg-elevated); }
  [data-theme="dark"] .word-popup { box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .az-input { width:100%; background:var(--bg); border:1px solid var(--divider); color:var(--text); padding:7px 10px; font-family:'Courier New',monospace; font-size:11px; outline:none; -webkit-appearance:none; appearance:none; border-radius:0; }
  .az-input:focus { border-color:var(--text-secondary); }
  .nav-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; padding:10px 24px 14px; background:var(--bg); border-top:1px solid var(--divider); z-index:50; }
  .nav-btn { background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:16px; cursor:pointer; padding:10px 22px; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; line-height:1; }
  .nav-btn:hover { border-color:var(--text-secondary); color:var(--text); }
  .nav-btn:active { background:var(--bg-elevated); }
  .nav-btn:disabled { opacity:0.25; cursor:default; border-color:var(--divider); color:var(--text-tertiary); }
  .nav-count { font-family:'Courier New',monospace; font-size:10px; letter-spacing:0.14em; color:var(--text-tertiary); text-transform:uppercase; }
</style>

const { useState, useMemo } = React;

// ===== AZURE TTS =====
let _azToken = null, _azTokenExp = 0, _azAbort = null;
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
function azureStop() { if (_azAbort) { _azAbort.abort(); _azAbort = null; } }
async function azureSpeak(text, { rate='0%', onStart, onEnd, onError }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const voice = localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural';
  if (!key) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const token = await _getAzToken(key, region, ctrl.signal);
    const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'><voice name='${voice}'><prosody rate='${rate}'>${_xmlEsc(text)}</prosody></voice></speak>`;
    const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method:'POST', signal:ctrl.signal,
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
      body:ssml
    });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (ctrl.signal.aborted) return true;
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    if (onError) onError(e);
    return false;
  }
}

const NAVAL_CARDS = [
  { id:"n1", channel:"Naval", tag:"財富", color:"#7C6AF7", url:"https://www.notion.so/3238ba4c063381a0ba28fb48effb0deb", en:"Every hour you sell, you lose twice. Once for the hour itself — and once for the leverage that hour could have built. Renting time is not income. It's a slow exit.", zh:"你每賣出一個小時，就輸了兩次：一次是那個小時本身，一次是那個小時原本能建立的槓桿。用時間換錢不叫收入，叫做慢慢離場。", ja:"一時間を売るたびに、二度負ける——その一時間そのものと、その一時間が本来生み出せたレバレッジだ。時間をお金に換えることは収入ではない。ゆっくりと退場しているだけだ。" },
  { id:"n2", channel:"Naval", tag:"槓桿", color:"#7C6AF7", url:"https://www.notion.so/3238ba4c063381a0ba28fb48effb0deb", en:"Code and media don't sleep. They don't ask for raises. They don't need to be convinced. Build something once — and let it work while you're not watching. This is the only leverage that requires no permission.", zh:"程式碼和媒體不需要睡覺，不會要求加薪，不需要被說服。做一次，然後讓它在你不看的時候繼續運轉。這是唯一不需要任何人許可的槓桿。", ja:"コードとメディアは眠らない。昇給を求めない。説得する必要もない。一度つくれば、あとは見ていなくても回り続ける。これが誰の許可も要らない唯一のレバレッジだ。" },
  { id:"n3", channel:"Naval", tag:"獨特知識", color:"#7C6AF7", url:"https://www.notion.so/3238ba4c063381a0ba28fb48effb0deb", en:"If your job can be described in a training manual, you can be replaced by someone cheaper — or eventually, by software. Specific knowledge isn't a skill you learn. It's something you discover by following what genuinely fascinates you, even when it makes no obvious financial sense.", zh:"如果你的工作可以被寫進教學手冊，你就可以被更便宜的人取代——或遲早被軟體取代。獨特知識不是你學來的技能，而是你在跟隨真正讓你著迷的事物時，自然發現的東西。", ja:"もし君の仕事がマニュアルに書けるなら、もっと安い人間に——やがてはソフトウェアに置き換えられる。独自の知識とは学んだスキルではない。本当に心を奪われるものを追いかける中で、自然と見つかるものだ。" },
  { id:"n4", channel:"Naval", tag:"幸福", color:"#7C6AF7", url:"https://www.notion.so/3238ba4c063381a0ba28fb48effb0deb", en:"Desire is borrowed unhappiness. Each one is a quiet announcement that you're not enough right now. The mind that is always reaching for the next thing never actually arrives anywhere. Happiness isn't achieved — it's what's left when you stop manufacturing reasons to be miserable.", zh:"欲望是預支的痛苦。每一個欲望都在悄悄宣告：你現在還不夠好。一個永遠在伸手抓下一件事的心，其實從未真正抵達任何地方。幸福不是追求來的——而是當你停止製造痛苦理由之後，剩下的東西。", ja:"欲望とは痛みの前借りだ。すべての欲望がひそかにこう宣言している——今の自分ではまだ足りない、と。次の何かに手を伸ばし続ける心は、実はどこにもたどり着いていない。幸福は追い求めるものではない——苦しみの理由をつくるのをやめたとき、そこに残るものだ。" },
  { id:"n5", channel:"Naval", tag:"長期賽局", color:"#7C6AF7", url:"https://www.notion.so/3238ba4c063381a0ba28fb48effb0deb", en:"Short-term thinkers optimize for the deal. Long-term thinkers optimize for the relationship. The compounding that matters most isn't financial — it's the trust built over years with people who are also playing for keeps.", zh:"短期思維的人為這筆交易而優化，長期思維的人為這段關係而優化。最重要的複利不是財務上的——而是多年來與同樣在認真玩長期遊戲的人，一點一點累積起來的信任。", ja:"短期思考の人はその取引を最適化し、長期思考の人はその関係を最適化する。最も重要な複利は財務的なものではない——長期のゲームを本気でプレイしている人たちと、何年もかけて少しずつ積み上げてきた信頼だ。" },
  { id:"n6", channel:"Naval", tag:"清晰思考", color:"#7C6AF7", url:"https://www.notion.so/3238ba4c063381a0ba28fb48effb0deb", en:"Your identity is the cage you can't see. Every strong opinion about who you are makes it harder to see who you could become. The clearest thinkers hold their self-concept loosely — willing to be wrong about themselves.", zh:"你的身份認同是你看不見的牢籠。每一個關於「我是這種人」的強烈想法，都讓你更難看清你可以成為什麼。想得最清楚的人，對自我概念的抓握都很輕——他們願意對自己也犯錯。", ja:"アイデンティティは目に見えない檻だ。「自分はこういう人間だ」という強い思い込みの一つひとつが、自分が何になれるかを見えなくしている。最も明晰に考える人たちは、自己概念を軽く握っている——自分についても間違えることを許せる人たちだ。" },
  { id:"n7", channel:"Naval", tag:"責任感", color:"#7C6AF7", url:"https://www.notion.so/3238ba4c063381a0ba28fb48effb0deb", en:"Put your name on your work. If you won't sign it, you probably shouldn't be doing it. The people who build real reputation take public accountability for outcomes — not just credit when things go well, but ownership when they don't.", zh:"把你的名字放在你的作品上。如果你不敢簽名，你可能就不該做這件事。真正建立名聲的人，對結果承擔公開責任——不只是在事情順利時領功，而是在事情不順時認下來。", ja:"自分の名前を作品に刻め。署名する勇気がないなら、それはやるべきことではないのかもしれない。本当に信用を築く人間は、結果に対して公に責任を負う——うまくいったときだけ手柄を取るのではなく、うまくいかなかったときにも引き受ける。" },
  { id:"n8", channel:"Naval", tag:"閱讀", color:"#7C6AF7", url:"https://www.notion.so/3238ba4c063381a0ba28fb48effb0deb", en:"Read to understand principles, not to collect facts. Physics, mathematics, philosophy, economics — these are the operating systems of the world. Everything else is just an app running on top of them.", zh:"閱讀是為了理解原則，不是為了收集事實。物理、數學、哲學、經濟學——這些是世界的作業系統，其他所有東西不過是跑在上面的應用程式。", ja:"読書は原理を理解するためにある。事実を集めるためではない。物理学、数学、哲学、経済学——これらは世界のOSだ。他のすべては、その上で動くアプリケーションに過ぎない。" },
  { id:"n9", channel:"Naval", tag:"退休", color:"#7C6AF7", url:"https://www.notion.so/3238ba4c063381a0ba28fb48effb0deb", en:"Retirement isn't an age or an account balance. It's the moment when what you do and what you love to do are the same thing. Most people never get there because they never stopped to ask what they actually want.", zh:"退休不是一個年紀或一個帳戶數字。退休是你做的事和你想做的事變成同一件事的那一刻。大多數人永遠到不了那裡，因為他們從未停下來問自己真正想要什麼。", ja:"引退とは年齢でも口座の数字でもない。やっていることと、やりたいことが同じになった瞬間——それが引退だ。ほとんどの人がそこにたどり着けないのは、自分が本当に何を望んでいるか、立ち止まって問うことがないからだ。" },
  { id:"n10", channel:"Naval", tag:"決策", color:"#7C6AF7", url:"https://www.notion.so/3238ba4c063381a0ba28fb48effb0deb", en:"Most decisions are reversible. Treat them like experiments, not commitments. The few that aren't reversible — choose slowly, choose carefully. The asymmetry between these two types is where most people get it wrong.", zh:"大多數決定都是可逆的，把它們當成實驗而不是承諾。少數真正不可逆的決定——慢慢選，仔細選。這兩種決定之間的不對稱性，正是大多數人搞錯的地方。", ja:"ほとんどの決断はやり直せる。コミットメントではなく実験として扱え。本当にやり直せない少数の決断は——ゆっくり選べ、慎重に選べ。この二つの非対称性こそ、大半の人が見誤っているところだ。" },
];

const ELON_CARDS = [
  { id:"e1", channel:"Elon", tag:"第一原理", color:"#C8903A", url:"https://www.notion.so/3318ba4c063381f583abdb33088071e8", en:"Analogy is how you copy. First principles is how you invent. When everyone else in the rocket industry was buying components, Musk asked: what is a rocket actually made of? Steel, fuel, electronics. He bought the raw materials and built it himself for 2% of the market price.", zh:"類比是你複製的方式，第一原理是你發明的方式。當火箭產業所有人都在買零件時，Musk 問的是：火箭究竟是由什麼組成的？鋼、燃料、電子元件。他直接買原料自己組裝，成本是市價的 2%。", ja:"アナロジーはコピーの方法、第一原理は発明の方法だ。ロケット業界の全員が部品を買っていた時、Muskが問うたのは「ロケットは結局何でできているのか？」——鉄鋼、燃料、電子部品。彼は原材料を直接買い付け、自分で組み立てた。コストは市場価格の2%。" },
  { id:"e2", channel:"Elon", tag:"The Algorithm", color:"#C8903A", url:"https://www.notion.so/3318ba4c063381f583abdb33088071e8", en:"Step one: question every requirement. Most requirements are wrong — especially ones handed down without explanation. Step two: delete. The best part is the part you don't have to build. Step three: only then simplify. Automating a broken process makes it fail faster.", zh:"第一步：質疑每一個需求，大多數需求都是錯的——尤其是那些沒有解釋就傳下來的。第二步：刪除。最好的部分是你根本不需要做的部分。第三步：才開始簡化。把一個壞掉的流程自動化，只會讓它壞得更快。", ja:"第一ステップ：すべての要件を疑え。大半の要件は間違っている——特に説明なしに降りてきたものは。第二ステップ：削除しろ。最高のパーツは、そもそもやらなくていいパーツだ。第三ステップ：そこからやっと簡素化に入れ。壊れたプロセスを自動化しても、壊れるスピードが上がるだけだ。" },
  { id:"e3", channel:"Elon", tag:"失敗", color:"#C8903A", url:"https://www.notion.so/3318ba4c063381f583abdb33088071e8", en:"SpaceX's first three rockets exploded. After the third failure, they had enough money for exactly one more attempt. That fourth launch succeeded. If Musk had treated failure as a verdict rather than data, the company would have died with the third rocket.", zh:"SpaceX 前三枚火箭全部爆炸。第三次失敗後，他們剩下的錢只夠再試一次。第四次成功了。如果 Musk 把失敗當成判決而不是數據，這家公司就會跟著第三枚火箭一起消失。", ja:"SpaceXの最初の3機のロケットはすべて爆発した。3回目の失敗後、残された資金はあと1回分だけ。4回目で成功した。もしMuskが失敗を「判決」ではなく「データ」として扱わなかったら、この会社は3機目のロケットと一緒に消えていた。" },
  { id:"e4", channel:"Elon", tag:"使命", color:"#C8903A", url:"https://www.notion.so/3318ba4c063381f583abdb33088071e8", en:"The goal doesn't have to be achievable to be worth pursuing. The goal of becoming a multi-planetary species might take 200 years. That doesn't make it less real. Direction matters more than arrival — it determines every decision made along the way.", zh:"一個目標不需要在你有生之年達成，才值得追求。讓人類成為多星球物種可能需要 200 年。這不讓這個目標變得不真實。方向比抵達更重要——它決定了沿途每一個決策。", ja:"ある目標は、自分の生きているうちに達成できなくても、追求する価値がある。人類をマルチプラネタリー種にするには200年かかるかもしれない。だからといって、この目標が非現実的になるわけではない。到達よりも方向が重要だ——それが道中のあらゆる意思決定を決める。" },
  { id:"e5", channel:"Elon", tag:"產品設計", color:"#C8903A", url:"https://www.notion.so/3318ba4c063381f583abdb33088071e8", en:"If a user needs a tutorial, you've already lost. The best interfaces are so obvious they feel inevitable — like the user designed them themselves. Complexity is always the designer's failure, never the user's problem.", zh:"如果使用者需要教學，你就已經輸了。最好的介面清楚到感覺理所當然——像是使用者自己設計的。複雜永遠是設計師的失敗，從來不是使用者的問題。", ja:"ユーザーにチュートリアルが必要な時点で、もう負けている。最高のインターフェースは、当たり前に感じるほど明快だ——まるでユーザー自身がデザインしたかのように。複雑さは常にデザイナーの失敗であり、決してユーザーの問題ではない。" },
  { id:"e6", channel:"Elon", tag:"人才", color:"#C8903A", url:"https://www.notion.so/3318ba4c063381f583abdb33088071e8", en:"A single brilliant engineer is worth a hundred average ones — not because they work harder, but because they see problems differently and solutions more clearly. The most expensive thing in a company is not talent. It's the wrong talent in the wrong role.", zh:"一個真正出色的工程師抵得上一百個普通的——不是因為他們更努力，而是因為他們對問題的理解不同，對解法的看法更清晰。一家公司最昂貴的不是人才，而是放錯位置的人才。", ja:"本当に優れたエンジニア一人は、凡庸なエンジニア百人に匹敵する——より努力するからではなく、問題の理解が違い、解法の見え方がまるで違うからだ。企業にとって最もコストが高いのは人材ではない。配置を間違えた人材だ。" },
  { id:"e7", channel:"Elon", tag:"速度", color:"#C8903A", url:"https://www.notion.so/3318ba4c063381f583abdb33088071e8", en:"Move at a pace that feels slightly irresponsible. If it feels safe, you're probably moving too slowly. The risks of going too fast are recoverable. The risk of moving too slowly — in a competitive world — often isn't.", zh:"以一種感覺稍微不負責任的速度前進。如果感覺安全，你可能移動得太慢了。走太快的風險通常可以挽回。在競爭激烈的世界裡，走太慢的風險往往不行。", ja:"少し無責任に感じるくらいのスピードで進め。安全だと感じるなら、おそらく遅すぎる。速すぎるリスクは大抵リカバリーできる。競争の激しい世界では、遅すぎるリスクはたいていリカバリーできない。" },
  { id:"e8", channel:"Elon", tag:"10倍思維", color:"#C8903A", url:"https://www.notion.so/3318ba4c063381f583abdb33088071e8", en:"10% improvement gets you incremental progress. 10x improvement requires rethinking the entire approach from scratch. Most people never attempt 10x because they assume it requires 10x the resources. It doesn't. It requires 10x the thinking.", zh:"改善 10% 讓你漸進式進步。改善 10 倍要求你從頭重新思考整個方法。大多數人從未嘗試 10 倍，因為他們假設這需要 10 倍的資源。不需要。它需要的是 10 倍的思考。", ja:"10%の改善はインクリメンタルな進歩をもたらす。10倍の改善はアプローチ全体をゼロから考え直すことを要求する。ほとんどの人が10倍を試みないのは、10倍のリソースが必要だと思い込んでいるからだ。違う。必要なのは10倍の思考だ。" },
  { id:"e9", channel:"Elon", tag:"現場主義", color:"#C8903A", url:"https://www.notion.so/3318ba4c063381f583abdb33088071e8", en:"The problem is always at the product. Not in the boardroom. Not in the spreadsheet. The people making decisions from a distance are always the last to understand what's actually wrong — and the last to fix it.", zh:"問題永遠在產品現場，不在董事會，不在試算表裡。從遠處做決策的人永遠是最後一個理解哪裡出了問題的——也永遠是最後一個修好它的。", ja:"問題は常に製品の現場にある。会議室にも、スプレッドシートの中にもない。遠くから意思決定する人間は、何が壊れているかを最後に理解し——そして最後に直す人間だ。" },
  { id:"e10", channel:"Elon", tag:"Plan B", color:"#C8903A", url:"https://www.notion.so/3318ba4c063381f583abdb33088071e8", en:"Having a Plan B means you'll use it. The moment you allocate mental space to the exit, you've already started leaving. Commitment isn't stubbornness — it's the refusal to let doubt consume the energy that execution needs.", zh:"有 B 計劃意味著你會用到它。你一旦給退路留了心理空間，就已經開始離開了。承諾不是固執，而是拒絕讓懷疑消耗掉執行所需要的能量。", ja:"プランBがあるということは、それを使うということだ。退路に心理的スペースを与えた瞬間、すでに離れ始めている。コミットメントは頑固さではない——疑念に、実行に必要なエネルギーを食い潰させることを拒否することだ。" },
];

const YOUTUBE_CARDS = [
  { id:"yt1", channel:"Dan Koe", tag:"創意者協護", color:"#4A9E96", url:"https://www.notion.so/3438ba4c0633816ca8bfec4a33fedc9b", en:"Creativity is a state of consciousness, not a skill — and it can be cultivated or destroyed. Constant surface stimulation (notifications, short videos, email) consumes cognitive bandwidth and prevents deep thought. Real boredom is the birthplace of creativity: phone-free walks, stream-of-consciousness journaling, sitting with nothing. A meaningful project is the container that gives wandering thoughts a place to land. Dangerous creativity means expressing your genuine perspective — not safe, neutral takes.", zh:"創意不是技術，是一種意識狀態——可以被培養，也可以被摧毀。通知、短影音、隨時查郵件，這些消耗的不是時間，是深層思考的入口。真正的「無聊」才是創意的溫床：不帶手機散步、意識流手寫、什麼設備也不帶地坐著。有意義的專案是容器——漫遊的思維需要一個能降落的地方。危险的創意者不是「怪」，而是敢說真實的觀點，而不是永遠保持安全的中立。", ja:"創造力は技術ではなく意識の状態だ——育てることも壊すこともできる。通知・短い動画・絶え間ないメール確認が認知帯域を奪い深い思考への入り口を塞ぐ。本当の「退屈」こそが創造性の温床だ：スマホなしの散歩・意識の流れのままに書く・何の機器もなくただ座る。意味のあるプロジェクトが容器となりさまよう思考が着地できる場所を与える。危険なクリエイターとは安全で中立な意見に逃げず自分の本物の視点を表現できる人だ。" },
  { id:"yt2", channel:"Dan Koe", tag:"五維思考", color:"#4A9E96", url:"https://www.notion.so/33e8ba4c06338189a2bbfc99e3710771", en:"Genius thinking isn't high IQ — it's the ability to keep exploring where others stop. Most people think in one dimension: only from their own perspective, reducing everything to their familiar domain. Dan Koe's 5 dimensions: Breadth (depth across domains), Depth (cognitive sophistication per domain), Altitude (average level across all domains), 360° View (personal/collective × inner/outer), and Time (evolutionary patterns, not memorized events). The key upgrade: shift from 'I'm right, you're wrong' (Level 1-2) to 'my model is one of many valid models' (Level 3-4).", zh:"天才思考不是高IQ，而是「在別人停下來的地方繼續探索的能力」。多數人只有一維思考——只從自己的視角出發，把所有事情都歸結到熟悉的領域。Dan Koe的五維框架：廣度（跨領域的深度數量）、深度（每個領域的認知精密度）、海拔（所有領域的平均認知水平）、四象限（個人/集體 × 內在/外在）、時間（理解歷史演化模式）。核心升級：從「我對你錯」（第1-2層）升級到「我的模型是眾多有效模型之一」（第3-4層）。", ja:"天才的思考は高いIQではなく他者が止まるところで探求し続ける能力だ。ほとんどの人は一次元思考——自分の視点からしか見ず何でも自分の得意分野に還元する。ダン・コーの5次元：幅（領域横断の深み）・深さ（各領域の認知精緻度）・高度（全領域の平均水準）・四象限（個人/集合×内面/外面）・時間（進化パターンの理解）。核心アップグレード：「自分が正しく相手が間違い」（レベル1-2）から「自分のモデルは多くの有効なモデルの一つ」（レベル3-4）へ。" },
  { id:"yt3", channel:"Dan Koe", tag:"AI護城河", color:"#4A9E96", url:"https://www.notion.so/33e8ba4c0633813b88c0df556dfa8874", en:"The information product market has entered Stage 5 maturity — brand authenticity now matters more than content quality. Business model lifecycles are compressing: info products lasted 10-15 years; the next wave may last only 2-3. The future is 'learning experiences,' not static courses — you're selling a second version of your mind. AI makes specific knowledge more valuable, not less: it can generate generic content, but can't replicate 10 years of deep curiosity in a niche. Build an AI that embodies your unique perspective.", zh:"資訊產品市場已到第五階段——品牌真實性比內容品質更重要。商業模式生命週期在壓縮：資訊產品撐了10-15年，下一個浪潮可能只有2-3年。未來是「學習體驗」，不是靜態課程——你賣的不是資訊，是你心智的第二版本。AI讓特定知識更有價值，不是更沒有：它能生成通用內容，卻複製不了你在某個領域10年深耕的品味和判斷力。把你的獨特知識做成AI，才是護城河。", ja:"情報商品市場はステージ5の成熟期に入った——ブランドの真正性が今やコンテンツの質より重要だ。ビジネスモデルのライフサイクルは圧縮されている：情報商品は10〜15年保ったが次の波はたった2〜3年かもしれない。未来は「学習体験」であり静的コースではない——あなたが売るのは情報でなくあなたの精神の第二バージョンだ。AIは固有の知識をより価値あるものにする：汎用コンテンツを生成できても10年の深い好奇心から培われた審美眼は複製できない。あなた固有の知識をAIに宿らせることが本当の濠となる。" },
  { id:"yt4", channel:"Dan Koe", tag:"個人品牌策略", color:"#4A9E96", url:"https://www.notion.so/33e8ba4c063381c5b266d9777f9d6488", en:"80% of beginner content should start with pain points (Pain → Process → Insight). Most personal brand builders quit within 90 days — simply staying consistent for a year puts you ahead of 95% of competitors. A niche isn't a topic, it's a problem set: the clearer your problem-solution narrative, the faster you attract the right audience. Your content is a sales funnel disguised as education.", zh:"80%的初學者內容應該以痛點開頭（痛點→過程→洞察）。大多數個人品牌建立者在90天內就放棄——光是堅持一年就能超越95%的競爭對手。利基不是一個話題，是一套問題集：你的問題-解決方案敘事越清晰，吸引對的受眾就越快。你的內容是偽裝成教育的銷售漏斗。", ja:"初心者コンテンツの80%は痛点から始めるべきだ（痛点→プロセス→洞察）。ほとんどの個人ブランド構築者は90日以内に諦める——ただ1年間継続するだけで競合の95%を上回る。ニッチはトピックではなく問題セットだ：問題と解決策のナラティブが明確なほど適切なオーディエンスを素早く引き寄せる。あなたのコンテンツは教育に見せかけたセールスファネルだ。" },
  { id:"yt5", channel:"Dan Koe", tag:"帶問題學習", color:"#4A9E96", url:"https://www.notion.so/33e8ba4c063381dab812ed24df6a6246", en:"The antidote to a mediocre life is multi-dimensional strength. The most powerful learning insight: bring a burning question to every piece of content you consume. Information without context is weightless — when you have a real problem and search for the answer, knowledge has an anchor. Most people learn in reverse: passive consumption, hoping something sticks. Reverse the order: start with a goal, identify what's blocking you, then find the specific knowledge that removes the block.", zh:"平庸的解藥是多維度的強壯。最強大的學習洞察：帶著一個迫切的問題去接觸每一份內容。空著手去聽答案，知識是漂浮的；帶著問題去找答案，知識是有錨點的。大多數人倒著學：被動消費，希望有什麼東西能黏住。反過來：從目標開始，找出是什麼在阻擋你，然後找能移除那個障礙的具體知識。", ja:"凡庸な人生の解毒剤は多次元的な強さだ。最も強力な学習の洞察：コンテンツを消費するとき必ず切実な問いを持ち込む。問いなしに聞いた答えは宙に浮く——本物の問題を抱えて積極的に答えを探すとき知識には錨がある。ほとんどの人は逆順で学ぶ：受動的に消費し何かが引っかかることを期待する。順番を逆にしろ：目標から始め何が邪魔をしているか特定し、そのブロックを取り除く具体的な知識を見つける。" },
  { id:"yt6", channel:"Naval Pod", tag:"極簡設計哲學", color:"#9B7FD4", url:"https://www.notion.so/3468ba4c06338176be1dd6dc215eebed", en:"The Raptor engine's evolution reveals a design principle: iterate until you can't remove any more parts. Every complex system that works well started as something simple and iterated. Product design is fundamentally about iterating until you find the simplest workable solution — you add too much, then must strip back. Elon's method: question the requirement first, eliminate parts, then optimize. And study physics — it's the shortest path to becoming a polymath because it forces you to interact with reality without illusions.", zh:"SpaceX獵鷹引擎的迭代揭示了一個設計原則：不斷改進直到再也無法移除任何零件。自然界中運作良好的複雜系統，都是某個非常簡單的東西不斷迭代的結果。產品設計的本質：先質疑需求，再消除零件，再優化。Tesla電池纖維墊——測試後發現根本沒人需要它，直接取消。學物理是成為博學者的最短路徑，因為它讓你毫不妥協地面對現實。", ja:"Raptorエンジンの進化がデザイン原則を示す：これ以上部品を取り除けないところまで反復する。うまく機能する複雑なシステムは全て単純なものが反復した結果だ。製品設計の本質：まず要件に疑問を持ち部品を除去し最適化する。テスラのバッテリー繊維マット——誰も必要としていないことが判明し廃止された。物理を学ぶことがポリマスへの最短路——現実と妥協なく向き合うことを強制するから。" },
  { id:"yt7", channel:"Naval Pod", tag:"AI理解的本質", color:"#9B7FD4", url:"https://www.notion.so/3458ba4c0633814d9f5afa38c8134664", en:"Modern LLMs are Bayesian reasoning at scale — sophisticated pattern matching, not understanding. The test of real intelligence is 'why?': genuine explanation holds up under follow-up questions. AI can produce text that sounds like physics, but keep asking 'why?' and it collapses — because it has no model of physical reality. More compute is necessary but not sufficient. What's missing is a framework that connects visible phenomena to their invisible causes. That causal mechanism is what makes human science unique.", zh:"GPT這類大型語言模型的本質是大規模的貝葉斯推理——是精密的模式匹配，不是理解。真正智慧的測試是「為什麼？」：真正的解釋能撐得住追問。AI可以生成聽起來像物理學的文字，但持續追問「為什麼」就會崩潰——因為它對物理現實沒有任何模型。算力增加是必要條件，但不是充分條件。缺少的是能把可見現象與不可見成因連結起來的知識架構——那種因果機制，才是人類科學真正獨特的地方。", ja:"現代のLLMは大規模ベイズ推論——洗練されたパターンマッチングであり理解ではない。真の知性のテストは「なぜ？」だ：本物の説明は追及問いに耐える。AIは物理学のように聞こえるテキストを生成できるが「なぜ？」を追い続けると崩壊する——物理的現実のモデルを持っていないから。計算量の増加は必要条件だが十分条件ではない。欠けているのは可視現象と不可視の原因を結びつけるフレームワークだ。その因果メカニズムこそ人間の科学を真に独自にするものだ。" },
  { id:"yt8", channel:"Naval Pod", tag:"四種運氣", color:"#9B7FD4", url:"https://www.notion.so/3458ba4c063381c8bea5fe524b9dfd3a", en:"Wealth creation is a learnable skill, not luck management. Four types of luck: 1) Random luck — uncontrollable. 2) Luck from constant hustle — keep moving, create surface area for chance. 3) Luck from preparation — deep expertise lets you recognize opportunities others miss entirely. 4) Luck from unique character — your reputation, values, and skills become a magnet that attracts the right opportunities to you. The goal: in 1,000 parallel universes, be wealthy in 999 of them.", zh:"財富創造是可以學習的技能，不是運氣管理。四種運氣：1) 盲目運氣——無法控制。2) 勤勞換來的運氣——不斷行動，創造遇見機會的表面積。3) 準備換來的運氣——在某個領域積累了高度認知的人，遇到機會時能辨識並把握。4) 獨特性格吸引來的運氣——你的聲譽、價值觀、技能讓對的機會主動找上門。目標：在1000個平行宇宙裡，在999個裡都是富有的。", ja:"富の創造は習得可能なスキルであり運の管理ではない。4種類の運：1）盲目的な運——制御できない。2）絶え間ない努力による運——動き続け機会との接触面積を広げる。3）準備による運——特定分野で高い認知を積んだ人は他者が見逃す機会を認識し掴める。4）独自の性格が引き寄せる運——評判・価値観・スキルが適切な機会を磁石のように引き寄せる。目標：1000の並行宇宙のうち999で富を持つこと。" },
  { id:"yt9", channel:"Naval Pod", tag:"理性樂觀主義", color:"#9B7FD4", url:"https://www.notion.so/3458ba4c063381cb9635da30dde162a6", en:"Pessimism is intellectually lazy. David Deutsch's core insight: all problems are fundamentally caused by a lack of knowledge, therefore progress is inevitable as knowledge grows. Famine is insufficient agricultural knowledge. Disease is insufficient medical knowledge. Poverty is insufficient economic knowledge. Pessimists get attention by predicting doom, but optimists build the future. Rational optimism isn't naive — it's the empirically supported position that problems are solvable and humans are the universal problem-solvers.", zh:"悲觀主義看似有理，實際上是懶惰。David Deutsch的核心洞察：所有問題的根源都是知識不足，因此隨著知識增長，進步是必然的。飢荒是農業知識不足，疾病是醫學知識不足，貧窮是經濟知識不足。悲觀者靠預測災難獲得關注，樂觀者建造未來。理性樂觀主義不是天真——它是有實証支持的立場：問題是可解的，而人類是通用的問題解決者。", ja:"悲観主義は賢そうに見えるが実は怠惰だ。デイヴィッド・ドイッチュの核心的洞察：すべての問題は本質的に知識の不足によって引き起こされるため知識が成長するにつれ進歩は必然だ。飢饉は農業知識の不足、疾病は医学知識の不足、貧困は経済知識の不足だ。悲観論者は破滅を予測することで注目を集めるが楽観論者は未来を作る。合理的楽観主義は無邪気ではない——問題は解決可能であり人間は普遍的な問題解決者であるという実証的に支持された立場だ。" },
  { id:"yt10", channel:"Huberman", tag:"晨間韌性訓練", color:"#3B82B8", url:"https://www.notion.so/3458ba4c0633818ca059f3a0f196fdcf", en:"Resilience is physiological and trainable, not just a mindset. Morning cortisol is your body's natural energy spike — healthy and necessary. The protocol: bright light within 30-60 min of waking + morning exercise. This amplifies the cortisol awakening response, making it sharper and more concentrated. Payoff: your adrenal budget is 'spent' in the morning, so afternoon and evening stress triggers produce lower, shorter cortisol responses. You become physiologically calmer throughout the day — not by avoiding stress, but by spending cortisol at the right time.", zh:"韌性是生理性的，可以被訓練，不只是心態問題。晨間皮質醇是身體的天然能量脈衝——健康且必要。協護：清醒後30-60分鐘內接受明亮光照 + 晨間運動，放大皮質醇覺醒反應讓它更尖銳。回報：你的腎上腺儲量在早上「結算」，下午和夜間的壓力觸發就變得更低、更短。你全天生理上會更平靜——不是因為避開壓力，而是因為在正確的時間使用了皮質醇。", ja:"回復力は生理的なものであり訓練可能だ——心構えだけでなく。朝のコルチゾールは体の自然なエネルギースパイクで健康的かつ必要なものだ。プロトコル：起床後30〜60分以内の明るい光への暴露＋朝の運動でコルチゾール覚醒反応を増幅させよりシャープに。報酬：副腎の予算が朝に「精算」されるため午後・夜間のストレストリガーによるコルチゾール反応が低く短くなる。ストレスを避けるのでなく正しい時間にコルチゾールを使うことで生理的に一日中落ち着いていられる。" },
  { id:"yt11", channel:"Huberman", tag:"NSDR深度休復", color:"#3B82B8", url:"https://www.notion.so/3448ba4c0633818aba68de1e1b3de1b1", en:"NSDR (Non-Sleep Deep Rest) beats naps in three ways: no sleep inertia, no disruption to nighttime sleep, and it actively restores dopamine in specific brain regions — explaining the motivation and focus boost afterward. You stay conscious while the brain shifts from Beta to Theta waves. 10-30 minutes is enough. It outperforms 20+ minute naps for afternoon recovery. Google CEO Sundar Pichai practices it daily. Free, zero equipment, works anywhere.", zh:"NSDR（非睡眠深度休息）在三方面勝過小睡：沒有睡眠惰性、不影響夜眠、主動恢復特定腦區的多巴胺水平——解釋了為什麼NSDR後動力和專注力明顯回升。你保持清醒，大腦從Beta波滑向Theta波。10-30分鐘就夠。下午恢復效果優於20分鐘以上的小睡。Google CEO Sundar Pichai每天實踐。免費，零設備，任何地方都能用。", ja:"NSDR（非睡眠深度休息）は3つの点で昼寝を上回る：睡眠惰性なし・夜間睡眠を妨げない・特定の脳領域のドーパミンを積極的に回復させ動機と集中力を向上させる。意識を保ちながら脳がベータ波からシータ波にシフトする。10〜30分で十分。午後の回復では20分超の昼寝を上回る。GoogleのサンダーCEOが毎日実践。無料・道具不要・どこでも可能。" },
  { id:"yt12", channel:"Huberman", tag:"社交多巴胺", color:"#3B82B8", url:"https://www.notion.so/3458ba4c0633819581c7cca80d293ead", en:"Debunking the oxytocin myth: the real driver of social bonding is dopamine, not oxytocin. Oxytocin strengthens in-group connection but simultaneously amplifies distrust and hostility toward out-groups — it's tribal, not universally loving. Introvert vs. extrovert is a dopamine spectrum: extroverts get dopamine spikes from social interaction; introverts sustain dopamine better in solitude. Loneliness is a biological signal — like hunger or thirst — urging you to act. Quality of connection matters more than quantity.", zh:"推翻催產素神話：社交連結的真正驅力是多巴胺，不是催產素。催產素強化內團體連結的同時，也會強化對外團體的不信任和對立——它是部落性的，不是普遍的愛。內向vs外向是多巴胺的連續譜：外向者在社交中多巴胺急升；內向者在獨處時多巴胺更穩定。孤獨感是生物訊號——如同飢餓或口渴——是你的神經系統在催促你行動，不是性格缺陷。社交連結的質量比數量更重要。", ja:"オキシトシン神話を打破する：社会的絆の真の推進力はオキシトシンではなくドーパミンだ。オキシトシンは内集団の結びつきを強めると同時に外集団への不信感と敵意を増幅させる——部族的であり普遍的な愛ではない。内向性vs外向性はドーパミンのスペクトラム：外向的な人は社交でドーパミンが急上昇し内向的な人は孤独でより維持できる。孤独感は生物学的シグナル——空腹や渇きと同様——あなたの神経系が行動を促している。社交の質は量より重要だ。" },
  { id:"yt13", channel:"Huberman", tag:"神經可塑性超協議", color:"#3B82B8", url:"https://www.notion.so/3448ba4c063381b893b5f1251180eca3", en:"The Neuroplasticity Super Protocol is a 9-step framework for accelerated learning. Key principles: 1) Alert state first — 25-30 deep breaths to prime your nervous system. 2) Visual focus for 30-60s to spike acetylcholine. 3) Mass repetition with ~15% error rate for optimal challenge. 4) Random 10-second micro-rests every 2 minutes — the hippocampus replays learning 10× faster during these gaps. 5) Post-learning NSDR within 1 hour to consolidate. 6) Memory formation happens during sleep, not during learning itself. Skip steps 1, 2, or 9 at your peril.", zh:"神經可塑性超級方案是9步驟加速學習框架。核心原則：1) 先建立警覺狀態——25-30次深呼吸啟動神經系統。2) 視覺聚焦30-60秒釋放乙醯膽鹼。3) 大量重複，最佳錯誤率約15%。4) 每兩分鐘隨機10秒微休息——海馬迴在這些空白中以10倍速度重播學習內容。5) 學習後1小時內進行NSDR以鞏固。6) 真正的記憶形成發生在睡眠中，不是學習中。跳過第1、2或9步，後果自負。", ja:"神経可塑性スーパープロトコルは加速学習のための9ステップフレームワークだ。核心原則：1）まず覚醒状態を構築——25〜30回の深呼吸で神経系を起動。2）1点を30〜60秒見つめアセチルコリンを放出。3）約15%の最適エラー率で大量反復。4）2分ごとにランダムな10秒の微休息——海馬はこのギャップ中に10倍の速さで学習を再生。5）学習後1時間以内にNSDRで定着。6）実際の記憶形成は学習中ではなく睡眠中に起きる。ステップ1・2・9を飛ばすのは自己責任だ。" },
];

  { id:"news_0", channel:"世界新聞", tag:"美伊秘密外交推進", color:"#E05C5C", en:"US and Iranian negotiators are conducting intensive back-channel diplomacy centered on a staged peace process that would first return conditions to the pre-war status quo and reopen the Strait of Hormuz. Iran's supreme leader's son has now consolidated authority following his father's death. US officials describe the gap between the two sides as narrower than public posturing suggests, with Gulf states acting as key intermediaries.", zh:"美伊談判人員正進行密集秘密外交，以分階段和平進程為核心——首先恢復開戰前的現狀並重開荷姆茲海峽。伊朗最高領袖之子在父親身故後已鞏固權力。美國官員表示雙方差距比公開表態所顯示的要小，海灣國家作為關鍵中間人從中協調。", ja:"米国とイランの交渉担当者は、まず戦前の現状に戻しホルムズ海峡を再開するという段階的和平プロセスを中心に集中的な裏チャンネル外交を行っている。イランの最高指導者の息子が父の死後に権力を固めた。米国当局者は双方の溝が公の立場が示すより狭いと述べ、湾岸諸国が重要な仲介者として機能している。", url:"https://commonslibrary.parliament.uk/research-briefings/cbp-10636/" },
  { id:"news_1", channel:"世界新聞", tag:"EU通過1060億援烏貸款", color:"#E05C5C", en:"The European Union approved a landmark €97 billion ($106 billion) loan package on April 24 to help Ukraine cover economic and military expenses for the next two years, ending months of political deadlock. The approval came after Hungary dropped its veto following diplomatic assurances over minority rights provisions. The funds will be disbursed in quarterly tranches tied to anti-corruption benchmarks.", zh:"歐盟4月24日批准了一項里程碑式的970億歐元（1060億美元）貸款方案，以協助烏克蘭在未來兩年支付經濟與軍事開支，終結了數月的政治僵局。匈牙利在獲得少數民族權利條款的外交保證後撤回否決，批准隨即生效。資金將按季分批發放，與反腐敗基準掛鉤。", ja:"欧州連合が4月24日に970億ユーロ（1060億ドル）の画期的な融資パッケージを承認しウクライナが今後2年間の経済・軍事費用を賄う支援を行い数ヶ月に及ぶ政治的行き詰まりを終わらせた。ハンガリーが少数民族の権利条項に関する外交的保証を受けて拒否権を撤回した後に承認が成立した。資金は汚職防止のベンチマークに連動した四半期ごとの分割払いで支払われる。", url:"https://www.aljazeera.com/" },
  { id:"news_2", channel:"世界新聞", tag:"荷姆茲海峽仍實質封閉", color:"#E05C5C", en:"The Strait of Hormuz remains effectively closed on Day 60 of the US-Iran conflict, with a US naval blockade preventing 38 vessels from entering or leaving Iranian ports. Nearly no commercial shipping has transited the strait since the conflict began in late February. Energy markets remain volatile as global oil supply disruptions continue despite emergency reserve releases from IEA member states.", zh:"在美伊衝突爆發第60天，荷姆茲海峽仍實質封閉，美國海軍封鎖阻止38艘船隻進出伊朗港口。自2月下旬衝突爆發以來，幾乎沒有商業船隻通過該海峽。儘管國際能源署成員國緊急釋放儲備，全球石油供應中斷仍使能源市場持續波動。", ja:"米イラン紛争60日目にホルムズ海峡は実質的に封鎖されたままで米海軍の封鎖がイランの港への38隻の入出港を阻止している。2月下旬の紛争開始以来ほぼ商業船舶が海峡を通過していない。IEA加盟国による緊急備蓄放出にもかかわらず世界的な石油供給の混乱によりエネルギー市場は変動が続いている。", url:"https://commonslibrary.parliament.uk/research-briefings/cbp-10636/" },
  { id:"news_3", channel:"世界新聞", tag:"馬利首都遭武裝攻擊", color:"#E05C5C", en:"Armed groups launched one of Mali's most significant coordinated attacks in years against the capital Bamako and several key cities, exploiting the worsening security vacuum in the Sahel region. The assault follows the withdrawal of French and UN peacekeeping forces over the past two years. The Malian government declared a state of emergency and appealed to neighboring states and the African Union for emergency security assistance.", zh:"武裝集團對馬利首都巴馬科及多個主要城市發動了近年來最嚴重的協調攻擊，利用薩赫勒地區持續惡化的安全真空。此次攻擊發生在法國和聯合國維和部隊於過去兩年相繼撤離之後。馬利政府宣布進入緊急狀態，並向鄰國和非洲聯盟尋求緊急安全援助。", ja:"武装集団がマリの首都バマコと複数の主要都市に対してサヘル地域の悪化する安全の空白を利用し数年来最も重大な協調攻撃を開始した。この攻撃は過去2年間にフランスとUN平和維持部隊が撤退した後に起きた。マリ政府は非常事態を宣言し近隣諸国とアフリカ連合に緊急の安全保障支援を要請した。", url:"https://www.aljazeera.com/" },
  { id:"news_4", channel:"世界新聞", tag:"聯合國秘書長候選首辯", color:"#E05C5C", en:"The four candidates for the next UN Secretary-General concluded their first televised interactive dialogues at UN Headquarters in New York this week. The new transparent selection format to replace António Guterres, whose term ends December 2026, drew global media attention. Candidates addressed questions on AI governance, climate finance, and great-power competition — the three issues expected to define the next Secretary-General's mandate.", zh:"四位下任聯合國秘書長候選人本週在紐約聯合國總部完成了首輪電視直播互動對話。這一用以接替任期於2026年12月屆滿的古特雷斯的透明遴選新方式吸引了全球媒體關注，候選人就AI治理、氣候融資和大國競爭三大預期將定義下任秘書長任務的議題回答了問題。", ja:"次期国連事務総長の4人の候補者が今週ニューヨークの国連本部で初のテレビ生中継によるインタラクティブ対話を終えた。2026年12月に任期が終了するグテーレスの後継者を選ぶ新しい透明な選考方式は世界的なメディアの注目を集めた。候補者はAIガバナンス・気候資金・大国間競争という次期事務総長の任務を定義すると予想される3つの問題に答えた。", url:"https://news.un.org/en/story/2026/04/1167342" },

const SOCIAL_CARDS = [
  { id:"social_0", channel:"社交雷達", tag:"2026像極了2016", color:"#C97DD4", en:"The '2026 is the new 2016' trend has swept TikTok and Instagram, with creators posting side-by-side comparisons of the cultural aesthetics of 2016 and today — the same fashion cycles, meme formats, and pop music dynamics are reportedly repeating. The trend taps into collective nostalgia while raising questions about whether internet culture has entered a recycling loop without generating genuinely new aesthetics.", zh:"「2026就是新版2016」趨勢橫掃TikTok和Instagram，創作者發布2016年與當今文化美學的並排對比——相同的時尚循環、梗格式和流行音樂動態據報正在重演。這一趨勢喚起集體懷舊情緒，同時引發關於網路文化是否已進入不產生真正新美學的回收循環的討論。", ja:"「2026は新しい2016」トレンドがTikTokとInstagramを席巻し2016年と現代の文化的美学を並べて比較する動画をクリエイターが投稿している——同じファッションサイクル・ミームフォーマット・ポップ音楽のダイナミクスが繰り返されているという。このトレンドは集団的なノスタルジアを喚起しながらインターネット文化が真に新しい美学を生み出さないリサイクルループに入ったかどうかという問いを提起している。", url:"https://en.wikipedia.org/wiki/2026_is_the_new_2016" },
  { id:"social_1", channel:"社交雷達", tag:"Your Friends鄰居舞蹈爆紅", color:"#C97DD4", en:"A dancing scene from Apple TV+'s 'Your Friends & Neighbors' has become TikTok's most-shared clip of the week. Viewers describe the scene as nostalgic, calming, and oddly therapeutic — qualities that have driven millions of re-posts and reaction videos. The clip has also generated a wave of 'recreating the dance' content from non-creator accounts, a signal of unusually broad cultural penetration.", zh:"Apple TV+《Your Friends & Neighbors》中的一段舞蹈場景成為本週TikTok分享最多的片段。觀眾形容這段場景充滿懷舊感、令人平靜且莫名治愈——這些特質推動了數百萬次轉發和反應影片。這段片段還引發了來自非創作者帳號的「重現舞蹈」內容浪潮，顯示出異常廣泛的文化滲透。", ja:"Apple TV+の「Your Friends & Neighbors」からのダンスシーンが今週のTikTokで最もシェアされたクリップになった。視聴者はそのシーンをノスタルジックで落ち着き不思議と癒されると表現しており数百万のリポストとリアクション動画を生み出した。またこのクリップは非クリエイターアカウントからの「ダンスを再現する」コンテンツの波を引き起こしており異常に広い文化的浸透の兆候を示している。", url:"https://www.epidemicsound.com/blog/latest-tiktok-trends/" },
  { id:"social_2", channel:"社交雷達", tag:"瑜伽腿挑戰席捲TikTok", color:"#C97DD4", en:"The yoga leg challenge continues to dominate TikTok: creators lie on their back, grab their foot, and try to extend their leg straight up. What makes it viral is the universal failure — the pose reveals how dramatically most adults have lost hamstring flexibility since childhood. The challenge drives self-aware humor, physio commentary, and a secondary trend of people documenting their flexibility training journeys.", zh:"瑜伽腿挑戰持續主導TikTok：創作者躺下抓腳試圖將腿筆直向上伸展。讓它病毒式傳播的是普遍的失敗——這個姿勢揭示了大多數成年人自童年以來腿後腱靈活度喪失有多嚴重。挑戰引發自我覺知幽默、物理治療師點評，以及人們記錄自己柔韌性訓練旅程的次生趨勢。", ja:"ヨガレッグチャレンジがTikTokを席巻し続けている。クリエイターが仰向けに寝て足を掴み脚を真っ直ぐ上に伸ばそうとする。バイラルになる理由は普遍的な失敗——このポーズがほとんどの大人が子供の頃からいかに劇的にハムストリングの柔軟性を失ったかを露わにするからだ。自己認識的なユーモア・理学療法士のコメント・柔軟性トレーニングの旅を記録する二次的なトレンドを生み出している。", url:"https://www.epidemicsound.com/blog/latest-tiktok-trends/" },
  { id:"social_3", channel:"社交雷達", tag:"Color Walk色彩漫步打卡", color:"#C97DD4", en:"The Color Walk trend is surging on Instagram — creators pick one color before leaving home and photograph or film everything they notice in that hue during their walk. The final post is a color-matched collage grid that is visually striking without requiring editing skill, production budget, or a large following. The format rewards observation and mindfulness over algorithmic optimization, which is driving its crossover appeal.", zh:"Color Walk趨勢在Instagram上飆升——創作者出門前選定一種顏色，在漫步途中拍攝所有注意到的同色事物，最終發布的色彩匹配拼貼網格視覺衝擊力強，無需剪輯技巧或製作預算。這一格式獎勵觀察力與正念而非算法優化，正是其跨圈層吸引力的來源。", ja:"Color Walkトレンドがインスタグラムで急増している。クリエイターが家を出る前に1色を選び散歩中にその色のものを写真・動画に収める。最終投稿は編集スキルも制作予算もフォロワー数も必要とせず視覚的に際立った色合わせのコラージュグリッドになる。アルゴリズム最適化より観察力とマインドフルネスを報いるこのフォーマットがクロスオーバーな魅力の源となっている。", url:"https://newengen.com/insights/instagram-trends/" },
  { id:"social_4", channel:"社交雷達", tag:"Euphoria S3三週熱度不退", color:"#C97DD4", en:"Euphoria Season 3, entering its third week on HBO, shows no sign of social media momentum slowing. TikTok and Instagram are flooded with character edits, costume dupes, and quote-driven audio trends. YouTube fan analysis channels are each accumulating millions of views. The four-year wait since Season 2 has amplified engagement levels to a degree that industry analysts say has not been seen since the Stranger Things 4 premiere cycle.", zh:"進入第三週的HBO《Euphoria》第三季在社交媒體上仍熱度不退。TikTok和Instagram充斥著角色剪輯、服裝平替和台詞驅動的音頻趨勢。YouTube粉絲分析頻道各自積累了數百萬次觀看。業界分析師表示，自第二季以來四年的等待將互動水準放大到了自《怪奇物語》第四季首播週期以來未曾見過的程度。", ja:"HBO「Euphoria」シーズン3が3週目に入っても一向にソーシャルメディアの勢いが衰えない。TikTokとインスタグラムはキャラクター編集・コスチュームの代替品・セリフ主導のオーディオトレンドで溢れている。YouTubeのファン分析チャンネルはそれぞれ数百万回の再生を積み上げている。シーズン2から4年待ったことでエンゲージメントレベルがStranger Things 4の初放送サイクル以来見られなかった水準にまで増幅されていると業界アナリストは言う。", url:"https://www.epidemicsound.com/blog/latest-tiktok-trends/" },
];\n

  { id:"finance_0", channel:"財經", tag:"台股市值超越英國", color:"#D4A838", en:"Taiwan's stock market capitalization surged past $4.3 trillion this month, overtaking the United Kingdom to become the world's fifth-largest equity market. The milestone reflects the extraordinary concentration of AI semiconductor value in TSMC and its supplier ecosystem. Taiwan's market cap has nearly doubled in 18 months, driven almost entirely by AI infrastructure demand from global hyperscalers.", zh:"台灣股市市值本月飆破4.3兆美元，超越英國成為全球第五大股票市場。這一里程碑反映了AI半導體價值在台積電及其供應商生態系統中的非凡集中度，台灣市值在18個月內幾乎翻倍，幾乎完全由全球超大規模數據中心的AI基礎設施需求所驅動。", ja:"台湾の株式市場時価総額が今月4.3兆ドルを突破し英国を追い抜いて世界第5位の株式市場となった。この節目はTSMCとそのサプライヤーエコシステムにおけるAI半導体価値の並外れた集中を反映している。台湾の時価総額は18か月でほぼ倍増しグローバルハイパースケーラーからのAIインフラ需要によってほぼ完全に牽引されている。", url:"https://gfmag.com/emerging-frontier-markets/taiwan-powering-ahead/" },
  { id:"finance_1", channel:"財經", tag:"IMF上調台灣GDP至5.2%", color:"#D4A838", en:"The IMF revised Taiwan's 2026 real GDP growth forecast up to 5.2% in its April World Economic Outlook — more than double its January estimate of 2.1%. The report, subtitled 'Global Economy in the Shadow of War,' cut forecasts for 30 other countries simultaneously, making Taiwan's upward revision among the sharpest of any major economy. AI semiconductor exports and record Q1 growth of 13.19% year-on-year drove the upgrade.", zh:"IMF在4月《世界經濟展望》中將台灣2026年實質GDP成長預測大幅上調至5.2%，超過1月2.1%估計的兩倍以上。以「戰爭陰影下的全球經濟」為副題的報告同時下調了其他30個國家的預測，台灣的上調成為主要經濟體中幅度最大的之一。AI半導體出口和Q1年增13.19%的創紀錄表現推動了此次上調。", ja:"IMFが4月の世界経済見通しで台湾の2026年実質GDP成長率予測を1月の2.1%の2倍以上となる5.2%に上方修正した。「戦争の影の下の世界経済」という副題の報告書は同時に30か国の予測を引き下げており台湾の上方修正は主要経済の中で最も急激なものの一つとなった。AI半導体輸出と前年比13.19%の記録的なQ1成長がこの修正を牽引した。", url:"https://www.taipeitimes.com/News/front/archives/2026/04/16/2003855684" },
  { id:"finance_2", channel:"財經", tag:"台灣金融業聯手建LLM", color:"#D4A838", en:"Taiwan's major financial institutions have launched a joint initiative to develop a localized large language model tailored to Taiwanese financial regulation, Traditional Chinese data, and Taiwan-specific market knowledge. The project is part of a broader government-backed push to reduce reliance on foreign AI infrastructure in the financial sector. Participants include major banks, insurers, and securities firms under coordination by the Financial Supervisory Commission.", zh:"台灣主要金融機構已啟動聯合計畫，開發針對台灣金融法規、繁體中文資料與台灣特定市場知識量身訂製的本土大語言模型。該計畫是政府支持的更廣泛推動方案的一部分，旨在降低金融業對境外AI基礎設施的依賴，參與方包括多家銀行、保險公司和證券商，由金融監督管理委員會協調。", ja:"台湾の主要金融機関が台湾の金融規制・繁体字中国語データ・台湾固有の市場知識に特化したローカライズされた大規模言語モデルを開発する共同イニシアティブを開始した。このプロジェクトは金融セクターにおける外国AIインフラへの依存を減らすための政府支援の幅広い取り組みの一部であり、金融監督管理委員会の調整の下で主要銀行・保険会社・証券会社が参加している。", url:"https://english.cw.com.tw/article/article.action?id=4515" },
  { id:"finance_3", channel:"財經", tag:"台灣經常帳盈餘引國際關注", color:"#D4A838", en:"Taiwan's current account surplus, exceeding 15% of GDP and among the world's largest, is drawing intensifying international scrutiny in 2026. Trading partners — particularly the United States — are raising concerns about potential currency undervaluation and calling for exchange rate rebalancing. The Central Bank of the Republic of China faces pressure to allow greater New Taiwan Dollar appreciation as a condition for sustained trade access.", zh:"台灣經常帳盈餘超過GDP的15%，位居全球最大之列，在2026年正受到日益強烈的國際關注。貿易夥伴——尤其是美國——對潛在的貨幣低估表示關切，並呼籲匯率重新平衡。中華民國中央銀行正承受壓力，需允許新台幣更大幅度升值，作為維持貿易准入的條件。", ja:"台湾の経常収支黒字がGDPの15%を超え世界最大水準の一つであることから2026年に国際的な監視が強まっている。貿易相手国——特に米国——は潜在的な通貨過小評価への懸念を表明し為替レートの再調整を求めている。中華民国中央銀行は持続的な貿易アクセスの条件として台湾ドルのより大幅な上昇を認めるよう圧力に直面している。", url:"https://euroview.ecct.com.tw/category-inside.php?id=2699" },
  { id:"finance_4", channel:"財經", tag:"全球股市台韓領跑歐洲", color:"#D4A838", en:"The AI boom has triggered a historic reshuffling of global equity market rankings, with Taiwan and South Korea overtaking European nations one by one. Taiwan now ranks fifth globally by market cap, surpassing the UK. South Korea has similarly climbed past France and Germany. The shift concentrates capital in Asia's AI hardware champions and raises long-term questions about the geographic rebalancing of global financial influence.", zh:"AI熱潮引發全球股市排名歷史性重組，台灣和南韓逐一超越歐洲國家。台灣市值現位居全球第五，超越英國，南韓也同樣躍過法國和德國。這一轉變使資本集中於亞洲AI硬體龍頭，並引發關於全球金融影響力地理再平衡的長期問題。", ja:"AIブームが世界の株式市場ランキングの歴史的な再編を引き起こし台湾と韓国が欧州諸国を次々と追い抜いた。台湾は時価総額で世界5位となり英国を上回った。韓国もフランスとドイツを追い越した。この変化はアジアのAIハードウェアチャンピオンに資本を集中させ世界の金融的影響力の地理的再均衡について長期的な問いを提起している。", url:"https://gfmag.com/emerging-frontier-markets/taiwan-powering-ahead/" },

  { id:"sports_0", channel:"運動", tag:"台灣田徑公開賽改名復活", color:"#4A90D9", en:"The 2026 Taiwan Athletics Open, initially canceled due to a legislative budget freeze, will be revived under the new name 'New Taipei City Athletics Open 2026' and held on June 6-7 at Banqiao Stadium. The Ministry of Sports announced it will provide funding through the Sports Development Fund. The event is expected to draw top Taiwanese track and field athletes and regional competitors from East Asia.", zh:"原因立法院預算凍結而宣告取消的2026年台灣田徑公開賽，將以「2026新北市田徑公開賽」的新名稱復活，於6月6至7日在板橋體育場舉行。體育署宣布將透過運動發展基金提供經費，賽事預計吸引台灣頂尖田徑選手及來自東亞的地區競爭者參與。", ja:"立法府の予算凍結による中止が発表されていた2026年台湾陸上競技オープンが新名称「2026新北市陸上競技オープン」として復活し6月6〜7日に板橋スタジアムで開催される。体育省がスポーツ開発基金からの資金提供を発表した。台湾のトップ陸上競技選手と東アジアの地域競争者を集めることが期待されている。", url:"https://focustaiwan.tw/sports/202604130021" },
  { id:"sports_1", channel:"運動", tag:"陳念琴奪亞洲菁英拳擊金", color:"#4A90D9", en:"Taiwan's 'boxing queen' Chen Nien-chin won gold in the women's 65kg division at the Asian Boxing Elite Championships in Ulaanbaatar, Mongolia, securing Taiwan's first gold medal in that weight class at the tournament. Chen, a two-time World Champion, has dominated Asian competition for five consecutive years. Her victory strengthens Taiwan's Olympic boxing program ahead of the Los Angeles 2028 Games.", zh:"台灣「拳擊女王」陳念琴在烏蘭巴托舉行的亞洲菁英拳擊錦標賽女子65公斤級決賽奪金，為台灣拿下該體重級別的首面金牌。兩屆世界冠軍陳念琴已連續五年稱霸亞洲競技，她的勝利強化了台灣邁向2028年洛杉磯奧運的拳擊備戰計畫。", ja:"台湾の「ボクシングクイーン」陳念琴がモンゴルのウランバートルで開催されたアジア精鋭ボクシング選手権の女子65kg級決勝で金メダルを獲得しこの大会での台湾初の同体重クラスでの金メダルを確保した。2度の世界チャンピオンである陳念琴は5年連続でアジア競技を制しており彼女の勝利は2028年ロサンゼルス五輪に向けた台湾のボクシングプログラムを強化する。", url:"https://www.taipeitimes.com/News/sport/archives/2026/04/13/2003855498" },
  { id:"sports_2", channel:"運動", tag:"周天成羽亞賽摘銅", color:"#4A90D9", en:"Taiwan's top male shuttler Chou Tien-chen claimed a bronze medal at the Badminton Asia Championships in Ningbo after a straight-game loss to China's world No. 2 Shi Yuqi in the men's singles semi-finals. The result extends Chou's remarkable consistency at the elite level — this is his second bronze at the Asia Championships. Taiwan's overall badminton delegation was praised for its depth.", zh:"台灣一哥周天成在寧波舉行的羽毛球亞洲錦標賽男子單打半決賽以直落兩局負於世界排名第二的中國選手石宇奇，摘下銅牌。這一成績延續了周天成在頂尖賽事中的非凡穩定性——這是他在亞錦賽的第二面銅牌。台灣整體羽球代表隊的深度也獲得好評。", ja:"台湾のトップシャトラー周天成が寧波で開催されたバドミントンアジア選手権の男子シングルス準決勝でスト負けを喫し銅メダルを獲得した。この結果は周天成の第2のアジア選手権での銅メダルとなり彼のトップレベルでの素晴らしい安定性を示した。台湾の全体的なバドミントン選手団の厚さも評価された。", url:"https://focustaiwan.tw/sports/202604130021" },
  { id:"sports_3", channel:"運動", tag:"NBA季後賽G5高潮迭起", color:"#4A90D9", en:"The 2026 NBA Playoffs Conference Quarterfinals continue through this week with multiple Game 4 and 5 matchups — Oklahoma City Thunder vs Phoenix Suns and Minnesota Timberwolves vs Denver Nuggets among the most-watched series. The NBA also officially announced the 2025-26 Rookie of the Year, Defensive Player of the Year, and Coach of the Year awards this week ahead of the Conference Semifinals.", zh:"2026年NBA季後賽分區準決賽本週繼續進行多場G4和G5，奧克拉荷馬雷霆對鳳凰城太陽以及明尼蘇達灰狼對丹佛金塊是收視最高的系列賽。NBA本週也正式公布2025-26賽季最佳新秀、最佳防守球員及最佳教練獎項，為即將到來的分區半決賽鋪墊。", ja:"2026年NBAプレーオフのカンファレンスクォーターファイナルが今週も複数のゲーム4とゲーム5で継続している。オクラホマシティ・サンダー対フェニックス・サンズとミネソタ・ティンバーウルブズ対デンバー・ナゲッツが最も視聴されているシリーズの一つ。NBAはカンファレンスセミファイナルに向け今週2025-26シーズンの最優秀新人賞・最優秀守備選手賞・最優秀コーチ賞も公式発表した。", url:"https://awfulannouncing.com/viewing-picks/april-27-2026-watch-nba-playoffs.html" },
  { id:"sports_4", channel:"運動", tag:"世界盃45天倒計時全隊備戰", color:"#4A90D9", en:"The 2026 FIFA World Cup — hosted across the US, Canada, and Mexico — is exactly 45 days away. All 48 national teams have confirmed rosters and entered final preparation camps. Record broadcast rights deals in Asia and Europe point to FIFA's projection of 6 billion cumulative viewers being achievable. The tournament opener at MetLife Stadium, New Jersey is generating unprecedented pre-sale demand.", zh:"由美國、加拿大和墨西哥聯合主辦的2026 FIFA世界盃距今整整45天。48支國家隊均已確認陣容，進入最終備戰集訓。亞洲和歐洲創紀錄的轉播版權協議顯示FIFA預測60億累計觀看人次的目標具有可行性。在新澤西州MetLife體育場舉行的揭幕戰已引發空前的預售需求。", ja:"米国・カナダ・メキシコが共同開催する2026 FIFAワールドカップが今からちょうど45日後に開幕する。48の全国代表チームが陣容を確認し最終準備キャンプに入った。アジアと欧州での記録的な放映権取引はFIFAの60億人の累積視聴者予測が達成可能であることを示している。ニュージャージー州メットライフスタジアムでの開幕戦は前例のない先行販売需要を生み出している。", url:"https://www.foxsports.com/soccer/fifa-world-cup/news" },

const DESIGN_CARDS = [
  { id:"design_0", channel:"設計", tag:"AIA 2026建築大會今日開幕", color:"#E8786A", en:"The AIA Conference on Architecture & Design 2026 opens today, April 29, in a hybrid virtual and in-person format, with the central theme of how emerging economic and climate trends are reshaping architectural practice. Featured sessions examine AI integration in design workflows, net-zero building standards, and the evolving role of the architect in an era of autonomous construction systems.", zh:"2026年美國建築師協會建築與設計大會今日4月29日以實體結合線上的混合形式開幕，核心主題是新興經濟與氣候趨勢如何重塑建築實踐。特色議題涵蓋AI整合設計工作流程、淨零建築標準，以及在自動化建造系統時代建築師角色的演變。", ja:"AIA建築・デザイン会議2026が今日4月29日にハイブリッドのバーチャルと対面形式で開幕し、新興の経済・気候トレンドが建築実務をどのように再形成しているかを中心テーマとする。設計ワークフローへのAI統合・ネットゼロ建築基準・自律建設システム時代における建築家の進化する役割を検討するセッションが特集されている。", url:"https://www.aia.org/community/events/aia-conference-architecture-design-2026" },
  { id:"design_1", channel:"設計", tag:"Salone閉幕材料倫理成主調", color:"#E8786A", en:"Salone del Mobile 2026 (April 21-26, Milan) concluded with material ethics as the defining theme of contemporary commercial design. For the first time, recycled, bio-based, and traceable material systems were the default rather than a premium niche. EuroCucina 2026 featured biophilic kitchen environments where technology is softened by living materials and tactile warmth — a direct response to the cold minimalism that defined the previous decade.", zh:"2026年米蘭傢俱展（4月21至26日）以材料倫理作為當代商業設計的決定性主題收官。再生、生物基與可追溯材料系統首次成為預設而非高價利基。EuroCucina 2026呈現以活性材料與觸感溫暖軟化科技感的生物親和廚房環境，是對過去十年主導設計圈冷峻極簡主義的直接回應。", ja:"Salone del Mobile 2026（4月21〜26日、ミラノ）が素材倫理を現代商業デザインの決定的なテーマとして幕を閉じた。再生・バイオベース・トレーサブルな素材システムが初めてプレミアムなニッチではなくデフォルトとなった。EuroCucina 2026は生きた素材と触感の温かさで技術を和らげるバイオフィリックなキッチン環境を特集し過去十年を定義したコールドなミニマリズムへの直接的な回答となった。", url:"https://parametric-architecture.com/architecture-and-design-events-2026/" },
  { id:"design_2", channel:"設計", tag:"蒙特婁設計週開幕UNESCO週年", color:"#E8786A", en:"Montreal Design Week opened yesterday, April 28, coinciding with the 20th anniversary of Montreal's UNESCO City of Design designation. The inaugural 10-day event (April 28 to May 7) spans studio open houses, public installations, and design forums citywide. The program is expected to attract over 50,000 visitors and position Montreal as a permanent fixture on the global design calendar alongside Milan, London, and Tokyo.", zh:"蒙特婁設計週昨日4月28日開幕，恰逢蒙特婁獲UNESCO設計之都認定20週年。首屆10天活動（4月28日至5月7日）橫跨全市工作室、公共裝置與設計論壇，預計吸引逾50,000名訪客，將蒙特婁確立為與米蘭、倫敦、東京並列的全球設計日曆永久席次。", ja:"モントリオールデザインウィークが昨日4月28日にモントリオールのユネスコデザイン都市指定20周年と重なって開幕した。初開催の10日間イベント（4月28日〜5月7日）は市全体のスタジオオープンハウス・公共インスタレーション・デザインフォーラムにわたる。5万人超の来場者を集めミラノ・ロンドン・東京と並ぶグローバルデザインカレンダーの恒久的な拠点としてモントリオールを確立することが期待されている。", url:"https://parametric-architecture.com/architecture-and-design-events-2026/" },
  { id:"design_3", channel:"設計", tag:"高點市場永續採購成強制標準", color:"#E8786A", en:"High Point Market (April 25-29, North Carolina) — the world's largest furniture trade show — wraps up today with sustainability as the overriding commercial theme. For the first time, sustainable sourcing and circular design principles have shifted from aspirational marketing language to binding procurement contracts. Buyers are formally requiring environmental accountability from suppliers that was optional as recently as 2024.", zh:"全球最大傢具業貿易展高點市場（4月25至29日，北卡羅萊納州）今日收官，永續發展成為壓倒性的商業主題。永續採購和循環設計原則首次從理想化的行銷語言大規模轉向具有約束力的採購合約，買方現在正式要求供應商履行在2024年前仍屬自願的環境問責義務。", ja:"世界最大の家具業界見本市ハイポイントマーケット（4月25〜29日、ノースカロライナ州）が本日持続可能性を圧倒的な商業テーマとして幕を閉じる。持続可能な調達と循環型デザインの原則が初めて大規模に理想的なマーケティング用語から拘束力のある調達契約へと移行した。2024年までオプションだった環境的説明責任をバイヤーがサプライヤーに正式に要求するようになっている。", url:"https://www.dezeen.com/eventsguide/" },
  { id:"design_4", channel:"設計", tag:"AI設計工具進入標準工作流", color:"#E8786A", en:"Gensler's 2026 Architecture and Design Trends Report confirms AI has become an embedded component of standard design workflows — no longer an experimental novelty. AI tools are now routinely used for generative massing studies, material simulation, structural optimization, and client presentation generation. The shift is fueling an ongoing industry debate about authorship, originality, and what constitutes genuine design expertise.", zh:"根斯勒2026年建築與設計趨勢報告確認AI已成為標準設計工作流程的嵌入式元件，不再是實驗性新奇事物。AI工具現在被常規用於生成式量體研究、材料模擬、結構優化與客戶簡報生成，這一轉變正在助長業界關於作者身份、原創性以及什麼構成真正設計專業素養的持續辯論。", ja:"Genslerの2026年建築・デザイントレンドレポートがAIが標準的なデザインワークフローの組み込みコンポーネントとなり実験的な新奇さではなくなったことを確認した。AI ツールはジェネレーティブマッシングスタディ・材料シミュレーション・構造最適化・クライアントプレゼンテーション生成に日常的に使用されている。この転換は著作権・独創性・真の設計専門性を構成するものについての業界内の継続的な議論を促進している。", url:"https://www.gensler.com/6-trends-shaping-design-in-2026" },

const FOOD_CARDS = [
  { id:"food_0", channel:"餐飲", tag:"發酵成主廚基本技法", color:"#6DB56D", en:"Fermentation has become a baseline expectation at restaurants seeking Michelin recognition in 2026, according to Michelin Guide inspectors. Chefs are using fermentation to extend short growing seasons, preserve seasonal abundance, reduce waste, and add complex umami depth that is difficult to replicate with fresh ingredients alone. The technique has migrated from avant-garde tasting menus to everyday mid-range restaurants.", zh:"根據米其林指南調查員，2026年發酵已成為尋求米其林認可的餐廳的基本預期。主廚們使用發酵技術延長短暫的生長季節、保存季節性食材、減少浪費，並添加難以單靠新鮮食材複製的複雜鮮味深度。這一技法已從前衛品鑑菜單遷移到日常中端餐廳。", ja:"2026年にミシュランの認定を求めるレストランでは発酵がベースラインの期待値となっていると、ミシュランガイドの調査員が語る。シェフは発酵を使って短い生育期間を延長し旬の食材の豊富さを保存し廃棄物を減らし生鮮食材だけでは複製しにくい複雑なうまみの深さを加えている。このテクニックはアバンギャルドのテイスティングメニューから日常的なミッドレンジのレストランへと移行した。", url:"https://guide.michelin.com/us/en/article/travel/top-food-trends-2026-michelin-guide-inspectors" },
  { id:"food_1", channel:"餐飲", tag:"曼谷吸引頂廚建立據點", color:"#6DB56D", en:"Bangkok has cemented its status as one of the world's most exciting fine dining cities in 2026, with Michelin-starred chefs from Europe choosing it over Paris, New York, and Tokyo for new flagship openings. Recent arrivals include Duet by David Toutain, Sartoria by Paulo Airaudo, Belén by Paulo Airaudo, and Cannubi by Umberto Bombana. Bangkok's combination of exceptional local produce, lower operating costs, and a sophisticated dining public is driving the wave.", zh:"曼谷已在2026年鞏固其全球最令人振奮的精緻餐飲城市之一的地位，米其林星級主廚紛紛選擇曼谷而非巴黎、紐約和東京開設新旗艦餐廳。近期新開包括David Toutain的Duet、Paulo Airaudo的Sartoria與Belén，以及Umberto Bombana的Cannubi。曼谷優秀的在地食材、較低的運營成本和成熟的餐飲消費群體正在推動這波浪潮。", ja:"バンコクが2026年に世界で最も刺激的なファインダイニングシティの一つとしての地位を固め欧州のミシュランスターシェフたちがパリ・ニューヨーク・東京よりバンコクを新旗艦オープンに選んでいる。最近の新規開店にはDavid ToutainによるDuet・Paulo AiraudioによるSartoriaとBelén・Umberto BombanaによるCannu​biが含まれる。バンコクの優れた地元食材・低い運営コスト・洗練された食の愛好家の組み合わせがこの波を牽引している。", url:"https://guide.michelin.com/us/en/article/travel/top-food-trends-2026-michelin-guide-inspectors" },
  { id:"food_2", channel:"餐飲", tag:"高端印度菜重新定義精緻餐飲", color:"#6DB56D", en:"High-end Indian restaurants are redefining fine dining globally in 2026, with tasting menus that showcase the complexity and regional artistry of Indian cuisine. Indian chefs are earning Michelin stars in London, New York, and Singapore at an accelerating rate, while the James Beard Foundation has recognized Indian cuisine as one of the defining culinary forces of the decade. The movement challenges long-standing Eurocentric assumptions about what constitutes haute cuisine.", zh:"2026年高端印度餐廳正在全球重新定義精緻餐飲，以品鑑菜單展示印度菜系的複雜性與地區藝術性。印度主廚在倫敦、紐約和新加坡以加速度摘得米其林星，而詹姆士鬍子基金會也將印度菜肴評選為本十年決定性的烹飪力量之一，這一運動正在挑戰長久以來關於什麼構成高級菜肴的歐洲中心主義假設。", ja:"2026年にインドの高級レストランが世界的にファインダイニングを再定義しインド料理の複雑さと地域の芸術性を披露するテイスティングメニューを提供している。インドのシェフがロンドン・ニューヨーク・シンガポールで加速度的にミシュランスターを獲得しているとともにジェームズ・ビアード財団がインド料理を今十年の決定的な料理的力の一つとして認めた。この動きは高級料理を構成するものについての長年のヨーロッパ中心主義的な前提に挑戦している。", url:"https://www.jamesbeard.org/stories/top-restaurant-food-trends-2026" },
  { id:"food_3", channel:"餐飲", tag:"明火料理桌邊儀式感復興", color:"#6DB56D", en:"Live-fire cooking — open flames, wood embers, binchotan charcoal, and hot stones — has become the signature differentiator at premium restaurants in 2026. Michelin inspectors identify it as the technique most consistently associated with exceptional dining globally. Chefs are also reviving tableside preparation to make the cooking process theatrical and visible — reclaiming the ritual dimension of dining that was stripped out during the minimalist era.", zh:"明火料理——明火、木炭餘燼、備長炭和熱石——已成為2026年高端餐廳的標誌性差異化技術。米其林調查員認定它是全球最一致地與卓越用餐體驗相關的技術。主廚們也在復興桌邊料理，讓烹飪過程充滿戲劇感和可見性——重拾在極簡主義時代被剝離的餐飲儀式維度。", ja:"直火料理——オープンフレーム・木の炭・備長炭・熱石——が2026年のプレミアムレストランでのシグネチャーディファレンシエーターとなった。ミシュランの調査員はそれを世界的に卓越した食事体験に最も一貫して関連付けられるテクニックとして特定している。シェフたちはまた料理プロセスを演劇的で可視的にするためにテーブルサイドの準備を復活させ、ミニマリストの時代に取り除かれた食事の儀式的な次元を取り戻している。", url:"https://guide.michelin.com/us/en/article/travel/top-food-trends-2026-michelin-guide-inspectors" },
  { id:"food_4", channel:"餐飲", tag:"蘑菇升格為餐盤主角", color:"#6DB56D", en:"Mushrooms have emerged as one of 2026's most significant fine dining ingredients, shifting from supporting garnish to plate centerpiece. Michelin inspectors and National Geographic's 2026 food trend report both identify mushrooms as the most versatile and culturally resonant ingredient driving menus this year. Chefs are exploring umami depth through aging, dehydrating, and fermenting mushroom varieties rarely seen outside specialist foraging communities.", zh:"蘑菇已成為2026年最重要的精緻餐飲食材之一，從配菜升格為餐盤主角。米其林調查員和《國家地理》2026年食物趨勢報告都將蘑菇認定為今年推動菜單的最具多功能性和文化共鳴的食材。主廚們正透過陳化、脫水和發酵在專業採集社群之外鮮見的各種蘑菇品種來探索鮮味深度。", ja:"キノコが2026年の最も重要なファインダイニング食材の一つとして浮上し脇役のガーニッシュから皿の主役へと移行した。ミシュランの調査員とナショナルジオグラフィックの2026年食のトレンドレポートは共にキノコを今年メニューを牽引する最も多用途で文化的な共鳴を持つ食材として特定している。シェフたちは専門的な採集コミュニティ以外ではほとんど見られないキノコの品種を熟成・乾燥・発酵させてうまみの深さを探求している。", url:"https://www.nationalgeographic.com/travel/article/the-biggest-food-trends-for-2026" },
];\n

const TECH_CARDS = [
  { id:"tech_0", channel:"科技", tag:"OpenAI年化營收破250億", color:"#5B8ED6", en:"OpenAI has surpassed $25 billion in annualized revenue as of April 2026, up from $3.4 billion in 2024 — a more than 7x increase in under two years. The company is reportedly taking early steps toward a public listing, potentially as soon as late 2026. The growth reflects explosive enterprise adoption of GPT-5 series models and API-based agentic workflow integrations across the Fortune 500.", zh:"截至2026年4月，OpenAI年化營收已突破250億美元，相較2024年的34億美元增長逾7倍，不到兩年。該公司據報正在為最早於2026年底的公開上市採取初步行動。這一增長反映了GPT-5系列模型和基於API的代理工作流程整合在財富500強企業中的爆炸性採用。", ja:"2026年4月時点でOpenAIの年換算収益が250億ドルを突破し2024年の34億ドルから2年足らずで7倍以上に増加した。同社は早ければ2026年末にも上場するための初期手順を踏んでいると報じられている。この成長はGPT-5シリーズのモデルとAPIベースのエージェントワークフロー統合がフォーチュン500企業全体で爆発的に採用されていることを反映している。", url:"https://www.aiandnews.com/blog/april-2026-ai-news/" },
  { id:"tech_1", channel:"科技", tag:"Microsoft開源AI治理工具包", color:"#5B8ED6", en:"Microsoft shipped its Agent Governance Toolkit this week — a seven-package open-source system for governing autonomous AI agents, freely available on GitHub and PyPI. The toolkit addresses enterprise compliance barriers to agentic AI deployment by providing audit trails, access controls, and behavioral guardrails. Analysts see this as a strategic move to accelerate Azure AI adoption by removing the governance gap that has slowed enterprise agentic deployments.", zh:"微軟本週發布Agent治理工具包——一個用於管理自主AI代理的七套件開源系統，可在GitHub和PyPI上免費取得。此工具包通過提供審計追蹤、存取控制和行為護欄，解決企業部署AI代理時的合規障礙。分析師將此視為微軟的戰略舉措，通過填補阻礙企業代理部署的治理空白來加速Azure AI的採用。", ja:"Microsoftが今週エージェントガバナンスツールキットをリリースした。GitHubとPyPIで無料で利用できる自律AIエージェントを管理するための7パッケージのオープンソースシステムだ。このツールキットは監査証跡・アクセス制御・行動ガードレールを提供することでエージェントAI展開に対する企業のコンプライアンス障壁に対処する。アナリストはこれをエンタープライズのエージェント展開を遅らせていたガバナンスギャップを埋めることでAzure AIの採用を加速するための戦略的な動きと見ている。", url:"https://blog.mean.ceo/ai-product-launches-news-april-2026/" },

  { id:"tech_3", channel:"科技", tag:"Amazon OpenSearch加入代理記憶", color:"#5B8ED6", en:"Amazon added agentic features to its OpenSearch Service this week, including an Investigation Agent and Agentic Memory that let developers automate observability workflows without additional infrastructure. The update allows OpenSearch to autonomously diagnose anomalies, correlate logs and metrics, and generate remediation suggestions. AWS positions the update as part of its broader strategy to embed AI agents as a native layer across all enterprise cloud services.", zh:"亞馬遜本週為其OpenSearch服務新增代理功能，包括Investigation Agent和代理記憶，讓開發者無需額外基礎設施即可自動化可觀測性工作流程。此更新允許OpenSearch自主診斷異常、關聯日誌和指標，並生成修復建議。AWS將此次更新定位為其在所有企業雲服務中將AI代理嵌入為原生層的更廣泛策略的一部分。", ja:"Amazonが今週OpenSearchサービスにInvestigation AgentとAgentic Memoryを含むエージェント機能を追加し追加インフラなしでオブザーバビリティワークフローを自動化できるようにした。このアップデートによりOpenSearchが異常を自律的に診断しログとメトリクスを相関させ修復提案を生成できるようになった。AWSはこのアップデートをすべてのエンタープライズクラウドサービスにわたってAIエージェントをネイティブレイヤーとして組み込むという広範な戦略の一部として位置づけている。", url:"https://blog.mean.ceo/ai-product-launches-news-april-2026/" },

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getTodaySeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

function seededShuffle(arr, seed) {
  const a = [...arr];
  let s = seed >>> 0;
  const rand = () => {
    s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
    return (s >>> 0) / 4294967296;
  };
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>

function CardView({ card, idx, total }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;
  const text = lang === "ja" ? (card.ja || card.zh) : card.zh;

  const speakWord = React.useCallback(async (word) => {
    const ok = await azureSpeak(word, { rate:'-15%' });
    if (!ok) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US"; u.rate = 0.82;
      const voices = speechSynthesis.getVoices();
      const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
      if (picked) u.voice = picked;
      speechSynthesis.speak(u);
    }
  }, []);

  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      return;
    }
    setSpeaking(true);
    const ok = await azureSpeak(card.en, {
      rate: '-5%',
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
    if (!ok) {
      const u = new SpeechSynthesisUtterance(card.en);
      u.lang = "en-US"; u.rate = 0.88; u.pitch = 1.0; u.volume = 1.0;
      const tryVoices = () => {
        const voices = speechSynthesis.getVoices();
        const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
        if (picked) u.voice = picked;
      };
      if (speechSynthesis.getVoices().length > 0) tryVoices();
      else { speechSynthesis.onvoiceschanged = () => { tryVoices(); speechSynthesis.onvoiceschanged = null; }; }
      u.onend = () => setSpeaking(false);
      u.onerror = () => setSpeaking(false);
      speechSynthesis.speak(u);
    }
  }, [card.en, speaking]);

  // Stop speaking & close popup when card changes
  React.useEffect(() => {
    return () => {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀全文"} style={{ marginLeft:"auto" }}>{speaking ? "■" : "🔊"}</button>
      </div>
      <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"20px", lineHeight:1.75, color:"var(--text)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"15px", lineHeight:1.9, color:"var(--text-secondary)", margin:0, maxWidth:"46ch", fontWeight:300 }}>{text}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("zh"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="zh" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="zh" ? "close ↑" : "中文 ↓"}</span>

        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />

      </div>

  );
}

function App() {
  const [activeTab, setActiveTab] = useState("Today");
  const [todaySub, setTodaySub] = useState("全部");
  const [bookSub, setBookSub] = useState("Dan Koe");
  const [bookSeed, setBookSeed] = useState(() => getTodaySeed());
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (activeTab === "Bookshelf") {
      const channelCards = BOOK_CARDS.filter(c => c.channel === bookSub);
      const channelHash = bookSub.split('').reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 0);
      return seededShuffle(channelCards, (bookSeed ^ channelHash) >>> 0).slice(0, 2);
    }
    if (todaySub === "世界新聞") return NEWS_CARDS;
    if (todaySub === "社交雷達") return SOCIAL_CARDS;
    if (todaySub === "財經") return FINANCE_CARDS;
    if (todaySub === "運動") return SPORTS_CARDS;
    if (todaySub === "設計") return DESIGN_CARDS;
    if (todaySub === "餐飲") return FOOD_CARDS;
    if (todaySub === "科技") return TECH_CARDS;
    return TODAY_CARDS;
  }, [activeTab, todaySub, bookSub, bookSeed]);

  const total = cards.length;
  const atEnd = idx >= total;

  const [resumeMsg, setResumeMsg] = useState(null);
  const lsKey = activeTab === "Bookshelf"
    ? "mosfeed_Bookshelf_" + bookSub
    : "mosfeed_" + activeTab + "_" + todaySub;

  // Read localStorage on tab/sub change
  React.useEffect(() => {
    const key = activeTab === "Bookshelf"
      ? "mosfeed_Bookshelf_" + bookSub
      : "mosfeed_" + activeTab + "_" + todaySub;
    try {
      const saved = parseInt(localStorage.getItem(key), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [activeTab, todaySub, bookSub]);

  // Reset on shuffle
  React.useEffect(() => {
    if (bookSeed !== getTodaySeed()) { setIdx(0); setDir(0); try { localStorage.removeItem("mosfeed_Bookshelf_" + bookSub); } catch(e) {} }
  }, [bookSeed]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") go(idx + 1);
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(idx - 1);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 04/29/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v2.29</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            {TABS.map(tab => {
              const isActive = activeTab === tab;
              return (
                <button key={tab} onClick={() => { setActiveTab(tab); setTodaySub("全部"); setBookSub("Dan Koe"); }}
                  style={{ fontSize:isActive?"26px":"15px", fontWeight:isActive?600:400, fontStyle:isActive?"normal":"italic", color:isActive?"var(--text)":"var(--text-tertiary)", letterSpacing:isActive?"-0.01em":"0" }}>
                  {tab}
                </button>
              );
            })}
          </div>
        </div>
        {activeTab === "Today" && (
          <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
            {TODAY_SUBS.map(sub => (
              <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
                style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
                {sub}
              </button>
            ))}
          </div>
        )}
        {activeTab === "Bookshelf" && (
          <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
            {BOOK_SUBS.map(sub => (
              <button key={sub} className="sub-pill" onClick={() => { setBookSub(sub); setIdx(0); }}
                style={{ color:bookSub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:bookSub===sub?"var(--text-secondary)":"transparent", opacity:bookSub===sub?1:0.6 }}>
                {sub}
              </button>
            ))}
          </div>
        )}
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
      >
        {atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen
              onPrev={() => go(total - 1)}
              onShuffle={() => setBookSeed(Date.now())}
              isBookshelf={activeTab === "Bookshelf"}
            />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id + "-" + bookSeed} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} />
          </div>
        )}
      </div>

      {/* Nav bar */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => go(idx - 1)} disabled={idx === 0}>←</button>
        <span className="nav-count">{atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn" onClick={() => go(idx + 1)} disabled={atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
