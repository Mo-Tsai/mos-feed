<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "升息隔日反彈", "color": "#E05C5C", "zh": "聯準會升息隔天，美股把前一日的失血補了回來：標普 500 上漲 0.59% 收在 7,596 點，那斯達克漲幅更大，週三被打到 51,461.90 點的道瓊也止穩。推動反彈的不是新的好消息，而是兩個舊壓力同時鬆開——油價連兩天下跌、十年期公債殖利率從 2007 年以來的最高點回落並中止八連漲。要注意的是這是一場「利率預期退燒」帶來的反彈，不是基本面轉好；只要下一筆通膨數據不配合，同一批買盤也會用同樣速度撤走。", "en": "A day after the Fed's hike, US stocks recovered what they lost: the S&P 500 rose 0.59% to about 7,596 and the Nasdaq gained more, while the Dow steadied after Wednesday's close at 51,461.90. The rebound came not from new good news but from two old pressures easing at once — oil fell for a second session and the 10-year Treasury yield backed off its highest level since 2007, snapping an eight-day rising streak. This was a rally driven by cooling rate expectations rather than improving fundamentals; if the next inflation print disappoints, the same buyers can leave just as fast.", "url": "https://www.cnbc.com/2026/09/16/stock-market-today-live-updates.html", "stocks": [{"t": "SPY", "n": "標普 500 ETF，指數漲 0.59% 收 7,596 點"}, {"t": "QQQ", "n": "那斯達克 100 ETF，科技股領漲這波回補"}, {"t": "SOXX", "n": "半導體 ETF，對應費半當日 +3% 的領漲角色"}]},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "費半 +3%", "color": "#E05C5C", "zh": "當日最強的一段是半導體：費城半導體指數盤中一度上漲 3%，由英特爾、Arm、邁威爾與美光帶頭。這批股票的共同點是前一天被利率恐慌殺得最兇——它們的評價最依賴遠期現金流折現，殖利率一回落就彈得最快。ON 半導體同日上調長期展望，把年營收成長目標拉到 12% 到 14%，並預期 AI 資料中心營收 2027 年翻倍到 10 億美元、2030 年達 25 億，給了這段反彈一個基本面理由。反方看法是：一天的殖利率回落救不了一個要靠三年後現金流撐住的評價。", "en": "The strongest leg of the day was semiconductors: the SOX index rose as much as 3%, led by Intel, Arm, Marvell and Micron. These are the same names hit hardest by the prior day's rate scare, since their valuations lean most on discounted future cash flows and they bounce fastest when yields retreat. ON Semiconductor raised its long-term outlook the same day, lifting its annual revenue growth target to 12-14% and guiding AI data-center revenue to double to $1 billion in 2027 and reach $2.5 billion by 2030, giving the move a fundamental anchor. The counterpoint: one day of falling yields does not fix a valuation that depends on cash flows three years out.", "url": "https://investrade.com/market-review-september-17-2026/", "stocks": [{"t": "INTC", "n": "費半領漲成員之一，前一日跌幅也在前段"}, {"t": "MRVL", "n": "資料中心客製晶片，與 AI 資本支出高度連動"}, {"t": "ARM", "n": "授權模式評價最吃遠期折現，殖利率回落受惠最大"}]},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "殖利率轉折", "color": "#E05C5C", "zh": "債市才是這兩天的主角。兩年期公債殖利率一度衝到 4.744%，是 2024 年 7 月以來最高；十年期則在 5% 附近，來到 2007 年以來的高檔區，但週四終於中止連續八個交易日的上漲。短天期比長天期漲得更兇，代表市場定價的是「聯準會還會再升」，而不是「長期通膨失控」。這條曲線的形狀決定了接下來誰難過：短端利率直接壓浮動利率借款人與小型股，長端則壓房貸與所有以現金流折現定價的資產。", "en": "The bond market was the real story. The two-year Treasury yield touched 4.744%, its highest since July 2024, while the 10-year sat near 5%, its highest zone since 2007 — though Thursday finally snapped an eight-session rising streak. Short yields rose faster than long ones, meaning the market is pricing more Fed hikes rather than runaway long-term inflation. The shape of that curve decides who hurts next: short rates hit floating-rate borrowers and small caps directly, while long rates weigh on mortgages and every asset priced off discounted cash flow.", "url": "https://investrade.com/mid-morning-look-september-17-2026/", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，十年期殖利率近 5% 的直接對照"}, {"t": "IEF", "n": "7-10 年期公債 ETF，反映中段殖利率八連漲後的回落"}, {"t": "SHY", "n": "1-3 年期公債 ETF，兩年期 4.744% 是升息預期最純的讀數"}]},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "油價回落", "color": "#E05C5C", "zh": "布蘭特原油在 9 月 17 日跌向每桶 104 美元，是連續第二個交易日下跌，觸發點是沙烏地阿拉伯傳出計畫恢復東西向輸油管的輸送能力。這件事的意義在於「繞道」——荷姆茲海峽幾乎全面封閉已經進入第七個月，市場不指望海峽重開，只能寄望陸上管線把紅海這一側的出口補回來。但同一週稍早布蘭特還在 109 美元，9 月 11 日東西向輸油管停擺曾造成全球貿易量三成以上的中斷。能源股當天落後大盤，是這波反彈裡少數翻黑的板塊。", "en": "Brent crude slid toward $104 a barrel on Sept. 17, a second straight down session, after reports that Saudi Arabia plans to restore capacity on its East-West pipeline. The significance is the workaround: with the Strait of Hormuz almost entirely closed for a seventh month, nobody expects the strait to reopen — the hope is that overland pipelines can restore exports on the Red Sea side. Yet Brent was near $109 earlier the same week, and the Sept. 11 East-West pipeline shutdown disrupted a large share of global crude trade. Energy stocks lagged the market that day, one of the few sectors to finish lower.", "url": "https://www.cnbc.com/2026/09/09/oil-prices-today-wti-brent-us-iran-hormuz-attacks.html", "stocks": [{"t": "USO", "n": "原油 ETF，布蘭特跌向 104 美元的直接對照"}, {"t": "XLE", "n": "能源類股 ETF，當日落後大盤、是少數翻黑板塊"}, {"t": "VLO", "n": "煉油商，原料成本與裂解價差同時受管線復運影響"}]},
    {"id": "earn_0", "channel": "財報速報", "tag": "建商下修", "color": "#E8786A", "zh": "Lennar 的第三季財報是這週最難看的一份：每股盈餘 1.19 美元，不如市場預期的 1.28 美元，淨利 2.84 億美元，比去年同期的 5.91 億腰斬；營收 80.5 億美元、年減 8.7%，全年交屋目標從原本水準下修到 8.0 萬到 8.1 萬戶。壞消息不是單季數字，是它在聯準會宣布升息的同一天公布——房貸利率往上、十年期殖利率貼近 5%，建商靠「補貼房貸利率」換來的銷售量會越補越貴。這份財報等於替整個住宅鏈的第四季先打了預防針。", "en": "Lennar's third quarter was the ugliest report of the week: earnings of $1.19 a share missed the $1.28 consensus, net income fell to $284 million from $591 million a year earlier, revenue dropped 8.7% to $8.05 billion, and full-year deliveries were cut to 80,000-81,000 homes. The bad news is not the quarter itself but its timing — it landed the same day the Fed hiked, with mortgage rates rising and the 10-year near 5%. Builders have been buying sales with mortgage-rate buydowns, and that subsidy gets more expensive as rates climb. The report effectively pre-warns the whole housing chain about the fourth quarter.", "url": "https://tradersagency.com/blog/lennar-cuts-2026-delivery-target-to-80000-81000-homes-as-q3-profit-falls-to-dollar284-million", "stocks": [{"t": "LEN", "n": "EPS 1.19 美元不如預期 1.28，全年交屋下修至 8.0-8.1 萬戶"}, {"t": "DHI", "n": "同業龍頭，買房補貼成本與交屋量的對照組"}, {"t": "ITB", "n": "美國住宅建商 ETF，房貸利率上行的板塊出口"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "80 億大單", "color": "#E8786A", "zh": "Generac 與亞馬遜簽下長期供應協議，初期 2027 至 2028 年交付 24 億美元的資料中心備援發電機，整份合約上限可到 80 億美元。更值得看的是交易結構：Generac 發給亞馬遜一張認股權證，可用每股 200.9266 美元買進最多 1,693,745 股，其中 307,954 股立即生效，其餘隨亞馬遜實際付款金額分批生效。股價盤後一度暴漲四成以上，當日收盤漲約 33%。這是把客戶變成股東、把訂單變成行權條件的綁法，等於雙方互相押注 AI 資料中心的用電缺口會持續好幾年。", "en": "Generac signed a long-term supply agreement with Amazon covering $2.4 billion of data-center backup generators for delivery across 2027 and 2028, with the full contract potentially reaching $8 billion. The structure matters more than the number: Generac issued Amazon a warrant for up to 1,693,745 shares at $200.9266, with 307,954 shares vesting immediately and the rest vesting as Amazon's payments accumulate. The stock jumped more than 40% after hours and closed up around 33%. Turning a customer into a shareholder and tying exercise to order flow is a mutual bet that the AI data-center power gap persists for years.", "url": "https://www.sec.gov/Archives/edgar/data/0001474735/000143774926030550/gnrc20260915_8k.htm", "stocks": [{"t": "GNRC", "n": "當日漲約 33%，24 億美元初期訂單、上限 80 億"}, {"t": "AMZN", "n": "取得認股權證最多 169 萬股，履約價 200.93 美元"}, {"t": "VRT", "n": "資料中心電力與散熱同業，同一條需求鏈的對照"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "同日兩樣情", "color": "#E8786A", "zh": "同一天 AI 電力主題出現完全相反的兩張臉：Generac 拿到亞馬遜 80 億美元框架而暴漲，儲能系統商 Fluence Energy 卻下修財測。差別在商業模式——Generac 賣的是「現在就能發電的柴油與天然氣機組」，資料中心等不到電網擴容就先買；Fluence 賣的是電池儲能系統，售價受電芯成本與電網級專案排程牽制，利潤率長期被壓。同一個 AI 用電故事，靠近急單的贏、靠近長專案的輸，這個分岔值得記下來當篩選標準。", "en": "The AI-power theme showed two opposite faces on the same day: Generac surged on an $8 billion Amazon framework while battery-storage integrator Fluence Energy cut guidance. The difference is business model — Generac sells diesel and gas gensets that produce power today, which data centers buy because they cannot wait for grid capacity; Fluence sells grid-scale battery storage, where pricing is squeezed by cell costs and project timelines. Same AI electricity story, but whoever sits closest to urgent orders wins and whoever sits closest to long projects loses. That fork is worth keeping as a screening rule.", "url": "https://gokhshtein.com/news/2026-09-17-generac-rises-33-on-8b-amazon-data-center-deal-fluence-cuts", "stocks": [{"t": "FLNC", "n": "同日下修財測，與 Generac 形成同主題反向對照"}, {"t": "STEM", "n": "儲能軟體與服務商，同樣受電網級專案排程壓縮"}, {"t": "ON", "n": "同日上調長期展望，AI 資料中心營收 2027 年目標翻倍至 10 億美元"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "2023 年來首次升息", "color": "#7C6AF7", "zh": "聯準會 9 月 16 日以 12 比 0 全票通過升息一碼，把政策利率帶到 3.75% 至 4.00%，這是 2023 年以來的第一次升息。主席凱文·華許把理由講得很直白：通膨「太高、而且高太久」，委員會選擇讓通膨如期回到目標，而不是回應外界要求降息的壓力。更關鍵的是點陣圖——多數委員預期年底前至少還有一次升息。對市場來說，這代表「降息循環」這個過去兩年的預設劇本正式作廢，所有靠低利率假設堆出來的估值都要重算一次。", "en": "The Fed voted 12-0 on Sept. 16 to raise rates by a quarter point to 3.75%-4.00%, the first hike since 2023. Chair Kevin Warsh was blunt about the reason: inflation is too high and has been for too long, and the committee chose a timely return to target over external calls for easing. The dot plot mattered more — most participants signalled at least one further hike by year-end. For markets that means the easing-cycle script of the past two years is formally void, and every valuation built on a low-rate assumption has to be recalculated.", "url": "https://www.cnbc.com/2026/09/16/fed-rate-decision-september-2026.html", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，升息循環重啟下的存續期間風險代表"}, {"t": "XLF", "n": "金融類股 ETF，升息對淨利差與信用成本的兩面刃"}, {"t": "GLD", "n": "黃金 ETF，實質利率走高時的傳統逆風資產"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "通膨結構", "color": "#7C6AF7", "zh": "支撐這次升息的數字是：核心 PCE 接近 3.4%，整體通膨向上修正到 3.7%，距離 2% 目標還有一大段。真正麻煩的是通膨的來源已經換人——不是需求太熱，是美伊衝突推升的能源價格。這種成本推動型通膨對升息的反應最差：升息壓不住荷姆茲海峽，卻會實實在在壓垮需要再融資的企業。聯準會等於在用一個對症不準的工具處理一個地緣政治問題，這也是點陣圖裡「還要再升」讓市場特別不安的原因。", "en": "The numbers behind the hike: core PCE near 3.4% and headline inflation revised up to 3.7%, both far from the 2% target. The awkward part is where the inflation now comes from — not overheated demand, but energy prices driven by the US-Iran conflict. Cost-push inflation responds worst to rate hikes: higher rates cannot reopen the Strait of Hormuz, but they will genuinely crush companies that need to refinance. The Fed is applying a poorly matched tool to a geopolitical problem, which is why the dot plot's promise of more hikes unsettles markets so much.", "url": "https://en.wikipedia.org/wiki/Economic_impact_of_the_2026_Iran_war", "stocks": [{"t": "USO", "n": "原油 ETF，本輪通膨的主要推力來源"}, {"t": "XOM", "n": "整合型能源商，油價高檔但當日類股落後"}, {"t": "TIP", "n": "抗通膨債券 ETF，反映市場對長期通膨的定價"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "數據不幫忙", "color": "#7C6AF7", "zh": "週四的經濟數據幾乎是替聯準會背書：初領失業金人數降到 19.6 萬，遠低於市場預期的 20.8 萬與前一週的 20.6 萬，四週移動平均降到 20.325 萬，續領人數降到 173 萬。勞動市場沒有裂痕，就等於聯準會沒有「必須停手」的理由。唯一的反向訊號來自製造業——費城聯儲商業狀況指數從 8 月的 47.4 掉到 37.8，還有房市在房貸利率上行下轉弱。這組合是典型的後期循環：服務業與就業撐著，利率敏感的製造與房市先裂。", "en": "Thursday's data effectively endorsed the Fed: initial jobless claims fell to 196,000, well below the 208,000 consensus and the prior week's 206,000, the four-week average dropped to 203,250 and continuing claims fell to 1.730 million. A labour market with no cracks gives the Fed no reason to stop. The only counter-signal came from manufacturing — the Philadelphia Fed business conditions index fell to 37.8 from 47.4 in August — plus weakening housing as mortgage rates rose. That mix is classic late cycle: services and employment hold up while rate-sensitive manufacturing and housing crack first.", "url": "https://investrade.com/morning-preview-september-17-2026/", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，就業穩、利率高的組合對小型股最不利"}, {"t": "MAN", "n": "人力派遣商，初領失業金 19.6 萬的第一線對照"}, {"t": "XLI", "n": "工業類股 ETF，費城聯儲指數自 47.4 掉到 37.8 的板塊出口"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "認股權證換電力", "color": "#4EABA4", "zh": "一個新的交易結構正在 AI 電力產業成形：科技巨頭不只下訂單，還順手拿供應商的認股權證。甲骨文在 2026 年 4 月入股燃料電池廠 Bloom Energy，亞馬遜這週對 Generac 做了同一件事。對供應商而言，這等於拿到一張「客戶不會跑掉」的保證書，可以放心擴產能；對買方而言，是用未來的股權增值折抵今天的高價採購。這個模式擴散得越廣，代表電力短缺被市場認定為結構性、而不是景氣循環——但它也讓供應商的股東結構與單一客戶深度綁定。", "en": "A new deal structure is spreading through AI power: hyperscalers are not just placing orders, they are taking warrants in their suppliers. Oracle took a stake in fuel-cell maker Bloom Energy in April 2026, and Amazon did the same with Generac this week. For the supplier it is a guarantee the customer will not walk, which makes capacity expansion safe to fund; for the buyer it offsets today's high procurement prices with tomorrow's equity upside. The wider this model spreads, the more the market treats the power shortage as structural rather than cyclical — but it also binds the supplier's shareholder base tightly to one customer.", "url": "https://qz.com/amazon-generac-warrant-backup-generators-data-centers-091726", "stocks": [{"t": "BE", "n": "固態氧化物燃料電池商，2026 年 4 月被甲骨文入股"}, {"t": "ORCL", "n": "最早用入股綁定電力供應商的科技巨頭"}, {"t": "PWR", "n": "電網與電力工程承包商，電力缺口結構化的另一條受惠路徑"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "航運狂潮", "color": "#4EABA4", "zh": "荷姆茲海峽封鎖進入第七個月，運價已經脫離任何歷史區間：中東到中國航線的超大型油輪日收益逼近 80 萬美元的紀錄水準，美灣到亞洲的包船報價達 2,950 萬美元，換算約每桶 15 美元運費，還沒算戰爭險與延誤費。股價反應更誇張——Lloyd's List 追蹤的 35 檔美歐航運股今年上漲約 68%，是標普 500 漲幅的五倍以上，其中原油輪類股年初至今大漲 120%。有意思的是成品油輪沒跟上，中程船型的即期運價仍在歷史區間內，這個分歧本身就是研究題目。", "en": "With the Strait of Hormuz blocked for a seventh month, freight rates have left any historical range: VLCC earnings on the Middle East-to-China route are near a record $800,000 a day, and US Gulf-to-Asia lump-sum fixtures have reached $29.5 million, roughly $15 a barrel before war-risk premiums and delay fees. Equities went further — a basket of 35 US- and European-listed shipping stocks tracked by Lloyd's List is up about 68% this year, more than five times the S&P 500, with crude-tanker names up 120% year to date. Notably product tankers have not kept pace, with medium-range spot rates still inside the historical range, and that divergence is itself a research question.", "url": "https://www.cnbc.com/2026/09/03/shipping-hormuz-tankers-earnings-freight-rates-iran-trump-crude-china-stocks.html", "stocks": [{"t": "FRO", "n": "超大型油輪船東，中東-中國日收益近 80 萬美元的最大受惠者"}, {"t": "DHT", "n": "純 VLCC 船隊，現貨曝險比例高、對運價最敏感"}, {"t": "STNG", "n": "成品油輪龍頭，運價未跟上原油輪的分歧主角"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "銀行論點反轉", "color": "#4EABA4", "zh": "區域銀行今年的多頭論述是「存款成本見頂、淨利差回升」，KRE 今年漲約 9%、一年漲 28%。這次升息把那個論述的前提拆掉了：存款成本不會在聯準會再升的路徑上見頂，反而會重新往上追。更麻煩的是資產端——多家大型區域銀行今年才剛宣布要重新擴張商業不動產放款，理由是「利率下降、信用品質穩定」，現在前半句被推翻了。KRE 採等權重編製，權重小的成員反而商用不動產集中度更高，這讓指數層面的風險比看起來更集中。", "en": "The bull case for regional banks this year was that deposit costs had peaked and net interest margins would widen; KRE is up about 9% year to date and 28% over twelve months. This hike removes the premise: deposit costs do not peak while the Fed is still raising, they chase higher. The asset side is more awkward — several large regionals announced this year that they would expand commercial real estate lending again, citing falling rates and stabilising credit quality, and the first half of that reasoning is now void. Because KRE is equal-weighted, its smaller constituents typically carry heavier CRE concentration, making index-level risk less diversified than it looks.", "url": "https://www.costar.com/article/213919897/regional-banks-went-quiet-on-commercial-property-loans-theyre-turning-up-the-volume-again", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，等權重放大小型成員的商用不動產曝險"}, {"t": "CFG", "n": "大型區域銀行，今年公開表態要重啟商用不動產放款"}, {"t": "XLF", "n": "整體金融 ETF，大型銀行與區域銀行的分化對照"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "浮動利率的代價", "color": "#5B8ED6", "zh": "羅素 2000 在聯準會宣布升息當天下跌 0.71%，隔日的反彈也跟不上那斯達克。這不是情緒問題，是資產負債表結構問題：羅素 2000 成分股裡約 32% 有浮動利率債務，標普 500 只有 6%。升息一碼，對大型股是評價模型裡的一個參數，對三分之一的小型股則是下個月利息支出直接變多。要注意的是，羅素 2000 今年到 9 月初仍有 20.2% 的年初至今漲幅，也就是說這個利空是打在已經漲了一段的價位上，而不是在低基期。", "en": "The Russell 2000 fell 0.71% on the day of the Fed hike and lagged the Nasdaq on the rebound. That is not sentiment, it is balance-sheet structure: roughly 32% of Russell 2000 constituents carry floating-rate debt versus just 6% of the S&P 500. A quarter-point hike is one parameter in a large cap's valuation model, but for a third of small caps it is a higher interest bill next month. Worth noting: the Russell 2000 was still up 20.2% year to date in early September, so this headwind lands on prices that have already run, not on a depressed base.", "url": "https://www.proshares.com/browse-all-insights/insights/is-the-small-cap-slumber-over", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，升息當日跌 0.71%，年初至今仍 +20.2%"}, {"t": "IJR", "n": "標普 600 小型股 ETF，成分要求連續獲利、體質篩選較嚴"}, {"t": "VTWO", "n": "另一檔羅素 2000 ETF，費用率較低的同指數對照"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "AI 記憶體", "color": "#5B8ED6", "zh": "Penguin Solutions 是這輪 AI 基礎建設裡少數真的把數字做出來的小型股：2026 會計年度第三季非 GAAP 每股盈餘 0.84 美元、營收 4.79 億美元，市場原本預期 0.56 美元與 4.214 億美元，差距大到公告後股價漲 24%。AI 相關業務已佔營收 74%、年增 104%，公司把全年營收成長目標上調到 22% 上下、非 GAAP 每股盈餘 2.60 美元。9 月 17 日它在 AI Infra Summit 展出 11TB 的 MemoryAI KV 快取伺服器。要留意的是它已經不算冷門了——分析師共識目標價從 50.14 美元被拉到 74.29 美元，期望值已經跟上來。", "en": "Penguin Solutions is one of the few small caps in this AI infrastructure cycle actually delivering the numbers: fiscal Q3 2026 non-GAAP EPS of $0.84 on $479 million of revenue, against consensus of $0.56 and $421.4 million — a gap wide enough to send the stock up 24%. AI-related business is now 74% of sales and grew 104%, and management raised full-year guidance to about 22% sales growth and $2.60 non-GAAP EPS. On Sept. 17 it showed an 11TB MemoryAI KV cache server at the AI Infra Summit. The caveat: it is no longer overlooked — the consensus price target has been lifted from $50.14 to $74.29, so expectations have caught up.", "url": "https://ir.penguinsolutions.com/news/news-details/2026/Penguin-Solutions-Reports-Q3-Fiscal-2026-Financial-Results/default.aspx", "stocks": [{"t": "PENG", "n": "FQ3 非 GAAP EPS 0.84 美元遠超預期 0.56，AI 佔營收 74%"}, {"t": "SMCI", "n": "AI 伺服器同業，記憶體與整機毛利率的對照組"}, {"t": "DELL", "n": "AI 伺服器出貨量的大型對照，反映同一條需求鏈"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "AI 雲漲價", "color": "#5B8ED6", "zh": "Nebius 在 9 月 17 日因為調漲價格而走高，這在 AI 雲租賃這個賽道是罕見訊號。過去兩年新進 GPU 雲業者的競爭方式幾乎只有降價與搶產能，能公開漲價代表算力供給還是緊的、而且客戶認為換供應商的成本比接受漲價更高。對投資人的意義在於毛利率：GPU 雲的成本結構是折舊與電費，兩者都在上升，如果售價不能同步走高，這個商業模式在第二輪硬體更新時會出問題。漲價能否維持，比這一天的漲幅重要得多。", "en": "Nebius rose on Sept. 17 after raising prices, a rare signal in the GPU cloud rental space. For two years the competitive playbook among new AI cloud providers has been cutting prices and grabbing capacity, so a public price increase suggests compute supply is still tight and customers find switching costlier than paying more. The significance is gross margin: a GPU cloud's cost base is depreciation plus electricity, both rising, and if pricing cannot follow, the model breaks at the second hardware refresh. Whether the increase sticks matters far more than one day's move.", "url": "https://investrade.com/market-review-september-17-2026/", "stocks": [{"t": "NBIS", "n": "9/17 因調漲價格而走高，AI 雲少見的定價權訊號"}, {"t": "CRWV", "n": "同為 GPU 雲租賃業者，折舊與電費成本結構相同"}, {"t": "IREN", "n": "從礦場轉型 AI 資料中心，電力成本是關鍵變數"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "消費金融兩面刃", "color": "#5B8ED6", "zh": "升息對消費金融類小型股是最典型的兩面刃：放款利率通常有法定上限或市場上限，調不上去；但資金成本是浮動的，聯準會一升就直接吃掉利差。更麻煩的是第二層——借款人多半是次優信用族群，升息週期拉長會同時推高違約率。所以看這類公司不能只看殖利率便宜，要看三件事：資金成本的固定利率佔比、放款組合的加權平均利率有沒有空間、以及呆帳提存率的走勢。三者同時惡化時，低本益比只是陷阱的偽裝。", "en": "Rate hikes are a textbook double-edged sword for consumer finance small caps: lending rates usually face statutory or market ceilings and cannot move up, while funding costs float and a Fed hike eats the spread immediately. The second-order problem is worse — these borrowers are mostly subprime, so a longer hiking cycle lifts default rates at the same time. So you cannot judge these names on a cheap yield alone; look at three things: the share of funding locked at fixed rates, whether the loan book's weighted average rate has room to rise, and the direction of the provision rate. When all three deteriorate together, a low P/E is just camouflage.", "url": "https://simplywall.st/stocks/us/diversified-financials/nyse-rm/regional-management/news/undervalued-small-caps-with-insider-action-to-watch-in-septe-1", "stocks": [{"t": "RM", "n": "分期消費放款商，資金成本浮動、放款利率受州法上限限制"}, {"t": "OPFI", "n": "線上次優信用放款平台，呆帳提存率是關鍵觀察值"}, {"t": "OPRT", "n": "服務薄信用檔客群，升息週期拉長時違約率最先反應"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "判讀方法", "color": "#5B8ED6", "zh": "既然浮動利率債務是這輪小型股的分水嶺，那要怎麼自己查？最直接的地方是 10-Q 附註裡的債務明細表（debt schedule），它會列出每一筆借款的到期日與利率型態；其次看現金流量表的利息支出與資產負債表的短期借款變化，如果利息支出年增幅明顯高於負債增幅，代表浮動部位在吃掉獲利。另一個實用指標是「淨現金」——在升息期，帳上現金大於總負債的小型股會出現溢價，因為它的利息收入反而變成順風。這個差別在羅素 2000 與標普 600 兩個池子之間也看得出來，後者要求成分股連續獲利，體質篩選較嚴。", "en": "If floating-rate debt is the dividing line this cycle, how do you check it yourself? The most direct source is the debt schedule in the 10-Q notes, which lists each borrowing's maturity and rate type. Next, compare interest expense on the cash flow statement with short-term borrowings on the balance sheet — if interest expense grows much faster than debt, the floating portion is eating profit. Another practical marker is net cash: in a hiking cycle, small caps with cash exceeding total debt command a premium because interest income becomes a tailwind. The same distinction shows up between the Russell 2000 and the S&P 600, since the latter requires constituents to be consistently profitable.", "url": "https://www.fool.com/investing/2026/09/09/this-vanguard-etf-sp-500-nasdaq-100-2026-reckoning/", "stocks": [{"t": "IWC", "n": "羅素微型股 ETF，浮動利率曝險與流動性風險都最高的一層"}, {"t": "IJR", "n": "標普 600，要求連續獲利，升息期體質差異會被放大"}, {"t": "VTWO", "n": "羅素 2000，無獲利門檻，兩個池子的對照最能說明篩選差別"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新名字 · 二元催化", "color": "#C9A227", "zh": "AXT 做的是磷化銦、砷化鎵這類化合物半導體基板，是矽光子與資料中心光通訊模組的上游材料，市值小、覆蓋券商少，長期被歸類在「不會有人問的冷門材料股」。被忽視的原因很明確：2025 年 2 月中國把磷化銦基板列入出口管制清單，它的中國子公司同美出貨被卡住，整個投資論點變成猜政策。正在改變的是：出口許可陸續發放，先是歐洲與日本，之後擴及英國與加拿大，2026 年第一季營收 2,690 萬美元、季增 17%、年增 39%，略高於財測；公司在最新公開說明書中表示對美出口許可「已進入審查最後階段」。反方論點也不小：對美許可一天沒發就是一天的政策風險，公司近期還連續辦理增資（424B5），稀釋壓力實質存在，且營收規模小到單一季的許可節奏就能讓數字大幅擺盪。這是研究線索，不是投資建議。", "en": "AXT makes indium phosphide and gallium arsenide substrates, upstream materials for silicon photonics and data-center optical modules, with a small market cap and thin analyst coverage. Why it is ignored is clear: in February 2025 China added indium phosphide substrates to its export control list, blocking its Chinese subsidiary's US-bound shipments and turning the thesis into a policy guess. What is changing: export permits have been granted progressively, first for Europe and Japan and later the UK and Canada, and Q1 2026 revenue reached $26.9 million, up 17% sequentially and 39% year on year, slightly above guidance; the company states in its latest prospectus supplement that US export permits are in the final stages of review. The bear case is real: until that US permit is issued the policy risk stands, recent shelf takedowns create genuine dilution, and revenue is small enough that permit timing alone swings the numbers. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001051627/000121390026046176/ea0287123-424b5_axtinc.htm", "stocks": [{"t": "AXTI", "n": "磷化銦基板商，Q1 營收 2,690 萬美元年增 39%，對美出口許可審查最後階段"}], "status": "RADAR · 下一個驗證點 對美磷化銦出口許可是否核發，以及 11 月 Q3 財報的許可實際貢獻與增資稀釋幅度"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新名字 · 併購綜效", "color": "#C9A227", "zh": "Alerus Financial 是北達科他與明尼蘇達為主的銀行，同時有退休金管理與財富管理業務，市值不到十億美元，是典型沒人追蹤的中西部小銀行。被忽視的原因：2024 年 10 月它用全股票、約 1.29 億美元併下 HMN Financial（Home Federal Savings Bank，14 家分行、總資產 11 億美元），這是公司史上最大併購，市場對整合結果一直觀望。正在改變的是：2026 年第一季每股盈餘 0.89 美元、遠高於預期的 0.59 美元，營收 7,576 萬美元也優於 7,378 萬預期；管理層上修全年展望，淨利差 3.55% 至 3.65%、資產報酬率超過 1.25%，同時買回 600 萬美元庫藏股，8 月 26 日把季配息調升到每股 0.22 美元、年增 4.76%。反方論點：升息循環重啟會推高存款成本，這正是它淨利差指引的核心假設；退休金業務手續費與市場水位連動；中西部商用不動產放款的信用成本尚未真正測試過。這是研究線索，不是投資建議。", "en": "Alerus Financial is a North Dakota and Minnesota bank that also runs retirement and wealth management, with a market cap under a billion dollars — a classic uncovered Midwestern bank. Why it is ignored: in October 2024 it closed an all-stock acquisition of HMN Financial (Home Federal Savings Bank, 14 branches, $1.1 billion of assets) for about $129 million, its largest deal ever, and the market has been waiting to see the integration land. What is changing: Q1 2026 EPS of $0.89 beat the $0.59 consensus and revenue of $75.76 million beat $73.78 million; management raised full-year guidance to a 3.55%-3.65% net interest margin and return on assets above 1.25%, repurchased $6 million of stock, and on Aug. 26 lifted the quarterly dividend to $0.22, up 4.76% year on year. Bear case: a renewed hiking cycle pushes deposit costs up, which is the core assumption behind that margin guidance; retirement fee income tracks market levels; and Midwest commercial real estate credit costs have not truly been tested. This is a research lead, not investment advice.", "url": "https://www.investing.com/news/transcripts/earnings-call-transcript-alerus-financial-q1-2026-beats-estimates-stock-up-93CH-4650781", "stocks": [{"t": "ALRS", "n": "中西部銀行，Q1 EPS 0.89 遠超預期 0.59，全年 ROA 指引 >1.25%"}], "status": "RADAR · 下一個驗證點 10 月下旬 Q3 財報：淨利差能否守在 3.55%-3.65%、存款成本在升息下的實際走勢"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "新名字 · 行動派介入", "color": "#C9A227", "zh": "TransAct Technologies 市值只有約 5,300 萬美元，是真正的微型股，旗下有兩塊互不相干的事業：賭場吃角子老虎機的列印設備，以及餐飲業的 BOHA 廚房管理軟體。被忽視的原因就是這個結構——兩塊業務太小、又不相關，沒有任何一邊的專業投資人會想買整包，券商也沒有覆蓋的誘因。正在改變的是：行動派投資人 IDWR Office 在 8 月 28 日申報持股 5.1%，公開要求公司把兩塊事業都賣掉。這類介入的價值不在勝率，在於它強迫董事會給出一個時間表。值得放在更大的背景看：市值 5 億美元以下的行動派案件佔比已升到 2020 年以來最高。反方論點：微型股流動性極差，一筆賣單就能打掉一天的價格；「要求出售」離「真的成交」還有很遠；兩塊業務若都賣不掉，股價會退回基本面，而基本面本身並不強。這是研究線索，不是投資建議。", "en": "TransAct Technologies has a market cap of only about $53 million, a true microcap with two unrelated businesses: printers for casino slot machines and BOHA kitchen-management software for restaurants. That structure is exactly why it is ignored — neither segment is large enough or related enough for a specialist to buy the whole package, and brokers have no reason to cover it. What is changing: activist IDWR Office disclosed a 5.1% stake on Aug. 28 and publicly called on the company to sell both operating businesses. The value of such campaigns is less the hit rate than the fact that they force a board to produce a timetable. Context worth noting: the share of activist campaigns targeting sub-$500 million market caps is at its highest since 2020. Bear case: microcap liquidity is terrible and a single sell order can move the price, demanding a sale is far from completing one, and if neither business sells the stock falls back to fundamentals that are not strong. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001017303/000121465926011436/ex99_2.htm", "stocks": [{"t": "TACT", "n": "市值約 5,300 萬美元微型股，行動派 IDWR 持股 5.1% 要求出售兩塊事業"}], "status": "RADAR · 下一個驗證點 董事會是否回應並宣布策略檢討或聘任財務顧問，以及 11 月季報的兩事業分部獲利"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內更新 · 分歧擴大", "color": "#C9A227", "zh": "Ardmore Shipping 在 9 月 7 日入池，本週有值得更新的新事證。它經營 26 艘船隊（25 艘自有節能型、1 艘租入），專做中程成品油與化學品輪，市值約 7.65 億美元，9 月 16 日股價約 18.97 美元。原本的論點是荷姆茲封鎖會把所有油輪運價一起推上去。新事證卻是分歧：原油輪類股今年大漲 120%、超大型油輪日收益逼近 80 萬美元，但成品油輪的中程船型即期運價仍在歷史區間內，Lloyd's List 明確點出兩者走勢分道揚鑣。這對持有者是壞消息也是機會——如果分歧是結構性的（煉油產能位置改變、成品貿易流縮短），那它就不該用原油輪的倍數看；如果只是時間差，估值落差就是空間。反方論點：船隊小、現貨曝險高，運價若回落沒有長約緩衝，且新造船 2028 年才交付、幫不上這一輪。這是研究線索，不是投資建議。", "en": "Ardmore Shipping entered the pool on Sept. 7 and there is new evidence worth updating. It runs a 26-vessel fleet (25 owned eco-design, one chartered in) of medium-range product and chemical tankers, with a market cap around $765 million and a share price near $18.97 on Sept. 16. The original thesis was that the Hormuz blockage lifts all tanker rates together. The new evidence is divergence: crude-tanker equities are up 120% year to date and VLCC earnings approach $800,000 a day, yet medium-range product tanker spot rates remain inside their historical range, with Lloyd's List explicitly flagging the split. That is both bad news and an opportunity — if the divergence is structural (refining capacity relocating, shorter product trade routes) it should not be valued on crude-tanker multiples; if it is only a lag, the gap is the upside. Bear case: a small fleet with high spot exposure has no long-charter cushion if rates fall, and newbuilds only deliver from late 2028. This is a research lead, not investment advice.", "url": "https://www.lloydslist.com/LL1158294/How-Hormuz-crisis-effect-on-product-tankers-diverged-from-crude", "stocks": [{"t": "ASC", "n": "26 艘中程成品油輪，市值約 7.65 億美元，現貨曝險高"}], "status": "RADAR · 下一個驗證點 10 月底 Q3 財報的 MR 即期日租金實際數字，以及成品油輪與原油輪運價分歧是否收斂"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新 · 執行長進場", "color": "#C9A227", "zh": "CarParts.com 在 9 月 12 日入池，本週出現了池內最想看到的那種訊號：執行長 David Meniane 於 9 月 14 日在公開市場買進約 13.3 萬美元的股票。金額不算大，但性質關鍵——這是營運層級最高的人用自己的錢在低檔買，而且是在公司連續多季營收下滑、股價長期低迷之後。它做的是汽車售後零件電商，被忽視的原因是「電商＋汽車零件」兩個都不是市場現在想聽的故事，券商覆蓋幾乎歸零。要注意的是單一內部人買進的資訊量有限，真正的強訊號是群聚買進——目前還沒有第二位內部人跟進，這是接下來該盯的事。反方論點：營收下滑尚未止住、關稅對進口零件成本的壓力仍在、現金部位是持續經營的核心變數。這是研究線索，不是投資建議。", "en": "CarParts.com joined the pool on Sept. 12 and this week produced exactly the signal the pool looks for: CEO David Meniane bought roughly $133,000 of stock on the open market on Sept. 14. The size is modest but the nature matters — the most senior operator is buying with his own money at depressed prices after multiple quarters of declining revenue. The business is e-commerce for aftermarket auto parts, ignored because neither e-commerce nor auto parts is a story the market wants right now, and broker coverage has all but vanished. Note that a single insider purchase carries limited information; the strong signal is a cluster, and no second insider has followed yet — that is the thing to watch. Bear case: revenue decline has not stopped, tariffs still pressure imported parts costs, and the cash position is the central going-concern variable. This is a research lead, not investment advice.", "url": "https://www.thedesperatetrader.com/insider-buying", "stocks": [{"t": "PRTS", "n": "汽車售後零件電商，執行長 9/14 公開市場買進約 13.3 萬美元"}], "status": "RADAR · 下一個驗證點 是否出現第二位內部人跟進買進（群聚訊號），以及 11 月 Q3 財報的營收能否止跌與現金消耗速度"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內更新 · 高風險", "color": "#C9A227", "zh": "Relmada Therapeutics 在 9 月 13 日入池，9 月 14 日出現執行長 Sergio Traversa 買進約 82.8 萬美元的 Form 4 申報，以一家市值極小的臨床期生技來說，這是相對大的個人部位。被忽視的原因很單純：它的主力憂鬱症候選藥先前試驗失敗後，機構投資人幾乎全數撤離，剩下的是管線重組與現金存續的故事。執行長用這個金額買進，至少代表管理層對現金跑道與下一步管線有自己的看法。但這張卡要把風險講得比機會更清楚：臨床期生技的內部人買進歷史命中率並不高，管理層也可能只是誤判；這類公司唯一真正重要的數字是現金部位與可撐月數，其次才是試驗設計。任何單一試驗結果都可能讓股價一天內腰斬或翻倍。這是研究線索，不是投資建議。", "en": "Relmada Therapeutics joined the pool on Sept. 13, and on Sept. 14 a Form 4 showed CEO Sergio Traversa buying about $828,000 of stock — a large personal position relative to a very small clinical-stage biotech. Why it is ignored is simple: after its lead depression candidate failed in trials, institutional holders left almost entirely, leaving a story about pipeline reshuffling and cash survival. A purchase of that size at least signals management has its own view on the runway and the next step. But this card should state the risk more clearly than the opportunity: insider buying at clinical-stage biotechs has a poor historical hit rate and management can simply be wrong. For these companies the only number that truly matters is cash and months of runway, with trial design second. Any single readout can halve or double the stock in a day. This is a research lead, not investment advice.", "url": "https://fintel.io/insiders/ceo", "stocks": [{"t": "RLMD", "n": "臨床期生技，執行長 9/14 申報買進約 82.8 萬美元"}], "status": "RADAR · 下一個驗證點 下一份季報的現金部位與可撐月數（runway），以及管線重組後的下一個臨床里程碑時程"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "9/14 買進潮", "color": "#6DB56D", "zh": "9 月 14 日這一天的 Form 4 申報裡出現一批執行長等級的公開市場買進：Upstart Holdings 執行長 Paul Gu 買進約 130 萬美元，Alphatec Holdings 執行長 Patrick Miles 買進約 100 萬美元。兩家公司性質完全不同——一家是 AI 信貸模型平台，一家是脊椎手術器械商——但共同背景是升息環境下股價承壓。要注意時間點：這批買進發生在聯準會會議前兩天，也就是在利率結果未知的情況下進場，這比事後追買更有資訊量，但也可能只是例行的定期買入窗口開啟。", "en": "Form 4 filings on Sept. 14 showed a batch of CEO-level open-market purchases: Upstart Holdings CEO Paul Gu bought about $1.3 million and Alphatec Holdings CEO Patrick Miles bought about $1.0 million. The two companies are unrelated — an AI credit-model platform and a spine surgery device maker — but share the backdrop of share prices under pressure in a rising-rate environment. The timing matters: these purchases came two days before the Fed meeting, meaning the buyers stepped in without knowing the rate outcome, which carries more information than buying afterwards, though it could equally reflect a routine trading window opening.", "url": "https://www.thedesperatetrader.com/insider-buying", "stocks": [{"t": "UPST", "n": "執行長 Paul Gu 9/14 買進約 130 萬美元"}, {"t": "ATEC", "n": "執行長 Patrick Miles 9/14 買進約 100 萬美元"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "判讀提醒", "color": "#6DB56D", "zh": "Form 4 的資訊量差距很大，值得記住一套加權邏輯：買家層級越高權重越高（執行長約 1.0、財務長 0.9、總裁 0.8、營運長與董事長 0.7、董事 0.5、其他高階 0.3），金額越大越有意義，而最強的訊號是短時間內多位不同身分的內部人同時買進，也就是群聚。反過來說，單一董事的小額買進幾乎沒有資訊量，因為它可能只是為了滿足持股要求。另外要注意兩件事：只算公開市場買進，選擇權行使與限制股歸屬不是買進；而賣出幾乎沒有解讀價值，因為理由太多（稅、分散、換房）。", "en": "Form 4 filings vary hugely in information content, so a weighting framework helps: seniority raises weight (CEO around 1.0, CFO 0.9, president 0.8, COO or chairman 0.7, director 0.5, other officers 0.3), larger dollar amounts matter more, and the strongest signal is several insiders in different roles buying within a short window — a cluster. Conversely, a single director's small purchase carries almost no information, since it may simply satisfy an ownership requirement. Two more rules: count only open-market purchases, as option exercises and restricted stock vesting are not buys; and selling is nearly uninterpretable because the reasons are too many — taxes, diversification, a house.", "url": "https://www.gurufocus.com/insider/summary", "stocks": [{"t": "QVCG", "n": "近期 Form 4 買進名單常客，屬單一買家需觀察是否成群"}, {"t": "GPI", "n": "汽車經銷集團，內部人買進與庫藏股執行可交叉驗證"}, {"t": "RSG", "n": "廢棄物處理大型股，示範大型股內部人買進的稀釋效果"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "策略型內部人", "color": "#6DB56D", "zh": "除了個人 Form 4，今年出現另一種值得追蹤的「內部人」：策略客戶。甲骨文 2026 年 4 月入股 Bloom Energy，亞馬遜這週拿下 Generac 最多 169 萬股的認股權證，履約價 200.9266 美元、隨採購金額分批生效。這種持股跟一般機構持股的差別在資訊優勢——他們是客戶，比任何分析師更清楚訂單的真實需求。但跟單者要注意兩件事：第一，認股權證的履約價已經公告，它同時是一個市場都看得到的心理價位；第二，這種結構對現有股東是稀釋，而稀釋在合約公布當天就已經反映在股價，後面追進去買的是稀釋後的故事。", "en": "Beyond personal Form 4s, another kind of insider is worth tracking this year: the strategic customer. Oracle took a stake in Bloom Energy in April 2026, and this week Amazon received a warrant for up to 1.69 million Generac shares at $200.9266, vesting as purchases accumulate. What separates this from ordinary institutional ownership is the information edge — these holders are customers and know real order demand better than any analyst. Two cautions for anyone following along: first, the warrant strike is public, so it is also a psychological price level everyone can see; second, the structure dilutes existing shareholders, and that dilution was priced in on announcement day, so latecomers are buying the post-dilution story.", "url": "https://www.fool.com/investing/2026/09/17/generac-lands-24-billion-generator-deal-with-amazon/", "stocks": [{"t": "GNRC", "n": "發給亞馬遜最多 169 萬股認股權證，履約價 200.9266 美元"}, {"t": "AMZN", "n": "以客戶身分取得供應商股權，資訊優勢來自訂單本身"}, {"t": "ORCL", "n": "2026 年 4 月入股 Bloom Energy，同一套結構的先例"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "AI 電力押注", "color": "#B5654D", "zh": "當期最值得看的一筆揭露：Nancy Pelosi 家戶申報了首次的 Bloom Energy 交易——買進 15,000 股，外加 100 口履約價 100 美元、2027 年 6 月 17 日到期的買權；同一份申報還加碼英特爾，50 口履約價 50 美元、同樣 2027 年 6 月到期的買權，加上 10,000 股。兩筆合計的申報區間是 300 萬到 1,200 萬美元。交易發生在 7 月下旬，8 月下旬才申報。這個部位底下的主題很清楚：AI 資料中心等不到電網擴容，所以押注能就地發電的燃料電池，以及美國本土晶片製造。有意思的是甲骨文早在 4 月就已經入股 Bloom Energy，這個主題在申報之前已經有企業級的背書。", "en": "The disclosure most worth looking at this period: the Nancy Pelosi household reported a first-ever Bloom Energy trade — 15,000 shares plus 100 call options struck at $100 expiring June 17, 2027. The same filing added to Intel with 50 calls struck at $50, also expiring June 2027, plus 10,000 shares. Combined disclosed value ranges total $3 million to $12 million. The trades occurred in late July and were filed in late August. The thesis underneath is clear: AI data centers cannot wait for grid expansion, so the bet is on fuel cells that generate power on site, plus domestic chip manufacturing. Notably Oracle had already taken a stake in Bloom Energy back in April, so the theme had corporate backing before this filing.", "url": "https://www.quiverquant.com/news/Nancy+Pelosi+Discloses+First-Ever+Bloom+Energy+Trade,+Adds+to+Intel+Bet+Amid+AI+Power+Boom", "stocks": [{"t": "BE", "n": "首次申報部位，15,000 股加 100 口 2027/6 到期、履約價 100 美元買權"}, {"t": "INTC", "n": "加碼 10,000 股與 50 口 2027/6 到期、履約價 50 美元買權"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "怎麼讀", "color": "#B5654D", "zh": "這個頻道的資料來源是 STOCK Act 的定期交易報告（PTR），跟 Form 4 是兩套東西。讀它有四個必須先知道的限制：第一，申報期限是交易後 45 天，所以你看到的永遠是別人一個半月前的價位；第二，金額只有區間沒有確數，「300 萬到 1,200 萬美元」這種寬度本身就無法計算報酬；第三，多數交易由配偶帳戶或信託執行，申報人本人未必參與決策；第四，真正有資訊量的是選擇權的履約價與到期日，因為那寫明了「押多高、押多久」，遠比買了哪檔重要。另外值得記住的制度背景：眾議院在 2026 年 7 月已推進禁止現任議員買賣個股的法案，這個頻道的資料源未來可能改變。", "en": "This channel's data comes from STOCK Act Periodic Transaction Reports, which are a different system from Form 4. Four limits to know first. One: the filing deadline is 45 days after the trade, so you are always seeing a price from six weeks ago. Two: amounts are ranges, not figures, and a range like $3 million to $12 million makes return calculation impossible. Three: most trades are executed in spouse or trust accounts, so the filer may not have made the decision. Four: the real information is in an option's strike and expiry, which state how high and how long the bet runs — far more revealing than which ticker was bought. One institutional note: the House advanced a bill in July 2026 to bar sitting members from trading individual stocks, so this data source may change.", "url": "https://www.cnbc.com/2026/07/22/house-congressional-stock-trading.html", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報持股的 ETF，可看主題集中度"}, {"t": "GOP", "n": "追蹤共和黨籍議員申報持股的 ETF，與 NANC 的產業分布差異明顯"}]},

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function HeatmapView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;

    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/18/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v11.3</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
