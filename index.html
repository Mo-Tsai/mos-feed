<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "週線收紅", "color": "#E05C5C", "zh": "週五（9/25）美股三大指數收高，並且把整個波動的一週收成紅盤。道瓊漲 478.64 點（0.93%）收 51,828.62 點，標普 500 漲 0.51% 收 7,743.41 點，那斯達克漲 0.5% 收 27,068.72 點。這是連續兩天由債市主導的下跌之後的反彈，油價回落與長端殖利率止步是主要推力。重點不在漲幅大小，而在於股市在 30 年期公債停在 2004 年以來最高檔的同時，仍然收出週線正報酬。", "en": "US stocks closed higher on Friday (9/25) and turned a volatile week into a positive one. The Dow rose 478.64 points (0.93%) to 51,828.62, the S&P 500 gained 0.51% to 7,743.41 and the Nasdaq Composite added 0.5% to 27,068.72. The bounce followed two sessions driven by the bond market; easing oil prices and a pause in the long-end selloff did most of the work. The point is less the size of the move than the fact that equities booked a weekly gain while the 30-year Treasury sat at its highest level since 2004.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-september-25-dow-sp-500-nasdaq-081738529.html", "stocks": [{"t": "SPY", "n": "標普 500 ETF，週五漲 0.51%，整週收紅"}, {"t": "DIA", "n": "道瓊 ETF，週五漲 0.93%，是三大指數中最強的一檔"}, {"t": "QQQ", "n": "那斯達克 100 ETF，週五漲約 0.5%，科技股跟著大盤收斂跌勢"}]},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "長端沒有讓步", "color": "#E05C5C", "zh": "股市漲了，但債市其實沒有讓步。10 年期美債殖利率週五幾乎持平在 5.17%，仍是 2007 年 6 月以來最高；30 年期持平在 5.463%，週四盤中一度觸及 5.501%，是 2004 年 6 月以來的高點。這波是全球同步的：日本公債、英國金邊債、德國公債與歐元區其他主權債本週都創了新高殖利率。換句話說，週五的股票反彈不是因為利率壓力解除，而是因為股票暫時選擇不看它。", "en": "Stocks rose, but the bond market did not give ground. The 10-year Treasury yield was little changed at 5.17% on Friday, still the highest since June 2007, while the 30-year held flat at 5.463% after touching 5.501% on Thursday, a level last seen in June 2004. The move is global: Japanese government bonds, UK gilts, German bunds and other euro-area sovereigns all hit fresh yield highs this week. In other words, Friday's equity rally did not come from relief on rates — it came from equities choosing, for one session, not to look.", "url": "https://www.cnbc.com/2026/09/25/treasury-yields-bonds-debt.html", "stocks": [{"t": "TLT", "n": "20 年期以上美債 ETF，30 年期殖利率停在 5.463%，長債價格仍在低檔"}, {"t": "IEF", "n": "7-10 年期美債 ETF，10 年期 5.17%，中段殖利率同樣沒有回落"}]},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "油價的兩個方向", "color": "#E05C5C", "zh": "油價本週出現罕見的分歧：布蘭特原油週五跌 0.88% 到每桶 105.7 美元，但整週仍上漲約 2%；西德州中級原油（WTI）整週卻大跌約 7%。原因是兩套不同的供需——布蘭特跟著紐約的伊朗和談與沙烏地東西向輸油管重啟走，WTI 則被美國可能禁止柴油出口的傳聞壓住，因為那會把原本要出口的原油與成品留在國內。結果是布蘭特與 WTI 的價差擴大到 12.68 美元，是五月以來最寬。對美國煉油廠來說，這個價差本身就是利潤。", "en": "Oil split in two directions this week. Brent fell 0.88% on Friday to $105.7 a barrel but still finished the week up about 2%, while WTI dropped roughly 7% over the same stretch. The two benchmarks are trading different stories: Brent tracks the Iran peace talks in New York and the restart of Saudi Arabia's East-West pipeline, while WTI is pinned by reports of a possible US diesel export ban that would keep crude and products at home. The result is a Brent-WTI spread of $12.68, the widest since May. For US refiners, that spread is the margin.", "url": "https://www.thenationalnews.com/business/energy/2026/09/25/oil-prices-waver-in-face-of-iran-war-truce-and-houthi-attacks/", "stocks": [{"t": "VLO", "n": "Valero，美國大型煉油廠，布蘭特與 WTI 價差拉大直接放大裂解利潤"}, {"t": "PBF", "n": "PBF Energy，中型煉油廠，對進料價差的槓桿比大廠更高"}, {"t": "XLE", "n": "能源類股 ETF，本週整體下跌 1.3%，強勢集中在煉油與中游而非上游"}]},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "指數漲、廣度差", "color": "#E05C5C", "zh": "把整週的板塊表現攤開會看到另一件事：指數收紅，但十一個板塊裡只有兩個是正的。醫療保健漲 1.8%、科技漲 1.0%，其餘全黑——公用事業跌 3.0%、金融跌 2.4%、不動產跌 2.0%、原物料跌 1.9%、工業跌 1.5%、能源跌 1.3%。這是典型的殖利率主導盤：吃利差的（公用事業、REIT、銀行）被打，現金流在遠端而且不靠借錢的（大型科技、製藥）撐住指數。週線紅盤的背後，是一個非常窄的贏家名單。", "en": "Look at the week by sector and a different picture appears: the index finished green, but only two of eleven sectors did. Health Care gained 1.8% and Technology 1.0%; everything else fell — Utilities -3.0%, Financials -2.4%, Real Estate -2.0%, Materials -1.9%, Industrials -1.5%, Energy -1.3%. That is a textbook yield-driven tape: the spread-and-duration trades (utilities, REITs, banks) get hit, while businesses whose cash flows sit far out and do not depend on borrowing hold the index up. Behind the weekly gain is a very narrow list of winners.", "url": "https://articles.stockcharts.com/article/the-best-five-sectors-this-week-sept-21-2026-84/", "stocks": [{"t": "XLU", "n": "公用事業 ETF，本週跌 3.0%，是十一個板塊中最弱的一個"}, {"t": "XLRE", "n": "不動產 ETF，本週跌 2.0%，長端殖利率直接壓估值"}, {"t": "XLV", "n": "醫療保健 ETF，本週漲 1.8%，是唯一明顯領先的板塊"}]},
    {"id": "earn_0", "channel": "財報速報", "tag": "超預期被賣", "color": "#E8786A", "zh": "TD Synnex（SNX）在 9/24 交出非常漂亮的一季：非 GAAP 每股盈餘 5.68 美元，遠高於市場預估的 4.64 美元；營收 216 億美元，預估只有 187.9 億。第四季財測中位數也高於共識。結果股價當天重挫約 9% 到 12%。市場盯的不是獲利，而是自由現金流——快速成長的 Hyve 伺服器業務吃掉將近 10 億美元的負自由現金流，而且 AI 伺服器組裝的毛利率低於傳統代理配銷，把整體毛利率往下拉。這是今年 AI 供應鏈反覆出現的同一個問題：營收成長是真的，現金與利潤率不一定跟著來。", "en": "TD Synnex (SNX) reported a very strong quarter on September 24: non-GAAP EPS of $5.68 against a $4.64 consensus, on revenue of $21.6 billion versus $18.79 billion expected, with fourth-quarter guidance midpoints also above consensus. The stock then fell roughly 9% to 12%. What the market focused on was not earnings but cash: the fast-growing Hyve server business consumed close to $1 billion of negative free cash flow, and AI server programs carry lower margins than traditional distribution, dragging the blended gross margin down. It is the same question that has dogged the AI supply chain all year — the revenue growth is real, the cash and the margin do not automatically follow.", "url": "https://www.sec.gov/Archives/edgar/data/0001177394/000162828026063314/ex991-fy26q3pressrelease.htm", "stocks": [{"t": "SNX", "n": "TD Synnex，財報超預期但股價單日下跌約 9% 至 12%"}, {"t": "DELL", "n": "戴爾，同樣以 AI 伺服器拉高營收、壓低毛利率的對照組"}, {"t": "SMCI", "n": "美超微，AI 伺服器組裝的營運資金需求與 Hyve 的問題同源"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "目標價被砍", "color": "#E8786A", "zh": "好市多（COST）的 FQ4 每股盈餘 6.75 美元，高於預估的 6.52 美元，但週五的後續反應比財報本身更值得看：八家在週五調整目標價的券商裡，有七家是往下調。摩根大通、美銀與摩根士丹利都維持買進評等，高盛甚至看到大幅上檔。爭議點在獲利品質——這 6.75 美元裡有約 0.15 美元來自 IEEPA 關稅退稅，屬於一次性；扣掉之後的基本面成長，配上 45 倍的追蹤本益比，在 5% 殖利率的環境裡就顯得貴。週五盤前股價還小跌 0.51%。", "en": "Costco (COST) posted FQ4 EPS of $6.75 against a $6.52 estimate, but Friday's follow-through said more than the print: of eight brokers who changed price targets that day, seven cut them. JPMorgan, Bank of America and Morgan Stanley all reiterated buy-equivalent ratings, and Goldman Sachs sees substantial upside. The argument is about earnings quality — roughly $0.15 of that $6.75 came from one-off IEEPA tariff refunds. Strip that out, and the underlying growth against a 45x trailing P/E looks expensive in a 5% yield world. The stock was still down 0.51% in Friday premarket.", "url": "https://www.cnbc.com/2026/09/25/costco-just-reported-strong-earnings-goldman-sachs-sees-big-gains.html", "stocks": [{"t": "COST", "n": "好市多，EPS 6.75 美元超預期，但週五八家券商中七家下調目標價"}, {"t": "BJ", "n": "BJ's Wholesale，同樣的會員制倉儲模式，估值卻只有好市多的一小部分"}, {"t": "WMT", "n": "沃爾瑪，大型零售的估值溢價在高殖利率環境下同樣受檢驗"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "連續上修", "color": "#E8786A", "zh": "黑莓（BB）9/24 公布的 FQ2 是這一輪少數乾淨的超預期：調整後每股盈餘 0.07 美元，預估只有 0.04 美元；營收 1.633 億美元，預估 1.4255 億。營收年增 26%、調整後 EBITDA 年增 81%。核心是車用作業系統 QNX，單季營收 8,000 萬美元創新高、年增 27%。公司把全年營收指引上調到 6.16 億至 6.36 億美元，調整後 EBITDA 上調到 1.41 億至 1.58 億，股價當天收 8.72 美元、漲 4.06%。這家公司已經不是手機公司，是一家藏在汽車軟體裡的授權業者。", "en": "BlackBerry's (BB) FQ2 on September 24 was one of the cleaner beats of this stretch: adjusted EPS of $0.07 against a $0.04 estimate on revenue of $163.3 million versus $142.55 million expected, with sales up 26% and adjusted EBITDA up 81% year over year. The engine is QNX, its automotive operating system, which posted record quarterly revenue of $80 million, up 27%. Management raised full-year revenue guidance to $616-636 million and adjusted EBITDA to $141-158 million. The stock closed at $8.72, up 4.06%. This is no longer a handset company — it is a licensing business hiding inside car software.", "url": "https://www.fool.com/coverage/stock-market-today/2026/09/24/stock-market-today-sept-24-blackberry-lifts-fiscal-2027-guidance-on-record-qnx-revenue/", "stocks": [{"t": "BB", "n": "黑莓，FQ2 超預期並上調全年指引，當日收 8.72 美元漲 4.06%"}, {"t": "MBLY", "n": "Mobileye，同樣靠車廠導入週期決定成長節奏的車用軟體同業"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "十月升息", "color": "#7C6AF7", "zh": "市場現在定價的不是降息，是下一次升息。芝商所 FedWatch 顯示，10 月 27 至 28 日的 FOMC 升息機率已經跳到 71% 至 73%。觸發點是聯準會理事 Barr 公開表示「要讓通膨及時回到目標，可能還需要進一步的政策調整」，加上偏熱的通膨數據。聯準會 9 月 16 日已經升了一碼，並在同日的預測中把 2026 年 PCE 上修到 3.7%、核心 PCE 上修到 3.4%。這一段的意義是：如果你的部位假設十二個月內利率會回到 4% 以下，這個假設現在已經沒有官方支撐。", "en": "The market is no longer pricing a cut — it is pricing the next hike. CME FedWatch now puts the odds of an increase at the October 27-28 FOMC meeting at 71% to 73%. The trigger was Fed Governor Michael Barr saying publicly that \"further policy adjustments are likely to be needed to ensure inflation comes down to target in a timely fashion,\" on top of a hot inflation print. The Fed already raised rates 25 basis points on September 16 and, in the same set of projections, lifted its 2026 PCE forecast to 3.7% and core PCE to 3.4%. The practical implication: if your positioning assumes rates return below 4% within twelve months, that assumption no longer has official support.", "url": "https://www.cnbc.com/2026/09/23/market-sees-next-fed-hike-in-october-following-barr-comments-hot-inflation.html", "stocks": [{"t": "SHY", "n": "1-3 年期美債 ETF，最直接反映升息路徑重新定價的一段"}, {"t": "KRE", "n": "區域銀行 ETF，升息在短期內先抬高存款成本、壓縮息差"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "信心 48.1", "color": "#7C6AF7", "zh": "密西根大學九月消費者信心終值 48.1，月減約 7%、年減近 13%，是四個月來最低。這份調查從 1952 年開始做，代表美國人現在的感受比越戰、1970 年代石油危機、911、金融海嘯與疫情後的通膨潮都還要差。拆開來看，未來一年的個人財務與景氣預期是崩的那一段；一年期通膨預期升到 4.6%，是六月以來最高，五年期也微升到 3.4%。油價回升與貿易摩擦是民眾點名的兩個理由。信心指數不預測消費，但通膨預期會回頭影響聯準會。", "en": "The University of Michigan's final September consumer sentiment reading came in at 48.1, down about 7% from August and nearly 13% from a year ago — a four-month low. The survey dates back to 1952, which means Americans now feel worse than they did during Vietnam, the 1970s oil shock, 9/11, the financial crisis or the post-pandemic inflation surge. The collapse is concentrated in year-ahead expectations for personal finances and business conditions. One-year inflation expectations rose to 4.6%, the highest since June, and the five-year measure edged up to 3.4%. Respondents named fuel prices and trade tensions. Sentiment does not forecast spending — but inflation expectations feed straight back into Fed policy.", "url": "https://www.cnn.com/2026/09/25/economy/us-consumer-sentiment-final-september", "stocks": [{"t": "XRT", "n": "零售類股 ETF，消費信心與通膨預期同時惡化時最先反映"}, {"t": "DG", "n": "Dollar General，消費降級時的相對受惠者，也是信心走弱的溫度計"}, {"t": "XLY", "n": "可選消費 ETF，未來一年個人財務預期轉差的第一線"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "買回沒效", "color": "#7C6AF7", "zh": "財政部這一輪對長債的干預，效果並不好。九月初財政部把長天期公債買回的單次上限從 20 億美元一路拉到 60 億美元，鎖定 10 到 20 年期，是原本例行規模的三倍；部長貝森特把債市的賣壓比喻成「發燒」，說買回是退燒藥，並表示必要時還能再加碼。結果 32 兆美元規模的公債市場幾乎沒有反應，30 年期殖利率照樣在本週創 2004 年以來新高。背景是美國公債總額已到 40 兆美元、赤字佔 GDP 接近 6%，而過去一年新發行量成長近 12%。買回能調節流動性，改不了供給本身。", "en": "The Treasury's intervention in the long end is not working. In early September it raised the cap on long-dated buybacks from $2 billion to as much as $6 billion per operation, targeting the 10- to 20-year sector — triple the routine size. Secretary Scott Bessent likened the selling pressure to a \"fever\" and called the buybacks a dose of medicine, adding he was ready to go further. The $32 trillion government debt market barely moved, and the 30-year yield still made a post-2004 high this week. The backdrop: $40 trillion of public debt, a deficit near 6% of GDP, and issuance up almost 12% over the past year. Buybacks can smooth liquidity; they cannot change supply.", "url": "https://finance.yahoo.com/economy/article/one-day-after-doubling-treasury-buybacks-bessent-says-hes-ready-to-boost-them-further-to-push-down-long-term-yields-181218236.html", "stocks": [{"t": "TLT", "n": "長天期美債 ETF，買回規模拉到 60 億美元仍未讓長端殖利率回落"}, {"t": "GLD", "n": "黃金 ETF，財政供給與實質利率的拉鋸是它的主戰場"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "醫療領先", "color": "#4EABA4", "zh": "醫療保健是本週唯一明顯領先的板塊，XLV 漲 1.8%，同期 QQQ 漲 0.9%、SPY 小跌 0.09%。理由有兩層：一是藥價改革與關稅的適用範圍逐漸清楚，對藥廠利潤率的實際衝擊目前看來可控，壓在製藥股上的政策折價鬆開；二是在殖利率 5% 的環境裡，現金流穩定、負債低的大型藥廠變成資金的避風港。但要注意板塊內部是分裂的：今年以來生技 XBI 漲 26%、IBB 漲 20%，遠勝 XLV 的 9%，本週反而是 XLV 領先、生技休息。", "en": "Health Care was the only clear leader this week, with XLV up 1.8% against 0.9% for QQQ and a 0.09% dip for SPY. Two things are behind it. First, the scope of drug-pricing reform and tariffs has become clearer and the hit to pharma margins looks manageable so far, releasing some of the policy discount on the group. Second, in a 5% yield world, large pharma's steady cash flows and low leverage make it a place to hide. Note the split inside the sector, though: year to date biotech has led, with XBI up 26% and IBB up 20% versus 9% for XLV — this week the order reversed, with large-cap health care leading and biotech resting.", "url": "https://finance.yahoo.com/healthcare/articles/biotech-week-ahead-xlv-beats-043704054.html", "stocks": [{"t": "XLV", "n": "醫療保健 ETF，本週漲 1.8%，但年初至今只漲 9%，落後生技"}, {"t": "LLY", "n": "禮來，大型藥廠在高殖利率環境下被當成現金流避風港"}, {"t": "MRK", "n": "默沙東，藥價政策折價鬆開時的受惠者之一"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "金融轉弱", "color": "#4EABA4", "zh": "本週最值得記下的板塊變化是金融：週線跌 2.4%，排名從第二掉到第四，掉進落後象限，評等從加碼降到中立。這不是情緒，是算術。升息週期裡銀行必須立刻調高存款利率才留得住存款，但貸款收益率要等資產重新定價才跟上，中間這段就是淨息差被壓縮。區域銀行沒有大型行那種多元收入來源，承受力更差——杭亭頓銀行 9 月 16 日在巴克萊會議上下修獲利展望，當天跌 5.55%，逼近 52 週低點，是這一輪最早的裂縫。", "en": "The most notable sector shift this week was Financials: down 2.4%, sliding from rank two to rank four, into the laggard quadrant, and cut from Accumulate to Hold. This is arithmetic, not sentiment. In a hiking cycle banks must raise deposit rates immediately to keep balances, while loan yields only catch up as assets reprice — and the gap is compressed net interest margin. Regional banks lack the diversified revenue that cushions the money-centre names, so they feel it first: Huntington Bancshares cut its profit outlook at a Barclays conference on September 16 and fell 5.55% that day, close to its 52-week low. That was the first crack.", "url": "https://finance.yahoo.com/markets/stocks/articles/huntington-cut-outlook-fed-hiked-234006771.html", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，淨息差壓縮最直接的載體"}, {"t": "HBAN", "n": "杭亭頓銀行，9/16 下修展望當日跌 5.55%，逼近 52 週低點"}, {"t": "XLF", "n": "金融類股 ETF，本週跌 2.4%，排名從第二掉到第四"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "能源換位置", "color": "#4EABA4", "zh": "能源仍然是排名第一的板塊，但本週降溫了——評等從加碼退回到累積，週線跌 1.3%。真正的訊息在內部：這一週的強勢完全集中在煉油與中游，原油生產、探勘與油服反而轉弱。這跟布蘭特與 WTI 價差拉到 12.68 美元是同一件事——煉油廠買便宜的美國原油、賣跟著布蘭特定價的成品，價差變寬就是它的利潤；上游賣的是原油本身，WTI 週線跌 7% 就是它的營收。同一個板塊，兩種完全相反的方向。", "en": "Energy is still the top-ranked sector, but it cooled this week, easing from Overweight back to Accumulate with the group down 1.3%. The real message is internal: this week's strength was concentrated entirely in refiners and midstream, while crude producers, E&P and oilfield services weakened. That is the same story as the Brent-WTI spread widening to $12.68 — refiners buy cheap US crude and sell products priced off Brent, so a wider spread is margin. Upstream sells the barrel itself, and WTI down 7% on the week is revenue. One sector, two opposite directions.", "url": "https://articles.stockcharts.com/article/the-best-five-sectors-this-week-sept-21-2026-84/", "stocks": [{"t": "WMB", "n": "Williams，中游管線業者，收費模式讓它與油價方向脫鉤"}, {"t": "OXY", "n": "西方石油，純上游，WTI 週線跌 7% 直接打到營收"}, {"t": "AMLP", "n": "中游 MLP ETF，本週相對抗跌的能源次族群"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "連五週落後", "color": "#5B8ED6", "zh": "小型股的落後已經拉成一個統計事件。羅素 2000 自八月中以來下跌 7.3%，IWM 現在報 282.74 美元；標普 500 已經連續五週表現優於羅素 2000，再多一週就會是八年來最長的一段。資金也在撤：IWM 上週淨流出 33 億美元，是 2026 年第二大單週流出、九年來第三大。原因單一而清楚——10 年期殖利率站上 5.11% 以上創 2007 年以來新高，而小型股的借款成本對這條線最敏感。", "en": "Small-cap underperformance has hardened into a statistic. The Russell 2000 is down 7.3% from its mid-August level, with IWM at $282.74, and the S&P 500 has now beaten the Russell for five consecutive weeks — one more would make it the longest such stretch in eight years. Money is leaving too: IWM saw $3.3 billion of outflows last week, its second-largest weekly withdrawal of 2026 and the third-largest in nine years. The cause is singular and clear: the 10-year yield above 5.11%, the highest since 2007, and small-cap borrowing costs are the most sensitive thing to that line.", "url": "https://www.benzinga.com/etfs/sector-etfs/26/09/61982431/small-caps-crushed-iwm-sees-3-3b-outflow-treasury-yields-surge", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，報 282.74 美元，上週淨流出 33 億美元"}, {"t": "IJR", "n": "標普小型股 600 ETF，成分要求獲利，跌勢與 IWM 不完全同步"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "年線與近況", "color": "#5B8ED6", "zh": "這裡有一個容易誤讀的落差：羅素 2000 今年以來仍漲超過 21%，是 1991 年以來最好的年度開局；但從八月中算起，它跌了 7.3%。兩個數字都是真的，講的是不同的事。上半年的動能來自大型 AI 股過度集中之後的資金外溢、企業獲利成長面擴大、併購活絡與 IPO 市場回溫；八月中之後的回檔則純粹是利率。如果你只看年報酬，你會以為小型股正在贏；如果你只看六週，你會以為它崩了。實際上是同一批股票換了一個貼現率。", "en": "Here is a gap that is easy to misread: the Russell 2000 is still up more than 21% year to date, its best start to a year since 1991 — and it is down 7.3% since mid-August. Both numbers are true and they describe different things. The first half was driven by money spilling out of over-concentrated mega-cap AI, broadening earnings growth, active M&A and a reopened IPO market. The drawdown since mid-August is purely about rates. Look only at the year and you conclude small caps are winning; look only at six weeks and you conclude they broke. It is the same set of companies with a different discount rate.", "url": "https://seekingalpha.com/article/4920445-russell-2000-soars-21-percent-ytd-4-top-small-cap-stocks", "stocks": [{"t": "IWO", "n": "羅素 2000 成長股 ETF，上半年資金外溢的主要受惠者"}, {"t": "IWN", "n": "羅素 2000 價值股 ETF，利率上行時與成長股的分歧會放大"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "為什麼先斷", "color": "#5B8ED6", "zh": "知識卡：為什麼利率一動，小型股永遠先斷。三個結構性原因。第一，浮動利率債務佔比高——小公司借的多半是銀行聯貸與循環額度，利率一升，利息費用當季就反映，不像大公司發十年期固定票息躲得掉。第二，再融資牆——小型股的債務到期期限普遍短，今年到期的，就得用今天的利率換約。第三，獲利基礎薄——羅素 2000 有相當比例的成分股不賺錢，貼現率一升，遠期現金流的現值折損比有當期獲利的公司更劇烈。這三件事跟基本面好壞無關，是資本結構決定的。", "en": "A knowledge card: why small caps always break first when rates move. Three structural reasons. First, a high share of floating-rate debt — smaller companies borrow mostly through bank syndicates and revolvers, so a rate rise shows up in interest expense the same quarter, unlike large caps sitting on ten-year fixed coupons. Second, the refinancing wall — small-cap debt maturities are shorter on average, so whatever comes due this year gets refinanced at today's rate. Third, a thin earnings base — a meaningful share of the Russell 2000 is unprofitable, and when the discount rate rises, the present value of distant cash flows falls harder than it does for companies earning money now. None of this is about business quality; it is capital structure.", "url": "https://www.benzinga.com/etfs/sector-etfs/26/09/61982431/small-caps-crushed-iwm-sees-3-3b-outflow-treasury-yields-surge", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，浮動利率債務佔比是它對利率敏感的主因"}, {"t": "IJS", "n": "標普小型價值股 ETF，資本結構相對保守的對照組"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "流動性不是訊息", "color": "#5B8ED6", "zh": "週五小型股本身只微漲，IWM 上漲 0.06%，但個股層面出現幾筆極端波動：INLIF Limited（INLF）在放量中暴漲 110.5%，The Marygold Companies（MGLD）漲 95.5%，Powell Max（PMAX）跌 20.9%。這種等級的單日變動在微型市值裡不罕見，也幾乎從來不是基本面。原因是流通在外股數與日均量太小，任何一筆規模稍大的買賣都會直接推動價格。把這類漲幅當成訊號去追，追到的是流動性缺口，不是資訊。", "en": "Small caps themselves barely moved on Friday, with IWM up 0.06%, but individual names produced extremes: INLIF Limited (INLF) jumped 110.5% on heavy volume, The Marygold Companies (MGLD) rose 95.5% and Powell Max (PMAX) fell 20.9%. Moves of that size are not unusual in micro caps, and they are almost never fundamental. With tiny floats and thin average volume, any moderately sized order pushes the price directly. Chase a move like that as a signal and what you are buying is a liquidity gap, not information.", "url": "https://stockmarketwatch.com/live/stock-market-today", "stocks": [{"t": "INLF", "n": "INLIF Limited，週五放量暴漲 110.5%，典型的微型股流動性事件"}, {"t": "MGLD", "n": "The Marygold Companies，週五漲 95.5%，同樣屬於極小流通量"}, {"t": "PMAX", "n": "Powell Max，週五跌 20.9%，反向的同一種現象"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "池子不一樣", "color": "#5B8ED6", "zh": "判讀小型股時，先確認你在講哪一個池子，因為答案會不同。羅素 2000 純粹按市值排序，不看獲利，所以裡面混了大量虧損公司與生技；標普小型股 600（IJR）要求公司在納入前有連續獲利，等於先做了一層品質篩選。在利率上行的環境裡，這個差別會被放大：同一段時間，兩個指數的跌幅、估值與破產風險都不一樣。所以「小型股便宜了嗎」這個問題，如果不先講清楚是哪一個指數，基本上沒有答案。", "en": "When you read small caps, first establish which pool you mean, because the answer changes. The Russell 2000 ranks purely by market capitalisation with no profitability test, so it carries a large tail of loss-making companies and biotech. The S&P SmallCap 600 (IJR) requires a record of positive earnings before inclusion — a quality screen applied up front. In a rising-rate environment that difference is amplified: over the same stretch, the two indices differ in drawdown, valuation and bankruptcy risk. So the question \"are small caps cheap now\" has no answer until you say which index you are talking about.", "url": "https://seekingalpha.com/article/4920445-russell-2000-soars-21-percent-ytd-4-top-small-cap-stocks", "stocks": [{"t": "IJR", "n": "標普小型股 600 ETF，納入前要求連續獲利，品質篩選較嚴"}, {"t": "VB", "n": "Vanguard 小型股 ETF，追蹤 CRSP 指數，成分定義又是另一套"}, {"t": "VTWO", "n": "Vanguard 羅素 2000 ETF，與 IWM 同指數但費用率不同"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "重複加碼", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報", "zh": "CapsoVision（CV）做什麼：微型市值醫材公司，做膠囊內視鏡——病人吞下一顆帶攝影機的膠囊，拍攝小腸與大腸影像做息肉篩檢，主力產品是 CapsoCam Plus 與 CapsoCam Colon。為什麼被忽視：2025 年 7 月才以每股 5 美元掛牌、募資規模只有約 3,000 萬美元，市值極小、賣方覆蓋幾乎沒有，媒體聲量接近零。什麼正在改變：10% 以上大股東在 9/15 至 9/18 買進 878,735 股、金額約 500 萬美元，均價約 5.69 美元；過去六個月該股東共五次買進、累計 1,913,687 股、約 1,100 萬美元，同期內部人零賣出。風險與反方論點：買盤高度集中在單一大股東，這是估值判斷不是營運資訊；膠囊內視鏡要跟美敦力的 PillCam 正面競爭，給付與通路都是既有者的主場；微型醫材的現金消耗速度是生死線。這是研究線索，不是投資建議。", "en": "What CapsoVision (CV) does: a micro-cap medical device company in capsule endoscopy — the patient swallows a camera capsule that images the small bowel and colon for polyp screening, sold as CapsoCam Plus and CapsoCam Colon. Why it is ignored: it only listed in July 2025 at $5.00 a share on a roughly $30 million raise, leaving a tiny market capitalisation, almost no sell-side coverage and close to zero media volume. What is changing: a holder of more than 10% bought 878,735 shares for about $5.0 million between September 15 and 18 at an average near $5.69. Over the past six months that same holder has made five purchases totalling 1,913,687 shares and roughly $11.0 million, with zero insider sales over the period. Risks and the bear case: the buying is concentrated in one shareholder, which is a valuation judgement rather than operating information; capsule endoscopy competes head-on with Medtronic's PillCam, where reimbursement and distribution favour the incumbent; and cash burn is the survival constraint for a device company this small. This is a research lead, not investment advice.", "url": "https://www.marketbeat.com/instant-alerts/insider-insider-buying-capsovision-nasdaq-cv-major-shareholder-buys-878734-shares-2026-09-18/", "stocks": [{"t": "CV", "n": "CapsoVision，9/15-9/18 大股東買進約 500 萬美元，六個月累計約 1,100 萬"}, {"t": "MDT", "n": "美敦力，PillCam 的持有者，是膠囊內視鏡的既有龍頭與最大對手"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "逆向的那一筆", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報", "zh": "Nayax（NYAX）做什麼：無人化收款平台，把刷卡機、遠端管理與會員系統裝進自動販賣機、洗車機、電動車充電樁與洗衣店這類沒有店員的場景。為什麼被忽視：以色列公司、雙重掛牌，美國賣方覆蓋薄，市值不大，業務被歸類成「支付」但實際更像硬體加訂閱的混合體。什麼正在改變：共同創辦人兼執行長與董事長 Yair Nechmad 在 9/24 買進 104,511 股，金額約 461 萬美元，成交均價約 44 美元。這一筆的意義在於它的方向——同期六個月內公司內部人共 54 筆交易，其中 49 筆是賣出，財務長、行銷長、總裁都在賣。風險與反方論點：一個人買、一群人賣，最保守的解讀是執行長在做訊號管理；而且高階主管持續減碼本身就是一個需要解釋的訊號，不能因為執行長買了就當它不存在。這是研究線索，不是投資建議。", "en": "What Nayax (NYAX) does: an unattended payments platform that puts card readers, remote management and loyalty into places with no staff — vending machines, car washes, EV chargers, laundromats. Why it is ignored: an Israeli company with a dual listing, thin US sell-side coverage and a modest market capitalisation, filed under \"payments\" when it is really a hardware-plus-subscription hybrid. What is changing: co-founder, CEO and chairman Yair Nechmad bought 104,511 shares on September 24 for roughly $4.61 million, an average near $44. The significance is the direction — over the same six months insiders logged 54 open-market trades, 49 of them sales, including the CFO, CMO and president. Risks and the bear case: one buyer against a crowd of sellers invites the reading that the CEO is managing a signal, and persistent selling by the executive bench is itself something that needs explaining rather than something the CEO's purchase erases. This is a research lead, not investment advice.", "url": "https://www.quiverquant.com/stock/NYAX/insiders/", "stocks": [{"t": "NYAX", "n": "Nayax，執行長 9/24 買進約 461 萬美元，但同期內部人 54 筆交易有 49 筆是賣出"}, {"t": "TOST", "n": "Toast，同樣是硬體加訂閱模式的支付平台，可作估值對照"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "董事十連買", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報與管線讀數", "zh": "Prothena（PRTA）做什麼：臨床階段生技公司，主攻蛋白質異常堆積造成的疾病，管線集中在神經退化與類澱粉沉積症領域。為什麼被忽視：試驗挫敗之後股價長期低迷，賣方陸續放棄覆蓋，股價目前只有個位數美元，屬於被市場判定為「故事結束」的那一類。什麼正在改變：董事 William P. Scully 在過去六個月做了十次買進、零賣出，累計 559,500 股、約 496 萬美元；最近一筆是 9/18 買進 100,000 股，均價約 8.43 美元。這是少見的單人連續加碼型態，而且已經持續了半年。風險與反方論點：臨床期生技的價值是二元的，讀數不過就歸零，董事的錢也一樣會沒；買盤同樣集中在一個人；現金可撐月數是這類公司真正的生死線，要先看 runway 再看管線。這是研究線索，不是投資建議。", "en": "What Prothena (PRTA) does: a clinical-stage biotech focused on diseases caused by misfolded protein accumulation, with a pipeline concentrated in neurodegeneration and amyloid disorders. Why it is ignored: after trial setbacks the stock has been depressed for a long stretch, sell-side coverage has been dropped, and it now trades in single digits — the market has filed it under \"story over.\" What is changing: director William P. Scully has made ten open-market purchases and zero sales over the past six months, totalling 559,500 shares for about $4.96 million, most recently 100,000 shares on September 18 at an average near $8.43. Sustained single-buyer accumulation over half a year is an unusual pattern. Risks and the bear case: clinical-stage biotech is binary — a failed readout takes the value to nothing, including the director's money; the buying is again concentrated in one person; and cash runway, not the pipeline, is the real survival constraint to check first. This is a research lead, not investment advice.", "url": "https://www.quiverquant.com/stock/PRTA/insiders/", "stocks": [{"t": "PRTA", "n": "Prothena，董事六個月內十次買進、累計約 496 萬美元，零賣出"}, {"t": "XBI", "n": "生技 ETF，年初至今漲 26%，但被放棄覆蓋的個股並未跟上"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "分拆倒數", "color": "#C9A227", "status": "RADAR · 下一個驗證點 IRS 私函裁定與 Form 10 生效", "zh": "KBR（池內名單，2026-08-09 入池）做什麼：工程與政府服務集團，正在把 Mission Technology Solutions（國防與情報技術服務）分拆成獨立上市公司。為什麼被忽視：兩塊業務混在一起估值，市場用工程承包的倍數評價其中一半是政府技術服務的資產。什麼正在改變：分拆目標日期訂在 2027 年 1 月 4 日，也就是新會計年度的第一個營業日。但條件還沒補齊——需要美國國稅局關於免稅分拆的私函裁定（或法律意見）、向證管會申報的 Form 10 生效、融資完成與其他監管核准。到 9 月底為止，沒有看到裁定已下的公開消息，也就是說入池時列的這個驗證點還沒交卷。風險與反方論點：分拆日期離現在還有三個月，中間任何一項條件卡住都會延期；分拆本身不創造價值，只是換一個估值框架；政府預算週期是兩邊共同的外部風險。這是研究線索，不是投資建議。", "en": "What KBR (in the pool since 2026-08-09) does: an engineering and government services group in the process of spinning off Mission Technology Solutions, its defence and intelligence technology arm, into a separate listed company. Why it is ignored: the two businesses are valued as one, so half the asset base — government technology services — is being priced on engineering-contractor multiples. What is changing: the spin-off targets January 4, 2027, the first business day of the new fiscal year. The conditions are not yet met: it still requires an IRS private letter ruling (or tax opinion) on tax-free treatment, an effective Form 10 with the SEC, completed financing and other regulatory clearances. As of late September there is no public word that the ruling has been issued, meaning the checkpoint set when this name entered the pool has not yet been answered. Risks and the bear case: the date is still three months out and any unmet condition pushes it; a spin-off creates no value by itself, it only changes the valuation frame; and the federal budget cycle is a shared external risk for both halves. This is a research lead, not investment advice.", "url": "https://investors.kbr.com/news-and-events/spin-off-information/", "stocks": [{"t": "KBR", "n": "分拆目標日 2027/1/4，仍待 IRS 裁定與 Form 10 生效"}, {"t": "LDOS", "n": "Leidos，分拆後 Mission Technology 的直接對標同業"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "社區銀行考卷", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月下旬 Q3 財報", "zh": "Private Bancorp of America（PBAM，池內名單，2026-08-19 入池）做什麼：加州的社區銀行控股公司，以 CalPrivate Bank 品牌服務中小企業與專業人士客群。為什麼被忽視：市值小、幾乎沒有大型券商覆蓋，被歸類在整個區域銀行族群裡一起漲跌。什麼正在改變：外部環境從順風轉成逆風，而且是可量化的——本週金融板塊跌 2.4%、評等被降到中立，升息週期讓存款成本先漲、放款收益率後補，淨息差被兩頭夾。入池時的論點建立在淨息差守住 5% 以上與每股盈餘連續墊高，這兩件事在 10 月下旬的 Q3 財報會一次交卷。風險與反方論點：社區銀行的存款成本壓力在升息初期最猛，若淨息差是靠拉高借款堆量守住，那品質是假的；加州商用不動產曝險是另一條要獨立檢查的線；再者，池內有超過十家社區銀行，這一次的財報季會把它們一起分等級。這是研究線索，不是投資建議。", "en": "What Private Bancorp of America (PBAM, in the pool since 2026-08-19) does: a California bank holding company operating as CalPrivate Bank, serving small and mid-sized businesses and professional clients. Why it is ignored: small market capitalisation, almost no large-broker coverage, and it trades as part of the regional bank complex rather than on its own numbers. What is changing: the external environment has flipped from tailwind to headwind, and measurably so — Financials fell 2.4% this week and were cut to Hold, because in a hiking cycle deposit costs rise first and loan yields follow, squeezing net interest margin from both sides. The thesis on entry rested on holding a margin above 5% and a rising earnings per share, and the late-October third-quarter report answers both at once. Risks and the bear case: deposit-cost pressure is fiercest early in a hiking cycle; a margin defended by piling on borrowings is not real quality; California commercial real estate exposure is a separate line to check; and with more than ten community banks in the pool, this reporting season will sort them into tiers. This is a research lead, not investment advice.", "url": "https://stockanalysis.com/stocks/pbam/", "stocks": [{"t": "PBAM", "n": "池內加州社區銀行，Q3 財報將驗證淨息差能否守住 5% 以上"}, {"t": "BANR", "n": "Banner Corporation，同為池內西部社區銀行，可作同期對照"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "交割截止日", "color": "#C9A227", "status": "RADAR · 下一個驗證點 9/30 前 Long Ridge 是否交割", "zh": "FTAI Infrastructure（FIP，池內名單，2026-08-31 入池）做什麼：持有並營運鐵路（Transtar）、港口碼頭與能源基礎設施資產，收費模式為主、長約居多。為什麼被忽視：它是從 FTAI Aviation 分拆出來的資產組合，市場習慣把它當成母公司的附屬品看，而不是一家獨立的基礎設施營運商。什麼正在改變：這一檔的驗證點是一個硬日期——入池時列的最關鍵單一事件是 Long Ridge 交易能否在 2026 年第三季完成交割，而第三季在下週三（9/30）就結束。交割了，資產組合與現金流結構跟著變；沒交割，這條論點就要暫停重估。風險與反方論點：基礎設施資產本身槓桿高，30 年期殖利率停在 5.463% 直接墊高它的再融資成本；港口與鐵路量能跟工業景氣連動，本週工業板塊下跌 1.5%；交易延期在這類案子裡很常見，不宜把日期當成保證。這是研究線索，不是投資建議。", "en": "What FTAI Infrastructure (FIP, in the pool since 2026-08-31) does: it owns and operates rail (Transtar), port terminals and energy infrastructure, mostly on fee-based, long-contract models. Why it is ignored: it was carved out of FTAI Aviation and the market still treats it as an appendage of the parent rather than a standalone infrastructure operator. What is changing: this name's checkpoint is a hard date — the single most important event flagged on entry was whether the Long Ridge transaction closes within the third quarter of 2026, and the quarter ends this coming Wednesday, September 30. If it closes, the asset mix and cash flow structure change with it; if it does not, the thesis goes on hold pending a re-rate. Risks and the bear case: infrastructure assets carry high leverage, and a 30-year yield parked at 5.463% raises refinancing costs directly; port and rail volumes track the industrial cycle, and Industrials fell 1.5% this week; and deal slippage is common enough in transactions like this that the date should not be read as a guarantee. This is a research lead, not investment advice.", "url": "https://stockanalysis.com/stocks/fip/", "stocks": [{"t": "FIP", "n": "池內基礎設施資產持有者，Long Ridge 交割窗口在 9/30 關閉"}, {"t": "FTAI", "n": "FTAI Aviation，分拆母公司，市場常把兩者綁在一起評價"}]},
    {"id": "insider_0", "channel": "內部人動向", "tag": "群聚在銀行", "color": "#6DB56D", "zh": "看內部人買進，單筆意義有限，群聚才有訊號價值。最新統計顯示，過去三十天內有 63 家美國掛牌公司出現有效的內部人群聚買進，其中 21 家是三位以上不同內部人分別進場；產業分布上最密集的是銀行，共 9 個群聚。這個分布本身就是資訊——銀行正是本週被賣最兇的族群之一。最極端的案例是巴西的 Bradesco：過去六個月內部人共 36 筆交易，其中 24 筆是買進，橫跨十幾位執行官，單一執行官最大一筆就買了約 556 萬美元。判讀提醒：群聚買進說明的是「多個不同視角的人各自算完帳都覺得便宜」，不說明時點。", "en": "With insider buying, a single purchase means little — clusters carry the signal. The latest count shows 63 US-listed companies with an active insider-buying cluster over the past thirty days, 21 of them with three or more separate insiders buying. The most concentrated industry is Banks, with 9 clusters. That distribution is itself information, since banks were among the hardest-sold groups this week. The most extreme case is Brazil's Bradesco: 36 insider trades over six months, 24 of them purchases, spread across more than a dozen executive officers, with the largest single buy around $5.56 million. A reading note: cluster buying tells you several people with different vantage points each did the arithmetic and concluded the stock is cheap. It says nothing about timing.", "url": "https://insideraction.io/learn/cluster-buying-guide", "stocks": [{"t": "BBD", "n": "Bradesco，六個月內 36 筆內部人交易有 24 筆是買進，橫跨十餘位執行官"}, {"t": "ITUB", "n": "Itaú Unibanco，巴西銀行同業，可作同期內部人行為對照"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "買自家收益", "color": "#6DB56D", "zh": "這一週有兩筆型態相同、方向一致的買進值得並排看。General American Investors 的董事長 Spencer Davidson 在 9/23 買進 10,000 股該公司 5.95% 的特別股，金額 22.75 萬美元；同日行政副總裁 Eugene Stark 也買進 5,000 股，每股 22.75 美元、約 11.4 萬美元。另一邊，PIMCO Dynamic Income Fund 的董事 Sonya Morris 在 9/22 買進 5,700 股，每股 14.02 美元、約 8 萬美元。三筆都不是普通股，都是收益型工具，而且都發生在長端殖利率創 2004 年以來新高的同一週。判讀提醒：這說明的是他們認為自家標的的折價或票息已經足以補償利率風險，不代表他們判斷利率會轉向。", "en": "Two transactions of the same shape and direction are worth reading side by side this week. Spencer Davidson, chairman of General American Investors, bought 10,000 shares of the fund's 5.95% preferred on September 23 for $227,500, and on the same day VP of administration Eugene Stark bought 5,000 shares at $22.75 for about $113,750. Separately, PIMCO Dynamic Income Fund director Sonya Morris bought 5,700 shares on September 22 at $14.02, roughly $79,900. None of these are common stock — all three are income instruments, and all three happened in the same week the long end hit its highest yield since 2004. A reading note: this says the buyers judged the discount or the coupon on their own vehicle sufficient to compensate for rate risk. It does not say they expect rates to turn.", "url": "https://www.gurufocus.com/news/9096559/director-sonya-morris-buys-5700-shares-of-pimco-dynamic-income-fund-pdi", "stocks": [{"t": "GAM", "n": "General American Investors，董事長與行政副總裁同日買進自家 5.95% 特別股"}, {"t": "PDI", "n": "PIMCO Dynamic Income Fund，董事 9/22 以 14.02 美元買進 5,700 股"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "金額不是重點", "color": "#6DB56D", "zh": "Dycom Industries 的董事 Carmen M. Sabater 在 9/23 以每股 280.62 美元買進 350 股，總額 98,217 美元。單看金額，這在本週的名單裡幾乎排不上；但這筆的資訊量在價位——她是在股價 280 美元、經歷一大段漲勢之後進場的，不是在低點撿便宜。Dycom 做的是電信與光纖的工程施工，是資料中心與寬頻布建的下游承包端。判讀提醒：內部人買進的訊號強度，要看金額相對於這個人的既有持股與年薪酬的比例，不是看絕對美元數字；一位董事拿出將近十萬美元自有資金在高位加碼，跟一位執行長象徵性買一百股，是兩件事。", "en": "Dycom Industries director Carmen M. Sabater bought 350 shares on September 23 at $280.62, a total of $98,217. By dollar size that barely registers on this week's list; the information is in the price. She stepped in at $280 after a long run, not bottom-fishing at a low. Dycom builds telecom and fibre networks — the contracting end of data-centre and broadband buildout. A reading note: the strength of an insider purchase depends on its size relative to that person's existing holding and annual compensation, not on the absolute dollar figure. A director committing nearly $100,000 of their own money at an elevated price is a different event from a CEO buying a token hundred shares.", "url": "https://www.investing.com/news/stock-market-news/top-insider-buys-and-sells-disclosed-on-thursday-93CH-4917572", "stocks": [{"t": "DY", "n": "Dycom Industries，董事 9/23 以 280.62 美元買進 350 股，約 9.8 萬美元"}, {"t": "MTZ", "n": "MasTec，電信與能源基礎建設施工同業，可作景氣對照"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "氣候的兩端", "color": "#B5654D", "zh": "從眾議院書記官的官方申報索引重算九十天名單，這一批裡部位主題最清楚的是佛州眾議員 Maria Elvira Salazar：25 筆交易、18 筆買進 7 筆賣出，申報金額區間 17.9 萬到 76 萬美元，最近一份申報在 9/9。值得看的是組合本身——Brookfield Renewable（BEP）、波克夏 B 股、Chubb（CB）與開利（CARR）。這不是 AI 押注，而是一組氣候調適的兩端：CB 與波克夏是產險承保端，賺的是極端天候下的定價權；CARR 是空調與冷卻設備，賣的是變熱之後的需求；BEP 是發電端。這筆錢押的假設是「氣候風險會同時抬高保費與用電」。", "en": "Recomputing the ninety-day list from the House Clerk's official filing index, the clearest thematic position in this batch belongs to Florida Representative Maria Elvira Salazar: 25 transactions, 18 purchases against 7 sales, in a disclosed range of $179,000 to $760,000, with her most recent filing on September 9. What stands out is the basket itself — Brookfield Renewable (BEP), Berkshire Hathaway B shares, Chubb (CB) and Carrier (CARR). This is not an AI bet. It is a climate-adaptation trade taken from both ends: Chubb and Berkshire are property-casualty underwriters earning pricing power in extreme weather, Carrier sells air conditioning and cooling into a hotter world, and Brookfield Renewable is generation. The assumption behind the money is that climate risk lifts premiums and electricity demand at the same time.", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure", "stocks": [{"t": "CB", "n": "Chubb，產險承保端，極端天候下的費率定價權"}, {"t": "CARR", "n": "開利，空調與冷卻設備，對應升溫後的需求端"}, {"t": "BEP", "n": "Brookfield Renewable，再生能源發電，同一組合的第三條腿"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "只有區間", "color": "#B5654D", "zh": "這是固定的判讀卡，今天的角度是金額。STOCK Act 的申報表不要求議員填寫實際成交金額，只要求勾選一個級距，所以這個頻道能算出來的永遠是一個區間而不是一個數字——上面那組 Salazar 的申報，加總後的區間是 17.9 萬到 76 萬美元，上下相差超過四倍。你因此無法知道部位大小，也就無法知道這筆交易在她的總資產裡佔多少比重，而比重才是信心的度量。再加上 45 天的申報延遲、多數交易由配偶或信託帳戶執行，以及選擇權的履約價與到期日往往比標的本身更有資訊量——這四件事疊起來，就是這個頻道不做買賣建議的原因。", "en": "This is the standing reading card, and today's angle is size. The STOCK Act filing form does not ask members to state the actual value of a trade, only to tick a bracket, so what this channel can compute is always a range rather than a number. The Salazar filings above total a range of $179,000 to $760,000 — a span of more than four times. You therefore cannot know the position size, and without it you cannot know what share of her total assets the trade represents — and share of assets is the measure of conviction. Add the 45-day reporting lag, the fact that most transactions are executed in spouse or trust accounts, and that an option's strike and expiry usually carry more information than the underlying, and you have the four reasons this channel does not issue buy or sell calls.", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure", "stocks": [{"t": "NANC", "n": "追蹤民主黨議員申報持股的 ETF，是這個頻道的績效對照工具"}, {"t": "GOP", "n": "追蹤共和黨議員申報持股的 ETF，同樣只能複製 45 天前的資訊"}]},

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>

  );
}

function ThemeToggle() {

      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ height:"300px", flexShrink:0 }} />

      {R.roster.length > 0 && (
        <div style={{ paddingTop:"20px" }}>
          <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 6px" }}>
            <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>個別議員 · 近 {R.window} 天申報</span>
            <span style={{ fontSize:"10px", color:"var(--text-tertiary)" }}>更新 {R.updated}</span>
          </div>
          <div style={{ padding:"0 16px 12px", fontSize:"11px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            眾議院 STOCK Act 定期交易報告（PTR）原始申報書彙整，共 {R.filings} 份、其中 {R.skipped_scanned} 份是紙本掃描件無法解析。金額只有級距沒有數字，絕大多數落在最低的 $1,001–$15,000，所以下面顯示的是<span style={{ color:"var(--text-secondary, inherit)" }}>申報區間</span>而不是實際金額——別把它當成真實部位大小。點議員名字可看原始申報書。
          </div>
          <div style={{ overflowX:"auto", padding:"0 16px" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"12px" }}>
              <thead>
                <tr style={{ color:"var(--text-tertiary)", fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", textTransform:"uppercase" }}>
                  <th style={{ textAlign:"left",  padding:"6px 8px 6px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>議員</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>筆數</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>買 / 賣</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>申報區間</th>
                  <th style={{ textAlign:"left",  padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>常見標的</th>
                  <th style={{ textAlign:"right", padding:"6px 0 6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>最新申報</th>
                </tr>
              </thead>
              <tbody>
                {R.roster.map(r => (
                  <tr key={r.name + r.dst}>
                    <td style={{ padding:"7px 8px 7px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      <a href={r.url} target="_blank" rel="noopener noreferrer" style={{ color:"#B5654D", textDecoration:"none" }}>{r.name}</a>
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px", marginLeft:"6px" }}>{r.dst}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums" }}>{r.n}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>
                      <span style={{ color:"#6DB56D" }}>{r.buy}</span>
                      <span style={{ color:"var(--text-tertiary)" }}> / </span>
                      <span style={{ color:"#E05C5C" }}>{r.sell}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>{money(r.lo)}–{money(r.hi)}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      {r.top.map(t => (
                        <a key={t} href={"https://www.tradingview.com/symbols/" + t + "/"} target="_blank" rel="noopener noreferrer"
                           style={{ color:"var(--text-secondary, inherit)", textDecoration:"none", marginRight:"7px", fontFamily:"'Courier New',monospace" }}>{t}</a>
                      ))}
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px" }}>共 {r.distinct} 檔</span>
                    </td>
                    <td style={{ padding:"7px 0 7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", whiteSpace:"nowrap" }}>{r.last}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ padding:"12px 16px 0", fontSize:"10px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            只涵蓋眾議院；參議院走另一套 efdsearch 系統，尚未納入。買＋賣不一定等於筆數，差額是交換（exchange）類交易。
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/26/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v12.3</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
