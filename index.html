<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "earn_0", "channel": "財報速報", "tag": "電路板廠發債", "color": "#E8786A", "zh": "印刷電路板廠 TTM Technologies 週四訂價 5 億美元、票面利率 6.750%、2034 年到期的優先債，週五股價不跌反漲 3.70%，收 126.86 美元。市場願意買單的理由在週三的 Jefferies 工業研討會：管理層說營收規模已從 29 億美元擴大到 44 億美元，最近一季營業利益率 16.5%、全年目標 18%，約一半營收來自 AI 與資料中心、約四成來自航太國防。一家常被當成「板子廠」估值的公司，營收結構已經更像國防供應鏈加 AI 基礎建設。", "en": "Printed circuit board maker TTM Technologies priced $500 million of 6.750% senior notes due 2034 on Thursday, and the stock rose 3.70% on Friday to $126.86 instead of falling. The reason investors bought in came at Wednesday's Jefferies industrials conference: management said revenue has grown from $2.9 billion to $4.4 billion, the latest quarterly operating margin reached 16.5% with an 18% full-year target, and roughly half of revenue comes from AI and data centers and about 40% from aerospace and defense. A company often valued like a board shop now has a revenue mix closer to a defense supplier plus AI infrastructure.", "url": "https://ng.investing.com/news/stock-market-news/ttm-technologies-at-jefferies-global-industrials-conference-2026-growth-broadens-93CH-2690118", "stocks": [{"t": "TTMI", "n": "TTM Technologies，發債 5 億美元，週五漲 3.70% 收 126.86 美元"}, {"t": "SANM", "n": "Sanmina，電子製造服務同業，同樣受惠 AI 伺服器與網通需求（對照組）"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "週一吃喝玩樂", "color": "#E8786A", "zh": "Dave & Buster's 週一盤後公布第二季（截至 8 月 4 日）財報，約台灣時間週二清晨。市場預估每股盈餘 0.92 美元、年減 17.9%，營收 5.627 億美元、只年增 1.0%。這份財報的看點不在數字本身，而在時間點：油價在百元上下、密西根大學消費者信心掉到 47.8。餐飲加遊樂這種可選消費，是家庭預算最先被砍的一塊，若同店銷售比預期更差，會是消費降溫的第一批硬資料。", "en": "Dave & Buster's reports second-quarter results (for the period ended Aug. 4) after the bell on Monday. Consensus expects EPS of $0.92, down 17.9% year over year, on revenue of $562.7 million, up just 1.0%. The numbers matter less than the timing: oil is hovering around $100 and University of Michigan consumer sentiment has dropped to 47.8. Eat-and-play spending is one of the first items households cut, so a worse-than-expected same-store sales print would be among the first hard evidence of a consumer slowdown.", "url": "https://www.globenewswire.com/news-release/2026/09/01/3354272/22805/en/dave-buster-s-entertainment-inc-to-report-second-quarter-2026-financial-results-on-september-14-2026.html", "stocks": [{"t": "PLAY", "n": "Dave & Buster's，9/14 盤後財報，預估 EPS 0.92 美元、年減 17.9%"}, {"t": "LUCK", "n": "Lucky Strike Entertainment，保齡球娛樂連鎖，同類體驗型消費的對照組"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "指引裡的紅利", "color": "#E8786A", "zh": "切削刀具與鎢材料廠 Kennametal 上一季成績很亮：營收 7.37 億美元、年增 43%，調整後每股盈餘 2.96 美元創紀錄，整個會計年度調整後每股盈餘從 1.34 美元跳到 4.57 美元。但 2027 會計年度指引值得細讀：每股盈餘 4.15 到 5.15 美元，區間寬達一美元，其中約 0.39 美元來自原料計價時間差的好處、集中在上半年；前提還寫明鎢價維持現有水準、中東衝突不明顯影響客戶。上週四執行長自掏腰包買股，是在這份指引公布之後。", "en": "Cutting-tool and tungsten materials maker Kennametal posted a strong last quarter: sales of $737 million, up 43%, and record adjusted EPS of $2.96, lifting full-year adjusted EPS from $1.34 to $4.57. The fiscal 2027 guidance deserves a closer read: EPS of $4.15 to $5.15, a dollar-wide range, including roughly $0.39 of favorable raw-material pricing timing concentrated in the first half, and it assumes stable tungsten prices and no material hit to customers from the Middle East conflict. The CEO's open-market purchase last Thursday came after that guidance was published.", "url": "https://investors.kennametal.com/news-releases/news-release-details/kennametal-reports-fiscal-2026-and-fourth-quarter-results", "stocks": [{"t": "KMT", "n": "Kennametal，FY27 指引 EPS 4.15–5.15 美元，含約 0.39 美元原料時間差紅利"}, {"t": "XLI", "n": "工業類股 ETF，KMT 的終端需求橫跨航太國防、能源與礦業"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "點陣圖比決定重要", "color": "#7C6AF7", "zh": "聯準會週三（台灣時間週四凌晨 2 點）公布利率決議，同時更新經濟預測摘要與點陣圖。期貨已把升息一碼當成約九成的定局，所以真正會移動市場的是點陣圖：6 月那一版有 9 位委員預估今年至少升息一次、8 位預估按兵不動，年底利率預估落在 3.6% 到 4.1%。這次要看的是，升完這一碼之後還有多少人畫了下一碼。另一個細節：主席華許上任後沒有交出自己的那一點，所以無法直接從點陣圖讀出主席立場。", "en": "The Fed announces its decision on Wednesday at 2 p.m. ET, alongside an updated Summary of Economic Projections and dot plot. With futures treating a quarter-point hike as roughly a 90% certainty, the dots are what will move markets. In June, nine members projected at least one hike this year and eight saw no change, with year-end projections between 3.6% and 4.1%. The question now is how many members pencil in another hike after this one. One more detail: Chair Warsh has not submitted his own dot since taking office, so the plot cannot be read directly for the chair's view.", "url": "https://finance.yahoo.com/economy/policy/article/fed-dot-plot-almost-half-of-fomc-members-project-at-least-one-interest-rate-hike-this-year-183645064.html", "stocks": [{"t": "SHY", "n": "1-3 年期公債 ETF，對點陣圖描繪的短端利率路徑最敏感"}, {"t": "IEF", "n": "7-10 年期公債 ETF，10 年期殖利率週五收在 4.97% 附近"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "需求縮庫存更縮", "color": "#7C6AF7", "zh": "國際能源署 9 月月報把 2026 年全球石油需求改為年減每日 250 萬桶，比上個月再多砍 94 萬桶，是疫情以來最大的年度衰退。但這不是「需求不見所以油價會跌」的故事：同一份報告顯示，8 月全球可觀測庫存再降 9,500 萬桶，2 月以來累計減少 5.07 億桶、平均每天少 280 萬桶，海上在途油量也少了 6,500 萬桶。需求在縮、庫存縮得更快，是供給中斷壓過需求破壞的格局，這也是聯準會很難把油價當成暫時因素的原因。", "en": "The IEA's September report now forecasts global oil demand falling by 2.5 million barrels a day in 2026, 940,000 b/d deeper than last month and the steepest annual drop since the pandemic. This is not a 'demand is gone so prices fall' story: the same report shows observed global inventories fell another 95 million barrels in August, bringing draws since February to 507 million barrels, or 2.8 million b/d, while oil on water fell 65 million barrels. Demand is shrinking but stocks are shrinking faster, meaning supply disruption is outrunning demand destruction, which is why the Fed struggles to treat oil as transitory.", "url": "https://www.iea.org/reports/oil-market-report-september-2026", "stocks": [{"t": "USO", "n": "美國原油 ETF，西德州原油週五收 100.13 美元"}, {"t": "XLE", "n": "能源類股 ETF，全球庫存持續下降支撐上游獲利"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "日英同週決議", "color": "#7C6AF7", "zh": "聯準會之後，英國央行（9/17）與日本央行（9/17-18）接連決議，同一週三大央行都站在「要不要再緊一點」的路口。日本央行 7 月以 8 比 1 維持利率 1%，唯一的反對票主張升到 1.25%，而且央行警告核心通膨從 9 月起可能超過 2%，市場隱含的升息機率約 62%。英國央行利率 3.75%，主張升息的反對票已連續三次會議增加，7 月有 Greene、Mann、Pill 三位要求升到 4.00%。若日本也升息，日圓套利交易回補可能在美國升息當週放大波動。", "en": "After the Fed, the Bank of England (Sept. 17) and Bank of Japan (Sept. 17-18) decide in the same week, with all three at a 'tighten further or not' crossroads. The BOJ held at 1% in July on an 8-1 vote, the lone dissenter seeking 1.25%, and warned core inflation could exceed 2% from September; markets imply about a 62% chance of a hike. The BOE sits at 3.75%, and hawkish dissents have grown for three straight meetings, with Greene, Mann and Pill voting for 4.00% in July. A Japanese hike could trigger yen carry-trade unwinds and amplify volatility in the same week as a U.S. hike.", "url": "https://www.cnbc.com/2026/07/31/boj-rates-yen-intervention-inflation-japan.html", "stocks": [{"t": "EWJ", "n": "日本股市 ETF，日銀 9/18 決議，隱含升息機率約 62%"}, {"t": "FXY", "n": "日圓 ETF，日銀升息會推升日圓、牽動套利交易"}, {"t": "EWU", "n": "英國股市 ETF，英國央行 9/17 決議，利率 3.75%"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "建商迎考週", "color": "#4EABA4", "zh": "30 年期房貸利率 9/10 升到 7.07%，是 2025 年 5 月以來首度站上 7%，2 月底以來累計升了將近 80 個基點。偏偏週五在油價回吐的那天，建商 ETF 漲了 1.60%、比大盤強。真正的考試在週三盤後：Lennar 第三季市場預估每股盈餘 1.30 美元（去年同期 2.00 美元）、營收年減 5% 至 83.7 億美元，股價距 52 週高點已跌 42.5%，全年交屋目標先前已下修到 8.2 至 8.3 萬戶。它的毛利率與促銷折扣，是整個建商板塊的溫度計。", "en": "The 30-year mortgage rate hit 7.07% on Sept. 10, above 7% for the first time since May 2025 and up nearly 80 basis points since late February. Yet on Friday, as oil gave back gains, the homebuilder ETF rose 1.60%, beating the market. The real test is Wednesday after the close: Lennar is expected to earn $1.30 a share in the third quarter versus $2.00 a year ago on revenue down 5% to $8.37 billion. The stock is 42.5% below its 52-week high, and full-year delivery targets were already cut to 82,000-83,000 homes. Its margins and incentives are the thermometer for the whole group.", "url": "https://news.alphastreet.com/lennar-len-expected-to-report-lower-q3-fy26-earnings-and-revenue/", "stocks": [{"t": "XHB", "n": "標普建商 ETF，週五漲 1.60%"}, {"t": "LEN", "n": "Lennar，9/16 盤後財報，預估 EPS 1.30 美元、營收 83.7 億美元"}, {"t": "KBH", "n": "KB Home，同業建商，Lennar 的毛利率與折扣會直接拿來對照"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "水務被利率壓", "color": "#4EABA4", "zh": "週五大盤上漲，「供水」族群卻跌 1.19%，是全市場表現最差的族群之一。水務公司是最典型的債券替代品：營收由州政府核准的費率決定，成長慢但穩定，靠持續舉債投資管線來擴大費率基數。10 年期殖利率逼近 5% 時，它們承受兩面壓力：配息的相對吸引力下降，新債的利息成本上升，而費率調整卻有時間落差。這不是基本面出事，是資金成本在重新定價。", "en": "The market rose on Friday, but the water supply group fell 1.19%, among the worst performers. Water utilities are the classic bond proxy: revenue is set by state-approved rates, growth is slow but steady, and they expand their rate base by continually borrowing to invest in pipes. With the 10-year yield near 5%, they face pressure on two fronts: their dividends look less attractive, and new debt costs more while rate adjustments lag. This is not a fundamental problem; it is the cost of capital being repriced.", "url": "https://stockmarketwatch.com/digest/2026-09-11", "stocks": [{"t": "AWK", "n": "American Water Works，全美最大上市水務公司，費率基數年增 6-8% 的模式最吃資金成本"}, {"t": "AWR", "n": "American States Water，加州水務，同屬債券替代品"}, {"t": "GWRS", "n": "Global Water Resources，鳳凰城一帶的小型水務（雷達池內），規模小、融資成本更敏感"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "資金押管線", "color": "#4EABA4", "zh": "上週標普 500 漲幅前五名，有三檔跟 AI 資料中心的連線與運算有關：光通訊元件的 Lumentum 單週漲 9.02%、Hewlett Packard Enterprise 漲 7.15%、光網路設備的 Ciena 漲 4.24%。週五小型股裡領漲的，也是印刷電路板（+4.96%）與電腦批發（+4.56%）族群。在殖利率兩年高、指數整週收黑的一週，資金仍集中押在 AI 基礎建設的「管線」而不是應用端，這跟 Adobe 財報優於預期卻下跌是同一面鏡子的兩面。", "en": "Three of the S&P 500's top five weekly gainers were tied to AI data-center connectivity and compute: optical component maker Lumentum rose 9.02%, Hewlett Packard Enterprise 7.15% and optical networking firm Ciena 4.24%. On Friday, the leading small-cap groups were printed circuit boards (+4.96%) and computer wholesalers (+4.56%). In a week of two-year-high yields and a lower index, money kept concentrating in AI infrastructure 'plumbing' rather than applications, the flip side of Adobe falling despite beating estimates.", "url": "https://www.stl.news/sp-500-winners-and-losers-this-week-sept-11-2026/", "stocks": [{"t": "LITE", "n": "Lumentum，光通訊元件，單週漲 9.02%、標普漲幅第一"}, {"t": "HPE", "n": "Hewlett Packard Enterprise，AI 伺服器，單週漲 7.15%"}, {"t": "CIEN", "n": "Ciena，光網路設備，單週漲 4.24%"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "週跌幅最深", "color": "#5B8ED6", "zh": "羅素 2000 上週跌約 2.1%，是主要指數裡最弱的，標普 500 同期只跌 0.8%、那斯達克跌 0.7%。週五反彈日小型股也只漲 0.45%，收 2,903.94 點。IWM 整週在 287.18 到 296.18 美元之間震盪，週五收在區間下緣附近。市場正在定價升息，而小型股更依賴短債與浮動利率借款，利息支出會比大型股更快反映。升息週的第一個觀察點，是 IWM 能不能守住 287 美元。", "en": "The Russell 2000 fell about 2.1% last week, the weakest of the major indexes, versus 0.8% for the S&P 500 and 0.7% for the Nasdaq. Even on Friday's rebound small caps rose only 0.45% to 2,903.94. IWM traded between $287.18 and $296.18 during the week and finished near the bottom of that range. The market is pricing a hike, and small companies lean more on short-term and floating-rate debt, so interest costs hit them faster than large caps. The first thing to watch in hike week is whether IWM holds $287.", "url": "https://investrade.com/market-review-september-11-2026/", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週區間 287.18–296.18 美元，整週跌約 2.1%"}, {"t": "IWN", "n": "羅素 2000 價值股 ETF，銀行與工業比重高，對利率更敏感"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "消息日漲兩成", "color": "#5B8ED6", "zh": "脊椎手術器材公司 Alphatec 的執行長 Patrick Miles 9/10 在公開市場買進 11.5 萬股，均價 8.81 美元、總額約 101 萬美元，買完直接持股約 589 萬股。申報一公開，股價當天下午一度飆漲 19.1%。背景是這檔股票剛從 52 週低點 6.82 美元附近彈起，今年以來跌幅很深。這個案例同時示範兩件事：執行長大額加碼是強訊號，但訊號被市場定價只要幾個小時，看到新聞才追，買的是已經漲過將近兩成的價格。", "en": "Alphatec CEO Patrick Miles bought 115,000 shares in the open market on Sept. 10 at an average of $8.81, about $1.01 million, bringing his direct holdings to roughly 5.89 million shares. Once the filing hit, the stock jumped as much as 19.1% that afternoon. The shares had just bounced off a 52-week low of $6.82 after a steep year-to-date decline. The case shows two things at once: a large CEO purchase is a strong signal, but the market prices it within hours, so chasing the headline means paying a price that is already up nearly 20%.", "url": "https://www.marketbeat.com/instant-alerts/insider-insider-buying-alphatec-nasdaq-atec-ceo-acquires-101315000-in-stock-2026-09-10/", "stocks": [{"t": "ATEC", "n": "Alphatec，CEO 買進約 101 萬美元，消息日盤中漲 19.1%"}, {"t": "GMED", "n": "Globus Medical，脊椎器材龍頭，Alphatec 搶市占的主要對手"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "升息前加碼", "color": "#5B8ED6", "zh": "AI 個人信貸平台 Upstart 的執行長 Paul Gu 上週買進 5 萬股、約 128 萬美元。時間點耐人尋味：這家公司的生意是替銀行與信用合作社媒合個人信貸，最怕利率上升，借款人負擔變重、背後出資的機構要求更高報酬，放款量就會縮。執行長選在市場幾乎確定升息的前一週加碼，等於表態他認為利率壓力已經反映在股價裡。反方論點也很清楚：若點陣圖暗示還有下一碼，平台的放款量會先受傷。", "en": "Upstart CEO Paul Gu bought 50,000 shares last week, about $1.28 million. The timing stands out: the company matches personal loans for banks and credit unions, and rising rates are its biggest threat, because borrowers get squeezed and funding partners demand higher returns, shrinking loan volume. Buying the week before a near-certain hike is a statement that he thinks rate pressure is already in the price. The counterargument is just as clear: if the dot plot signals another hike, origination volume takes the first hit.", "url": "https://www.everhint.com/insider-trading-signals-september-11-2026-midday-update-last-24-hours-pacific-time/", "stocks": [{"t": "UPST", "n": "Upstart，CEO 買進約 128 萬美元，升息前一週加碼"}, {"t": "LC", "n": "LendingClub，同類個人信貸平台，但有銀行執照與自有存款，資金成本結構不同"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "6.75% 的算術", "color": "#5B8ED6", "zh": "判讀小型股的財務體質，有一個簡單的算術。TTM 這種獲利穩定、營業利益率 16.5% 的中型公司，上週發 8 年期債要付 6.750%，同期 10 年期公債約 4.97%，信用利差大約 1.8 個百分點。規模更小、獲利更不穩的公司只會付得更高。這就是升息週要特別看小型股債務到期表的原因：今明兩年要借新還舊的公司，利息支出會一口氣跳一階，而且不是暫時的，是鎖進未來好幾年。", "en": "There is a simple piece of arithmetic for judging small-cap balance sheets. TTM, a mid-size company with steady profits and a 16.5% operating margin, had to pay 6.750% on eight-year notes last week while the 10-year Treasury yielded about 4.97%, a credit spread of roughly 1.8 percentage points. Smaller, less profitable companies will pay more. That is why the debt maturity schedule matters in a hike week: companies refinancing this year or next will see interest costs jump a notch, and the higher rate gets locked in for years.", "url": "https://www.rttnews.com/3690403/ttm-technologies-stock-rises-4.aspx", "stocks": [{"t": "TTMI", "n": "TTM Technologies，2034 年到期債票面 6.750%，中型績優公司的資金成本參考點"}, {"t": "HYG", "n": "高收益債 ETF，信用利差變化是小型股融資環境的溫度計"}, {"t": "IJR", "n": "標普小型股 600 ETF，成分股須有獲利，財務體質比羅素 2000 整齊"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "分拆後的賣壓", "color": "#5B8ED6", "zh": "今年夏天美股密集出現分拆：FedEx Freight 6/1 自 FedEx 獨立、Honeywell Aerospace 6/29 掛牌、Mobility Global（CARFAX）7/1 自標普全球分拆。分拆後頭幾個月股價常常很難看，原因多半跟基本面無關：原本持有母公司的基金拿到一張不符合投資範圍的新股票，可能市值太小、產業不對或不配息，第一件事就是賣掉。FedEx Freight 5/28 在 200 美元見高後，9/3 跌到 123.24 美元的掛牌低點。這種被動賣壓通常要一到兩個季度才出清，之後股價才開始反映真正的經營數字。", "en": "This summer brought a wave of spin-offs: FedEx Freight separated from FedEx on June 1, Honeywell Aerospace listed on June 29, and Mobility Global (CARFAX) split from S&P Global on July 1. Spin-offs often trade poorly for the first few months for reasons unrelated to fundamentals: funds that held the parent receive a new stock that does not fit their mandate, whether too small, the wrong sector or no dividend, and simply sell it. FedEx Freight peaked at $200 on May 28 and hit a post-listing low of $123.24 on Sept. 3. Forced selling usually takes one to two quarters to clear before the price starts reflecting actual operating results.", "url": "https://www.insidearbitrage.com/spinoffs/", "stocks": [{"t": "FDXF", "n": "FedEx Freight，6/1 分拆掛牌，9/3 創 123.24 美元低點"}, {"t": "HONA", "n": "Honeywell Aerospace，6/29 自 Honeywell 分拆（雷達池內）"}, {"t": "MBGL", "n": "Mobility Global，7/1 自標普全球分拆（雷達池內）"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "母公司連買", "color": "#C9A227", "zh": "Donegal Group 是賓州的區域型產險公司，賣個人車險、房屋險與中小企業保單，市值小、分析師覆蓋極少，而且是雙重股權、由母公司 Donegal Mutual 控股，這種結構讓機構投資人興趣缺缺。正在改變的有兩件事：第二季綜合率 95.6%，比去年同期 97.7% 改善 2.1 個百分點，損失率從 65.1% 降到 59.5%，淨利 2,230 萬美元、年增約三成；同時持股逾一成的母公司 9 月連續進場，9/4 買 6,368 股、9/8 買 1 萬股、9/9-10 再買 23,469 股約 44.9 萬美元，價位在 18.89 到 19.39 美元之間。風險與反方論點：淨已賺保費年減 4.0%，獲利改善有一部分來自天氣損失偏低與以前年度準備金回補，未必能重複；母公司增持也可能是在提高控制權而不是表態便宜，小股東權益有限。以上是研究線索，不是投資建議。", "en": "Donegal Group is a Pennsylvania regional property-casualty insurer selling personal auto, homeowners and small-business policies. It is small, has very little analyst coverage, and has a dual-class structure controlled by parent Donegal Mutual, which keeps institutions away. Two things are changing: the second-quarter combined ratio improved 2.1 points to 95.6% from 97.7%, the loss ratio fell to 59.5% from 65.1% and net income rose about 32% to $22.3 million; and the parent, a 10%-plus holder, has been buying in September, 6,368 shares on Sept. 4, 10,000 on Sept. 8 and 23,469 shares worth about $449,000 on Sept. 9-10, at $18.89 to $19.39. Risks: net premiums earned fell 4.0%, part of the profit gain came from light weather losses and favorable prior-year reserve development that may not repeat, and the parent's buying could be about control rather than value, limiting minority holders. This is a research lead, not investment advice.", "url": "https://www.stocktitan.net/news/DGICA/donegal-group-inc-announces-second-quarter-and-first-half-2026-za6v13sen7gc.html", "status": "RADAR · 下一個驗證點 10 月下旬 Q3 財報（看綜合率能否守在 96% 以下、保費是否止跌）", "stocks": [{"t": "DGICA", "n": "Donegal Group A 股，母公司 9 月連續增持，Q2 綜合率 95.6%"}, {"t": "CINF", "n": "Cincinnati Financial，區域型產險同業，對照綜合率與估值"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "大股東進場", "color": "#C9A227", "zh": "Clipper Realty 是紐約市的住宅與辦公不動產信託，主力是布魯克林 Flatbush Gardens 等出租公寓，股價 3 美元出頭、市值很小，長期虧損加上辦公大樓空置，幾乎沒有人在追。正在改變的訊號有兩個：持股逾一成的董事 Sam Levinson 透過 Starburst 2016 II LLC，9/8 以均價 3.24 美元買 6,842 股、9/9 以 3.31 美元再買 110,710 股，合計約 38.8 萬美元，月初也小額買過一次；營運面第二季住宅出租強勁、Prospect House 開發案全數租出，Flatbush Gardens 依與紐約市 Article XI 協議要求的三年期資本支出也已大致完成，這一塊之後不必再大量投錢。風險與反方論點：第二季營收 3,860 萬美元低於預期的 4,000 萬，淨虧損 630 萬美元；250 Livingston Street 辦公大樓在紐約市政府 2025 年 8 月退租後，商業租金收入從 1,000 萬掉到 640 萬美元；紐約市租金管制政策也是長期變數。以上是研究線索，不是投資建議。", "en": "Clipper Realty is a New York City residential and office REIT anchored by Brooklyn rental complexes such as Flatbush Gardens. At just over $3 a share, with persistent losses and office vacancy, almost nobody follows it. Two signals are changing: director and 10% owner Sam Levinson, through Starburst 2016 II LLC, bought 6,842 shares at $3.24 on Sept. 8 and 110,710 more at $3.31 on Sept. 9, about $388,000 in total, after a small purchase earlier in the month; and operationally, residential leasing was strong in Q2, the Prospect House development is fully leased, and the three-year capital spending required at Flatbush Gardens under its Article XI agreement with the city is substantially complete. Risks: Q2 revenue of $38.6 million missed the $40.0 million forecast with a $6.3 million net loss, commercial revenue fell from $10.0 million to $6.4 million after the city terminated its lease at 250 Livingston Street in August 2025, and New York rent regulation is a long-term variable. This is a research lead, not investment advice.", "url": "https://www.investing.com/news/insider-trading-news/clipper-realty-director-sam-levinson-buys-388130-in-shares-93CH-4897298", "status": "RADAR · 下一個驗證點 11 月初 Q3 財報（看 AFFO 與 250 Livingston 招租進度）", "stocks": [{"t": "CLPR", "n": "Clipper Realty，董事兼大股東 9 月買進約 38.8 萬美元"}, {"t": "VNO", "n": "Vornado Realty，紐約辦公不動產龍頭，對照紐約辦公租賃市況"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "執行長加財務長", "color": "#C9A227", "zh": "Relmada Therapeutics 是臨床期生技公司，原本主打的憂鬱症藥物失敗後，轉向泌尿腫瘤藥 NDV-01 與普瑞德-威利症候群用的 sepranolone，舊故事破滅後多數投資人已經離場。正在改變的是：執行長 Sergio Traversa 9/9、9/10 各買 10 萬股，均價 4.18 與 4.10 美元、合計 82.8 萬美元；財務長 Maged Shenouda 同兩天買進 120,200 股與 79,800 股、合計約 84.4 萬美元。執行長加上最懂帳的財務長同步自掏腰包，是少見的群體買進。公司 6 月底現金與短期投資 2.177 億美元，比去年底的 9,300 萬美元大增，管理層預估足以撐到 2029 年、涵蓋 NDV-01 第三期試驗，第二季營運現金流出 960 萬美元。風險與反方論點：兩個主力藥都還沒送出新藥臨床試驗申請，預計年底前才送件，離上市很遠；9/2 泌尿科醫療長才剛離職，偏偏是 NDV-01 的核心領域；臨床期公司現金再多，試驗失敗就歸零。以上是研究線索，不是投資建議。", "en": "Relmada Therapeutics is a clinical-stage biotech that pivoted, after its depression drug failed, to urologic oncology candidate NDV-01 and sepranolone for Prader-Willi syndrome; most investors left when the old story collapsed. What is changing: CEO Sergio Traversa bought 100,000 shares on each of Sept. 9 and 10 at averages of $4.18 and $4.10, $828,000 in total, and CFO Maged Shenouda bought 120,200 and 79,800 shares on the same two days for about $844,000. A CEO and the person who knows the books best buying together is an unusual cluster. Cash and short-term investments were $217.7 million at June 30, up from $93 million at year-end, which management says funds operations into 2029 including the NDV-01 Phase 3 program; Q2 operating cash burn was $9.6 million. Risks: neither lead drug has an IND filed yet, with filings expected by year-end, so approval is far off; the urology chief medical officer left on Sept. 2, in NDV-01's core area; and no amount of cash saves a clinical-stage company from a failed trial. This is a research lead, not investment advice.", "url": "https://www.investing.com/news/insider-trading-news/relmada-ceo-sergio-traversa-buys-200000-shares-for-828000-93CH-4897770", "status": "RADAR · 下一個驗證點 年底前 NDV-01 IND 送件（11 月 Q3 財報看現金消耗）", "stocks": [{"t": "RLMD", "n": "Relmada，CEO 與 CFO 9/9-10 合計買進約 167 萬美元"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內更新 · 逆勢併購", "color": "#C9A227", "zh": "池內更新：Dream Finders Homes（8/15 入池），美國東南部與德州建商。Beazer 併購案條件已經定案：全現金每股 33.50 美元、企業價值約 22 億美元，雙方董事會一致通過，預計 2026 年第四季交割，合併後將成為全美第六大建商、年交屋約 1.3 萬戶。這個價格是 DFH 從 5 月的 25.75 美元、6/22 的 29.25 美元、6/30 的 32.00 美元一路加價上來的。新變數是利率：30 年期房貸 9/10 升到 7.07%，DFH 用現金吃下一家建商，等於買在房市最冷的時點，是逆勢布局，也是槓桿風險。週三 Lennar 財報的訂單與毛利率，是檢驗這筆交易時機的第一份同業資料。以上是研究線索，不是投資建議。", "en": "Pool update: Dream Finders Homes (added Aug. 15), a Southeast and Texas homebuilder. Terms of the Beazer deal are set: $33.50 a share in cash, an enterprise value of about $2.2 billion, unanimously approved by both boards and expected to close in Q4 2026, creating the sixth-largest U.S. builder with about 13,000 annual closings. DFH got there by raising its bid from $25.75 in May to $29.25 on June 22 and $32.00 on June 30. The new variable is rates: the 30-year mortgage rate hit 7.07% on Sept. 10, so DFH is paying cash for a builder at the coldest point of the housing market, a contrarian move that also adds leverage risk. Lennar's orders and margins on Wednesday will be the first peer data to test the timing. This is a research lead, not investment advice.", "url": "https://www.businesswire.com/news/home/20260806292783/en/Dream-Finders-Homes-to-Acquire-Beazer-Homes-Creating-Sixth-Largest-U.S.-Homebuilder", "status": "RADAR · 池內更新 · 下一個驗證點 9/16 Lennar 財報（同業訂單讀數）與 Q4 併購交割", "stocks": [{"t": "DFH", "n": "Dream Finders Homes，全現金每股 33.50 美元併購 Beazer，預計 Q4 交割"}, {"t": "BZH", "n": "Beazer Homes，被併購方，併入後合併公司年交屋約 1.3 萬戶"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新 · 分拆倒數", "color": "#C9A227", "zh": "池內更新：KBR，政府工程與技術服務商。分拆時程已經釘死：任務科技解決方案部門將以「Trinzic」為名，於 2027 年 1 月 4 日獨立，執行長與財務長人選都已公布。本月有個具體驗證點：公司 6 月向美國國稅局遞出最終的私人信函裁定申請，預期 9 月取得裁定，這決定分拆能否免稅。財務面，管理層重申 2026 年營收 79 億至 83.6 億美元、調整後 EBITDA 9.8 億至 10.4 億美元、調整後每股盈餘 3.87 至 4.22 美元，11 月將在紐約分別為新 KBR 與 Trinzic 舉辦投資人日。風險：市場已在討論現金流轉弱，全年調整後營運現金流指引 5.6 億至 6 億美元若下修，分拆後兩家公司的資本配置都會被質疑。以上是研究線索，不是投資建議。", "en": "Pool update: KBR, the government engineering and technology services firm. The spin-off timeline is locked: Mission Technology Solutions will become independent as 'Trinzic' on Jan. 4, 2027, with its CEO and CFO already named. There is a concrete checkpoint this month: KBR submitted its final private letter ruling request to the IRS in June and expects a ruling in September on whether the spin-off is tax-free. Financially, management reaffirmed 2026 revenue of $7.90 billion to $8.36 billion, adjusted EBITDA of $980 million to $1.04 billion and adjusted EPS of $3.87 to $4.22, with separate investor days for New KBR and Trinzic in New York in November. Risk: the market is already debating weaker cash flow, and a cut to the $560 million to $600 million adjusted operating cash flow guidance would put both companies' capital allocation under scrutiny. This is a research lead, not investment advice.", "url": "https://www.stocktitan.net/sec-filings/KBR/8-k-kbr-inc-reports-material-event-8214c71bc483.html", "status": "RADAR · 池內更新 · 下一個驗證點 9 月 IRS 免稅分拆裁定、11 月雙投資人日", "stocks": [{"t": "KBR", "n": "KBR，Trinzic 分拆訂在 2027/1/4，本月待 IRS 免稅裁定"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內更新 · 先破底", "color": "#C9A227", "zh": "池內更新：FedEx Freight，全美最大的零擔貨運業者之一，6/1 自 FedEx 分拆。這個月的變化是股價先破底：9/3 創 123.24 美元的掛牌以來低點，距 5/28 的 200 美元高點跌約 38%，9/11 反彈 3.46% 收 128.31 美元，市值約 191 億美元；12 位分析師平均目標價 169.42 美元。論點沒有被證實，但也沒有被推翻：零擔業噸數仍低於去年，產業有閒置運能，油價破百又壓縮燃料附加費轉嫁前的利潤。分拆後的被動賣壓可能已經消化一大半，接下來得靠貨量說話。以上是研究線索，不是投資建議。", "en": "Pool update: FedEx Freight, one of the largest U.S. less-than-truckload carriers, spun off from FedEx on June 1. What changed this month is that the stock broke down first: it hit a post-listing low of $123.24 on Sept. 3, about 38% below its $200 high on May 28, before rebounding 3.46% to $128.31 on Sept. 11, a market value of about $19.1 billion; 12 analysts have an average target of $169.42. The thesis is neither confirmed nor broken: LTL tonnage is still below last year, the industry has excess capacity, and $100 oil squeezes margins before fuel surcharges catch up. Post-spin forced selling may be largely absorbed, and volumes now have to do the talking. This is a research lead, not investment advice.", "url": "https://stockanalysis.com/stocks/fdxf/", "status": "RADAR · 池內更新 · 下一個驗證點 9/17 FedEx 財報（工業貨量讀數）、12/2 自身財報", "stocks": [{"t": "FDXF", "n": "FedEx Freight，9/3 創 123.24 美元低點，9/11 收 128.31 美元"}, {"t": "ODFL", "n": "Old Dominion，零擔貨運龍頭同業，產業噸數的對照組"}]},
    {"id": "insider_0", "channel": "內部人動向", "tag": "兩位執行長", "color": "#6DB56D", "zh": "上週有兩位執行長在處境很不一樣的公司自掏腰包。Kennametal 執行長 Sanjay Chowbey 9/10 以 29.06 至 29.10 美元買進 7,000 股、約 20.4 萬美元，買完直接持有約 24.7 萬股；股價過去一年已漲 42%，他不是撿便宜，而是在一份含一次性紅利的指引公布後表態。Celsius 執行長 John Fieldly 則買進 1.8 萬股、約 49.4 萬美元。判讀時要分開看：金額占本人持股的比例、買進時股價在高位還是低位，比「執行長買了」這個標題更有資訊量。", "en": "Two CEOs at companies in very different situations bought stock last week. Kennametal CEO Sanjay Chowbey bought 7,000 shares on Sept. 10 at $29.06 to $29.10, about $204,000, bringing his direct holding to roughly 247,000 shares; with the stock up 42% over the past year, he is not bottom-fishing but backing guidance that includes one-time tailwinds. Celsius CEO John Fieldly bought 18,000 shares for about $494,000. Read them separately: the purchase size relative to the insider's existing stake, and whether the stock is near highs or lows, say more than the headline 'CEO buys.'", "url": "https://www.investing.com/news/insider-trading-news/kennametal-ceo-sanjay-chowbey-buys-203700-in-company-stock-93CH-4898072", "stocks": [{"t": "KMT", "n": "Kennametal，CEO 買進約 20.4 萬美元，買後直接持股約 24.7 萬股"}, {"t": "CELH", "n": "Celsius 能量飲料，CEO 買進 1.8 萬股、約 49.4 萬美元"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "賣買比七比一", "color": "#6DB56D", "zh": "9/11 前 24 小時的內部人申報，賣出金額約 2.085 億美元，買進只有 2,960 萬美元，賣買比約七比一。最醒目的集體賣出：CoreWeave 執行長、法務長與一位執行副總同一天合計賣約 4,190 萬美元；Dell 的 Silver Lake 關係帳戶合計賣逾 7,200 萬美元；Snowflake 一位董事與執行副總合計約 1,770 萬美元。還有一筆值得多看一眼：液化石油氣船東 Dorian LPG 的財務長、商務長、營運長三人合計賣約 358 萬美元，三個營運主管同時賣，而運價正處於高檔。", "en": "In the 24 hours to Sept. 11, insider filings showed about $208.5 million of sales against just $29.6 million of purchases, roughly 7 to 1. The biggest cluster sales: CoreWeave's CEO, general counsel and an EVP sold about $41.9 million on the same day; Silver Lake-affiliated entities sold more than $72 million of Dell; a Snowflake director and EVP sold about $17.7 million. One more deserves a second look: at LPG shipowner Dorian LPG, the CFO, chief commercial officer and COO together sold about $3.58 million, three operating executives selling at once while freight rates are elevated.", "url": "https://www.everhint.com/insider-trading-signals-september-11-2026-midday-update-last-24-hours-pacific-time/", "stocks": [{"t": "CRWV", "n": "CoreWeave，三位高層同日合計賣約 4,190 萬美元"}, {"t": "DELL", "n": "Dell，Silver Lake 關係帳戶合計賣逾 7,200 萬美元"}, {"t": "LPG", "n": "Dorian LPG，財務長、商務長、營運長合計賣約 358 萬美元"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "不是真的賣", "color": "#6DB56D", "zh": "判讀提醒：有些「集體賣出」其實不是賣出。訊號網站把 Kestra Medical Technologies 標為四位董事合計賣約 41.3 萬美元的強烈看空，但拆開申報，董事 Mary Kay Ladone 9/8 以 24.91 至 25.43 美元賣出 3,908 股、約 9.8 萬美元，性質是「非自主交易」：限制型股票單位歸屬時，為了繳稅自動扣股賣出。其他董事 7、8 月的賣出也是同樣原因。這家穿戴式心臟除顫器公司週一盤後就要公布財報，財報前出現賣單很容易被誤讀。看 Form 4 時先找註腳有沒有 tax withholding 或 10b5-1 字樣，這兩種都不代表當事人對股價的判斷。", "en": "A reminder: some 'cluster sells' are not really sells. A signal site flagged Kestra Medical Technologies as strongly bearish on about $413,000 of sales by four directors, but the filing shows director Mary Kay Ladone sold 3,908 shares on Sept. 8 at $24.91 to $25.43, about $98,000, in a non-discretionary transaction to cover taxes on vesting restricted stock units. Other directors' sales in July and August were for the same reason. The wearable defibrillator maker reports after the bell Monday, and sales right before earnings are easy to misread. When reading a Form 4, check the footnotes for 'tax withholding' or '10b5-1'; neither reflects the insider's view of the stock.", "url": "https://www.investing.com/news/insider-trading-news/kestra-medical-technologies-director-ladone-sells-98464-of-kmts-stock-93CH-4897134", "stocks": [{"t": "KMTS", "n": "Kestra Medical，9/14 盤後財報，董事賣股為 RSU 歸屬繳稅的非自主交易"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "買一層保護墊", "color": "#B5654D", "zh": "加州眾議員 Ro Khanna 9/7 申報的交易清單約有 200 筆，絕大多數是 1,001 至 15,000 美元的小額個股。真正有份量的是另一類：五筆連結標普 500 指數的結構型票券，發行方包括 Barclays（8/6 兩筆，分別為 25 萬至 50 萬、10 萬至 25 萬美元）、JPMorgan（8/27，10 萬至 25 萬美元）、Wells Fargo 與 Bank of Nova Scotia（8/27，各 5 萬至 10 萬美元），加總區間約 55 萬到 120 萬美元。這類連結指數的票券通常是用部分上漲空間，換取下跌保護或固定配息。在標普 500 接近歷史高點的 8 月建立這種部位，代表的假設是：想留在股市，但不想全額承擔回檔。", "en": "Rep. Ro Khanna of California filed a report on Sept. 7 listing about 200 trades, most of them small stock trades of $1,001 to $15,000. The meaningful positions are something else: five structured notes linked to the S&P 500, issued by Barclays (two on Aug. 6, at $250,000-$500,000 and $100,000-$250,000), JPMorgan (Aug. 27, $100,000-$250,000), and Wells Fargo and Bank of Nova Scotia (Aug. 27, $50,000-$100,000 each), totaling roughly $550,000 to $1.2 million. Index-linked notes like these typically trade some upside for downside protection or a fixed coupon. Building them in August with the S&P 500 near record highs implies a view of staying invested without taking the full hit of a pullback.", "url": "https://us.trendlyne.com/us/politician/312/ro-khanna/", "stocks": [{"t": "SPY", "n": "標普 500 ETF，五筆結構型票券的連結標的"}, {"t": "BCS", "n": "Barclays，其中兩筆票券的發行方，合計 35 萬至 75 萬美元"}, {"t": "JPM", "n": "JPMorgan，8/27 一筆 10 萬至 25 萬美元票券的發行方"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "看不到的條款", "color": "#B5654D", "zh": "判讀提醒：申報表上最有資訊量的欄位，常常是空白的。結構型票券在申報表上只寫「發行銀行＋連結標普 500」和金額區間，但決定它是什麼部位的，是看不到的條款：下跌保護從多少跌幅開始、上漲封頂在哪、幾年到期、會不會被提前贖回，還有發行銀行本身的信用風險。這跟選擇權一樣，沒有履約價和到期日就讀不出方向。另一個常見誤讀是同日大量賣出：眾議員 April McClain Delaney 的申報中，8/25 同一天賣出 Martin Marietta、ITT（各 25 萬至 50 萬美元）等二十多檔，這種形狀通常是帳戶換管理人或整體再平衡，不是對個別公司的看法。而且這批 8 月的交易 9 月才公開，跟單者看到時已隔了兩週到一個月。", "en": "A reminder: the most informative fields on a disclosure are often blank. A structured note appears only as 'issuing bank plus S&P 500-linked' and a dollar range, but what defines the position is hidden: where downside protection starts, where upside is capped, the maturity, any call features, and the issuer's own credit risk. Like options without a strike and expiry, you cannot read its direction. Another common misread is mass same-day selling: Rep. April McClain Delaney's filing shows more than 20 positions sold on Aug. 25, including Martin Marietta and ITT at $250,000-$500,000 each, a pattern that usually reflects a manager change or account-wide rebalancing rather than views on individual companies. And these August trades only became public in September, two weeks to a month later.", "url": "https://us.trendlyne.com/us/politicians/recent-trades/", "stocks": [{"t": "MLM", "n": "Martin Marietta，McClain Delaney 8/25 賣出 25 萬至 50 萬美元，屬同日整批賣出"}, {"t": "ITT", "n": "ITT，同日賣出 25 萬至 50 萬美元"}, {"t": "BUFR", "n": "FT Vest 緩衝型 ETF 組合，公開市場上最接近「下跌保護＋上漲封頂」結構的對照工具"}]},

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

                <tr style={{ color:"var(--text-tertiary)", fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", textTransform:"uppercase" }}>
                  <th style={{ textAlign:"left",  padding:"6px 8px 6px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>議員</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>筆數</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>買 / 賣</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>申報區間</th>
                  <th style={{ textAlign:"left",  padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>常見標的</th>
                  <th style={{ textAlign:"right", padding:"6px 0 6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>最新申報</th>
                </tr>
              </thead>
              <tbody>
                {R.roster.map(r => (
                  <tr key={r.name + r.dst}>
                    <td style={{ padding:"7px 8px 7px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      <a href={r.url} target="_blank" rel="noopener noreferrer" style={{ color:"#B5654D", textDecoration:"none" }}>{r.name}</a>
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px", marginLeft:"6px" }}>{r.dst}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums" }}>{r.n}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>
                      <span style={{ color:"#6DB56D" }}>{r.buy}</span>
                      <span style={{ color:"var(--text-tertiary)" }}> / </span>
                      <span style={{ color:"#E05C5C" }}>{r.sell}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>{money(r.lo)}–{money(r.hi)}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      {r.top.map(t => (
                        <a key={t} href={"https://www.tradingview.com/symbols/" + t + "/"} target="_blank" rel="noopener noreferrer"
                           style={{ color:"var(--text-secondary, inherit)", textDecoration:"none", marginRight:"7px", fontFamily:"'Courier New',monospace" }}>{t}</a>
                      ))}
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px" }}>共 {r.distinct} 檔</span>
                    </td>
                    <td style={{ padding:"7px 0 7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", whiteSpace:"nowrap" }}>{r.last}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ padding:"12px 16px 0", fontSize:"10px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            只涵蓋眾議院；參議院走另一套 efdsearch 系統，尚未納入。買＋賣不一定等於筆數，差額是交換（exchange）類交易。
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/13/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v10.8</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
