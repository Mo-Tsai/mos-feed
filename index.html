<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "連四黑", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普 500 ETF，週四標普跌 0.58% 收 7,591.70 點"}, {"t": "DIA", "n": "道瓊 ETF，道瓊跌 316.56 點、跌幅 0.6%，收 52,064.10 點"}, {"t": "QQQ", "n": "那斯達克 100 ETF，那斯達克綜合指數跌 0.65% 收 26,081.72 點"}, {"t": "IWM", "n": "羅素 2000 ETF，小型股在升息定價下承壓最重"}], "en": "US stocks fell for a fourth straight session on Thursday. The Dow lost 316.56 points, or 0.6%, to 52,064.10, the S&P 500 slipped 0.58% to 7,591.70 and the Nasdaq Composite dropped 0.65% to 26,081.72. The trigger was crude: US oil closed above $100 a barrel for the first time in this cycle, and the market read it straight through to inflation rather than to growth. Four consecutive down days is the longest losing streak the index has run in months, and it has happened without a single company-level shock.", "zh": "美股週四四大指數再度收黑，這是連續第四個下跌交易日。道瓊跌 316.56 點、跌幅 0.6%，收 52,064.10 點；標普 500 跌 0.58% 收 7,591.70 點；那斯達克綜合指數跌 0.65% 收 26,081.72 點。導火線是原油：美國西德州原油收盤站上每桶 100 美元，市場直接把它讀成通膨、而不是讀成需求轉強。值得注意的是這四天的下跌沒有任何一天是被單一公司事件帶下來的，全部來自油價與利率兩條線。", "url": "https://www.cnbc.com/2026/09/09/stock-market-today-live-updates.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "油價站上百元", "color": "#E05C5C", "stocks": [{"t": "USO", "n": "美國原油基金，追蹤西德州原油，週四原油單日漲 6.7%"}, {"t": "XOM", "n": "埃克森美孚，資金在油價急漲時最先流向的整合型油商"}, {"t": "VLO", "n": "Valero，煉油商，原油與成品油的價差是它的直接收入"}], "en": "West Texas Intermediate settled at $102.48, up 6.7% on the day, while Brent gained 5.9% to $107.63. The driver is a Middle East conflict that markets now expect to last, not to resolve in weeks. That distinction matters: a short disruption gets absorbed by inventories, a long one gets passed into the price level. Thursday was the day the market started pricing the second scenario.", "zh": "西德州原油收在每桶 102.48 美元、單日漲 6.7%，布蘭特原油漲 5.9% 收 107.63 美元。推力不是新的一次攻擊，而是市場對中東衝突的預期從「幾週內收斂」改成「會拖下去」。這個差別很關鍵：短期中斷可以靠庫存吸收，長期中斷會被寫進物價水準裡。週四就是市場開始用第二種劇本定價的那一天，這也是為什麼股債同時下跌。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-10-2026"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "殖利率創兩年高", "color": "#E05C5C", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，長天期公債價格隨殖利率走高續跌"}, {"t": "XLRE", "n": "不動產類股 ETF，REIT 的資金成本直接綁在長端殖利率上"}, {"t": "XHB", "n": "住宅建商 ETF，房貸利率跟著 10 年期公債走"}], "en": "The 10-year Treasury yield pushed above 4.95%, its highest since October 2023, and the 30-year rose more than two basis points to 5.3092%. Notably this happened despite Treasury Secretary Bessent announcing a $6 billion bond buyback plan the same week. When a buyback of that size fails to move the long end, the message is that supply is not what is setting the price right now, inflation expectations are.", "zh": "10 年期公債殖利率升破 4.95%，是 2023 年 10 月以來最高；30 年期升逾 2 個基點至 5.3092%。比數字更值得看的是背景：財政部長貝森特同一週才宣布 60 億美元的公債回購計畫，長端卻照樣往上。當這種規模的買盤都壓不住長天期殖利率，代表現在決定價格的不是供給，而是通膨預期。對房貸、REIT 與所有靠再融資過日子的產業，這是比股價下跌更實際的壓力。", "url": "https://www.cnbc.com/2026/09/09/treasury-yields-oil-inflation.html"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "賣壓的形狀", "color": "#E05C5C", "stocks": [{"t": "XLK", "n": "科技類股 ETF，週四跌逾 1%，是拖累最重的板塊之一"}, {"t": "XLB", "n": "原物料類股 ETF，同樣跌逾 1%"}, {"t": "XLP", "n": "必需消費 ETF，當日少數收紅的板塊之一"}, {"t": "XLC", "n": "通訊服務 ETF，另一個逆勢收紅的板塊"}], "en": "The shape of Thursday's decline is more informative than its size. Technology and materials each fell more than 1%, while communication services and consumer staples were among the few groups to finish higher. That is a defensive rotation inside a falling market, not indiscriminate liquidation. Long-duration growth names get repriced first when the discount rate moves, and staples get bought because their cash flows are nearer in time.", "zh": "週四這一跌的形狀比幅度更有訊息量。科技與原物料各跌逾 1%，而通訊服務與必需消費是少數收紅的族群。這是在下跌市場裡的防禦性輪動，不是無差別的清倉。原因很單純：折現率一動，現金流最遠的長天期成長股先被重新定價；必需消費的現金流離現在最近，反而變成資金的暫時停靠站。看清這個形狀，就知道現在的問題是估值不是需求。", "url": "https://investrade.com/market-review-september-10-2026/"},
    {"id": "earn_0", "channel": "財報速報", "tag": "甲骨文超預期", "color": "#E8786A", "stocks": [{"t": "ORCL", "n": "甲骨文，財年首季每股盈餘 1.92 美元優於預期 1.74，盤後漲約 7%"}, {"t": "VRT", "n": "Vertiv，資料中心電力與散熱設備，甲骨文的雲端資本支出是它的需求來源"}, {"t": "ANET", "n": "Arista Networks，資料中心網路交換器，同一條 AI 基建供應鏈"}], "en": "Oracle's fiscal first quarter beat on both lines: adjusted EPS of $1.92 against $1.74 expected, revenue of $19.35 billion against $19.14 billion, up 30% year over year. Cloud infrastructure revenue more than doubled, rising 121% to $7.4 billion, and total cloud grew 62% to $11.6 billion. Management lifted the full-year fiscal 2027 outlook to a minimum of $90 billion in revenue and $8.10 in adjusted EPS. Shares rose about 7% after hours.", "zh": "甲骨文財年第一季雙線超預期：調整後每股盈餘 1.92 美元優於預期的 1.74 美元，營收 193.5 億美元優於預期的 191.4 億、年增 30%。真正的亮點在雲端基礎設施，該部門營收年增 121% 到 74 億美元，超過翻倍；總雲端營收年增 62% 到 116 億美元。管理層把 2027 財年全年展望上修到營收至少 900 億美元、調整後每股盈餘 8.10 美元。股價盤後漲約 7%，是這四天下跌裡少數的正面消息。", "url": "https://www.cnbc.com/2026/09/10/oracle-orcl-q1-earnings-report-2027.html"},
    {"id": "earn_1", "channel": "財報速報", "tag": "好成績壞反應", "color": "#E8786A", "stocks": [{"t": "ADBE", "n": "Adobe，第三季每股盈餘 6.13 美元、營收 67.6 億年增 13%，股價仍走弱"}, {"t": "CRM", "n": "Salesforce，同樣被市場問「AI 是助力還是替代」的訂閱制軟體"}, {"t": "IGV", "n": "軟體類股 ETF，這個估值折價是整個軟體板塊共同的"}], "en": "Adobe posted a record third quarter, adjusted EPS of $6.13 on revenue of $6.76 billion, up 13%, its fifth consecutive consensus beat. AI-first annualized recurring revenue grew more than 150% year over year and full-year EPS guidance was lifted to roughly $24.45. The stock fell anyway. The market is no longer paying for Adobe's current numbers; it is discounting the possibility that generative tools eventually compete with the product itself.", "zh": "Adobe 交出創紀錄的第三季：調整後每股盈餘 6.13 美元、營收 67.6 億美元年增 13%，這是連續第五季超越共識。AI 相關的年化經常性收入年增超過 150%，全年每股盈餘指引上修到約 24.45 美元。但股價還是跌了。這說明市場已經不是在評價 Adobe 這一季的數字，而是在折現一個更遠的疑問：生成式工具最後會不會反過來取代這個產品本身。同一晚兩份超預期財報得到相反反應，差別不在品質，在於市場對這家公司未來十年的假設。", "url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/adobe-inc-stock-dips-after-record-q3-fy2026-results-and-raised-guidance/70084138"},
    {"id": "earn_2", "channel": "財報速報", "tag": "高價家具測試", "color": "#E8786A", "stocks": [{"t": "RH", "n": "RH（原 Restoration Hardware），市場預期每股盈餘 1.78 美元、營收 9.36 億"}, {"t": "W", "n": "Wayfair，線上家具通路，同一條家居需求曲線的另一端"}, {"t": "WSM", "n": "Williams-Sonoma，中高價家居零售，可對照毛利率承壓程度"}], "en": "RH reported its fiscal second quarter after Thursday's close. Consensus looked for $1.78 in EPS on $936.25 million of revenue, against $2.93 on $899.15 million a year earlier. That combination, higher sales with sharply lower earnings, is the number to focus on: it says the revenue is being bought with margin. Options were pricing a 12.66% move, one of the widest implied swings of the week.", "zh": "RH 在週四盤後公布財年第二季。市場共識是每股盈餘 1.78 美元、營收 9.3625 億美元，去年同期則是每股 2.93 美元、營收 8.9915 億美元。真正要盯的是這個組合本身：營收增加、獲利大幅減少，等於在說這些營收是拿毛利率換來的。高價家居是利率與財富效果最敏感的消費品類之一，在房貸利率跟著 10 年期公債往上的此刻尤其如此。選擇權隱含波動達 12.66%，是本週最大的其中一檔。", "url": "https://www.benzinga.com/markets/options/26/09/61699232/adobe-could-swing-7-4-billion-in-value-after-earnings"},
    {"id": "macro_0", "channel": "總經政策", "tag": "PPI 燒起來", "color": "#7C6AF7", "stocks": [{"t": "XLE", "n": "能源類股 ETF，最終需求能源價格月增 4.2%"}, {"t": "ODFL", "n": "Old Dominion，零擔貨運業者，柴油是它最大的變動成本"}, {"t": "KNX", "n": "Knight-Swift，卡車運輸，柴油價格月漲 24.1% 直接吃掉利潤率"}], "en": "August producer prices rose 0.4% month over month and 5.4% over twelve months. The split is what matters: final demand goods rose 1.1% while services rose only 0.1%, and more than three quarters of the headline increase came from energy, which jumped 4.2%. Diesel alone rose 24.1% in a single month. Core PPI excluding food, energy and trade services rose 0.3%, up 4.7% year on year.", "zh": "8 月生產者物價指數月增 0.4%、年增 5.4%。真正的訊息在拆解裡：最終需求商品月增 1.1%，服務只增 0.1%，而整體漲幅有超過四分之三來自能源，能源單項月增 4.2%。其中柴油一個月就漲了 24.1%。剔除食品、能源與貿易服務的核心 PPI 月增 0.3%、年增 4.7%。這個結構代表通膨壓力目前集中在投入成本端，還沒有全面擴散到服務業，但柴油這種漲法會在一到兩季內傳到運費與貨架價格上。", "url": "https://www.bls.gov/news.release/ppi.nr0.htm"},
    {"id": "macro_1", "channel": "總經政策", "tag": "今早八點半", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，CPI 公布後最直接反映通膨預期的工具"}, {"t": "SPY", "n": "標普 500 ETF，整體風險資產在數據公布前後的定價都繫於此"}, {"t": "XLP", "n": "必需消費 ETF，通膨轉嫁能力最常被拿來檢驗的板塊"}], "en": "The August CPI lands at 8:30 am Eastern this morning, four trading days before the Fed decides. Headline is expected up 0.4% on the month and 3.4% on the year. The core reading is where the meeting gets decided: the Wall Street Journal survey of 17 economists has a median of 0.22% with every estimate between 0.16% and 0.24%. That is a razor-thin distribution, and the difference between rounding to 0.2% and rounding to 0.3% is the whole story.", "zh": "8 月消費者物價指數在今天早上美東時間 8 點 30 分公布，距離聯準會決議只剩四個交易日。整體 CPI 市場預期月增 0.4%、年增 3.4%。決勝點在核心：華爾街日報調查 17 位經濟學家，中位數是 0.22%，而且每一位的估計都落在 0.16% 到 0.24% 之間。這是一個極窄的分布，但也正因為窄，四捨五入成 0.2% 還是 0.3% 就是整場會議的差別。今天這個數字對 FOMC 的影響力，比過去一年任何一次都大。", "url": "https://www.cnbc.com/2026/09/10/fridays-cpi-inflation-report-is-even-more-important-than-usual-heres-what-to-expect.html"},
    {"id": "macro_2", "channel": "總經政策", "tag": "市場在賭升息", "color": "#7C6AF7", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，升息對淨息差是助力、對放款品質是壓力"}, {"t": "TLT", "n": "長天期公債 ETF，升息預期是這波長債下跌的直接原因"}, {"t": "XLF", "n": "金融類股 ETF，整體金融板塊對利率路徑最敏感"}], "en": "Following Thursday's PPI release, CME FedWatch showed traders assigning more than a 73% probability to a quarter-point rate increase at the September 15-16 meeting. Read that sentence again: an increase, not a cut. This is the first time since the 2022 tightening cycle that an energy shock and a tightening expectation have arrived together, and it removes the cushion equity investors have relied on for two years, the assumption that bad macro news eventually brings easier policy.", "zh": "週四 PPI 公布後，芝商所 FedWatch 顯示交易員給 9 月 15 至 16 日會議升息一碼的機率超過 73%。請把這句話再讀一次：是升息，不是降息。這是 2022 年那輪緊縮之後，第一次出現「能源衝擊」與「緊縮預期」同時發生。它的意義在於拿掉了股市兩年來一直靠著的那層緩衝——過去只要總經數據轉壞，市場就預期政策會轉鬆；這一次總經轉壞的方式是通膨，而通膨只會把政策推向更緊。", "url": "https://www.cnbc.com/2026/09/10/fridays-cpi-inflation-report-is-even-more-important-than-usual-heres-what-to-expect.html"},
    {"id": "sector_0", "channel": "產業風向", "tag": "煉油暴利", "color": "#4EABA4", "stocks": [{"t": "MPC", "n": "Marathon Petroleum，今年漲逾 80%，煉油行情的代表"}, {"t": "DINO", "n": "HF Sinclair，同樣今年漲逾 80% 的獨立煉油商"}, {"t": "PARR", "n": "Par Pacific，美國掛牌市值最小的煉油商，波動最大的一層"}], "en": "The story inside energy is not the producers, it is the refiners. The WTI 3-2-1 crack spread is near $59 a barrel, roughly triple where it started January, and Marathon, Valero and HF Sinclair have each gained more than 80% this year against an 11% S&P 500 move. Refiners are not being paid for owning oil, they are being paid for the margin between crude and finished fuel. CNBC has flagged that historically a run of this shape does not last, because refining margin is the most mean-reverting number in the sector.", "zh": "能源板塊裡真正的主角不是生產商，是煉油商。西德州原油的 3-2-1 裂解價差接近每桶 59 美元，大約是 1 月初的三倍；Marathon、Valero 與 HF Sinclair 今年各漲超過 80%，同期標普 500 只漲 11%。要理解這件事，關鍵是煉油商賺的不是「持有原油」，而是原油與成品油之間的價差。CNBC 已經提醒過，歷史上這種形狀的行情很少能延續，因為裂解價差是整個能源產業裡最會均值回歸的一個數字。", "url": "https://www.cnbc.com/2026/08/17/refiner-stocks-are-on-a-nearly-unprecedented-run-history-says-it-could-end-soon.html"},
    {"id": "sector_1", "channel": "產業風向", "tag": "航空被燒", "color": "#4EABA4", "stocks": [{"t": "DAL", "n": "達美航空，燃油成本占比高，油價急漲時最先被賣"}, {"t": "UAL", "n": "聯合航空，同樣是長程航線多、避險部位有限的業者"}, {"t": "LUV", "n": "西南航空，單一機隊、國內線為主，票價轉嫁空間相對窄"}], "en": "The other side of $100 oil is the fuel bill. Global average jet fuel hit $171.01 a barrel in the first week of September, up 9.0% in a single week and roughly 57% above a year ago. IATA has halved its 2026 global airline profit forecast. Airlines are the cleanest example of a sector where the input cost moves daily and the output price is locked in months of advance bookings, which is why the equity reprices faster than the earnings do.", "zh": "油價站上 100 美元的另一面，是燃油帳單。9 月第一週全球平均航空燃油價格達到每桶 171.01 美元，一週漲 9.0%，比一年前高出約 57%。國際航空運輸協會（IATA）已經把 2026 年全球航空業獲利預估砍半。航空業是「投入成本每天在動、產出價格卻鎖在幾個月前的預訂裡」最乾淨的例子，這也是為什麼股價的反應總是比財報快得多。要看這一波油價真正的傷害面，看航空與陸運比看能源股本身有用。", "url": "https://finance.yahoo.com/markets/stocks/articles/dal-ual-aal-luv-stocks-061729777.html"},
    {"id": "sector_2", "channel": "產業風向", "tag": "黃金與升息同行", "color": "#4EABA4", "stocks": [{"t": "GLD", "n": "黃金 ETF，金價 9 月 3 日報每盎司 4,491 美元"}, {"t": "NEM", "n": "Newmont，全球最大金礦商，金價槓桿的代表"}, {"t": "GDX", "n": "金礦類股 ETF，礦商的獲利彈性大於金價本身"}], "en": "Gold was quoted at $4,491 an ounce on September 3 and held above $4,400 through the week, up more than 25% since the start of 2025. What makes this notable is the company it keeps: gold is usually a bet against real rates, and real rates are rising. When gold and rate-hike odds rise together, the market is telling you it thinks inflation will outrun whatever the central bank does about it. That is a different signal from the 2024 gold rally.", "zh": "黃金在 9 月 3 日報每盎司 4,491 美元，整週守在 4,400 美元之上，自 2025 年初以來漲幅超過 25%。值得注意的不是價格本身，而是它跟誰一起漲。黃金通常是押注實質利率下行，而現在實質利率正在上行。當金價與升息機率同時走高，市場其實是在說：它認為通膨會跑得比央行的動作更快。這跟 2024 年那波以降息預期為燃料的黃金行情，是完全不同性質的訊號。", "url": "https://fortune.com/article/current-price-of-gold-09-03-2026/"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "最好的一年", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，指數今年漲約 20% 至 21%"}, {"t": "IJR", "n": "標普小型股 600 ETF，成分股要求獲利，品質篩選比羅素嚴"}, {"t": "VTWO", "n": "Vanguard 羅素 2000 ETF，同一指數的低費用版本"}], "en": "The Russell 2000 is up roughly 20% to 21% year to date, its best start to a year since 1991, and it is beating both the S&P 500 and the Nasdaq-100. The engine is rotation rather than earnings: extreme concentration and rich valuations in mega-cap AI have pushed money into underowned, more value-oriented parts of the market, helped by active M&A and a reopening IPO window. That is a flows story, and flows stories reverse faster than fundamentals do.", "zh": "羅素 2000 今年以來漲約 20% 至 21%，是 1991 年以來最好的開年表現，同時跑贏標普 500 與那斯達克 100。但要看清楚引擎是什麼：這波主要是輪動而不是獲利。大型 AI 股的集中度與估值都到了極端，資金因此流向持股比重低、偏價值的市場角落，併購活絡與 IPO 窗口重開又加了一把火。這是一個資金流的故事，而資金流的故事，回頭的速度一向比基本面快得多。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "浮動利率陷阱", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素 2000 成長型 ETF，未獲利公司比重高、對利率最敏感"}, {"t": "IWN", "n": "羅素 2000 價值型 ETF，銀行與能源比重高，升息反而部分受惠"}, {"t": "HYG", "n": "高收益公司債 ETF，小型股再融資成本的即時溫度計"}], "en": "Here is the number that decides whether the small-cap rally survives next week. Roughly 32% of Russell 2000 constituents carry floating-rate debt, against just 6% of the S&P 500. A quarter-point increase does not hit those companies through sentiment, it hits the interest line of the next quarterly income statement. This is also why small-cap value and small-cap growth are about to behave very differently: value is full of banks and energy names that gain from higher rates, growth is full of borrowers.", "zh": "這是決定小型股行情能不能撐過下週的那個數字：羅素 2000 成分股中約有 32% 帶有浮動利率債務，標普 500 只有 6%。升息一碼對這些公司不是情緒面的打擊，而是直接寫進下一季損益表的利息費用。這也解釋了為什麼接下來小型價值股與小型成長股會走得完全不一樣——價值那一側滿是銀行與能源，升息反而擴大利差；成長那一側則多半是借款人。同一個指數，兩種截然相反的體質。", "url": "https://www.fool.com/investing/2026/09/09/this-vanguard-etf-sp-500-nasdaq-100-2026-reckoning/"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "最薄的那一層", "color": "#5B8ED6", "stocks": [{"t": "PARR", "n": "Par Pacific，美國掛牌市值最小的煉油商，太平洋與洛磯山區布局"}, {"t": "DK", "n": "Delek US，小型獨立煉油商，裂解價差變動的放大器"}, {"t": "PBF", "n": "PBF Energy，同屬小型獨立煉油商，波動幅度大於大型同業"}], "en": "If refining margin is the trade, the small independents are the leveraged version of it. Par Pacific, Delek US and PBF swing much harder on crack spreads than Marathon or Valero do, for a specific structural reason: they typically lack the hedging programmes and balance-sheet cushion the majors carry. That cuts both ways. The same absence of a hedge that produces outsized gains on the way up produces instant repricing when the spread resets.", "zh": "如果這波交易的本質是煉油價差，那麼小型獨立煉油商就是這筆交易的槓桿版本。Par Pacific、Delek US 與 PBF 對裂解價差的反應遠比 Marathon 或 Valero 劇烈，原因是結構性的：它們通常沒有大型同業那套避險機制，資產負債表也沒有同樣的緩衝。這件事是雙向的——上漲時放大報酬的正是「沒有避險」，而價差一旦回檔，同一個原因會讓股價在極短時間內被重新定價。買這一層，等於是在買裂解價差本身。", "url": "https://finance.yahoo.com/sectors/energy/articles/energy-surges-crack-spreads-consider-taking-gains-190100250.html"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "油輪運價爆表", "color": "#5B8ED6", "stocks": [{"t": "TNK", "n": "Teekay Tankers，蘇伊士型與阿芙拉型原油輪船東，現貨市場為主"}, {"t": "FRO", "n": "Frontline，超大型原油輪（VLCC）船東，長程航線運價的直接受惠者"}, {"t": "INSW", "n": "International Seaways，原油與成品油兩線兼營的美國船東"}], "en": "Tanker economics have gone vertical. The US Gulf to China rate rose more than $3.6 million in a single week to roughly $28 million, and estimated daily earnings on the Gulf of Oman to China route topped $261,000. Traffic through the Strait of Hormuz fell to its lowest level since May. The mechanism is not demand for oil, it is ton-miles: when a route closes, the same barrel travels further, and the world's tanker fleet is suddenly too small.", "zh": "油輪的經濟學已經垂直起飛。美灣到中國的航次運價一週跳升逾 360 萬美元，來到約 2,800 萬美元；阿曼灣到中國航線的估算日收益超過 26.1 萬美元。同時，通過荷莫茲海峽的流量降到 5 月以來最低。要理解這件事，關鍵詞是「噸海里」而不是「石油需求」：一條航線被封，同一桶油就得繞更遠的路，全球油輪船隊的有效運力等於瞬間縮水。這也是為什麼船東的獲利彈性比油商本身還大。", "url": "https://dailycaller.com/2026/09/10/oil-supertanker-iran-war-cost-david-blackmon-stuart-turley/"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "雙引擎與雙風險", "color": "#5B8ED6", "stocks": [{"t": "CVI", "n": "CVR Energy，一個月漲逾 60%，同時吃到油品與氮肥兩條價格線"}, {"t": "UAN", "n": "CVR Partners，CVR 旗下氮肥事業的合夥單位，天然氣是它的原料"}, {"t": "LXU", "n": "LSB Industries，氮肥廠，與 UAN 同屬能源價格傳導的下一站"}], "en": "CVR Energy rose more than 60% in a single month because it sits on two price lines at once: refined fuels and nitrogen fertiliser, both of which are levered to energy. That is a genuinely attractive structure while energy is rising. It is also a concentration risk with a single underlying variable, because the same input that lifts both segments is the one that can reverse. Fertiliser adds a second layer, since nitrogen production runs on natural gas and its selling price tracks crop economics, not crude.", "zh": "CVR Energy 一個月漲超過 60%，原因是它同時坐在兩條價格線上：成品油與氮肥，而兩者都跟能源價格連動。在能源上行的環境裡，這個結構確實迷人。但它也是一種集中風險，因為推升兩個部門的其實是同一個變數，回頭時也會同時回頭。氮肥還多了一層複雜度：生產靠天然氣，售價卻跟著農作物經濟走，不是跟著原油走。當你看到「雙引擎」時，先確認那是兩台引擎，還是同一台引擎接了兩個螺旋槳。", "url": "https://www.nerdwallet.com/investing/learn/oil-stocks"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報", "stocks": [{"t": "TRS", "n": "TriMas，市值約 12.5 億美元的多角化製造商，累計買回股數約占股本 22.81%"}], "en": "TriMas makes packaging closures and dispensers, aerospace fasteners and specialty products, a market capitalisation of about $1.25 billion split across three unrelated end markets. Why it is ignored: conglomerate structures with no single story get almost no sell-side attention, and the aerospace segment is too small to attract aerospace analysts while packaging is too small to attract packaging analysts. What is changing: the company has repurchased shares equal to 22.81% of the count for $285.69 million, alongside insider purchases. A buyback of that magnitude in a company this size is not signalling, it is a capital allocation decision that mechanically raises per-share earnings. Risks: packaging volumes track consumer staples demand, aerospace fastener orders track a supply chain still normalising, and a conglomerate discount can persist indefinitely regardless of buybacks. This is a research lead, not investment advice.", "zh": "TriMas 做的是包裝閉合件與噴頭、航太扣件與特殊產品，市值約 12.5 億美元，橫跨三個彼此無關的終端市場。為什麼被忽視：說不出單一故事的集團型公司幾乎拿不到賣方研究資源，航太部門太小吸引不到航太分析師，包裝部門太小吸引不到包裝分析師，於是兩邊都沒人追。什麼正在改變：公司累計買回相當於股本 22.81% 的股份、金額 2.8569 億美元，同時出現內部人買進。在這種市值的公司，這個規模的買回不是訊號，而是會直接把每股盈餘往上推的資本配置決定。風險與反方論點：包裝出貨量綁在必需消費需求上、航太扣件訂單綁在還在正常化的供應鏈上，而且集團折價可能無視買回而長期存在。這是研究線索，不是投資建議。", "url": "https://finance.yahoo.com/markets/stocks/articles/undervalued-small-caps-insider-buying-113954098.html"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（AgTech 在手訂單）", "stocks": [{"t": "ROCK", "n": "Gibraltar Industries，住宅屋頂配件與 AgTech 溫室，執行長 8 月買進約 73.9 萬美元"}], "en": "Gibraltar Industries makes residential roofing accessories, mail and package systems, and AgTech greenhouse structures. Why it is ignored: it is a building products company that spent years being described as a solar racking company, and the label stuck long after the business moved on. What is changing, with three pieces of evidence: second-quarter net sales rose 64.6% to $510 million, residential EBITDA margin expanded 340 basis points to 19%, and the Omnimax integration is running ahead of plan with the 2026 synergy commitment raised to $29.4 million. The renewables divestiture is complete, which removes the mislabelling. The CEO bought 19,735 shares worth roughly $739,000. Risks: AgTech backlog fell 34% year over year on project timing, and residential demand is directly exposed to the mortgage rates now rising with the 10-year. This is a research lead, not investment advice.", "zh": "Gibraltar Industries 做的是住宅屋頂配件、信箱與包裹系統，以及 AgTech 溫室結構。為什麼被忽視：它是一家建材公司，卻有好幾年被市場當成太陽能支架公司在講，這個標籤在業務早已轉向之後還黏著不放。什麼正在改變，有三項證據：第二季淨銷售額年增 64.6% 到 5.10 億美元；住宅部門 EBITDA 利潤率擴張 340 個基點到 19%；Omnimax 整合進度超前，2026 年綜效承諾上修到 2,940 萬美元。再生能源事業已完成出售，貼錯的標籤終於被撕掉。執行長本人買進 19,735 股、約 73.9 萬美元。風險與反方論點：AgTech 在手訂單因專案時程年減 34%，而住宅需求正面對著隨 10 年期公債走高的房貸利率。這是研究線索，不是投資建議。", "url": "https://secure.businesswire.com/news/home/20260805038893/en/Gibraltar-Reports-Second-Quarter-2026-Results"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報（蘇伊士型續約價位）", "stocks": [{"t": "TNK", "n": "Teekay Tankers，池內 9/2 入池，本週運價環境大幅改善"}], "en": "Teekay Tankers entered the radar pool on September 2 on the thesis that spot tanker rates were being repriced by geopolitics rather than by demand. That thesis got its evidence this week. Hormuz traffic is at its lowest since May, the US Gulf to China voyage rate jumped more than $3.6 million in a week, and Gulf of Oman to China daily earnings topped $261,000. In the second quarter the company had already booked Suezmaxes at $121,800 a day on 60% of available days and its single VLCC at $141,800 on 71%. Current screens put the Acquirer's Multiple at 3.80 with intrinsic value to price at 1.20. Risks: this is a spot-rate business, so the entire earnings power evaporates the week a ceasefire is announced, and the fleet is old enough that drydock schedules matter. This is a research lead, not investment advice.", "zh": "Teekay Tankers 於 9 月 2 日入池，當時的論點是「現貨運價正在被地緣政治而非需求重新定價」。這一週論點拿到了證據：荷莫茲海峽流量降到 5 月以來最低，美灣到中國的航次運價一週跳升逾 360 萬美元，阿曼灣到中國的估算日收益超過 26.1 萬美元。而公司在第二季就已經把蘇伊士型油輪在 60% 的可用日數上鎖在每日 121,800 美元、唯一一艘超大型油輪在 71% 的日數上鎖在 141,800 美元。目前的篩選數字是 Acquirer's Multiple 3.80、內含價值對股價 1.20。風險與反方論點：這是徹底的現貨生意，停火宣布的那一週獲利能力就會蒸發；船隊年齡也讓進塢維修排程變成實質的營運變數。這是研究線索，不是投資建議。", "url": "https://www.indexbox.io/blog/teekay-tankers-reports-near-record-rates-amid-strait-of-hormuz-closure-and-venezuela-flows/"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（成品油輪日租金）", "stocks": [{"t": "ASC", "n": "Ardmore Shipping，池內 9/7 入池，成品油輪與化學品船隊逾 20 艘"}], "en": "Ardmore Shipping entered the pool on September 7. It runs more than 20 double-hulled product and chemical tankers, which is a different business from the crude carriers: Ardmore moves refined fuel, not crude. That distinction is why this week's data matters more for Ardmore than the headline oil price does. August producer prices showed diesel up 24.1% in a single month and jet fuel is roughly 57% above a year ago, while refining margins near $59 a barrel are pulling product volumes toward wherever the crack is widest. Longer, less efficient product routes are exactly what fills a product tanker's order book. Risks: product tanker supply is less constrained than crude, newbuild deliveries continue, and the same route normalisation that would hurt crude carriers hurts this one too. This is a research lead, not investment advice.", "zh": "Ardmore Shipping 於 9 月 7 日入池，船隊是 20 艘以上的雙殼成品油輪與化學品船。這跟原油輪是兩種生意：Ardmore 運的是煉好的成品油，不是原油。這個區別正是為什麼這週的數據對它比油價本身更重要。8 月生產者物價顯示柴油單月漲 24.1%，航空燃油比一年前高約 57%，而接近每桶 59 美元的煉油價差正在把成品油拉往裂解價差最寬的地方去賣。更長、更沒效率的成品油航線，正好就是成品油輪訂單簿的內容。風險與反方論點：成品油輪的供給限制不如原油輪緊，新船持續交付；而且一旦航線恢復正常，這一類船受的傷跟原油輪一樣重。這是研究線索，不是投資建議。", "url": "https://www.eia.gov/todayinenergy/detail.php?id=68104"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（在手訂單能否往 1 億推進）", "stocks": [{"t": "SMID", "n": "Smith-Midland，池內 9/5 入池，9/7 出現一年來最大單筆內部人買進"}], "en": "Smith-Midland entered the pool on September 5 on precast concrete highway barrier and utility products. Two pieces of new evidence since. First, the insider signal has become a cluster: VP of sales and marketing Matthew Smith bought roughly $54,000 of stock at $27.15 on September 7, lifting his holding by 20% in the largest single insider purchase of the past year, and CEO Ashley Smith also bought. Insiders now hold about 14% of the company. Second, the demand story got concrete: the company began production of underground precast utility vaults and manholes for a data centre project near Fredericksburg, Virginia, with deliveries running through 2026. Backlog stands at $54 million. Risks: this is a roughly $150 million market capitalisation with thin liquidity, results are lumpy by project, and one data centre is not a trend. This is a research lead, not investment advice.", "zh": "Smith-Midland 於 9 月 5 日入池，主業是高速公路預鑄混凝土護欄與公用事業預鑄件。入池後多了兩項證據。第一，內部人訊號已經變成群聚：業務行銷副總 Matthew Smith 在 9 月 7 日以每股 27.15 美元買進約 5.4 萬美元，個人持股一口氣增加 20%，是這一年來最大的單筆內部人買進；執行長 Ashley Smith 也同期買進。內部人目前合計持有約 14% 股權。第二，需求端變具體了：公司已開始為維吉尼亞州 Fredericksburg 附近的一個資料中心專案生產地下預鑄管道井與人孔，交付排到 2026 年底。在手訂單 5,400 萬美元。風險與反方論點：這是市值約 1.5 億美元、流動性很薄的公司，業績按專案跳動，而且一個資料中心不構成趨勢。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/materials/nasdaq-smid/smith-midland/news/matthew-smith-bought-20-more-shares-in-smith-midland"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 後續處分的實際成交價與隱含資本化率", "stocks": [{"t": "CSR", "n": "Centerspace，池內 7/31 入池，中西部公寓 REIT，第二季買回 45,310 股"}], "en": "Centerspace has been in the pool since July 31 on the thesis that a Midwest apartment REIT trading below the private-market value of its buildings would eventually close the gap by selling them. New evidence: the company repurchased 45,310 shares for $2.52 million between April and June under the plan authorised in August 2025. Buying back stock rather than buying buildings is management stating that its own equity is the cheapest apartment portfolio available to it, which is the cleanest possible confirmation of the discount thesis. The complication is timing: it reported a $0.96 million net loss in the second quarter, and the 10-year yield above 4.95% raises both its refinancing cost and the cap rate a buyer would demand. Risks: rising rates can widen the discount faster than buybacks close it. This is a research lead, not investment advice.", "zh": "Centerspace 自 7 月 31 日在池內，原始論點是「一檔股價低於旗下建物私有市場價值的中西部公寓 REIT，最終會靠賣資產把差距補起來」。新證據：公司在 4 月到 6 月間，依 2025 年 8 月授權的計畫買回 45,310 股、金額 252 萬美元。用錢買自己的股票而不是買公寓，等於管理層在說「市場上最便宜的公寓組合就是我們自己的股權」——這是折價論點最乾淨的一種確認方式。複雜的地方在時機：第二季淨損 96 萬美元，而 10 年期公債殖利率升破 4.95%，同時墊高它的再融資成本與買方會要求的資本化率。風險與反方論點：升息把折價拉開的速度，可能比買回把折價收斂的速度更快。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/real-estate/nyse-csr/centerspace/news/undervalued-small-caps-with-insider-buying-opportunities-in-3"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "賣壓壓倒買盤", "color": "#6DB56D", "stocks": [{"t": "NVDA", "n": "輝達，董事 Mark Stevens 出脫約 2.356 億美元股票"}, {"t": "DELL", "n": "戴爾，Silver Lake 透過多個實體協同出脫逾 2 億美元"}, {"t": "SMCI", "n": "美超微，董事與執行長配偶同日各賣 20 萬股、各約 770 萬美元"}], "en": "In the 24 hours to September 9, disclosed insider selling exceeded $650 million against just $47.5 million of buying, a ratio of roughly fourteen to one. The two largest lines were Nvidia director Mark Stevens at about $235.6 million and a coordinated Silver Lake exit from Dell totalling over $200 million across multiple entities. Before reading this as a top signal, note what these two have in common: both are long-standing venture and private-equity holders monetising positions, which is a fund lifecycle event rather than a view on next quarter.", "zh": "截至 9 月 9 日的 24 小時內，揭露的內部人賣出金額超過 6.5 億美元，買進只有 4,750 萬美元，比例約十四比一。最大的兩筆分別是輝達董事 Mark Stevens 出脫約 2.356 億美元，以及 Silver Lake 透過多個實體從戴爾協同出脫逾 2 億美元。在把這個數字讀成頭部訊號之前，先看這兩筆的共同點：它們都是長期的創投與私募基金持有人在把部位變現，屬於基金生命週期事件，而不是對下一季營運的看法。內部人資料最容易被誤讀的地方，就是把「誰在賣」跟「為什麼賣」混為一談。", "url": "https://www.everhint.com/insider-trading-signals-september-09-2026-midday-update-last-24-hours-pacific-time/"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "買方名單", "color": "#6DB56D", "stocks": [{"t": "GPI", "n": "Group 1 Automotive，Conifer Management 買進 4,060 萬美元"}, {"t": "TSN", "n": "泰森食品，新任執行長上任前後買進 100 萬美元自家股票"}, {"t": "INBX", "n": "Inhibrx，董事 Jon Kayyem 買進 56.7 萬美元"}], "en": "The buy side of the same window is short but worth reading line by line. Conifer Management put $40.6 million into Group 1 Automotive, a franchised auto dealer group. Tyson Foods' incoming CEO bought $1 million of stock, and Inhibrx director Jon Kayyem bought $567,000. Of these three, the Tyson purchase carries the most information per dollar: an incoming chief executive buying before the strategy is announced is buying on the same public information everyone else has, plus a plan nobody else has seen yet.", "zh": "同一個窗口的買方名單很短，但值得逐筆讀。Conifer Management 投入 4,060 萬美元買進 Group 1 Automotive，一家汽車經銷集團；泰森食品的新任執行長買進 100 萬美元自家股票；Inhibrx 董事 Jon Kayyem 買進 56.7 萬美元。三筆之中，泰森那一筆每一塊錢的資訊量最高：一位即將上任的執行長在策略還沒對外公布前買進，他所依據的公開資訊跟所有人一樣，差別在於他手上多了一份別人還沒看過的計畫。這種時間點的買進，比金額更值得注意。", "url": "https://www.everhint.com/insider-trading-signals-september-09-2026-midday-update-last-24-hours-pacific-time/"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "怎麼算群聚", "color": "#6DB56D", "stocks": [{"t": "SMID", "n": "Smith-Midland，執行長與業務副總在同一週各自買進，是標準的群聚樣本"}, {"t": "SMCI", "n": "美超微，關係緊密的兩人同日同規模賣出，是反向的樣本"}, {"t": "TSN", "n": "泰森食品，單一高階主管的大額買進，訊號強度介於兩者之間"}], "en": "Two filings this week show why the word cluster has to be defined precisely. At Smith-Midland the CEO and the VP of sales bought within days of each other in a company where insiders already hold 14%, which is the textbook definition: unrelated decision-makers, own money, same window, no scheduled plan. At Super Micro, director Sara Liu and the CEO's spouse each sold 200,000 shares on the same day for about $7.7 million apiece, which looks like a cluster but is not, because those two are not independent decision-makers. The rule worth keeping: a buy cluster needs people who could have disagreed and did not. Selling clusters mean much less, because there are many reasons to sell and only one to buy.", "zh": "這週的兩份申報剛好示範了為什麼「群聚」這個詞必須定義清楚。在 Smith-Midland，執行長與業務副總在幾天內先後買進，而公司內部人本來就持有 14% 股權——這是教科書定義：彼此獨立的決策者、用自己的錢、在同一個窗口、沒有預定計畫。在美超微，董事 Sara Liu 與執行長的配偶同一天各賣出 20 萬股、各約 770 萬美元，看起來像群聚，但不是，因為這兩個人並非獨立的決策者。可以帶走的判準是：買進群聚要成立，前提是那些人本來可以意見不合卻沒有。賣出群聚的意義小得多，因為賣的理由有很多種，買的理由只有一種。", "url": "https://www.everhint.com/insider-trading-signals-september-04-2026-after-hours-last-12-hours-pacific-time/"},
    {"id": "capitol_0", "channel": "政要持股", "tag": "換一條主題線", "color": "#B5654D", "stocks": [{"t": "SPCX", "n": "SpaceX，8 月 12 日在券商與 IRA 兩個帳戶同日買進，目前約 148.76 美元"}, {"t": "MRK", "n": "默克，8 月 19 日兩筆買進，各 1.5 萬至 5 萬美元區間"}, {"t": "QCOM", "n": "高通，8 月 12 日與 8 月 19 日兩筆賣出，方向與 SpaceX 相反"}], "en": "Florida representative Maria Elvira Salazar's periodic transaction report, filed September 9, covers trades from early to late August. The structure is what is worth reading. On August 12 she bought SpaceX Class A in a UBS brokerage account and a UBS IRA on the same day, and SpaceX has been public only since its June 12 IPO at $135, now around $148.76. On August 19 she added Merck in two separate purchases. Against those, she sold Qualcomm twice, Chubb, part of IBM and part of Moderna. The position underneath this is a rotation out of mature semiconductors and legacy IT into space infrastructure and pharma. Whether that thesis is right is a separate question from whether it is legible, and this one is legible.", "zh": "佛州眾議員 Maria Elvira Salazar 在 9 月 9 日申報的定期交易報告，涵蓋 8 月上旬到下旬的交易。值得讀的是它的結構。8 月 12 日，她在一個 UBS 券商帳戶與一個 UBS 個人退休帳戶，同一天各買進 SpaceX 的 A 股；SpaceX 是今年 6 月 12 日才以每股 135 美元 IPO 的新標的，目前約 148.76 美元。8 月 19 日她分兩筆加碼默克。對應這些買進的，是兩筆賣出高通、賣出安達（Chubb）、部分賣出 IBM 與部分賣出莫德納。底下的部位在說一件事：從成熟半導體與傳統 IT，轉向太空基礎建設與製藥。這個假設對不對是另一回事，但它至少是讀得出來的。", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035411.pdf"},
    {"id": "capitol_1", "channel": "政要持股", "tag": "三個折扣", "color": "#B5654D", "stocks": [{"t": "HUBB", "n": "Hubbell，電網電力設備，8 月被分批買進、8 月 25 日整批賣出"}, {"t": "BWXT", "n": "BWX Technologies，核能組件，同一份申報裡同樣是先買後賣"}, {"t": "CHRW", "n": "C.H. Robinson，物流，8 月四次小額買進後在同一天全數出清"}], "en": "Three discounts to apply to every one of these filings, and today's batch shows all three at once. First, the 45-day lag: these trades happened between August 7 and August 25 and were only filed between September 1 and September 9, so anyone copying them is buying at a price a month stale. Second, the amounts are bands, not numbers, ranges like $1,001 to $15,000 make it impossible to compute what fraction of a portfolio anything represents. Third, and most important today, account attribution. Every line in April McClain Delaney's September 9 filing is marked DC, meaning a dependent child's account, and on August 25 alone roughly twenty separate $100,001 to $250,000 sales appear across unrelated sectors including Hubbell, BWX, EMCOR, Entegris, ITT and Labcorp. That is a managed account being rebalanced on one date, not twenty stock opinions.", "zh": "讀這類申報要打三個折扣，而今天這一批剛好三個都齊了。第一是 45 天延遲：這些交易發生在 8 月 7 日到 8 月 25 日之間，卻要到 9 月 1 日至 9 日才申報，所以任何跟單的人買到的都是一個月前的價位。第二是金額只有區間沒有數字，像「1,001 到 15,000 美元」這種寬度，根本算不出它佔投資組合多少比重。第三，也是今天最關鍵的一點，是帳戶歸屬：April McClain Delaney 在 9 月 9 日申報的每一筆，持有人欄位都標示 DC，也就是受扶養子女帳戶；而且光是 8 月 25 日一天，就出現大約二十筆 10 萬至 25 萬美元的賣出，橫跨 Hubbell、BWX、EMCOR、Entegris、ITT、Labcorp 等毫無關聯的產業。那是一個委託管理帳戶在同一天做整批再平衡，不是二十個選股判斷。", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035408.pdf"},
    {"id": "week_0", "channel": "本週事件", "tag": "下週總經", "color": "#C97DD4", "stocks": [{"t": "VTWO", "n": "羅素 2000 ETF，浮動利率負債比重高，是升息決議的最大變數承受者"}, {"t": "XLF", "n": "金融類股 ETF，利率路徑決定淨息差與放款品質兩條線"}, {"t": "DIA", "n": "道瓊 ETF，權值偏工業與金融，對政策利率的反應與那斯達克不同"}], "en": "The Federal Open Market Committee meets September 15 and 16, with the decision at 2:00 pm Eastern on the 16th and the press conference at 2:30. Futures currently price better than a 73% chance of a quarter-point increase, so the surprise this time would be no move rather than a move. Retail sales follow midweek, and after four days of selling driven entirely by oil and yields, that will be the first read on whether the consumer has noticed $4-plus gasoline yet. Everything on this calendar routes back to one question: is this an energy price shock or the start of an inflation cycle.", "zh": "聯邦公開市場委員會在 9 月 15 日與 16 日開會，決議在 16 日美東時間下午 2 點公布，記者會 2 點 30 分。期貨目前給升息一碼的機率超過 73%，所以這一次的意外會是「不動」而不是「動」。零售銷售數據排在週中，在連續四天完全由油價與殖利率主導的下跌之後，那會是第一份告訴我們消費者有沒有感受到每加侖四美元以上汽油的資料。這份行事曆上的每一項，最後都通往同一個問題：這是一次能源價格衝擊，還是一輪通膨循環的開始。", "url": "https://www.federalreserve.gov/newsevents/2026-september.htm"},
    {"id": "week_1", "channel": "本週事件", "tag": "下週財報", "color": "#C97DD4", "stocks": [{"t": "FDX", "n": "聯邦快遞，下週四盤後公布財年首季，市場預期每股 3.71 美元、營收 217.4 億"}, {"t": "GIS", "n": "General Mills，食品業者，可看通膨轉嫁與量價取捨"}, {"t": "UPS", "n": "優比速，與 FedEx 同一條包裹量與燃油成本的曲線"}], "en": "FedEx reports fiscal first quarter results after the close on Thursday, with consensus at $3.71 in EPS on $21.74 billion of revenue. In a week defined by diesel rising 24.1% in a month, FedEx is the single most useful report on the calendar: it is a real-time read on both freight volume and fuel pass-through, and its guidance historically moves the whole industrials complex. General Mills also reports, which gives the other half of the inflation question, whether packaged food can still raise price without losing volume.", "zh": "聯邦快遞在下週四盤後公布財年第一季，市場共識是每股盈餘 3.71 美元、營收 217.4 億美元。在一個柴油單月漲 24.1% 的環境裡，這是整份行事曆上最有用的一份財報：它同時是貨運量與燃油轉嫁能力的即時讀數，而且它的財測歷來會帶動整個工業族群。General Mills 也在下週公布，補上通膨問題的另外一半——包裝食品還能不能在不流失銷量的情況下繼續漲價。真正的通膨答案往往不在數據局，在這兩份財報的毛利率那一行。", "url": "https://www.investing.com/equities/fedex-corp-earnings"},
    {"id": "eval_0", "channel": "今日評估", "tag": "緩衝不見了", "color": "#E8A838", "status": "今日最值得注意 · 到 end screen 按討論鍵展開", "stocks": [{"t": "QQQ", "n": "那斯達克 100 ETF，長天期成長股是折現率上行時最先被重估的一層"}, {"t": "TIP", "n": "抗通膨公債 ETF，今早 8 點 30 分之後最直接的定價工具"}, {"t": "GLD", "n": "黃金 ETF，與升息機率同步走高，代表市場在押通膨跑贏政策"}], "en": "One thing to carry out of today: the cushion is gone. For two years equity investors have relied on an implicit put, the idea that if macro data deteriorates the Fed eventually eases. This week that logic inverted. The macro deteriorated through inflation, and inflation only pushes policy tighter, which is why futures now price better than a 73% chance of a hike into a market that has fallen four days straight. The 8:30 CPI is the last input before that decision, and the entire distribution sits between a 0.2% and a 0.3% core print.", "zh": "今天只帶走一件事：緩衝不見了。過去兩年股票投資人一直靠著一個隱含的賣權——只要總經數據轉壞，聯準會最後會轉鬆。這一週這個邏輯倒過來了：總經是以通膨的形式轉壞的，而通膨只會把政策往更緊的方向推。這就是為什麼在連跌四天的市場裡，期貨反而給升息一碼超過 73% 的機率。今天早上 8 點 30 分的 CPI 是那個決定之前的最後一個輸入，而整個分布就壓在核心月增 0.2% 還是 0.3% 之間。開放式問題留給你：如果今天核心通膨溫和、但布蘭特原油還在 107 美元，你要交易那個數據，還是交易那個油價？", "url": "https://www.cnbc.com/2026/09/10/fridays-cpi-inflation-report-is-even-more-important-than-usual-heres-what-to-expect.html"},
];

const TODAY_SUBS = ["全部", ...CHANNELS.map(c => c.key), "資金流向", "政要績效"];

})();

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/11/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v10.6</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
