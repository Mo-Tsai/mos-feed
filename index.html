<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {

  }

    background: var(--bg); -webkit-font-smoothing: antialiased;

  .end-btn:hover { border-color: var(--text-secondary); color: var(--text-secondary); }
  .progress-bar { font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 0.14em; color: var(--text-tertiary); text-transform: uppercase; }
  .theme-toggle { position: fixed; top: 28px; right: 12px; z-index: 100; background: none; border: none; cursor: pointer; font-size: 13px; color: var(--text-tertiary); padding: 4px; line-height: 1; transition: color 0.3s ease; font-family: 'Courier New', monospace; }

  .nav-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; padding:10px 24px 14px; background:var(--bg); border-top:1px solid var(--divider); z-index:50; }
  .nav-btn { background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:16px; cursor:pointer; padding:10px 22px; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; line-height:1; }

  .nav-btn:disabled { opacity:0.25; cursor:default; border-color:var(--divider); color:var(--text-tertiary); }
  .nav-count { font-family:'Courier New',monospace; font-size:10px; letter-spacing:0.14em; color:var(--text-tertiary); text-transform:uppercase; }
</style>

<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS =====
let _azToken = null, _azTokenExp = 0, _azAbort = null;
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
function azureStop() { if (_azAbort) { _azAbort.abort(); _azAbort = null; } }
async function azureSpeak(text, { rate='0%', onStart, onEnd, onError }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const voice = localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural';
  if (!key) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const token = await _getAzToken(key, region, ctrl.signal);
    const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'><voice name='${voice}'><prosody rate='${rate}'>${_xmlEsc(text)}</prosody></voice></speak>`;
    const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method:'POST', signal:ctrl.signal,
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
      body:ssml
    });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (ctrl.signal.aborted) return true;
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    if (onError) onError(e);
    return false;
  }
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====

// ===== 每日卡片(由每日排程整批抽換,共 20 張) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "指數總覽", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "S&P 500 ETF，週五收平、全週收黑"}, {"t": "QQQ", "n": "Nasdaq 100 ETF，一週跌約 2% 全場最弱"}, {"t": "DIA", "n": "道瓊 ETF，週五逆勢漲 0.46% 撐住盤面"}], "zh": "上週五（7/24）美股收在分歧的位置：標普 500 幾乎平盤收 7,411.98（+0.05%），道瓊上漲 235.6 點收 51,947.25（+0.46%），但那斯達克下跌 0.64% 收 24,975.82。三大指數整週都是負報酬，那斯達克一週跌約 2% 表現最差。分歧的原因很清楚：資金一邊逃離昂貴的 AI 相關資產，一邊湧入能源、公用與價值型藍籌。今天是週日、美股休市，這個「權值走弱、其他撐盤」的結構會直接帶進本週三 FOMC 與四大科技財報。", "en": "Friday July 24 closed split: the S&P 500 was essentially flat at 7,411.98 (+0.05%), the Dow rose 235.6 points to 51,947.25 (+0.46%), while the Nasdaq fell 0.64% to 24,975.82. All three indexes booked weekly losses, with the Nasdaq's roughly 2% drop the worst. Money is rotating out of expensive AI-linked names and into energy, utilities and value blue chips. Markets are closed today; this split structure carries straight into Wednesday's FOMC and Big Tech earnings.", "ja": "7月24日金曜の米国株はまちまちで引けた。S&P500はほぼ横ばいの7,411.98（+0.05%）、ダウは235.6ポイント高の51,947.25（+0.46%）、一方ナスダックは0.64%安の24,975.82。3指数とも週間ではマイナスで、ナスダックの約2%下落が最大。割高なAI関連から資金が流出し、エネルギー・公益・バリュー株に向かっている。本日は休場。この構図が水曜のFOMCと大型テック決算に直結する。", "url": "https://www.cnbc.com/2026/07/24/stock-market-next-week-outlook-for-july-27-31-2026.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "晶片重挫", "color": "#E05C5C", "stocks": [{"t": "SOXX", "n": "半導體 ETF，自 6 月高點三週回檔逾 20%"}, {"t": "INTC", "n": "7 個交易日內跌 21%，18A 良率遞延成導火線"}, {"t": "MU", "n": "記憶體代表股，受 SK 海力士放緩 HBM 擴產拖累"}], "zh": "半導體是這波賣壓的震央：費城半導體指數自 6 月高點三週內跌超過 20%，整個板塊市值蒸發逾一兆美元。導火線有三個——SK 海力士傳出放慢 HBM 高頻寬記憶體擴產、市場開始質疑天量 AI 資本支出能不能回收、以及 Fed 新主席 Warsh 的鷹派立場推高折現率。Intel 七個交易日內重挫 21%，市場傳出其 18A 製程要到 2026 年底至 2027 年才有獲利良率。多數賣方仍稱這是「估值型的中期修正」而非基本面崩壞，但這個分歧本身就是本週的觀察重點。", "en": "Semiconductors are the epicenter: the SOX index has shed over 20% from its June peak in three weeks, erasing more than $1 trillion in value. Three triggers — reports that SK Hynix is slowing HBM capacity expansion, growing doubt that record AI capex will earn its return, and a hawkish Fed under Kevin Warsh lifting discount rates. Intel fell 21% in seven sessions on reports its 18A process won't reach profitable yields until late 2026 or 2027. Most sell-side desks still call this a valuation-driven mid-cycle reset rather than a fundamental break.", "ja": "半導体が売りの震源地だ。SOX指数は6月高値から3週間で20%超下落し、1兆ドル超の時価総額が消失。要因は3つ——SKハイニックスのHBM増産減速報道、巨額AI設備投資の回収可能性への懐疑、そしてウォーシュFRB議長下でのタカ派姿勢による割引率上昇。インテルは18Aプロセスの黒字化歩留まりが2026年末〜2027年にずれ込むとの報道で7営業日で21%下落。多くのアナリストは基礎的悪化ではなく「バリュエーション主導の中間調整」と見ている。", "url": "https://www.forbes.com/sites/petercohan/2026/07/08/intel-stock-down-21-inside-the-july-2026-semiconductor-selloff/"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "地緣油價", "color": "#E05C5C", "stocks": [{"t": "XLE", "n": "能源板塊 ETF，年初至今漲逾 22% 領先大盤"}, {"t": "OXY", "n": "美國本土 E&P 代表，油價每上一階直接反映在現金流"}], "zh": "中東仍是全場最大的變數。胡塞武裝宣布對沙烏地船運封鎖後攻擊兩艘沙國油輪，布蘭特原油一度觸及每桶 100 美元；此前荷姆茲海峽衝突升溫時，巴林 Bapco 煉廠與卡達 Ras Laffan LNG 廠都曾宣布不可抗力，沙國 Ras Tanura 煉廠一度停機。油價對美股是雙面刃：能源股受惠，但油價推升的通膨預期正好卡在 Fed 準備討論「要不要升息」的節骨眼上。本週三 FOMC 前，油價任何一次跳升都會被市場翻譯成「升息機率上升」。", "en": "The Middle East remains the biggest swing factor. Houthi forces attacked two Saudi tankers after declaring a naval blockade, pushing Brent to $100 a barrel. Earlier in the Hormuz escalation, Bahrain's Bapco refinery and Qatar's Ras Laffan LNG complex declared force majeure and Saudi's Ras Tanura refinery went offline. Oil is a double-edged sword here: energy equities benefit, but oil-driven inflation expectations land exactly as the Fed debates whether to hike. Any crude spike before Wednesday's FOMC reads straight through to higher hike odds.", "ja": "中東が最大の変動要因であり続けている。フーシ派がサウジ向け海上封鎖を宣言後にタンカー2隻を攻撃し、ブレント原油は一時100ドルに到達。ホルムズ海峡の緊張時にはバーレーンのBapco製油所とカタールのRas Laffan LNG施設が不可抗力を宣言、サウジのRas Tanura製油所も停止した。原油は諸刃の剣で、エネルギー株には追い風だが、FRBが利上げを議論する局面でインフレ期待を押し上げる。", "url": "https://money.usnews.com/investing/news/articles/2026-07-23/us-energy-shares-gain-as-houthi-tanker-attacks-push-brent-to-100"},
    {"id": "earn_0", "channel": "財報速報", "tag": "資本支出震撼", "color": "#E8786A", "stocks": [{"t": "TSLA", "n": "財報後單日重挫約 14.5%，市值蒸發約 2,000 億美元"}, {"t": "GOOGL", "n": "營收超標仍跌約 7%，市值少掉約 3,000 億美元"}], "zh": "上週最大的事件是 Tesla 與 Alphabet 的財報：兩家都「打敗預期」，股價卻分別重挫約 14.5% 與 7.1%，合計蒸發約 5,000 億美元市值。原因是資本支出。Alphabet 把今年 capex 指引上調到 1,950–2,050 億美元（原本 1,800–1,900 億），光 Q2 就花了 449 億、年增一倍，並預告 2027 年更高；Tesla 的 Q2 capex 年增 142% 至 57.9 億，全年上看 250 億以上，兩家自由現金流雙雙轉負。市場的訊息很直接：光是營收超標已經不夠，投資人現在要看資本支出的紀律。", "en": "Last week's defining event: Tesla and Alphabet both beat, and both were punished — down roughly 14.5% and 7.1%, wiping out about $500 billion in combined market value. The reason is capex. Alphabet lifted 2026 capital spending guidance to $195–205 billion from $180–190 billion, spent $44.9 billion in Q2 alone (double year-over-year) and flagged higher 2027 spend. Tesla's Q2 capex jumped 142% to $5.79 billion with over $25 billion guided for the year. Both went free-cash-flow negative. Beating on revenue is no longer enough; investors now demand capex discipline.", "ja": "先週最大の出来事はテスラとアルファベットの決算だ。両社とも予想を上回ったが株価はそれぞれ約14.5%、7.1%下落し、合計約5,000億ドルの時価総額が消えた。原因は設備投資。アルファベットは今年のcapexガイダンスを1,800-1,900億ドルから1,950-2,050億ドルに引き上げ、Q2だけで449億ドル（前年比2倍）を投じ、2027年はさらに増えると予告。テスラのQ2 capexは142%増の57.9億ドル、通年250億ドル超。両社ともFCFが赤字転落した。", "url": "https://www.cnbc.com/2026/07/23/tesla-tsla-alphabet-googl-stock-today.html"},
    {"id": "earn_1", "channel": "財報速報", "tag": "超預期也照跌", "color": "#E8786A", "stocks": [{"t": "DHR", "n": "7/21 調整後 EPS 超標、上調全年指引，股價仍跌近 13%"}, {"t": "GOOG", "n": "Alphabet C 股同步反映資本支出擔憂"}], "zh": "這個財報季出現一個值得記住的型態：「超預期也照跌」。Danaher 在 7/21 調整後 EPS 超標、還上調全年獲利指引，股價當天仍重挫近 13%。這不是個案，而是整個市場的定價邏輯換檔——當估值已經反映了完美劇本，公司只要在指引、成本或現金流任一環節露出瑕疵，就會被殺。對讀者的實際意義是：本週四大科技公布財報時，別只看 EPS 有沒有過關，重點在資本支出、毛利率與 2027 年指引這三格。", "en": "A pattern worth remembering this season: beat and still sell off. Danaher topped adjusted EPS on July 21 and raised full-year guidance, yet fell nearly 13% that day. It isn't an isolated case — the market's pricing logic has shifted. When valuation already assumes a perfect script, any blemish in guidance, cost or cash flow gets punished. The practical read for this week's Big Tech prints: don't stop at whether EPS cleared the bar — watch capex, gross margin and the 2027 outlook.", "ja": "今決算シーズンで覚えておくべきパターンがある。「予想超過でも売られる」だ。ダナハーは7月21日に調整後EPSが予想を上回り通期ガイダンスも引き上げたが、当日13%近く下落した。個別事例ではなく市場の値付けロジックの転換だ。完璧なシナリオが既に織り込まれている以上、ガイダンス・コスト・キャッシュフローのいずれかに傷があれば売られる。今週の大型テック決算ではEPSではなくcapex・粗利率・2027年見通しを見るべきだ。", "url": "https://www.forbes.com/sites/investor-hub/article/best-undervalued-stocks-buy-july-2026/"},
    {"id": "macro_0", "channel": "總經政策", "tag": "FOMC 週三", "color": "#7C6AF7", "stocks": [{"t": "TLT", "n": "20 年期公債 ETF，升息預期升高的最直接受害者"}, {"t": "XLF", "n": "金融板塊 ETF，利率路徑轉鷹時的相對受惠者"}], "zh": "本週三（7/29）是 Fed 主席 Kevin Warsh 上任後最關鍵的一次會議。市場共識仍是按兵不動、維持 3.50–3.75%，FactSet 調查的經濟學家幾乎一面倒押「不動」。但真正的變化在後面：7 月升息機率已從 7 月初的 18% 一路升到 36%，而 9 月會議升息機率被市場定價到 56–65%。Warsh 7 月 1 日在 Sintra 央行論壇直言「物價太高」，把政策焦點從就業徹底轉向通膨。也就是說，這次會議的重點不是「利率是多少」，而是聲明稿與記者會裡有沒有替 9 月升息鋪路。", "en": "Wednesday July 29 is the most consequential meeting since Kevin Warsh took the Fed chair. Consensus is still a hold at 3.50–3.75%, with FactSet-polled economists nearly unanimous. The real story is what comes after: odds of a July hike climbed from 18% in early July to 36%, and markets now price a 56–65% chance of a September hike. Warsh said flatly at the Sintra forum on July 1 that prices are too high, shifting the Fed's focus from employment to inflation. The meeting is about the statement and press conference paving the way for September, not the rate itself.", "ja": "7月29日水曜は、ウォーシュ議長就任後で最も重要な会合となる。コンセンサスは3.50-3.75%の据え置きで、FactSet調査のエコノミストもほぼ一致。焦点はその先だ。7月利上げ確率は月初の18%から36%に上昇し、9月会合の利上げ確率は56-65%で織り込まれている。ウォーシュ議長は7月1日のシントラ会議で「物価は高すぎる」と明言し、政策の軸足を雇用からインフレへ完全に移した。注目は声明文と会見が9月への地ならしをするかどうか。", "url": "https://www.nbcnews.com/business/economy/inflation-kevin-warsh-fed-fomc-meeting-rcna350411"},
    {"id": "macro_1", "channel": "總經政策", "tag": "油價通膨", "color": "#7C6AF7", "stocks": [{"t": "GLD", "n": "黃金 ETF，地緣風險與實質利率的雙重指標"}, {"t": "TIP", "n": "抗通膨債券 ETF，反映市場對通膨預期的定價"}], "zh": "油價與 Fed 這兩條線本週會綁在一起。布蘭特一度上探 100 美元，能源價格是最直接傳導到 CPI/PCE 的項目之一，而本週稍晚就要公布 6 月 PCE 物價指數——Fed 最看重的通膨指標。這形成一個尷尬的組合：地緣供應面推升的通膨，是升息最難處理的一種，因為升息壓不下油輪被攻擊的風險。對市場而言，接下來要盯的不只是 PCE 的數字，還有「油價漲勢有沒有滲進核心項目」。", "en": "Oil and the Fed are tied together this week. Brent touched $100, and energy is one of the fastest passthroughs into CPI and PCE — and the June PCE deflator, the Fed's preferred inflation gauge, lands later this week. That is an awkward combination: supply-shock inflation is the hardest kind for rate policy to address, because hikes cannot stop tankers from being attacked. What matters isn't only the PCE headline, but whether the oil move is bleeding into core.", "ja": "今週は原油とFRBが連動する。ブレントは一時100ドルに達し、エネルギーはCPI・PCEへの波及が最も速い項目の一つだ。そして今週後半にはFRBが最重視する6月PCE物価指数が発表される。厄介な組み合わせだ。供給ショック起因のインフレは金融政策で最も対処しにくい。利上げではタンカーへの攻撃を止められないからだ。ヘッドラインだけでなく、原油高がコア項目に浸透しているかを見る必要がある。", "url": "https://features.financialjuice.com/2026/07/24/week-ahead-economic-indicators-27th-31st-july-us/"},
    {"id": "sector_0", "channel": "產業風向", "tag": "煉油裂解價差", "color": "#4EABA4", "stocks": [{"t": "MPC", "n": "Marathon Petroleum，7 月漲約 24%、2021 年以來最強月份"}, {"t": "PSX", "n": "Phillips 66，7 月漲約 23%"}, {"t": "VLO", "n": "Valero，7 月漲約 20%"}], "zh": "這個月最強的一條資金線在煉油廠。荷姆茲海峽衝突推升成品油短缺，3-2-1 裂解價差（煉油廠把原油變成汽柴油賺的價差）衝到史上最高約每桶 70 美元，超越 2022 年能源危機的水準。結果就是 Marathon Petroleum 7 月漲約 24%（2021 年以來最強月）、Phillips 66 約 23%、Valero 約 20%，成為 7 月標普 500 的領漲群。要注意的是，裂解價差是典型的均值回歸指標：它創新高的同時，也代表未來下修的空間變大，這是拿來理解資金流向的線索，不是追高的理由。", "en": "July's strongest flow is in refiners. Hormuz disruption tightened product supply and drove the 3-2-1 crack spread — the margin refiners earn turning crude into fuel — to an all-time high near $70 a barrel, eclipsing the 2022 energy crisis. Marathon Petroleum is up about 24% in July (its best month since 2021), Phillips 66 about 23% and Valero roughly 20%, leading the S&P 500. Note that crack spreads are a classic mean-reverting series: a record print also means more room to fall.", "ja": "7月最強の資金の流れは製油業だ。ホルムズ海峡の混乱で製品供給が逼迫し、3-2-1クラックスプレッド（原油を燃料に変える精製マージン）が過去最高の約70ドル/バレルに達し、2022年のエネルギー危機を超えた。マラソン・ペトロリアムは7月に約24%高（2021年以来最強の月）、フィリップス66は約23%、バレロは約20%上昇しS&P500を牽引。ただしクラックスプレッドは典型的な平均回帰系列で、最高値は下落余地の拡大も意味する。", "url": "https://www.benzinga.com/news/26/07/60556779/oil-refiner-stocks-record-crack-spread-hormuz"},
    {"id": "sector_1", "channel": "產業風向", "tag": "防禦輪動", "color": "#4EABA4", "stocks": [{"t": "XLU", "n": "公用事業 ETF，防禦輪動的核心受益板塊"}, {"t": "XLP", "n": "必需消費 ETF，資金撤出成長股時的避風港"}, {"t": "XLV", "n": "醫療保健 ETF，估值低位承接輪動資金"}], "zh": "更大的圖像是：2026 年的市場正在「離開 AI 交易」。能源板塊今年以來漲逾 22%，工業與必需消費同步領先，而醫療保健、公用事業、房地產也都在近期加速吸金；相對地科技股走弱。這不是一天的現象，而是延續整個第三季的結構性輪動——投資人在 AI 資本支出回收期不明的情況下，把錢挪到現金流可預測、估值不極端的地方。對做研究的人來說，這代表接下來一段時間，冷門的工業、金融、REIT 反而比熱門科技更容易找到被低估的名字。", "en": "The bigger picture: 2026 is a rotation out of the AI trade. Energy is up more than 22% year to date, with industrials and consumer staples also leading, while health care, utilities and real estate have been drawing flows and technology weakens. This is not a one-day move but a structural rotation running through the quarter — investors moving into predictable cash flows and non-extreme valuations while the payback period on AI capex stays unclear. For research purposes, that means overlooked industrials, financials and REITs are where mispricings are easier to find right now.", "ja": "より大きな構図として、2026年の市場は「AIトレードからの離脱」が進んでいる。エネルギーは年初来22%超上昇し、資本財・生活必需品も上位。ヘルスケア・公益・不動産にも資金が流入する一方、テクノロジーは軟調だ。1日限りの動きではなく四半期を通じた構造的ローテーションで、AI設備投資の回収期間が不透明な中、予測可能なキャッシュフローと過度でないバリュエーションに資金が移っている。地味な資本財・金融・REITの方が割安銘柄を見つけやすい局面だ。", "url": "https://www.morningstar.com/stocks/6-stocks-driving-2026-stock-market-rotation"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，年初至今漲約 22% 但 7 月停滯"}, {"t": "IJR", "n": "標普小型股 600 ETF，體質較佳的小型股基準"}], "zh": "小型股今年是真的強：羅素 2000 年初至今漲近 22%，是 1991 年以來最好的上半年，過去 12 個月報酬 20.7% 也遠勝標普 500 的 11.3%。但進入 7 月動能明顯停住——指數卡在 3,000 點附近幾乎原地踏步，上週五還跟著那斯達克收黑。這個「上半年狂飆、下半年卡關」的形狀值得注意：小型股的漲勢很大一部分來自降息預期，而現在市場正在把 9 月升息機率往上調，這條假設正被抽走。本週 FOMC 對小型股的意義比對大型股更大。", "en": "Small caps have genuinely led this year: the Russell 2000 is up nearly 22% year to date, its best first half since 1991, and its trailing 12-month return of 20.7% far outpaces the S&P 500's 11.3%. But momentum stalled in July — the index has gone almost nowhere near 3,000 and closed lower alongside the Nasdaq on Friday. The shape matters: much of the small-cap rally was built on rate-cut expectations, and markets are now pricing rising odds of a September hike. This week's FOMC matters more for small caps than for mega caps.", "ja": "小型株は今年実際に強い。ラッセル2000は年初来約22%高で1991年以来最高の上半期、過去12カ月リターン20.7%はS&P500の11.3%を大きく上回る。しかし7月に入り勢いは明確に停滞——指数は3,000近辺でほぼ横ばい、金曜はナスダックと共に下落した。この形状は重要だ。小型株上昇の多くは利下げ期待に支えられていたが、市場は今9月利上げ確率を引き上げており、その前提が抜けつつある。今週のFOMCは大型株より小型株に効く。", "url": "https://247wallst.com/investing/2026/07/16/the-russell-2000-is-having-its-best-year-in-23-years-heres-why-small-caps-are-winning-again/"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "七月飆股", "color": "#5B8ED6", "stocks": [{"t": "CRNX", "n": "7 月漲 123%，Vertex 以每股 85 美元現金收購、約 100 億美元"}, {"t": "VRTX", "n": "收購方，用現金買下 Crinetics 補內分泌管線"}, {"t": "RPD", "n": "Rapid7 漲 46%，資安板塊回暖＋出售傳聞＋高空單"}], "zh": "7 月漲最兇的小型股，幾乎每一檔背後都有一個硬催化劑。冠軍是 Crinetics 漲 123%——Vertex 宣布以每股 85 美元現金收購、作價約 100 億美元；資安公司 Rapid7 漲 46%，靠板塊回暖、管理層交接讓出售題材續命、加上龐大空單製造軋空條件；Sable Offshore 漲 32%，因為完成 3 億美元可轉債加 1 億美元增資、還掉 Exxon 的貸款，解除了再融資危機。這三個案例的共通點是：漲勢來自事件，不是來自小型股整體變好。", "en": "July's biggest small-cap movers each had a hard catalyst behind them. The leader is Crinetics, up 123% after Vertex agreed to acquire it for $85.00 per share in cash, valuing it near $10 billion. Cybersecurity name Rapid7 rose 46% on a sector rally, a leadership transition that kept the sale thesis alive, and a heavy short base. Sable Offshore gained 32% after closing $345 million in convertibles plus $107 million in equity to repay its Exxon loan and clear its refinancing crisis. The common thread: these moves are event-driven, not evidence of broad small-cap strength.", "ja": "7月の小型株上昇率上位は、いずれも明確な材料を伴っている。首位はクリネティクスの123%高——バーテックスが1株85ドルの現金で約100億ドル規模の買収に合意した。サイバーセキュリティのRapid7は46%高で、セクター回復・経営陣交代による売却思惑の継続・大量の空売り残が背景。セーブル・オフショアは32%高、3億ドルの転換社債と1億ドルの増資でエクソン向けローンを返済し借換え危機を解消した。共通点は、事件駆動であって小型株全体の改善ではないこと。", "url": "https://www.benzinga.com/markets/small-cap/26/07/60593569/russell-2000-small-cap-stocks-july-biggest-gainers-2026"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "判讀方法", "color": "#5B8ED6", "stocks": [{"t": "VSTM", "n": "漲 29%，空單佔流通股 21% 造成軋空"}, {"t": "ADCT", "n": "漲 30%，來自 6 月暴跌 70% 後的超跌反彈"}, {"t": "OFIX", "n": "漲 28%，CMS 撤回給付調整、恢復骨生長刺激器報銷"}], "zh": "看小型股漲幅榜有個必要的修正動作：多數 7 月大漲的名字，年初至今其實還是負的。Verastem 漲 29%，主因是空單佔流通股 21% 引發的軋空，KRAS 抑制劑早期數據只是助燃；ADC Therapeutics 漲 30%，是 6 月暴跌 70% 之後的超跌反彈加上併購題材想像。這兩種漲法（軋空、超跌反彈）和 Orthofix 因 CMS 恢復給付而漲 28% 是完全不同性質——後者是現金流真的改變了。分辨催化劑的種類，比看漲幅重要得多。", "en": "One necessary correction when reading a small-cap gainers list: most of July's big movers are still underwater year to date. Verastem's 29% gain came mainly from a squeeze with short interest at 21% of float, with early KRAS inhibitor data as fuel. ADC Therapeutics rose 30% as an oversold bounce off a 70% June decline, plus M&A speculation in the antibody-drug conjugate space. Neither is the same animal as Orthofix's 28% gain, where CMS reversed billing changes and restored reimbursement — an actual cash-flow change. Classifying the catalyst matters far more than the percentage.", "ja": "小型株の上昇率ランキングを読む際に必要な補正がある。7月の大幅高銘柄の多くは年初来では依然マイナスだ。Verastemの29%高は浮動株の21%に達する空売り残による踏み上げが主因で、KRAS阻害剤の初期データは燃料に過ぎない。ADC Therapeuticsの30%高は6月の70%下落からの反発とADC分野のM&A思惑。いずれもOrthofixの28%高（CMSが請求ルール変更を撤回し骨成長刺激装置の償還が復活＝実際のキャッシュフロー変化）とは性質が異なる。上昇率より材料の種類を見分ける方が重要だ。", "url": "https://www.benzinga.com/markets/small-cap/26/07/60593569/russell-2000-small-cap-stocks-july-biggest-gainers-2026"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 08/27 財報", "stocks": [{"t": "MOV", "n": "雷達池主角，股價約 38.5 美元逼近 52 週高點 39.85"}], "zh": "Movado Group 是做手錶與珠寶的集團（自有 Movado、Ebel，加上 Coach、Tommy、Lacoste、HUGO 授權錶）。它被忽視的原因很單純：鐘錶是冷門產業、市值小、只有兩位分析師覆蓋、媒體幾乎沒聲量。正在改變的有兩件事——7 月 21 日 Kate Spade New York 宣布與 Movado 簽下全球授權合作，由 Movado 設計製造與經銷 Kate Spade 錶款；7 月 16 日公司把循環信貸展延到 2031 年，且帳上一筆貸款都沒動用、現金約 2.3 億美元、實質無淨負債。風險是關稅與精品消費放緩（管理層因此未給 FY2027 財測）、品牌老化，而股價已從低點反彈逾 35%，便宜的部分被吃掉不少。以上是研究線索，不是投資建議。", "en": "Movado Group makes watches and jewelry (its own Movado and Ebel brands plus licensed Coach, Tommy, Lacoste and HUGO lines). Why it's ignored is simple: an unfashionable industry, a small market cap, two analysts covering it, near-zero media presence. Two things are changing — on July 21 Kate Spade New York announced a global licensing partnership with Movado to design, make and distribute its watches; on July 16 the company extended its revolving credit facility to 2031 with zero drawn, roughly $230 million in cash and effectively no net debt. Risks: tariffs and slowing luxury demand (management withheld FY2027 guidance), brand aging, and a stock already up over 35% off its lows. Research lead, not investment advice.", "ja": "Movado Groupは時計・宝飾品グループ（自社のMovado、Ebelに加えCoach、Tommy、Lacoste、HUGOのライセンス時計）。無視されている理由は単純で、地味な業界・小型株・カバーするアナリストは2名・メディア露出ほぼゼロ。変化は2つ——7月21日にKate Spade New Yorkが同社と世界ライセンス提携を発表、時計の設計・製造・流通を担当。7月16日にはリボルビング信用枠を2031年まで延長し、借入残高ゼロ・現金約2.3億ドル・実質無借金。リスクは関税と高級消費の減速（経営陣はFY2027見通しを示さず）、ブランドの老化、株価が安値から35%超戻している点。投資助言ではなく研究の手がかりです。", "url": "https://www.tipranks.com/news/company-announcements/movado-group-amends-and-extends-revolving-credit-facility"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Q3 財報（10 月）看合併綜效落地", "stocks": [{"t": "BHRB", "n": "維州社區銀行，Q2 GAAP EPS 0.50 但調整後 2.03"}, {"t": "MPB", "n": "同屬小型銀行整併主題的對照組"}], "zh": "Burke & Herbert Financial 是維吉尼亞州的老牌社區銀行，今年 5 月 1 日完成與 LINKBANCORP 的合併，資產規模來到約 110 億美元、分行超過 100 家。它被忽視的原因是雙重的：小型區域銀行本來就少人看，而合併當季的會計雜訊又把數字弄花了——Q2 GAAP 每股盈餘只有 0.50 美元（前一季 1.79），但調整後營運淨利 3,750 萬美元、調整後 EPS 高達 2.03 美元。同時內部人過去三個月買進 12,300 股、金額約 77.4 萬美元，一年淨買超約 93.3 萬美元，董事 Julian Barnwell 6 月 3 日以每股約 62.76 美元加碼約 5,000 股。風險：商用不動產曝險、合併整合失敗、社區銀行的存款成本壓力。研究線索，不是投資建議。", "en": "Burke & Herbert Financial is a long-established Virginia community bank that closed its merger with LINKBANCORP on May 1, creating a roughly $11 billion-asset holding company with over 100 branches. The neglect is twofold: small regional banks draw little coverage, and merger-quarter accounting muddied the numbers — Q2 GAAP EPS was just $0.50 (versus $1.79 the prior quarter) while adjusted operating net income was $37.5 million and adjusted EPS $2.03. Meanwhile insiders bought 12,300 shares worth about $774,450 over three months, net buying of roughly $933,000 over twelve, including director Julian Barnwell's ~5,000 shares at about $62.76 on June 3. Risks: commercial real estate exposure, integration failure, deposit-cost pressure. Research lead, not investment advice.", "ja": "Burke & Herbert Financialはバージニア州の老舗コミュニティバンク。5月1日にLINKBANCORPとの合併を完了し、資産約110億ドル・100超の支店を持つ持株会社となった。無視される理由は二重だ。小型地銀は元々カバーが薄く、合併四半期の会計ノイズが数字を歪めている——Q2のGAAP EPSはわずか0.50ドル（前四半期1.79ドル）だが、調整後営業純利益は3,750万ドル、調整後EPSは2.03ドル。同時にインサイダーは3カ月で12,300株・約77.4万ドルを購入、12カ月では約93.3万ドルの買い越し。リスクは商業用不動産エクスポージャー、統合失敗、預金コスト圧力。投資助言ではなく研究の手がかりです。", "url": "https://www.stocktitan.net/news/BHRB/burke-herbert-financial-services-corp-announces-second-quarter-2026-xcwaznl6owwy.html"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月 Q3 財報（看營收增速能否延續）", "stocks": [{"t": "MPB", "n": "賓州社區銀行，Q2 EPS 0.87 超預期 0.06、營收年增 39.6%"}], "zh": "Mid Penn Bancorp 是賓州的社區銀行，市值小、幾乎沒有大型券商追蹤，是典型的「雙重忽視」標的。7 月 23 日公布的 Q2 財報相當硬：每股盈餘 0.87 美元、超出市場預期的 0.81 美元，營收 7,587 萬美元也高於預期的 7,328 萬，年增 39.6%。搭配的訊號有兩個——公司在 4 月 21 日董事會通過把庫藏股計畫再加碼 5,000 萬美元、效期到 2027 年 4 月底；同時內部人過去三個月出現 7 筆買進。要留意的是：營收年增 39.6% 有相當部分來自併購帶來的規模擴張，不等於有機成長，Q1 每股盈餘 0.36 美元其實還低於去年同期的 0.71 美元。風險是整合成本、區域經濟與商用不動產曝險。研究線索，不是投資建議。", "en": "Mid Penn Bancorp is a Pennsylvania community bank — small cap, almost no major-broker coverage, a textbook doubly-neglected name. Its July 23 Q2 print was solid: EPS of $0.87 versus $0.81 consensus, revenue of $75.87 million against $73.28 million expected, up 39.6% year over year. Two corroborating signals: the board reauthorized and expanded the buyback by another $50 million on April 21, running through April 2027, and insiders logged seven purchases over the past three months. Caveat: much of that 39.6% revenue growth reflects acquisition-driven scale rather than organic growth, and Q1 EPS of $0.36 was actually below the prior-year $0.71. Risks: integration costs, regional economy, CRE exposure. Research lead, not investment advice.", "ja": "Mid Penn Bancorpはペンシルベニア州のコミュニティバンク。小型で大手証券のカバーもほぼなく、典型的な「二重に無視された」銘柄だ。7月23日発表のQ2決算は堅調で、EPS 0.87ドル（予想0.81ドル）、売上7,587万ドル（予想7,328万ドル）で前年比39.6%増。補強材料は2つ——4月21日に取締役会が自社株買い枠を5,000万ドル追加（2027年4月末まで）、直近3カ月でインサイダーの買いが7件。留意点として、39.6%の増収の相当部分は買収による規模拡大でオーガニック成長ではなく、Q1のEPS 0.36ドルは前年同期0.71ドルを下回っていた。投資助言ではなく研究の手がかりです。", "url": "https://www.gurufocus.com/news/8974123/mid-penn-bancorp-mpb-reports-strong-q2-earnings-with-3959-revenue-growth"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 08 月初 Q2 財報", "stocks": [{"t": "ERII", "n": "雷達池主角，股價約 8.6 美元，52 週區間 7.83–18.32"}], "zh": "Energy Recovery 做的是海水淡化廠裡的 PX 壓力交換器——把高壓海水的能量回收再利用，是海淡廠省電的核心設備，同時正在拓展工業廢水與 CO2 冷凍兩個新市場。它被忽視的原因是市值小、產業利基、專案型營收難以建模，目前僅約 1 位分析師給出目標價。近期兩則進展：7 月 20 日確認供應 PX 裝置給沙烏地大型海淡專案；7 月 13 日延攬前 TE Connectivity 感測器事業總經理 John Mitchell 進入董事會。反差在於股價約 8.6 美元、貼近 52 週低點 7.83，而 52 週高點是 18.32——市場顯然還沒把新訂單算進去。風險：專案型營收波動大、新市場放量未驗證、中東地緣直接影響案源。研究線索，不是投資建議。", "en": "Energy Recovery makes the PX Pressure Exchanger used in desalination plants — it recycles the energy in high-pressure seawater and is the core efficiency device in a desal train — and is pushing into industrial wastewater and CO2 refrigeration. It's ignored because of its small cap, niche end market, and lumpy project revenue that is hard to model; roughly one analyst publishes a target. Two recent developments: on July 20 it confirmed supplying PX devices to a large Saudi desalination project, and on July 13 it added John Mitchell, formerly SVP and GM of TE Connectivity's Sensor Solutions business, to its board. The contrast: the stock trades near $8.62 against a 52-week range of $7.83 to $18.32. Risks: lumpy project revenue, unproven ramp in new markets, Middle East geopolitics affecting the order pipeline. Research lead, not investment advice.", "ja": "Energy Recoveryは海水淡水化プラント向けPX圧力交換器を製造する。高圧海水のエネルギーを回収再利用する省エネの中核装置で、現在は産業排水とCO2冷凍という新市場も開拓中。無視される理由は小型株・ニッチ市場・プロジェクト型売上のモデル化の難しさで、目標株価を出すアナリストは約1名。直近の進展は2つ——7月20日にサウジの大型淡水化案件へのPX供給を確認、7月13日に元TE Connectivityセンサー事業責任者のJohn Mitchell氏が取締役に就任。株価は約8.62ドルで52週レンジ7.83〜18.32ドルの下限付近。投資助言ではなく研究の手がかりです。", "url": "https://simplywall.st/stocks/us/capital-goods/nasdaq-erii/energy-recovery"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "金融與 REIT", "color": "#6DB56D", "stocks": [{"t": "CSR", "n": "中西部公寓 REIT，過去一年 5 買 0 賣"}, {"t": "ISTR", "n": "路易斯安那社區銀行，7 月內部人買進名單常客"}, {"t": "UMH", "n": "移動屋社區 REIT，1–3 月內部人持續買進"}], "zh": "7 月的內部人買盤明顯集中在兩個板塊：小型金融與 REIT。Centerspace 是專做中西部公寓的 REIT，過去一年內部人 5 次買進、0 次賣出，董事 Rodney Jones-Tyson 6 月 22 日再買 1,700 股，另有 Land & Buildings 這檔積極型基金持續加碼；UMH Properties 的內部人在 1 到 3 月持續買進；Investar Holding 也出現在多份 7 月內部人買進清單上。這個群聚不是巧合——利率下行預期消退後，REIT 與區域銀行的股價被壓在低位，而最了解資產帳面的人正在買。", "en": "July insider buying clustered in two places: small financials and REITs. Centerspace, a Midwest-focused apartment REIT, has logged five insider buys and zero sells over the past year, with director Rodney Jones-Tyson adding 1,700 shares on June 22, alongside continued accumulation by activist fund Land & Buildings. UMH Properties saw insider purchases from January through March. Investar Holding appears on multiple July insider-buying screens. The cluster isn't coincidence — as rate-cut hopes faded, REIT and regional bank prices were pushed down, and the people who best understand the asset marks are buying.", "ja": "7月のインサイダー買いは小型金融とREITの2分野に集中した。中西部のアパートメントREITであるCenterspaceは過去1年でインサイダー買い5件・売り0件、6月22日には取締役Rodney Jones-Tyson氏が1,700株を追加購入、アクティビストファンドLand & Buildingsも積み増しを継続。UMH Propertiesは1〜3月にインサイダー買いが継続、Investar Holdingも7月の複数のスクリーンに登場。利下げ期待の後退でREITと地銀の株価が押し下げられる中、資産の実態を最もよく知る人々が買っている。", "url": "https://simplywall.st/stocks/us/real-estate/nyse-csr/centerspace/news/undervalued-small-caps-with-insider-buying-in-july-2026"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "判讀提醒", "color": "#6DB56D", "stocks": [{"t": "ADV", "n": "雷達池，CEO 一年 18 買 0 賣、淨買超約 40 萬美元"}, {"t": "GLOO", "n": "雷達池，內部人一年淨買超約 500 萬美元，但同時增發 700 萬股"}], "zh": "雷達池裡兩檔靠內部人訊號進場的股票，正好示範了這個指標的極限。Advantage Solutions 的執行長 David Peacock 過去一年 18 次買進、0 次賣出，全體內部人同樣 18 買 0 賣，累計淨買超約 40 萬美元——訊號很乾淨，但公司負債沉重、產業毛利薄，股價仍在 1 美元多的微型股區間。Gloo Holdings 的內部人一年淨買超約 500 萬美元，公司卻在 7 月宣布增發 700 萬股稀釋股東。這就是重點：內部人買進代表「他們認為便宜」，不代表「資產負債表安全」或「不會被稀釋」。它是研究的起點，不是結論。", "en": "Two radar-pool names that entered on insider signals show exactly where that indicator stops working. At Advantage Solutions, CEO David Peacock has made 18 purchases and zero sales over the past year — all insiders combined show the same 18-and-zero pattern, for about $400,000 in net buying. Clean signal, but the company carries heavy debt in a thin-margin industry and the stock still sits in low-single-digit micro-cap territory. Gloo Holdings shows about $5 million in net insider buying over twelve months, yet announced a 7 million share offering in July that dilutes holders. The point: insider buying says they think it's cheap. It does not say the balance sheet is safe or that you won't be diluted. It's where research starts, not where it ends.", "ja": "レーダープール内でインサイダーシグナルを根拠に入れた2銘柄が、この指標の限界を示している。Advantage SolutionsではCEOのDavid Peacock氏が過去1年で18回購入・売却ゼロ、インサイダー全体でも18買い0売り、純買い越し約40万ドル。シグナルは明快だが、同社は重い負債と薄利の業界を抱え、株価は1ドル台の超小型株のままだ。Gloo Holdingsは12カ月で約500万ドルの純買い越しがある一方、7月に700万株の増資を発表し希薄化を招いた。インサイダー買いは「彼らが割安と考えている」ことを示すだけで、財務の安全性や希薄化の不在を保証しない。", "url": "https://finance.yahoo.com/news/insider-buying-ceo-david-peacock-061128797.html"},

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  const speakWord = React.useCallback(async (word) => {
    const ok = await azureSpeak(word, { rate:'-15%' });
    if (!ok) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US"; u.rate = 0.82;
      const voices = speechSynthesis.getVoices();
      const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
      if (picked) u.voice = picked;
      speechSynthesis.speak(u);
    }
  }, []);

  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      return;
    }
    setSpeaking(true);
    const ok = await azureSpeak(card.en, {
      rate: '-5%',
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
    if (!ok) {
      const u = new SpeechSynthesisUtterance(card.en);
      u.lang = "en-US"; u.rate = 0.88; u.pitch = 1.0; u.volume = 1.0;
      const tryVoices = () => {
        const voices = speechSynthesis.getVoices();
        const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
        if (picked) u.voice = picked;
      };
      if (speechSynthesis.getVoices().length > 0) tryVoices();
      else { speechSynthesis.onvoiceschanged = () => { tryVoices(); speechSynthesis.onvoiceschanged = null; }; }
      u.onend = () => setSpeaking(false);
      u.onerror = () => setSpeaking(false);
      speechSynthesis.speak(u);
    }
  }, [card.en, speaking]);

  // Stop speaking & close popup when card changes
  React.useEffect(() => {
    return () => {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀全文"} style={{ marginLeft:"auto" }}>{speaking ? "■" : "🔊"}</button>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          {lang === "ja"
            ? <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"15px", lineHeight:1.9, color:"var(--text-secondary)", margin:0, maxWidth:"46ch", fontWeight:300 }}>{card.ja || card.en}</p>
            : <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>}
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("ja"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="ja" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="ja" ? "close ↑" : "日本語 ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function SettingsPanel({ open, onClose }) {
  const [key, setKey] = React.useState(() => localStorage.getItem('mf_azureKey') || '');
  const [region, setRegion] = React.useState(() => localStorage.getItem('mf_azureRegion') || 'eastus');
  const [voice, setVoice] = React.useState(() => localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural');
  const [status, setStatus] = React.useState('');
  const save = () => {
    localStorage.setItem('mf_azureKey', key);
    localStorage.setItem('mf_azureRegion', region);
    localStorage.setItem('mf_azureVoice', voice);
    _azToken = null;
  };
  const handleSave = () => { save(); setStatus('已儲存'); setTimeout(() => setStatus(''), 2000); };
  const handleTest = async () => {
    save(); setStatus('測試中…');
    const ok = await azureSpeak('Hello, this is Azure Neural voice for Mo\'s Feed.', {
      onEnd: () => setStatus('✓ 連線成功'),
      onError: (e) => setStatus('✗ ' + (e?.message || '失敗'))
    });
    if (!ok) setStatus('✗ 請先填入 Azure Key');
  };
  if (!open) return null;
  return ReactDOM.createPortal(
    <>
      <div style={{ position:'fixed',inset:0,zIndex:149 }} onClick={onClose} />
      <div style={{ position:'fixed',top:0,right:0,bottom:0,width:'252px',background:'var(--bg-elevated)',borderLeft:'1px solid var(--divider)',zIndex:150,padding:'20px 18px',display:'flex',flexDirection:'column',gap:'14px',overflowY:'auto' }}>
        <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'4px' }}>
          <span style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.18em',textTransform:'uppercase',color:'var(--text-tertiary)' }}>Azure TTS 設定</span>
          <button onClick={onClose} style={{ background:'none',border:'none',cursor:'pointer',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'12px',padding:'0' }}>✕</button>
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Subscription Key</div>
          <input type="password" className="az-input" value={key} onChange={e=>setKey(e.target.value)} placeholder="貼上 Azure Key…" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Region</div>
          <input className="az-input" value={region} onChange={e=>setRegion(e.target.value)} placeholder="eastus" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Voice</div>
          <select className="az-input" value={voice} onChange={e=>setVoice(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="en-US-AriaNeural">Aria（女）自然流暢</option>
            <option value="en-US-JennyNeural">Jenny（女）清晰</option>
            <option value="en-US-GuyNeural">Guy（男）沉穩</option>
            <option value="en-US-DavisNeural">Davis（男）個性</option>
            <option value="en-US-TonyNeural">Tony（男）自信</option>
          </select>
        </div>
        <div style={{ display:'flex',gap:'8px' }}>
          <button onClick={handleSave} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--divider)',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>儲存</button>
          <button onClick={handleTest} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--text-secondary)',color:'var(--text-secondary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>測試</button>
        </div>
        {status && <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',color:'var(--text-tertiary)',letterSpacing:'0.1em' }}>{status}</div>}
        <div style={{ marginTop:'auto',fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.7,paddingTop:'8px',borderTop:'1px solid var(--divider)' }}>Key 存於 localStorage<br/>未設定時退回瀏覽器 TTS</div>
      </div>
    </>,
    document.body
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;

  const [resumeMsg, setResumeMsg] = useState(null);
  const lsKey = "mosfeed_Today_" + todaySub;

  // Read localStorage on tab/sub change
  React.useEffect(() => {
    const key = "mosfeed_Today_" + todaySub;
    try {
      const saved = parseInt(localStorage.getItem(key), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") go(idx + 1);
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(idx - 1);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 07/26/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v4.5</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
      >
        {atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} />
          </div>
        )}
      </div>

      {/* Nav bar */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => go(idx - 1)} disabled={idx === 0}>←</button>
        <span className="nav-count">{atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn" onClick={() => go(idx + 1)} disabled={atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
