<script>
/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;
    --text-tertiary: #6b6863; --divider: #ddd9d1;
    --noise-opacity: 0.035;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  /* 鍵盤焦點:看得到目前在哪一顆 */
  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }
  .tab-nav button { background: none; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: Georgia, serif; transition: all 0.3s ease; padding: 0; line-height: 1.2; }
  .sub-pill { background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 0 4px; min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; white-space: nowrap; transition: all 0.2s ease; border-bottom: 1px solid transparent; }
  .swipe-area { position: relative; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .card-slide { position: absolute; inset: 0; padding: 16px 32px 96px; display: flex; flex-direction: column; justify-content: flex-start; transition: transform 0.3s ease, opacity 0.3s ease; will-change: transform, opacity; overflow-y: auto; }
  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }
  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }
  .source-link { position: relative; display: inline-block; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }
  .source-link:hover { color: var(--text-secondary); border-color: var(--text-secondary); }
  .end-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; height: 100%; }
  .end-btn { padding: 12px 24px; min-height: 44px; background: none; border: 1px solid var(--divider); color: var(--text-tertiary); font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: all 0.25s ease; }
  .end-btn:hover { border-color: var(--text-secondary); color: var(--text-secondary); }
  .progress-bar { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.14em; color: var(--text-tertiary); text-transform: uppercase; }
  .theme-toggle { position: fixed; top: 12px; z-index: 100; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; font-size: 17px; color: var(--text-tertiary); padding: 0; line-height: 1; transition: color 0.3s ease; font-family: 'Courier New', monospace; }
  .theme-toggle:hover { color: var(--text-secondary); }
  .icon-btn { background: none; border: none; cursor: pointer; color: var(--text-tertiary); min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; }
  .rule { height: 1px; background: var(--divider); }
  .running-header { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-tertiary); }
  .word-popup { position: fixed; z-index: 200; background: var(--bg-elevated); border: 1px solid var(--divider); border-radius: 8px; padding: 12px 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); min-width: 120px; max-width: 260px; }
  .word-popup-word { font-family: Georgia, serif; font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }

  .speak-btn { background: none; border: none; cursor: pointer; font-size: 15px; color: var(--text-tertiary); padding: 0; min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; transition: color 0.2s; line-height: 1; }

  .clickable-word:hover { background: var(--bg-elevated); }
  [data-theme="dark"] .word-popup { box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .az-input { width:100%; background:var(--bg); border:1px solid var(--divider); color:var(--text); padding:9px 10px; font-family:'Courier New',monospace; font-size:12px; outline:none; -webkit-appearance:none; appearance:none; border-radius:0; }
  .az-input:focus { border-color:var(--text-secondary); }
  .az-input:focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 1px; }
  .nav-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; gap:4px; padding:8px 12px 12px; background:var(--bg); border-top:1px solid var(--divider); z-index:50; }
  .nav-btn { background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:16px; cursor:pointer; padding:10px 18px; min-height:44px; min-width:40px; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; line-height:1; }
  .nav-btn-icon { padding:10px 14px; font-size:14px; }
  .nav-btn-icon.playing { border-color:var(--text); color:var(--text); }
  .nav-btn-lang { padding:10px 11px; font-size:12px; letter-spacing:0.06em; color:var(--text-secondary); min-width:40px; }
  .nav-btn-lang:hover { color:var(--text); }
  @media (max-width: 420px) { .nav-btn { padding:10px 11px; } .nav-btn-icon { padding:10px 10px; } .nav-btn-lang { padding:10px 8px; min-width:38px; } }
  .nav-btn:hover { border-color:var(--text-secondary); color:var(--text); }
  .nav-btn:active { background:var(--bg-elevated); }
  .nav-btn:disabled { opacity:0.3; cursor:default; border-color:var(--divider); color:var(--text-tertiary); }
  .nav-count { font-family:'Courier New',monospace; font-size:11px; letter-spacing:0.1em; color:var(--text-tertiary); text-transform:uppercase; white-space:nowrap; }
  .sub-row { scrollbar-width: none; }
  .sub-row::-webkit-scrollbar { display: none; }
  .date-chip { flex-shrink:0; background:none; border:1px solid var(--divider); color:var(--text-tertiary); font-family:'Courier New',monospace; font-size:11px; letter-spacing:0.08em; padding:0 12px; min-height:38px; cursor:pointer; white-space:nowrap; }
  .date-chip.on { color:var(--text); border-color:var(--text-secondary); }
  .date-chip:hover { color:var(--text-secondary); }
  .copy-btn { flex-shrink:0; background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:11px; letter-spacing:0.08em; padding:0 12px; min-height:40px; min-width:40px; cursor:pointer; white-space:nowrap; }
  .copy-btn:hover { color:var(--text); border-color:var(--text-secondary); }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .empty-note { font-family: system-ui, -apple-system, 'PingFang TC', sans-serif; font-size: 15px; line-height: 1.9; color: var(--text-secondary); padding: 24px 0; max-width: 32ch; }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
</style>

  {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "油價與波動", "color": "#E05C5C", "zh": "油價是週一反彈的另一個推手：布蘭特原油下跌 5.5% 至 92.91 美元（月初高於 112 美元），WTI 下跌 4.14% 至 87.07 美元，起因是川普對 CNN 說，若談判有進展「很不可能」恢復對伊朗的攻擊。天然氣反向上漲 7.34% 至 3.218 美元，黃金小漲 0.11% 至 4,138.65 美元，銅上漲 2.2%。恐慌指數 VIX 從 25.64 降到 20.02（-21.92%），美元指數下跌 0.61% 至 101.67。", "en": "Oil was the other driver of Monday's rebound: Brent fell 5.5% to $92.91 (it was above $112 at the start of the month) and WTI fell 4.14% to $87.07 after Trump told CNN that resuming strikes on Iran is highly unlikely if negotiations progress. Natural gas moved the other way, up 7.34% to $3.218, gold edged up 0.11% to $4,138.65 and copper rose 2.2%. The VIX dropped from 25.64 to 20.02 (-21.92%) and the dollar index fell 0.61% to 101.67.", "url": "https://journalarta.com/en/2026/11/09/oil-price-today-brent-falls-4-96-to-93-44-on-iran-peace-hopes-as-gold-climbs/", "stocks": [{"t": "USO", "n": "美國原油 ETF，油價單日下跌約 4% 到 5%"}, {"t": "GLD", "n": "黃金 ETF，金價 +0.11% 至 4,138.65 美元"}, {"t": "UNG", "n": "天然氣 ETF，天然氣 +7.34%"}, {"t": "VIXY", "n": "VIX 短期期貨 ETF，VIX 單日 -21.92%"}, {"t": "CPER", "n": "銅 ETF，銅價 +2.2%"}]},
  {"id": "earn_0", "channel": "財報速報", "tag": "Take-Two 盤後", "color": "#E8786A", "zh": "Take-Two（TTWO）週一盤後公布 2027 財年第二季：淨預訂額 16.0 億美元，年減 18%，略低於公司先前給的 16.2 億到 16.7 億美元區間；經常性消費者支出年減 9%、占預訂額 81%。公司重申 2027 財年淨預訂額 80 億到 82 億美元，執行長說《俠盜獵車手 VI》再十天（11/19）上市、預購達到前所未有的水準。市場預期值為每股 0.96 美元左右；盤後股價反應與實際每股盈餘我這次沒查到，請以新聞稿為準。", "en": "Take-Two (TTWO) reported fiscal Q2 2027 after Monday's close: net bookings were $1.60 billion, down 18% year over year and slightly below the company's own $1.62 billion to $1.67 billion range; recurrent consumer spending fell 9% and made up 81% of bookings. It reiterated fiscal 2027 net bookings of $8.0 billion to $8.2 billion, and the CEO said Grand Theft Auto VI launches in ten days (Nov 19) with pre-orders at unprecedented levels. Consensus EPS was about $0.96; I could not find the after-hours reaction or actual EPS, so check the release.", "url": "https://www.sec.gov/Archives/edgar/data/0000946581/000162828026072175/ttwo2q27earningsrelease.htm", "stocks": [{"t": "TTWO", "n": "淨預訂額 16.0 億美元（-18%），全年 80 億到 82 億美元指引不變"}, {"t": "EA", "n": "同為大型遊戲發行商，GTA VI 11/19 上市是產業共同變數"}]},
  {"id": "earn_1", "channel": "財報速報", "tag": "Constellation", "color": "#E8786A", "zh": "Constellation Energy（CEG）週一盤前公布第三季，AP 報導利潤與營收都優於分析師預期，股價當天上漲 0.8%；市場預期值約為每股 3.90 美元、營收 92.3 億美元，確切的實際數字我這次沒查到。它是核電與天然氣發電大戶，受惠於替大型科技公司的資料中心供電的合約；8 月第二季財報時，公司把全年調整後每股盈餘指引上調到 11.50 到 12.50 美元。同日的疑慮來自政策面：選舉後市場擔心資料中心擴建放緩（見產業風向）。", "en": "Constellation Energy (CEG) reported Q3 before Monday's open; AP said profit and revenue beat analyst expectations and the stock rose 0.8%. Consensus was roughly $3.90 EPS and $9.23 billion revenue, and I could not find the actual figures. It is a large nuclear and gas generator that benefits from deals to power big-tech data centers; at Q2 in August it raised full-year adjusted EPS guidance to $11.50 to $12.50. The overhang is political: after the election, investors worry data-center build-outs could slow (see Sector).", "url": "https://www.dailyrecordnews.com/ap_news/business/us-stocks-rally-as-crude-oil-prices-drop-even-as-nvidia-sinks/article_3e3c530a-b57a-5f0b-b091-0c93626a3ba1.html", "stocks": [{"t": "CEG", "n": "第三季優於預期（AP），週一 +0.8%"}, {"t": "VST", "n": "同為獨立發電商，與資料中心用電題材連動"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "Trade Desk 待揭曉", "color": "#E8786A", "zh": "The Trade Desk（TTD）預定週一盤後公布第三季，我這次查不到實際結果。背景：公司 8 月給的第三季營收指引是至少 6.5 億美元，等於年減約 12%，第二季財報後股價盤後曾重挫約 24% 到 13.39 美元；週一盤中它已是那斯達克漲幅榜第一，上漲 14.58% 收 14.815 美元，代表財報前已有一波預先反彈。市場預期每股約 0.26 美元。觀察點：實際營收離 6.5 億美元底線多遠，以及第四季指引。", "en": "The Trade Desk (TTD) was due to report Q3 after Monday's close and I could not find the actual results. Background: in August it guided Q3 revenue to at least $650 million, about a 12% year-over-year decline, and the stock fell roughly 24% after hours to $13.39 following Q2. On Monday it was the top Nasdaq gainer, up 14.58% to $14.815, so some bounce was already in before the print. Consensus EPS was about $0.26. What to watch: how far revenue lands from the $650 million floor, and the Q4 guidance.", "url": "https://ppc.land/trade-desk-stock-drops-24-as-q3-guidance-points-to-12-revenue-decline/", "stocks": [{"t": "TTD", "n": "週一 +14.58% 收 14.815 美元，Q3 營收指引底線 6.5 億美元"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "10 月就業", "color": "#7C6AF7", "zh": "10 月非農就業增加 16.5 萬人，失業率降到 4.1%，平均時薪月增 0.4%、年增 3.1%。就業與薪資同時偏強，讓聯準會短期內更沒有理由轉鬆，市場因此把焦點放在週二（11/10）的 10 月 CPI。要注意：這是一份月報，單月數字常被修正，不宜單看一個月下結論。", "en": "October nonfarm payrolls rose 165,000, the unemployment rate edged down to 4.1% and average hourly earnings rose 0.4% on the month and 3.1% on the year. Strong hiring and wages together give the Fed little reason to ease soon, which is why attention is on Tuesday's (Nov 10) October CPI. Keep in mind this is a monthly report that is often revised, so one month should not drive a conclusion.", "url": "https://journalarta.com/en/2026/11/09/stock-market-sp-500-futures-october-jobs-fed-november-9-2026/", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，對利率預期最敏感"}, {"t": "IEF", "n": "7 到 10 年期公債 ETF，十年期殖利率約 4.86%"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "12 月升息路徑", "color": "#7C6AF7", "zh": "聯準會 9 月以 12 比 0 一致決議升息一碼（2023 年以來第一次），10 月會議維持利率不變，但市場仍預期 12 月（12/8 到 12/9）再升一碼；本晨報週五引用的 CME FedWatch 12 月升息機率是 76.8%，今天我沒有查到更新數字。十年期殖利率週一約 4.86%，比上個月衝破 5.30%（二十年高點）已回落不少；週一鮑曼、古爾斯比、巴爾金三位官員發言，內容我沒查到。", "en": "The Fed raised rates a quarter point in September on a 12-0 vote (the first hike since 2023) and held in October, but markets still expect another quarter-point hike at the December 8-9 meeting; the CME FedWatch probability cited in Friday's brief was 76.8%, and I could not find an updated figure today. The 10-year yield was about 4.86% on Monday, well off last month's move above 5.30%, a two-decade high; Fed officials Bowman, Goolsbee and Barkin spoke Monday but I could not find what they said.", "url": "https://portfolio-adviser.com/warsh-sticks-to-the-script-as-fed-holds-rates-but-december-hike-highly-likely/", "stocks": [{"t": "XLF", "n": "金融類股 ETF，對殖利率曲線與利率路徑敏感"}, {"t": "KRE", "n": "區域銀行 ETF，對利率與信用循環更敏感"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "關稅休兵", "color": "#7C6AF7", "zh": "中國宣布延長暫停對美國商品加徵的 24% 關稅，並從 11/10 起維持 10% 的稅率，讓貿易休兵延續到 APEC 之前。週一全球股市同步走高：日經 225 上漲 2.33% 收 58,775.5，德國 DAX 上漲 1.73%，歐洲 STOXX 50 上漲 1.94%，美元指數下跌 0.61%。休兵只是延長，不是協議；關稅是否回頭，仍要看 APEC 前後的談判。", "en": "China extended the suspension of its 24% tariffs on US goods and will keep a 10% levy from Nov 10, prolonging the trade truce ahead of APEC. Global stocks rose together on Monday: the Nikkei 225 gained 2.33% to 58,775.5, Germany's DAX 1.73%, the Euro STOXX 50 1.94%, while the dollar index fell 0.61%. An extended truce is not a deal; whether tariffs return depends on talks around APEC.", "url": "https://investinglive.com/stocks/", "stocks": [{"t": "FXI", "n": "中國大型股 ETF，受中美關稅休兵影響"}, {"t": "EWJ", "n": "日本 ETF，日經 225 週一 +2.33%"}, {"t": "SOXX", "n": "費城半導體 ETF，對中美貿易條件敏感"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "AI 硬體反彈", "color": "#4EABA4", "zh": "週一科技類股領漲，尤其是半導體與 AI 基礎設施：超微 +9.22%、Arista +8.87%。但裡面的壓力沒有消失：高盛的「AI 記憶體」籃子比 6 月高點已腰斬 51%；摩根大通認為有長約與預付款，未來六個月內獲利不會被下修；摩根士丹利則說逢低買進 AI，預估超大規模業者的支出到 2028 年累計 3.4 兆美元。這三個說法互相拉扯，所以今天的漲幅更像是對上週超跌的修正。", "en": "Technology led on Monday, especially semiconductors and AI infrastructure: AMD +9.22% and Arista +8.87%. The stress has not gone away: Goldman's AI memory basket is down 51% from its June peak; JPMorgan sees no earnings cuts for six months thanks to long-term deals and prepayments; and Morgan Stanley says buy the AI dip, forecasting $3.4 trillion of hyperscaler spending through 2028. Those views pull against each other, so Monday looks more like a correction of last week's oversold move.", "url": "https://investinglive.com/stocks/", "stocks": [{"t": "SMH", "n": "半導體 ETF，AI 硬體反彈的代表"}, {"t": "AMD", "n": "週一 +9.22%，上週曾大跌約 11%"}, {"t": "ANET", "n": "AI 網路設備，+8.87%"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "能源退燒", "color": "#4EABA4", "zh": "能源是週一少數明顯落後的板塊：布蘭特原油從月初高於 112 美元回落到 92.91 美元，單日下跌 5.5%，原因是美伊停火談判的預期。能源股的難處是：油價下跌讓通膨壓力降溫（對債市與成長股有利），卻直接壓縮探勘生產商的獲利。天然氣走勢不同，上漲 7.34% 至 3.218 美元。西方石油（OXY）11/9 也列在財報名單上，但我沒查到結果。", "en": "Energy was one of the few clear laggards on Monday: Brent has slid from above $112 at the start of the month to $92.91, down 5.5% on the day, on expectations of US-Iran ceasefire talks. The catch is that falling oil cools inflation pressure (good for bonds and growth stocks) but directly squeezes producers' earnings. Natural gas diverged, up 7.34% to $3.218. Occidental (OXY) was also on Monday's earnings list, but I could not find its results.", "url": "https://journalarta.com/en/2026/11/09/oil-price-today-brent-falls-4-96-to-93-44-on-iran-peace-hopes-as-gold-climbs/", "stocks": [{"t": "XLE", "n": "能源類股 ETF，週一主要落後板塊"}, {"t": "XOP", "n": "油氣探勘生產 ETF，對油價最敏感"}, {"t": "OXY", "n": "11/9 列在財報名單，結果我沒查到"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "資料中心政策", "color": "#4EABA4", "zh": "期中選舉後，民主黨橫掃州議會，AP 說投資人擔心這會拖慢 AI 資料中心的興建：選民把電費上漲怪到資料中心，政府未來可能限制，這會減少晶片、電力與相關服務的需求。報導沒有指出具體的法案或規範，所以這是風險情境，不是已發生的事。週一電力設備商 GE Vernova 上漲 6.47% 收 824.18 美元；CoreWeave 僅下跌 0.3%，但上週已跌 15.4%。", "en": "After the midterms, Democrats swept statehouses, and AP said investors fear that could slow AI data-center construction: voters blame data centers for higher power bills and governments could impose restrictions, cutting demand for chips, electricity and related services. The report names no specific bill or rule, so this is a risk scenario, not something that has happened. On Monday GE Vernova rose 6.47% to $824.18; CoreWeave fell just 0.3% after dropping 15.4% last week.", "url": "https://www.dailyrecordnews.com/ap_news/business/us-stocks-rally-as-crude-oil-prices-drop-even-as-nvidia-sinks/article_3e3c530a-b57a-5f0b-b091-0c93626a3ba1.html", "stocks": [{"t": "GEV", "n": "電力設備，週一 +6.47% 收 824.18 美元"}, {"t": "CEG", "n": "核電與天然氣發電，資料中心供電合約受惠"}, {"t": "VST", "n": "獨立發電商，同屬資料中心用電題材"}, {"t": "CRWV", "n": "AI 雲端算力，上週 -15.4%、週一 -0.3%"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000", "color": "#5B8ED6", "zh": "羅素 2000 週一上漲 3.15% 收 2,840.85，漲幅超過標普 500（+2.35%）與那斯達克（+2.74%）。週五它收在 2,753.65，所以一天補回了上週五之前的一大段跌幅。小型股的 beta 高，在 VIX 從 25.64 降到 20.02、油價下跌、殖利率回落的日子漲得最兇；反過來說，利率或通膨一旦不如預期，它也是跌得最快的一群。", "en": "The Russell 2000 rose 3.15% on Monday to 2,840.85, outpacing the S&P 500 (+2.35%) and the Nasdaq (+2.74%). It closed Friday at 2,753.65, so it recovered a good chunk of the earlier losses in one day. Small caps have high beta and rally hardest when the VIX falls (25.64 to 20.02), oil drops and yields ease; the flip side is that they are also the first to fall if rates or inflation disappoint.", "url": "https://journalarta.com/en/2026/11/10/stock-market-today-sp-500-surges-2-35-to-7549-94-and-nasdaq-jumps-2-74-as-oil-falls-and-vix-drops/", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週一 +3.15% 收 2,840.85"}, {"t": "IJR", "n": "標普小型股 600 ETF，成分篩選含獲利條件，波動通常較小"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "太空股財報", "color": "#5B8ED6", "zh": "11/9 的財報名單裡有一批太空與航太小型股：Rocket Lab（RKLB）、AST SpaceMobile（ASTS）、Archer Aviation（ACHR）都在列，我這次沒查到實際結果。Rocket Lab 的預覽稿說，Neutron 火箭首飛目標已改到 2026 年第四季，市場期待值已大幅下調，所以重點不只是營收，而是首飛時程與毛利率指引。這類公司股價主要由未來預期定價，財報後單日漲跌十個百分點以上並不少見。", "en": "Monday's earnings list included a group of space and aerospace small caps: Rocket Lab (RKLB), AST SpaceMobile (ASTS) and Archer Aviation (ACHR), and I could not find actual results. A Rocket Lab preview says the first Neutron launch is now targeted for Q4 2026 and expectations have reset sharply lower, so the focus is not just revenue but the launch timeline and margin guidance. These stocks are priced on future expectations, and moves of ten percentage points or more in a day after earnings are not unusual.", "url": "https://pro.thestreet.com/earnings/2026-11-09", "stocks": [{"t": "RKLB", "n": "11/9 財報，Neutron 首飛目標 2026 年第四季"}, {"t": "ASTS", "n": "11/9 財報，衛星直連手機服務"}, {"t": "ACHR", "n": "11/9 財報，電動垂直起降飛行器"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "利率敏感度", "color": "#5B8ED6", "zh": "判讀知識：小型股對利率比大型股敏感，原因是它們較依賴銀行與浮動利率借款，現金流也比較少，所以十年期殖利率從 5.30% 以上回到約 4.86%，對羅素 2000 的幫助通常比對標普 500 更直接。這也是為什麼今天的 CPI 對小型股特別重要：預期是整體 3.9%、核心 2.8%（年增），數字高於預期時，利率下降的敘事會被打斷，小型股的回吐也會比大型股大。", "en": "Reading note: small caps are more rate-sensitive than large caps because they lean more on bank and floating-rate debt and have thinner cash flow, so the 10-year yield moving from above 5.30% back to about 4.86% usually helps the Russell 2000 more directly than the S&P 500. That is why today's CPI matters so much for small caps: the forecast is 3.9% headline and 2.8% core year over year, and a hotter print would interrupt the falling-rate story and hit small caps harder than large ones.", "url": "https://journalarta.com/en/2026/11/09/stock-market-sp-500-futures-october-jobs-fed-november-9-2026/", "stocks": [{"t": "VB", "n": "先鋒小型股 ETF，成分比羅素 2000 偏向較大的小型股"}, {"t": "IWO", "n": "羅素 2000 成長股 ETF，對利率最敏感"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "大漲後的流動性", "color": "#5B8ED6", "zh": "判讀知識：指數單日大漲 3% 之後，小型股要小心流動性。成交量小的個股買賣價差會變大，追價容易買在當天高點；ETF 雖然可以買賣，但它的淨值與市價也可能在急漲急跌時短暫偏離。比較穩的看法是看一週以上的趨勢，而不是用單日漲幅判斷一檔小型股是否「轉強」。", "en": "Reading note: after a 3% one-day index surge, small caps call for care about liquidity. Thinly traded names see wider bid-ask spreads, and chasing can mean buying the day's high; ETFs trade freely but their price can briefly deviate from net asset value in fast moves. A steadier approach is to judge a trend over a week or more rather than a single day's gain.", "url": "https://journalarta.com/en/2026/11/10/stock-market-today-sp-500-surges-2-35-to-7549-94-and-nasdaq-jumps-2-74-as-oil-falls-and-vix-drops/", "stocks": [{"t": "VTWO", "n": "先鋒羅素 2000 ETF，追蹤同一指數的另一檔選擇"}, {"t": "SCHA", "n": "嘉信小型股 ETF，成分更廣"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "新面孔財報", "color": "#5B8ED6", "zh": "11/9 的財報名單裡也有幾家新上市或較少人追的公司：Fervo Energy（FRVO，地熱）、EquipmentShare（EQPT，設備租賃）、USA Rare Earth（USAR，稀土）、Via Transportation（VIA）。我只查到它們出現在名單上，沒有查到結果，所以今天只能當成待追蹤清單。新上市股的歷史短、分析師覆蓋少，財報後的股價波動通常比老公司大。", "en": "Monday's earnings list also included a few recently listed or lightly followed companies: Fervo Energy (FRVO, geothermal), EquipmentShare (EQPT, equipment rental), USA Rare Earth (USAR, rare earths) and Via Transportation (VIA). I only found that they were on the list, not their results, so today they are just a watch list. Newly listed stocks have short histories and thin analyst coverage, so post-earnings moves tend to be larger than for older companies.", "url": "https://pro.thestreet.com/earnings/2026-11-09", "stocks": [{"t": "FRVO", "n": "地熱發電，11/9 財報（名單）"}, {"t": "EQPT", "n": "設備租賃，11/9 財報（名單）"}, {"t": "USAR", "n": "稀土供應鏈，11/9 財報（名單）"}, {"t": "VIA", "n": "交通運輸平台，11/9 財報（名單）"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "TH 財報後", "color": "#C9A227", "zh": "Target Hospitality（TH）提供偏遠工地的模組化宿舍，客戶正從油氣田轉向資料中心。11/9 盤前公布第三季，我沒有查到官方數字；財報頁側欄有標題寫「EPS 未達標但再度上調展望」，但未載明數字，需到公司新聞稿確認。財報前的基準：預期營收約 1.202 億美元（年增約 21%）、每股持平；2026 營收指引 4.1 億到 4.2 億美元、調整後 EBITDA 8,500 萬到 9,500 萬美元、資本支出 4.9 億到 5.1 億美元。正在改變的是 8/26 簽下約 2.5 億美元、對應前五大超大規模業者的西德州合約。風險：舊業務停滯在每季約 3,300 萬美元、淨槓桿預期先升後降、9 月有大股東出脫。以上是研究線索，不是投資建議。", "en": "Target Hospitality (TH) provides modular lodging at remote work sites, and its customers are shifting from oil fields to data centers. It reported Q3 before the open on Nov 9; I could not find the official numbers. A sidebar headline on the earnings page reads that it missed on EPS but raised its outlook again, with no figures, so check the press release. Pre-earnings baseline: revenue of about $120.2 million (up roughly 21%) and breakeven EPS; 2026 revenue guidance of $410 million to $420 million, adjusted EBITDA of $85 million to $95 million and capex of $490 million to $510 million. What is changing is the Aug 26 contract worth about $250 million supporting a top-five hyperscaler in West Texas. Risks: the legacy business is stuck near $33 million a quarter, net leverage is expected to rise before it falls, and a large holder sold in September. These are research leads, not investment advice.", "url": "https://finviz.com/news/413668/target-hospitality-must-show-its-data-center-ramp-is-reaching-the-income-statement", "stocks": [{"t": "TH", "n": "11/9 盤前財報，數字待確認；資料中心宿舍合約"}], "status": "RADAR · 下一個驗證點 以公司新聞稿確認 Q3 實際數字與新簽約"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "BW 財報後", "color": "#C9A227", "zh": "Babcock & Wilcox（BW）做鍋爐與發電設備，池內記錄市值約 3.2 億美元。被忽視的原因是仍在虧損、資料中心電力題材被大型股蓋過。公司安排 11/9 美東下午 5 點電話會議公布第三季，我這次沒有查到結果；財報前的基準：預期每股約 0.03 美元、營收約 2.146 億美元（第二季 3.197 億），積壓訂單約 26 億美元，較前期 28 億下降。8 月與 Siemens Energy 簽約製造 20 組蒸汽渦輪發電機（對應 1GW），執行長與董事在 8 月以約 9.5 到 9.65 美元買進，股價約 4.27 美元、較高點跌約 64%。以上是研究線索，不是投資建議。", "en": "Babcock & Wilcox (BW) makes boilers and power-generation equipment, with a market cap of about $320 million in the pool's records. It is overlooked because it still loses money and the data-center power theme is dominated by large caps. The company scheduled a 5 p.m. ET call on Nov 9 for Q3 and I could not find the result; pre-earnings baseline: EPS of about $0.03 and revenue of about $214.6 million (Q2: $319.7 million), with backlog of about $2.6 billion, down from $2.8 billion. In August it signed with Siemens Energy to build 20 steam turbine generators (about 1 GW), and the CEO and directors bought around $9.50 to $9.65 in August; the stock is about $4.27, roughly 64% below its high. These are research leads, not investment advice.", "url": "https://finviz.com/news/413760/babcock-wilcox-must-prove-its-backlog-boom-is-real-after-a-64-stock-collapse", "stocks": [{"t": "BW", "n": "11/9 盤後財報，結果待確認；積壓訂單是重點"}], "status": "RADAR · 下一個驗證點 11/9 盤後 Q3 結果：新訂單與積壓訂單"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "LTRX 財報後", "color": "#C9A227", "zh": "Lantronix（LTRX）做工業物聯網與無人系統模組，市值約 1.3 億美元的微型股，過去有股權稀釋。11/9 盤後公布 FY2027 第一季，我這次沒有查到結果；財報前的基準：公司指引非 GAAP 每股 0.04 到 0.06 美元，預期 0.05 美元、營收約 3,220 萬美元（年增 8.1%）。正在改變：無人系統業務 FY2026 營收 1,260 萬美元，管理層預期 FY2027 約 2,500 萬美元以上；財年末現金 6,000 萬美元、無負債；董事 9 月買進 1.5 萬股。風險：記憶體成本可能吃掉無人機放量的利潤。以上是研究線索，不是投資建議。", "en": "Lantronix (LTRX) makes industrial IoT and unmanned-systems modules; it is a micro cap of about $130 million with a history of dilution. It reported fiscal Q1 2027 after the close on Nov 9 and I could not find the result; pre-earnings baseline: guidance of $0.04 to $0.06 non-GAAP EPS, consensus of $0.05 and revenue of about $32.2 million (up 8.1%). What is changing: unmanned-systems revenue was $12.6 million in FY2026 and management expects about $25 million or more in FY2027; it ended the year with $60 million in cash and no debt, and a director bought 15,000 shares in September. Risk: memory costs could eat the profit from drone ramp-up. These are research leads, not investment advice.", "url": "https://finviz.com/news/413843/lantronix-must-show-its-drone-ramp-can-outrun-memory-costs-as-stock-lags", "stocks": [{"t": "LTRX", "n": "11/9 盤後財報，結果待確認；無人系統放量是重點"}], "status": "RADAR · 下一個驗證點 以公司新聞稿確認 FY2027 Q1 結果與無人系統指引"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "AIRG 今晚財報", "color": "#C9A227", "zh": "Airgain（AIRG）做無線天線與數據機模組，小型、現金少、長期虧損，營收曾連續多季下滑。預定 11/10 盤後公布第三季，是這批雷達股裡下一個要揭曉的。正在改變：Q2 營收 1,370 萬美元，季增 19%、年增 0.7%，是六季來首次年增；Q3 營收指引 1,425 萬到 1,625 萬美元、非 GAAP 每股盈餘約 0.04 美元。風險：6/30 現金只有 760 萬美元、Q3 毛利率指引下調到 41.5% 到 44.5%，消費型業務受供給限制。我沒有查到最新的分析師預期。以上是研究線索，不是投資建議。", "en": "Airgain (AIRG) makes wireless antennas and modem modules; it is small, thinly funded and long unprofitable, with revenue that fell for several quarters. It is due to report Q3 after the close on Nov 10, the next of these radar names to report. What is changing: Q2 revenue was $13.7 million, up 19% sequentially and 0.7% year over year, its first annual increase in six quarters; Q3 revenue guidance is $14.25 million to $16.25 million with non-GAAP EPS of about $0.04. Risks: cash was only $7.6 million at June 30, Q3 gross margin guidance was cut to 41.5% to 44.5%, and the consumer business is supply constrained. I could not find updated analyst estimates. These are research leads, not investment advice.", "url": "https://www.marketbeat.com/instant-alerts/airgain-nasdaqairg-issues-q3-2026-earnings-guidance-2026-08-05/", "stocks": [{"t": "AIRG", "n": "11/10 盤後 Q3 財報；Q3 營收指引 1,425 萬到 1,625 萬美元"}], "status": "RADAR · 下一個驗證點 11/10 盤後 Q3：能否維持年增與毛利率"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "AVR 心臟瓣膜", "color": "#C9A227", "zh": "Anteris Technologies（AVR）開發經導管主動脈瓣膜 DurAVR，澳洲與那斯達克雙掛牌、尚未商業化，被當成純研發股。今天沒有新動態，延續追蹤。正在改變：1 月美敦力策略投資 9,000 萬美元（連同公開發行共募約 3.2 億美元）；PARADIGM 關鍵性試驗（約 1,000 人）從 5 月起在美國收案；10% 以上股東 L1 Capital 在 10/1 買進 32.3 萬股、約 245 萬美元。風險：沒有營收，Q1 現金流出約 2,870 萬美元，成敗取決於試驗結果與後續融資稀釋，近六個月也有 13 筆賣出紀錄。以上是研究線索，不是投資建議。", "en": "Anteris Technologies (AVR) is developing DurAVR, a transcatheter aortic valve; it is dual-listed in Australia and on Nasdaq, not yet commercial, and treated as a pure R&D stock. No new developments today; tracking continues. What is changing: Medtronic made a $90 million strategic investment in January (about $320 million raised including the public offering); the PARADIGM pivotal trial (about 1,000 patients) has been enrolling in the US since May; and 10% holder L1 Capital bought 323,000 shares, about $2.45 million, on Oct 1. Risks: no revenue, about $28.7 million of cash outflow in Q1, outcomes depend on trial results and future dilution, and there were 13 sell records in the past six months. These are research leads, not investment advice.", "url": "https://www.stocktitan.net/sec-filings/AVR/10-q-anteris-technologies-global-corp-quarterly-earnings-report-afac191ff80b.html", "stocks": [{"t": "AVR", "n": "美敦力投資 9,000 萬美元，PARADIGM 試驗收案中"}], "status": "RADAR · 下一個驗證點 Q3 財報與 PARADIGM 入組進度"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "VYLR 分拆", "color": "#C9A227", "zh": "Vylor（VYLR）是 Corteva 在 10/1 分拆出來的種子與基因公司，在 NYSE 獨立交易。今天沒有新動態，首份財報日期仍待公司公告確認。被忽視的原因：新公司沒有獨立的分析師模型與歷史股價，分拆股常因母公司股東被動賣出而出現短期賣壓。正在改變：種子事業第一次有獨立估值，有報導說它 2025 年營收約 100 億美元、EBITDA 約 30 億美元，公司目標 2029 年營收 112 億到 119 億美元。風險：有州政府對 Corteva 與 Vylor 提告，主張分拆是為了規避環境污染（永久化學物質）的歷史負債，但另有報導說該訴訟已告失敗，說法不一；農業景氣也在下行。以上是研究線索，不是投資建議。", "en": "Vylor (VYLR) is the seed and genetics company Corteva spun off on Oct 1 and now trades independently on the NYSE. No new developments today; the date of its first earnings report still awaits a company announcement. Why overlooked: the new company has no standalone analyst models or price history, and spin-offs often face short-term selling from parent shareholders. What is changing: the seed business gets its own valuation for the first time, with reports putting 2025 revenue near $10 billion and EBITDA near $3 billion, and a 2029 revenue target of $11.2 billion to $11.9 billion. Risks: a state sued Corteva and Vylor claiming the spin-off was meant to dodge historical environmental liabilities (forever chemicals), though another report says that suit has failed, so accounts differ; the farm economy is also weakening. These are research leads, not investment advice.", "url": "https://finviz.com/news/397609/vylor-completes-spin-launches-as-a-standalone-advanced-seed-and-genetics-market-leader", "stocks": [{"t": "VYLR", "n": "首份財報日期待公司公告確認；訴訟說法不一"}], "status": "RADAR · 下一個驗證點 首份財報（日期待確認）與訴訟進展"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "台積電高管買進", "color": "#6DB56D", "zh": "Quiver 的 11/9 彙整顯示，台積電（TSM）近六個月有 187 筆內部人買進、只有 2 筆賣出，其中約 30 位副總到共同營運長，包括執行長魏哲家，反覆買進小額，推算價位集中在每股約 76 美元。這種小額、頻繁、價位一致的模式，比較像定期定額或員工持股計畫，不是對行情的押注，不要當成大型股買進訊號。另一筆較像主動買進的是董事 Splinter 在 11/5 買進 840 股，約 29.99 萬美元。價位是 Quiver 用金額除以股數推算，請以 Form 4 為準。", "en": "Quiver's Nov 9 roundup shows TSMC (TSM) with 187 insider purchases and only 2 sales over six months, from about 30 officers ranging from vice presidents to co-COOs, including CEO C.C. Wei, who repeatedly bought small amounts at an implied price clustered near $76 a share. A pattern of small, frequent, same-price buys looks more like a regular purchase or employee share plan than a bet on the market, and should not be read as a large-cap buy signal. A more discretionary-looking trade was director Splinter's purchase of 840 shares for about $299,880 on Nov 5. Prices are Quiver's own estimates (dollars divided by shares); rely on Form 4.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+November+09,+2026", "stocks": [{"t": "TSM", "n": "約 30 位高管小額重複買進，像定期計畫；董事 Splinter 11/5 買 840 股"}]},
  {"id": "insider_1", "channel": "內部人動向", "tag": "Matador 九人買進", "color": "#6DB56D", "zh": "Matador Resources（MTDR）是德州與新墨西哥的油氣生產商，Quiver 顯示近六個月 9 位內部人共買進 24 次、沒有任何賣出：董事長兼執行長 Foran 買 11 次共 33,951 股（約 177 萬美元，均價約 52 美元），11/5 又買 5,000 股（約 25.7 萬美元）；財務長 Calvert 買 3 次共 6,000 股。能源是週一最落後的板塊，油價單日跌 5% 左右，買進的人要面對的是油價風險。反方論點：Matador 的分析師覆蓋不少、並非冷門，內部人買進也不保證股價見底；價位為 Quiver 推算，以 Form 4 為準。", "en": "Matador Resources (MTDR) is an oil and gas producer in Texas and New Mexico. Quiver shows nine insiders made 24 purchases and no sales in six months: Chairman and CEO Foran bought 11 times for 33,951 shares (about $1.77 million, average roughly $52) and added 5,000 shares (about $256,800) on Nov 5; CFO Calvert bought 6,000 shares in 3 trades. Energy was Monday's weakest sector with oil down about 5% in a day, so these buyers are taking oil-price risk. Counterargument: Matador has plenty of analyst coverage and is not obscure, and insider buying does not guarantee a bottom; prices are Quiver's estimates, so rely on Form 4.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+November+09,+2026", "stocks": [{"t": "MTDR", "n": "9 位內部人近六個月買進 24 次、0 筆賣出；執行長 11/5 再買 5,000 股"}]},
  {"id": "insider_2", "channel": "內部人動向", "tag": "買進要看脈絡", "color": "#6DB56D", "zh": "同一份 Quiver 彙整裡，買進的意義差很多。Blackstone Mortgage Trust（BXMT）執行長 Johnson 11/4 買進 9 萬股（約 103.5 萬美元），但同期也有其他內部人賣出；TTM Technologies（TTMI）執行長 Roks 與 Ali 近六個月合計買進約 310 萬美元，卻同時有 240 筆賣出紀錄，買賣比例懸殊；NeOnc（NTHI）是股價約 3 到 4 美元的微型股，執行長一人買了 8 次。判讀提醒：先看買賣是否同向、金額占個人持股多少、買的是大公司還是微型股。", "en": "In the same Quiver roundup, buys mean very different things. Blackstone Mortgage Trust (BXMT) CEO Johnson bought 90,000 shares (about $1.04 million) on Nov 4, but other insiders sold in the same period; TTM Technologies (TTMI) CEO Roks and Ali bought about $3.1 million combined over six months while there were 240 sale records, a lopsided ratio; NeOnc (NTHI) is a micro cap near $3 to $4 and its CEO bought eight times. Reading tip: check whether buys and sells point the same way, how large the buy is relative to the person's holdings, and whether it is a large company or a micro cap.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+November+06,+2026", "stocks": [{"t": "BXMT", "n": "執行長 11/4 買 9 萬股，同期有其他內部人賣出"}, {"t": "TTMI", "n": "兩位高管買約 310 萬美元，但有 240 筆賣出紀錄"}, {"t": "NTHI", "n": "股價約 3 到 4 美元的微型股，執行長買 8 次"}]},
