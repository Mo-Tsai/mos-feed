<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "指數收黑", "color": "#E05C5C", "zh": "週一（8/17）美股三大指數同步走弱：標普 500 跌 0.5% 收在 7,745.06，道瓊跌 0.5% 至 53,459.78，那斯達克跌 0.3% 至 26,644.91。盤中一度只是平盤整理，賣壓集中在尾盤。壓力來自兩個同時上行的價格——布蘭特原油突破每桶 90 美元，三十年期公債殖利率升到 5.31%、創 2007 年 6 月以來新高。油價與長端利率同向上行，等於同時墊高企業成本與折現率，這是今天開盤前最該記住的組合。", "en": "All three major U.S. indexes fell on Monday (8/17): the S&P 500 lost 0.5% to close at 7,745.06, the Dow slipped 0.5% to 53,459.78 and the Nasdaq Composite fell 0.3% to 26,644.91. The session traded flat for much of the day, with selling concentrated into the close. The pressure came from two prices rising together — Brent crude pushed above $90 a barrel and the 30-year Treasury yield climbed to 5.31%, its highest since June 2007. Oil and long-end rates moving up in tandem lifts both corporate costs and the discount rate at once, and that is the combination to carry into today's open.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-august-17-dow-sp-500-nasdaq-094421171.html", "stocks": [{"t": "SPY", "n": "標普 500 ETF，週一 -0.5%，指數收在 7,745.06"}, {"t": "DIA", "n": "道瓊 ETF，週一 -0.5% 至 53,459.78，權值偏工業與金融"}, {"t": "QQQ", "n": "那斯達克 100 ETF，對應指數 -0.3%，跌幅相對最小"}]},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "油價與地緣", "color": "#E05C5C", "zh": "油價上漲的直接導火線，是美國與伊朗之間的一份諒解備忘錄在週一到期。川普公開表示看不到戰事短期結束，並警告若阿曼干預荷姆茲海峽航道將採取軍事行動。布蘭特原油因此升破每桶 90 美元，西德州原油在 82 美元附近。這條線之所以重要，是它同時牽動三件事：通膨預期、聯準會的政策空間、以及能源類股的相對強弱。對持有非能源部位的人來說，油價每上一階，等於整體市場的獲利預估被往下修一次。", "en": "The trigger for higher oil was the expiry on Monday of a memorandum of understanding between the United States and Iran. President Trump said publicly that he does not see the conflict ending soon and warned of military action if Oman interferes with traffic through the Strait of Hormuz. Brent duly pushed above $90 a barrel while WTI traded near $82. This line matters because it moves three things at once: inflation expectations, the Fed's room to manoeuvre, and the relative strength of energy equities. For anyone holding non-energy positions, every leg higher in crude is effectively another downward revision to market-wide earnings estimates.", "url": "https://www.cnbc.com/2026/08/17/treasury-yields-federal-reserve-fomc-minutes.html", "stocks": [{"t": "USO", "n": "原油 ETF，布蘭特升破 90 美元、西德州約 82 美元"}, {"t": "OXY", "n": "西方石油，美國本土產量曝險高，是油價上行的直接受惠者"}, {"t": "HAL", "n": "哈里伯頓，油服端對油價的營運槓桿高於整合型油商"}]},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "債市與黃金", "color": "#E05C5C", "zh": "三十年期公債殖利率週一升破 5.31%，是 2007 年 6 月以來最高，十年期則收在 4.72%。長端獨自走高、短端相對穩定，這種形狀反映的不是景氣預期轉強，而是市場對長期通膨與財政赤字的補償要求提高。黃金同步站在每盎司 4,477 美元附近，避險與抗通膨兩種需求疊在一起。對股票投資人而言，長端殖利率是估值的地心引力：它每上升一碼，高本益比與長天期現金流的族群就被往下拉一分。", "en": "The 30-year Treasury yield broke above 5.31% on Monday, the highest since June 2007, while the 10-year closed at 4.72%. The long end rising on its own, with the short end relatively steady, does not signal stronger growth expectations — it signals that investors want more compensation for long-run inflation and fiscal deficits. Gold sat near $4,477 an ounce as haven and inflation-hedge demand stacked on top of each other. For equity investors, the long yield is valuation's gravity: every step higher drags on high-multiple, long-duration cash flows.", "url": "https://www.cnbc.com/2026/08/17/treasury-yields-federal-reserve-fomc-minutes.html", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，三十年期殖利率 5.31% 創 19 年新高，債價承壓"}, {"t": "GLD", "n": "黃金 ETF，現貨金約 4,477 美元，避險與抗通膨需求同時存在"}]},
    {"id": "overnight_4", "channel": "隔夜盤勢", "tag": "記憶體逆勢", "color": "#E05C5C", "zh": "大盤走弱，記憶體相關個股卻是週一少數逆勢的一群。美國商務部長盧特尼克向華爾街日報表示，政府反對蘋果採購中國製記憶體晶片，消息一出美系記憶體廠盤前全面走高：SanDisk 漲近 5%、威騰電子與美光漲逾 3%、希捷漲逾 2.5%，美光盤中一度重回 1,000 美元關卡，半導體 ETF 上漲 2.4%。這是政策直接改變供應鏈分配的案例——需求沒有變多，但可以賣給蘋果的名單變短了，剩下的人分到的份額就變大。", "en": "With the broad market lower, memory names were one of the few groups moving the other way on Monday. Commerce Secretary Howard Lutnick told the Wall Street Journal that the administration opposes Apple buying Chinese-made memory chips, and U.S. memory makers rose across the pre-market: SanDisk gained almost 5%, Western Digital and Micron more than 3%, and Seagate over 2.5%, with Micron trading back above $1,000 intraday and the semiconductor ETF up 2.4%. This is policy redistributing a supply chain rather than expanding it — demand did not grow, but the list of vendors allowed to sell to Apple got shorter, so the remaining share per name got bigger.", "url": "https://www.cnbc.com/2026/08/17/stocks-making-the-biggest-moves-premarket-baba-intc-sndk.html", "stocks": [{"t": "SNDK", "n": "SanDisk，盤前漲近 5%，是這則政策消息最直接的受惠者"}, {"t": "WDC", "n": "威騰電子，漲逾 3%，儲存裝置端的美系供應商"}, {"t": "MU", "n": "美光，漲逾 3%，盤中一度重回 1,000 美元關卡"}, {"t": "STX", "n": "希捷，漲逾 2.5%，硬碟端同樣受惠於供應鏈重分配"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "零售第一棒", "color": "#E8786A", "zh": "Home Depot 今天（8/18）盤前公布截至七月底的第二季財報，是本週零售財報週的第一棒。市場預估每股盈餘 4.73 美元，去年同期是 4.68 美元，等於只給了個位數百分比的成長。真正的看點不在這個數字，而在它報的正是七月零售銷售月減 0.6% 的那一段時間，加上房貸利率居高不下、NAHB 建商信心指數只有 35。裝修支出與房市週期高度綁定，Home Depot 的同店銷售等於是房市的即時讀數。", "en": "Home Depot reports its July-quarter results before the open today (8/18), the first of this week's retail prints. Consensus is for EPS of $4.73 against $4.68 a year ago — single-digit growth at best. The number itself is not the point; the point is that this quarter covers the same stretch in which July retail sales fell 0.6%, with mortgage rates still elevated and the NAHB builder sentiment index at just 35. Home improvement spending is tightly bound to the housing cycle, which makes Home Depot's comparable sales a live reading on housing itself.", "url": "https://stocksdownunder.com/walmart-target-home-depot-earnings-consumer/", "stocks": [{"t": "HD", "n": "8/18 盤前公布，市場預估每股 4.73 美元（去年同期 4.68）"}, {"t": "LOW", "n": "羅氏排在 8/19，兩者的差異可分辨是行業問題還是公司問題"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "超標卻下跌", "color": "#E8786A", "zh": "上週留下一個值得警惕的模式：財報超標的公司照樣下跌。應用材料把下一季指引開在市場預估之上約 7 億美元、並形容需求「前所未見」，股價當天仍跌 3%；思科、Coherent、Cerebras 也都是超標後收黑。這代表市場的反應函數已經倒轉——好消息被視為已經定價，只有超乎想像的驚喜才推得動股價。對接下來的財報週，實務意義是：與其猜誰會超標，不如先問「什麼樣的結果才算意外」。", "en": "Last week left a pattern worth noting: companies that beat still fell. Applied Materials guided the coming quarter roughly $700 million above consensus and described demand as unprecedented — and the stock dropped 3% that day. Cisco, Coherent and Cerebras all finished lower after beats as well. The market's reaction function has inverted: good news is treated as already priced, and only a genuine surprise moves the stock. The practical implication for the rest of earnings season is to stop guessing who beats and start asking what result would actually count as a surprise.", "url": "https://theconcepttrading.com/market-snapshot-august-14th-2026/", "stocks": [{"t": "AMAT", "n": "應用材料，指引高於預估約 7 億美元仍下跌 3%"}, {"t": "CSCO", "n": "思科，同樣超標後收黑，網通硬體吃不到 AI 溢價"}, {"t": "COHR", "n": "Coherent，光通訊供應鏈，超標後同步走弱"}]},
    {"id": "earn_3", "channel": "財報速報", "tag": "事後重新定價", "color": "#E8786A", "zh": "Cerebras 是上一段的反面案例，也是「財報只是起點」的示範。它的第二季業績優於預期並上調全年展望，盤後卻一度重挫約 14%。週一情況反轉：摩根士丹利重申增持並調高目標價、預估核心營收到 2027 年將成長三倍以上，同時第二季 13F 揭露 Tiger Global 等基金新建大額部位，股價單日跳漲約 16%、收在 254 美元附近，盤中一度觸及 261.08。同一份財報、兩種價格——中間差的不是資訊，是誰在買。", "en": "Cerebras is the mirror image of the point above, and a demonstration that an earnings report is only a starting price. Its second-quarter results beat and it raised full-year guidance, yet the stock fell about 14% in extended trading. Monday reversed that: Morgan Stanley reiterated overweight and lifted its target, projecting core revenue to more than triple by 2027, while second-quarter 13F filings revealed large new positions from funds including Tiger Global. Shares jumped roughly 16% to close near $254 after touching $261.08 intraday. Same report, two prices — what changed was not the information but who was buying.", "url": "https://www.tradingkey.com/news/market-movers/262112914-market-movers-cbrs-20260817", "stocks": [{"t": "CBRS", "n": "週一 +16% 收在約 254 美元，大摩調高目標價＋13F 揭露新法人部位"}, {"t": "AVGO", "n": "博通，上週因分析師質疑其 3,700 億美元債務融資工具而重挫 6%"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "FOMC 紀要", "color": "#7C6AF7", "zh": "聯準會七月會議連續第五次按兵不動，把政策利率維持在 3.50% 至 3.75%，但克里夫蘭的哈瑪克、明尼亞波利斯的卡什卡里、達拉斯的羅根三人同時投下主張升息一碼的反對票。本週三公布的會議紀要要回答的問題只有一個：這三票是孤立的少數，還是有更多委員在會議桌上被說服、卻沒有正式提出異議。市場目前把九月升息機率放在三到四成之間游走，紀要的措辭會直接決定這個數字往哪邊移動。", "en": "The Fed held for a fifth straight meeting in July, keeping the policy rate at 3.50% to 3.75%, but Cleveland's Hammack, Minneapolis's Kashkari and Dallas's Logan all dissented in favour of a quarter-point hike. Wednesday's minutes have one job: to show whether those three were an isolated minority or whether more members were persuaded around the table without formally dissenting. Markets currently put the odds of a September hike somewhere between 30% and 40%, and the language of the minutes will decide which way that number moves.", "url": "https://www.cnbc.com/2026/07/29/fed-meeting-today-live-updates.html", "stocks": [{"t": "IEF", "n": "7-10 年期公債 ETF，會議紀要的鷹派程度直接反映在中天期殖利率"}, {"t": "KRE", "n": "區域銀行 ETF，升息對淨利差是短多、對存款成本與信用品質是長空"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "消費降溫", "color": "#7C6AF7", "zh": "七月零售銷售月減 0.6%，是九個月來首次下滑，密西根大學八月消費者信心初值同步走弱。這兩份數據把「消費者仍然強韌」這個上半年的共識打出了裂縫。要注意的是零售銷售是名目數字，在通膨仍有 3% 出頭的環境下，名目值下滑意味著實質消費量的收縮更深。折扣型與必需消費零售商在這種環境通常相對抗跌，高單價的可選消費則會先被砍。", "en": "July retail sales fell 0.6%, the first decline in nine months, and the preliminary University of Michigan sentiment reading for August softened alongside it. Together they crack the first-half consensus that the consumer remains resilient. Note that retail sales is a nominal series: with inflation still running above 3%, a nominal decline implies a deeper contraction in real volumes. Discounters and staples retailers typically hold up better in this environment, while high-ticket discretionary spending gets cut first.", "url": "https://finance.yahoo.com/markets/stocks/articles/stock-market-today-aug-14-213018651.html", "stocks": [{"t": "XRT", "n": "零售 ETF，成分較平均分布，是消費降溫的整體讀數"}, {"t": "DG", "n": "美元將軍，折扣通路在消費降級時通常相對抗跌"}, {"t": "FIVE", "n": "Five Below，低單價可選消費，是「降級但仍要買」的樣本"}]},
    {"id": "macro_3", "channel": "總經政策", "tag": "硬數據反彈", "color": "#7C6AF7", "zh": "與消費端相反，製造與營建的即時數據週一意外偏強。紐約聯儲的帝國州製造業指數跳升到 20.6，遠優於市場預估的 11.0；NAHB 建商信心指數 35，也略高於預估的 33。這造成一個尷尬的分歧：軟數據（信心、零售）在退，硬數據（工廠訂單）在彈。對聯準會而言，這種組合最難處理——它同時給了鴿派與鷹派各自要的證據，也是為什麼九月的政策路徑到現在還沒有共識。", "en": "In contrast to the consumer, real-time manufacturing and construction data came in firm on Monday. The New York Fed's Empire State manufacturing index jumped to 20.6 against a consensus of 11.0, and the NAHB builder sentiment index printed 35 versus 33 expected. That creates an awkward split: soft data — sentiment and retail sales — is fading while hard data such as factory orders is bouncing. For the Fed this is the hardest combination to handle, because it hands doves and hawks the evidence each wants, which is precisely why there is still no consensus on the September path.", "url": "https://investrade.com/mid-morning-look-august-17-2026/", "stocks": [{"t": "XLI", "n": "工業類股 ETF，帝國州製造業 20.6 遠優於預估 11.0"}, {"t": "ITB", "n": "住宅建商 ETF，NAHB 建商信心 35，略優於預估但仍在低檔"}, {"t": "DHI", "n": "霍頓房屋，建商龍頭，房貸利率與建商信心的雙重曝險"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "能源紀錄", "color": "#4EABA4", "zh": "標普 500 能源類股已經連續 14 週上漲，創下有紀錄以來最長的連漲週數，今年累計漲幅約 29.4%，正式超越科技的 23% 成為最強類股，過去三個月淨流入約 60 億美元。上週單週 XLE 就漲了 7.7%。推力有兩層：油價受地緣供給風險支撐，以及在高利率環境下資金偏好高自由現金流與高股息的資產。要留意的是這條紀錄本身就是風險——連漲 14 週意味著空手的人已經很少，任何美伊緩和的訊號都可能造成擁擠交易的反向踩踏。", "en": "The S&P 500 energy sector has now risen for 14 consecutive weeks, the longest streak on record, and is up about 29.4% this year — overtaking technology's 23% to become the best-performing sector, with roughly $6 billion of net inflows over three months. XLE alone gained 7.7% last week. Two forces are behind it: geopolitical supply risk supporting crude, and a preference in a high-rate environment for high free cash flow and high dividend assets. The streak is itself the risk, though — 14 straight up weeks means few investors are left underweight, and any sign of U.S.-Iran de-escalation could trigger a crowded-trade unwind.", "url": "https://etfdb.com/sector-investing-content-hub/energy-sector-record-14-week-winning-streak/", "stocks": [{"t": "XLE", "n": "能源類股 ETF，連 14 週上漲創紀錄，今年約 +29.4%"}, {"t": "XOM", "n": "埃克森美孚，權重最大的整合型油商，是資金流入的主要載體"}, {"t": "SLB", "n": "斯倫貝謝，油服端高 beta，油價續強時彈性大於整合型油商"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "評價變數換人", "color": "#4EABA4", "zh": "半導體板塊今年最重要的現象不是誰漲誰跌，而是市場對「好消息」的反應變了。整個族群連續數週交出超標財報，指數卻走不動；應用材料上調指引仍跌 3%，博通則因為分析師質疑一筆規模達 3,700 億美元的債務融資工具而重挫 6%。這說明資金已經從「這個題材會不會成長」轉向「這個題材要花多少錢才能成長」。融資結構與資本支出的可持續性，正在取代營收成長率成為新的評價變數。", "en": "The most important thing happening in semiconductors this year is not which names rise or fall but how the market now reacts to good news. The group has delivered beat after beat for weeks and the index has gone nowhere. Applied Materials raised guidance and fell 3%; Broadcom dropped 6% after analysts questioned a debt financing vehicle reported at $370 billion. Capital has shifted from asking whether the theme will grow to asking how much it costs to grow. Financing structure and the sustainability of capital spending are replacing revenue growth as the valuation variable that matters.", "url": "https://theconcepttrading.com/market-snapshot-august-14th-2026/", "stocks": [{"t": "SOXX", "n": "半導體 ETF，週一在大盤走弱中仍漲 2.4%，但整體族群數週未突破"}, {"t": "AMAT", "n": "應用材料，指引優於預估仍下跌 3%，是反應函數倒轉的代表案例"}]},
    {"id": "sector_3", "channel": "產業風向", "tag": "AI 基建帳單", "color": "#4EABA4", "zh": "AI 資本支出的規模開始外溢到融資市場。輝達宣布為 OpenAI 在俄亥俄州的資料中心專案安排 1,050 億美元融資；同一天，由加密礦業轉型的 HIVE 拿下一紙五年、3.5 億美元的 GPU 雲端服務合約，年化營收約增加 7,000 萬美元，合約全面運轉後高效能運算的日營收可望達 50 萬美元。一頭是史上罕見的單一專案融資規模，一頭是小公司靠出租算力找到第二成長曲線。共同訊息是：這一輪的瓶頸不在晶片設計，而在電力、機房與資金。", "en": "The scale of AI capital spending is now spilling into financing markets. Nvidia announced $105 billion of financing for an OpenAI data centre project in Ohio. On the same day HIVE, a crypto miner turned compute provider, won a five-year, $350 million GPU cloud services contract that adds roughly $70 million of annualised revenue and should lift daily HPC revenue to about $500,000 once fully operational. One is single-project financing at a scale rarely seen; the other is a small company finding a second growth curve by renting out compute. The shared message is that this round's bottleneck is not chip design but power, floor space and capital.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-august-17-dow-sp-500-nasdaq-094421171.html", "stocks": [{"t": "NVDA", "n": "為 OpenAI 俄亥俄資料中心安排 1,050 億美元融資"}, {"t": "HIVE", "n": "五年 3.5 億美元 GPU 雲端合約，年化營收約增 7,000 萬美元"}, {"t": "VRT", "n": "Vertiv，資料中心電力與散熱設備商，是這條瓶頸的直接受惠端"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "指數位置", "color": "#5B8ED6", "zh": "羅素 2000 上週五收在 3,068.54 的歷史新高，今年累計上漲逾 23%，領先那斯達克 100 的 19%，是它 23 年來最好的一年。週一在大盤走弱的環境下小幅回落到 3,056 附近。小型股今年跑贏的邏輯有兩層：一是相對大型股的估值折價仍深，二是它們的浮動利率債務比重高，市場對利率見頂的任何預期都會先反映在這裡。反過來說，週三的 FOMC 會議紀要如果偏鷹，回吐也會從這裡開始。", "en": "The Russell 2000 closed at a record 3,068.54 last Friday, up more than 23% this year and ahead of the Nasdaq 100's 19% — its best year in 23. On Monday it eased back to around 3,056 as the broad market fell. Two things explain the outperformance: a still-deep valuation discount to large caps, and a much higher share of floating-rate debt, so any expectation that rates have peaked shows up here first. The corollary is that if Wednesday's FOMC minutes read hawkish, the giveback also starts here.", "url": "https://www.benzinga.com/etfs/specialty-etfs/26/08/61181756/quick-spark-russell-2000-hits-new-record-highs-beats-nasdaq-100-in-2026", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，上週五指數創 3,068.54 新高，今年逾 +23%"}, {"t": "IJR", "n": "標普小型 600 ETF，設有獲利門檻，可對照同期漲幅的品質來源"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "族群現象", "color": "#5B8ED6", "zh": "上週五有 55 檔小型股創下 52 週新高，把清單拆開看會發現一件事：其中 13 檔集中在金融、以區域銀行為主，另外一大群在生技。這不是 55 家公司各自表現優異，而是兩個族群同時被重新定價。判讀的實務意義是——當你看到某檔小型銀行創高，先問它是不是整個族群一起創高；如果是，那股價講的是利率與併購環境，不是這家公司的經營能力。價格從來不是對一門生意的判決。", "en": "Fifty-five small caps hit fresh 52-week highs last Friday, and breaking the list apart reveals something: 13 sit in financials, mostly regional banks, with another large cluster in biotech. This is not 55 companies each performing well — it is two groups being repriced at once. The practical reading rule is that when a small bank makes a new high, first ask whether the whole group is making new highs. If it is, the price is telling you about rates and the merger environment, not about that company's execution. A price is never a verdict on a business.", "url": "https://www.trefis.com/stock/spy/articles-v3/611649/55-small-cap-stocks-just-made-new-52-week-highs/2026-08-17", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，55 檔創高名單裡 13 檔集中在金融，多為區域銀行"}, {"t": "BOKF", "n": "BOK Financial，創高名單成員，一年報酬約 40.7%"}, {"t": "JXN", "n": "Jackson Financial，創高名單成員，一年報酬約 45.1%"}, {"t": "VOYA", "n": "Voya Financial，創高名單成員，一年報酬約 39.2%"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "個股催化", "color": "#5B8ED6", "zh": "週一小型股有幾個很乾淨的催化案例。OAMI 大漲約 21%，因為與禮來簽下離子通道藥物探索的全球合作與授權協議，取得預付款並可望拿到最高 3.7 億美元的研發與商業里程碑金。Intuitive Machines 漲約 6%，宣布獲選一項預估價值逾 6 億美元的多衛星通訊基礎建設計畫，其積壓訂單今年以來已增加 15.5 億美元。兩則都是同一種型態：微型公司拿到遠大於自身規模的合約，市場一次把未來重新定價。", "en": "Monday produced a few clean small-cap catalysts. OAMI surged about 21% after signing a global collaboration and licence agreement with Eli Lilly for an ion channel drug discovery programme, receiving an upfront payment and becoming eligible for up to $370 million in research and commercial milestones. Intuitive Machines rose roughly 6% after being selected for a multi-satellite communications infrastructure programme valued at more than $600 million; its backlog has grown $1.55 billion so far this year. Both follow the same shape: a very small company lands a contract far larger than itself, and the market reprices the future in one go.", "url": "https://seekingalpha.com/news/4633682-biggest-stock-movers-monday-dsx-hive-and-more", "stocks": [{"t": "OAMI", "n": "週一 +21%，與禮來簽離子通道藥物合作，里程碑金最高 3.7 億美元"}, {"t": "LUNR", "n": "Intuitive Machines +6%，獲選逾 6 億美元多衛星通訊計畫"}, {"t": "LLY", "n": "禮來，出資方，用授權合作把早期探索風險外包給小型生技"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "反面教材", "color": "#5B8ED6", "zh": "同一天也有兩個提醒風險的樣本。EyePoint Pharmaceuticals 暴跌約 71%，臨床試驗在老年性黃斑部病變的視力維持指標上未達標；Enovix 跌約 17%，執行長 Raj Talluri 於 8 月 13 日辭去執行長與董事職務，由 Ryan Benton 暫代並啟動人選搜尋。小型股的單一事件風險就是這麼不對稱：一則臨床數據或一紙人事公告，可以在一天內抹掉數年的漲幅。這也是為什麼小型股的部位規模，要用「歸零也能承受」來設定。", "en": "The same session produced two reminders of the downside. EyePoint Pharmaceuticals collapsed about 71% after its trial failed to maintain vision in age-related macular degeneration. Enovix fell roughly 17% after chief executive Raj Talluri resigned as CEO and director effective August 13, with Ryan Benton stepping in as interim while a search begins. Single-event risk in small caps is exactly this asymmetric: one clinical readout or one personnel filing can erase years of gains in a day. It is also why small-cap position sizes should be set at a level you could tolerate going to zero.", "url": "https://investrade.com/mid-morning-look-august-17-2026/", "stocks": [{"t": "ENVX", "n": "Enovix -17%，執行長 8/13 辭任，由 Ryan Benton 暫代"}, {"t": "EYPT", "n": "EyePoint -71%，老年性黃斑部病變試驗視力維持指標未達標"}]},
    {"id": "small_5", "channel": "小型股風雲", "tag": "池子差異", "color": "#5B8ED6", "zh": "談小型股一定要先問是哪一個池子。羅素 2000 純粹按市值取第 1001 到 3000 名，不看獲利；標普小型 600 則同時設有獲利門檻與流動性要求。兩者都叫小型股，但成分品質差很多，多頭時羅素往往更猛、空頭時回撤也更深。再往下一層是交易成本：小型股的買賣價差可能是大型股的十倍以上，這筆錢在進場前就要先算進去。看到「小型股創新高」的標題時，第一件事是先看它指的是哪一個指數。", "en": "Any discussion of small caps has to start by asking which pool. The Russell 2000 simply takes ranks 1,001 to 3,000 by market capitalisation with no profitability test. The S&P SmallCap 600 applies both an earnings hurdle and liquidity requirements. Both are called small caps, but constituent quality differs sharply: the Russell tends to run harder in rallies and draw down deeper in declines. One layer below sits trading cost — small-cap bid-ask spreads can be ten times wider than large caps, and that expense has to be counted before entry. When you see a headline about small caps at record highs, the first question is which index it means.", "url": "https://etfdb.com/thematic-investing-content-hub/3-small-cap-etfs-watch/", "stocks": [{"t": "IJR", "n": "標普小型 600 ETF，有獲利門檻與流動性要求，品質篩選較嚴"}, {"t": "IWO", "n": "羅素 2000 成長 ETF，未獲利與高本夢比成分集中於此，波動最大"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "行銷轉軟體", "color": "#C9A227", "zh": "Thryv Holdings 做的是小型企業的行銷與客戶管理軟體，前身是黃頁分類廣告商，目前正把重心從逐年萎縮的行銷服務轉到訂閱制軟體，軟體已佔營收約七成。它為什麼被忽視：股價只有 2.8 美元上下，是典型的「壞掉的舊媒體」抽屜股，賣方覆蓋薄、媒體幾乎不寫。正在改變的有兩件事：一是 8 月 4 至 5 日，10% 大股東兼董事的 Paulson & Co 連兩天在公開市場買進合計 399,548 股、約 112 萬美元，均價 2.79 至 2.82 美元，持股增至 884 萬股；二是公司宣布全面轉向軟體營運模式的重組計畫，認列 2,000 萬至 2,500 萬美元費用，換取 2027 年起每年 5,500 萬至 6,000 萬美元的成本節省。風險很明確：下半年的軟體營收與獲利指引反而走弱，行銷服務的萎縮速度仍可能快過軟體的成長，而 2.8 美元的股價本身就代表市場對執行力的高度懷疑。這是研究線索，不是投資建議。", "en": "Thryv Holdings sells marketing and customer management software to small businesses. It began life as a Yellow Pages directory publisher and is now shifting weight from a structurally shrinking marketing services line to subscription software, which is already about 70% of revenue. Why it is neglected: the share price sits around $2.80, filing it in the broken-old-media drawer, with thin sell-side coverage and almost no press. Two things are changing. First, on August 4 and 5 Paulson & Co, a 10% holder and director, bought 399,548 shares on the open market for roughly $1.12 million at $2.79 to $2.82, lifting its holding to 8.84 million shares. Second, the company announced a restructuring to move fully to a software operating model, taking $20 million to $25 million of charges in exchange for $55 million to $60 million of annualised savings from 2027. The risks are explicit: second-half software revenue and profit guidance actually steps down, marketing services may keep shrinking faster than software grows, and a $2.80 share price is itself the market's deep scepticism about execution. A research lead, not investment advice.", "url": "https://ng.investing.com/news/stock-market-news/paulson--co-10-owner-buys-112m-of-thryv-holdings-stock-93CH-2646191", "status": "RADAR · 下一個驗證點 Q3 財報（約 2026/11），看軟體營收能否止穩", "stocks": [{"t": "THRY", "n": "Paulson & Co 8/4-8/5 買進 399,548 股約 112 萬美元，均價 2.79-2.82"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "再生醫材", "color": "#C9A227", "zh": "AVITA Medical 做的是燒燙傷與皮膚缺損的再生醫療——它的 RECELL 系統可以取一小片自體皮膚，在手術室現場製成噴灑式的細胞懸浮液，覆蓋大面積創面。它被忽視的理由是市值只有約 2.5 億美元、長年虧損，落在多數法人的篩選門檻之下。正在改變的是損益結構：第二季營收 2,170 萬美元、年增 18%、季增 13%，毛利率創下 81.9% 的紀錄，營業費用反而年減 6% 至 2,460 萬美元，淨損從 992 萬收斂到 766 萬；公司把全年營收指引上調到 8,600 萬至 8,900 萬美元（年增 20% 至 24%），並預期第四季達成現金流損益兩平。風險：它仍在虧損，營收高度集中於 RECELL 單一產品線（第二季 1,850 萬），醫材的給付政策一變就能撼動整家公司；而現金流兩平目前只是管理層預期、尚未發生。這是研究線索，不是投資建議。", "en": "AVITA Medical works in regenerative medicine for burns and skin defects. Its RECELL system takes a small piece of the patient's own skin and prepares a sprayable cell suspension in the operating room to cover large wound areas. It is neglected because the market capitalisation is only about $250 million and the company has lost money for years, putting it below most institutional screens. What is changing is the income statement: second-quarter revenue was $21.7 million, up 18% year over year and 13% sequentially, with a record 81.9% gross margin, operating expenses down 6% to $24.6 million, and net loss narrowing to $7.66 million from $9.92 million. Full-year revenue guidance was raised to $86 million to $89 million, growth of 20% to 24%, with cash flow breakeven expected in the fourth quarter. Risks: it is still lossmaking, revenue is concentrated in the single RECELL line at $18.5 million in the quarter, and a change in medical device reimbursement can move the whole company. Cash flow breakeven is management's expectation, not yet a fact. A research lead, not investment advice.", "url": "https://www.stocktitan.net/news/RCEL/avita-medical-reports-second-quarter-results-raises-2026-revenue-lhw09rishnpf.html", "status": "RADAR · 下一個驗證點 Q4 現金流是否真的達成損益兩平", "stocks": [{"t": "RCEL", "n": "Q2 營收 2,170 萬 +18%、毛利率 81.9% 創高，全年指引上修至 8,600-8,900 萬"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "私募信貸", "color": "#C9A227", "zh": "Trinity Capital 是一家商業發展公司，專門借錢給成長期的科技與生技新創，並常搭配認股權證。它被忽視的理由是市值只有約 5.8 億美元，這個類別本身也少有媒體聲量，多數投資人只看它的殖利率、不看資產品質。正在改變的是規模與獲利：第二季淨投資收益創紀錄達 4,600 萬美元、每股 0.51 美元、年增 32.1%；總投資收益年增 25.5%；單季新增投資 6.19 億美元、年增 69%；淨資產總額季增 9%、年增 37% 至 13 億美元，每股淨值升到 13.47 美元；平均股東權益報酬率 15.2%。風險必須誠實看：每股盈餘從 0.63 降到 0.49，代表股數擴張稀釋了獲利；商業發展公司的核心風險是借款人違約，而它的借款人正是最吃資金環境的成長期公司；外部管理架構的費用結構也需要拆開檢查。這是研究線索，不是投資建議。", "en": "Trinity Capital is a business development company that lends to growth-stage technology and life science companies, often with warrants attached. It is neglected because its market capitalisation is only about $580 million and the category itself gets little press, with most investors looking at the yield rather than the asset quality. What is changing is scale and earnings: record second-quarter net investment income of $46.0 million, or $0.51 per share, up 32.1% year over year; total investment income up 25.5%; record originations of $619 million, up 69%; net assets up 9% sequentially and 37% year over year to $1.3 billion, with net asset value per share rising to $13.47 and return on average equity of 15.2%. The risks deserve honesty: EPS fell to $0.49 from $0.63, meaning share issuance diluted earnings; the core risk in any BDC is borrower default, and these borrowers are precisely the growth-stage companies most exposed to the funding environment; and the external management fee structure needs unpacking. A research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001786108/000119312526333904/trin-ex99_1.htm", "status": "RADAR · 下一個驗證點 Q3 財報，看不良資產比率與每股淨值能否同步守住", "stocks": [{"t": "TRIN", "n": "Q2 淨投資收益創紀錄 4,600 萬、每股淨值升至 13.47，但 EPS 從 0.63 降到 0.49"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "zh": "池內的 Amplify Energy 今天有一個外部環境的更新值得記下。這家微型油氣生產商在 8 月 6 日授權了最高 1,500 萬美元的庫藏股，以當時股價計約當流通在外股數的一成——這個比例在小型股裡是強烈訊號，執行期間到 2026 年 12 月 31 日。而週一布蘭特原油升破 90 美元、能源類股寫下連續 14 週上漲的紀錄，等於把它入池時的順風又推強了一階。但反方證據沒有消失：2026 上半年營收 9,020 萬美元（去年同期 1.404 億）、淨損 2,080 萬美元，其中 3,680 萬來自商品衍生品損失——它的避險部位在油價上漲時反而是拖累，營運現金流也從 4,920 萬掉到 730 萬。油價漲對它究竟是不是好事，取決於避險部位什麼時候到期。這是研究線索，不是投資建議。", "en": "Amplify Energy, already in the pool, gets an external-environment update worth recording today. This micro-cap oil and gas producer authorised up to $15 million of buybacks on August 6 — roughly 10% of shares outstanding at the price then, which is a strong signal at this size — running to December 31, 2026. Monday's move in Brent above $90 and the energy sector's record 14-week winning streak strengthen the tailwind that existed when it entered the pool. But the bear case has not gone away: first-half 2026 revenue was $90.2 million against $140.4 million a year earlier, with a net loss of $20.8 million including $36.8 million of commodity derivative losses — its hedges become a drag when crude rises — and operating cash flow fell from $49.2 million to $7.3 million. Whether higher oil is actually good for this company depends on when those hedges roll off. A research lead, not investment advice.", "url": "https://www.globenewswire.com/news-release/2026/08/10/3342248/18120/en/amplify-energy-announces-second-quarter-2026-results-and-ap", "status": "RADAR · 下一個驗證點 2026-12-31 前庫藏股的實際執行股數與均價", "stocks": [{"t": "AMPY", "n": "8/6 授權 1,500 萬美元庫藏股約當一成股本，但上半年淨損 2,080 萬"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "本週驗證", "color": "#C9A227", "zh": "池內最資深的名字 Movado Group 這週要交卷了。它是手錶與珠寶品牌集團，自有 Movado、Ebel，並生產 Coach、Tommy Hilfiger、Lacoste、HUGO 等授權錶。被忽視的理由是鐘錶這個產業冷門、分析師覆蓋極少、媒體聲量近乎零。入池論點是帳上約 2.3 億美元現金且幾乎無淨負債、FY2026 第一季每股盈餘年增 417%、以及去年 7 月新簽的 Kate Spade 全球授權。要提醒的是財報日期在公開行事曆上仍有分歧，一說 8 月 20 日、一說 8 月 27 日，以公司正式公告為準。風險：Kate Spade 的第一個系列要到 2027 年春季才出貨，若市場先前已把它當成近期利多定價，這一季的財報反而可能是預期修正的時點；管理層也因關稅不確定性至今未給 FY2027 財測。這是研究線索，不是投資建議。", "en": "Movado Group, the longest-standing name in the pool, reports this week. It is a watch and jewellery group that owns Movado and Ebel and produces licensed watches for Coach, Tommy Hilfiger, Lacoste and HUGO. It is neglected because watches are an unfashionable industry with minimal analyst coverage and almost no media volume. The original thesis rested on roughly $230 million of cash with almost no net debt, first-quarter FY2026 EPS up 417% year over year, and the Kate Spade global licence signed last July. Note that public calendars still disagree on the reporting date — some list August 20, others August 27 — so the company's own announcement governs. Risks: the first Kate Spade collection does not ship until spring 2027, so if the market has already priced that licence as a near-term positive, this quarter could be where expectations get revised down. Management has also declined to give FY2027 guidance because of tariff uncertainty. A research lead, not investment advice.", "url": "https://stockanalysis.com/stocks/mov/statistics/", "status": "RADAR · 下一個驗證點 本週財報（8/20 或 8/27，以公司公告為準）", "stocks": [{"t": "MOV", "n": "本週交卷，Kate Spade 授權首個系列要到 2027 春季才出貨"}]},
    {"id": "radar_6", "channel": "忽視雷達", "tag": "利率逆風", "color": "#C9A227", "zh": "池內的 Walker & Dunlop 今天遇到最直接的逆風。它做的是商用不動產金融——承作多戶型住宅與商用房貸，賣給房利美、房地美與 HUD，並保留服務權。入池論點是第二季 GAAP 每股盈餘 0.09 美元、年減 91%，但其中含 2,320 萬美元來自少數詐欺型貸款發起人留下的舊有賠付與回購費用，剝掉之後調整後核心每股盈餘為 1.19 美元——市場只看頭條數字就把它濾掉了。今天要記下的是：三十年期公債殖利率升到 5.31%、創 2007 年 6 月以來新高，而商用不動產的信用曝險與交易量都綁在長端利率上，這條逆風不會因為一次性費用消失而消失。風險：總營收仍年減 4% 至 3.067 億美元，市佔提升發生在一個縮小的市場裡；詐欺案清理的終點是管理層自己的估計、不是確定事項。這是研究線索，不是投資建議。", "en": "Walker & Dunlop, already in the pool, ran into its most direct headwind today. The business is commercial real estate finance — originating multifamily and commercial mortgages for sale to Fannie Mae, Freddie Mac and HUD while retaining servicing rights. The thesis was that second-quarter GAAP EPS of $0.09, down 91% year over year, contained $23.2 million of legacy indemnification and repurchase costs from a handful of previously identified fraudulent loan originators; strip those out and adjusted core EPS was $1.19. The market screened it out on the headline number alone. What to record today: the 30-year Treasury yield rose to 5.31%, the highest since June 2007, and both commercial real estate credit exposure and transaction volumes are tied to the long end. That headwind does not disappear when the one-off charges do. Risks: total revenue still fell 4% to $306.7 million, so share gains are happening in a shrinking market, and the end of the fraud clean-up is management's own estimate rather than a certainty. A research lead, not investment advice.", "url": "https://www.stocktitan.net/news/WD/walker-dunlop-reports-second-quarter-2026-financial-4p5k8fl8fr83.html", "status": "RADAR · 下一個驗證點 Q3 財報，看被回購貸款餘額能否從 1.933 億續降", "stocks": [{"t": "WD", "n": "調整後核心 EPS 1.19 vs GAAP 0.09，但三十年期殖利率 5.31% 是直接逆風"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "執行長買進", "color": "#6DB56D", "zh": "英特爾執行長陳立武上週以每股 95 美元買進 105,263 股，金額約 1,000 萬美元，持股增至約 133 萬股，消息揭露後股價週一上漲約 1.5%。大型股的執行長用自有資金在公開市場買進本來就罕見，訊號價值高於選擇權行權或股票獎酬。但判讀時要多做一件事：把買進金額除以他既有的總持股與年度薪酬。在英特爾這種規模的公司，1,000 萬美元對執行長個人資產的佔比，決定了這筆買進是「表態」還是「押注」——兩者的資訊含量差很多。", "en": "Intel chief executive Lip-Bu Tan bought 105,263 shares at $95 apiece last week, about $10 million, lifting his beneficial ownership to roughly 1.33 million shares. The stock rose about 1.5% on Monday after the disclosure. A large-cap CEO buying on the open market with personal cash is genuinely rare, and carries more signal than option exercises or equity awards. But the reading requires one extra step: divide the purchase by his existing holding and his annual compensation. At a company of Intel's size, what $10 million represents as a share of the CEO's personal wealth determines whether this is a statement or a bet — and those carry very different information content.", "url": "https://www.benzinga.com/trading-ideas/movers/26/08/61249603/quick-spark-intel-stock-rises-after-ceo-spends-10-million-on-shares", "stocks": [{"t": "INTC", "n": "執行長以 95 美元買進 105,263 股約 1,000 萬美元，持股增至約 133 萬股"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "13F 揭露", "color": "#6DB56D", "zh": "第二季 13F 在 8 月 14 日集中揭露，波克夏是焦點。截至 6 月底其美股組合價值約 2,993 億美元，高於前一季的 2,631 億。動作集中在兩個方向：Alphabet 加碼約 2,450 萬股，持股市值升到 282 億美元、季增 45%；金融股則明顯減碼，美國銀行減持 3,020 萬股、第一資本砍掉約 58%。這是巴菲特卸任執行長後、由 Abel 主導的第二個完整季度，調整節奏明顯加快。判讀提醒：13F 是落後 45 天的快照，只揭露多頭部位、不含放空與債券，不能當即時訊號用。", "en": "Second-quarter 13F filings landed together on August 14, with Berkshire Hathaway the focus. Its U.S. equity portfolio was worth about $299.3 billion at the end of June, up from $263.1 billion a quarter earlier. The moves ran in two directions: Alphabet was increased by roughly 24.5 million shares, taking the stake to $28.2 billion, a 45% rise in value, while financials were cut sharply, with Bank of America down 30.2 million shares and Capital One reduced about 58%. This is the second full quarter run by Greg Abel since Buffett stepped down as chief executive, and the pace of change has clearly picked up. Reading rule: a 13F is a 45-day-old snapshot that shows long positions only, excluding shorts and bonds, so it is not a real-time signal.", "url": "https://www.benzinga.com/trading-ideas/long-ideas/26/08/61187293/berkshire-hathaway-13f-preview-what-stock-moves-did-buffett-successor-greg-abel-make", "stocks": [{"t": "BRK.B", "n": "美股組合升至約 2,993 億美元，Abel 主導後調整節奏加快"}, {"t": "GOOGL", "n": "波克夏加碼約 2,450 萬股，持股市值升至 282 億美元、季增 45%"}, {"t": "BAC", "n": "遭減持 3,020 萬股，金融股是本季最明顯的減碼方向"}]},
    {"id": "insider_3", "channel": "內部人動向", "tag": "買賣比例", "color": "#6DB56D", "zh": "內部人數據最容易被誤讀的一點是分母。以 8 月上旬的追蹤區間為例，整體樣本裡有 1,910 筆公開市場賣出、卻只有 40 筆買進，比例接近 48 比 1；同期只有兩家公司出現九十天內的群聚買進，其中台積電有三位不同的內部人買進。這代表「有人買進」本身不稀奇，稀奇的是「同一家公司多人同時買進」。池內的 Lumen 就屬於單人買進的類型——執行長 8 月 6 日買進 10 萬股、約 61 萬美元，訊號存在，但還缺第二位跟進者。", "en": "The easiest way to misread insider data is to ignore the denominator. Over an early-August tracking window, the sample contained 1,910 open-market sales against just 40 purchases — close to 48 to one. In the same period only two companies showed a cluster buy within 90 days, and one of them, Taiwan Semiconductor, had three distinct insider buyers. So the fact that someone bought is unremarkable; what is remarkable is several people at the same company buying at once. Lumen, already in the pool, is the single-buyer type: its chief executive bought 100,000 shares for about $612,000 on August 6. The signal exists, but a second buyer has yet to follow.", "url": "https://www.stockinsider.io/", "stocks": [{"t": "TSM", "n": "追蹤區間內唯二出現群聚買進的公司之一，有三位不同內部人買進"}, {"t": "LUMN", "n": "池內標的，執行長 8/6 買進 10 萬股約 61 萬美元，尚無第二位跟進"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "總經行事曆", "color": "#C97DD4", "zh": "本週的總經行事曆前輕後重。週三（8/19）是全週最大的單一變數——七月 28 至 29 日 FOMC 的會議紀要，市場要從措辭裡判斷那三張升息異議票背後究竟有多少支持；同一天還有七月建照與新屋開工。週四之後登場的是傑克森霍爾全球央行年會，並有每週初領失業金人數、費城聯儲製造業指數，以及 S&P Global 製造與服務業 PMI 初值。整週沒有 CPI 或 PCE，定價權因此落在會議紀要與央行官員的發言上。", "en": "This week's macro calendar is back-loaded. Wednesday (8/19) carries the single biggest variable — the minutes of the July 28-29 FOMC meeting, from which markets will try to judge how much support sat behind those three hawkish dissents — along with July building permits and housing starts. From Thursday onwards comes the Jackson Hole central banking symposium, plus weekly initial jobless claims, the Philadelphia Fed manufacturing index and flash S&P Global manufacturing and services PMIs. There is no CPI or PCE this week, so pricing power rests on the minutes and on what central bankers say.", "url": "https://www.newsquawk.com/headlines/newsquawk-weekly-economic-calendar---17th-21st-august-2026", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，會議紀要與傑克森霍爾發言是本週長端殖利率的主驅動"}, {"t": "XHB", "n": "住宅營建 ETF，週三的建照與新屋開工是其最直接的基本面數據"}]},
    {"id": "week_2", "channel": "本週事件", "tag": "零售財報週", "color": "#C97DD4", "zh": "本週三家零售龍頭連續交卷，而且報的正是七月零售銷售下滑的那一段時間。Home Depot 今天（8/18）盤前打頭陣，市場預估每股盈餘 4.73 美元；Target 與 Lowe's 都排在週三（8/19）；Walmart 週四（8/20）壓軸。Walmart 過去 16 季有 15 季超越市場預期，所以它的財測比財報本身更有訊號價值。這三份財報會一起回答同一個問題：七月的零售銷售下滑，是全體消費者在退，還是只有中小型零售商在退。", "en": "Three retail bellwethers report in succession this week, covering exactly the stretch in which July retail sales declined. Home Depot goes first, before the open today (8/18), with consensus EPS of $4.73. Target and Lowe's both report Wednesday (8/19). Walmart closes the group on Thursday (8/20). Walmart has beaten estimates in 15 of the past 16 quarters, which makes its guidance more informative than the print itself. Together these three answer one question: was July's retail sales decline the whole consumer pulling back, or only smaller retailers losing ground?", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262110009-weekly-preview-fed-walmart-target-home-depot-earnings-us-consumer-tradingkey", "stocks": [{"t": "HD", "n": "8/18 盤前，預估每股 4.73 美元，裝修需求對應房市週期"}, {"t": "TGT", "n": "8/19 公布，可選消費曝險最高，是三家中壓力最大的一家"}, {"t": "LOW", "n": "8/19 公布，與 Home Depot 同業，可分辨行業問題或公司問題"}, {"t": "WMT", "n": "8/20 壓軸，過去 16 季有 15 季超預期，財測比財報更有訊號價值"}]},
    {"id": "eval_1", "channel": "今日評估", "tag": "今日評估", "color": "#E8A838", "zh": "今天最值得注意的一件事，是「油價與長端殖利率同向上行」這個組合。布蘭特站上 90 美元、三十年期殖利率創 2007 年 6 月以來新高的 5.31%，一個推升企業成本、一個推升折現率，理論上這是對股票估值最不友善的搭配。但標普 500 只跌了 0.5%，羅素 2000 也還在歷史高點附近，市場顯然把這兩件事都當成暫時性的。開放式問題：如果布蘭特在 90 美元以上停留一整個季度、而三十年期殖利率守在 5.3% 之上，你認為第一個被迫重新定價的會是哪一類資產——高本益比的成長股、吃浮動利率的小型股，還是靠殖利率吸引資金的不動產信託與公用事業？", "en": "The most notable thing today is the combination of oil and long-end yields rising together. Brent above $90 and the 30-year yield at 5.31%, its highest since June 2007 — one lifts corporate costs, the other lifts the discount rate. In theory that is the least friendly pairing there is for equity valuations. Yet the S&P 500 fell only 0.5% and the Russell 2000 remains near record highs, so the market is evidently treating both as temporary. The open question: if Brent stays above $90 for a full quarter and the 30-year holds above 5.3%, which asset class gets repriced first — high-multiple growth stocks, floating-rate-exposed small caps, or the REITs and utilities that attract money on yield?", "url": "https://www.cnbc.com/2026/08/17/treasury-yields-federal-reserve-fomc-minutes.html", "status": "油價與長端利率雙升，估值的兩條壓力線同時收緊", "stocks": [{"t": "SPY", "n": "標普 500 ETF，在雙重壓力下只跌 0.5%，市場視為暫時性"}, {"t": "IWM", "n": "羅素 2000 ETF，浮動利率債務比重高，是利率壓力的第一線"}]}
];

// 內容指紋:CARDS 一換(每日排程更新)就變,閱讀進度 key 跟著換 → 新的一天自動從第 1 張開始讀。

const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");

  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;

})();

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

// ===== 資金流向(TradingView 官方嵌入元件,即時資料,每日排程不需更新) =====
function HeatmapView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",
        blockSize: "market_cap_basic", blockColor: "change",
        locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true,
        hasSymbolTooltip: true, isMonoSize: false,
        width: "100%", height: "100%"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 10px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>S&P 500 · 即時資金流向</span>
        <a href="https://finviz.com/map?t=sec&st=d1" target="_blank" rel="noopener noreferrer" className="source-link">Finviz 完整版 ↗</a>
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ flex:1, minHeight:0 }} />
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/18/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v7.9</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
