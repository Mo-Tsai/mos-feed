<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
  ja: { locale:'ja-JP', lsKey:'mf_azureVoice_ja', fallback:'ja-JP-NanamiNeural',     styleKey:'mf_azureStyle_ja',
        sysVoices:["Microsoft Nanami Online (Natural) - Japanese (Japan)","Google 日本語","Kyoko","O-ren"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : lang === "ja" ? "ja" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  if (L === "ja") return card.ja || card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
async function azureSpeak(text, { rate='0%', speakLang='en', onStart, onEnd, onError }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  if (!key) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const token = await _getAzToken(key, region, ctrl.signal);
    const style = localStorage.getItem(conf.styleKey) || '';
    const useStyle = style && STYLE_VOICES.has(voice);
    const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
    const inner = `<prosody rate='${rate}'>${body}</prosody>`;
    const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
    // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
    const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
    const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${styled}</voice></speak>`;
    const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method:'POST', signal:ctrl.signal,
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
      body:ssml
    });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (ctrl.signal.aborted) return true;
    const url = URL.createObjectURL(blob);
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) onEnd(); };
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    { "id": "overnight_0", "channel": "隔夜盤勢", "tag": "道瓊54000", "color": "#E05C5C", "stocks": [ { "t": "SPY", "n": "標普500 ETF，+1.79% 收 7,736.52 創高" }, { "t": "DIA", "n": "道瓊 ETF，+907 點首度站上 54,000" }, { "t": "QQQ", "n": "那斯達克100，+2.59% 收 26,584.99" } ], "en": "Wall Street closed at records Tuesday. The S&P 500 jumped 1.79% to 7,736.52 — its first record high in two months — while the Dow added 907.47 points (+1.71%) to 54,085.88, closing above 54,000 for the first time ever. The Nasdaq led with +2.59% to 26,584.99. Two engines: hopes of a US-Iran deal to reopen the Strait of Hormuz, and an earnings season that keeps beating.", "zh": "週二華爾街收在紀錄高點。標普 500 大漲 1.79% 至 7,736.52，是兩個月來首度創高；道瓊加 907.47 點(+1.71%)至 54,085.88，史上第一次收在 54,000 之上；那斯達克領軍飆 2.59% 收 26,584.99。兩具引擎：美伊可能達成重開荷莫茲海峽協議的預期，加上持續超預期的財報季。", "ja": "火曜のウォール街は最高値引け。S&P500は1.79%高の7,736.52で2カ月ぶりの最高値、ダウは907.47ポイント高（+1.71%）の54,085.88で初めて54,000台を維持。ナスダックは2.59%高の26,584.99で牽引。エンジンは二つ——ホルムズ海峡再開に向けた米イラン合意期待と、上振れが続く決算シーズン。", "url": "https://us.cnn.com/2026/08/04/investing/us-stock-market" },
    { "id": "overnight_1", "channel": "隔夜盤勢", "tag": "個股主角", "color": "#E05C5C", "stocks": [ { "t": "PLTR", "n": "Q2 營收年增 93%，單日飆 29%" }, { "t": "CAT", "n": "Q2 超預期並上調營收成長指引，道瓊最大漲幅" } ], "en": "Two names did most of the heavy lifting. Palantir ripped 29% after Q2 revenue rose 93% to $1.94B, with US commercial up 149% and management delivering its largest-ever guidance raise (FY26 revenue now ~$8.15B). Caterpillar was the Dow's biggest gainer after beating on Q2 and lifting its revenue-growth outlook. Note what they have in common: not a beat, but a raise.", "zh": "兩檔個股扛起大半漲幅。Palantir 單日飆 29%，因為第二季營收年增 93% 至 19.4 億美元、美國商用部門更暴增 149%，管理層端出史上最大幅度的財測上修(全年營收上看約 81.5 億)。Caterpillar 則以超預期財報與上調營收成長展望成為道瓊最大漲幅股。注意兩者的共通點：讓股價動的不是超預期，是上修。", "ja": "主役は二銘柄。Palantirは第2四半期売上が93%増の19.4億ドル、米商用は149%増、通期見通しを過去最大幅に引き上げ（約81.5億ドル）で29%高。キャタピラーは第2四半期の上振れと売上成長見通しの引き上げでダウ最大の上昇。共通点は「上振れ」ではなく「引き上げ」だ。", "url": "https://www.cnbc.com/2026/08/03/palantir-pltr-earnings-q2-2026.html" },
    { "id": "overnight_2", "channel": "隔夜盤勢", "tag": "油殺債高", "color": "#E05C5C", "stocks": [ { "t": "USO", "n": "原油 ETF，WTI 跌逾 5% 至約 76 美元" }, { "t": "TLT", "n": "20年期公債 ETF，長端殖利率 5.20% 壓著它" }, { "t": "GLD", "n": "黃金 ETF，約 4,111 美元在高殖利率下承壓" } ], "en": "Commodities and rates told a more complicated story than stocks. WTI fell more than 5% to about $76 after Treasury Secretary Bessent floated a Hormuz deal within days. But the 30-year Treasury yield sat at 5.20% — near the 5.28% touched July 31, the highest zone since 2007 — and gold slipped to around $4,111 as real yields squeezed non-yielding assets. Cheaper oil helps inflation; expensive money still bites.", "zh": "商品與利率講的故事比股市複雜。WTI 在財政部長 Bessent 放話「幾天內可能達成荷莫茲協議」後重挫逾 5% 至約 76 美元。但 30 年期公債殖利率停在 5.20%，逼近 7/31 觸及的 5.28%——2007 年以來最高區間；黃金則滑到約 4,111 美元，因為高殖利率壓抑不生息資產。油價便宜對通膨是好事，資金昂貴這件事還沒解決。", "ja": "商品と金利は株より複雑な話をしている。ベッセント財務長官が数日内のホルムズ合意に言及し、WTIは5%超安の約76ドル。だが30年債利回りは5.20%——7/31に付けた5.28%（2007年以来の高水準帯）に近い。金は実質金利に押され約4,111ドルへ。原油安はインフレに効くが、資金の高さは残る。", "url": "https://www.thenationalnews.com/business/energy/2026/08/03/oil-prices-slump-on-potential-us-iran-deal-to-open-strait-of-hormuz/" },
    { "id": "overnight_3", "channel": "隔夜盤勢", "tag": "廣度檢查", "color": "#E05C5C", "stocks": [ { "t": "RSP", "n": "等權重標普，檢查漲勢是否只靠權值股" }, { "t": "IWM", "n": "羅素2000，廣度真偽的第二個溫度計" } ], "en": "Structure check on a record day: this rally has two legs — geopolitical de-escalation and an earnings season where over 84% of reporters have beaten. Both are event-driven, not structural. The honest test of breadth is whether equal-weight and small caps keep pace with the cap-weighted index; when they lag, a record close is a handful of names, not a market. And with the long bond at 5.20%, the bond market clearly isn't celebrating.", "zh": "創高日的結構檢查：這波漲勢有兩條腿——地緣降溫與超過 84% 公司超預期的財報季，兩者都是事件驅動、不是結構性的。廣度的誠實測試，是等權重指數與小型股能不能跟上市值加權指數；跟不上時，所謂創高就只是幾檔股票、不是整個市場。而長天期公債停在 5.20%，債市顯然沒有在慶祝。", "ja": "最高値の日の構造チェック：今回のラリーの足は二本——地政学的緊張緩和と、8割超が上振れる決算。いずれもイベント駆動で構造的ではない。裾野の正直な検査は、等ウェイトと小型株が時価総額加重に付いていけるか。付いていけないなら最高値は数銘柄の話だ。長期債5.20%が示す通り、債券市場は祝っていない。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-4-2026" },
    { "id": "earn_0", "channel": "財報速報", "tag": "超預期還跌", "color": "#E8786A", "stocks": [ { "t": "AMD", "n": "Q2 EPS 1.66、營收 115 億雙超預期，盤後仍跌逾 8%" }, { "t": "SMH", "n": "半導體 ETF，高預期族群的整體溫度計" } ], "en": "AMD beat on both lines — Q2 EPS of $1.66 on revenue of $11.5B — and guided Q3 above consensus. The stock still fell more than 8% after hours. SpaceX, reporting its first-ever quarter, posted revenue of $7.8B versus $6.81B expected and adjusted EBITDA of $3.5B versus $2.0B, and also traded lower. The lesson of this season: for names carrying premium multiples, beating is the price of admission, not a catalyst.", "zh": "AMD 上下都超預期——第二季 EPS 1.66 美元、營收 115 億美元，第三季指引也優於市場——股價盤後照樣跌逾 8%。首度公布季報的 SpaceX 也是：營收 78 億(預期 68.1 億)、調整後 EBITDA 35 億(預期 20 億)，股價一樣往下。這個財報季的教訓是：對高估值的股票，超預期只是入場費，不是催化劑。", "ja": "AMDは上下ともに上振れ——第2四半期EPS1.66ドル、売上115億ドル、第3四半期見通しも予想超——それでも時間外で8%超下落。初の四半期開示となったSpaceXも売上78億ドル（予想68.1億）、調整後EBITDA35億ドル（予想20億）で株価は下落。今季の教訓：高倍率銘柄にとって上振れは入場料であって触媒ではない。", "url": "https://finance.yahoo.com/technology/live/tech-stocks-today-spacex-amd-to-report-earnings-after-the-bell-140419479.html" },
    { "id": "earn_1", "channel": "財報速報", "tag": "今晨盤前", "color": "#E8786A", "stocks": [ { "t": "DIS", "n": "會計年度 Q3，預估 EPS 1.88(+16.8%)、營收 254 億" }, { "t": "UBER", "n": "預估 EPS 0.62、營收 124.6 億，消費需求指標" } ], "en": "This morning's pre-open slate is the consumer read of the week. Disney reports fiscal Q3 with consensus at $1.88 adjusted EPS (+16.8% year-over-year) and revenue up more than 7% to $25.4B — which would be its strongest top-line growth in over three years. Uber is expected at $0.62 EPS on $12.46B. Between streaming, parks and mobility, these two say more about the actual US consumer than any survey this week.", "zh": "今晨盤前這批財報是本週的消費溫度計。迪士尼公布會計年度第三季，市場預估調整後 EPS 1.88 美元(年增 16.8%)、營收年增逾 7% 至 254 億美元——若達成將是三年多來最強的營收成長。Uber 預估 EPS 0.62 美元、營收 124.6 億美元。串流、樂園加上叫車，這兩家講的美國消費真相，比本週任何一份問卷都準。", "ja": "今朝の寄り前決算は今週の消費体温計。ディズニーは会計年度第3四半期で、調整後EPS予想1.88ドル（前年比+16.8%）、売上は7%超増の254億ドル——実現すれば3年超で最強の増収。Uberは EPS0.62ドル、売上124.6億ドルが予想。配信・パーク・モビリティ、この2社は今週のどの調査より米消費の実像を語る。", "url": "https://finance.yahoo.com/markets/stocks/articles/know-ahead-walt-disneys-earnings-150336875.html" },
    { "id": "earn_2", "channel": "財報速報", "tag": "獎懲不對稱", "color": "#E8786A", "stocks": [ { "t": "MCD", "n": "財報透出低端消費疲軟，市場選擇忽略" }, { "t": "XLY", "n": "非必需消費 ETF，低端疲軟的傳導路徑" } ], "en": "More than 84% of S&P 500 companies that have reported have beaten — but the reward structure is lopsided. Beats get shrugged at (AMD down 8%), misses get punished hard, and soft signals get ignored entirely: McDonald's flagged weakness at the low end of the consumer and the market largely moved on. When an index is making records, bad news gets discounted. That asymmetry is itself a late-cycle tell worth noting.", "zh": "已公布的標普 500 公司超過 84% 勝出——但獎懲結構是歪的。超預期被聳肩帶過(AMD 跌 8%)，未達標被重罰，而疲弱訊號則直接被無視：麥當勞財報透露低端消費疲軟，市場基本上略過不理。當指數在創高時，壞消息會被折價。這種不對稱本身就是值得記下的循環後段跡象。", "ja": "S&P500の発表済み企業の84%超が上振れ——だが報酬構造は歪んでいる。上振れは肩をすくめられ（AMDは8%安）、未達は厳しく罰され、弱いシグナルは無視される：マクドナルドは低所得層の消費の弱さを示したが市場はほぼ素通り。指数が最高値を更新する局面では悪材料は割り引かれる。この非対称性こそ、サイクル後半の兆候だ。", "url": "https://www.cnbc.com/2026/08/03/stock-market-today-live-updates.html" },
    { "id": "macro_0", "channel": "總經政策", "tag": "升息定價", "color": "#7C6AF7", "stocks": [ { "t": "TLT", "n": "長天期公債，升息定價下最直接受壓" }, { "t": "KRE", "n": "區域銀行 ETF，利率路徑的傳導端" } ], "en": "The Fed held at 3.50–3.75% in July for a fifth straight meeting — but three FOMC members dissented in favor of a 25bp HIKE. CME FedWatch now shows roughly a 29.4% chance of a hike at the late-August meeting and about a 67.5% market-implied probability of at least one hike sometime in 2026, with June CPI at 3.5% year-over-year. The debate is no longer when cuts come; it is whether tightening resumes.", "zh": "Fed 七月連續第五次維持 3.50-3.75%——但有三位 FOMC 委員投下異議票，主張升息 1 碼。CME FedWatch 目前顯示八月底會議升息機率約 29.4%，2026 年內至少升息一次的市場隱含機率約 67.5%，而六月 CPI 年增 3.5%。辯論的題目已經不是降息什麼時候來，而是升息會不會重啟。", "url": "https://centralbank.watch/federal-reserve/", "ja": "Fedは7月、5会合連続で3.50〜3.75%を据え置き——ただしFOMCの3人が25bpの「利上げ」を主張して反対票。CME FedWatchでは8月末会合の利上げ確率が約29.4%、2026年中に少なくとも1回の利上げが起きる市場織り込みは約67.5%。6月CPIは前年比3.5%。論点はもはや「いつ利下げか」ではなく「利上げが再開するか」だ。" },
    { "id": "macro_1", "channel": "總經政策", "tag": "長端5.2", "color": "#7C6AF7", "stocks": [ { "t": "VNQ", "n": "不動產 ETF，長端殖利率的最大受害族群" }, { "t": "GLD", "n": "黃金，6 月 ETF 資金流出 89 億美元" } ], "en": "Six years into a bond bear market, the 30-year Treasury yield hit 5.28% on July 31 and sits at 5.20% now — the strongest 30-year auction yield since 2007 came in July at 5.058%. The curve is steepening. This is the single most important number for anything with duration: REITs, utilities, long-dated growth, and gold, which saw $8.9B of ETF outflows in June. Equities can rally; the cost of capital has not come down.", "zh": "債券熊市進入第六年，30 年期公債殖利率 7/31 觸及 5.28%、目前停在 5.20%——七月的 30 年期標售得標利率 5.058%，是 2007 年以來最強。殖利率曲線正在陡化。這是所有「長天期資產」最重要的一個數字：REIT、公用事業、長期成長股，還有黃金——六月黃金 ETF 流出 89 億美元。股市可以漲，但資金成本沒有降下來。", "ja": "債券ベア6年目、30年債利回りは7/31に5.28%を付け現在5.20%。7月の30年入札利回り5.058%は2007年以来の高さ。カーブはスティープ化。これはデュレーションを持つ全資産にとって最重要の数字だ——REIT、公益、長期グロース、そして6月に89億ドルのETF流出を見た金。株は上がれても、資本コストは下がっていない。", "url": "https://wolfstreet.com/2026/08/01/six-years-into-bond-bear-market-30-year-treasury-yield-hits-5-28-yield-curve-steepens-but-spreads-are-still-too-narrow/" },
    { "id": "macro_2", "channel": "總經政策", "tag": "油價變數", "color": "#7C6AF7", "stocks": [ { "t": "USO", "n": "原油 ETF，通膨路徑的即時投票器" }, { "t": "XLE", "n": "能源類股，談判成敗的直接對賭標的" } ], "en": "Falling oil is the market's pressure valve on inflation — and it is entirely conditional. The Strait of Hormuz remains largely closed, tankers are still being attacked and turned back, and Iran denies direct talks are underway even as it says Oman-mediated discussions are progressing. If the deal lands, the disinflation trade extends. If it collapses, energy prices reprice the Fed's whole problem overnight. Two dates gate the rest: August 7 payrolls, August 12 CPI.", "zh": "油價下跌是市場對通膨的減壓閥——而且完全是有條件的。荷莫茲海峽目前仍大致封閉、油輪仍被攻擊與攔回，伊朗否認有直接談判、只承認經阿曼斡旋的討論有進展。協議若成，反通膨交易延續；若破局，能源價格會在一夜之間把 Fed 的整個難題重新定價。接下來兩道關卡：8/7 非農、8/12 CPI。", "ja": "原油安はインフレに対する市場の圧力弁——そして完全に条件付きだ。ホルムズ海峡はなお概ね封鎖、タンカーは攻撃され引き返し、イランは直接協議を否定しオマーン仲介の進展のみ認める。合意すればディスインフレ取引は続き、決裂すればエネルギー価格が一夜でFedの難題を再評価する。次の関門は8/7雇用統計と8/12CPI。", "url": "https://www.aljazeera.com/economy/2026/7/14/oil-hits-1-month-high-as-us-iran-fighting-clouds-strait-of-hormuz-outlook" },
    { "id": "sector_0", "channel": "產業風向", "tag": "能源雙面", "color": "#4EABA4", "stocks": [ { "t": "XLE", "n": "能源類股 ETF，油價下跌時的直接受害者" }, { "t": "OXY", "n": "上游油商，獲利與油價正相關" }, { "t": "VLO", "n": "煉油商，原油成本下降反而是順風" } ], "en": "Energy is the sector where today's good news is bad news — and vice versa. A Hormuz deal that caps crude compresses upstream margins (Occidental and peers), while refiners like Valero benefit from cheaper feedstock. The offsetting structural leg is AI data-center power demand, which has nothing to do with the strait and everything to do with the grid. Don't treat 'energy' as one trade; upstream, refining and power are three different bets.", "zh": "能源是唯一一個「好消息就是壞消息」的板塊。荷莫茲協議若壓住油價，上游油商(如 Occidental)的獲利空間被壓縮，煉油商(如 Valero)反而因原料成本下降受惠。另一條抵銷性的結構腿是 AI 資料中心的電力需求，那跟海峽無關、只跟電網有關。不要把「能源」當成一個交易：上游、煉油、電力是三種不同的賭注。", "ja": "エネルギーは好材料が悪材料になる唯一のセクター。ホルムズ合意で原油が抑えられれば上流（オキシデンタル等）のマージンは縮小し、製油（バレロ等）は原料安の恩恵。相殺する構造的な足はAIデータセンターの電力需要で、海峡ではなく送電網の話だ。「エネルギー」を一つの取引と見ないこと。上流・製油・電力は別々の賭けだ。", "url": "https://www.vaneck.com/us/en/blogs/thematic-investing/the-state-of-us-sector-investing-in-mid-2026/" },
    { "id": "sector_1", "channel": "產業風向", "tag": "生技回春", "color": "#4EABA4", "stocks": [ { "t": "XBI", "n": "生技 ETF，年初至今約 +30%" }, { "t": "LLY", "n": "今日財報，GLP-1 龍頭的定價權檢驗" }, { "t": "NVO", "n": "同日財報，減重藥競爭的另一端" } ], "en": "Healthcare has quietly become 2026's turnaround sector. The S&P Biotechnology index is up roughly 30% year to date, and biopharma deal value topped $65B in Q1 alone with 16 transactions above $1B — the strongest quarter in years. The unresolved overhang is pricing: drugmakers raised list prices on 872 branded medicines this year, median +4%, which keeps reform risk alive. Eli Lilly and Novo Nordisk both report today; obesity remains the battleground.", "zh": "醫療保健悄悄成為 2026 年的翻身板塊。標普生技指數年初至今約漲 30%，光第一季生醫併購金額就超過 650 億美元、其中 16 筆逾 10 億——是多年來最強的一季。沒解決的懸念是藥價：今年已有 872 種品牌藥調漲定價、中位數 +4%，讓改革風險一直懸在頭上。禮來與諾和諾德今天同日公布財報，減重藥仍是主戰場。", "ja": "ヘルスケアは静かに2026年の反転セクターになった。S&Pバイオ指数は年初来約30%高、バイオ医薬のM&Aは第1四半期だけで650億ドル超・10億ドル超が16件と数年ぶりの強さ。未解決の重石は薬価——今年872の先発薬が中央値+4%の値上げを実施し、改革リスクは残る。イーライリリーとノボノルディスクが本日決算、肥満症が主戦場。", "url": "https://www.janushenderson.com/en-us/investor/article/a-mid-year-checkup-on-the-healthcare-sector/" },
    { "id": "sector_2", "channel": "產業風向", "tag": "落後補漲", "color": "#4EABA4", "stocks": [ { "t": "XLF", "n": "金融類股，估值從未被拉高的落後族群" }, { "t": "XLI", "n": "工業類股，AI 電力建置的實體受惠端" }, { "t": "GEV", "n": "電力設備，資料中心電網需求的直接標的" } ], "en": "The money is rotating into what was left behind: small caps, healthcare, financials, industrials and materials. The common thread is that the AI build-out has stopped being purely a semiconductor story and become a physical one — transformers, turbines, grid equipment, construction. Financials get a second tailwind from a steadier rate environment and multiples that never stretched. 2026 is a sector-picker's market, not a buy-the-index one.", "zh": "資金正輪動進那些被落下的地方：小型股、醫療、金融、工業與原物料。共同線索是 AI 建置已經不只是半導體故事，而變成實體的——變壓器、渦輪機、電網設備、營建。金融則多一層順風：利率環境相對穩定，而它的估值從來沒被拉高過。2026 是挑板塊的市場，不是買指數放著的市場。", "ja": "資金は取り残された領域へ輪番：小型株、ヘルスケア、金融、資本財、素材。共通の糸は、AI構築が半導体だけの話から物理的な話——変圧器、タービン、送電機器、建設——に変わったこと。金融は安定した金利環境と、そもそも伸びていない倍率という二つ目の追い風を得る。2026年は指数買いではなくセクター選択の相場だ。", "url": "https://www.investing.com/analysis/sector-rotation-intensifies-value-outperforms-growth-in-2026-market-split-200675093" },
    { "id": "small_0", "channel": "小型股風雲", "tag": "23年最強", "color": "#5B8ED6", "stocks": [ { "t": "IWM", "n": "羅素2000 ETF，年初至今約 +20-22%" }, { "t": "IJR", "n": "S&P600 小型股，品質篩選後的對照組" } ], "en": "The Russell 2000 is up roughly 20–22% in 2026 — its best start since 1991 and on pace for its strongest year since 2003. The gap is what matters: the S&P 500 has gained about 11% and the Magnificent 7 just 4%. Leadership has genuinely changed hands. The open question is whether this is a durable re-rating of neglected assets or a late-cycle chase into the highest-beta corner of the market.", "zh": "羅素 2000 今年漲約 20-22%——是 1991 年以來最強的開局，全年有機會創 2003 年來最佳。真正重要的是差距：同期標普 500 只漲約 11%，Magnificent 7 更只有 4%。領導權是真的換手了。沒答案的問題是：這究竟是被忽視資產的持久性重評價，還是循環後段對市場上最高 beta 角落的追價。", "ja": "ラッセル2000は2026年に約20〜22%高——1991年以来最良のスタートで、2003年以来最強の年になるペース。重要なのは差だ：S&P500は約11%、マグニフィセント7は4%。主導権は本当に移った。問いは、これが見過ごされた資産の持続的な再評価なのか、サイクル後半の高ベータ追いなのか。", "url": "https://247wallst.com/investing/etf/2026/07/20/the-russell-2000-is-outpacing-the-sp-500-in-2026-is-it-too-late-to-buy-small-cap-etfs/" },
    { "id": "small_1", "channel": "小型股風雲", "tag": "晶片16席", "color": "#5B8ED6", "stocks": [ { "t": "AEHR", "n": "AI 晶片老化測試設備，年內漲逾 400%" }, { "t": "ICHR", "n": "晶圓廠流體輸送系統，年內漲逾 400%" }, { "t": "MXL", "n": "高速通訊晶片，資料中心需求驅動漲逾 400%" } ], "en": "The small-cap rally has a very specific engine: chip-related names hold 16 of the Russell 2000's 50 best performers this year, and Aehr Test Systems, Ichor Holdings and MaxLinear have each rallied more than 400%. What they share is supplier positioning — they sell into the AI build-out rather than competing with Nvidia. That is the bull case and the risk in one sentence: they inherit hyperscaler capex, including when it turns.", "zh": "小型股這波有非常明確的引擎：晶片相關個股占了羅素 2000 今年前 50 強的 16 席，Aehr Test Systems、Ichor Holdings 與 MaxLinear 三檔年內都漲超過 400%。它們的共通點是供應鏈定位——賣東西給 AI 建置，而不是跟 Nvidia 正面對打。這句話同時是多方論點與風險：它們繼承超大型雲端商的資本支出，包括資本支出轉向的時候。", "ja": "小型株ラリーの原動力は明確だ：チップ関連がラッセル2000の年初来ベスト50のうち16銘柄を占め、Aehr、Ichor、MaxLinearはいずれも400%超上昇。共通点はサプライヤーの立ち位置——Nvidiaと競うのではなくAI構築に売る側だ。これは強気論であり同時にリスクでもある。ハイパースケーラーの設備投資を、その転換点も含めて引き継ぐからだ。", "url": "https://www.cnbc.com/2026/06/30/small-cap-stocks-enjoy-best-first-half-since-1991-as-ai-trade-expands.html" },
    { "id": "small_2", "channel": "小型股風雲", "tag": "品質警訊", "color": "#5B8ED6", "stocks": [ { "t": "IWO", "n": "羅素2000 成長股，不賺錢公司集中地" }, { "t": "IWN", "n": "羅素2000 價值股，獲利品質的對照組" } ], "en": "Here is the uncomfortable number inside the small-cap rally: unprofitable Russell 2000 companies have surged 154% since mid-2025, dwarfing the 34% gain of their profitable peers. Investors are paying up for AI exposure over current earnings. That ratio is the cleanest measure of how speculative this leg has become — and historically, the profitless cohort is the first to be repriced when liquidity or rate expectations turn.", "zh": "小型股這波裡有個令人不安的數字：羅素 2000 中「不賺錢」的公司自 2025 年中以來漲了 154%，遠遠甩開賺錢同儕的 34%。投資人是在為 AI 曝險付錢，而不是為當期獲利付錢。這個比值是衡量這一段有多投機最乾淨的指標——而歷史上，一旦流動性或利率預期轉向，不賺錢那一群永遠是第一個被重新定價的。", "ja": "小型株ラリーの内部にある居心地の悪い数字：ラッセル2000の赤字企業は2025年半ば以降154%上昇し、黒字企業の34%を圧倒する。投資家は現在の利益ではなくAIエクスポージャーに対価を払っている。この比率は今回の投機度を測る最も明快な指標であり、歴史的に流動性や金利観測が転じた時、最初に再評価されるのは赤字グループだ。", "url": "https://www.ibtimes.com.au/russell-2000-index-small-cap-rally-2026-1872366" },
    { "id": "small_3", "channel": "小型股風雲", "tag": "利率槓桿", "color": "#5B8ED6", "stocks": [ { "t": "IJR", "n": "S&P600，浮動利率負債曝險的代表" }, { "t": "KRE", "n": "區域銀行，小型企業信用的實際管道" } ], "en": "The knowledge card: small caps are a leveraged bet on rates, structurally. They carry more debt, more of it floating-rate, and they refinance on shorter cycles than large caps — so rate relief flows straight to the bottom line, and hikes do the reverse. With markets pricing a 67.5% chance of at least one 2026 hike, the entire small-cap thesis rests on a rate path the Fed is actively questioning. Regional banks are the transmission line — watch them, not just the index.", "zh": "補課卡：小型股在結構上就是對利率的槓桿押注。它們負債比例更高、其中浮動利率的比重更大，而且再融資週期比大型股短——所以利率一鬆，好處直接掉進損益表；利率一緊，反過來也一樣。當市場定價 2026 年至少升息一次的機率是 67.5%，整個小型股論點就押在一條 Fed 自己都在質疑的利率路徑上。區域銀行是傳導管線，要盯的不只是指數。", "ja": "知識カード：小型株は構造的に金利へのレバレッジ投資だ。負債が多く、変動金利の比率が高く、借り換えサイクルも大型株より短い。だから金利緩和は直接利益に流れ、利上げはその逆になる。市場が2026年に少なくとも1回の利上げを67.5%で織り込む中、小型株の論拠はFed自身が疑う金利経路に乗っている。伝導路は地銀——指数だけを見ていてはいけない。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html" },
    { "id": "small_4", "channel": "小型股風雲", "tag": "miss重罰", "color": "#5B8ED6", "stocks": [ { "t": "PLOW", "n": "Q2 營收 2.146 億不及 2.195 億預期，股價下跌" }, { "t": "DE", "n": "大型農機對照組，同樣景氣循環但流動性厚" } ], "en": "A concrete case of the small-cap penalty: Douglas Dynamics (PLOW), the snow-and-ice control equipment maker, grew Q2 revenue 10% year-over-year to $214.6M — and fell, because consensus was $219.5M. A large cap absorbs a 2% revenue miss; a small cap with thin institutional ownership and light liquidity gaps down on it. Same news, different market structure. Position sizing in small caps is not a detail — it is the strategy.", "zh": "小型股懲罰的具體案例：除雪與冰雪控制設備商 Douglas Dynamics(PLOW)第二季營收年增 10% 至 2.146 億美元——股價卻跌，因為市場預估是 2.195 億。大型股吸收得掉 2% 的營收缺口，一檔法人持股稀薄、流動性又薄的小型股則直接跳空下殺。同樣的消息，不同的市場結構。小型股的部位大小不是細節，那就是策略本身。", "ja": "小型株ペナルティの具体例：除雪・融雪機器のDouglas Dynamics（PLOW）は第2四半期売上が前年比10%増の2億1,460万ドル——それでも下落した。予想が2億1,950万ドルだったからだ。大型株なら2%の未達を吸収できるが、機関投資家の保有が薄く流動性の乏しい小型株はギャップダウンする。同じ材料でも市場構造が違う。小型株のポジションサイズは細部ではなく戦略そのものだ。", "url": "https://investrade.com/mid-morning-look-august-03-2026/" },
    { "id": "radar_0", "channel": "忽視雷達", "tag": "今日交卷", "color": "#C9A227", "stocks": [ { "t": "HDSN", "n": "冷媒回收再製業者，今日盤後 Q2 財報決勝" } ], "status": "RADAR · 下一個驗證點 今日(08/05)盤後 Q2 財報、美東 5:00pm 法說會", "en": "Hudson Technologies reclaims, reprocesses and resells refrigerants — the recovery side of the AIM Act's HFC phase-down. It is ignored because it is a small cap in an unglamorous niche with almost no media voice. What changed: 10% holder Hartree Partners has bought 834,986 shares over the past year with zero sales, including 65,550 shares (~$286K) on July 21; Q1 revenue of $60.15M beat the $57.15M estimate. Today decides it — consensus is $0.17 EPS on $74.2M. The risk is real: Q1 adjusted EPS was $0.01 versus $0.05 expected and management has guided to lower selling prices. Research lead, not investment advice.", "zh": "Hudson Technologies 做的是冷媒的回收、再製與銷售，站在 AIM 法案 HFC 逐步淘汰的回收端。它被忽視的原因很單純：小型股、產業冷門到近乎無人討論、媒體聲量極低。改變的是什麼：10% 大股東 Hartree Partners 過去一年買進 834,986 股且期間零賣出，7/21 又買 65,550 股(約 28.6 萬美元)；Q1 營收 6,015 萬超越 5,715 萬預期。今天就是決勝日——市場預估 Q2 EPS 0.17 美元、營收 7,420 萬。風險很實在：Q1 調整後 EPS 只有 0.01 美元(預期 0.05)，管理層並自陳 Q2 售價將低於去年。這是研究線索，不是投資建議。", "ja": "Hudson Technologiesは冷媒の回収・再生・販売を行い、AIM法のHFC段階的削減の回収側に立つ。無視される理由は単純——小型株、地味なニッチ、メディア露出がほぼ皆無。変化：10%株主Hartree Partnersが過去1年で834,986株を買い越し売却ゼロ、7/21にも65,550株（約28.6万ドル）取得。第1四半期売上6,015万ドルは予想5,715万を上回った。決着は今日——第2四半期予想はEPS0.17ドル、売上7,420万ドル。リスクも実在：第1四半期の調整後EPSは0.01ドル（予想0.05）、経営陣は第2四半期の販売価格低下を自認。これは研究の手がかりであり投資助言ではない。", "url": "https://www.stocktitan.net/news/HDSN/hudson-technologies-to-host-conference-call-to-discuss-second-nfhs4tyuiv38.html" },
    { "id": "radar_1", "channel": "忽視雷達", "tag": "同日交卷", "color": "#C9A227", "stocks": [ { "t": "ERII", "n": "海淡壓力交換器龍頭，今日盤後 Q2 財報" } ], "status": "RADAR · 下一個驗證點 今日(08/05)盤後 Q2 財報、美西 2:00pm / 美東 5:00pm 法說會", "en": "Energy Recovery makes the PX pressure exchanger, the energy-recovery core of seawater desalination, and is pushing into industrial wastewater. Ignored because project revenue is lumpy and hard to model at a single-digit share price. What changed: a large Saudi desalination contract on July 20, five Indian industrial wastewater projects, and director Colin Sabol adding $99K at $8.88 in June. But the bear case is now explicit — consensus for today is a LOSS of $0.04 on $18.36M revenue, implying a 32.9% year-over-year decline, and 2026 desalination guidance was cut below 2025. Every bull argument now rests on backlog conversion. Research lead, not investment advice.", "zh": "Energy Recovery 做的是 PX 壓力交換器——海水淡化的節能核心設備，並正往工業廢水擴張。被忽視是因為專案型營收波動大、股價又只有個位數美元，法人難建模。改變的是什麼：7/20 拿下沙烏地大型海淡案、印度五個工業廢水案，董事 Colin Sabol 六月以 8.88 美元加碼約 9.9 萬美元。但空方論點現在很明白——今日市場預估是每股虧損 0.04 美元、營收 1,836 萬，年減 32.9%，且 2026 年海淡業務指引已下修到低於 2025 年。所有多方論點現在都押在「新訂單能不能轉成營收」這一點。研究線索，不是投資建議。", "ja": "Energy Recoveryは海水淡水化の省エネ中核であるPX圧力交換器を製造し、産業排水へ展開中。プロジェクト型売上は変動が大きく、株価も一桁ドルでモデル化が難しいため無視されている。変化：7/20のサウジ大型淡水化契約、インドの産業排水5案件、6月に取締役Colin Sabolが8.88ドルで約9.9万ドル買い増し。だが弱気論は明白——本日の予想は1株0.04ドルの赤字、売上1,836万ドルで前年比32.9%減、2026年の淡水化ガイダンスは2025年を下回る水準に下方修正済み。強気論は全て受注の売上転換に懸かる。研究の手がかりであり投資助言ではない。", "url": "https://www.stocktitan.net/news/ERII/energy-recovery-to-release-second-quarter-2026-financial-s51d4hwx8k09.html" },
    { "id": "radar_2", "channel": "忽視雷達", "tag": "昨夜交卷", "color": "#C9A227", "stocks": [ { "t": "MBC", "n": "廚浴櫃體製造商，昨晚盤後公布合併後首份完整季報" } ], "status": "RADAR · 下一個驗證點 今日開盤對昨晚財報與法說會的定價", "en": "MasterBrand makes kitchen and bath cabinets and completed its all-stock merger with American Woodmark on May 28 (legacy MBC holders own about 63%). It is ignored because building products in a soft housing market is the definition of a sector nobody wants. What changed: three insiders bought in the open market within 11 days in June, including CEO R. Banyard's 60,000 shares on June 1. Results landed after yesterday's close — guidance was for net sales down mid-to-high single digits, adjusted EBITDA of $51–61M and adjusted EPS of $0.03–0.13, with consensus revenue near $743M. Today prices the merger story. Risk: Q1 adjusted EBITDA fell 58.3% and integration is colliding with a weak housing cycle. Research lead, not investment advice.", "zh": "MasterBrand 做廚房與浴室櫃體，5/28 完成與 American Woodmark 的全股交換合併(原 MBC 股東約持 63%)。它被忽視的理由很直白：房市疲軟時的建材股，是沒人想碰的板塊定義。改變的是什麼：六月十一天內有三名內部人在公開市場買進，包括執行長 R. Banyard 於 6/1 買 60,000 股。財報昨晚盤後才出爐——先前指引為營收年減中至高個位數、調整後 EBITDA 5,100-6,100 萬、調整後 EPS 0.03-0.13 美元，市場營收預估約 7.43 億。今天就是市場替這個合併故事定價的日子。風險：Q1 調整後 EBITDA 年減 58.3%，整合期正好撞上房市低迷。研究線索，不是投資建議。", "ja": "MasterBrandはキッチン・バス用キャビネットのメーカーで、5/28にAmerican Woodmarkとの全株式交換合併を完了（旧MBC株主が約63%保有）。住宅市況が弱い中の建材株は、誰も触りたがらないセクターの定義そのものだ。変化：6月の11日間に3人の内部者が市場で買い付け、6/1にはBanyard CEOが60,000株。決算は昨日引け後——ガイダンスは売上が中〜高一桁減、調整後EBITDA5,100〜6,100万ドル、調整後EPS0.03〜0.13ドル、売上予想は約7.43億ドル。今日は市場が合併ストーリーを値付けする日だ。リスク：第1四半期の調整後EBITDAは58.3%減、統合と住宅不況が同時進行。研究の手がかりであり投資助言ではない。", "url": "https://www.stocktitan.net/news/MBC/master-brand-to-announce-second-quarter-2026-results-on-august-vt7wyeb7nstt.html" },
    { "id": "radar_3", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "stocks": [ { "t": "ICFI", "n": "政府與能源顧問，董事會授權 1 億美元庫藏股(約 8.1% 流通股)" } ], "status": "RADAR · 下一個驗證點 下季財報的遞延收入與庫藏股實際執行進度", "en": "ICF International is a consulting firm serving government, energy and climate clients — steady, contract-based, and profoundly unfashionable. It is neglected because consulting has no product narrative and its Q1 miss pushed generalist funds out. What changed: on June 25 the board authorized a $100M buyback, roughly 8.1% of shares outstanding, after already repurchasing 435,000 shares for $29M between January and June; insiders have bought; guidance was reaffirmed; and it won a $14M California Department of Transportation contract. Net margin is 4.68% with 11.38% ROE. Risk: federal budget and policy exposure is the whole business, deferred revenue trends were the reason for the Q1 miss, and a buyback authorization is permission, not a promise. Research lead, not investment advice.", "zh": "ICF International 是服務政府、能源與氣候客戶的顧問公司——收入穩定、以合約為基礎，而且極度不時髦。它被忽視是因為顧問業沒有產品故事可講，Q1 財報未達標又把泛用型基金趕走。改變的是什麼：6/25 董事會授權 1 億美元庫藏股，約當流通股 8.1%，而 1 到 6 月已先買回 43.5 萬股、金額 2,900 萬美元；內部人有買進；全年指引維持；並拿下加州交通局 1,400 萬美元合約。淨利率 4.68%、ROE 11.38%。風險：聯邦預算與政策曝險就是它的全部生意，遞延收入趨勢正是 Q1 未達標的原因，而庫藏股授權是許可、不是承諾。研究線索，不是投資建議。", "ja": "ICF Internationalは政府・エネルギー・気候分野の顧客を持つコンサルティング会社——契約ベースで安定し、そして極めて地味だ。製品ストーリーがなく、第1四半期の未達で汎用ファンドが離れたことで見過ごされている。変化：6/25に取締役会が1億ドル（発行済株式の約8.1%）の自社株買いを承認。1〜6月に既に435,000株・2,900万ドルを取得済み、内部者買いもあり、通期見通しは据え置き、カリフォルニア州交通局から1,400万ドルの契約も獲得。純利益率4.68%、ROE11.38%。リスク：連邦予算と政策への依存が事業そのもの、繰延収益が第1四半期未達の主因、そして自社株買いの承認は約束ではない。研究の手がかりであり投資助言ではない。", "url": "https://simplywall.st/stocks/us/commercial-services/nasdaq-icfi/icf-international/news/icf-international-and-2-other-undervalued-small-caps-with-in" },
    { "id": "radar_4", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "stocks": [ { "t": "SONO", "n": "高階音響品牌，季度由虧轉盈 2,985 萬美元" } ], "status": "RADAR · 下一個驗證點 下季財報(記憶體成本對毛利的實際衝擊)", "en": "Sonos makes premium wireless home audio. The neglect here is behavioural: after the 2024 app disaster, media and analysts wrote the brand off and simply stopped covering it. What changed: fiscal Q3 revenue of $375.26M with net income of $29.85M, reversing a year-ago loss; 1.99M shares repurchased for $30.14M between March and June with $115.32M bought back in total; and long-term investor Chris Shackelton joining the board. Risk: CFO Saori Casey — who ran the cost reductions that produced this profit — has announced her retirement, memory component costs are rising, and the next hardware cycle is entirely unproven. Research lead, not investment advice.", "zh": "Sonos 做的是高階無線家庭音響。這裡的忽視是行為性的：2024 年 App 災難之後，媒體與分析師把這個品牌判了死刑、乾脆停止追蹤。改變的是什麼：會計年度第三季營收 3.7526 億美元、淨利 2,985 萬美元，去年同期還是虧損；3 到 6 月買回 199 萬股、金額 3,014 萬美元，累計買回 1.1532 億美元；長期投資人 Chris Shackelton 進入董事會。風險：一手主導這輪成本削減、把公司做到獲利的財務長 Saori Casey 已宣布退休，記憶體零組件成本正在上升，而下一輪硬體週期完全未經驗證。研究線索，不是投資建議。", "ja": "Sonosはプレミアムなワイヤレス家庭用オーディオを手掛ける。ここでの無視は行動的なものだ——2024年のアプリ大失敗の後、メディアとアナリストはブランドを見限り、カバーをやめてしまった。変化：会計年度第3四半期の売上3億7,526万ドル、純利益2,985万ドルで前年の赤字から反転。3〜6月に199万株・3,014万ドルを買い戻し、累計1億1,532万ドル。長期投資家Chris Shackeltonが取締役に就任。リスク：この黒字化を主導したCasey CFOが退任を表明、メモリ部材コストは上昇、次のハードウェアサイクルは全く未検証。研究の手がかりであり投資助言ではない。", "url": "https://simplywall.st/stocks/us/consumer-durables/nasdaq-sono/sonos/news/will-profit-turnaround-buybacks-and-cfo-exit-change-sonos-so" },
    { "id": "radar_5", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "stocks": [ { "t": "AMR", "n": "冶金煤生產商，董事單筆買進約 200 萬美元" } ], "status": "RADAR · 下一個驗證點 下季財報與冶金煤現貨價格走勢", "en": "Alpha Metallurgical Resources mines metallurgical coal — the input for steel, not power generation, a distinction most screens ignore. It is doubly neglected: ESG mandates exclude coal by category, and sell-side coverage of the space has thinned to almost nothing. What changed: director Kenneth S. Courtis bought 10,000 shares on June 12 at $200.49–201.11, roughly $2.0M of his own cash — a single purchase of that size in a name this overlooked is a hard signal to dismiss. Risk: met coal pricing is violently cyclical, the company is a single-commodity bet with no hedge in the equity, and steel demand tracks exactly the rate-sensitive construction cycle now under pressure. Research lead, not investment advice.", "zh": "Alpha Metallurgical Resources 開採的是冶金煤——煉鋼的原料，不是發電用煤，這個區別大多數篩選器都不管。它是雙重被忽視：ESG 規範按類別直接排除煤炭，而賣方對這個領域的覆蓋已經薄到幾乎沒有。改變的是什麼：董事 Kenneth S. Courtis 於 6/12 以 200.49-201.11 美元買進 10,000 股、約 200 萬美元自有資金——在一檔這麼冷門的股票上出現這種規模的單筆買進，很難當作雜訊。風險：冶金煤價格劇烈循環，公司是單一商品的押注、股權層面沒有任何避險，而鋼鐵需求正好對應現在受壓的利率敏感營建循環。研究線索，不是投資建議。", "ja": "Alpha Metallurgical Resourcesは原料炭——発電用ではなく製鋼用の炭を採掘する。多くのスクリーニングはこの区別を無視する。二重に無視されている：ESG方針はカテゴリーで石炭を除外し、セルサイドのカバーはほぼ消滅した。変化：取締役Kenneth S. Courtisが6/12に200.49〜201.11ドルで10,000株、自己資金約200万ドルを購入。これほど不人気な銘柄でのこの規模の単独購入はノイズとして片付けにくい。リスク：原料炭価格は激しく循環し、単一商品への賭けでヘッジもなく、鉄鋼需要は今まさに圧迫されている金利敏感な建設サイクルに連動する。研究の手がかりであり投資助言ではない。", "url": "https://www.investing.com/news/stock-market-news/tuesdays-insider-activity-major-buys-in-energy-and-biotech-93CH-4747379" },
    { "id": "insider_0", "channel": "內部人動向", "tag": "庫藏股", "color": "#6DB56D", "stocks": [ { "t": "BANR", "n": "8/3 授權買回最多 170 萬股，約流通股 5%" }, { "t": "FCFS", "n": "7/23 授權買回 1.5 億美元" } ], "en": "Two buyback authorizations worth logging: Banner Corporation's board approved repurchasing up to 1.7 million shares — about 5% of shares outstanding — on August 3, and FirstCash Holdings authorized $150M on July 23. Read them correctly, though. An authorization is permission to buy, not a commitment; boards announce them precisely when they want to signal confidence cheaply. The number that matters is the shares actually repurchased in the next 10-Q, and the average price paid versus where the stock trades now.", "zh": "兩筆值得記下的庫藏股授權：Banner Corporation 董事會 8/3 通過買回最多 170 萬股、約當流通股 5%；FirstCash Holdings 則於 7/23 授權 1.5 億美元。但要讀對。授權只是「可以買」的許可、不是承諾，而董事會選在想用低成本表態信心的時候公布它。真正重要的數字，是下一份 10-Q 裡實際買回了多少股，以及平均買進價格與現價的關係。", "ja": "記録しておくべき自社株買い承認が二件：Banner Corporationは8/3に最大170万株（発行済の約5%）、FirstCash Holdingsは7/23に1.5億ドルを承認。ただし読み方が肝心だ。承認は「買える」許可であって約束ではなく、取締役会は安価に自信を示したい時にこそ発表する。重要な数字は次の10-Qで実際に買い戻した株数と、平均取得単価と現在値の関係だ。", "url": "https://www.tipranks.com/news/company-announcements/banner-corporation-authorizes-significant-share-repurchase-program" },
    { "id": "insider_1", "channel": "內部人動向", "tag": "專業基金", "color": "#6DB56D", "stocks": [ { "t": "ARTV", "n": "RA Capital 三筆買進 531,326 股、約 460 萬美元" }, { "t": "XBI", "n": "生技 ETF，這類訊號的族群背景" } ], "en": "RA Capital Healthcare Fund bought 531,326 shares of Artiva Biotherapeutics across three transactions between June 12 and 16, at $8.31–9.00, totalling about $4.6M. This is a different animal from a director buying a few thousand shares: a specialist healthcare fund and 10% holder adding size has done diligence a retail screen cannot replicate. The caveat is equally structural — clinical-stage biotech is binary. A fund can size a position across twenty such bets; an individual holding one is exposed to a single readout.", "zh": "RA Capital Healthcare Fund 於 6/12 至 6/16 分三筆買進 Artiva Biotherapeutics 共 531,326 股，價格區間 8.31-9.00 美元、金額約 460 萬美元。這跟一位董事買幾千股是完全不同的東西：一檔專業醫療基金兼 10% 大股東加碼，代表它做過散戶篩選器複製不來的盡職調查。但但書同樣是結構性的——臨床階段生技股是二元的。基金可以把部位分散在二十個這種賭注上，個人只押一檔，暴露的是單一次數據解盲。", "ja": "RA Capital Healthcare Fundは6/12〜16の3回の取引でArtiva Biotherapeutics株531,326株を8.31〜9.00ドル、計約460万ドル取得。取締役が数千株買うのとは質が違う——専門ヘルスケアファンドかつ10%株主の買い増しは、個人向けスクリーナーでは再現できないデューデリの裏付けを持つ。ただし但し書きも構造的だ。臨床段階のバイオはバイナリーで、ファンドは20の賭けに分散できるが、個人が1銘柄に賭ければ一度の結果に晒される。", "url": "https://www.investing.com/news/stock-market-news/tuesdays-insider-activity-major-buys-in-energy-and-biotech-93CH-4747379" },

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文、展開日本語=日文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN",ja:"日本語"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>

          {card.stocks.map(s => (

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>

  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'ja' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'ja', ja:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  const playTokenRef = React.useRef(0);

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idx]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const card = cards[idx];
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const body = playLang === 'en' ? card.en : playLang === 'ja' ? (card.ja || card.en) : card.zh;
    const intro = playLang === 'en' ? `Number ${idx + 1} of ${total}. `
                : playLang === 'ja' ? `${idx + 1}／${total}。`
                : `第 ${idx + 1} 則，${card.channel}，${card.tag || ""}。`;
    const text = intro + body;
    const advance = () => {
      if (playTokenRef.current !== token) return;
      if (idx + 1 >= total) { setPlaying(false); go(total); return; }
      go(idx + 1);
    };
    speakSmart(text, {
      speakLang: playLang,
      azRate: playLang === 'zh' ? '-8%' : '-5%',
      sysRate: playLang === 'zh' ? 0.95 : 0.88,
      onEnd: () => setTimeout(advance, 600),   // 卡與卡之間留一點呼吸
      onError: () => { if (playTokenRef.current === token) setPlaying(false); }
    });
    return () => { playTokenRef.current++; azureStop(); };
  }, [playing, idx, total, isFlow, atEnd, playLang]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/05/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v6.3</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English",ja:"日本語"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN",ja:"日"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English",ja:"日本語"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
