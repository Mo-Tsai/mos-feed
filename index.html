<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "earn_1", "channel": "財報速報", "tag": "DIY 熄火", "color": "#E8786A", "zh": "勞氏（Lowe's）8/19 交出一份「數字沒崩、指引轉弱」的成績單：截至 7/31 的一季淨利 24 億美元、每股 4.27 美元，與去年同期持平，調整後每股盈餘 4.40 美元、年增 1.6%，營收約 260 億美元。真正的訊息在全年目標——公司把全年營收壓到原本 920 至 940 億美元區間的下緣 920 億，同店銷售從「持平到成長 2%」改成「持平」，調整後每股盈餘從 12.25 至 12.75 美元收斂到 12.25 美元。理由是自己動手做（DIY）的消費持續疲軟。股價盤前跌約 2%。", "en": "Lowe's delivered a set of numbers on 8/19 that did not break but came with softer guidance: for the quarter ended 31 July, net income was $2.4 billion, or $4.27 a share, unchanged from a year earlier, adjusted EPS rose 1.6% to $4.40 and sales were about $26 billion. The real message was in the full-year targets — the company pushed sales to the bottom of its prior $92–94 billion range at $92 billion, moved comparable sales from 'flat to up 2%' to simply 'flat', and narrowed adjusted EPS from $12.25–12.75 to $12.25. The reason given was persistent weakness in do-it-yourself spending. The shares fell about 2% in premarket trade.", "url": "https://www.cnbc.com/2026/08/19/lowes-low-q2-2026-earnings.html", "stocks": [{"t": "LOW", "n": "全年目標砍到區間下緣，同店改為持平，盤前跌約 2%"}, {"t": "HD", "n": "家得寶為同業對照組，上一季也是超標却只漲 0.75%，同樣卡在展望"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "退款撐 EPS", "color": "#E8786A", "zh": "塔吉特（Target）的數字比預期好，股價却在盤前跌約 3%。同店銷售成長 3.8%、來客數成長 3.6%，兩個都是實打實的復甦訊號。問題出在獲利的組成：本季有一筆 9.94 億美元的關稅退款，單獨貢獻了每股盈餘的 40%。市場的疑問很直接——把這筆一次性的退款拿掉之後，這個復甦還剩多少？這也是今年零售財報的共同課題：營運面在好轉，但獲利數字被關稅與退稅的時間差扭曲得很難讀。", "en": "Target's numbers came in better than expected, yet the stock fell about 3% premarket. Comparable sales rose 3.8% and store traffic 3.6% — both genuine signs of recovery. The problem is what the profit was made of: a $994 million tariff refund in the quarter accounted on its own for 40% of earnings per share. The market's question is blunt — strip out that one-off refund and how much of the recovery is left? This is the common theme of this retail earnings season: operations are improving, but the profit line is distorted by the timing of tariffs and refunds in a way that is hard to read.", "url": "https://ts2.tech/en/target-stock-falls-3-as-tariff-refund-supplies-40-of-q2-eps/", "stocks": [{"t": "TGT", "n": "同店 +3.8%、來客 +3.6% 超預期，但關稅退款占 EPS 四成，盤前跌約 3%"}, {"t": "TJX", "n": "折扣零售對照組，沒有同等規模的關稅退款緩衝，獲利品質較單純"}]},
    {"id": "earn_3", "channel": "財報速報", "tag": "沃爾瑪壓軸", "color": "#E8786A", "zh": "今天早上盤前輪到沃爾瑪（Walmart）交卷，這是本週零售財報的壓軸。市場預估每股盈餘 0.74 美元、年增約 5%，營收 1,868 億美元、年增約 8.8%——這家公司已經連續 25 季營收超出分析師預估。選擇權市場定價的財報後波動約正負 5.14%，對一家市值這麼大的公司來說是很高的數字。三個看點：同店銷售能否維持、電商與廣告事業（Walmart Connect）的加速度、以及會不會上調全年展望。前兩天塔吉特與勞氏已經把消費者的兩面畫出來了，沃爾瑪會決定哪一面才是主流。", "en": "Walmart reports before the bell this morning, the closing act of the week's retail earnings. Consensus looks for EPS of $0.74, up about 5%, on revenue of $186.8 billion, up roughly 8.8% — a company that has beaten revenue estimates for 25 straight quarters. The options market is pricing a post-earnings move of about plus or minus 5.14%, a large number for a company this size. Three things to watch: whether comparable sales hold, the pace of e-commerce and advertising through Walmart Connect, and whether full-year guidance is raised. Target and Lowe's have already sketched the two faces of the consumer this week; Walmart will decide which one is the mainstream.", "url": "https://www.benzinga.com/trading-ideas/previews/26/08/61308426/walmart-q2-preview-retailer-beats-revenue-25-straight-quarters-could-streak-extension-help-close-gap-with-target-stock", "stocks": [{"t": "WMT", "n": "今晨盤前公布，預估 EPS 0.74 美元、營收 1,868 億美元，隱含波動約 ±5.14%"}, {"t": "COST", "n": "會員制量販對照組，同樣吃「消費降級往大型量販集中」這條線"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "三票反對", "color": "#7C6AF7", "zh": "聯準會 7 月 28 至 29 日會議紀要 8/19 下午兩點公布，內容比市場想的鷹派得多：委員會最終以 9 比 3 決議按兵不動，但三位地區聯邦準備銀行總裁——克里夫蘭的 Hammack、明尼亞波利斯的 Kashkari、達拉斯的 Logan——全都投票主張升息一碼。這是多年來最分裂的一次政策投票。紀要還顯示鷹派情緒遠不只這三人，與會者明白表示「若通膨沒有下降，可能有必要收緊政策」。也就是說，下一步的風險方向不是降息，而是升息。", "en": "The minutes of the Federal Reserve's 28–29 July meeting, released at 2 p.m. on 8/19, read considerably more hawkish than expected: the committee held rates by a 9–3 vote, but three regional Reserve Bank presidents — Hammack of Cleveland, Kashkari of Minneapolis and Logan of Dallas — all voted for a quarter-point increase. It was the most fractured policy vote in years. The minutes also showed hawkish sentiment extending well beyond those three, with participants stating plainly that 'policy tightening would likely be necessary if inflation did not decline'. In other words, the risk on the next move points to a hike, not a cut.", "url": "https://qz.com/fed-fomc-minutes-july-2026-rate-hike-dissent-081926", "stocks": [{"t": "IEF", "n": "七至十年期公債 ETF，最直接反映「下一步可能是升息」的中段殖利率定價"}, {"t": "SHY", "n": "一至三年期公債 ETF，短天期最貼近政策利率預期，是讀鷹派程度的溫度計"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "回購加倍", "color": "#7C6AF7", "zh": "同一天真正撼動市場的是財政部：貝森特（Bessent）宣布把長天期名目息票公債的流動性支援回購操作規模至少加倍，從每次 20 億美元提高到至少 40 億美元，涵蓋 10 至 20 年與 20 至 30 年兩個天期區段，9 月 9 日生效、實施到 11 月 4 日。消息一出，三十年期公債殖利率從 5.26% 一路摜到 5.18%、十年期從 4.68% 降到 4.63%，前一天才創下近二十年新高的長端瞬間降溫。諷刺的是，同一天財政部也宣布美國未償公債餘額首次突破 40 兆美元。", "en": "The move that actually shook markets came from the Treasury the same day: Secretary Bessent announced that liquidity-support buybacks of longer-dated nominal coupon securities would be at least doubled, from $2 billion per operation to at least $4 billion, covering the 10-to-20-year and 20-to-30-year sectors, effective 9 September and running through 4 November. Yields fell immediately — the 30-year dropped from 5.26% to as low as 5.18% and the 10-year from 4.68% to 4.63%, cooling a long end that had hit a near-two-decade high only a day earlier. The irony is that the Treasury also announced the same day that outstanding public debt had passed $40 trillion for the first time.", "url": "https://www.cnbc.com/2026/08/19/treasury-announces-upscaled-buyback-operation-for-longer-term-debt-sending-yields-lower.html", "stocks": [{"t": "TLT", "n": "二十年期以上公債 ETF，回購加倍的直接受惠標的，長端殖利率當日回落"}, {"t": "NLY", "n": "房貸型不動產信託，靠長短端利差吃飯，長端降溫直接改善其帳面與利差"}]},
    {"id": "macro_3", "channel": "總經政策", "tag": "傑克森洞", "color": "#7C6AF7", "zh": "七月會議紀要還藏了一段人事與制度的訊號：主席沃許（Warsh）主動提議把聯邦公開市場委員會的年度會議次數從八次減為六次，理由是「讓資訊在會議之間累積得更多，也給政策制定者與幕僚更多時間思考策略性議題」。這件事的意義不在次數，而在節奏——會議變少代表每一次的決策權重變重，市場對單次會議的定價也會更劇烈。下週的傑克森洞年會 8 月 27 至 29 日登場，主題是「金融創新：對支付與政策的意涵」，沃許將於 8 月 28 日上午發表他就任主席後的第一場主旨演說。", "en": "The July minutes also carried a signal about people and process: Chair Warsh proposed cutting the number of annual FOMC meetings from eight to six, arguing it would 'allow more information to accumulate between meetings than under current practice and provide policymakers and the staff more time to consider strategic monetary policy issues'. The significance is not the count but the rhythm — fewer meetings means each decision carries more weight, and markets will price any single meeting more violently. Next week's Jackson Hole symposium runs 27–29 August on the theme 'Financial Innovation: Implications for Payments and Policy', with Warsh delivering his first keynote as chair on the morning of 28 August.", "url": "https://www.regardsofwallstreet.com/news/jackson-hole-2026-dates-schedule-warsh-first-speech", "stocks": [{"t": "UUP", "n": "美元指數 ETF，沃許首場主席演說是下週美元最大的單一事件風險"}, {"t": "GLD", "n": "黃金 ETF，同時押注實質利率與央行可信度，會議制度改革是它的變數"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "生技回魂", "color": "#4EABA4", "zh": "莫德納那一根不是孤立事件，而是一條已經跑了一年的資金線的加速器。生技類股 ETF 過去十三個月幾乎翻倍，光是六月就漲超過 13%，並吸引約 13 億美元的淨流入。背後的推力有兩層：科技股波動變大，資金開始在擁擠的人工智慧交易之外尋找獲利成長；以及併購週期回溫——2026 年到目前為止，生技領域的交易金額已達 1,060 億美元、共 201 件。生技 ETF 對小型生技、併購預期與融資環境的曝險，比大型製藥指數高得多，這也是它彈性最大的原因。", "en": "Moderna's move was not an isolated event but an accelerant on a flow that has been running for a year. The biotech sector ETF has nearly doubled over the past thirteen months, gained more than 13% in June alone and pulled in roughly $1.3 billion of net inflows. Two forces sit behind it: rising volatility in technology has pushed capital to look for earnings growth outside the crowded AI trade, and the M&A cycle has warmed up — biotech deals so far in 2026 total $106 billion across 201 transactions. The biotech ETF carries far more exposure to small-cap biotech, deal expectations and financing conditions than a large-cap pharma index, which is exactly why it moves the most.", "url": "https://www.moomoo.com/community/feed/healthcare-is-attracting-money-again-but-not-every-healthcare-etf-117053926211590", "stocks": [{"t": "XBI", "n": "等權重生技 ETF，十三個月接近翻倍、六月單月 +13%，小型生技曝險最高"}, {"t": "IBB", "n": "市值加權生技 ETF，權值集中大型生技，同一條線但彈性明顯較小"}, {"t": "MRK", "n": "癌症疫苗合作方，代表大型藥廠用併購與合作補產品線的那一半故事"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "能源錯位", "color": "#4EABA4", "zh": "能源是八月最強的族群，但強的方式很奇怪：現貨強、遠期弱。能源類股 ETF 單月漲超過 21%，推力是荷莫茲海峽的地緣風險溢價，不是需求成長。而美國能源資訊署與投行對布蘭特的預估卻是第三季 85 美元、第四季 80 美元、年底 78 美元，一路往下。這種「現貨溢價、遠期折價」的結構，對上游生產商和油服公司的意義完全不同——生產商吃的是當下的現貨，油服吃的是未來兩年的資本支出決策，而後者不會因為三個月的地緣事件就簽長約。", "en": "Energy is August's strongest group, but the strength has an odd shape: strong spot, weak forward. The energy sector ETF is up more than 21% on the month, driven by the geopolitical risk premium around the Strait of Hormuz rather than demand growth. Meanwhile EIA and bank forecasts for Brent step down — about $85 in the third quarter, $80 in the fourth and $78 by year-end. That spot-premium, forward-discount structure means very different things for upstream producers and for oilfield services: producers earn today's spot, while services depend on capital spending decisions two years out, and nobody signs long contracts because of a three-month geopolitical event.", "url": "https://www.forbes.com/advisor/investing/oil-prices-today/", "stocks": [{"t": "XLE", "n": "能源類股 ETF，八月 +21% 以上，權值偏大型整合石油與煉油"}, {"t": "OIH", "n": "油服 ETF，吃的是未來資本支出而非現貨，最能檢驗這波漲勢的真假"}]},
    {"id": "sector_3", "channel": "產業風向", "tag": "工業變貴", "color": "#4EABA4", "zh": "工業是今年被低估的贏家：工業類股 ETF 年初至今上漲超過 16%，八月初才創下歷史新高，三條腿分別是人工智慧基礎建設、國防支出與製造業回流。航太與國防占工業類股 ETF 的權重高達 25%，洛克希德馬丁與雷神技術過去一年都漲了約 35%。但這裡有個值得警惕的訊號：已經有分析指出，工業股在標普 500 裡的估值已經漲到跟科技股一樣貴。當一個「便宜的替代品」變得跟本尊一樣貴，它作為避風港的功能就消失了。", "en": "Industrials are this year's under-appreciated winner: the industrial sector ETF is up more than 16% year to date and set an all-time high in early August, driven by three legs — AI infrastructure, defence spending and manufacturing reshoring. Aerospace and defence make up 25% of the ETF, and both Lockheed Martin and RTX are up roughly 35% over the past year. But there is a warning sign: analysis now points out that industrials inside the S&P 500 have become as expensive as technology. When the cheap alternative gets as pricey as the original, its function as a shelter disappears.", "url": "https://www.investing.com/analysis/industrials-are-leading-in-2026-but-these-etfs-take-different-routes-200683566", "stocks": [{"t": "XLI", "n": "工業類股 ETF，今年 +16% 以上、八月初創新高，航太國防占權重 25%"}, {"t": "LMT", "n": "洛克希德馬丁，工業指數前二十大權值股，過去一年漲約 35%"}, {"t": "RTX", "n": "雷神技術，與洛克希德同為國防支出擴張的主要受益者，一年約 +35%"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "12 點之差", "color": "#5B8ED6", "zh": "羅素 2000 指數 8/19 上漲 0.46% 收在 3,057.54，距離歷史高點 3,069.71 只剩 12 點——在大型科技股連跌三天的同一週，小型股卻站在自己的歷史高點門口。羅素 2000 ETF 今年到 8 月 7 日已經上漲 22.51%，遠勝標普 500 的個位數表現。這個差距不是最近才出現的，它從二月就開始累積：市場一邊擔心人工智慧的資本支出過熱，一邊把錢挪到營收八成來自美國本土、對全球利率與關稅相對絕緣的小公司身上。", "en": "The Russell 2000 rose 0.46% on 8/19 to close at 3,057.54, just 12 points from its all-time high of 3,069.71 — in the same week that mega-cap technology fell for three straight sessions, small caps were standing at the door of their own record. The Russell 2000 ETF was up 22.51% year to date through 7 August, far ahead of the S&P 500's single-digit showing. This gap is not new; it has been building since February, as the market worried about overheating AI capital spending while shifting money into smaller companies that earn roughly 80% of revenue at home and are relatively insulated from global rates and tariffs.", "url": "https://www.investing.com/indices/smallcap-2000", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，今年至 8/7 上漲 22.51%，8/19 再漲 0.46%"}, {"t": "IJR", "n": "標普小型股 600 ETF，成分要求已獲利，是檢驗小型股漲勢品質的對照組"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "新高名單", "color": "#5B8ED6", "zh": "8 月 17 日那天，羅素 3000 裡有 31 檔小型股同時觸及 52 週新高，名單上市值最大的是 Immunovant，約 89 億美元。這種「同日多檔新高」的清單值得留意的不是單一個股，而是它的產業分布——如果 31 檔集中在同一個板塊，那是主題行情；如果散落在八九個產業，那才是廣度回升。Immunovant 是自體免疫抗體開發商，它出現在新高名單上，正好呼應本週醫療保健族群的資金流向。", "en": "On 17 August, 31 small caps in the Russell 3000 hit 52-week highs on the same day, the largest by market value being Immunovant at about $8.9 billion. What makes a same-day list like this worth reading is not any single name but its sector spread — if all 31 sit in one sector, that is a thematic move; if they scatter across eight or nine industries, that is a genuine broadening. Immunovant, an autoimmune antibody developer, appearing on the list lines up neatly with this week's flow into healthcare.", "url": "https://www.trefis.com/stock/spy/articles-v3/611828/the-52-week-high-list-31-small-cap-names-on-monday/2026-08-19", "stocks": [{"t": "IMVT", "n": "Immunovant，市值約 89 億美元，8/17 那份 31 檔小型股新高名單中最大的一家"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "區域銀行", "color": "#5B8ED6", "zh": "區域銀行是今年小型股裡最安靜的贏家：區域銀行 ETF 到 7 月 29 日年初至今上漲 18.9%，勝過標普 500 的 7.5% 與整體金融類股的 4.4%，過去一年漲約 28% 到每股 70 美元附近。推力很單純——存款成本終於開始下滑，淨利差重新擴張。但這個論述有一個反向風險常被忽略：如果市場開始定價 2026 年降息超過兩次，利差擴張的故事反而會被削弱。也就是說，區域銀行怕的不是升息，是降太快。", "en": "Regional banks are the quietest winner among small caps this year: the regional banking ETF returned 18.9% year to date through 29 July, ahead of the S&P 500's 7.5% and the broad financial sector's 4.4%, and is up about 28% over twelve months to around $70 a share. The driver is simple — deposit costs have finally started rolling over and net interest margins are widening again. But the thesis carries an overlooked reverse risk: if markets begin pricing more than two rate cuts in 2026, the margin-expansion story weakens. Regional banks do not fear hikes so much as cuts that come too fast.", "url": "https://mercercapital.com/insights/newsletters/bank-watch-newsletter/2026/july-2026-banks-join-the-risk-on-trade/", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，至 7/29 年初至今 +18.9%，一年約 +28% 到每股 70 美元附近"}, {"t": "BANR", "n": "Banner Corporation，總資產 165.9 億美元的美國西部社區銀行，雷達池池內股"}, {"t": "STBA", "n": "S&T Bancorp，賓州社區銀行控股公司，同屬雷達池內的存款成本受益者"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "家居受壓", "color": "#5B8ED6", "zh": "勞氏把全年目標砍到區間下緣、理由是自己動手做的消費疲軟，這個訊息對小型家居類股比對勞氏本身更殘酷。原因是規模差：大型零售商有關稅退款、有議價能力、有多品類可以互相補位；一家做家具或櫃體的中小型公司只有一條產品線，需求一軟就直接反映在營收上。今年小型股整體逼近歷史高點，但族群內部的分化很嚴重——家居與 DIY 相關的名字，是這波小型股行情裡明顯落後的一塊。", "en": "Lowe's cutting full-year targets to the bottom of the range on soft DIY spending is harsher news for small-cap home-related names than for Lowe's itself. The reason is scale: large retailers have tariff refunds, bargaining power and multiple categories to cover for each other; a small or mid-sized furniture or cabinet maker has one product line, and soft demand shows up directly in revenue. Small caps as a group are near record highs this year, but the dispersion inside the group is severe — home and DIY-linked names are a visibly lagging pocket of this small-cap rally.", "url": "https://qz.com/lowes-2026-outlook-diy-spending-earnings-081926", "stocks": [{"t": "ETD", "n": "Ethan Allen Interiors，北美中高價位家具製造與零售，雷達池內的家居曝險部位"}, {"t": "XRT", "n": "零售 ETF，等權重成分讓小型零售商的權重高於市值加權指數，適合看分化"}]},
    {"id": "small_5", "channel": "小型股風雲", "tag": "判讀知識", "color": "#5B8ED6", "zh": "今天值得學的一件事：52 週新高名單怎麼讀。新高本身不是訊號，它只是一把篩子——關鍵在於分辨「無量新高」與「催化事件新高」。前者常見於流通股數少的微型股，只要幾十萬美元的買盤就能推到新高，但你進場時的滑價成本可能吃掉三到五個百分點；後者背後有明確的合約、財報或法規事件，成交量會同步放大。實務上的檢查方法很簡單：把當天成交量跟三十日均量比，如果沒有明顯放大，這個新高多半只是流動性的假象。", "en": "Something worth learning today: how to read a 52-week high list. A new high is not a signal in itself, only a filter — the point is to separate the volume-less high from the catalyst-driven high. The first is common in micro caps with small floats, where a few hundred thousand dollars of buying can push the price to a new high, but the slippage on your own entry may cost three to five percentage points. The second sits on a specific contract, earnings result or regulatory event, and volume expands alongside it. The practical check is simple: compare the day's volume with the 30-day average, and if it has not visibly expanded, the high is mostly a liquidity illusion.", "url": "https://pro.thestreet.com/market-commentary/small-caps-are-where-the-money-is-going", "stocks": [{"t": "IWO", "n": "羅素 2000 成長型 ETF，成分偏高波動小型股，新高名單多半出自這個池子"}, {"t": "VTWO", "n": "羅素 2000 指數 ETF，費用率低、規模大，適合當小型股整體流動性的基準"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "分拆保險軟體", "color": "#C9A227", "zh": "Exzeo Group 做的是「保險即服務」平台：把產險公司的報價、核保、保單管理、理賠處理與財務報表這些後台工作接過來，用軟體收訂閱與服務費，旗下有 ClaimColony 理賠平台、AtlasViewer、Exahub 資料平台等工具。它被忽視的原因很典型——它是 HCI Group 分拆出來的新掛牌公司，掛牌當天開盤持平、沒有故事性，而且賣的是 B2B 保險後台軟體，媒體聲量幾乎是零。正在改變的是兩件事：一，8 月 14 日董事會授權為期一年、上限 2,500 萬美元的庫藏股；二，基本面數字很不像一家沒人看的公司——管理保費年增 140% 到 13.9 億美元、年度經常性收入成長 55% 到 2.15 億美元、稅息折舊攤銷前利潤率超過 54%。反方論點也很清楚：營收高度依賴前母公司 HCI，關係人交易的定價是否公允難以驗證，加上新股掛牌後的解禁賣壓。這是研究線索，不是投資建議。", "en": "Exzeo Group runs an insurance-as-a-service platform: it takes over the back office of property and casualty insurers — quoting, underwriting, policy administration, claims handling and financial reporting — and charges subscription and service fees, with tools including the ClaimColony claims platform, AtlasViewer and the Exahub data platform. Why it is ignored is textbook: a newly listed spin-off from HCI Group that opened flat on debut, with no narrative, selling B2B insurance back-office software with almost no media presence. Two things are changing: on 14 August the board authorised a one-year buyback of up to $25 million; and the fundamentals do not look like a company nobody watches — managed premium up 140% year over year to $1.39 billion, annual recurring revenue up 55% to $215 million and EBITDA margins above 54%. The counter-argument is equally clear: revenue depends heavily on former parent HCI, related-party pricing is hard to verify, and lock-up expiry adds supply. This is a research lead, not investment advice.", "url": "https://kalkinemedia.com/us/news/announcements/exzeo-groups-board-sanctions-25-million-stock-buyback-plan", "status": "RADAR · 下一個驗證點 Q3 財報與 HCI 關係人交易揭露", "stocks": [{"t": "XZO", "n": "Exzeo Group，HCI 分拆的保險即服務平台，8/14 授權 2,500 萬美元庫藏股"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "創辦人連買", "color": "#C9A227", "zh": "Borr Drilling 是純做淺水自升式鑽井平台（jackup）的離岸鑽井業者，船隊分散在西非、墨西哥、歐洲與東南亞。它被雙重忽視的原因很直接：離岸鑽井是 2015 年油價崩盤後被市場整個放棄的產業，加上它是百慕達註冊、挪威系背景的中小型公司，美國分析師覆蓋稀薄。正在改變的是內部人買進的密度——創辦人兼董事 Tor Olav Trøim 6 月 9 日透過 Drew Holdings 買進 106.3 萬股、約 500 萬美元，8 月再買 150 萬股、約 600 萬美元，持股推升到約 2,880 萬股；同期公司陸續拿下新約，包括 BW Energy 在加彭的四口井、最少 320 天的約束性得標書，2026 年合約覆蓋率達 73%、平均日費約每天 13.4 萬美元。反方論點：日費與油價高度連動，而遠期油價預估是往下的；公司負債重，加上單一國家的政治與付款風險（墨西哥、西非）不容忽視。這是研究線索，不是投資建議。", "en": "Borr Drilling is a pure-play offshore driller operating high-specification shallow-water jackup rigs across West Africa, Mexico, Europe and Southeast Asia. The double neglect is straightforward: offshore drilling is an industry the market abandoned wholesale after the 2015 oil crash, and Borr is a Bermuda-registered, Norwegian-rooted small cap with thin U.S. analyst coverage. What is changing is the density of insider buying — founder and director Tor Olav Trøim bought 1,063,000 shares for about $5.0 million on 9 June through Drew Holdings and a further 1.5 million shares for roughly $6.0 million in August, lifting his controlled stake to around 28.8 million shares. Over the same stretch the company added contracts, including a binding letter of award from BW Energy in Gabon for four wells with a minimum 320-day duration, bringing 2026 contract coverage to 73% at an average day rate near $134,000. The counter-argument: day rates track oil prices closely and forward oil forecasts step down; leverage is high, and single-country political and payment risk in Mexico and West Africa is real. This is a research lead, not investment advice.", "url": "https://kalkinemedia.com/us/news/announcements/borr-drilling-director-tor-olav-troim-acquires-15-million-shares-in-august-2026", "status": "RADAR · 下一個驗證點 Q3 財報與 2027 年合約覆蓋率更新", "stocks": [{"t": "BORR", "n": "Borr Drilling，創辦人 6 月買 106.3 萬股、8 月再買 150 萬股，2026 覆蓋率 73%"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "執行長進場", "color": "#C9A227", "zh": "MasterBrand 是北美最大的廚房與浴室櫃體製造商之一，2022 年從 Fortune Brands 分拆獨立，賣的是房屋翻修與新建案裡最不性感的那個品項。它進雷達池是 7 月 31 日，當時的理由是分拆後覆蓋不足加上房市低迷帶來的估值折價。這次的新證據是內部人買進：執行長 R. Banyard 在 8 月初於公開市場買進 6 萬股、金額約 50.58 萬美元。搭配今天勞氏的財報一起看更有意思——同一份「自己動手做消費疲軟」的資料，勞氏用來下修全年目標，MasterBrand 的執行長却在同一個月自己掏錢買股。反方論點：櫃體需求跟成屋銷售與房貸利率高度綁定，公司借款水位偏高，而長端殖利率即使回落也仍在近二十年高檔。這是研究線索，不是投資建議。", "en": "MasterBrand is one of North America's largest kitchen and bath cabinet manufacturers, spun out of Fortune Brands in 2022, selling the least glamorous item in any renovation or new-build. It entered the radar pool on 31 July on thin post-spin coverage and a housing-driven valuation discount. The new evidence is insider buying: chief executive R. Banyard bought 60,000 shares in the open market in early August for roughly $505,800. It is more interesting read alongside today's Lowe's report — the same 'soft DIY spending' backdrop that Lowe's used to cut full-year guidance is the month in which MasterBrand's CEO put his own money in. The counter-argument: cabinet demand is tightly tied to existing-home sales and mortgage rates, borrowings are elevated, and long-end yields remain near two-decade highs even after this week's pullback. This is a research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/capital-goods/nyse-mbc/masterbrand/news/undervalued-small-caps-with-insider-buying-to-watch-in-augus-1", "status": "RADAR · 下一個驗證點 Q3 財報與成屋銷售月報", "stocks": [{"t": "MBC", "n": "MasterBrand，執行長 8 月初買進 6 萬股、約 50.58 萬美元，池內股更新"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "庫藏股加碼", "color": "#C9A227", "zh": "FIGS 做的是直接面對消費者的醫護人員刷手服與工作服品牌，2021 年掛牌，是少數把「制服」做成品牌與訂閱式回購行為的公司。它被忽視的原因是敘事斷裂：上市初期被當成高成長消費品股炒過一輪，成長趨緩後就被市場整批放棄，現在幾乎沒人把它當成一家有現金流的品牌公司在看。8 月 6 日的新證據是資本配置：董事會把庫藏股授權再加 1 億美元，總授權提高到 2 億美元的 A 類普通股——以它目前的市值來看，這是很高的比例。反方論點：刷手服的進入門檻不高，競爭者在增加，品牌一旦開始靠折扣衝量，毛利率的下修速度會比營收快；而且庫藏股授權只是授權，不等於實際執行。這是研究線索，不是投資建議。", "en": "FIGS is a direct-to-consumer brand of scrubs and workwear for healthcare professionals, listed in 2021, one of the few companies to turn uniforms into a brand with subscription-like repeat purchase. The neglect comes from a broken narrative: it was traded as a high-growth consumer name early on, then abandoned wholesale once growth slowed, and few now look at it as a cash-generating brand. The new evidence, dated 6 August, is capital allocation: the board added $100 million to the repurchase authorisation, raising the total to $200 million of Class A common stock — a high proportion relative to its current market value. The counter-argument: barriers to entry in scrubs are low, competitors are multiplying, and once a brand starts discounting for volume, gross margin falls faster than revenue; an authorisation is also only an authorisation, not an execution. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001846576/000162828026054319/figs-20260806.htm", "status": "RADAR · 下一個驗證點 Q3 財報揭露的實際買回股數", "stocks": [{"t": "FIGS", "n": "8/6 庫藏股授權再加 1 億美元、總額提高到 2 億美元 A 類普通股"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "轉型中的地主", "color": "#C9A227", "zh": "Innovative Industrial Properties 原本是專做大麻種植設施的不動產信託，靠售後回租的高租金收益率吸引投資人，後來因為租戶違約潮被市場整批打入冷宮。它被忽視的原因是標籤——只要掛著「大麻」兩個字，很多機構的投資準則直接把它排除在外。正在改變的是資產結構：8 月 3 日公布的第二季，公司完成 2.7 億美元投資 IQHQ 的資金撥付，正式把腳跨進生命科學地產；當季總營收 6,330 萬美元、歸屬普通股東淨利 4,070 萬美元、每股 1.36 美元；4 月與上市多州營運商 Curaleaf 簽下俄亥俄州 5.8 萬平方呎的整棟租約。截至 6 月 30 日持有 108 處物業、約 840 萬平方呎、遍及 19 州。反方論點：大麻租戶的信用品質仍是最大變數，生命科學地產本身在 2026 年也有供給過剩問題，而不動產信託對利率高度敏感。這是研究線索，不是投資建議。", "en": "Innovative Industrial Properties was originally a REIT dedicated to cannabis cultivation facilities, attracting investors with high sale-leaseback yields before a wave of tenant defaults pushed it out of favour wholesale. The neglect is about labelling — the word 'cannabis' alone excludes it from many institutional mandates. What is changing is the asset mix: in second-quarter results published on 3 August the company completed funding of a $270 million investment in IQHQ, formally stepping into life-science real estate; quarterly total revenue was $63.3 million with net income attributable to common stockholders of $40.7 million, or $1.36 per diluted share; and in April it signed a 58,000 square foot full-building lease in Ohio with listed multi-state operator Curaleaf. As of 30 June it owned 108 properties, roughly 8.4 million rentable square feet across 19 states. The counter-argument: cannabis tenant credit remains the biggest variable, life-science real estate has its own 2026 oversupply problem, and REITs are highly rate-sensitive. This is a research lead, not investment advice.", "url": "https://finance.yahoo.com/real-estate/articles/innovative-industrial-properties-reports-second-204000483.html", "status": "RADAR · 下一個驗證點 Q3 財報與 IQHQ 投資的收益揭露", "stocks": [{"t": "IIPR", "n": "Q2 營收 6,330 萬美元、每股 1.36 美元，完成 2.7 億美元 IQHQ 投資撥款"}]},
    {"id": "radar_6", "channel": "忽視雷達", "tag": "折扣雜貨", "color": "#C9A227", "zh": "Grocery Outlet 做的是機會型採購的折扣雜貨：買進品牌商的過剩庫存、換季品與包裝改版品，用遠低於正常通路的價格賣掉，門市則交給獨立業主經營。它被忽視的原因是模式難建模——獨立業主制讓同店成長的驅動因子跟一般連鎖超市完全不同，加上過去兩年庫存與資訊系統轉換出過狀況，市場對它的耐心已經用完。正在改變的是營運本身：第二季獲利超出市場預估，公司同時上調 2026 年全年展望，這是連續兩年下修之後第一次轉向。搭配今天塔吉特與勞氏描繪的「消費者往價格靠攏」背景一起看，折扣通路正好站在資金流的順風處。反方論點：獨立業主模式的執行落差難以從財報看出來，折扣雜貨的競爭正在變激烈，而毛利率本來就薄。這是研究線索，不是投資建議。", "en": "Grocery Outlet runs opportunistic-buy discount groceries: it acquires brand owners' excess inventory, seasonal leftovers and repackaged goods and sells them far below normal channel prices, with stores operated by independent owners. The neglect comes from a model that is hard to model — the independent-operator structure means comparable-sales drivers behave quite differently from an ordinary supermarket chain, and after two years of inventory and IT-conversion problems the market's patience had run out. What is changing is operations: second-quarter earnings beat estimates and the company raised its full-year 2026 outlook, the first upward turn after two years of cuts. Read alongside the 'consumers trading down' picture that Target and Lowe's painted this week, discount channels sit right in the path of the flow. The counter-argument: execution gaps in the independent-operator model are hard to see in the financials, discount grocery competition is intensifying, and gross margins are thin to begin with. This is a research lead, not investment advice.", "url": "https://www.zacks.com/stock/news/2974122/grocery-outlet-q2-earnings-beat-estimates-2026-view-raised", "status": "RADAR · 下一個驗證點 Q3 同店銷售成長率", "stocks": [{"t": "GO", "n": "Grocery Outlet，Q2 獲利超預期並上調 2026 全年展望，池內股更新"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "本週買盤", "color": "#6DB56D", "zh": "8 月 17 日當天回報了 119 筆公開市場內部人交易，幾筆金額較大的買進值得記下來：Borr Drilling 的董事 Tor Olav Trøim 在 8/14 買進 50 萬股、約 219 萬美元；On Holding 的執行董事兼共同執行長 Caspar Coppetti 同日買進 6.5 萬股、約 199 萬美元；MasterBrand 的執行長 R. Banyard 則在月初買進 6 萬股、約 50.58 萬美元。三筆的共通點是產業完全不同——離岸鑽井、運動鞋服、櫃體製造，這代表這不是某個板塊的集體訊號，而是各自公司內部的判斷。", "en": "On 17 August alone, 119 open-market insider transactions were reported, and a few of the larger purchases are worth noting: Borr Drilling director Tor Olav Trøim bought 500,000 shares on 8/14 for about $2.19 million; On Holding executive director and co-CEO Caspar Coppetti bought 65,000 shares the same day for roughly $1.99 million; and MasterBrand chief executive R. Banyard bought 60,000 shares earlier in the month for about $505,800. What the three share is that they come from entirely different industries — offshore drilling, athletic footwear and cabinet manufacturing — which means this is not a sector-wide signal but three separate judgements made inside three companies.", "url": "https://www.bbae.com/blog/insideredge-top-sales-and-top-purchases-august-17-2026/", "stocks": [{"t": "ONON", "n": "On Holding，共同執行長 Coppetti 8/14 買進 6.5 萬股、約 199 萬美元"}, {"t": "BORR", "n": "Borr Drilling，董事 Trøim 8/14 透過持股公司買進 50 萬股、約 219 萬美元"}, {"t": "MBC", "n": "MasterBrand，執行長 Banyard 8 月初買進 6 萬股、約 50.58 萬美元"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "授權不等於執行", "color": "#6DB56D", "zh": "這個月小型股的庫藏股授權密度偏高：FIGS 在 8 月 6 日把授權額度再加 1 億美元、總額提高到 2 億美元；Exzeo Group 則在 8 月 14 日獲董事會授權為期一年、上限 2,500 萬美元的買回計畫。判讀時要分清楚兩件事的性質差異——庫藏股是公司拿股東的錢買自家股票，內部人買進是高階經理人拿自己的錢買，後者的訊號強度明顯高於前者。更關鍵的是：授權不等於執行。很多公司宣布授權後只買回一小部分甚至完全沒買，真正要看的是季報現金流量表裡的實際買回金額與股數。", "en": "Buyback authorisations among small caps have been dense this month: FIGS added $100 million to its authorisation on 6 August, raising the total to $200 million, and Exzeo Group's board approved a one-year programme of up to $25 million on 14 August. When reading these, keep the two things distinct — a buyback is the company spending shareholders' money on its own stock, while an insider purchase is an executive spending their own, and the second carries a materially stronger signal than the first. More important still: an authorisation is not an execution. Plenty of companies announce one and then repurchase only a fraction, or nothing at all. What to check is the actual dollar amount and share count in the quarterly cash flow statement.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+August+17,+2026", "stocks": [{"t": "FIGS", "n": "8/6 加碼 1 億美元、總授權 2 億美元，相對市值比例偏高"}, {"t": "XZO", "n": "Exzeo Group，8/14 董事會授權為期一年、上限 2,500 萬美元的買回計畫"}]},
    {"id": "insider_3", "channel": "內部人動向", "tag": "13F 落後值", "color": "#6DB56D", "zh": "第二季 13F 申報已於 8 月 14 日截止，整體結論不是全面降風險，而是在成長與人工智慧這條線內部大幅換位：多位知名經理人把錢從先前的贏家回收，轉進半導體、超大規模雲端業者、基礎建設與選擇性的景氣循環股。德魯肯米勒（Duquesne 家族辦公室）當季新建 48 檔部位、出清 23 檔；艾克曼的潘興廣場組合擴大到 194.7 億美元、持股從 10 檔增為 14 檔，新建 Visa、Mastercard、標普全球與網飛四個部位。判讀提醒：13F 落後 45 天、只揭露多方股票部位，不含放空、選擇權對沖與債券，所以它能告訴你「他們曾經想什麼」，不能告訴你「他們現在做什麼」。", "en": "Second-quarter 13F filings closed on 14 August, and the overall read is not wholesale de-risking but a substantial rotation within the growth and AI complex: several well-known managers recycled capital out of prior winners into semiconductors, hyperscalers, infrastructure and selective cyclicals. Druckenmiller's Duquesne Family Office disclosed 48 new positions and exited 23 during the quarter, while Ackman's Pershing Square portfolio expanded to $19.47 billion and from 10 to 14 positions, initiating stakes in Visa, Mastercard, S&P Global and Netflix. A reading caveat: 13Fs lag by 45 days and disclose only long equity positions, excluding shorts, options hedges and bonds — so they tell you what these managers once thought, not what they are doing now.", "url": "https://seekingalpha.com/article/4937160-tracking-bill-ackmans-pershing-square-13f-portfolio-q2-2026-update", "stocks": [{"t": "V", "n": "Visa，潘興廣場第二季新建部位之一，屬支付網路型收費站生意"}, {"t": "MA", "n": "Mastercard，同為新建部位，與 Visa 構成同一組雙寡占押注"}, {"t": "SPGI", "n": "標普全球，指數與評等的收費站，新建部位反映對現金流穩定度的偏好"}, {"t": "NFLX", "n": "網飛，第二季新建部位，是這組新持股裡唯一的內容與訂閱模式"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "總經行事曆", "color": "#C97DD4", "zh": "接下來五個交易日的總經重頭戲全部集中在下半段。今天 8/20 週四是例行的初領失業金人數；下週二 8/25 是諮商會消費者信心指數；真正的密集日是 8 月 26 日週三——第二季國內生產毛額二次估、7 月個人所得與支出（含個人消費支出物價指數）、7 月耐久財訂單同一天上午出爐。壓軸是 8 月 27 至 29 日的傑克森洞年會，主題訂為「金融創新：對支付與政策的意涵」，沃許將於 8 月 28 日上午發表他就任聯準會主席後的第一場主旨演說。在七月會議紀要顯示三票主張升息的背景下，這場演說的每一個字都會被逐句拆解。", "en": "The macro calendar for the next five trading days is back-loaded. Today, Thursday 8/20, brings the routine initial jobless claims; next Tuesday 8/25 is the Conference Board consumer confidence index; and the dense day is Wednesday 26 August, when the second estimate of second-quarter GDP, July personal income and spending including the PCE price index, and July durable goods orders all land in the same morning. The closing act is the Jackson Hole symposium on 27–29 August under the theme 'Financial Innovation: Implications for Payments and Policy', with Warsh delivering his first keynote as Fed chair on the morning of 28 August. Against July minutes that showed three votes for a hike, every word of that speech will be parsed.", "url": "https://www.litefinance.org/blog/analysts-opinions/weekly-economic-calendar-for-24082026-30082026/", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，8/26 的個人消費支出物價指數與傑克森洞演說是它的兩顆地雷"}, {"t": "GLD", "n": "黃金 ETF，同時對實質利率與央行可信度定價，最吃沃許演說的語氣"}]},
    {"id": "week_2", "channel": "本週事件", "tag": "財報行事曆", "color": "#C97DD4", "zh": "財報這條線今天先看沃爾瑪盤前，那是本週零售的收尾；真正的分水嶺在下週三 8 月 26 日盤後，輝達（Nvidia）公布 2027 會計年度第二季（涵蓋今年 7 月止的三個月）。分析師預估營收落在 930 至 950 億美元、年增約 67%，推力是人工智慧加速器需求與 Blackwell 架構的量產爬坡。這場財報之所以關鍵，是因為它跟 8 月 26 日的個人消費支出物價指數撞在同一天——一個決定人工智慧資本支出的敘事能不能撐住，一個決定利率的敘事會往哪走，而這兩件事正是這個月拉扯大盤的兩股力量。", "en": "On the earnings side, today starts with Walmart before the bell, closing out the retail week; the real watershed comes after the close next Wednesday, 26 August, when Nvidia reports fiscal 2027 second-quarter results covering the three months to July. Analysts look for revenue of $93–95 billion, up roughly 67% year over year, driven by demand for AI accelerators and the volume ramp of the Blackwell architecture. What makes this report pivotal is that it collides with the PCE price index on the same 26 August — one decides whether the AI capital spending narrative holds, the other decides where the rate narrative goes, and those are precisely the two forces pulling at the market this month.", "url": "https://intellectia.ai/blog/nvidia-q2-fy27-earnings-preview-august-16-2026", "stocks": [{"t": "NVDA", "n": "8/26 盤後公布 FY27 Q2，預估營收 930 至 950 億美元、年增約 67%"}, {"t": "WMT", "n": "今晨盤前公布，是本週零售財報的收尾，隱含波動約 ±5.14%"}]},

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

          <button onClick={onClose} style={{ background:'none',border:'none',cursor:'pointer',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'12px',padding:'0' }}>✕</button>
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Subscription Key</div>
          <input type="password" className="az-input" value={key} onChange={e=>setKey(e.target.value)} placeholder="貼上 Azure Key…" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Region</div>
          <input className="az-input" value={region} onChange={e=>setRegion(e.target.value)} placeholder="eastus" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>中文嗓音（主畫面 / 連續播放）</div>
          <select className="az-input" value={voiceZh} onChange={e=>setVoiceZh(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="zh-TW-HsiaoChenNeural">曉臻（女）台灣腔・自然</option>
            <option value="zh-TW-HsiaoYuNeural">曉雨（女）台灣腔・清亮</option>
            <option value="zh-TW-YunJheNeural">雲哲（男）台灣腔・沉穩</option>
            <option value="zh-CN-XiaoxiaoNeural">曉曉（女）大陸腔・可調語氣</option>
            <option value="zh-CN-YunyangNeural">雲揚（男）大陸腔・專業播報</option>
            <option value="zh-CN-YunxiNeural">雲希（男）大陸腔・可調語氣</option>
          </select>
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>中文語氣</div>
          <select className="az-input" value={styleZh} onChange={e=>setStyleZh(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="">一般</option>
            <option value="newscast">新聞播報</option>
            <option value="chat">聊天（放鬆）</option>
            <option value="gentle">溫柔</option>
            <option value="serious">嚴肅</option>
          </select>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.6,marginTop:'4px' }}>只有大陸腔嗓音支援語氣；<br/>台灣腔會忽略這一項</div>
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>English Voice</div>
          <select className="az-input" value={voice} onChange={e=>setVoice(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="en-US-AriaNeural">Aria（女）自然流暢</option>
            <option value="en-US-JennyNeural">Jenny（女）清晰</option>
            <option value="en-US-GuyNeural">Guy（男）沉穩</option>
            <option value="en-US-DavisNeural">Davis（男）個性</option>
            <option value="en-US-TonyNeural">Tony（男）自信</option>
          </select>
        </div>
        <div style={{ display:'flex',gap:'8px' }}>
          <button onClick={handleSave} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--divider)',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>儲存</button>
          <button onClick={handleTest} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--text-secondary)',color:'var(--text-secondary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>測試</button>
        </div>
        {status && <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',color:'var(--text-tertiary)',letterSpacing:'0.1em' }}>{status}</div>}
        <div style={{ marginTop:'auto',fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.7,paddingTop:'8px',borderTop:'1px solid var(--divider)' }}>Key 存於 localStorage<br/><b>沒填 Key 會退回瀏覽器內建語音，<br/>那個聽起來就是很機械。</b><br/>要好聽請填 Azure Key。<br/><br/>朗讀語系跟著畫面走：<br/>主文中文→中文嗓音<br/>展開 English→英文嗓音</div>
      </div>
    </>,
    document.body
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

// ===== 資金流向(TradingView 官方嵌入元件,即時資料,每日排程不需更新) =====
function HeatmapView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",
        blockSize: "market_cap_basic", blockColor: "change",
        locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true,
        hasSymbolTooltip: true, isMonoSize: false,
        width: "100%", height: "100%"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 10px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>S&P 500 · 即時資金流向</span>
        <a href="https://finviz.com/map?t=sec&st=d1" target="_blank" rel="noopener noreferrer" className="source-link">Finviz 完整版 ↗</a>
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ flex:1, minHeight:0 }} />
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/20/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v8.1</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
