<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {

  }

    background: var(--bg); -webkit-font-smoothing: antialiased;

// ===== AZURE TTS =====
let _azToken = null, _azTokenExp = 0, _azAbort = null;
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
function azureStop() { if (_azAbort) { _azAbort.abort(); _azAbort = null; } }
async function azureSpeak(text, { rate='0%', onStart, onEnd, onError }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const voice = localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural';
  if (!key) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const token = await _getAzToken(key, region, ctrl.signal);
    const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'><voice name='${voice}'><prosody rate='${rate}'>${_xmlEsc(text)}</prosody></voice></speak>`;
    const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method:'POST', signal:ctrl.signal,
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
      body:ssml
    });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (ctrl.signal.aborted) return true;
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    if (onError) onError(e);
    return false;
  }
}

// ===== 每日卡片(由每日排程整批抽換,共 20 張) =====
const CARDS = [
    { "id": "overnight_0", "channel": "隔夜盤勢", "tag": "指數分歧", "color": "#E05C5C", "stocks": [{"t":"DIA","n":"道瓊ETF，本日上漲0.5%"},{"t":"QQQ","n":"那斯達克，晶片股拖累下滑"},{"t":"XLRE","n":"房地產+2.2%領漲"},{"t":"XLK","n":"科技-1.4%墊底"}], "en": "Wall Street split on July 27: the Dow climbed 0.5% to 51,947 as oil retreated and Apple surged, while the Nasdaq slipped ~0.2% to 24,932 on chip weakness. Real estate (+2.2%) and materials led; tech (XLK -1.4%) was the drag. A market of haves and have-nots, money rotating out of AI megacaps into the laggards.", "zh": "7月27日美股分歧：道瓊因油價回落、蘋果大漲上漲0.5%收51,947點，那斯達克受晶片股拖累下滑約0.2%收24,932點。房地產(+2.2%)、原物料領漲，科技(XLK -1.4%)墊底。資金正從AI大型股轉向落後族群，強弱分明。", "ja": "7月27日の米国株はまちまち。ダウは原油安とアップル急騰で0.5%高の51,947、ナスダックは半導体安で約0.2%安の24,932。不動産(+2.2%)と素材が牽引、テック(XLK -1.4%)が重し。資金はAI大型株から出遅れ銘柄へ。", "url": "https://www.fool.com/coverage/stock-market-today/2026/07/27/stock-market-today-july-27-dow-rises-on-oil-retreat-and-sandisk-plunges-11-on-memory-weakness/" },
    { "id": "overnight_1", "channel": "隔夜盤勢", "tag": "個股分化", "color": "#E05C5C", "stocks": [{"t":"AAPL","n":"漲3.5%撐盤"},{"t":"NVDA","n":"中國晶片設備量產傳聞下挫"},{"t":"MU","n":"美光記憶體價格轉弱"},{"t":"CRM","n":"Salesforce +4.0%"},{"t":"IBM","n":"+3.6%老牌權值"}], "en": "Single-stock dispersion was violent. Apple jumped 3.5%, Salesforce +4.0%, IBM +3.6% — old-guard names doing the heavy lifting. On the other side, Sandisk cratered 11% and Micron slid on memory-price weakness, while Nvidia fell on reports a Chinese firm may mass-produce key chipmaking gear. The leadership baton is visibly changing hands.", "zh": "個股分化劇烈。蘋果漲3.5%、Salesforce +4.0%、IBM +3.6%，老牌權值撐盤。另一端，Sandisk暴跌11%、美光因記憶體價格轉弱走低，輝達則因中國廠商傳出將量產關鍵晶片設備而下挫。市場領導棒子正明顯換手。", "ja": "個別株の格差が激しい。アップル3.5%高、セールスフォース4.0%高、IBM3.6%高と旧来の大型株が支える。一方サンディスクは11%急落、マイクロンもメモリ安で下落、エヌビディアは中国企業の製造装置量産報道で下げた。", "url": "https://www.theglobeandmail.com/investing/markets/stocks/META/pressreleases/3481300/stock-market-news-for-july-27-2026/" },
    { "id": "overnight_2", "channel": "隔夜盤勢", "tag": "地緣風險", "color": "#E05C5C", "stocks": [{"t":"XLE","n":"能源隨油價波動"},{"t":"USO","n":"油價自高點回落"},{"t":"NVDA","n":"AI資本支出焦點"}], "en": "Geopolitics gave one hand and took with the other. A pause in Iran fighting cooled oil off its $90–100 Strait-of-Hormuz highs, easing energy-cost fears. But the relief was overshadowed by fresh scrutiny of runaway AI capex ahead of megacap earnings — investors are asking whether the spend can ever be justified. Risk sentiment stayed jittery into a Fed week.", "zh": "地緣政治一手給、一手收。伊朗戰事暫歇讓油價從荷莫茲海峽推升的90-100美元高點回落，緩解能源成本疑慮。但這份寬慰被大型科技財報前對AI資本支出失控的重新檢視蓋過——投資人開始質疑這些投入是否划算。進入Fed週，風險情緒仍緊繃。", "ja": "地政学は与えつつ奪った。イラン戦闘の一時停止で原油はホルムズ海峡高値の90-100ドルから反落し、エネルギーコスト懸念が和らいだ。だが大型テック決算前のAI設備投資過熱への警戒がそれを覆う。FRB週入りで神経質。", "url": "https://www.cnbc.com/2026/07/26/stock-market-today-live-updates.html" },
    { "id": "earn_0", "channel": "財報速報", "tag": "財報試煉", "color": "#E8786A", "stocks": [{"t":"GOOGL","n":"資本支出上修、利潤率不如預期下跌"},{"t":"GOOG","n":"同上"},{"t":"META","n":"下週財報同受檢視"}], "en": "Alphabet is the season's cautionary tale: Q2 revenue beat, yet GOOGL sank after management hiked 2026 capex guidance and missed on search and operating margins. Cloud was the lone bright spot. The tape's message is blunt — a top-line beat no longer buys forgiveness when AI spending balloons and core margins slip.", "zh": "Alphabet成了本季警世故事：Q2營收超標，但GOOGL在管理層調升2026年資本支出指引、且搜尋與營業利潤率不如預期後下跌。雲端是唯一亮點。盤面訊息直白——當AI支出膨脹、核心利潤率下滑，光靠營收超標已無法換得市場原諒。", "ja": "アルファベットは今季の教訓。第2四半期の売上高は上回ったが、2026年の設備投資見通し引き上げと検索・営業利益率の未達でGOOGLは下落。クラウドが唯一の明るさ。売上超過だけでは許されない相場だ。", "url": "https://www.cnbc.com/2026/07/22/google-earnings-q2-goog-live-updates.html" },
    { "id": "earn_1", "channel": "財報速報", "tag": "財報廣度", "color": "#E8786A", "stocks": [{"t":"MSFT","n":"Azure須跨36%成長門檻"},{"t":"AMZN","n":"財測語氣關鍵"},{"t":"META","n":"高預期本週登場"},{"t":"AAPL","n":"本週財報"}], "en": "Beneath the megacap anxiety, breadth is strong: of 95 S&P 500 names reported, 88% beat EPS by a median 7% and 83% beat on revenue. But the bar climbs now. Microsoft, Amazon, Meta and Apple report into a market with little tolerance for a miss — Azure must clear its ~36% growth bogey, and Amazon's guidance tone matters more than the print.", "zh": "在大型股焦慮底下，財報廣度其實強勁：已公布的95家標普成分股中，88%EPS超標中位數7%，83%營收超標。但門檻正在墊高。微軟、亞馬遜、Meta、蘋果將在容錯極低的市場中公布——Azure須跨過約36%成長門檻，亞馬遜財測語氣比數字更關鍵。", "ja": "大型株の不安の裏で決算の広がりは力強い。報告済み95社中88%がEPSを中央値7%上回り、83%が売上を上回った。だがハードルは上がる。MSFT・AMZN・META・AAPLはミス許容度の低い相場で発表。Azureは約36%成長が焦点。", "url": "https://www.moomoo.com/community/feed/what-to-expect-in-the-week-ahead-big-tech-earnings-116984018501638" },
    { "id": "macro_0", "channel": "總經政策", "tag": "FOMC在即", "color": "#7C6AF7", "stocks": [{"t":"TLT","n":"長債對利率敏感"},{"t":"SPY","n":"整體市場"},{"t":"IWM","n":"小型股受利率影響"}], "en": "The Fed meets July 28–29 with rates parked at 3.50–3.75%. Markets price ~25% odds of a hike but most expect a hold, making the statement and Powell's tone the real event. With inflation still sticky, the risk is a hawkish hold that dents the rotation into rate-sensitive small caps.", "zh": "Fed於7月28-29日開會，利率停在3.50-3.75%。市場定價約25%升息機率，但多數預期按兵不動，因此聲明與鮑爾語氣才是真正看點。通膨仍黏著，風險在於「鷹派不動」可能打擊資金轉進對利率敏感的小型股。", "ja": "FRBは7月28-29日に会合、金利は3.50-3.75%で据え置き。市場は利上げ確率約25%を織り込むが大半は据え置き予想。声明とパウエル議長のトーンが本番。粘着インフレ下、タカ派据え置きが金利敏感な小型株物色を冷やすリスク。", "url": "https://www.forbes.com/sites/investor-hub/article/fed-meeting-tracker-interest-rate-strategy/" },
    { "id": "macro_1", "channel": "總經政策", "tag": "通膨數據", "color": "#7C6AF7", "stocks": [{"t":"TIP","n":"抗通膨債"},{"t":"TLT","n":"長債"},{"t":"SPY","n":"數據敏感"}], "en": "The inflation math still isn't friendly. Headline PCE ran 3.8% and core 3.3% into the June meeting, well above target, partly on energy and supply shocks. Thursday brings Q2 GDP alongside the June core PCE print — data that will either validate a Fed on hold or reignite the hike debate. The SEP still pencils core PCE at 3.3% for 2026.", "zh": "通膨數學仍不友善。6月會議前PCE年增3.8%、核心3.3%，遠高於目標，部分來自能源與供應衝擊。週四將公布Q2 GDP與6月核心PCE——這組數據要嘛佐證Fed按兵不動，要嘛重燃升息辯論。經濟預測摘要仍將2026核心PCE估在3.3%。", "ja": "インフレの数字はなお厳しい。6月会合前のPCEは3.8%、コア3.3%と目標を大きく上回る。木曜に第2四半期GDPと6月コアPCEを公表——据え置きを裏付けるか利上げ論を再燃させるかの分岐点。SEPは2026年コアPCEを3.3%と見込む。", "url": "https://intellectia.ai/blog/fed-interest-rate-decision-july-2026-analysis" },
    { "id": "sector_0", "channel": "產業風向", "tag": "能源接棒", "color": "#4EABA4", "stocks": [{"t":"XLE","n":"能源漲約20%領漲"},{"t":"XLB","n":"原物料+15%"},{"t":"XLI","n":"工業+13%"}], "en": "Energy has quietly seized market leadership, up ~20% and topping relative-strength rankings across timeframes; materials (+15%) and industrials (+13%) follow. This is the broadening trade made real — cyclicals and real assets picking up the baton as tech cools. For a market long addicted to seven names, that's a healthier, if bumpier, tape.", "zh": "能源已悄悄奪下市場領導權，漲約20%、在各時間週期的相對強度排名居首；原物料(+15%)、工業(+13%)緊隨。這正是「廣度行情」的落地——科技降溫之際，景氣循環股與實質資產接棒。對長期沉迷於七大科技股的市場，這是更健康、雖然更顛簸的盤面。", "ja": "エネルギーが静かに主導権を握り約20%高、各期間の相対強度で首位。素材(+15%)、資本財(+13%)が続く。テック冷却の中で景気敏感株と実物資産がバトンを受け取る「広がり相場」だ。7銘柄依存の市場には健全な変化。", "url": "https://medium.com/the-investors-handbook/sector-rotation-update-energy-takes-the-lead-while-technology-holds-strong-b2b42a49ec26" },
    { "id": "sector_1", "channel": "產業風向", "tag": "AI資本支出", "color": "#4EABA4", "stocks": [{"t":"NVDA","n":"AI核心"},{"t":"MSFT","n":"超大規模投資"},{"t":"AMZN","n":"雲端資本支出"},{"t":"GOOGL","n":"capex上修"}], "en": "Yet the AI buildout is far from over — hyperscalers are set to deploy $650B+ in capex this year, part of ~$3T in AI infrastructure Morgan Stanley sees by 2028, with 80% of it still ahead. The paradox: the capex punishing megacap margins today is the same spend seeding tomorrow's winners in power, cooling and networking.", "zh": "然而AI建置遠未結束——超大規模雲端業者今年將投入逾6,500億美元資本支出，屬摩根士丹利預估2028年前約3兆美元AI基礎建設的一環，其中80%尚未支出。矛盾在於：今日壓抑大型股利潤率的資本支出，正是播下明日贏家的種子——電力、散熱、網通。", "ja": "だがAI投資は終わっていない。ハイパースケーラーは今年6,500億ドル超の設備投資。モルガンS試算では2028年までに約3兆ドルのAIインフラ、うち8割が今後。今日の大型株の利益率を圧迫する投資が、電力・冷却・通信の明日の勝者を育てる。", "url": "https://www.morganstanley.com/insights/articles/magnificent-seven-rotation-portfolio-strategies-2026" },
    { "id": "small_0", "channel": "小型股風雲", "tag": "小型股領跑", "color": "#5B8ED6", "stocks": [{"t":"IWM","n":"羅素2000 ETF"},{"t":"IJR","n":"小型股"},{"t":"SPY","n":"相對表現"}], "en": "The Russell 2000 is having a year for the record books — up ~22% in 2026, its best first half since 1991, hovering near 2,970. After a long stretch of megacap dominance, small caps are finally outpacing the S&P 500. The rally paused Monday (-0.18%), but the trend that's rebuilt the case for breadth remains intact.", "zh": "羅素2000正寫下歷史級的一年——2026年漲約22%，為1991年以來最佳上半年表現，徘徊在約2,970點。歷經大型股長期主宰後，小型股終於跑贏標普500。週一漲勢暫歇(-0.18%)，但這波重建「廣度論述」的趨勢仍完好。", "ja": "ラッセル2000は記録的な年。2026年に約22%高、1991年以来最良の上半期で2,970付近。大型株支配の長期を経て、小型株がついにS&P500を上回る。月曜は一服(-0.18%)も、広がりの流れは健在。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html" },
    { "id": "small_1", "channel": "小型股風雲", "tag": "催化劑堆疊", "color": "#5B8ED6", "stocks": [{"t":"IWM","n":"小型股整體"},{"t":"XLE","n":"能源催化"},{"t":"KRE","n":"區域銀行"}], "en": "The catalysts are stacking. The late-July Fed meeting is the near-term swing factor; oil pinned at $90–100 by the Hormuz conflict is an earnings windfall for small energy producers; and individual names are repricing on hard catalysts — takeovers, court-cleared refinancings, even a Medicare reversal. Small caps live and die on idiosyncratic triggers, and there are plenty right now.", "zh": "催化劑正在堆疊。7月底Fed會議是近期關鍵擺盪因素；荷莫茲衝突把油價釘在90-100美元，對小型能源生產商是獲利意外之財；個股則因硬催化劑重新定價——併購、法院放行的再融資、甚至Medicare政策逆轉。小型股靠個別事件生死，而現在遍地都是。", "ja": "触媒が積み上がる。7月末のFRB会合が近い変動要因。ホルムズ紛争で90-100ドルに固定された原油は小型エネルギー生産者に追い風。個別銘柄は買収・再融資・メディケア方針転換で再評価。小型株は固有材料次第。", "url": "https://www.benzinga.com/markets/small-cap/26/07/60593569/russell-2000-small-cap-stocks-july-biggest-gainers-2026" },
    { "id": "small_2", "channel": "小型股風雲", "tag": "五大族群", "color": "#5B8ED6", "stocks": [{"t":"KRE","n":"區域銀行"},{"t":"XBI","n":"生技"},{"t":"IWM","n":"小型股"},{"t":"XLE","n":"能源"}], "en": "Where to hunt? Screens point to five high-probability small-cap groups for this window: regional banks and financials, domestic industrials and infrastructure, biotech and small-cap healthcare, energy and natural resources, and AI-adjacent tech. The thread connecting them — investors looking past the Magnificent 7 for the next, cheaper layer of the same trades.", "zh": "去哪裡找？篩選指向本階段五個高機率小型股族群：區域銀行與金融、本土工業與基建、生技與小型醫療、能源與天然資源、AI周邊科技。串起它們的主軸——投資人越過七巨頭，尋找同一批交易更便宜的下一層。", "ja": "どこを狙う？スクリーニングはこの局面で高確率の5グループを示す。地方銀行・金融、国内資本財・インフラ、バイオ・小型ヘルスケア、エネルギー・資源、AI周辺テック。共通項はマグ7の先を探す動き。", "url": "https://tickeron.com/trading-investing-101/the-small-cap-seasonality-forecast-why-may-june-and-july-2026-may-be-the-most-powerful-window-for-stocks-in-generation/" },
    { "id": "radar_0", "channel": "忽視雷達", "tag": "利基能源", "color": "#C9A227", "stocks": [{"t":"ERII","n":"低覆蓋+內部人買進"},{"t":"IWM","n":"小型股背景"}], "status": "RADAR · 下一個驗證點 Q2 財報（8月上旬）", "en": "Energy Recovery (ERII) makes pressure-exchanger energy-recovery devices for desalination and industrial fluid-flow — a genuine niche with a moat, yet thinly followed by the Street. It surfaced on July screens for undervalued small caps with insider buying, a combination historically worth a second look. Risk: lumpy, project-driven revenue and desalination-capex cyclicality can whipsaw quarters. This is not a buy recommendation — it's a research lead.", "zh": "Energy Recovery(ERII)生產用於海水淡化與工業流體的壓力交換能量回收裝置——是有護城河的真利基，卻乏華爾街追蹤。它出現在7月「低估值+內部人買進」的小型股篩選中，這種組合歷史上值得再看一眼。風險：專案驅動的營收波動大、海淡資本支出具週期性，單季易劇烈震盪。這不是買進建議，是研究線索。", "ja": "エナジー・リカバリー(ERII)は海水淡水化・工業流体向けの圧力交換式エネルギー回収装置を作る堀のあるニッチ企業だが、カバレッジは薄い。7月の割安小型株×インサイダー買いスクリーンに登場。リスクは案件依存の売上変動と淡水化投資の周期性。これは買い推奨ではなく研究の手がかり。", "url": "https://simplywall.st/stocks/us/capital-goods/nasdaq-erii/energy-recovery/news/top-undervalued-small-caps-with-insider-buying-in-july-2026" },
    { "id": "radar_1", "channel": "忽視雷達", "tag": "社區銀行", "color": "#C9A227", "stocks": [{"t":"ISTR","n":"區域銀行內部人買進"},{"t":"KRE","n":"區域銀行族群"}], "status": "RADAR · 下一個驗證點 FOMC 利率決議（7/29）", "en": "Investar Holding (ISTR), a Louisiana-based community bank, popped up on July's undervalued-small-cap-with-insider-buying screen. The setup is textbook overlooked-name: sub-scale regional bank, minimal analyst coverage, and insiders adding shares as regional financials broaden into leadership. Risk: rate-cycle sensitivity, commercial-real-estate exposure, thin liquidity. Not a buy recommendation — a research lead.", "zh": "Investar Holding(ISTR)是路易斯安那的社區銀行，出現在7月「低估值+內部人買進」小型股篩選中。這是教科書式的被忽視標的：次規模區域銀行、券商覆蓋極少、內部人在區域金融接棒領漲之際加碼。風險：利率週期敏感、商用不動產曝險、流動性偏薄。這不是買進建議，是研究線索。", "ja": "インベスター・ホールディング(ISTR)はルイジアナの地域銀行で、7月の割安×インサイダー買いスクリーンに浮上。小規模地銀・薄いカバレッジ・地域金融の主導入りでインサイダーが買い増しと見落とし銘柄の典型。リスクは金利感応・商業用不動産・薄い流動性。買い推奨ではなく研究の手がかり。", "url": "https://simplywall.st/stocks/us/banks/nasdaq-istr/investar-holding/news/exploring-july-2026s-undervalued-small-caps-with-insider-buy" },
    { "id": "radar_2", "channel": "忽視雷達", "tag": "公寓REIT", "color": "#C9A227", "stocks": [{"t":"CSR","n":"公寓REIT內部人買進"},{"t":"XLRE","n":"房地產本日領漲"}], "status": "RADAR · 下一個驗證點 FOMC 利率決議（7/29）", "en": "Centerspace (CSR) is a small-cap apartment REIT concentrated in Midwest and Mountain-West markets — exactly the kind of rate-sensitive real-estate name that just led Monday's tape (XLRE +2.2%). It appeared on July's insider-buying screen, pairing a possible sector tailwind with insider conviction. Risk: leverage and refinancing costs bite if the Fed stays hawkish. Not a buy recommendation — a research lead.", "zh": "Centerspace(CSR)是集中在中西部與山區州市場的小型公寓REIT——正是週一領漲盤面(XLRE +2.2%)那種對利率敏感的房地產標的。它出現在7月內部人買進篩選中，把可能的板塊順風與內部人信心結合。風險：若Fed維持鷹派，槓桿與再融資成本將反咬。這不是買進建議，是研究線索。", "ja": "センタースペース(CSR)は中西部・山岳部中心の小型アパートREIT。月曜に主導したXLRE(+2.2%)のような金利敏感な不動産銘柄だ。7月のインサイダー買いスクリーンに登場し、セクター追い風とインサイダーの確信が重なる。リスクはタカ派継続時のレバレッジと借換コスト。買い推奨ではなく研究の手がかり。", "url": "https://simplywall.st/stocks/us/real-estate/nyse-csr/centerspace/news/undervalued-small-caps-with-insider-buying-in-july-2026" },
    { "id": "radar_3", "channel": "忽視雷達", "tag": "轉機股", "color": "#C9A227", "stocks": [{"t":"ADV","n":"轉機股內部人動作"},{"t":"IWM","n":"小型股背景"}], "status": "RADAR · 下一個驗證點 Q2 財報（8月）", "en": "Advantage Solutions (ADV) provides retail sales and marketing services — in-store demos and brand outsourcing — a deeply unloved, low-multiple name that keeps landing on undervalued-with-insider-activity screens. The thesis is a classic turnaround: debt paydown plus insiders signaling a bottom. Risk: heavy leverage, thin margins, and consumer-spending sensitivity make this speculative. Not a buy recommendation — a research lead.", "zh": "Advantage Solutions(ADV)提供零售銷售與行銷服務——店內試吃、品牌外包那類——是深受冷落、低本益比的標的，卻一再出現在「低估值+內部人動作」篩選中。論點是典型的轉機股：償債加上內部人暗示觸底。風險：高槓桿、薄利、消費支出敏感，屬投機性質。這不是買進建議，是研究線索。", "ja": "アドバンテージ・ソリューションズ(ADV)は小売の販促・マーケティング代行。極めて不人気で低倍率だが割安×インサイダースクリーンに繰り返し登場。論点は典型的な再生：債務返済とインサイダーの底打ちシグナル。リスクは高レバレッジ・薄利・消費感応で投機的。買い推奨ではなく研究の手がかり。", "url": "https://simplywall.st/stocks/us/media/nasdaq-adv/advantage-solutions/news/undervalued-small-caps-with-insider-activity-to-explore-in-j-1" },
    { "id": "insider_0", "channel": "內部人動向", "tag": "群聚買進", "color": "#6DB56D", "stocks": [{"t":"SHBI","n":"內部人4-6月買進"},{"t":"MPB","n":"買進+5000萬庫藏股"},{"t":"KRE","n":"區域銀行族群"}], "en": "The loudest insider signal this month is clustered in small banks. Shore Bancshares saw insiders buy from April through June as Q1 net income rose to $17.1M from $13.8M, and Mid Penn Bancorp paired insider purchases with a beefed-up $50M buyback through April 2027. Cluster buying at regional banks — right as the group rotates into leadership — is a tell worth logging.", "zh": "本月最響亮的內部人訊號集中在小型銀行。Shore Bancshares的內部人自4月至6月買進，同期Q1淨利從1,380萬升至1,710萬美元；Mid Penn Bancorp則把內部人買進與加碼至5,000萬美元、延至2027年4月的庫藏股計畫並行。區域銀行在該族群正接棒領漲之際出現群聚買進，是值得記錄的訊號。", "ja": "今月最も明確なインサイダーシグナルは小型銀行に集中。ショア・バンクシェアーズは4-6月にインサイダーが買い、第1四半期純利益は1,380万→1,710万ドル。ミッド・ペン・バンコープは買いに加え5,000万ドル・2027年4月までの自社株買いを拡大。地銀の集団買いは記録に値する。", "url": "https://www.sahmcapital.com/news/content/undervalued-small-caps-with-insider-activity-to-explore-in-july-2026-2026-07-08" },
    { "id": "insider_1", "channel": "內部人動向", "tag": "Form 4 解讀", "color": "#6DB56D", "stocks": [{"t":"MPB","n":"5000萬庫藏股示例"},{"t":"SHBI","n":"群聚買進"}], "en": "How to read Form 4s without fooling yourself: size and conviction matter more than headcount. Via Transportation's Nechemia Peres buying 25,000 shares for $367,500 is a sizeable open-market vote; a buyback authorization like Mid Penn's $50M is management money, not insider money — related but distinct. Weigh open-market purchases against 10b5-1 auto-sells, and cluster timing against known catalysts. Insiders are earliest, not always right.", "zh": "如何讀Form 4又不自欺：金額與信念比人數重要。Via Transportation的Nechemia Peres以36.75萬美元買進2.5萬股，是相當有份量的公開市場表態；而像Mid Penn的5,000萬庫藏股授權是「公司的錢」，非「內部人的錢」——相關但不同。把公開市場買進與10b5-1自動賣出對照，把群聚時點與已知催化劑對照。內部人最早，但不總是對。", "ja": "自分を欺かずにForm 4を読む法：人数より金額と確信度。ヴィアのペレス氏が2.5万株を36.75万ドルで買うのは重みある公開市場の一票。ミッド・ペンの5,000万ドル自社株買いは会社の資金でインサイダー資金とは別物。公開買いと10b5-1自動売却を対比せよ。インサイダーは最速だが常に正しくはない。", "url": "https://www.sahmcapital.com/news/content/undervalued-small-caps-with-insider-activity-to-explore-in-july-2026-2026-07-08" },
    { "id": "week_0", "channel": "本週事件", "tag": "關鍵一週", "color": "#C97DD4", "stocks": [{"t":"SPY","n":"整體市場"},{"t":"QQQ","n":"科技財報週"},{"t":"AAPL","n":"本週財報"},{"t":"TLT","n":"Fed決議"}], "en": "This is the week that sets the tape. The FOMC decides Wednesday, July 29 at 2pm ET with a Powell presser; Thursday brings Q2 GDP and the June core PCE print. Apple, Microsoft, Amazon and Meta all report, and overseas the BoE and BoJ set policy. Four megacap prints and a Fed decision in five sessions — position sizing beats prediction.", "zh": "這是定調的一週。FOMC於7月29日(週三)美東下午2點公布決議並有鮑爾記者會；週四登場Q2 GDP與6月核心PCE。蘋果、微軟、亞馬遜、Meta皆將發布財報，海外則有英格蘭央行與日本央行議息。五個交易日內四家大型科技財報加一次Fed決議——控好部位比預測更重要。", "ja": "相場を決める一週間。FOMCは7月29日(水)米東部午後2時に決定、パウエル会見あり。木曜に第2四半期GDPと6月コアPCE。アップル・MSFT・アマゾン・メタが決算、海外はBOEとBOJが政策決定。5営業日で大型4決算とFRB——予測よりポジション管理。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar" },

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  const speakWord = React.useCallback(async (word) => {
    const ok = await azureSpeak(word, { rate:'-15%' });
    if (!ok) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US"; u.rate = 0.82;
      const voices = speechSynthesis.getVoices();
      const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
      if (picked) u.voice = picked;
      speechSynthesis.speak(u);
    }
  }, []);

  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      return;
    }
    setSpeaking(true);
    const ok = await azureSpeak(card.en, {
      rate: '-5%',
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
    if (!ok) {
      const u = new SpeechSynthesisUtterance(card.en);
      u.lang = "en-US"; u.rate = 0.88; u.pitch = 1.0; u.volume = 1.0;
      const tryVoices = () => {
        const voices = speechSynthesis.getVoices();
        const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
        if (picked) u.voice = picked;
      };
      if (speechSynthesis.getVoices().length > 0) tryVoices();
      else { speechSynthesis.onvoiceschanged = () => { tryVoices(); speechSynthesis.onvoiceschanged = null; }; }
      u.onend = () => setSpeaking(false);
      u.onerror = () => setSpeaking(false);
      speechSynthesis.speak(u);
    }
  }, [card.en, speaking]);

  // Stop speaking & close popup when card changes
  React.useEffect(() => {
    return () => {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀全文"} style={{ marginLeft:"auto" }}>{speaking ? "■" : "🔊"}</button>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          {lang === "ja"
            ? <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"15px", lineHeight:1.9, color:"var(--text-secondary)", margin:0, maxWidth:"46ch", fontWeight:300 }}>{card.ja || card.en}</p>
            : <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>}
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("ja"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="ja" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="ja" ? "close ↑" : "日本語 ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>

  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;

  const [resumeMsg, setResumeMsg] = useState(null);
  const lsKey = "mosfeed_Today_" + todaySub;

  // Read localStorage on tab/sub change
  React.useEffect(() => {
    const key = "mosfeed_Today_" + todaySub;
    try {
      const saved = parseInt(localStorage.getItem(key), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") go(idx + 1);
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(idx - 1);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 07/28/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v4.7</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
      >
        {atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} />
          </div>
        )}
      </div>

      {/* Nav bar */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => go(idx - 1)} disabled={idx === 0}>←</button>
        <span className="nav-count">{atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn" onClick={() => go(idx + 1)} disabled={atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
