// ===== AZURE TTS =====
let _azToken = null, _azTokenExp = 0, _azAbort = null;
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
function azureStop() { if (_azAbort) { _azAbort.abort(); _azAbort = null; } }
async function azureSpeak(text, { rate='0%', onStart, onEnd, onError }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const voice = localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural';
  if (!key) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const token = await _getAzToken(key, region, ctrl.signal);
    const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'><voice name='${voice}'><prosody rate='${rate}'>${_xmlEsc(text)}</prosody></voice></speak>`;
    const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method:'POST', signal:ctrl.signal,
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
      body:ssml
    });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (ctrl.signal.aborted) return true;
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    if (onError) onError(e);
    return false;
  }
}

// ===== 每日卡片(由每日排程整批抽換,共 20 張) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "油價反差", "color": "#E05C5C", "stocks": [{"t": "USO", "n": "WTI 週五收 84.67 美元、但周線跌逾 5%"}, {"t": "BNO", "n": "布蘭特收 90.12 美元、單日漲逾 1%"}, {"t": "XLE", "n": "能源類股靠油價擐題、但題材已轉弱"}], "en": "Weekend read on oil: the headline and the trend point opposite ways. Brent settled up more than 1% at $90.12 on Friday and WTI at $84.67 after Iran said it attacked two tankers transiting the Strait of Hormuz — yet crude still fell more than 5% for the week, having sold off hard on Monday as hopes of Middle East de-escalation spread. Goldman Sachs says Brent should moderate toward $80 by year-end if Hormuz fully reopens in the final quarter. The market is now trading a peace scenario it has not been given, while Iran keeps insisting on controlling the Strait under any deal.", "zh": "週末該看清楚的是油價：標題跟趨勢正在吐反。伊朗聲稱於 7/31 攻擊兩艘通過荷姆茲海峽的油輪，布蘭特原油週五收漲逾 1% 至 90.12 美元、WTI 收 84.67 美元；但拉長到整週看，原油其實跌逾 5%，因為週一中東降溫預期擴散時曾綿重跌。高盛認為若荷姆茲在第四季完全重啟，布蘭特年底可回落至 80 美元。市場現在交易的是一個還沒發生的和平劇本，而伊朗仍堅持任何協議都要掌控該海峽。", "ja": "週末に見極めるべきは原油だ——見出しとトレンドが逆を向いている。イランが7月31日にホルムズ海峡を通過中のタンカー2隻を攻撃したと発表し、ブレントは金曜1%超高の90.12ドル、WTIは84.67ドルで引けた。だが週間では5%超の下落。月曜に中東の緊張緩和期待から大きく売られたためだ。ゴールドマン・サックスは、第4四半期にホルムズが完全再開すればブレントは年末に80ドルまで落ち着くと見る。市場はまだ与えられていない和平シナリオを取引しており、イランはどんな合意でも海峡の管理を譲らないと主張し続けている。", "url": "https://www.cnbc.com/2026/07/31/oil-prices-today-brent-wti-hormuz-trump-iran-.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "財報成績單", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "已公布的約 300 家成分股中 85% 超預期"}, {"t": "RSP", "n": "等權重版本是檢驗廣度的尺"}, {"t": "QQQ", "n": "科技股已交完大部分卷子"}], "en": "Take the earnings season scorecard into the new week. Of the roughly 300 S&P 500 companies that have reported, 85% beat expectations, and aggregate profits are tracking to grow more than 47% year over year. That is a genuinely strong number — and it is exactly why the next few weeks matter more than the last few. When a beat rate is this high, it is already in the price, and the marginal dollar starts trading on guidance and on the discount rate instead. Apple's 7.35% drop on soft guidance last week was the template.", "zh": "進新的一週之前，先把財報季的成績單看完。S&P 500 已公布的約 300 家公司中，85% 繳出優於預期的每股盈餘，整體獲利追踪到年增逾 47%。這是真的很強的數字——而這正是接下來幾週比過去幾週更關鍵的原因。當超預期比例高到這種程度，好消息已經在價格裡，邊際資金開始改根據「展望」跟「折現率」交易。上週蘋果因指引偏軟而重挾 7.35%，就是這個模式的範本。", "ja": "新しい週に入る前に、決算シーズンの成績表を確認しておこう。S&P500のうちすでに発表した約300社の85%が事前予想を上回り、利益は全体で前年比47%超の伸びを辿っている。本当に強い数字だ——だからこそ、これからの数週間の方が重要になる。上振れ率がここまで高いと、好材料はすでに価格に組み込まれており、限界的な資金は「ガイダンス」と「割引率」で取引し始める。先週、アップルが見通しの弱さで7.35%安となったのがその雛形だ。", "url": "https://www.cnbc.com/2026/07/31/stock-market-next-week-outlook-for-aug-3-7-2026.html"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "週一關卡", "color": "#E05C5C", "stocks": [{"t": "XLI", "n": "ISM 製造業直接對應工業景氣"}, {"t": "XLB", "n": "原物料對製造業景氣最敏感"}, {"t": "PAVE", "n": "營建支出數據直接檢驗基建題材"}], "en": "Monday August 3 is the first checkpoint of the new month: S&P Global's final July manufacturing PMI, June construction spending, and the July ISM manufacturing index all land the same day. In the current regime these reads carry an unusual double meaning — too weak and the growth story behind the industrial and materials rotation cracks; too hot and it feeds directly into the September hike case that bonds have already started pricing. There is no longer a comfortable middle for a market positioned long both cyclicals and duration.", "zh": "8/3（週一）是新月份的第一個關卡：S&P Global 的 7 月製造業 PMI 終值、6 月營建支出、以及 7 月 ISM 製造業指數同一天公布。在目前這個環境下，這些數據有雙重含意：太弱，支撐工業與原物料輪動的景氣敍事就裂了；太強，則直接餵養債市已經開始定價的 9 月升息劇本。對一個同時做多景氣循環股與長天期債券的市場來說，舌適的中間地帶已經不存在了。", "ja": "8月3日（月）は新しい月の最初の関所だ。S&P Globalの7月製造業PMI確報、6月の建設支出、7月ISM製造業指数が同じ日に出る。今の局面ではこれらの数字に二重の意味がある。弱すぎれば、資本財や素材へのローテーションを支える景気の物語が崩れる。強すぎれば、債券市場がすでに織り込み始めた9月利上げのシナリオを直接育てる。景気敏感株とデュレーションを同時に抱える市場にとって、快適な中間地帯はもはや存在しない。", "url": "https://www.cnbc.com/2026/07/31/stock-market-next-week-outlook-for-aug-3-7-2026.html"},
    {"id": "earn_0", "channel": "財報速報", "tag": "AI 交卷", "color": "#E8786A", "stocks": [{"t": "PLTR", "n": "8/3 盤後；營收預估 18.1 億、年增 81%，EPS 0.35 年增 119%"}, {"t": "AMD", "n": "8/4 盤後；營收預估 112 億、年增 46%，毛利率 56%"}, {"t": "SOXX", "n": "7 月跌 27.43% 後，AMD 是族群信心的第一個測試"}], "en": "Two prints define the week. Palantir reports after the close on Monday August 3, with revenue seen near $1.81 billion (+81% year over year) and EPS up 119% to $0.35. AMD follows after the close on Tuesday August 4, with revenue expected at $11.2 billion (+46%), non-GAAP EPS of $1.67 and adjusted gross margin around 56%. AMD is the one that matters most: after semiconductors fell 27.43% as a group in July on doubts about AI capex returns, this is the first hard data point on whether the sell-off was a de-rating of expectations or the start of a downgrade to actual numbers.", "zh": "本週的主軸是兩份財報。Palantir 於 8/3（週一）盤後公布，營收預估約 18.1 億美元、年增 81%，EPS 預估 0.35 美元、年增 119%。超微（AMD）接在 8/4（週二）盤後，營收預估 112 億美元、年增 46%，非 GAAP EPS 1.67 美元、調整後毛利率約 56%。要盯的是 AMD：7 月半導體族群因市場質疑 AI 資本支出回報而重跌 27.43%，這份財報是第一個硬數據，能分辨那波跌勢到底只是「預期降溫」，還是「實際數字要下修」的開端。", "ja": "今週の軸は2つの決算だ。パランティアは8月3日（月）引け後で、売上は約18.1億ドル（前年比81%増）、EPSは119%増の0.35ドルが見込まれる。AMDは8月4日（火）引け後で、売上112億ドル（46%増）、非GAAPのEPS1.67ドル、調整粗利率約56%の見通し。重要なのはAMDだ。AI設備投資の回収への疑念から7月に半導体セクターが27.43%下落した後、この売りが「期待の切り下げ」だったのか、それとも「実数字の下方修正」の始まりなのかを判別する最初の硬いデータになる。", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262067492-august-3-7-2026-preview-palantir-amd-sandisk-earnings-nfarm-payrolls-tradingkey"},
    {"id": "earn_1", "channel": "財報速報", "tag": "消費體檢", "color": "#E8786A", "stocks": [{"t": "MCD", "n": "8/4 盤前；低收入族群消費力的前線指標"}, {"t": "DIS", "n": "8/5 盤前；主題樂園與串流同時驗貨"}, {"t": "XLY", "n": "非必需消費在通膨黏葡下最先受壓"}], "en": "Between the AI names sits the week's real economic read: McDonald's before the open on Tuesday August 4 and Disney before the open on Wednesday August 5. McDonald's is the cleanest available proxy for low-income consumer strength — when its value menu traffic holds up but average check falls, that is trade-down, not health. Disney gives two reads at once, theme park attendance for discretionary spending and streaming for subscription fatigue. With oil up sharply this year and inflation still at 3.5%, these two tell you whether the consumer is absorbing the energy bill or starting to cut.", "zh": "夾在 AI 題材中間的，是本週真正的經濟體檢：麥當勞於 8/4（週二）盤前、迪士尼於 8/5（週三）盤前公布財報。麥當勞是目前最乾淨的低收入族群消費力代理指標——若平價菜單客流擐得住、客單價卻下滑，那叫「降級消費」，不叫健康。迪士尼則一次給兩個讀數：主題樂園人潮看非必需消費，串流看訂閱疲乏。在油價今年大漲、6 月 CPI 仍在 3.5% 的背景下，這兩家會告訴你：消費者到底是吐得下能源帳單，還是已經開始削支出。", "ja": "AI銘柄の間にあるのが、今週の本当の景気診断だ——マクドナルドが8月4日（火）寄り付き前、ディズニーが8月5日（水）寄り付き前に発表する。マクドナルドは低所得層の消費力を見る最も澄んだ代理指標だ——価格訴求メニューの客数が保たれても客単価が下がるなら、それは「トレードダウン」であって健全さではない。ディズニーは一度に二つの情報をくれる。テーマパークの入場者数は裁量的支出、ストリーミングはサブスク疲れを示す。原油高とCPI3.5%の下、この2社が消費者はエネルギーコストを吸収できているのか、削り始めたのかを教えてくれる。", "url": "https://www.kiplinger.com/investing/stocks/17494/next-week-earnings-calendar-stocks"},
    {"id": "macro_0", "channel": "總經政策", "tag": "升息定價", "color": "#7C6AF7", "stocks": [{"t": "SHY", "n": "短天期公債最直接反映政策利率預期"}, {"t": "XLF", "n": "銀行在升息情境下淨利差相對受惠"}, {"t": "TLT", "n": "長端公債是全市場折現率的錪"}], "en": "The September hike is no longer a tail risk. The July FOMC held the funds rate at 3.50-3.75% by a 9-3 vote, with three members dissenting in favour of an immediate 25bp increase. Markets moved fast: Polymarket puts a 25bp September increase at about 60% against 39% for no change, while CME FedWatch shows roughly an 81-82% probability of at least a quarter-point hike by mid-September. The driver is inflation that will not come down — June CPI at 3.5% with core still elevated, and Fed Chair Kevin Warsh publicly framing lower inflation as the priority.", "zh": "9 月升息已經不是尾部風險。七月 FOMC 以 9 比 3 的票數將聯邦資金利率維持在 3.50-3.75%，三位委員投下反對票、主張立刻升息 1 碼。市場反應很快：Polymarket 給 9 月升息 1 碼約 60% 機率、維持不變 39%；CME FedWatch 則顯示到 9 月中至少升息 1 碼的機率約 81-82%。兩個數字口徑不同（前者指單一會議、後者是累計至期間），但方向一致。推力是降不下來的通膍——6 月 CPI 3.5%、核心仍高，而 Fed 主席 Kevin Warsh 公開把「把通膍壓下來」列為優先。", "ja": "9月の利上げはもはやテールリスクではない。7月のFOMCは9対3でFF金利を3.50-3.75%に据え置いたが、3名が即時の0.25%利上げを主張して反対した。市場の反応は早い。Polymarketは9月の0.25%利上げを約60%、据え置きを39%と見、CME FedWatchは9月中旬までに少なくとも0.25%利上げされる確率を約81-82%と示す。両者の定義は異なるが（前者は単一会合、後者は期間累計）、方向は同じだ。推進力は下がらないインフレ——6月CPIは3.5%でコアも高いまま、パウエル・ウォーシュFRB議長はインフレ低下を優先と公言している。", "url": "https://www.forbes.com/sites/simonmoore/2026/07/29/september-rate-hike-becomes-most-likely-outcome-according-to-markets/"},
    {"id": "macro_1", "channel": "總經政策", "tag": "工具錯配", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "通膍連結債反映的是預期、不是現實"}, {"t": "USO", "n": "能源是這輪通膍的上游變數"}, {"t": "XLU", "n": "公用事業同時吃燃料成本與利率上升"}], "en": "Here is the uncomfortable part of the hike debate. This inflation is not primarily demand-driven — it is a supply shock, with energy prices lifted by the Iran conflict feeding straight through to headline CPI. Rate hikes work by destroying demand. They cannot reopen the Strait of Hormuz, and they cannot put a barrel back into the market. So the Fed is reaching for a tool that treats the symptom by slowing the economy, while the cause sits outside its reach. That mismatch is why the September decision is genuinely contested inside the committee, and why a strong payroll print could force a move the data does not actually solve.", "zh": "這是升息辩論中最令人不安的一塊。這輪通膍並非以需求面為主，而是供給面衝擊——伊朗衝突推升能源價格，直接傳導到整體 CPI。而升息的運作方式是壓抑需求：它打不開荷姆茲海峽，也變不出一桶油。換句話說，Fed 拿的工具只能靠放緩經濟來處理症狀，而病因在它的射程之外。這個錯配就是為什麼 9 月的決議在委員會內部真的有爭議，也是為什麼一份強勁的非農數據，可能逼出一個其實解決不了問題的決定。", "ja": "利上げ議論の最も居心地の悪い部分だ。今回のインフレは主に需要発ではなく供給ショックであり、イラン情勢によるエネルギー価格の上昇がそのままCPIに流れ込んでいる。利上げは需要を壊すことで機能する。ホルムズ海峡を開けるわけでも、原油を一樽増やせるわけでもない。つまりFRBは、原因が射程外にあるまま、経済を冷やして症状を抑える道具を握っている。このミスマッチこそが、9月の決定が委員会内で本当に争われている理由であり、強い雇用統計が問題を解決しない決定を迫りかねない理由でもある。", "url": "https://www.cnbc.com/2026/07/23/fed-interest-rate-odds-oil-jobless-claims.html"},
    {"id": "sector_0", "channel": "產業風向", "tag": "動能排序", "color": "#4EABA4", "stocks": [{"t": "XLP", "n": "必需消費目前列於領先群"}, {"t": "XLE", "n": "能源同屬領先、支撐來自油價"}, {"t": "XLV", "n": "醫療轉弱，與「防禦輪動」直覺相反"}], "en": "Rank the sectors by momentum right now and the picture is not what the narrative suggests. Consumer staples, industrials, materials and energy are leading; healthcare is weakening; financials are lagging. Notice what that combination is saying: this is not a clean defensive rotation. If money were genuinely hiding, healthcare and utilities would lead together with staples. Instead the leadership is cyclical value — industrials and materials — which is a bet on real economic activity and capital spending, not on a slowdown. Money is leaving expensive growth without yet conceding that growth is over.", "zh": "把現在的類股按動能排一次序，圖像跟市場敘事不太一樣：必需消費、工業、原物料與能源領先，醫療保健轉弱，金融落後。這個組合在說一件事：這不是一次乾淨的防禦輪動。如果資金真的在避險，醫療與公用事業應該跟必需消費一起領先。但實際領頭的是景氣循環型價值股——工業與原物料——那是在賭實體經濟活動與資本支出，不是在賭景氣轪落。資金正在離開昂貴的成長股，但還沒有承認成長已經結束。", "ja": "今のセクターをモメンタム順に並べると、語られている物語とは違う絵が見える。生活必需品、資本財、素材、エネルギーが先行し、ヘルスケアは失速、金融は出遅れている。この組み合わせが語るのは、これが純粋なディフェンシブ・ローテーションではないということだ。本当に資金が逃げているなら、ヘルスケアと公益事業が必需品と並んで先行するはずだ。実際の主役は景気敏感なバリュー——資本財と素材——であり、これは実体経済と設備投資への賭けだ。資金は割高な成長株から離れつつ、成長の終わりはまだ認めていない。", "url": "https://www.investing.com/analysis/sector-rotation-a-guide-to-the-sp-500-momentum-status-200675903"},
    {"id": "sector_1", "channel": "產業風向", "tag": "不靠降息", "color": "#4EABA4", "stocks": [{"t": "XLI", "n": "工業同時吃電力、基建、國防三條支出"}, {"t": "ETN", "n": "電力管理；資料中心供電的直接供應鏈"}, {"t": "PWR", "n": "電網工程；電力產能擴建的承包方"}], "en": "The industrials bid deserves attention for one specific reason: it does not require rate cuts to work. The support comes from capital spending in electricity capacity, construction around the AI infrastructure buildout, defense and energy — multi-year budgets already committed, largely insensitive to whether the Fed moves 25bp in September. Compare that with the growth-stock bull case, which quietly assumes a falling discount rate. In a market where the hike probability sits near 60-80%, a thesis that survives higher rates is structurally different from one that merely hopes for lower ones.", "zh": "工業類股的這波買盤值得注意，理由很具體：它不需要降息才成立。支撐來自四條資本支出——電力產能擴建、AI 基礎建設的營建、國防與能源——這些都是已經確定的多年期預算，對 Fed 九月動不動那 1 碼幾乎不敏感。對照一下成長股的多頭論點，它其實悄悄建立在「折現率會降」這個前提上。在升息機率已經在 60-80% 之間的市場，一個「利率漲也活得下去」的論點，跟一個「只能希望利率降」的論點，是結構上不同的東西。", "ja": "資本財への買いが注目に値する理由は具体的だ——利下げを必要としない。支えは電力容量の増強、AIインフラ建設、防衛、エネルギーへの設備投資であり、いずれもすでに確定した複数年の予算だ。FRBが9月に0.25%動かすかどうかにほぼ左右されない。一方、成長株の強気論は「割引率が下がる」という前提の上に静かに立っている。利上げ確率が60-80%の市場では、「金利が上がっても生き残る」論理と「金利が下がることを願う」論理は、構造的に別物である。", "url": "https://www.schwab.com/learn/story/stock-sector-outlook"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "升息數學", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "R2K 2026 獲利成長共識升至 38%"}, {"t": "IJR", "n": "S&P 600 有獲利門檻、體質相對健康"}], "en": "Do the arithmetic on small caps before the September meeting. Consensus 2026 earnings growth for the Russell 2000 has climbed to 38%, up from about 23% at the start of the year — a genuinely bullish revision. Against that, Bank of America estimates every additional 25bp hike cuts Russell 2000 operating earnings by roughly 2%, because small companies carry far more floating-rate debt and face heavier refinancing needs than large caps. So a single hike is about a 2% haircut on the earnings line, and the market currently assigns that outcome a 60-80% probability. The rally and the risk are quantified in the same units — which is rarer, and more useful, than it sounds.", "zh": "在 9 月會議之前，先把小型股的算術做完。Russell 2000 的 2026 年獲利成長共識已從年初的約 23% 上修到 38%，這是真實的多頭修正。但對照組是：美商銀行估計，每多升息 1 碼，會讓 Russell 2000 的營業獲利減少約 2%，因為小公司的浮動利率債務比重遠高於大型股、再融資需求也更重。換算下來，升一碼就是獲利被削約 2%，而市場目前給這件事 60-80% 的機率。漲勢與風險難得地用同一個單位被量化了——這比聽起來更有用。", "ja": "9月の会合前に、小型株の算数を済ませておこう。ラッセル2000の2026年増益予想は年初の約23%から38%へ引き上げられた。本物の強気修正だ。一方、バンク・オブ・アメリカは、0.25%の利上げごとにラッセル2000の営業利益が約2%削られると見積もる。小型企業は大型株より変動金利債務の比率が高く、借換え需要も重いからだ。1回の利上げは利益の約2%毀損に相当し、市場はそれに60-80%の確率を与えている。上昇とリスクが同じ単位で数値化されている——これは稀で、思うより役に立つ。", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "指數差別", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "S&P 600 納入需連續獲利，自動濾掉燒錢公司"}, {"t": "IWO", "n": "小型成長股對流動性緊縮最敏感"}, {"t": "IWC", "n": "微型股池子更薄、放大同一個風險"}], "en": "This is the structural detail most people skip: roughly 40% of Russell 2000 constituents are currently unprofitable. That single fact changes what the index is. It is not a basket of small businesses — it is partly a basket of companies dependent on continued access to capital, and if private credit tightens, those zombie names face real bankruptcy risk rather than merely a lower multiple. The practical takeaway is that index construction is a risk decision. The S&P SmallCap 600 behind IJR requires a track record of positive earnings for inclusion, which mechanically screens out much of that tail. Same asset class, materially different exposure — choose deliberately, not by habit.", "zh": "這是大多數人會跳過的結構細節：Russell 2000 約 40% 的成分股目前是不賺錢的。光這一件事就改變了這個指數的本質：它不是一節「小公司」的集合，而有相當比重是「依賴持續取得資金才能活下去」的公司。若私募信貸市場緊縮，這些僵屍企業面對的是真實的破產風險，不只是本益比被壓低。實務上的結論是：指數編製規則本身就是一個風險選擇。IJR 背後的 S&P SmallCap 600 要求納入前需有連續獲利紀錄，機制上就濾掉了大部分尾部。同一個資產類別，曝險完全不同——要有意識地選，不是照習慣選。", "ja": "多くの人が飛ばす構造的な細部がこれだ——ラッセル2000の構成銘柄の約40%は現在赤字である。この一点だけで指数の性質が変わる。これは「小さな企業の集合」ではなく、相当部分が「資金調達を続けられて初めて存続できる企業」の集合だ。プライベートクレジットが引き締まれば、これらのゾンビ企業が直面するのは倍率の圧縮ではなく実際の破産リスクだ。実務的な結論：指数の組成ルールそのものがリスク選択である。IJRが追うS&P SmallCap 600は組入に黒字実績を要求し、尾部の多くを機械的に除外する。同じ資産クラスでもエクスポージャーは別物だ——習慣ではなく意図をもって選ぶべきだ。", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "學術基礎", "color": "#5B8ED6", "stocks": [{"t": "IWC", "n": "微型股是覆蓋度最低的池子"}, {"t": "AVUV", "n": "小型價值因子是學術異常的實作化"}], "en": "The theory behind this whole channel has an academic name: the neglected firm effect. It is a documented market anomaly — lesser-known firms produce abnormally high returns, and companies followed by fewer analysts earn higher average returns. The mechanism is not magic. Fewer analysts means slower price discovery, so genuinely new information takes longer to be reflected, and a patient reader can be early rather than lucky. But read the second half of the sentence too: those excess returns are partly compensation for real costs — wider bid-ask spreads, thinner liquidity when you want out, and a much higher chance that no one ever shows up to re-rate the stock. Neglect is an edge and a trap wearing the same coat.", "zh": "這個頻道背後的理論有個學術名字：被忽視公司效應（neglected firm effect）。這是有文獻記載的市場異常現象——知名度低的公司平均產生異常高的報酬，而分析師覆蓋越少的公司，平均報酬越高。機制不神秘：覆蓋少代表價格發現慢，真正的新資訊需要更久才被反映，而有耐心的閱讀者因此可能是「早」而不是「運氣好」。但請把句子的後半段一起讀：那些超額報酬有一部分是對真實成本的補償——更寬的買賣價差、想出場時更薄的流動性，以及「永遠沒人來重新定價」的高度可能性。被忽視既是優勢也是陷阱，而它們穿同一件外套。", "ja": "このチャンネルの背後にある理論には学術的な名前がある——ネグレクトド・ファーム効果だ。知名度の低い企業が異常に高いリターンを生み、アナリストのカバレッジが少ない企業ほど平均リターンが高いという、文献に記録された市場のアノマリーである。仕組みは神秘ではない。カバレッジが少なければ価格発見が遅く、新しい情報が反映されるまで時間がかかる。だが後半も読むべきだ。その超過リターンの一部は実コストへの対価である——広いビッドアスクスプレッド、抜けたいときの薄い流動性、そして「誰も再評価しに来ない」可能性の高さ。無関心は優位性と罠を兼ねている。", "url": "https://en.wikipedia.org/wiki/Neglected_firm_effect"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "庫藏股加碼", "color": "#C9A227", "stocks": [{"t": "AHRT", "n": "庫藏股授權提高至 1 億美元、已執行 2,710 萬"}], "status": "RADAR · 下一個驗證點 Q2 財報（看淨利息收入成長是否延續、回購執行速度）", "en": "AH Realty Trust (AHRT) is a NYSE-listed real estate trust whose earnings run through net interest income. Why it's ignored: small-cap REIT, minimal broker coverage, and the entire REIT complex is out of favour with the 30-year Treasury at a 19-year high. What's changing is capital allocation, and the numbers are specific. The board raised the repurchase authorisation to $100 million; $27.1 million has been deployed in 2026 for about 4.7 million shares at a weighted average price of $5.78, leaving $60.3 million available. Insiders have also been buying through the year. On fundamentals, Q1 2026 net interest income rose to $56.93 million from $51.98 million and net income to $19.8 million from $18.41 million. Valuation: the stock near $6.04 sits about 15.6% below GuruFocus's GF Value of $7.16. Risks, stated plainly: a REIT is one of the most rate-sensitive things you can own and the long end is still rising, buybacks are an authorisation rather than a commitment and can stop at any time, and the average buy price of $5.78 is below the current price — meaning further repurchases are less accretive from here. This is a research lead, not investment advice.", "zh": "AH Realty Trust（AHRT）是在紐約交易所掛牌的不動產信託，獲利主要來自淨利息收入。被忽視的原因：小型 REIT、券商覆蓋極少，而且在 30 年期公債殖利率創 19 年新高的現在，整個 REIT 族群都不受歡迎。正在改變的是資本配置，而且數字很具體：董事會將庫藏股授權提高到 1 億美元，2026 年至今已執行 2,710 萬美元、買回約 470 萬股，加權均價 5.78 美元，尚餘 6,030 萬美元額度；內部人今年也持續在買。基本面方面，Q1 2026 淨利息收入從 5,198 萬升至 5,693 萬美元，淨利從 1,841 萬升至 1,980 萬。估值上，股價約 6.04 美元，低於 GuruFocus 的 GF Value 7.16 美元約 15.6%。風險要說白：REIT 是對利率最敏感的資產之一，而長端殖利率還在往上；庫藏股是「授權」不是「承諾」，隨時可以停；而且均價 5.78 已低於現價，意味著從這裡再買回的增益效果比之前差。這是研究線索，不是投資建議。", "ja": "AH Realty Trust（AHRT）はNYSE上場の不動産トラストで、収益の中核は純金利収入だ。無視される理由：小型REITで証券会社のカバレッジが極めて少なく、30年債利回りが19年ぶり高水準の今、REITセクター自体が嫄われている。変化しているのは資本配分で、数字は具体的だ。取締役会は自社株買い枠を1億ドルに引き上げ、2026年はすでに2,710万ドルを執行して約470万株を加重平均価格5.78ドルで取得、残枠は6,030万ドル。内部者も年を通じて購入している。ファンダメンタルでは2026年Q1の純金利収入が5,198万ドルから5,693万ドルへ、純利益が1,841万ドルから1,980万ドルへ増加。バリュエーションは株価約6.04ドルでGuruFocusのGF Value7.16ドルを約15.6%下回る。リスクは明確に述べる。REITは最も金利感応度の高い資産の一つで、長期金利はなお上昇中。自社株買いは「枠」であって「約束」ではなく、いつでも止まる。平均5.78ドルは現在価を下回っており、ここからの買い戻しは希薄化防止効果が相対的に低い。これは研究の手がかりであり、投資助言ではない。", "url": "https://www.stocktitan.net/news/AHRT/ah-realty-trust-increases-share-repurchase-authorization-to-100-pa969jo2wqz1.html"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "分拆新股", "color": "#C9A227", "stocks": [{"t": "ATLO", "n": "愛荷華州社區銀行；NIM 連三季擴張至 3.18%"}], "status": "RADAR · 下一個驗證點 2026 年 10 月 Q3 財報（看升息情境下存款成本會不會反噬 NIM）", "en": "Ames National (ATLO) is a small Iowa community bank holding company. Why it's ignored: micro-cap, almost no broker coverage and near-zero media presence — it was recently named in a list of top-rated stocks beating the S&P 500 that Wall Street and the media simply do not write about. What's changing is the margin, and the trend is clean: net interest margin went 2.65% in Q2 2025, to 3.01% in Q1 2026, to 3.18% in Q2 2026, while the cost-to-income ratio fell from 64.34% to 58.52% over the same span. Earnings followed — Q1 2026 net income of $6.0 million ($0.67 EPS) against $3.4 million ($0.39) a year earlier, and Q2 revenue of $18.9 million with net income of $5.9 million. Trailing net profit margin improved to 31.2% from 20.6%. Now the honest counter-argument, and it is directly tied to today's macro card: management attributed part of the margin gain to a lower cost of funds from declining market rates. If the Fed hikes in September, that specific tailwind reverses. GuruFocus also flagged the stock as roughly 23% overvalued after Q1 on a GF Score of 71/100. A bank re-rating on a falling-rate assumption in a market pricing 60-80% odds of a hike deserves scepticism, not enthusiasm. Research lead, not investment advice.", "zh": "Ames National（ATLO）是愛荷華州的小型社區銀行控股公司。被忽視的原因：微型股、券商覆蓋幾乎為零、媒體聲量接近沒有——它最近被列入「跑贏 S&P 500、但華爾街與媒體就是不寫」的高評等股名單。正在改變的是淨息差，而且趨勢很乾淨：NIM 從 2025 Q2 的 2.65%、到 2026 Q1 的 3.01%、再到 2026 Q2 的 3.18%，同期成本收入比從 64.34% 降到 58.52%。獲利跟上來——Q1 2026 淨利 600 萬美元（EPS 0.67），而去年同期僅 340 萬（0.39）；Q2 營收 1,890 萬、淨利 590 萬。過去四季淨利率從 20.6% 提升到 31.2%。現在說反方論點，而且它跟今天的總經卡直接相連：管理層把部分淨息差改善歸因於「市場利率下降帶來的資金成本降低」——若 Fed 九月升息，這個順風就反轉。GuruFocus 也在 Q1 後標示該股約高估 23%（GF Score 71/100）。一家銀行建立在「利率會降」前提上的重估值，在升息機率 60-80% 的市場裡值得的是怀疑而不是熱情。研究線索，不是投資建議。", "ja": "Ames National（ATLO）はアイオワ州の小型コミュニティバンク持株会社だ。無視される理由：マイクロキャップで証券会社のカバレッジがほぼ無く、メディア露出もほぼゼロ——最近「S&P500を上回っているのにウォール街もメディアも書かない高評価銘柄」のリストに挙げられた。変化しているのは純金利マージンで、トレンドは明瞭だ。NIMは2025年Q2の2.65%、2026年Q1の3.01%、2026年Q2の3.18%と拡大し、同期間に経費率は64.34%から58.52%へ低下した。利益も追従し、2026年Q1の純利益は600万ドル（EPS0.67ドル）で前年同期の340万ドル（0.39ドル）から大幅増、Q2は売上1,890万ドル・純利益590万ドル。直近1年の純利益率は20.6%から31.2%へ改善した。ここで反対論を述べる。これは今日のマクロカードと直結する——経営陣はマージン改善の一部を「市場金利低下による調達コストの低下」と説明している。FRBが9月に利上げすれば、この追い風は逆転する。GuruFocusはQ1後に同株を約23%割高と指摘している（GF Score71/100）。「金利は下がる」という前提に立つ銀行の再評価は、利上げ確率60-80%の市場では熱狂ではなく懐疑を向けるべきだ。研究の手がかりであり、投資助言ではない。", "url": "https://simplywall.st/stocks/us/banks/nasdaq-atlo/ames-national/news/ames-national-atlo-net-interest-margin-rebound-reinforces-bu"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "本週交卷", "color": "#C9A227", "stocks": [{"t": "HDSN", "n": "8/5 Q2 財報；Hartree 一年買 834,986 股、零賣出"}], "status": "RADAR · 下一個驗證點 08/05 Q2 財報與法說會（毛利率是否回到 20% 中段）", "en": "Hudson Technologies (HDSN) recovers, reclaims and resells refrigerants — the recycling end of the HFC phase-down mandated by the AIM Act. Why it's ignored: small cap in an industry almost nobody discusses, with minimal media presence. The pool entry stands on a persistent insider signal: 10% holder Hartree Partners has bought 834,986 shares over the past year with zero sales, including 288,111 shares on July 1, 271,302 on July 2 and 65,550 (~$286,000) on July 21. Operationally, a licensing deal with Solstice Advanced Materials lets it reclaim and resell the patented HFO blends R-448A and R-449A, opening the commercial refrigeration replacement market, and Q1 2026 revenue of $60.15 million beat the $57.15 million estimate. The bear case is specific and lands this week: Q1 adjusted EPS was just $0.01 against a $0.05 estimate — an 80% miss — and management has said outright that Q2 selling prices will be below last year, because the shortage-driven price spike will not repeat. The full-year gross margin target of the mid-20s is unvalidated and an ERP transition is still being digested. Wednesday August 5 is when the guessing stops. Research lead, not investment advice.", "zh": "Hudson Technologies（HDSN）做的是冷媒回收、再製與銷售——在 AIM 法案規定 HFC 逐步淘汰的背景下，它是回收端的業者。被忽視的原因：小型股、產業冷門到幾乎無人討論、媒體聲量極低。入池的依據是持續的內部人訊號：10% 大股東 Hartree Partners 過去一年累計買進 834,986 股且期間零賣出，包含 7/1 買 288,111 股、7/2 買 271,302 股、7/21 再買 65,550 股（約 28.6 萬美元）。營運面，它與 Solstice Advanced Materials 簽授權，可回收再售專利 HFO 混合冷媒 R-448A 與 R-449A，切入商用冷凍替換需求；Q1 2026 營收 6,015 萬美元超預期的 5,715 萬。反方論點非常具體，而且本週就要揭曉：Q1 調整後 EPS 僅 0.01 美元、遠低於預期的 0.05（-80%）；管理層自己已明說 Q2 售價會低於去年，因為去年缺貨漲價不會重演；全年毛利率 20% 中段的目標尚未驗證，ERP 系統轉換也還在消化。八月五日週三，猜測就結束了。研究線索，不是投資建議。", "ja": "Hudson Technologies（HDSN）は冷媒の回収・再生・販売を手掛ける——AIM法によるHFC段階的削減の下でのリサイクル側の事業者だ。無視される理由：小型株で、業界自体がほとんど話題にならず、メディア露出も極めて低い。プール登録の根拠は継続的な内部者シグナルだ。10%株主Hartree Partnersは過去1年で834,986株を購入し売却はゼロ。7月1日に288,111株、7月2日に271,302株、7月21日に65,550株（約28.6万ドル）を取得している。事業面ではSolstice Advanced Materialsとのライセンス契約により特許HFO混合冷媒R-448A・R-449Aの再生販売が可能になり、業務用冷凍の替換需要に参入。2026年Q1売上は6,015万ドルと予想の5,715万ドルを上回った。弱気材料は具体的で、今週答えが出る：Q1の調整後EPSはわずか0.01ドルで予想0.05ドルを大幅に下回り（-80%）、経営陣自らQ2の販売価格は前年を下回ると明言している。通年の粗利率20%半ば目標は未検証で、ERP移行も消化中。8月5日（水）に推測は終わる。研究の手がかりであり、投資助言ではない。", "url": "https://www.stocktitan.net/sec-filings/HDSN/form-4-hudson-technologies-inc-ny-insider-trading-activity-d5d7823b3f57.html"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "分拆效應", "color": "#C9A227", "stocks": [{"t": "MFP", "n": "自 Middleby 分拆；首份獨立季報尚未公布"}], "status": "RADAR · 下一個驗證點 首份獨立季報（看獨立後毛利與併購節奏）", "en": "Midera Food Processing (MFP) is a pure-play global food processing technology platform with more than 30 brands and a large installed equipment base. It began trading on Nasdaq on July 7, 2026 after Middleby distributed 100% of its stock — one MFP share for every MIDD share held as of June 26. Why it's ignored: less than a month of independent existence, no standalone financial history, only about two analysts covering it, and institutional models simply do not exist yet. What's changing is structural. It has a $1 billion credit facility to fund an acquisition strategy, holds only about 1.5% of a roughly $70 billion market, and management estimates roughly $700 million of deployable acquisition capacity. There is also a well-documented reason to look at this category at all — Joel Greenblatt's observation that spin-offs consistently outperform market averages, largely because forced selling by index and legacy holders creates a temporary price dislocation. The risks are the other side of the same coin: that indiscriminate post-spin selling is real, acquisition integration can fail, food processing equipment demand tracks customer capex closely, and there is literally no independent operating record to check. The first standalone quarterly report has not yet been published. Research lead, not investment advice.", "zh": "Midera Food Processing（MFP）是純粹的全球食品加工技術平台，旗下超過 30 個品牌、擁有庞大的已安裝設備基礎。2026/07/06 Middleby 將其 100% 股份配發給股東（6/26 基準日每持 1 股 MIDD 配 1 股 MFP），07/07 起於那斯達克交易。被忽視的原因：獨立不到一個月、沒有獨立財報歷史、僅約兩位分析師覆蓋，法人模型根本還沒建立。正在改變的是結構：取得 10 億美元信貸額度支撐併購成長，在約 700 億美元的市場中僅佔 1.5% 市佔，管理層估有約 7 億美元的併購佈建空間。這類標的值得看也有文獻依據——Joel Greenblatt 指出分拆股長期穩定跑贏市場平均，主因是指數型與原股東的無差別賣壓造成短期價格錯置。風險就是同一枚硬幣的背面：那股無差別賣壓是真實的、併購整合可能失敗、食品加工設備需求與客戶資本支出高度連動，而且完全沒有獨立經營紀錄可以檢驗。首份獨立季報至今尚未公布。研究線索，不是投資建議。", "ja": "Midera Food Processing（MFP）は30を超えるブランドと広大な既存設備基盤を持つ純粋な世界的食品加工技術プラットフォームだ。2026年7月6日にMiddlebyが全株を株主に分配し（6月26日基準でMIDD1株につきMFP1株）、7月7日からナスダックで取引を開始した。無視される理由：独立から1カ月未満、単体の財務履歴なし、カバーするアナリストは約2名だけで、機関投資家のモデルがそもそも存在しない。変化しているのは構造だ。10億ドルのクレジットファシリティを確保し、約700億ドル市場でのシェアはわずか1.5%、経営陣は約7億ドルのM&A余力があると見る。このカテゴリを見る根拠もある——ジョエル・グリーンブラットは、スピンオフ株が市場平均を安定的に上回ると指摘している。主な理由は、指数型や既存株主の無差別な売りが一時的な価格の歪みを生むことだ。リスクは同じコインの裏である。その無差別な売りは実在し、M&A統合は失敗しうるし、食品加工設備需要は顧客の設備投資に強く連動し、検証できる独立後の実績が一切ない。初の単体四半期報告はまだ公表されていない。研究の手がかりであり、投資助言ではない。", "url": "https://www.businesswire.com/news/home/20260706745072/en/Middleby-Completes-Spin-off-of-Midera-Food-Processing"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "集體反向", "color": "#6DB56D", "stocks": [{"t": "CSR", "n": "中西部公寓 REIT；一年 5 筆買進、0 筆賣出"}, {"t": "ADV", "n": "CEO 一年 18 次買進、零賣出，淨買超約 40 萬美元"}], "en": "Zoom out from single filings and the July count itself is the signal: screens identified 62 to 64 US small caps that were simultaneously undervalued and seeing insider buying. That is a lot of insiders leaning against the market at once, in the same corner of the market. Two from our radar pool illustrate the pattern. Centerspace (CSR), a Midwest apartment REIT, posted five insider purchases and zero sales over the past year — director Rodney Jones-Tyson bought 1,700 shares on June 22 and director John Schissel 500 shares at $54.90 on June 18 — while the stock yields about 5.6% and has paid dividends for 30 consecutive years. Advantage Solutions (ADV), a micro-cap retail execution and marketing services firm, shows CEO David Peacock buying 18 times over the past year with zero sales, for net buying of roughly $400,000. Note what the two have in common: both are in industries the market has written off, and in both cases the insiders were buying into falling prices.", "zh": "把鏡頭從單一申報拉遠，7 月的「數量」本身就是訊號：篩選器找出 62 到 64 檔同時符合「估值低估」與「內部人買進」的美國小型股。那是相當多的內部人，在市場的同一個角落裡同時跟市場對幹。雷達池裡有兩個例子。Centerspace（CSR）是中西部公寓 REIT，過去一年 5 筆內部人買進、0 筆賣出——董事 Rodney Jones-Tyson 於 6/22 買 1,700 股、董事 John Schissel 於 6/18 以 54.90 美元買 500 股——而該股股息殖利率約 5.6%、已連續 30 年發放股息。Advantage Solutions（ADV）是微型的零售通路執行與行銷服務商，執行長 David Peacock 過去一年 18 次買進、零賣出，淨買超約 40 萬美元。注意這兩個案例的共通點：都在市場已經判死刑的產業裡，而且內部人都是往下跌的價格裡買。", "ja": "個別の届出から引いて見ると、7月の「件数」そのものがシグナルだ。スクリーニングは、割安でかつ内部者が買っている米国小型株を62～64銘柄抜き出した。市場の同じ一角で、これだけの内部者が同時に相場と逆を行っているということだ。レーダープールから例を二つ。中西部のアパートREITであるCenterspace（CSR）は過去1年で内部者の購入5件・売却ゼロ——取締役Rodney Jones-Tysonが6月22日に1,700株、取締役John Schisselが6月18日に54.90ドルで500株を取得。配当利回りは約5.6%で30年連続で配当を支払っている。マイクロキャップの小売実行・マーケティング企業Advantage Solutions（ADV）では、CEOのDavid Peacockが過去1年で18回購入・売却ゼロで、約40万ドルの純買い越しだ。両者の共通点に注目したい——どちらも市場が見限った業界にあり、どちらも内部者は下落する価格の中で買っている。", "url": "https://simplywall.st/stocks/us/real-estate/nyse-csr/centerspace/news/undervalued-small-caps-with-insider-buying-in-july-2026"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "回購判讀", "color": "#6DB56D", "stocks": [{"t": "AHRT", "n": "授權 1 億、實際執行 2,710 萬、均價 5.78"}, {"t": "MPB", "n": "4/21 加碼 5,000 萬庫藏股授權、效期至 2027/04/30"}], "en": "A buyback is not the same signal as an insider purchase, and conflating them is a common mistake. When an executive files a Form 4 'P', that is their own after-tax money. A buyback is the company's money, decided by people whose compensation is often tied to earnings per share — and reducing the share count raises EPS regardless of whether the business improved. Three checks separate a real signal from financial engineering. First, authorisation versus execution: AH Realty Trust authorised $100 million and has actually deployed $27.1 million, which is a real commitment; Mid Penn Bancorp added $50 million of authorisation on April 21 running to April 30, 2027, and the follow-through is the part still to watch. Second, the average purchase price against the current price — AHRT's $5.78 average sits below the roughly $6.04 quote, meaning they bought lower than where it trades now. Third, and most important, how it was funded: a company repurchasing stock out of free cash flow is telling you something; a company borrowing to do it is buying its own EPS on credit.", "zh": "庫藏股與內部人買進不是同一種訊號，把兩者混為一談是常見的錯誤。主管報 Form 4 的「P」，花的是他自己的稅後收入；庫藏股花的是公司的錢，而做決定的人，薪酬很常跟每股盈餘掛鉤——只要股數變少，EPS 就上去，不管生意有沒有變好。分辨真訊號與財務工程，看三件事。一、授權 vs 實際執行：AH Realty Trust 授權 1 億、實際已花 2,710 萬，這是真的掉錢；Mid Penn Bancorp 於 4/21 加碼 5,000 萬授權、效期到 2027/04/30，實際執行進度才是要盯的。二、回購均價對現價：AHRT 均價 5.78 低於目前約 6.04，代表它買在比現在低的位置。三、也是最重要的：錢從哪來。用自由現金流回購的公司是在告訴你一件事；舉債來回購的公司，只是在用信用購買自己的 EPS。", "ja": "自社株買いと内部者の購入は同じシグナルではなく、混同はよくある誤りだ。役員がForm 4の「P」を出すとき、使うのは自分の税引後の金だ。自社株買いは会社の金であり、決める人間の報酬はしばしばEPSに連動する——株数が減れば事業が改善しなくてもEPSは上がる。本物のシグナルと財務工学を見分けるチェックは三つ。第一に枠と実行の差：AH Realty Trustは1億ドルの枠に対し実際に2,710万ドルを執行済みで、これは本気だ。Mid Penn Bancorpは4月21日に5,000万ドルの枠を追加し（2027年4月30日まで）、実行進捗がこれからの見どころだ。第二に取得平均価と現在価の関係：AHRTの平均5.78ドルは現在の約6.04ドルを下回る。第三に、そして最も重要なのが原資だ。フリーキャッシュフローで買う会社は何かを語っている。借金で買う会社は、自社のEPSをクレジットで購入しているにすぎない。", "url": "https://www.stocktitan.net/news/AHRT/ah-realty-trust-increases-share-repurchase-authorization-to-100-pa969jo2wqz1.html"},
    {"id": "week_0", "channel": "本週事件", "tag": "行事曆", "color": "#C97DD4", "stocks": [{"t": "DIA", "n": "8/7 非農是本週最大變數"}, {"t": "MBC", "n": "8/4 盤後 Q2 財報（雷達池）"}, {"t": "HDSN", "n": "8/5 Q2 財報（雷達池）"}], "en": "August 3-7 stacks macro and radar validation into the same five days. Monday August 3: S&P Global final July manufacturing PMI, June construction spending, July ISM manufacturing; Palantir after the close. Tuesday August 4: McDonald's before the open, AMD after the close, and radar name MasterBrand (MBC) after the close. Wednesday August 5: Disney before the open, JOLTS job openings with economists expecting June openings slightly lower month over month, and radar names Energy Recovery (ERII) and Hudson Technologies (HDSN). Friday August 7 at 8:30am ET: the July employment report, where Barclays looks for about 100,000 jobs added, which would put the three-month average at 95,000. That last one is the week's real fulcrum — with September hike odds already at 60-80%, a hot print pushes them higher and everything rate-sensitive reprices.", "zh": "8/3-8/7 把總經與雷達驗證壓在同五天。週一 8/3：S&P Global 7 月製造業 PMI 終值、6 月營建支出、7 月 ISM 製造業；Palantir 盤後。週二 8/4：麥當勞盤前、AMD 盤後，雷達池的 MasterBrand（MBC）也在盤後。週三 8/5：迪士尼盤前；JOLTS 職缺數，市場預期 6 月職缺較前月略減；雷達池的 Energy Recovery（ERII）與 Hudson Technologies（HDSN）同日交卷。週五 8/7 美東時間上午 8:30：7 月非農就業報告，Barclays 預估新增約 10 萬人，將使三個月移動平均達 9.5 萬。最後這一項才是本週真正的支點——升息機率已在 60-80%，一份偏強的數據會把它再往上推，所有利率敏感的部位都得重新定價。", "ja": "8月3-7日は、マクロとレーダーの検証が同じ5日間に重なる。8月3日（月）：S&P Globalの7月製造業PMI確報、6月建設支出、7月ISM製造業、引け後にパランティア。8月4日（火）：マクドナルドが寄り付き前、AMDが引け後、レーダー銘柄MasterBrand（MBC）も引け後。8月5日（水）：ディズニーが寄り付き前、JOLTS求人件数（6月は前月比やや減少の予想）、レーダー銘柄のEnergy Recovery（ERII）とHudson Technologies（HDSN）。8月7日（金）米東部時間8時30分：7月雇用統計。バークレイズは約10万人増を見込み、3カ月移動平均は9.5万人となる。これが今週の真の支点だ——利上げ確率がすでに60-80%の中、強い数字はそれをさらに押し上げ、金利感応的なすべてが再評価される。", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262067492-august-3-7-2026-preview-palantir-amd-sandisk-earnings-nfarm-payrolls-tradingkey"},
    {"id": "eval_0", "channel": "今日評估", "tag": "今日提問", "color": "#E8A838", "status": "DISCUSS · 讀到最後一頁，複製 PROMPT 找 CLAUDE 復盤", "stocks": [{"t": "SPY", "n": "獲利年增 47% vs 升息機率 60-80%"}, {"t": "IWM", "n": "每升 1 碼、營業獲利約 -2%"}, {"t": "TLT", "n": "長端殖利率是兩個敘事的裁判"}], "en": "The single most important thing this weekend is that the market is holding two beliefs at once and pricing both as true. Belief one: earnings are excellent — 85% of reporters beating, aggregate profits tracking above 47% growth. Belief two: the Fed probably hikes in September, at 60% on Polymarket for the meeting and 81-82% on CME FedWatch for at least a quarter point by mid-September. Both can be factually correct and still not survive together in a valuation, because if earnings rise while the discount rate rises faster, multiples have to compress — the profit growth gets eaten on the way to present value. Small caps make the arithmetic explicit: consensus earnings growth of 38%, minus roughly 2% of operating earnings per 25bp of hiking. The question worth sitting with this week: if Friday's payroll report comes in hot and September hike odds go to 90%, which position would you reduce first — and is the reason you have not reduced it already an analysis, or a hope?", "zh": "這個週末最值得注意的一件事，是市場正同時抱著兩個信念，而且把兩個都當真在定價。信念一：財報很好——已公布公司 85% 超預期、整體獲利追踪年增逾 47%。信念二：Fed 九月很可能升息——Polymarket 給單一會議約 60%，CME FedWatch 給到 9 月中至少升 1 碼約 81-82%。這兩件事可以都是事實，卻不能在同一個估值裡共存：因為當獲利上升、但折現率升得更快，本益比就必須壓縮——獲利成長在變成現值的路上被吃掉。小型股把這個算術寫得最明白：共識獲利成長 38%，減去每升息 1 碼約 2% 的營業獲利。本週值得靜下來想的問題：如果週五非農偏強、把九月升息機率推到 90%，你會先減碼哪一個部位？而你現在還沒減的理由，到底是一個分析，還是一個希望？", "ja": "この週末、最も重要なのは、市場が二つの信念を同時に抱え、どちらも真として価格に組み込んでいることだ。信念一：決算は優秀——発表済みの85%が予想超で、利益は全体で47%超の伸び。信念二：FRBは9月に利上げする可能性が高い——Polymarketは単一会合で約60%、CME FedWatchは9月中旬までに少なくとも0.25%で約81-82%。両方とも事実でありうるが、同じバリュエーションの中で共存はできない。利益が伸びても割引率がそれより速く上がれば、倍率は圧縮される——利益成長は現在価値に変わる道中で食われるのだ。小型株はこの算数を最も明確に示す。合意増益率38%、引く、0.25%の利上げごとに営業利益約2%。今週、腕を組んで考える価値のある問い：金曜の雇用統計が強く、9月の利上げ確率が90%になったら、どのポジションを最初に縮めるか。そして、まだ縮めていない理由は分析なのか、それとも願望なのか。", "url": "https://www.forbes.com/sites/simonmoore/2026/07/29/september-rate-hike-becomes-most-likely-outcome-according-to-markets/"}
  ];

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  const speakWord = React.useCallback(async (word) => {
    const ok = await azureSpeak(word, { rate:'-15%' });
    if (!ok) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US"; u.rate = 0.82;
      const voices = speechSynthesis.getVoices();
      const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
      if (picked) u.voice = picked;
      speechSynthesis.speak(u);
    }
  }, []);

  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      return;
    }
    setSpeaking(true);
    const ok = await azureSpeak(card.en, {
      rate: '-5%',
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
    if (!ok) {
      const u = new SpeechSynthesisUtterance(card.en);
      u.lang = "en-US"; u.rate = 0.88; u.pitch = 1.0; u.volume = 1.0;
      const tryVoices = () => {
        const voices = speechSynthesis.getVoices();
        const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
        if (picked) u.voice = picked;
      };
      if (speechSynthesis.getVoices().length > 0) tryVoices();
      else { speechSynthesis.onvoiceschanged = () => { tryVoices(); speechSynthesis.onvoiceschanged = null; }; }
      u.onend = () => setSpeaking(false);
      u.onerror = () => setSpeaking(false);
      speechSynthesis.speak(u);
    }
  }, [card.en, speaking]);

  // Stop speaking & close popup when card changes
  React.useEffect(() => {
    return () => {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀全文"} style={{ marginLeft:"auto" }}>{speaking ? "■" : "🔊"}</button>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          {lang === "ja"
            ? <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"15px", lineHeight:1.9, color:"var(--text-secondary)", margin:0, maxWidth:"46ch", fontWeight:300 }}>{card.ja || card.en}</p>
            : <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>}
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("ja"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="ja" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="ja" ? "close ↑" : "日本語 ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function SettingsPanel({ open, onClose }) {
  const [key, setKey] = React.useState(() => localStorage.getItem('mf_azureKey') || '');
  const [region, setRegion] = React.useState(() => localStorage.getItem('mf_azureRegion') || 'eastus');
  const [voice, setVoice] = React.useState(() => localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural');
  const [status, setStatus] = React.useState('');
  const save = () => {
    localStorage.setItem('mf_azureKey', key);
    localStorage.setItem('mf_azureRegion', region);
    localStorage.setItem('mf_azureVoice', voice);
    _azToken = null;
  };
  const handleSave = () => { save(); setStatus('已儲存'); setTimeout(() => setStatus(''), 2000); };
  const handleTest = async () => {
    save(); setStatus('測試中…');
    const ok = await azureSpeak('Hello, this is Azure Neural voice for Mo\'s Feed.', {
      onEnd: () => setStatus('✓ 連線成功'),
      onError: (e) => setStatus('✗ ' + (e?.message || '失敗'))
    });
    if (!ok) setStatus('✗ 請先填入 Azure Key');
  };
  if (!open) return null;
  return ReactDOM.createPortal(
    <>
      <div style={{ position:'fixed',inset:0,zIndex:149 }} onClick={onClose} />
      <div style={{ position:'fixed',top:0,right:0,bottom:0,width:'252px',background:'var(--bg-elevated)',borderLeft:'1px solid var(--divider)',zIndex:150,padding:'20px 18px',display:'flex',flexDirection:'column',gap:'14px',overflowY:'auto' }}>
        <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'4px' }}>
          <span style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.18em',textTransform:'uppercase',color:'var(--text-tertiary)' }}>Azure TTS 設定</span>
          <button onClick={onClose} style={{ background:'none',border:'none',cursor:'pointer',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'12px',padding:'0' }}>✕</button>
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Subscription Key</div>
          <input type="password" className="az-input" value={key} onChange={e=>setKey(e.target.value)} placeholder="貼上 Azure Key…" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Region</div>
          <input className="az-input" value={region} onChange={e=>setRegion(e.target.value)} placeholder="eastus" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Voice</div>
          <select className="az-input" value={voice} onChange={e=>setVoice(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="en-US-AriaNeural">Aria（女）自然流暢</option>
            <option value="en-US-JennyNeural">Jenny（女）清晰</option>
            <option value="en-US-GuyNeural">Guy（男）沉穩</option>
            <option value="en-US-DavisNeural">Davis（男）個性</option>
            <option value="en-US-TonyNeural">Tony（男）自信</option>
          </select>
        </div>
        <div style={{ display:'flex',gap:'8px' }}>
          <button onClick={handleSave} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--divider)',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>儲存</button>
          <button onClick={handleTest} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--text-secondary)',color:'var(--text-secondary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>測試</button>
        </div>
        {status && <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',color:'var(--text-tertiary)',letterSpacing:'0.1em' }}>{status}</div>}
        <div style={{ marginTop:'auto',fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.7,paddingTop:'8px',borderTop:'1px solid var(--divider)' }}>Key 存於 localStorage<br/>未設定時退回瀏覽器 TTS</div>
      </div>
    </>,
    document.body
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

// ===== 資金流向(TradingView 官方嵌入元件,即時資料,每日排程不需更新) =====
function HeatmapView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",
        blockSize: "market_cap_basic", blockColor: "change",
        locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true,
        hasSymbolTooltip: true, isMonoSize: false,
        width: "100%", height: "100%"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 10px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>S&P 500 · 即時資金流向</span>
        <a href="https://finviz.com/map?t=sec&st=d1" target="_blank" rel="noopener noreferrer" className="source-link">Finviz 完整版 ↗</a>
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ flex:1, minHeight:0 }} />
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const lsKey = "mosfeed_Today_" + todaySub;

  // Read localStorage on tab/sub change
  React.useEffect(() => {
    const key = "mosfeed_Today_" + todaySub;
    try {
      const saved = parseInt(localStorage.getItem(key), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") go(idx + 1);
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(idx - 1);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/02/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v5.6</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} />
          </div>
        )}
      </div>

      {/* Nav bar */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => go(idx - 1)} disabled={isFlow || idx === 0}>←</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn" onClick={() => go(idx + 1)} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
