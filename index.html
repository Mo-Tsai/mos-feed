<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "earn_1", "channel": "財報速報", "tag": "放射性造影併購", "color": "#E8786A", "zh": "金融時報報導，GE HealthCare 正洽談以約 10 億美元收購 Sofie Biosciences，最快下週宣布。Sofie 總部在維吉尼亞州，成立約 20 年，做的是癌症 PET 掃描用的放射性造影劑。GE HealthCare 的強項是掃描機器，旗下「藥物診斷」部門則供應掃描時注射的藥劑；買下 Sofie 等於把機器與耗材綁得更緊，耗材是每做一次檢查就收一次錢的經常性營收。這筆規模對 GE HealthCare 不大，但方向清楚：放射性藥物正從治療端延伸到診斷端，專做 PET 造影劑的同業會被拿來重新比價。", "en": "GE HealthCare is in talks to buy Sofie Biosciences for about $1 billion, the Financial Times reported, with a deal possible as soon as next week. Sofie, a Virginia-based company about 20 years old, makes radioactive agents used in cancer PET scans. GE HealthCare's strength is scanners, while its pharmaceutical diagnostics unit supplies the agents injected during scans; buying Sofie ties machines and consumables more tightly, and consumables bring recurring revenue with every exam. The deal is small for GE HealthCare, but the direction is clear: radiopharmaceuticals are extending from therapy into diagnostics, and pure-play PET agent makers will be re-benchmarked.", "url": "https://seekingalpha.com/news/4642286-ge-healthcare-is-said-to-near-1b-sofie-biosciences-deal", "stocks": [{"t": "GEHC", "n": "GE HealthCare，洽談約 10 億美元收購 PET 造影劑廠 Sofie"}, {"t": "LNTH", "n": "Lantheus，PET 造影劑龍頭，同業併購會被拿來重新比價"}]},

    {"id": "macro_0", "channel": "總經政策", "tag": "升息幾成定局", "color": "#7C6AF7", "zh": "聯準會今明兩天開會，台灣時間週四凌晨 2 點公布決議。CME FedWatch 顯示期貨交易員押升息一碼、利率區間升到 3.75% 至 4.00% 的機率約九成，高盛與摩根大通的預測也站在同一邊；若成真，這是 2023 年以來首次升息。因為升息幾乎已被定價，市場真正要看的是兩件事：點陣圖是否暗示年底前還要再升，以及主席華許在記者會上怎麼描述油價造成的通膨。截至上週五，期貨定價的政策利率是 12 月約 4.1%、明年 9 月約 4.6%，等於市場已經預期這不是只升一次。", "en": "The Fed meets today and tomorrow, with the decision due at 2 a.m. Thursday Taiwan time. CME FedWatch shows futures traders putting roughly 90% odds on a quarter-point hike to a 3.75%-4.00% range, and Goldman Sachs and JPMorgan forecast the same; it would be the first hike since 2023. With the move largely priced in, markets will focus on two things: whether the dot plot signals another hike before year-end, and how Chair Warsh describes oil-driven inflation at his press conference. As of last Friday, futures priced the policy rate at about 4.1% by December and 4.6% by September 2027, meaning markets already expect more than one hike.", "url": "https://www.atfxcapital.com/en/analysis/financial-events/september-fomc-meeting-2026", "stocks": [{"t": "SHY", "n": "1-3 年期公債 ETF，對升息路徑最敏感"}, {"t": "XLF", "n": "金融類股 ETF，升息擴大利差、但也壓抑放款需求"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "整體與核心分岔", "color": "#7C6AF7", "zh": "上週五公布的 8 月消費者物價指數，把聯準會的兩難攤在桌上。整體 CPI 月增 0.4%、年增 3.4%；但扣掉食品與能源的核心 CPI 年增 2.4%，比 7 月的 2.5% 還低，月增 0.3%。兩者差了一個百分點，差距幾乎全部來自油價與汽油。升息擋得住的是需求端的通膨，擋不住管線被炸造成的供給衝擊；但如果不動作，能源價格可能透過運輸與機票慢慢滲進核心物價。這也是為什麼週三的記者會比決議本身更重要：主席怎麼切割「能源」與「核心」，決定市場怎麼預期下一步。", "en": "Last Friday's August consumer price index laid out the Fed's dilemma. Headline CPI rose 0.4% on the month and 3.4% from a year earlier, but core CPI, which excludes food and energy, rose 2.4%, down from 2.5% in July, and 0.3% on the month. The one-point gap comes almost entirely from oil and gasoline. Rate hikes can curb demand-driven inflation but not a supply shock from a bombed pipeline; yet doing nothing risks energy costs seeping into core prices through freight and airfares. That is why Wednesday's press conference matters more than the decision itself: how the chair separates energy from core will shape expectations for the next move.", "url": "https://www.kiplinger.com/investing/economy/cpi-report-august-2026-what-to-expect", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，整體通膨 3.4% 高於核心時的受惠工具"}, {"t": "JETS", "n": "航空 ETF，能源成本滲入票價的第一條傳導路徑"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "5% 關卡", "color": "#7C6AF7", "zh": "美國 10 年期公債殖利率週一盤中升到 5.014%，是 2023 年以來首次突破 5%，收盤回落到約 4.95%；30 年期一度觸及 5.38%。推升的力量有兩股：布蘭特原油一度 108 美元帶來的通膨擔憂，以及政府與企業同時大量發債造成的供給壓力。5% 對股市的意義是，無風險報酬已經接近標普 500 的盈餘殖利率，股票的風險溢酬被壓得很薄。對實體經濟最直接的傳導是房貸，長端利率不降，房貸利率就很難回落，週三盤後 Lennar 的新訂單數字會是第一個讀數。", "en": "The U.S. 10-year Treasury yield rose as high as 5.014% on Monday, topping 5% for the first time since 2023, before settling near 4.95%; the 30-year touched 5.38%. Two forces pushed it up: inflation worries as Brent briefly hit $108, and supply pressure from heavy borrowing by both the government and companies. At 5%, the risk-free return is close to the S&P 500's earnings yield, leaving a thin equity risk premium. The most direct channel into the real economy is mortgages: if long rates stay high, mortgage rates can't fall much, and Lennar's new orders after Wednesday's close will be the first read.", "url": "https://www.bloomberg.com/news/articles/2026-09-14/us-10-year-yield-breaches-5-as-inflation-supply-worries-mount", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，長端殖利率破 5% 的直接反映"}, {"t": "ITB", "n": "住宅建商 ETF，房貸利率難降的最大受害族群"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "資安變避風港", "color": "#4EABA4", "zh": "同一篇「放慢 AI」的文章，讓資安股走出完全相反的行情。週一盤中 CrowdStrike 漲約 14.9%、Zscaler 漲約 15.2%、SentinelOne 漲約 15%、Palo Alto 漲約 12.8%，Okta 漲約 4%。邏輯是 Amodei 在文中警告自主 AI 代理群可能造成數千億美元損失：AI 越強、越多代理在企業內運作，要保護的身分、端點與攻擊面就越多，資安預算只會增加。同時資安公司賣的是軟體訂閱，不必背負晶片與電力的資本支出，被市場視為「受惠 AI 風險、但不怕 AI 放慢」的少數族群。", "en": "The same 'slow down AI' essay sent cybersecurity stocks the opposite way. Intraday Monday, CrowdStrike rose about 14.9%, Zscaler about 15.2%, SentinelOne about 15% and Palo Alto about 12.8%, with Okta up about 4%. Amodei warned that swarms of autonomous AI agents could cause hundreds of billions of dollars in damage: the more capable AI becomes and the more agents run inside companies, the more identities, endpoints and attack surfaces need protecting. Security vendors also sell software subscriptions without chip or power capex, so markets see them as rare beneficiaries of AI risk that don't suffer if AI slows.", "url": "https://www.forbes.com/sites/antoniopequenoiv/2026/09/14/crowdstrike-skyrockets-14-as-ai-fears-send-cybersecurity-stocks-surging/", "stocks": [{"t": "CRWD", "n": "CrowdStrike，盤中漲約 14.9%，資安族群領頭"}, {"t": "ZS", "n": "Zscaler，盤中漲約 15.2%，零信任架構受惠 AI 代理擴散"}, {"t": "CIBR", "n": "資安 ETF，一次涵蓋整個族群"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "電力鏈重挫", "color": "#4EABA4", "zh": "今年最熱的「AI 缺電」主題週一遭到重擊。GE Vernova 收跌 8.62%，是大盤跌幅的將近 18 倍，歐洲的 Siemens Energy 也同步重挫，資料中心、光通訊與電力公用事業一起走弱。這些公司的估值建立在「資料中心用電需求連續多年高速成長」的假設上，只要 AI 開發速度出現政策上限的可能，最先被重新折價的就是離算力最遠、但估值最高的電力設備。反過來看，燃氣渦輪與電網設備的訂單多是多年期合約、交期排到數年後，短期營收不會因一篇文章改變，差別在市場願意付的倍數。", "en": "This year's hottest theme, AI-driven power shortages, took a heavy hit Monday. GE Vernova closed down 8.62%, nearly 18 times the market's decline, Europe's Siemens Energy also slumped, and data centers, optical networking and power utilities weakened together. These valuations rest on data center power demand growing rapidly for years, so any hint of a policy cap on AI development gets priced first into power equipment, far from compute but richly valued. On the other hand, gas turbine and grid equipment orders are multi-year contracts with lead times stretching years, so near-term revenue won't change because of one essay; what changes is the multiple investors will pay.", "url": "https://www.fool.com/investing/2026/09/14/why-did-ge-vernova-stock-fall-today/", "stocks": [{"t": "GEV", "n": "GE Vernova，收跌 8.62%，AI 電力主題的代表股"}, {"t": "XLU", "n": "公用事業 ETF，電力需求題材一起被折價"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "口說放慢手在簽", "color": "#4EABA4", "zh": "喊放慢的同一天，算力合約還在簽。The Information 報導，Anthropic 與 RUM Group（原影音平台 Rumble 母公司）簽下六年、137 億美元的算力採購合約，使用 RUM 在喬治亞州梅斯維爾資料中心的 GPU，RUM 股價盤中漲約 18%。另一方面，OpenAI 決定今年不上市，軟銀跌 11.4%；摩根大通把比特幣礦商轉型資料中心的 MARA 連降兩級到減碼，股價跌約 2%。這組消息說明板塊內在分化：真正拿到大客戶長約的業者被追價，只有題材、沒有簽約的轉型股被降評。", "en": "On the same day AI leaders called for a slowdown, compute contracts were still being signed. The Information reported that Anthropic signed a six-year, $13.7 billion compute deal with RUM Group, the former parent of video platform Rumble, using GPUs at RUM's data center in Maysville, Georgia; RUM rose about 18% intraday. Meanwhile, OpenAI's decision to forgo a 2026 IPO sent SoftBank down 11.4%, and JPMorgan double-downgraded MARA, a bitcoin miner pivoting to data centers, to underweight, with shares down about 2%. The sector is splitting: operators with long contracts from major customers are being bid up, while pivot stories without signed deals are being downgraded.", "url": "https://www.pymnts.com/news/artificial-intelligence/2026/anthropic-makes-13-7-compute-deal-with-trump-linked-rum-group/", "stocks": [{"t": "RUM", "n": "RUM Group，拿到 Anthropic 六年 137 億美元算力合約，盤中漲約 18%"}, {"t": "MARA", "n": "MARA，摩根大通連降兩級至減碼，轉型資料中心缺乏直接成長來源"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "跌得比大盤少", "color": "#5B8ED6", "zh": "羅素 2000 週一跌 0.40% 收 2,892 點，跌幅小於標普 500 的 0.48% 與那斯達克的 0.56%。在一個被 AI 大型股拖累的交易日，小型股相對抗跌並不意外：指數裡半導體與超大型科技股權重低，受「放慢 AI」衝擊較小。但別把它讀成資金大舉轉進小型股，羅素 2000 的年內高點停在 8/14，此後一個月沒有再創高。本週的真正考驗是週三升息：小型公司的借款比大型公司更依賴銀行貸款與浮動利率，利率每升一段，利息費用就更快吃進獲利。", "en": "The Russell 2000 fell 0.40% Monday to 2,892, less than the S&P 500's 0.48% and the Nasdaq's 0.56% declines. On a day dragged down by AI megacaps, small caps holding up better isn't surprising: the index has low weights in semiconductors and mega-cap tech, so the 'slow down AI' shock hit it less. But don't read it as a big rotation into small caps; the Russell 2000's high for the year was set Aug. 14 and it hasn't made a new one since. This week's real test is Wednesday's hike: smaller companies rely more on bank loans and floating-rate debt, so each step up in rates eats into profits faster.", "url": "https://investrade.com/market-review-september-14-2026/", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，收跌 0.40%，跌幅小於大型股"}, {"t": "IWN", "n": "羅素 2000 價值股 ETF，科技權重更低、升息週的觀察對照"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "鎢礦國家隊", "color": "#5B8ED6", "zh": "鎢與鉬零組件製造商 Elmet Group 週一同時拿到兩份政府支票：國防後勤局為重建國家國防儲備，給它一份上限約 20 億美元的鎢礦砂、精礦與鎢酸鈉供應合約；美國戰爭部另外承諾投資 4.5 億美元，交割時先撥 2 億美元，用於更新美國廠房與內華達州的 Springer 鎢礦園區。股價盤前一度漲近 46%，盤中漲幅收斂到約 31%。要分清楚的是：20 億美元是合約上限，保證下單的最低承諾只有 1.5 億美元；4.5 億美元的投資是股權、債務還是認股權，新聞稿沒有講清楚，可能有稀釋。背景是中國限制鎢出口、美國本土沒有運作中的鎢礦。", "en": "Elmet Group, a maker of tungsten and molybdenum components, landed two government checks Monday: a Defense Logistics Agency contract worth up to about $2 billion to supply tungsten ores, concentrates and sodium tungstate for the National Defense Stockpile, and a $450 million committed investment from the Department of War, with $200 million drawn at closing, to modernize U.S. plants and the Springer Tungsten Complex in Nevada. Shares jumped nearly 46% premarket before settling to about a 31% gain midday. Be clear on the terms: $2 billion is a ceiling, with a guaranteed minimum of only $150 million, and the release doesn't say whether the $450 million is equity, debt or warrants, so dilution is possible. The backdrop is Chinese tungsten export curbs and no operating U.S. tungsten mine.", "url": "https://www.globenewswire.com/news-release/2026/09/14/3360841/0/en/department-of-war-makes-landmark-450-million-committed-investment-in-the-elmet-group-to-secure-america-s-tungsten-supply-chain.html", "stocks": [{"t": "ELMT", "n": "Elmet Group，國防儲備合約上限 20 億美元＋戰爭部投資 4.5 億美元"}, {"t": "ITA", "n": "航太國防 ETF，關鍵礦物是國防供應鏈的上游"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "口服減重新選手", "color": "#5B8ED6", "zh": "小型生技 Corbus Pharmaceuticals 公布口服減重藥 CRB-913 的 1b 期 CANYON-1 試驗頂線結果：254 位非糖尿病肥胖成人、三個劑量都達統計顯著，扣除安慰劑後的減重幅度，20 毫克 2.8%、40 毫克 3.3%，60 毫克平均約 5%，而且腸胃道副作用少於已上市的口服 GLP-1。股價盤前漲 14.4% 到 9.29 美元，52 週低點是 7.12 美元。判讀時要冷靜：5% 的減重幅度遠低於注射型 GLP-1，這個分子賣的是「副作用少、可以跟其他藥合併使用」的定位；完整數據 11 月 ObesityWeek 發表，2 期單藥試驗要到 2027 年上半年才啟動。", "en": "Small biotech Corbus Pharmaceuticals reported topline Phase 1b CANYON-1 results for oral obesity drug CRB-913: in 254 obese adults without diabetes, all three doses hit statistical significance, with placebo-adjusted weight loss of 2.8% at 20 mg, 3.3% at 40 mg and about 5% on average at 60 mg, plus fewer gastrointestinal side effects than marketed oral GLP-1 drugs. Shares rose 14.4% premarket to $9.29, against a 52-week low of $7.12. Keep perspective: 5% weight loss is far below injectable GLP-1s, so the molecule's pitch is tolerability and use in combinations; full data come at ObesityWeek in November, and a Phase 2 monotherapy study won't start until the first half of 2027.", "url": "https://ca.investing.com/news/stock-market-news/why-is-corbus-pharmaceuticals-stock-surging-today-93CH-4837817", "stocks": [{"t": "CRBP", "n": "Corbus，口服減重藥 1b 期三劑量皆顯著，盤前漲 14.4%"}, {"t": "LLY", "n": "禮來，口服與注射減重藥的標竿，新分子都拿它比療效"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "上修指引仍下跌", "color": "#5B8ED6", "zh": "穿戴式心臟去顫器公司 Kestra Medical 週一盤後公布會計年度第一季：營收 3,100 萬美元、年增 60%，毛利率從 45.7% 升到 56.5%，全年營收指引從 1.37 億上修到 1.41 億美元。但調整後每股虧損 0.75 美元，比預估的 0.45 美元多了六成多，淨損擴大到 4,410 萬美元，季度營運現金流出 3,230 萬美元。股價盤前收漲 5.3% 到 24.06 美元，盤後反跌 9.43%。這是判讀成長型小型股的典型場景：營收成長已經被股價預期，市場接著看的是燒錢速度，手上 2.45 億美元現金以目前的流出速度大約撐兩年。", "en": "Wearable cardiac defibrillator maker Kestra Medical reported fiscal first-quarter results after Monday's close: revenue rose 60% to $31.0 million, gross margin climbed to 56.5% from 45.7%, and full-year revenue guidance rose to $141 million from $137 million. But the adjusted loss of 75 cents a share was more than 60% wider than the 45-cent estimate, the net loss widened to $44.1 million, and operating cash burn was $32.3 million. Shares closed up 5.3% at $24.06, then fell 9.43% after hours. It's a classic setup for growth small caps: revenue growth was already priced in, so the market turned to burn rate, and $245 million in cash lasts roughly two years at the current pace.", "url": "https://www.globenewswire.com/news-release/2026/09/14/3361529/0/en/kestra-medical-technologies-reports-first-quarter-fiscal-2027-financial-results.html", "stocks": [{"t": "KMTS", "n": "Kestra Medical，營收年增 60% 並上修指引，但虧損擴大、盤後跌 9.43%"}, {"t": "IHI", "n": "醫療器材 ETF，成長型醫材股的族群參照"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "盤前漲幅打折", "color": "#5B8ED6", "zh": "判讀小型股消息面的一個知識：盤前漲幅常常會打折。週一的兩個例子，Elmet Group 盤前一度漲近 46%，到了盤中只剩約 31%；Corbus 盤前漲 14.4%，也是在正式開盤前的報價。盤前與盤後交易的參與者少、掛單薄，幾筆市價單就能把價格推得很遠，等到正規交易時段大量賣單進場，才形成比較真實的價格。所以看到「消息股盤前大漲」時，比較可靠的讀法是等收盤價與成交量：若收盤仍守住大部分漲幅、而且量是平日的數倍，才代表有新資金認同，而不是早起的少數人在追價。", "en": "A lesson in reading small-cap news: premarket gains often get marked down. Two examples Monday: Elmet Group rose nearly 46% premarket but was up only about 31% midday, and Corbus's 14.4% jump was also a pre-open quote. Premarket and after-hours sessions have few participants and thin order books, so a handful of market orders can move prices far, and a more realistic price forms only when regular-session sellers arrive. When a news stock surges premarket, a more reliable read is to wait for the close and volume: if it holds most of the gain on several times normal volume, new money agrees, rather than a few early buyers chasing.", "url": "https://seekingalpha.com/news/4642395-elmet-group-soars-after-winning-2b-us-tungsten-contract-pentagon-makes-450m-investment", "stocks": [{"t": "ELMT", "n": "Elmet Group，盤前一度漲近 46%、盤中收斂到約 31%"}, {"t": "CRBP", "n": "Corbus，盤前漲 14.4%，看收盤與成交量才算數"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新名字 · 兩位高管同日買", "color": "#C9A227", "zh": "Omega Flex 生產瓦斯用的不鏽鋼波紋軟管（CSST）與醫院氣體用的 MediTrac 管材，市值約 2.6 億美元。為什麼被忽視：賣方分析師追蹤極少，產品又綁在新屋開工這個正在下滑的循環上，媒體聲量幾近於零。什麼正在改變：9/14 總裁 Edwin Moran 以 25.43 美元買進 790 股、財務長 Matthew Unger 以 25.42 美元買進 1,000 股，股價貼著 52 週低點 25.58 美元（高點 37.92 美元）；8 月 MediTrac 取得歐盟 CE 認證，打開醫療市場；季配息 0.34 美元，以現價計殖利率約 5.3%，毛利率即使下滑仍有 55%。風險與反方論點：兩人合計只買約 4.5 萬美元，金額小、訊號偏弱；第二季營收年減 5.8%、營業利益年減 35.3%，升息讓新屋開工更難回溫。這是研究線索，不是投資建議。", "en": "Omega Flex makes corrugated stainless steel tubing for gas lines and MediTrac tubing for hospital gases, with a market value of about $260 million. Why it's ignored: almost no sell-side coverage, products tied to a declining housing-start cycle and near-zero media attention. What's changing: on Sept. 14 President Edwin Moran bought 790 shares at $25.43 and CFO Matthew Unger bought 1,000 at $25.42, with the stock sitting on its 52-week low of $25.58 (high $37.92); MediTrac won EU CE mark approval in August, opening medical markets; the $0.34 quarterly dividend yields about 5.3%, and gross margin is still 55% after slipping. Risks and counterpoints: the two bought only about $45,000 combined, a weak signal; second-quarter sales fell 5.8% and operating profit 35.3%, and rate hikes make a housing rebound harder. This is a research lead, not investment advice.", "url": "https://www.globenewswire.com/news-release/2026/08/12/3344090/8168/en/omega-flex-inc-announces-second-quarter-2026-earnings-and-ce-mark-approval-for-meditrac-corrugated-medical-tubing.html", "status": "RADAR · 下一個驗證點 11 月 Q3 財報：毛利率能否守住 55%、配息是否維持 0.34 美元", "stocks": [{"t": "OFLX", "n": "Omega Flex，總裁與財務長 9/14 同日買進，股價貼近 52 週低點"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新名字 · 三人接力買", "color": "#C9A227", "zh": "Granite Ridge Resources 是「非作業型」油氣公司：不自己鑽井，而是買下各大盆地油井的工作權益，由別人作業、它按比例出錢分收入。為什麼被忽視：股價約 5 美元、非作業模式缺乏話題，油價破百的行情裡資金都去追大型頁岩油與油服。什麼正在改變：9 月內三位內部人接力買進，董事 McCartney 9/1 以 5.04 美元買 5,000 股、財務長 Kettler 9/4 以 5.05 美元買 6,000 股、董事 Matthew Miller 9/11 以 5.03 美元買 1 萬股（持股約 197 萬股）；第二季產量 32,044 桶油當量／日、淨利 3,000 萬美元，公司說 2026 是資本支出超過現金流的最後一年、年底產量目標 4 萬桶；季配息 0.11 美元，現價殖利率約 8.7%。風險與反方論點：若停火讓油價回落，高配息與擴產同時要錢；非作業者無法控制鑽井節奏；三筆買進合計約 10 萬美元，金額不大。這是研究線索，不是投資建議。", "en": "Granite Ridge Resources is a non-operated oil and gas company: it doesn't drill, but buys working interests in wells across major basins, paying and collecting its share while others operate. Why it's ignored: a roughly $5 stock with an unglamorous model, while oil above $100 sends money to big shale producers and service names. What's changing: three insiders bought in September, director McCartney 5,000 shares at $5.04 on Sept. 1, CFO Kettler 6,000 at $5.05 on Sept. 4 and director Matthew Miller 10,000 at $5.03 on Sept. 11 (holding about 1.97 million); second-quarter output was 32,044 Boe per day with $30.0 million net income, the company says 2026 is the last year capex exceeds cash flow, targeting 40,000 Boe per day at year-end; the $0.11 quarterly dividend yields about 8.7%. Risks and counterpoints: if a ceasefire drops oil, the dividend and growth both need cash; non-operators don't control drilling pace; the three purchases total only about $100,000. This is a research lead, not investment advice.", "url": "https://www.investing.com/news/insider-trading-news/granite-ridge-director-matthew-miller-buys-50300-in-stock-93CH-4900083", "status": "RADAR · 下一個驗證點 11 月 Q3 財報：產量是否往 4 萬桶推進、自由現金流何時轉正", "stocks": [{"t": "GRNT", "n": "Granite Ridge，9 月三位內部人接力買進，殖利率約 8.7%"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "新名字 · 董事加碼一倍", "color": "#C9A227", "zh": "Angel Studios 是以付費會員「Guild」投票決定發行哪些電影的影視公司，主打價值觀與家庭題材。為什麼被忽視：題材被主流媒體視為小眾，上市時間短，追蹤分析師約 5 家，股價在 5 美元上下。什麼正在改變：董事 Steven Sarowitz 8/14 以 4.26 美元買約 5.8 萬股，9/9 以 4.95 美元買 13.3 萬股、9/10 再以 5.28 美元買 35.6 萬股，持股增加一倍多到約 124 萬股，InsiderClusters 統計一個月內三位內部人合計買進約 570 萬美元；第二季 Guild 付費會員 261 萬人、年增 99%，Guild 營收 9,070 萬美元、年增 94%，行銷費用占 Guild 營收從 71.6% 降到 52.8%，規模效益開始出現。風險與反方論點：第二季淨損仍擴大到 2,380 萬美元；會員成長靠下半年七部院線片撐，片子票房不如預期就會斷；小眾內容的天花板在哪裡還沒被證明。這是研究線索，不是投資建議。", "en": "Angel Studios is a film and TV company whose paying 'Guild' members vote on which titles it releases, focusing on values-driven and family content. Why it's ignored: mainstream media treat the niche as small, it's recently listed, about five analysts cover it and shares trade around $5. What's changing: director Steven Sarowitz bought about 58,000 shares at $4.26 on Aug. 14, 132,639 at $4.95 on Sept. 9 and 355,998 at $5.28 on Sept. 10, more than doubling his stake to about 1.24 million shares, and InsiderClusters counts about $5.7 million of buying by three insiders in a month; Guild paying members reached 2.61 million in the second quarter, up 99%, Guild revenue rose 94% to $90.7 million, and marketing fell to 52.8% of Guild revenue from 71.6%, showing scale benefits. Risks and counterpoints: the second-quarter net loss widened to $23.8 million; member growth leans on seven theatrical releases in the second half, which could disappoint; the ceiling for niche content is unproven. This is a research lead, not investment advice.", "url": "https://www.marketbeat.com/instant-alerts/insider-steven-sarowitz-buys-355998-shares-of-angel-studios-nyse-angx-stock-2026-09-11/", "status": "RADAR · 下一個驗證點 Q3 財報：Guild 會員是否站上 300 萬、全年調整後 EBITDA 虧損是否低於 2,500 萬美元", "stocks": [{"t": "ANGX", "n": "Angel Studios，董事一個月內加碼一倍，Guild 會員年增 99%"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內更新 · 驗證點通過", "color": "#C9A227", "zh": "池內的 Gloo Holdings（服務教會與非營利組織的 AI 平台）入池時設的驗證點是「第二季能否達成年增 172% 的指引」，結果超標：第二季營收 4,660 萬美元、年增 188%，全年營收指引上修到 2 億美元，第三季指引 5,500 萬美元、年增 69%，並預期第四季調整後 EBITDA 轉正。新動態是執行董事長、前英特爾執行長 Pat Gelsinger 9/11 以約 3.34 美元再買 5 萬股、約 16.7 萬美元，信託持股增加到 36.5 萬股。股價卻貼近 52 週低點 2.90 美元，距高點 9.98 美元跌了 67%，市場還在消化 7 月增發 700 萬股的稀釋。風險與反方論點：年增率從 188% 降到 69% 是明顯減速；獲利轉正還只是指引；增發可能不是最後一次。這是研究線索，不是投資建議。", "en": "Pool name Gloo Holdings, an AI platform for churches and nonprofits, entered with a checkpoint of hitting its 172% second-quarter growth guidance, and it beat: revenue rose 188% to $46.6 million, full-year guidance was raised to $200 million, third-quarter guidance is $55 million, up 69%, and it expects positive adjusted EBITDA in the fourth quarter. The new development: executive chair and former Intel CEO Pat Gelsinger bought another 50,000 shares at about $3.34 on Sept. 11, roughly $167,000, lifting his trust's holding to 365,499 shares. Yet the stock sits near its 52-week low of $2.90, down 67% from a $9.98 high, as the market digests July's 7 million-share offering. Risks and counterpoints: growth slowing from 188% to 69% is a sharp deceleration; profitability is still only guidance; another offering is possible. This is a research lead, not investment advice.", "url": "https://www.investing.com/news/insider-trading-news/gloo-holdings-executive-chair-gelsinger-buys-166k-in-stock-93CH-4898497", "status": "RADAR · 池內更新 · 下一個驗證點 11 月 Q3 財報營收是否達 5,500 萬美元、Q4 調整後 EBITDA 能否如期轉正", "stocks": [{"t": "GLOO", "n": "Gloo，Q2 營收年增 188% 超標，Gelsinger 9/11 再買 5 萬股"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新 · 買得比記錄多", "color": "#C9A227", "zh": "池內的 CarParts.com（線上汽車售後零件通路）9/12 入池時記錄的內部人買進約 43.8 萬美元，逐筆查 Form 4 後發現低估了。營運長 Michael Huffaker 在 9/4 到 9/9 之間買進 79,458 股、約 74.8 萬美元，持股增加到 13.9 萬股；執行長 David Meniane 則是分批進場，8/31 買 4,612 股、9/9 買 21,742 股、9/10 再以 10.06 美元買 13,250 股，持股 31.3 萬股。兩位經營者合計投入約百萬美元量級，以一家市值不到 2 億美元的公司來說分量不輕。基本面維持入池時的判斷：第二季營收年減 10.7%，但調整後 EBITDA 由負轉正 180 萬美元、連續第六季改善。風險與反方論點：營收仍在衰退，改善可能只是砍成本；亞馬遜等低價通路的競爭沒有變。這是研究線索，不是投資建議。", "en": "When CarParts.com, an online auto parts retailer, entered the pool on Sept. 12, insider buying was recorded at about $438,000; a filing-by-filing check shows that understated it. COO Michael Huffaker bought 79,458 shares from Sept. 4 to Sept. 9, about $748,000, lifting his stake to 139,560 shares; CEO David Meniane bought in tranches, 4,612 shares on Aug. 31, 21,742 on Sept. 9 and 13,250 at $10.06 on Sept. 10, for 312,664 shares. The two executives committed on the order of $1 million, meaningful for a company worth under $200 million. Fundamentals are unchanged from entry: second-quarter sales fell 10.7%, but adjusted EBITDA turned positive at $1.8 million, a sixth straight quarter of improvement. Risks and counterpoints: revenue is still shrinking, improvement may be just cost cuts, and competition from Amazon and other low-price channels hasn't changed. This is a research lead, not investment advice.", "url": "https://www.investing.com/news/insider-trading-news/carpartscom-ceo-david-meniane-buys-133k-in-company-stock-93CH-4897123", "status": "RADAR · 池內更新 · 下一個驗證點 11 月 Q3 財報自由現金流是否轉正、營收年減是否收斂到個位數", "stocks": [{"t": "PRTS", "n": "CarParts.com，營運長與執行長合計買進約百萬美元量級"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內更新 · 同業拿大單", "color": "#C9A227", "zh": "池內的 United States Antimony（美國本土銻的開採與冶煉）9/12 被標註為「論點受損」：銻的實現售價從每磅 28.32 美元跌到 13.70 美元，毛利率崩到 7%。週一的新參考來自同業：同樣供應國防儲備的鎢製品商 Elmet Group，拿到國防後勤局上限 20 億美元的合約，外加戰爭部 4.5 億美元投資。這說明政府對關鍵礦物的做法，已經從「採購」升級到「出資蓋產能」，這正是 United States Antimony 垂直整合論點需要的政策環境；它手上那紙國防後勤局 2.45 億美元的五年獨家合約，截至第二季累計訂單 5,730 萬美元。風險與反方論點：同業拿到錢不等於它也會拿到；政策利多救不了銻價，入池時設的降級條件（Q3 實現售價續跌且自有礦石比重沒提升）仍然有效。這是研究線索，不是投資建議。", "en": "Pool name United States Antimony, a domestic antimony miner and smelter, was flagged 'thesis impaired' on Sept. 12 after its realized antimony price fell to $13.70 a pound from $28.32 and gross margin collapsed to 7%. Monday brought an outside reference from a peer: tungsten products maker Elmet Group, which also supplies the defense stockpile, won a Defense Logistics Agency contract worth up to $2 billion plus a $450 million Department of War investment. Government policy on critical minerals is moving from buying to funding capacity, the environment UAMY's vertical-integration thesis needs; its own five-year, $245 million sole-source DLA contract had $57.3 million of cumulative orders through the second quarter. Risks and counterpoints: a peer getting funded doesn't mean UAMY will; policy support can't fix antimony prices, and the downgrade trigger set earlier (falling realized prices in Q3 without a higher share of self-mined ore) still stands. This is a research lead, not investment advice.", "url": "https://www.investing.com/news/company-news/us-antimony-begins-deliveries-under-245m-defense-contract-93CH-4770359", "status": "RADAR · 池內更新 · 下一個驗證點 11 月 Q3 財報實現售價是否止跌、國防後勤局訂單是否從 5,730 萬美元往上加", "stocks": [{"t": "UAMY", "n": "United States Antimony，論點受損中，同業 Elmet 拿到政府出資是政策面參考"}]},
    {"id": "insider_0", "channel": "內部人動向", "tag": "執行長百萬進場", "color": "#6DB56D", "zh": "Calvin Klein 與 Tommy Hilfiger 的母公司 PVH，執行長 Stefan Larsson 9/11 以平均 70.53 美元買進 14,179 股，金額約 100 萬美元。時間點有意思：股價前一週跌了將近 5%，而最近一季財報每股盈餘 3.70 美元、遠高於預估的 3.08 美元，但這個超標主要來自一次性的關稅退款，營收其實年減 3%。判讀提醒：執行長用自己的錢在財報後、股價回落時買進，是比較有分量的訊號；但也要看清楚，這份財報的「好」有一部分不會重複，他買進代表對品牌轉型有信心，不代表下一季還會有同樣的關稅退款。", "en": "PVH, parent of Calvin Klein and Tommy Hilfiger, said CEO Stefan Larsson bought 14,179 shares at an average $70.53 on Sept. 11, about $1 million. The timing is notable: the stock fell nearly 5% the prior week, and the latest quarter's $3.70 EPS beat the $3.08 estimate, but mostly thanks to one-time tariff refunds while revenue fell 3%. Reading note: a CEO buying with his own money after earnings as the stock pulls back is a meaningful signal, but part of this report's strength won't repeat; his purchase shows confidence in the brand turnaround, not that next quarter will bring another tariff refund.", "url": "https://www.investing.com/news/insider-trading-news/pvh-ceo-stefan-larsson-purchases-1-million-in-pvh-stock-93CH-4898583", "stocks": [{"t": "PVH", "n": "PVH，執行長 9/11 以 70.53 美元買進約 100 萬美元"}, {"t": "XRT", "n": "零售 ETF，服飾品牌與關稅成本的族群參照"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "兩千萬的比例", "color": "#6DB56D", "zh": "GameStop 執行長 Ryan Cohen 9/10 以平均 20.38 美元買進 100 萬股、約 2,030 萬美元，董事 Alain Attal 同日買進 5,000 股、約 10 萬美元，消息出來後股價漲 4% 到 21.26 美元。在內部人篩選器上，這是當週金額最大的執行長買進之一。判讀提醒：金額要放在持股規模裡看。Cohen 買完後直接持有約 3,935 萬股，這次加碼只讓持股增加約 2.6%；對一位本來就重倉的大股東來說，這更像「維持信心的表態」，而不是發現新價值的突然押注。相比之下，一位持股很少的高管拿出年薪等級的錢買進，資訊量可能更大。", "en": "GameStop CEO Ryan Cohen bought 1 million shares at an average $20.38 on Sept. 10, about $20.3 million, and director Alain Attal bought 5,000 shares, about $100,000, the same day; shares rose 4% to $21.26 on the news. It was one of the largest CEO purchases on insider screens that week. Reading note: size must be judged against holdings. After the purchase Cohen directly owns about 39.35 million shares, so the buy raised his stake only about 2.6%; for an already heavily invested holder it reads more as a statement of continued confidence than a sudden bet on newly found value. An executive with a small stake spending a year's salary may carry more information.", "url": "https://www.fool.com/coverage/filings/2026/09/12/gamestop-billionaire-ryan-cohen-buys-1-million-shares-for-usd20-million-what-this-large-purchase-means-for-gme/", "stocks": [{"t": "GME", "n": "GameStop，執行長買進約 2,030 萬美元，但只讓持股增加約 2.6%"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "大股東不是經營者", "color": "#6DB56D", "zh": "本週內部人買進金額排行榜的第一名是廢棄物處理龍頭 Republic Services，單檔就占了數億美元，但買家不是經營團隊，而是蓋茲的投資公司 Cascade Investment。它是持股 36.7% 的大股東，8 月 18 日起幾乎每週都在買：8/18 至 8/19 約 37.9 萬股、8/24 至 8/25 約 57.1 萬股、8/27 約 56 萬股，9 月 3、4、9 日又在每股 220 到 225 美元間加碼。判讀提醒：Form 4 把持股超過 10% 的股東也算作「內部人」，所以這類長期配置資金常常把排行榜灌爆。它代表一位超長線投資人持續加碼，而不是管理層知道了什麼新消息；看篩選器時，最好把 10% 大股東與高管分開看。", "en": "The top name on this week's insider-buying leaderboard is waste hauler Republic Services, with hundreds of millions of dollars, but the buyer isn't management; it's Cascade Investment, Bill Gates's investment firm and a 36.7% holder. It has bought almost weekly since Aug. 18: about 379,000 shares Aug. 18-19, about 571,000 Aug. 24-25, about 560,000 Aug. 27, and more on Sept. 3, 4 and 9 at $220 to $225 a share. Reading note: Form 4 counts 10%-plus holders as insiders, so long-term allocators like this often dominate the rankings. It shows an ultra-long-term investor adding, not management acting on new information; when using screeners, separate 10% holders from executives.", "url": "https://www.stocktitan.net/sec-filings/RSG/schedule-13d-a-republic-services-inc-amended-major-shareholder-report-60806f576a07.html", "stocks": [{"t": "RSG", "n": "Republic Services，蓋茲的 Cascade 持股 36.7% 並持續加碼"}, {"t": "WM", "n": "Waste Management，同業龍頭，比較廢棄物處理的估值"}]},

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

// ===== 資金流向(TradingView 官方嵌入元件,即時資料,每日排程不需更新) =====
function HeatmapView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",
        blockSize: "market_cap_basic", blockColor: "change",
        locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true,
        hasSymbolTooltip: true, isMonoSize: false,
        width: "100%", height: "100%"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 10px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>S&P 500 · 即時資金流向</span>
        <a href="https://finviz.com/map?t=sec&st=d1" target="_blank" rel="noopener noreferrer" className="source-link">Finviz 完整版 ↗</a>
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ flex:1, minHeight:0 }} />
    </div>
  );
}

// ===== 政要績效(TradingView 官方嵌入元件,即時資料,每日排程不需更新) =====
// NANC = 民主黨籍國會申報交易 ETF、GOP = 共和黨籍(原 KRUZ,2025-03-21 改代號),兩檔都依 STOCK Act
// 申報建倉;拿它們跟 SPY 比,就是「照著政要申報買」的真實長期績效,不必自己算、也不會過期。
function PerfView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        symbols: [["民主黨 NANC", "CBOE:NANC|12M"], ["共和黨 GOP", "CBOE:GOP|12M"], ["標普500 SPY", "AMEX:SPY|12M"]],
        chartOnly: false, locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        autosize: true, showVolume: false, showMA: false,
        hideDateRanges: false, hideMarketStatus: true, hideSymbolLogo: false,
        scalePosition: "right", scaleMode: "Percentage",
        fontSize: "10", noTimeScale: false, valuesTracking: "1",
        changeMode: "price-and-percent", chartType: "area"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  const R = CAPITOL_ROSTER;
  const money = n => n >= 1000000 ? "$" + (n / 1000000).toFixed(1) + "M"
                   : n >= 1000 ? "$" + Math.round(n / 1000) + "k" : "$" + n;
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px", overflowY:"auto" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 6px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>政要交易 ETF · 近一年</span>
        <a href="https://www.quiverquant.com/congresstrading/" target="_blank" rel="noopener noreferrer" className="source-link">Quiver 排行 ↗</a>
      </div>
      <div style={{ padding:"0 16px 10px", fontSize:"11px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
        NANC 跟著民主黨籍議員的申報建倉、GOP 跟著共和黨籍（原 KRUZ），兩檔都吃 45 天申報延遲後的資料。跟 SPY 的差距就是「照著政要申報買」的真實代價與報酬。
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ height:"300px", flexShrink:0 }} />

      {R.roster.length > 0 && (
        <div style={{ paddingTop:"20px" }}>
          <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 6px" }}>
            <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>個別議員 · 近 {R.window} 天申報</span>
            <span style={{ fontSize:"10px", color:"var(--text-tertiary)" }}>更新 {R.updated}</span>
          </div>
          <div style={{ padding:"0 16px 12px", fontSize:"11px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            眾議院 STOCK Act 定期交易報告（PTR）原始申報書彙整，共 {R.filings} 份、其中 {R.skipped_scanned} 份是紙本掃描件無法解析。金額只有級距沒有數字，絕大多數落在最低的 $1,001–$15,000，所以下面顯示的是<span style={{ color:"var(--text-secondary, inherit)" }}>申報區間</span>而不是實際金額——別把它當成真實部位大小。點議員名字可看原始申報書。
          </div>
          <div style={{ overflowX:"auto", padding:"0 16px" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"12px" }}>
              <thead>
                <tr style={{ color:"var(--text-tertiary)", fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", textTransform:"uppercase" }}>
                  <th style={{ textAlign:"left",  padding:"6px 8px 6px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>議員</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>筆數</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>買 / 賣</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>申報區間</th>
                  <th style={{ textAlign:"left",  padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>常見標的</th>
                  <th style={{ textAlign:"right", padding:"6px 0 6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>最新申報</th>
                </tr>
              </thead>
              <tbody>
                {R.roster.map(r => (
                  <tr key={r.name + r.dst}>
                    <td style={{ padding:"7px 8px 7px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      <a href={r.url} target="_blank" rel="noopener noreferrer" style={{ color:"#B5654D", textDecoration:"none" }}>{r.name}</a>
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px", marginLeft:"6px" }}>{r.dst}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums" }}>{r.n}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>
                      <span style={{ color:"#6DB56D" }}>{r.buy}</span>
                      <span style={{ color:"var(--text-tertiary)" }}> / </span>
                      <span style={{ color:"#E05C5C" }}>{r.sell}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>{money(r.lo)}–{money(r.hi)}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      {r.top.map(t => (
                        <a key={t} href={"https://www.tradingview.com/symbols/" + t + "/"} target="_blank" rel="noopener noreferrer"
                           style={{ color:"var(--text-secondary, inherit)", textDecoration:"none", marginRight:"7px", fontFamily:"'Courier New',monospace" }}>{t}</a>
                      ))}
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px" }}>共 {r.distinct} 檔</span>
                    </td>
                    <td style={{ padding:"7px 0 7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", whiteSpace:"nowrap" }}>{r.last}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ padding:"12px 16px 0", fontSize:"10px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            只涵蓋眾議院；參議院走另一套 efdsearch 系統，尚未納入。買＋賣不一定等於筆數，差額是交換（exchange）類交易。
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/15/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v11.0</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
