<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
  {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "分歧收盤", "color": "#E05C5C", "stocks": [{"t": "DIA", "n": "道瓊ETF，道瓊漲 140.15 點、0.3% 收 53,417.16"}, {"t": "SPY", "n": "標普500 ETF，指數跌 21.51 點、0.3% 收 7,652.86"}, {"t": "QQQ", "n": "那斯達克100 ETF，那指跌 200.26 點、0.8% 收 25,980.19"}], "en": "US stocks drifted to a split finish on Monday. The Dow rose 140.15 points, or 0.3%, to 53,417.16, while the S&P 500 fell 21.51 points, or 0.3%, to 7,652.86 and the Nasdaq Composite dropped 200.26 points, or 0.8%, to 25,980.19. Chip stocks did most of the damage. Investors are largely standing still ahead of a week that stacks Nvidia's results, the July PCE print and Kevin Warsh's Jackson Hole debut into three days.", "zh": "週一美股走出分歧的收盤：道瓊漲 140.15 點、漲0.3% 收 53,417.16，標普 500 却跌 21.51 點、跌 0.3% 收 7,652.86，那斯達克綜合指數更跌 200.26 點、跌 0.8% 收 25,980.19。拖累大盤的主要是晶片股，道瓊因成分股偏傳統產業而反而守住。市場今天基本上是在原地等：本週把輝達財報、7 月 PCE 物價數據、以及 Warsh 上任後首場傑克遜洞演講全塞進三天裡。", "url": "https://www.washingtonpost.com/business/2026/08/24/wall-street-stocks-dow-nasdaq/27d744ee-9ff9-11f1-8606-1d40ad00172e_story.html"},
  {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "經濟 D-Day", "color": "#E05C5C", "stocks": [{"t": "USO", "n": "原油ETF，西德州原油跌 2.5% 至 84.89 美元"}, {"t": "XLE", "n": "能源類股ETF，油價回吐但上週已先漲 5.66%"}, {"t": "OXY", "n": "西方石油，頁岩油對油價彈性最高的大型業者"}], "en": "The Trump administration rolled out a global sanctions plan against Iran on Monday, branded Operation Economic Outcast, with Treasury Secretary Scott Bessent having trailed it as an economic D-Day. Washington made clear China gets no exemption. Oil actually fell on the news: WTI dropped about 2.5% to $84.89 and Brent 2.5% to $92.06, after gains of 5.66% and 6.39% respectively last week. That is profit-taking meeting a sell-the-fact reaction.", "zh": "美國週一推出針對伊朗的全球制裁方案，代號「Operation Economic Outcast」，財政部長 Bessent 先前在社群上預告這是一場「經濟 D-Day」，並明講中國不在豁免之列。有趣的是消息公布後油價反而向下：西德州原油跌約 2.5% 到 84.89 美元，布蘭特同樣跌 2.5% 到 92.06 美元。背後原因是上週兩者已分別漲了 5.66% 與 6.39%，利多出盡加上獲利了結，把利多消息變成賣壓。", "url": "https://www.cnbc.com/2026/08/24/oil-price-today-wti-brent-us-sanctions-iran.html"},
  {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "美加破局", "color": "#E05C5C", "stocks": [{"t": "GM", "n": "通用汽車，加拿大產能曝險大，週一走弱"}, {"t": "F", "n": "福特，同樣因 50% 汽車關稅威脅而下跌"}, {"t": "NUE", "n": "紐可鋼鐵，鋼鐵關稅拉高反而是國內業者受惠方"}], "en": "US-Canada trade talks collapsed over the weekend and Washington imposed fresh tariffs on Canadian goods. Prime Minister Mark Carney suspended negotiations and pledged like-for-like retaliation. Trump then threatened to lift tariffs on Canadian autos, auto parts and steel to 50% starting January 1, 2027. General Motors and Ford both fell. Note the date: this is a threat with a 16-month fuse, which is as much a negotiating device as a policy.", "zh": "美加貿易談判周末破局，美方隨即對加拿大商品加徵新關稅，加拿大總理 Carney 宣布暫停談判並誓言對等報復。川普進一步揚言，自 2027 年 1 月 1 日起把加拿大汽車、汽車零件與鋼鐵的關稅拉到 50%，通用汽車與福特股價雙雙走弱。值得注意的是那個日期：這是一條引信長達十六個月的威脅，談判籌碼的成分不低於政策成分。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-august-24-dow-sp-500-nasdaq-080306047.html"},
  {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "幣圈降溫", "color": "#E05C5C", "stocks": [{"t": "COIN", "n": "Coinbase，三日漲勢累計逾 27% 後週一回吐 1%"}, {"t": "IBIT", "n": "貴邦現貨比特幣ETF，最直接反映幣價停滞"}], "en": "Bitcoin stalled around $77,000 over the weekend after a three-day rally that lifted it 22% last week, its best week in two years. Coinbase, which had jumped more than 27% during that run, slipped 1% on Monday. The pattern is worth noting: crypto-linked equities amplify the move in both directions, so a flat tape in the underlying often still produces red in the proxies. Positioning, not fundamentals, is doing the work here.", "zh": "比特幣周末在約 77,000 美元停下來，結束了上週一波漲 22%、兩年來最強的週線表現。這波行情中一度漲逾 27% 的 Coinbase，週一小幅回吐 1%。這個對比其實很典型：加密概念股是幣價的放大器，幣價只是停止上漲，代理股就已經要回吐。現階段推動這一區塊的是部位與資金流，而不是基本面的新變化。", "url": "https://www.cnbc.com/2026/08/24/stocks-making-the-biggest-moves-premarket-baba-mrvl-sndk-and-more.html"},
  {"id": "earn_0", "channel": "財報速報", "tag": "輝達壓軸", "color": "#E8786A", "stocks": [{"t": "NVDA", "n": "8/26 盤後公布，共識營收 920.7 億、EPS 2.09 美元"}, {"t": "SNPS", "n": "新思科技，同日 8/26 盤後財報，EDA 需求對照組"}, {"t": "MRVL", "n": "博通得，8/27 盤後財報，資料中心自研晶片風向球"}], "en": "Nvidia reports Wednesday after the close. Consensus sits at $92.07B of revenue and adjusted EPS of $2.09, against $1.05 a year ago; the guidance issued in May was $91B plus or minus 2%, implying roughly 95% year-on-year growth. Data centre is expected to supply almost all of the growth, and the Blackwell ramp is the number the call will live or die on. Synopsys reports the same evening, Marvell the next, giving three reads on the same demand chain inside 48 hours.", "zh": "輝達將於週三（8/26）盤後公布財報，市場共識是營收 920.7 億美元、調整後每股獲利 2.09 美元，去年同期僅 1.05 美元；公司五月給的自己指引是 910 億美元上下 2%，換算年增約 95%。成長幾乎全部來自資料中心，而法說會的真正勝負點是 Blackwell 平台的放量進度與下季指引。新思同晚、博通得隔天接力，同一條需求鏈在四十八小時內會被看三次。", "url": "https://seekingalpha.com/article/4939733-nvidia-earnings-preview-q2-2027"},
  {"id": "earn_1", "channel": "財報速報", "tag": "軟體三雄", "color": "#E8786A", "stocks": [{"t": "CRM", "n": "上季營收估 113 億、年增 10%，EPS 估 3.27 美元"}, {"t": "CRWD", "n": "拆股後 EPS 約 0.29，新增 ARR 指引 2.84 至 2.86 億"}, {"t": "WDAY", "n": "工作日，8/27 盤後，HR 軟體看企業招募溫度"}], "en": "Three enterprise software names land almost together. Salesforce reports Wednesday with revenue seen up 10% to $11.3B and EPS of $3.27 versus $2.91 a year ago; the market will trade cRPO growth in constant currency and the Q3 guide, not the headline beat. CrowdStrike, the same evening, guides to roughly $0.29 EPS on about $1.44B revenue with net new ARR of $284-286M. Workday follows Thursday. Together they are the cleanest read on whether corporate software budgets are still expanding while chip spending consolidates.", "zh": "三家企業軟體龍頭幾乎擠在一起。Salesforce 週三盤後公布，營收估年增 10% 至 113 億美元、每股獲利 3.27 美元（去年 2.91），但真正決定股價的是固定匯率下的 cRPO 成長與下季指引，不是表面的超預期。CrowdStrike 同晚登場，拆股後指引每股獲利約 0.29 美元、營收約 14.4 億、新增年化經常性收入 2.84 至 2.86 億。工作日週四接棒，三家合起來是看「晶片支出盤整時，軟體預算還在不在長」的最乾淨指標。", "url": "https://www.benzinga.com/markets/market-summary/26/08/61373202/top-sp-500-index-stocks-to-watch-this-week-crowdstrike-salesforce-workday"},
  {"id": "earn_2", "channel": "財報速報", "tag": "非 AI 側", "color": "#E8786A", "stocks": [{"t": "INTU", "n": "Intuit，今晚（8/25）盤後財報，中小企業景氣風向球"}, {"t": "PDD", "n": "拼多多，本週財報，中國消費降級的直接讀數"}, {"t": "RY", "n": "加拿大皇家銀行，關稅破局後的財報格外敏感"}], "en": "The week is not only about AI. Intuit reports tonight, and its small-business segment is one of the better real-time reads on US SME health. PDD reports this week as a direct gauge of Chinese consumer trade-down. Royal Bank of Canada also reports, and its timing is unusually loaded: it lands days after Ottawa suspended trade talks and Washington threatened 50% auto and steel tariffs, so management's commentary on cross-border credit and corporate loan demand carries more weight than the quarter itself.", "zh": "本週不只有 AI。Intuit 今晚盤後就公布，它的中小企業部門是美國小生意景氣最即時的溫度計之一。拼多多本週登場，直接反映中國消費降級的實際強度。最值得看的反而是加拿大皇家銀行：它的財報恰好落在渥太華暫停談判、華府揚言對汽車與鋼鐵課 50% 關稅的幾天後，管理層對跨境授信與企業貸款需求的說法，重要性高於這一季的數字本身。", "url": "https://tickeron.com/trading-investing-101/q2-2026-earnings-preview-august-2427-2026--nvda-crm-pdd-intu-ry-adsk/"},
  {"id": "macro_0", "channel": "總經政策", "tag": "雙向定價", "color": "#7C6AF7", "stocks": [{"t": "SHY", "n": "短債ETF，最貼近政策利率預期的工具"}, {"t": "TLT", "n": "長債ETF，對前瞻指引與通膨預期最敏感"}], "en": "Something unusual is happening in rate pricing: the market is simultaneously carrying both a cut and a hike scenario for September. Some readings put the odds of a 25bp cut near 85%, while CME FedWatch and prediction markets show roughly a one-in-three chance of a hike. Those cannot both be right, and the gap itself is the signal, it says the market has no confident read on the new chair's reaction function. Warsh has given no forward guidance since taking office, which is precisely why Friday matters.", "zh": "利率定價現在出現一個很不尋常的現象：市場同時把「降息」與「升息」兩種相反劇本都定進去了。有些讀數把 9 月降息 1 碼的機率擺在約 85%，但 CME FedWatch 與預測市場場側顯示升息機率約三分之一。這兩個不可能同時成立，而這個落差本身就是訊息：市場對新任主席的反應函數沒有把握。Warsh 上任至今未給過任何前瞻指引，這正是週五那場演講的重量所在。", "url": "https://www.oddsshopper.com/articles/prediction-markets/fed-rate-cut-odds-september-2026"},
  {"id": "macro_1", "channel": "總經政策", "tag": "數據塞車", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債ETF，核心 PCE 一公布先反應"}, {"t": "SPY", "n": "標普500，週三數據與輝達財報擠在同一天"}], "en": "Wednesday is a pile-up. The July core PCE deflator, July durable goods orders and the second estimate of Q2 GDP all print that morning, with consensus looking for core PCE up 0.2% month-on-month and the annual rate holding at 3.3%. Today brings the Conference Board's August consumer confidence reading; Thursday has jobless claims for the week to August 22. And Nvidia reports Wednesday after the close, meaning the single most crowded macro morning of the month is immediately followed by the single most crowded earnings evening.", "zh": "週三是一場數據塞車：7 月核心 PCE 物價指數、7 月耐久財訂單、以及第二季 GDP 第二次估值全部在同一個早上公布，共識預估核心 PCE 月增 0.2%、年增維持在 3.3%。今天先看經濟諮商理事會 8 月消費者信心指數，週四則是截至 8 月 22 日的初領失業金。更麻煩的是，輝達財報就在週三盤後——本月最擁擠的總經早晨，緊接著本月最擁擠的財報夜晚。", "url": "https://www.newsquawk.com/headlines/newsquawk-weekly-economic-calendar---24th-28th-august-2026"},
  {"id": "macro_2", "channel": "總經政策", "tag": "關稅武器化", "color": "#7C6AF7", "stocks": [{"t": "XLI", "n": "工業類股ETF，跨境供應鏈成本的主要承受者"}, {"t": "UUP", "n": "美元指數ETF，貿易談判破局直接反映在匯率"}], "en": "Two separate stories on Monday shared one logic: trade policy used as a foreign-policy weapon. Ottawa's talks collapsed and Washington threatened 50% tariffs on Canadian autos and steel from 2027; hours later the Iran sanctions package explicitly refused China an exemption. For markets the practical question is not the headline rate but the second-order one: tariffs raise input costs while the Fed is being asked to cut. That combination is exactly what makes a central banker refuse to give forward guidance.", "zh": "週一兩條看似無關的新聞，共用同一套邏輯：把貿易政策當成外交武器。上午是美加談判破局、揚言 2027 年起對加拿大汽車與鋼鐵課 50% 關稅；幾小時後是對伊朗的制裁包裹，並明確拒絕給中國豁免。對市場而言，真正的問題不是稅率數字，而是二階效應：關稅推升投入成本的同時，聯準會又被要求降息。這種組合，正是一位央行總裁會選擇不給前瞻指引的原因。", "url": "https://finance.yahoo.com/markets/stocks/articles/stock-market-today-aug-24-134834490.html"},
  {"id": "sector_0", "channel": "產業風向", "tag": "晶片熊市", "color": "#4EABA4", "stocks": [{"t": "SOXX", "n": "半導體ETF，上週跌 5.5%、週一再跌近 2%"}, {"t": "SNDK", "n": "SanDisk，盤前跌逾 5%，記憶體是重災區"}, {"t": "INTC", "n": "英特爾，週一跌約 2%，隨大盤被殺"}], "en": "Semiconductors keep sliding. SOXX is down just under 20% from its June 22 peak, fell 5.5% last week and lost almost another 2% on Monday. Memory is the epicentre, with SanDisk off more than 5%, while Marvell dropped about 3.5% and AMD and Intel roughly 2% each. What makes this a genuine bear market rather than a dip is the duration, two full months of lower highs, and the fact that it is happening into Nvidia's print rather than after it.", "zh": "半導體的賣壓還沒停。SOXX 自 6 月 22 日高點已跌接近 20%，上週跌 5.5%，週一再跌將近 2%。震央在記憶體：SanDisk 盤前一度跌逾 5%，博通得跌約 3.5%，超微與英特爾各跌約 2%。讓這波算得上真的熊市而非回檔的，是它的長度——整整兩個月的高點下移，以及它發生的時點：不是在輝達財報之後，而是在財報之前。", "url": "https://finance.yahoo.com/markets/stocks/article/amid-the-chip-bear-market-healthcare-is-breaking-out-chart-of-the-day-100000172.html"},
  {"id": "sector_1", "channel": "產業風向", "tag": "醫療接棒", "color": "#4EABA4", "stocks": [{"t": "XLV", "n": "醫療類股ETF，自 6/22 以來漲約 16%"}, {"t": "IBB", "n": "生技ETF，同期間漲幅超過 20%"}], "en": "Money leaving chips has a destination. Since semiconductors peaked on June 22, the iShares Biotechnology ETF has climbed more than 20% and the Health Care Select Sector SPDR about 16%. The flow data confirms it is not just price: healthcare ETFs have taken in roughly $4.5B so far in 2026, reversing years of steady outflows. A sector that spent three years as a funding source is now being bought as a destination, and that kind of reversal usually runs longer than one quarter.", "zh": "離開晶片的錢有去處。自半導體 6 月 22 日見頂以來，生技 ETF（IBB）漲幅超過 20%，醫療類股 ETF（XLV）也漲約 16%。資金流數據證實這不只是價格現象：2026 年至今醫療 ETF 紀流入約 45 億美元，一舉逆轉了多年的持續失血。一個連續三年被當成「提款機」的類股，現在變成了資金的目的地，這種角色逆轉通常不會只持續一季。", "url": "https://finance.yahoo.com/markets/article/wall-street-is-rotating-out-of-2026s-biggest-winners-chart-of-the-day-180639239.html"},
  {"id": "sector_2", "channel": "產業風向", "tag": "實體經濟", "color": "#4EABA4", "stocks": [{"t": "XLE", "n": "能源ETF，近期以 1.76% 領先十一大類股"}, {"t": "XLF", "n": "金融類股ETF，利率環境趨穩的受惠方"}, {"t": "XLU", "n": "公用事業ETF，AI 電力建設的實體受惠端"}], "en": "Step back and 2026's real story is capital rotating out of concentrated AI megacaps and into the physical economy. Energy led the eleven sectors with a recent 1.76% gain, healthcare added 1.60%, and consumer staples and financials also finished higher. These are not rallying on nothing: they are being paid by the AI power build-out, a steadier rate environment, and valuations that never got stretched in the first place. Breadth widening into industrials, financials and small caps is a healthier market structure than the narrow tape of the past three years.", "zh": "拉遠來看，2026 年的主軸是資金從高度集中的 AI 大型股，流向實體經濟。能源近期以 1.76% 領先十一大類股，醫療漲 1.60%，消費必需與金融也小幅收紅。這些類股不是憑空上漲：支撐它們的是 AI 電力基礎建設的實際訂單、較穩定的利率環境，以及一開始就沒被拉伸的估值。市場廣度擴散到工業、金融與小型股，結構上比過去三年的窄幅行情健康。", "url": "https://kalkine.com/news/premium/us-sector-performance-analysis-energy-and-health-care-lead-as-technology-retreats"},
  {"id": "small_0", "channel": "小型股風雲", "tag": "二十三年最佳", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，年內漲逾 23%，超前那斯達克100"}, {"t": "VTWO", "n": "Vanguard 羅素 2000 ETF，同步創高的對照組"}], "en": "The Russell 2000 closed at a record 3,068.54 and is now up more than 23% year-to-date, edging past the Nasdaq 100's 19%. On a full-year basis this is shaping up as the index's best year in 23 years. The composition matters as much as the number: this is not a handful of names carrying the index, it is broad participation from banks, industrials and healthcare, which is what distinguishes a genuine regime change from a short-covering squeeze.", "zh": "羅素 2000 指數收在 3,068.54 的歷史新高，年內漲幅超過 23%，已經超前那斯達克 100 的 19%。拉到年度來看，這可能是這個指數二十三年來最好的一年。但比數字更重要的是結構：這波不是少數幾檔抗起指數，而是銀行、工業、醫療普遍參與。這正是區別「真正的風格輪替」與「空單回補的短暫喘息」的關鍵。", "url": "https://www.benzinga.com/etfs/specialty-etfs/26/08/61181756/quick-spark-russell-2000-hits-new-record-highs-beats-nasdaq-100-in-2026"},
  {"id": "small_1", "channel": "小型股風雲", "tag": "折價還在", "color": "#5B8ED6", "stocks": [{"t": "IWB", "n": "羅素 1000 ETF，大型股估值的對照基準"}, {"t": "IJR", "n": "標普 600 小型股ETF，另一個估值參照點"}], "en": "Even at record highs small caps still screen cheap, trading at roughly a 34% valuation discount to large caps while running a nine-point performance lead in 2026. That combination, outperforming and still discounted, is unusual and can only persist if earnings are genuinely catching up rather than multiples simply expanding. Worth checking directly rather than taking on trust: whether the discount is narrowing because small-cap profits are rising, or because large-cap multiples are falling.", "zh": "即使已經創新高，小型股的估值依然便宜：相對大型股約有 34% 的估值折價，同時在 2026 年的報酬率上領先九個百分點。「超額報酬且仍折價」這種組合並不常見，它能否維持，取決於獲利是否真的跟上來，而不是單純本益比擴張。這一點值得自己查證：折價收斂到底是因為小型股獲利上來，還是因為大型股本益比下來。", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/"},
  {"id": "small_2", "channel": "小型股風雲", "tag": "覆蓋率黑洞", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素 2000 成長ETF，池子裡覆蓋率最低的一群"}, {"t": "XBI", "n": "生技ETF，典型的「分析師少、價差大」區塊"}], "en": "Here is the structural reason small-cap research can pay. Wellington's data shows roughly 85% of small-cap stocks are covered by fewer than 10 sell-side analysts, against just 6% of large caps. That is not a minor difference, it is the mechanism that creates real information asymmetry, and it is why primary research still finds mispricing in this pool while it almost never does in megacaps. The flip side: fewer analysts also means fewer people checking management's claims.", "zh": "這是「做功課在小型股才有報酬」的結構性原因。Wellington 的數據顯示，約 85% 的小型股只有不到十位賣方分析師覆蓋，而大型股這個比例只有 6%。這不是程度差異，而是資訊不對稱的製造機制：它讓一手研究在這個池子裡還找得到錯定價，而在大型股幾乎找不到。反面也同時成立：分析師少，也代表監督管理層說法的人更少。", "url": "https://investormint.com/small-business/small-cap-large-cap-portfolio-strategy-2026"},
  {"id": "small_3", "channel": "小型股風雲", "tag": "銀行整併", "color": "#5B8ED6", "stocks": [{"t": "KRE", "n": "區域銀行ETF，並購潮最直接的載具"}, {"t": "IAT", "n": "美國銀行業ETF，拿來對照大型銀行的差異"}], "en": "Consolidation is the clearest single thread running through small-cap financials. US bank M&A hit $15.1B in the first half of 2026, a seven-year high. August added two more: Peoples Bancshares of TN agreed to buy First Peoples Bancorp, taking it to $650M of assets, and New York's Alma Bank agreed to buy American Community Bancorp. The drivers are structural rather than cyclical, ageing management teams and increasingly vocal shareholders, which means the pipeline should not dry up quickly.", "zh": "整併是小型金融股最清楚的一條主線。美國銀行並購金額在 2026 年上半年達 151 億美元，是七年新高；8 月又添兩樁：田納西州的 Peoples Bancshares of TN 同意收購 First Peoples Bancorp，完成後資產約 6.5 億美元；紐約的 Alma Bank 則要買下 American Community Bancorp。推動力是結構性而非景氣性的——老化的管理層加上越來越有意見的股東，這代表交易能見度不會很快乾涸。", "url": "http://bankingjournal.aba.com/2026/08/bank-acquisitions-announced-in-tennessee-new-york/"},
  {"id": "small_4", "channel": "小型股風雲", "tag": "別認錯了", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，指數創高不等於個股安全"}, {"t": "IJR", "n": "小型股ETF，浮動利率債務曝險集中"}], "en": "A necessary corrective to the small-cap bull case. August's biggest gainers were overwhelmingly speculative and event-driven, RFAI up 423%, XHG 364%, USDE 331%, names most investors could not describe the business of. Of the top 100 monthly movers, 79 were driven by earnings with a median gain of 25.8%. Read that carefully: an index at record highs and a tail of lottery tickets are two different things, and confusing them is how small-cap enthusiasm usually ends badly.", "zh": "對小型股多方論點的必要注解。8 月漲幅最大的幾檔幾乎全是投機性的事件驅動股——RFAI 漲 423%、XHG 漲 364%、USDE 漲 331%，大多數人甚至說不出這些公司在做什麼。當月前一百大漲幅中，有 79 個是財報驅動，中位漲幅 25.8%。這兩件事要分開看：指數創新高與尾端的彩券行情是不同的東西，把兩者混為一談，就是小型股熱情通常收場的方式。", "url": "https://www.stocktitan.net/rankings/top-news/gainers/2026-08"},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "沙漠裡的水", "color": "#C9A227", "stocks": [{"t": "GWRS", "n": "內部人 8/24 單日買進 65.2 萬股、約 576.7 萬美元"}], "status": "RADAR · 下一個驗證點 Q3 財報與費率案進度（11 月）", "en": "Global Water Resources owns and operates regulated water, wastewater and recycled water systems around Phoenix and Tucson, serving about 121,000 people across roughly 40,000 homes. It is neglected on both counts: a Nasdaq microcap in a regulated utility niche that generalist funds ignore, with thin sell-side coverage. What changed: on August 24 an insider bought 651,618 shares for about $5.77M, one of the largest single purchases on the tape that day and enormous relative to the company's size. Q2 revenue was $17.8M, up 24.8% year-on-year, helped by a Tucson system acquisition, connection growth and rate increases, and the company has filed DAWS applications to expand its assured water supply in Arizona. Risks are real: analysts recently trimmed the target to $9.20 from $9.60 on higher operating costs and a delayed rate case, regulated utilities cannot simply raise prices, and a single large buy can be portfolio reshuffling rather than conviction. Research lead, not investment advice.", "zh": "Global Water Resources 在鳳凰城與圖森一帶擁有並經營受管制的自來水、廢水與再生水系統，服務約四萬戶、十二萬人。它兩邊都被忽視：既是一檔微型股，又處在一般基金懶得碰的受管制公用事業利基市場，賣方覆蓋極薄。正在改變的是：8 月 24 日一位內部人一口氣買進 651,618 股、約 576.7 萬美元，是當天全市場金額最大的幾筆之一，對這種規模的公司而言比重極高；搭配第二季營收 1,780 萬美元、年增 24.8%，以及向亞利桑那州提出擴大保證供水量的申請。風險很具體：分析師近期因營運成本上升與費率案延後，把目標價從 9.6 美元下調到 9.2 美元；受管制事業不能自己漲價，而單一大額買進也可能只是部位調整而非信念。這是研究線索，不是投資建議。", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+August+24,+2026"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "負權益嚇跑人", "color": "#C9A227", "stocks": [{"t": "PMTS", "n": "CPI Card Group，市值約 2.1 億美元的支付卡製造商"}], "status": "RADAR · 下一個驗證點 Q3 財報（看毛利率能否止跌）", "en": "CPI Card Group makes payment cards and related services, at roughly $210M of market cap. The neglect has an unusually clean cause: negative shareholders' equity, a legacy of its buyout history, which knocks it straight out of most quantitative screens regardless of how the business is performing. What changed is the operating line. Q2 sales rose 14.9% year-on-year and net income was up 293%, a new CFO was appointed, and management raised earnings guidance. The counter-argument deserves equal weight: gross margin has eroded from 38.89% in 2015 to 30.97% by mid-2026, so the profit jump is coming off a low base and against a deteriorating margin structure, and the balance sheet leaves no room for a bad quarter. Research lead, not investment advice.", "zh": "CPI Card Group 是支付卡及相關服務的製造商，市值約 2.1 億美元。它被忽視的原因異常清楚：公司股東權益為負——這是過去私募收購交易留下的痕跡——不管本業表現如何，它都會被大多數量化篩選直接刷掉。正在改變的是損益表：第二季營收年增 14.9%、純利年增 293%，公司換上新任財務長，並上調獲利指引。反方論點同樣站得住：毛利率已從 2015 年的 38.89% 一路滑到 2026 年中的 30.97%，這波獲利暴衝是從低基數起跳、且發生在毛利結構惡化的背景下，而財務結構也沒有容錯空間。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/capital-goods/nyse-mbc/masterbrand/news/undervalued-small-caps-with-insider-buying-to-watch-in-augus-1"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "明天交卷", "color": "#C9A227", "stocks": [{"t": "MOV", "n": "Movado，8/26 盤前公布，市估每股獲利 0.36 美元"}], "status": "RADAR · 下一個驗證點 8/26（三）盤前財報", "en": "A pool name reaches its verification point tomorrow. Movado, the watch and jewellery group behind its own brand plus licensed Coach, Tommy Hilfiger, Lacoste and HUGO watches, releases FY2027 Q2 results pre-market on Wednesday August 26, with the call at 9am ET. Consensus is $0.36 EPS. Three things decide whether the thesis survives: whether the earnings beat is carried by revenue rather than cost cuts, what the licensed brands contributed, and whether management restores full-year guidance. Note the timing trap already flagged in the pool, the Kate Spade licence only meaningfully contributes from FY2028, so a soft quarter here does not by itself kill the argument, and a strong one does not confirm it. Research lead, not investment advice.", "zh": "池內股明天就要交卷。Movado —— 旗下除了同名錶廠，還代工 Coach、Tommy Hilfiger、Lacoste 與 HUGO 授權錶 —— 將於 8 月 26 日（週三）盤前發布 FY2027 第二季財報，法說會美東時間上午九點。市場共識每股獲利 0.36 美元。三件事決定論點能不能活下來：獲利是靠營收撐還是靠節流、授權錶系列的實際貢獻、以及管理層會不會重新給出全年指引。池內已標註過一個時間陷阱：Kate Spade 授權要到 FY2028 才會實質貢獻營收，所以這一季轉弱不等於論點失效，轉強也不等於論點成立。這是研究線索，不是投資建議。", "url": "https://stockanalysis.com/stocks/mov/statistics/"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "上調財測", "color": "#C9A227", "stocks": [{"t": "RCEL", "n": "AVITA Medical，2026 營收指引上調至 8,600 至 8,900 萬"}], "status": "RADAR · 下一個驗證點 Q3 財報（看現金燃燒速度）", "en": "AVITA Medical, a regenerative medicine company at roughly $250M market cap, raised its 2026 revenue guidance to $86-89M, implying 20-24% growth. Its core product line, RECELL devices, generated $75.63M of revenue at an 81.56% gross margin, which is software-like economics attached to a medical device. It is neglected for the usual microcap reasons plus one specific to the category: regenerative medicine names get lumped in with speculative biotech even when they are already selling a commercialised product. The bear case is straightforward and important, the company is not yet profitable, so an 81% gross margin only matters if operating leverage actually arrives before the cash does not. Research lead, not investment advice.", "zh": "AVITA Medical 是一家市值約 2.5 億美元的再生醫學公司，已將 2026 年營收指引上調到 8,600 至 8,900 萬美元，換算成長 20% 至 24%。核心產品線 RECELL 裝置的營收為 7,563 萬美元，毛利率高達 81.56%——這是接近軟體的經濟模型，却長在一台醫療器材上。它被忽視，除了微型股的一般原因，還多一層：再生醫學常被歸願到投機性生技那一塊，即使它早已有商品化產品在賣。空方論點很直白也很重要：公司尚未獲利，81% 的毛利率只有在營運槓桿趕在現金燒完之前出現時，才有意義。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/diversified-financials/nasdaq-valu/value-line/news/undervalued-small-caps-with-insider-action-in-august-2026"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "轉板與成長", "color": "#C9A227", "stocks": [{"t": "TRIN", "n": "Trinity Capital，Q2 營收 8,717 萬、年增約 25%"}], "status": "RADAR · 下一個驗證點 Q3 財報（看不良資產比例）", "en": "Trinity Capital is a business development company lending to growth-stage firms. Q2 revenue came in at $87.17M against $69.48M a year earlier, roughly 25% growth, insiders have been buying, and the company moved its listing to the NYSE by the end of July, a step that typically widens the institutional buyer base. BDCs are structurally under-covered because they sit awkwardly between credit and equity research desks. The risk is the one every BDC carries and it is not hypothetical in a cutting cycle: yields compress on the asset side while credit quality in growth-stage borrowers is exactly where stress shows up first. Research lead, not investment advice.", "zh": "Trinity Capital 是一家向成長期企業放款的商業發展公司（BDC）。第二季營收 8,717 萬美元，去年同期為 6,948 萬，年增約 25%；內部人持續買進，公司也在七月底前把掛牌地轉到紐約交易所，這一步通常會擴大法人買盤基礎。BDC 這個類別結構上就覆蓋不足，因為它卡在信用研究與股票研究兩個部門中間。風險是所有 BDC 共同的，而且在降息循環裡並非假設性問題：資產端收益率被壓縮的同時，成長期借款人恰好是信用壓力最先浮現的地方。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/diversified-financials/nyse-evtc/evertec/news/top-undervalued-small-caps-with-insider-activity-in-august-2"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "兩百萬庫藏股", "color": "#C9A227", "stocks": [{"t": "VALU", "n": "Value Line，截至 2026 年 4 月年度每股獲利 2.30 美元"}], "status": "RADAR · 下一個驗證點 庫藏股實際執行股數與均價", "en": "Value Line is the investment research publisher, and there is a pleasing irony in it being one of the least researched stocks on the tape. EPS reached $2.30 for the year to April 2026, and in July the board initiated a share repurchase programme of up to $2M with no expiration date. That figure looks trivial until you set it against the float, which is tiny and closely held, making even a small buyback meaningful for per-share value. The obvious counter: a legacy print-research business faces genuine structural decline, and a buyback funded out of a shrinking earnings base buys time rather than growth. Research lead, not investment advice.", "zh": "Value Line 是一家投資研究出版商，而它本身是市場上最沒人研究的股票之一，這個對比本身就很有意思。截至 2026 年 4 月的年度，每股獲利達 2.30 美元；七月董事會啟動上限 200 萬美元、無到期日的庫藏股計畫。200 萬看起來微不足道，但把它放在這家公司極小且高度集中的流通股旁邊看，對每股價值的影響就不小。明顯的反方論點：傳統印刷型研究事業面對的是真實的結構性衰退，拿萎縮中的獲利去買回股票，買到的是時間而不是成長。這是研究線索，不是投資建議。", "url": "https://www.sahmcapital.com/news/content/undervalued-small-caps-with-insider-action-in-august-2026-2026-08-13"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "比例才是重點", "color": "#6DB56D", "stocks": [{"t": "BABA", "n": "阿里巴巴，蔡崇信買進 72 萬股、約 1,028.9 萬美元"}, {"t": "GWRS", "n": "全球水資源，單筆 576.7 萬對微型股比重極高"}, {"t": "ENHA", "n": "Enhanced Group，Apeiron 基金買進約 268.8 萬美元"}], "en": "August 24 logged 199 open-market insider transactions. The largest by dollar value were Joseph Tsai buying 720,000 Alibaba shares for $10.29M, an insider taking 651,618 shares of Global Water Resources for $5.77M, and Apeiron Investment Group adding $2.69M of Enhanced Group. Rank those by signal rather than by size and the order inverts: $10M is small change against Alibaba's market cap, while $5.77M in a company of Global Water's size is a meaningful share of the float. The useful metric is purchase value relative to both the buyer's wealth and the company's size, not the raw number.", "zh": "8 月 24 日全市場共登記 199 筆公開市場內部人交易。金額最大的幾筆分別是：蔡崇信買進 72 萬股阿里巴巴、約 1,028.9 萬美元；一位內部人買進 651,618 股全球水資源、約 576.7 萬；Apeiron 基金加碼 Enhanced Group 約 268.8 萬。但若改用「訊號強度」排序，順序會倒過來：一千萬美元對阿里巴巴的市值只是零頭，而 576.7 萬對全球水資源這種規模的公司，已經是流通股的一大塊。有用的指標是買進金額對「買方身家」與「公司規模」的比例，而不是絕對數字。", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+August+24,+2026"},
  {"id": "insider_1", "channel": "內部人動向", "tag": "庫藏股加碼", "color": "#6DB56D", "stocks": [{"t": "CW", "n": "Curtiss-Wright，8/18 加碼 1 億，全年買回上看 2.6 億"}, {"t": "FIGS", "n": "8/6 董事會加碼 1 億，授權總額達 2 億美元"}, {"t": "AMPY", "n": "Amplify Energy，8/6 通過 1,500 萬美元買回計畫"}], "en": "Buybacks were the busier signal in August. Curtiss-Wright expanded its 2026 repurchase programme by $100M on August 18, taking expected full-year buybacks to $260M with $290M of authorisation left. FIGS added $100M on August 6, doubling total authorisation to $200M. Amplify Energy approved a $15M programme the same day. The pattern worth noticing is that all three are mid- and small-cap names, not megacaps, which suggests boards outside the index heavyweights think their own shares are the best available use of capital right now.", "zh": "8 月更熱鬧的其實是庫藏股。Curtiss-Wright 於 8 月 18 日將 2026 年買回計畫加碼 1 億美元，全年預計買回金額上看 2.6 億，尚餘 2.9 億額度；FIGS 於 8 月 6 日加碼 1 億，授權總額倍增至 2 億；Amplify Energy 同一天通過 1,500 萬美元的買回計畫。值得注意的是這三家全都是中小型股而非大型權值——意思是，指數重量級以外的董事會，現在普遍認為自家股票是手上資金最好的去處。", "url": "https://www.tipranks.com/news/company-announcements/curtiss-wright-expands-2026-share-repurchase-program"},
  {"id": "insider_2", "channel": "內部人動向", "tag": "別誤讀了", "color": "#6DB56D", "stocks": [{"t": "BABA", "n": "高金額但佔市值極小，訊號強度有限"}, {"t": "CW", "n": "庫藏股是公司行為，與個人自掏腰包性質不同"}], "en": "Four cautions before reading anything into insider data. Separate open-market purchases from option exercises, the latter carries almost no signal. Scale the purchase to the company and to the buyer, not to your own sense of what is a big number. Distinguish company buybacks from personal purchases, a board authorising repurchases and a CEO writing a personal cheque are different acts with different information content. And check the timing against the blackout calendar, a purchase in an open window right after results tells you far less than one made when the insider had every reason to wait.", "zh": "要從內部人數據讀出東西之前，四個提醒。第一，分清楚公開市場買進與選擇權行使，後者幾乎沒有訊號。第二，把金額除以公司規模與買方身家，而不是靠自己對「大數字」的直覺。第三，公司庫藏股與個人買進是兩件事：董事會授權買回與執行長自己開支票，訊息含量完全不同。第四，對照靜默期日曆：財報後窗口期內的例行性買進，遠不如一筆「明明可以再等却沒等」的買進來得有意義。", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+August+24,+2026"},
  {"id": "capitol_0", "channel": "政要持股", "tag": "押的是電力不是股票", "color": "#B5654D", "stocks": [{"t": "BE", "n": "Bloom Energy，買進 15,000 股＋200 口買權，裴洛西家族首度持有"}, {"t": "INTC", "n": "英特爾，同日加碼 10,000 股＋50 口買權"}, {"t": "ORCL", "n": "甲骨文，與 Bloom 簽下上看 2.8GW 燃料電池的供電合約"}], "en": "A periodic transaction report filed on August 24 showed the Pelosi household buying 15,000 Bloom Energy shares plus 200 call options struck at $100 and expiring June 17, 2027, alongside 10,000 Intel shares and 50 more Intel calls. The trades themselves were executed on July 24 and July 28, and the purchases were made by Paul Pelosi under the House rule covering spousal transactions. Combined disclosed range is $3-12 million. The reason to look at this is not the name on the filing but the thesis underneath it: Bloom sells fuel cells to data centres, has roughly 250 MW of AI infrastructure customers outside its Oracle agreement, and that Oracle deal alone covers up to 2.8 GW. Somebody is putting real money behind the view that the binding constraint on AI is electricity, not chips.", "zh": "8 月 24 日一份 STOCK Act 定期交易報告顯示，裴洛西家族買進 15,000 股 Bloom Energy，外加 200 口履約價 100 美元、2027 年 6 月 17 日到期的買權；同時加碼 10,000 股英特爾與 50 口買權。實際成交日是 7 月 24 與 7 月 28 日，執行人是配偶 Paul Pelosi，依眾議院配偶交易規則申報，合併揭露金額區間 300 萬至 1,200 萬美元。真正值得看的不是申報人的名字，而是底下那個 thesis：Bloom 賣的是資料中心用的燃料電池，扣掉甲骨文那紙合約之外還有約 250MW 的 AI 基建客戶，而光是甲骨文一案就上看 2.8GW。有人正拿真錢押注——AI 的瓶頸是電，不是晶片。", "url": "https://www.quiverquant.com/news/Nancy+Pelosi+Discloses+First-Ever+Bloom+Energy+Trade,+Adds+to+Intel+Bet+Amid+AI+Power+Boom"},
  {"id": "capitol_1", "channel": "政要持股", "tag": "這種卡怎麼讀", "color": "#B5654D", "stocks": [{"t": "BE", "n": "揭露當天股價已先跳空，跟單者買的是別人 45 天前的價位"}, {"t": "NVDA", "n": "過去被大量複製的標的，事後報酬多半來自大盤而非選股"}], "en": "Four rules for reading congressional disclosure cards, because this is the easiest channel in the feed to misuse. First, the lag: the STOCK Act allows up to 45 days between trade and disclosure, so by the time you read it the price has usually moved and any edge is gone. Second, the amounts are ranges, not numbers, and the bands are wide enough that a $3M and a $12M position look identical on the filing. Third, most of these are spousal or trust transactions executed by someone other than the lawmaker, which weakens the implied link to any policy knowledge. Fourth, options carry most of the information: a strike well above spot with a long expiry is a directional thesis, while a near-dated at-the-money call is closer to a trade. Read the position structure, not the name.", "zh": "讀政要揭露卡的四條規則，因為這是整份 feed 最容易被誤用的頻道。第一是延遲：STOCK Act 允許交易後最長 45 天才申報，你讀到的時候價格通常早就反應完，優勢已經不存在。第二，金額只有區間沒有數字，而且級距寬到 300 萬與 1,200 萬的部位在申報書上長得一模一樣。第三，多數是配偶或信託帳戶、由議員本人以外的人執行，跟「政策內線」的連結遠比標題暗示的弱。第四，資訊量幾乎全在選擇權結構裡：履約價明顯高於現價又選長天期，代表的是方向性押注；近月價平買權比較像短打。看部位結構，不要看名字。", "url": "https://www.quiverquant.com/congresstrading/"},
  {"id": "week_0", "channel": "本週事件", "tag": "總經行事曆", "color": "#C97DD4", "stocks": [{"t": "TLT", "n": "長債ETF，週五 Warsh 演講的主戰場"}, {"t": "GLD", "n": "黃金ETF，利率路徑一變它最先反應"}, {"t": "UUP", "n": "美元指數ETF，前瞻指引直接影響匯率"}], "en": "The macro calendar for the rest of the week. Today: the Conference Board's August consumer confidence index. Wednesday: July core PCE, July durable goods orders and the second estimate of Q2 GDP, all before the open. Thursday: initial jobless claims for the week to August 22. The Jackson Hole symposium runs August 27-29 in Wyoming, with Kevin Warsh delivering his first keynote as Fed chair on Friday morning, 19 days before the September 16 FOMC decision.", "zh": "本週剩下的總經行事曆。今天：經濟諮商理事會 8 月消費者信心指數。週三：7 月核心 PCE 物價指數、7 月耐久財訂單、第二季 GDP 第二次估值，全部在開盤前公布。週四：截至 8 月 22 日的初領失業金。傑克遜洞年會於 8 月 27 至 29 日在懷俄明州登場，Kevin Warsh 將於週五早上發表他上任聯準會主席後的首場主題演講，距離 9 月 16 日的 FOMC 決議只剩十九天。", "url": "https://www.regardsofwallstreet.com/news/jackson-hole-2026-dates-schedule-warsh-first-speech"},
  {"id": "week_1", "channel": "本週事件", "tag": "財報行事曆", "color": "#C97DD4", "stocks": [{"t": "INTU", "n": "今晚盤後登場，本週第一張重量級財報"}, {"t": "WDAY", "n": "工作日，8/27 盤後，企業 HR 預算風向"}, {"t": "ADSK", "n": "歐特克，8/27 盤後，設計軟體的訂閱轉換"}], "en": "The earnings calendar. Tonight: Intuit after the close. Wednesday after the close is the crowded one, Nvidia, Salesforce, CrowdStrike and Synopsys all report within the same hour. Thursday after the close brings Marvell, Autodesk and Workday. And on Wednesday pre-market, Movado, a radar-pool name, publishes the results that its verification point has been pointing at since July. Four consecutive sessions where the tape will be reacting to something released after the previous close.", "zh": "本週財報行事曆。今晚：Intuit 盤後登場。週三盤後是最擁擠的一晚——輝達、Salesforce、CrowdStrike 與新思科技在同一小時內齊發。週四盤後則輪到博通得、歐特克與工作日。另外週三盤前，雷達池內的 Movado 也要公布財報，那正是它從七月入池以來一直指向的驗證點。接下來四個交易日，盤面都會在消化前一晚才公布的東西。", "url": "https://www.tipranks.com/news/options-volatility-and-implied-earnings-moves-this-week-august-24-august-27-2026"},
  {"id": "eval_0", "channel": "今日評估", "tag": "值得深想", "color": "#E8A838", "status": "DISCUSS · 讀完到最後一頁，複製 PROMPT 找 CLAUDE 復盤", "stocks": [{"t": "NVDA", "n": "週三盤後，舊領導的試金石"}, {"t": "SHY", "n": "短債ETF，降息與升息兩種定價的交會點"}, {"t": "XLV", "n": "醫療類股，新領導的代表"}], "en": "The one thing worth noticing today is not any single headline but a contradiction: the market is currently pricing both a September cut at roughly 85% and a September hike at roughly one-in-three. Those are incompatible, and all three inputs that could resolve them, Wednesday's PCE, Wednesday night's Nvidia print and Friday's Warsh keynote, land inside 72 hours. Meanwhile the rotation out of chips and into healthcare and small caps has been running for two months without waiting for any of them. The open question: if the rotation is already happening while the macro is unresolved, is it a bet on the outcome, or a sign that the outcome matters less than everyone assumes?", "zh": "今天最值得注意的不是某一條新聞，而是一個矛盾：市場正同時把「9 月降息約 85%」與「9 月升息約三分之一」兩種相反劇本定進去。這兩者不可能同時成立，而能解開它們的三個輸入——週三的 PCE、週三夜的輝達財報、週五的 Warsh 演講——全擠在七十二小時內。另一方面，從晶片轉向醫療與小型股的輪動已經跑了兩個月，根本沒等這些答案。開放式問題：如果輪動在總經未明朗時就已發生，那它是對結果的賭注，還是在告訴你「結果沒有大家以為的那麼重要」？", "url": "https://www.cnbc.com/2026/08/23/stock-market-today-live-updates.html"}
];

// 排程只要照常抽換 CARDS 就好,不用額外維護日期。
const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function HeatmapView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",
        blockSize: "market_cap_basic", blockColor: "change",
        locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true,
        hasSymbolTooltip: true, isMonoSize: false,
        width: "100%", height: "100%"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 10px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>S&P 500 · 即時資金流向</span>
        <a href="https://finviz.com/map?t=sec&st=d1" target="_blank" rel="noopener noreferrer" className="source-link">Finviz 完整版 ↗</a>
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ flex:1, minHeight:0 }} />
    </div>
  );
}

function PerfView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        symbols: [["民主黨 NANC", "CBOE:NANC|12M"], ["共和黨 GOP", "CBOE:GOP|12M"], ["標普500 SPY", "AMEX:SPY|12M"]],
        chartOnly: false, locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        autosize: true, showVolume: false, showMA: false,
        hideDateRanges: false, hideMarketStatus: true, hideSymbolLogo: false,
        scalePosition: "right", scaleMode: "Percentage",
        fontSize: "10", noTimeScale: false, valuesTracking: "1",
        changeMode: "price-and-percent", chartType: "area"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  const R = CAPITOL_ROSTER;
  const money = n => n >= 1000000 ? "$" + (n / 1000000).toFixed(1) + "M"
                   : n >= 1000 ? "$" + Math.round(n / 1000) + "k" : "$" + n;
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px", overflowY:"auto" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 6px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>政要交易 ETF · 近一年</span>
        <a href="https://www.quiverquant.com/congresstrading/" target="_blank" rel="noopener noreferrer" className="source-link">Quiver 排行 ↗</a>
      </div>
      <div style={{ padding:"0 16px 10px", fontSize:"11px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
        NANC 跟著民主黨籍議員的申報建倉、GOP 跟著共和黨籍（原 KRUZ），兩檔都吃 45 天申報延遲後的資料。跟 SPY 的差距就是「照著政要申報買」的真實代價與報酬。
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ height:"300px", flexShrink:0 }} />

      {R.roster.length > 0 && (
        <div style={{ paddingTop:"20px" }}>
          <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 6px" }}>
            <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>個別議員 · 近 {R.window} 天申報</span>
            <span style={{ fontSize:"10px", color:"var(--text-tertiary)" }}>更新 {R.updated}</span>
          </div>
          <div style={{ padding:"0 16px 12px", fontSize:"11px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            眾議院 STOCK Act 定期交易報告（PTR）原始申報書彙整，共 {R.filings} 份、其中 {R.skipped_scanned} 份是紙本掃描件無法解析。金額只有級距沒有數字，絕大多數落在最低的 $1,001–$15,000，所以下面顯示的是<span style={{ color:"var(--text-secondary, inherit)" }}>申報區間</span>而不是實際金額——別把它當成真實部位大小。點議員名字可看原始申報書。
          </div>
          <div style={{ overflowX:"auto", padding:"0 16px" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"12px" }}>
              <thead>
                <tr style={{ color:"var(--text-tertiary)", fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", textTransform:"uppercase" }}>
                  <th style={{ textAlign:"left",  padding:"6px 8px 6px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>議員</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>筆數</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>買 / 賣</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>申報區間</th>
                  <th style={{ textAlign:"left",  padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>常見標的</th>
                  <th style={{ textAlign:"right", padding:"6px 0 6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>最新申報</th>
                </tr>
              </thead>
              <tbody>
                {R.roster.map(r => (
                  <tr key={r.name + r.dst}>
                    <td style={{ padding:"7px 8px 7px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      <a href={r.url} target="_blank" rel="noopener noreferrer" style={{ color:"#B5654D", textDecoration:"none" }}>{r.name}</a>
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px", marginLeft:"6px" }}>{r.dst}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums" }}>{r.n}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>
                      <span style={{ color:"#6DB56D" }}>{r.buy}</span>
                      <span style={{ color:"var(--text-tertiary)" }}> / </span>
                      <span style={{ color:"#E05C5C" }}>{r.sell}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>{money(r.lo)}–{money(r.hi)}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      {r.top.map(t => (
                        <a key={t} href={"https://www.tradingview.com/symbols/" + t + "/"} target="_blank" rel="noopener noreferrer"
                           style={{ color:"var(--text-secondary, inherit)", textDecoration:"none", marginRight:"7px", fontFamily:"'Courier New',monospace" }}>{t}</a>
                      ))}
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px" }}>共 {r.distinct} 檔</span>
                    </td>
                    <td style={{ padding:"7px 0 7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", whiteSpace:"nowrap" }}>{r.last}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ padding:"12px 16px 0", fontSize:"10px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            只涵蓋眾議院；參議院走另一套 efdsearch 系統，尚未納入。買＋賣不一定等於筆數，差額是交換（exchange）類交易。
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/25/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v8.8</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
