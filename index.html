/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;
    --text-tertiary: #6b6863; --divider: #ddd9d1;
    --noise-opacity: 0.035;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  /* 鍵盤焦點:看得到目前在哪一顆 */
  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }

  .swipe-area { position: relative; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .card-slide { position: absolute; inset: 0; padding: 16px 32px 96px; display: flex; flex-direction: column; justify-content: flex-start; transition: transform 0.3s ease, opacity 0.3s ease; will-change: transform, opacity; overflow-y: auto; }
  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }
  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }
  .source-link { position: relative; display: inline-block; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }

  .nav-btn:active { background:var(--bg-elevated); }
  .nav-btn:disabled { opacity:0.3; cursor:default; border-color:var(--divider); color:var(--text-tertiary); }

</style>

  {"id": "earn_0", "channel": "財報速報", "tag": "帕蘭泰爾", "color": "#E8786A", "zh": "帕蘭泰爾（PLTR）週一盤後公布第三季：營收 23.1 億美元、年增 96%，調整後每股盈餘 0.44 美元，都高於預期；全年營收指引上調到約 85.3 億美元，高於市場原先約 82 億美元。這季有個歷史性轉折：美國商業營收 9.84 億美元首度超過美國政府營收，年增 148%。盤後股價約下跌 3% 到 178 美元左右（各家報導幅度不一，以週二開盤為準），在 4,000 多億美元市值上已經反映了高期待。", "en": "Palantir (PLTR) reported Q3 after Monday's close: revenue of $2.31 billion, up 96%, and adjusted EPS of $0.44, both above estimates; full-year revenue guidance was raised to about $8.53 billion versus roughly $8.2 billion expected. A historic shift: US commercial revenue of $984 million topped US government revenue for the first time, up 148% year over year. Shares were down about 3% after hours near $178 (reports vary, so wait for Tuesday's open), reflecting very high expectations on a market cap above $400 billion.", "url": "https://247wallst.com/cards/palantir-q3-2026-earnings-pltr-01m6f1kk98agygmzse44h9307q", "stocks": [{"t": "PLTR", "n": "營收 +96%、全年指引上調，盤後約 -3%"}]},
  {"id": "earn_1", "channel": "財報速報", "tag": "蘋果財報", "color": "#E8786A", "zh": "蘋果（AAPL）公布 9 月季度：營收 1,144.8 億美元、年增 12%，每股盈餘 2.10 美元，高於預期的約 2.00 美元；iPhone 營收 575.8 億美元，創九月季度新高並高於預期。弱點在大中華區營收 175.4 億美元，低於預期的 187.5 億美元；毛利率 47.9%，其中約 1 個百分點來自關稅退款。這是新任執行長 Ternus 的首份財報，盤後股價大致持平。", "en": "Apple (AAPL) reported its September quarter: revenue of $114.48 billion, up 12%, and EPS of $2.10 versus about $2.00 expected; iPhone revenue of $57.58 billion set a September-quarter record and beat estimates. The soft spot was Greater China at $17.54 billion against $18.75 billion expected; gross margin was 47.9%, including about one point from tariff refunds. It was the first report under new CEO John Ternus, and shares were roughly flat after hours.", "url": "https://9to5mac.com/2026/11/02/apple-reports-q4-2026-earnings/", "stocks": [{"t": "AAPL", "n": "營收 +12%、iPhone 創紀錄，中國區不及預期，盤後持平"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "診斷與基因", "color": "#E8786A", "zh": "寵物診斷龍頭 IDEXX（IDXX）週一大漲約 20%：第三季營收 12.1 億美元、年增 10%，上調 2026 年營收與每股盈餘預測，但下調營業利益率展望。基因檢測公司 Tempus AI（TEM）上漲約 12%：營收年增 23% 到 4.115 億美元，同樣上調全年營收指引。兩家都是醫療科技，反應很大的原因是營收超預期，但 IDEXX 的利益率下修仍是要追蹤的地方。", "en": "Pet-diagnostics leader IDEXX (IDXX) jumped about 20% on Monday: Q3 revenue was $1.21 billion, up 10%, and it raised 2026 revenue and EPS forecasts while lowering its operating-margin outlook. Genomic-testing firm Tempus AI (TEM) rose about 12% as revenue grew 23% to $411.5 million and full-year revenue guidance was raised. Both are health-tech names whose big moves came from revenue beats, though IDEXX's lower margin outlook is the item to keep watching.", "url": "https://www.cnbc.com/2026/11/01/stock-market-today-live-updates.html", "stocks": [{"t": "IDXX", "n": "Q3 營收 12.1 億美元 +10%，週一約 +20%"}, {"t": "TEM", "n": "營收 +23%，上調全年指引，週一約 +12%"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "Fed 升息賭局", "color": "#7C6AF7", "zh": "聯準會目前利率區間是 3.75%–4.00%，9 月 16 日升息一碼後，10 月 28 日按兵不動，但有兩位委員主張再升。市場定價 12 月 9 日再升息一碼的機率約 75%–76%，比 10 月 26 日的約 82% 略降。十年期殖利率週一降到 4.894%；利率路徑還是「升息還沒結束」，所以銀行股與長天期債券的方向要看 12 月之前的通膨與就業數據。", "en": "The Fed funds range is 3.75%–4.00% after a 25-basis-point hike on Sept 16 and a hold on Oct 28, with two dissenters preferring another hike. Markets price roughly a 75%–76% chance of another quarter-point hike on Dec 9, down slightly from about 82% on Oct 26. The 10-year yield eased to 4.894% on Monday; with the policy path still one of 'hikes are not over', the direction of bank stocks and long bonds depends on inflation and jobs data before December.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-november-2-dow-sp-500-nasdaq-091835095.html", "stocks": [{"t": "TLT", "n": "長天期美債 ETF，對升息預期最敏感"}, {"t": "KRE", "n": "區域銀行 ETF，息差與信用品質的風向球"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "製造業與營建", "color": "#7C6AF7", "zh": "十月 ISM 製造業指數升到 55.5，高於預期的約 54.6，連續第十個月擴張；價格分項 75.2，低於前值 77.9 但仍偏高。標普全球製造業 PMI 為 54.9，低於前值 55.9。同一天另一份數據很不一樣：9 月營建支出下降 1.9%，是 2020 年 4 月以來最大單月跌幅，住宅支出下降 5.5%。工廠熱、房屋冷，是這個高利率週期最典型的分歧。", "en": "The October ISM manufacturing index rose to 55.5, above the roughly 54.6 forecast and marking a tenth straight month of expansion; the prices-paid gauge eased to 75.2 from 77.9 but remains elevated. The S&P Global manufacturing PMI was 54.9, down from 55.9. Another release told a different story: September construction spending fell 1.9%, the biggest monthly drop since April 2020, with residential spending down 5.5%. Hot factories and a cold housing sector is the classic split of a high-rate cycle.", "url": "https://www.prnewswire.com/news-releases/manufacturing-pmi-at-55-5-october-2026-ism-manufacturing-pmi-report-302925617.html", "stocks": [{"t": "XLI", "n": "工業類股 ETF，製造業景氣與週一資金流入方向"}, {"t": "ITB", "n": "房屋建商 ETF，營建支出走弱的壓力端"}, {"t": "DHI", "n": "最大建商之一，住宅投資下滑直接相關"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "升息情境", "color": "#7C6AF7", "zh": "Apollo 的首席經濟學家 Torsten Sløk 提出一個偏鷹的情境：為了讓通膨回到 2%，聯準會可能需要再升約 275 個基點、到 2027 年底接近 6.75%，而且通膨至少要到 2027 年第二季之後才會下降。這是單一機構的看法、不是市場共識，但它把「升息不只一兩碼」的尾端風險攤開來。另一個風險來自股市本身：美銀警告，AI 交易的持續修正是美國與全球經濟的較大風險之一。", "en": "Apollo chief economist Torsten Sløk laid out a hawkish scenario: to get inflation back to 2% the Fed might need about 275 more basis points of hikes, to roughly 6.75% by end-2027, with inflation not falling until at least Q2 2027. It is one firm's view rather than consensus, but it spotlights the tail risk that hikes may go well beyond one or two. A second risk comes from equities themselves: BofA warns that a sustained correction in the AI trade is among the bigger risks to the US and global economy.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-november-2-dow-sp-500-nasdaq-091835095.html", "stocks": [{"t": "IEF", "n": "中天期美債 ETF，利率終點預期的溫度計"}, {"t": "XLK", "n": "科技類股 ETF，高估值最怕利率上調"}, {"t": "XLRE", "n": "房地產類股 ETF，高利率下的壓力端"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "AI 融資潮", "color": "#4EABA4", "zh": "AI 的錢開始往資本市場借：甲骨文（ORCL）申請發行 100 億美元普通股與 100 億美元債券，週一收跌約 8%；微軟（MSFT）宣布 250 億美元的優先債；Alphabet（GOOGL）計畫發行 60 億歐元債券。同一天 Stephens 把甲骨文升到加碼、目標價 213 美元。AI 資本支出從自由現金流轉向外部融資，是這波科技股回檔的核心問題。", "en": "AI spending is moving onto the capital markets: Oracle (ORCL) filed to sell $10 billion of common stock and $10 billion of bonds and closed down about 8%; Microsoft (MSFT) announced a $25 billion senior notes offering; Alphabet (GOOGL) plans a 6 billion euro bond sale. Stephens upgraded Oracle to overweight with a $213 target the same day. The shift of AI capex from free cash flow to external financing is the core issue behind the tech pullback.", "url": "https://www.cnbc.com/2026/11/01/stock-market-today-live-updates.html", "stocks": [{"t": "ORCL", "n": "發 100 億股票＋100 億債券，週一約 -8%"}, {"t": "MSFT", "n": "250 億美元優先債"}, {"t": "GOOGL", "n": "60 億歐元債券；上週四五累計約 -13.5%"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "資金轉向傳產", "color": "#4EABA4", "zh": "科技退燒的錢流向傳產與民生：道瓊成分股中，Sherwin-Williams（SHW）上漲近 6% 領漲，家得寶（HD）上漲 3.6%，漢威聯合（HON）、3M（MMM）、波音（BA）各漲超過 2%。道瓊的漲勢主要來自非必需消費、金融與必需消費。科技類股（XLK）午後一度下跌 2.4%，硬體與晶片股領跌；這是明確的輪動，不是全面撤退。", "en": "Money leaving tech flowed to industrials and consumer names: among Dow components Sherwin-Williams (SHW) led with a gain of nearly 6%, Home Depot (HD) rose 3.6%, and Honeywell (HON), 3M (MMM) and Boeing (BA) each gained more than 2%. The Dow's advance came from consumer cyclicals, financials and consumer defensives, while the tech sector (XLK) was down as much as 2.4% in the afternoon, led by hardware and chips. It was a clear rotation, not a full retreat.", "url": "https://www.cnbc.com/2026/11/01/stock-market-today-live-updates.html", "stocks": [{"t": "SHW", "n": "週一約 +6%，領漲道瓊"}, {"t": "HD", "n": "週一 +3.6%"}, {"t": "HON", "n": "週一漲超過 2%，工業輪動代表"}, {"t": "BA", "n": "週一漲超過 2%"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "記憶體警訊", "color": "#4EABA4", "zh": "日本記憶體廠 Kioxia 週一重挫約 14%，原因是公司警告 NAND 快閃記憶體價格的漲勢正在停滯。這對前一段「記憶體缺貨漲價」的敘事是個轉折訊號：蘋果已因記憶體與儲存短缺調漲部分 Mac 與 iPad 價格。美股方面輝達週一收跌約 1%，美光與超微盤前分別漲 2.7% 與 2.2%；超微明天（11/3）盤後公布財報，上週因英特爾弱指引已跌約 9%。", "en": "Japan's Kioxia fell about 14% on Monday after warning that NAND flash price increases are stalling, a turning-point signal for the 'memory shortage means higher prices' narrative; Apple has already raised some Mac and iPad prices because of memory and storage shortages. In US trading Nvidia closed about 1% lower, while Micron and AMD were up 2.7% and 2.2% premarket; AMD reports after Tuesday's close and fell roughly 9% last week on Intel's weak outlook.", "url": "https://www.cnbc.com/2026/11/01/stock-market-today-live-updates.html", "stocks": [{"t": "MU", "n": "記憶體龍頭，盤前 +2.7%；NAND 價格是關鍵變數"}, {"t": "AMD", "n": "11/3 盤後財報，上週約 -9%"}, {"t": "SOXX", "n": "半導體 ETF，記憶體與晶片整體的走向"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000", "color": "#5B8ED6", "zh": "羅素 2000 週一下跌 0.21% 收 2,805.88，同一天那斯達克下跌 1.07%，小型股相對抗跌。RBC 資本市場最新的看法是偏好小型股勝過大型股，理由是估值轉為合理、市場對聯準會繼續升息的預期趨於穩定，以及投資人持股部位已不再極度悲觀。依 LSEG 數據，羅素 2000 今年以來上漲 13.3%，高於標普 500 的 10.7%。", "en": "The Russell 2000 slipped 0.21% to 2,805.88 on Monday while the Nasdaq fell 1.07%, so small caps held up better. RBC Capital Markets now prefers small caps over large caps, citing more attractive valuations, stabilizing expectations for further Fed hikes and less negative investor positioning. According to LSEG data, the Russell 2000 is up 13.3% year to date versus 10.7% for the S&P 500.", "url": "https://rallies.ai/news/rbc-picks-small-caps-over-large-caps-as-valuations-turn-compelling-877d11821c3f1498", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週一約 -0.2%，年初至今 +13.3%"}, {"t": "IJR", "n": "標普 600 小型股 ETF，品質較高的小型股篩選"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "營建支出重挫", "color": "#5B8ED6", "zh": "9 月營建支出下降 1.9%、住宅部分下降 5.5%，是 2020 年 4 月以來最大單月跌幅。對小型股的意義在於：羅素 2000 裡的房屋建商、建材與地方銀行對房市的暴露高於大型股。這是單月數據，且 9 月數據可能被後續修正；要判斷房市是否轉弱，還要看新屋開工、建照與抵押貸款利率的下一份報告。", "en": "September construction spending fell 1.9%, with residential spending down 5.5%, the biggest monthly drop since April 2020. For small caps the point is that homebuilders, building-products makers and local banks in the Russell 2000 have more housing exposure than large caps do. It is a single month and may be revised; judging whether housing is truly weakening needs the next readings on housing starts, permits and mortgage rates.", "url": "https://www.cnbc.com/2026/11/01/stock-market-today-live-updates.html", "stocks": [{"t": "XHB", "n": "房屋建商與建材 ETF，成分偏中小型股"}, {"t": "LEN", "n": "大型建商，營建支出下滑的直接感受者"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "利率與槓桿", "color": "#5B8ED6", "zh": "小型股對利率比大型股敏感，主因是它們更依賴浮動利率貸款與外部融資，而羅素 2000 中仍有相當比例的公司沒有獲利、靠借錢或增資過日子。聯準會 12 月再升息一碼的機率約 75%，對這類公司是直接成本。所以判讀小型股時，要把「有現金流、負債低」與「靠故事」分開看，而不是看羅素 2000 的整體漲跌。", "en": "Small caps are more rate-sensitive than large caps mainly because they rely more on floating-rate loans and outside financing, and a meaningful share of Russell 2000 companies are unprofitable and live on debt or equity raises. With roughly a 75% chance of another Fed hike on Dec 9, that is a direct cost for them. When reading small caps, separate 'cash-generating with low debt' from 'story stocks' instead of relying on the headline index move.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-november-2-dow-sp-500-nasdaq-091835095.html", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，息差與信用風險的兩面"}, {"t": "IWN", "n": "羅素 2000 價值型 ETF，相對低估值的子集"}, {"t": "VTWO", "n": "羅素 2000 ETF（另一檔），追蹤同一指數"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "同叫小型股", "color": "#5B8ED6", "zh": "同樣叫小型股，指數差很多：羅素 2000 是市值排名 1,001 到 3,000 名的公司，每年 6 月重組，不要求獲利；標普 600 則要求過去幾季合計為正的獲利，且由委員會挑選，通常品質較高、成分股體質較好。所以 IWM 與 IJR 的報酬常常不同：獲利門檻讓 IJR 較少出現「虧損又燒錢」的公司，但也會漏掉剛轉虧為盈的成長股。買小型股 ETF 前，先確認它追蹤哪一個指數。", "en": "The label 'small cap' hides big index differences: the Russell 2000 holds companies ranked 1,001 to 3,000 by market cap, reconstituted each June with no profitability requirement; the S&P 600 requires positive trailing earnings and is committee-selected, usually giving higher quality. That is why IWM and IJR often diverge: the earnings screen keeps unprofitable cash burners out of IJR but can also miss growth stocks that are only just turning profitable. Check which index a small-cap ETF tracks before buying it.", "url": "https://www.spglobal.com/spdji/en/indices/equity/sp-smallcap-600/", "stocks": [{"t": "IJR", "n": "標普 600 小型股 ETF，要求正獲利"}, {"t": "SLY", "n": "標普 600 小型股另一檔 ETF"}, {"t": "VB", "n": "CRSP 小型股 ETF，又是第三種指數"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "個股異動", "color": "#5B8ED6", "zh": "Tempus AI（TEM）週一上漲約 12%，營收年增 23% 到 4.115 億美元並上調全年指引。Reddit（RDDT）則被 Loop Capital 降評為持有、目標價 100 美元，理由是 AI 讓 Google 搜尋導流縮減，並懷疑與 Google 的授權合約能否續約。EchoStar（ECHO）盤前上漲約 5%，傳出 SpaceX 正考慮與其 Boost Mobile 合作。三則新聞的共同點是：對單一大客戶或單一平台的依賴，是這類中小型股最常見的風險。", "en": "Tempus AI (TEM) rose about 12% on Monday as revenue grew 23% to $411.5 million and full-year guidance was raised. Reddit (RDDT) was downgraded to hold by Loop Capital with a $100 target, citing AI pressure on Google search referral traffic and doubts about renewal of its Google licensing deal. EchoStar (ECHO) rose about 5% premarket on reports that SpaceX is exploring a deal involving its Boost Mobile unit. The common thread: dependence on one big customer or platform is the most common risk for mid and small caps.", "url": "https://www.cnbc.com/2026/11/01/stock-market-today-live-updates.html", "stocks": [{"t": "TEM", "n": "營收 +23%，上調指引，週一約 +12%"}, {"t": "RDDT", "n": "Loop 降評為持有，目標價 100 美元"}, {"t": "ECHO", "n": "傳 SpaceX 洽談 Boost Mobile，盤前約 +5%"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "Chain Bridge", "color": "#C9A227", "zh": "Chain Bridge Bancorp（CBNA）是維吉尼亞州的銀行控股公司，客群偏向政治與政府相關客戶。第三季淨利 1,090 萬美元、每股盈餘 1.66 美元（去年同期 0.72 美元），年化股東權益報酬率 22.84%、資產報酬率 1.92%，前九個月每股盈餘 4.19 美元；Simply Wall St 稱內部人過去數月持續買進（未列金額），本益比約 12.6 倍。風險：第三方估算存款與託管資產季減，與政治客戶資金撤出有關，選舉前後的存款變化是要盯的重點。這是研究線索，不是投資建議。", "en": "Chain Bridge Bancorp (CBNA) is a Virginia bank holding company whose customer base leans toward political and government-related clients. Q3 net income was $10.9 million, or $1.66 per share (versus $0.72 a year earlier), with annualized ROE of 22.84% and ROA of 1.92%; nine-month EPS was $4.19. Simply Wall St says insiders have bought consistently over recent months (no amounts given), and the P/E is about 12.6. Risk: third-party estimates show deposits and custody assets falling quarter on quarter as political clients withdrew funds, so deposit changes around the election are key. This is a research lead, not investment advice.", "url": "https://finsee.ai/earnings/cbna/2026/q3/en/", "stocks": [{"t": "CBNA", "n": "Q3 每股盈餘 1.66 美元，ROE 22.84%，內部人持續買進"}], "status": "RADAR · 下一個驗證點：Form 4 買進金額與選舉後存款趨勢"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "Northpointe", "color": "#C9A227", "zh": "Northpointe Bancshares（NPB）是密西根的銀行與房貸公司，執行長 Charles Williams 今年在公開市場連續買進：2 月 14,205 股、5 月 25,000 股、8 月底 30,000 股。公司 10 月 20 日公布第三季時，同步宣布出售分銷零售與消費者直接房貸的承作通路，是策略收斂的訊號；股價約 15 美元。風險：第二季每股盈餘 0.60 美元低於預期的 0.68 美元，負債高、業務隨利率循環；也有董事賣出小額持股。這是研究線索，不是投資建議。", "en": "Northpointe Bancshares (NPB) is a Michigan bank and mortgage company whose CEO, Charles Williams, has kept buying in the open market this year: 14,205 shares in February, 25,000 in May and 30,000 in late August. When it reported Q3 on Oct 20 it also announced the sale of its distributed retail and consumer-direct mortgage origination channels, a sign of strategic narrowing; the stock trades near $15. Risks: Q2 EPS of $0.60 missed the $0.68 consensus, leverage is high and the business is rate-cyclical, and one director has sold small amounts. This is a research lead, not investment advice.", "url": "https://www.insidertrades.com/alerts/nyse-npb-insider-buying-and-selling-2026-08-27/", "stocks": [{"t": "NPB", "n": "執行長今年三度買進，宣布出售零售房貸通路"}], "status": "RADAR · 下一個驗證點：Q3 淨利與出售通路後的獲利結構（10-Q）"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "Stewart 逆勢", "color": "#C9A227", "zh": "Stewart Information Services（STC）是產權保險與房地產交易服務公司。第三季營收 9.007 億美元（去年 7.969 億），但 GAAP 淨利降到 3,030 萬美元、每股 0.98 美元（去年 1.55 美元），執行長說產業逆風會延續到明年。第三方整理指出有三位內部人逢低買進（金額未列）、本益比約 11 倍、殖利率近 5%。證據偏弱，要把它當成「反方檢驗案例」：營業費用增 38%、營運現金流減半，這是研究線索，不是投資建議。", "en": "Stewart Information Services (STC) is a title-insurance and real-estate transaction services company. Q3 revenue was $900.7 million (versus $796.9 million), but GAAP net income fell to $30.3 million, or $0.98 per share (versus $1.55), and the CEO expects industry headwinds to continue into next year. A third-party roundup says three insiders bought the dip (amounts not given), with a P/E near 11 and a yield close to 5%. The evidence is weak, so treat it as a counter-case test: other operating expenses rose 38% and operating cash flow roughly halved. This is a research lead, not investment advice.", "url": "https://www.placera.se/pressmeddelanden/stewart-information-services-stewart-reports-third-quarter-2026-results-20261021", "stocks": [{"t": "STC", "n": "Q3 營收 +13% 但 GAAP 淨利下滑，內部人逢低買進"}], "status": "RADAR · 下一個驗證點：Form 4 買進金額、Q4 財報與房市交易量"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "Agora 回鍋", "color": "#C9A227", "zh": "Agora（API）提供即時音視訊互動的雲端 API，已在雷達池，10/23 入池。OpenInsider 資料顯示執行長 Zhao Bin 在 10/27 與 10/29 各買進一筆，合計約 13.8 萬美元，其中 10/29 約 8.2 萬美元。這是新的內部人動態，但金額相對公司規模偏小，要確認是否有其他高層跟進。風險：我沒有取得最新財務數字，營收趨勢與中概股監管風險仍待查，這是研究線索，不是投資建議。", "en": "Agora (API) provides cloud APIs for real-time voice and video engagement and sits in the radar pool since 10/23. OpenInsider shows CEO Zhao Bin made two purchases, on 10/27 and 10/29, totaling roughly $138,000, with about $82,000 on 10/29. It is a fresh insider signal, but the size is small relative to the company and it is unclear whether other executives will follow. Risk: I did not retrieve current financials, so revenue trends and China-based-issuer regulatory risk remain to be checked. This is a research lead, not investment advice.", "url": "http://openinsider.com/", "stocks": [{"t": "API", "n": "執行長 10/27、10/29 兩度買進，合計約 13.8 萬美元"}], "status": "RADAR · 下一個驗證點：Q3 財報（日期待查）與其他高層是否跟進"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "Regional 回鍋", "color": "#C9A227", "zh": "Regional Management（RM）是美國南部的消費分期貸款公司，已在雷達池。第三季淨利 1,510 萬美元（年增 5.3%）、稀釋每股盈餘 1.61 美元（年增 13.4%），淨壞帳率 10.9%，比上季改善 130 個基點但比去年同期高 70 個基點。Simply Wall St 估本益比約 6.4 倍、折價約 32%。風險很具體：公司預告第四季淨利將低於第三季，原因是信用損失季節性升高與資金成本，信用品質是這檔的核心賭注。這是研究線索，不是投資建議。", "en": "Regional Management (RM) is a US consumer installment lender focused on the South and is already in the radar pool. Q3 net income was $15.1 million (up 5.3%) and diluted EPS $1.61 (up 13.4%); the net credit loss rate was 10.9%, 130 basis points better than last quarter but 70 basis points worse than a year ago. Simply Wall St puts the P/E near 6.4 with a discount of about 32%. The risk is concrete: the company now expects Q4 net income to be lower than Q3 on seasonal credit losses and funding costs, so credit quality is the central bet. This is a research lead, not investment advice.", "url": "https://www.mitrade.com/insights/news/live-news/article-0-2209087-20261029", "stocks": [{"t": "RM", "n": "Q3 每股盈餘 1.61 美元，淨壞帳率 10.9%，預告 Q4 較低"}], "status": "RADAR · 下一個驗證點：Q4 信用損失率與資金成本"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "Adtran 前夕", "color": "#C9A227", "zh": "Adtran（ADTN）是光纖接取設備廠，市值約 13 億美元、本益比為負；第二季營收 2.811 億美元、年增 6.1%，但因單一客戶專案延遲低於預期，GAAP 每股虧損 0.13 美元。第三季指引營收 2.75 億至 2.95 億美元，分析師共識 2.989 億美元，高於指引上緣；公司 11/2 盤後公布財報、11/3 開法說會，我還沒有拿到結果。要特別提醒：Simply Wall St 說有高層買進，但 Quiver 近六個月只有一筆賣出、沒有買進，兩者矛盾，須對 Form 4 才算數。這是研究線索，不是投資建議。", "en": "Adtran (ADTN) makes fiber-access equipment, with a market cap near $1.3 billion and a negative P/E; Q2 revenue was $281.1 million, up 6.1%, but missed expectations on a single customer's project delay, with a GAAP loss of $0.13 per share. Q3 guidance is $275–295 million of revenue versus a consensus of $298.9 million, above the top of the range; the company reported after Monday's close with a call on Nov 3, and I have not retrieved the results. Note the conflict: Simply Wall St cites executive buying while Quiver shows only one sale and no purchases in six months, so only Form 4 settles it. This is a research lead, not investment advice.", "url": "https://www.telecomtv.com/content/access-evolution/adtran-holdings-inc-announces-certain-preliminary-second-quarter-2026-results-55925/", "stocks": [{"t": "ADTN", "n": "Q3 指引 2.75–2.95 億美元，內部人買進說法互相矛盾"}], "status": "RADAR · 下一個驗證點：11/3 法說會與 Form 4（證據偏弱）"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "Landstar 執行長", "color": "#6DB56D", "zh": "貨運物流公司 Landstar System（LSTR）的執行長 Frank Lonegro 在 10/30 於公開市場買進 5,000 股，價格約 142.92 美元，金額約 71.5 萬美元，申報於 11/2（OpenInsider）。公開市場買進通常是用自己的錢、且是主動決定，比選擇權行使或稅款扣股更值得看。但單一高層的買進不等於群聚買進，也不代表股價馬上轉強，要查 EDGAR 的 Form 4 原文與同期是否有其他高層買賣。", "en": "Frank Lonegro, CEO of trucking and logistics firm Landstar System (LSTR), bought 5,000 shares on the open market on Oct 30 at about $142.92, roughly $715,000, filed on Nov 2 (OpenInsider). An open-market purchase uses the executive's own money and is a discretionary choice, which makes it more informative than option exercises or tax withholding. But one executive's purchase is not a cluster and does not mean the stock turns up soon; check the Form 4 on EDGAR and whether other executives traded in the same period.", "url": "http://openinsider.com/", "stocks": [{"t": "LSTR", "n": "執行長 10/30 買進 5,000 股，約 71.5 萬美元"}]},
  {"id": "insider_1", "channel": "內部人動向", "tag": "小額象徵買", "color": "#6DB56D", "zh": "同一批申報裡也有很小的買進：Clean Harbors（CLH）董事 Karyn Polito 在 10/29 買 125 股，約 3.9 萬美元；Steakholder Foods（STKH）執行長 Arik Kaufman 約 3.8 萬美元；Actuate Therapeutics（ACTU）執行長 Daniel Schmitt 在 10/28 以 0.36 美元買約 5 萬美元。判讀時看三件事：金額相對於高層身價是否有意義、是否連續買進、公司規模與流動性。一邊是象徵性的小額、一邊是不到一美元的股票，訊號強度相差很大。", "en": "The same batch of filings includes very small purchases: Clean Harbors (CLH) director Karyn Polito bought 125 shares on Oct 29 for about $39,000; Steakholder Foods (STKH) CEO Arik Kaufman bought about $38,000; Actuate Therapeutics (ACTU) CEO Daniel Schmitt bought about $50,000 at $0.36 on Oct 28. When reading these, weigh three things: whether the amount is meaningful relative to the insider's wealth, whether the buying repeats, and the company's size and liquidity. A token buy and a sub-dollar stock carry very different signal strength.", "url": "http://openinsider.com/", "stocks": [{"t": "CLH", "n": "董事 10/29 買 125 股，約 3.9 萬美元"}, {"t": "STKH", "n": "執行長約 3.8 萬美元"}, {"t": "ACTU", "n": "執行長以 0.36 美元買約 5 萬美元"}]},
  {"id": "insider_2", "channel": "內部人動向", "tag": "買進其實很少", "color": "#6DB56D", "zh": "內部人買進比外界想像的少：insiderfilingsdata 的 10/26 彙整只有 37 筆公開市場買進、總額約 4,150 萬美元、分布在 33 家公司，其中 5 筆是執行長買進、5 筆屬於群聚買進（例如 Bluerock Private Real Estate Fund，BPRE，董事 Ramin Kamfar）。另據 Quiver 統計，TTM Technologies 近六個月內部人有 243 筆公開市場交易，只有 2 筆買進、241 筆賣出。賣出常有稅務與分散持股的原因，買進才是少數的主動表態，這也是為什麼連續、多人的買進才被當成比較強的訊號。", "en": "Insider buying is rarer than people assume: insiderfilingsdata's Oct 26 roundup counted only 37 open-market purchases worth about $41.5 million across 33 companies, of which 5 were by CEOs and 5 were part of clusters (for example Bluerock Private Real Estate Fund, BPRE, director Ramin Kamfar). Separately, Quiver says TTM Technologies insiders made 243 open-market trades in six months, just 2 purchases and 241 sales. Sales often reflect tax and diversification needs while purchases are the rare active statement, which is why repeated, multi-person buying is treated as the stronger signal.", "url": "https://insiderfilingsdata.com/blog/2026/10/26/insider-buying-report/", "stocks": [{"t": "BPRE", "n": "10/26 群聚買進案例，董事 Ramin Kamfar"}, {"t": "TTMI", "n": "近六個月 243 筆交易僅 2 筆買進"}]},
  {"id": "capitol_0", "channel": "政要持股", "tag": "思科一買一賣", "color": "#B5654D", "zh": "同一檔、同一天、方向相反：思科（CSCO）9/24 有兩筆政要交易，眾議員 Maria Elvira Salazar（R-FL）賣出，申報金額區間 47,033 到 530,000 美元（10/7 公開）；參議員 John Boozman 買進，區間 10,010 到 150,000 美元（10/21 公開）。申報只寫寬區間，不能推出實際金額，也看不出理由，可能是配偶或信託帳戶、再平衡或稅務考量。這個例子正好說明為什麼單一申報不能當訊號：同一天，兩個人對同一檔做了完全相反的事。", "en": "Same stock, same day, opposite directions: Cisco (CSCO) had two congressional trades dated Sept 24. Rep. Maria Elvira Salazar (R-FL) sold, reported in a range of $47,033 to $530,000 (published Oct 7); Sen. John Boozman bought, in a range of $10,010 to $150,000 (published Oct 21). Filings give only wide ranges, so the actual amounts and the reasons are unknown; the trades could involve a spouse or trust account, rebalancing or tax planning. That is why a single filing is not a signal: two people did opposite things in the same stock on the same day.", "url": "https://www.benzinga.com/gov-trades/", "stocks": [{"t": "CSCO", "n": "9/24 一賣（Salazar）一買（Boozman）"}]},
  {"id": "capitol_1", "channel": "政要持股", "tag": "判讀：延遲與區間", "color": "#B5654D", "zh": "判讀政要申報要記三件事。第一，時間差：眾議員 Lisa McClain 9/14 買進 CACI（區間 50,008 到 225,000 美元），10/12 才公開，隔了 28 天；眾議員 Michael Rulli 10/16 賣出 Alphabet，10/19 就公開，只隔 3 天。第二，金額只是區間：David Taylor 的 AT&T 買進寫 3,003 到 45,000 美元，差了十五倍。第三，多數申報不是靠這些人的資訊優勢，而是一般資產配置。跟單的人買到的是別人幾週前的價位，這頻道只記錄「誰申報了什麼」，不是買賣建議。", "en": "Three things to remember when reading congressional filings. First, the lag: Rep. Lisa McClain bought CACI on Sept 14 (range $50,008 to $225,000) and it was disclosed on Oct 12, 28 days later, while Rep. Michael Rulli sold Alphabet on Oct 16 and it was disclosed on Oct 19, just 3 days later. Second, amounts are only ranges: David Taylor's AT&T purchase is listed at $3,003 to $45,000, a fifteen-fold spread. Third, most filings are ordinary asset allocation, not informational edges. Anyone copying trades buys at prices set weeks earlier; this channel records who filed what, not trading advice.", "url": "https://www.benzinga.com/gov-trades/", "stocks": [{"t": "CACI", "n": "McClain 買進，9/14 交易、10/12 公開"}, {"t": "GOOG", "n": "Rulli 賣出，10/16 交易、10/19 公開"}, {"t": "T", "n": "Taylor 買進，區間 3,003 到 45,000 美元"}]},
