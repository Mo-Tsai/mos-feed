<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "長債風暴", "color": "#E05C5C", "stocks": [{"t": "TLT", "n": "20年以上美債ETF，30年殖利率觸5.337%時受創最重"}, {"t": "IEF", "n": "7至10年期美債ETF，中天期同步承壓"}], "en": "The real epicentre was the bond market. The 30-year Treasury yield touched 5.337% on Tuesday, its highest since 2007. On Wednesday the Treasury said it would at least double the size of its long-end buybacks, and the yield reversed sharply off a 19-year high. In short, this bounce was bought with a Treasury intervention, not with better inflation data.", "zh": "這波市場真正的震央在債市。30年期美國公債殖利率上週二一度觸及 5.337%，是2007年以來最高。週三美國財政部宣布把長天期公債的買回規模至少加倍，殖利率才從19年高點急速回落。換句話說，這輪反彈是財政部出手止血換來的，不是通膨數據變好。", "url": "https://www.bloomberg.com/news/articles/2026-08-17/us-bond-selloff-drives-30-year-yields-to-the-highest-since-2007"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "比特幣狂飆", "color": "#E05C5C", "stocks": [{"t": "COIN", "n": "Coinbase，跟著幣價噴出，單日漲8%"}, {"t": "HOOD", "n": "Robinhood，單日漲近14%，交易量直接受惠"}], "en": "Risk appetite went into crypto. Bitcoin surged 22% on the week to about $77,800, its best week in two years. Related equities followed, with Robinhood up nearly 14% in a session and Coinbase adding 8%. Notably this happened in the same week long-end yields spiked, which suggests capital was not hedging so much as changing battlefields.", "zh": "風險胃納跑到加密資產去了。比特幣上週大漲22%、來到約 77,800 美元，是兩年來最好的一週。相關個股同步噴出，Robinhood單日漲近14%、Coinbase漲8%。值得注意的是，這是在長債殖利率飆高的同一週發生的，代表資金不是在避險，而是在換戰場。", "url": "https://www.cnbc.com/2026/08/20/stock-market-today-live-updates.html"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "油與金", "color": "#E05C5C", "stocks": [{"t": "USO", "n": "原油ETF，美國原油一度逼近94美元"}, {"t": "GLD", "n": "黃金ETF，現貨約4,400美元、仍低於1月紀錄"}, {"t": "XOM", "n": "埃克森美孚，油價高檔直接受惠"}], "en": "Two separate commodity stories. Crude stays elevated with the Strait of Hormuz still shut, Brent near $89 and US crude touching almost $94, after the June US-Iran memorandum collapsed with no diplomatic fix in sight. Gold is a different tape: spot near $4,400 is a two-month high but remains far below January's record $5,598.", "zh": "商品端兩條線要分開看。原油因荷莫茲海峽仍未重開而站在高檔，布蘭特在 89 美元附近、美國原油一度逼近 94 美元；美伊6月簽的備忘錄已破局，短期沒有外交解方。黃金則是另一回事，現貨約 4,400 美元雖是兩個多月新高，卻仍遠低於今年1月 5,598 美元的歷史紀錄。", "url": "https://www.aljazeera.com/economy/2026/8/10/oil-prices-climb-as-iranian-demands-cloud-outlook-for-strait-of-hormuz"},
    {"id": "earn_0", "channel": "財報速報", "tag": "沃爾瑪失望", "color": "#E8786A", "stocks": [{"t": "WMT", "n": "美國同店銷售+2.6%不如預期3.5%，股價重挫6%"}, {"t": "TGT", "n": "目標百貨，同週財報，同屬大型賣場對照組"}, {"t": "COST", "n": "好市多，會員制通路，消費降級的另一面"}], "en": "The takeaway from retail earnings week: consumers are still buying, just cheaper. Walmart's US comparable sales rose 2.6% against the 3.5% expected, and both Q3 and full-year EPS guidance came in light, sending shares down roughly 6%. Walmart is the cleanest thermometer for the US consumer, and this print makes the trade-down thesis harder to argue with.", "zh": "上週零售財報週的結論是：消費者還在買，但只買便宜的。沃爾瑪美國同店銷售成長 2.6%，低於市場預期的 3.5%，加上第三季與全年每股獲利財測都低於預期，股價重挫約 6%。沃爾瑪是美國消費者最乾淨的溫度計，這個數字讓消費降級的說法更難反駁。", "url": "https://fortune.com/2026/08/17/walmart-target-home-depot-earnings-consumer-spending-stocks-all-time-high/"},
    {"id": "earn_1", "channel": "財報速報", "tag": "折扣店贏家", "color": "#E8786A", "stocks": [{"t": "ROST", "n": "羅斯百貨，營收+13%、EPS 2.66遠超預期1.94"}, {"t": "TJX", "n": "折扣零售龍頭，市佔戰對照組"}, {"t": "BURL", "n": "Burlington，同屬折扣服飾通路"}], "en": "Same consumer, different winner: off-price retail. Ross Stores grew revenue 13% to $6.26B with EPS of $2.66 versus $1.94 expected, and raised full-year EPS guidance to $8.61-8.77 from $7.50-7.74, lifting planned store openings to 115. One caveat: $0.60 of that EPS came from a tariff refund, a one-off rather than operating growth.", "zh": "同一個消費環境，折扣通路是贏家。羅斯百貨營收年增 13% 至 62.6 億美元，每股獲利 2.66 美元遠超預期的 1.94 美元，並把全年獲利財測由 7.50 至 7.74 美元上調到 8.61 至 8.77 美元，展店目標加到 115 家。要注意的是，這份財報裡有 0.60 美元來自關稅退款，屬於一次性挹注，不能全部當成本業成長。", "url": "https://www.benzinga.com/markets/earnings/26/08/61344730/ross-stores-posts-double-beat-in-q2-raises-2026-earnings-guidance"},
    {"id": "earn_2", "channel": "財報速報", "tag": "輝達壓軸", "color": "#E8786A", "stocks": [{"t": "NVDA", "n": "週三盤後財報，市估EPS 2.09、營收920.7億"}, {"t": "MRVL", "n": "週四財報，資料中心曝險高的對照組"}, {"t": "AVGO", "n": "博通，自研晶片路線的受惠者或受害者"}], "en": "The main event lands Wednesday after the close. Consensus has Nvidia at $2.09 EPS, up 99%, on revenue of $92.07B, up 97%. The oddity is that a potentially spectacular print arrives with the semiconductor index already in a bear market. Whether the number is good may matter less than whether the market is still willing to pay up for AI capex.", "zh": "本週的重頭戲在週三盤後。市場預期輝達每股獲利 2.09 美元、年增 99%，營收 920.7 億美元、年增 97%。詭異的是，這份可能非常漂亮的財報，是在費城半導體指數已經進入熊市的背景下公布。財報好不好可能不是重點，重點是市場願不願意再為 AI 資本支出買單。", "url": "https://www.kiplinger.com/investing/stocks/17494/next-week-earnings-calendar-stocks"},
    {"id": "macro_0", "channel": "總經政策", "tag": "降息機率", "color": "#7C6AF7", "stocks": [{"t": "SHY", "n": "短債ETF，最貼近政策利率預期"}, {"t": "TLT", "n": "長債ETF，對降息路徑與前瞻指引最敏感"}], "en": "Bets on a September cut firmed sharply over the past week, with futures now pricing roughly 85% odds of a 25bp cut at the Sept 16 FOMC. There is a structural catch: since taking office in May, Chair Warsh has deliberately compressed forward guidance with shorter statements, evasive press conferences, and explicit statements that he will not follow market pricing. The market is confident; the Fed has promised nothing.", "zh": "對 9 月降息的押注在過去一週明顯升溫，期貨市場目前定價約 85% 機率，9 月 16 日 FOMC 會再降一碼。但這裡有個結構性問題：主席 Warsh 自 5 月上任以來刻意壓縮前瞻指引，縮短會後聲明、在兩場記者會都給模糊答案，並公開表示不跟著市場定價走。市場很有信心，Fed 卻沒給過承諾。", "url": "https://www.finance-explained.online/news/20260820-warsh-jackson-hole-debut-september-rate-cut"},
    {"id": "macro_1", "channel": "總經政策", "tag": "PCE週五", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債ETF，直接反映通膨預期修正"}, {"t": "SPY", "n": "標普500，PCE與Warsh演講撞期決定週五風險偏好"}], "en": "July PCE lands Friday, the same day as Warsh's Jackson Hole keynote, a rare collision. Consensus: headline PCE up 0.1% month-on-month with the annual rate easing to 3.6% from 3.7%; core up 0.2% month-on-month with the annual rate holding at 3.3%. If core really is stuck at 3.3%, that sits in visible tension with September cut pricing.", "zh": "7 月 PCE 物價指數將在週五公布，而且跟 Warsh 的傑克遜洞演講同一天，這種撞期在近年很少見。市場預期整體 PCE 月增 0.1%、年增由 3.7% 降到 3.6%；核心 PCE 月增 0.2%、年增持平在 3.3%。核心通膨若真的黏在 3.3% 不動，跟 9 月降息的定價會出現明顯張力。", "url": "https://www.capitalstreetfx.com/market-analysis/nvidia-earnings-jackson-week-ahead-us-24-29-august-2026/"},
    {"id": "macro_2", "channel": "總經政策", "tag": "關稅退款", "color": "#7C6AF7", "stocks": [{"t": "DLTR", "n": "Dollar Tree，進口比重高，退款對損益影響大"}, {"t": "XRT", "n": "零售業ETF，整個產業都在逐批認列退款"}], "en": "An easily missed earnings variable: in February the Supreme Court struck down the IEEPA tariffs 6-3, meaning roughly $175B collected from importers has to go back. As of Aug 14 the government had refunded over $100B, about 60% of what it owes. That cash is landing in importers' income statements in batches, and Ross Stores' $0.60 is one example. Strip it out when you read the numbers.", "zh": "一個容易被忽略的企業獲利變數：最高法院今年 2 月以 6 比 3 判定 IEEPA 關稅違憲，進口商當初繳的約 1,750 億美元要退。到 8 月 14 日為止，美國政府已退超過 1,000 億美元，約佔應退金額的 60%。這筆錢正一批批進到進口商的損益表，羅斯百貨的 0.60 美元就是例子。讀財報時要把它拆出來看。", "url": "https://www.nortonrosefulbright.com/en-us/knowledge/publications/20f2de87/potential-refunds-us-supreme-court-overturns-ieepa-tariffs"},
    {"id": "sector_0", "channel": "產業風向", "tag": "醫療創高", "color": "#4EABA4", "stocks": [{"t": "XLV", "n": "醫療類股ETF，8/20單日漲3.5%創歷史新高"}, {"t": "UNH", "n": "聯合健康，管理式照護龍頭，成交量明顯放大"}, {"t": "LLY", "n": "禮來，醫療權值另一支柱"}], "en": "Healthcare is completing a breakout years in the making. Both the cap-weighted and equal-weighted S&P 500 healthcare indexes printed all-time highs, with the sector up 3.5% on Aug 20, its biggest single-day gain since April 2025. Traders flagged heavier volume in managed care names, suggesting institutions are shifting exposure out of stretched tech valuations.", "zh": "醫療股正在完成一次多年來罕見的突破。標普500醫療類股的市值加權與等權重指數雙雙創下歷史新高，8 月 20 日單日大漲 3.5%，是 2025 年 4 月以來最大單日漲幅。市場觀察到管理式照護股的成交量明顯放大，暗示機構在科技估值偏高時把部位挪過來。", "url": "https://seekingalpha.com/news/4630785-ten-large-cap-healthcare-stocks-with-strong-quant-scores-amid-sector-wide-rally"},
    {"id": "sector_1", "channel": "產業風向", "tag": "晶片熊市", "color": "#4EABA4", "stocks": [{"t": "SOXX", "n": "半導體ETF，自6/2高點跌約20%至23%"}, {"t": "MU", "n": "美光，記憶體是這波賣壓的震央之一"}, {"t": "AMAT", "n": "應用材料，設備端同步被殺"}], "en": "Semiconductors are formally in a bear market. SOXX is down roughly 20-23% from its June 2 peak, the deepest correction since 2022. Two triggers: margin calls on Samsung and SK Hynix in South Korea that cascaded into forced selling, and China's Moonshot releasing Kimi K3, a 2.8-trillion-parameter open-weight model that undercuts the assumption compute must run on expensive silicon. The paradox is that chip earnings are among the strongest in the S&P.", "zh": "半導體已經正式進入熊市。SOXX 自 6 月 2 日高點下跌約 20% 至 23%，是 2022 年以來最大的一次修正。導火線有兩個：南韓三星與 SK 海力士的保證金追繳引發連鎖賣壓，以及中國 Moonshot 推出 2.8 兆參數的開源模型 Kimi K3，動搖了算力必須靠昂貴晶片的假設。矛盾的是，晶片股的財報是標普裡最強的一群。", "url": "https://finance.yahoo.com/markets/stocks/articles/soxx-enters-bear-market-why-080201889.html"},
    {"id": "sector_2", "channel": "產業風向", "tag": "價值領先", "color": "#4EABA4", "stocks": [{"t": "XLE", "n": "能源ETF，年內約+21%領先全市場"}, {"t": "XLB", "n": "原物料ETF，年內約+17%"}, {"t": "XLI", "n": "工業ETF，年內約+12%至16%"}], "en": "Zoom out and 2026's story is capital leaving concentrated AI megacaps for the real economy. Energy is up about 21% year-to-date, materials 17%, industrials 12-16%, against a roughly flat broad market. This is not a two-week spasm but a months-long reallocation, and energy is collecting a geopolitical premium from the Hormuz closure on top.", "zh": "拉開全年來看，2026 年的主軸是資金離開集中的 AI 權值股，流向實體經濟。能源年內約漲 21%、原物料漲 17%、工業漲 12% 至 16%，而大盤幾乎持平。這種輪動不是一兩週的躁動，而是連續數月的資金重新配置，能源還額外吃到荷莫茲封鎖的地緣溢價。", "url": "https://www.morganstanley.com/insights/articles/magnificent-seven-rotation-portfolio-strategies-2026"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "再創新高", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，收在 3,052.85 歷史新高"}, {"t": "VTWO", "n": "Vanguard 羅素2000 ETF，同步創高"}], "en": "The Russell 2000 keeps setting records, most recently closing at an all-time high of 3,052.85, its 27th record close of 2026. It is up 22.7% year-to-date, ahead of the S&P 500 by 9.5 percentage points. The tell is that it did this while long-end yields spiked; rising rates usually hurt small caps, so the resilience is itself the signal.", "zh": "羅素 2000 繼續刷新紀錄，最近收在 3,052.85 的歷史新高，這是 2026 年第 27 次創收盤新高。年初至今上漲 22.7%，領先標普 500 達 9.5 個百分點。關鍵在於它是在長天期殖利率飆高的環境下創高，而升息通常對小型股不利，這份韌性本身就是訊號。", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "估值折價", "color": "#5B8ED6", "stocks": [{"t": "IWB", "n": "羅素1000 ETF，本益比 29.32 倍的對照組"}, {"t": "IJR", "n": "S&P 600 小型股ETF，另一個小型股估值參照"}], "en": "Even at record highs, small caps still screen cheap. The main Russell 2000 ETF trades around 19.21x earnings against 29.32x for the Russell 1000 ETF, a discount of roughly 34.5%. That gap says the rally has been driven by earnings and flows rather than multiple expansion, unlike the sentiment-led false starts of prior cycles.", "zh": "就算創了新高，小型股在估值上仍然便宜。追蹤羅素 2000 的主要 ETF 本益比約 19.21 倍，羅素 1000 的 ETF 則是 29.32 倍，折價幅度約 34.5%。這個差距說明這波上漲主要是獲利與資金推動，不是估值擴張，跟過去幾次靠情緒衝高的假突破性質不同。", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "獲利支撐", "color": "#5B8ED6", "stocks": [{"t": "XBI", "n": "生技ETF，小型生技獲利成長估 18% 至 35%"}, {"t": "IWO", "n": "羅素2000成長ETF，最直接反映這波獲利修正"}], "en": "Real earnings sit under this move, not just flows. Small-cap profits are seen growing 17.1% in 2026 and another 18% in 2027, with small-cap industrials and biotech pegged in an 18-35% range. Biotech is the piece worth watching: for cash-burning clinical-stage companies, a cutting cycle is a direct funding-cost tailwind.", "zh": "支撐這波的是實際獲利，不只是資金行情。小型股獲利估計 2026 年成長 17.1%、2027 年再成長 18%，其中小型工業股與生技股的成長區間落在 18% 至 35%。生技這一塊尤其值得留意，降息環境對燒錢的臨床期公司是直接的資金成本利多。", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "區域銀行", "color": "#5B8ED6", "stocks": [{"t": "KRE", "n": "區域銀行ETF，降息與併購的雙重受惠者"}, {"t": "IAT", "n": "美國銀行業ETF，拿來對照大型銀行的差異"}], "en": "Within small caps, regional banks get the most direct benefit from cuts. The Fed has already delivered 75bp with at least two more cuts expected in 2026; a lower short end plus a steeper curve is exactly the setup for net interest margin expansion. The M&A window is open too: regulators have turned more permissive, and banks under $10B in assets, still the majority of US institutions, face rising pressure to find scale.", "zh": "小型股裡最直接吃到降息的是區域銀行。Fed 已經降了三碼，市場預期 2026 年至少還有兩碼，短端下來加上殖利率曲線變陡，正是銀行淨利差擴張的環境。同時併購窗口也打開了：監管態度轉為寬鬆，而資產規模低於 100 億美元的銀行仍佔美國銀行家數的多數，規模不足者被併的壓力正在升高。", "url": "https://www.reedsmith.com/articles/us-bank-ma-outlook-for-2026-and-beyond/"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "反方論點", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "小型股ETF，浮動利率負債曝險集中"}, {"t": "IWO", "n": "羅素2000成長ETF，無獲利公司比重高、波動大"}], "en": "Required reading for small-cap investors: every pillar of the bull case doubles as a risk. Small caps lean heavily on floating-rate debt, so cuts help, but a shortfall in cuts turns that leverage against them. Regional banks carry more concentrated commercial real estate exposure than large banks, office especially. Add thin liquidity and any given headline moves a small cap several times harder. Know how the thesis breaks before you buy it.", "zh": "小型股判讀的必修課：多頭論點的每一根支柱，反過來也是風險。小型股大量使用浮動利率負債，降息是利多，但降息若不如預期就是槓桿反噬；區域銀行的商業不動產曝險比大型銀行更集中，尤其是辦公室類；再加上流動性薄，同一則消息在小型股身上的價格反應會被放大好幾倍。要買這個題材，得先知道它怎麼壞掉。", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "分拆孤兒", "color": "#C9A227", "stocks": [{"t": "HONA", "n": "漢威航太，6/29 分拆掛牌，首份財報後重跌逾 20%"}], "status": "RADAR · 下一個驗證點 Q3 財報（10 月底）", "en": "Honeywell Aerospace was spun out of Honeywell on June 29, one share for every two of the parent. Spin-offs are structural orphans: prior analyst coverage breaks, index funds are forced sellers, and the shareholder base has not settled. Its first report on Aug 6 made it less loved still. Q2 revenue of $4.5B rose 5%, but adjusted EPS of $1.87 fell 32%, and full-year organic growth guidance was cut to 4-5% from 7-9%. Shares dropped over 20% that day. The turn to watch: management blamed supply-chain capacity, not demand. If the October print shows the bottleneck easing while aftermarket demand holds, this is a classic spin-off overshoot. Risk: supply issues usually last longer than guided, and companies that cut once often cut twice. A research lead, not a buy call.", "zh": "漢威航太在 6 月 29 日從漢威聯合分拆出來獨立掛牌，母公司股東每兩股換發一股。分拆股天生就是孤兒：原本的分析師覆蓋斷掉、指數型基金被迫賣出、新的股東結構還沒穩定。8 月 6 日的首份財報讓它更被嫌棄——第二季營收 45 億美元年增 5%，但調整後每股獲利 1.87 美元、年減 32%，全年有機營收成長財測從 7% 至 9% 下修到 4% 至 5%，股價當天重挫超過 20%。轉折點在於：管理層把原因歸給供應鏈產能限制，而不是需求。若 10 月財報顯示出貨瓶頸緩解、航空售後市場需求還在，這就是典型的分拆錯殺。風險是供應鏈問題往往比管理層預估的久，而且下修一次的公司常常會下修第二次。這是研究線索，不是投資建議。", "url": "https://247wallst.com/investing/2026/08/07/honeywell-aerospace-tumbles-on-disappointing-debut-report-but-bull-case-remains-intact/"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "海事營造", "color": "#C9A227", "stocks": [{"t": "ORN", "n": "Orion Group，市值僅約 4.1 億美元的海事營造商"}], "status": "RADAR · 下一個驗證點 Q3 財報（11 月初）", "en": "Orion Group Holdings is a specialty contractor in marine and concrete work, serving ports, transportation, defense and industrial infrastructure. At roughly $410M market cap it is effectively invisible to Wall Street. The neglect is textbook: thin construction margins, lumpy project recognition, no narrative. What is changing is demand, with port expansion, naval and military facility work, and infrastructure spend all landing in its lane, and Zacks screening it with strong growth and value scores. The risk is real: in construction, bid discipline is everything, and a bad contract hurts more than no contract. Its earnings quality has been inconsistent historically. A research lead, not a buy call.", "zh": "Orion Group Holdings 做的是海事與混凝土的專門營造，客戶是港口、交通、國防與工業基礎建設。市值只有約 4.1 億美元，這個規模在華爾街基本上等於隱形。被忽視的原因很典型：營造業毛利薄、專案認列波動大、沒有故事可講。正在改變的是需求端——港口擴建、海軍與軍事設施工程、以及基礎建設支出，都落在它的守備範圍，而 Zacks 的模型把它列進小型股成長與價值評分俱佳的名單。風險很實在：營造業最怕的是投標紀律，接到爛約比接不到約更傷，而且它的獲利品質歷史上並不穩定。這是研究線索，不是投資建議。", "url": "https://www.zacks.com/featured-articles/301/best-small-cap-stocks"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "保險導流", "color": "#C9A227", "stocks": [{"t": "EVER", "n": "EverQuote，市值約 9.8 億，60 天內獲利共識上調"}], "status": "RADAR · 下一個驗證點 Q3 財報（11 月）", "en": "EverQuote runs an online insurance marketplace, routing high-intent shoppers to carriers and agents, at roughly $980M market cap. The neglect comes from awkward classification: not quite tech, not quite insurance, so neither side's analysts want it. What is changing is the direction of estimates. Over the past 60 days the 2026 EPS consensus rose to $1.74 from $1.55, implying 19.1% growth on 14.4% revenue growth, and Zacks ranks it a #1 Strong Buy. The risk is dependence on auto insurers' advertising budgets: when the underwriting cycle tightens, marketing spend is the first line cut. A research lead, not a buy call.", "zh": "EverQuote 經營保險線上媒合市場，把有購買意圖的消費者導給保險公司與經紀人，市值約 9.8 億美元。它被忽視的原因是分類尷尬——不算純科技也不算保險，兩邊的分析師都不太想覆蓋。正在改變的是獲利預估的方向：過去 60 天內，市場對它 2026 年每股獲利的共識從 1.55 美元上調到 1.74 美元，隱含年增 19.1%、營收成長 14.4%，Zacks 評等為最高的第 1 級。風險是它高度依賴車險業者的廣告預算，一旦保險公司的承保循環轉為緊縮，行銷支出會第一個被砍。這是研究線索，不是投資建議。", "url": "https://www.zacks.com/featured-articles/301/best-small-cap-stocks"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內驗收", "color": "#C9A227", "stocks": [{"t": "MOV", "n": "Movado，8/26 盤前財報，市估每股獲利 0.36 美元"}], "status": "RADAR · 下一個驗證點 8/26（三）盤前財報", "en": "A radar-pool name reports this week. On Aug 19 Movado said its Q2 call is set for Wednesday Aug 26 at 9am ET with results released pre-market that day, one day earlier than the pool previously recorded; the company's own notice governs. Consensus EPS is $0.36. Q1 was decent, with sales up 8.1% and gross margin at 57.3%, but management stayed cautious on guidance given geopolitical uncertainty. The counterargument to weigh: after the rebound off the lows, the multiple has already priced in some of the good news, and with July retail sales down 0.6% month-on-month, higher-ticket discretionary is the first thing cut in a trade-down. A research lead, not a buy call.", "zh": "雷達池內的 Movado 這週就要驗收。公司 8 月 19 日公告，第二季財報電話會議訂在 8 月 26 日週三上午 9 點，財報於當天盤前發布，市場預估每股獲利 0.36 美元。這比池內先前記錄的 8 月 27 日提前一天，以公司公告為準。第一季表現不差，營收成長 8.1%、毛利率升到 57.3%，但管理層因地緣不確定而保守給指引。要留意的反方論點是：股價從低點反彈後，本益比已經先把好消息反映掉一部分，加上 7 月零售銷售月減 0.6%，高單價可選消費是消費降級時最先被砍的一塊。這是研究線索，不是投資建議。", "url": "https://www.businesswire.com/news/home/20260819718785/en/Movado-Group-Inc.-Announces-Date-of-Conference-Call-and-Webcast-for-Second-Quarter-Fiscal-Year-2027-Results"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "廚櫃降息牌", "color": "#C9A227", "stocks": [{"t": "MBC", "n": "MasterBrand，執行長 8 月初自掏腰包買進 6 萬股"}], "status": "RADAR · 下一個驗證點 Q3 財報（11 月）", "en": "MasterBrand makes kitchen and bath cabinets, tied directly to the US home-renovation cycle, a cycle flattened by high mortgage rates for two years. It is ignored because the industry is dull and revenue is still declining. The changing signal is concrete: CEO R. Banyard bought 60,000 shares on the open market in early August for roughly $505,800, his own money rather than an option exercise. The logic: if cuts actually arrive and mortgage rates fall, renovation demand is among the most direct beneficiaries. The risk is that this is fundamentally a bet on the rate path; if September delivers less than priced, the turn gets pushed out while its external borrowing pressure does not pause. A research lead, not a buy call.", "zh": "MasterBrand 做的是廚房與浴室的櫃體製造，直接綁在美國住宅整修循環上，而這個循環過去兩年被高房貸利率壓得很扁。被忽視的原因是產業乏味加上營收還在衰退。正在改變的訊號很具體：執行長 R. Banyard 在 8 月初於公開市場買進 6 萬股、金額約 50.58 萬美元，這是自掏腰包而不是選擇權行使。邏輯上，若降息真的落地、房貸利率下來，整修需求是最直接的受益者之一。風險是這個賭注本質上是在賭利率路徑，若 9 月不降息或降得比預期少，轉折會被往後推，而它的外部借款壓力在等待期間不會消失。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/capital-goods/nyse-mbc/masterbrand/news/undervalued-small-caps-with-insider-buying-to-watch-in-augus-1"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "酪梨創辦人", "color": "#C9A227", "stocks": [{"t": "AVO", "n": "Mission Produce，創辦人 8 月買進 6 萬股約 42.3 萬美元"}], "status": "RADAR · 下一個驗證點 9 月上旬 Q3 財報", "en": "Mission Produce grows, markets and distributes avocados and blueberries, at roughly $1B market cap. Produce distribution is a classic no-coverage industry: margins swing with weather and freight, and quarterly numbers jump around. August's signal was founder Todd Schwartz buying 60,000 shares on the open market for about $422,988. A founder adding reads differently from a typical executive, since he already held a large stake, so adding implies a specific view on price. The risk is avocado price volatility; Latin American growing seasons and tariffs can reset margins overnight, and strong inventory and cash-flow seasonality makes any single quarter misleading. A research lead, not a buy call.", "zh": "Mission Produce 做酪梨與藍莓的種植、行銷與配銷，市值約 10 億美元。農產配銷是典型的沒人想覆蓋的產業：毛利受天候與運費擺布，季度數字跳動大。8 月的訊號是創辦人 Todd Schwartz 在公開市場買進 6 萬股、金額約 42.3 萬美元。創辦人加碼的意義跟一般高層不同，他原本持股就重，再往上加代表對價格有明確看法。風險是酪梨價格波動極大，中南美洲的產季與關稅都可能一夕改變毛利，而且它的存貨與現金流季節性很強，單季數字容易誤導。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/consumer-durables/nasdaq-sono/sonos/news/discover-august-2026s-undervalued-small-caps-with-insider-bu/amp"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "買方是誰", "color": "#6DB56D", "stocks": [{"t": "LIEN", "n": "Chicago Atlantic BDC，John Mazarakis 買 6 萬股約 56.6 萬"}, {"t": "ENHA", "n": "Enhanced Group，Apeiron 基金買進約 268.8 萬美元"}], "en": "Insider data is about who is buying, not just how much. Aug 20 alone logged 223 open-market insider transactions, but the largest buyers were not operating executives: Apeiron Investment Group bought roughly $2.688M of Enhanced Group, and Chicago Atlantic BDC's John Mazarakis bought 60,000 shares for about $566,400. Funds and large holders adding is a different signal from operators writing personal cheques. The first reflects allocation, the second an information edge on the business. Do not read them as the same thing.", "zh": "內部人資料要看的不只是金額，還有誰在買。8 月 20 日單日就有 223 筆公開市場內部人交易，但金額最大的幾筆買方並不是營運高層：Apeiron Investment Group 買進 Enhanced Group 約 268.8 萬美元，Chicago Atlantic BDC 的 John Mazarakis 買進 6 萬股約 56.6 萬美元。基金與大股東加碼跟營運層自掏腰包是兩種訊號，前者反映資產配置，後者反映對本業的資訊優勢，判讀時不該混為一談。", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+August+20,+2026"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "庫藏股潮", "color": "#6DB56D", "stocks": [{"t": "SONO", "n": "Sonos，3 至 6 月買回 199 萬股、3,014 萬美元"}, {"t": "ICFI", "n": "ICF International，1 至 6 月買回 43.5 萬股、2,900 萬"}, {"t": "EVTC", "n": "Evertec，8/4 把買回計畫再加碼 1.5 億美元"}], "en": "Buybacks are the more telling thread this year. Sonos repurchased 1.99M shares for $30.14M between March and June; ICF International bought back 435,000 shares for $29M from January to June; and Evertec expanded its programme by another $150M on Aug 4. Companies spending real cash on their own stock carries more weight than talking their book, especially with rates still high and capital carrying an opportunity cost. One thing to check: whether the buyback merely offsets employee option dilution, in which case share count does not actually fall.", "zh": "今年更值得追蹤的其實是庫藏股。Sonos 在 3 月到 6 月間買回 199 萬股、金額 3,014 萬美元；ICF International 在 1 到 6 月買回 43.5 萬股、金額 2,900 萬美元；Evertec 則在 8 月 4 日把買回計畫再加碼 1.5 億美元。公司拿真金白銀買自己，在利率仍高、資金有機會成本的環境下，比口頭喊便宜有力得多。但要檢查一件事：買回是不是只用來抵銷員工選擇權的稀釋，那樣流通股數不會真的減少。", "url": "https://simplywall.st/stocks/us/diversified-financials/nyse-evtc/evertec/news/top-undervalued-small-caps-with-insider-activity-in-august-2/amp"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "判讀陷阱", "color": "#6DB56D", "stocks": [{"t": "MBC", "n": "執行長 50.58 萬美元屬公開市場買進"}, {"t": "AVO", "n": "創辦人 42.3 萬美元也是公開市場買進"}], "en": "Three cautions for reading insider data. First, separate open-market purchases from option exercises; the latter carries almost no signal. Second, watch for 10b5-1 plans, which were scheduled months earlier and say nothing about current judgement. Third, size the purchase against personal wealth rather than in absolute dollars: a CEO buying $500K means something different from a director doing the same. Today's cards feature MasterBrand's CEO at $505,800 and Mission Produce's founder at $422,988, both open-market buys, which is the category worth writing down.", "zh": "給讀內部人資料的三個提醒。第一，要分辨公開市場買進與選擇權行使，後者幾乎沒有訊號價值。第二，注意 10b5-1 預設交易計畫，那是幾個月前就排好的，跟當下判斷無關。第三，看金額佔個人身家的比例，而不是絕對數字，執行長買 50 萬美元跟董事買 50 萬美元的意義差很多。今天卡片裡 MasterBrand 執行長的 50.58 萬與 Mission Produce 創辦人的 42.3 萬都屬於公開市場買進，這才是值得記下來的那一類。", "url": "https://www.form4api.com/guides/cluster-buy-signals"},
    {"id": "week_0", "channel": "本週事件", "tag": "總經行事曆", "color": "#C97DD4", "stocks": [{"t": "IEF", "n": "中期美債ETF，週五 PCE 與 Warsh 演講雙重考驗"}, {"t": "GLD", "n": "黃金ETF，利率路徑一變它最先反應"}, {"t": "UUP", "n": "美元指數ETF，前瞻指引直接影響匯率"}], "en": "Three macro markers this week. Jackson Hole runs Aug 27-29 in Wyoming on the theme of financial innovation and payments; Chair Warsh delivers his first symposium keynote on Friday morning Aug 28, just 19 days before the Sept 16 FOMC decision. July PCE lands that same Friday. In effect, the week's entire information load is stacked on its final day.", "zh": "本週總經有三個節點。傑克遜洞年會 8 月 27 日到 29 日在懷俄明州登場，主題是金融創新與支付；Fed 主席 Warsh 在 8 月 28 日週五上午發表他上任後首場年會主題演講，距離 9 月 16 日的 FOMC 決議只有 19 天。同一個週五還要公布 7 月 PCE。換句話說，全週的資訊量集中壓在最後一天。", "url": "https://www.regardsofwallstreet.com/news/jackson-hole-2026-dates-schedule-warsh-first-speech"},
    {"id": "week_1", "channel": "本週事件", "tag": "財報行事曆", "color": "#C97DD4", "stocks": [{"t": "CRM", "n": "Salesforce，週三財報，企業軟體需求風向球"}, {"t": "CRWD", "n": "CrowdStrike，週三財報，看訂閱續約率"}, {"t": "ULTA", "n": "Ulta Beauty，週四財報，美妝消費溫度計"}, {"t": "HPQ", "n": "HP，週三財報，PC 換機週期的驗證"}], "en": "Earnings cluster Wednesday and Thursday. Nvidia leads after Wednesday's close alongside Salesforce, CrowdStrike and HP; Thursday brings Marvell and Ulta Beauty, while radar-pool name Movado reports pre-market Wednesday. Salesforce and CrowdStrike deserve separate attention: both are enterprise software, and with the AI narrative wobbling, their renewal and subscription numbers say more about whether corporates are actually spending than chip results do.", "zh": "財報端集中在週三與週四。週三盤後輝達領軍，同日還有 Salesforce、CrowdStrike 與 HP；週四是 Marvell 與 Ulta Beauty，雷達池裡的 Movado 則在週三盤前公布。Salesforce 與 CrowdStrike 值得單獨看：兩家都是企業軟體，在 AI 敘事鬆動的時候，它們的續約與訂閱數字比晶片更能說明企業端到底有沒有真的在花錢。", "url": "https://www.kiplinger.com/investing/stocks/17494/next-week-earnings-calendar-stocks"},

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>

    </div>
  );
}

          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.6,marginTop:'4px' }}>只有大陸腔嗓音支援語氣；<br/>台灣腔會忽略這一項</div>
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>English Voice</div>
          <select className="az-input" value={voice} onChange={e=>setVoice(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="en-US-AriaNeural">Aria（女）自然流暢</option>
            <option value="en-US-JennyNeural">Jenny（女）清晰</option>
            <option value="en-US-GuyNeural">Guy（男）沉穩</option>
            <option value="en-US-DavisNeural">Davis（男）個性</option>
            <option value="en-US-TonyNeural">Tony（男）自信</option>
          </select>
        </div>
        <div style={{ display:'flex',gap:'8px' }}>
          <button onClick={handleSave} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--divider)',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>儲存</button>
          <button onClick={handleTest} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--text-secondary)',color:'var(--text-secondary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>測試</button>
        </div>
        {status && <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',color:'var(--text-tertiary)',letterSpacing:'0.1em' }}>{status}</div>}
        <div style={{ marginTop:'auto',fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.7,paddingTop:'8px',borderTop:'1px solid var(--divider)' }}>Key 存於 localStorage<br/><b>沒填 Key 會退回瀏覽器內建語音，<br/>那個聽起來就是很機械。</b><br/>要好聽請填 Azure Key。<br/><br/>朗讀語系跟著畫面走：<br/>主文中文→中文嗓音<br/>展開 English→英文嗓音</div>
      </div>
    </>,
    document.body
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

// ===== 資金流向(TradingView 官方嵌入元件,即時資料,每日排程不需更新) =====
function HeatmapView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",
        blockSize: "market_cap_basic", blockColor: "change",
        locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true,
        hasSymbolTooltip: true, isMonoSize: false,
        width: "100%", height: "100%"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 10px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>S&P 500 · 即時資金流向</span>
        <a href="https://finviz.com/map?t=sec&st=d1" target="_blank" rel="noopener noreferrer" className="source-link">Finviz 完整版 ↗</a>
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ flex:1, minHeight:0 }} />
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/24/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v8.5</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
