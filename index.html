/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>

  :root[data-theme="dark"] {

    --text-tertiary: #86837f; --divider: #2e2a24;

  body::before {

    background-repeat: repeat; background-size: 180px 180px;

  #root { position: relative; z-index: 1; }

  .app-shell { height: 100vh; height: 100dvh; }

    from { opacity: 0; transform: translateY(12px); }

    {"id": "earn_0", "channel": "財報速報", "tag": "摩根大通：EPS 5.57 美元低於預期，是近三年第一次未達標", "color": "#E8786A", "zh": "摩根大通第三季獲利 153 億美元（年增 6%），每股盈餘 5.57 美元，低於預期的 5.90 美元左右（Fortune 引述 5.93）；扣掉債市賣壓造成的 6.58 億美元證券損失後為 5.75 美元。營收年增 8% 到約 502 億美元，主因是固定收益交易比夏天慢；淨利息收入成長 13% 到 270 億美元，並上調今年淨利息收入指引。高盛利潤 52.9 億美元、每股 17.01 美元，營收優於預期，股票交易強、債券交易放緩。", "en": "JPMorgan earned $15.3 billion in the third quarter (+6%), or $5.57 a share, below the roughly $5.90 consensus and its first miss in almost three years; excluding $658 million of securities losses it was $5.75. Revenue rose 8% to about $50.2 billion as fixed-income trading slowed, while net interest income rose 13% to $27 billion and 2026 guidance was raised. Goldman earned $5.29 billion, or $17.01 a share, beating revenue estimates on strong equities trading.", "url": "https://fortune.com/2026/10/13/jpmorgan-goldman-sachs-citigroup-wells-fargo-interest-inflation/", "stocks": [{"t": "JPM", "n": "EPS 5.57 美元低於預期，營收 +8%"}, {"t": "GS", "n": "EPS 17.01 美元，營收優於預期"}]},

    {"id": "earn_2", "channel": "財報速報", "tag": "UnitedHealth 上調財測股價約 +3%；J&J 獲利優於預期卻因醫材下跌", "color": "#E8786A", "zh": "UnitedHealth 第三季調整後每股盈餘 4.69 美元（預期約 4.12 美元），營收 1,127 億美元，醫療成本率 88.4%，其中含 6.1 億美元有利的前期準備金調整；全年調整後 EPS 預期上調到至少 20.50 美元，Yahoo 報導股價約漲 3%。J&J 獲利優於預期並上調全年財測，但醫療器材銷售偏弱，盤中資料顯示股價跌約 5.6%（報價視窗時間不明，請查即時行情）。", "en": "UnitedHealth reported third-quarter adjusted EPS of $4.69 against about $4.12 expected, revenue of $112.7 billion and a medical care ratio of 88.4%, helped by $610 million of favorable prior-period reserve development; it raised 2026 adjusted EPS guidance to at least $20.50, and the shares were up about 3% per Yahoo. Johnson & Johnson beat earnings and raised its full-year outlook, but weaker medical-device sales sent the stock down roughly 5.6% on one quote (timing unclear).", "url": "https://www.sec.gov/Archives/edgar/data/0000731766/000073176626000255/earningsrelease3q26unh.htm", "stocks": [{"t": "UNH", "n": "調整後 EPS 4.69 美元，全年財測 ≥20.50 美元"}, {"t": "JNJ", "n": "獲利優於預期、財測上調，醫材偏弱股價跌"}, {"t": "ISRG", "n": "醫療器材族群的對照標的"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "9 月 CPI 今天 8:30（美東）公布：整體約 3.6%，核心約 2.4%", "color": "#7C6AF7", "zh": "9 月消費者物價指數今天（10/14）美東上午 8:30 公布。預覽報導預期整體年增約 3.6% 到 3.7%（上月 3.4%），推升力道主要是創紀錄的九月汽油價格；核心預期約 2.4%，克里夫蘭聯準銀行的即時估算（截至 10/7）整體 3.60%、核心 2.39%。核心才是下次 FOMC（10/27 至 28 日）要不要再升息的關鍵，所以核心數字比整體更重要。", "en": "September CPI is due today (Oct. 14) at 8:30 a.m. ET. Previews expect headline inflation of about 3.6% to 3.7% (from 3.4%), driven by record September gasoline prices, and core near 2.4%; the Cleveland Fed nowcast as of Oct. 7 was 3.60% headline and 2.39% core. Core matters most for whether the Fed hikes again at its Oct. 27 to 28 meeting.", "url": "https://247wallst.com/investing/2026/09/10/tomorrows-cpi-report-could-send-rate-hike-odds-even-higher/", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，對 CPI 數字最直接"}, {"t": "XHB", "n": "住宅營建 ETF，對房貸利率敏感"}, {"t": "XRT", "n": "零售 ETF，汽油價格壓縮非必需消費"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "Fed 上月升息，大銀行共同警告：黏性通膨與利率風險", "color": "#7C6AF7", "zh": "Fortune 整理四大行財報時指出，Fed 上月升息（2023 年以來第一次），且是在白宮反對之下。摩根大通執行長戴蒙點名「黏性通膨、龐大財政赤字、資產價格偏高、利率上升、地緣風險」，並說銀行已為各種結果做準備。這和油價、汽油價格創高疊在一起，市場現在關心的是升息週期是否剛開始。", "en": "Fortune notes the Fed raised rates last month for the first time since 2023, over White House objections. JPMorgan CEO Jamie Dimon cited sticky inflation, large fiscal deficits, elevated asset prices, rising rates and geopolitics, and said the bank is prepared for a range of outcomes. With oil and gasoline elevated, markets are asking whether a hiking cycle has just begun.", "url": "https://fortune.com/2026/10/13/jpmorgan-goldman-sachs-citigroup-wells-fargo-interest-inflation/", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，對利率與信用最敏感"}, {"t": "XLF", "n": "金融類股 ETF，整體財報季風向"}, {"t": "SHY", "n": "短天期公債 ETF，反映升息預期"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "殖利率仍在 24 年高檔：基金經理人說要 5.9% 才願意把股票換成債券", "color": "#7C6AF7", "zh": "本週十年期美債殖利率一度到 5.3645%，是 2002 年 4 月以來最高；週二小退到約 5.2%。Yahoo 引述的基金經理人調查顯示，投資人要十年期殖利率到 5.9% 才會把資金從股票轉進債券——意思是股市還沒有被利率逼到轉向，但這個門檻本身也說明殖利率快速上升仍是風險。債市賣壓已反映在銀行財報：摩根大通這一季有 6.58 億美元證券損失。", "en": "The 10-year Treasury yield touched 5.3645% this week, the highest since April 2002, before easing to about 5.2% on Tuesday. A fund-manager survey cited by Yahoo says investors want a 5.9% 10-year yield before shifting from stocks to bonds, which implies equities have not yet been forced out, though rapid yield moves remain a risk. The bond selloff already shows up in bank results: JPMorgan booked $658 million of securities losses.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-080236234.html", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，價格與殖利率反向"}, {"t": "IEF", "n": "中天期公債 ETF"}, {"t": "VNQ", "n": "房地產 ETF，對長天期利率敏感"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "晶片拖累科技：記憶體與設備股被 KOSPI 崩跌拖下水", "color": "#4EABA4", "zh": "科技板塊週二偏弱，核心是記憶體鏈：南韓 KOSPI 單日重挫逾 5%，三星與 SK 海力士大跌，美光跟著跌 4.6%；設備股更慘，Applied Materials 跌 7.2%、Lam Research 跌 3.2%。反向的是軟體與支付：Salesforce 漲 1.75%、IBM 漲 1.60%、Visa 漲 1.58% 位居漲幅前段。這是板塊內部的輪動，不是科技整體崩盤。", "en": "Technology was weak on Tuesday, led by the memory chain: KOSPI fell more than 5%, Samsung and SK Hynix dropped, Micron lost 4.6%, and equipment makers fell harder, with Applied Materials down 7.2% and Lam Research down 3.2%. Software and payments held up, with Salesforce up 1.75%, IBM up 1.60% and Visa up 1.58%. It was sector rotation inside tech rather than a broad tech selloff.", "url": "https://tradingeconomics.com/united-states/stock-market/news/590955", "stocks": [{"t": "CRM", "n": "軟體股，漲 1.75%"}, {"t": "IBM", "n": "漲 1.60%"}, {"t": "V", "n": "支付，漲 1.58%"}, {"t": "SOXX", "n": "半導體 ETF，記憶體與設備股拖累"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "能源與煉油：油價高檔，汽油超過 4 美元的天數追平 2022", "color": "#4EABA4", "zh": "布蘭特原油週二先站上 106 美元後回落，WTI 約在 92 到 95 美元之間（各來源差距大）；美國汽油價格「超過每加侖 4 美元的天數」已追平 2022 年的全年紀錄。Yahoo 的熱門個股欄位顯示 Par Pacific（PARR）漲約 8.1%、PBF Energy 漲約 7.2%，兩者都是煉油股，但該欄位時間不明，我無法確認是週二當天的漲幅。煉油股的邏輯是裂解價差而不是油價本身。", "en": "Brent topped $106 on Tuesday before easing, with WTI between roughly $92 and $95 depending on source, and gasoline has tied 2022 for the most days above $4 a gallon in a year. Yahoo's trending list showed refiners Par Pacific up about 8.1% and PBF Energy up about 7.2%, though the timing of that widget is unclear. For refiners the driver is the crack spread rather than crude itself.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-080236234.html", "stocks": [{"t": "XLE", "n": "能源類股 ETF"}, {"t": "PARR", "n": "區域煉油商，熱門欄位顯示漲約 8.1%"}, {"t": "PBF", "n": "煉油商，熱門欄位顯示漲約 7.2%"}, {"t": "XOP", "n": "油氣探勘生產 ETF"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "Medicare Advantage 結構在改善：保險商用漲價與縮方案換回利潤", "color": "#4EABA4", "zh": "UnitedHealth 這一季醫療成本率 88.4%，管理層歸因於成本管理、保費與福利的調整以及照護模式改善；營運成本率從 13.5% 降到 12.8%。同業 Humana、Centene、CVS（Aetna）過去兩季同樣縮減方案、調漲保費。但要注意：這一季有 6.1 億美元前期準備金的有利調整墊高了數字，剔除後改善幅度會小一點。", "en": "UnitedHealth's medical care ratio improved to 88.4%, which management credits to cost management, pricing and benefit design and care-delivery changes; the operating cost ratio fell to 12.8% from 13.5%. Peers Humana, Centene and CVS (Aetna) have also cut plans and raised premiums. Note that $610 million of favorable prior-period reserve development flattered the quarter.", "url": "https://www.sec.gov/Archives/edgar/data/0000731766/000073176626000255/uhgearnings_q32026vfinal.htm", "stocks": [{"t": "HUM", "n": "Humana，Medicare Advantage 純度最高"}, {"t": "CNC", "n": "Centene，政府型保險"}, {"t": "CVS", "n": "CVS（含 Aetna），同樣縮減方案"}, {"t": "ELV", "n": "Elevance，管理式醫療對照"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000 收 2,786.13（-0.30%），距 8/12 高點約 8.6%", "color": "#5B8ED6", "zh": "羅素 2000 週二收 2,786.13（-0.30%），表現略差於標普 500（-0.02%）。若以前面推算的 8/12 高點約 3,047 計算，目前仍低約 8.6%（推算值，非官方數字）。小型股不像大型股那樣有 AI 概念撐腰，更怕十年期殖利率 5.2% 的借貸成本，所以今天 CPI 與下週的銀行信貸品質是小型股的觀察點。", "en": "The Russell 2000 closed at 2,786.13 (-0.30%) on Tuesday, a bit weaker than the S&P 500 (-0.02%). Against an implied Aug. 12 high of roughly 3,047 (my estimate, not an official figure) it is about 8.6% lower. Small caps lack the AI narrative and are more exposed to borrowing costs at a 5.2% 10-year yield, so CPI and credit quality are the things to watch.", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-oct-13-2026", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，指數收 2,786.13（-0.30%）"}, {"t": "IJR", "n": "標普小型 600 ETF，品質較高的對照"}, {"t": "IWN", "n": "羅素 2000 價值型 ETF"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "熱門欄位：EFXT 漲 14%、CIFR 跌 13%，原因來源沒說", "color": "#5B8ED6", "zh": "Yahoo 熱門個股欄位列出 Enerflex（EFXT）漲約 14.4%，跌幅榜有 Cipher Mining（CIFR）約 -12.8%、PDF Solutions（PDFS）約 -9.6%、Summit Therapeutics（SMMT）約 -9.4%。來源只給漲跌幅，沒有交代原因，也不確定是不是週二收盤數字，所以只能當成「今天值得查原因」的清單，不能直接拿來推論。", "en": "Yahoo's trending list showed Enerflex (EFXT) up about 14.4%, with Cipher Mining (CIFR) down about 12.8%, PDF Solutions (PDFS) down about 9.6% and Summit Therapeutics (SMMT) down about 9.4%. The source gives no reasons and the timing is unclear, so treat this as a list of names worth checking, not a conclusion.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-080236234.html", "stocks": [{"t": "EFXT", "n": "能源設備與服務，熱門欄位 +14.4%"}, {"t": "CIFR", "n": "比特幣礦業，約 -12.8%"}, {"t": "PDFS", "n": "半導體製程分析軟體，約 -9.6%"}, {"t": "SMMT", "n": "臨床期生技，約 -9.4%"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "小型股判讀：分拆（spin-off）初期為什麼常有被動賣壓", "color": "#5B8ED6", "zh": "公司分拆時，母公司股東會依持股比例拿到新公司股票，但很多基金的規則不允許持有這種規模太小或不在指數內的新股，只能賣出，所以新股上市頭幾週常有與基本面無關的賣壓。池內的 Flex（Archer SpinCo 要分拆雲端與電力基礎建設）與 Vylor（Corteva 分出的種子事業，10/1 起交易）都在這個階段。判讀重點是：賣壓結束後，剩下的是不是一家有獨立財報的好公司，而不是壓低的價格本身。", "en": "In a spin-off, parent shareholders receive shares of the new company in proportion to their holdings, but many funds cannot hold a small or non-index stock and sell it, so the first weeks often show selling unrelated to fundamentals. Flex (Archer SpinCo, cloud and power infrastructure) and Vylor (Corteva's seed business, trading since Oct. 1) are at this stage. The question is whether a good standalone business remains once the forced selling ends, not the depressed price itself.", "url": "https://investors.flex.com/transaction-resources/", "stocks": [{"t": "FLEX", "n": "Archer SpinCo 分拆案仍在 Form 10 階段"}, {"t": "VYLR", "n": "Corteva 分出的種子事業，10/1 起交易"}, {"t": "CTVA", "n": "分拆的母公司"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "小型股判讀：財報前後的跳空，資訊多還是雜訊多", "color": "#5B8ED6", "zh": "覆蓋少的小型股，財報隔天跳空 10% 到 20% 很常見，因為只有兩三位分析師、市場上缺少共識預期，第一個大單就能把價格推走。判斷方法有三個：看成交量是不是同步放大；看財報裡的訂單、毛利率有沒有改善，而不只是每股盈餘；以及看價格兩三天後有沒有回吐。今天熱門欄位上的 +14% 或 -13% 都適用這個檢查。", "en": "For thinly covered small caps, 10% to 20% gaps the day after earnings are common because few analysts follow them and consensus is thin, so one large order can move the price. Three checks: whether volume expanded with the move, whether orders and gross margin improved rather than just EPS, and whether the price gives back the move within a few days. Today's +14% and -13% names fit that test.", "url": "https://www.investopedia.com/terms/s/smallcapstock.asp", "stocks": [{"t": "IWM", "n": "小型股整體"}, {"t": "EFXT", "n": "今日 +14.4% 的例子"}, {"t": "CIFR", "n": "今日 -12.8% 的例子"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "小型股判讀：5.2% 的殖利率下，哪些公司的債務最危險", "color": "#5B8ED6", "zh": "判斷小型股在高利率下的風險，有三個快速檢查：一是利息保障倍數（營業利益是利息支出的幾倍），低於 2 倍就很脆弱；二是債務是浮動利率還是固定，浮動的會立刻變貴；三是 12 到 24 個月內有多少債要到期再融資。池內的 Dynex、Angel Oak Mortgage REIT 這類抵押貸款 REIT 對利率最敏感，而像 Union Bankshares 這種存款基礎穩的社區銀行則是另一種風險：債券部位的帳面虧損。", "en": "To judge small caps at a 5.2% yield, run three quick checks: interest coverage (operating income divided by interest expense; below 2x is fragile), whether debt is floating or fixed, and how much must be refinanced within 12 to 24 months. Mortgage REITs such as Dynex and Angel Oak Mortgage REIT are the most rate-sensitive, while community banks like Union Bankshares face a different risk: unrealized losses on bond holdings.", "url": "https://www.investopedia.com/terms/i/interestcoverageratio.asp", "stocks": [{"t": "DX", "n": "Dynex，抵押貸款 REIT，利率最敏感類型"}, {"t": "AOMR", "n": "Angel Oak Mortgage REIT，非政府機構房貸"}, {"t": "UNB", "n": "社區銀行，要看債券帳面虧損"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "Gentherm：Q3 財報 10/22，合併案後首季；分析師約 4 買 4 持有", "color": "#C9A227", "zh": "Gentherm（THRM）做熱管理與座椅溫控，10/1 完成與 Modine Performance Technologies 的反向莫里斯信託合併，新發 23,735,961 股，Modine 股東換到 43.62% 股份。被忽視的原因是它是事件型而非傳統冷門股，合併後的短期換手容易被當成雜訊。新動態：公司宣布 10/22（週四）早上 8:00 美東開財報電話會議；Q2 時已上調全年營收、調整後 EBITDA 與自由現金流指引，營收中位數約 16 億美元。風險是整合、股本近乎翻倍，以及我沒找到實際賣壓資料。這是研究線索，不是投資建議。", "en": "Gentherm (THRM) makes thermal management and seat-comfort systems and closed its Reverse Morris Trust merger with Modine Performance Technologies on Oct. 1, issuing 23,735,961 shares so that Modine holders own 43.62%. The stock is event-driven rather than a classic neglect case. New: Q3 results and a call are set for Oct. 22 at 8 a.m. ET; Q2 raised full-year guidance with revenue near $1.6 billion at the midpoint. Risks are integration, a near-doubled share count and unknown selling pressure. This is a research lead, not investment advice.", "url": "https://www.quiverquant.com/news/Gentherm+to+Report+Third+Quarter+2026+Financial+Results+on+October+22%2C+2026", "stocks": [{"t": "THRM", "n": "主角，Q3 財報 10/22"}], "status": "RADAR · 下一個驗證點 10/22 Q3 財報（合併後首季）"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "Flex：Archer SpinCo 分拆雲端與電力事業，Form 10 尚未見修訂版", "color": "#C9A227", "zh": "Flex（FLEX）是電子代工龍頭，已送件 Form 10 要分拆「雲端與電力基礎建設」事業（暫名 Archer SpinCo），Flex 預計保留不超過 19.9% 股權。被忽視是因為母公司被用代工的低本益比評價，資料中心電力與散熱硬體被稀釋，新公司也還沒有代號與分析師覆蓋。同業已量化這個瓶頸：Hubbell 美洲電氣 Q2 有機營收 +18%、Powell 在手訂單年增 69% 到 24 億美元。新動態：Flex 9/3 宣布收購 EPC Power（交易條件我沒讀到全文）。風險是分拆可能延後，Form 10 只是送件不是保證。這是研究線索，不是投資建議。", "en": "Flex (FLEX), an electronics contract manufacturer, has filed a Form 10 to spin off its cloud and power infrastructure business (working name Archer SpinCo), retaining no more than 19.9%. It is neglected because the parent is valued like a contract manufacturer and the data-center power and cooling hardware is diluted inside it. Peers show the bottleneck: Hubbell's Americas electrical organic revenue rose 18% and Powell's backlog rose 69% to $2.4 billion. New: Flex announced the EPC Power acquisition on Sept. 3 (terms not confirmed). Risk: the spin could be delayed. This is a research lead, not investment advice.", "url": "https://investors.flex.com/transaction-resources/", "stocks": [{"t": "FLEX", "n": "主角，分拆案在 Form 10 階段"}, {"t": "HUBB", "n": "同業，電氣訂單 +41% 的對照"}, {"t": "POWL", "n": "同業，在手訂單年增 69%"}], "status": "RADAR · 下一個驗證點 Form 10 修訂版的負債結構與利潤率"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "Fluence：全年營收指引下修到 24 億，董事 9/21 小額買進", "color": "#C9A227", "zh": "Fluence Energy（FLNC）做電池儲能系統，股價年內約 -60%、靠近 52 週低點 7.01 美元。9/16 公司把全年營收指引從中位數約 30 億美元下修到約 24 億美元，調整後 EBITDA 預期變成約虧損 2 億美元（原約虧損 1,000 萬），理由是美國生產的供應鏈問題；董事 Bulls 9/21 以 7.36 美元買進 1 萬股（約 7.4 萬美元），另一位董事同價買 7,000 股。要說清楚：它並非真的無人關注，只算半個雷達線索，而且目前只有內部人訊號、沒有基本面拐點。這是研究線索，不是投資建議。", "en": "Fluence Energy (FLNC) builds battery storage systems; the stock is down about 60% this year, near its 52-week low of $7.01. On Sept. 16 it cut fiscal-year revenue guidance from a midpoint near $3.0 billion to about $2.4 billion and now expects adjusted EBITDA of about negative $200 million, citing US production supply-chain problems. Director Herman Bulls bought 10,000 shares at $7.36 on Sept. 21 and another director bought 7,000. It is only half a neglect case, with an insider signal but no fundamental inflection yet. This is a research lead, not investment advice.", "url": "https://www.marketbeat.com/instant-alerts/insider-fluence-energy-nasdaq-flnc-director-herman-bulls-acquires-10000-shares-of-stock-2026-09-22/", "stocks": [{"t": "FLNC", "n": "主角，指引下修後的內部人買進"}], "status": "RADAR · 下一個驗證點 下一季財報：指引能否止住下修、毛利率是否回升"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "Par Pacific：區域煉油＋自有加油站，熱門欄位顯示今日漲約 8%", "color": "#C9A227", "zh": "Par Pacific（PARR）在夏威夷、太平洋西北與懷俄明經營煉油廠和自有加油站。被忽視的原因是柴油裂解價差創紀錄的新聞都被 Valero、Marathon 等大型煉油股吸走，而零售通路又讓它難以被單一產業框架歸類。新動態：Yahoo 熱門欄位顯示今日漲約 8.1%（時間不明，我無法確認）；9/23 起布蘭特回落到 100 美元以下，對煉油商是原料成本下降的窗口。風險很具體：裂解價差均值回歸最強、夏威夷是單一市場、一次非計畫歲修就能吃掉一季獲利。這是研究線索，不是投資建議。", "en": "Par Pacific (PARR) runs refineries and retail stations in Hawaii, the Pacific Northwest and Wyoming. It is neglected because record diesel crack-spread headlines go to large refiners like Valero and Marathon, and its retail arm makes it hard to classify. New: Yahoo's trending list showed it up about 8.1% (timing unclear). Risks: crack spreads mean-revert strongly, Hawaii is a single market, and one unplanned turnaround can erase a quarter's profit. This is a research lead, not investment advice.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-080236234.html", "stocks": [{"t": "PARR", "n": "主角，熱門欄位漲約 8.1%"}, {"t": "VLO", "n": "大型煉油商，對照裂解價差"}, {"t": "MPC", "n": "大型煉油商，對照實現利潤率"}], "status": "RADAR · 下一個驗證點 10 月底 Q3 財報：實現煉油利潤率年增幅度"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "Karman：董事 9/16 買進約 100 萬美元，股價六個月 -65%", "color": "#C9A227", "zh": "Karman Holdings（KRMN）為飛彈與太空系統製造承壓艙段、整流罩與推進系統外殼，2025 年掛牌。被忽視是因為上市時間短、流通股少、賣方覆蓋薄，產品又埋在別人的系統裡。拐點證據：董事 David Stinnett 9/16 以 36.99 到 37.52 美元買進 27,000 股，金額約 100.8 萬美元，股價靠近 52 週低點 33.99 美元。風險很大：六個月跌 65% 通常代表預期被大幅下修，單一董事買進也不構成群聚。判斷分水嶺是下一份季報的在手訂單。這是研究線索，不是投資建議。", "en": "Karman Holdings (KRMN) makes pressure sections, fairings and propulsion casings for missile and space systems and listed in 2025. It is neglected because of its short trading history, small float, thin coverage and products hidden inside others' systems. Director David Stinnett bought 27,000 shares on Sept. 16 at $36.99 to $37.52, about $1.0 million, with the stock near its 52-week low of $33.99. Risks: a 65% six-month drop usually means expectations were reset, and one director is not a cluster. The deciding evidence is backlog in the next quarterly report. This is a research lead, not investment advice.", "url": "https://www.everhint.com/insider-trading-signals-september-23-2026-evening-update-last-12-hours-pacific-time/", "stocks": [{"t": "KRMN", "n": "主角，董事百萬美元買進"}], "status": "RADAR · 下一個驗證點 下一份季報的在手訂單金額與年增率"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "Target Hospitality：資料中心工地宿舍新約約 2.5 億美元，私募股東賣 1,400 萬股", "color": "#C9A227", "zh": "Target Hospitality（TH）提供偏遠工地的模組化宿舍與餐飲後勤，原本主力是油氣田與政府收容案。被忽視是因為商業模式像旅館、財報像租賃、客戶像工程公司，缺乏乾淨同業。拐點證據：8 月拿下約 2.5 億美元營收的多年期合約，服務西德州一座超大規模雲端業者的資料中心工地，用閒置資產改裝、資本支出不到 1,500 萬美元，並上調 2026 營收與 EBITDA 財測。風險：9/8 私募股東以每股 18.50 美元出脫 1,400 萬股、套現約 2.59 億美元，且營收集中於少數合約。這是研究線索，不是投資建議。", "en": "Target Hospitality (TH) provides modular lodging and catering for remote work sites, historically oil and gas fields and government facilities. It is neglected because it looks like a hotel, reports like a lessor and has customers like a contractor. In August it won a multi-year contract worth about $250 million in revenue to house workers at a hyperscaler's data-center site in West Texas, using idle assets for under $15 million of capex, and raised 2026 revenue and EBITDA guidance. Risk: on Sept. 8 private-equity holders sold 14 million shares at $18.50, about $259 million, and revenue is concentrated. This is a research lead, not investment advice.", "url": "https://investors.targethospitality.com/news/news-details/2026/Target-Hospitality-Secures-Over-550-Million-Multi-Year-Contract-with-Top-Five-Hyperscaler-Supporting-a-Data-Center-Development/default.aspx", "stocks": [{"t": "TH", "n": "主角，資料中心工地宿舍新約"}], "status": "RADAR · 下一個驗證點 11 月 Q3 財報：新約入住率與續約"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "（回鍋，無新動態）OppFi：CEO 8 月多次以約 7.1–7.2 美元買進", "color": "#6DB56D", "zh": "OppFi（OPFI）服務信用較弱的消費者，市值約 1 億美元量級。CEO Todd Schwartz 8/19 到 8/28 多次以約 7.1 到 7.2 美元買進，每筆約 2.5 萬美元；Q2 淨利 1,480 萬美元，前年同期是虧損。但 Q2 每股盈餘 0.33 美元低於預期的 0.44 美元、營收指引也低於共識，且董事同期賣出 28,485 股，所以內部人訊號是分歧的。信用品質是這類公司的核心風險。這是研究線索，不是投資建議。", "en": "OppFi (OPFI) serves consumers with weaker credit and has a market value around $100 million. CEO Todd Schwartz bought repeatedly between Aug. 19 and Aug. 28 at about $7.1 to $7.2, roughly $25,000 each; Q2 net income was $14.8 million versus a loss a year earlier. But Q2 EPS of $0.33 missed the $0.44 estimate, guidance was below consensus, and a director sold 28,485 shares in the same period, so the insider signal is mixed. This is a research lead, not investment advice.", "url": "https://www.insidertrades.com/alerts/nyse-opfi-insider-buying-and-selling-2026-08-28/", "stocks": [{"t": "OPFI", "n": "CEO 多次小額買進，董事同期賣出"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "（回鍋，無新動態）Orion Group：CFO 3/6 以約 11.85 美元買進", "color": "#6DB56D", "zh": "Orion Group Holdings（ORN）做海事與混凝土工程（疏浚、橋梁、石油碼頭）。CFO 3/6 以約 11.85 美元買進 4,218 股，之後股價在 8 月下旬跌到約 9.27 美元；6 月底總訂單約 7.22 億美元，其中海事 5.54 億，高於去年底的 4.8 億。風險是 Q2 海事毛利下滑並出現營業虧損，且設備稼動率與客戶延期很難預測。11 月 Q3 財報看海事毛利是否回升。這是研究線索，不是投資建議。", "en": "Orion Group Holdings (ORN) does marine and concrete construction such as dredging, bridges and oil terminals. Its CFO bought 4,218 shares at about $11.85 on Mar. 6 and the stock slid to about $9.27 by late August; backlog at June-end was about $722 million, with marine at $554 million versus $480 million at year-end. Risks: Q2 marine margin fell into an operating loss and equipment utilization and customer delays are hard to predict. Watch November Q3 marine margin. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001402829/000140282926000034/orn-20260428xex99d1.htm", "stocks": [{"t": "ORN", "n": "CFO 買進，總訂單 7.22 億美元"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "判讀：內部人買進要看代碼 P、是否群聚、是否預先排定", "color": "#6DB56D", "zh": "Form 4 裡只有交易代碼 P（公開市場以個人現金買進）才是有意義的買進訊號；選擇權行使、股票獎酬、預先排定的 10b5-1 計畫都不算信念表態。其次要看是不是群聚（短時間內多位內部人買進）、金額相對於他本人的持股和薪資有多重。池內的 Auburn National（AUBN）有人只買 27 到 73 股，合計不到 5,500 美元，可能是定期再投資；Fluence 兩位董事共約 12 萬美元的買進則是小額但同價的群聚。注意，買進訊號只是研究線索，不是進場理由。", "en": "In a Form 4 only transaction code P (an open-market purchase with personal cash) is a meaningful buy signal; option exercises, stock awards and pre-scheduled 10b5-1 plans are not statements of conviction. Next, check whether purchases cluster in time and how large they are relative to the insider's holdings and pay. At Auburn National (AUBN) some insiders bought only 27 to 73 shares, under $5,500 in total, possibly routine reinvestment, while Fluence's two directors bought about $120,000 at the same price, a small but clustered signal. A buy is a research lead, not a reason to trade.", "url": "https://www.insiderscreener.com/en/sec-form-4", "stocks": [{"t": "AUBN", "n": "極小額買進，可能是定期再投資"}, {"t": "FLNC", "n": "兩位董事同價買進，金額小"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "（沿用 10/13）Salazar：最新申報 28 筆交易，偏向大型價值股", "color": "#B5654D", "zh": "眾議員 Maria Elvira Salazar（佛州 27 選區）最新申報於 10/7 公開，近 90 天累計 28 筆交易，其中 19 筆買進、9 筆賣出，涉及 15 檔標的，常見的有波克夏（BRK.B）、Chubb（CB）、Carrier（CARR）與默克（MRK）。這些多是保險、工業與製藥的大型價值股，申報的金額總區間約 15.4 萬到 73.5 萬美元，單筆都不大。這只是申報事實，不代表任何操作建議。", "en": "Rep. Maria Elvira Salazar (R-Fla., FL27) published her latest filing on Oct. 7, with 28 transactions over the past 90 days, 19 buys and 9 sells, across 15 tickers, most often Berkshire Hathaway (BRK.B), Chubb (CB), Carrier (CARR) and Merck (MRK). These are mostly large value names in insurance, industrials and pharma, and the reported amounts total roughly $154,000 to $735,000, each trade small. This is a disclosure, not a recommendation.", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035562.pdf", "stocks": [{"t": "BRK.B", "n": "波克夏，Salazar 近期申報常見標的"}, {"t": "CB", "n": "Chubb，保險股，常見標的"}, {"t": "MRK", "n": "默克，Moderna 同日走高的合作夥伴"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "判讀：配偶帳戶、區間金額與 45 天延遲，一筆交易能看出什麼", "color": "#B5654D", "zh": "STOCK Act 的申報常常是配偶或信託帳戶做的交易：追蹤站上有一筆眾議員 Ed Case 配偶買進 Apple 的紀錄，交易日 8/13、五天後揭露，金額區間只寫 1,000 到 15,000 美元。這種申報告訴你「某個家庭持有 Apple」，但不能告訴你這是議員本人的判斷，金額也不知道，揭露又晚了最多 45 天。所以這個頻道的定位是看「有人用真錢投票給哪個主題」，不是追單或猜內線。我今天沒有查到新的重大申報，所以第一張沿用。", "en": "STOCK Act filings are often trades in a spouse's or trust account: a tracker lists a purchase of Apple by the spouse of Rep. Ed Case, traded on Aug. 13 and disclosed five days later, in the $1,000 to $15,000 range. That tells you a household owns Apple, not that the member made the call; the amount is a wide range and disclosure can lag up to 45 days. So this channel treats filings as who is voting with real money on which theme, not as a signal to copy or a hint of inside information. I found no new major filing today, so the first card carries over.", "url": "https://www.disclosedcapitol.com/glossary/periodic-transaction-report", "stocks": [{"t": "AAPL", "n": "配偶帳戶買進，區間 1,000 到 15,000 美元"}]},
