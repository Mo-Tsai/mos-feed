/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

    background-repeat: repeat; background-size: 180px 180px;

  #root { position: relative; z-index: 1; }

  {"id": "earn_0", "channel": "財報速報", "tag": "Palo Alto 上修", "color": "#E8786A", "zh": "資安公司 Palo Alto Networks 週四上漲 6.4%，原因是上調 2027 會計年度的營收預期（路透）。在整體科技類股下跌 1.9%、半導體下跌 2.4% 的一天，這是少數逆勢走強的科技股；同屬資安的 CrowdStrike 也漲約 2.7%。這個反應顯示市場並非一概賣科技，而是在區分「資本支出受惠鏈」與「軟體與訂閱營收」。細節數字路透原文未列，本卡不補推測。", "en": "Cybersecurity firm Palo Alto Networks rose 6.4% on Thursday after raising its fiscal 2027 revenue outlook, Reuters reported. On a day when tech fell 1.9% and semiconductors 2.4%, it was one of the few tech names to rise; peer CrowdStrike gained about 2.7%. The reaction suggests the market is not selling all tech indiscriminately but separating the capex-driven chain from software and subscription revenue. Reuters did not list the detailed figures, so none are guessed here.", "url": "https://www.investing.com/news/stock-market-news/wall-street-ends-sharply-lower-asanthropics-debut-fails-to-revive-ai-fervor-5040108", "stocks": [{"t": "PANW", "n": "週四 +6.4%，上調 2027 年度營收預期"}, {"t": "CRWD", "n": "同為資安，約 +2.7%（盤面快照）"}]},
  {"id": "earn_1", "channel": "財報速報", "tag": "Walmart 零售訊號", "color": "#E8786A", "zh": "Walmart 公布第三季：營收年增 5.2% 到 1,888 億美元，高於預期的約 1,874 億；不含燃料的同店銷售成長 2.9%，與預期相符，高於上一季的 2.6%，但低於去年同期的 4.5%。全球電商成長 17%、美國電商成長 23%，美國實體店同店則下滑（財務長說法）。公司第三度上調全年展望，但幅度比分析師預期保守，路透稱年度銷售預測令投資人失望，股價週四跌 1.0%。", "en": "Walmart reported third-quarter revenue up 5.2% to $188.8 billion, above the roughly $187.4 billion expected; comparable sales excluding fuel rose 2.9%, in line with forecasts and above last quarter's 2.6% but below 4.5% a year earlier. Global e-commerce grew 17% and US e-commerce 23%, while US store comparable sales declined according to the CFO. It raised its full-year outlook for a third time, but by less than analysts hoped; Reuters said the annual sales forecast disappointed and the shares fell 1.0% on Thursday.", "url": "https://www.cnbc.com/2026/11/19/walmart-wmt-q3-2026-earnings.html", "stocks": [{"t": "WMT", "n": "第三季營收 1,888 億美元，股價 -1.0%"}, {"t": "XLP", "n": "民生消費 ETF，觀察防禦族群是否承接"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "Lowe's 與 TJX 兩極", "color": "#E8786A", "zh": "Lowe's 與 TJX 在 11/18 盤前公布財報，市場反應相反：Lowe's 調整後每股盈餘 3.10 美元（預期 2.89）、營收 228 億美元（預期 224 億）、同店銷售 +1.8%（預期 +0.1%），但全年每股盈餘預測略低於預期、毛利率年減，盤前約 -4.3%，Newsquawk 的整理指這一季受益於關稅退款；TJX 每股盈餘 1.34 美元與預期持平、營收 160 億美元（預期 158 億），執行長預期假期銷售動能加速，盤前約 +5.3%。以上是盤前數字，不是收盤價，我沒有查到當天收盤漲跌。Newsquawk 評論提到 Target 同日也下跌，但我沒有查到它的數字。這組對照顯示：財報『優於預期』不夠，展望與毛利率才決定股價。", "en": "Lowe's and TJX reported before the open on Nov. 18 and the market read them in opposite ways. Lowe's adjusted EPS was $3.10 (expected $2.89), revenue $22.8 billion (expected $22.4 billion) and same-store sales +1.8% (expected +0.1%), but full-year EPS guidance was slightly below expectations and gross margin fell year on year; the stock was about -4.3% premarket, and Newsquawk's summary said the quarter was helped by tariff refunds. TJX's EPS of $1.34 matched expectations, revenue was $16.0 billion (expected $15.8 billion) and the CEO expects holiday sales momentum to accelerate; it was about +5.3% premarket. These are premarket figures, not closing prices, and I did not find the day's close. Newsquawk commentary said Target also fell that day, but I found no figures. The contrast shows a beat is not enough; guidance and gross margin decide the move.", "url": "https://www.newsquawk.com/headlines/newsquawk-daily-us-earnings-estimates-18th-november-2026---low-tgt-tjx-panw", "stocks": [{"t": "LOW", "n": "財報優於預期但盤前約 -4.3%，因展望與毛利率"}, {"t": "TJX", "n": "營收優於預期、盤前約 +5.3%"}, {"t": "TGT", "n": "同日財報，據評論股價下跌（數字未查到）"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "Fed 官員：還要升息", "color": "#7C6AF7", "zh": "聖路易聯儲總裁 Musalem（今年不是 FOMC 投票委員）在 11 月中旬表示，要在 2027 年春天前把通膨拉回 2% 並維持時效，可能需要多次升息，最多到 4 次。他估算實質政策利率應落在 2% 到 2.5%，目前約低了 1 個百分點，逐次會議推算就是 2026 年 12 月、2027 年 1 月、3 月與 4 月。聯邦基金利率目前在 3.75% 到 4%，下次決策在 12 月 9 日；他也承認有「不太可能但仍可能」的情境是不需再升息。這是單一官員的說法，不是 FOMC 共識。我查到的 12 月升息機率從 85% 到 95% 以上都有，來源與日期不一，請以 CME FedWatch 為準。", "en": "St. Louis Fed President Alberto Musalem, not an FOMC voter this year, said in mid-November that several rate hikes, as many as four, may be needed before spring 2027 to bring inflation back to 2% in a timely way. He puts the real policy rate at about one percentage point below the 2% to 2.5% range he wants, which implies hikes in December 2026 and in January, March and April 2027. The fed funds rate is now 3.75% to 4% and the next decision is Dec. 9. He conceded an unlikely but still plausible scenario in which no further hikes are needed. This is one official's view, not an FOMC consensus. The December-hike odds I found range from 85% to above 95% depending on source and date, so use CME FedWatch.", "url": "https://www.ibtimes.com/fed-rate-hikes-needed-before-spring-2027-3809858", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，對升息路徑最敏感"}, {"t": "KRE", "n": "區域銀行 ETF，利率與信用的觀察對象"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "殖利率回落", "color": "#7C6AF7", "zh": "10 年期美債殖利率一天內從 5.04% 回落到 4.93%，是股市賣壓下的典型避險反應：資金離開股票、買進公債，價格上漲、殖利率下降。這不等於利率壓力消失；殖利率仍在 5% 附近，對高估值成長股與負債偏高的公司仍是負擔，而且聯儲官員仍在談升息。12 月升息機率請以 CME FedWatch 為準。", "en": "The 10-year Treasury yield slid to 4.93% from 5.04% in a single session, a classic haven reaction to a stock selloff: money leaves equities for bonds, pushing bond prices up and yields down. That does not mean rate pressure is gone; yields remain near 5%, still a burden for richly valued growth stocks and heavily indebted companies, and Fed officials are still talking about hikes. Use CME FedWatch for the December-hike odds.", "url": "https://www.bnnbloomberg.ca/markets/2026/11/20/tech-stocks-pull-us-markets-lower-early-with-anthropics-historic-debut-doing-little-to-slow-rout/", "stocks": [{"t": "IEF", "n": "7-10 年期公債 ETF，殖利率下降時價格上漲"}, {"t": "SHY", "n": "短天期公債 ETF，避險資金停泊處"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "消費者信心回升", "color": "#7C6AF7", "zh": "密西根大學消費者信心指數週五公布，較上月大幅回升，也略高於經濟學家預期（報導未給指數數值）；汽油價格走低是主因。不過信心仍低於今年 2 月、伊朗戰事爆發之前的水準。信心回升與股市重挫同日出現，提醒市場的賣壓來自 AI 估值與政策風險，而不是消費端已經轉壞，但油價仍在每桶 92 美元附近，是下一個要看的變數。", "en": "The University of Michigan's consumer sentiment index rose sharply from last month and came in slightly above economists' expectations on Friday (the report gave no index level), helped by easing gas prices. Sentiment is still below February levels, before the Iran war. The jump on the same day stocks plunged suggests the selling reflects AI valuations and policy risk rather than a consumer slump, though oil near $92 a barrel remains the next variable to watch.", "url": "https://www.bnnbloomberg.ca/markets/2026/11/20/tech-stocks-pull-us-markets-lower-early-with-anthropics-historic-debut-doing-little-to-slow-rout/", "stocks": [{"t": "XLY", "n": "非必需消費 ETF，信心與油價的直接受惠者"}, {"t": "XRT", "n": "零售 ETF，假期消費前的觀察指標"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "AI 硬體鏈崩盤", "color": "#4EABA4", "zh": "週五的賣壓集中在 AI 硬體與基礎設施：晶片之外，康寧（光纖與光學材料）-10.9%、Bloom Energy（燃料電池供電，常被視為資料中心電力題材）-15.3%。這代表市場不只在重新定價晶片，而是在重新定價整條「AI 建設」供應鏈。若資本支出預期下修，受影響的會是設備、材料與電力供應商，而不只是 Nvidia。", "en": "Friday's selling was concentrated in AI hardware and infrastructure: beyond chips, Corning (fiber and optical materials) fell 10.9% and Bloom Energy (fuel-cell power, often treated as a data-center power theme) fell 15.3%. The market is repricing the whole AI build-out supply chain, not just chips. If capital-spending expectations are cut, equipment, materials and power suppliers would be hit alongside Nvidia.", "url": "https://www.bnnbloomberg.ca/markets/2026/11/20/tech-stocks-pull-us-markets-lower-early-with-anthropics-historic-debut-doing-little-to-slow-rout/", "stocks": [{"t": "GLW", "n": "康寧 -10.9%，光纖與光學材料"}, {"t": "BE", "n": "Bloom Energy -15.3%，資料中心供電題材"}, {"t": "AVGO", "n": "博通 -12.1%，網路與客製晶片"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "防禦與房建逆勢", "color": "#4EABA4", "zh": "在全面下跌中，少數逆勢上漲的是與 AI 無關的板塊：General Mills 上漲 3.7%、房屋建商 Lennar 上漲 1%。包裝食品屬防禦型消費股，在大盤恐慌時常被當作避風港；房建股走強，則可能反映殖利率回落對房貸利率的預期。報導沒有解釋這兩檔個別上漲的原因，上面是我的推測，不是來源說法。", "en": "In a broad decline, the few gainers were unrelated to AI: General Mills rose 3.7% and homebuilder Lennar rose 1%. Packaged food is a defensive consumer group that often serves as a haven in panics, and homebuilders may reflect the drop in yields easing mortgage-rate expectations. The report did not explain these two moves; the explanations here are my inference, not the source's.", "url": "https://www.bnnbloomberg.ca/markets/2026/11/20/tech-stocks-pull-us-markets-lower-early-with-anthropics-historic-debut-doing-little-to-slow-rout/", "stocks": [{"t": "GIS", "n": "General Mills +3.7%，防禦型包裝食品"}, {"t": "LEN", "n": "Lennar +1%，住宅建商"}, {"t": "XLP", "n": "必需消費 ETF，防禦板塊代表"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "Nvidia：好財報壞治理", "color": "#4EABA4", "zh": "Nvidia 這一週是「好財報、壞治理」。11/17 公布第三季營收 1,158 億美元、年增 103%，第四季預測 1,300 億美元上下 3%，但毛利率預期降到 71% 至 72%。更早的 11/12，黃仁勳辭去執行長，財務長 Kress 代理，董事會表示不打算讓他復任。11/17 華爾街日報報導 SEC 展開民事調查、檢視 Nvidia 是否誤導投資人，公司與 SEC 都未證實，加州檢察長也在評估是否行動。週五 Nvidia 跌約 13.8%；CNBC 說賣壓在一則「SEC 調查會計」的標題後加劇，但我查到的調查報導談的是「揭露」而非會計，兩種說法我無法核實。對整條 AI 供應鏈來說，領頭羊的治理不確定性，是在估值之外又多了一層風險。", "en": "Nvidia's week was good earnings, bad governance. On Nov. 17 it reported third-quarter revenue of $115.8 billion, up 103%, and guided fourth-quarter revenue to $130 billion plus or minus 3%, but gross margin is expected to fall to 71% to 72%. Earlier, on Nov. 12, Jensen Huang resigned as CEO; CFO Colette Kress is running the company and the board said it does not intend to reinstate him. On Nov. 17 the Wall Street Journal reported the SEC opened a civil probe into whether Nvidia misled investors; neither the company nor the SEC has confirmed it, and California's attorney general is weighing action. Nvidia fell about 13.8% on Friday; CNBC said selling intensified after a headline about an SEC accounting probe, but the probe reports I found concern disclosures rather than accounting, and I cannot verify either version. For the whole AI supply chain, governance uncertainty at the leader adds a risk layer on top of valuation.", "url": "https://www.investmentnews.com/equities/embattled-nvidia-faces-sec-probe-as-california-attorney-general-mulls-action/269054", "stocks": [{"t": "NVDA", "n": "週五約 -13.8%，單週據 CNBC 約 -23%"}, {"t": "SMH", "n": "半導體 ETF，AI 供應鏈的整體風險"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "判讀：小型股的賣壓來源", "color": "#5B8ED6", "zh": "判讀卡：我沒有查到羅素 2000 週五的收盤，所以不寫數字。可以確定的是，小型股的風險來源與大型 AI 股不同：它們對油價與利率更敏感，而週五布蘭特仍在 92.57 美元、10 年期殖利率仍在 4.93%。所以大型股崩跌之日，小型股不一定跟著跌得一樣兇，也不能因此當成避風港；要看的是個別公司的負債與利息負擔。", "en": "Explainer: I could not find the Russell 2000's Friday close, so no figure is given. What can be said is that small caps carry different risks from big AI stocks: they are more sensitive to oil and interest rates, and on Friday Brent was still $92.57 and the 10-year yield still 4.93%. On a day big caps crash, small caps need not fall equally hard, but that does not make them a haven; debt and interest burdens at the company level are what matter.", "url": "https://www.bnnbloomberg.ca/markets/2026/11/20/tech-stocks-pull-us-markets-lower-early-with-anthropics-historic-debut-doing-little-to-slow-rout/", "stocks": [{"t": "VTWO", "n": "羅素 2000 ETF，當日收盤未查到"}, {"t": "IJT", "n": "標普小型成長 ETF，對利率更敏感"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "浮動利率債務", "color": "#5B8ED6", "zh": "高盛的統計是：羅素 2000 成分公司約 32% 持有浮動利率債務，標普 500 只有約 6%。這代表升息對小型股的融資成本影響來得又快又直接，而且高盛仍預期 2027 上半年還有兩次升息。這是小型股在這一輪利率環境下和大型股最大的結構差異之一，也解釋了為什麼利率消息出來時，小型股的反應常比指數更劇烈。", "en": "Goldman Sachs estimates that about 32% of Russell 2000 companies carry floating-rate debt against about 6% in the S&P 500. A hike therefore feeds into small-cap financing costs quickly and directly, and Goldman still expects two more hikes by the first half of 2027. This is one of the main structural differences between small and large caps in the current rate regime, and it helps explain why small caps often react more sharply to rate news than the broad index.", "url": "https://rallies.ai/news/iwm-slips-as-treasury-yields-stay-elevated-weighing-on-small-cap-valuations", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，利率敏感度最高的代表"}, {"t": "IJR", "n": "標普小型股 600 ETF，獲利門檻較高的對照"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "距高點約一成", "color": "#5B8ED6", "zh": "羅素 2000 在 11 月 6 日收約 2,756 點，前一天曾單日重挫 4.45%，當天反彈 0.97%；IWM 收約 272.5 美元。8 月中旬的紀錄高點在 3,045 到 3,053 點之間（兩個來源數字略有差異），所以 11 月初已比高點低約一成。CME 11/18 的整理則說，E-mini 羅素 2000 期貨盤中先創循環新低、隨後反彈，最高 2,744.50（+1.23%），在 Fed 會議紀要後領先主要指數，原因之一是資金自超大型科技股輪出。我沒有查到 11/19 與 11/20 羅素 2000 的收盤，所以不判斷週五小型股是否也跟著重挫。", "en": "The Russell 2000 closed near 2,756 on Nov. 6 after a 4.45% one-day plunge the day before and a 0.97% rebound that day; IWM closed near $272.5. The mid-August record sits between 3,045 and 3,053 (two sources differ slightly), so by early November the index was already about 10% below its high. CME's Nov. 18 note said E-mini Russell 2000 futures first hit a cycle low intraday, then rebounded to a high of 2,744.50 (+1.23%) and led the major indices after the Fed minutes, partly on rotation out of mega-cap tech. I did not find the Russell 2000 closes for Nov. 19 and 20, so I do not judge whether small caps also plunged on Friday.", "url": "https://www.cmegroup.com/videos/2026/11/18/e-mini-russell-2000-futures-rebound-from-cycle-low-after-fed-min.html", "stocks": [{"t": "IWM", "n": "11 月 6 日收約 272.5 美元"}, {"t": "VTWO", "n": "羅素 2000 的另一檔 ETF，費用率較低"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "判讀：池子差異", "color": "#5B8ED6", "zh": "小型股判讀知識：同樣叫「小型股」，不同指數的池子差很多。羅素 2000 涵蓋範圍大、包含不少尚未獲利的公司，標普小型股 600 要求過去四季合計獲利為正，所以後者通常品質較高、波動較小。看到「小型股大漲或大跌」時，先確認講的是哪個指數，再看它是由利率、獲利還是少數權值股帶動，否則容易把不同池子的數字混著比。", "en": "A small-cap reading tip: not all small-cap indexes are the same pool. The Russell 2000 is broad and includes many companies that are not yet profitable, while the S&P SmallCap 600 requires positive trailing earnings, so the latter tends to be higher quality and less volatile. When you see small caps surge or sink, first check which index is meant, then whether rates, earnings or a handful of heavyweights drove it; otherwise numbers from different pools get compared by mistake.", "url": "https://rallies.ai/news/iwm-slips-as-treasury-yields-stay-elevated-weighing-on-small-cap-valuations", "stocks": [{"t": "VB", "n": "CRSP 小型股 ETF，另一種小型股池子"}, {"t": "IJR", "n": "標普小型股 600，要求獲利為正"}, {"t": "IJT", "n": "標普小型成長股，風格細分的對照"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "FMC 低價股", "color": "#5B8ED6", "zh": "農化公司 FMC 週四約跌 8.3%、收約 4.29 美元（盤面快照）。這家公司 10 月 15 日因大幅下調展望盤中暴跌約 32%；較早的資料也顯示其現金約 5 億美元、負債約 45 億美元（2025 年底前後的整理，數字可能已變動）。股價落到個位數後，小型股的流動性與融資壓力問題會被放大。我沒有查到 11 月 19 日這一天的個別消息，請把它當作波動案例，不是研究結論。", "en": "Agricultural chemicals company FMC fell about 8.3% on Thursday to roughly $4.29, per a market snapshot. It plunged about 32% intraday on October 15 after sharply cutting its outlook, and earlier data showed about $500 million of cash against roughly $4.5 billion of debt (a figure from around late 2025 that may have changed). With the price in single digits, small-cap liquidity and financing pressure are magnified. I found no company-specific news for November 19, so treat this as a volatility example, not a research conclusion.", "url": "https://www.fool.com/investing/2026/10/15/why-fmc-corporation-stock-just-crashed/", "stocks": [{"t": "FMC", "n": "約 -8.3%，約 4.29 美元"}, {"t": "CTVA", "n": "農化同業，供對照"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "Csquare 三人買進", "color": "#C9A227", "zh": "Csquare（CSQR，NYSE）近期出現內部人叢集買進。InsiderPrint 與 Massive 的整理顯示，到 11/15 的 12 個月內有 3 名內部人在公開市場買進合計約 45.4 萬美元、沒有公開市場賣出；HoldingsChannel 的標題寫買家是執行長、財務長與一名董事，執行長 Spencer Mullee 於 11/11 買進 13,573 股、每股 18.20 美元。為什麼被忽視：它是市值不大的個股，分析師覆蓋家數我沒有查到。什麼正在改變：管理層與董事同時用自己的錢買；報價快照約 16.87 至 20.31 美元，52 週區間 12.30 至 25.00 美元，平均目標價約 27.90 美元（investing.com 快照）。反方：WallStreetZen 與 Arkolith 顯示沒有買進，可能是資料落後；我也沒有查證公司業務與財務，目前只算單一訊號。這是研究線索，不是投資建議。", "en": "Csquare (CSQR, NYSE) has seen a cluster of insider buying. InsiderPrint and Massive show 3 insiders made open-market purchases totaling about $454,000 in the 12 months to Nov. 15, with no open-market sales; HoldingsChannel's headline says the buyers were the CEO, CFO and a director, and CEO Spencer Mullee bought 13,573 shares at $18.20 on Nov. 11. Why neglected: a modestly sized stock, and I did not find the analyst count. What is changing: management and a director are buying with their own money; quotes range from about $16.87 to $20.31, the 52-week range is $12.30 to $25.00 and the average target is about $27.90 (investing.com snapshots). Counterpoint: WallStreetZen and Arkolith show no buying, possibly stale data, and I did not verify the business or financials, so this is a single signal for now. This is a research lead, not investment advice.", "url": "https://buttondown.com/insiderprint/archive/u1f514-cluster-buy-alert-csqr-3-insiders-bought/", "stocks": [{"t": "CSQR", "n": "3 人買進約 45.4 萬美元，CEO 11/11 以 18.20 買 13,573 股"}], "status": "RADAR · 下一個驗證點 讀 Form 4 原件與下次財報"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "Keel 董事連買", "color": "#C9A227", "zh": "Keel Infrastructure（KEEL，那斯達克）是一檔股價低於 2 美元的小型股，我沒有查證它的主營業務，需先讀公司簡介。內部人買進很連續：Massive 顯示到 11/17 的 12 個月內有 4 名內部人公開市場買進共約 63 萬美元、沒有賣出；其中我能對上 Form 4 的有董事 Hofmeister 11/9 買 15,000 股（每股 1.89 美元）、董事 Freedman 11/10 買 40,000 股（每股 1.9025 美元），合計約 10.4 萬美元。InsiderPrint 稱 3 人合計約 15.5 萬美元，第三位我沒找到。8 月執行長買進時價格約 3.33 美元，現在約 1.75 美元，自 4 月以來區間 1.65 至 6.66 美元。反方：股價已大跌、基本面未知，內部人買進不保證反彈。這是研究線索，不是投資建議。", "en": "Keel Infrastructure (KEEL, Nasdaq) is a small cap trading below $2; I did not verify its main business, so read the company profile first. Insider buying is persistent: Massive shows 4 insiders made open-market purchases of about $630,000 in the 12 months to Nov. 17 with no sales. The ones I could match to Form 4s are director Hofmeister buying 15,000 shares at $1.89 on Nov. 9 and director Freedman buying 40,000 shares at $1.9025 on Nov. 10, together about $104,000. InsiderPrint says 3 insiders bought about $155,000; I could not find the third. The CEO bought at about $3.33 in August versus about $1.75 now, and the range since April is $1.65 to $6.66. Counterpoint: the stock has already fallen hard, fundamentals are unknown and insider buying does not guarantee a rebound. This is a research lead, not investment advice.", "url": "https://buttondown.com/insiderprint/archive/u1f514-cluster-buy-alert-keel-3-insiders-bought/", "stocks": [{"t": "KEEL", "n": "董事 11/9、11/10 買進約 10.4 萬美元，股價約 1.75"}], "status": "RADAR · 下一個驗證點 查第三位買家與公司業務簡介"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "USA Rare Earth 董事長", "color": "#C9A227", "zh": "USA Rare Earth（USAR）執行董事長 Michael Blitzer 的 Form 4 顯示，他 11/17 以約 6.64 美元買進 250,000 股（透過 Tristram Ave LLC）、以約 6.72 美元直接買進 100,000 股，11/18 再以約 6.64 美元買進 100,000 股，共 450,000 股、約 300 萬美元，交易代碼為 P（公開市場買進）。公司近期宣布開始向美國買家商業規模出貨巴西 Serra Verde 的重稀土混合碳酸鹽，並已公布第三季財報；股價 11/19 上漲 9.68% 到 7.20 美元，沒有公司公告對應。注意：稀土是熱門題材，這檔談不上「雙重忽視」，我沒有查到分析師覆蓋與媒體聲量，所以放在雷達只因為內部人買進加上出貨開始兩個訊號。風險：題材股波動大、尚在商業化初期。這是研究線索，不是投資建議。", "en": "A Form 4 shows USA Rare Earth (USAR) executive chairman Michael Blitzer bought 250,000 shares at about $6.64 on Nov. 17 through Tristram Ave LLC, 100,000 shares directly at about $6.72 the same day, and another 100,000 at about $6.64 on Nov. 18: 450,000 shares, roughly $3.0 million, coded P (open-market purchase). The company recently announced the start of commercial-scale shipments of heavy rare earth mixed carbonate from Brazil's Serra Verde to a US buyer and has reported third-quarter results; the stock rose 9.68% to $7.20 on Nov. 19 with no company news attached. Note that rare earths is a hot theme, so this is hardly doubly neglected, and I did not find analyst coverage or media volume; it sits on the radar only because of two signals, insider buying and the start of shipments. Risk: thematic stocks are volatile and the business is early in commercialization. This is a research lead, not investment advice.", "url": "https://finviz.com/news/419598/usa-rare-earth-announces-start-of-commercial-scale-shipments-and-sale-of-heavy-rare-earth-mrec-from-serra-verde-to-us-siie-llc", "stocks": [{"t": "USAR", "n": "董事長 11/17-11/18 買進 45 萬股，約 300 萬美元"}], "status": "RADAR · 下一個驗證點 出貨規模與下次財報"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "Six Flags 內部人加碼", "color": "#C9A227", "zh": "Six Flags（FUN，主題樂園）已在雷達池，這是新動態。InsiderPrint 與 MarketBeat 顯示，11/6 到 11/10 有 3 名內部人合計買進約 1,510 萬美元、均價約 10.29 美元：董事 Rehan Jaffer 管理的基金買 145 萬股、約 1,493 萬美元，持股升到約 635 萬股；董事長 Haddrill 約 9.1 萬、法務長 Bennett 約 4.7 萬。時間點在第三季財報之後，該季淨虧損 3.661 億美元，主要是非現金減損；股價 11/13 約 11.56 美元（+3.3%）。反方：減損代表資產價值被下調，債務與遊客量我沒有查到新資料，也沒有新的基本面證據，所以驗證點是下次財報的自由現金流與負債。這是研究線索，不是投資建議。", "en": "Six Flags (FUN, theme parks) is already in the radar pool and this is new activity. InsiderPrint and MarketBeat show 3 insiders bought about $15.1 million between Nov. 6 and Nov. 10 at an average of about $10.29: funds managed by director Rehan Jaffer bought 1.45 million shares, about $14.93 million, lifting holdings to about 6.35 million shares; Chairman Haddrill bought about $91,000 and the general counsel about $47,000. The timing follows third-quarter results, a net loss of $366.1 million driven largely by non-cash impairments; the stock was about $11.56 (+3.3%) on Nov. 13. Counterpoint: impairments mean asset values were marked down, I found no new data on debt or attendance, and there is no new fundamental evidence, so the checkpoint is free cash flow and debt in the next report. This is a research lead, not investment advice.", "url": "https://www.marketbeat.com/articles/six-flags-lost-366-million-in-q3its-insiders-just-went-shopping/", "stocks": [{"t": "FUN", "n": "3 人 11/6-11/10 買進約 1,510 萬美元，均價約 10.29"}], "status": "RADAR · 下一個驗證點 下次財報的自由現金流與負債"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "EquipmentShare 內部人", "color": "#C9A227", "zh": "EquipmentShare（EQPT）是租賃建設設備並提供科技平台的公司，2026 年掛牌。InsiderPrint 11 月 19 日列出三位內部人在 11 月 11 日到 17 日買進合計約 130 萬美元、均價 14.46 美元，包括執行長 Schlacks 約 56.3 萬、董事 Hill 約 55.4 萬、總裁約 14.5 萬。這個均價低於它 9 月初資料中的 52 週低點 15.71 美元；執行長自 8 月底起也多次買進。反方：主要股東 Chheda 8 月賣出約 220 萬股、約 4,540 萬美元，分析師共識僅「持有」。這是研究線索，不是投資建議。", "en": "EquipmentShare (EQPT) rents construction equipment alongside a technology platform and listed in 2026. InsiderPrint on November 19 listed three insiders buying about $1.3 million between November 11 and 17 at an average $14.46, including CEO Schlacks (about $563K), director Hill (about $554K) and the president (about $145K). That average is below the 52-week low of $15.71 shown in early-September data, and the CEO had also bought repeatedly since late August. Counterpoint: major holder Chheda sold about 2.2 million shares, roughly $45.4 million, in August, and the analyst consensus is only Hold. This is a research lead, not investment advice.", "url": "https://buttondown.com/insiderprint/archive/u1f514-3-new-cluster-buys-eqpt-rmix-ofrm/", "stocks": [{"t": "EQPT", "n": "11/11 至 11/17 內部人買進約 130 萬美元，均價 14.46"}], "status": "RADAR · 下一個驗證點 後續 Form 4 與下次財報日"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "Babcock & Wilcox 再買進", "color": "#C9A227", "zh": "Babcock & Wilcox（BW）是鍋爐與熱能、環保設備業者，已在雷達池：池內紀錄有 8 月與 Siemens Energy 簽下 20 組蒸汽渦輪發電機的製造合約，以及執行長、董事當時的買進。InsiderPrint 11/14 又把它列為當期最大的叢集買進：11/11 到 11/13 之間，持股逾 10% 的大股東與多名董事、主管合計買進約 74.9 萬美元，買家名單中包括 Brc Group Holdings。新增的是第二輪內部人買進；我沒有讀 Form 4 原件確認買進身分與價格，也沒查到最新分析師覆蓋數據。這是研究線索，不是投資建議。", "en": "Babcock & Wilcox (BW), a maker of boilers and thermal and environmental equipment, is already in the radar pool, whose notes record an August contract with Siemens Energy to build 20 steam turbine generators and insider buying at that time. InsiderPrint's Nov. 14 list now shows it as the largest cluster buy: between Nov. 11 and Nov. 13 a 10%-plus owner and several directors and officers bought about $749,000 combined, with Brc Group Holdings among the buyers. What is new is a second round of insider buying; I did not read the Form 4 originals for buyer identity and price, and found no current analyst-coverage data. This is a research lead, not investment advice.", "url": "https://buttondown.com/insiderprint/archive/u1f514-4-new-cluster-buys-hpp-bw-kgs-alt/", "stocks": [{"t": "BW", "n": "10% 大股東與董事、主管 11/11-11/13 合計約 74.9 萬美元"}], "status": "RADAR · 下一個驗證點 讀 Form 4 原件確認買進身分與價格"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "HubSpot 執行長大買", "color": "#6DB56D", "zh": "HubSpot（HUBS）執行長 Brian Halligan 於 11/13 在公開市場買進 22,985 股，價值約 499.8 萬美元（隱含均價約 217 美元），是 Quiver 11/16 整理當日名單上最大的一筆。這是軟體股在 AI 取代疑慮下的內部人表態：一般要看是否為公開市場買進，而不是獎酬或選擇權行使；Quiver 的整理沒有細分，建議讀 Form 4 原件。", "en": "HubSpot (HUBS) CEO Brian Halligan bought 22,985 shares in the open market on Nov. 13, worth about $4.998 million (an implied average near $217), the largest purchase on Quiver's Nov. 16 list. It reads as an insider stance on a software stock under AI-displacement worries; the thing to check is that it is an open-market purchase rather than compensation or option exercise, which Quiver's summary does not break out, so read the Form 4.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases%3A+November+16%2C+2026", "stocks": [{"t": "HUBS", "n": "CEO Halligan 11/13 買進 22,985 股、約 499.8 萬美元"}]},
  {"id": "insider_1", "channel": "內部人動向", "tag": "三位執行長出手", "color": "#6DB56D", "zh": "Quiver 11/17 的名單顯示三筆值得看的買進：Kura Oncology 執行長 Troy Wilson 於 11/13 買進 98,881 股（約 75.4 萬美元）；Brandywine Realty 執行長 Michael Mazzei 於 11/16 買進 228,463 股（約 74.9 萬美元）；Skydance 的 Gerald Cardinale 於 11/13 買進 66,400 股（約 50.1 萬美元）。三家分屬生技、辦公室 REIT 與媒體，是不同產業的獨立動作，不是同一個題材。金額都在 50 到 75 萬美元之間，對個別高階主管來說屬中型押注。", "en": "Quiver's Nov. 17 list showed three purchases worth a look: Kura Oncology CEO Troy Wilson bought 98,881 shares on Nov. 13 (about $754,000); Brandywine Realty CEO Michael Mazzei bought 228,463 shares on Nov. 16 (about $749,000); and Skydance's Gerald Cardinale bought 66,400 shares on Nov. 13 (about $501,000). They span biotech, an office REIT and media, independent actions rather than one theme. At $500,000 to $750,000 each, they are mid-sized bets for individual executives.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases%3A+November+17%2C+2026", "stocks": [{"t": "KURA", "n": "CEO 11/13 買進 98,881 股、約 75.4 萬美元"}, {"t": "BDN", "n": "CEO 11/16 買進 228,463 股、約 74.9 萬美元"}, {"t": "SKYD", "n": "Cardinale 11/13 買進 66,400 股、約 50.1 萬美元"}]},
  {"id": "insider_2", "channel": "內部人動向", "tag": "判讀：資料站會打架", "color": "#6DB56D", "zh": "判讀卡：同一檔股票，不同資料站對內部人買進的說法可以差很多，今天就有兩個例子。Csquare（CSQR）：Massive 顯示 12 個月內 3 人公開市場買進約 45.4 萬美元，WallStreetZen 與 Arkolith 卻顯示沒有買進，可能是資料落後。Keel（KEEL）：InsiderPrint 稱 3 人買進約 15.5 萬美元，我能對上 Form 4 的只有兩位董事共約 10.4 萬美元。做法是把叢集買進名單當線索，再用 SEC EDGAR 的 Form 4 原件核對交易代碼是 P（公開市場買進，而不是獎酬或選擇權行使）、金額與日期，之後才決定值不值得花時間研究。", "en": "Interpretation card: for the same stock, insider-buying data sites can disagree widely, and today has two examples. Csquare (CSQR): Massive shows 3 insiders made open-market purchases of about $454,000 in 12 months, while WallStreetZen and Arkolith show no buying, possibly stale data. Keel (KEEL): InsiderPrint says 3 insiders bought about $155,000, but the Form 4s I could match show only two directors totaling about $104,000. The practice is to treat cluster-buy lists as leads, then verify on SEC EDGAR that the Form 4 transaction code is P (an open-market purchase, not compensation or an option exercise), plus amounts and dates, before deciding whether the stock deserves research time.", "url": "https://buttondown.com/insiderprint/archive/u1f514-cluster-buy-alert-keel-3-insiders-bought/", "stocks": [{"t": "CSQR", "n": "各資料站對內部人買進的紀錄不一致"}, {"t": "KEEL", "n": "稱 3 人約 15.5 萬美元，能對上 Form 4 的約 10.4 萬"}]},
  {"id": "capitol_0", "channel": "政要持股", "tag": "Nvidia：一買一賣", "color": "#B5654D", "zh": "本期申報裡有兩筆 Nvidia 交易值得並排看：眾議員 Maria Elvira Salazar（R-FL）11/5 申報，揭露她 10/23 買進 Nvidia；Benzinga 標題寫的區間與內文表格不同（$4,004–$60,000 對 $1,001–$15,000），金額以官方申報為準。另一邊，眾議員 Daniel Meuser（R-PA）申報賣出最多 1.5 萬美元的 Nvidia，且由配偶帳戶執行。這是兩名議員在不同時間點的小額交易，兩者都發生在週五 Nvidia 下跌 13.8% 之前。", "en": "Two Nvidia filings in this period are worth reading side by side: Rep. Maria Elvira Salazar (R-FL) filed on Nov. 5 disclosing an Oct. 23 purchase of Nvidia; Benzinga's headline range and its body table disagree ($4,004-$60,000 versus $1,001-$15,000), so rely on the official filing. On the other side, Rep. Daniel Meuser (R-PA) filed a sale of up to $15,000 of Nvidia, executed by a spouse's account. Both are small trades by two members at different times, and both predate Friday's 13.8% Nvidia drop.", "url": "https://www.benzinga.com/node/62982002", "stocks": [{"t": "NVDA", "n": "Salazar 10/23 買進、Meuser 申報賣出（配偶帳戶）"}]},
