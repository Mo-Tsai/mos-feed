<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;

  [data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;

  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;

  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }

  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }

  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }
  .tab-nav button { background: none; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: Georgia, serif; transition: all 0.3s ease; padding: 0; line-height: 1.2; }
  .sub-pill { background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 0; transition: all 0.2s ease; border-bottom: 1px solid transparent; }
  .swipe-area { position: relative; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .card-slide { position: absolute; inset: 0; padding: 16px 32px 80px; display: flex; flex-direction: column; justify-content: flex-start; transition: transform 0.3s ease, opacity 0.3s ease; will-change: transform, opacity; overflow-y: auto; }
  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .source-link { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }
  .source-link:hover { color: var(--text-secondary); border-color: var(--text-secondary); }
  .end-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; height: 100%; }

  .word-popup-trans { font-family: system-ui, -apple-system, 'PingFang TC', sans-serif; font-size: 14px; color: var(--text-secondary); line-height: 1.6; font-weight: 300; }

  .az-input { width:100%; background:var(--bg); border:1px solid var(--divider); color:var(--text); padding:7px 10px; font-family:'Courier New',monospace; font-size:11px; outline:none; -webkit-appearance:none; appearance:none; border-radius:0; }

  .nav-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; gap:6px; padding:10px 16px 14px; background:var(--bg); border-top:1px solid var(--divider); z-index:50; }
  .nav-btn { background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:16px; cursor:pointer; padding:10px 18px; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; line-height:1; }
  .nav-btn-icon { padding:10px 14px; font-size:13px; }
  .nav-btn-icon.playing { border-color:var(--text); color:var(--text); }

  .nav-btn-lang:hover { color:var(--text-secondary); }
  @media (max-width: 420px) { .nav-btn { padding:10px 11px; } .nav-btn-icon { padding:10px 10px; } .nav-btn-lang { padding:10px 8px; min-width:34px; } }
  .nav-btn:hover { border-color:var(--text-secondary); color:var(--text); }

<body data-theme="light">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "全面收黑", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普 500 ETF，昨日標普跌 0.48% 收 7,636.36 點"}, {"t": "DIA", "n": "道瓊 ETF，昨日道瓊跌 0.77% 收 52,380.66 點、失守 52,400"}, {"t": "QQQ", "n": "那斯達克 100 ETF，那斯達克綜合指數跌 0.64% 收 26,253.34 點"}, {"t": "IWM", "n": "羅素 2000 ETF，小型股跌 1.30% 收 2,921.72 點、四大指數最重"}], "en": "US stocks fell across the board on Wednesday. The S&P 500 lost 0.48% to 7,636.36, the Dow dropped 0.77% to 52,380.66 and the Nasdaq Composite slipped 0.64% to 26,253.34. The Russell 2000 was the worst of the four, down 1.30% to 2,921.72. This was not an earnings-driven session: crude surged, long-dated Treasury yields rose again, Iran tensions escalated and Canada's retaliatory tariffs took effect, and the four together drained risk appetite. The VIX rose 4.58% to 16.44, still low in absolute terms.", "zh": "美股週三四大指數全數收黑。標普 500 跌 0.48% 收 7,636.36 點，道瓊跌 0.77% 收 52,380.66 點，那斯達克綜合指數跌 0.64% 收 26,253.34 點，羅素 2000 跌 1.30% 收 2,921.72 點、是四者中最重的一個。這一天不是財報在主導：原油急漲、長天期公債殖利率再走高、伊朗情勢升溫、加拿大反制關稅同日生效，四件事一起把風險胃納抽掉。恐慌指數 VIX 升 4.58% 至 16.44，絕對水位仍然不高，代表這是估值調整而不是恐慌。", "url": "https://vistapglobal.com/stock-market-today-sept-9-2026-sp-500-dow-and-nasdaq-fall-as-oil-rallies-rates-rise-and-risk-appetite-fades-dell-ser-soc-uso-vix-rise/"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "油價破百", "color": "#E05C5C", "stocks": [{"t": "USO", "n": "美國原油基金，昨日漲 2.70% 收 149.97 美元"}, {"t": "VLO", "n": "Valero，煉油商，原油與成品油價差擴大的直接受惠方"}, {"t": "XLE", "n": "能源類股 ETF，能源與公用事業是當日僅有的兩個上漲板塊"}], "en": "Brent crude touched $100 a barrel intraday for the first time since July, and October WTI settled at $96.69, up 3.93%. The move followed another round of overnight strikes on Persian Gulf energy infrastructure. The pass-through is already visible at the pump: US gasoline is at $4.22 a gallon and diesel at $5.94, the highest for this point in September on record. Energy and utilities were the only two sectors to close green.", "zh": "布蘭特原油盤中觸及每桶 100 美元，是 7 月以來第一次；10 月期 WTI 收在 96.69 美元、單日漲 3.93%。推力是波斯灣能源設施再度遭到隔夜攻擊。這一次的漲價已經傳導到終端：美國汽油每加侖 4.22 美元、柴油 5.94 美元，都是歷年同期最高。當日只有能源與公用事業兩個板塊收紅，其餘全黑。", "url": "https://finance.yahoo.com/markets/stocks/articles/stock-market-midday-sept-9-165800985.html"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "殖利率再升", "color": "#E05C5C", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，10 年期殖利率升約 6 個基點至 4.85%、長債價格續跌"}, {"t": "XLU", "n": "公用事業 ETF，與能源同為當日僅有的上漲板塊"}, {"t": "XLI", "n": "工業類股 ETF，工業與非必需消費是當日最弱的兩個板塊"}], "en": "The 10-year Treasury yield rose about six basis points to 4.85%, extending the move that has defined the past two weeks. Higher long yields hit the market in two places at once: they compress the multiple on long-duration growth names, and they raise the refinancing cost of leveraged cyclicals. Industrials and consumer cyclicals were the weakest sectors, which is the classic signature of a rate shock rather than a growth scare.", "zh": "10 年期公債殖利率升約 6 個基點至 4.85%，延續了近兩週的方向。長端殖利率走高會同時打到兩個地方：一是壓縮長天期成長股的估值倍數，二是墊高高槓桿景氣循環股的再融資成本。當日最弱的兩個板塊是工業與非必需消費，這正是利率衝擊而非成長衰退的典型長相。真正的成長恐慌通常先殺必需消費以外的所有東西，而不是只殺利率敏感族群。", "url": "https://tradingstrategyguides.com/stock-market-recap-september-9-2026-yield-spike-sinks-stocks/"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "個股分歧", "color": "#E05C5C", "stocks": [{"t": "META", "n": "Meta，發表新的 AI 代理人 Muse，是當日少數逆勢上漲的大型科技股"}, {"t": "DELL", "n": "戴爾，收 535.25 美元微漲 0.26%，同時在市場尋求 40 億美元債券再融資"}, {"t": "GLD", "n": "黃金 ETF，金價收 4,442.30 美元僅漲 0.07%、避險買盤沒有全面接手"}], "en": "Beneath the index moves, single stocks split cleanly by theme. Meta rose as the market took to Muse, its new AI agent, showing that AI-specific news still gets paid even on a red day. Dell edged up 0.26% to $535.25 while seeking a $4bn bond sale to refinance debt, a reminder that even AI-server winners are financing into a higher-rate market. Gold barely moved, up 0.07% to $4,442.30, so the safe-haven bid was not broad.", "zh": "指數之下，個股是照主題乾淨地分開的。Meta 因為市場買單它新推出的 AI 代理人 Muse 而逆勢上漲，說明就算在紅通通的一天，AI 的個別利多還是有人付錢。戴爾微漲 0.26% 收 535.25 美元，同時正在市場上尋求 40 億美元的債券再融資，提醒大家連 AI 伺服器的贏家也得在高利率環境裡借錢。黃金只漲 0.07% 收 4,442.30 美元，避險買盤並沒有全面接手。", "url": "https://finance.yahoo.com/markets/stocks/articles/stock-market-midday-sept-9-165800985.html"},
    {"id": "earn_0", "channel": "財報速報", "tag": "轉型見效", "color": "#E8786A", "stocks": [{"t": "GME", "n": "GameStop，調整後每股盈餘 0.27 美元遠優於預期，股價站上 20 美元"}, {"t": "FNKO", "n": "Funko，收藏品同業，GameStop 收藏品營收年增 57% 對這個品類是需求佐證"}], "en": "GameStop's fiscal Q2 came in far above expectations: adjusted EPS of $0.27 against a $0.19 consensus, on revenue of $790.2m. Revenue still fell 18.7% year on year, mostly against last year's Switch 2 launch and store closures, but the mix shift is the story. Collectibles revenue reached about $356.3m, up 57% and now 45.1% of sales, and gross margin nearly doubled to 43.7% from 29.1%. The stock rose above $20, helped by a same-day director purchase.", "zh": "GameStop 會計年度第二季遠優於預期：調整後每股盈餘 0.27 美元，市場共識只有 0.19 美元，營收 7.902 億美元。營收仍年減 18.7%，主因是去年同期有 Switch 2 上市加上關店，但真正的故事是組合的位移。收藏品營收約 3.563 億美元、年增 57%，已經占總營收 45.1%，帶動毛利率從 29.1% 幾乎翻倍到 43.7%。股價因此站上 20 美元，同一天還有一位董事在公開市場買進。", "url": "https://www.foreignpolicyjournal.com/2026/09/09/gamestop-nyse-gme-smashes-q2-estimates-as-collectibles-sales-surge-57/"},
    {"id": "earn_1", "channel": "財報速報", "tag": "超預期卻重挫", "color": "#E8786A", "stocks": [{"t": "CASY", "n": "Casey's General Stores，營收與每股盈餘雙雙超預期，股價仍重挫約 14% 至 15%"}, {"t": "MUSA", "n": "Murphy USA，同為便利商店與加油站營運商，同店銷售放緩的讀數對它有參考性"}], "en": "Casey's General Stores beat on both lines: Q1 revenue of $5.68bn against $5.57bn expected, and EPS of $7.37 against $6.72. The stock still fell roughly 14-15%. The problem was inside same-store sales, up 3.2% versus 4.3% in the year-ago quarter, with fuel same-store gallons down 0.3%. When a stock carries a premium multiple, a deceleration in the metric that justifies the multiple outweighs the headline beat.", "zh": "Casey's General Stores 營收與獲利雙雙超預期：第一季營收 56.8 億美元、市場預期 55.7 億，每股盈餘 7.37 美元、預期 6.72 美元。股價卻重挫約 14% 至 15%。問題出在店內同店銷售只成長 3.2%，去年同期是 4.3%，加油站同店加侖數還年減 0.3%。當一檔股票掛著溢價的估值倍數，撐起那個倍數的指標一旦減速，比帳面超預期更有分量。", "url": "https://www.benzinga.com/markets/earnings/26/09/61674668/caseys-general-stores-stock-tumbles-after-q1-earnings"},
    {"id": "earn_2", "channel": "財報速報", "tag": "在線但保守", "color": "#E8786A", "stocks": [{"t": "CHWY", "n": "Chewy，第二季營收 33.3 億美元年增 7.3%，盤前一度跌 4.38%"}, {"t": "FRPT", "n": "Freshpet，鮮食寵物飼料商，寵物市場需求展望轉保守對它是同向風險"}, {"t": "WOOF", "n": "Petco，實體寵物零售商，Chewy 的活躍客戶數變化是同業共通指標"}], "en": "Chewy's fiscal Q2 landed in line: net sales of $3.33bn, up 7.3% and at the top of guidance, with adjusted EPS of $0.36 matching consensus. Adjusted EBITDA margin improved to 6.8%, above guidance, and active customers rose to 21.7m. Management raised and narrowed the full-year outlook to $13.46-13.57bn in sales. Shares still fell 4.38% premarket, because there was no EPS beat and management stayed cautious on the broader pet market.", "zh": "Chewy 會計年度第二季落在區間內：淨銷售 33.3 億美元、年增 7.3%，位於財測上緣，調整後每股盈餘 0.36 美元與共識一致。調整後 EBITDA 利潤率升到 6.8%、優於財測，活躍客戶數增至 2,170 萬。管理層同時上調並收窄全年財測至 134.6 億至 135.7 億美元。股價盤前仍跌 4.38%，理由是獲利沒有超預期，而且管理層對整體寵物市場的看法偏保守。", "url": "https://www.investing.com/news/transcripts/earnings-call-transcript-chewy-posts-steady-q2-2026-results-as-shares-fall-premarket-93CH-4893739"},
    {"id": "macro_0", "channel": "總經政策", "tag": "升息定價", "color": "#7C6AF7", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，升息定價把長端殖利率推到 4.85%"}, {"t": "KRE", "n": "區域銀行 ETF，升息對淨息差有利、對放款品質不利，是兩面刃"}, {"t": "SHY", "n": "1 至 3 年期公債 ETF，短天期最直接反映政策利率路徑"}], "en": "Fed pricing for the 15-16 September FOMC is now genuinely two-sided. CME fed funds futures put a 25bp hike at about 58.7% as of 7 September, and one pricing dashboard showed 63% with roughly 15.7bp priced by 9 September. Prediction markets disagree: Kalshi has a hold at about 51.5%. The trigger was August payrolls at 162,000, well above forecast, and UBS, Bank of America and Deutsche Bank have all shifted toward hikes in September and December.", "zh": "市場對 9 月 15 日至 16 日聯邦公開市場委員會的定價現在是真的兩面都有人站。芝商所的聯邦資金利率期貨在 9 月 7 日給升息一碼約 58.7% 的機率，另一個定價儀表板在 9 月 9 日顯示 63%、隱含約 15.7 個基點。預測市場的看法相反：Kalshi 給「按兵不動」約 51.5%。轉折點是八月非農就業 16.2 萬人遠優於預期，瑞銀、美銀與德意志銀行都已把預測改成 9 月與 12 月各升一次。", "url": "https://www.cnbc.com/2026/08/28/-september-fed-decision-now-a-coin-flip-as-rate-hike-odds-increase.html"},
    {"id": "macro_1", "channel": "總經政策", "tag": "週五通膨", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，八月消費者物價指數是這檔標的的直接輸入"}, {"t": "USO", "n": "美國原油基金，能源價格會落在下一份而非這一份通膨數據裡"}, {"t": "XRT", "n": "零售類股 ETF，核心商品通膨與消費者實質購買力直接相關"}], "en": "The August CPI lands on Friday 11 September at 8:30am ET, the last inflation print before the FOMC. Consensus is 3.4% year on year for headline, with prediction markets favouring 0.2% month on month for core and clustering around 2.4% year on year. July was 3.4% headline and 2.5% core. The catch is timing: August data cannot contain the September oil spike, so a benign print will not settle the argument about what energy does to the next two months.", "zh": "八月消費者物價指數在 9 月 11 日週五美東時間早上 8 點半公布，是聯邦公開市場委員會開會前最後一份通膨數據。市場共識是整體年增 3.4%，預測市場對核心月增偏好 0.2%、年增則集中在 2.4% 附近。七月的讀數是整體 3.4%、核心 2.5%。要注意時間差：八月的數據不可能包含 9 月才發生的油價急漲，所以就算這份數字溫和，也解決不了「能源會怎麼影響接下來兩個月」這個爭論。", "url": "https://www.financecalendar.com/us-cpi-report/"},
    {"id": "macro_2", "channel": "總經政策", "tag": "美加互課", "color": "#7C6AF7", "stocks": [{"t": "NUE", "n": "紐克鋼鐵，加拿大反制清單涵蓋鋼鐵，是雙向課稅的直接品項"}, {"t": "WHR", "n": "惠而浦，家電被列入加拿大 15% 至 50% 的反制關稅清單"}, {"t": "DE", "n": "迪爾，農業機具同樣在加拿大的反制清單上"}], "en": "Canada's retaliatory tariffs took effect on 8 September: 15%, 25% and 50% rates on more than 700 categories of US goods covering $27.6bn of imports, matching dollar for dollar the 50% US tariff imposed on Canadian goods from 22 August. The targets are steel, dairy, appliances, agricultural equipment, pulp and paper and electronics. Washington answered by banning imports of many Canadian dairy products, motorcycles and alcohol from 29 September. Prime Minister Mark Carney has described the relationship as a war.", "zh": "加拿大的反制關稅在 9 月 8 日生效：對超過 700 個品項、涵蓋 276 億美元美國商品，分別課 15%、25% 與 50%，金額對美國自 8 月 22 日起對加拿大商品課 50% 的規模一美元對一美元。被鎖定的是鋼鐵、乳品、家電、農業機具、紙漿與電子產品。華府接著宣布自 9 月 29 日起禁止多項加拿大乳品、機車與酒類進口。加拿大總理卡尼形容兩國關係已經處於戰爭狀態。", "url": "https://www.aljazeera.com/news/2026/9/8/canadas-retaliatory-tariffs-on-20bn-of-us-goods-take-effect"},
    {"id": "sector_0", "channel": "產業風向", "tag": "能源獨強", "color": "#4EABA4", "stocks": [{"t": "XLE", "n": "能源類股 ETF，昨日與公用事業並列僅有的兩個上漲板塊"}, {"t": "XLU", "n": "公用事業 ETF，同時吃到防禦需求與電力需求兩條線"}, {"t": "TNK", "n": "Teekay Tankers，第二季超大型油輪日租 12.32 萬美元、年增逾兩倍"}], "en": "The sector table on Wednesday was unusually simple: energy and utilities up, everything else down. Energy is the direct beneficiary of Brent at $100. Utilities are doing double duty as a defensive bond proxy and as the AI electricity trade. The less obvious winner is seaborne transport. Teekay Tankers reported Q2 VLCC spot rates averaging $123,200 a day against $40,200 a year earlier, with Suezmax at $109,200 and Aframax at $74,100, driven by Hormuz disruption and Russia's diesel export ban.", "zh": "週三的板塊表格罕見地單純：能源與公用事業上漲，其餘全部下跌。能源是布蘭特站上 100 美元的直接受惠方。公用事業則一次做兩份工，既是防禦性的債券替代品，又是人工智慧的電力題材。比較不明顯的贏家是海運。Teekay Tankers 第二季超大型油輪的現貨日租平均 12.32 萬美元，去年同期只有 4.02 萬美元；蘇伊士型 10.92 萬美元、阿芙拉型 7.41 萬美元，推力來自荷莫茲海峽的干擾與俄羅斯的柴油出口禁令。", "url": "https://www.investing.com/news/company-news/teekay-tankers-q2-2026-slides-record-rates-amid-geopolitical-chaos-93CH-4825694"},
    {"id": "sector_1", "channel": "產業風向", "tag": "農業分家", "color": "#4EABA4", "stocks": [{"t": "CTVA", "n": "科迪華，分拆後保留 Corteva 名稱、成為純作物保護公司"}, {"t": "FMC", "n": "FMC，純作物保護同業，分拆後的新科迪華會直接與它對標"}, {"t": "MOS", "n": "美盛，農業投入品同業，種子與化學品的估值差異會被重新檢視"}], "en": "Corteva's separation is on track for the fourth quarter of 2026. The seed and genetics business will list as Vylor, carrying the Pioneer, Brevant and Dairyland brands plus more than 4,000 germplasm patents and 2,000 biotechnology patents. What remains under the Corteva name becomes a pure-play crop protection company selling herbicides, fungicides, insecticides and biologicals. Current CEO Chuck Magro moves to the spinco and Luke Kissam takes the crop protection company. Seed and chemistry have historically carried very different multiples.", "zh": "科迪華的分拆進度落在 2026 年第四季。種子與遺傳事業會以 Vylor 為名獨立掛牌，帶走 Pioneer、Brevant 與 Dairyland 品牌，以及超過 4,000 項種原專利與 2,000 項生物技術專利。留在 Corteva 名下的則變成純粹的作物保護公司，賣除草劑、殺菌劑、殺蟲劑與生物製劑。現任執行長馬格羅將轉往分拆出來的種子公司，作物保護公司由基薩姆接手。種子與農化在歷史上一直是兩種很不一樣的估值倍數。", "url": "https://www.morningstar.com/company-reports/1423773-cortevas-seeds-spinoff-will-leave-a-pure-play-crop-protection-company"},
    {"id": "sector_2", "channel": "產業風向", "tag": "手機漲價", "color": "#4EABA4", "stocks": [{"t": "AAPL", "n": "蘋果，發表 iPhone 18 Pro 與摺疊機，發表後出現溫和的賣消息走勢"}, {"t": "QCOM", "n": "高通，基頻與射頻供應商，機種售價與出貨組合直接牽動它的內容價值"}, {"t": "SWKS", "n": "Skyworks，射頻前端供應商，摺疊機的天線與濾波器需求是新增量"}], "en": "Apple used its 9 September event to launch the iPhone 18 Pro at $1,199 and the 18 Pro Max at $1,299, each $100 above last year's equivalent, plus a foldable model. The price increase is the number that matters: KeyBanc had warned before the event that investors would weigh pricing against the demand and margin impact of higher costs. The stock saw a modest sell-the-news reaction. Bank of America notes Apple has gained in the 60 days after a reveal 17 times since 2007.", "zh": "蘋果在 9 月 9 日的發表會推出 iPhone 18 Pro 售價 1,199 美元、18 Pro Max 售價 1,299 美元，各比去年同級機種貴 100 美元，另外還發表了摺疊機種。真正要看的數字是這次的漲價：KeyBanc 在發表會前就提醒，投資人會把定價跟成本上升對需求與毛利的影響放在一起秤。股價出現溫和的賣消息反應。美銀指出，自 2007 年以來蘋果在發表會後 60 天內上漲的次數有 17 次。", "url": "https://www.macrumors.com/2026/09/07/iphone-18-pro-event-could-hit-apple-shares/"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "落後最多", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，昨日跌 1.30%、跌幅是標普 500 的近三倍"}, {"t": "IJR", "n": "標普小型股 600 ETF，成分股要求獲利，是品質較高的小型股對照組"}], "en": "The Russell 2000 fell 1.30% on Wednesday against the S&P 500's 0.48%, nearly three times the loss. That gap is the day's most useful single number. Nothing company-specific hit small caps; what hit them was a six basis point rise in the 10-year yield and a $3.66 jump in crude. When small caps underperform by that ratio on a macro-only day, the market is telling you the group is being traded as a leveraged bet on rates rather than on domestic growth.", "zh": "羅素 2000 週三跌 1.30%，同一天標普 500 只跌 0.48%，跌幅接近三倍。這個落差是當天最有用的一個數字。並沒有什麼公司層面的事件打到小型股，打到它們的是 10 年期殖利率升 6 個基點與原油漲 3.66 美元。當一個沒有個股事件、只有總經的日子出現這種倍數的落後，市場等於在告訴你：現在小型股被當成利率的槓桿部位在交易，而不是被當成本土成長的代表。", "url": "https://vistapglobal.com/stock-market-today-sept-9-2026-sp-500-dow-and-nasdaq-fall-as-oil-rallies-rates-rise-and-risk-appetite-fades-dell-ser-soc-uso-vix-rise/"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "浮動利率", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普小型股 600 ETF，成分股須連續獲利，槓桿體質優於羅素 2000"}, {"t": "KRE", "n": "區域銀行 ETF，小型股的主要放款方，兩者的利率敏感度互為鏡像"}], "en": "The mechanism behind small-cap rate sensitivity is not sentiment, it is the balance sheet. Small caps carry a much higher share of floating-rate debt and have far less access to long-dated fixed-rate financing than large caps, so a policy rate that goes up rather than down flows into their interest expense within a quarter or two. This is why the September FOMC matters more to the Russell 2000 than to the S&P 500, and why hike pricing hits small caps first.", "zh": "小型股對利率敏感，機制不在情緒，而在資產負債表。小型股的浮動利率負債占比遠高於大型股，取得長天期固定利率融資的管道也少得多，所以政策利率往上而不是往下走時，一兩個季度內就會直接流進它們的利息費用。這就是為什麼 9 月的聯邦公開市場委員會對羅素 2000 的意義大於對標普 500，也是為什麼升息定價一出現，最先被賣的永遠是小型股。", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "微型領先", "color": "#5B8ED6", "stocks": [{"t": "IWC", "n": "羅素微型股 ETF，追蹤市值最小的一層美股"}, {"t": "VTI", "n": "美國全市場 ETF，作為微型股相對強弱的比較基準"}], "en": "One counterintuitive datapoint sits underneath the weak tape. Through 17 August, the Morningstar US Micro Cap Index had returned 45.7% against 22.8% for the broad market, and micro caps have been outperforming for roughly a year. So the pain is not uniformly a size effect. It is more accurate to say the market has been paying for the smallest, most speculative tier while the ordinary small-cap middle has lagged, which is a different and less healthy pattern than a broad small-cap recovery.", "zh": "在疲弱的盤面底下有一個反直覺的數據。截至 8 月 17 日，晨星美國微型股指數的報酬是 45.7%，同期大盤只有 22.8%，而且微型股領先已經持續了大約一年。所以痛苦並不是均勻的市值效應。更精確的說法是：市場一直在為最小、最投機的那一層付錢，而一般的小型股中段班反而落後。這跟「小型股全面復甦」是兩件事，而且是比較不健康的那一種。", "url": "https://www.morningstar.com/funds/these-tiny-stocks-are-quietly-outperforming-market"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "流動性陷阱", "color": "#5B8ED6", "stocks": [{"t": "CPRX", "n": "Catalyst Pharmaceuticals，週二在十四倍均量下漲 22.73%、推力只是一篇分析文章"}], "en": "A concrete illustration of small-cap microstructure: Catalyst Pharmaceuticals rose 22.73% on Tuesday on fourteen times its average volume, and the identifiable trigger was a single positive article, with the S&P 600 index inclusion last month as background. Nothing about the business changed that day. In a thin book, a 22% move can be bought with a fraction of the capital that would move a large cap 1%. That cuts both ways, and it is the main reason position sizing matters more here than stock selection.", "zh": "一個具體的小型股微結構案例：Catalyst Pharmaceuticals 週二在十四倍均量之下上漲 22.73%，可辨識的觸發點只是一篇看多的分析文章，背景則是上個月被納入標普小型股 600 指數。那一天公司本身什麼都沒有改變。在掛單稀薄的簿子裡，推動 22% 的漲幅所需要的資金，可能只是推動大型股 1% 的零頭。這件事是雙向的，也是為什麼在這個池子裡，部位大小比選股更值得花心思。", "url": "https://www.barchart.com/story/news/10543747/small-cap-catalyst-pharma-is-among-market-s-best-price-performers"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "起點決定", "color": "#5B8ED6", "stocks": [{"t": "SIG", "n": "Signet Jewelers，每股盈餘超預期 26%、盤前漲約 9%、盤中最高漲逾 17%"}, {"t": "CASY", "n": "Casey's General Stores，營收獲利雙超預期，股價仍跌約 14% 至 15%"}], "en": "The same session produced two opposite reactions to two beats. Signet beat adjusted EPS by 26%, at $2.19 against $1.72, and jumped roughly 9% premarket and more than 17% intraday. Casey's beat on both lines and fell about 14-15%. The difference was not the quality of the quarter, it was the expectation embedded in the price beforehand. Signet came in unloved with a low multiple; Casey's came in with a premium multiple that required same-store acceleration it did not deliver.", "zh": "同一個交易日，兩份超預期的財報得到完全相反的反應。Signet 調整後每股盈餘 2.19 美元、優於預期 1.72 美元，超出 26%，盤前漲約 9%、盤中最高漲逾 17%。Casey's 營收與獲利雙雙超預期，卻跌了約 14% 至 15%。差別不在這一季的品質，而在股價事前已經內含的期待。Signet 是在不被喜歡、倍數很低的狀態下交出成績；Casey's 則是頂著溢價倍數，而那個倍數要求的同店加速並沒有出現。", "url": "https://www.chartmill.com/news/SIG/Chartmill-54563-Signet-Jewelers-NYSESIG-Soars-as-Q2-Profit-Beats-and-Full-Year-Guidance-Lifted"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "status": "RADAR · 下一個驗證點 NANOPULSE-AF 完成收案與 12 個月數據", "stocks": [{"t": "PLSE", "n": "Pulse Biosciences，營運長 9 月 1 日在公開市場買進 9.99 萬美元"}, {"t": "BSX", "n": "波士頓科學，脈衝場消融的市場領導者，是這個題材的對照與最大對手"}], "en": "Pulse Biosciences makes nanosecond pulsed-field ablation systems that kill target cells non-thermally. Two signals landed together: COO Liane Teplitsky bought $99.9k of stock in the open market on 1 September, and the NANOPULSE-AF pivotal atrial-fibrillation study passed its enrolment midpoint in July, with the technology already carrying FDA breakthrough designation. It is neglected because it is pre-revenue with thin coverage. The risks are real: it raised $46.8m net through an ATM in Q2, so dilution is ongoing, and Boston Scientific, Medtronic and J&J own this market. Research lead, not investment advice.", "zh": "Pulse Biosciences 做的是奈秒脈衝場消融系統，用非熱的方式清除目標細胞。兩個訊號同時出現：營運長 Teplitsky 在 9 月 1 日於公開市場買進 9.99 萬美元的股票；而心房顫動的樞紐試驗 NANOPULSE-AF 已在 7 月通過收案中點，這項技術本身還帶著美國食藥署的突破性裝置認定。它被忽視的原因是尚未有營收、分析師覆蓋稀薄。風險不能輕描淡寫：第二季透過市價發行淨募 4,680 萬美元，稀釋是持續進行式，而且這個市場由波士頓科學、美敦力與嬌生把持。這是研究線索，不是投資建議。", "url": "https://investors.pulsebiosciences.com/news-releases/news-release-details/pulse-biosciences-announces-fda-ide-approval-initiate-its-npulse"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月下旬第三季財報與信用合約經濟性", "stocks": [{"t": "SIG", "n": "Signet Jewelers，連續六季每股盈餘超預期，全年財測年內二度上修"}], "en": "Signet Jewelers runs Kay, Zales and Jared. Wednesday's quarter was the sixth consecutive EPS beat: $2.19 adjusted against $1.72 expected, net income of $52.1m versus a $9.1m loss a year earlier, same-store sales up 2.2% and adjusted operating margin up to 7.0% from 5.6%. Full-year guidance was raised for the second time this year to $10.45-12.15. It is neglected because jewellery retail is an out-of-favour category with thin coverage. The open question is repeatability: part of the raise came from tariff refunds and new credit-deal economics, neither of which is recurring operating profit. The stock already moved more than 17%. Research lead, not investment advice.", "zh": "Signet Jewelers 旗下有 Kay、Zales 與 Jared 三個珠寶品牌。週三這一季是連續第六季每股盈餘超預期：調整後 2.19 美元、預期 1.72 美元，淨利 5,210 萬美元、去年同期還虧 910 萬美元，同店銷售成長 2.2%，調整後營業利益率從 5.6% 升到 7.0%。全年財測今年二度上修到 10.45 至 12.15 美元。它被忽視的原因是珠寶零售是不受歡迎的品類、覆蓋稀薄。要問的是可重複性：這次上修有一部分來自關稅退款與新的信用合約經濟性，兩者都不是經常性的營業利潤。而且股價當天已經漲逾 17%。這是研究線索，不是投資建議。", "url": "https://ca.finance.yahoo.com/news/signet-shares-jump-q2-profit-113128889.html"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 第三季實際成交日租與 10 月營運更新", "stocks": [{"t": "ASC", "n": "Ardmore Shipping，第二季 MR 型現貨日租 51,900 美元、約為損益兩平的三倍"}, {"t": "TNK", "n": "Teekay Tankers，同一個地緣推力下的大型油輪對照組"}], "en": "Ardmore Shipping entered the pool on 7 September and the thesis strengthened this week. Q2 MR product tankers earned spot TCE of $51,900 a day and chemical tankers $26,900, roughly triple breakeven. For Q3 the company has fixed 45% of MR days at $29,600, up 20% year on year, and 50% of chemical days at $25,000, up 10%. Brent at $100 and continued Gulf disruption extend the driver. The risk is that this is a rate cycle, not a franchise: the Q3 fixtures are already well below Q2, tonne-mile gains reverse quickly on any de-escalation headline, and the newbuild orderbook is filling. Research lead, not investment advice.", "zh": "Ardmore Shipping 在 9 月 7 日入池，這一週論點又補強了。第二季 MR 型成品油輪的現貨等價日租 51,900 美元、化學品船 26,900 美元，大約是損益兩平的三倍。第三季公司已經把 45% 的 MR 船天鎖在 29,600 美元、年增 20%，化學品船則有 50% 鎖在 25,000 美元、年增 10%。布蘭特站上 100 美元加上波斯灣持續受擾，讓推力延續。風險同樣清楚：這是運價循環而不是護城河，第三季的鎖定價已經明顯低於第二季，噸海里的增益只要一則和緩的新聞就會反轉，而新船訂單簿正在補滿。這是研究線索，不是投資建議。", "url": "https://www.investing.com/news/company-news/ardmore-q2-2026-slides-rates-triple-breakeven-on-supply-disruptions-93CH-4821104"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月第三季財報的實際銻產出與售價", "stocks": [{"t": "UAMY", "n": "United States Antimony，董事與執行副總在 9 月 1 日至 2 日合計買進約 19.3 萬美元"}, {"t": "MP", "n": "MP Materials，關鍵礦物本土化題材的大型對照組"}], "en": "United States Antimony entered the pool on 1 September and the insider evidence firmed up immediately. Director Joseph Carrabba bought $100.5k and EVP Lloyd Bardswich $92.7k on 1-2 September, a two-person cluster in a company small enough that those sums are meaningful against board and officer pay. The thesis is domestic supply of a critical mineral with essentially no US primary production. The risks are the ones every junior critical-minerals name carries: antimony prices are volatile and thinly traded, processing capacity has to actually ramp, and policy support is an assumption rather than a contract. Research lead, not investment advice.", "zh": "United States Antimony 在 9 月 1 日入池，內部人證據隨即補上。董事 Carrabba 買進 10.05 萬美元、執行副總 Bardswich 買進 9.27 萬美元，時間都在 9 月 1 日至 2 日，是兩個人的叢集；以這家公司的規模與董事、高管的薪酬水準來看，這個金額有分量。論點是關鍵礦物的本土供應，而美國目前幾乎沒有銻的原生產能。風險是所有初級關鍵礦物公司共有的：銻價波動大且成交稀薄，加工產能得真的放量，政策支持目前是假設而不是合約。這是研究線索，不是投資建議。", "url": "https://www.everhint.com/insider-trading-signals-september-02-2026/"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月第三季財報的積壓訂單是否邁向 1 億美元", "stocks": [{"t": "SMID", "n": "Smith-Midland，執行長與董事在 9 月 1 日至 2 日各買進約 5.4 萬美元"}, {"t": "VMC", "n": "Vulcan Materials，基建材料的大型對照組，可看同一條需求曲線"}], "en": "Smith-Midland entered the pool on 5 September and now has both halves of the case. Backlog was about $57.4m as of 1 August against $54m a year earlier, management is targeting $100m, and the growth drivers named are highway barrier rentals and data-centre work, with three Virginia transportation projects worth over $2.7m covering more than 100,000 linear feet of precast. On the insider side, CEO Ashley Smith bought 2,000 shares at $26.87 on 1 September and director Matthew Smith 2,000 shares at $27.15 on 2 September. Risks: it is a family-controlled nano cap, backlog is not revenue, and precast margins swing with cement and freight. Research lead, not investment advice.", "zh": "Smith-Midland 在 9 月 5 日入池，現在兩塊拼圖都到齊了。8 月 1 日的積壓訂單約 5,740 萬美元，去年同期是 5,400 萬，管理層的目標是 1 億美元，被點名的成長動力是公路護欄租賃與資料中心相關工程；公司近期拿下三個維吉尼亞州的運輸專案、金額逾 270 萬美元，交付超過 10 萬英尺的預鑄混凝土製品。內部人這一側，執行長 Ashley Smith 在 9 月 1 日以 26.87 美元買進 2,000 股，董事 Matthew Smith 在 9 月 2 日以 27.15 美元買進 2,000 股。風險：這是家族控制的奈米型股，積壓訂單不等於營收，預鑄的利潤率會隨水泥與運費擺動。這是研究線索，不是投資建議。", "url": "https://finance.yahoo.com/markets/stocks/articles/smith-midland-targets-100m-backlog-050157030.html"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 第三季財報的出貨量與毛利率是否轉正", "stocks": [{"t": "FTCI", "n": "FTC Solar，董事 Sadasivam 買進 101,083 股、金額 27.19 萬美元"}, {"t": "ARRY", "n": "Array Technologies，追日支架同業，是產業需求與價格的對照組"}], "en": "FTC Solar entered the pool on 4 September. The new evidence is size relative to the float: director Shaker Sadasivam bought 101,083 shares for $271.9k, a share count that is substantial for a company at this price level, and he is a former solar CEO rather than a passive board member. The thesis is US-content solar trackers under a tariff regime that penalises imported structure. The risks dominate the case for now: the company has a history of dilution, gross margin has been negative or marginal, order timing is lumpy, and policy is the whole demand curve. Research lead, not investment advice.", "zh": "FTC Solar 在 9 月 4 日入池。新增的證據是「相對於流通股本的規模」：董事 Sadasivam 買進 101,083 股、金額 27.19 萬美元，以這個價位的公司來說股數相當可觀，而且他是太陽能產業出身的前執行長，不是掛名董事。論點是關稅環境懲罰進口結構件，本土含量高的追日支架因此受惠。目前風險仍然壓過論點：這家公司有稀釋前科，毛利率長期在零附近或為負，接單時點很不平均，而政策本身就是整條需求曲線。這是研究線索，不是投資建議。", "url": "https://www.everhint.com/insider-trading-signals-september-02-2026/"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "越跌越買", "color": "#6DB56D", "stocks": [{"t": "BJRI", "n": "BJ's Restaurants，董事 Richmond 在四個交易日內買了三次、價格一路走低"}, {"t": "TXRH", "n": "Texas Roadhouse，休閒餐飲同業，可對照客流與食材成本的產業背景"}], "en": "BJ's Restaurants director Bradford Richmond bought on three separate sessions into a falling price: 753 shares at $63.25 on 31 August through a trust he controls, 500 shares at $61.05 on 2 September, and 500 more at $59.50 on 3 September. The trust's indirect holding rose to 35,500 shares. Averaging down across consecutive sessions is a different signal from a single dated purchase. The caveat is unavoidable: BJ's insiders as a group have been net sellers by about $2.8m over the past twelve months.", "zh": "BJ's Restaurants 的董事 Richmond 在三個不同的交易日、一路往下買：8 月 31 日透過他掌控的信託以 63.25 美元買 753 股，9 月 2 日以 61.05 美元買 500 股，9 月 3 日再以 59.50 美元買 500 股，該信託的間接持股增至 35,500 股。連續盤中往下攤平，跟一筆單一日期的買進是不同性質的訊號。但有個必須講清楚的但書：過去十二個月，BJ's 的內部人整體是淨賣方，賣超約 280 萬美元。", "url": "https://www.stocktitan.net/sec-filings/BJRI/form-4-b-js-restaurants-inc-insider-trading-activity-9cb4fab6ebbd.html"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "執行長進場", "color": "#6DB56D", "stocks": [{"t": "PNFP", "n": "Pinnacle Financial Partners，執行長 Kevin Blair 買進 25 萬美元"}, {"t": "FITB", "n": "Fifth Third，區域銀行同業，利率路徑對兩者的淨息差影響方向一致"}], "en": "Pinnacle Financial Partners CEO Kevin S. Blair made a $250k open-market purchase in the same window. A sitting bank CEO buying his own stock while the market is repricing toward a hike is worth noting for a specific reason: rate direction cuts both ways for a bank, lifting net interest margin but pressuring credit quality and securities marks. A CEO purchase says the person with the best view of the loan book is willing to take the second risk to get the first. It says nothing about timing.", "zh": "Pinnacle Financial Partners 的執行長 Kevin Blair 在同一個時間窗以 25 萬美元在公開市場買進自家股票。一位在任的銀行執行長，在市場正把定價往升息方向調整時買自家股票，值得注意的理由很具體：利率方向對銀行是兩面刃，會墊高淨息差，但同時壓迫放款品質與債券部位的評價。執行長買進，等於是最了解放款簿的那個人願意承擔第二種風險去換第一種好處。它完全沒有講到時機。", "url": "https://www.everhint.com/insider-trading-signals-september-02-2026/"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "判讀提醒", "color": "#6DB56D", "stocks": [{"t": "CAT", "n": "開拓重工，執行長單筆賣出 2,620 萬美元，是當期最大的一筆處分"}, {"t": "SNPS", "n": "新思科技，執行董事長賣出 2,138 萬美元"}, {"t": "CRWD", "n": "CrowdStrike，執行長與一位董事合計賣出約 870 萬美元"}], "en": "The aggregate numbers this week look alarming and are mostly noise. On 2 September alone, disposals exceeded $175m against roughly $2.6m of purchases: Caterpillar's CEO sold $26.2m, Synopsys's executive chair $21.38m, CrowdStrike's CEO and a director about $8.7m combined. Almost all of that is scheduled 10b5-1 selling, tax on vesting, or diversification by people whose net worth is one stock. Sales have many causes; purchases have one. The usable filter is direction plus cluster plus size normalised against the insider's pay, which is why a $54k buy at a nano cap outranks a $26m sale at a mega cap.", "zh": "這一週的加總數字看起來很嚇人，但大部分是雜訊。光是 9 月 2 日，處分金額就超過 1.75 億美元，同期買進只有約 260 萬：開拓重工執行長賣 2,620 萬、新思科技執行董事長賣 2,138 萬、CrowdStrike 執行長與一位董事合計賣約 870 萬。這些幾乎都是預先排定的 10b5-1 賣出、股票歸屬的繳稅需求，或是身家壓在單一股票上的人在分散風險。賣出有很多種原因，買進只有一種。可用的篩子是方向、叢集，加上以內部人薪酬正規化後的金額，這也是為什麼一筆奈米股的 5.4 萬美元買進，分量高過大型股的 2,600 萬美元賣出。", "url": "https://www.everhint.com/insider-trading-signals-september-02-2026/"},
    {"id": "capitol_0", "channel": "政要持股", "tag": "換到電與晶片", "color": "#B5654D", "stocks": [{"t": "AEP", "n": "美國電力公司，Taylor 在兩個帳戶同時買進，是這次調整的核心部位"}, {"t": "AVGO", "n": "博通，同樣在兩個帳戶同步買進，代表 AI 客製晶片這一側"}, {"t": "FITB", "n": "Fifth Third，同批買進的區域銀行，總部與議員選區同在俄亥俄州"}], "en": "The most legible disclosure this period is filing 20035392 from Rep. David J. Taylor of Ohio's second district, all trades dated 26 August and filed 3 September. He bought American Electric Power, Broadcom and Fifth Third while selling Amgen, Microsoft and Vertex. The AEP and Broadcom purchases appear twice each, mirrored across an IRA and a joint trust, which marks a deliberate allocation change rather than a one-off. Read structurally, the position swaps mega-cap software and biotech for the electricity that AI consumes and the custom silicon that runs it, plus a rate-sensitive regional bank. Each line is in the $1,001-$15,000 band, so this is a small-dollar reallocation, not a large bet.", "zh": "本期最好讀的一筆申報，是俄亥俄州第二選區眾議員 David J. Taylor 的 20035392 號報告，所有交易日期都是 8 月 26 日、9 月 3 日申報。他買進美國電力公司、博通與 Fifth Third，同時賣出安進、微軟與 Vertex。美國電力與博通各出現兩次，分別在個人退休帳戶與聯名信託裡同步執行，這代表是刻意的配置調整，不是隨手一筆。從結構讀，這組部位把大型軟體與生技換成「人工智慧要吃的電」加上「跑它的客製晶片」，再配一檔對利率敏感的區域銀行。每一筆的金額級距都是 1,001 至 15,000 美元，所以這是小額的重新配置，不是重壓。", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035392.pdf"},
    {"id": "capitol_1", "channel": "政要持股", "tag": "判讀提醒", "color": "#B5654D", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報部位的 ETF，是跟單這件事的實際載體"}, {"t": "GOP", "n": "追蹤共和黨籍議員申報部位的 ETF，與 NANC 互為對照"}], "en": "Today's caveat is about double counting. Taylor's filing lists the same AEP purchase twice and the same Broadcom purchase twice, because two accounts executed each. Trackers that count filing lines rather than decisions will report four buys where there was one decision, and any dollar total built that way is inflated. Two other structural limits apply as always. The amount is a band, so $1,001-$15,000 means the true figure could differ by fifteen times, and the trade date is 26 August against a 3 September filing, so a copier is buying a different price than the filer did.", "zh": "今天的提醒是關於重複計算。Taylor 的申報把同一筆美國電力買進列了兩次、同一筆博通買進也列了兩次，因為是兩個帳戶各執行一次。那些以「申報行數」而不是「決策」為單位在計數的追蹤工具，會把一個決策報成四筆買進，用這種方式加總出來的金額必然偏高。另外兩個結構性限制照舊：金額只有級距，1,001 至 15,000 美元代表真實數字可以差到十五倍；交易日是 8 月 26 日、申報日是 9 月 3 日，跟單的人買到的價位跟申報者根本不是同一個。", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure"},
    {"id": "week_0", "channel": "本週事件", "tag": "數據行事曆", "color": "#C97DD4", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，週五的八月消費者物價指數是最直接的輸入"}, {"t": "GLD", "n": "黃金 ETF，實質利率若因通膨數據下滑，金價通常最先反應"}], "en": "Two dates matter over the next five sessions. Friday 11 September at 8:30am ET brings August CPI, consensus 3.4% headline with core clustered near 2.4%, and it is the last inflation reading before the Fed decides. Then 15-16 September is the FOMC itself, currently priced close to a coin flip between a 25bp hike and a hold. Separately, the Treasury began larger long-end liquidity-support buybacks on 9 September, which matters for how orderly the long end trades into those two events.", "zh": "未來五個交易日有兩個日期要看。9 月 11 日週五美東時間早上 8 點半公布八月消費者物價指數，共識是整體年增 3.4%、核心集中在 2.4% 附近，這是聯準會決策前最後一份通膨數據。接著 9 月 15 日至 16 日是聯邦公開市場委員會本身，目前升息一碼與按兵不動的定價接近五五波。另外，美國財政部自 9 月 9 日起加大長天期的流動性支持買回規模，這關係到長債在這兩個事件之間能不能維持有序。", "url": "https://home.treasury.gov/news/press-releases/sb0607"},
    {"id": "week_1", "channel": "本週事件", "tag": "財報交卷", "color": "#C97DD4", "stocks": [{"t": "ORCL", "n": "甲骨文，今晚盤後公布，共識每股盈餘 1.74 美元、營收 191.3 億美元"}, {"t": "ADBE", "n": "Adobe，同樣在今晚盤後公布，是軟體業 AI 變現的指標"}, {"t": "KR", "n": "Kroger，週五盤前公布，共識每股盈餘 1.06 美元、營收 346.5 億美元"}], "en": "Earnings season restarts tonight. Oracle reports fiscal Q1 after the close, consensus $1.74 EPS on $19.13bn revenue, and the number the market actually cares about is remaining performance obligation, the backlog that tells you how much AI cloud has been contracted rather than merely announced. Adobe reports the same evening and is the cleanest read on whether software can charge for AI features rather than absorb their cost. Kroger reports Friday premarket, consensus $1.06 EPS on $34.65bn, and speaks to grocery inflation just after CPI.", "zh": "財報季今晚重新開機。甲骨文盤後公布會計年度第一季，共識是每股盈餘 1.74 美元、營收 191.3 億美元；市場真正在意的數字是剩餘履約義務，也就是那個告訴你有多少人工智慧雲端是簽了約而不只是發了新聞稿的積壓訂單。Adobe 同一晚公布，是最乾淨的一份讀數，看軟體業究竟能為人工智慧功能收費，還是只能自己吸收成本。Kroger 在週五盤前公布，共識每股盈餘 1.06 美元、營收 346.5 億美元，緊接在通膨數據之後談食品雜貨的價格。", "url": "https://www.investing.com/news/stock-market-news/oracle-adobe-and-kroger-earnings-watchlist-for-the-week-of-september-10-93CH-4892177"},
    {"id": "eval_0", "channel": "今日評估", "tag": "兩件事同時發生", "color": "#E8A838", "status": "今日最值得注意 · 到 end screen 按討論鍵展開", "stocks": [{"t": "RSP", "n": "標普 500 等權重 ETF，可看漲跌是集中在少數權值股還是全面性的"}, {"t": "IEF", "n": "7 至 10 年期公債 ETF，中天期是升息定價與經濟放緩之間的角力場"}], "en": "The single thing worth carrying out of Wednesday: oil crossing $100 and the market pricing a rate hike are happening at the same time. In every episode since 2020, an energy shock came with an expectation that the Fed would eventually ease to cushion it. This time futures lean the other way, roughly 59% to 63% for a 25bp hike next week. That removes the discount-rate relief that normally offsets an energy-driven earnings hit, and it explains why the Russell 2000 fell nearly three times the S&P 500 on a day with no company news. Open question for the discussion screen: if Friday's CPI is benign but Brent stays near $100, which one do you trade?", "zh": "週三值得帶走的只有一件事：油價站上 100 美元跟市場定價升息，是同時發生的。2020 年以來的每一次能源衝擊，都伴隨著「聯準會終究會放鬆來緩衝」的預期。這一次期貨往反方向靠，下週升息一碼的機率大約 59% 到 63%。這等於把平常用來抵銷能源侵蝕獲利的折現率紅利拿掉了，也解釋了為什麼在一個完全沒有公司新聞的日子，羅素 2000 會跌到標普 500 的近三倍。留給討論頁的開放問題：如果週五的通膨數據溫和、但布蘭特還在 100 美元附近，你要交易哪一個？", "url": "https://vistapglobal.com/stock-market-today-sept-9-2026-sp-500-dow-and-nasdaq-fall-as-oil-rallies-rates-rise-and-risk-appetite-fades-dell-ser-soc-uso-vix-rise/"},
];

// 「資金流向」「政要績效」是特殊分頁,不吃 CARDS、卡片版型完全不適用
const TODAY_SUBS = ["全部", ...CHANNELS.map(c => c.key), "資金流向", "政要績效"];

// 個別議員申報彙整。來源是眾議院書記官的官方 PTR 索引與 PDF,由 tools/capitol_roster.py

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/10/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v10.5</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
