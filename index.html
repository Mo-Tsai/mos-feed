/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;
    --text-tertiary: #6b6863; --divider: #ddd9d1;
    --noise-opacity: 0.035;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  /* 鍵盤焦點:看得到目前在哪一顆 */
  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }

  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }
  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }
  .source-link { position: relative; display: inline-block; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }

  .nav-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; gap:4px; padding:8px 12px 12px; background:var(--bg); border-top:1px solid var(--divider); z-index:50; }

  .nav-btn-lang { padding:10px 11px; font-size:12px; letter-spacing:0.06em; color:var(--text-secondary); min-width:40px; }

  .nav-btn:hover { border-color:var(--text-secondary); color:var(--text); }
  .nav-btn:active { background:var(--bg-elevated); }
  .nav-btn:disabled { opacity:0.3; cursor:default; border-color:var(--divider); color:var(--text-tertiary); }
  .nav-count { font-family:'Courier New',monospace; font-size:11px; letter-spacing:0.1em; color:var(--text-tertiary); text-transform:uppercase; white-space:nowrap; }

</style>

    {"id": "earn_0", "channel": "財報速報", "tag": "美國銀行財報：含 12 億罰款獲利 -17%，股價跌近 5%", "color": "#E8786A", "zh": "美國銀行（BAC）第三季獲利年減 17% 到 69.3 億美元、每股 0.91 美元，其中包含 12 億美元的監管罰款，扣除後每股約 1.08 美元。營收 301.2 億美元低於 LSEG 預期的 306.9 億，固定收益與股票交易合計短少約 7.5 億美元；淨利息收入 +7.9% 到 166 億美元則略優於預期。股價週三跌近 5%。前一天富國銀行（WFC）每股盈餘 1.87 美元小勝預期 1.85，但營收與淨利息收入略低於預期。", "en": "Bank of America's Q3 profit fell 17% to $6.93 billion, or $0.91 a share, including a $1.2 billion regulatory penalty (about $1.08 excluding it). Revenue of $30.12 billion missed the $30.69 billion LSEG estimate, with fixed income and equities trading about $750 million short; net interest income rose 7.9% to $16.6 billion, slightly ahead. Shares fell almost 5%. A day earlier Wells Fargo's $1.87 EPS beat $1.85 but revenue and NII were light.", "url": "https://www.cnbc.com/2026/10/14/bank-of-america-bac-q3-2026-earnings.html", "stocks": [{"t": "BAC", "n": "本日財報主角，營收未達預期、股價跌近 5%"}, {"t": "WFC", "n": "10/13 財報 EPS 1.87 小勝，營收略低"}, {"t": "XLF", "n": "金融板塊 ETF，銀行股分化的整體對照"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "摩根士丹利財報：股票交易 +41%，財富管理淨流入創紀錄", "color": "#E8786A", "zh": "摩根士丹利（MS）第三季每股盈餘 3.03 美元，高於 LSEG 預期的 2.91；淨收入 203.4 億美元，年增約 12%。主力是股票交易，FinanceFeeds 報道年增 41% 到 58 億美元，高於預期 9.09 億美元。財富管理單季淨新增資產 2,320 億美元，Bloomberg 稱為紀錄。在 CPI 後波動升高的環境，交易收入是這類財報的亮點，但我沒有找到當日股價的最終漲跌幅。", "en": "Morgan Stanley's Q3 EPS of $3.03 beat the $2.91 LSEG consensus on net revenue of $20.34 billion (+12%). Equities trading rose 41% to $5.8 billion, beating expectations by $909 million per FinanceFeeds, and wealth management took in a record $232 billion of net new assets per Bloomberg. I could not confirm the share-price move at the close.", "url": "https://www.cnbc.com/2026/10/14/morgan-stanley-ms-q3-2026-earnings.html", "stocks": [{"t": "MS", "n": "本日財報：EPS 3.03 勝預期，交易與財富管理雙強"}, {"t": "GS", "n": "大型投行，同樣受益交易活絡（財報已於前日公布）"}, {"t": "SCHW", "n": "財富與券商同業，10/15 盤前公布財報"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "ASML 第三季：營收 117 億歐元，第四季財測上看 142–152 億", "color": "#E8786A", "zh": "ASML 公布第三季淨銷售 117 億歐元（落在財測 110 億至 120 億的上緣）、淨利 50 億歐元、毛利率 57.5%。第四季財測為 142 億至 152 億歐元、毛利率約 57%；全年淨銷售預期 440 億至 450 億歐元。ASML 今年起不再公布單季訂單，所以「訂單是否超預期」這個老指標看不到。我沒有找到財報後的股價反應，投資人要看的是財測跳升是否被視為 AI 資本支出的延續。", "en": "ASML reported Q3 net sales of EUR 11.7 billion (upper end of the EUR 11-12 billion guide), net income of EUR 5.0 billion and a 57.5% gross margin. Q4 guidance is EUR 14.2-15.2 billion at roughly 57% margin, and full-year sales EUR 44-45 billion. The company stopped reporting quarterly bookings this year, so the old order-beat gauge is gone. I found no post-results share reaction.", "url": "https://www.sec.gov/Archives/edgar/data/0000937966/000162828026065813/pressreleasefinancialresul.htm", "stocks": [{"t": "ASML", "n": "EUV 曝光機龍頭，Q4 財測 142–152 億歐元"}, {"t": "LRCX", "n": "半導體設備同業，Lam 預計 10/21 財報"}, {"t": "AMAT", "n": "半導體設備同業，對資本支出循環敏感"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "9 月 CPI：整體 3.7%、核心 2.6%，雙雙高於預期", "color": "#7C6AF7", "zh": "BLS 公布 9 月整體 CPI 年增 3.7%（Dow Jones 預期 3.6%）、月增 0.6%；核心 CPI 月增 0.3%、年增 2.6%，高於預期的 0.2% 與 2.5%。汽油較 8 月大漲 9.1%，是三月伊朗戰爭爆發以來最大單月漲幅；食品雜貨則 -0.1%。這份報告是期中選舉前最後一份 CPI，核心通膨高於預期，代表升息壓力不只來自能源。", "en": "BLS reported September headline CPI up 3.7% year over year (consensus 3.6%) and 0.6% on the month; core rose 0.3% m/m and 2.6% y/y versus 0.2% and 2.5% expected. Gasoline jumped 9.1% from August, the largest monthly rise since the Iran war began in March, while groceries slipped 0.1%. It is the last CPI before the midterms, and a firm core print means rate pressure is not just energy.", "url": "https://www.cnbc.com/2026/10/14/cpi-inflation-report-september-2026.html", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，通膨預期的直接對照"}, {"t": "XLE", "n": "能源板塊 ETF，汽油與油價推升通膨的上游"}, {"t": "IWM", "n": "羅素 2000 ETF，對利率與通膨預期敏感"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "升息賭盤升溫：10 月加息機率約 39%，FOMC 10/27–28", "color": "#7C6AF7", "zh": "Fed 已在 9/16 升息一碼到 3.75% 至 4.00%，是 2023 年以來第一次，會議紀錄顯示多數官員認為年底前還需要再升一次。CPI 後 CME FedWatch 顯示 10 月升息機率約 39%，公布前約 22%（另一份分析給 45%，口徑不同）。上週偏軟的 9 月就業數據曾把 10 月升息機率壓到 20% 以下，這份 CPI 把它拉了回來。下次 FOMC 在 10/27 至 28 日。", "en": "The Fed raised rates a quarter point to 3.75%-4.00% on Sept. 16, its first hike since 2023, and minutes showed most officials see another one as appropriate by year-end. After CPI, CME FedWatch put the odds of an October hike near 39%, from about 22% before the release (another analysis says 45%). The soft jobs report had pushed October odds below 20%; CPI pulled them back. The next FOMC is Oct. 27-28.", "url": "https://political.org/2026/10/12/fed-officials-hope-to-skip-an-october-rate-hike-but-this-weeks-inflation-report-could-upend-that-plan/", "stocks": [{"t": "SHY", "n": "1-3 年期公債 ETF，政策利率預期的敏感端"}, {"t": "KRE", "n": "區域銀行 ETF，存放利差與信用成本兩面受影響"}, {"t": "XLU", "n": "公用事業 ETF，利率敏感的防禦股"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "債市壓力：十年期創本輪高點，海外機構開始避險", "color": "#7C6AF7", "zh": "上週十年期殖利率一度到 5.36% 的本輪高點，週末收在約 5.25%，SWBC 形容為劇烈波動後的整理。Bloomberg 報道，債券策略師 Harley Bassman 警告期貨交割機制中一個少被注意的特性，可能放大這輪長達數月的賣壓；英國 L&G 則在 10/14 表示正替債券買入避險，理由包括超大型雲端業者的 AI 借款、各國政府債務與升息可能。債券是 CPI 之後科技股被賣的背景。", "en": "The 10-year yield touched a cycle high of 5.36% last week before ending near 5.25%, which SWBC called consolidation after sharp moves. Bloomberg reported strategist Harley Bassman warning that a little-noticed futures-delivery feature could amplify the monthslong selloff, and Legal & General said on Oct. 14 it is hedging its bond purchases, citing hyperscaler AI borrowing, government debt and possible rate hikes. Bonds are the backdrop to the post-CPI tech selloff.", "url": "https://blog.swbc.com/investmenthub/market-commentary-week-of-october-13-2026", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，殖利率高點的最直接對照"}, {"t": "TBT", "n": "放空長天期公債的反向 ETF，賭殖利率續升"}, {"t": "MBB", "n": "房貸證券 ETF，房貸利率傳導的對照"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "能源：汽油 +9.1%、WTI 約 95 美元，通膨與獲利同時被推高", "color": "#4EABA4", "zh": "CPI 裡汽油月增 9.1%，油價在 90 美元上方，能源是這輪通膨的主因，也是少數在科技殺盤時有支撐的板塊。Brent 上週收在 102 美元之上，OPEC+ 維持 11 月產量目標不變。能源類股的邏輯是現金流隨油價走，但油價高也直接傳導到通膨與升息預期，對其他板塊是負面。這裡只講板塊方向，沒有查到 10/14 當日能源類股的實際漲跌幅。", "en": "Gasoline rose 9.1% in the CPI and oil is above $90, making energy the main driver of this inflation wave and one of the few supports while tech sold off. Brent ended last week above $102 and OPEC+ held November targets. Energy cash flows follow crude, but high oil also feeds inflation and rate-hike expectations for everything else. I did not find the sector's actual Oct. 14 move.", "url": "https://www.cnbc.com/2026/10/14/cpi-inflation-report-september-2026.html", "stocks": [{"t": "XLE", "n": "能源板塊 ETF，油價高檔的代表"}, {"t": "XOP", "n": "油氣探勘生產 ETF，對油價槓桿更大"}, {"t": "OIH", "n": "油服 ETF，鑽井與服務商的對照"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "科技內部分化：AI 基礎設施被賣，蘋果相對抗跌", "color": "#4EABA4", "zh": "同樣是科技，蘋果漲逾 1%，Oracle、CoreWeave、Nebius 重挫，市場在分辨誰靠自有現金流、誰靠借貸擴張。ASML 剛公布第四季財測 142 億至 152 億歐元，說明設備端的實際需求仍強，但 AI 資本支出能否回收，是升息環境下被重新定價的問題。留意本週 TSMC（10/15）與下週 Lam、德儀、IBM 的財報，會是檢驗 AI 需求的下一批證據。", "en": "Within tech, Apple rose more than 1% while Oracle, CoreWeave and Nebius sank, as the market separates companies funded by own cash flow from those funded by debt. ASML's Q4 guide of EUR 14.2-15.2 billion shows equipment demand is still strong, but the payback on AI capex is being repriced in a rising-rate world. TSMC (Oct. 15) and next week's Lam, Texas Instruments and IBM reports are the next evidence.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-hot-inflation-report-drops-tech-drives-sp-500-nasdaq-down-152206632.html", "stocks": [{"t": "AAPL", "n": "現金流型科技股，逆勢漲逾 1%"}, {"t": "TSM", "n": "10/15 盤前財報，AI 晶片需求的檢驗"}, {"t": "TXN", "n": "類比晶片，據行事曆預計 10/21 盤後財報"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "房屋營建：十年期 5.3% 下，Lennar 創 52 週低點", "color": "#4EABA4", "zh": "殖利率衝到 5.3% 上下，對房貸利率與購屋需求是直接壓力。Lennar（LEN）據報道在某個週一重挫 7% 到 74.44 美元、創 52 週新低，起因是 Hunterbrook 報告質疑它與 Millrose Properties 的往來（報道日期不明確，請自行確認）。同一時間 Berkshire 10/1 至 2 日買進約 1.93 億美元 Lennar 股票，兩股力量拉扯：利率壓著需求，大戶在低檔加碼。", "en": "With the 10-year near 5.3%, mortgage rates and housing demand face direct pressure. Lennar reportedly fell 7% to $74.44, a new 52-week low, after a Hunterbrook report questioned its dealings with Millrose Properties (the exact date was unclear in reports). Meanwhile Berkshire bought about $193 million of Lennar on Oct. 1-2: rates weigh on demand while a large holder adds at the lows.", "url": "https://www.thestockobserver.com/?p=8934015", "stocks": [{"t": "LEN", "n": "大型建商，創 52 週低點、Berkshire 加碼"}, {"t": "DHI", "n": "最大建商，同樣受房貸利率影響"}, {"t": "XHB", "n": "房屋營建 ETF，板塊整體"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000 單日 -1.9%：小型股對利率最敏感", "color": "#5B8ED6", "zh": "羅素 2000 週三約收 2,729.54（-1.93%，單一來源、暫定），前一天為 2,786.13。Royce 的統計顯示第三季羅素 2000 下跌 7.2%，截至 9/30 今年仍上漲 13.7%。小型股的特性是負債中浮動利率比例較高、獲利波動較大，所以十年期殖利率衝上 5.3% 時，小型股的反應通常比大型股強。這是一般性判讀，不是對今天資料的證明。", "en": "The Russell 2000 closed near 2,729.54 (-1.93%, single source, provisional) versus 2,786.13 on Tuesday. Royce says the index fell 7.2% in Q3 and was still up 13.7% for the year through Sept. 30. Small caps tend to carry more floating-rate debt and more volatile earnings, so a 10-year near 5.3% usually hits them harder than large caps. That is a general read, not proof from today's data.", "url": "https://www.royceinvest.com/insights/small-cap-recap", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，小型股基準"}, {"t": "IJR", "n": "標普 600 小型股 ETF，獲利門檻較嚴的對照"}, {"t": "VTWO", "n": "羅素 2000 的另一檔追蹤 ETF"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "區域銀行週五登場：TFC、RF、CFG、MTB 隱含波動遠高於歷史", "color": "#5B8ED6", "zh": "10/16（週五）盤前 Truist（TFC）、Regions（RF）、Citizens（CFG）、M&T（MTB）與旅行家（TRV）公布財報，選擇權隱含波動 8.0%、7.7%、7.3%、6.8%、6.5%，都明顯高於各自十年平均約 4% 至 5%。原因可以從本週看出來：BAC 營收未達、MS 交易強，加上殖利率上升同時壓縮債券損益與推升存款成本，市場對區域銀行的不確定性偏高。這些數字是 10/14 的選擇權定價，會隨價格變動。", "en": "On Friday (Oct. 16) before the open, Truist, Regions, Citizens, M&T and Travelers report. Options imply moves of 8.0%, 7.7%, 7.3%, 6.8% and 6.5%, well above their roughly 4%-5% ten-year averages. This week's mixed bank results (BAC revenue miss, MS trading strength) and rising yields, which hit bond marks and deposit costs, explain the uncertainty. Figures are Oct. 14 option pricing and will move.", "url": "https://earnings-watcher.com/wiki/earnings-implied-moves-2026-10-13", "stocks": [{"t": "KRE", "n": "區域銀行 ETF"}, {"t": "TFC", "n": "Truist，隱含波動 ±8.0%"}, {"t": "RF", "n": "Regions，隱含波動 ±7.7%"}, {"t": "CFG", "n": "Citizens，隱含波動 ±7.3%"}, {"t": "MTB", "n": "M&T Bank，隱含波動 ±6.8%"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "CoreWeave 與 Nebius：高負債 AI 雲端在高殖利率下被重新定價", "color": "#5B8ED6", "zh": "CoreWeave 週三跌約 15%、Nebius 跌約 10%，分析師的重點是它們靠大量借款購買 GPU 並出租算力，債務成本直接吃掉毛利。殖利率上升時，這類公司的再融資成本與估值都會被重算；它們屬於中型成長股，不是傳統小型股，但常被當成 AI 風險偏好的溫度計。我沒有查到兩家最新的負債與合約細節，所以這裡只談對利率的敏感度，不談基本面好壞。", "en": "CoreWeave fell about 15% and Nebius about 10%. Analysts focused on how both borrow heavily to buy GPUs and rent out compute, so debt cost eats directly into margin. Higher yields reset refinancing cost and valuation; they are mid-cap growth names rather than classic small caps, but often serve as a gauge of AI risk appetite. I found no fresh debt or contract details, so this speaks to rate sensitivity only, not fundamentals.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-hot-inflation-report-drops-tech-drives-sp-500-nasdaq-down-152206632.html", "stocks": [{"t": "CRWV", "n": "AI 算力出租商，跌約 15%"}, {"t": "NBIS", "n": "AI 雲端基礎設施商，跌約 10%"}, {"t": "SMCI", "n": "AI 伺服器廠，同屬 AI 硬體風險偏好的對照"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "Sonic Automotive：10/7 內部人買進約 129 萬美元，UBS 目標價降到 74", "color": "#5B8ED6", "zh": "汽車經銷商 Sonic Automotive（SAH）被報道有內部人在 10/7 買進約 129 萬美元股票，Investing.com 標題寫董事 Paul Rusnak，TipRanks 描述他是大股東，職稱說法不一，我沒有找到原始 Form 4，張數與價格未能確認。同一頁顯示 UBS 把目標價從 107 降到 74 美元、評級維持買進。SAH 是中小型股，內部人在目標價被大幅下修時買進，是值得追蹤的反向訊號，但不一定代表底部。", "en": "Sonic Automotive (SAH) saw an insider buy of about $1.29 million on Oct. 7. Investing.com headlined it as director Paul Rusnak while TipRanks calls him a significant holder; titles conflict, and I could not find the Form 4, so share count and price are unconfirmed. The same page shows UBS cutting its target to $74 from $107 with a Buy rating. A purchase after a steep target cut is a contrarian signal worth tracking, not proof of a bottom.", "url": "https://robinhood.com/us/en/stocks/sah/", "stocks": [{"t": "SAH", "n": "汽車經銷商，內部人 10/7 買進約 129 萬美元"}, {"t": "KMX", "n": "二手車零售同業，用於對照產業景氣"}, {"t": "AN", "n": "AutoNation，經銷商同業對照"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "判讀小型股：同叫「小型股」，羅素 2000 與標普 600 的池子不一樣", "color": "#5B8ED6", "zh": "看小型股數字時先分清楚基準：羅素 2000 依市值排名納入，包含不少尚未獲利的公司；標普 600 則要求財報有獲利才能納入，品質門檻較高。所以利率上升、融資變貴的日子，沒有獲利、要靠再融資的公司通常在羅素 2000 裡壓力較大，兩個指數的漲跌可能不同步。另外小型股買賣價差較寬、成交量薄，內部人買進或財報的股價反應常被放大，看到單日大漲大跌時，要先查成交量。這是一般性的判讀知識，不是今天的新聞。", "en": "Before reading a small-cap number, check the benchmark: the Russell 2000 is rank-based and includes many unprofitable companies, while the S&P 600 requires positive earnings to be added, a higher quality bar. On days when rates rise and financing gets pricier, unprofitable names that rely on refinancing tend to be pressured more in the Russell 2000, so the two indexes can diverge. Small caps also have wider bid-ask spreads and thinner volume, which amplifies reactions to insider buying or earnings; check volume before reading a big one-day move. This is general reading guidance, not today's news.", "url": "https://www.royceinvest.com/insights/small-cap-recap", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，含未獲利公司"}, {"t": "IJR", "n": "標普 600 ETF，要求獲利才納入"}, {"t": "VIOO", "n": "標普 600 的另一檔追蹤 ETF"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "Borr Drilling：創辦人之一 10/5–7 連三天買進約 1,800 萬美元", "color": "#C9A227", "zh": "Borr Drilling（BORR）是自升式鑽井平台（jackup）出租商。Aiman Demircan 的內部人週報指出董事 Tor Olav Trøim（公司創辦人之一）透過家族信託連續三個交易日買進，約 425 萬股、約 1,800 萬美元，成交價 4.13 至 4.31 美元，沒有 10b5-1 計畫。Q1 財報顯示 2026 全年合約覆蓋率 71%、平均日租約 13.7 萬美元；9 月 Odin 平台開始計日租，Idun 在越南的合約 Q4 起算。風險：債務重、日租跟油價落後 6 至 12 個月。（研究線索，不是投資建議。）", "en": "Borr Drilling (BORR) leases jackup rigs. Aiman Demircan's insider weekly says director Tor Olav Troim (a founder) bought on three straight sessions through a family trust: about 4.25 million shares, roughly $18 million, at $4.13-$4.31 with no 10b5-1 plan. Q1 results showed 71% of 2026 covered at an average dayrate near $137,000; the Odin rig began earning on Sept. 11 and Idun's Vietnam contract starts in Q4. Risks: heavy debt, and dayrates lag oil by 6-12 months. Research lead, not advice.", "url": "https://aimandemircan.substack.com/p/the-insider-tape-oct-610-2026", "stocks": [{"t": "BORR", "n": "自升式鑽井平台商，創辦人連三天加碼"}, {"t": "VAL", "n": "海上鑽井同業對照"}, {"t": "XOP", "n": "油氣探勘 ETF，日租與油價的上游對照"}], "status": "RADAR · 下一個驗證點 Q3 財報（日期待公告）"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "Immersion：CEO 在低檔買進約 4.1 萬股，沒有交易計畫", "color": "#C9A227", "zh": "Immersion（IMMR）以觸覺技術專利授權起家，據我所知也持有 Barnes & Noble Education 的控股股權，細節請以最新 10-Q 為準。內部人週報指出 CEO Eric Singer 10/7 的 Form 4 共約 5.8 萬股，其中 17,217 股是零元的限制性股票獎勵，不算買進；真正的公開市場買進約 4.1 萬股，分四筆以 7.11 至 7.15 美元成交，沒有 10b5-1 計畫，直接持股升到 220 萬股以上。我未能獨立確認 BNED 與分析師覆蓋數量。（研究線索，不是投資建議。）", "en": "Immersion (IMMR) built its business licensing haptics patents and, to my knowledge, holds a controlling stake in Barnes & Noble Education; check the latest 10-Q. The insider weekly says CEO Eric Singer's Oct. 7 Form 4 shows about 58,000 shares, of which 17,217 were a $0 restricted grant and not a purchase; the open-market buy was about 41,000 shares in four lots at $7.11-$7.15, no 10b5-1 plan, lifting his direct stake above 2.2 million shares. I could not independently verify the BNED holding or analyst coverage. Research lead, not advice.", "url": "https://aimandemircan.substack.com/p/the-insider-tape-oct-610-2026", "stocks": [{"t": "IMMR", "n": "觸覺專利授權公司，CEO 公開市場加碼"}, {"t": "BNED", "n": "Barnes & Noble Education，Immersion 持有的關聯公司（待確認）"}, {"t": "XSW", "n": "軟體與服務小型股 ETF，用於對照"}], "status": "RADAR · 下一個驗證點 下次財報（日期待公告）"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "Outset Medical（回鍋）：10% 大股東 10/1–2 買進約 87 萬美元，下半年要衝刺", "color": "#C9A227", "zh": "Outset Medical（OM，池內）的董事兼 10% 持有人透過 BML Investment Partners 在 10/1 至 2 日以約 3.53 至 3.88 美元買進約 87 萬美元。基本面是壓力測試：Q2 營收 3,160 萬美元只增 1%、現金約 1.51 億美元，公司仍維持 2026 年營收 1.25 億至 1.30 億美元的財測；上半年合計約 5,950 萬（我自行加總），代表下半年需要約 6,550 萬至 7,050 萬，管理層說成長集中在 Q3、Q4。風險：財測若再下修，內部人買進的意義會被沖淡。（研究線索，不是投資建議。）", "en": "Outset Medical (OM, already in the pool): a director and 10% owner bought about $870,000 on Oct. 1-2 through BML Investment Partners at roughly $3.53-$3.88. The fundamentals are the stress test: Q2 revenue of $31.6 million grew only 1% with about $151 million of cash, yet 2026 guidance of $125-130 million stands. First-half revenue is about $59.5 million by my sum, so the second half needs roughly $65.5-70.5 million, and management says growth is back-loaded. Risk: another guidance cut would dilute the insider signal. Research lead, not advice.", "url": "https://www.barchart.com/story/news/3701881/outset-medical-reports-second-quarter-2026-results", "stocks": [{"t": "OM", "n": "Tablo 血液透析系統，大股東加碼"}, {"t": "BAX", "n": "透析與醫療設備大廠，產業對照"}, {"t": "FMS", "n": "透析服務商，產業對照"}], "status": "RADAR · 下一個驗證點 11 月上旬 Q3 財報（日期待公告）"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "Anteris（回鍋）：董事約 10 萬美元買進，經導管心臟瓣膜仍在臨床驗證", "color": "#C9A227", "zh": "Anteris Technologies（AVR，池內）的一位董事在 10/6 前後買進 11,000 股、約 10.2 萬美元（約每股 9.3 美元，我自行相除）。公司做經導管主動脈瓣（TAVR），屬於由大廠主導的利基市場，關鍵是臨床與核准進度。這次只找到買進金額，沒有查到新的臨床數據或財務更新，所以這張只能算內部人訊號、尚未命中第二項訊號。風險：臨床延遲、需要再融資與稀釋。（研究線索，不是投資建議。）", "en": "Anteris Technologies (AVR, in the pool): a director bought 11,000 shares, about $102,000 (roughly $9.3 a share by my division), around Oct. 6. The company makes transcatheter aortic valves, a niche dominated by large players where clinical and approval progress is the key. I found only the purchase amount and no new clinical or financial update, so this is an insider signal without a second confirming one. Risks: trial delays, financing and dilution. Research lead, not advice.", "url": "https://simplywall.st/stocks/us/diversified-financials/nyse-rm/regional-management/news/october-2026s-best-undervalued-small-caps-with-insider-buyin", "stocks": [{"t": "AVR", "n": "經導管主動脈瓣開發商，董事加碼"}, {"t": "EW", "n": "Edwards Lifesciences，TAVR 市場龍頭對照"}, {"t": "MDT", "n": "Medtronic，TAVR 競爭者對照"}], "status": "RADAR · 下一個驗證點 下次財報與臨床進度（日期待公告）"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "Berkshire 買 Lennar：10/1–2 約 1.93 億美元，持股約 12%", "color": "#6DB56D", "zh": "Berkshire Hathaway 因持股超過 10% 提交 Form 4：10/1 買進 705,690 股 A 類、10/2 買進 1,655,866 股 A 類（均價約 78.37 至 81.90 美元），另有少量 B 類，合計約 1.926 億美元。持股升到約 2,840 萬股 A 類，約占 12%、價值近 22 億美元。這是公開市場買進、非計畫性賣出，但規模相對 Berkshire 總資產不大，也是有人在 LEN 創 52 週低點附近加碼的事實，不代表股價已見底。", "en": "Berkshire Hathaway filed a Form 4 after crossing 10%: 705,690 Class A shares on Oct. 1 and 1,655,866 on Oct. 2 (weighted averages roughly $78.37-$81.90), plus small Class B lots, about $192.6 million in all. Its stake is now about 28.4 million Class A shares, around 12% and close to $2.2 billion. These are open-market purchases, small relative to Berkshire's size, and made near Lennar's 52-week low; they do not prove a bottom.", "url": "https://parameter.io/berkshire-hathaway-increases-lennar-len-stake-to-12-with-192-6m-purchase/", "stocks": [{"t": "LEN", "n": "Lennar，Berkshire 持股約 12%"}, {"t": "DHI", "n": "同業建商對照"}, {"t": "BRK-B", "n": "Berkshire，買方"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "AgomAb：CEO、CFO 與前 Novartis 腫瘤部門主管三人同週買進", "color": "#6DB56D", "zh": "生技公司 AgomAb（AGMB）的 CEO、CFO 與一位董事（David Epstein，曾任 Novartis 腫瘤部門主管）在 10/5 至 10/7 前後陸續在公開市場買進：董事 10/5、10/6 各 5,000 股，成交價 8.57、8.70 美元；CFO 買 10,000 股（約 8.59）；CEO 買 5,000 股（約 8.48）。合計約 30 萬美元、全部是代號 P。多人同週買進比單人買進訊號強，但金額小，且是早期臨床生技，二元風險與現金續航才是重點。（研究線索，不是投資建議。）", "en": "At AgomAb (AGMB) the CEO, CFO and a director (David Epstein, a former head of Novartis Oncology) bought on the open market around Oct. 5-7: the director 5,000 shares on each of Oct. 5 and 6 at $8.57 and $8.70, the CFO 10,000 shares near $8.59, and the CEO 5,000 near $8.48, about $300,000 in total, all code P. Several buyers in one week is a stronger signal than one, but the amounts are small and this is an early-stage biotech where binary trial risk and cash runway matter most. Research lead, not advice.", "url": "https://www.sec.gov/Archives/edgar/data/0002020932/000144582626000013/primary_doc.xml", "stocks": [{"t": "AGMB", "n": "纖維化生技公司，三位內部人同週買進"}, {"t": "XBI", "n": "生技 ETF，板塊對照"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "判讀提醒：Corebridge 大股東買 3,300 萬美元，但勾了 10b5-1 計畫", "color": "#6DB56D", "zh": "Nippon Life 作為 10% 持有人，10 月初買進 Corebridge Financial（CRBG）約 3,300 萬美元，Form 4 代號是 P，看起來像買進，但勾了 10b5-1 方塊，且計畫在 8/7 就採用，等於買進時間是事先排好的。內部人週報作者因此排除這筆。判讀 Form 4 的順序：先看代號 P，再看有沒有 10b5-1 勾選，再看是董事自掏腰包還是公司獎勵股。同樣是買進，資訊量可以差很多。", "en": "Nippon Life, a 10% owner, bought about $33 million of Corebridge Financial (CRBG) in early October. The Form 4 is coded P and looks like a buy, but the 10b5-1 box is checked and the plan was adopted on Aug. 7, so the timing was pre-scheduled. The insider weekly's author excluded it. When reading a Form 4: check code P first, then whether 10b5-1 is ticked, then whether it is a personal purchase or a company grant. Similar buys can carry very different information.", "url": "https://aimandemircan.substack.com/p/the-insider-tape-oct-610-2026", "stocks": [{"t": "CRBG", "n": "保險與年金公司，Nippon Life 為大股東"}, {"t": "PRU", "n": "同業壽險公司對照"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "Pelosi 家族 8/21 申報：Bloom Energy 與 Intel 選擇權的主題押注", "color": "#B5654D", "zh": "8/21 向眾議院書記官申報的 PTR（由 Paul Pelosi 執行）揭露新增 Bloom Energy 部位，並涵蓋 Intel：7/24 買進 10,000 股 Intel（金額區間 50 萬至 100 萬美元）及履約價 50 美元、2027/6/17 到期的 50 口買權；Bloom 買權口數各報道說法不一（100 或 200 口），請以原始 PDF 為準。這個部位的假設是 AI 資料中心的電力與晶圓製造本土化。這是申報日距今近兩個月的資料，我沒有找到 10 月的新申報。", "en": "A PTR filed Aug. 21 with the House Clerk (trades by Paul Pelosi) disclosed a new Bloom Energy position and covered Intel: 10,000 Intel shares bought July 24 ($500,001-$1 million range) plus 50 call options at a $50 strike expiring June 17, 2027. Reports differ on the Bloom call count (100 or 200), so check the original PDF. The thesis is AI data-center power and domestic chip manufacturing. This is nearly two months old and I found no new October filing.", "url": "https://finance.yahoo.com/markets/stocks/articles/nancy-pelosi-disclosure-reveals-two-183432115.html", "stocks": [{"t": "BE", "n": "Bloom Energy，燃料電池供電給資料中心"}, {"t": "INTC", "n": "Intel，7/24 買進股票與長天期買權"}, {"t": "NVDA", "n": "AI 晶片龍頭，同一主題的對照"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "判讀卡：政要申報為什麼不是買賣訊號", "color": "#B5654D", "zh": "STOCK Act 允許申報延遲 45 天，所以看到的是一個半月前的決定，等你看到時價格早已不同。金額只是寬區間（例如 1,000 至 15,000 美元），沒有精確數字；許多交易由配偶或信託帳戶執行，不一定是本人決策。選擇權才是資訊量大的一類：履約價與到期日顯示對方押什麼價位、多久內，例如 2027 年到期的 Intel 買權就是一年半的主題押注。這個頻道只描述誰申報了什麼，不暗示內線，也不是跟單依據。", "en": "The STOCK Act allows a 45-day reporting lag, so you see a decision made six weeks ago at a price that has since moved. Amounts are wide ranges (e.g. $1,000-$15,000), not exact figures, and many trades are made by a spouse or trust account rather than the member. Options carry the most information: strike and expiry show the price level and time frame being bet on, as with the 2027 Intel calls. This channel only describes who reported what; it implies no insider trading and is not a copy-trade guide.", "url": "https://www.holdingsintel.com/guides/congressional-trading", "stocks": [{"t": "NANC", "n": "追蹤民主黨議員持股的 ETF，政要績效分頁的對照"}, {"t": "GOP", "n": "追蹤共和黨議員持股的 ETF"}, {"t": "SPY", "n": "基準指數 ETF"}]},
