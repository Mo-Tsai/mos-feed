/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

  {"id": "earn_1", "channel": "財報速報", "tag": "HD 與 DIS 反應", "color": "#E8786A", "zh": "Home Depot 與 Disney 週二盤前雙雙超預期，但股價都下跌。Home Depot 調整後每股盈餘 3.86 美元（預期 3.84 美元），同店銷售約增 2.2%，上調全年營收展望，收跌約 2.4%；Disney 調整後每股盈餘 1.77 美元（預期 1.68 美元），營收約 259 億美元，串流是亮點，收跌約 1.5%。週三盤前 Lowe's 接著公布，可以交叉對照家居需求。", "en": "Home Depot and Disney both beat before Tuesday's open but both stocks fell. Home Depot earned $3.86 adjusted (vs. $3.84), comparable sales rose about 2.2%, it raised its full-year sales outlook and closed down about 2.4%; Disney earned $1.77 adjusted (vs. $1.68) on revenue of about $25.9 billion, with streaming a highlight, and closed down about 1.5%. Lowe's reports before Wednesday's open and gives a cross-check on home demand.", "url": "https://financefeeds.com/dow-jones-movers-disney-revenue-rises-16-as-home-depot-comps-gain-2-2", "stocks": [{"t": "HD", "n": "EPS 3.86 美元微幅超預期，收約 -2.4%"}, {"t": "DIS", "n": "EPS 1.77 美元對 1.68 美元，收約 -1.5%"}, {"t": "LOW", "n": "週三盤前公布，可對照家居需求"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "指引決定反應", "color": "#E8786A", "zh": "週二另外幾家公司的反應全看「指引」。AECOM（ACM）調整後每股盈餘 1.63 美元並給出強勁指引，盤後漲約 6.9%；Spire（SR，公用事業）財報超預期，卻因下調 2027 財年盈餘指引而下跌；瀏覽器業者 Opera（OPRA）每股盈餘 0.34 美元也超預期，但全年營收指引偏軟，股價大跌。同一個「超預期」，三種結果。", "en": "Three more prints on Tuesday all turned on guidance. AECOM (ACM) earned $1.63 adjusted and gave strong guidance, rising about 6.9% after hours; Spire (SR) beat but fell after lowering fiscal 2027 earnings guidance; browser maker Opera (OPRA) also beat with $0.34 EPS but fell sharply on soft full-year revenue guidance. The same beat, three different outcomes.", "url": "https://www.everhint.com/earnings-reports-november-17-2026-midday-update-last-24-hours-pacific-time/", "stocks": [{"t": "ACM", "n": "調整後 EPS 1.63 美元，盤後約 +6.9%"}, {"t": "SR", "n": "超預期但下調 2027 財年盈餘指引，股價下跌"}, {"t": "OPRA", "n": "EPS 超預期但全年營收指引偏軟，股價大跌"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "零售銷售與升息", "color": "#7C6AF7", "zh": "10 月零售與餐飲銷售月增 0.2% 到 7,482 億美元（年增 6.88%），與預期相符；扣除汽車與汽油後增 0.6%，高於 0.4% 的預期。CME FedWatch 顯示 12 月升息 0.25 個百分點的機率約 95%，聖路易聯準銀行總裁 Musalem 說，在 2027 年春天之前可能需要數次升息、最多再升四次，才能讓通膨及時回到 2%。", "en": "October retail and food services sales rose 0.2% to $748.2 billion (up 6.88% year on year), in line; excluding autos and gasoline, sales rose 0.6% against a 0.4% forecast. CME FedWatch shows about a 95% chance of a quarter-point hike in December, and St. Louis Fed President Musalem said several increases, possibly as many as four more, may be needed before spring 2027 to bring inflation back to 2% in a timely way.", "url": "https://www.cnbc.com/2026/11/17/treasury-yields-bonds-inflation.html", "stocks": [{"t": "IEF", "n": "中天期美債 ETF，對升息預期最敏感"}, {"t": "KRE", "n": "區域銀行 ETF，利率與存款成本的觀察窗"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "週三 FOMC 紀要", "color": "#7C6AF7", "zh": "10 月 27 至 28 日 FOMC 會議的紀要，預定美東週三（11/18）下午 2 點公布，台灣時間是週四凌晨 3 點。當次會議維持利率不變，據報導有兩位委員（Cook 與 Hammack）主張升息而投下反對票。紀要要看的是：主張升息的人佔多少、對年底前的路徑怎麼描述，因為下一次會議在 12 月 8 至 9 日，會有新的利率預測。", "en": "The minutes of the October 27-28 FOMC meeting are due Wednesday (November 18 US time) at 2:00 p.m., which is 3 a.m. Thursday in Taipei. The meeting held rates, and according to reports two members, Cook and Hammack, dissented in favor of a hike. The minutes should show how many officials lean toward hiking and how they describe the path before the December 8-9 meeting, which brings new projections.", "url": "https://admiralmarkets.com/analytics/traders-blog/fomc-minutes-november-2026", "stocks": [{"t": "XLU", "n": "公用事業 ETF，高殖利率股對利率最敏感"}, {"t": "XLRE", "n": "房地產 ETF，同樣受長天期殖利率影響"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "晶片出口與政治", "color": "#7C6AF7", "zh": "兩個政策面因素壓著 AI 股。第一，據 CNBC，美國商務部週一公布規則，禁止把 Nvidia 晶片出租給中國公司使用，中國商務部回應「堅決反對」並威脅反制，Nvidia 的指引因此不含中國資料中心運算營收。第二，AP 提到，民主黨在期中選舉的表現讓市場擔心 AI 監管可能趨嚴。", "en": "Two policy factors weigh on AI shares. First, according to CNBC, the US Commerce Department announced a rule Monday barring the rental of Nvidia chips to Chinese companies; China's commerce ministry said it firmly opposes it and threatened countermeasures, and Nvidia's outlook excludes China data center compute revenue. Second, AP noted that Democratic gains in the midterms have raised worries about tougher AI regulation.", "url": "https://www.cnbc.com/2026/11/17/nvidia-nvda-earnings-report-q3-2027.html", "stocks": [{"t": "SMH", "n": "半導體 ETF，出口與監管消息的直接承受者"}, {"t": "KWEB", "n": "中國網路股 ETF，雲端算力受限的間接影響"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "AI 資金與 IPO", "color": "#4EABA4", "zh": "AI 股這幾個月不穩的原因，AP 列出：估值過高、利率偏高、監管風險。上週五的重挫還多了一層「融資循環」疑慮，因為 Nvidia 過去替客戶的基建提供融資，執行長離開後市場重新問這件事。Anthropic（Claude 開發商）預計週三晚間定價、週四在那斯達克以 ANT 開始交易，發行 8.25 億股、區間 70 至 78 美元，據 CNBC 引述消息人士，最終價格可能高於區間。", "en": "AP lists why AI stocks have been unstable for months: stretched valuations, higher rates and regulatory risk. Friday's rout added a financing-loop worry, since Nvidia has financed customers' infrastructure and the market is re-asking that question after its CEO left. Anthropic, maker of Claude, is expected to price Wednesday evening and begin trading Thursday on Nasdaq as ANT, offering 825 million shares in a $70-$78 range; CNBC, citing sources, said the final price is likely above the range.", "url": "https://www.cnbc.com/2026/11/16/anthropic-ipo-date-price-range.html", "stocks": [{"t": "AMZN", "n": "報導之外的背景：Anthropic 的主要投資方之一"}, {"t": "GOOGL", "n": "同為 Anthropic 的投資方之一"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "金融、航空與能源", "color": "#4EABA4", "zh": "不是只有科技股在走弱。銀行股週二下跌，理由是 AI 支出若回檔會牽動整體經濟；航空股承受油價與利率的雙重壓力，聯合航空收跌約 4%。能源方面，一份週報說能源是上週表現最差的板塊（約 -11.9%），原因是美伊和談的期待壓低油價，但荷莫茲海峽的攻擊事件又讓布蘭特停在 93 美元附近。", "en": "It was not only tech. Banks fell on the idea that an AI-spending pullback would ripple through the economy, and airlines faced both oil and rate pressure, with United down about 4%. In energy, one weekly review called it last week's worst sector (about -11.9%) as hopes for a US-Iran deal pushed crude lower, though attacks near the Strait of Hormuz have kept Brent near $93.", "url": "https://deeppressanalysis.com/en/131126", "stocks": [{"t": "XLF", "n": "金融類 ETF，銀行股週二承壓"}, {"t": "JETS", "n": "航空股 ETF，油價與利率雙重壓力"}, {"t": "XLE", "n": "能源 ETF，上週為最弱板塊之一"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "零售財報週", "color": "#4EABA4", "zh": "零售股本週迎來第一個大考：Home Depot 已公布，Target、TJX、Lowe's 週三、Walmart 週四。PYMNTS 的整理把主軸放在「被拉緊的消費者」會保護哪些支出；市場上也有人預期折扣通路（TJX、Ross）在消費降級時相對受惠。要記住的是 Walmart 8 月財報雖然超預期並上調指引，股價當天仍下跌約 10%，預期門檻比數字本身更重要。", "en": "Retail faces its first big test this week: Home Depot has reported, Target, TJX and Lowe's follow Wednesday and Walmart Thursday. PYMNTS frames it around what stretched consumers protect, and some expect off-price chains (TJX, Ross) to benefit from trading down. Keep in mind that Walmart fell about 10% after its August report even though it beat and raised, so expectations matter more than the numbers.", "url": "https://www.pymnts.com/news/retail/2026/retail-earnings-will-show-what-stretched-consumers-protect/", "stocks": [{"t": "XRT", "n": "零售 ETF，本週財報的總溫度計"}, {"t": "COST", "n": "會員制量販，日用消費需求的另一個窗口"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000：數字對不上", "color": "#5B8ED6", "zh": "羅素 2000 週一收 2,742.94 點，跌 1.70%。週二收盤有一個來源寫 2,740.17 點、跌 1.80%，但這和週一收盤的差只有約 3 點，兩個數字互相矛盾，我判斷該來源的數字不可靠，這裡不採用，等官方收盤數字確認再引用。可以確定的是：週二標普成分股約每 20 檔就有 17 檔下跌，小型股同樣承壓，但幅度要等確認。", "en": "The Russell 2000 closed Monday at 2,742.94, down 1.70%. One source puts Tuesday's close at 2,740.17, down 1.80%, but that is only about 3 points from Monday's close, so the two figures contradict each other; I judge that source unreliable and do not use it until an official close confirms. What is certain is that selling was broad on Tuesday, but the size of the small-cap move needs confirmation.", "url": "https://www.ad-hoc-news.de/boerse/news/marktberichte/russell-2000-falls-1-80-percent-to-2-740-17-as-risk-off-selling-hits-small-caps/70528782", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週二數字待官方確認"}, {"t": "IJR", "n": "小型股 ETF，另一種小型股取樣"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "HawkEye 360 逆勢大漲", "color": "#5B8ED6", "zh": "HawkEye 360（HAWK，衛星射頻偵測與地理空間情報，今年 5 月 IPO）11 月 12 日公布第三季：營收 5,930 萬美元、年增 84%，上調全年營收指引到 2.25 億至 2.27 億美元，積壓訂單 3.003 億美元，帳上現金 4.949 億美元且無負債；財報隔天股價盤中漲約 16%。反方觀點是有分析指出有機成長與國際成長在放緩，第四季隱含毛利率壓縮。", "en": "HawkEye 360 (HAWK, radio-frequency geospatial intelligence from satellites, IPO'd in May) reported Q3 on November 12: revenue of $59.3 million, up 84%, full-year revenue guidance raised to $225-227 million, backlog of $300.3 million and $494.9 million of cash with no debt; the stock rose about 16% intraday the next day. The counterpoint is that analysts flag slowing organic and international growth and implied Q4 margin compression.", "url": "https://www.fool.com/investing/2026/11/13/why-hawkeye-360-stock-took-flight-friday/", "stocks": [{"t": "HAWK", "n": "Q3 營收 +84%，現金 4.95 億美元無負債"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "小型股的指引風險", "color": "#5B8ED6", "zh": "週二兩個對比：Bridger Aerospace（BAER，滅火航空服務）每股盈餘 0.37 美元遠低於預期、下調指引並宣布策略檢討，股價大跌約 32%；Similarweb（SMWB，網站流量數據）調整後每股盈餘 0.10 美元略勝預期，並第三度上調 2026 年指引，股價漲約 9.5%。小型股的反應比大型股更極端，指引的方向決定一切。", "en": "Two contrasts Tuesday: Bridger Aerospace (BAER, aerial firefighting services) missed badly with $0.37 EPS, cut guidance and announced a strategic review, falling about 32%; Similarweb (SMWB, web traffic data) earned $0.10 adjusted, slightly ahead, and raised 2026 guidance for the third time, rising about 9.5%. Small-cap reactions are more extreme than large-cap ones, and the direction of guidance decides everything.", "url": "https://www.everhint.com/earnings-reports-november-17-2026-midday-update-last-24-hours-pacific-time/", "stocks": [{"t": "BAER", "n": "EPS 低於預期、下調指引並策略檢討，約 -32%"}, {"t": "SMWB", "n": "第三度上調 2026 指引，約 +9.5%"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "判讀：納入指數", "color": "#5B8ED6", "zh": "判讀小型股要懂「指數納入」效應。Angel Studios（ANGX）週二盤後宣布將納入羅素 2000 與羅素 3000 指數，盤後股價漲約 5.4%。原因是追蹤這些指數的基金必須在生效日前買進成分股，造成可預期的買盤，但這類漲幅多半是短期供需，不是公司基本面改變，生效日之後常常回吐。", "en": "Reading small caps means understanding index inclusion. Angel Studios (ANGX) said after Tuesday's close that it will join the Russell 2000 and Russell 3000 indexes, and its shares rose about 5.4% after hours. Funds tracking those indexes must buy the shares before the effective date, creating predictable demand, but such gains are mostly short-term supply and demand rather than a change in fundamentals, and they often fade after the effective date.", "url": "https://investing.com/news/stock-market-news/angel-studios-stock-rises-on-russell-2000-3000-inclusion-5034155", "stocks": [{"t": "ANGX", "n": "宣布納入羅素 2000，盤後約 +5.4%"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "Neocloud 的融資疑慮", "color": "#5B8ED6", "zh": "上週五（11/13）AI 新雲端業者大跌：CoreWeave 跌 8.8%、Nebius 跌 9.0%，同日費城半導體指數跌 5.1%。引爆點之一是 Nvidia 過去替客戶基建提供融資與擔保，市場擔心這種「循環融資」隨執行長離開而改變；Nscale（Nvidia 支持的雲端業者）也在修訂後的 IPO 文件中預期前九個月淨損 17 億美元，去年同期 4.33 億美元。", "en": "On Friday (11/13) AI neocloud stocks fell hard: CoreWeave dropped 8.8% and Nebius 9.0%, with the Philadelphia semiconductor index down 5.1%. One trigger was worry that Nvidia's past financing and guarantees for customers' buildouts may change after its CEO left; Nscale, a Nvidia-backed cloud provider, also amended its IPO filing to expect a nine-month net loss of $1.7 billion versus $433.3 million a year earlier.", "url": "https://www.investing.com/news/stock-market-news/neoclouds-ai-stocks-slide-again-as-nvidia-turmoil-rattles-sector-5026205", "stocks": [{"t": "CRWV", "n": "11/13 -8.8%，週二收盤持平"}, {"t": "NBIS", "n": "11/13 -9.0%，同屬 neocloud"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "Target Hospitality（新）", "color": "#C9A227", "zh": "Target Hospitality（TH，替大型工程與政府專案提供工作人員住宿，市值約 10.8 億美元）11/9 公布第三季：營收 1.291 億美元、年增 29.9%，工作人員住宿業務年增 116% 到 8,000 萬美元，調整後 EBITDA 3,420 萬美元；今年以來簽下超過 17 億美元、逾 1 萬床的多年合約，潛在商機超過 2.5 萬床。被忽視的原因：淨損擴大到 920 萬美元、資本支出約 2.46 億美元、淨槓桿升到 1.4 倍，報導稱股價在成長加速下仍被壓低；11/11 至 11/13 三位內部人買進約 60.8 萬美元。風險：槓桿與資本支出（全年 4.9 億到 5.1 億美元）。這是研究線索，不是投資建議。", "en": "Target Hospitality (TH, workforce lodging for large projects and government, market value about $1.08 billion) reported Q3 on 11/9: revenue of $129.1 million, up 29.9%, workforce hospitality up 116% to $80 million, adjusted EBITDA of $34.2 million; it has signed more than $1.7 billion of multiyear contracts covering over 10,000 beds this year, with a pipeline above 25,000 beds. Why neglected: net loss widened to $9.2 million, capex was about $246 million and net leverage rose to 1.4x, and coverage says the stock stayed depressed despite faster growth; three insiders bought about $608,000 between 11/11 and 11/13. Risk: leverage and capex ($490-510 million for the year). This is a research lead, not investment advice.", "url": "https://www.panabee.com/news/target-hospitality-earnings-q3-2026", "stocks": [{"t": "TH", "n": "Q3 營收 +29.9%，內部人買進約 60.8 萬美元"}], "status": "RADAR · 下一個驗證點 Q4 財報與新合約、槓桿變化"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "InspireMD（新・單一訊號）", "color": "#C9A227", "zh": "InspireMD（NSPR，據我所知是頸動脈支架醫材公司）11/13 有五位內部人同日買進共 700,001 股、約 45.5 萬美元：董事 Stuka 20 萬、Roubin 10 萬、Berman 5 萬美元，財務長 7.5 萬、執行長 3 萬美元。重點是五人成交價全是每股 0.65 美元，這比較像參與公司的發行或私募，而不是各自在公開市場低接，需要讀 8-K 與 Form 4 才能確定。目前只有一項訊號，列為觀察。風險：股價低於 1 美元，要留意交易所的最低股價規定與稀釋。這是研究線索，不是投資建議。", "en": "InspireMD (NSPR, to my knowledge a carotid stent device maker) had five insiders buy a combined 700,001 shares, about $455,000, on 11/13: directors Stuka $200,000, Roubin $100,000 and Berman $50,000, the CFO $75,000 and the CEO $30,000. The key detail is that all five paid exactly $0.65 a share, which looks more like participation in a company offering or placement than independent open-market buying; the 8-K and Form 4s are needed to confirm. Only one signal so far, so this is watch-only. Risk: a sub-$1 share price raises exchange minimum-price and dilution concerns. This is a research lead, not investment advice.", "url": "https://finwire.io/news/insider-trading-news/inspiremd-inc-nspr-sees-insider-buying-from-five-insiders-455001", "stocks": [{"t": "NSPR", "n": "五位內部人同價 0.65 美元買進，需確認是否為發行"}], "status": "RADAR · 單一訊號・觀察，下一個驗證點 8-K 與 Form 4 原件"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "Gentherm 後續", "color": "#C9A227", "zh": "Gentherm（THRM，池內，熱管理與座椅溫控）池內原本有一個來源衝突，現在有了答案：10/23 董事 Mascarenas 以約 26.63 美元買進 2 萬股（約 53.3 萬美元），執行長 Presley 以 26 美元買進 5,000 股（約 13 萬美元），兩筆 Form 4 都在 10/26 申報，合計約 66 萬美元，與先前的數字相符，Presley 的申報未註記 10b5-1 計畫。仍需到 EDGAR 讀原件，因為這次來源是二手整理。風險：與 Modine Performance Technologies 合併後的整合。這是研究線索，不是投資建議。", "en": "Gentherm (THRM, in the pool; thermal management and seat climate) now has an answer to an earlier source conflict: on 10/23 director Mascarenas bought 20,000 shares at about $26.63 (about $533,000) and CEO Presley bought 5,000 at $26 (about $130,000), both Form 4s filed 10/26, roughly $660,000 in total, matching the earlier figure; Presley's filing does not indicate a 10b5-1 plan. The original filings on EDGAR still need reading, since this came from secondary summaries. Risk: integrating the Modine Performance Technologies merger. This is a research lead, not investment advice.", "url": "https://kalkine.com/news/announcements/mascarenas-buys-20000-gentherm-shares-at-2663", "stocks": [{"t": "THRM", "n": "10/23 董事與執行長買進約 66 萬美元"}], "status": "RADAR · 下一個驗證點 EDGAR 原件、回購進度與 Q4 財報"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "Sky Harbour 後續", "color": "#C9A227", "zh": "Sky Harbour（SKYH，池內，商務航空機庫園區）第三季營收約 1,058 萬美元（預期約 1,055 萬），年增約 45%，上調 2026 全年營收指引到 4,400 萬至 4,800 萬美元（原 4,200 萬至 4,600 萬）；Opa-locka 園區出租率 92%，旗下製造與營建子公司取得超過 3,800 萬美元的機庫興建合約。另一面是營運現金流為 -70 萬美元、虧損仍在擴大，報導對公告日期（11/10 或 11/13）說法不一。風險：虧損與融資成本。這是研究線索，不是投資建議。", "en": "Sky Harbour (SKYH, in the pool; business-aviation hangar campuses) reported Q3 revenue of about $10.58 million (vs. about $10.55 million expected), up roughly 45%, and raised 2026 revenue guidance to $44-48 million (from $42-46 million); Opa-locka occupancy is 92%, and its construction subsidiaries won more than $38 million of hangar-building contracts. On the other side, operating cash flow was -$0.7 million and losses are still widening; sources differ on the report date (11/10 or 11/13). Risk: losses and financing costs. This is a research lead, not investment advice.", "url": "https://www.panabee.com/news/sky-harbour-earnings-q3-2026", "stocks": [{"t": "SKYH", "n": "Q3 營收約 +45%，上調全年指引，虧損仍擴大"}], "status": "RADAR · 下一個驗證點 2027 年指引與下一次 Form 4"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "Agora 後續", "color": "#C9A227", "zh": "Agora（API，池內，即時語音視訊雲服務）執行長 Zhao Bin 又有新申報：Form 4 顯示他買進 19,179 股美國存託股，約 7.83 萬美元、均價 4.08 美元，11/16 公開。這延續池內 10/27、10/29 約 13.8 萬美元的買進，是持續而小額的節奏，是否屬於 10b5-1 預先排定計畫要讀 Form 4 才知道，若是，資訊量就比一次性大筆買進低。其他高層是否跟進、Q3 財報日期仍待確認。風險：成長與獲利尚待證明。這是研究線索，不是投資建議。", "en": "Agora (API, in the pool; real-time voice and video cloud) CEO Zhao Bin filed again: a Form 4 shows he bought 19,179 ADS, about $78,300 at an average $4.08, made public 11/16. It extends the roughly $138,000 of purchases on 10/27 and 10/29 already in the pool, a steady small-size cadence; whether it is a pre-scheduled 10b5-1 plan needs the Form 4 to confirm, and if so it carries less information than a one-off large buy. Whether other executives follow and the Q3 report date remain open. Risk: growth and profitability are unproven. This is a research lead, not investment advice.", "url": "https://quantisnow.com/insight/chief-executive-officer-zhao-bin-bought-78292-worth-of-ads-6792030", "stocks": [{"t": "API", "n": "執行長再買 19,179 股，均價 4.08 美元"}], "status": "RADAR · 下一個驗證點 Q3 財報日期與其他高層是否跟進"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "Biodesix 轉弱", "color": "#C9A227", "zh": "Biodesix（BDSX，池內，肺癌診斷檢測）11/5 公布第三季：營收 2,400 萬美元、年增 10%，低於預期的 2,749 萬美元，全年營收指引從 1.08 億至 1.14 億美元下調到 1.01 億至 1.03 億美元。好的一面：檢測量年增 24% 到 19,400 件，毛利率 81%，調整後 EBITDA 虧損收窄 16% 到 390 萬美元，10 月是今年新增醫師最強的一個月。拐點證據因營收與指引而轉弱，建議在池內降級觀察。風險：業務代表人數不足與季節性。這是研究線索，不是投資建議。", "en": "Biodesix (BDSX, in the pool; lung cancer diagnostics) reported Q3 on 11/5: revenue of $24.0 million, up 10%, below the $27.49 million expected, and cut full-year revenue guidance from $108-114 million to $101-103 million. On the positive side, test volume rose 24% to 19,400, gross margin was 81%, the adjusted EBITDA loss narrowed 16% to $3.9 million, and October was its strongest month this year for new physicians. The inflection evidence has weakened on revenue and guidance, so I suggest downgrading it to watch-only in the pool. Risk: too few sales reps and seasonality. This is a research lead, not investment advice.", "url": "https://www.biospace.com/press-releases/biodesix-announces-third-quarter-2026-results-and-highlights", "stocks": [{"t": "BDSX", "n": "Q3 營收低於預期，全年指引下調，檢測量 +24%"}], "status": "RADAR · 拐點轉弱，下一個驗證點 Q4 營收與業務代表招募"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "Target Hospitality 叢集買進", "color": "#6DB56D", "zh": "Target Hospitality（TH）11/11 至 11/13 有三位內部人在公開市場買進，合計約 60.8 萬美元：執行長 Archer 11/11 以均價 11.37 美元買 27,500 股（約 31.3 萬美元），商務長 Schrenk 11/13 以 11.68 美元買 21,402 股（約 25 萬美元），董事 Patenaude 11/13 以 11.39 美元買 4,000 股（約 4.6 萬美元）。三筆都是代碼 P 的公開市場買進，且都未標示 10b5-1 計畫，這是「叢集買進」最乾淨的形態。", "en": "Three Target Hospitality (TH) insiders bought in the open market between 11/11 and 11/13, about $608,000 in total: CEO Archer bought 27,500 shares at $11.37 on 11/11 (about $313,000), Chief Commercial Officer Schrenk 21,402 at $11.68 on 11/13 (about $250,000), and director Patenaude 4,000 at $11.39 on 11/13 (about $46,000). All three are code P open-market purchases and none is marked as a 10b5-1 plan, which is the cleanest form of a cluster buy.", "url": "https://finwire.io/news/insider-trading-news/cluster-buy-at-target-hospitality-corp-three-insiders-add-608241-of-th", "stocks": [{"t": "TH", "n": "三位內部人公開市場買進，合計約 60.8 萬美元"}]},
  {"id": "insider_1", "channel": "內部人動向", "tag": "InspireMD 五人同價", "color": "#6DB56D", "zh": "InspireMD（NSPR）11/13 有五位內部人同日買進，合計 700,001 股、約 45.5 萬美元，均價都是 0.65 美元。判讀要小心：五人同日同價，通常代表他們參與的是公司的發行或私募，而不是各自在市場上買進；這種買進仍表達支持，但資訊量比「獨立挑時間點的公開市場買進」低。而且 0.65 美元的股價低於 1 美元，微型股風險很高。", "en": "Five InspireMD (NSPR) insiders bought on 11/13, a combined 700,001 shares and about $455,000, all at $0.65. Read it carefully: five people buying on the same day at the same price usually means they took part in a company offering or placement rather than buying independently in the market; it still signals support, but carries less information than open-market buys timed on their own. At $0.65, below $1, this is also a high-risk micro cap.", "url": "https://finwire.io/news/insider-trading-news/inspiremd-inc-nspr-sees-insider-buying-from-five-insiders-455001", "stocks": [{"t": "NSPR", "n": "五位內部人 11/13 同價 0.65 美元買進"}]},
  {"id": "insider_2", "channel": "內部人動向", "tag": "判讀：三種買進", "color": "#6DB56D", "zh": "同一週的申報剛好示範三種買進。叢集買進（Target Hospitality）：多人、公開市場、各自成交價不同，訊號最強；同價買進（InspireMD）：多半是參與發行，訊號較弱；定期小額買進（Agora 執行長，11/16 又買約 7.8 萬美元）：要看是否為 10b5-1 預排計畫。HubSpot 執行長 Halligan 11/13 也買進 22,985 股，金額要讀 Form 4；判讀時一律先看金額、占持股比例與是否預排。", "en": "That week's filings happen to show three kinds of buying. A cluster buy (Target Hospitality): several people, open market, different prices, the strongest signal; a same-price buy (InspireMD): usually participation in an offering, a weaker signal; steady small buys (Agora's CEO, about $78,000 more on 11/16): check whether it is a pre-scheduled 10b5-1 plan. HubSpot CEO Halligan also bought 22,985 shares on 11/13, whose amount needs the Form 4; always check size, share of holdings and whether it was pre-scheduled.", "url": "https://deeppressanalysis.com/en/131126", "stocks": [{"t": "HUBS", "n": "執行長 Halligan 11/13 買進 22,985 股"}, {"t": "API", "n": "執行長 11/16 再買約 7.8 萬美元"}]},
  {"id": "capitol_0", "channel": "政要持股", "tag": "最接近 thesis 的一組", "color": "#B5654D", "zh": "11/7 至 11/14 這週眾議院共有 88 筆交易（45 買、43 賣、70 檔股票），其中 Gilbert Cisneros 一人就有 58 筆（66%）。這週最接近「有主題」的一組是 argenx（ARGX，自體免疫生技）：三筆全是 Cisneros 的買進，其中 10/14 的一筆金額區間為 1.5 萬至 5 萬美元。整份名單的買賣幾乎對半，聚合網站的解讀是再平衡而非政策押注，所以這只能當研究線索。", "en": "In the week of 11/7 to 11/14 House members disclosed 88 trades (45 buys, 43 sells, 70 stocks), with Gilbert Cisneros alone accounting for 58 (66%). The group closest to a theme is argenx (ARGX, autoimmune biotech): all three trades are Cisneros buys, one on 10/14 in the $15,000-$50,000 range. Buys and sells across the whole list are nearly balanced, and the aggregator reads it as rebalancing rather than a policy bet, so treat it only as a research lead.", "url": "https://www.congressstock.com/articles/congressional-trades-week-of-2026-11-07", "stocks": [{"t": "ARGX", "n": "Cisneros 三筆買進，10/14 一筆區間 1.5 萬至 5 萬美元"}, {"t": "LLY", "n": "本週最常被交易的代號之一，1 買 2 賣"}]},
  {"id": "capitol_1", "channel": "政要持股", "tag": "判讀：筆數不等於信念", "color": "#B5654D", "zh": "這週的資料正好示範判讀重點。同一個人 66% 的筆數，通常是多帳戶的例行調整，不是 66% 的信念；Cisneros 一筆 STRC 賣出是 6/5 成交、11/10 才申報，晚了 158 天，超過法定 45 天；金額只有區間；HD（2 賣）、V（2 賣）被聚合網站推測為年底節稅，但那只是推測。另外，來源之間的數字也有不一致，要以眾議院書記官的 PTR 原檔為準。", "en": "This week's data illustrates how to read these filings. 66% of the count from one person is usually routine multi-account activity, not 66% conviction; one Cisneros STRC sale traded on 6/5 was filed 11/10, 158 days later and beyond the 45-day legal limit; amounts are only ranges; the aggregator guesses the HD (2 sells) and V (2 sells) moves are year-end tax planning, but that is a guess. The sources also disagree in places, so the House Clerk's original PTRs are the authority.", "url": "https://www.congressstock.com/articles/congressional-trades-week-of-2026-11-07", "stocks": [{"t": "NANC", "n": "民主黨議員持股追蹤 ETF"}, {"t": "GOP", "n": "共和黨議員持股追蹤 ETF"}]},
  {"id": "week_0", "channel": "本週事件", "tag": "總經行程", "color": "#C97DD4", "zh": "未來 5 個交易日的總經重點：週三（美東）下午 2 點公布 10 月 FOMC 會議紀要；週二的 10 月零售銷售（月增 0.2%）已經出爐；Fed 官員（Waller、Williams）連日發言，12 月 8 至 9 日會議的升息機率約 95%。其他數據（如週間的房市與景氣指標）我沒有查到可靠的日期，所以不列，建議以官方經濟行事曆為準。", "en": "The macro focus for the next five sessions: Wednesday at 2 p.m. US time, the minutes of the October FOMC meeting; Tuesday's October retail sales (up 0.2%) are already out; Fed officials (Waller, Williams) speak through the week, and the odds of a hike at the December 8-9 meeting stand near 95%. I could not find reliable dates for other data such as housing and sentiment reports, so I do not list them; check the official economic calendar.", "url": "https://www.cnbc.com/2026/11/17/treasury-yields-bonds-inflation.html", "stocks": [{"t": "XHB", "n": "住宅建築 ETF，對利率與房貸利率最敏感"}]},
  {"id": "week_1", "channel": "本週事件", "tag": "零售財報週", "color": "#C97DD4", "zh": "美東週三：Target、TJX、Lowe's 盤前，Palo Alto Networks 盤後；週四：Walmart 盤前，以及 PDD、Williams-Sonoma、Intuit、Ross Stores、Keysight、Copart。預期值：Walmart 每股盈餘約 0.64 美元（公司指引 0.62 至 0.64）、營收約 1,870 億美元；TJX 每股盈餘約 1.33 至 1.34 美元、營收約 158.4 億美元（年增約 5%）；Target 每股盈餘估計約 2.05 至 2.32 美元，各家差異很大。", "en": "US Wednesday: Target, TJX and Lowe's before the open and Palo Alto Networks after the close; Thursday: Walmart before the open, plus PDD, Williams-Sonoma, Intuit, Ross Stores, Keysight and Copart. Expectations: Walmart EPS near $0.64 (company guide $0.62-$0.64) on revenue near $187 billion; TJX EPS of about $1.33-$1.34 on revenue near $15.84 billion (up about 5%); Target EPS estimates range widely, roughly $2.05 to $2.32.", "url": "https://univest.in/blogs/walmart-home-depot-target-lowes-earnings-this-week-q3-preview-estimates-dates-november-2026", "stocks": [{"t": "WMT", "n": "週四盤前；預期 EPS 約 0.64 美元"}, {"t": "TJX", "n": "週三盤前；預期 EPS 約 1.33 至 1.34 美元"}, {"t": "TGT", "n": "週三盤前；EPS 估計 2.05 至 2.32 美元"}, {"t": "PANW", "n": "週三盤後財報"}]},
  {"id": "eval_0", "channel": "今日評估", "tag": "好財報之後的問號", "color": "#E8A838", "zh": "最值得注意的一件事：Nvidia 財報在營收、資料中心與下一季指引都明顯超預期（營收 1,158 億對 1,091 億美元；指引 1,300 億對 1,251 億美元），盤後卻只漲約 2.4% 到 4%。原因很可能是過去三天市場已經把 CEO 離開、融資循環疑慮、出口規則與 Anthropic 的大型 IPO 供給先反映進去，背景還有 5% 以上的 10 年期殖利率與約 95% 的 12 月升息機率。一個問題：當數字不再是問題，市場在折價的到底是什麼？", "en": "The one thing most worth noting: Nvidia's results were clearly ahead on revenue, data center and next-quarter guidance ($115.8 billion vs. $109.1 billion; guidance of $130 billion vs. $125.1 billion), yet shares rose only about 2.4% to 4% after hours. Over the past three days the market has likely priced in the CEO's exit, financing-loop worries, the export rule and a large Anthropic IPO supply, against a 10-year yield above 5% and about a 95% chance of a December hike. One question: when the numbers are no longer the problem, what is the market discounting?", "url": "https://www.cnbc.com/2026/11/17/nvidia-nvda-earnings-report-q3-2027.html", "stocks": [{"t": "SPY", "n": "標普 500 ETF，兩日累計約 -2.9%"}, {"t": "XLK", "n": "科技類 ETF，AI 事件週的主要承受者"}], "status": "觀察 · 11/18 FOMC 紀要、Anthropic 定價與 11/19 Walmart"},
