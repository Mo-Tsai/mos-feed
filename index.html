/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>

    --text-tertiary: #86837f; --divider: #2e2a24;

  #root { position: relative; z-index: 1; }

  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }

    {"id": "earn_0", "channel": "財報速報", "tag": "Delta 財報低於預期並下修全年，燃油是主因", "color": "#E8786A", "zh": "Delta 第三季調整後營收 175.8 億美元（年增 15.7%），略低於預期的 177.6 億；調整後每股盈餘 1.72 美元，低於 Yahoo 引用的預期 1.82 美元，也低於公司 7 月自己給的 2.00 至 2.50 美元指引。燃油支出 41 億美元，年增 62%，比 7 月預估多約 5 億美元；公司下修全年展望，並說全年燃油帳單將增加約 60 億美元。高端艙等需求強勁，仍然抵不過油價。股價收盤大致持平至小跌。", "en": "Delta's third-quarter adjusted revenue was $17.58 billion (+15.7%), a bit below the $17.76 billion expected; adjusted EPS was $1.72, below the $1.82 estimate Yahoo cited and below the company's own July guidance of $2.00 to $2.50. Fuel cost was $4.1 billion, up 62% and about $500 million above the July forecast; Delta cut its full-year outlook and said its annual fuel bill will rise by roughly $6 billion. Premium-cabin strength could not offset fuel. The stock closed roughly flat to slightly lower.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-9-dow-sp-500-nasdaq-080148117.html", "stocks": [{"t": "DAL", "n": "Delta，EPS 1.72 美元低於預期，下修全年展望"}, {"t": "UAL", "n": "聯合航空，同樣吃油價，下週財報待查"}, {"t": "JETS", "n": "航空類股 ETF，燃油成本的整體對照"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "財報季下週開跑：JPMorgan 與 Goldman 週二登場", "color": "#E8786A", "zh": "大型銀行財報週二（10/13）開跑。據 digrin 的行事曆，JPMorgan 預期每股盈餘約 5.82 美元、營收約 506 億美元，Goldman Sachs 預期每股盈餘約 16.42 美元、營收約 176 億美元；該頁多家公司時間仍標「待定」，請以公司公告為準。在十年期殖利率 5.2% 的環境下，大家看的是淨利息收入、信用成本，以及投資銀行業務有沒有回溫。", "en": "Big-bank earnings start Tuesday (Oct. 13). Per the digrin calendar, JPMorgan is expected to earn about $5.82 a share on about $50.6 billion of revenue and Goldman Sachs about $16.42 a share on about $17.6 billion; many entries on that page still say time TBD, so check company notices. With the 10-year yield near 5.2%, the focus is net interest income, credit costs and whether investment banking is recovering.", "url": "https://www.digrin.com/stocks/earnings_calendar/2026-10-13", "stocks": [{"t": "JPM", "n": "JPMorgan，週二財報，預期 EPS 約 5.82 美元"}, {"t": "GS", "n": "Goldman Sachs，週二財報，預期 EPS 約 16.42 美元"}, {"t": "XLF", "n": "金融類股 ETF，銀行財報季的整體對照"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "成本壓力同一週出現：PepsiCo 與 Delta 都下修", "color": "#E8786A", "zh": "本週兩家不同行業的大公司，財報裡講的是同一件事：成本。PepsiCo 把核心每股盈餘成長展望下修為 2.5% 至 3%，Delta 則因燃油比預期貴約 5 億美元而下修全年。一個賣零食飲料，一個賣機票，共同點是原物料與能源價格往上，而需求本身沒有崩。後面要看的是，下週的銀行與之後的消費、運輸財報，會不會出現同樣的說法。", "en": "Two large companies in different industries told the same story this week: costs. PepsiCo cut its core EPS growth outlook to 2.5% to 3%, and Delta cut its full-year view because fuel ran about $500 million above its forecast. One sells snacks and drinks, the other sells tickets; what they share is rising commodity and energy prices while demand itself has not collapsed. The question is whether next week's banks and later consumer and transport reports repeat that language.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-9-dow-sp-500-nasdaq-080148117.html", "stocks": [{"t": "PEP", "n": "PepsiCo，核心 EPS 展望下修為 2.5% 至 3%"}, {"t": "XLP", "n": "必需消費 ETF，成本轉嫁能力的整體對照"}, {"t": "XLI", "n": "工業類股 ETF，運輸與製造成本的整體對照"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "密大消費者信心 46.3，是 5 月以來新低", "color": "#7C6AF7", "zh": "密西根大學 10 月消費者信心初值降到 46.3，是 5 月以來最低；前一個月的一年期通膨預期為 4.6%。信心低落加上通膨預期偏高，是 Fed 最不想看到的組合：想壓通膨要維持高利率，但高利率又在壓抑消費。不過信心調查是情緒，不等於實際花費；下週的零售銷售（10/15）才是更硬的檢驗。", "en": "The University of Michigan's preliminary October consumer sentiment reading fell to 46.3, the lowest since May, and the prior month's one-year inflation expectation was 4.6%. Weak confidence with high inflation expectations is the combination the Fed likes least: holding rates high fights inflation but weighs on spending. Sentiment is a mood survey, not actual spending, though; next week's retail sales (Oct. 15) are the harder test.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-9-dow-sp-500-nasdaq-080148117.html", "stocks": [{"t": "XRT", "n": "零售類股 ETF，消費信心低落的直接對照"}, {"t": "XLY", "n": "非必需消費 ETF，對信心與利率最敏感"}, {"t": "TIP", "n": "抗通膨公債 ETF，通膨預期的觀察指標"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "川普成立委員會，調查 Fed 理事 Cook", "color": "#7C6AF7", "zh": "Yahoo Finance 報導，川普成立了一個委員會，調查針對 Fed 理事 Lisa Cook 的房貸詐欺指控，並由委員會建議是否有法律依據將她免職。這件事在利率最敏感的時刻出現，市場關心的不是 Cook 個人，而是 Fed 的獨立性：如果理事能被政治壓力影響，長天期殖利率與風險溢酬可能要求更高的補償。目前只是調查，尚無任何免職結果。", "en": "Yahoo Finance reported that Trump formed a committee to investigate mortgage fraud allegations against Fed governor Lisa Cook and to advise whether there is legal cause to remove her. With rates at a sensitive point, the market cares less about Cook herself than about Fed independence: if governors can be moved by political pressure, long-dated yields and risk premiums may demand more compensation. It is only an investigation so far, with no removal outcome.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-9-dow-sp-500-nasdaq-080148117.html", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，對 Fed 獨立性與期限溢酬最敏感"}, {"t": "KRE", "n": "區域銀行 ETF，對利率路徑與曲線形狀敏感"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "十年期殖利率一週：先創 2002 年來新高，再退一步", "color": "#7C6AF7", "zh": "十年期殖利率本週三盤中觸及 5.36%（2002 年來高點），週四收 5.23%，週五約 5.24% 至 5.25%，等於在高檔盤整，沒有明顯下降。債券市場週一（10/12）因哥倫布日休市，所以下一個大的利率資訊要等週三（10/14）美東上午 8:30 的 9 月 CPI。我找不到可靠的 CPI 共識預期，請到彭博或路透看最新預測。", "en": "The 10-year yield touched 5.36% intraday on Wednesday (the highest since 2002), closed at 5.23% on Thursday and sat around 5.24% to 5.25% on Friday, so it is consolidating near the high rather than falling. The bond market is closed Monday (Oct. 12) for Columbus Day, so the next big rates input is the September CPI on Wednesday (Oct. 14) at 8:30 a.m. ET. I could not find a reliable CPI consensus; check Bloomberg or Reuters for current forecasts.", "url": "https://fedratecalc.com/us-economic-calendar/october-2026/", "stocks": [{"t": "IEF", "n": "7 至 10 年期公債 ETF，十年期殖利率約 5.24%"}, {"t": "SHY", "n": "短天期公債 ETF，對升息預期最敏感"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "AI 概念反彈：OpenAI 數字出現兩種版本", "color": "#4EABA4", "zh": "週四的 AI 賣壓來自《金融時報》報導 OpenAI 年化營收約 500 億美元、比預期少約 200 億；週五彭博報導 OpenAI 預期年底前年化營收至少 700 億美元，科技股隨之反彈，軟體股也從前一輪「SaaSpocalypse」賣壓中回補。英特爾卻逆勢下跌約 2.2%。重點是：同一家公司兩份報導就能讓一個板塊一天跌、一天漲，代表 AI 交易目前由消息面主導，不是基本面單日改變。", "en": "Thursday's AI selloff came from a Financial Times report that OpenAI's annualized revenue is about $50 billion, roughly $20 billion below estimates; on Friday Bloomberg reported OpenAI expects at least $70 billion annualized by year-end, and tech rebounded while software stocks bounced from the earlier 'SaaSpocalypse' selling. Intel still fell about 2.2%. The point: two reports on one company can swing a sector down one day and up the next, so the AI trade is currently driven by headlines rather than daily fundamentals.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-9-dow-sp-500-nasdaq-080148117.html", "stocks": [{"t": "QQQ", "n": "那斯達克 100 ETF，科技股反彈的整體對照"}, {"t": "IGV", "n": "軟體類股 ETF，軟體股從賣壓中回補"}, {"t": "INTC", "n": "英特爾，逆勢約 -2.2%"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "防禦股不防禦：電信一天跌掉高股息的緩衝", "color": "#4EABA4", "zh": "電信股常被當成「領股息、波動小」的防禦選擇，但週五 T-Mobile、AT&T、Verizon 單日跌 9% 到 13%，高股息殖利率要好幾個月才能補回一天的價差。這提醒我們，防禦股也有自己的「單一風險」：當市場開始想像新進者搶客戶，估值會先被重新定價。若你以為持有電信等於避險，今天是一個很好的反例；要不要降低曝險，是各人風險承受度的事，不是這裡的建議。", "en": "Telecom stocks are often treated as a 'collect the dividend, low volatility' defensive choice, but on Friday T-Mobile, AT&T and Verizon fell 9% to 13% in a day, a drop that months of dividend yield would take a long time to repay. It is a reminder that defensive stocks carry single-name risk too: when the market imagines a new entrant taking customers, valuation reprices first. Whether to cut exposure depends on individual risk tolerance and is not advice here.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-9-dow-sp-500-nasdaq-080148117.html", "stocks": [{"t": "XLC", "n": "通訊服務類股 ETF，電信與媒體的整體對照"}, {"t": "TMUS", "n": "T-Mobile，單日約 -13%"}, {"t": "VZ", "n": "Verizon，單日約 -8.8%，高股息代表"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "能源與運輸：油價回落，但航空仍在算燃油帳", "color": "#4EABA4", "zh": "WTI 週五收在 91.66 美元（+0.19%），布蘭特約 104 美元；盤中油價回落，原因是川普說俄羅斯會立即供應超過 30 萬噸柴油，11 月起還會增加，並重申期中選舉（11/3）前不會攻擊伊朗。對航空與貨運是短線喘息，但 Delta 的財報顯示，燃油成本已經高到影響全年；Hormuz 周邊的緊張沒有解除，油價能否持續回落仍要看後續供給。", "en": "WTI settled at $91.66 on Friday (+0.19%) and Brent was around $104; oil eased intraday after Trump said Russia would immediately supply more than 300,000 tons of diesel, with more from November, and repeated that the U.S. would not attack Iran before the Nov. 3 midterms. That is short-term relief for airlines and freight, but Delta's report shows fuel costs are already high enough to affect the full year; tensions around Hormuz have not gone away, so whether oil keeps falling depends on supply.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-9-dow-sp-500-nasdaq-080148117.html", "stocks": [{"t": "XLE", "n": "能源類股 ETF，油價的受惠側"}, {"t": "USO", "n": "美國原油 ETF，WTI 收 91.66 美元"}, {"t": "FDX", "n": "聯邦快遞，貨運燃油成本的對照"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000 收 2,806.98，距 8/12 高點仍差約 7.9%", "color": "#5B8ED6", "zh": "羅素 2000 週五收 2,806.98（+0.46%），漲幅比標普 500（+0.59%）略小。以前一日 2,794.13 對應「距 8/12 高點低 8.3%」反推，高點約在 3,047，所以現在仍低約 7.9%（推算值，非官方數字）。小型股的難處很清楚：利率在 24 年高點附近，借款成本壓著它們，但大型股的指數創高又讓資金不急著轉向。", "en": "The Russell 2000 closed at 2,806.98 on Friday (+0.46%), a bit less than the S&P 500's 0.59%. Working back from Thursday's 2,794.13 and the 'down 8.3% from the Aug. 12 high' figure, the high is near 3,047, so the index is still about 7.9% below it (an estimate, not an official number). The difficulty for small caps is clear: rates are near a 24-year high and weigh on borrowing costs, while record-area large-cap indexes leave little urgency for money to rotate.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-9-dow-sp-500-nasdaq-080148117.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，指數 2,806.98（+0.46%）"}, {"t": "IJR", "n": "標普小型 600 ETF，品質較高的小型股對照"}, {"t": "KRE", "n": "區域銀行 ETF，小型股裡權重高的族群"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "Fastly、Novavax、Hims 單日大漲，各自為政", "color": "#5B8ED6", "zh": "Fastly 漲約 15.9%、Novavax 約 15.8%、Hims & Hers 約 10.2%。來源只列出漲幅，沒有逐一說明原因，三家分屬雲端邊緣運算、疫苗與遠距醫療，沒有共同主題。這種「單日漲逾一成」的小型股，隔天常見到相當比例的回吐，單日數字不能當作趨勢；比較有用的做法是去看它們的催化事件是否有營收或合約支撐。", "en": "Fastly rose about 15.9%, Novavax about 15.8% and Hims & Hers about 10.2%. The source lists the gains without explaining each, and the three span edge computing, vaccines and telehealth, so there is no shared theme. Small caps that jump 10%+ in a day often give back part of it the next session, so one day's number is not a trend; the better check is whether the catalyst is backed by revenue or contracts.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-9-dow-sp-500-nasdaq-080148117.html", "stocks": [{"t": "FSLY", "n": "Fastly，約 +15.9%"}, {"t": "NVAX", "n": "Novavax，約 +15.8%"}, {"t": "HIMS", "n": "Hims & Hers，約 +10.2%"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "AST SpaceMobile 跌約 10%：SpaceX 題材的另一面", "color": "#5B8ED6", "zh": "AST SpaceMobile（ASTS）週五跌約 10.5%，和電信三雄同一天下跌。它做的是衛星直連手機，與 SpaceX 走同一條技術路線；當市場認為 SpaceX 的行動服務可信時，同賽道的小公司不但沒有跟著受益，反而被視為更弱的競爭者。這是小型題材股常見的特性：大公司進場往往先改變估值，而不是帶來訂單。", "en": "AST SpaceMobile (ASTS) fell about 10.5% on Friday, the same day the three big carriers dropped. It works on satellite-direct-to-phone service, the same technical road as SpaceX; when the market sees SpaceX's mobile push as credible, a smaller company on that road is not lifted but viewed as a weaker competitor. It is common for theme small caps: a large entrant tends to change valuation first, not bring orders.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-october-9-dow-sp-500-nasdaq-080148117.html", "stocks": [{"t": "ASTS", "n": "AST SpaceMobile，約 -10.5%"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "小型股判讀：利率 5.2% 時，哪些比較難受", "color": "#5B8ED6", "zh": "長天期殖利率升高時，小型股受傷的路徑通常有兩條：一是浮動利率或即將到期需要再融資的債務，利息成本上升；二是估值——未來現金流的折現率變高，獲利還沒出來的成長股最吃虧。反過來，現金多、負債低、已經穩定獲利的小型股比較能撐住。看一家小公司時，先查它的利息保障倍數與債務到期時程，比看本週漲跌更有用。", "en": "When long-dated yields rise, small caps are usually hurt through two paths: floating-rate or soon-to-mature debt that must be refinanced, which raises interest costs, and valuation, since a higher discount rate hits growth names with profits still ahead the hardest. Small caps with cash, low debt and steady earnings hold up better. For any small company, check interest coverage and the debt maturity schedule before looking at this week's move.", "url": "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&type=10-Q", "stocks": [{"t": "IJR", "n": "標普小型 600 ETF，獲利門檻較高的對照"}, {"t": "VBR", "n": "小型價值 ETF，低估值小型股的對照"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "小型股判讀：漲 15% 不等於你賺到 15%", "color": "#5B8ED6", "zh": "小型股的日均成交量小，買賣價差（bid-ask spread）較寬，單日漲跌 15% 時，實際成交價常常和你在畫面上看到的差一截，進出越多、成本越高。流動性好的大型股一天可以輕鬆成交，小型股一張大單就可能自己推高股價。所以看到 Fastly、Novavax 這類單日大漲，先看成交量與價差再決定是否值得追，是比預測方向更務實的功課。", "en": "Small caps trade lower daily volume and carry wider bid-ask spreads, so on a 15% day the price you actually get can differ noticeably from the screen, and more trading means more cost. Large caps absorb big orders easily; a single large order can push a small cap on its own. When you see Fastly or Novavax jump, checking volume and spread before deciding to chase is more practical than predicting direction.", "url": "https://www.investor.gov/introduction-investing/investing-basics/glossary/bid-ask-spread", "stocks": [{"t": "FSLY", "n": "Fastly，單日約 +15.9%，成交價差的例子"}, {"t": "NVAX", "n": "Novavax，單日約 +15.8%"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "OppFi：CEO 每週小額加碼，本益比約 5 倍", "color": "#C9A227", "zh": "OppFi（OPFI）做的是讓信用較弱的消費者取得貸款的金融科技，市值約 1 億美元量級，本益比約 5.1 倍。8 月 19 日到 28 日，CEO Todd Schwartz 以每股約 7.1 至 7.2 美元多次買進，每筆約 2.5 萬美元。拐點證據有兩項：重複的內部人買進，加上 Q2 淨利 1,480 萬美元、前年同期是虧損。但風險同樣明顯：Q2 每股盈餘 0.33 美元低於預期 0.44，營收指引也低於共識。這是研究線索，不是投資建議。", "en": "OppFi (OPFI) is a fintech that lends to consumers with weaker credit, with a market cap on the order of $100 million and a P/E of about 5.1. Between Aug. 19 and Aug. 28, CEO Todd Schwartz bought repeatedly at roughly $7.10 to $7.20 a share, about $25,000 each time. Two turn-around signals: repeated insider buying, and Q2 net income of $14.8 million versus a loss a year earlier. The risks are just as plain: Q2 EPS of $0.33 missed the $0.44 estimate, and revenue guidance came in below consensus. This is a research lead, not investment advice.", "url": "https://www.insidertrades.com/alerts/nyse-opfi-insider-buying-and-selling-2026-08-28/", "stocks": [{"t": "OPFI", "n": "OppFi，CEO 8 月多次小額買進，本益比約 5.1 倍"}], "status": "RADAR · 下一個驗證點 11 月上旬 Q3 財報（日期未確認）"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "Babcock & Wilcox：賣鍋爐給資料中心，CEO 在 9.65 美元再買", "color": "#C9A227", "zh": "Babcock & Wilcox（BW）做鍋爐與發電設備，市值約 3.2 億美元。8 月 11 日它與 Siemens Energy 簽約，開始製造 20 組蒸汽渦輪發電機，對應 1GW 容量，供資料中心電力專案使用；8 月 12 日 CEO Kenneth Young 以約 9.65 美元買 7,000 股，董事 Moeller 隔天以約 9.50 美元買 5,000 股。Q2 營收 3.2 億美元、前年同期 1.39 億。風險：目前仍虧損（本益比為負），訂單要等到 2028 年才交付電力，執行風險高。這是研究線索，不是投資建議。", "en": "Babcock & Wilcox (BW) makes boilers and power equipment and has a market cap of about $320 million. On Aug. 11 it signed with Siemens Energy to start work on 20 steam turbine generator sets, matching 1 GW of capacity for data center power projects; on Aug. 12 CEO Kenneth Young bought 7,000 shares at about $9.65 and director Moeller bought 5,000 at about $9.50 the next day. Q2 revenue was $320 million versus $139 million a year earlier. Risks: it still loses money (negative P/E), and the power is not due until 2028, so execution risk is high. This is a research lead, not investment advice.", "url": "https://www.morningstar.com/news/business-wire/20260811901159/babcock-wilcox-signs-agreement-with-siemens-energy-to-commence-work-on-20-steam-turbines-for-data-center-power-generation", "stocks": [{"t": "BW", "n": "Babcock & Wilcox，與 Siemens Energy 簽 1GW 渦輪機組，CEO 買進"}], "status": "RADAR · 下一個驗證點 11 月 Q3 財報與電力專案進度"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "Orion Group：訂單 7.2 億美元，股價比 CFO 買價還低", "color": "#C9A227", "zh": "Orion Group（ORN）做海事與混凝土工程，包含疏浚、橋梁與石油碼頭。6 月底總訂單約 7.22 億美元，其中海事 5.54 億，高於去年底的 4.8 億；3 月 6 日 CFO 以約 11.85 美元買進 4,218 股。8 月下旬股價約 9.27 美元，比 CFO 的買價低。風險：Q2 海事毛利下滑並出現營業虧損，設備稼動率與客戶延期都難預測。這是研究線索，不是投資建議。", "en": "Orion Group (ORN) does marine and concrete construction, including dredging, bridges and petroleum terminals. Total backlog was about $722 million at the end of June, with marine at $554 million versus $480 million at year-end; on March 6 the CFO bought 4,218 shares at about $11.85. In late August the stock was around $9.27, below the CFO's price. Risks: Q2 marine gross profit fell and an operating loss appeared, and equipment utilization and customer delays are hard to predict. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001402829/000140282926000034/orn-20260428xex99d1.htm", "stocks": [{"t": "ORN", "n": "Orion Group，訂單約 7.22 億美元，CFO 3 月以 11.85 美元買進"}], "status": "RADAR · 下一個驗證點 11 月 Q3 財報（海事毛利是否回升）"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "Union Bankshares：Q2 盈餘 +21%，董事 8 月買 1,000 股", "color": "#C9A227", "zh": "Union Bankshares（UNB）是佛蒙特州的社區銀行，總資產 15.6 億美元。Q2 淨利 290 萬美元、每股 0.61 美元，去年同期 240 萬、0.53 美元；其中含出售分行房產的一次性收益 38 萬美元。據 InsiderTrades 標題，董事 David Scott Silverman 在 8 月底買進 1,000 股，但價位與日期我沒能確認。風險：非利息支出成長 9.3%，高於營收成長，且內部人買進金額很小。這是研究線索，不是投資建議。", "en": "Union Bankshares (UNB) is a Vermont community bank with $1.56 billion in assets. Q2 net income was $2.9 million, or $0.61 a share, versus $2.4 million and $0.53 a year earlier, including a one-time $380,000 gain on a branch property sale. An InsiderTrades headline says director David Scott Silverman bought 1,000 shares in late August, though I could not confirm price or date. Risks: noninterest expense grew 9.3%, faster than revenue, and the insider purchase is small. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0000706863/000070686326000067/exhibit9912ndqtr2026earnin.htm", "stocks": [{"t": "UNB", "n": "Union Bankshares，Q2 每股 0.61 美元，去年同期 0.53"}], "status": "RADAR · 下一個驗證點 10 月中旬 Q3 財報（日期未確認）"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "Bank of the James：上半年淨利 +69%，總資產約 10 億美元", "color": "#C9A227", "zh": "Bank of the James（BOTJ）是維吉尼亞州的社區銀行，總資產 10.41 億美元。Q2 淨利 324 萬美元、每股 0.71 美元，去年同期 270 萬、0.60 美元；上半年淨利 601 萬美元，去年同期 355 萬，主因是淨利息收入成長與非利息支出下降。董事 Jamerson 今年 2 月與 5 月有小額買進，但聚合資料有明顯錯誤，金額請以 Form 4 為準。風險：規模小、流動性低，區域銀行對利率與信用品質都敏感。這是研究線索，不是投資建議。", "en": "Bank of the James (BOTJ) is a Virginia community bank with $1.041 billion in assets. Q2 net income was $3.24 million, or $0.71 a share, versus $2.70 million and $0.60 a year earlier; first-half net income was $6.01 million versus $3.55 million, driven by higher net interest income and lower noninterest expense. Director Jamerson made small purchases in February and May, but aggregator data contain clear errors, so rely on Form 4 for amounts. Risks: small size and thin liquidity, and regional banks are sensitive to rates and credit quality. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0001275101/000127510126000023/botj-20260728xex99_1.htm", "stocks": [{"t": "BOTJ", "n": "Bank of the James，上半年淨利 601 萬美元，去年同期 355 萬"}], "status": "RADAR · 下一個驗證點 10 月底 Q3 財報（日期未確認）"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "Cardinal Infrastructure：2026 營收指引上調到 8.8 至 9 億美元", "color": "#C9A227", "zh": "池內的 Cardinal Infrastructure（CDNL）8 月 11 日公布 Q2：營收 2.269 億美元，年增 114%（有機成長 64%），並把全年營收指引上調到 8.8 億至 9 億美元，中位數增加 2.1 億；同時宣布收購亞特蘭大的 Allied Paving（年營收約 1.08 億、調整後 EBITDA 利潤率 20.3%），是今年第三筆收購。風險：Q2 淨利從 717 萬降到 468 萬，成長主要靠收購，整合與資金來源都要觀察。這是研究線索，不是投資建議。", "en": "Cardinal Infrastructure (CDNL), already in the pool, reported Q2 on Aug. 11: revenue of $226.9 million, up 114% (64% organic), and raised full-year revenue guidance to $880 million to $900 million, with the midpoint up $210 million; it also announced the acquisition of Allied Paving of Atlanta (about $108 million of annual revenue at a 20.3% adjusted EBITDA margin), its third deal this year. Risks: Q2 net income fell from $7.17 million to $4.68 million, growth leans on acquisitions, and integration and funding need watching. This is a research lead, not investment advice.", "url": "https://investors.cardinalinfrastructuregroup.com/news-releases/news-release-details/cardinal-infrastructure-group-inc-reports-second-quarter-2026", "stocks": [{"t": "CDNL", "n": "Cardinal Infrastructure，全年營收指引上調到 8.8 至 9 億美元"}], "status": "RADAR · 下一個驗證點 11 月 Q3 財報與 Allied Paving 整合"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "Five Star Bancorp：七位董事同日以 44 美元買進", "color": "#6DB56D", "zh": "7 月 22 日 Q2 財報當天，Five Star Bancorp（FSBC）至少有七位董事以每股 44 美元買進：Allbaugh 約 9.7 萬股（約 425 萬美元）、Perry-Smith 約 3.1 萬股，另有多位買 1,000 至 5,700 股。要小心的是，公司在同一時間定價了一次增資，募得約 1.306 億美元；如果董事買進是參與這次發行，訊號就比公開市場自願買進弱。這個細節要看 Form 4 的買進性質才能確認。", "en": "On July 22, the day of Q2 results, at least seven Five Star Bancorp (FSBC) directors bought at $44 a share: Allbaugh about 96,600 shares (roughly $4.25 million), Perry-Smith about 31,400 shares, and several others 1,000 to 5,700 shares. The caution is that the company priced a stock offering raising about $130.6 million at the same time; if the director buying was participation in that offering, the signal is weaker than voluntary open-market buying. The nature of each Form 4 purchase would settle that.", "url": "https://www.sec.gov/Archives/edgar/data/0001275168/000162828026049183/q22026earningsrelease.htm", "stocks": [{"t": "FSBC", "n": "Five Star Bancorp，七位董事 7/22 以 44 美元買進"}, {"t": "IAT", "n": "區域銀行 ETF，銀行股內部人行為的整體對照"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "OppFi CEO 的買法：固定節奏、固定金額", "color": "#6DB56D", "zh": "OppFi CEO Todd Schwartz 在 8 月 19 日、20 日、26 日、28 日等日期，幾乎每次買約 3,500 股、約 2.5 萬美元，價位 7.13 至 7.19 美元。這種固定節奏、固定金額的買法，比一次買大單的訊號更弱，因為可能是預先安排的計畫；但它也顯示 CEO 願意持續在公開市場投入自有資金。同期有董事賣出 28,485 股（約 20.4 萬美元），兩邊並看比較客觀。", "en": "OppFi CEO Todd Schwartz bought roughly 3,500 shares, about $25,000, on dates including Aug. 19, 20, 26 and 28 at $7.13 to $7.19. A steady rhythm and fixed size is a weaker signal than one large order because it may be pre-arranged, but it still shows the CEO putting personal money into the open market repeatedly. A director sold 28,485 shares (about $204,000) over the same period, so viewing both sides is more balanced.", "url": "https://www.insidertrades.com/alerts/nyse-opfi-insider-buying-and-selling-2026-08-28/", "stocks": [{"t": "OPFI", "n": "OppFi，CEO 8 月多次小額買進，董事同期賣出"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "Babcock & Wilcox CEO：3 月 15 美元買，8 月 9.65 美元再買", "color": "#6DB56D", "zh": "Babcock & Wilcox 的 CEO Kenneth Young 今年 3 月 18 日以約 15.14 美元買 7,000 股，8 月 12 日又以約 9.65 美元買 7,000 股，等於在股價下跌約三分之一後再加碼；董事 Moeller 8 月 13 日也以約 9.50 美元買 5,000 股。Benzinga 彙整近 90 天內部人買進共約 11.5 萬美元、沒有賣出。金額不大，且來源之間價位有出入，請以 Form 4 為準；不過「下跌後仍買」比「上漲時買」更值得多看一眼。", "en": "Babcock & Wilcox CEO Kenneth Young bought 7,000 shares at about $15.14 on March 18 and another 7,000 at about $9.65 on Aug. 12, adding after the stock fell about a third; director Moeller bought 5,000 shares at about $9.50 on Aug. 13. Benzinga totals insider buying over the last 90 days at about $115,000 with no sales. The amounts are modest and sources differ on prices, so rely on Form 4; still, buying after a decline deserves a second look more than buying into strength.", "url": "https://www.insidertrades.com/alerts/nyse-bw-insider-buying-and-selling-2026-03-19", "stocks": [{"t": "BW", "n": "Babcock & Wilcox，CEO 3 月與 8 月各買 7,000 股"}, {"t": "XLI", "n": "工業類股 ETF，發電設備題材的整體對照"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "Salazar：最新申報 28 筆交易，偏向大型價值股", "color": "#B5654D", "zh": "眾議員 Maria Elvira Salazar（佛州 27 選區）最新申報於 10/7 公開，近 90 天累計 28 筆交易，其中 19 筆買進、9 筆賣出，涉及 15 檔標的，常見的有波克夏（BRK.B）、Chubb（CB）、Carrier（CARR）與默克（MRK）。這些多是保險、工業與製藥的大型價值股，申報的金額總區間約 15.4 萬到 73.5 萬美元，單筆都不大。這只是申報事實，不代表任何操作建議。", "en": "Rep. Maria Elvira Salazar (R-Fla., FL27) published her latest filing on Oct. 7, with 28 transactions over the past 90 days, 19 buys and 9 sells, across 15 tickers, most often Berkshire Hathaway (BRK.B), Chubb (CB), Carrier (CARR) and Merck (MRK). These are mostly large value names in insurance, industrials and pharma, and the reported amounts total roughly $154,000 to $735,000, each trade small. This is a disclosure, not a recommendation.", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035562.pdf", "stocks": [{"t": "BRK.B", "n": "波克夏，Salazar 近期申報常見標的"}, {"t": "CB", "n": "Chubb，保險股，常見標的"}, {"t": "MRK", "n": "默克，Moderna 同日走高的合作夥伴"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "判讀：金額只有區間，28 筆加起來相差近五倍", "color": "#B5654D", "zh": "STOCK Act 的申報只要求寫金額區間，不是實際金額。以 Salazar 這份來說，28 筆交易加總的下限約 15.4 萬美元、上限約 73.5 萬美元，差了將近五倍，所以你無法算出她押了多少錢。再加上申報最多可延遲 45 天，等你看到時，價位早已改變。所以這個頻道看的是「結構」：買賣比例、集中度、是否在同一產業——而不是跟單訊號。", "en": "STOCK Act disclosures only require dollar ranges, not exact amounts. In Salazar's filing the 28 trades sum to a floor of about $154,000 and a ceiling of about $735,000, nearly a five-fold gap, so you cannot work out how much she committed. Disclosure can also be delayed up to 45 days, so prices have moved by the time you read it. This channel therefore reads structure — buy/sell mix, concentration, sector overlap — rather than copy-trade signals.", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035562.pdf", "stocks": [{"t": "BRK.B", "n": "波克夏，Salazar 申報裡最常見的標的之一"}]},
    {"id": "week_0", "channel": "本週事件", "tag": "下週：週三 CPI、週四零售銷售與 PPI，週一債市休市", "color": "#C97DD4", "zh": "9 月 CPI 在週三（10/14）美東上午 8:30 公布；零售銷售與 PPI 預定週四（10/15）。週一（10/12）是哥倫布日，債券市場休市，但股市照常交易。Truist 指出，這波牛市在 10/12 滿四年，累計上漲約 119%；Deutsche Bank 統計，期中選舉前一個月到後兩個月，標普 500 在過去 23 次中有 21 次上漲，但這只是歷史統計，不是預測。10/27 至 28 日是 FOMC。", "en": "September CPI comes Wednesday (Oct. 14) at 8:30 a.m. ET; retail sales and PPI are scheduled Thursday (Oct. 15). Monday (Oct. 12) is Columbus Day, so the bond market is closed while stocks trade as usual. Truist notes the bull market turns four years old on Oct. 12 with a gain of about 119%; Deutsche Bank says the S&P 500 rose in 21 of the last 23 midterm cycles, measured from one month before to two months after the election, but that is history, not a forecast. The FOMC meets Oct. 27 to 28.", "url": "https://fedratecalc.com/us-economic-calendar/october-2026/", "stocks": [{"t": "DIA", "n": "道瓊 ETF，牛市滿四年的大盤基準之一"}, {"t": "IEF", "n": "7 至 10 年期公債 ETF，CPI 週最敏感的資產"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "下週重點財報：JPMorgan、Goldman 週二，其他看行事曆", "color": "#C97DD4", "zh": "財報季由大銀行打頭陣，週二（10/13）是 JPMorgan 與 Goldman Sachs。市場想從這兩份財報讀三件事：高利率下的淨利息收入、信用成本有沒有惡化、投資銀行與交易業務的熱度。接下來幾週才輪到區域銀行與工業、消費品公司，這些公司對成本與需求的說法，會決定本週 PepsiCo、Delta 提到的成本壓力是個案還是普遍現象。", "en": "Earnings season opens with the big banks: JPMorgan and Goldman Sachs report Tuesday (Oct. 13). Investors want three things from them: net interest income at high rates, whether credit costs are worsening, and how hot investment banking and trading are. Regional banks and industrial and consumer companies follow in the coming weeks, and what they say about costs and demand will decide whether the pressure PepsiCo and Delta cited this week is isolated or broad.", "url": "https://www.digrin.com/stocks/earnings_calendar/2026-10-13", "stocks": [{"t": "JPM", "n": "JPMorgan，週二財報"}, {"t": "GS", "n": "Goldman Sachs，週二財報"}, {"t": "C", "n": "花旗，銀行財報季同週登場，日期待查"}]},
