/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>

  {"id": "earn_1", "channel": "財報速報", "tag": "埃克森與雪佛龍", "color": "#E8786A", "zh": "能源是這一天少數逆勢上漲的族群：埃克森美孚上漲 2.2%、雪佛龍上漲 2.8%，兩家第三季獲利都優於預期，受惠於伊朗戰事與烏克蘭攻擊俄羅斯煉油廠所推高的煉油利潤。埃克森事前就預告煉油獲利比第二季增加約 45 億美元、上游因油價較低減少約 13 億美元，所以真正的看點是煉油價差能撐多久。", "en": "Energy was one of the few groups to rise: Exxon Mobil gained 2.2% and Chevron 2.8% after third-quarter profits beat expectations, helped by refining margins lifted by the Iran war and Ukrainian strikes on Russian refineries. Exxon had pre-announced about $4.5 billion more refining earnings than in Q2 and roughly $1.3 billion less from upstream on lower oil prices, so the real question is how long the crack spread holds up.", "url": "https://boereport.com/2026/10/16/exxonmobil-signals-4-5-billion-refining-earnings-boost-as-margins-soar/amp/", "stocks": [{"t": "XOM", "n": "埃克森美孚，+2.2%；煉油獲利較 Q2 增約 45 億美元"}, {"t": "CVX", "n": "雪佛龍，+2.8%；Q3 獲利優於預期"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "星巴克指引", "color": "#E8786A", "zh": "星巴克下跌 1.8%：公司預告年度營收將下滑，原因是出售中國業務後不再併入那部分營收。這類下滑屬於結構性的帳面縮減而不是需求崩壞，判讀時要把剝離的營收拆出來看美國同店銷售與利潤率，才看得出本業有沒有改善。", "en": "Starbucks fell 1.8% after forecasting an annual revenue decline tied to the divestiture of its China business. This is a structural reduction in reported sales rather than a demand collapse, so the signal to watch is U.S. same-store sales and margins once the divested revenue is stripped out.", "url": "https://finance.yahoo.com/markets/stocks/articles/nasdaq-futures-sink-amazon-intel-114737736.html", "stocks": [{"t": "SBUX", "n": "星巴克，-1.8%；中國業務剝離使營收下滑"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "Fed 維持利率", "color": "#7C6AF7", "zh": "聯準會 10 月 28 日把利率維持在 3.75% 至 4.00%，這是 9 月升息之後的第一次暫停。表決是 10 比 2，理事 Cook 與 Hammack 投票主張再升 0.25 個百分點，記者會由主席 Warsh 主持。下次會議是 12 月 9 日，市場已經在計價可能升息。各來源對細節的說法略有出入，建議以聯準會聲明為準。", "en": "The Fed held rates at 3.75%–4.00% on October 28, a pause after September's hike. The vote was 10–2, with Governor Cook and Hammack dissenting in favor of another 0.25-point increase, and Chair Warsh led the press conference. The next meeting is December 9 and markets are pricing a possible hike. Sources differ slightly on details, so check the Fed statement itself.", "url": "https://admiralmarkets.com/analytics/traders-blog/fomc-october-2026-fed-holds-rates", "stocks": [{"t": "TLT", "n": "長天期美債 ETF，殖利率對升息預期最敏感"}, {"t": "KRE", "n": "區域銀行 ETF，對利率路徑與存放款利差敏感"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "通膨與殖利率", "color": "#7C6AF7", "zh": "通膨數字仍高：本站先前整理的 9 月 PCE 為 3.6%、核心 3.1%（未在今天重新驗證），這也是 Fed 內部有人主張升息的背景。十年期殖利率週五約 4.93%、較前一日回落，但仍貼近 5%，股票的折現率因此偏高，對高估值成長股最不利。", "en": "Inflation remains high: this site's earlier tally put September PCE at 3.6% and core at 3.1% (not re-verified today), the backdrop for hike dissents inside the Fed. The 10-year yield was about 4.93% on Friday, lower on the day but still near 5%, which keeps the discount rate high and weighs most on richly valued growth stocks.", "url": "https://admiralmarkets.com/analytics/traders-blog/fomc-october-2026-fed-holds-rates", "stocks": [{"t": "IEF", "n": "7 至 10 年期美債 ETF，殖利率約 4.93%"}, {"t": "VTV", "n": "價值型 ETF，高利率環境下相對成長股的對照"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "利率與科技估值", "color": "#7C6AF7", "zh": "把今天的賣壓放進利率環境看：Fed 在升息周期、十年期殖利率接近 5%，這時科技股同時面臨「折現率高」與「資本支出回報被質疑」兩股壓力，單獨一個因素不一定會造成 7.8% 的回檔，兩個疊加才會。判讀時可以看殖利率走低時科技股有沒有止穩，如果沒有，代表問題在獲利預期而不只是利率。", "en": "Put today's selling in the rate context: with the Fed in a hiking cycle and the 10-year near 5%, tech faces a high discount rate and doubts about the payback on capex at once. Either alone may not cause a 7.8% drawdown; together they can. If tech fails to stabilize when yields fall, the problem is earnings expectations rather than rates alone.", "url": "https://finance.yahoo.com/markets/stocks/articles/nasdaq-futures-sink-amazon-intel-114737736.html", "stocks": [{"t": "QQQ", "n": "那斯達克 100 ETF，距高點回落約 7.8%（綜合指數）"}, {"t": "XLK", "n": "科技類股 ETF，10 月是 2025 年 3 月以來最大月跌幅"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "科技通訊重挫", "color": "#4EABA4", "zh": "10 月的板塊分化很明顯：標普 500 科技類股錄得 2025 年 3 月以來最大的單月跌幅，通訊服務類股是 2022 年 4 月以來最大的單月跌幅，而道瓊 10 月仍上漲約 2%，能源與傳統產業撐住了價格加權指數。這個反差顯示是 AI 與大型科技在被重新定價，而不是整體景氣急轉直下。", "en": "October's divergence is stark: S&P 500 technology had its largest monthly drop since March 2025 and communication services its biggest since April 2022, yet the Dow still gained roughly 2% for the month as energy and old-economy names held up the price-weighted index. That points to a repricing of AI and big tech rather than a sudden turn in the whole economy.", "url": "https://www.freemalaysiatoday.com/category/business/2026/10/31/wall-street-closes-sharply-lower-amid-fears-of-tech-selloff", "stocks": [{"t": "XLK", "n": "科技類股 ETF，單月最大跌幅（自 2025/3）"}, {"t": "XLC", "n": "通訊服務 ETF，單月最大跌幅（自 2022/4）"}, {"t": "XLE", "n": "能源 ETF，埃克森、雪佛龍領漲"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "加密貨幣股", "color": "#4EABA4", "zh": "加密相關股票週五下跌 7.2% 至 10.6%（Coinbase、Strategy、Robinhood），Yahoo 引述報導說駭客從幣安盜走 63 億美元，比特幣同日約下跌 2.7%。這個 63 億美元的數字目前只在這一個來源看到，我另外搜尋沒有找到第二個來源佐證，請當成待確認的消息。", "en": "Crypto-linked stocks fell 7.2% to 10.6% on Friday (Coinbase, Strategy, Robinhood) after reports, cited by Yahoo, that hackers stole $6.3 billion from Binance; bitcoin slid about 2.7%. The $6.3 billion figure appears in only one source and my own search found no second confirmation, so treat it as unverified.", "url": "https://finance.yahoo.com/markets/stocks/articles/nasdaq-futures-sink-amazon-intel-114737736.html", "stocks": [{"t": "COIN", "n": "Coinbase，單日約 -7% 至 -11%"}, {"t": "MSTR", "n": "Strategy，比特幣槓桿代表"}, {"t": "HOOD", "n": "Robinhood，加密交易收入占比高"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "防禦與景氣循環", "color": "#4EABA4", "zh": "盤面上少數抗跌的是醫療與能源：禮來約上漲 3.2%、埃克森與雪佛龍上漲；景氣循環與金融則受壓，卡特彼勒約下跌 3.8%、高盛約下跌 3.6%，甲骨文約下跌 6.5%。這幾檔漲跌幅取自 TradingEconomics 的 CFD 報價，只能當近似值。", "en": "The few pockets of resilience were healthcare and energy: Eli Lilly gained about 3.2% along with Exxon and Chevron, while cyclicals and financials weakened: Caterpillar fell about 3.8%, Goldman Sachs about 3.6% and Oracle about 6.5%. These moves come from CFD quotes on TradingEconomics and are approximate.", "url": "https://tradingeconomics.com/united-states/stock-market", "stocks": [{"t": "LLY", "n": "禮來，約 +3.2%"}, {"t": "CAT", "n": "卡特彼勒，約 -3.8%"}, {"t": "GS", "n": "高盛，約 -3.6%"}, {"t": "ORCL", "n": "甲骨文，約 -6.5%"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000", "color": "#5B8ED6", "zh": "羅素 2000 週五下跌 1.66% 收 2,811.84，跌幅小於那斯達克的 2.86%，但仍是大幅下跌。我查到的最近一次紀錄高點是 8 月 12 日的 3,045.48，以此估算目前低於那個高點約 7.7%（之後是否再創高我沒有確認）。小型股對利率與信用環境特別敏感，Fed 的升息預期是主要壓力。", "en": "The Russell 2000 fell 1.66% to 2,811.84 on Friday, less than the Nasdaq's 2.86% drop but still a sizable decline. The latest record close I found was 3,045.48 on August 12, which puts the index roughly 7.7% below it (I did not confirm whether a later high was set). Small caps are especially sensitive to rates and credit conditions, and hike expectations are the main pressure.", "url": "https://finance.yahoo.com/markets/stocks/articles/nasdaq-futures-sink-amazon-intel-114737736.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週五約 -1.7%"}, {"t": "IJR", "n": "標普小型股 600 ETF，獲利門檻較嚴的對照"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "市場寬度怎麼讀", "color": "#5B8ED6", "zh": "判讀小型股要看寬度不只看指數：週五那斯達克有 1,196 檔上漲、3,622 檔下跌，紐約證交所新低 377 檔比新高 169 檔多出一倍以上。指數跌 2.86% 時，大多數個股其實跌得更多或持平，因為大型權值股與小型股的拉扯會被指數權重掩蓋。連續幾天新低檔數擴大，才代表賣壓從大型股擴散到底層。", "en": "To read small caps, look at breadth and not only the index: on Friday the Nasdaq had 1,196 advancers against 3,622 decliners, and the NYSE posted 377 new lows versus 169 new highs, more than double. Cap-weighting can mask how the typical stock fares. A multi-day expansion in new lows is what signals selling spreading from mega-caps to the broad base.", "url": "https://www.freemalaysiatoday.com/category/business/2026/10/31/wall-street-closes-sharply-lower-amid-fears-of-tech-selloff", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，寬度的觀察標的"}, {"t": "SPY", "n": "標普 500 ETF，權值股與寬度的對照"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "利率與小型股獲利", "color": "#5B8ED6", "zh": "小型股的利率敏感度主要來自兩處：一是浮動利率借款多，Fed 把利率維持在 3.75% 至 4.00%，利息成本不會很快降下來；二是市場拿來折現的殖利率接近 5%，沒有獲利的成長型小公司估值最吃虧。看小型股財報時，先看利息保障倍數與一年內到期的債務，比看營收成長更能分出誰撐得住。", "en": "Small caps' rate sensitivity comes from two places: more floating-rate debt, so interest costs will not ease soon with the Fed at 3.75%–4.00%, and a discount rate near 5% that hurts unprofitable growth names most. When reading small-cap results, interest coverage and debt maturing within a year separate survivors better than revenue growth does.", "url": "https://admiralmarkets.com/analytics/traders-blog/fomc-october-2026-fed-holds-rates", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，小型銀行與信用循環的代表"}, {"t": "IJR", "n": "標普小型股 600 ETF，要求獲利為正才納入"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "不同小型股指數的差別", "color": "#5B8ED6", "zh": "同樣叫小型股，指數差很多：羅素 2000 不要求公司有獲利，所以包含不少虧損的生技與成長股；標普小型股 600 要求最近四季與最近一季合計獲利為正，成分股品質較好。市場情緒差的時候，兩者的表現會出現落差，看到小型股「大跌」時要先確認說的是哪一個指數。", "en": "Not all small-cap indexes are alike: the Russell 2000 has no profitability screen and so holds many unprofitable biotech and growth names, while the S&P SmallCap 600 requires positive trailing-four-quarter and latest-quarter earnings, giving a higher-quality basket. In weak sentiment the two can diverge, so check which index a headline refers to.", "url": "https://finance.yahoo.com/markets/stocks/articles/nasdaq-futures-sink-amazon-intel-114737736.html", "stocks": [{"t": "VB", "n": "Vanguard 小型股 ETF，追蹤另一套小型股指數"}, {"t": "IWN", "n": "羅素 2000 價值型 ETF，含虧損較少的族群"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "Karman 回鍋", "color": "#C9A227", "zh": "Karman（KRMN）替飛彈與太空系統製造承壓艙段、整流罩與推進系統零件，是雷達池裡的名字。最新一次財報（第二季）營收 1.821 億美元、年增 58%，訂單近 5 億美元，積壓訂單約 13 億美元，全年營收指引上調到 7.3 億至 7.45 億美元。第三季財報還沒發布，下一個驗證點就是它；風險是估值已不便宜且指引排除了尚未完成的併購。這是研究線索，不是投資建議。", "en": "Karman (KRMN) makes pressure sections, fairings and propulsion components for missile and space systems and sits in the radar pool. The latest report (Q2) showed revenue of $182.1 million, up 58%, bookings near $500 million, backlog of about $1.3 billion, and full-year revenue guidance raised to $730–745 million. Q3 results are not yet out and are the next checkpoint; risks are an already full valuation and guidance that excludes a pending acquisition. This is a research lead, not investment advice.", "url": "https://www.marketbeat.com/instant-alerts/karman-q2-earnings-call-highlights-2026-08-08/", "stocks": [{"t": "KRMN", "n": "Karman，Q2 營收 +58%，積壓訂單約 13 億美元"}], "status": "RADAR · 下一個驗證點：第三季財報（日期待查）"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "Par Pacific 回鍋", "color": "#C9A227", "zh": "Par Pacific（PARR）是夏威夷、太平洋西北與懷俄明的區域煉油商，雷達池內名字。它會在 11 月 3 日收盤後發布第三季財報；上季基期有小型煉油廠豁免（SRE）的一次性貢獻，所以比較時要拆掉。埃克森預告煉油獲利大增、Gulf Coast 3-2-1 價差 9 月 22 日創 72.64 美元紀錄，說明產業順風很強，但區域煉油商的原料成本與管制風險不同。這是研究線索，不是投資建議。", "en": "Par Pacific (PARR) is a regional refiner in Hawaii, the Pacific Northwest and Wyoming and is in the radar pool. It reports Q3 after the close on November 3; last year's base includes a one-off small refinery exemption benefit that must be stripped out for comparison. Exxon's pre-announced refining jump and a record $72.64 Gulf Coast 3-2-1 crack spread on September 22 show strong industry tailwinds, though regional refiners face different feedstock and regulatory risks. This is a research lead, not investment advice.", "url": "https://finviz.com/news/401419/par-pacific-announces-third-quarter-2026-earnings-release-and-conference-call-schedule", "stocks": [{"t": "PARR", "n": "Par Pacific，11/3 收盤後發布 Q3 財報"}], "status": "RADAR · 下一個驗證點：11/3 第三季財報"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "Shoals 回鍋", "color": "#C9A227", "zh": "Shoals（SHLS）做太陽能電廠的電氣平衡系統，雷達池內名字。上季（第二季）營收 1.634 億美元略優於預期，新訂單約 2.07 億美元、訂單出貨比 1.3，積壓訂單創高到 8.014 億美元，全年營收指引 6 億至 6.4 億美元。第三季財報日期各來源不一（11 月 3 日或 11 月 10 日），要等公司確認。風險是太陽能政策與利率對專案融資的影響。這是研究線索，不是投資建議。", "en": "Shoals (SHLS) makes electrical balance-of-system products for solar plants and is in the radar pool. Last quarter's revenue of $163.4 million slightly beat expectations, new orders were about $207 million (book-to-bill 1.3), record backlog reached $801.4 million, and full-year revenue guidance is $600–640 million. The Q3 date is disputed across sources (November 3 or November 10) pending company confirmation. Risks are solar policy and rates affecting project financing. This is a research lead, not investment advice.", "url": "https://www.marketbeat.com/instant-alerts/shoals-technologies-group-nasdaqshls-posts-earnings-results-beats-expectations-by-002-eps-2026-08-04/", "stocks": [{"t": "SHLS", "n": "Shoals，積壓訂單 8.014 億美元，訂單出貨比 1.3"}], "status": "RADAR · 下一個驗證點：Q3 財報（11/3 或 11/10 待確認）"},
