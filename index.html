// ===== AZURE TTS =====
let _azToken = null, _azTokenExp = 0, _azAbort = null;
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
function azureStop() { if (_azAbort) { _azAbort.abort(); _azAbort = null; } }
async function azureSpeak(text, { rate='0%', onStart, onEnd, onError }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const voice = localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural';
  if (!key) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const token = await _getAzToken(key, region, ctrl.signal);
    const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'><voice name='${voice}'><prosody rate='${rate}'>${_xmlEsc(text)}</prosody></voice></speak>`;
    const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method:'POST', signal:ctrl.signal,
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
      body:ssml
    });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (ctrl.signal.aborted) return true;
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    if (onError) onError(e);
    return false;
  }
}

const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "大反擊", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普500 ETF，大盤單日彈 1.7%"}, {"t": "DIA", "n": "道瓊 ETF，指數大漲 613.92 點"}, {"t": "QQQ", "n": "納指 ETF，終結2.8%終結六連跌"}], "en": "U.S. stocks staged a sharp rebound Thursday, erasing Wednesday's post-Fed selloff. The Dow surged 613.92 points (+1.2%) to 52,208.06, the S&P 500 climbed 1.7% to 7,437.63, and the Nasdaq Composite jumped 2.8% to 25,122.18, snapping a six-day losing streak. Strong cloud earnings, not policy, did the heavy lifting.", "zh": "週四美股大幅反擊，將週三 Fed 按兵不動後的跌幅全數吐回。道瓊大漲 613.92 點（+1.2%）收 52,208.06，標普 500 漲 1.7% 至 7,437.63，那斯達克指數大漲 2.8% 至 25,122.18，終結六連跌。這波反擊不是因為政策轉向，而是雲端財報把信心拉了回來。", "ja": "木曜の米株は大幅反発し、水曜のFOMC後の下落を埋め戻した。ダウは613.92ポイント高（+1.2%）の52,208.06、S&P500は1.7%高の7,437.63、ナスダック総合は2.8%高の25,122.18で六連安を終了。政策ではなくクラウド決算が相場を押し上げた。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-july-30-dow-sp-500-nasdaq-treasury-yields-microsoft-082255995.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "微軟天價", "color": "#E05C5C", "stocks": [{"t": "MSFT", "n": "單日暴漲約16%，創單日市值增加紀錄"}, {"t": "SOXX", "n": "費半 ETF，晨片隨雲端財報回神"}], "en": "Microsoft was the single biggest driver of Thursday's rally, surging roughly 16% for what was reported as a record one-day market-value gain. Azure grew 43% in constant currency versus a 40.2% StreetAccount estimate, and Azure revenue topped $100 billion for the first time in fiscal 2026. Semiconductors rallied alongside it.", "zh": "微軟是週四反擊的單一最大推手，盤中暴漲約 16%，寫下被報導為創紀錄的單日市值增幅。Azure 以固定匯率計算成長 43%，高於市場預估的 40.2%，且 Azure 年營收在 2026 會計年度首度突破 1,000 億美元。晨片股隨之同步回神。", "ja": "マイクロソフトが木曜の反発を牞引し、約16%上昇して過去最大の1日あたり時価総額増加を記録したと報じられた。Azureは固定為替ベースで43%成長で市場予想の40.2%を上回り、年間売上高は初めて1,000億ドルを超えた。", "url": "https://www.cnbc.com/2026/07/29/stock-market-today-live-updates.html"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "盤後分歧", "color": "#E05C5C", "stocks": [{"t": "AMZN", "n": "盤後漲逾8%，AI 雲端需求帶動超預期"}, {"t": "AAPL", "n": "盤後跌約6%，財報超預期但指引轉弱"}], "en": "The two biggest reports landed after Thursday's close and split in opposite directions. Amazon jumped more than 8% on a Q2 beat driven by AI cloud demand, while Apple slid about 6% despite record results, after guiding cautiously on FX and supply constraints. Friday's open will be a tug-of-war between the two.", "zh": "最重要的兩份財報在週四盤後揭曉，方向完全相反。亞馬遜因 AI 雲端需求強勁、Q2 財報超預期，盤後漲逾 8%；蘋果雖然繳出紀錄數字，卻因匯率與供應限制而給出較保守的本季指引，盤後跌約 6%。週五開盤就是這兩股的拉鋸戰。", "ja": "木曜引け後に発表された2大決算は正反対だった。アマゾンはAIクラウド需要を背景に第2四半期が予想を上回り時間外で8%超上昇。一方アップルは過去最高の決算ながら、為替と供給制約を理由に慎重な見通しを示し約6%下落した。", "url": "https://www.fool.com/coverage/stock-market-today/2026/07/30/stock-market-today-july-30-amazon-soars-over-8-after-hours-on-earnings-beat/"},
    {"id": "earn_0", "channel": "財報速報", "tag": "蘋果季報", "color": "#E8786A", "stocks": [{"t": "AAPL", "n": "營收1,094億美元年增16%，盤後卻跌6%"}], "en": "Apple's fiscal Q3 was a blowout on paper: revenue of $109.4 billion (+16% YoY), net profit of $29.8 billion and EPS of $2.02, with iPhone revenue of $54.25 billion up 21.7% from a year ago. The stock still fell about 6% after hours because management flagged FX headwinds of roughly 2.5 percentage points and supply constraints for the current quarter.", "zh": "蘋果資方 Q3 財報數字非常漂亮：營收 1,094 億美元、年增 16%，淨利 298 億美元、EPS 2.02 美元，iPhone 營收 542.5 億美元、年增 21.7%。但股價盤後仍跌約 6%，因為管理層指出本季匯率將拖累成長約 2.5 個百分點，且存在供應限制。證明市場現在看的是下一季、不是上一季。", "ja": "アップルの会計Q3は売上鄘1,094億ドル（前年比+16%）、純利益298億ドル、EPS2.02ドル、iPhone売上542.5億ドル（+21.7%）と好調。ただし為替の逆風約2.5ポイントと供給制約を示唆したため、時間外で約6%下落した。", "url": "https://9to5mac.com/2026/07/30/apple-reports-q3-2026-earnings-109-4-billion-in-revenue-up-16/"},
    {"id": "earn_1", "channel": "財報速報", "tag": "多空交錯", "color": "#E8786A", "stocks": [{"t": "FTNT", "n": "資安股，billings 超預期暴漲逾12%"}, {"t": "QCOM", "n": "調整後EPS 2.21美元小幅不及預期，跌逾7%"}, {"t": "SHEL", "n": "調整後獲利 98.4 億美元，2022年以來最佳"}], "en": "Beyond the megacaps, the tape rewarded execution and punished ambiguity. Fortinet soared more than 12% as strong Q2 billings beat estimates; Qualcomm fell more than 7% on mixed results with adjusted EPS of $2.21 versus $2.23 expected; and Shell posted adjusted earnings of $9.84 billion, its best quarter since Q2 2022, beating the $8.79 billion consensus.", "zh": "除了巨頭，週四的盤勢獎勵執行力、懲罰模糊。Fortinet 因 Q2 billings（開單金額）強勁超預期暴漲逾 12%；高通因財報互有優劣、調整後 EPS 2.21 美元略低於預期的 2.23 美元，跌逾 7%；壳牌則繳出調整後獲利 98.4 億美元，優於市場預期的 87.9 億，是 2022 年 Q2 以來最佳季度。", "ja": "巨大テック以外でも選別が進んだ。フォーティネットは請求額が予想を上回り12%超上昇。クアルコムは調整後EPS2.21ドルが予想2.23ドルに届かず7%超下落。シェルは調整後利益98.4億ドルと2022年Q2以来の好決算となった。", "url": "https://www.cnbc.com/2026/07/29/stock-market-today-live-updates.html"},
    {"id": "macro_0", "channel": "總經政策", "tag": "降息拉鋸", "color": "#7C6AF7", "stocks": [{"t": "TLT", "n": "20年期公債 ETF，直接反映長端利率路徑"}, {"t": "KRE", "n": "區域銀行 ETF，利差與降息預期高度連動"}], "en": "After Wednesday's hold, the rate debate has narrowed to whether there is one more cut left this year or none at all - not to whether hikes are coming. Core PCE running near 2.8% remains the binding constraint, and until it moves convincingly toward 2%, the Fed has little room. Yields, not earnings, remain the medium-term valuation risk.", "zh": "周三按兵不動之後，利率争論已經收斂成「今年還有一碼、還是一碼都沒有」。核心 PCE 卡在 2.8% 附近是最大束縛，在它沒有明確向 2% 靠攢之前，Fed 的空間很小。對中期估值而言，真正的風險不是財報，而是殖利率還沒退下來。", "ja": "水曜の据え置き後、議論は「年内にもう1回利下げがあるか、ゼロか」に絞られている。コアPCEが2.8%付近にとどまる限りFRBの余地は小さい。中期的なバリュエーションリスクは決算ではなく高い利回りである。", "url": "https://www.goldmansachs.com/insights/articles/the-outlook-for-fed-rate-cuts-in-2026"},
    {"id": "macro_1", "channel": "總經政策", "tag": "滞脹味", "color": "#7C6AF7", "stocks": [{"t": "GLD", "n": "黃金 ETF，滞脹情境下的傳統避險部位"}, {"t": "TIP", "n": "抚通 ETF，反映市場對實質利率的定價"}], "en": "The uncomfortable part of the Fed's own June projections is the direction of travel: year-end 2026 PCE inflation was revised up 0.9 points to 3.6% while 2026 real GDP growth was cut 20bp to 2.2%. Higher inflation with slower growth is textbook stagflationary pressure, and it explains why the committee can neither cut confidently nor hike cleanly.", "zh": "Fed 自己六月預測裡最讓人不安的不是水位，而是方向：2026 年底 PCE 通膨預測被上修 0.9 個百分點至 3.6%，同時 2026 實質 GDP 成長被下調 20 個基點至 2.2%。通膨往上、成長往下，就是教科書上的滞脹壓力，也解釋了為什麼 Fed 既不能安心降息、也不能乾脆升息。", "ja": "6月SEPで懸念なのは水準より方向性だ。2026年末PCEインフレ予想は0.9ポイント引き上げられ3.6%、一方2026年の実質成長率は20bp引き下げられ2.2%。インフレ上方・成長下方は典型的なスタグフレ圧力である。", "url": "https://www.goldmansachs.com/insights/articles/the-outlook-for-fed-rate-cuts-in-2026"},
    {"id": "sector_0", "channel": "產業風向", "tag": "防禦輪動", "color": "#4EABA4", "stocks": [{"t": "XLE", "n": "能源類股 ETF，近期漲 2.84% 領先全類股"}, {"t": "XLV", "n": "醫療保健 ETF，估值歷史低檔吸引資金回流"}, {"t": "XLU", "n": "公用事業 ETF，AI 電力需求與防禦屬性雙重受惠"}], "en": "Under the index-level noise, a defensive and value tilt has been building since June. Energy has been the strongest sector, advancing about 2.84%, with Health Care, Real Estate, Consumer Staples and Utilities all posting solid gains while Technology and Industrials lagged. Analysts frame this as healthy rebalancing rather than a risk-off panic.", "zh": "在指數層級的雜訊之下，一股防禦與價值傾斜從六月就在累積。能源是最強類股，近期上漲約 2.84%，醫療保健、房地產、必需消費、公用事業同步走強，而科技與工業落後。多數分析將這視為健康的再平衡，而非恐慌性的 risk-off。", "ja": "指数の騒がしさの下で6月以降、ディフェンシブとバリューへの傾斜が進む。エネルギーが約2.84%高と最強で、ヘルスケア、不動産、生活必需品、公共事業も堅調。テクノロジーと資本財は出遅れている。", "url": "https://kalkine.com/news/premium/us-sector-performance-analysis-energy-surges-as-investors-rotate-toward-defensive-and-value-oriented-sectors"},
    {"id": "sector_1", "channel": "產業風向", "tag": "AI 資本支出", "color": "#4EABA4", "stocks": [{"t": "GOOGL", "n": "上調capex曾觸發約7%賣壓，與微軟形成對照"}, {"t": "MSFT", "n": "Azure 加速證明花錢可以換到營收"}], "en": "AI capex is no longer a single trade - the market has started grading it company by company. Alphabet's capex hike triggered a roughly 7% selloff last week, yet Microsoft's Azure acceleration and Amazon's cloud beat were rewarded aggressively. The dividing line is whether spending is visibly converting into revenue now, not whether the story is good.", "zh": "AI 資本支出已經不是一個單一交易，市場開始逐檔打分。上週 Alphabet 上調資本支出曾觸發約 7% 的賣壓，但微軟 Azure 加速與亞馬遜雲端超預期卻被大幅獎勵。分水嶻在於支出能不能現在就看到營收，而不是故事好不好聽。", "ja": "AI資本支出はもはや一括のテーマではなく、市場は企業ごとに採点し始めた。アルファベットの支出引き上げは約7%の売りを招いた一方、マイクロソフトとアマゾンは大きく報いられた。分かれ目は支出が今収益に変わっているかだ。", "url": "https://www.indexbox.io/blog/amazon-q2-2026-earnings-preview-aws-growth-and-ai-spending-in-focus/"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "23年最佳", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，今年約 +20%"}, {"t": "IJR", "n": "標普小型股600 ETF，另一個小型股曝險工具"}], "en": "The Russell 2000 is up about 20% in 2026, its best year since 2003, versus roughly 11% for the S&P 500 and just 4% for the Magnificent 7. All eleven Russell 2000 sectors finished the first half positive. The driver is investors hunting the second layer of AI beneficiaries rather than paying up for the same seven names.", "zh": "羅素 2000 指數今年上漲約 20%，是 2003 年以來最佳表現，相比之下標普 500 約 11%、七巨頭只有 4%。上半年羅素 2000 的十一個類股全數上漲。背後的驅動力是資金在找 AI 的「第二層受惠者」，而不是繼續追高同七檔巨頭。", "ja": "ラッセル2000は2026年に約20%上昇し2003年以来の好成績。S&P500の約11%、マグニフィセント7の4%を大きく上回る。上半期は11セクター全てがプラス。資金がAIの「第二層受益企業」を探していることが背景だ。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "小型晨片", "color": "#5B8ED6", "stocks": [{"t": "AEHR", "n": "晨圓測試設備，今年漲幅逾400%"}, {"t": "ICHR", "n": "半導體流體輸送模組，同樣漲逾400%"}, {"t": "MXL", "n": "類比混訊IC，同列漲幅逾400%名單"}], "en": "The small-cap rally is not evenly spread - it is heavily chip-shaped. Chip-related companies account for 16 of the Russell 2000's 50 best performers this year, including Aehr Test Systems, Ichor Holdings and MaxLinear, all of which have rallied more than 400%. That concentration is both the reason for the index's strength and its biggest single point of fragility.", "zh": "小型股的漲勢並不均勻，而是高度集中在晨片供應鏈。今年羅素 2000 前 50 強裡有 16 檔與晨片相關，包括 Aehr Test Systems、Ichor Holdings 與 MaxLinear，漲幅都超過 400%。這個集中度既是指數強勢的來源，也是最大的單一脆弱點。", "ja": "小型株の上昇は均一ではなく半導体に偏っている。今年のラッセル2000上位50銘柄のうち16銘柄が半導体関連で、Aehr、Ichor、MaxLinearはいずれも400%超上昇。この集中度は強さの源泉であり同時に脆さでもある。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "判讀知識", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素 2000 成長 ETF，偏向未獲利高成長池"}, {"t": "IWN", "n": "羅素 2000 價值 ETF，偏向有獲利的傳統標的"}], "en": "A number worth keeping: unprofitable Russell 2000 companies have surged 154% since mid-2025, dwarfing the 34% gain of profitable peers. At the same time small caps still trade around 16x earnings versus roughly 21x for SPY. Both facts are true - a genuine valuation discount and a speculative bid are running side by side, and telling them apart is the whole job.", "zh": "一個值得記住的數字：羅素 2000 裡未獲利的公司自 2025 年中已漲 154%，遠高於獲利公司的 34%。但同一時間，小型股本益比約 16 倍，仍低於 SPY 的約 21 倍。兩件事都是真的：真實的估值折價與投機性資金正在並行，能不能分辨這兩者，就是看小型股的全部功夫。", "ja": "覚えておきたい数字がある。ラッセル2000の赤字企業は2025年半ばから154%上昇し、黒字企業の34%を圧倒している。一方で小型株のPERは約16倍とSPYの約21倍を下回る。割安さと投機が並存しており、見分けることが仕事だ。", "url": "https://247wallst.com/investing/etf/2026/07/20/the-russell-2000-is-outpacing-the-sp-500-in-2026-is-it-too-late-to-buy-small-cap-etfs/"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新名單", "color": "#C9A227", "status": "RADAR · 下一個驗證點 08/04 Q2 財報（盤後）", "stocks": [{"t": "MBC", "n": "橱櫃製造商，三名內部人 11 天內連續買進"}], "en": "MasterBrand makes kitchen and bath cabinetry - about as unfashionable as a listed business gets, and priced accordingly. Three insiders bought within eleven days: CEO R. Banyard 60,000 shares on June 1, director David Petratis 11,587 on June 8, and director Philip Fracassa 5,000 on June 11. GuruFocus puts price-to-GF-Value at 0.69. Against that: Q1 2026 was a $15.4 million net loss and the all-stock merger with American Woodmark lands into a weak housing market. This is a research lead, not investment advice.", "zh": "MasterBrand 做的是廚房與浴室櫃體，在上市公司裡屬於最不時骨的那一類，估值也反映了這件事。被忽視的原因：建材產業遇上房市疲軟、媒體聲量低。什麼正在改變：三名內部人在十一天內連續市價買進——執行長 R. Banyard 於 6/1 買 6 萬股、董事 David Petratis 6/8 買 11,587 股、董事 Philip Fracassa 6/11 買 5,000 股，GuruFocus 給的價值比僅 0.69。風險與反方論點：Q1 2026 仍是 1,540 萬美元淨損，與 American Woodmark 的全股交換合併恰好撞上房市低迷，整合與需求兩個對賦同時發生。這是研究線索，不是投資建議。", "ja": "MasterBrandはキッチン・バス用キャビネットメーカーで、地味な業態のため注目度は低い。6月1日にCEOが6万株、6月8日に取締役が11,587株、6月11日に別の取締役が5,000株を購入した。GFバリュー比は0.69。一方でQ1は1,540万ドルの赤字で、American Woodmarkとの合併は住宅市場の逆風下だ。これは調査の手がかりであり投資助言ではない。", "url": "https://www.gurufocus.com/news/8897598/insider-buying-r-banyard-acquires-60000-shares-of-masterbrand-inc-mbc"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新名單", "color": "#C9A227", "status": "RADAR · 下一個驗證點：Q2 財報與策略檢討後續發展", "stocks": [{"t": "CSR", "n": "中西部公寓 REIT，一年內 5 買 0 賣"}], "en": "Centerspace owns and redevelops apartment communities in the U.S. Midwest, yields about 5.6%, and has paid dividends for 30 consecutive years. It became a contrarian setup after BTIG downgraded it when its strategic review failed to produce a buyer - the classic moment sellers leave. Meanwhile insiders have gone the other way: five buys and zero sells over the past year, including director Rodney Jones-Tyson taking 1,700 shares on June 22 and director John Schissel buying 500 at $54.90 on June 18. The risk is exactly the reason it is cheap: no buyer emerged, and Midwest apartment fundamentals still have to carry the dividend. Research lead, not investment advice.", "zh": "Centerspace 是一檔美國中西部的公寓 REIT，股息率約 5.6%，已連續發放股息 30 年。被忽視的原因：策略檢討最後沒找到買家，BTIG 隨即降評，這正是事件套利資金離場的時刻。什麼正在改變：內部人往反方向走，過去一年 5 筆買進、0 筆賣出，包括董事 Rodney Jones-Tyson 6/22 買進 1,700 股、董事 John Schissel 6/18 以 54.90 美元買 500 股。風險與反方論點：便宜的原因就是風險本身——買家沒出現，接下來只能靠中西部租賃基本面自己撐住配息。這是研究線索，不是投資建議。", "ja": "Centerspaceは米中西部の集合住宅REITで、利回り約5.6%、30年連続で配当を支払ってきた。戦略的見直しで買い手が現れずBTIGが格下げしたことで見捨てられた。一方で内部者は過去1年で5回の購入・売却ゼロ。6月22日に取締役が1,700株、6月18日に別の取締役が54.90ドルで500株を購入。リスクは買い手不在と中西部市場のファンダメンタル。調査の手がかりであり投資助言ではない。", "url": "https://www.gurufocus.com/news/8930808/insider-buying-rodney-jones-tyson-acquires-additional-shares-of-centerspace-csr"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 08/05 Q2 財報（盤後）", "stocks": [{"t": "ERII", "n": "海淡壓力交換器龍頭，8/5 盤後公布 Q2"}], "en": "An honest update on a name already in the radar pool. Energy Recovery confirmed Q2 results for August 5 after the close. Two things have deteriorated since it was added: 2026 desalination revenue guidance is $105-125 million, down from 2025 with management citing project delays, and the CO2 retail grocery business was wound down with about $1.5 million in restructuring charges and a $1.7 million goodwill impairment. That sits against the July 20 Saudi desalination contract and June insider buying. The bull case now rests entirely on backlog conversion, and August 5 is where it gets tested. Research lead, not investment advice.", "zh": "這是對雷達池內既有標的的一次誠實更新。Energy Recovery 已確認 8/5 盤後公布 Q2 財報。入池後有兩件事變差：2026 年海淡業務營收指引為 1.05–1.25 億美元，低於 2025 年，管理層直接指向專案延後；CO2 零售冷凍業務已結束，認列約 150 萬美元重組費用與 170 萬美元商譽減損。這要與 7/20 的沙烏地海淡案及六月內部人買進放在一起看。多方論點現在完全壓在「訂單能不能轉成營收」，8/5 就是驗證點。這是研究線索，不是投資建議。", "ja": "レーダープール既存銘柄の正直な更新。Energy Recoveryは8月5日引け後にQ2を発表する。組入後に2点悪化した：2026年の海水淡水化売上予想は1.05–1.25億ドルと前年割れでプロジェクト遅延が理由、CO2小売事業は撤退し約150万ドルのリストラ費用と170万ドルののれん減損を計上。強気論は受注残の収益化に尽きる。調査の手がかりであり投資助言ではない。", "url": "https://www.stocktitan.net/news/ERII/energy-recovery-to-release-second-quarter-2026-financial-s51d4hwx8k09.html"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "新名單", "color": "#C9A227", "status": "RADAR · 下一個驗證點：2026 年 10 月 Q3 財報（併購綜效）", "stocks": [{"t": "ISTR", "n": "路易安那社區銀行，營收年增64.1%但股價下跌"}], "en": "Investar Holding is the holding company for Investar Bank, a Louisiana community lender with almost no analyst following. The interesting part of Q2 is the disagreement inside the numbers: revenue rose 64.1% year over year to $36.5 million, but net income available to common shareholders was $8.9 million ($0.61 diluted) versus $11.5 million ($0.77) in Q1 - and the stock fell on the print. Most of the growth comes from integrating the January 1, 2026 Wichita Falls Bancshares acquisition, which is exactly what makes it hard to model and easy to ignore. Risks: the sequential EPS decline is real, integration costs are ongoing, and small banks still carry CRE and deposit-cost exposure. Research lead, not investment advice.", "zh": "Investar Holding 是路易安那州社區銀行 Investar Bank 的母公司，幾乎沒有分析師追蹤。Q2 最有意思的是數字內部的矛盾：營收年增 64.1% 至 3,650 萬美元，但歸屬普通股東淨利為 890 萬美元（稀釋後 EPS 0.61），低於 Q1 的 1,150 萬（0.77），財報後股價下跌。被忽視的原因：成長主要來自 2026/01/01 完成的 Wichita Falls Bancshares 併購整合，這讓模型難建、也讓人懶得看。風險與反方論點：EPS 季減是真的、整合成本還在燒、小型銀行的商用不動產曝險與存款成本壓力也沒消失。這是研究線索，不是投資建議。", "ja": "Investar Holdingはルイジアナ州のコミュニティ銀行の持株会社で、アナリストのカバレッジはほぼない。Q2は売上が前年比64.1%増の3,650万ドルとなった一方、普通株主帰属純利益は890万ドル（希薄後EPS0.61ドル）とQ1の1,150万ドル（0.77ドル）から減少し、株価は下落した。成長の多くは2026年1月1日の買収統合によるものだ。リスクは統合コストとCREエクスポージャー。調査の手がかりであり投資助言ではない。", "url": "https://www.theglobeandmail.com/investing/markets/stocks/ISTR-Q/pressreleases/3378389/investar-holding-reports-strong-q2-results-and-growth/"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "Cluster Buy", "color": "#6DB56D", "stocks": [{"t": "MBC", "n": "11 天內 3 人買進，教科書式 cluster buy"}, {"t": "CSR", "n": "一年 5 買 0 賣，連續性買進型態"}], "en": "A cluster buy means three or more distinct insiders buying on the open market within roughly 7-15 days. Research cited by insider-tracking platforms puts heavy-insider-buying stocks about 7.5 percentage points ahead of the market over the following twelve months, with the effect concentrated in small and mid caps; opportunistic purchases showed roughly 5.2% six-month alpha. The reading rule that matters: only count Form 4 transactions coded 'P', meaning the insider paid market price with their own cash - not option exercises or grants.", "zh": "所謂 cluster buy，指的是三位以上不同內部人在約 7–15 天內於公開市場買進。內部人追蹤平台引用的研究顯示，內部人大量買進的股票在後續十二個月約領先大盤 7.5 個百分點，效果集中在中小型股；機會型買進的六個月 alpha 約 5.2%。判讀提醒：只算 Form 4 上代碼為「P」的交易，那代表內部人自掖腰包以市價買入，而非選擇權執行或股票獎勵。", "ja": "クラスターバイとは、7〜15日程度の間に3人以上の異なる内部者が市場で購入することを指す。追跡プラットフォームが引く研究では、内部者購入が多い銘柄は後の12カ月で市場を約7.5ポイント上回り、効果は中小型に集中する。Form 4の「P」コードのみを数えることが重要だ。", "url": "https://markettriage.com/insider-trading-signals"},

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  const speakWord = React.useCallback(async (word) => {
    const ok = await azureSpeak(word, { rate:'-15%' });
    if (!ok) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US"; u.rate = 0.82;
      const voices = speechSynthesis.getVoices();
      const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
      if (picked) u.voice = picked;
      speechSynthesis.speak(u);
    }
  }, []);

  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      return;
    }
    setSpeaking(true);
    const ok = await azureSpeak(card.en, {
      rate: '-5%',
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
    if (!ok) {
      const u = new SpeechSynthesisUtterance(card.en);
      u.lang = "en-US"; u.rate = 0.88; u.pitch = 1.0; u.volume = 1.0;
      const tryVoices = () => {
        const voices = speechSynthesis.getVoices();
        const picked = ["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"].map(n => voices.find(v => v.name === n)).find(Boolean);
        if (picked) u.voice = picked;
      };
      if (speechSynthesis.getVoices().length > 0) tryVoices();
      else { speechSynthesis.onvoiceschanged = () => { tryVoices(); speechSynthesis.onvoiceschanged = null; }; }
      u.onend = () => setSpeaking(false);
      u.onerror = () => setSpeaking(false);
      speechSynthesis.speak(u);
    }
  }, [card.en, speaking]);

  // Stop speaking & close popup when card changes
  React.useEffect(() => {
    return () => {
      azureStop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      speechSynthesis.cancel();
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀全文"} style={{ marginLeft:"auto" }}>{speaking ? "■" : "🔊"}</button>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          {lang === "ja"
            ? <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"15px", lineHeight:1.9, color:"var(--text-secondary)", margin:0, maxWidth:"46ch", fontWeight:300 }}>{card.ja || card.en}</p>
            : <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>}
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("ja"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="ja" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="ja" ? "close ↑" : "日本語 ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev }) {
  const [copied, setCopied] = React.useState(false);

    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px" }}>

        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function SettingsPanel({ open, onClose }) {
  const [key, setKey] = React.useState(() => localStorage.getItem('mf_azureKey') || '');
  const [region, setRegion] = React.useState(() => localStorage.getItem('mf_azureRegion') || 'eastus');
  const [voice, setVoice] = React.useState(() => localStorage.getItem('mf_azureVoice') || 'en-US-AriaNeural');
  const [status, setStatus] = React.useState('');
  const save = () => {
    localStorage.setItem('mf_azureKey', key);
    localStorage.setItem('mf_azureRegion', region);
    localStorage.setItem('mf_azureVoice', voice);
    _azToken = null;
  };
  const handleSave = () => { save(); setStatus('已儲存'); setTimeout(() => setStatus(''), 2000); };
  const handleTest = async () => {
    save(); setStatus('測試中…');
    const ok = await azureSpeak('Hello, this is Azure Neural voice for Mo\'s Feed.', {
      onEnd: () => setStatus('✓ 連線成功'),
      onError: (e) => setStatus('✗ ' + (e?.message || '失敗'))
    });
    if (!ok) setStatus('✗ 請先填入 Azure Key');
  };
  if (!open) return null;
  return ReactDOM.createPortal(
    <>
      <div style={{ position:'fixed',inset:0,zIndex:149 }} onClick={onClose} />
      <div style={{ position:'fixed',top:0,right:0,bottom:0,width:'252px',background:'var(--bg-elevated)',borderLeft:'1px solid var(--divider)',zIndex:150,padding:'20px 18px',display:'flex',flexDirection:'column',gap:'14px',overflowY:'auto' }}>
        <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'4px' }}>
          <span style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.18em',textTransform:'uppercase',color:'var(--text-tertiary)' }}>Azure TTS 設定</span>
          <button onClick={onClose} style={{ background:'none',border:'none',cursor:'pointer',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'12px',padding:'0' }}>✕</button>
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Subscription Key</div>
          <input type="password" className="az-input" value={key} onChange={e=>setKey(e.target.value)} placeholder="貼上 Azure Key…" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Region</div>
          <input className="az-input" value={region} onChange={e=>setRegion(e.target.value)} placeholder="eastus" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Voice</div>
          <select className="az-input" value={voice} onChange={e=>setVoice(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="en-US-AriaNeural">Aria（女）自然流暢</option>
            <option value="en-US-JennyNeural">Jenny（女）清晰</option>
            <option value="en-US-GuyNeural">Guy（男）沉穩</option>
            <option value="en-US-DavisNeural">Davis（男）個性</option>
            <option value="en-US-TonyNeural">Tony（男）自信</option>
          </select>
        </div>
        <div style={{ display:'flex',gap:'8px' }}>
          <button onClick={handleSave} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--divider)',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>儲存</button>
          <button onClick={handleTest} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--text-secondary)',color:'var(--text-secondary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>測試</button>
        </div>
        {status && <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',color:'var(--text-tertiary)',letterSpacing:'0.1em' }}>{status}</div>}
        <div style={{ marginTop:'auto',fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.7,paddingTop:'8px',borderTop:'1px solid var(--divider)' }}>Key 存於 localStorage<br/>未設定時退回瀏覽器 TTS</div>
      </div>
    </>,
    document.body
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;

  const [resumeMsg, setResumeMsg] = useState(null);
  const lsKey = "mosfeed_Today_" + todaySub;

  // Read localStorage on tab/sub change
  React.useEffect(() => {
    const key = "mosfeed_Today_" + todaySub;
    try {
      const saved = parseInt(localStorage.getItem(key), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") go(idx + 1);
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(idx - 1);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 07/31/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v5.2</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
      >
        {atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} />
          </div>
        )}
      </div>

      {/* Nav bar */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => go(idx - 1)} disabled={idx === 0}>←</button>
        <span className="nav-count">{atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn" onClick={() => go(idx + 1)} disabled={atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
