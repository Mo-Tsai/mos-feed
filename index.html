<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "指數收盤", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普 500 ETF，週五收 7,785.76、下跌 0.2%"}, {"t": "QQQ", "n": "那斯達克 100，那指跌 0.28% 收 26,729"}, {"t": "DIA", "n": "道瓊 ETF，指數跌 0.20% 收 53,732"}], "en": "The S&P 500 slipped 0.2% on Friday to 7,785.76, easing back from Thursday's record close above 7,800. The Nasdaq Composite fell 0.28% to 26,729 and the Dow lost 0.20% to 53,732. Two data points did the damage: July retail sales fell 0.6% and the University of Michigan's preliminary August sentiment reading dropped to 51.0. Note what still happened underneath — the S&P finished the week up 0.4%, its third straight weekly gain. The daily move was a pullback, not a turn.", "zh": "標普 500 週五下跌 0.2% 收在 7,785.76 點，從週四首度站上 7,800 點的紀錄收盤回落；那斯達克綜合指數跌 0.28% 收 26,729 點，道瓊跌 0.20% 收 53,732 點。殺傷力來自兩份數據：7 月零售銷售月減 0.6%，密西根大學 8 月消費者信心初值掉到 51.0。但要看清楚底下發生的事——標普 500 這一週仍上漲 0.4%，是連續第三週收紅。單日是回檔，不是轉折。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-august-14-dow-sp-500-nasdaq-102635519.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "個股異動", "color": "#E05C5C", "stocks": [{"t": "RDDT", "n": "納入標普 500 消息激勵，盤前一度漲 12.6%、終場漲逾 10%"}, {"t": "AVB", "n": "AvalonBay，被 Reddit 取代而移出標普 500"}, {"t": "SNDK", "n": "投資人日給出長期財務展望，上漲約 7%"}], "en": "The biggest single-stock move of the day had nothing to do with earnings. Reddit jumped more than 10% after S&P Dow Jones Indices said it would join the S&P 500 before the open on 18 August, replacing AvalonBay Communities. JPMorgan estimates index funds will need to buy roughly 16.7 million shares — close to three times Reddit's average daily volume of about 5.98 million since its March 2024 debut. Elsewhere Sandisk rose about 7% after an investor day laying out a bullish long-term outlook. Index inclusion is a flow event, not a business event: the buying is mechanical and finite.", "zh": "當天最大的個股異動跟財報無關。Reddit 大漲超過 10%，原因是標普道瓊指數公司宣布它將於 8 月 18 日開盤前納入標普 500，取代 AvalonBay Communities。摩根大通估計指數型基金因此需要買進約 1,670 萬股，接近 Reddit 自 2024 年 3 月掛牌以來日均成交量 598 萬股的三倍。另一邊，SanDisk 因投資人日端出樂觀的長期財務展望上漲約 7%。要提醒的是：指數納入是資金流事件、不是生意事件，這種買盤是機械式的、而且有盡頭。", "url": "https://www.cnbc.com/2026/08/14/stocks-making-the-biggest-moves-premarket-rddt-amat-sndk-w.html"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "油價地緣", "color": "#E05C5C", "stocks": [{"t": "USO", "n": "追蹤西德州原油的 ETF，油價週五續漲 1.38% 至 82.37 美元"}, {"t": "VLO", "n": "煉油廠，中東煉能受襲時煉油價差是直接受惠方"}, {"t": "XOM", "n": "綜合能源巨頭，上下游一體的對照組"}], "en": "Oil pushed the other way on Friday. Brent rose 1.51% to $88.38 a barrel and WTI gained 1.38% to $82.37. Three things are stacked on top of each other: Iran and Oman have still not agreed terms to reopen the Strait of Hormuz, with some tankers transiting with transponders switched off; Houthi forces targeted Saudi Arabia's Jazan refinery; and the IEA warned of the widest global supply deficit in five years, projecting supply down about 4%, or 4.3 million barrels a day, this year. Higher pump prices are also exactly what the University of Michigan survey blamed for the drop in sentiment — the same barrel shows up twice, once as an energy tailwind and once as a consumer headwind.", "zh": "油價週五往反方向走。布蘭特原油上漲 1.51% 至每桶 88.38 美元，西德州中級原油漲 1.38% 至 82.37 美元。三件事疊在一起：伊朗與阿曼至今仍未就重開荷莫茲海峽談成條件，部分油輪甚至關掉船位發報器通行；胡塞武裝攻擊沙烏地阿拉伯的 Jazan 煉油廠；國際能源總署警告 2026 年全球供給缺口將是五年來最大，預估全年供給減少約 4%、相當於每日 430 萬桶。而油價推升的加油站價格，正是密大調查點名消費者信心下滑的主因——同一桶油出現兩次，一次是能源類股的順風，一次是消費者的逆風。", "url": "https://fortune.com/article/price-of-oil-08-14-2026/"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "美元與債市", "color": "#E05C5C", "stocks": [{"t": "UUP", "n": "美元指數 ETF，弱數據當日壓低美元"}, {"t": "IEF", "n": "7 至 10 年期公債 ETF，中段殖利率對數據最敏感"}, {"t": "GLD", "n": "黃金 ETF，實質利率預期下行時的受惠資產"}], "en": "The dollar fell on Friday as weak retail sales and the sentiment miss landed together. The mechanism is simple: soft data pushes out the odds of a September hike, that lowers the expected path of short rates, and a lower rate path narrows the dollar's yield advantage. Two things are worth separating here. First, this is a repricing of expectations, not of anything the Fed has actually done — the target range is unchanged at 3.50-3.75%. Second, one week of soft data has been enough to move hike odds from 50% to roughly 31% in a month, which tells you how thin the conviction on either side currently is.", "zh": "美元週五走弱，原因是疲弱的零售銷售與不如預期的消費者信心同一天落地。傳導路徑很單純：數據轉弱推遲 9 月升息的機率，短率的預期路徑因此下移，美元的利差優勢跟著縮小。這裡有兩件事要分開看。第一，這是「預期」的重新定價，不是聯準會真的做了什麼——目標區間仍維持在 3.50% 至 3.75% 沒有變動。第二，一週的疲弱數據就足以讓升息機率在一個月內從五成掉到約三成一，這說明目前市場對兩個方向的信心都很薄。", "url": "https://www.barchart.com/story/news/3853878/dollar-falls-on-weak-us-retail-sales-and-consumer-sentiment-reports"},
    {"id": "earn_0", "channel": "財報速報", "tag": "超標卻跌", "color": "#E8786A", "stocks": [{"t": "AMAT", "n": "第三季營收 91.2 億美元年增 25%，股價週五仍跌約 5%"}, {"t": "SOXX", "n": "半導體 ETF，晶圓設備支出是全族群的共同變數"}, {"t": "LRCX", "n": "科林研發，同屬晶圓製造設備的對照組"}], "en": "Applied Materials delivered a quarter that beat on every visible line and the stock still fell about 5% on Friday. Third-quarter revenue was $9.12 billion, up 25% year over year against a $9.02 billion consensus, and adjusted EPS came in at $3.50 versus $3.42 expected. Fourth-quarter guidance was the strongest part: a revenue midpoint of $10.25 billion against a $9.55 billion consensus, a gap of roughly 7%. When a company beats, guides well above consensus and the shares fall anyway, the information is not in the report — it is in what was already in the price before the report.", "zh": "應用材料交出一份每一條檯面數字都超標的財報，股價週五還是跌了約 5%。第三季營收 91.2 億美元、年增 25%，高於市場共識的 90.2 億；調整後每股盈餘 3.50 美元，也勝過預估的 3.42 美元。最強的其實是財測：第四季營收中位數 102.5 億美元，遠高於共識的 95.5 億，差距約 7%。當一家公司財報超標、財測遠超共識、股價卻仍下跌，資訊就不在這份財報裡，而在財報公布之前價格已經反映了多少。", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262107910-us-stock-pre-market-retail-sales-amat-falls-5-sndk-rises-7-tradingkey"},
    {"id": "earn_1", "channel": "財報速報", "tag": "指引下修", "color": "#E8786A", "stocks": [{"t": "GLOB", "n": "第二季小幅超標但下修全年展望，單日重挫逾 14%"}, {"t": "EPAM", "n": "同屬數位工程外包，對企業 IT 預算同樣敏感"}, {"t": "ACN", "n": "埃森哲，規模最大的顧問與數位轉型對照組"}], "en": "Globant showed the opposite failure mode. Second-quarter EPS was $1.53 against a $1.52 estimate and revenue $614.18 million against $612.64 million — technically two beats, both by a hair. The stock fell more than 14% anyway, because full-year revenue guidance was cut to $2.428-2.462 billion, implying anything from a 1.1% decline to 0.3% growth, with the margin outlook trimmed too. Read alongside Applied Materials, the pair says the same thing from both ends: this market is pricing the trajectory, not the quarter. A beat with a cut is treated worse than a miss with a raise.", "zh": "Globant 示範的是相反的失敗模式。第二季每股盈餘 1.53 美元對上預估的 1.52，營收 6.1418 億美元對上 6.1264 億——技術上兩項都超標，但都只超一點點。股價仍重挫超過 14%，原因是全年營收指引被下修到 24.28 億至 24.62 億美元，換算成年增率是從衰退 1.1% 到成長 0.3%，利潤率展望同時調降。跟應用材料擺在一起看，這兩份財報從兩端講同一件事：市場定價的是軌跡、不是這一季。超標但下修，會被罰得比未達標但上修更重。", "url": "https://investors.globant.com/2026-08-13-Globant-Reports-2026-Second-Quarter-Financial-Results"},
    {"id": "earn_2", "channel": "財報速報", "tag": "破紀錄仍跌", "color": "#E8786A", "stocks": [{"t": "CSCO", "n": "會計年度第四季營收 172.5 億美元創紀錄，盤後仍下跌"}, {"t": "ANET", "n": "Arista Networks，資料中心網路設備的直接競爭者"}, {"t": "JNPR", "n": "瞻博網路，企業與電信網路設備的對照組"}], "en": "The week's third example was Cisco. Fiscal fourth-quarter revenue of $17.25 billion beat the $16.82 billion consensus and capped record annual results; adjusted EPS of $1.22 topped the $1.17 estimate; and the company returned $3.2 billion to shareholders through buybacks and dividends in the quarter. The stock fell after hours regardless. Three companies in one week — Applied Materials, Cisco and, from the other direction, Globant — all made the same point: in the final stretch of second-quarter earnings season, the beat itself has stopped being the trade.", "zh": "本週的第三個例子是思科。會計年度第四季營收 172.5 億美元，高於市場共識的 168.2 億，為全年寫下紀錄；調整後每股盈餘 1.22 美元也勝過預估的 1.17 美元；公司當季還透過庫藏股與股利回饋股東 32 億美元。股價盤後照樣下跌。一週之內三家公司——應用材料、思科，加上反方向的 Globant——講的是同一件事：在第二季財報季的最後一段，「超標」本身已經不再是可以拿來交易的東西。", "url": "https://qz.com/cisco-earnings-q4-2026-record-results-stock-drops-081326"},
    {"id": "macro_0", "channel": "總經政策", "tag": "零售銷售", "color": "#7C6AF7", "stocks": [{"t": "XRT", "n": "零售業 ETF，零售銷售數據的直接對應"}, {"t": "WMT", "n": "沃爾瑪，8 月 20 日盤前財報將提供第一手驗證"}, {"t": "TGT", "n": "目標百貨，8 月 19 日財報，中價位非必需零售讀數"}], "en": "July retail sales fell 0.6%, following an unrevised 0.2% gain in June. It is the first decline in nine months and the largest in fourteen. Three forces are named in the report: high interest rates, rising energy prices and a cooling labour market. What makes this print heavier than the price data earlier in the week is that CPI and PPI measure prices, while retail sales measures behaviour — this is the first hard evidence that the consumer is not just paying more but actually buying less.", "zh": "7 月零售銷售月減 0.6%，前一個月為未修正的成長 0.2%。這是九個月來第一次下滑，也是十四個月來最大的跌幅。報告點名的三個壓力來源是：高利率、上漲的能源價格，以及降溫中的就業市場。這份數據比本週稍早的物價數據更重的原因在於：消費者物價與生產者物價量的是價格，零售銷售量的是行為——這是第一份硬證據，說明消費者不只是付得更多，而是真的買得更少了。", "url": "https://finance.yahoo.com/economy/articles/us-retail-sales-unexpectedly-fall-123738457.html"},
    {"id": "macro_1", "channel": "總經政策", "tag": "消費者信心", "color": "#7C6AF7", "stocks": [{"t": "XLY", "n": "非必需消費 ETF，信心走弱時最先受壓的族群"}, {"t": "XLP", "n": "必需消費 ETF，生活成本上升時的防禦端"}], "en": "The University of Michigan's preliminary August consumer sentiment index fell to 51.0 from 55.2 in July, ending two straight months of improvement. The survey attributes the drop to higher gasoline prices creating a cost-of-living squeeze that keeps inflation at the front of consumers' minds. Note how this connects to the oil card: the same crude strength that put energy in the leading sector quadrant is what is grinding down household sentiment. Sentiment surveys are soft data and often overstate the swing, but arriving on the same morning as a 0.6% retail sales drop, they point the same way.", "zh": "密西根大學 8 月消費者信心指數初值從 7 月的 55.2 掉到 51.0，終結連續兩個月的改善。調查把原因歸給汽油價格上漲造成的生活成本擠壓，使通膨持續盤據在消費者的心裡。請注意這跟油價那張卡的連結：把能源類股推進領先象限的同一波原油強勢，正是磨掉家庭信心的那股力量。信心調查屬於軟性數據、常常誇大波動幅度，但它和月減 0.6% 的零售銷售在同一個早上出現，兩者指向同一個方向。", "url": "https://finance.yahoo.com/economy/articles/us-retail-sales-unexpectedly-fall-123738457.html"},
    {"id": "macro_2", "channel": "總經政策", "tag": "升息定價", "color": "#7C6AF7", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，利率路徑改變時的長端讀數"}, {"t": "SHY", "n": "1 至 3 年期公債，短端對升息機率最直接"}, {"t": "KRE", "n": "區域銀行 ETF，存款成本與升息路徑高度連動"}], "en": "Rates markets moved with the data. Ahead of the 15-16 September FOMC, traders now price a roughly 69.4% chance the Fed holds the overnight rate at 3.50-3.75%, with hike odds at 30.6% — down from 33.9% the previous day and from 50.0% a month ago. Say that clearly, because it runs against habit: in this cycle the live risk is a hike, not a cut, and the market has spent the last month steadily discounting it. That single line explains a good deal of why rate-sensitive assets — small caps in particular — have run while the consumer data has weakened.", "zh": "利率市場跟著數據走。在 9 月 15 至 16 日的聯邦公開市場操作委員會會議之前，交易員目前定價聯準會維持隔夜利率在 3.50% 至 3.75% 的機率約 69.4%，升息機率 30.6%，低於前一日的 33.9%，也遠低於一個月前的 50.0%。這句話要講清楚，因為它跟直覺相反：這個循環裡真正的風險是升息、不是降息，而市場過去一個月一直在把它折價掉。這一條就解釋了為什麼在消費數據轉弱的同時，對利率最敏感的資產——特別是小型股——反而在漲。", "url": "https://www.tradingkey.com/analysis/economic/indicators/262108173-us-retail-sales-fell-july-fed-rate-hike-expectations-tradingkey"},
    {"id": "sector_0", "channel": "產業風向", "tag": "能源領先", "color": "#4EABA4", "stocks": [{"t": "XLE", "n": "能源板塊 ETF，7 月單月上漲 12%"}, {"t": "FANG", "n": "Diamondback，7 月 30 日董事會把庫藏股授權加倍至 160 億美元"}, {"t": "COP", "n": "康菲石油，上游純度較高的對照組"}], "en": "Energy sits in the leading sector quadrant alongside consumer staples, industrials and materials, after the sector ETF gained 12% in July on rising crude. The supply story supports it: the IEA now projects the widest global deficit in five years. But there is a threshold worth writing down — analysts generally reckon energy needs crude above $80 a barrel to sustain earnings growth, and WTI at $82.37 is only just there. Capital allocation says management shares that view: Diamondback's board doubled its buyback authorisation to $16 billion on 30 July, which is what you do when you think the cash is real but the reinvestment case is not.", "zh": "能源類股目前與必需消費、工業、原物料同列領先象限，能源類股 ETF 在 7 月單月因油價上漲而大漲 12%。供給面的故事撐得住：國際能源總署現在預估全球供給缺口將是五年來最大。但有一個門檻值得寫下來——分析師普遍認為能源股需要油價站在每桶 80 美元之上，獲利成長才撐得住，而西德州目前 82.37 美元只是剛好越過。資本配置也透露管理層的看法：Diamondback 董事會在 7 月 30 日把庫藏股授權加倍到 160 億美元——當你認為現金是真的、但再投資的理由不夠強時，做的就是這件事。", "url": "https://www.spglobal.com/spdji/en/documents/performance-reports/dashboard-us-sector.pdf"},
    {"id": "sector_1", "channel": "產業風向", "tag": "電力需求", "color": "#4EABA4", "stocks": [{"t": "XLU", "n": "公用事業 ETF，今年以來上漲約 7.5%、股息率 2.6%"}, {"t": "CEG", "n": "Constellation，三哩島重啟供電微軟，另簽 Meta 20 年 1.1GW 合約"}, {"t": "VST", "n": "Vistra，1 月與 Meta 簽 20 年逾 2.1GW 核電購電協議"}], "en": "Utilities are behaving unlike a defensive sector this year, and the reason is AI. XLU is up about 7.5% year to date with a 2.6% yield, and the two names driving that divergence are Constellation and Vistra — both merchant nuclear and gas operators that have signed multi-year supply deals with hyperscalers. Constellation supplies Microsoft from the Three Mile Island restart and signed a 20-year, 1.1 GW deal with Meta in 2025; Vistra followed in January 2026 with its own 20-year Meta PPA for more than 2.1 GW across Perry, Davis-Besse and Beaver Valley, and has committed up to $1 billion to its Helix digital infrastructure platform. The point for a reader: the AI trade is no longer only a semiconductor trade, and its second layer prices on contracted cash flow rather than on unit growth.", "zh": "公用事業今年的表現不像一個防禦性板塊，原因是 AI。公用事業 ETF 今年以來上漲約 7.5%、股息率 2.6%，而造成這個分歧的兩檔股票是 Constellation 與 Vistra——兩家都是商轉核電與燃氣發電業者，也都跟超大規模雲端業者簽了多年期供電合約。Constellation 以重啟的三哩島機組供電給微軟，並於 2025 年簽下 20 年、1.1 吉瓦的 Meta 合約；Vistra 則在 2026 年 1 月跟進，簽下 20 年、逾 2.1 吉瓦的 Meta 購電協議，涵蓋 Perry、Davis-Besse 與 Beaver Valley 三座電廠，同時承諾投入最高 10 億美元於 Helix 數位基建平台。給讀者的重點是：AI 這條交易線已經不只是半導體，它的第二層定價的是「已簽約的現金流」，而不是「出貨量成長」。", "url": "https://finance.yahoo.com/markets/stocks/articles/utility-etfs-soar-8-ytd-195846799.html"},
    {"id": "sector_2", "channel": "產業風向", "tag": "落後象限", "color": "#4EABA4", "stocks": [{"t": "XLF", "n": "金融板塊 ETF，隨聯準會停止寬鬆而流失相對優勢"}, {"t": "XLI", "n": "工業板塊 ETF，目前位居領先象限"}, {"t": "XLB", "n": "原物料板塊 ETF，與工業同步轉強"}], "en": "The other half of the rotation picture is who is losing. Technology, communications, consumer discretionary and financials all currently sit in the lagging quadrant. Financials are the interesting one: the sector loses its relative edge as the Fed stops easing, which is a reminder that the same rate path can be a tailwind for one sector and a headwind for another at the same moment. The mirror of that is what fills the leading quadrant — consumer staples, industrials, materials and energy. Growth leadership narrowing while cyclicals and defensives lead together is an unusual combination, and worth watching rather than explaining away.", "zh": "輪動這幅圖的另一半是「誰在輸」。科技、通訊、非必需消費與金融目前都落在落後象限。金融是其中比較有意思的一個：這個板塊的相對優勢隨著聯準會停止寬鬆而流失，這提醒我們同一條利率路徑，可以在同一個時點對某個板塊是順風、對另一個板塊是逆風。對照組則是填滿領先象限的那幾個——必需消費、工業、原物料與能源。成長股領導性收窄、同時景氣循環股與防禦股一起領先，這是一個不常見的組合，值得先觀察而不要急著解釋掉。", "url": "https://www.investing.com/analysis/sector-rotation-a-guide-to-the-sp-500-momentum-status-200675903"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素創高", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週五逆勢上漲 0.31%"}, {"t": "VTWO", "n": "另一檔羅素 2000 ETF，費用率較低"}], "en": "On a day when the S&P 500 and Nasdaq both fell, the Russell 2000 rose 0.24% and notched a fresh record to close the week, with IWM up 0.31%. The index touched an all-time high of 3,045.48 this week, its 27th record close of 2026, and is up more than 22% year to date — ahead of the Nasdaq 100's 19%. Small caps outrunning the Nasdaq for a full year has not happened in a long time. Note that Friday's divergence is not a coincidence: the weak consumer data cut hike odds, and lower rates matter more to small caps than to mega-cap tech.", "zh": "在標普 500 與那斯達克雙雙下跌的這一天，羅素 2000 逆勢上漲 0.24%，以一個新的紀錄收盤替這一週作結，追蹤它的 IWM 上漲 0.31%。本週指數盤中觸及歷史高點 3,045.48，是 2026 年第 27 次收盤新高，今年以來漲幅超過 22%，領先那斯達克 100 的 19%。小型股整年跑贏那斯達克，已經很久沒有發生過。要注意週五的分歧不是巧合：疲弱的消費數據壓低了升息機率，而利率下降對小型股的意義大於對超大型科技股。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-14-2026"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "為何領先", "color": "#5B8ED6", "stocks": [{"t": "VB", "n": "整體小型股 ETF，涵蓋範圍比羅素 2000 更廣"}, {"t": "IWN", "n": "羅素 2000 價值型 ETF，估值差距修復的直接載體"}], "en": "Why are small caps leading in 2026? Four things stacked, not one. A historic valuation gap after years of underperformance; extreme concentration and rich valuations in mega-cap AI pushing money into under-owned areas; a pivot in the AI narrative from hardware infrastructure toward software application, which moves the beneficiary set downstream; and an active M&A market with an accelerating IPO calendar. Breadth backs it up — over 72% of S&P 500 constituents were trading above their 200-day moving average during the recent rally. That is the strongest reading in months and the part that separates a rotation from a squeeze.", "zh": "小型股為什麼在 2026 年領先？是四件事疊起來，不是單一原因。第一，多年落後之後累積出的歷史性估值差距；第二，超大型 AI 股的集中度與估值都太高，資金因此流向被低度持有的區塊；第三，AI 敘事從硬體基礎建設轉向軟體應用，受惠者往下游位移；第四，併購市場活絡、IPO 節奏加快。市場寬度也支持這個說法——近期漲勢中有超過 72% 的標普 500 成分股站在 200 日均線之上，是數個月來最強的讀數。這一項正是「輪動」與「軋空」的分界。", "url": "https://www.benzinga.com/etfs/specialty-etfs/26/08/61181756/quick-spark-russell-2000-hits-new-record-highs-beats-nasdaq-100-in-2026"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "池子差異", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普小型股 600 ETF，成分股須連續四季正獲利"}, {"t": "IWM", "n": "羅素 2000 ETF，約四成成分公司無獲利"}], "en": "Before you buy the small-cap rally, know which pool you are buying. Roughly 40% of Russell 2000 members carry negative trailing earnings — 806 unprofitable against 1,120 profitable — while the figure for the S&P SmallCap 600 is about 20%, because the S&P index requires four consecutive quarters of positive earnings to join. That gap is doing real work right now: unprofitable Russell 2000 stocks have climbed about 60% since April 2025 against 38% for profitable ones. Over the long run the ranking flips — from its late-1994 inception through 2025 the S&P 600 compounded at 10.6% a year, about 1.4 percentage points ahead of the Russell 2000. Same asset class, two very different bets.", "zh": "在買進小型股行情之前，先弄清楚你買的是哪一個池子。羅素 2000 大約有四成的成分公司過去十二個月是虧損的——806 家無獲利對上 1,120 家有獲利；而標普小型股 600 的同一比例只有約兩成，因為標普的指數規則要求連續四季正獲利才能納入。這個差距現在正在發揮作用：自 2025 年 4 月以來，羅素 2000 裡無獲利的股票上漲約 60%，有獲利的只漲 38%。但把時間拉長，排序會反過來——標普 600 自 1994 年底成立到 2025 年的年化報酬是 10.6%，比羅素 2000 高出約 1.4 個百分點。同一個資產類別，兩種很不一樣的賭注。", "url": "https://www.schwab.com/learn/story/sp-600-often-overlooked-small-cap-index"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "房市承壓", "color": "#5B8ED6", "stocks": [{"t": "XHB", "n": "房屋建商與建材 ETF，對利率與住宅支出最敏感"}, {"t": "ITB", "n": "美國住宅建商 ETF，純度更高的建商曝險"}, {"t": "SITE", "n": "景觀灌溉建材批發商，執行長 8 月 4 日在 52 週低點附近買進 81.6 萬美元"}], "en": "Not every corner of the small-cap complex is at a record. Housing-linked names are the clearest laggard: retail sales fell, sentiment dropped, and September hike risk has not gone to zero, so anything financing a home purchase or renovation stays under pressure. The evidence is in insider behaviour rather than price. SiteOne Landscape Supply's CEO bought $816,280 of stock on 4 August through a family trust at about $102.03 — the company's largest insider purchase in twelve months, made with the shares near a 52-week low. Dream Finders Homes is down 47% over the past year and trading near its 52-week low of $12.20. Insiders are buying what the index is not.", "zh": "小型股家族不是每個角落都在創新高。房市連動的族群是最明顯的落後者：零售銷售下滑、信心走弱，而 9 月升息的風險還沒歸零，任何跟買房或裝修融資有關的生意都還在壓力下。證據在內部人的行為裡、不在價格裡。SiteOne Landscape Supply 執行長 8 月 4 日透過家族信託以每股約 102.03 美元買進 81.628 萬美元的股票，是該公司近十二個月最大的一筆內部人買進，而且發生在股價貼近 52 週低點時。Dream Finders Homes 過去一年下跌 47%，目前貼著 52 週低點 12.20 美元。內部人正在買指數不買的東西。", "url": "https://www.benzinga.com/news/26/08/61043880/bullish-move-doug-black-shows-confidence-acquires-816k-siteone-landscape-supply-stock"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "反應劇烈", "color": "#5B8ED6", "stocks": [{"t": "QNST", "n": "QuinStreet，8 月 6 日財報後單日大漲 28%"}, {"t": "CDRE", "n": "Cadre Holdings，8 月 6 日財報後盤後漲 18.26%"}, {"t": "CURI", "n": "CuriosityStream，財報後單日跳漲 21%"}], "en": "One structural feature of small caps is worth internalising: their earnings reactions are violent in a way large-cap reactions are not. Three examples from this month alone, all from the radar pool — QuinStreet rose 28% in a single session on 6 August, Cadre Holdings jumped 18.26% after hours the same day, and CuriosityStream leapt 21% on its print. None of those are 28%-better businesses than they were the day before. The cause is thin coverage: when almost nobody is modelling a company, information does not get priced in gradually over weeks, it arrives all at once. A one-day move that size is therefore evidence of prior neglect, not of quality — and it also means the mispricing you were hoping to exploit is largely gone by the close.", "zh": "小型股有一個結構性特徵值得記住：它們的財報反應劇烈到跟大型股完全不同量級。光是這個月就有三個例子，而且都出自雷達池——QuinStreet 在 8 月 6 日單日上漲 28%，Cadre Holdings 同一天盤後漲 18.26%，CuriosityStream 財報後單日跳漲 21%。這三家公司都不是在一天之內變成「好 28%」的生意。原因是覆蓋太薄：當幾乎沒有人在替一家公司建模，資訊就不會在數週之間逐步反映，而是一次到位。所以這種等級的單日漲幅，是「先前被忽視」的證據，不是「品質好」的證據——同時也代表你原本想賺的那段錯價，收盤時已經被修掉一大半。", "url": "https://markets.financialcontent.com/stocks/article/stockstory-2026-8-6-quinstreet-nasdaqqnst-reports-bullish-q2-cy2026-stock-jumps-28"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新入池", "color": "#C9A227", "stocks": [{"t": "DFH", "n": "共同董事長三天買進 126.47 萬美元，股價一年 -47%"}, {"t": "BZH", "n": "Beazer Homes，DFH 的併購對象，交易完成後成為全美第六大建商"}, {"t": "LEN", "n": "Lennar，Beckwitt 退休前擔任共同執行長的公司"}], "en": "Dream Finders Homes builds homes in the US Southeast and Texas. It is ignored for a mechanical reason: homebuilders are treated as a single rate bet, and with housing soft, funds avoid the category wholesale. Two things are changing. Rick Beckwitt — who ran Lennar as Co-CEO and Co-President until retiring in 2023 — joined the board as Co-Chairman on 14 July, then bought 90,000 Class A shares over three consecutive days for $1,264,740: 70,000 at $13.95 on 11 August, 8,000 at $13.83 on 12 August, and 12,000 at $14.80 on 13 August. Separately, the company agreed to acquire Beazer Homes, which would make it the sixth-largest US homebuilder. The stock is $14.84, down 47% over the past year, near its 52-week low of $12.20. Counter-argument: this is one director, however credentialed, and the radar pool already holds a cautionary case in Advantage Solutions, where a CEO bought 18 times in a year and the thesis still failed. Housing demand and the September FOMC remain the dominant variables, and merger integration is its own risk. This is a research lead, not investment advice.", "zh": "Dream Finders Homes 是一家在美國東南部與德州蓋房子的建商。它被忽視的原因很機械：建商被市場當成單一的利率賭注在交易，而房市正疲軟，基金整批迴避這個品類。現在有兩件事在改變。第一，Beckwitt 在 2023 年退休前是 Lennar 的共同執行長兼共同總裁，他在 7 月 14 日加入董事會出任共同董事長，接著連續三天買進 90,000 股 A 類股、合計 126.474 萬美元：8 月 11 日以 13.95 美元買 70,000 股、8 月 12 日以 13.83 美元買 8,000 股、8 月 13 日以 14.80 美元買 12,000 股。第二，公司同時宣布收購 Beazer Homes，完成後將成為全美第六大建商。股價 14.84 美元、過去一年下跌 47%，貼近 52 週低點 12.20 美元。反方論點要講清楚：這終究只有一位董事，不論資歷多完整；而雷達池裡已經有一個警世案例——Advantage Solutions 的執行長一年買了 18 次，論點最後還是失敗了。房市需求與 9 月的聯準會決策仍是主導變數，併購整合本身也是一項風險。這是研究線索，不是投資建議。", "url": "https://www.investing.com/news/stock-market-news/thursdays-insider-activity-notable-buys-and-major-sales-93CH-4860843", "status": "RADAR · 下一個驗證點 Beazer 併購交割與 Q3 財報"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新入池", "color": "#C9A227", "stocks": [{"t": "EVTC", "n": "第二季營收年增 20% 至 2.748 億美元，8 月 4 日庫藏股授權提高到 1.5 億"}, {"t": "FIS", "n": "Fidelity National Information Services，規模較大的支付處理對照組"}, {"t": "PAGS", "n": "PagSeguro，拉美支付的同區域對照組"}], "en": "Evertec processes payments and provides business solutions across Puerto Rico, Latin America and the Caribbean, with a market cap of about $2.16 billion. It is ignored because payment infrastructure in Latin America has no consumer-facing story and sits outside most generalist funds' geography. What is changing: second-quarter revenue rose 20% to $274.82 million and full-year revenue guidance was raised to $1.085-1.095 billion, with constant-currency growth lifted to 14.5-15.6%. On capital allocation the board raised the buyback authorisation to $150 million through December 2027, backed by roughly 1.9 million shares actually repurchased in the quarter at an average $24.68, part of $50.1 million returned. Commercially, it signed a multi-year agreement with Transbank, Chile's leading payment provider, which management calls one of its most important contracts after Popular; it contributes from the second half of 2027 and fully ramps in 2028. Counter-argument: quarterly net income collapsed from $40.47 million to $5.41 million, partly tied to a data breach, and the Transbank revenue is more than a year away — that is a long time to hold a thesis on a promise. This is a research lead, not investment advice.", "zh": "Evertec 是一家在波多黎各、拉丁美洲與加勒比海地區做支付處理與商業解決方案的公司，市值約 21.6 億美元。它被忽視的原因是：拉美的支付基礎建設沒有面向消費者的故事，地理位置也落在多數泛用型基金的守備範圍之外。正在改變的事：第二季營收年增 20% 至 2.7482 億美元，全年營收指引上修到 10.85 億至 10.95 億，固定匯率成長率上調到 14.5% 至 15.6%。資本配置方面，董事會把庫藏股授權提高到 1.5 億美元、效期至 2027 年 12 月，背書是本季實際以均價 24.68 美元買回約 190 萬股，合計回饋股東 5,010 萬美元。生意面則簽下智利最大支付業者 Transbank 的多年期合約，管理層稱這是繼 Popular 之後最重要的商業合約之一，2027 年下半年開始貢獻、2028 年全面放量。反方論點：單季淨利從 4,047 萬美元崩到 541 萬美元，部分與一起資料外洩事件有關；而 Transbank 的營收還要一年多才會進來——用一個承諾撐一年多的論點，時間很長。這是研究線索，不是投資建議。", "url": "https://www.stocktitan.net/news/EVTC/evertec-reports-second-quarter-2026-6km0sjq55g4p.html", "status": "RADAR · 下一個驗證點 Q3 財報看淨利與營收的落差是否收斂"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "新入池", "color": "#C9A227", "stocks": [{"t": "OPFI", "n": "執行長兼 10% 股東 8 月 13 日買進 60,000 股、42.768 萬美元"}, {"t": "ENVA", "n": "Enova International，非優級消費信貸的規模對照組"}, {"t": "WRLD", "n": "World Acceptance，小額消費放款的同業"}], "en": "OppFi is a small-cap lender to non-prime consumers. It is ignored twice over: consumer credit to subprime borrowers sits on many exclusion lists, and the market cap is below most institutional screens. What is changing is a clean insider-versus-market signal. Second-quarter revenue was a record $145.2 million, up 1.9%, with diluted EPS of $0.18 — but adjusted EPS fell 25% as credit losses and operating expenses rose, and the CEO conceded the quarter fell short of plan because the line-of-credit rollout and the LOLA system migration both took longer than expected. The stock fell 24% in a week to $7.13. On 13 August, Todd Schwartz — CEO, director and 10% owner — bought 60,000 shares for $427,680 at a weighted average of $7.128, i.e. into the drop. Full-year guidance is $600-625 million of revenue and adjusted EPS of $1.34-1.51, and the BNC National Bank acquisition is targeted to close in the fourth quarter. Counter-argument: rising credit losses in a cooling labour market is exactly the wrong trend for a non-prime lender, regulatory risk from the CFPB and state rate caps never goes away, and a 10% owner adding to an already-large position is a weaker signal than it looks. This is a research lead, not investment advice.", "zh": "OppFi 是一家貸款給非優級消費者的小型金融公司。它被忽視了兩次：對次級借款人的消費信貸出現在許多排除名單上，而市值又低於多數法人的篩選門檻。正在改變的是一個很乾淨的「內部人與市場反向」訊號。第二季營收 1.452 億美元創同期紀錄、年增 1.9%，稀釋後每股盈餘 0.18 美元——但調整後每股盈餘年減 25%，因為信用損失與營運費用同時上升；執行長也承認這一季低於原本的財務規劃，原因是循環信貸產品的推出與 LOLA 系統移轉都比預期久。股價一週內下跌 24% 到 7.13 美元。8 月 13 日，身兼執行長、董事與 10% 股東的 Todd Schwartz 以加權均價 7.128 美元買進 60,000 股、金額 42.768 萬美元，等於是往下跌的那一段買。全年指引為營收 6.00 億至 6.25 億美元、調整後每股盈餘 1.34 至 1.51 美元，BNC National Bank 的併購目標在第四季完成。反方論點：在就業市場降溫時信用損失上升，對一家非優級放款業者來說正好是最不該出現的趨勢；消費者金融保護局與各州利率上限的監管風險永遠都在；而一位本來就持股 10% 的股東再加碼，訊號強度不如表面看起來那麼強。這是研究線索，不是投資建議。", "url": "https://www.investing.com/news/stock-market-news/oppfi-chief-executive-todd-schwartz-buys-427680-in-company-stock-93CH-4800254", "status": "RADAR · 下一個驗證點 Q4 BNC National Bank 併購能否交割"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "新入池", "color": "#C9A227", "stocks": [{"t": "VALU", "n": "市值約 5.4 億美元，6 月遭剔出數個羅素指數"}, {"t": "ANIK", "n": "池內同樣在 6 月被指數剔除的案例，機制完全相同"}, {"t": "MORN", "n": "Morningstar，投資研究出版業的規模對照組"}], "en": "Value Line publishes investment periodicals and research, with a market cap of roughly $540 million. Today it enters the pool mainly to document a mechanism, because it shares one exactly with Anika Therapeutics already in the pool: it was dropped from several Russell indices in June 2026. Index deletion is neglect in its purest form — passive selling and the withdrawal of tracking money, entirely unrelated to whether the business is any good, and it also lowers the incentive for anyone to start covering the stock. On the business itself, earnings per share rose to $2.30 for the year ended April 2026 even as revenue slipped to $33.45 million, and in July the company started a buyback of up to $2 million with no expiry. Counter-argument, stated plainly: revenue is shrinking, a $2 million authorisation is small in both absolute and relative terms, and index deletion cuts liquidity — which raises your own cost of getting in and out. The evidence here is thinner than most of the pool. This is a research lead, not investment advice.", "zh": "Value Line 是一家出版投資刊物與研究報告的公司，市值約 5.4 億美元。它今天入池，主要是為了記錄一個機制，因為它跟池內的 Anika Therapeutics 共用同一個機制：2026 年 6 月被剔出數個羅素指數。指數剔除是最純粹形式的忽視——被動賣壓與追蹤資金撤離，跟公司好壞完全無關，同時還會降低任何人開始覆蓋這檔股票的誘因。生意本身：截至 2026 年 4 月的會計年度，每股盈餘上升到 2.30 美元，而營收下滑到 3,345 萬美元；7 月公司啟動最高 200 萬美元、沒有到期日的庫藏股。反方論點要講白：營收在縮小；200 萬美元的授權不論絕對值或相對值都很小；而指數剔除會壓縮流動性——那會直接推高你自己進出的成本。這一檔的證據強度低於池內多數標的。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/diversified-financials/nasdaq-valu/value-line/news/undervalued-small-caps-with-insider-action-in-august-2026", "status": "RADAR · 下一個驗證點 下一份季報看營收能否止跌"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內決勝", "color": "#C9A227", "stocks": [{"t": "MOV", "n": "8 月 20 日盤前財報，是本週池內第一個決勝點"}, {"t": "FOSL", "n": "Fossil Group，同屬授權錶模式的對照組"}], "en": "Movado Group reports before the open next Thursday, 20 August — the first of the pool's verification dates to arrive this coming week, and the most important date on its calendar this year. The watch and jewellery group is ignored because the category is unfashionable, the market cap is only about $434 million and coverage is thin. Three things to check. Whether earnings momentum holds after last quarter's $0.32 EPS against a $0.07 estimate, a 357% surprise. What the Kate Spade New York global watch licence, effective 1 July, actually contributes to revenue and gross margin. And whether management finally issues fiscal 2027 guidance, which it withheld citing tariff and macro uncertainty. The valuation caveat matters more than usual: at roughly $37.84 against a 52-week high of $39.85 and a P/E of 24.4, the margin of safety that justified entry has been compressed. This quarter has to be judged on whether growth is delivered, not on whether the stock is cheap. This is a research lead, not investment advice.", "zh": "雷達池內的 Movado Group 在下週四 8 月 20 日盤前交卷——這是池內下週第一個到期的驗證點，也是它今年最重要的一個日期。這家手錶與珠寶品牌集團被忽視的原因是產業冷門、市值僅約 4.34 億美元、覆蓋極少。三件事要檢查。第一，上一季每股盈餘 0.32 美元遠勝預估的 0.07 美元、意外幅度 357%，這種動能能不能延續。第二，7 月 1 日生效的 Kate Spade New York 全球授權錶合作，對營收與毛利的實際貢獻是多少。第三，管理層是否終於給出 FY2027 財測——先前以關稅與總經不確定為由拒絕給出。估值的提醒這次比平常更重要：股價約 37.84 美元、逼近 52 週高點 39.85，本益比 24.4 倍，當初入池時的安全邊際已被壓縮。這一季必須用「成長是否兌現」來檢驗，而不是「便不便宜」。這是研究線索，不是投資建議。", "url": "https://stockanalysis.com/stocks/mov/statistics/", "status": "RADAR · 下一個驗證點 08/20 盤前財報"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內追蹤", "color": "#C9A227", "stocks": [{"t": "ALLT", "n": "第二季營收 2,770 萬美元年增 15%，非 GAAP 每股 0.09 美元超標 50%"}, {"t": "RDWR", "n": "Radware，同為以色列網路資安業者的對照組"}, {"t": "CHKP", "n": "Check Point，以色列資安的規模對照組"}], "en": "Allot, in the radar pool, cleared the test set at entry and now needs a different question asked. The Israeli network intelligence and security vendor, which mainly sells security-as-a-service to telecom operators, reported second-quarter revenue of $27.7 million on 12 August, up 15% from $24.1 million, with GAAP net income of $2.6 million, non-GAAP net income of $4.6 million and non-GAAP diluted EPS of $0.09 against a $0.06 estimate — a 50% beat — plus $8.5 million of operating cash flow. CEO Eyal Harari called it the fourth consecutive quarter of double-digit growth, which converts what was previously only a company claim into a fourth quarter of evidence. One item remains unverified and is now the open question: the $40 million buyback authorised on 23 June has cleared its 30-day creditor objection period, but no filing yet shows any shares actually repurchased or at what price. An authorisation with no execution behind it is the weakest form of capital-allocation signal. Other risks unchanged: telecom capex is strongly cyclical and Israeli geopolitical risk is real. This is a research lead, not investment advice.", "zh": "雷達池內的 Allot 通過了入池時設定的檢驗，現在該問的是另一個問題了。這家以色列網路智慧與資安服務商主要把資安即服務賣給電信商，8 月 12 日公布第二季營收 2,770 萬美元、自去年同期的 2,410 萬年增 15%；GAAP 淨利 260 萬美元，非 GAAP 淨利 460 萬美元、稀釋後非 GAAP 每股盈餘 0.09 美元，遠勝市場預估的 0.06 美元、超標 50%；營運現金流 850 萬美元。執行長 Eyal Harari 明言這是連續第四季雙位數成長，等於把先前只有公司自己說法的那條論點，補上了第四季的實據。仍未驗證、也是現在最該追的一項：6 月 23 日通過的 4,000 萬美元庫藏股已經過了債權人 30 天異議期，但至今沒有任何申報文件顯示實際買回了多少股、均價多少。沒有執行紀錄背書的授權，是資本配置訊號裡最弱的一種。其他風險不變：電信商資本支出具強週期性，以色列地緣風險真實存在。這是研究線索，不是投資建議。", "url": "https://www.stocktitan.net/news/ALLT/allot-announces-second-quarter-2026-financial-p68hbgasha4z.html", "status": "RADAR · 下一個驗證點 下一份申報是否出現實際買回股數與均價"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "訊號比例", "color": "#6DB56D", "stocks": [{"t": "DFH", "n": "共同董事長三天連買，屬於相對規模大的買進"}, {"t": "OPFI", "n": "執行長在股價一週 -24% 之後買進"}, {"t": "TNC", "n": "董事透過配偶信託買進，屬於中等強度訊號"}], "en": "Before reading any individual purchase, calibrate on the base rate. As of 9 August, only 8 of 149 tracked companies had a named officer — CEO, CFO or similar — make an open-market purchase. Across the same universe there were 1,910 open-market sale transactions against just 40 purchases, roughly 48 sells for every buy by transaction count. That ratio is normal, not alarming: insiders sell for diversification, option exercises and pre-set 10b5-1 plans, and most selling carries no information at all. Which is exactly why the useful question is never whether someone bought, but who bought, how large relative to what they already held, and at what price relative to the stock's own range.", "zh": "在解讀任何一筆個別買進之前，先校準基準比率。截至 8 月 9 日，追蹤的 149 家公司裡，只有 8 家出現具名高管（執行長、財務長或同級）在公開市場買進。同一個範圍內，公開市場賣出交易有 1,910 筆、買進只有 40 筆，以筆數計約 48 賣對 1 買。這個比例是常態、不是警訊：內部人賣出的理由包括分散配置、行使選擇權與預先設定的 10b5-1 計畫，大部分賣出根本不帶任何資訊。也正因如此，有用的問題從來不是「有沒有人買」，而是「誰買、相對於既有持股買得多大、以及買在自己股價區間的哪個位置」。", "url": "https://tradune.com/statistics/"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "中等訊號", "color": "#6DB56D", "stocks": [{"t": "TNC", "n": "董事 8 月 12 日透過配偶信託以 67.34 美元買進 8,000 股"}, {"t": "MLR", "n": "Miller Industries，池內同屬冷門工業設備的對照組"}], "en": "Tennant Company makes industrial floor-cleaning equipment — a niche with no story, thin coverage and almost no media volume. On 12 August, director Donal L. Mulligan acquired 8,000 shares at $67.34 through a trust for his spouse, roughly $539,000. Apply the calibration from the previous card and this lands mid-strength: it is a director rather than an operating officer, the purchase runs through a spousal trust rather than direct ownership, and the size is meaningful but not extraordinary. It becomes a genuine cluster only if a second insider follows. Worth logging next to Miller Industries in the radar pool, which sits in the same unfashionable industrial-equipment corner and has no insider buying at all — the contrast is the point.", "zh": "Tennant 是一家做工業用地面清潔設備的公司，屬於沒有故事、覆蓋薄、媒體聲量近乎零的利基。8 月 12 日，董事 Donal L. Mulligan 透過配偶名下的信託以每股 67.34 美元買進 8,000 股，金額約 53.9 萬美元。套用上一張卡的校準方式，這筆的強度落在中等：買方是董事而不是營運高管，透過配偶信託而非直接持有，金額有意義但不算異常。要成為真正的群聚訊號，得有第二位內部人跟進才算。值得跟雷達池內的 Miller Industries 擺在一起記——同樣落在冷門的工業設備角落，但那一檔至今找不到任何內部人買進紀錄，這個對比本身就是重點。", "url": "https://www.bbae.com/blog/insideredge-major-holdings-changes-august-12-2026/"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "13F 截止", "color": "#6DB56D", "stocks": [{"t": "BRK.B", "n": "波克夏，每季最受關注的 13F 申報者"}], "en": "Friday 14 August was the filing deadline for second-quarter 13Fs: any manager with more than $100 million in US equity assets must disclose holdings within 45 days of quarter-end. Know what it does not tell you. It covers long US equity positions, convertibles and the notional value of options only — no short positions, no bonds, no foreign holdings. And the as-of date is 30 June, so the data is already six weeks old when you read it. Put next to a Form 4, which an insider must file within two business days, the difference in timeliness is enormous. Use a 13F to find research leads and to watch how long-horizon holders shift, not as a trade signal.", "zh": "8 月 14 日星期五是第二季 13F 的申報截止日：管理超過 1 億美元美股資產的機構，必須在季末後 45 天內揭露持股。要知道它不告訴你什麼。它只涵蓋美股多頭部位、可轉債與選擇權的名目金額——不含空頭部位、不含債券、不含海外持股；而且基準日是 6 月 30 日，看到的時候資料已經放了六週。跟內部人必須在兩個交易日內申報的 Form 4 擺在一起比，時效性的差距非常大。13F 的正確用法是拿來找研究線索、觀察長期持有者的部位變化，不是拿來當交易訊號。", "url": "https://www.finrep.ai/blog/13f-filing-deadlines-2026-every-date-rule-and-trap"},
    {"id": "week_0", "channel": "本週事件", "tag": "總經行事曆", "color": "#C97DD4", "stocks": [{"t": "TLT", "n": "20 年期以上公債，會議紀錄與 Jackson Hole 是長端的主要變數"}, {"t": "UUP", "n": "美元指數 ETF，利率路徑重新定價時最先反應"}], "en": "Next week's macro calendar is dense at both ends. Monday 17 August brings the Empire State manufacturing index. Tuesday 18 August has housing starts, building permits and industrial production — the housing pair matters most given how weak the rate-sensitive complex has been. Wednesday 19 August is the big one: the July FOMC minutes at 14:00, the first look at how divided the committee actually is on a hike. Thursday 20 August brings the Philadelphia Fed index and leading indicators. Friday 21 August opens the Jackson Hole symposium alongside jobless claims, flash PMIs and existing home sales. With hike odds at 30.6%, the minutes and Jackson Hole are where that number gets re-tested.", "zh": "下週的總經行事曆兩頭都很密。8 月 17 日星期一是紐約聯儲製造業指數。8 月 18 日星期二有房屋開工、營建許可與工業生產——考量到利率敏感族群最近有多弱，房市那兩項最值得看。8 月 19 日星期三是重頭戲：下午兩點公布 7 月的聯邦公開市場操作委員會會議紀錄，這是第一次能看到委員們對升息的分歧到底有多大。8 月 20 日星期四是費城聯儲指數與領先指標。8 月 21 日星期五傑克森洞研討會開幕，同日還有初領失業金、Markit 採購經理人指數初值與成屋銷售。在升息機率 30.6% 的當下，會議紀錄與傑克森洞就是這個數字被重新檢驗的地方。", "url": "https://www.litefinance.org/blog/analysts-opinions/weekly-economic-calendar-for-17082026-23082026/"},
    {"id": "week_1", "channel": "本週事件", "tag": "零售財報週", "color": "#C97DD4", "stocks": [{"t": "HD", "n": "8 月 18 日盤前財報，房市連動消費最乾淨的即時讀數"}, {"t": "TGT", "n": "8 月 19 日財報，中價位非必需零售"}, {"t": "LOW", "n": "8 月 19 日財報，與家得寶對照的住宅修繕讀數"}, {"t": "WMT", "n": "8 月 20 日財報，規模最大、消費畫布最完整"}, {"t": "ROST", "n": "8 月 20 日財報，折扣零售反映消費降級程度"}], "en": "Next week is retail earnings week, and it lands two days after retail sales fell 0.6%. Home Depot reports before the open on Tuesday 18 August — the single most watched release of the week, because it is the cleanest real-time signal on whether housing-adjacent spending is holding up. Target and Lowe's follow on Wednesday 19 August, then Walmart and Ross Stores on Thursday 20 August, within a week carrying roughly 103 reporting companies. These five are effectively a consumer physical taken from five angles: home improvement, mid-price discretionary, mass-market staples and off-price. The question is not who beats — it is whether all five describe the same second half.", "zh": "下週是零售財報週，而它落在零售銷售月減 0.6% 之後的兩天。家得寶在 8 月 18 日星期二盤前交卷——這是全週最受關注的一份，因為它是「房市連動的消費支出有沒有撐住」最乾淨的即時訊號。目標百貨與勞氏在 8 月 19 日星期三接著公布，沃爾瑪與 Ross Stores 則在 8 月 20 日星期四，整週約有 103 家公司交卷。這五家合起來等於是從五個角度做的一次消費者體檢：住宅修繕、中價位非必需、大眾必需品，以及折扣零售。要看的不是誰超標，而是這五家對下半年的說法是不是同一個版本。", "url": "https://www.cnbc.com/2026/08/14/stock-market-next-week-outlook-for-aug-17-21-2026.html"},
    {"id": "eval_0", "channel": "今日評估", "tag": "今日一件事", "color": "#E8A838", "stocks": [{"t": "XRT", "n": "零售業 ETF，零售銷售月減 0.6% 的直接對應"}, {"t": "VTWO", "n": "羅素 2000 ETF，同一天逆勢創下今年第 27 次收盤新高"}], "en": "The thing most worth noticing today is a divergence, not a number. On the same morning that July retail sales fell 0.6% — the first drop in nine months — and consumer sentiment slid from 55.2 to 51.0, the Russell 2000 rose to a fresh record and the S&P 500 completed a third straight weekly gain. The market's chain of reasoning is coherent: weak consumer, therefore September hike odds drop from 50% a month ago to 30.6%, therefore the most rate-sensitive assets rally. But that chain skips a step. Lower rates help small caps on the financing side; the consumer sits on the revenue side, and about 40% of Russell 2000 members are already unprofitable. Open question: if consumer spending really is rolling over, does the rate relief reach the earnings line before the demand weakness does — and which of those two arrives first for the companies you actually hold?", "zh": "今天最值得注意的是一個背離，不是一個數字。在 7 月零售銷售月減 0.6%（九個月來第一次下滑）、消費者信心從 55.2 掉到 51.0 的同一個早上，羅素 2000 逆勢創下新高，標普 500 也完成連續第三週上漲。市場的推理鏈是通順的：消費弱，所以 9 月升息機率從一個月前的 50% 降到 30.6%，所以對利率最敏感的資產上漲。但這條推理鏈跳過了一步。利率下降幫到的是小型股的融資端，消費者站的卻是營收端，而羅素 2000 已經有約四成的成分公司是虧損的。開放式問題：如果消費真的在轉弱，利率的舒緩會比需求的疲弱更早抵達損益表嗎——對你實際持有的那幾家公司來說，這兩件事哪一個會先到？", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-august-14-dow-sp-500-nasdaq-102635519.html", "status": "討論題 · 消費在退、風險偏好在進，哪一邊是對的"},
];

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function SettingsPanel({ open, onClose }) {
  const [key, setKey] = React.useState(() => localStorage.getItem('mf_azureKey') || '');
