<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "指數收盤", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普 500 追蹤 ETF，週二跌 0.71% 收 7,631.47"}, {"t": "DIA", "n": "道瓊 ETF，指數跌 419.02 點、0.79% 收 52,766.88"}, {"t": "QQQ", "n": "那斯達克 100，科技股是當天跌最重的一塊"}], "en": "September's first session went badly. The S&P 500 fell 0.71% to 7,631.47, the Nasdaq Composite dropped 1.03% to 26,099.77 and the Dow lost 419.02 points, or 0.79%, to 52,766.88. Note the shape: the Nasdaq led the decline this time, the mirror image of Monday when the Dow fell more than twice as much as the S&P. Intraday the S&P touched its lowest level since August 4.", "zh": "九月的第一個交易日收得很難看。標普 500 跌 0.71% 收 7,631.47，那斯達克綜合指數跌 1.03% 收 26,099.77，道瓊跌 419.02 點、0.79% 收 52,766.88。要注意的是形狀變了：這次領跌的是那斯達克，跟前一天道瓊跌幅是標普兩倍多的結構正好相反。標普盤中一度跌到八月四日以來的最低點，兩天之內市場已經把「情緒受傷」換成了「估值受傷」。", "url": "https://www.cnbc.com/2026/08/31/stock-market-today-live-updates.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "殖利率衝擊", "color": "#E05C5C", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，三十年期殖利率升到 5.27%"}, {"t": "SHY", "n": "短天期公債 ETF，兩年期殖利率創 2025 年 1 月以來新高"}, {"t": "AMD", "n": "半導體，當天跌約 3%，是利率敏感族群的代表"}], "en": "The real driver was not Iran, it was rates. The two-year Treasury yield hit its highest since January 2025 and the ten-year pushed toward 4.8% before easing to 4.76%; the thirty-year sat at 5.27%. Long-duration equity is priced off exactly that curve, so chips took the brunt of the selling. This is the cleanest recent example of a stock market being repriced by the bond market rather than by its own news.", "zh": "真正的推手不是伊朗，是利率。兩年期公債殖利率升到 2025 年 1 月以來最高，十年期一度逼近 4.8%、尾盤回落到 4.76%，三十年期則停在 5.27%。成長股的估值就是拿這條曲線折現出來的，所以晶片股被打得最重、AMD 單日跌約 3%。這是近期最乾淨的一個例子：股市不是被自己的新聞重新定價，是被債市重新定價。", "url": "https://investrade.com/mid-morning-look-september-01-2026/"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "個股異動", "color": "#E05C5C", "stocks": [{"t": "GPRO", "n": "宣布 2.85 億美元資本重組合併案，單日暴漲約 78%"}, {"t": "ALMS", "n": "紅斑性狼瘡試驗未達主要療效指標，單日腰斬約 51%"}, {"t": "NVS", "n": "口服 BTK 抑制劑三期試驗達標，多發性硬化症適應症，漲約 6%"}], "en": "Individual names told their own stories. GoPro jumped roughly 78% on a $285 million recapitalisation merger with Starman Optical. Alumis fell about 51% after its lupus candidate missed its primary endpoint. Novartis added around 6% on positive Phase III data for an oral BTK inhibitor in relapsing MS, and Myriad Genetics dropped about 7% on a downgrade. On a macro-driven day, single-stock catalysts still move far more than the index does.", "zh": "在總經主導的一天裡，個股照樣走自己的劇本。GoPro 因為宣布與 Starman Optical 的 2.85 億美元資本重組合併案，單日暴漲約 78%。Alumis 的紅斑性狼瘡新藥沒有達到主要療效指標，股價腰斬約 51%。Novartis 的口服 BTK 抑制劑在復發型多發性硬化症的三期試驗達標，漲約 6%；Myriad Genetics 則因為被降評而跌約 7%。指數只動不到 1%，個股的分佈卻可以從正 78% 拉到負 51%。", "url": "https://www.fool.com/coverage/stock-market-today/2026/09/01/stock-market-today-sept-1-stocks-slide-and-oil-surges-amid-u-s-iran-tension/"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "盤勢結構", "color": "#E05C5C", "stocks": [{"t": "VIXY", "n": "波動率期貨 ETF，VIX 盤中回到 16 附近、前一日收在 15 以下"}, {"t": "XLV", "n": "醫療保健 ETF，當天逆勢上漲的三個板塊之一"}, {"t": "XLP", "n": "必需消費 ETF，防禦性資金的去處"}], "en": "Look at where money went rather than at the index. Energy, healthcare and consumer staples gained while technology fell, and the VIX came back to about 16 intraday after closing under 15 the day before. That is a defensive rotation, not a panic. The distinction matters: panic sells everything, rotation sells the expensive thing and buys the cheap one, and so far this is the second kind.", "zh": "與其看指數，不如看錢往哪裡去。能源、醫療保健與必需消費三個板塊逆勢收紅，科技股獨自往下，VIX 盤中回到 16 附近，而前一天才收在 15 以下。這是防禦性輪動，不是恐慌。兩者的差別很重要：恐慌是什麼都賣，輪動是賣掉貴的、買進便宜的，目前市場走的還是後面這一種。", "url": "https://www.schwab.com/learn/story/stock-market-update-open"},
    {"id": "earn_0", "channel": "財報速報", "tag": "AI 伺服器", "color": "#E8786A", "stocks": [{"t": "DELL", "n": "第二季營收 469.7 億美元、年增 58%，AI 訂單積壓創 950 億美元紀錄"}, {"t": "VRT", "n": "資料中心電力與散熱供應商，直接吃到同一條 AI 伺服器需求"}, {"t": "HPE", "n": "同樣做 AI 伺服器的對手，本週稍晚也要出財報"}], "en": "Dell's FY27 Q2 was the night's big number. Revenue rose 58% year over year to $46.97 billion, adjusted EPS came in at $7.04, AI-optimised server revenue doubled and the order backlog hit a record $95 billion. Management now guides to $192 billion of annual revenue and $74 billion of AI server sales, up from $167 billion. Notably, the stock had already fallen 6.51% during the regular session before any of this was known.", "zh": "Dell 的 FY2027 第二季是昨晚最大的一個數字。營收 469.7 億美元、年增 58%，調整後每股盈餘 7.04 美元遠超預期，AI 最佳化伺服器營收翻倍，訂單積壓衝到 950 億美元的歷史新高。管理層把全年營收指引拉到 1,920 億美元、AI 伺服器銷售 740 億美元，前次還只有 1,670 億。值得記一筆的是，在這些數字公布之前，股價當天正股時段已經先跌了 6.51%，盤後只微幅回升。", "url": "https://www.cnbc.com/2026/09/01/dell-q2-earnings-report-2027.html"},
    {"id": "earn_1", "channel": "財報速報", "tag": "資安平台", "color": "#E8786A", "stocks": [{"t": "PANW", "n": "FY2026 第四季營收 34.1 億美元、年增 34%，但 GAAP 認列 2.82 億美元淨損"}, {"t": "CRWD", "n": "端點資安對手，同樣走平台整併路線"}, {"t": "ZS", "n": "雲端資安對手，市場常拿來跟 PANW 的 ARR 成長比較"}], "en": "Palo Alto Networks closed its fiscal year with revenue up 34% to $3.41 billion and adjusted EPS of $1.02, both ahead. Next-generation security ARR grew 63% to $9.1 billion and remaining performance obligations rose 34% to $21.2 billion. The catch is the GAAP line: a $282 million net loss against $254 million of profit a year earlier, driven by acquisition accounting. FY27 guidance of $14.1 to $14.2 billion still came in above consensus.", "zh": "Palo Alto Networks 用一個雙面的季度收掉整個會計年度。營收 34.1 億美元、年增 34%，調整後每股盈餘 1.02 美元，兩項都超預期；次世代資安的年度經常性收入年增 63% 到 91 億美元，未認列履約義務年增 34% 到 212 億美元。但 GAAP 那一行是 2.82 億美元淨損，去年同期還是 2.54 億獲利，差額主要來自併購的會計處理。FY2027 指引 141 至 142 億美元仍高於市場共識。", "url": "https://www.cnbc.com/2026/09/01/palo-alto-networks-panw-q4-2026-earnings.html"},
    {"id": "earn_2", "channel": "財報速報", "tag": "成長股定價", "color": "#E8786A", "stocks": [{"t": "MDB", "n": "第二季營收 7.718 億美元、年增 30%，盤後仍跌近一成"}, {"t": "SNOW", "n": "同屬資料雲族群，本週也要出財報"}, {"t": "DDOG", "n": "可觀測性軟體，市場拿它跟 MDB 一起看 AI 應用落地的進度"}], "en": "MongoDB is the instructive one. Revenue grew 30% year over year to $771.8 million, the fastest in several years, Atlas grew 29%, net income was $40.9 million and full-year guidance went up. The stock still fell close to 10%. When rates are repricing upward, a beat on the print is not enough; what gets punished is any hint that the raise is smaller than the multiple already assumes.", "zh": "MongoDB 才是最值得記的那一份。營收 7.718 億美元、年增 30%，是好幾年來最快的一季，Atlas 年增 29%，淨利 4,090 萬美元，全年指引還往上調——然後股價盤後跌了將近一成。這說明在殖利率往上重新定價的環境裡，「數字超預期」已經不夠了；被處罰的是「上調幅度小於現有本益比所隱含的假設」。同樣一份財報，去年會漲，今年會跌，變的是折現率不是公司。", "url": "https://www.aol.com/articles/mongodb-inc-announces-second-quarter-200500000.html"},
    {"id": "macro_0", "channel": "總經政策", "tag": "製造業降溫", "color": "#7C6AF7", "stocks": [{"t": "XLI", "n": "工業類股 ETF，ISM 是它最直接的領先指標"}, {"t": "CAT", "n": "重機械龍頭，新訂單指數的下滑會先反映在它的訂單能見度"}, {"t": "NUE", "n": "鋼鐵，製造業擴張速度放緩會直接壓到用鋼需求"}], "en": "The ISM manufacturing PMI for August, released September 1, came in at 54.6%, down a full point from July's 55.6%. It is the eighth straight month of expansion, so the sector is still growing, but the new orders index fell three points to 53.7% from 56.7%. New orders lead output by roughly a quarter, so the read is expansion at a visibly slower tempo, not contraction. That nuance matters for a Fed deciding whether demand is cooling on its own.", "zh": "九月一日公布的八月 ISM 製造業指數是 54.6%，比七月的 55.6% 掉了整整一個百分點。這是連續第八個月站在擴張區，所以製造業還在成長；但新訂單指數從 56.7% 掉到 53.7%、一口氣少了三個百分點。新訂單通常領先實際產出約一季，所以這份報告講的是「擴張但明顯減速」，不是「轉為收縮」。這個分寸對正在判斷「需求會不會自己降溫」的聯準會來說，差別很大。", "url": "https://www.prnewswire.com/news-releases/manufacturing-pmi-at-54-6-august-2026-ism-manufacturing-pmi-report-302865127.html"},
    {"id": "macro_1", "channel": "總經政策", "tag": "全球債市", "color": "#7C6AF7", "stocks": [{"t": "EWJ", "n": "日本股市 ETF，十年期公債殖利率觸及 3%、1996 年以來首見"}, {"t": "EWU", "n": "英國股市 ETF，三十年期公債殖利率 5.89%、1998 年 5 月以來最高"}, {"t": "TLT", "n": "美國長債 ETF，三十年期殖利率 5.27%"}], "en": "This was a global event, not an American one. Japan's ten-year JGB yield touched 3% for the first time since 1996. UK thirty-year gilts hit 5.89%, the highest since May 1998, and the ten-year gilt reached 5.25%. Germany's ten-year at 3.35% is the highest since 2011 and France's 4.21% the highest since 2008, with euro zone inflation back above 3%. The common thread is fiscal supply meeting sticky inflation, everywhere at once.", "zh": "這是一場全球事件，不是美國自己的事。日本十年期公債殖利率觸及 3%，是 1996 年以來第一次。英國三十年期公債來到 5.89%，1998 年 5 月以來最高，十年期也升到 5.25%。德國十年期 3.35% 是 2011 年以來最高，法國 4.21% 是 2008 年以來最高，同時歐元區八月通膨重新站上 3%。共同的線索只有一條：各國的財政發債供給，同時撞上黏著的通膨。", "url": "https://asia.nikkei.com/business/markets/bonds/japan-benchmark-bond-yield-hits-30-year-high-of-3-amid-global-debt-selloff"},
    {"id": "macro_2", "channel": "總經政策", "tag": "就業與 FOMC", "color": "#7C6AF7", "stocks": [{"t": "SHY", "n": "短天期公債 ETF，兩年期殖利率最直接反映升息定價"}, {"t": "XLF", "n": "金融股 ETF，殖利率曲線陡峭化對銀行利差是好事"}, {"t": "KRE", "n": "區域銀行 ETF，對短端利率與存款成本最敏感"}], "en": "Friday's August payrolls report is the last major labour print before the September 15-16 FOMC. It matters more than usual because July payrolls unexpectedly fell by 23,000 and May and June were revised down by a combined 103,000. So the Fed heads into that meeting with a labour market that looks soft and an inflation picture that looks hot, which is the least comfortable combination a central bank can face.", "zh": "週五公布的八月非農就業報告，是九月十五、十六日 FOMC 之前最後一份重要的勞動市場數據。它比平常更關鍵，因為七月非農意外減少 2.3 萬人，五月與六月合計又被下修 10.3 萬人。等於聯準會走進那場會議時，手上拿的是一個看起來偏軟的就業市場，加上一個看起來偏熱的通膨畫面。這是央行最不舒服的組合，也是為什麼這次的市場定價會這麼躁動。", "url": "https://www.newsquawk.com/headlines/newsquawk-weekly-economic-calendar---31st-august---4th-september-2026"},
    {"id": "sector_0", "channel": "產業風向", "tag": "油輪運價", "color": "#4EABA4", "stocks": [{"t": "FRO", "n": "大型原油輪船東，VLCC 現貨運價直接反映在它的獲利"}, {"t": "INSW", "n": "美國籍國際海運，同時經營原油與成品油輪"}, {"t": "DHT", "n": "純 VLCC 船東，槓桿最直接的一檔"}], "en": "The most extreme price move in any market right now is not oil, it is freight. VLCC day rates hit a record $647,000 on August 28, against a normal baseline of $20,000 to $60,000. War risk insurance has gone from about 0.25% of hull value to between 3% and 10%, so a $100 million tanker now carries a $3 to $10 million premium. Transits through Hormuz are running at 7 to 10 a day, roughly 40% of 2025 volumes.", "zh": "現在全市場最極端的價格走勢不在油價，在運費。超大型油輪的日租金在八月二十八日創下每天 64.7 萬美元的紀錄，而正常水準是每天 2 萬到 6 萬美元。戰爭險保費從船體價值的約 0.25% 跳到 3% 至 10%，一艘一億美元的油輪光保費就要 300 萬到 1,000 萬。荷莫茲海峽的商船通行量剩下每天 7 到 10 艘，大約是 2025 年的四成。運價在說「這件事會拖很久」，油價期貨卻在說「很快會解決」。", "url": "https://www.seatrade-maritime.com/tankers/vlcc-rates-near-470-000-a-day-for-fixtures-through-hormuz"},
    {"id": "sector_1", "channel": "產業風向", "tag": "半導體", "color": "#4EABA4", "stocks": [{"t": "SOXX", "n": "半導體 ETF，當天承受最集中的賣壓"}, {"t": "AMD", "n": "單日跌約 3%，是族群裡的領跌者之一"}, {"t": "AVGO", "n": "今天盤後公布 FQ3，AI 半導體營收指引約 160 億美元"}], "en": "Chips were the epicentre of Tuesday's selling, and the reason is arithmetic rather than news flow. Semiconductor earnings are back-loaded and long-duration, so a move in the thirty-year yield hits their present value harder than it hits a utility's. Broadcom reports FQ3 after the close today with guided AI semiconductor revenue of about $16 billion, up more than 200% year over year, but also with gross margin guided down to about 74% on a heavier custom accelerator mix.", "zh": "晶片股是週二賣壓的震央，原因是算術而不是新聞。半導體的獲利是後置且長天期的，所以三十年期殖利率一動，對它現值的傷害會比對公用事業大得多。Broadcom 今天盤後公布會計年度第三季，AI 半導體營收指引約 160 億美元、年增超過 200%，但毛利率同時被導引下修到約 74%，因為低毛利的客製化加速器佔比升高。營收成長與毛利稀釋同時發生，這一份財報會定調整個族群的短期情緒。", "url": "https://investrade.com/mid-morning-look-september-01-2026/"},
    {"id": "sector_2", "channel": "產業風向", "tag": "天然氣", "color": "#4EABA4", "stocks": [{"t": "CRK", "n": "宣布 16.5 億美元出售部分權益給 SOCAR，單日漲約 8%"}, {"t": "EQT", "n": "美國最大天然氣生產商，同一條資料中心用電需求邏輯"}, {"t": "AR", "n": "阿帕拉契盆地生產商，跟 Haynesville 競爭同一批 LNG 與電力需求"}], "en": "Comstock Resources signed a letter of intent to sell SOCAR a 20% non-operated interest in its Legacy Haynesville assets, 15% of Western Haynesville and 15% of its Pinnacle stake for $1.65 billion in cash, with a separate $450 million drilling venture funded by Jerry Jones' family partnership. Net debt would fall from $3.1 billion to $1.5 billion while Comstock keeps operational control. The stock rose about 8%. This is a balance-sheet story dressed as a gas story.", "zh": "Comstock Resources 與亞塞拜然國家石油公司 SOCAR 簽了意向書，以 16.5 億美元現金出售 Legacy Haynesville 兩成非作業權益、Western Haynesville 一成五權益，以及 Pinnacle 持股的一成五；另外由大股東 Jerry Jones 家族出資 4.5 億美元的鑽井合資。淨負債會從 31 億美元降到 15 億，而且 Comstock 保留全部作業權。股價單日漲約 8%。這其實是一則資產負債表的故事，只是穿著天然氣的外衣。", "url": "https://www.globenewswire.com/news-release/2026/09/01/3354019/0/en/comstock-announces-1-65-billion-strategic-partnership-with-socar-and-450-million-drilling-joint-venture-with-jerry-jones.html"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "指數位置", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週二盤中跌 0.67% 至 2,936 附近"}, {"t": "IJR", "n": "標普小型股 600 ETF，成分股有獲利門檻"}, {"t": "VB", "n": "全市場小型股 ETF，遠期本益比約 17 倍"}], "en": "The Russell 2000 fell about 0.67% to around 2,936 on Tuesday, a smaller drop than the Nasdaq's 1.03%. That is worth noticing, because on a day when yields lead the selling small caps usually lose more, not less. The index is still up over 20% this year, its best run since 2003. Relative resilience on a rate-shock day is either a sign the rotation into small caps has real money behind it, or a lag that catches up later in the week.", "zh": "羅素 2000 週二盤中跌約 0.67% 到 2,936 附近，跌幅小於那斯達克的 1.03%。這件事值得記，因為在「殖利率主導賣壓」的日子，小型股通常應該跌得更多而不是更少。這個指數今年仍漲超過兩成，是 2003 年以來最好的一年。在利率衝擊日還能相對抗跌，只有兩種解釋：一是輪進小型股的資金是真金白銀，二是它只是反應慢、後面幾天才補跌。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-outpacing-p-500-163007242.html"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "浮動利率", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000，成分股的浮動利率債務比重遠高於大型股"}, {"t": "HYG", "n": "高收益債 ETF，小型股的信用成本先反映在這裡"}, {"t": "SRLN", "n": "槓桿貸款 ETF，浮動利率債務的直接觀測窗口"}], "en": "This is the mechanical risk under the small-cap rally. A far larger share of Russell 2000 debt is floating rate than in the S&P 500, so a Fed hike does not just compress their multiples, it raises their actual interest bill within a quarter. If the September FOMC hikes, the transmission into small-cap earnings is faster and more literal than into large-cap earnings. Watch high yield spreads and loan prices before watching the index itself.", "zh": "這是小型股漲勢底下那個機械性的風險。羅素 2000 成分股的債務裡，浮動利率的比重遠高於標普 500，所以聯準會升息不只是壓縮它們的本益比，而是在一季之內就實際墊高它們的利息支出。如果九月 FOMC 真的升息，這條傳導鏈打到小型股獲利的速度，比打到大型股快得多、也直白得多。要看風向，先看高收益債利差與槓桿貸款價格，那比看指數本身早。", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "二元風險", "color": "#5B8ED6", "stocks": [{"t": "CAPR", "n": "FDA 把 deramiocel 的審查決定日延到 11 月 22 日，單日漲約 6%"}, {"t": "ALMS", "n": "狼瘡試驗未達主要療效指標，單日腰斬約 51%"}, {"t": "MYGN", "n": "被降評至減碼，理由是獲利能力，單日跌約 7%"}], "en": "Three small-cap biotech moves on the same day illustrate why position sizing matters more than stock picking down here. Capricor rose about 6% because the FDA extended its action date to November 22, a delay read as engagement rather than rejection. Alumis halved on a failed lupus endpoint. Myriad Genetics fell about 7% on a downgrade. Two of the three were binary events with no partial credit available.", "zh": "同一天三檔小型生技股的走勢，說明了在這個市值層級，部位大小比選股更重要。Capricor 漲約 6%，因為 FDA 把 deramiocel 的審查決定日延到 11 月 22 日，市場把「延期」讀成「還在溝通」而不是「要被否決」。Alumis 因為狼瘡試驗沒過主要療效指標而腰斬 51%。Myriad Genetics 被降評到減碼、跌約 7%。三件事裡有兩件是二元事件，沒有拿一半分數這種選項。", "url": "https://www.timothysykes.com/news/capricor-therapeutics-inc-capr-news-2026_08_26/"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "估值落差", "color": "#5B8ED6", "stocks": [{"t": "VB", "n": "小型股 ETF，遠期本益比約 17 倍"}, {"t": "IVV", "n": "標普 500 ETF，遠期本益比約 20 倍"}, {"t": "IJR", "n": "小型股 600 ETF，用獲利門檻篩掉虧損公司"}], "en": "Here are the numbers behind the small-cap case. The Vanguard small-cap ETF trades at a forward P/E of about 17 against about 20 for the S&P 500. Small-cap earnings growth is forecast at 18% for 2026 and 18% again for 2027, which would be the first time in years that small caps out-grow large caps. A cheaper multiple on faster growth is the whole argument, and it only works if that earnings forecast survives a higher cost of debt.", "zh": "支撐小型股論述的數字是這樣的：Vanguard 小型股 ETF 的遠期本益比約 17 倍，標普 500 約 20 倍。小型股的獲利成長預估 2026 年 18%、2027 年再 18%，如果兌現，將是好幾年來第一次小型股獲利成長超過大型股。「更便宜的倍數配上更快的成長」就是整個論述的全部內容——而它成立的前提，是那個獲利預估撐得過更高的舉債成本。這正是這週該盯的地方。", "url": "https://www.fool.com/investing/2026/08/26/small-cap-stocks-waiting-years-moment-is-it-here/"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "池子知識", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素 2000 成長型 ETF，未獲利成分股比重高"}, {"t": "IWN", "n": "羅素 2000 價值型 ETF，產業組成偏金融與工業"}, {"t": "XBI", "n": "生技 ETF，是羅素 2000 裡未獲利公司最集中的一塊"}], "en": "A piece of plumbing worth knowing: the Russell 2000 and the S&P SmallCap 600 are not the same universe. Russell rebuilds by market cap alone, so loss-making companies get in automatically. The S&P 600 applies an earnings screen, so it does not hold them. That single rule is why the two indexes can diverge by several percentage points a year, and why quoting one small-cap number without saying which index you mean is close to meaningless.", "zh": "一個值得知道的管線細節：羅素 2000 和標普小型股 600 不是同一個池子。羅素完全按市值重組，虧損的公司會自動被納入；標普 600 有獲利門檻，虧錢的公司進不來。就是這一條規則，讓兩個指數一年可以差好幾個百分點。所以當有人說「小型股今年漲多少」，如果不講是哪一個指數，這句話幾乎沒有資訊量。你自己在挑小型股 ETF 時，其實也是在挑這條篩選規則。", "url": "https://www.morganstanley.com/im/en-us/individual-investor/insights/articles/russell-reconstitution.html"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "stocks": [{"t": "ISSC", "n": "航電微型股，FQ3 毛利率 51.7%、去年同期 35.6%"}, {"t": "HEI", "n": "航太售後零組件同業，市場給它很高的倍數"}, {"t": "TDG", "n": "航太售後龍頭，用來對照 ISSC 被定價的位置"}], "en": "Innovative Solutions and Support makes flight displays, air data systems and autopilots, and buys product lines that larger avionics firms no longer want. It is ignored because it is a sub-$1 billion company with almost no sell-side coverage. What changed: fiscal Q3 revenue rose about 11% to $26.7 million, EPS of $0.33 beat by $0.11, gross margin jumped to 51.7% from 35.6% and adjusted EBITDA rose about 75%. Risks: growth is acquisition-led, customer concentration is high and the shares are thinly traded. A research lead, not advice.", "zh": "Innovative Solutions and Support 做飛機的顯示器、大氣數據系統與自動駕駛儀，商業模式是把大型航電公司不想再顧的產品線買下來自己養。它被忽視的原因很單純：市值不到十億美元，賣方分析師幾乎沒有覆蓋。正在改變的是會計年度第三季：營收年增約 11% 到 2,670 萬美元，每股盈餘 0.33 美元超出預期 0.11 美元，毛利率從 35.6% 跳到 51.7%，調整後 EBITDA 年增約 75%。反方論點：成長主要靠併購而非有機、客戶集中度高、股票流動性很差，一筆大單就能推動價格。這是研究線索，不是投資建議。", "url": "https://www.tradingview.com/news/marketbeat:fd22aafd3094b:0-innovative-solutions-and-support-q3-earnings-call-highlights/", "status": "RADAR · 下一個驗證點 10 月 FQ4 財報（指引 2,800-3,000 萬營收）"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "stocks": [{"t": "TNK", "n": "第二季調整後淨利 1.936 億美元創公司史上最高，手上現金逾 12 億且零負債"}, {"t": "STNG", "n": "成品油輪同業，同樣被市場長期給予低倍數"}, {"t": "TNP", "n": "希臘籍油輪船東，用來對照整個族群的折價程度"}], "en": "Teekay Tankers owns Suezmaxes and Aframaxes and sells voyages at spot rates. It is ignored because shipping is treated as a permanently de-rated cyclical: few analysts, low multiples, no long-term institutional sponsorship. What changed: Q2 adjusted net income of $193.6 million was the highest in company history, free cash flow was about $200 million, and it ended the quarter with over $1.2 billion of cash and no debt against a roughly $9,700 per day breakeven. Since then VLCC rates hit a record. Risks: spot rates can halve on a ceasefire headline, and peak earnings is exactly when owners over-order new ships. A research lead, not advice.", "zh": "Teekay Tankers 擁有蘇伊士型與阿芙拉型原油輪，用現貨運價賣航次。它被忽視的原因是航運長期被當成「永久折價的循環股」：分析師少、本益比低、機構不願長期持有。正在改變的是第二季：調整後淨利 1.936 億美元是公司史上最高，自由現金流約 2 億美元，季末手上現金超過 12 億美元且零負債，而自由現金流損益兩平點只有每天約 9,700 美元。季後超大型油輪運價更創下每天 64.7 萬美元的紀錄。反方論點：現貨運價可以因為一則停火標題就腰斬，整個論述押在一個地緣事件上；而且獲利高峰正是船東最容易高價超訂新船的時候。這是研究線索，不是投資建議。", "url": "https://www.stocktitan.net/sec-filings/TNK/6-k-teekay-tankers-ltd-current-report-foreign-issuer-b4fc69bbc773.html", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報（Suezmax 已訂 44% 船期、均價每天 10.5 萬美元）"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "stocks": [{"t": "CRMD", "n": "第二季營收 1.019 億美元、淨利 2,600 萬，調整後 EBITDA 5,870 萬"}, {"t": "DVA", "n": "美國最大洗腎連鎖，是 DefenCath 的通路客戶之一"}, {"t": "FMS", "n": "另一家大型洗腎服務商，同屬終端使用者"}], "en": "CorMedix sells DefenCath, a catheter lock solution that reduces bloodstream infections in dialysis patients, and now also owns the acquired Melinta anti-infective portfolio. It is ignored because it spent a decade as a pre-revenue story and most investors still file it under speculative biotech. What changed: Q2 revenue of $101.9 million, net income of $26.0 million, adjusted EBITDA of $58.7 million, supply agreements now in place with all five of the largest US dialysis providers, and full-year guidance of $325-345 million with $125-140 million of adjusted EBITDA. Risks: heavy reliance on a small number of dialysis chains, reimbursement policy risk and the Melinta integration. A research lead, not advice.", "zh": "CorMedix 賣的是 DefenCath，一種降低洗腎病患導管相關血流感染的封管液，另外還併入了 Melinta 的抗感染藥品組合。它被忽視的原因是這家公司當了十年「還沒有營收的故事股」，多數投資人到現在仍把它歸類在投機生技。正在改變的是第二季：營收 1.019 億美元、淨利 2,600 萬美元、調整後 EBITDA 5,870 萬美元，而且已經跟美國前五大洗腎服務商全部簽下商業供應合約；全年指引 3.25 至 3.45 億美元營收、1.25 至 1.4 億調整後 EBITDA。反方論點：營收極度集中在少數幾家洗腎連鎖手上，給付政策一改就會受傷，Melinta 的整合也還沒走完。這是研究線索，不是投資建議。", "url": "https://www.globenewswire.com/news-release/2026/08/13/3344407/0/en/cormedix-therapeutics-reports-second-quarter-2026-financial-results-and-provides-business-update.html", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（新簽的大型洗腎商試點是否轉為實際採購量）"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內·驗證在即", "color": "#C9A227", "stocks": [{"t": "AVO", "n": "9 月 8 日盤後公布 FQ3 財報，是池內這一檔的關鍵驗證點"}, {"t": "LMNR", "n": "檸檬與酪梨種植同業，規模更小、覆蓋更少"}, {"t": "FDP", "n": "生鮮蔬果配銷同業，可對照毛利率的產業區間"}], "en": "Pool update. Mission Produce confirmed it will release fiscal Q3 results after the close on Tuesday, September 8. This is exactly the validation point recorded when it entered the pool: whether average avocado pricing has recovered, whether gross margin repairs, and whether management's description of the squeeze as temporary holds up. The company also has a $100 million buyback authorised in June, so actual repurchase volume and average price are the second thing to read. A research lead, not advice.", "zh": "池內更新。Mission Produce 已確認在九月八日星期二盤後公布會計年度第三季財報。這正是它入池時記下的驗證點：酪梨均價有沒有回升、毛利率能不能修復，以及管理層把利潤壓縮說成「暫時性」的說法站不站得住。另外它六月授權了 1 億美元的庫藏股，所以實際買回股數與均價會是第二個要看的地方——授權不等於執行，這一檔的誠信檢驗就在這裡。這是研究線索，不是投資建議。", "url": "https://www.globenewswire.com/news-release/2026/08/25/3350869/0/en/mission-produce-to-release-fiscal-third-quarter-2026-financial-results-on-tuesday-september-8-2026.html", "status": "RADAR · 下一個驗證點 9/8 盤後 FQ3 財報"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內·分拆延後", "color": "#C9A227", "stocks": [{"t": "KBR", "n": "9 月 1 日宣布 MTS 拿下擴大的氣象資料合約，效期至 2031 年 8 月"}, {"t": "LDOS", "n": "政府 IT 服務同業，分拆後的 Trinzic 會直接跟它競爭"}, {"t": "SAIC", "n": "另一家政府服務商，可對照這個族群的估值區間"}], "en": "Pool update, and the timing has moved. KBR's Mission Technology Solutions won an expanded contract on September 1 to deliver rapid weather data for US severe-storm forecasting, running from September 2026 to August 2031, a five-year backlog item landing in the exact unit being separated. But the spin-off itself is now targeted for January 4, 2027, not this year, and the Form 10 that would first disclose Trinzic's standalone financials and debt allocation is still not effective. The thesis is intact; the clock moved out a quarter. A research lead, not advice.", "zh": "池內更新，而且時程往後挪了。KBR 的 Mission Technology Solutions 在九月一日拿下一份擴大的氣象資料合約，替美國的劇烈天氣預報提供快速資料，效期從 2026 年 9 月到 2031 年 8 月——這是一筆五年期的訂單，而且正好落在要被分拆出去的那個事業體裡。但分拆本身的目標日期已經是 2027 年 1 月 4 日、不是今年，而首次揭露 Trinzic 獨立財務數字與債務分配的 Form 10 註冊聲明仍未生效。論點沒壞，時鐘往後撥了一季。這是研究線索，不是投資建議。", "url": "https://www.globenewswire.com/news-release/2026/09/01/3353899/0/en/kbr-s-mission-technology-solutions-wins-expanded-contract-to-help-predict-extreme-weather-improve-severe-storm-preparedness.html", "status": "RADAR · 下一個驗證點 Form 10 生效（分拆目標日 2027/01/04）"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內·外部檢查過關", "color": "#C9A227", "stocks": [{"t": "BATL", "n": "兩位董事於 8/26-27 合計買進 8.4 萬股、約 11 萬美元"}, {"t": "AMPY", "n": "同樣微型市值的油氣生產商，8 月授權 1,500 萬美元庫藏股"}, {"t": "USO", "n": "原油 ETF，西德州原油站上 87 美元是這一檔的外部條件"}], "en": "Pool update. Battalion Oil entered the pool with two external checks attached: whether WTI could hold above $80, and whether a second insider would follow the first. Both are now answered. WTI traded around $87.63 on September 1 after the Hormuz strikes, and Form 4 filings show directors William Rogers and Gregory Hinds bought 70,000 and 14,400 shares respectively at about $1.30 across August 26-27. Risks are unchanged and severe: a microcap producer whose entire margin sits on a war premium that can disappear on a headline. A research lead, not advice.", "zh": "池內更新。Battalion Oil 入池時掛了兩項外部檢查：西德州原油能不能守在 80 美元之上，以及會不會出現第二位內部人跟進。現在兩題都有答案了。荷莫茲海峽的攻擊之後，西德州原油九月一日報約 87.63 美元；Form 4 顯示董事 William Rogers 與 Gregory Hinds 在八月二十六到二十七日分別買進 7 萬股與 1.44 萬股，成交價約 1.30 美元。風險完全沒有改變而且很重：這是一家微型市值的生產商，整個利潤墊在一個隨時可能因為一則停火標題就消失的戰爭溢價上。這是研究線索，不是投資建議。", "url": "https://ounie.com/b/ounie/insider-conviction-daily/insider-conviction-daily-august-28-2026", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（兩項外部檢查均已通過）"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "單筆大額", "color": "#6DB56D", "stocks": [{"t": "GWRS", "n": "董事 Jonathan Levine 於 8/20 以每股 8.85 美元買進 65.16 萬股、約 577 萬美元"}, {"t": "AWR", "n": "加州受管制自來水公司，同業對照"}, {"t": "SJW", "n": "另一家受管制水公司，可看整個族群的估值區間"}], "en": "The largest insider purchase relative to company size in recent weeks came at Global Water Resources, a regulated water utility serving the Phoenix and Tucson corridors. Director Jonathan Levine bought 651,618 shares at $8.85 on August 20, about $5.77 million. For a company of this size that is a very large single ticket, and utilities are exactly the sector that gets hurt by rising long yields, which is what makes the timing interesting rather than routine.", "zh": "近幾週相對公司規模最大的一筆內部人買進，出現在 Global Water Resources，一家服務鳳凰城與圖森一帶的受管制自來水公司。董事 Jonathan Levine 在八月二十日以每股 8.85 美元買進 651,618 股，金額約 577 萬美元。以這個市值的公司來說，單筆這麼大很罕見。更值得記的是時點：公用事業正是長天期殖利率上升時最受傷的板塊，在這個時候用自己的錢買進，跟例行性的持股調整是兩回事。", "url": "https://www.tradingpedia.com/2026/08/24/us-insider-trades-show-shifts-in-key-names/"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "群聚與溢價", "color": "#6DB56D", "stocks": [{"t": "BIVI", "n": "四位高管（執行長、醫務長、財務長、董事）於 8/27-28 同時買進"}, {"t": "JUSH", "n": "執行長 James Cacioppo 買進 99.4 萬股、約 49.2 萬美元"}, {"t": "RCT", "n": "內部人以高於市價 24% 的價格認購 720 萬股新股"}], "en": "Three microcap signals with different shapes. At BioVie four insiders, the CEO, CMO, CFO and a director, bought on August 27-28, but the total was only about $49,000. At Jushi the CEO bought 994,000 shares for roughly $492,000. At RedCloud insiders agreed to buy 7.2 million new shares at $0.25, a 24% premium to the prior close. Paying above market is the rarest structure of the three, because it removes the usual excuse that the buyer simply got a good price.", "zh": "三個微型股訊號，形狀各不相同。BioVie 有四位內部人在八月二十七、二十八日同時買進，包括執行長、醫務長、財務長與一位董事，但合計金額只有約 4.9 萬美元。Jushi 的執行長買進 99.4 萬股、約 49.2 萬美元。RedCloud 則是內部人以每股 0.25 美元認購 720 萬股新股，比前一日收盤價高出 24%。三者之中，用高於市價的價格買，是最罕見的結構，因為它拿掉了「他只是撿到便宜」這個最常見的解釋。", "url": "https://www.sec.gov/Archives/edgar/data/0002027360/000149315226040520/form424b3.htm"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "判讀", "color": "#6DB56D", "stocks": [{"t": "ROCK", "n": "執行長 William Bosway 買進 19,735 股、約 73.9 萬美元，兩年內未申報任何賣出"}, {"t": "DKS", "n": "四位董事於 8/26-27 合計買進 372 萬美元"}, {"t": "GWRS", "n": "單筆 577 萬美元，相對市值是本頁三例中最大的一筆"}], "en": "How to read the cards above without fooling yourself. Dollar size is the least informative number: $3.72 million spread across four directors of a multi-billion dollar company is a smaller commitment than $5.77 million from one director of a $200 million utility. Better questions: what percentage of the insider's existing holding did this add, has that person ever sold, and where did they buy relative to the recent range. Gibraltar's CEO scores well on the second test, with no reported open-market sales in two years.", "zh": "怎麼讀上面那幾張卡而不騙自己。金額是資訊量最低的一個數字：四位董事在一家數十億美元公司合買 372 萬美元，其實比一位董事在一家兩億美元公司單筆買 577 萬美元的承諾小得多。比較有用的問題有三個：這一筆讓他的持股增加了幾成、這個人過去有沒有賣過、以及他買在近期區間的什麼位置。以第二題來說，Gibraltar 的執行長分數不錯——兩年內沒有申報過任何公開市場賣出。", "url": "https://www.gurufocus.com/news/8715691/insider-buying-william-bosway-acquires-shares-of-gibraltar-industries-inc-rock"},
    {"id": "capitol_0", "channel": "政要持股", "tag": "AI 光通訊", "color": "#B5654D", "stocks": [{"t": "FN", "n": "光收發模組代工，是這份申報裡最有主題性的一檔"}, {"t": "PANW", "n": "資安平台，昨晚剛公布 FY2026 第四季財報"}, {"t": "MSFT", "n": "同一份申報裡的大型科技持股"}], "en": "Working from the House Clerk's own PTR index, the disclosure worth reading this period is Josh Gottheimer's (NJ-05): 30 reported transactions over the trailing 90 days, 18 of them purchases, across 24 distinct names, with a reported lower bound above $1.5 million. The interesting part is not the size but the pairing. Fabrinet, which builds optical transceivers for AI networking, sits alongside Palo Alto Networks. That is a position betting AI capital spending flows into the optics and the security layer, not only into the accelerators. What is disclosed is a position, not a view.", "zh": "直接讀眾議院書記官的申報索引，這一期最值得看的是 Josh Gottheimer（新澤西第五選區）的申報：過去九十天共 30 筆交易、其中 18 筆買進，涵蓋 24 個不同標的，申報金額區間下緣超過 150 萬美元。有意思的不是金額，是配對——Fabrinet 是做 AI 網路用光收發模組的代工廠，跟 Palo Alto Networks 擺在一起。這個組合押的是「AI 資本支出會流進光通訊與資安這兩層」，而不只是流進加速器本身。申報揭露的是一個部位，不是一個看法。", "url": "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/20035186.pdf"},
    {"id": "capitol_1", "channel": "政要持股", "tag": "判讀", "color": "#B5654D", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報持股的 ETF"}, {"t": "GOP", "n": "追蹤共和黨籍議員申報持股的 ETF"}], "en": "Today's reading note is about who actually pressed the button. A large share of congressional PTRs describe trades executed in a spouse's account or by a managed trust, and the filer may have had no involvement in the decision or even prior knowledge of it. Combine that with the 45-day reporting window and the disclosure bands, $1,001 to $15,000 and so on, never an exact figure, and what you are reading is a blurred snapshot of someone else's decision taken up to six weeks ago. That is a theme signal at best. It is not a trade signal, and copying it means buying at prices that no longer exist.", "zh": "今天的判讀重點是「到底是誰按下按鈕」。國會的申報裡有很大一部分，實際下單的是配偶帳戶或代操信託，申報人本人可能沒有參與決策、甚至事前不知情。把這一點跟四十五天的申報期限、以及只有區間沒有數字的揭露格式（1,001 到 15,000 美元這種）放在一起，你在讀的其實是一張模糊的快照，拍的是別人在最多六週前做的決定。這頂多是主題訊號。它不是買賣訊號，跟著買等於買在一個已經不存在的價位上。", "url": "https://www.congress.gov/crs_external_products/R/HTML/R47818.html"},
    {"id": "week_0", "channel": "本週事件", "tag": "總經數據", "color": "#C97DD4", "stocks": [{"t": "UUP", "n": "美元指數 ETF，非農與 ISM 服務業會直接推動它"}, {"t": "GLD", "n": "黃金 ETF，實質利率一升它就被比下去"}, {"t": "KRE", "n": "區域銀行 ETF，就業數據決定聯準會下一步"}], "en": "The rest of this week is dense. ADP private payrolls land Wednesday, ISM services and factory orders Thursday, and the August employment report Friday morning. Friday is the one that counts: it is the final labour reading before the September 15-16 FOMC, and July's surprise 23,000 decline plus 103,000 of downward revisions have left the market without a reliable base case. Expect the dollar, gold and rate-sensitive financials to do most of their moving on Friday morning.", "zh": "這一週剩下的行程很密。星期三是 ADP 民間就業，星期四是 ISM 服務業與工廠訂單，星期五早上是八月的就業報告。真正有份量的是星期五：那是九月十五、十六日 FOMC 之前最後一份勞動市場數據，而七月意外減少 2.3 萬人、加上前兩個月合計被下修 10.3 萬人，讓市場現在根本沒有一個可靠的基準情境。美元、黃金與利率敏感的金融股，這週的波動大概會集中在星期五早上那半小時。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar"},
    {"id": "week_1", "channel": "本週事件", "tag": "重點財報", "color": "#C97DD4", "stocks": [{"t": "AVGO", "n": "今天盤後公布 FQ3，AI 半導體營收指引約 160 億美元"}, {"t": "CIEN", "n": "光通訊設備商，本週財報是 AI 網路需求的另一個檢查點"}, {"t": "DOCU", "n": "電子簽署，本週財報用來看軟體訂閱端的需求"}], "en": "Broadcom reports after the close today and it is the week's single most consequential print. Consensus sits near $29.4 billion of revenue, up about 84% year over year, with AI semiconductor revenue guided to roughly $16 billion. The tension is margin: guidance implies consolidated gross margin around 74%, down on a heavier custom accelerator mix. Ciena and DocuSign follow later in the week, giving separate reads on AI networking hardware and on ordinary software demand.", "zh": "Broadcom 今天盤後公布財報，是這一週最有份量的一份。市場共識落在營收約 294 億美元、年增約 84%，其中 AI 半導體營收指引約 160 億美元、年增超過兩倍。真正的張力在毛利率：指引隱含合併毛利率約 74%，比先前下滑，原因是低毛利的客製化加速器佔比升高。本週稍晚還有 Ciena 與 DocuSign，分別提供「AI 網路硬體」與「一般軟體訂閱需求」這兩條線的獨立讀數。", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262140230-nonfarm-payrolls-broadcom-dell-palo-alto-networks-earnings-august-tradingkey"},
    {"id": "eval_0", "channel": "今日評估", "tag": "今日一問", "color": "#E8A838", "stocks": [{"t": "IVV", "n": "標普 500 ETF，被重新定價的是折現率而不是獲利"}, {"t": "GLD", "n": "黃金，在殖利率飆升的環境裡失去了避險身分"}, {"t": "XLE", "n": "能源，是這兩天唯一同時受惠於油價與通膨的板塊"}], "en": "The single thing worth carrying out of today: this was not a stock story. Japan's ten-year at 3% for the first time since 1996, thirty-year gilts at levels last seen in 1998, and a US thirty-year at 5.27% all arrived on the same day, and equities simply repriced against them. Dell beat with a record backlog and had already fallen 6.5% before the print; MongoDB grew 30%, raised guidance, and fell 10%. The open question: if good results no longer produce good reactions, which of your holdings are you actually being paid to own?", "zh": "今天真正值得帶走的只有一件事：這不是一則股票的故事。日本十年期公債殖利率 1996 年以來首度觸及 3%、英國三十年期回到 1998 年才看得到的水準、美國三十年期停在 5.27%，全部發生在同一天，而股票只是被動地對著它們重新定價。Dell 交出創紀錄的訂單積壓，財報公布前股價已經先跌 6.5%；MongoDB 成長 30%、上調指引，盤後跌 10%。今天的開放式問題是：當好成績不再換來好反應，你手上的部位裡，哪幾檔是你真的有拿到報酬的？", "url": "https://www.bnnbloomberg.ca/investing/2026/09/01/global-bond-rout-deepens-as-japan-yield-hits-key-milestone/", "status": "今日評估 · 到 end screen 按討論鍵，把這一題丟給 AI"},
];

const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();
const lsKeyFor = (sub) => "mosfeed_" + BRIEF_ID + "_" + sub;

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/02/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v9.7</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
