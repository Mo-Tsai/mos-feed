<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
  ja: { locale:'ja-JP', lsKey:'mf_azureVoice_ja', fallback:'ja-JP-NanamiNeural',     styleKey:'mf_azureStyle_ja',
        sysVoices:["Microsoft Nanami Online (Natural) - Japanese (Japan)","Google 日本語","Kyoko","O-ren"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : lang === "ja" ? "ja" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  if (L === "ja") return card.ja || card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
async function azureSpeak(text, { rate='0%', speakLang='en', onStart, onEnd, onError }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  if (!key) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const token = await _getAzToken(key, region, ctrl.signal);
    const style = localStorage.getItem(conf.styleKey) || '';
    const useStyle = style && STYLE_VOICES.has(voice);
    const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
    const inner = `<prosody rate='${rate}'>${body}</prosody>`;
    const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
    // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
    const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
    const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${styled}</voice></speak>`;
    const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method:'POST', signal:ctrl.signal,
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
      body:ssml
    });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (ctrl.signal.aborted) return true;
    const url = URL.createObjectURL(blob);
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) onEnd(); };
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "月線四連紅", "color": "#E05C5C", "stocks": [{"t": "AMZN", "n": "週五單日暴漲 15.63%，是指數最大貢獻者"}, {"t": "GOOGL", "n": "同步上漲 7.12%，雲端與 AI 敘事同一條線"}, {"t": "SPY", "n": "S&P 500 收 7,489.72、當日 +0.7%"}], "zh": "七月最後一個交易日，三大指數同步收高：道瓊漲 276.97 點（+0.53%）收在 52,485.03，S&P 500 漲 0.7% 收 7,489.72，那斯達克漲 1% 收 25,373.85，道瓊寫下連續第四個月上漲。推力來自雲端財報——亞馬遜單日狂漲 15.63%，Alphabet 漲 7.12%，輝達漲 3.46%。值得注意的是市場「看過去」的部分：這一天長天期公債殖利率其實在上衝，但資金選擇先押獲利、後算折現率。這種順序在多頭末段很常見，也是接下來幾週最需要盯的張力。", "en": "On the last trading day of July all three major indexes closed higher: the Dow added 276.97 points (+0.53%) to 52,485.03, the S&P 500 rose 0.7% to 7,489.72 and the Nasdaq Composite gained 1% to 25,373.85 — the Dow's fourth consecutive winning month. The drive came from cloud earnings, with Amazon surging 15.63% on the day, Alphabet up 7.12% and Nvidia up 3.46%. Note what the market chose to look past: long-dated Treasury yields were climbing the same session, and money decided to price the earnings first and the discount rate later. That ordering is common late in a bull run, and it is the tension worth watching over the next few weeks.", "ja": "7月最後の取引日、主要3指数はそろって上昇して引けた。ダウは276.97ドル高（+0.53%）の52,485.03ドル、S&P500は0.7%高の7,489.72、ナスダック総合は1%高の25,373.85で、ダウは4カ月連続の月間上昇となった。原動力はクラウド決算だ。アマゾンは当日15.63%急騰し、アルファベットは7.12%高、エヌビディアは3.46%高。注目すべきは市場が「見送った」部分である。同じセッションで長期国債利回りは上昇していたが、資金は利益を先に、割引率を後に価格付けすることを選んだ。この順序は強気相場の終盤によく見られ、今後数週間で最も注視すべき緊張点でもある。", "url": "https://www.cnbc.com/2026/07/30/stock-market-today-live-updates.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "巨頭分化", "color": "#E05C5C", "stocks": [{"t": "MSFT", "n": "與 GOOGL、AMZN 合計單週市值增加近 1.5 兆美元"}, {"t": "META", "n": "同屬 AI 資本支出陣營，但資金已開始分辨誰在賺錢"}, {"t": "XLK", "n": "科技類股 7 月整體落後，巨頭內部差距是主因"}], "zh": "這一週最該記住的不是指數漲多少，而是巨頭之間的差距拉開了。Alphabet、亞馬遜與微軟三家單週合計市值增加將近 1.5 兆美元，同一時間蘋果卻因財測不如預期重挫逾 7%。放大到整個七月，大型科技股其實整體流失約 6,580 億美元市值，科技與通訊服務是當月最落後的兩個類股。換句話說，「AI 巨頭」已經不是一個可以整包買的概念——市場開始逐一驗收誰的資本支出正在變成營收，誰只是在花錢。", "en": "The thing to remember from last week is not how much the index gained but how far the mega-caps separated. Alphabet, Amazon and Microsoft added close to $1.5 trillion in combined market value over the week, while Apple fell more than 7% on soft guidance. Zoom out to the full month and mega-cap tech actually shed roughly $658 billion, with Information Technology and Communication Services the two worst-performing sectors in July. In other words, 'the AI giants' is no longer a concept you can buy as a bundle — the market has started auditing them one by one on whether the capex is turning into revenue or is still just spending.", "ja": "先週覚えておくべきは指数の上昇幅ではなく、メガキャップ同士の差が開いたことだ。アルファベット、アマゾン、マイクロソフトの3社は週間で合計約1.5兆ドルの時価総額を積み増した一方、アップルは弱いガイダンスで7%超下落した。7月全体に広げると、メガキャップ・テックはむしろ約6,580億ドルを失っており、情報技術と通信サービスは7月の最下位2セクターだった。つまり「AI巨人」はもはや一括で買える概念ではない。市場は、設備投資が売上に変わっているのか、それともまだ支出にすぎないのかを一社ずつ検証し始めている。", "url": "https://www.cnbc.com/2026/07/31/apple-aapl-amazon-amzn-stock-today.html"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "殖利率壓力", "color": "#E05C5C", "stocks": [{"t": "TLT", "n": "長天期公債 ETF 直接承受 30 年期殖利率上行"}, {"t": "XLU", "n": "公用事業是股市裡最像債券的部位"}, {"t": "LQD", "n": "投資級公司債同樣吃長端利率的重估"}], "zh": "股市週五漲，債市週五賣。30 年期美國公債殖利率一路衝到 5.23%，是 2007 年以來、也就是 19 年來的最高水準，市場給的理由是對通膨與 Fed 政策路徑的不信任，有券商直接用「通膨信譽衝擊」形容目前的定價。這對股票不是中性的：折現率上升會壓縮所有長天期現金流的現值，受害最深的是估值最貴的成長股，以及公用事業、REIT 這類「股票外殼、債券本質」的部位。週五股債背離可以持續幾天，但很少能持續幾季。", "en": "Stocks rallied Friday; bonds sold off Friday. The 30-year US Treasury yield pushed to 5.23%, its highest since 2007 and therefore a 19-year peak, on distrust of the inflation path and of where Fed policy goes next — one desk described the current pricing outright as an 'inflation credibility shock.' This is not neutral for equities. A rising discount rate compresses the present value of every long-duration cash flow, and the deepest damage lands on the most expensive growth names plus utilities and REITs, which are bonds wearing an equity wrapper. A stock-bond divergence like Friday's can persist for days; it rarely persists for quarters.", "ja": "金曜、株は買われ、債券は売られた。米30年債利回りは5.23%まで上昇し、2007年以来つまり19年ぶりの高水準となった。理由はインフレ経路とFRBの政策先行きへの不信で、あるディーラーは現在の価格形成を端的に「インフレ信認ショック」と表現している。これは株式にとって中立ではない。割引率の上昇はあらゆる長期キャッシュフローの現在価値を圧縮し、最も打撃を受けるのは割高な成長株と、公益事業やREITのような「株の皮をかぶった債券」だ。金曜のような株債の乖離は数日は続きうるが、数四半期続くことはめったにない。", "url": "https://www.cnbc.com/2026/07/29/treasury-yields-fed-interest-rates.html"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "商品訊號", "color": "#E05C5C", "stocks": [{"t": "GLD", "n": "黃金週五跌破每盎司 4,100 美元，但仍守住五個月來首次月線收紅"}, {"t": "GDX", "n": "金礦股的槓桿完全跟著金價走"}, {"t": "UUP", "n": "升息預期支撐美元，是壓抑金價的另一隻手"}], "zh": "商品市場週五給了一個矛盾的訊號：黃金跌破每盎司 4,100 美元、中斷連兩個交易日的漲勢，但整個七月仍收紅，是五個月來第一次月線上漲。壓抑金價的是同一件事——中東衝突推升油價、油價推升通膨預期、通膨預期推升升息機率、升息機率推升實質利率與美元，而實質利率上升對不孳息的黃金是純逆風。所以現在的黃金同時被「避險需求」拉著、被「升息預期」壓著，兩股力量誰贏，實際上取決於九月 FOMC。", "en": "Commodities sent a contradictory signal on Friday: gold slipped below $4,100 an ounce, snapping a two-session winning streak, yet still closed July higher — its first monthly gain in five months. What is capping gold is a single chain: the Middle East conflict lifts oil, oil lifts inflation expectations, inflation expectations lift hike odds, and hike odds lift real rates and the dollar — and rising real rates are pure headwind for an asset that pays no yield. So gold is currently being pulled up by safe-haven demand and pressed down by hike expectations at the same time. Which force wins is, in practice, a question about the September FOMC.", "ja": "金曜の商品市場は矛盾したシグナルを出した。金は1オンス4,100ドルを割り込み2営業日続伸を止めたが、7月は月間で上昇し、5カ月ぶりの月間プラスとなった。金を抑えているのは一本の連鎖だ。中東情勢が原油を押し上げ、原油がインフレ期待を押し上げ、インフレ期待が利上げ確率を押し上げ、利上げ確率が実質金利とドルを押し上げる。実質金利の上昇は、利息を生まない資産にとって純粋な逆風である。つまり金は今、安全資産需要に引き上げられつつ、利上げ期待に押し下げられている。どちらが勝つかは、実務的には9月FOMCの問題だ。", "url": "https://tradingeconomics.com/commodity/gold"},
    {"id": "earn_0", "channel": "財報速報", "tag": "AWS 加速", "color": "#E8786A", "stocks": [{"t": "AMZN", "n": "Q2 EPS 1.97 美元勝預估 1.82，營收 2,006 億勝 1,965 億"}, {"t": "NVDA", "n": "2,200 億美元資本支出的直接受款方之一"}, {"t": "VRT", "n": "資料中心電力與散熱，資本支出的下游承接者"}], "zh": "亞馬遜週四盤後交出這個財報季最強的一份成績單：調整後 EPS 1.97 美元勝過預估的 1.82，營收 2,006.1 億美元勝過預估的 1,964.7 億，而真正引爆股價的是 AWS——雲端營收年增約 37%，遠高於華爾街預期的 31%，是 2021 年以來最快增速。但同一份財報也把代價寫得很清楚：執行長 Andy Jassy 把今年資本支出從 2,000 億上調到 2,200 億美元，自由現金流轉為負 76 億美元。市場這次選擇獎勵成長、忽略現金流，這個取捨能維持多久，本身就是一個值得追蹤的問題。", "en": "Amazon delivered the strongest print of this earnings season after Thursday's close: adjusted EPS of $1.97 beat the $1.82 estimate and revenue of $200.61 billion beat $196.47 billion — but what detonated the stock was AWS, where cloud revenue grew about 37% year over year against Wall Street's 31% expectation, the unit's fastest growth since 2021. The same report also spelled out the cost: CEO Andy Jassy raised this year's capital spending to $220 billion from $200 billion, and free cash flow swung to negative $7.6 billion. The market chose to reward growth and ignore cash flow this time. How long that trade-off holds is itself a question worth tracking.", "ja": "アマゾンは木曜引け後、今決算シーズン最強の内容を示した。調整後EPSは1.97ドルで予想1.82ドルを上回り、売上高は2,006.1億ドルで予想1,964.7億ドルを超えた。だが株価を爆発させたのはAWSだ。クラウド売上は前年同期比約37%増と、ウォール街の31%予想を大きく上回り、2021年以来の高成長となった。同時にこの決算はコストも明示している。アンディ・ジャシーCEOは今年の設備投資を2,000億ドルから2,200億ドルへ引き上げ、フリーキャッシュフローはマイナス76億ドルに転じた。市場は今回、成長を評価しキャッシュフローを無視することを選んだ。このトレードオフがいつまで持つかは、それ自体が追跡に値する問いだ。", "url": "https://www.cnbc.com/2026/07/30/amazon-amzn-q2-earnings-report-2026.html"},
    {"id": "earn_1", "channel": "財報速報", "tag": "財測懲罰", "color": "#E8786A", "stocks": [{"t": "AAPL", "n": "財報三率超標，仍因財測不足重挫逾 7%"}, {"t": "QQQ", "n": "蘋果權重高，單日拖累整個那斯達克敘事"}], "zh": "蘋果這份財報是本季最好的教材：獲利、營收與 iPhone 銷售三項全部優於市場預期，股價卻在週五重挫逾 7%。原因只有一個——財測。公司給出本季營收年增 9% 到 11%，低於分析師預期的 12%，理由是「供應限制」。也就是說，在目前這個估值水位上，市場已經不再為「過去一季做得好」付錢，只為「下一季能做多好」付錢。這是財報季後半段最重要的行為改變，讀本週財報時請把這把尺帶著。", "en": "Apple's report is the best teaching case of the quarter: earnings, revenue and iPhone sales all came in above expectations, and the stock still fell more than 7% on Friday. The reason was singular — guidance. The company projected current-quarter revenue growth of 9% to 11%, below the 12% analysts wanted, citing supply constraints. Which is to say: at today's valuations the market no longer pays for what a company did last quarter, only for what it can do next quarter. That is the most important behavioural shift of the back half of earnings season, and it is the ruler to carry into this week's reports.", "ja": "アップルの決算は今四半期最良の教材だ。利益、売上、iPhone販売のすべてが市場予想を上回りながら、株価は金曜に7%超下落した。理由は一つ——ガイダンスである。同社は今四半期の売上成長率を9～11%と示し、アナリスト予想の12%を下回った。理由は「供給制約」だ。つまり現在のバリュエーション水準では、市場はもはや「前四半期の実績」に対価を払わず、「次の四半期にどれだけできるか」にしか払わない。これは決算シーズン後半で最も重要な行動変化であり、今週の決算を読む際に携えるべき物差しである。", "url": "https://finance.yahoo.com/technology/live/tech-stocks-today-big-tech-earnings-134611080.html"},
    {"id": "earn_2", "channel": "財報速報", "tag": "成績單", "color": "#E8786A", "stocks": [{"t": "SPY", "n": "已公布約 300 家成分股中 85% 超預期"}, {"t": "RSP", "n": "等權重版本才看得出獲利成長是不是真的擴散"}], "zh": "把整季拉遠一點看：S&P 500 已公布財報的約 300 家公司中，85% 超出市場預期，整體獲利追蹤到年增超過 47%，摩根士丹利也指出今年第一季的中位數 EPS 驚喜達 6%，是四年來最強、也高於約 5.5% 的長期平均。這是貨真價實的好數字。但也正因為好數字已經是共識，超預期本身不再能推動股價——蘋果就是證據。真正該問的不是「有沒有超預期」，而是「超預期的部分有沒有已經在價格裡」。", "en": "Step back and look at the season as a whole: of the roughly 300 S&P 500 companies that have reported, 85% beat expectations and aggregate profits are tracking to grow more than 47% year over year, while Morgan Stanley noted the median EPS surprise hit 6% in the first quarter of 2026 — the strongest in four years and above the long-run average of around 5.5%. These are genuinely good numbers. But precisely because good numbers are now the consensus, a beat by itself no longer moves the stock — Apple is the evidence. The question worth asking is not whether a company beat, but whether the beat was already in the price.", "ja": "シーズン全体を引いて見よう。S&P500のうちすでに発表した約300社の85%が予想を上回り、利益は全体で前年比47%超の伸びを辿っている。モルガン・スタンレーは2026年第1四半期のEPSサプライズの中央値が6%に達し、4年ぶりの高さで長期平均の約5.5%を上回ったと指摘した。正真正銘よい数字だ。だが、よい数字がすでにコンセンサスであるからこそ、上振れ自体は株価を動かさなくなっている——アップルがその証拠だ。問うべきは「上振れしたか」ではなく「その上振れがすでに価格に入っていたか」である。", "url": "https://www.cnbc.com/2026/07/31/stock-market-next-week-outlook-for-aug-3-7-2026.html"},
    {"id": "macro_0", "channel": "總經政策", "tag": "升息定價", "color": "#7C6AF7", "stocks": [{"t": "SHY", "n": "短天期公債最直接反映政策利率預期"}, {"t": "IEF", "n": "中天期是升息預期與衰退預期的交會點"}, {"t": "XLF", "n": "銀行在升息情境下淨利差相對受惠"}], "zh": "七月 29 日的 FOMC 維持利率不變，但這份決議的重點不在結果、在反對票：12 位委員中有 3 位主張立刻升息 1 碼。Fed 主席 Kevin Warsh 偏好減少前瞻指引，等於刻意讓市場自己去猜，結果就是定價分歧——CME FedWatch 給九月升息 59.2%，其他管道給到 63% 至 64%。請把這個數字的方向記清楚：市場現在辯論的是「要不要升息」，不是「什麼時候降息」。過去兩年所有建立在降息假設上的部位，前提都已經換了。", "en": "The July 29 FOMC left rates unchanged, but the significant part of that decision was not the outcome — it was the dissents. Three of the twelve members argued for an immediate 25bp increase. Fed Chair Kevin Warsh's preference for less forward guidance effectively leaves the market to guess, and the result is dispersion in pricing: CME FedWatch puts September hike odds at 59.2%, other channels at 63% to 64%. Note the direction carefully. What the market is now debating is whether to hike, not when to cut. Every position built on a rate-cut assumption over the past two years has had its premise swapped out.", "ja": "7月29日のFOMCは金利を据え置いたが、この決定の要点は結果ではなく反対票にある。12名の委員のうち3名が即時0.25%の利上げを主張した。ケビン・ウォーシュFRB議長はフォワードガイダンスを減らすことを好み、実質的に市場に推測を委ねている。その結果、価格形成はばらついた。CME FedWatchは9月の利上げ確率を59.2%、他の経路は63～64%と示す。方向をしっかり記憶しておきたい。市場が今議論しているのは「利上げするかどうか」であって「いつ利下げするか」ではない。過去2年間、利下げ前提で組まれたあらゆるポジションは、前提そのものが入れ替わっている。", "url": "https://www.theglobeandmail.com/investing/article-us-30-year-yields-scale-19-year-high-on-fed-policy-uncertainty/"},
    {"id": "macro_1", "channel": "總經政策", "tag": "供給衝擊", "color": "#7C6AF7", "stocks": [{"t": "XLE", "n": "能源是七月表現最強的類股之一"}, {"t": "VLO", "n": "煉油裂解價差七月初衝上四年高點"}, {"t": "BNO", "n": "布蘭特七月漲逾 20%，2 月以來的美伊衝突是主因"}], "zh": "這輪通膨的源頭不在需求、在供給。自二月底美伊衝突爆發以來，荷姆茲海峽的原油與油品流動持續受阻，七月布蘭特原油單月大漲逾 20%，7/31 開盤報 89.12 美元、WTI 報 83.88 美元。更值得注意的是結構：國際買家被迫轉向替代供應，把美國煉油廠的裂解價差在七月初推上四年新高——原油市場看起來供應充足，成品油市場卻很緊。這個組合對 Fed 是最難處理的一種通膨，因為升息壓得下需求，卻打不開一條海峽。", "en": "The source of this inflation is not demand — it is supply. Since the US-Iran conflict erupted in late February, crude and product flows through the Strait of Hormuz have been persistently disrupted; Brent rose more than 20% over the month of July, opening at $89.12 on July 31 with WTI at $83.88. The structure matters more than the level: international buyers forced to seek alternative supply pushed US refinery crack spreads to four-year highs by early July — the crude market looks well supplied while the product market is tight. That combination is the hardest kind of inflation for the Fed, because a rate hike can suppress demand but cannot reopen a strait.", "ja": "今回のインフレの源は需要ではなく供給にある。2月末に米イラン衝突が発生して以降、ホルムズ海峡を通る原油と石油製品の流れは継続的に阻害されてきた。7月のブレントは月間20%超上昇し、7月31日の寄り付きは89.12ドル、WTIは83.88ドルだった。水準より構造が重要だ。代替供給を求めざるを得なくなった国際的な買い手が米製油所のクラックスプレッドを7月初旬に4年ぶり高水準へ押し上げた——原油市場は潤沢に見えるのに製品市場は逼迫している。この組み合わせはFRBにとって最も扱いにくい種類のインフレだ。利上げは需要を抑えられても、海峡を開けることはできない。", "url": "https://www.eia.gov/todayinenergy/detail.php?id=67865"},
    {"id": "macro_2", "channel": "總經政策", "tag": "長端定價", "color": "#7C6AF7", "stocks": [{"t": "TLT", "n": "30 年期殖利率 5.23%，19 年新高"}, {"t": "VNQ", "n": "REIT 族群因長端利率被法人整批迴避"}, {"t": "O", "n": "月配息 REIT 的股價與長債殖利率高度反向"}], "zh": "30 年期殖利率衝上 5.23%、創 2007 年以來新高，這件事的影響比「債券跌」大得多。長端殖利率是整個市場的折現率基準，它一動，估值模型的分母就跟著動——最直接受害的是靠穩定現金流評價的資產：REIT、公用事業、必需消費裡的高股息股，以及所有本益比建立在「未來很久以後的獲利」上的成長股。今天雷達頻道裡出現的戶外廣告 REIT，被忽視的原因有一半就是這條線；理解這條線，才知道那是機會還是陷阱。", "en": "The 30-year yield reaching 5.23%, a high since 2007, matters far more than 'bonds went down.' The long end is the discount-rate anchor for the whole market, and when it moves the denominator in every valuation model moves with it. The most direct casualties are assets priced off stable cash flows: REITs, utilities, high-dividend staples — and every growth stock whose multiple rests on profits a long way in the future. The outdoor-advertising REIT in today's radar channel is half-ignored for exactly this reason. Understanding this line is what tells you whether that is an opportunity or a trap.", "ja": "30年債利回りが2007年以来の高水準となる5.23%に達したことの意味は、「債券が下がった」よりはるかに大きい。長期金利は市場全体の割引率のアンカーであり、それが動けばあらゆるバリュエーションモデルの分母が動く。最も直接的な被害を受けるのは安定キャッシュフローで評価される資産だ。REIT、公益事業、高配当の生活必需品株、そして遠い将来の利益の上に倍率が乗っているすべての成長株である。今日のレーダーに登場する屋外広告REITが半ば無視されている理由の半分はこの線にある。この線を理解して初めて、それが機会なのか罠なのかが分かる。", "url": "https://www.cnbc.com/2026/07/29/treasury-yields-fed-interest-rates.html"},
    {"id": "sector_0", "channel": "產業風向", "tag": "金融領漲", "color": "#4EABA4", "stocks": [{"t": "KRE", "n": "區域銀行 ETF 今年至 7/29 報酬 18.9%，遠勝 S&P 的 7.5%"}, {"t": "XLF", "n": "整體金融板塊今年報酬 4.4%，落後區域銀行甚多"}, {"t": "WFC", "n": "Q2 股票交易收入年增 64%，說明銀行不只靠利差"}], "zh": "七月的贏家是金融，而金融內部的贏家是區域銀行。截至 7/29，涵蓋約 160 檔等權重銀行股的 KRE 今年報酬 18.9%，大幅領先 S&P 500 的 7.5% 與整體金融板塊的 4.4%。推力有兩層：一是淨息差擴張且信用成本平穩，二是交易與併購業務回溫——富國銀行 Q2 股票交易收入年增 64% 就是代表。這也解釋了為什麼忽視雷達池裡社區銀行的比重這麼高：整個族群的獲利引擎確實在改善，剩下的問題是誰的改善是結構性的、誰只是搭順風車。", "en": "July's winner was financials, and the winner inside financials was regional banks. Through July 29, the KRE ETF covering roughly 160 equally weighted bank stocks returned 18.9% year to date, well ahead of the S&P 500's 7.5% and the broad financial sector's 4.4%. There are two drivers: net interest margins widening while credit costs stay flat, and trading and deal activity recovering — Wells Fargo's Q2 equities trading revenue jumping 64% is the emblem. This also explains why community banks are so heavily represented in the radar pool: the sector's earnings engine really is improving. The remaining question is whose improvement is structural and whose is just the tailwind.", "ja": "7月の勝者は金融であり、金融内部の勝者は地方銀行だった。7月29日時点で、約160の銀行株を均等加重で組み入れるKRE ETFの年初来リターンは18.9%と、S&P500の7.5%、金融セクター全体の4.4%を大きく上回る。推進力は二層ある。純金利マージンの拡大と信用コストの横ばい、そしてトレーディングとディール業務の回復だ。ウェルズ・ファーゴのQ2株式トレーディング収入が前年比64%増となったのが象徴的である。これはレーダープールにコミュニティバンクが多い理由でもある。セクターの収益エンジンは実際に改善している。残る問いは、誰の改善が構造的で、誰が追い風に乗っているだけかだ。", "url": "https://mercercapital.com/insights/newsletters/bank-watch-newsletter/2026/july-2026-banks-join-the-risk-on-trade/"},
    {"id": "sector_1", "channel": "產業風向", "tag": "科技退燒", "color": "#4EABA4", "stocks": [{"t": "XLK", "n": "資訊科技是七月表現最差的類股之一"}, {"t": "SMH", "n": "半導體族群的估值直接綁在 AI 資本支出回報上"}, {"t": "AVGO", "n": "客製化 AI 晶片是法人「賣鏟子」論點的核心持股之一"}], "zh": "七月最落後的兩個類股是資訊科技與通訊服務，理由不是財報差，而是「這些錢什麼時候能回本」的問題被搬上檯面。亞馬遜把資本支出拉到 2,200 億美元、微軟與 Alphabet 同步加碼，市場開始分兩派：一派認為這是護城河擴建、另一派認為這是折舊還沒認列的成本。半導體是這個辯論的槓桿點，因為它同時是資本支出的受益方與估值最緊繃的一群。本週二 AMD 財報是第一個硬數據。", "en": "July's two weakest sectors were Information Technology and Communication Services, and the reason was not bad earnings — it was that the question 'when does this money come back' finally moved onto the table. Amazon pushed capex to $220 billion while Microsoft and Alphabet also stepped up, and the market split in two: one camp reads it as moat construction, the other as depreciation not yet recognised. Semiconductors are the leverage point in that argument, because they are simultaneously the beneficiary of the capex and the group with the tightest valuations. AMD's report on Tuesday is the first hard data point.", "ja": "7月に最も出遅れたのは情報技術と通信サービスの2セクターだが、理由は決算の悪さではない。「この資金はいつ回収されるのか」という問いがついに表舞台に出たことだ。アマゾンが設備投資を2,200億ドルへ引き上げ、マイクロソフトとアルファベットも増額したことで、市場は二分した。一方は堀の構築と読み、もう一方はまだ計上されていない減価償却と読む。半導体はこの論争のレバレッジ点だ。設備投資の受益者であると同時に、最もバリュエーションが張り詰めたグループでもあるからだ。火曜のAMD決算が最初の硬いデータになる。", "url": "https://www.ig.com/en/news-and-trade-ideas/us-mega-caps-lose-in-july-260729"},
    {"id": "sector_2", "channel": "產業風向", "tag": "醫療回防", "color": "#4EABA4", "stocks": [{"t": "XLV", "n": "醫療保健是七月少數收紅的類股"}, {"t": "UNH", "n": "醫療服務的需求剛性是防禦邏輯的核心"}, {"t": "VRTX", "n": "以每股 85 美元現金收購 Crinetics，約 100 億美元"}], "zh": "醫療保健在七月是少數收紅的類股，而它被買的理由跟科技被賣的理由是同一件事：當資金想要「不放棄成長的防禦」時，會找需求剛性、資產負債表穩健、創新週期長的生意。這個板塊七月還多了一個催化劑——Vertex 宣布以每股 85 美元現金、約 100 億美元收購內分泌藥廠 Crinetics，雙方董事會一致通過、預計第三季完成。大藥廠在利率高檔仍願意用現金買成長，本身就是對這個板塊現金流品質的一種背書。", "en": "Health care was one of the few sectors to finish July higher, and the reason it was bought is the same reason tech was sold: when money wants defence without giving up growth, it looks for inelastic demand, balance-sheet strength and long innovation runways. The sector also picked up a catalyst in July — Vertex agreed to acquire endocrine drugmaker Crinetics for $85.00 per share in cash, valuing it at about $10 billion, unanimously approved by both boards and expected to close in Q3. A large pharma still willing to pay cash for growth with rates this high is itself an endorsement of the sector's cash-flow quality.", "ja": "ヘルスケアは7月に上昇した数少ないセクターの一つで、買われた理由はテックが売られた理由と同じだ。資金が「成長を諦めないディフェンス」を求めるとき、非弾力的な需要、強固なバランスシート、長いイノベーションの滑走路を持つビジネスを探す。7月にはカタリストも加わった。バーテックスが内分泌薬メーカーのクリネティクスを1株85ドルの現金、約100億ドルで買収することで合意し、両社取締役会が全会一致で承認、第3四半期の完了見込みとなった。この金利水準でも大手製薬が成長に現金を払う意思を示すこと自体、このセクターのキャッシュフローの質への裏書きである。", "url": "https://www.benzinga.com/markets/small-cap/26/07/60593569/russell-2000-small-cap-stocks-july-biggest-gainers-2026"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "35 年最佳", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "Russell 2000 今年至今漲近 22%，1991 年以來最佳上半年"}, {"t": "IJR", "n": "S&P 600 是同一個資產類別的另一種切法"}], "zh": "小型股今年的表現需要先講清楚規模：Russell 2000 自年初起漲近 22%，是 1991 年以來最好的上半年；至 7 月 10 日的近 12 個月總報酬 20.7%，而 S&P 500 同期是 11.3%。這不是小幅領先，是三十五年來最寬的一次。推力有兩層，一是 AI 順風向第二層受惠者擴散——晶片設備、資料中心連結——把小型科技硬體的估值抬起來；二是資金真的在往「內需成長、利率、信用可得性」這些變數靠。理解上半年這股力量的來源，才能判斷下半年它會不會被利率抽掉。", "en": "Start with the scale of what small caps have done: the Russell 2000 is up nearly 22% since the start of the year, its best first half since 1991, with a 20.7% total return over the trailing twelve months to July 10 against 11.3% for the S&P 500. That is not a narrow lead — it is the widest in thirty-five years. Two forces drove it. First, AI tailwinds spreading to second-order beneficiaries — chip equipment, data-centre connectivity — lifting small-cap tech hardware valuations. Second, money genuinely rotating toward domestic growth, interest rates, credit availability and market breadth. Understanding where the first-half force came from is what lets you judge whether rates can take it away in the second.", "ja": "小型株の今年の実績は、まず規模から押さえたい。ラッセル2000は年初来22%近く上昇し、1991年以来最良の上半期となった。7月10日までの直近12カ月のトータルリターンは20.7%で、S&P500の11.3%を大きく上回る。僅差のリードではなく、35年で最も広い差だ。要因は二つ。第一に、AIの追い風がチップ製造装置やデータセンター接続といった二次的受益者へ広がり、小型テックハードウェアのバリュエーションを押し上げたこと。第二に、資金が国内成長、金利、信用の利用可能性、市場の広がりへ実際にローテーションしていることだ。上半期の力の源を理解して初めて、下半期に金利がそれを奪えるかを判断できる。", "url": "https://www.cnbc.com/2026/06/30/small-cap-stocks-enjoy-best-first-half-since-1991-as-ai-trade-expands.html"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "升息數學", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "每升息 1 碼，R2K 營業獲利約減 2%"}, {"t": "IWO", "n": "小型成長股對融資條件收緊最敏感"}], "zh": "上一張講的是漲勢，這張講代價，而且是可以量化的代價。美銀估計，每多升息 1 碼，Russell 2000 的營業獲利就會被砍掉約 2%——原因是小公司持有的浮動利率債務比重遠高於大型股，再融資需求也更急。把這個數字乘上市場給九月升息的 59% 到 64% 機率，你會得到一個很具體的期望值，而不是一個模糊的「小型股怕升息」印象。這也是為什麼在目前的環境裡，「資產負債表乾淨」比「成長率高」更值得優先篩選。", "en": "The last card was about the rally; this one is about the cost, and the cost is quantifiable. Bank of America estimates every additional 25bp hike cuts Russell 2000 operating earnings by roughly 2%, because small companies carry far more floating-rate debt than large caps and face more urgent refinancing needs. Multiply that against the 59% to 64% odds the market assigns to a September hike and you get a concrete expected value rather than a vague sense that 'small caps fear rate rises.' It is also why, in this environment, screening for a clean balance sheet deserves priority over screening for a high growth rate.", "ja": "前のカードは上昇について、こちらはコストについて——しかも数値化できるコストだ。バンク・オブ・アメリカは、0.25%の追加利上げごとにラッセル2000の営業利益が約2%削られると試算する。小型企業は大型株よりはるかに変動金利債務の比率が高く、借換え需要も切迫しているからだ。これに市場が9月利上げに与える59～64%の確率を掛ければ、「小型株は利上げに弱い」という漠然とした印象ではなく、具体的な期待値が得られる。今の環境で「バランスシートのきれいさ」が「成長率の高さ」より優先すべきスクリーニング条件になる理由でもある。", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "個股催化", "color": "#5B8ED6", "stocks": [{"t": "CRNX", "n": "被 Vertex 以每股 85 美元現金收購，估值約 100 億美元"}, {"t": "VRTX", "n": "收購方；用現金買內分泌藥物管線"}], "zh": "七月有七檔小型股在四個交易日內漲逾 28%，但把它們攤開來看，這不是族群性的力量，而是個股各自的硬催化劑。最乾淨的一例是 Crinetics：Vertex 宣布以每股 85 美元現金收購，估值約 100 億美元，兩邊董事會一致通過，預計第三季完成。其他案例包括法規逆轉與法院放行的再融資。關鍵的判讀是——這些股票多數在年初到七月之前仍深陷虧損區，噴出來自事件而非趨勢。追這種行情要先確認催化劑是否已經一次性反映完畢。", "en": "Seven small caps gained 28% or more in just four trading sessions in July, but spread them out and this is not sector strength — it is individual stocks repricing on hard catalysts. The cleanest example is Crinetics: Vertex agreed to acquire it for $85.00 per share in cash, valuing the company at about $10 billion, unanimously approved by both boards and expected to close in Q3. Other cases involved regulatory reversals and court-cleared refinancings. The key read is that most of these names were still deep underwater for the year before the move — the spike came from an event, not a trend. Chasing this kind of move means first checking whether the catalyst has already been fully priced in one go.", "ja": "7月には7銘柄の小型株がわずか4営業日で28%以上上昇した。だが個別に広げてみると、これはセクターの力ではなく、個々の銘柄が硬いカタリストで再評価された結果だ。最も明快な例がクリネティクスである。バーテックスが1株85ドルの現金で買収することに合意し、企業価値は約100億ドル、両社取締役会が全会一致で承認、第3四半期完了見込みだ。他のケースには規制の巻き戻しや裁判所が認めた借換えがある。重要な読み筋は、これら銘柄の多くが上昇前まで年初来で大きくマイナス圏にいたこと——急騰はトレンドではなくイベント由来だ。この種の動きを追うなら、カタリストが一度に織り込み終わっていないかをまず確認すべきである。", "url": "https://www.benzinga.com/markets/small-cap/26/07/60593569/russell-2000-small-cap-stocks-july-biggest-gainers-2026"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "曲線算術", "color": "#5B8ED6", "stocks": [{"t": "KRE", "n": "區域銀行是 Russell 2000 內最大的單一產業"}, {"t": "RRBI", "n": "路易斯安那社區銀行；Q2 淨利 1,180 萬美元"}], "zh": "要理解小型股，得先知道區域銀行是 Russell 2000 裡最大的單一產業，所以殖利率曲線的形狀基本上就是小型股指數的半條命。目前十年期與三個月期公債的利差已擴大到 84 個基點，而三年前是倒掛 158 個基點——這個翻轉直接改善了以短端定價存款、以長端放款的銀行的獲利結構。Q2 財報是許多小型銀行第一個完整反映較低浮動利率成本的季度，路易斯安那的 Red River Bancshares 繳出 1,180 萬美元淨利就是樣本。但要注意：這條邏輯的前提是短端下行，若九月升息，前提就要重寫。", "en": "To understand small caps you first have to know that regional banks are the single largest industry inside the Russell 2000, which makes the shape of the yield curve roughly half the index's life. The spread between the ten-year and three-month Treasury has widened to 84 basis points, against an inversion of 158 basis points three years ago — a flip that directly improves the earnings structure of banks that price deposits off the short end and lend off the long end. Q2 was the first full quarter in which many smaller banks reflected materially lower floating-rate costs, and Louisiana's Red River Bancshares posting $11.8 million of net income is one sample. But note the premise: this logic assumes the short end falls. If September brings a hike, the premise gets rewritten.", "ja": "小型株を理解するには、まず地方銀行がラッセル2000内で最大の単一業種であることを知る必要がある。つまりイールドカーブの形状は、この指数の半分の生命線だ。10年債と3カ月債のスプレッドは84ベーシスポイントまで拡大した。3年前は158ベーシスポイントの逆イールドだった。この反転は、短期で預金を調達し長期で貸し出す銀行の収益構造を直接改善する。Q2は多くの小規模銀行にとって変動金利コストの低下が本格的に反映された最初の四半期であり、ルイジアナ州のレッド・リバー・バンクシェアーズが1,180万ドルの純利益を計上したのはその一例だ。ただし前提に注意——この論理は短期金利の低下を仮定している。9月に利上げがあれば、前提は書き換えとなる。", "url": "https://www.stocktitan.net/news/RRBI/red-river-bancshares-inc-reports-second-quarter-2026-financial-cmh5a8fnmw5d.html"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "指數差別", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "S&P 600 納入前需有連續獲利紀錄"}, {"t": "IWO", "n": "小型成長股裡不賺錢公司的比重最高"}], "zh": "這是每個買小型股 ETF 的人都該知道、但很少被講的結構細節：Russell 2000 與 S&P SmallCap 600 是兩種完全不同的東西。前者的納入規則只看市值排名，後者要求納入前需有連續獲利紀錄，機制上就濾掉了大量燒錢公司。在升息機率 60% 上下的環境裡，這個差別會被放大——不賺錢的公司靠的是持續取得資金，而資金成本正在上升。同一個「小型股」標籤下，你可能買到兩種風險完全不同的曝險，這應該是有意識的選擇，不是習慣。", "en": "Here is the structural detail every small-cap ETF buyer should know and almost nobody discusses: the Russell 2000 and the S&P SmallCap 600 are two different things. The former's inclusion rule looks only at market-cap ranking; the latter requires a track record of positive earnings for inclusion, which mechanically screens out a large tail of cash-burning companies. In an environment with hike odds near 60%, that difference gets amplified — unprofitable companies depend on continued access to capital, and the cost of capital is rising. Under the same 'small cap' label you can buy two materially different risk exposures. That should be a deliberate choice, not a habit.", "ja": "小型株ETFを買うすべての人が知るべきで、ほとんど語られない構造的な細部がこれだ。ラッセル2000とS&P SmallCap 600はまったく別物である。前者の組入基準は時価総額の順位のみを見るが、後者は組入前に黒字の実績を要求し、資金を燃やす企業の大きな尾部を機械的に除外する。利上げ確率が60%前後の環境では、この差は増幅される。赤字企業は資金調達の継続に依存しており、その資金コストが上昇しているからだ。同じ「小型株」というラベルの下で、まったく異なるリスクエクスポージャーを買いうる。これは習慣ではなく、意図的な選択であるべきだ。", "url": "https://www.franklintempleton.com/articles/2026/royce-investment-partners/whats-next-for-us-small-caps-in-2026"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "本週交卷", "color": "#C9A227", "status": "RADAR · 下一個驗證點 08/05 Q2 財報（毛利率是否回到 20% 中段）", "stocks": [{"t": "HDSN", "n": "08/05 Q2 財報；Hartree 一年買 834,986 股、零賣出"}], "zh": "Hudson Technologies（HDSN）做冷媒回收、再製與銷售，是 AIM 法案 HFC 逐步淘汰下的回收端業者。被忽視的原因：小型股、產業冷門到幾乎無人討論、媒體聲量極低。正在改變的：10% 大股東 Hartree Partners 過去一年累計買進 834,986 股且零賣出，包含 7/1 買 288,111 股、7/2 買 271,302 股、7/21 再買 65,550 股（約 28.6 萬美元）；另與 Solstice Advanced Materials 簽授權，可回收再售專利 HFO 混合冷媒 R-448A 與 R-449A，切入商用冷凍替換需求；Q1 2026 營收 6,015 萬美元超預期的 5,715 萬。風險與反方論點：Q1 調整後 EPS 僅 0.01 美元、遠低於預期 0.05（-80%）；管理層自己已明說 Q2 售價會低於去年，因為去年缺貨漲價不會重演；全年毛利率 20% 中段目標未驗證，ERP 轉換仍在消化。本週三 8/5 就交卷，這是池內驗證密度最高的一檔。這是研究線索，不是投資建議。", "en": "Hudson Technologies (HDSN) recovers, reclaims and resells refrigerants — the recycling end of the AIM Act's HFC phase-down. Why it's ignored: small cap in an industry almost nobody discusses, with minimal media presence. What's changing: 10% holder Hartree Partners has bought 834,986 shares over the past year with zero sales, including 288,111 on July 1, 271,302 on July 2 and 65,550 (about $286,000) on July 21; a licensing deal with Solstice Advanced Materials lets it reclaim and resell the patented HFO blends R-448A and R-449A, opening the commercial refrigeration replacement market; and Q1 2026 revenue of $60.15 million beat the $57.15 million estimate. Risks and the counter-argument: Q1 adjusted EPS was just $0.01 against a $0.05 estimate, an 80% miss; management has said outright that Q2 selling prices will be below last year because the shortage-driven spike will not repeat; the full-year mid-20s gross margin target is unvalidated and an ERP transition is still being digested. Wednesday August 5 is when the guessing stops — this is the highest-density validation event in the pool. Research lead, not investment advice.", "ja": "Hudson Technologies（HDSN）は冷媒の回収・再生・販売を手掛け、AIM法によるHFC段階的削減の下でのリサイクル側の事業者だ。無視される理由：小型株で業界自体がほとんど話題にならず、メディア露出も極めて低い。変化していること：10%株主Hartree Partnersが過去1年で834,986株を購入し売却はゼロ。7月1日に288,111株、7月2日に271,302株、7月21日に65,550株（約28.6万ドル）を取得。またSolstice Advanced Materialsとのライセンス契約で特許HFO混合冷媒R-448A・R-449Aの再生販売が可能になり、業務用冷凍の置換需要に参入した。2026年Q1売上は6,015万ドルと予想の5,715万ドルを上回った。リスクと反対論：Q1の調整後EPSはわずか0.01ドルで予想0.05ドルを大きく下回り（-80%）、経営陣自らQ2の販売価格は前年を下回ると明言している。通年の粗利率20%半ば目標は未検証で、ERP移行も消化中だ。8月5日（水）に推測は終わる——プール内で最も検証密度の高い銘柄である。これは研究の手がかりであり、投資助言ではない。", "url": "https://www.stocktitan.net/sec-filings/HDSN/form-4-hudson-technologies-inc-ny-insider-trading-activity-d5d7823b3f57.html"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "訂單 vs 營收", "color": "#C9A227", "status": "RADAR · 下一個驗證點 08/05 盤後 Q2 財報（沙烏地新單是否進入 backlog）", "stocks": [{"t": "ERII", "n": "08/05 盤後 Q2 財報；2026 海淡營收指引低於 2025"}], "zh": "Energy Recovery（ERII）做 PX 壓力交換器，是海水淡化廠節能的核心設備，並向工業廢水與 CO2 冷凍拓展。被忽視的原因：股價個位數美元的小型股、利基產業、覆蓋少，且專案型營收難建模。正在改變的：7/20 拿下沙烏地大型海淡案，6/29 拿下印度 5 個工業廢水案，新品 PX Q650 發表；董事 Colin Sabol 6/15 以 8.88 美元加碼約 9.9 萬美元（持股 +25%），7/13 延攬前 TE Connectivity 感測器事業資深副總 John Mitchell 進董事會。風險與反方論點要說白：2026 年海淡業務營收指引為 1.05 至 1.25 億美元，低於 2025 年，管理層直接把原因指向專案延後；CO2 零售冷凍業務已結束並認列約 150 萬美元重組費用與 170 萬美元商譽減損，原本的第二成長曲線只剩廢水。多方論點現在完全壓在「新訂單能否轉成營收」這一點，8/5 盤後就是驗收。研究線索，不是投資建議。", "en": "Energy Recovery (ERII) makes PX pressure exchangers, the core energy-recovery equipment in desalination plants, and is expanding into industrial wastewater and CO2 refrigeration. Why it's ignored: a single-digit-dollar small cap in a niche industry with thin coverage, and project-based revenue that is hard to model. What's changing: a large Saudi desalination contract on July 20, five Indian industrial wastewater projects on June 29, and the new PX Q650 launch; director Colin Sabol added about $99,000 at $8.88 on June 15 (raising his stake 25%), and former TE Connectivity sensors SVP John Mitchell joined the board on July 13. The risks and counter-argument, stated plainly: 2026 desalination revenue guidance is $105-125 million, below 2025, with management pointing directly at project delays; the CO2 retail refrigeration business has been shut down with roughly $1.5 million of restructuring charges and $1.7 million of goodwill impairment, leaving wastewater as the only remaining second growth curve. The bull case now rests entirely on whether new orders convert into revenue, and August 5 after the close is the test. Research lead, not investment advice.", "ja": "Energy Recovery（ERII）は海水淡水化プラントの省エネ中核設備であるPX圧力交換器を製造し、産業排水とCO2冷凍へ展開している。無視される理由：株価が一桁ドルの小型株、ニッチ産業、カバレッジが薄く、プロジェクト型売上はモデル化が難しい。変化していること：7月20日にサウジの大型淡水化案件、6月29日にインドの産業排水5案件を獲得し、新製品PX Q650を発表。取締役Colin Sabolが6月15日に8.88ドルで約9.9万ドルを買い増し（保有+25%）、7月13日には元TEコネクティビティのセンサー事業SVPジョン・ミッチェルが取締役に就任した。リスクと反対論は明確に述べる。2026年の淡水化事業の売上ガイダンスは1.05億～1.25億ドルで2025年を下回り、経営陣は理由をプロジェクトの遅延と明言している。CO2小売冷凍事業は終了し、約150万ドルの再編費用と170万ドルののれん減損を計上、第二の成長曲線は排水だけとなった。強気論は今や「新規受注が売上に変わるか」の一点に懸かっており、8月5日引け後がその検証だ。研究の手がかりであり、投資助言ではない。", "url": "https://www.gurufocus.com/news/8966649/energy-recovery-erii-secures-contract-for-saudi-desalination-project"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "三人連買", "color": "#C9A227", "status": "RADAR · 下一個驗證點 08/04 盤後 Q2 財報（合併後營收規模與整合成本）", "stocks": [{"t": "MBC", "n": "08/04 盤後 Q2 財報；CEO 6/01 買 60,000 股"}, {"t": "AMWD", "n": "全股交換合併對象；兩家撞上同一個房市低迷"}], "zh": "MasterBrand（MBC）是廚房與浴室櫃體製造商，正與 American Woodmark 進行全股交換合併。被忽視的原因：建材與櫃體產業冷門、遇上房市疲軟、媒體聲量低、法人關注不足。正在改變的：三名內部人在 11 天內連續以市價買進——執行長 R. Banyard 於 6/1 買 60,000 股（近三個月最大單筆內部人買進）、董事 David Petratis 於 6/8 買 11,587 股、董事 Philip Fracassa 於 6/11 買 5,000 股；GuruFocus 給的 GF Value 約 13.21 美元，price-to-GF-Value 僅 0.69，屬顯著低估區間。風險與反方論點：Q1 2026 仍是 1,540 萬美元淨損、營收與獲利雙雙下滑；與 American Woodmark 的合併正好撞上房市低迷，整合風險與需求風險同時發生；建材需求與利率高度連動，而長端殖利率正在創 19 年新高。明天 8/4 盤後財報是第一個檢驗點。研究線索，不是投資建議。", "en": "MasterBrand (MBC) makes kitchen and bath cabinets and is in an all-stock merger with American Woodmark. Why it's ignored: building products and cabinetry is an unglamorous industry running into a soft housing market, with low media volume and thin institutional attention. What's changing: three insiders bought at market prices within eleven days — CEO R. Banyard bought 60,000 shares on June 1 (the largest single insider purchase in three months), director David Petratis 11,587 shares on June 8 and director Philip Fracassa 5,000 shares on June 11. GuruFocus puts GF Value near $13.21 with a price-to-GF-Value of just 0.69, a materially undervalued band. Risks and counter-argument: Q1 2026 was still a $15.4 million net loss with both revenue and profit declining; the American Woodmark merger lands directly on top of a weak housing market, so integration risk and demand risk arrive together; and building-products demand tracks rates closely while the long end is making 19-year highs. Tomorrow's August 4 post-close report is the first check. Research lead, not investment advice.", "ja": "MasterBrand（MBC）はキッチンとバスのキャビネットメーカーで、American Woodmarkとの全株式交換による合併を進めている。無視される理由：建材・キャビネット業界は地味で住宅市場の低迷に直面しており、メディア露出も機関投資家の関心も薄い。変化していること：3名の内部者が11日間で連続して市場価格で買い付けた——CEOのR. Banyardが6月1日に60,000株（直近3カ月で最大の単一内部者購入）、取締役David Petratisが6月8日に11,587株、取締役Philip Fracassaが6月11日に5,000株。GuruFocusのGF Valueは約13.21ドルで、price-to-GF-Valueは0.69と顕著な割安圏だ。リスクと反対論：2026年Q1はなお1,540万ドルの純損失で売上・利益とも減少。American Woodmarkとの合併は住宅市場の低迷と真正面からぶつかり、統合リスクと需要リスクが同時に発生する。建材需要は金利と強く連動し、長期金利は19年ぶり高値を更新中だ。明日8月4日引け後の決算が最初の検証となる。研究の手がかりであり、投資助言ではない。", "url": "https://www.gurufocus.com/news/8897598/insider-buying-r-banyard-acquires-60000-shares-of-masterbrand-inc-mbc"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "政策逆轉", "color": "#C9A227", "status": "RADAR · 下一個驗證點 下一份季報與財測（看撤銷的三年目標是否重新給出）", "stocks": [{"t": "OFIX", "n": "CMS 7/1 撤回 5/18 的給付調整，股價七月一度單日漲 16%"}], "zh": "今天第一檔新名字：Orthofix Medical（OFIX），做骨科重建與非侵入式骨生長刺激器的小型醫材公司。被忽視的原因：小型醫材、覆蓋薄，而且它五月才剛因為給付被砍而下修 2026 財測、甚至撤銷三年目標，市場基本上把它歸到「已經壞掉」的抽屜。正在改變的是政策本身：FDA 於 2026/04/16 把非侵入式骨生長刺激器由 Class III 降為 Class II，CMS 隨後在五月修改了 E0747、E0748、E0760 三個代碼的申報與費率規則（自 5/18 起適用）；但 7/1 CMS 發布修訂指引，撤回這些調整，公司預期平均給付將回到 5/18 前的水準，消息公布後股價曾單日漲 16%、七月累計漲逾 28%。風險與反方論點：政策可以逆轉一次，就可以逆轉第二次；FDA 的 Class II 降級長期而言降低了新競爭者的進入門檻；而公司五月撤銷的三年目標尚未重新給出，代表管理層自己也還沒把能見度找回來。研究線索，不是投資建議。", "en": "Today's first new name: Orthofix Medical (OFIX), a small-cap medical device company in orthopedic reconstruction and non-invasive bone growth stimulators. Why it's ignored: small-cap medtech with thin coverage, and in May it cut 2026 guidance and even scrapped its three-year targets after a reimbursement cut — the market largely filed it under 'already broken.' What's changing is the policy itself. The FDA reclassified non-invasive bone growth stimulators from Class III to Class II on April 16, 2026; CMS then modified billing requirements and fee-schedule treatment for codes E0747, E0748 and E0760 effective May 18. But on July 1 CMS issued revised guidance withdrawing those modifications, and the company expects average Medicare reimbursement for those codes to return to pre-May-18 rates. The stock rose 16% in a session on the news and more than 28% across July. Risks and counter-argument: a policy that reversed once can reverse again; the FDA's Class II reclassification lowers the long-term barrier to new competitors; and the three-year targets scrapped in May have not been reinstated, meaning management itself has not yet recovered visibility. Research lead, not investment advice.", "ja": "本日の新顔その1：Orthofix Medical（OFIX）は整形外科再建と非侵襲的骨成長刺激装置を手掛ける小型医療機器企業だ。無視される理由：カバレッジの薄い小型メドテックであり、5月には償還カットを受けて2026年ガイダンスを引き下げ、3年目標まで撤回したため、市場は概ね「すでに壊れた銘柄」として整理していた。変化しているのは政策そのものだ。FDAは2026年4月16日に非侵襲的骨成長刺激装置をクラスIIIからクラスIIへ再分類し、CMSはこれを受けて5月にコードE0747・E0748・E0760の請求要件と診療報酬の扱いを変更した（5月18日以降適用）。しかし7月1日、CMSは改訂指針を発出してこれらの変更を撤回し、同社は当該コードの平均償還額が5月18日以前の水準に戻ると見込んでいる。この報道で株価は1日で16%上昇し、7月通算では28%超上げた。リスクと反対論：一度覆った政策は二度目も覆りうる。FDAのクラスII再分類は長期的には新規参入障壁を下げる。そして5月に撤回された3年目標はまだ再提示されておらず、経営陣自身も見通しを取り戻していないことを意味する。研究の手がかりであり、投資助言ではない。", "url": "https://www.gurufocus.com/news/8945750/orthofix-medical-ofix-soars-16-following-cms-reversal-on-bone-growth-stimulators"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "REIT 錯殺", "color": "#C9A227", "status": "RADAR · 下一個驗證點 下一季財報（程序化佔比與 AFFO 成長是否守住中雙位數）", "stocks": [{"t": "OUT", "n": "戶外廣告 REIT；Q1 交通廣告營收年增 22.3%"}, {"t": "LAMR", "n": "同業對照組；今年漲逾 24%，可用來檢驗是族群還是個股"}], "zh": "今天第二檔新名字：Outfront Media（OUT），美國最大的戶外廣告營運商之一，在約 120 個市場擁有看板與交通廣告，2025 年底已有 31,421 面數位看板。被忽視的原因：它被歸類為 REIT，而 30 年期公債殖利率創 19 年新高讓法人整批迴避 REIT；同時廣告股又被當成純週期股，兩層標籤把它從多數人的名單上刷掉。正在改變的是生意結構：Q1 交通廣告營收年增 22.3% 至 9,500 萬美元、其中數位交通廣告年增 25.6% 至 4,470 萬；程序化與自動化銷售已佔營收 20%，直接改善毛利；管理層指引 2026 年 AFFO 中雙位數成長，並有世界盃廣告順風。風險與反方論點：股價今年已漲逾 37%，13.6 倍 forward P/FFO 的安全邊際比年初薄很多；廣告支出是最早被砍的預算之一；而 REIT 的利率敏感度沒有因為生意變好而消失。研究線索，不是投資建議。", "en": "Today's second new name: Outfront Media (OUT), one of the largest US out-of-home advertising operators, with billboard and transit displays across roughly 120 markets including the 25 largest, and 31,421 digital displays as of the end of 2025. Why it's ignored: it is classified as a REIT, and with the 30-year Treasury at a 19-year high institutions have been avoiding REITs wholesale; at the same time advertising is treated as pure cyclical. Two labels, and it falls off most screens. What's changing is the business mix: Q1 transit revenue rose 22.3% year over year to $95.0 million with digital transit up 25.6% to $44.7 million; programmatic and automated sales now represent 20% of revenue, directly improving margins; and management guides mid-teens AFFO growth for 2026 with a FIFA World Cup advertising tailwind. Risks and counter-argument: the stock is already up more than 37% this year, so 13.6x forward P/FFO leaves a far thinner margin of safety than in January; advertising budgets are among the first cut in a downturn; and a REIT's rate sensitivity does not disappear just because the business improved. Research lead, not investment advice.", "ja": "本日の新顔その2：Outfront Media（OUT）は米国最大級の屋外広告事業者で、上位25市場を含む約120市場に看板と交通広告を展開し、2025年末時点で31,421面のデジタルディスプレイを保有する。無視される理由：REITに分類されており、30年債利回りが19年ぶり高水準の中で機関投資家はREITを一括で回避している。同時に広告株は純粋な景気敏感株として扱われる。この二重のラベルで多くのスクリーンから外れてしまう。変化しているのは事業構成だ。Q1の交通広告売上は前年比22.3%増の9,500万ドル、うちデジタル交通広告は25.6%増の4,470万ドル。プログラマティックと自動化販売はすでに売上の20%を占め、利益率を直接改善している。経営陣は2026年のAFFO成長を10%台半ばと見込み、FIFAワールドカップ広告の追い風もある。リスクと反対論：株価は今年すでに37%超上昇しており、予想P/FFO13.6倍の安全余裕は1月よりはるかに薄い。広告予算は景気後退局面で最初に削られるものの一つだ。そしてREITの金利感応度は、事業が良くなったからといって消えはしない。研究の手がかりであり、投資助言ではない。", "url": "https://finance.yahoo.com/markets/stocks/articles/outfront-media-stock-outlook-digital-123600653.html"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "分拆懸垂", "color": "#C9A227", "status": "RADAR · 下一個驗證點 FedEx 處分 19.9% 持股的節奏，以及首份完整獨立年度指引", "stocks": [{"t": "FDXF", "n": "6/01 自 FedEx 分拆；營收約 89 億美元、EV 逾 170 億"}, {"t": "FDX", "n": "仍持有 19.9%，將於約 24 個月內處分"}], "zh": "今天第三檔新名字，先講清楚它的「半忽視」性質：FedEx Freight（FDXF）於 2026/06/01 完成分拆並在紐約交易所掛牌，已納入 S&P 500 與道瓊運輸指數，所以它不是覆蓋為零的公司；被忽視的是「獨立經營歷史」——它沒有可供比對的獨立季度序列，法人模型仍在建立中。正在改變的：它現在是北美 LTL（零擔運輸）純業者，年營收約 89 億美元、企業價值逾 170 億；CFRA 指出獨立的 LTL 業者通常享有比綜合物流集團更高的估值倍數，因為投資人可以直接押 LTL 景氣循環；美銀給買進評等與 185 美元目標價。風險與反方論點：分拆時付了 41 億美元現金股利回 FedEx，資產負債表因此被加重；FedEx 仍持有 19.9%，將於約 24 個月內處分，這是明確的供給懸垂；而 LTL 運價本身高度景氣循環，在升息情境下先受壓。研究線索，不是投資建議。", "en": "Today's third new name, with its 'half-ignored' nature stated up front: FedEx Freight (FDXF) completed its spin-off on June 1, 2026 and listed on the NYSE, joining both the S&P 500 and the Dow Jones Transportation Average — so this is not a zero-coverage company. What is missing is independent operating history: there is no standalone quarterly series to compare against, and institutional models are still being built. What's changing: it is now a pure-play North American less-than-truckload carrier with about $8.89 billion of annual revenue and an enterprise value north of $17 billion. CFRA notes stand-alone LTL names typically trade at richer multiples than diversified shippers because investors can target the LTL cycle directly, and Bank of America has a Buy rating with a $185 price target. Risks and counter-argument: the separation included a $4.1 billion cash dividend paid back to FedEx, which weighted the balance sheet; FedEx retains 19.9% to monetize over roughly 24 months, a clearly signposted supply overhang; and LTL pricing is highly cyclical and gets squeezed first in a hiking environment. Research lead, not investment advice.", "ja": "本日の新顔その3。まずその「半分だけ無視されている」性質を明示する。FedEx Freight（FDXF）は2026年6月1日にスピンオフを完了しNYSEに上場、S&P500とダウ輸送株平均の双方に採用されたため、カバレッジ・ゼロの企業ではない。欠けているのは独立後の経営履歴だ。比較できる単体の四半期系列が存在せず、機関投資家のモデルはまだ構築途上にある。変化していること：現在は北米LTL（積合せ輸送）の純粋事業者で、年間売上約88.9億ドル、企業価値は170億ドル超。CFRAは、独立系LTL企業は総合物流企業より高い倍率で取引される傾向があると指摘する。投資家がLTLサイクルを直接狙えるからだ。バンク・オブ・アメリカは買い推奨・目標株価185ドルとしている。リスクと反対論：分離に際して41億ドルの現金配当をFedExへ支払っており、バランスシートは重くなった。FedExは19.9%を保有し続け約24カ月かけて売却する予定で、これは明示された需給の重しだ。LTLの運賃は景気循環性が非常に高く、利上げ局面では真っ先に圧迫される。研究の手がかりであり、投資助言ではない。", "url": "https://finance.yahoo.com/markets/stocks/articles/fedex-freight-completes-spin-off-103000898.html"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "高管全員", "color": "#6DB56D", "stocks": [{"t": "WEX", "n": "董事長、營運長、財務長、技術長、法務長、數位長同期買進"}], "zh": "這是內部人訊號裡最強的一種形態：WEX 的多位高階主管在很短的時間內同時買進自家股票，名單涵蓋董事長、營運長、財務長、技術長、法務長與數位長，幾乎是整個管理團隊；董事 James Groch 也在 5/20 買進 1,500 股、金額約 214,425 美元。背景是這家車隊支付與企業支付公司剛與行動派股東 Impactive Capital 達成合作協議——新增三名獨立董事、分拆董事長與執行長職務、強化董事會監督，董事會同時通過一項開放式庫藏股計畫。判讀重點：管理團隊集體用稅後現金買進，通常出現在股價經歷一段疲弱之後，代表內部對定位的看法與市場價格出現分歧。但這仍是訊號、不是結論——集體買進不保證時點正確。", "en": "This is the strongest form the insider signal takes: multiple senior executives at WEX bought company stock within a tight window, spanning the chair, COO, CFO, chief technology officer, chief legal officer and chief digital officer — effectively the whole leadership team. Director James Groch also purchased 1,500 shares on May 20 for about $214,425. The backdrop is that this fleet and corporate payments company recently reached a cooperation agreement with activist Impactive Capital, adding three independent directors, separating the chair and CEO roles and strengthening board oversight, while the board authorised an open-ended repurchase program. The read: a management team collectively committing after-tax cash usually follows a stretch of share-price weakness and signals a gap between the inside view and the market price. But it is a signal, not a conclusion — a cluster buy does not guarantee the timing is right.", "ja": "これは内部者シグナルが取りうる最強の形態だ。WEXの複数の上級役員が短期間のうちに自社株を購入し、その顔ぶれは会長、COO、CFO、最高技術責任者、最高法務責任者、最高デジタル責任者と、実質的に経営陣全体に及ぶ。取締役James Grochも5月20日に1,500株を約214,425ドルで取得した。背景として、この車両・法人決済企業はアクティビストのImpactive Capitalと協調合意に達し、独立取締役3名を追加、会長とCEOの職を分離し、取締役会の監督を強化した。同時に取締役会は期限を定めない自社株買いプログラムを承認している。読み筋：経営陣が集団で税引後現金を投じるのは通常、株価が弱含んだ局面の後であり、内部の見方と市場価格の乖離を示す。ただしこれはシグナルであって結論ではない——クラスター買いはタイミングの正しさを保証しない。", "url": "https://finance.yahoo.com/news/wex-insider-buying-cluster-highlights-101146160.html"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "判讀規則", "color": "#6DB56D", "stocks": [{"t": "ADV", "n": "執行長一年 18 次買進、零賣出，淨買超約 40 萬美元"}, {"t": "HDSN", "n": "買方是 10% 大股東而非高管，性質不同要分開看"}], "zh": "讀內部人資料前，先把規則弄清楚。所謂「叢集買進」（cluster buy）的標準定義是：7 天內有 2 位以上不同的內部人買進；高階內部人在成交後 2 個工作日內必須向 SEC 申報，資料才公開。這種同時性相對罕見，所以被視為最強的內部人訊號。但有三個必須分開看的層次。第一，買方身分：Advantage Solutions 的執行長一年 18 次買進、零賣出，那是經營者用自己的錢；而 Hudson Technologies 的買方 Hartree Partners 是 10% 大股東，動機可能是策略性持股而非日常經營判斷。第二，金額對薪酬的比例——象徵性小額買進沒有訊息量。第三，賣出永遠有一百個理由，買進只有一個，所以買進訊號的資訊含量遠高於賣出。", "en": "Before reading insider data, get the rules straight. The standard definition of a cluster buy is two or more distinct insiders purchasing within a seven-day window, and senior insiders must report to the SEC within two business days of the trade before the data becomes public. That simultaneity is relatively uncommon, which is why it is treated as the strongest insider signal. But three layers need separating. First, who is buying: Advantage Solutions' CEO bought 18 times over the past year with zero sales, for net buying of roughly $400,000 — that is an operator using his own money. Hudson Technologies' buyer, Hartree Partners, is a 10% holder whose motive may be strategic positioning rather than day-to-day operating judgement. Second, size relative to compensation — a token purchase carries no information. Third, there are a hundred reasons to sell and only one to buy, which is why buy signals carry far more information than sell signals.", "ja": "内部者データを読む前に、ルールを整理しておこう。「クラスター買い」の標準的な定義は、7日以内に2名以上の異なる内部者が購入することであり、上級内部者は取引後2営業日以内にSECへ届け出る義務があって初めてデータが公開される。この同時性は比較的まれであり、だからこそ最強の内部者シグナルとされる。だが分けて見るべき層が三つある。第一に買い手の属性だ。Advantage SolutionsのCEOは過去1年で18回購入・売却ゼロ、純買い越し約40万ドル——経営者が自分の金を使っている。一方Hudson Technologiesの買い手Hartree Partnersは10%株主であり、動機は日々の経営判断ではなく戦略的なポジション構築かもしれない。第二に報酬に対する金額の比率——象徴的な少額購入に情報量はない。第三に、売る理由は百通りあるが買う理由は一つしかない。だからこそ買いシグナルは売りシグナルよりはるかに情報量が多い。", "url": "https://www.insider-monitor.com/cluster_officer_buys.html"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "授權非承諾", "color": "#6DB56D", "stocks": [{"t": "MU", "n": "UBS 預估其 2028 年前可回購逾 40% 流通股"}, {"t": "AHRT", "n": "授權 1 億美元、實際已執行 2,710 萬、均價 5.78"}], "zh": "庫藏股與內部人買進不是同一種訊號，混為一談是最常見的錯誤：主管報 Form 4 花的是自己的稅後收入，庫藏股花的是公司的錢，而決定的人薪酬常跟每股盈餘掛鉤——股數變少 EPS 就上去，不管生意有沒有變好。分辨真假看三件事。一、授權 vs 執行：UBS 預估美光在 2028 年前有能力回購逾 40% 流通股，靠的是預估期間逾 4,000 億美元的自由現金流，那是「能力」；雷達池的 AH Realty Trust 授權 1 億、實際已花 2,710 萬、均價 5.78 美元，那是「已經掉的錢」。二、回購均價對現價，看它買在便宜還是貴的位置。三、也是最重要的：資金來源。用自由現金流回購是訊息，舉債回購只是用信用購買自己的 EPS。", "en": "A buyback and an insider purchase are not the same signal, and conflating them is the most common mistake: an executive filing a Form 4 spends their own after-tax income, while a buyback spends company money decided by people whose compensation is often tied to earnings per share — fewer shares lifts EPS whether or not the business improved. Three checks separate real from engineered. First, authorisation versus execution: UBS estimates Micron could repurchase more than 40% of its shares outstanding through 2028, supported by projected free cash flow above $400 billion over that span — that is capacity. Radar-pool name AH Realty Trust authorised $100 million and has actually deployed $27.1 million at a $5.78 average — that is money already spent. Second, the average buy price against the current quote, to see whether they bought cheap or dear. Third, and most important, the funding source: repurchasing out of free cash flow is information; borrowing to repurchase is buying your own EPS on credit.", "ja": "自社株買いと内部者の購入は同じシグナルではなく、混同は最もよくある誤りだ。役員がForm 4を出すとき使うのは自分の税引後所得であり、自社株買いは会社の金で、決める人間の報酬はしばしばEPSに連動する——株数が減れば事業が改善しなくてもEPSは上がる。本物と財務工学を見分けるチェックは三つ。第一に枠と実行の差：UBSはマイクロンが2028年までに発行済株式の40%超を買い戻せると試算し、その裏付けは同期間の4,000億ドル超のフリーキャッシュフロー予想だ——これは「能力」である。レーダープールのAH Realty Trustは1億ドルの枠に対し実際に2,710万ドルを平均5.78ドルで執行済み——これは「すでに使った金」だ。第二に取得平均価と現在価の関係で、安く買ったか高く買ったかを見る。第三に、そして最も重要なのが原資である。フリーキャッシュフローで買うのは情報だが、借金で買うのは自社のEPSをクレジットで購入しているにすぎない。", "url": "https://blockonomi.com/micron-mu-stock-jumps-on-ubs-forecast-of-historic-share-buyback-program/"},
    {"id": "week_0", "channel": "本週事件", "tag": "總經行事曆", "color": "#C97DD4", "stocks": [{"t": "DIA", "n": "8/7 非農是本週最大的單一變數"}, {"t": "UUP", "n": "美元對就業數據與升息定價最敏感"}], "zh": "本週的總經行事曆前後兩端最重。今天（8/3，週一）就有三項：S&P Global 7 月製造業 PMI 終值、6 月營建支出、以及 7 月 ISM 製造業指數。真正的支點在週五 8/7 美東時間上午 8:30 的 7 月非農就業報告——這是九月 FOMC 之前最重要的一份數據。基準很低：6 月僅新增 5.7 萬人，遠低於預期的 11 萬，5 月也被下修到 12.9 萬。這造成一個罕見的雙向風險：數據太強會把已在 59% 到 64% 的升息機率再推高，數據太弱則會同時打到「景氣好」這個支撐股市的另一根柱子。", "en": "This week's macro calendar is front- and back-loaded. Today, Monday August 3, brings three releases: S&P Global's final July manufacturing PMI, June construction spending and the July ISM manufacturing index. The real fulcrum is Friday August 7 at 8:30am ET, when the July employment report lands — the single most important data point before the September FOMC. The base is low: June added just 57,000 jobs against a 110,000 forecast, and May was revised down to 129,000. That creates an unusual two-sided risk: too strong and the 59-64% September hike odds push higher; too weak and it knocks out the other pillar holding equities up, which is that the economy is fine.", "ja": "今週のマクロ日程は前後に重心がある。本日8月3日（月）だけで3本——S&P Globalの7月製造業PMI確報、6月建設支出、7月ISM製造業指数だ。真の支点は8月7日（金）米東部時間8時30分の7月雇用統計で、9月FOMC前で最も重要なデータとなる。基準は低い。6月の雇用者数増は予想11万人に対しわずか5.7万人にとどまり、5月も12.9万人へ下方修正された。ここから珍しい両側リスクが生まれる。強すぎれば59～64%の9月利上げ確率をさらに押し上げ、弱すぎれば株を支えるもう一本の柱、すなわち「景気は悪くない」という前提を折ってしまう。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar"},
    {"id": "week_1", "channel": "本週事件", "tag": "財報行事曆", "color": "#C97DD4", "stocks": [{"t": "PLTR", "n": "今晚 8/3 盤後；營收預估 18.1 億、年增 81%"}, {"t": "AMD", "n": "8/4 盤後；營收預估 112 億、年增 46%，看 MI450 與 Helios 進度"}, {"t": "CAT", "n": "8/4；EPS 預估 6.25 美元、年增 32.4%，資料中心電力需求是意外順風"}, {"t": "LLY", "n": "8/5；EPS 預估 6.71 美元、營收 202.6 億、年增 30.2%"}, {"t": "DIS", "n": "8/5 盤前；主題樂園與串流同時驗貨"}], "zh": "本週財報密度很高，五家重量級公司合計市值約 2.8 兆美元。今晚 8/3 盤後 Palantir 先發，市場預估營收約 18.1 億美元、年增 81%，EPS 0.35 美元、年增 119%，但股價已在約 61 倍營收、149 倍追蹤 EPS 的位置，估值容錯極低。週二 8/4：AMD 盤後（營收預估 112 億、年增 46%，非 GAAP EPS 1.67、調整後毛利率 56%，重點在 MI450 與 Helios 量產進度）、Caterpillar（EPS 預估 6.25 美元、年增 32.4%，營收 193.1 億，資料中心電力需求成為意外順風）、輝瑞與 Spotify。週三 8/5：禮來（EPS 預估 6.71、營收 202.6 億、年增 30.2%）、迪士尼盤前、Shopify、Uber、eBay。週四：Airbnb、Roku、Lyft、華納兄弟探索。週五：Take-Two、Under Armour、溫蒂漢堡。", "en": "A dense earnings week, with five heavyweights worth a combined $2.8 trillion reporting. Palantir goes first tonight after the August 3 close, with revenue seen near $1.81 billion (+81% year over year) and EPS of $0.35 (+119%) — but the stock already trades near 61 times revenue and 149 times trailing EPS, leaving almost no margin for error on valuation. Tuesday August 4: AMD after the close (revenue expected at $11.2 billion, +46%, non-GAAP EPS $1.67 and adjusted gross margin around 56%, with MI450 and Helios production updates the focus), Caterpillar (EPS of $6.25, +32.4%, on revenue of $19.31 billion, with data-centre power demand an unexpected tailwind), plus Pfizer and Spotify. Wednesday August 5: Eli Lilly (EPS $6.71 on revenue of $20.26 billion, +30.2%), Disney before the open, Shopify, Uber and eBay. Thursday: Airbnb, Roku, Lyft and Warner Bros. Discovery. Friday: Take-Two, Under Armour and Wendy's.", "ja": "今週は決算が密集し、時価総額合計約2.8兆ドルの主力5社が発表する。まず本日8月3日引け後のパランティア。売上は約18.1億ドル（前年比81%増）、EPSは0.35ドル（119%増）が見込まれるが、株価はすでに売上の約61倍、実績EPSの149倍で、バリュエーション上の許容誤差はほぼない。8月4日（火）：AMDが引け後（売上予想112億ドル・46%増、非GAAP EPS1.67ドル、調整粗利率約56%、焦点はMI450とHeliosの量産進捗）、キャタピラー（EPS予想6.25ドル・32.4%増、売上193.1億ドル、データセンターの電力需要が予想外の追い風）、さらにファイザーとSpotify。8月5日（水）：イーライリリー（EPS予想6.71ドル、売上202.6億ドル・30.2%増）、ディズニーが寄り付き前、Shopify、Uber、eBay。木曜：Airbnb、Roku、Lyft、ワーナー・ブラザース・ディスカバリー。金曜：Take-Two、アンダーアーマー、ウェンディーズ。", "url": "https://www.asktraders.com/analysis/wall-street-braces-for-blockbuster-earnings-week-as-eli-lilly-amd-caterpillar-lead-the-charge/"},
    {"id": "eval_0", "channel": "今日評估", "tag": "今日提問", "color": "#E8A838", "status": "DISCUSS · 讀到最後一頁，複製 PROMPT 找 CLAUDE 復盤", "stocks": [{"t": "VTV", "n": "價值 ETF 今年領先 S&P 500 逾 6 個百分點"}, {"t": "VYM", "n": "高股息 ETF 今年領先約 3 個百分點"}], "zh": "今天最值得注意的一件事，是市場正在同時相信兩件互相牴觸的事。一邊是獲利——85% 的公司超預期、整體獲利年增逾 47%、小型股寫下 1991 年以來最佳上半年。另一邊是折現率——30 年期殖利率 5.23% 創 19 年新高，九月升息機率 59% 到 64%，而美銀估每升 1 碼就砍掉 Russell 2000 約 2% 的營業獲利。這兩件事可以都是事實，卻很難在同一個估值裡共存：獲利在往上，但把獲利換算成現值的那個分母也在往上，而且更快。有趣的是市場自己已經給了部分答案——價值型 ETF 今年領先 S&P 500 逾 6 個百分點、高股息 ETF 領先約 3 個百分點，資金正在往「現在就有現金流」的方向靠，而不是往「未來會有」的方向。留一個開放式問題給你：如果週五非農偏強、把九月升息機率推到 80% 以上，你手上哪一個部位的多頭論點會第一個失效？而你還沒動它的理由，是一個分析，還是一個希望？", "en": "The single most important thing today is that the market is holding two contradictory beliefs at once. On one side, earnings: 85% of reporters beating, aggregate profits tracking above 47% growth, small caps posting their best first half since 1991. On the other, the discount rate: the 30-year yield at 5.23%, a 19-year high, September hike odds of 59% to 64%, and Bank of America's estimate that each 25bp hike cuts roughly 2% from Russell 2000 operating earnings. Both can be factually true and still struggle to coexist inside one valuation: earnings are rising, but the denominator that converts them into present value is rising too, and faster. What is interesting is that the market has already given part of its own answer — value ETFs lead the S&P 500 by more than 6 percentage points this year and high-dividend ETFs by about 3, meaning money is leaning toward cash flow that exists now rather than cash flow that will exist later. An open question to sit with: if Friday's payroll print runs hot and September hike odds go above 80%, which position in your book has its bull case break first — and is the reason you have not touched it an analysis, or a hope?", "ja": "今日最も重要なのは、市場が互いに矛盾する二つの信念を同時に抱えていることだ。一方は利益——発表済み企業の85%が予想超、利益は全体で47%超の伸び、小型株は1991年以来最良の上半期。もう一方は割引率——30年債利回りは19年ぶり高値の5.23%、9月の利上げ確率は59～64%、そしてバンク・オブ・アメリカは0.25%の利上げごとにラッセル2000の営業利益が約2%削られると試算する。両方とも事実でありうるが、同じバリュエーションの中で共存するのは難しい。利益は上向きだが、それを現在価値に換算する分母も上向きで、しかもより速い。興味深いのは、市場がすでに部分的な答えを出していることだ。バリューETFは今年S&P500を6ポイント超、高配当ETFは約3ポイント上回っている。資金は「将来生まれる」キャッシュフローではなく「今ある」キャッシュフローへ傾いている。開かれた問いを一つ。金曜の雇用統計が強く、9月の利上げ確率が80%を超えたら、あなたのポジションのうちどれの強気論が最初に崩れるか。そして、まだ手を付けていない理由は分析なのか、願望なのか。", "url": "https://finance.yahoo.com/markets/stocks/articles/top-vanguard-etf-crushing-p-093500276.html"}
  ];

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文、展開日本語=日文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN",ja:"日本語"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          {lang === "ja"
            ? <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"15px", lineHeight:1.9, color:"var(--text-secondary)", margin:0, maxWidth:"46ch", fontWeight:300 }}>{card.ja || card.en}</p>
            : <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>}
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("ja"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="ja" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="ja" ? "close ↑" : "日本語 ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>

      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}
