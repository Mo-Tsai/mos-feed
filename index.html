<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "回購失效", "color": "#E05C5C", "zh": "週四（8/20）美股全面收黑，道瓊工業指數大跌約 1.3%、將近 700 點，標普 500 跌 0.8%，那斯達克綜合指數跌 1%。前一天財政部突襲宣布加倍長天期公債回購、把殖利率壓下來的效果，只維持了一個交易日就蒸發，公債殖利率重新彈高。同一時間川普誓言在經濟上勒緊伊朗，把油價再往上推，形成「殖利率升＋油價漲」的雙重壓力。回過頭看，週三那根紅K 撐不住兩天，說明市場的止跌並不是自己站起來的，而是被政策臨時扶了一把。", "en": "US stocks fell broadly on Thursday (8/20): the Dow dropped about 1.3%, or nearly 700 points, the S&P 500 slid 0.8% and the Nasdaq Composite lost 1%. The relief from the Treasury's surprise decision to double long-dated bond buybacks lasted barely a day before yields rebounded. At the same time Trump vowed to squeeze Iran economically, pushing oil higher and creating a double squeeze of rising yields and rising crude. Wednesday's bounce could not hold for two sessions, a sign the market did not stand up on its own but was propped up by policy.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-august-20-dow-sp-500-nasdaq-081139322.html", "stocks": [{"t": "SPY", "n": "標普 500 ETF，當日跌 0.8%，週三反彈一天就宣告無效"}, {"t": "DIA", "n": "道瓊 ETF，指數重挫近 700 點、跌幅 1.3%，是三大指數中最慘的一個"}, {"t": "QQQ", "n": "那斯達克 100 ETF，科技股跌 1%，賣壓來自殖利率而非基本面"}]},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "個股兩極", "color": "#E05C5C", "zh": "指數雖然一片翻黑，個股卻是兩個極端。汽車零件通路商 Advance Auto Parts 暴跌 21%，第二季營收 20 億美元與去年持平、低於分析師預期的 20.4 億，公司直言家庭預算變緊、DIY 自己修車的需求走弱。美妝集團 Coty 跌 10%，調整後每股虧損 0.02 美元、營收只年增 1%，下一季財測還低於預期。另一頭，科技通路商 ScanSource 大漲 15%，第四季營收年增 17% 並宣布以 2.2 億美元併購 MicroAge。同一天、同樣是「賣東西給別人」的生意，結果差這麼多，差別在賣給誰。", "en": "The index was red across the board, but single stocks split into two extremes. Advance Auto Parts crashed 21% as Q2 sales came in flat at $2.0B versus the $2.04B expected, with management pointing to tighter household budgets weakening DIY demand. Coty fell 10% on an adjusted loss of $0.02 per share, revenue up just 1%, and soft guidance. On the other side, tech distributor ScanSource jumped 15% on 17% Q4 sales growth plus a $220M acquisition of MicroAge. Same day, same broad business model of selling other people's products — the difference is who you sell to.", "url": "https://investrade.com/mid-morning-look-august-20-2026/", "stocks": [{"t": "AAP", "n": "Advance Auto Parts 跌 21%，Q2 營收 20 億持平、低於預期，DIY 需求走弱"}, {"t": "COTY", "n": "Coty 跌 10%，調整後每股虧 0.02 美元、營收僅 +1%，下季財測也不佳"}, {"t": "SCSC", "n": "ScanSource 漲 15%，Q4 營收 +17% 並宣布 2.2 億美元併購 MicroAge"}]},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "油與金齊漲", "color": "#E05C5C", "zh": "商品市場當天比股市熱鬧。美國西德州原油站上每桶 85 美元、布蘭特原油逼近 93 美元，本週漲幅超過 4%，推力來自美伊僵局：阿聯酋宣布中止與伊朗的金融與經貿往來，川普則說目前沒有任何談判在進行。黃金同一天衝上每盎司 4,500 美元、盤中最高來到 4,532 美元，是六月初以來首次站上這個關卡。油和金一起漲，通常不是景氣好的訊號，而是市場同時在對「供給中斷」和「貨幣信用」兩件事收保費。", "en": "Commodities were livelier than equities. WTI crude climbed above $85 a barrel and Brent pushed toward $93, up more than 4% on the week, driven by the US–Iran impasse: the UAE suspended financial and economic dealings with Tehran while Trump said no talks are underway. Gold broke above $4,500 an ounce the same day, touching $4,532 — its first time above that level since early June. Oil and gold rallying together is rarely a growth signal; it is the market charging a premium for supply disruption and for currency credibility at the same time.", "url": "https://finance.yahoo.com/personal-finance/investing/article/gold-prices-today-thursday-august-20-2026-gold-rallies-after-treasury-announcement-fomc-meeting-minutes-153323375.html", "stocks": [{"t": "USO", "n": "美國原油基金，追蹤 WTI，本週漲逾 4%、油價站上每桶 85 美元"}, {"t": "GLD", "n": "黃金 ETF，現貨金價衝上 4,500 美元、盤中最高 4,532，六月初以來首見"}, {"t": "GDX", "n": "金礦商 ETF，金價創高時的高貝他版本，跟著金價走但波動更大"}]},
    {"id": "overnight_4", "channel": "隔夜盤勢", "tag": "風險偏好分裂", "color": "#E05C5C", "zh": "當天最耐人尋味的不是跌幅，而是風險偏好的分裂。股票在跌、公債在跌（殖利率彈升），照理說是全面去風險，但加密相關股卻逆勢大漲：Coinbase 與 Mara Holding 各漲約 6%，Strategy 跳升約 10%，Circle 漲 5%，都跟著比特幣與以太幣走高。同一天資金一邊逃離傳統資產、一邊湧進另類資產，這比單純的「避險」更值得留意。它暗示市場擔心的可能不是景氣，而是政府債務與貨幣本身。", "en": "The most interesting thing on Thursday was not the size of the drop but the split in risk appetite. Stocks fell and Treasuries fell (yields rose), which normally reads as blanket de-risking — yet crypto-linked equities rallied hard, with Coinbase and Mara Holding each up about 6%, Strategy jumping roughly 10% and Circle gaining 5%, all tracking Bitcoin and Ether higher. Money fleeing traditional assets while piling into alternatives on the same day is worth more attention than plain risk-off. It hints the worry is not the economy but sovereign debt and the currency itself.", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-20-2026", "stocks": [{"t": "TLT", "n": "20 年期以上美國公債 ETF，殖利率彈升代表債券價格下跌，避險失靈"}, {"t": "COIN", "n": "Coinbase 逆勢漲約 6%，跟著比特幣走高"}, {"t": "MSTR", "n": "Strategy 跳升約 10%，是加密資產槓桿代理股中最敏感的一檔"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "沃爾瑪失速", "color": "#E8786A", "zh": "沃爾瑪第二季調整後每股盈餘 0.81 美元，高於分析師預期的 0.74 美元，全年營收與獲利目標也同步上調，還拿到約 29 億美元的關稅退稅並打算透過降價回饋消費者。但股價當天不漲反跌約 6%，關鍵在美國同店銷售（不含燃油）只成長 2.6%，遠低於市場預期的 3.5%，而且是六年多來最慢的一次。這張成績單的訊息很直白：獲利可以靠退稅與效率撐住，但美國消費者買的東西正在變少。", "en": "Walmart posted adjusted Q2 EPS of $0.81 against the $0.74 analysts expected and lifted full-year sales and profit guidance, helped by roughly $2.9 billion in tariff refunds it plans to pass through as lower prices. Yet the stock fell about 6% on the day, because US same-store sales excluding fuel grew only 2.6% versus the 3.5% Wall Street wanted — the slowest in more than six years. The message is blunt: profit can be held up by refunds and efficiency, but the American consumer is buying less.", "url": "https://www.bloomberg.com/news/articles/2026-08-20/walmart-posts-sluggish-sales-with-slowest-us-growth-in-six-years", "stocks": [{"t": "WMT", "n": "沃爾瑪 EPS 0.81 超預期但美國同店僅 +2.6%，股價當天跌約 6%"}, {"t": "TGT", "n": "塔吉特前一天才因關稅退稅占 EPS 四成而下跌，兩家一起指向同一個消費疲軟"}, {"t": "COST", "n": "好市多會員制模式的對照組，觀察高所得客群是否同步降速"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "折扣店大勝", "color": "#E8786A", "zh": "同一個消費環境，折扣零售商 Ross Stores 交出完全相反的成績單：第二季每股盈餘 2.66 美元，遠遠超過自家 1.85 到 1.93 美元的指引，總銷售年增 13%、同店銷售成長 10%。第二季營業利益 11 億美元，其中約 2.53 億來自 IEEPA 關稅退稅，營業利益率一口氣拉高 610 個基點。把沃爾瑪和 Ross 放在一起看會很清楚：美國消費者沒有停止消費，而是把錢從「日常補貨」搬到「撿便宜」，這個位移對不同零售模式的殺傷力完全不同。", "en": "In the same consumer environment, off-price retailer Ross Stores delivered the opposite result: Q2 EPS of $2.66, far above its own $1.85–$1.93 guidance, with total sales up 13% and comparable store sales up 10%. Q2 operating profit reached $1.1 billion, including roughly $253 million from IEEPA tariff refunds, and operating margin expanded 610 basis points. Read against Walmart, the picture is clear: Americans have not stopped spending, they have shifted from routine restocking to bargain hunting — and that shift hits different retail models very differently.", "url": "https://www.prnewswire.com/news-releases/ross-stores-reports-strong-second-quarter-sales-and-earnings-results-302856807.html", "stocks": [{"t": "ROST", "n": "Ross Stores EPS 2.66 遠超指引，總銷售 +13%、同店 +10%，營業利益率 +610bp"}, {"t": "TJX", "n": "同屬折扣零售的最大同業，Ross 的成績通常是它的領先指標"}, {"t": "BURL", "n": "Burlington 是折扣零售第三家，估值最貴、對消費降級的槓桿也最大"}]},
    {"id": "earn_3", "channel": "財報速報", "tag": "強弱對照", "color": "#E8786A", "zh": "農機龍頭 Deere 當天上漲 4%，第三季獲利優於預期並上調 2026 財年淨利目標，是週四少數的亮點。相對的，Advance Auto Parts 因為 DIY 修車需求疲軟重挫 21%。一個賣給農民與大型作業者、一個賣給自己修車的家庭，兩張財報等於幫我們把美國需求切成兩半：資本財與專業端還撐得住，家庭的可支配支出正在被壓縮。這種「B 端穩、C 端弱」的組合，通常會先反映在零售與消費耐久財的財報上，再慢慢傳導到就業。", "en": "Farm equipment maker Deere rose 4% after beating on fiscal Q3 and raising its FY26 net income guidance, one of the few bright spots on Thursday. Advance Auto Parts, by contrast, collapsed 21% on weak DIY repair demand. One sells to farmers and professional operators, the other to households fixing their own cars — together the two reports cut US demand in half: capital goods and the professional channel are holding, while household discretionary spending is being squeezed. That B-strong / C-weak combination usually shows up first in retail and consumer durables earnings, then filters through to employment.", "url": "https://investrade.com/mid-morning-look-august-20-2026/", "stocks": [{"t": "DE", "n": "Deere 漲 4%，FQ3 超預期並上調 FY26 淨利目標，代表專業與資本財端仍穩"}, {"t": "AAP", "n": "Advance Auto Parts 跌 21%，DIY 需求走弱，代表家庭端在縮手"}, {"t": "ORLY", "n": "O'Reilly 是汽車零件通路的專業端代表，可以拿來對照 AAP 的 DIY 曝險"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "回購止痛藥", "color": "#7C6AF7", "zh": "財政部週三突襲加倍長天期公債回購，市場只買單了一天。週四三十年期公債殖利率一度回升逾 7 個基點到 5.27%，尾盤才收斂到約 5.25%；而就在週二，同一個殖利率才剛創下 5.33% 的十九年新高。財政部長貝森特在電視訪問中說他手上有「一大箱工具」可以支撐市場，這句話本身就說明了問題的性質。彭博的定調很精準：這頂多是全球債市下跌的斷路器，不是解方——債務規模與通膨黏著才是殖利率的地心引力。", "en": "The Treasury's surprise decision on Wednesday to double long-dated buybacks bought exactly one day of calm. On Thursday the 30-year yield rose as much as 7 basis points to 5.27% before easing to about 5.25% — and only on Tuesday that same yield had set a 19-year high of 5.33%. Treasury Secretary Bessent told CNBC he has a big tool kit to support the market, a remark that itself defines the problem. Bloomberg framed it precisely: at best a circuit breaker for the global bond slump, not a cure. Debt levels and sticky inflation are the gravity pulling yields up.", "url": "https://www.bloomberg.com/news/articles/2026-08-20/bessent-s-plan-at-best-circuit-breaker-for-global-bond-slump", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，三十年期殖利率回到 5.25% 附近，回購效應一天蒸發"}, {"t": "SHY", "n": "短天期公債 ETF，殖利率曲線走陡時的另一端，用來看長短端的分化"}, {"t": "KRE", "n": "區域銀行 ETF，長端殖利率高檔會同時壓迫其債券部位與放款需求"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "勞動市場穩", "color": "#7C6AF7", "zh": "美國初領失業金人數在 8 月 15 日當週減少 6,000 人至 20.6 萬，低於經濟學家預估的 21 萬，前一週上修為 21.2 萬。續領人數則升到 179.9 萬，略高於預期的 179 萬。今年以來初領人數大致落在 18.9 萬到 23 萬的區間下緣，代表企業還沒有大規模裁員。這組數字對股市其實不太友善：勞動市場撐得住、通膨又還在目標之上，正好給了聯準會在 9 月 16 日按兵不動的理由。", "en": "US initial jobless claims fell by 6,000 to 206,000 in the week ended August 15, below the 210,000 economists expected, with the prior week revised up to 212,000. Continuing claims rose to 1.799 million, slightly above the 1.790 million forecast. Initial claims have spent this year near the low end of a 189,000–230,000 range, meaning employers have not started cutting at scale. That is not especially friendly for equities: a resilient labour market plus inflation still above target hands the Fed its reason to stay on hold on September 16.", "url": "https://www.investing.com/news/economic-indicators/weekly-us-jobless-claims-dip-to-206000-4869762", "stocks": [{"t": "RHI", "n": "Robert Half 是白領人力派遣龍頭，初領失業金的體感版，對招聘降溫最敏感"}, {"t": "MAN", "n": "ManpowerGroup 偏藍領與臨時工派遣，續領人數上升時通常最先反映"}]},
    {"id": "macro_3", "channel": "總經政策", "tag": "沃許首秀", "color": "#7C6AF7", "zh": "聯準會已經換人，凱文·沃許（Kevin Warsh）接任主席，而他的第一次傑克森霍爾演說就排在下週。今年的年會 8 月 27 到 29 日舉行，主題是「金融創新：對支付與政策的意涵」，約 120 位來自 70 多國的央行官員與經濟學家與會，沃許的主題演說落在 8 月 28 日週五早上。這場演說距離 9 月 16 日的 FOMC 決策只有 19 天，是新主席第一次有機會完整說明自己的政策框架。主題選在「支付」，本身就值得留意——央行把注意力放在管線，通常代表它在想制度、不只是想利率。", "en": "The Fed has changed hands: Kevin Warsh is now chair, and his first Jackson Hole address lands next week. This year's symposium runs August 27–29 on the theme Financial Innovation: Implications for Payments and Policy, with roughly 120 central bankers and economists from more than 70 countries attending, and Warsh's keynote set for Friday morning, August 28. The speech comes just 19 days before the September 16 FOMC decision — the new chair's first full opportunity to lay out his framework. The payments theme is itself telling: when a central bank focuses on plumbing, it is usually thinking about institutions, not just rates.", "url": "https://www.regardsofwallstreet.com/news/jackson-hole-2026-dates-schedule-warsh-first-speech", "stocks": [{"t": "V", "n": "Visa，年會主題聚焦支付與政策，支付網路是最直接的政策標的"}, {"t": "MA", "n": "Mastercard，與 Visa 同屬支付雙雄，任何清算與監理鬆綁都直接影響它們"}, {"t": "FI", "n": "Fiserv 站在銀行端的支付基建，屬於「管線的管線」，政策變動時波動更大"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "能源獨強", "color": "#4EABA4", "zh": "把時間拉長看，今年真正的贏家是能源。能源類股今年以來上漲 41.5%，領先第二名的科技整整 20.2 個百分點，而且在 8 月 18 到 19 日這兩天還是十一個類股中的第一名，單日漲 1.76%。推力很單純：美伊在荷姆茲海峽的僵局讓油價一直帶著地緣溢價，而這個溢價不是需求造出來的。這也是為什麼能源的強勢跟一般景氣循環的判讀不一樣——它反映的是供給風險，不是經濟變好。", "en": "Zoom out and the year's real winner is energy. The sector is up 41.5% year to date, a full 20.2 percentage points ahead of second-place technology, and it also led all eleven sectors on August 18–19 with a 1.76% daily gain. The driver is simple: the US–Iran standoff over the Strait of Hormuz keeps a geopolitical premium in the oil price, and that premium is not demand-driven. Which is why energy's strength does not read like a normal cyclical signal — it reflects supply risk, not a better economy.", "url": "https://kalkine.com/news/premium/us-sector-performance-analysis-energy-and-health-care-lead-as-technology-retreats", "stocks": [{"t": "XLE", "n": "能源類股 ETF，今年以來 +41.5%，領先第二名科技 20.2 個百分點"}, {"t": "OXY", "n": "西方石油，美國本土產量權重高，對油價的彈性大"}, {"t": "SLB", "n": "斯倫貝謝屬油服端，油價高檔若轉為資本支出，它是後段受惠者"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "醫療補漲", "color": "#4EABA4", "zh": "醫療保健類股 8 月中旬單日上漲 1.60%，是十一個類股中的第二名，看起來很強，但把尺度拉開就變成另一回事：它今年以來只漲 9.4%，在十一個類股中排第七，落後大盤三個百分點。換句話說，這是一個「跌得夠久、便宜到有人願意撿」的類股，而不是一個基本面轉強的類股。判斷醫療是不是真的轉向，要看的不是一兩天的漲幅，而是資金願不願意在漲完之後繼續留下來。", "en": "Health care rose 1.60% in a single session in mid-August, second among the eleven sectors — impressive until you widen the lens. The sector is up just 9.4% year to date, ranking seventh of eleven and trailing the index by three percentage points. In other words this is a sector cheap enough that someone is willing to pick it up after a long decline, not one whose fundamentals have turned. Judging whether health care has genuinely rotated means watching whether money stays after the bounce, not the size of the bounce itself.", "url": "https://seekingalpha.com/article/4938500-healthy-energized-at-new-highs", "stocks": [{"t": "XLV", "n": "醫療保健類股 ETF，近期單日 +1.6% 但今年僅 +9.4%、十一類股排第七"}, {"t": "LLY", "n": "禮來是 XLV 權重最大的成分股之一，它的走勢幾乎決定整個類股的方向"}, {"t": "IBB", "n": "生技 ETF 是醫療類股中的高貝他部位，真正的資金回流通常從這裡開始"}]},
    {"id": "sector_3", "channel": "產業風向", "tag": "科技被賣", "color": "#4EABA4", "zh": "8 月中旬的類股表現裡，科技是明顯被賣的一方，資金流向能源、醫療保健、必需消費與金融，其餘七個類股全數下跌。這種輪動的組合很特別：能源與必需消費是實體與防禦，金融是利率敏感，醫療是落後補漲，四者的共同點是「不依賴估值擴張」。當長端殖利率停在 5% 以上，靠未來現金流折現撐估值的科技股自然最吃虧。這不是科技基本面壞掉，而是折現率把它的價格重新定錨了一次。", "en": "In mid-August's sector table technology was clearly the funding source, with money moving into energy, health care, consumer staples and financials while the other seven sectors fell. The rotation's composition is telling: energy and staples are physical and defensive, financials are rate-sensitive, health care is a laggard catching up — and none of the four depends on multiple expansion. With long-end yields parked above 5%, stocks whose valuations rest on discounted future cash flows take the most damage. This is not technology's fundamentals breaking; it is the discount rate repricing them.", "url": "https://kalkine.com/news/premium/us-sector-performance-analysis-energy-and-health-care-lead-as-technology-retreats", "stocks": [{"t": "XLK", "n": "科技類股 ETF，當週明顯遭賣壓，是這輪輪動的資金來源"}, {"t": "XLP", "n": "必需消費 ETF，跟能源、金融、醫療同列少數收紅的類股"}, {"t": "XLF", "n": "金融類股 ETF，長端殖利率高檔時淨利差擴張，是這輪輪動的受惠方"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "羅素創高", "color": "#5B8ED6", "zh": "在大型股走弱的同時，小型股正安靜地寫下歷史。羅素 2000 指數近日收在 3,052.85 的紀錄新高，今年以來上漲約 23%，比標普 500 多出 9.1 個百分點，是二十三年來表現最好的一年。上半年更是 1991 年以來最強的一個上半年。這個位置值得注意的地方在於：小型股領先大型股這麼多、又同時創新高，在過去通常出現在流動性寬鬆期，而現在的殖利率環境完全不是那樣。", "en": "While large caps weakened, small caps have been quietly writing history. The Russell 2000 recently closed at a record 3,052.85, up roughly 23% year to date and 9.1 percentage points ahead of the S&P 500 — its best year in twenty-three. The first half was its strongest since 1991. What makes this worth noting is the setup: small caps leading large caps by this margin while printing new highs has historically happened in easy-liquidity periods, and the current yield environment is nothing like that.", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，指數收在 3,052.85 紀錄新高，今年 +23%"}, {"t": "IWO", "n": "羅素 2000 成長型 ETF，這輪領漲的主要來源在成長端而非價值端"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "小晶片領跑", "color": "#5B8ED6", "zh": "拆開羅素 2000 今年表現最好的 50 檔股票，有 16 檔跟晶片有關，比重高得不成比例。其中 Aehr Test Systems、Ichor Holdings 與 MaxLinear 三檔全都漲超過 400%。這說明資金正在往「AI 的第二層受惠者」擴散——不再只買最大的那幾家設計或代工廠，而是往上下游的測試設備、次系統與零組件挖。這種擴散對指數是好事，但也意味著這些股票的股價已經反映了非常多的期待。", "en": "Break open the Russell 2000's fifty best performers this year and sixteen are chip-related — a wildly disproportionate share. Aehr Test Systems, Ichor Holdings and MaxLinear have each rallied more than 400%. This is money spreading into the second layer of AI beneficiaries: not just the largest designers and foundries, but the test equipment, subsystems and components sitting up and down the chain. Broadening is healthy for the index, but it also means these share prices already embed a great deal of expectation.", "url": "https://www.cnbc.com/2026/06/30/small-cap-stocks-enjoy-best-first-half-since-1991-as-ai-trade-expands.html", "stocks": [{"t": "AEHR", "n": "Aehr Test Systems 做晶圓級老化測試設備，今年漲逾 400%"}, {"t": "ICHR", "n": "Ichor Holdings 供應半導體設備的流體與氣體次系統，同樣漲逾 400%"}, {"t": "MXL", "n": "MaxLinear 做寬頻與資料中心連接晶片，是三檔中波動最大的一檔"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "折價的意義", "color": "#5B8ED6", "zh": "即使漲了 23%，小型股相對大型股仍有約 34% 的估值折價。這個折價不是市場的錯誤，而是有結構原因的：小型股流動性差、大部位進出成本高；分析師覆蓋少，資訊落差大；獲利品質參差，指數裡有相當比例根本不賺錢的公司。理解這三件事，才知道折價什麼時候會收斂、什麼時候不會。折價收斂通常需要三個條件之一：獲利品質改善、資金成本下降、或有併購買方進場。", "en": "Even after a 23% rally, small caps still trade at roughly a 34% valuation discount to large caps. That discount is not a market error — it has structural causes: thinner liquidity makes large positions expensive to move, sparse analyst coverage widens the information gap, and earnings quality is uneven, with a meaningful share of index members not profitable at all. Understanding those three tells you when the discount can close and when it cannot. Closing it usually needs one of three things: better earnings quality, cheaper funding, or acquirers stepping in.", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/", "stocks": [{"t": "IJR", "n": "標普小型 600 ETF，成分股有獲利門檻，是「折價但有品質」的對照組"}, {"t": "IWN", "n": "羅素 2000 價值型 ETF，估值折價最集中的一端，也是流動性最差的一端"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "危險的訊號", "color": "#5B8ED6", "zh": "這裡有一個必須放在心上的警訊。滙豐的資料顯示，目前市場獎勵「AI 曝險」的程度高過獎勵「當期獲利」，結果是不賺錢的小型股跑贏會賺錢的小型股。這種排序在歷史上不是常態，而是週期後段才會出現的現象——當投資人願意為故事付出比為現金流更高的價格，代表估值的錨已經鬆了。這不代表現在就要離場，但它是一個明確的提醒：如果你要參與小型股，選股比選指數重要得多。", "en": "Here is a warning worth keeping in mind. HSBC's data shows the market is currently rewarding AI exposure more than current earnings, with the result that unprofitable small caps are outperforming profitable ones. That ordering is not normal — it is a late-cycle phenomenon. When investors will pay more for a story than for cash flow, the valuation anchor has come loose. It does not mean it is time to leave, but it is a clear reminder: if you are going to participate in small caps, stock selection matters far more than index selection.", "url": "https://www.cnbc.com/2026/06/30/small-cap-stocks-enjoy-best-first-half-since-1991-as-ai-trade-expands.html", "stocks": [{"t": "IWO", "n": "羅素 2000 成長型 ETF，不賺錢的小型股主要集中在這一端"}, {"t": "ARKK", "n": "方舟創新 ETF，是「為故事付錢」這件事的極端版本，可當情緒溫度計"}]},
    {"id": "small_5", "channel": "小型股風雲", "tag": "催化劑範本", "color": "#5B8ED6", "zh": "週四 ScanSource 大漲 15%，是一個標準的小型股催化劑範本：財報與併購同一天出手。第四季營收年增 17% 優於預期，同時宣布以 2.2 億美元併購 IT 解決方案商 MicroAge。單獨看財報，市場可能只給一個中性的反應；但加上一筆改變業務組合的併購，故事就從「這一季比較好」變成「未來三年不一樣」。百貨業者 Nordstrom 同日上漲 5%，靠的則是財測上調——同樣是好消息，重定價的力道差了三倍。", "en": "ScanSource's 15% jump on Thursday is a textbook small-cap catalyst: earnings and M&A landing on the same day. Q4 revenue grew 17%, beating expectations, and alongside it the company announced a $220 million acquisition of IT solutions provider MicroAge. On the earnings alone the market might have shrugged; add a deal that changes the business mix and the story shifts from a better quarter to a different next three years. Nordstrom rose 5% the same day on raised guidance — also good news, but roughly a third of the repricing power.", "url": "https://investrade.com/mid-morning-look-august-20-2026/", "stocks": [{"t": "SCSC", "n": "ScanSource 漲 15%，Q4 營收 +17% 加上 2.2 億美元併購 MicroAge 雙催化"}, {"t": "JWN", "n": "Nordstrom 漲 5%，Q3 EPS 3.25 優於預期、營收 +10% 至 8.18 億並上調全年"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "zh": "Shimmick（SHIM）是一家專做水利、電力與關鍵基礎建設的營造公司，市值只有幾億美元，幾乎沒有券商追蹤，媒體聲量接近零——這是典型的雙重忽視。正在改變的是訂單：第二季營收 1.07 億美元、毛利率拉升到 12%、調整後 EBITDA 增至 400 萬美元，積壓訂單達 9.91 億，是兩年來最高；季後又拿到 2.21 億美元新約，主要落在加州與德州的水利與電力市場。公司還新設了一個專攻資料中心、先進製造與再生能源的 mission-critical 事業部，而過去 12 個月接到的訂單只有不到 10% 轉為營收，能見度加權平均約 2.2 年。風險也很實在：營收其實還在下滑，公司正在收尾非核心專案，營造業的執行風險與工程虧損隨時可能吃掉毛利率的改善。這是研究線索，不是投資建議。", "en": "Shimmick (SHIM) builds water, electrical and other critical infrastructure, carries a market cap in the hundreds of millions, has almost no analyst coverage and virtually no press — classic double neglect. What is changing is the order book: Q2 revenue of $107 million, gross margin expanded to 12%, adjusted EBITDA up to $4 million, and backlog of $991 million, its highest in two years, plus another $221 million in awards booked after quarter end, mostly California and Texas water and electrical work. Management also stood up a mission-critical unit aimed at data centres, advanced manufacturing and renewables, and less than 10% of the past twelve months' bookings has converted to revenue, with a weighted average life of about 2.2 years. The risks are real: revenue is still declining, non-core projects are being wound down, and construction execution risk can erase margin gains overnight. This is a research lead, not investment advice.", "url": "https://www.stocktitan.net/news/SHIM/shimmick-corporation-announces-second-quarter-2026-6kf590r2qr0h.html", "stocks": [{"t": "SHIM", "n": "Shimmick 本人，積壓訂單 9.91 億創兩年新高、季後再添 2.21 億新約"}], "status": "RADAR · 下一個驗證點 Q3 財報（約 2026/11）：積壓訂單能否守住 9 億以上、毛利率能否維持雙位數"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "zh": "Select Water Solutions（WTTR）做的是油田「產出水」的處理、運輸與回收基礎建設，這個生意被歸類在能源服務，長期被當成純週期股看待，所以估值一直有折價。正在改變的是合約結構：第二季公司簽下一份為期七年的產出水運輸長約，客戶是大型公開上市營運商，並將興建 19 英里的大口徑管線，背後有七年 1.28 億桶的最低承購量支撐。最低承購量的意思是，就算客戶少送水也要付錢——這把一門「跟著鑽井活動起伏」的生意，往「基礎建設收租」挪了一大步。風險是它終究還是綁在頁岩產區的活動水準與油價上，如果生產長期萎縮，最低承購量也只是延後痛苦。這是研究線索，不是投資建議。", "en": "Select Water Solutions (WTTR) builds and operates infrastructure for handling, transporting and recycling produced water from oil fields — a business filed under energy services and long valued as a pure cyclical, hence a persistent discount. What is changing is contract structure: in Q2 the company signed a seven-year produced-water transport agreement with a large public operator and will build 19 miles of large-diameter pipeline, underpinned by a 128-million-barrel minimum volume commitment over seven years. A minimum volume commitment means the customer pays even if it sends less water, moving a business that swings with drilling activity meaningfully toward infrastructure-style annuity revenue. The risk is it remains tied to shale activity and oil prices; if production shrinks structurally, the commitment only defers the pain. Research lead, not investment advice.", "url": "https://investors.selectwater.com/news-events/press-releases/detail/149/select-water-solutions-announces-second-quarter-2026-financial-operational-and-strategic-updates", "stocks": [{"t": "WTTR", "n": "Select Water Solutions 本人，七年產出水長約＋19 英里管線＋1.28 億桶最低承購量"}], "status": "RADAR · 下一個驗證點 Q3 財報（約 2026/11）：長約占比與水利基礎建設部門的營收占比能否續升"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "zh": "Regional Management（RM）做的是非優級消費者的分期放款，市值小、覆蓋少，又處在一個大家不太想討論的產業，被忽視得很徹底。第二季的成績單其實不好：營收 1.68 億美元、年增 7% 但低於市場預期，稀釋後每股盈餘 0.85 美元、淨利 820 萬，公司自己也承認在競爭變激烈時刻意收緊了核保標準，導致放款成長變慢。真正的拐點訊號在 8 月 13 日：執行長 Lakhbir Lamba 自掏腰包買進 1 萬股、金額約 31.65 萬美元，而不是收授予的股票。搭配約 3.7% 的股息殖利率與偏低的本益比，可以看到一個「主動縮表換品質」的敘事。風險非常明確：資產負債表槓桿高，而非優級客群正是家庭預算被壓縮時第一個出問題的族群。這是研究線索，不是投資建議。", "en": "Regional Management (RM) lends to non-prime consumers through instalment loans — small cap, thinly covered, and operating in an industry few want to discuss, so the neglect is thorough. Q2 was not good: revenue of $168 million grew 7% but missed, diluted EPS came in at $0.85 on $8.2 million of net income, and management acknowledged deliberately tightening underwriting as competition intensified, slowing portfolio growth. The inflection signal came on August 13, when CEO Lakhbir Lamba bought 10,000 shares with his own money, about $316,495 — a purchase, not a grant. Paired with a ~3.7% dividend yield and a low P/E, the narrative reads as shrinking the book deliberately in exchange for quality. The risk is explicit: balance-sheet leverage is high, and non-prime borrowers are the first to crack when household budgets tighten. Research lead, not investment advice.", "url": "https://www.tipranks.com/news/insider-trading/top-executive-makes-bold-insider-move-at-regional-management-insider-trading-news", "stocks": [{"t": "RM", "n": "Regional Management 本人，執行長 8/13 自買 1 萬股約 31.65 萬美元"}], "status": "RADAR · 下一個驗證點 Q3 財報（約 2026/10 底）：淨壞帳率與放款成長能否在收緊核保後同時改善"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "zh": "池內的 Evertec（EVTC）有新動態。這家公司做的是波多黎各、拉丁美洲與加勒比海地區的支付處理與商業解決方案，地理位置本身就是它被忽視的原因——大部分美股投資人不會把研究時間花在加勒比海。第二季它買回了 190.7 萬股、金額 4,710 萬美元，這是實際執行、不是紙上授權；8 月 4 日董事會再加碼 1.5 億美元的庫藏股額度。連續執行加上再加碼，是管理層對自家估值最直接的表態。要留意的是，庫藏股買回的效果高度依賴買回價格，如果股價後續走高、公司繼續高價買，效果就會打折。這是研究線索，不是投資建議。", "en": "Pool name Evertec (EVTC) has news. The company provides payment processing and business solutions across Puerto Rico, Latin America and the Caribbean — and its geography is precisely why it is overlooked, since most US equity investors will not spend research hours on the Caribbean. In Q2 it repurchased 1,907,437 shares for $47.1 million, actual execution rather than paper authorisation, and on August 4 the board added a further $150 million to the buyback programme. Consistent execution plus an increase is the most direct statement management can make about its own valuation. The caveat: buyback value depends heavily on the price paid, so if the shares run up and the company keeps buying, the benefit fades. Research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/diversified-financials/nyse-evtc/evertec/news/top-undervalued-small-caps-with-insider-activity-in-august-2/amp", "stocks": [{"t": "EVTC", "n": "Evertec 本人，Q2 已買回 190.7 萬股／4,710 萬美元，8/4 再加碼 1.5 億額度"}], "status": "RADAR · 下一個驗證點 Q3 財報（約 2026/11）：1.5 億新額度的實際執行股數與均價，以及拉美業務營收占比"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "zh": "池內的 ADI Global Distribution（ADIG）完成分拆了。它是北美最大的低壓安防、影音與消防設備分銷商，8 月 4 日正式從 Resideo 獨立出來在紐交所掛牌，並已納入標普小型 600 指數。新獨立的公司分析師覆蓋通常從個位數起跳，這正是分拆股容易被忽視的原因。8 月 7 日出現多筆 Form 4：董事 LeClair 取得 5,825 單位限制股、董事 Hostetler 取得三筆合計約 3.7 萬單位遞延限制股、會計長 Stevens 則有 13,066 單位由 Resideo 舊獎酬換發而來。要誠實說清楚：這些全部是股權授予與換發，不是內部人自掏腰包買進，訊號強度遠低於公開市場買單。真正的驗證要等第一份獨立季報。這是研究線索，不是投資建議。", "en": "Pool name ADI Global Distribution (ADIG) has completed its separation. North America's largest distributor of low-voltage security, AV and fire equipment began trading on the NYSE independently on August 4 after splitting from Resideo, and is already in the S&P SmallCap 600. Newly independent companies typically start with single-digit analyst coverage, which is exactly why spin-offs get overlooked. Several Form 4s landed on August 7: director LeClair received 5,825 RSUs, director Hostetler took three tranches of deferred RSUs totalling roughly 37,000 units, and chief accounting officer Stevens received 13,066 units converted from Resideo awards. To be honest about it: these are grants and conversions, not open-market purchases, and carry far weaker signal than someone spending their own cash. The real test is the first standalone quarter. Research lead, not investment advice.", "url": "https://www.stocktitan.net/sec-filings/ADIG/", "stocks": [{"t": "ADIG", "n": "ADI Global Distribution 本人，8/4 完成分拆掛牌並納入標普小型 600"}], "status": "RADAR · 下一個驗證點 首份獨立季報（預計 2026/11）：獨立後毛利率、營運資金與分析師覆蓋數是否增加"},
    {"id": "radar_6", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "zh": "池內的 Sonos（SONO）持續在買自己。這家高階無線家庭音響品牌過去兩年被 App 改版災難與消費耐久財降溫夾殺，市場基本上放棄了它。新的證據是：3 月到 6 月之間公司買回 199 萬股、金額 3,014 萬美元，是實際執行的庫藏股，而不只是董事會授權。對一家市值不大、現金部位是關鍵支撐的公司來說，願意持續用現金買回自家股票，代表管理層認為股價低於內在價值。反方論點也很清楚：庫藏股不能取代營收成長，如果硬體換機週期繼續延後，買回只是讓每股數字好看，並沒有解決需求問題。這是研究線索，不是投資建議。", "en": "Pool name Sonos (SONO) keeps buying itself. The premium wireless home audio brand has spent two years squeezed between an app redesign disaster and cooling consumer durables demand, and the market has largely given up on it. The new evidence: between March and June the company repurchased 1.99 million shares for $30.14 million — buybacks actually executed, not merely authorised. For a company this size, where the cash balance is a key support, continuing to spend cash on its own stock says management believes the price sits below intrinsic value. The counter-argument is equally clear: buybacks cannot substitute for revenue growth, and if the hardware replacement cycle keeps stretching out, repurchases only flatter per-share figures without fixing demand. Research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/consumer-durables/nasdaq-sono/sonos/news/discover-august-2026s-undervalued-small-caps-with-insider-bu", "stocks": [{"t": "SONO", "n": "Sonos 本人，3-6 月買回 199 萬股／3,014 萬美元，實際執行的庫藏股"}], "status": "RADAR · 下一個驗證點 下一季財報：庫藏股是否延續，以及硬體營收能否止穩"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "執行長自買", "color": "#6DB56D", "zh": "MasterBrand（MBC）執行長 R. Banyard 在 8 月初買進 6 萬股，金額約 50.58 萬美元。這家公司做的是廚房與浴室櫃體，生意直接綁在美國住宅裝修與新屋開工上，而利率停在高檔正好是它最難受的環境。在這種時候執行長掏出五十萬美元買自家股票，訊號值得記下來：他等於在說，市場給的價格已經把最壞的裝修週期算進去了。判讀時要注意兩件事——單一買家不構成集體訊號，而且執行長對產業循環的判斷未必比市場準。", "en": "MasterBrand (MBC) CEO R. Banyard bought 60,000 shares in early August for roughly $505,800. The company makes kitchen and bath cabinets, a business tied directly to US home remodelling and housing starts — and rates parked at high levels is precisely its hardest environment. A CEO putting half a million dollars into his own stock in that setting is a signal worth recording: in effect he is saying the price already discounts the worst of the remodel cycle. Two cautions when reading it: a single buyer is not a cluster signal, and a CEO's read on the industry cycle is not necessarily better than the market's.", "url": "https://simplywall.st/stocks/us/capital-goods/nyse-mbc/masterbrand/news/undervalued-small-caps-with-insider-buying-to-watch-in-augus-1", "stocks": [{"t": "MBC", "n": "MasterBrand 執行長 8 月初買進 6 萬股、約 50.58 萬美元"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "行動派叩門", "color": "#6DB56D", "zh": "另一種「大戶動向」不是買，而是叩門。行動派股東 Howard Todd Horberg 對 Equus Total Return（EQS）提交 13D 文件，揭露持有約 5.61%、78.3 萬股，公開要求董事會問責並啟動策略檢討。特別的是，這是這家公司在現任管理層十五年任期內第一次遭到公開挑戰。13D 和 13G 的差別就在這裡：13G 是被動持有，13D 代表持有人打算影響公司，這個表格本身就是一種宣告。要注意的是，行動派要求策略檢討不等於公司會被賣掉，小型封閉式投資公司的折價往往可以撐很久。", "en": "Another kind of large-holder move is not buying but knocking. Activist Howard Todd Horberg filed a Schedule 13D on Equus Total Return (EQS), disclosing roughly 5.61% or 783,000 shares and publicly demanding board accountability and a strategic review. Notably, this is the first public challenge to the board during the current management's fifteen-year tenure. That is the difference between a 13D and a 13G: a 13G signals passive ownership, a 13D signals intent to influence — the form itself is a declaration. The caution: an activist demanding a strategic review does not mean a sale follows, and discounts at small closed-end vehicles can persist for a very long time.", "url": "https://www.tipranks.com/news/newswire/activist-shareholder-files-schedule-13d-in-equus-total-return-inc", "stocks": [{"t": "EQS", "n": "Equus Total Return 遭 13D 揭露持股 5.61%／78.3 萬股，要求董事會問責"}]},
    {"id": "insider_3", "channel": "內部人動向", "tag": "怎麼讀才對", "color": "#6DB56D", "zh": "今天三則內部人相關的消息剛好可以當教材，說明三種訊號強度完全不同。第一種是自掏腰包的公開市場買進，像 MasterBrand 執行長那筆，訊號最強，因為那是真金白銀的機會成本。第二種是庫藏股，Evertec 第二季實際買回 4,710 萬美元、Sonos 買回 3,014 萬美元，這是公司在買、不是個人在買，而且「授權」跟「執行」是兩回事，只看新聞標題容易高估。第三種是股權授予，像 ADI Global 分拆後那批 RSU 與換發獎酬，那本質上是薪酬，幾乎不帶方向性資訊。看內部人資料的第一件事，永遠是分清楚這三種。", "en": "Today's three insider-related items happen to make a good teaching set, because the signal strength differs enormously. The strongest is an open-market purchase with personal money, like the MasterBrand CEO's buy, because it carries real opportunity cost. The second is buybacks: Evertec actually repurchased $47.1 million in Q2 and Sonos $30.14 million — the company is buying, not an individual, and authorisation is not execution, so headlines alone tend to overstate it. The third is equity grants, like the RSUs and converted awards at ADI Global after its spin-off, which are essentially compensation and carry almost no directional information. The first job when reading insider data is always to separate these three.", "url": "https://www.chartmill.com/stock/markets/usa/screener/insider-buying-stocks", "stocks": [{"t": "EVTC", "n": "庫藏股實際執行的例子：Q2 買回 4,710 萬美元、8/4 再加碼 1.5 億授權"}, {"t": "SONO", "n": "庫藏股實際執行的例子：3-6 月買回 199 萬股／3,014 萬美元"}, {"t": "ADIG", "n": "股權授予的例子：8/7 多筆 Form 4 全是 RSU 與換發，不是自買"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "總經行事曆", "color": "#C97DD4", "zh": "下週（8/24-8/28）的總經行事曆前輕後重。週一沒有排定數據；週二 8/25 一次來四項——凱斯席勒房價指數、里奇蒙聯準銀行製造業指數、新屋銷售與消費者信心。真正的重頭戲在週三 8/26 早上八點半：個人所得與支出（也就是聯準會最看重的 PCE 通膨）、GDP 與耐久財訂單同時公布。週四只有批發庫存，週五 8/28 收在芝加哥採購經理人指數與密西根大學消費者信心。加上 8/27-29 的傑克森霍爾年會，這週的資訊密度會決定 9 月 16 日 FOMC 的定價。", "en": "Next week's macro calendar (8/24–8/28) is back-loaded. Monday has nothing scheduled. Tuesday 8/25 brings four at once: Case-Shiller home prices, the Richmond Fed manufacturing index, new home sales and consumer confidence. The main event is Wednesday 8/26 at 8:30am, when personal income and spending — carrying the PCE inflation reading the Fed watches most — lands alongside GDP and durable goods orders. Thursday offers only wholesale inventories, and Friday 8/28 closes with the Chicago PMI and University of Michigan sentiment. Layered on top of the August 27–29 Jackson Hole symposium, this week's information density will set the pricing for the September 16 FOMC.", "url": "https://www.litefinance.org/blog/analysts-opinions/weekly-economic-calendar-for-24082026-30082026/", "stocks": [{"t": "SPY", "n": "標普 500 ETF，PCE 與 GDP 同日公布，指數層級的波動集中在 8/26 早盤"}, {"t": "GLD", "n": "黃金 ETF，PCE 若高於預期會同時壓抑降息預期與推升避險需求，方向最矛盾"}]},
    {"id": "week_2", "channel": "本週事件", "tag": "財報重頭戲", "color": "#C97DD4", "zh": "財報方面，下週有兩個必看的日子。Intuit 在 8 月 25 日週二盤後公布，它的 QuickBooks 與 Credit Karma 業務等於是美國小型企業與家庭財務狀況的體檢報告，在消費疲軟的討論裡特別有參考價值。真正的大場面在 8 月 26 日週三盤後：輝達公布財報。這一場的特殊性在於時間點——它剛好卡在 PCE 通膨數據當天晚上，又在傑克森霍爾年會前一天。換句話說，週三這一天市場要同時消化通膨、成長與 AI 資本支出三件事，是下週波動最集中的地方。", "en": "On earnings, next week has two dates that matter. Intuit reports after the close on Tuesday, August 25; its QuickBooks and Credit Karma businesses function as a health check on US small business and household finances, which is unusually useful inside the current consumer-weakness debate. The main event is Wednesday, August 26 after the close: Nvidia. What makes it distinctive is the timing — it falls on the evening of the PCE inflation print and the day before Jackson Hole begins. In other words the market has to digest inflation, growth and AI capital spending on the same Wednesday, making it next week's concentrated volatility point.", "url": "https://www.marketbeat.com/stocks/NASDAQ/NVDA/earnings/", "stocks": [{"t": "NVDA", "n": "8/26 週三盤後公布財報，與 PCE 同日、傑克森霍爾前一天"}, {"t": "INTU", "n": "8/25 週二盤後公布，QuickBooks 與 Credit Karma 是小企業與家庭財務的體檢"}, {"t": "SMH", "n": "半導體 ETF，輝達財報是整個類股的方向盤，適合用來看外溢效果"}]},
    {"id": "eval_1", "channel": "今日評估", "tag": "今日一問", "color": "#E8A838", "zh": "今天最值得注意的一件事，是「政策止痛藥的半衰期只有一天」。財政部週三加倍長天期公債回購，殖利率壓下去；週四就彈回 5.25% 附近，股市補跌近 700 點。同一週，油價與黃金一起漲、加密股在股債雙殺的日子逆勢走高、羅素 2000 卻還在歷史新高——這四件事同時成立，說明市場不是在交易景氣，而是在重新定價「政府的錢有多可信」。這也解釋了為什麼小型股與大型股、能源與科技的分歧會拉得這麼開。", "en": "The one thing worth noting today is that the policy painkiller had a half-life of a single day. The Treasury doubled long-dated buybacks on Wednesday and yields fell; by Thursday they were back near 5.25% and stocks gave up nearly 700 Dow points. In the same week oil and gold rallied together, crypto equities rose on a day when both stocks and bonds fell, and the Russell 2000 still sits at a record high. All four being true at once says the market is not trading the economy — it is repricing how credible government money is. That also explains why the gaps between small and large caps, and between energy and technology, have stretched so far.", "url": "https://www.bloomberg.com/news/articles/2026-08-20/bessent-s-plan-at-best-circuit-breaker-for-global-bond-slump", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF 仍在紀錄高點，與大型股走勢背離是這個問題的具體形狀"}, {"t": "XLE", "n": "能源類股 YTD +41.5%，領先科技 20.2 個百分點，是同一個定價問題的另一面"}], "status": "今日評估 · 如果政策工具的效果只能撐一天，那真正在定價的是什麼？"},
];

// 「資金流向」是特殊分頁:嵌 TradingView 即時熱力圖,不吃 CARDS、每日排程不用動它

// 內容指紋:CARDS 一換(每日排程更新)就變,閱讀進度 key 跟著換 → 新的一天自動從第 1 張開始讀。
// 排程只要照常抽換 CARDS 就好,不用額外維護日期。
const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",
        blockSize: "market_cap_basic", blockColor: "change",
        locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true,
        hasSymbolTooltip: true, isMonoSize: false,
        width: "100%", height: "100%"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 10px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>S&P 500 · 即時資金流向</span>
        <a href="https://finviz.com/map?t=sec&st=d1" target="_blank" rel="noopener noreferrer" className="source-link">Finviz 完整版 ↗</a>
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ flex:1, minHeight:0 }} />
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/21/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v8.2</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
