<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "那斯達克創高", "color": "#E05C5C", "zh": "週一美股收在今年最漂亮的一根：那斯達克綜合指數漲 2.26% 收 27,122.09 點，是六月以來第一次改寫收盤紀錄；標普 500 漲 1.49% 收 7,764.70；道瓊漲 366 點、0.71% 收 52,048.83。三件事同時發生才有這個結果——晶片股集體噴出、原油連續第四天走弱、十年期殖利率暫停上攻。上週三聯準會升息之後市場愣了兩天，週一等於是用一根長紅回答「升息也擋不住 AI 需求」這個命題。要留意的是漲幅的分佈依然不平均，指數的力量還是集中在少數幾個名字上。", "en": "Monday delivered the cleanest session of the year so far: the Nasdaq Composite rose 2.26% to 27,122.09, its first record close since June; the S&P 500 gained 1.49% to 7,764.70; and the Dow added 366 points, or 0.71%, to 52,048.83. Three things lined up at once - chip stocks surged together, crude fell for a fourth straight session, and the 10-year yield paused its climb. After the Fed's hike last Wednesday the market spent two days frozen; Monday was its answer to the proposition that even a hike cannot stop AI demand. Worth noting: the gains were far from evenly spread, and index strength still rests on a small number of names.", "url": "https://www.cnbc.com/2026/09/20/stock-market-today-live-updates.html", "stocks": [{"t": "QQQ", "n": "那斯達克 100 ETF，週一漲勢的主戰場"}, {"t": "SPY", "n": "標普 500 ETF，對應指數收 7,764.70、+1.49%"}, {"t": "DIA", "n": "道瓊 ETF，+0.71% 是三大指數裡最弱的一邊"}, {"t": "SOXX", "n": "半導體 ETF，整段漲勢的真正引擎"}]},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "晶片股噴出", "color": "#E05C5C", "zh": "週一的主角是中央處理器（CPU）而不是繪圖晶片。英特爾一度漲超過 14%、收盤仍有 12%，是標普 500 當日最強；安謀（Arm）漲 17%；超微（AMD）漲約 10%，市值首次站上一兆美元。費城半導體指數漲約 3.9% 到 4.3%，已經連五個交易日收紅。導火線是 Meta 的 AI 代理程式 Muse 在十天內登上美國 App Store 第一，市場把它讀成「推論（inference）需求比預期更早放量」。安謀的說法是：當應用程式全面代理化，每單位運算所需的 CPU 至少會變成四倍。", "en": "Monday's protagonist was the CPU, not the GPU. Intel rose more than 14% intraday and closed up about 12%, the best performer in the S&P 500; Arm Holdings gained 17%; AMD climbed roughly 10% and closed above a $1 trillion market value for the first time. The Philadelphia Semiconductor Index rose 3.9% to 4.3%, a fifth consecutive advance. The trigger was Meta's AI agent Muse reaching number one on the US App Store within ten days, which the market read as evidence that inference demand is ramping earlier than expected. Arm's own framing: as applications become agent-driven, the CPU footprint per unit of compute rises at least fourfold.", "url": "https://247wallst.com/investing/2026/09/21/arm-surges-13-as-metas-muse-agent-reignites-cpu-demand-bet-intel-jumps-12-amd-climbs-9/", "stocks": [{"t": "INTC", "n": "盤中漲逾 14%、收盤約 12%，當日標普 500 最強"}, {"t": "ARM", "n": "漲 17%，CPU 授權模式的最直接受惠者"}, {"t": "AMD", "n": "漲約 10%，市值首度突破一兆美元"}, {"t": "SMH", "n": "半導體 ETF，對應費半連五紅"}]},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "原油連四跌", "color": "#E05C5C", "zh": "西德州原油週一跌 2% 到每桶 98.27 美元，正式跌回 100 美元以下；布蘭特原油跌 1.9% 到 101.94 美元。這是 9 月 15 日以來連續第四個交易日走弱，理由完全在供給側：川普表示願意在聯合國場合與伊朗對話、並暫緩對葉門的軍事行動；同時衛星資料顯示沙烏地過去六天經荷莫茲海峽的出口回到日均 290 萬桶，而八月只有 70 萬桶。中東整體海運量十天平均 1,710 萬桶／日，即使沙烏地的東西向輸油管仍未修復。對股市而言這是雙面刃：輸入型通膨的壓力鬆了，但今年最強的能源板塊正在失去它的多頭理由。", "en": "WTI fell 2% on Monday to $98.27 a barrel, back below the $100 line, while Brent slipped 1.9% to $101.94. That is a fourth straight decline since September 15, and the reason sits entirely on the supply side: Trump signalled willingness to talk to Iran at the UN and held off on strikes in Yemen, while satellite data showed Saudi exports through the Strait of Hormuz averaging 2.9 million barrels a day over six days, against 700,000 a day in August. Middle East seaborne flows averaged 17.1 million barrels a day over ten days even with the Saudi East-West pipeline still out. For equities this cuts both ways: imported inflation pressure eases, but the strongest sector of the year is losing the case that carried it.", "url": "https://www.cnbc.com/2026/09/21/iran-us-oil-prices-crude-saudi-arabia-.html", "stocks": [{"t": "USO", "n": "西德州原油 ETF，週一 -2%、油價回到 98.27 美元"}, {"t": "XLE", "n": "能源類股 ETF，今年累計約 +45.8%，多頭理由正在鬆動"}, {"t": "PSX", "n": "大型煉油商，原油走弱對煉油利差反而是順風，與上游方向相反"}]},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "格陵蘭概念股", "color": "#E05C5C", "zh": "週一盤前另一條獨立的線是格陵蘭。川普宣布美國、丹麥與格陵蘭達成一份「無到期日」的安全協議，內容給美國永久的進入、駐軍與飛越權，同時阻止競爭對手在島上建立基地。美國掛牌的格陵蘭概念股整排跳空：Greenland Mines 盤中一度漲超過 200%、Greenland Energy 漲約 159%。市場把幾件事連在一起——格陵蘭的戰略位置、美國要降低關鍵礦物的對外依賴、以及島上確實有大型稀土資源。必須說清楚的是：這份協議不轉移任何採礦權、不核發任何執照、也不提供任何專案資金。", "en": "A separate storyline ran through Monday's premarket: Greenland. Trump announced a no-expiry security pact among the US, Denmark and Greenland granting Washington permanent access, basing and overflight rights while blocking rivals from building bases on the island. US-listed Greenland names gapped up across the board, with Greenland Mines up more than 200% intraday and Greenland Energy around 159%. The market is connecting several dots - Greenland's strategic position, the US push to cut dependence on foreign critical-mineral supply, and the genuine presence of large rare-earth resources there. What must be said plainly: the pact transfers no mining right, grants no licence and funds no project.", "url": "https://www.cnbc.com/2026/09/21/greenland-trump-denmark-deal-stocks-mining.html", "stocks": [{"t": "GRML", "n": "Greenland Mines，盤中一度漲逾 200%，當日最極端的價格反應"}, {"t": "GLND", "n": "Greenland Energy，漲約 159%"}, {"t": "USAR", "n": "USA Rare Earth，同一主題下漲約 6%，反應溫和得多"}, {"t": "MP", "n": "MP Materials，美國稀土指標股，漲約 4%"}]},
    {"id": "earn_0", "channel": "財報速報", "tag": "AutoZone 今早", "color": "#E8786A", "zh": "汽車零件零售商 AutoZone 今天（9/22）美股盤前公布 8 月 29 日結束的 2026 會計年度第四季，市場共識是每股盈餘 54.22 美元、營收 67.1 億美元，分別年增 11.3% 與 7.5%。這家公司在升息環境裡值得單獨看：當家庭延後換車，舊車的維修需求反而會上升，它是少數把「消費者變窮」當成順風的零售業者。三個要盯的數字是國內同店銷售、商用維修（DIFM）業務的年增率，以及這一季實際執行了多少庫藏股——AutoZone 的每股盈餘成長長期有很大一塊來自股數縮減。", "en": "Auto parts retailer AutoZone reports fiscal fourth-quarter results for the period ended August 29 before Tuesday's open. Consensus calls for earnings per share of $54.22 on revenue of $6.71 billion, up 11.3% and 7.5% respectively. The company deserves separate attention in a tightening cycle: when households defer new-car purchases, repair demand on older vehicles rises, making it one of the few retailers for whom a poorer consumer is a tailwind. Three numbers matter - domestic same-store sales, growth in the commercial do-it-for-me business, and how much stock was actually repurchased, since a large share of AutoZone's long-run EPS growth comes from a shrinking share count.", "url": "https://news.alphastreet.com/autozone-azo-q4-2026-preview-eps-est-54-22-reports-september-22/", "stocks": [{"t": "AZO", "n": "今早盤前公布 FQ4，共識每股盈餘 54.22 美元、營收 67.1 億"}, {"t": "ORLY", "n": "最直接的同業對照，市場會用 AutoZone 的同店數字重新定價它"}, {"t": "GPC", "n": "Genuine Parts，偏商用通路，另一個角度的售後市場讀數"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "房市的壞消息", "color": "#E8786A", "zh": "建商 KB Home 今天美股盤後公布第三季，而上一份同業報告才剛留下一道很深的刻痕：Lennar 於 9 月 16 日公布的第三季，調整後每股盈餘 1.23 美元、營收 80.5 億美元都低於預期，淨利 2.84 億美元比去年同期的 5.91 億腰斬，新訂單年減 9%、交屋年減 3%，房屋銷售毛利率從 17.5% 掉到 15.8%，全年交屋目標從 8.2 至 8.3 萬戶下修到 8.0 至 8.1 萬戶。在十年期公債殖利率回到 5% 的環境下，建商的獲利正在被兩邊夾——一邊是為了成交而提高的房貸補貼，一邊是賣不動的庫存。KB Home 今晚的用途是確認這是不是全產業的現象。", "en": "Homebuilder KB Home reports third-quarter results after Tuesday's close, and the last read from the group left a deep mark. Lennar's third quarter, published September 16, showed adjusted EPS of $1.23 on revenue of $8.05 billion, both short of estimates; net income of $284 million against $591 million a year earlier; new orders down 9% and deliveries down 3%; home-sales gross margin down to 15.8% from 17.5%; and full-year delivery guidance cut to 80,000-81,000 homes from 82,000-83,000. With the 10-year Treasury yield back at 5%, builder profits are squeezed from both sides - mortgage buydowns needed to close sales, and inventory that will not move. KB Home tonight tells us whether this is industry-wide.", "url": "https://wrenews.com/lennar-q3-2026-profit-delivery-target-mortgage-rates/", "stocks": [{"t": "KBH", "n": "今晚盤後公布第三季，本篇的直接驗證點"}, {"t": "LEN", "n": "Lennar，9/16 財報淨利腰斬、全年交屋目標下修"}, {"t": "DHI", "n": "D.R. Horton，量體最大的建商，承受同一組壓力"}, {"t": "ITB", "n": "美國住宅建商 ETF，整個板塊的溫度計"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "消費的三個切面", "color": "#E8786A", "zh": "昨晚盤後到今早盤前這一輪的公司都不大，但拼起來剛好是消費端的三個切面：Cracker Barrel（共識每股盈餘 0.38 美元）代表中價位餐飲，Stitch Fix（共識虧損 0.18 美元）代表訂閱制服飾電商，MillerKnoll（共識 0.42 美元，今早盤前）代表企業辦公家具支出。餐飲看的是來客數還是客單價在撐營收，服飾看的是活躍客戶數的流失有沒有止住，辦公家具看的是企業有沒有在砍資本支出。在密西根消費者信心掉到接近歷史低點的此刻，這三家的實際數字比任何調查都誠實。", "en": "The names reporting between Monday's close and Tuesday's open are small, but together they form three cross-sections of consumption: Cracker Barrel (consensus EPS $0.38) for mid-priced dining, Stitch Fix (consensus loss of $0.18) for subscription apparel e-commerce, and MillerKnoll (consensus $0.42, before Tuesday's open) for corporate office furniture spending. In dining the question is whether traffic or ticket size is carrying revenue; in apparel, whether active-client attrition has stopped; in furniture, whether companies are cutting capital spending. With Michigan consumer sentiment near a record low, these three sets of actual numbers are more honest than any survey.", "url": "https://www.kiplinger.com/investing/stocks/17494/next-week-earnings-calendar-stocks", "stocks": [{"t": "CBRL", "n": "Cracker Barrel，昨晚盤後，共識每股盈餘 0.38 美元"}, {"t": "SFIX", "n": "Stitch Fix，昨晚盤後，共識每股虧損 0.18 美元"}, {"t": "MLKN", "n": "MillerKnoll，今早盤前，共識每股盈餘 0.42 美元"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "升息之後", "color": "#7C6AF7", "zh": "聯準會在 9 月 16 日以 12 比 0 的全票，把聯邦資金利率目標區間上調一碼到 3.75% 至 4.00%，這是 2023 年以來第一次升息。更關鍵的是點陣圖：18 位官員中有 16 位認為今年底前至少還要再升一碼，其中四位填了兩碼。主席 Warsh 會後強調通膨風險仍未解除，十年期公債殖利率因此重新站回 5%。這代表長端的定價權目前握在政策路徑手上，不在通膨預期手上——這也是為什麼週一原油大跌，殖利率卻沒有跟著垮。", "en": "The Federal Reserve raised the target range for the federal funds rate by 25 basis points to 3.75%-4.00% on September 16, a unanimous 12-0 vote and the first hike since 2023. More important is the dot plot: 16 of 18 officials see at least one more quarter-point hike before year-end, with four penciling in two. Chair Warsh stressed afterwards that inflation risk is not resolved, and the 10-year Treasury yield moved back above 5%. The implication is that the long end is currently priced off the policy path rather than off inflation expectations - which is precisely why crude fell hard on Monday without yields following it down.", "url": "https://www.cnbc.com/2026/09/16/treasury-yield-bond-market-fed-decision.html", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，十年期回到 5% 的直接受害者"}, {"t": "IEF", "n": "7 至 10 年期公債 ETF，最貼近十年期定價的工具"}, {"t": "XLF", "n": "金融類股 ETF，利差走闊對銀行是順風、對信用品質是逆風"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "發言週", "color": "#7C6AF7", "zh": "這一週沒有消費者物價指數、也沒有個人消費支出物價指數，是典型的「發言週」而非「資料週」。聯準會官員整週密集露面，芝加哥聯準銀行總裁 Goolsbee 已表示他仍願意相信通膨會回到 2%，但如果沒有實現，利率可能還要再往上。硬數據方面只有三筆：週三的採購經理人指數初值（服務業預估 56.8、製造業 53.2）、週四的初領失業救濟金（預估 20.7 萬件）與八月新屋銷售。在沒有物價數據可以吵的一週，市場的波動來源會是官員的措辭而不是統計局的表格。", "en": "There is no CPI and no PCE this week - it is a talking week, not a data week. Fed officials appear throughout, and Chicago Fed President Goolsbee has already said he remains open to inflation resuming its decline toward 2%, but that rates may need to rise further if it does not. Only three hard prints land: Wednesday's flash purchasing managers' indices (services expected at 56.8, manufacturing at 53.2), Thursday's initial jobless claims (expected 207,000) and August new home sales. In a week with no price data to argue over, volatility will come from official phrasing rather than from statistical releases.", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar", "stocks": [{"t": "XHB", "n": "住宅建築 ETF，週四新屋銷售是這一週唯一與它直接相關的數據"}, {"t": "GLD", "n": "黃金 ETF，在沒有物價數據的一週最容易被官員措辭推動"}, {"t": "UUP", "n": "美元指數 ETF，升息路徑定價的另一面鏡子"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "信心掉到谷底", "color": "#7C6AF7", "zh": "密西根大學九月消費者信心指數初值只有 47.8，比八月再掉 7.5%，是這項調查有紀錄以來的第二低。這個數字要放在旁邊對照才有意義：同一時間那斯達克在創新高、失業率沒有失控、初領失業金預估還在 20.7 萬件的低檔。軟數據與硬數據的裂口拉到這麼寬，過去通常有兩種收斂方式——不是消費者的悲觀最後變成真的減少支出，就是調查本身被物價與政治情緒污染、實際行為沒有跟著走。接下來幾週的零售財報會告訴我們是哪一種。", "en": "The University of Michigan's preliminary September consumer sentiment index came in at 47.8, down another 7.5% from August and the second-lowest reading on record. The number only means something placed beside its context: at the same moment the Nasdaq is at a record high, unemployment is not spiralling, and initial claims are still expected around 207,000. When the gap between soft and hard data opens this wide, it has historically closed one of two ways - either consumer pessimism eventually becomes real spending cuts, or the survey has been contaminated by prices and political mood while actual behaviour never follows. The next few weeks of retail earnings will tell us which.", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar", "stocks": [{"t": "XRT", "n": "零售類股 ETF，軟硬數據裂口收斂時最先反應的地方"}, {"t": "WMT", "n": "沃爾瑪，消費降級時通常是受惠端而非受害端"}, {"t": "DG", "n": "Dollar General，低所得家庭壓力的最靈敏指標"}, {"t": "COST", "n": "好市多，本週稍後公布財報，中產階級消費力的直接讀數"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "AI 從繪圖轉向運算", "color": "#4EABA4", "zh": "週一真正被重新定價的不是「AI 會不會成功」，而是「AI 的錢會花在哪一顆晶片上」。過去三年資金集中在繪圖處理器與高頻寬記憶體，因為那是訓練模型的瓶頸；Meta 的 Muse 代理程式十天內登上 App Store 第一，把焦點推向推論階段——而推論的負載會大量落在中央處理器、網路與伺服器系統上。安謀說代理化會讓每單位運算的 CPU 需求至少變四倍，市場昨天就是照這句話重新排了一次隊。這個轉向如果成立，受惠面會從少數晶片設計商擴散到網通、伺服器與資料中心互連。", "en": "What got repriced on Monday was not whether AI works, but which chip the AI money lands on. For three years capital concentrated in GPUs and high-bandwidth memory because training was the bottleneck; Meta's Muse agent reaching number one on the App Store within ten days pushed attention toward inference - and inference load falls heavily on CPUs, networking and server systems. Arm's claim is that agent-driven workloads raise CPU requirements at least fourfold per unit of compute, and the market spent Monday re-sorting itself along that sentence. If the shift holds, the beneficiary set widens from a handful of chip designers to networking, servers and data-centre interconnect.", "url": "https://www.bloomberg.com/news/articles/2026-09-21/amd-set-to-top-1-trillion-in-market-value-as-chip-stocks-soar", "stocks": [{"t": "AVGO", "n": "博通，客製化加速器與資料中心交換晶片兩邊都吃得到"}, {"t": "MRVL", "n": "Marvell，資料中心互連與客製晶片，推論擴散的第二層受惠者"}, {"t": "ANET", "n": "Arista，代理化工作負載讓東西向網路流量成為新瓶頸"}, {"t": "DELL", "n": "戴爾，伺服器系統出貨量是 CPU 需求最直接的實體對照"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "能源的多頭理由在拆", "color": "#4EABA4", "zh": "能源是今年最強的板塊，能源類股 ETF 到 9 月 18 日累計上漲約 45.8%。但要誠實地拆解這 45.8% 的來源：大部分不是需求成長，是荷莫茲海峽的供給溢價。現在沙烏地的出口已經回到日均 290 萬桶、川普表示願意跟伊朗談判、原油連四跌並跌破 100 美元，那個溢價正在一段一段被拿掉。板塊內部的承受力並不一致——上游生產商的營收直接跟著油價走，油服公司跟的是鑽井活動（有落後性），煉油商反而因為原油變便宜、裂解價差變寬而受惠。同一個板塊，三種完全不同的方向。", "en": "Energy is the strongest sector of the year, with the energy ETF up roughly 45.8% through September 18. But that 45.8% deserves an honest decomposition: most of it is not demand growth, it is the Strait of Hormuz supply premium. With Saudi exports back to 2.9 million barrels a day, Trump signalling willingness to negotiate with Iran, and crude down four sessions and through $100, that premium is being removed piece by piece. Exposure inside the sector is not uniform - upstream producers track the oil price directly, oilfield services track drilling activity with a lag, and refiners actually benefit as cheaper crude widens crack spreads. One sector, three different directions.", "url": "https://www.kalkine.com/news/premium/us-sector-momentum-update-energy-and-utilities-lead-while-health-care-and-financials-lag", "stocks": [{"t": "XOP", "n": "油氣探勘與生產 ETF，對油價的彈性最高、承受最直接"}, {"t": "OIH", "n": "油服 ETF，跟的是鑽井活動，反應比油價慢一到兩季"}, {"t": "SLB", "n": "斯倫貝謝，國際油服龍頭，中東資本支出的代表股"}, {"t": "FANG", "n": "Diamondback，二疊紀盆地大型生產商，避險比例較低"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "關鍵礦物變成獨立板塊", "color": "#4EABA4", "zh": "關鍵礦物今年已經不只是材料類股的一個小角落，它正在變成一個由政策時間表驅動的獨立板塊，而且未來七週有三個硬日期：9 月 24 日川習會在白宮、11 月 10 日美中關稅休兵到期、11 月 27 日中國對美的鎵鍺銻出口禁令暫停到期。週一的格陵蘭安全協議又多疊了一層地緣敘事。這個板塊的特性是：價格對新聞極度敏感，但實體產能的建置要好幾年，兩者的時間尺度根本不匹配。任何用一則政治新聞去推算礦場現金流的算式，都應該先被懷疑。", "en": "Critical minerals is no longer a corner of the materials sector; it is becoming its own policy-driven sector, and it has three hard dates in the next seven weeks: the Trump-Xi summit at the White House on September 24, the expiry of the US-China tariff truce on November 10, and the expiry of China's suspension of gallium, germanium and antimony export bans to the US on November 27. Monday's Greenland security pact layered another geopolitical narrative on top. The defining feature of this group is that prices react violently to headlines while physical capacity takes years to build - the two time scales simply do not match. Any calculation that converts a political headline into mine cash flow deserves suspicion first.", "url": "https://www.heritage.org/china/report/xi-comes-washington-expectations-the-trump-xi-summit", "stocks": [{"t": "REMX", "n": "稀土與戰略金屬 ETF，整個主題的一籃子曝險"}, {"t": "UUUU", "n": "Energy Fuels，同時做鈾與稀土分離，美國本土加工的代表"}, {"t": "PPTA", "n": "Perpetua Resources，愛達荷州金銻礦，銻的美國本土供給題材"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "小型股又沒跟上", "color": "#5B8ED6", "zh": "週一大盤創高，但羅素 2000 的力道明顯比不上那斯達克。這不是情緒問題，是資產負債表結構的問題：小型股的債務有很高比例是浮動利率，聯準會 9 月 16 日升息一碼、而且 18 位官員中有 16 位看年底前還要再一次，等於直接對小型股的利息費用加碼。羅素 2000 今年累計漲幅約 15%，仍落後大型指數。判讀上要分兩層看——指數裡有獲利的那一半和沒獲利的那一半，對利率的反應完全不同，前者受傷的是估值，後者受傷的是生存能力。", "en": "The broad market hit a record on Monday, but the Russell 2000 clearly lagged the Nasdaq. This is not sentiment, it is balance-sheet structure: a high share of small-cap debt is floating rate, so the Fed's September 16 quarter-point hike - with 16 of 18 officials seeing another before year-end - adds directly to small-cap interest expense. The Russell 2000 is up roughly 15% year to date, still behind the large-cap indices. Read it in two layers: the profitable half of the index and the unprofitable half respond to rates in completely different ways - the first takes damage to its valuation, the second to its survival.", "url": "https://tradethatswing.com/historical-average-returns-of-the-russell-2000-index-iwm/", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，今年約 +15%，週一漲勢中再次落後"}, {"t": "IWO", "n": "羅素 2000 成長股 ETF，無獲利公司佔比最高的一邊"}, {"t": "IJR", "n": "標普小型 600 ETF，成分股有獲利門檻，可當對照組"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "指數納入不是基本面", "color": "#5B8ED6", "zh": "富時羅素第三季的首次公開發行季度檢視於 9 月 21 日開盤生效，36 家新上市公司一次進入羅素 1000、羅素 2000 與微型股指數。稀土永磁製造商 Evolution Metals & Technologies 是其中最受注目的一檔，同日正式納入羅素 3000 與羅素 2000。這件事值得當成判讀教材：被動基金的買盤是機械性的，跟公司賺不賺錢無關，它只反映指數規則；但市場經常把納入當成利多解讀，在生效日前後買在被動買盤的頂點。真正該問的是納入之後的成交量會回到什麼水準，那才是這檔股票的真實流動性。", "en": "FTSE Russell's third-quarter IPO additions took effect at Monday's open, with 36 newly public companies entering the Russell 1000, Russell 2000 and Microcap indices at once. Rare-earth permanent magnet maker Evolution Metals & Technologies was the most watched of them, formally joining the Russell 3000 and Russell 2000 the same day. Treat this as a teaching case: passive buying is mechanical, unrelated to whether a company earns anything, and reflects only index rules - yet the market routinely reads inclusion as good news and buys into the peak of that passive flow. The real question is what daily volume settles at afterwards, because that is the stock's actual liquidity.", "url": "https://www.globenewswire.com/news-release/2026/09/21/3365486/0/en/evolution-metals-technologies-corp-joins-russell-3000-and-russell-2000-indexes-gaining-exposure-to-12-2-trillion-in-benchmarked-assets.html", "stocks": [{"t": "EMAT", "n": "Evolution Metals & Technologies，9/21 正式納入羅素 3000 與 2000"}, {"t": "VTWO", "n": "Vanguard 羅素 2000 ETF，被動買盤的實際執行端之一"}, {"t": "IWC", "n": "微型股 ETF，36 檔新成分股多數落在這個池子"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "折價的成分", "color": "#5B8ED6", "zh": "每次談小型股都會出現一個說法：相對大型股的估值折價已經到歷史極端，所以是機會。這句話沒有錯，但折價的成分比折價的幅度重要。羅素 2000 裡有相當比例的成分股是沒有獲利的，本益比在它們身上根本算不出來，所以整體指數的折價有一部分是統計上的假象——你買的不是便宜的好公司，是一籃子混著好公司與燒錢公司的組合。比較誠實的做法是用有獲利門檻的小型指數來對照，或者直接看小型價值股與小型成長股的分歧，那個差距才反映市場真正在懲罰什麼。", "en": "Every small-cap discussion produces the same line: the valuation discount to large caps is at a historical extreme, therefore it is an opportunity. The statement is not wrong, but the composition of the discount matters more than its size. A meaningful share of Russell 2000 constituents earn nothing, so a price-earnings ratio cannot be computed for them at all, which makes part of the index-level discount a statistical artefact - you are not buying cheap good companies, you are buying a basket mixing good companies with cash-burning ones. The honest approach is to compare against a small-cap index with a profitability screen, or to look directly at the spread between small-cap value and small-cap growth, because that gap shows what the market is actually punishing.", "url": "https://www.proshares.com/browse-all-insights/insights/is-the-small-cap-slumber-over", "stocks": [{"t": "IWN", "n": "羅素 2000 價值股 ETF，折價成分拆解的一端"}, {"t": "IJS", "n": "標普小型 600 價值股 ETF，有獲利門檻的對照組"}, {"t": "IWB", "n": "羅素 1000 ETF，折價是相對它算出來的"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "微型股行動主義", "color": "#5B8ED6", "zh": "市值五億美元以下的公司被行動主義投資人盯上的比例，已經回到 2020 年以來最高。最新的案例是 TransAct Technologies：市值只有約 5,300 萬美元，投資機構 IDWR Office 在 8 月 28 日揭露 5.1% 持股，並公開要求公司把賭場列印設備與餐飲廚房軟體兩個事業都賣掉。微型股會成為行動主義的目標有結構性原因——籌碼集中、董事會小、只要幾個百分點的持股就有發言權，而且這類公司往往同時擁有一個好事業與一個拖累它的事業。要注意的是：提出要求跟公司照做完全是兩件事，中間通常隔著一次股東會。", "en": "The share of activist campaigns aimed at companies below $500 million in market capitalisation is back to its highest level since 2020. The latest case is TransAct Technologies: market value around $53 million, with investment firm IDWR Office disclosing a 5.1% stake on August 28 and publicly demanding the company sell both its casino printing hardware and its restaurant kitchen software businesses. Micro caps attract activists for structural reasons - concentrated registers, small boards, a voice obtainable with a few percentage points, and a frequent pattern of one good business dragged down by another. The caveat: making a demand and a company complying are entirely different events, usually separated by an annual meeting.", "url": "https://specialsitsdigest.com/activist-campaigns/", "stocks": [{"t": "TACT", "n": "TransAct Technologies，市值約 5,300 萬，IDWR Office 8/28 揭露 5.1% 持股"}, {"t": "IWC", "n": "微型股 ETF，行動主義標的密度最高的池子"}, {"t": "IWM", "n": "羅素 2000 ETF，微型股行情的上層對照"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "小型油氣的曝險", "color": "#5B8ED6", "zh": "油價連四跌、跌破 100 美元，對大型綜合油商只是毛利率的問題，對小型油氣生產商卻是現金流與再投資能力的問題。這類公司通常避險比例低（所以漲的時候彈性最大）、單井成本結構固定、而且很多在今年高油價期間才剛宣布庫藏股或配息。接下來幾週真正的檢驗點不是股價，而是「授權的庫藏股有沒有真的執行」——在油價回落時仍然按計畫買回，跟在高點宣布卻悄悄停手，是兩種完全不同的管理層。這一條檢查比任何簡報都便宜、也比任何簡報都準。", "en": "Four straight declines and a break below $100 is a margin question for the integrated majors, but a cash-flow and reinvestment question for small oil and gas producers. These companies typically hedge little (which is why they are the most elastic on the way up), carry fixed per-well cost structures, and many only announced buybacks or dividends during this year's high-price window. The real test over the coming weeks is not the share price but whether authorised repurchases are actually executed - continuing to buy on plan as oil falls, versus announcing at the top and quietly stopping, describes two completely different management teams. This single check costs nothing and tells you more than any presentation.", "url": "https://tradingeconomics.com/commodity/crude-oil", "stocks": [{"t": "AMPY", "n": "Amplify Energy，微型油氣商，庫藏股授權的執行率是誠信檢驗"}, {"t": "GRNT", "n": "Granite Ridge，非作業型油氣公司，自由現金流轉正時點受油價直接影響"}, {"t": "BATL", "n": "Battalion Oil，微型市值生產商，原本的論點建立在油價守住 80 美元"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "從忽視變擁擠", "color": "#C9A227", "zh": "Critical Metals 在格陵蘭南部開發 Tanbreez 稀土礦，9 月 9 日入池時的論點是「雙重忽視」。週一它漲了 25% 到 37%，這個論點已經作廢——它現在是擁擠的，不是被忽視的。變的是什麼：美丹格三方安全協議給美國永久基地與進入權，讓市場把 Tanbreez 想成準國家資產。沒變的是什麼：協議不轉移採礦權、不核發執照、不提供資金，北極的電力、港口與工期問題一項都沒解決。反方論點很直白——同一批股票在 2025 年的格陵蘭話題裡也噴過一次，然後回吐完畢。本卡是研究線索，不是投資建議。", "en": "Critical Metals develops the Tanbreez rare-earth deposit in southern Greenland, and the thesis when it entered the pool on September 9 was double neglect. It rose 25% to 37% on Monday, which retires that thesis - it is now crowded, not ignored. What changed: the trilateral US-Denmark-Greenland security pact grants Washington permanent basing and access, letting the market treat Tanbreez as a quasi-strategic asset. What did not change: the pact transfers no mining right, grants no licence and provides no funding, and none of the Arctic power, port and schedule problems are solved. The counterargument is blunt - the same cohort spiked on Greenland headlines in 2025 and gave it all back. Research lead, not investment advice.", "url": "https://247wallst.com/investing/2026/09/21/critical-metals-surges-25-as-greenland-security-pact-puts-tanbreez-rare-earth-permit-in-focus-usa-rare-earth-climbs-6-mp-materials-rises-4/", "status": "RADAR · 下一個驗證點 2026 年底 REalloys 國防級重稀土資格認證", "stocks": [{"t": "CRML", "n": "Critical Metals，週一漲 25% 至 37%，Tanbreez 礦權持有者"}, {"t": "MP", "n": "MP Materials，同主題但已有實際產出，是估值的錨"}, {"t": "USAR", "n": "USA Rare Earth，同日只漲約 6%，反應差距本身就是資訊"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "董事群聚買進", "color": "#C9A227", "zh": "Oak Valley Bancorp 是加州中央谷地的社區銀行控股公司，市值小到幾乎沒有賣方分析師覆蓋，媒體聲量接近零——典型的雙重忽視。正在改變的有兩件事：一是八月中下旬出現董事群聚買進，Randolph Holder 於 8/17 以 33.75 美元、Daniel Leonard 於 8/19 以 34.59 美元、Allison Lafferty 於 8/26 以約 33.85 至 34.10 美元分別進場，過去十二個月內部人淨買超約 21.5 萬美元；二是淨息差沒有被升息壓垮，第二季 4.15%，高於第一季的 4.12% 與去年同期的 4.11%。風險與反方論點：社區銀行的存款成本通常落後資產端反應一到兩季，4.15% 可能是高點而非起點；加州中央谷地的商用不動產與農業放款集中度也需要自己查清楚。本卡是研究線索，不是投資建議。", "en": "Oak Valley Bancorp is a community bank holding company in California's Central Valley, small enough to carry almost no sell-side coverage and near-zero media presence - textbook double neglect. Two things are changing. First, a cluster of director purchases in the second half of August: Randolph Holder on 8/17 at $33.75, Daniel Leonard on 8/19 at $34.59, and Allison Lafferty on 8/26 at roughly $33.85-$34.10, with insiders net buyers of about $215,000 over twelve months. Second, the net interest margin has not been crushed by tightening - 4.15% in the second quarter, above 4.12% in the first and 4.11% a year earlier. Risks and the other side: community bank deposit costs typically lag asset yields by a quarter or two, so 4.15% may be the peak rather than the start, and Central Valley commercial real estate and agricultural loan concentration needs independent checking. Research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/banks/nasdaq-ovly/oak-valley-bancorp", "status": "RADAR · 下一個驗證點 2026 年 10 月下旬 Q3 財報（淨息差 4.15% 能否守住）", "stocks": [{"t": "OVLY", "n": "Oak Valley Bancorp，三位董事 8 月在 33.75 至 34.59 美元區間買進"}, {"t": "KRE", "n": "區域銀行 ETF，判斷這是個案還是整個族群的現象"}, {"t": "ALRS", "n": "Alerus Financial，池內另一檔同樣靠淨息差撐論點的小型銀行"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "被太陽能蓋住的儲能", "color": "#C9A227", "zh": "Shoals Technologies 做太陽能電廠的電氣平衡系統（接線、連接器、線束），市場一直用太陽能公司的框架在定價它。被忽視的不是這家公司，是它裡面的儲能部門：第二季電池儲能系統營收約 2,000 萬美元、在手訂單 6,500 萬美元，被包在總計 8.014 億美元、年增 19.4% 的整體在手訂單裡看不出來。第二季營收 1.634 億美元、年增 47%，但財測沒上調，股價在七天內回落約 44%。風險與反方論點：淨利從 1,390 萬掉到 1,210 萬，利潤率正被訴訟費用與生產時程壓縮；而且儲能訂單佔比仍小，現在把它當儲能股是提前了一到兩年。本卡是研究線索，不是投資建議。", "en": "Shoals Technologies makes electrical balance-of-system components for solar plants - wiring, connectors, harnesses - and the market has consistently priced it through a solar lens. What is ignored is not the company but the storage segment inside it: roughly $20 million of battery energy storage revenue in the second quarter and a $65 million storage backlog, invisible inside a total backlog of $801.4 million that grew 19.4% year over year. Second-quarter revenue was $163.4 million, up 47%, but guidance was left unchanged and the shares fell about 44% over seven days. Risks and the other side: net income slipped from $13.9 million to $12.1 million as litigation expense and production timing compress margins, and the storage share of orders is still small enough that treating this as a storage stock today is a year or two early. Research lead, not investment advice.", "url": "https://www.investing.com/news/company-news/shoals-q2-2026-slides-record-revenue-backlog-amid-margin-pressure-93CH-4834521", "status": "RADAR · 下一個驗證點 2026 年 11 月 Q3 財報（儲能在手訂單佔比與利潤率）", "stocks": [{"t": "SHLS", "n": "Shoals，第二季營收 1.634 億、年增 47%，儲能在手訂單 6,500 萬"}, {"t": "ARRY", "n": "Array Technologies，最接近的太陽能設備同業，估值對照組"}, {"t": "FLNC", "n": "Fluence Energy，純儲能公司，用來衡量儲能業務該值多少"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "許可證的二元開關", "color": "#C9A227", "zh": "AXT 透過中國子公司通美（Tongmei）生產磷化銦與砷化鎵化合物半導體基板，這是光通訊與資料中心光模組的上游材料。它的論點完全是二元的：中國在 2025 年 2 月把磷化銦基板列入出口管制，通美已陸續取得輸往歐洲、日本、英國、加拿大的許可，唯獨輸往美國客戶的許可到現在仍卡在「最後審查階段」，公司自己在公開文件裡稱這是「最重大的挑戰」，部分客戶訂單持續積壓。週四的川習會與 11 月 10 日的關稅休兵到期，是這個開關最近的兩個外部事件。風險與反方論點：許可若遲遲不下，積壓訂單會流向替代供應商，而不是無限期等待；而且公司近期有發行新股的動作，稀釋是實質的。本卡是研究線索，不是投資建議。", "en": "AXT produces indium phosphide and gallium arsenide compound semiconductor substrates through its Chinese subsidiary Tongmei, upstream materials for optical communications and data-centre optics. The thesis is entirely binary: China placed indium phosphide substrates under export control in February 2025, and Tongmei has since obtained permits for Europe, Japan, the UK and Canada - but the permit for US customers remains in what the company calls the final stages of review, describing it in public filings as its most significant challenge, with customer orders still backlogged. Thursday's Trump-Xi summit and the November 10 tariff truce expiry are the two nearest external events attached to that switch. Risks and the other side: if the permit stays stuck, backlogged orders migrate to alternative suppliers rather than waiting indefinitely, and recent equity issuance means dilution is real. Research lead, not investment advice.", "url": "https://fundaai.substack.com/p/researchaxti-indium-phosphide-inp", "status": "RADAR · 下一個驗證點 9/24 川習會與 11/10 關稅休兵到期", "stocks": [{"t": "AXTI", "n": "AXT，對美磷化銦出口許可仍在最後審查階段，訂單積壓中"}, {"t": "LITE", "n": "Lumentum，光通訊模組商，磷化銦基板的下游需求端"}, {"t": "COHR", "n": "Coherent，同為光通訊上游，可看出材料短缺的傳導路徑"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "分拆的時間表確定了", "color": "#C9A227", "zh": "Corteva 分拆種子與基因事業的時間表已經全部釘死：9 月 24 日是股權登記日，每持有一股 Corteva 配發一股 Vylor；9 月 25 日到 9 月 30 日以 VYLR WI 代號進行「發行時」交易；10 月 1 日起以 VYLR 正常交易。這是分拆策略最經典的窗口——原本持有 Corteva 的指數基金與收益型基金，多數不能或不願持有一家新的、沒有配息紀錄、還沒進入任何指數的種子公司，被動賣壓會在前兩週集中出現。風險與反方論點：農業景氣本身在下行，種子定價權未必撐得住；而且分拆後的負債分配與授權金結構要等正式文件才看得到，在那之前所有估值都是猜的。本卡是研究線索，不是投資建議。", "en": "Corteva's seed and genetics spin-off now has a fully fixed timetable: September 24 is the record date, with one Vylor share distributed per Corteva share; September 25 to 30 trades when-issued under VYLR WI; and regular-way trading under VYLR begins October 1. This is the classic spin-off window - index and income funds that held Corteva mostly cannot or will not hold a new seed company with no dividend record and no index membership, so passive selling concentrates in the first two weeks. Risks and the other side: the agricultural cycle is itself turning down and seed pricing power may not hold, while the post-separation debt allocation and licensing structure only become visible in the final documents, before which every valuation is a guess. Research lead, not investment advice.", "url": "https://www.prnewswire.com/news-releases/corteva-board-of-directors-approves-vylor-distribution-302876601.html", "status": "RADAR · 下一個驗證點 9/25 when-issued 開盤與 10/1 正式交易後兩週量價", "stocks": [{"t": "VYLR", "n": "Vylor，9/25 起 when-issued、10/1 正式交易的分拆標的"}, {"t": "CTVA", "n": "Corteva，分拆母公司，9/24 為股權登記日"}, {"t": "FMC", "n": "FMC Corp，作物保護同業，農業景氣下行的對照讀數"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "論點有到期日", "color": "#C9A227", "zh": "United States Antimony 做美國本土的銻開採與冶煉，銻用在彈藥底火、阻燃劑與半導體。它的稀缺論點有一個很少見的特徵：有明確到期日。中國在 2024 年 9 月宣布對美禁運銻等關鍵礦物後，價格從每噸 1,400 美元一路衝到 38,000 美元，對美出貨量掉了 97%；目前的禁令暫停排定在 11 月 27 日到期，剛好落在 11 月 10 日關稅休兵到期之後。基本面這邊也有實體支撐：與國防後勤局簽的五年最高 2.45 億美元獨家供應合約，加上 2,700 萬美元國防生產法案資金用於蒙大拿冶煉廠擴產六倍。風險與反方論點：如果 11 月 27 日禁令解除、中國貨源回流，價格的稀缺溢價會在幾週內蒸發，而擴產產能要到之後才開出來，時間點是錯開的。本卡是研究線索，不是投資建議。", "en": "United States Antimony mines and smelts antimony domestically - a metal used in ammunition primers, flame retardants and semiconductors. Its scarcity thesis has an unusual property: an explicit expiry date. After China banned antimony and other critical-mineral exports to the US in September 2024, prices ran from $1,400 a tonne to $38,000 and shipments to the US fell 97%; the current suspension of that ban is set to lapse on November 27, just after the November 10 tariff truce expiry. There is physical support underneath as well: a sole-source Defense Logistics Agency contract worth up to $245 million over five years, plus $27 million of Defense Production Act funding to expand the Montana smelter sixfold. Risks and the other side: if the ban lifts on November 27 and Chinese supply returns, the scarcity premium can evaporate within weeks, while the expanded capacity only arrives afterwards - the timing does not line up. Research lead, not investment advice.", "url": "https://www.csis.org/analysis/chinas-antimony-export-restrictions-impact-us-national-security", "status": "RADAR · 下一個驗證點 11/27 中國銻出口禁令暫停到期", "stocks": [{"t": "UAMY", "n": "United States Antimony，2.45 億美元國防後勤局獨家合約持有者"}, {"t": "PPTA", "n": "Perpetua Resources，愛達荷金銻礦，同一稀缺論點的另一條路徑"}, {"t": "TMQ", "n": "Trilogy Metals，美國關鍵礦物政策受惠標的，政策時間表的對照組"}]},
    {"id": "insider_0", "channel": "內部人動向", "tag": "銀行執行長自購", "color": "#6DB56D", "zh": "9 月 18 日當天總共有 212 筆公開市場的內部人交易申報，其中最值得單獨看的一筆是 Truist Financial 總裁兼執行長 Michael Lyons 於 9 月 17 日買進 21,000 股，金額約 101.6 萬美元。時間點是關鍵：這筆買進發生在聯準會 9 月 16 日升息定案的隔天。銀行執行長在升息隔天買自家股票，等於用真錢對一個判斷押注——淨利差擴張帶來的好處，會大於信用品質惡化帶來的壞處。這個判斷未必對，但它是一個可以被後續財報明確證偽的判斷，這正是內部人交易最有價值的地方。", "en": "There were 212 open-market insider transactions filed on September 18, and the one worth isolating is Truist Financial president and chief executive Michael Lyons buying 21,000 shares on September 17 for roughly $1,015,576. The timing is the point: the purchase came the day after the Fed's September 16 hike was confirmed. A bank chief executive buying his own stock the day after a hike is betting real money on a specific judgement - that widening net interest margins will outweigh deteriorating credit quality. The judgement need not be right, but it is one that subsequent earnings can clearly falsify, which is exactly what makes insider transactions useful.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+September+18,+2026", "stocks": [{"t": "TFC", "n": "Truist Financial，執行長 9/17 買進 21,000 股、約 101.6 萬美元"}, {"t": "USB", "n": "U.S. Bancorp，規模相近的區域銀行對照組"}, {"t": "PNC", "n": "PNC Financial，同一組淨利差對信用品質的權衡"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "九月的執行長買單", "color": "#6DB56D", "zh": "九月以來比較顯眼的執行長買單有這幾筆：Upstart 的 Gu Paul 約 130 萬美元、Alphatec 的 Patrick Miles 約 100 萬美元、Relmada Therapeutics 的 Sergio Traversa 約 82.8 萬美元、CarParts.com 的 David Meniane 約 13.3 萬美元。金額不能直接橫向比較，正確的做法是先除以那個人的已知年度薪酬——對一位年薪千萬美元的執行長，100 萬美元是零頭；對一家微型市值公司年薪四十萬美元的執行長，13.3 萬美元是四個月的全部收入。後者的訊號強度遠高於前者，即使絕對金額小了八倍。", "en": "The more visible chief-executive purchases since the start of September: Upstart's Paul Gu at about $1.3 million, Alphatec's Patrick Miles at roughly $1.0 million, Relmada Therapeutics' Sergio Traversa at about $828,000 and CarParts.com's David Meniane at roughly $133,000. These figures cannot be compared side by side; the correct step is to divide each by that person's known annual compensation first. For a chief executive paid ten million a year, one million is pocket change; for one paid four hundred thousand at a micro-cap, $133,000 is four months of total income. The signal strength of the second is far higher than the first, even though the absolute number is eight times smaller.", "url": "https://www.thedesperatetrader.com/insider-buying", "stocks": [{"t": "UPST", "n": "Upstart，執行長九月買進約 130 萬美元"}, {"t": "ATEC", "n": "Alphatec，執行長買進約 100 萬美元"}, {"t": "RLMD", "n": "Relmada，執行長買進約 82.8 萬美元，池內標的"}, {"t": "PRTS", "n": "CarParts.com，執行長買進約 13.3 萬美元，相對薪酬比重最高"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "群聚才是訊號", "color": "#6DB56D", "zh": "單一內部人買進的解釋空間太大——可能是履行持股規定、可能是稅務安排、也可能只是公關動作。真正有統計意義的是三種情況：多位內部人在同一個窗口分別買進（群聚）、買方是審計委員會主席（他看到的財務細節最多）、以及買進發生在財報公布前的靜默期結束後而非之前。另外要學會分辨買方身份：持股超過一成的大股東加碼，跟經營層自己掏錢買，是兩件事。前者是資本結構的訊號，後者才是對營運的訊號，QVC Group 近期名單上反覆出現的買盤就屬於前者。", "en": "A single insider purchase admits too many explanations - meeting a share-ownership requirement, a tax arrangement, or simply a public-relations gesture. Three situations carry real statistical weight: several insiders buying separately within the same window (a cluster), the buyer being the audit committee chair (who sees the most financial detail), and the purchase landing after the pre-earnings blackout ends rather than before it. Learn to distinguish the buyer as well: a holder above ten percent adding to a position is not the same as operating management spending their own money. The first is a signal about capital structure, the second about operations - and the repeated buying on QVC Group's recent list belongs to the first category.", "url": "https://dilutionwatch.com/articles/insider-activity.html", "stocks": [{"t": "QVCG", "n": "QVC Group，近期買盤來自持股逾一成的大股東而非經營層"}, {"t": "GPI", "n": "Group 1 Automotive，九月中內部人買進名單上的另一檔"}, {"t": "MO", "n": "Altria，9/9 一位董事買進 1,500 股，典型的小額例行交易"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "房市下行裡的買單", "color": "#B5654D", "zh": "眾議院書記官九十天窗口內的定期交易報告（PTR）目前累計 132 份。這一批裡最值得看的不是金額最大的那位，而是俄亥俄州第二選區的 David J. Taylor：90 天內 28 筆交易、19 買 9 賣，申報金額區間約 4.2 萬到 45.5 萬美元，最近一筆申報日期是 9 月 17 日，主要標的包括微軟、Alphabet、博通與 Installed Building Products。前三檔是誰都在買的大型科技股，沒有資訊量；真正有 thesis 的是 IBP——一家住宅隔熱與建材安裝商，出現在一個建商財測正在下修、房貸利率貼著 5% 的季度裡。這個部位在押的是「新屋開工不會再壞下去」。", "en": "The House Clerk's ninety-day window currently holds 132 periodic transaction reports. The one worth reading in this batch is not the largest by dollar value but David J. Taylor of Ohio's second district: 28 transactions over 90 days, 19 buys against 9 sells, a disclosed range of roughly $42,000 to $455,000, most recent filing dated September 17, with holdings including Microsoft, Alphabet, Broadcom and Installed Building Products. The first three are large-cap technology names everyone owns and carry no information. The one with an actual thesis is IBP - a residential insulation and building-products installer - appearing in a quarter when builder guidance is being cut and mortgage rates sit near 5%. That position is a bet that housing starts do not deteriorate further.", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure", "stocks": [{"t": "IBP", "n": "Installed Building Products，這組部位裡唯一帶有明確假設的一檔"}, {"t": "MSFT", "n": "微軟，國會申報中最常出現的名字，資訊量最低"}, {"t": "AVGO", "n": "博通，同一組申報中的大型科技持股"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "四十五天的時差", "color": "#B5654D", "zh": "這個頻道的第一條紀律是：政要持股不是買賣訊號。STOCK Act 給的申報期限是交易後 45 天，所以你今天看到的這筆交易，執行價是大約一個半月前的價位——如果那段期間標的漲了三成，跟單的人買到的是完全不同的東西。第二條是金額只有區間沒有數字，1,001 到 15,000 美元這種級距，根本算不出部位大小。第三條是多數交易由配偶帳戶或信託執行，申報人本人未必知情。今年累計 44,391 筆揭露中，22,831 筆是買進、21,375 筆是賣出，其中約 25%（10,928 筆）由對該產業有直接管轄權的委員會成員做出——這個比例值得知道，但知道它不等於可以拿來交易。", "en": "The first discipline for this channel: congressional holdings are not a trading signal. The STOCK Act allows 45 days from execution to disclosure, so the trade you read today was filled at a price roughly six weeks old - if the name rose thirty percent in between, anyone following is buying something entirely different. Second, amounts come only as ranges; a bracket like $1,001 to $15,000 makes position size uncomputable. Third, most transactions are executed in spousal accounts or trusts and the filer may not have known. Of 44,391 disclosures this year, 22,831 were purchases and 21,375 sales, with about 25% (10,928) made by members sitting on a committee with direct jurisdiction over that industry - a proportion worth knowing, but knowing it is not the same as being able to trade it.", "url": "https://capitolmarkets.org/research/congress-stock-trading", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報持股的 ETF，把時差問題產品化的例子"}, {"t": "GOP", "n": "追蹤共和黨籍議員申報持股的 ETF，同一套時差限制"}, {"t": "SPY", "n": "標普 500 ETF，任何跟單策略都該先跟它比較"}]},

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function HeatmapView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",
        blockSize: "market_cap_basic", blockColor: "change",
        locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true,
        hasSymbolTooltip: true, isMonoSize: false,
        width: "100%", height: "100%"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px" }}>

  );

      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 6px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>政要交易 ETF · 近一年</span>
        <a href="https://www.quiverquant.com/congresstrading/" target="_blank" rel="noopener noreferrer" className="source-link">Quiver 排行 ↗</a>
      </div>
      <div style={{ padding:"0 16px 10px", fontSize:"11px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
        NANC 跟著民主黨籍議員的申報建倉、GOP 跟著共和黨籍（原 KRUZ），兩檔都吃 45 天申報延遲後的資料。跟 SPY 的差距就是「照著政要申報買」的真實代價與報酬。
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ height:"300px", flexShrink:0 }} />

      {R.roster.length > 0 && (
        <div style={{ paddingTop:"20px" }}>
          <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 6px" }}>
            <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>個別議員 · 近 {R.window} 天申報</span>
            <span style={{ fontSize:"10px", color:"var(--text-tertiary)" }}>更新 {R.updated}</span>
          </div>
          <div style={{ padding:"0 16px 12px", fontSize:"11px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            眾議院 STOCK Act 定期交易報告（PTR）原始申報書彙整，共 {R.filings} 份、其中 {R.skipped_scanned} 份是紙本掃描件無法解析。金額只有級距沒有數字，絕大多數落在最低的 $1,001–$15,000，所以下面顯示的是<span style={{ color:"var(--text-secondary, inherit)" }}>申報區間</span>而不是實際金額——別把它當成真實部位大小。點議員名字可看原始申報書。
          </div>
          <div style={{ overflowX:"auto", padding:"0 16px" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"12px" }}>
              <thead>
                <tr style={{ color:"var(--text-tertiary)", fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", textTransform:"uppercase" }}>
                  <th style={{ textAlign:"left",  padding:"6px 8px 6px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>議員</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>筆數</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>買 / 賣</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>申報區間</th>
                  <th style={{ textAlign:"left",  padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>常見標的</th>
                  <th style={{ textAlign:"right", padding:"6px 0 6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>最新申報</th>
                </tr>
              </thead>
              <tbody>
                {R.roster.map(r => (
                  <tr key={r.name + r.dst}>
                    <td style={{ padding:"7px 8px 7px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      <a href={r.url} target="_blank" rel="noopener noreferrer" style={{ color:"#B5654D", textDecoration:"none" }}>{r.name}</a>
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px", marginLeft:"6px" }}>{r.dst}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums" }}>{r.n}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>
                      <span style={{ color:"#6DB56D" }}>{r.buy}</span>
                      <span style={{ color:"var(--text-tertiary)" }}> / </span>
                      <span style={{ color:"#E05C5C" }}>{r.sell}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>{money(r.lo)}–{money(r.hi)}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      {r.top.map(t => (
                        <a key={t} href={"https://www.tradingview.com/symbols/" + t + "/"} target="_blank" rel="noopener noreferrer"
                           style={{ color:"var(--text-secondary, inherit)", textDecoration:"none", marginRight:"7px", fontFamily:"'Courier New',monospace" }}>{t}</a>
                      ))}
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px" }}>共 {r.distinct} 檔</span>
                    </td>
                    <td style={{ padding:"7px 0 7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", whiteSpace:"nowrap" }}>{r.last}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ padding:"12px 16px 0", fontSize:"10px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            只涵蓋眾議院；參議院走另一套 efdsearch 系統，尚未納入。買＋賣不一定等於筆數，差額是交換（exchange）類交易。
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/22/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v11.9</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
