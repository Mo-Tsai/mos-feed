<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },

  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "長端變陡", "color": "#E05C5C", "zh": "真正的新聞在長天期。30 年期公債殖利率 5.43%，改寫 2004 年以來新高，上升速度比 10 年期快，殖利率曲線在長端變陡。這代表市場定價的不只是「聯準會再升一碼」這種循環性的事，而是更長期的通膨中樞與財政供給風險。對股票來說，被推上去的是折現率裡天期最長的那一段，受傷最重的是現金流集中在遠期的資產。", "en": "The real news is at the long end. The 30-year Treasury yield hit 5.43%, a fresh high since 2004, rising faster than the 10-year and steepening the back of the curve. That prices in more than one more Fed hike — it prices in a higher long-run inflation anchor and fiscal supply risk. For equities, the segment of the discount rate that moved is the longest-dated one, so the assets whose cash flows sit furthest out take the most damage.", "url": "https://www.nbcnews.com/business/energy/treasury-yields-oil-stocks-rcna599398", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，30 年期殖利率 5.43% 直接壓價"}, {"t": "LQD", "n": "投資級公司債 ETF，久期長、同步承壓"}]},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "油價地緣", "color": "#E05C5C", "zh": "推高殖利率的那隻手是油價。伊朗總統裴澤斯基安在聯合國大會表態不會向美國壓力低頭，短期達成協議的機率下降，布蘭特原油隨即重新站回 100 美元以上。荷姆茲海峽已被軍事封鎖七個月，期間還有一艘貨輪遭不明彈體擊中。能源是標普 500 當天少數收紅的類股之一。", "en": "The hand pushing yields up is oil. Iranian President Pezeshkian told the UN General Assembly he would not yield to US pressure, cutting the odds of a near-term deal, and Brent promptly reclaimed $100. The Strait of Hormuz has been under military blockade for seven months, and a cargo vessel was struck by an unidentified projectile during the standoff. Energy was one of the few S&P 500 sectors to close green.", "url": "https://www.techflowpost.com/en-US/article/34214", "stocks": [{"t": "XLE", "n": "能源類股 ETF，當日少數收紅的板塊之一"}, {"t": "USO", "n": "原油 ETF，布蘭特重回 100 美元以上"}, {"t": "OXY", "n": "美國頁岩與二疊紀盆地主力生產商，對油價彈性高"}]},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "盤勢結構", "color": "#E05C5C", "zh": "這天值得記的是「形狀」而不是收盤數字。早盤是好數據反而被解讀成升息壓力（good data backfires），指數走弱；午後荷姆茲協議重啟的消息讓標普與那斯達克一度翻正，最後收在低點之上。地緣消息可以在一天之內把大盤來回推兩次，代表市場目前沒有自己的方向，是被外生變數牽著走。這種盤勢裡，任何單日的類股強弱都不該被當成趨勢。", "en": "What mattered Thursday was the shape, not the closing number. Good economic data backfired in the morning — it read as more rate pressure — and indices slid; by the afternoon, revived Hormuz talks briefly pushed the S&P and Nasdaq positive and the market closed well off its lows. When a single geopolitical headline can swing the tape twice in one session, the market has no internal direction and is being led by exogenous variables. In that regime, one day of sector leadership is not a trend.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-september-24-dow-sp-500-nasdaq-080352893.html", "stocks": [{"t": "VXX", "n": "短天期波動率期貨 ETN，盤中來回擺盪的直接對照"}, {"t": "XLK", "n": "科技類股 ETF，早盤最弱、午後跟著翻正"}, {"t": "XLP", "n": "必需消費類股 ETF，防禦性在 5% 殖利率下失效"}]},
    {"id": "earn_0", "channel": "財報速報", "tag": "好市多 FQ4", "color": "#E8786A", "zh": "好市多（COST）在 9/24 盤後公布 FY2026 第四季：每股盈餘 6.75 美元，優於市場預期的 6.52 美元（+3.53%）；營收 957.2 億美元，也高於預期的 948.6 億，去年同期為 861.6 億，年增約 11%。營收與獲利雙雙優於預期，但盤後股價只漲 0.22% 到 898.92 美元。這是典型的「財報沒問題、股價沒反應」。", "en": "Costco (COST) reported fiscal Q4 2026 after Thursday's close: EPS of $6.75 beat the $6.52 consensus by 3.53%, and revenue of $95.72 billion topped the $94.86 billion estimate, up from $86.16 billion a year earlier — roughly 11% growth. Both lines beat, yet the stock rose just 0.22% to $898.92 in extended trading. A textbook case of a clean print that the tape refused to pay for.", "url": "https://www.benzinga.com/markets/earnings/26/09/61985661/costco-wholesale-reports-strong-q4-revenue-earnings-beat-estimates", "stocks": [{"t": "COST", "n": "財報雙優於預期，盤後僅漲 0.22% 至 898.92 美元"}, {"t": "BJ", "n": "同為會員制倉儲量販，規模小得多，可做會員模式的估值對照"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "反應判讀", "color": "#E8786A", "zh": "好市多這次的反應比數字本身更值得看。上一季（Q3）同樣優於預期，公布後股價跌 4%；過去一個月股價跌約 7%，而會員數與同店銷售的趨勢並沒有轉壞。當 10 年期殖利率站上 5%，高本益比的防禦型優質股失去的是估值溢價，不是基本面。財報季的判讀重點因此要從「有沒有優於預期」移到「優於預期的幅度，夠不夠補上折現率的上升」。", "en": "The reaction is more informative than the numbers. Costco also beat in Q3 and the stock fell 4% afterwards; it is down roughly 7% over the past month even though membership and comparable sales trends have not deteriorated. With the 10-year above 5%, what high-multiple defensive quality names are losing is the valuation premium, not the fundamentals. The right question this earnings season is no longer whether a company beat, but whether the size of the beat covers the rise in the discount rate.", "url": "https://247wallst.com/investing/2026/09/24/live-will-costco-crush-q4-earnings-tonight-after-the-market-closes/", "stocks": [{"t": "WMT", "n": "同樣被當成高品質防禦股，估值溢價面對同一個壓力"}, {"t": "TGT", "n": "本益比低得多的對照組，估值溢價的壓縮空間相對小"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "企業 IT 預算", "color": "#E8786A", "zh": "下一個企業 IT 預算的溫度計是埃森哲（ACN），10/1 美東時間早上 8 點公布 FY2026 第四季與全年。上一季（FQ3，截至 5/31）新增訂單 193.2 億美元，以美元計年減 2%、以當地貨幣計年減 3%，是本財年首度轉負；但年初至今 1 億美元以上的大型客戶訂單累計 104 筆、年增 13%。訂單總額在縮、大案在增，這兩個方向相反的數字才是重點。", "en": "The next read on enterprise IT budgets is Accenture (ACN), reporting fiscal Q4 and full-year 2026 at 8:00 a.m. ET on October 1. Last quarter (FQ3, ended May 31) new bookings were $19.32 billion, down 2% in dollars and 3% in local currency — the first negative print of the fiscal year. Yet year-to-date bookings of $100 million or more numbered 104, up 13%. Total bookings shrinking while mega-deals grow is the divergence that matters.", "url": "https://newsroom.accenture.com/news/2026/accenture-to-announce-fourth-quarter-and-full-year-fiscal-2026-results", "stocks": [{"t": "ACN", "n": "10/1 盤前公布 FQ4，上季新增訂單年減 2% 為本財年首度轉負"}, {"t": "IBM", "n": "同為大型 IT 服務與諮詢，9/24 宣布收購資料公司 Logiq"}, {"t": "INFY", "n": "印度 IT 服務對照組，看的是同一批企業客戶的預算"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "還要升幾次", "color": "#7C6AF7", "zh": "聯準會的辯論已經不是「還要不要升」，而是「升幾次」。19 位 FOMC 成員中有 16 位預期今年至少還有一次升息，其中 12 位把 2026 年底的利率點在比目前 3.75%–4.00% 再高一碼的位置。9/22 的期貨市場把 12 月定價在約 4.2%。推動這個轉向的是能源價格衝擊、進口關稅與 AI 資本支出共同撐起的通膨——2026 年整體 PCE 預估 3.7%、核心 3.4%，勞動市場與 2.3% 的 GDP 成長則讓緊縮有底氣。", "en": "The Fed debate is no longer whether to hike but how many more times. Sixteen of nineteen FOMC participants expect at least one more hike this year, and twelve place the end-2026 target a quarter-point above the current 3.75%–4.00% range. As of September 22, futures priced roughly 4.2% by December. The hawkish shift is driven by inflation supported jointly by energy shocks, import tariffs and AI capital spending — headline PCE is projected at 3.7% for 2026 with core at 3.4% — while a resilient labour market and 2.3% GDP growth give tightening room to run.", "url": "https://www.bondsavvy.com/fixed-income-investments-blog/fed-dot-plot", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，12 月再升一碼的定價已反映在價格上"}, {"t": "KRE", "n": "區域銀行 ETF，升息對淨息差有利、對債券部位帳面有害，兩股力量同時作用"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "川習會結果", "color": "#7C6AF7", "zh": "9/24 的川習會給出一個「買時間」的結果：雙方同意把貿易休兵延長到 2027 年初，但稀土、科技管制與台灣的歧見都沒有解決。稀土的處理方式是分階段延長出口許可暫停，換取科技端的讓步——緩解了供應焦慮，卻沒有降低取得的政治與監理門檻。半導體管制被排除在議程之外，是雙方距離最遠的一項；唯一可能成形的具體成果，是一條處理國安級事件的 AI 熱線。", "en": "The September 24 Trump-Xi meeting bought time rather than settling anything: the two sides agreed to extend the trade truce into early 2027, while differences over rare earths, technology controls and Taiwan remain unresolved. On rare earths the mechanism is a sequenced extension of export-licence suspensions traded against technology concessions — it eases supply anxiety without lowering the political and regulatory threshold for access. Semiconductor controls were left off the agenda entirely, the issue where the two sides are furthest apart; the only concrete deliverable likely to materialise is an AI hotline for national-security-level incidents.", "url": "https://thediplomat.com/2026/09/rare-earths-at-the-trump-xi-summit-relief-without-a-resolution/", "stocks": [{"t": "MP", "n": "美國本土稀土開採與分離，出口許可若分階段延長會削弱其稀缺性溢價"}, {"t": "AXTI", "n": "雷達池內名單，對美化合物半導體出口許可仍是尚未核發的二元開關"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "長端的兩面", "color": "#7C6AF7", "zh": "30 年期殖利率 5.43% 對不同資產是完全相反的事。壽險與年金公司的再投資收益率跟著長端走，負債久期又固定，利差是擴大的；而以長期租約與高槓桿為底的不動產信託，資本化率必須跟著上調，帳面價值直接承壓。判斷一個部位是不是「在賭利率會下來」，最快的方法是問它的現金流久期有多長——久期越長，對這 5.43% 越敏感。", "en": "A 5.43% 30-year yield means opposite things to different assets. Life insurers and annuity writers reinvest at the long end while their liability duration is fixed, so spreads widen. REITs built on long leases and high leverage must mark cap rates higher, and book value takes the hit directly. The fastest way to test whether a position is quietly betting on lower rates is to ask how long its cash-flow duration is — the longer it is, the more sensitive it is to that 5.43%.", "url": "https://www.nbcnews.com/business/energy/treasury-yields-oil-stocks-rcna599398", "stocks": [{"t": "MET", "n": "壽險，長端殖利率上升拉高再投資收益率、利差擴大"}, {"t": "O", "n": "月配息零售型不動產信託，長租約與高久期在 5.43% 下最吃虧"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "能源的代價", "color": "#4EABA4", "zh": "今年的類股分歧已經拉到極端：能源 ETF（XLE）年初至今漲 45.8%，通訊服務（XLC）則跌 5.3%。9/24 能源又是標普 500 少數收紅的類股。但要注意，能源現在已經不是逆向交易——它上漲的理由就是美伊緊張帶來的油價，換句話說，持有它等於同時持有地緣風險的曝險。如果荷姆茲談判真的成功，這個部位的下檔會比想像中快。", "en": "Sector dispersion has reached an extreme this year: the energy ETF (XLE) is up 45.8% year to date while communication services (XLC) is down 5.3%, and energy was again one of the few S&P 500 sectors to close green on September 24. But energy is no longer a contrarian trade — the reason it is rising is the oil price driven by US-Iran tension, which means holding it is also holding geopolitical exposure. If the Hormuz talks actually succeed, the downside arrives faster than most expect.", "url": "https://www.investing.com/analysis/sector-rotation-intensifies-value-outperforms-growth-in-2026-market-split-200675093", "stocks": [{"t": "XLE", "n": "能源類股 ETF，年初至今漲 45.8%"}, {"t": "XOM", "n": "整合型油氣龍頭，上游獲利直接跟布蘭特連動"}, {"t": "COP", "n": "純上游生產商，對油價的營運槓桿高於整合型同業"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "債券代理破功", "color": "#4EABA4", "zh": "「債券代理」這套論述今年被拆成兩半。一邊是資金為了找收益流進不動產信託與公用事業；另一邊是當無風險利率本身就有 5%，這些股票的股息殖利率不再有相對吸引力，而且它們的槓桿成本同步上升。真正能撐住的，是有調價能力的那一類——費率連動、租約含消費者物價指數條款、或監理允許把資本支出轉嫁給用戶——而不是單純配息高的那一類。", "en": "The bond-proxy thesis has split in two this year. On one side, money still rotates into REITs and utilities looking for yield; on the other, when the risk-free rate itself pays 5%, those dividend yields lose their relative appeal while the cost of their leverage rises at the same time. What actually holds up is the subset with pricing power — regulated rate mechanisms, CPI escalators in leases, or the ability to pass capital spending through to customers — not simply whatever pays the highest dividend.", "url": "https://markets.financialcontent.com/stocks/article/marketminute-2026-4-3-strategic-safety-the-2026-rotation-into-utilities-and-reits-amidst-global-uncertainty", "stocks": [{"t": "XLU", "n": "公用事業 ETF，費率連動機制是它與純高股息股的分水嶺"}, {"t": "VNQ", "n": "不動產信託 ETF，資本化率上調直接壓縮帳面價值"}, {"t": "NEE", "n": "再生能源與受管制電力並行，資本支出轉嫁能力較強"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "旅遊鏈分岔", "color": "#4EABA4", "zh": "油價站上 100 美元直接打到旅遊鏈，但打法不一樣。航空與郵輪的燃油成本無法立即轉嫁，嘉年華郵輪目前完全沒有避險，布蘭特自該公司 6/23 第二季財報以來已漲約 33%。線上旅遊平台則不承擔燃油成本、只賺媒合佣金，在同一個景氣裡反而占上風。同一個主題裡，賺價差的和賺佣金的命運相反——這是判斷旅遊部位時第一個要分清楚的事。", "en": "Brent above $100 hits the travel chain, but not evenly. Airlines and cruise lines cannot pass fuel costs through immediately, and Carnival is currently unhedged while Brent has risen roughly 33% since its June 23 second-quarter report. Online travel agencies carry no fuel cost and earn a matching commission, so they gain ground in the same environment. Within one theme, the spread-takers and the commission-takers move in opposite directions — the first distinction to make when sizing travel exposure.", "url": "https://www.investing.com/news/stock-market-news/travel-sector-outlook-airlines-squeezed-by-fuel-costs-as-otas-gain-ground-93CH-4913670", "stocks": [{"t": "DAL", "n": "航空業，燃油是第二大成本、避險比例有限"}, {"t": "BKNG", "n": "線上旅遊平台，零燃油成本、賺媒合佣金"}, {"t": "CCL", "n": "郵輪，目前完全未避險，布蘭特自 6/23 已漲約 33%"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "資金撤退", "color": "#5B8ED6", "zh": "小型股的資金在撤。iShares Russell 2000 ETF（IWM）上週淨流出 33 億美元，是 2026 年第二大的單週流出，也是九年來第三大。原因單純：小型股的負債對利率更敏感，殖利率往上走的時候，它們的利息費用是真的會跳的，不像大型股只是估值被壓。資金流出的規模本身不預測方向，但它告訴你這個族群的賣壓來自配置決策，不是個股基本面。", "en": "Money is leaving small caps. The iShares Russell 2000 ETF (IWM) saw $3.3 billion of outflows last week, its second-largest weekly withdrawal of 2026 and third-largest in nine years. The reason is simple: small-cap debt is more rate-sensitive, so when yields rise their interest expense actually jumps, whereas large caps mostly just get de-rated. The size of the outflow does not predict direction, but it tells you the selling pressure here is an allocation decision, not a fundamental one.", "url": "https://www.benzinga.com/etfs/sector-etfs/26/09/61982431/small-caps-crushed-iwm-sees-3-3b-outflow-treasury-yields-surge", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，上週淨流出 33 億美元"}, {"t": "IJR", "n": "標普 600 小型股 ETF，成分股有獲利門檻，資金流出壓力不同"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "連五週落後", "color": "#5B8ED6", "zh": "標普 500 已經連續五週表現優於羅素 2000。這不是單日的事，是一段持續的相對弱勢。值得記住的對照是：今年 4 月底羅素 2000 一度年初至今漲 12.25%，當時大型科技股正在做全球同步的頭部；五個月後位置完全對調。小型股的相對表現，實務上跟殖利率的方向綁得非常緊——要押小型股翻身，等於在押利率見頂。", "en": "The S&P 500 has now outperformed the Russell 2000 for five consecutive weeks — not a one-day event but a sustained stretch of relative weakness. The useful contrast: in late April the Russell 2000 was up 12.25% year to date while large-cap tech was working through a globally synchronised top. Five months later the positions are exactly reversed. In practice small-cap relative performance is tightly bound to the direction of yields, so betting on a small-cap recovery is a bet that rates have peaked.", "url": "https://www.columbiathreadneedle.com/en/insights/why-own-us-small-caps-in-2026/", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，連續五週落後標普 500"}, {"t": "SPY", "n": "標普 500 ETF，相對強勢的另一端"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "浮動利率負債", "color": "#5B8ED6", "zh": "小型股對利率的敏感度，不只是本益比的問題。羅素 2000 成分股裡有相當高比例的負債是浮動利率，或是到期日集中在未來兩三年內的短天期債；大型股在 2020 到 2021 年把長天期低利債鎖好了，小型股沒有這個機會。所以同樣一碼升息，對兩邊損益表的影響不是同一個量級。看小型股時，先看負債結構與到期牆，再看營收成長，順序反了會誤判。", "en": "Small-cap rate sensitivity is not just a multiple story. A high share of Russell 2000 debt is floating-rate or short-dated with maturities clustered in the next two to three years, while large caps locked in long-dated cheap debt in 2020-2021 and small caps largely did not. So the same quarter-point hike hits the two income statements by different orders of magnitude. When screening small caps, read the debt structure and the maturity wall before the revenue growth — reversing that order is how people get it wrong.", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment", "stocks": [{"t": "IWO", "n": "羅素 2000 成長型 ETF，成分股負債與燒錢比例最高"}, {"t": "IWN", "n": "羅素 2000 價值型 ETF，金融股權重高，利率影響方向相反"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "新低清單", "color": "#5B8ED6", "zh": "新低清單正在變長。9/18（週五）有 83 檔股票觸及 52 週新低，9/22 當天還有 41 檔，其中包含標普 500 成分股。但新低清單本身不是買進訊號——它同時裝著「被利率錯殺的好公司」和「基本面真的壞掉的公司」，兩者在清單上長得一模一樣。分辨的方法只有兩個：自由現金流是否仍為正，以及有沒有內部人用自己的現金在買。", "en": "The 52-week-low list is getting longer: 83 names touched new lows on Friday September 18, and 41 more did on September 22, including S&P 500 constituents. But the list itself is not a buy signal — it holds good companies mispriced by rates and companies whose fundamentals are genuinely broken, and on the screen they look identical. There are only two ways to tell them apart: whether free cash flow is still positive, and whether insiders are buying with their own cash.", "url": "https://www.trefis.com/stock/spy/articles/616109/41-stocks-just-touched-52-week-lows/2026-09-22", "stocks": [{"t": "KMX", "n": "二手車零售，9/29 公布 FQ2，股價貼近低檔區"}, {"t": "MTN", "n": "滑雪度假村營運商，季票銷售連兩年下滑，是基本面型而非利率型的新低"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "池子差異", "color": "#5B8ED6", "zh": "一個常被忽略的細節：IWM（羅素 2000）與 IJR（標普 600 小型股）不是同一個池子。標普 600 有獲利門檻，成分股必須連續獲利才能納入；羅素 2000 沒有這道篩子，所以裡面有大量還在燒錢的臨床期生技與微型股。在利率上升的環境裡，這兩個指數的表現會系統性分開，因為燒錢公司的再融資成本是直接跟著殖利率走的。說「看好小型股」的時候，得先講清楚是哪一個。", "en": "An often-missed detail: IWM (Russell 2000) and IJR (S&P SmallCap 600) are not the same pool. The S&P 600 applies a profitability screen — constituents must show consecutive positive earnings — while the Russell 2000 has no such filter and therefore holds a large tail of cash-burning clinical-stage biotech and micro caps. In a rising-rate environment the two indices systematically diverge, because refinancing costs for cash-burners track yields directly. Saying you are bullish on small caps means nothing until you say which one.", "url": "https://russellinvestments.com/content/ri/us/en/insights/russell-research/2026/03/small-cap-momentum-moderates-mwir.html", "stocks": [{"t": "IJR", "n": "標普 600 小型股 ETF，有獲利門檻篩選"}, {"t": "SCHA", "n": "更廣的美國小型股 ETF，成分數量多、篩選最寬鬆"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "大股東加碼", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月下旬 Q3 財報", "zh": "Group 1 Automotive（GPI）做什麼：美國與英國的汽車經銷商集團，賣新車與二手車，也做維修保養與零件——後者才是穩定的利潤來源。為什麼被忽視：經銷商被整批歸類成汽車循環股，利率一升、車貸一貴就被丟掉，沒有人把售後服務部門分開估值。什麼正在改變：Conifer Management（同時是 10% 股東與董事）在 9/17 與 9/18 買進約 1,680 萬美元的普通股，成交價區間 247.17 至 269.89 美元；股價目前貼近 52 週低點 246.21 美元，年初至今跌約 36%。風險與反方論點：新車庫存正常化後的毛利率回落是結構性的、不是循環性的；Conifer 是財務投資人而非經營層，它的買進代表估值判斷而非營運訊息；利率若持續上行，車貸滲透率會繼續被壓。這是研究線索，不是投資建議。", "en": "What Group 1 Automotive (GPI) does: a US and UK auto dealership group selling new and used vehicles, with parts and service — the genuinely stable profit pool — attached. Why it is ignored: dealers get screened as a single auto-cycle bucket and are sold as a group whenever rates rise and car loans get expensive; nobody values the fixed-operations segment separately. What is changing: Conifer Management, both a 10% holder and a director, bought roughly $16.8 million of common stock on September 17 and 18 at prices between $247.17 and $269.89. The stock sits near its 52-week low of $246.21, down about 36% year to date. Risks and the bear case: post-shortage gross margin normalisation is structural rather than cyclical; Conifer is a financial investor, not management, so its buying reflects a valuation view rather than operating information; and if rates keep rising, loan penetration stays under pressure. A research lead, not investment advice.", "url": "https://www.investing.com/news/stock-market-news/tuesdays-insider-activity-major-buys-at-group-1-automotive-93CH-4913118", "stocks": [{"t": "GPI", "n": "9/17–9/18 大股東兼董事買進約 1,680 萬美元，股價貼近 52 週低點"}, {"t": "LAD", "n": "同業 Lithia Motors，規模更大，可做售後服務部門的估值對照"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新股冷門", "color": "#C9A227", "status": "RADAR · 下一個驗證點 下一份季報的在手訂單", "zh": "Karman Holdings（KRMN）做什麼：替飛彈與太空系統製造承壓艙段、整流罩與推進系統外殼的國防零組件商，2025 年才掛牌。為什麼被忽視：上市時間短、流通股數少、賣方覆蓋薄，而且它的產品埋在別人的系統裡，沒有可辨識的終端品牌，一般人根本不知道它存在。什麼正在改變：董事 David Stinnett 在 9/16 買進 27,000 股、金額 1,007,648 美元，成交價 36.99 至 37.52 美元；股價目前 35.25 美元，貼近 52 週低點 33.99 美元，過去六個月跌了 65%。風險與反方論點：跌 65% 通常不是估值問題而是預期被大幅下修，可能來自訂單遞延或利潤率不如上市時的說法；單一董事買進不構成群聚訊號；國防預算的分配順序也可能不利於飛彈防禦以外的次系統。這是研究線索，不是投資建議。", "en": "What Karman Holdings (KRMN) does: a defence component maker supplying pressure vessels, payload fairings and propulsion casings for missile and space systems, listed only in 2025. Why it is ignored: a short trading history, thin float, sparse sell-side coverage, and products buried inside other people's systems with no recognisable end brand. What is changing: director David Stinnett bought 27,000 shares on September 16 for $1,007,648 at prices between $36.99 and $37.52. The stock trades at $35.25 against a 52-week low of $33.99, down 65% over six months. Risks and the bear case: a 65% drawdown usually reflects sharply cut expectations rather than a valuation error — order deferrals or margins below the IPO narrative; a single director purchase is not a cluster signal; and defence budget priorities may not favour subsystems outside missile defence. A research lead, not investment advice.", "url": "https://www.everhint.com/insider-trading-signals-september-23-2026-evening-update-last-12-hours-pacific-time/", "stocks": [{"t": "KRMN", "n": "董事 9/16 買進 27,000 股、約 100.8 萬美元，股價六個月跌 65%"}, {"t": "HWM", "n": "Howmet，航太結構件的大型對照組，市場給的估值天差地遠"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "創辦人買回", "color": "#C9A227", "status": "RADAR · 下一個驗證點 下一份季報的不良貸款比率", "zh": "AFC Gamma（AFCG）做什麼：對大麻產業與其他另類資產做抵押放款的商業不動產貸款機構，市值極小。為什麼被忽視：大麻相關資產長期被機構資金排除在投資範圍之外，加上它在 2023 年分拆出 Sunrise Realty 之後規模更小，賣方幾乎不追。什麼正在改變：創辦人暨董事 Leonard Tannenbaum 在 9/22 買進 23,072 股，均價 3.49 美元。創辦人在股價掉到個位數時用自己的錢加碼，至少代表他認為帳上的貸款組合沒有市場定價的那麼糟。風險與反方論點：這類放款的擔保品評價高度依賴大麻政策，政策沒過就沒有再融資出口；Tannenbaum 本來就是最大股東，加碼的邊際資訊量比外部人買進低；股利若被削減，持股結構會再被洗一次。這是研究線索，不是投資建議。", "en": "What AFC Gamma (AFCG) does: a small commercial real-estate lender making secured loans to the cannabis industry and other alternative assets. Why it is ignored: cannabis-linked assets sit outside most institutional mandates, and after spinning off Sunrise Realty in 2023 the company is smaller still, with almost no sell-side coverage. What is changing: founder and director Leonard Tannenbaum bought 23,072 shares on September 22 at an average $3.49. A founder adding with his own money at a single-digit share price at least signals he thinks the loan book is not as impaired as the market is pricing. Risks and the bear case: collateral values in this lending depend heavily on cannabis policy, and without reform there is no refinancing exit; Tannenbaum is already the largest holder, so the marginal information in his buying is lower than an outsider's; and a dividend cut would reshuffle the holder base again. A research lead, not investment advice.", "url": "https://www.marketbeat.com/instant-alerts/insider-insider-buying-afc-gamma-nasdaq-afcg-director-acquires-23072-shares-of-company-stock-2026-09-24/", "stocks": [{"t": "AFCG", "n": "創辦人暨董事 9/22 買進 23,072 股，均價 3.49 美元"}, {"t": "IIPR", "n": "雷達池內的大麻產業不動產信託，同一個政策風險的曝險"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "冷門 BDC", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報的不良資產比率", "zh": "Runway Growth Finance（RWAY）做什麼：對成長期科技與生技公司做放款的商業發展公司，規模小，在商業發展公司這個族群裡屬於冷門。為什麼被忽視：這個類別本來就以配息率被交易，市場只看殖利率不看資產品質；RWAY 規模小、成交量薄，法人進出不便，研究覆蓋自然稀少。什麼正在改變：董事 Edward J. Goldthorpe（BC Partners）在 9/21 與 9/22 買進 10,000 股，金額約 67,450 美元，成交價 6.71 至 6.77 美元。金額不大，但方向與時點值得記一筆——在殖利率創高、商業發展公司折價擴大的當下買進。風險與反方論點：67,450 美元對一位董事而言是象徵性部位，訊號強度有限；成長期放款在高利率環境的違約是遞延顯現的，帳面淨值可能還沒反映；商業發展公司的每股淨值也會因為折價增資而被稀釋。這是研究線索，不是投資建議。", "en": "What Runway Growth Finance (RWAY) does: a business development company lending to growth-stage technology and life-science businesses, small and unloved even within the BDC group. Why it is ignored: BDCs trade on distribution yield rather than asset quality, and RWAY is small and thinly traded, so institutions cannot size positions easily and research coverage is sparse. What is changing: director Edward J. Goldthorpe of BC Partners bought 10,000 shares on September 21 and 22 for roughly $67,450 at $6.71 to $6.77. The dollar amount is small, but the direction and timing are worth recording — buying while yields make new highs and BDC discounts widen. Risks and the bear case: $67,450 is a token position for a director, so signal strength is limited; defaults in growth lending surface with a lag and net asset value may not reflect them yet; and issuing equity below NAV dilutes holders. A research lead, not investment advice.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+September+22,+2026", "stocks": [{"t": "RWAY", "n": "董事 9/21–9/22 買進 10,000 股，約 67,450 美元"}, {"t": "TRIN", "n": "雷達池內的同型商業發展公司，第二季獲利自 6,900 萬升至 8,700 萬美元"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "群聚買進", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報", "zh": "Enovis（ENOV，2026-08-26 入池）做什麼：骨科植入物與復健護具的醫療科技公司，年營收約 23 億美元、約 7,802 名員工。為什麼被忽視：它是 Colfax 分拆後的產物，市場一直用工業集團的框架看它，而植入物與護具兩塊事業的資本報酬率差很多，合併報表把訊號蓋掉了。什麼正在改變：出現了內部人群聚買進——執行長暨董事 Damien McDonald 在 9/4 買進 13,035 股、約 249,620 美元，成交價 19.10 至 19.16 美元；行政長 Oliver Engert 在 9/2 與 9/3 買進 7,598 股。買進時股價約 18.56 美元，貼著 52 週低點 18.52 美元，而且是在前一週重挫 25% 之後。風險與反方論點：一週跌 25% 通常代表指引出了問題，內部人買進不會讓指引變回來；重建手術端受醫院資本支出週期影響；公司槓桿仍高，利率上行對利息費用是實質負擔。這是研究線索，不是投資建議。", "en": "What Enovis (ENOV, added to the pool 2026-08-26) does: a medical technology company in orthopaedic implants and rehabilitation bracing, with roughly $2.3 billion of trailing revenue and about 7,802 employees. Why it is ignored: as a Colfax spin-off it is still framed as an industrial conglomerate, while the implant and bracing businesses earn very different returns on capital that the consolidated statements obscure. What is changing: a genuine insider cluster — CEO and director Damien McDonald bought 13,035 shares on September 4 for about $249,620 at $19.10 to $19.16, and Chief Administrative Officer Oliver Engert bought 7,598 shares on September 2 and 3. The stock was near $18.56 against a 52-week low of $18.52, after falling 25% the prior week. Risks and the bear case: a 25% weekly drop usually means guidance broke, and insider buying does not fix guidance; the reconstruction business follows hospital capital cycles; and leverage remains high, so rising rates are a real interest-expense burden. A research lead, not investment advice.", "url": "https://www.fool.com/coverage/filings/2026/09/14/insider-at-medical-device-maker-buys-more-than-7-500-shares/", "stocks": [{"t": "ENOV", "n": "執行長與行政長 9/2–9/4 群聚買進，股價貼近 52 週低點 18.52 美元"}, {"t": "ZBH", "n": "Zimmer Biomet，骨科植入物的大型對照組"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "執行長進場", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報的帳面價值", "zh": "Redwood Trust（RWT，2026-09-16 入池）做什麼：買進並證券化非機構房貸（高額房貸與投資型房貸）的不動產信託。為什麼被忽視：股價在個位數、市值小，而且它的商業模式要拆成三塊看（Sequoia 證券化、CoreVest 商用、Aspire 新平台），一般篩選器只會看到一檔便宜的抵押型不動產信託。什麼正在改變：執行長暨董事在 9/15 以每股 3.839 美元買進 100,000 股、金額 383,900 美元，當時股價貼近 52 週低點 3.22 美元、過去六個月跌 28%。這是這檔股票近期第三位以上的內部人買進，群聚特徵成立。風險與反方論點：抵押型不動產信託的帳面價值在殖利率飆升時會被直接侵蝕，執行長買進改變不了這件事；30 年期房貸利率若維持 7% 以上，房貸產出量會萎縮；配息的可持續性取決於利差而非成交量。這是研究線索，不是投資建議。", "en": "What Redwood Trust (RWT, added to the pool 2026-09-16) does: a REIT that buys and securitises non-agency mortgages — jumbo and investor loans. Why it is ignored: a single-digit share price and small market cap, plus a model that only makes sense when split into three parts (Sequoia securitisation, CoreVest commercial, the newer Aspire platform); a screen just shows a cheap mortgage REIT. What is changing: the CEO and director bought 100,000 shares on September 15 at $3.839, or $383,900, with the stock near its 52-week low of $3.22 and down 28% over six months. This is at least the third recent insider purchase, so the cluster criterion is met. Risks and the bear case: mortgage REIT book value is eroded directly when yields spike and no amount of CEO buying changes that; if the 30-year mortgage rate stays above 7%, origination volume shrinks; and dividend sustainability depends on spread, not volume. A research lead, not investment advice.", "url": "https://www.everhint.com/insider-trading-signals-september-23-2026-evening-update-last-12-hours-pacific-time/", "stocks": [{"t": "RWT", "n": "執行長 9/15 以 3.839 美元買進 100,000 股，共 383,900 美元"}, {"t": "RITM", "n": "Rithm Capital，同型房貸相關不動產信託，規模大得多"}]},
    {"id": "insider_0", "channel": "內部人動向", "tag": "群聚的定義", "color": "#6DB56D", "zh": "判斷內部人買進，第一個要看的是 Form 4 上的代碼：「P」代表這個人用自己的現金在公開市場按市價買，跟選擇權行權（M）或股票獎酬（A）是完全不同的事，後兩者沒有任何預測力。第二個要看的是有沒有群聚——多位不同職務的內部人在短時間內各自買進，資訊量遠大於單一個人買一次。本週的小型股案例：BullFrog AI（BFRG）執行長買進 44,917 美元、財務長買進 26,425 美元；Duos Technologies（DUOT）執行長也在公開市場買自家股票。", "en": "When reading insider buying, start with the code on the Form 4: a \"P\" means the person paid the market price in the open market with their own cash, which is a completely different event from an option exercise (M) or a stock award (A) — neither of which carries predictive power. Second, look for clustering: several insiders in different roles buying independently within a short window is far more informative than one person buying once. This week's small-cap examples: at BullFrog AI (BFRG) the CEO bought $44,917 and the CFO $26,425, while at Duos Technologies (DUOT) the CEO also bought stock in the open market.", "url": "http://openinsider.com/latest-cluster-buys", "stocks": [{"t": "BFRG", "n": "執行長買進 44,917 美元、財務長 26,425 美元，兩人同期"}, {"t": "DUOT", "n": "微型市值科技公司，執行長公開市場買進自家股"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "身分決定推論", "color": "#6DB56D", "zh": "本週金額最大的兩筆買進要分開解讀。GameStop（GME）執行長在 9/21 加碼約 2,600 萬美元；Group 1 Automotive（GPI）的 Conifer Management 在 9/17 至 9/18 買進約 1,680 萬美元。差別在身分：執行長買的是「我知道公司內部正在發生什麼」，10% 股東兼董事買的是「我認為這個價格便宜」。前者的資訊來源是營運，後者是估值——兩種都值得看，但能推論的方向完全不一樣，混在一起看會得到錯的結論。", "en": "The two largest insider buys of the week need to be read separately. GameStop's (GME) CEO added roughly $26 million on September 21, while Conifer Management bought about $16.8 million of Group 1 Automotive (GPI) on September 17 and 18. The difference is who they are: a CEO is buying on \"I know what is happening inside this company\", while a 10% holder and director is buying on \"I think this price is cheap\". One draws on operating information, the other on valuation — both are worth watching, but they support different inferences, and blending them produces the wrong conclusion.", "url": "https://www.investing.com/news/stock-market-news/mondays-insider-activity-gamestop-ceo-adds-26m-stake-93CH-4910912", "stocks": [{"t": "GME", "n": "執行長 9/21 加碼約 2,600 萬美元，屬於營運端的內部人"}, {"t": "GPI", "n": "Conifer Management 9/17–9/18 買進約 1,680 萬美元，屬於估值端的財務投資人"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "判讀提醒", "color": "#6DB56D", "zh": "這週的內部人買進有一個共同特徵：幾乎都發生在 52 週低點附近。這正是最容易誤判的情境。內部人也會看錯，尤其在股價已經反映了他們自己還沒承認的基本面惡化時；學術研究一致的結論是，內部人買進的超額報酬要到數月後才顯現，而且高度集中在小型股與群聚買進的樣本裡。單一內部人、在新低買、沒有第二個訊號佐證，就只是一個值得記下來的線索，不是一個論點。", "en": "This week's insider purchases share one feature: almost all of them happened near 52-week lows — precisely the setup most likely to be misread. Insiders are wrong too, especially when the price already reflects a deterioration they have not yet acknowledged. The consistent academic finding is that abnormal returns to insider buying only appear months later, and are heavily concentrated in small caps and in clustered purchases. A single insider, buying at a new low, with no second signal, is a lead worth writing down — not a thesis.", "url": "https://www.everhint.com/insider-trading-signals-september-23-2026-evening-update-last-12-hours-pacific-time/", "stocks": [{"t": "AFCG", "n": "創辦人買進但本來就是最大股東，邊際資訊量偏低"}, {"t": "KRMN", "n": "單一董事買進，六個月跌 65% 的背景還沒被解釋"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "兩種部位結構", "color": "#B5654D", "zh": "把眾議院近 90 天的申報攤開，最值得注意的不是名字，是兩種完全相反的部位結構。Gilbert Cisneros（CA31）申報 139 筆、其中 108 筆是買進，分散在 118 檔不同標的，金額區間 59.5 萬到 317.5 萬美元，揭露最多的是 COIN、TTD、ACN、AMD——高週轉、極度分散，形狀像是全權委託帳戶在做再平衡，很難從中讀出單一主題。April McClain Delaney（MD06）申報 91 筆但只涉及 33 檔，金額區間 318.6 萬到 841.5 萬美元，揭露最多的是 LTH、HUBB、FWONK、CHRW——筆數少、單筆大、集中度高。同樣叫「國會議員申報買股」，這兩份揭露能推論的東西完全不同。", "en": "Laid out across the last 90 days of House filings, the interesting thing is not the names but two opposite position structures. Gilbert Cisneros (CA31) disclosed 139 transactions, 108 of them purchases, spread across 118 distinct tickers in a $595,000 to $3.18 million range, most frequently COIN, TTD, ACN and AMD — high turnover, extreme diversification, shaped like a managed account rebalancing, with no readable single theme. April McClain Delaney (MD06) disclosed 91 transactions across only 33 tickers in a $3.19 million to $8.42 million range, most frequently LTH, HUBB, FWONK and CHRW — fewer trades, larger tickets, far more concentrated. Both are \"a member of Congress disclosed stock purchases\", and they support entirely different inferences.", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure", "stocks": [{"t": "COIN", "n": "Cisneros 揭露次數最多的標的之一，加密交易所"}, {"t": "TTD", "n": "The Trade Desk，同屬 Cisneros 高頻分散名單中的廣告科技"}, {"t": "HUBB", "n": "Hubbell，Delaney 集中型名單中的電力設備商"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "為何不是訊號", "color": "#B5654D", "zh": "這個頻道每天都要重述的四件事。第一，STOCK Act 給的是 45 天申報期，你今天看到的是最多六週前的交易，跟單者買到的永遠是別人的舊價位。第二，揭露只有金額區間（1,001 至 15,000、15,001 至 50,000 這種級距）沒有實際數字，所以任何「某人買了 X 元」的標題都是用中位數估出來的。第三，很多交易由配偶帳戶或全權委託信託執行，申報人本人未必事前知情。第四，如果申報的是選擇權，履約價與到期日才是真正的資訊量——它告訴你這筆錢在賭多大的幅度、多長的時間，而這兩個數字在大部分報導裡都被略過。", "en": "Four things this channel has to restate every day. First, the STOCK Act allows 45 days to file, so what you see today is a trade up to six weeks old and anyone following it is buying at someone else's old price. Second, disclosures give only dollar bands ($1,001-$15,000, $15,001-$50,000 and so on), never actual amounts, so every \"member X bought $Y\" headline is a midpoint estimate. Third, many trades are executed in a spouse's account or a blind trust, and the filer may not have known in advance. Fourth, when the filing is an option, the strike and expiry are the real information — they tell you how large a move and how long a horizon the money is betting on, and both are usually omitted from coverage.", "url": "https://capitolmarkets.org/research/congress-stock-trading", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報持股的 ETF，本身就內建 45 天延遲"}, {"t": "GOP", "n": "追蹤共和黨籍議員申報持股的 ETF，對照組"}]},
    {"id": "week_0", "channel": "本週事件", "tag": "總經行事曆", "color": "#C97DD4", "zh": "下週（9/28 至 10/2）是月底與季底的交接週，數據密集。9/29 有成屋待完成銷售與達拉斯聯準製造業指數；9/30 是重頭戲，PCE 物價指數、JOLTS 職缺、芝加哥採購經理人指數、諮商會消費者信心與 FHFA 房價指數同日發布；10/1 是 ISM 製造業、ADP 就業與營建支出；10/2 公布九月非農就業報告。在「還要升幾碼」是主要辯論的當下，PCE 與非農這兩份數據直接決定 12 月會議的定價。", "en": "Next week (September 28 to October 2) straddles month-end and quarter-end and is data-heavy. September 29 brings pending home sales and the Dallas Fed manufacturing index. September 30 is the main event: the PCE price index, JOLTS openings, Chicago PMI, Conference Board consumer confidence and the FHFA house price index all land the same day. October 1 has ISM manufacturing, ADP employment and construction spending, and October 2 delivers the September jobs report. With the debate now about how many more hikes, PCE and payrolls set the pricing for the December meeting directly.", "url": "https://www.litefinance.org/blog/analysts-opinions/weekly-economic-calendar-for-28092026-04102026/", "stocks": [{"t": "UUP", "n": "美元指數 ETF，PCE 與非農是本週唯二能改變利率路徑的變數"}, {"t": "GLD", "n": "黃金 ETF，實質利率上升與地緣避險兩股力量在它身上對撞"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "財報行事曆", "color": "#C97DD4", "zh": "下週財報的主角是記憶體。美光（MU）9/30 盤後公布 FY2026 第四季，這是 AI 資本支出是否仍在加速的最直接讀數。同日還有 Jabil（JBL）的 FQ4，市場預估每股 4.07 美元、營收 97 億美元；以及 FactSet（FDS）的 FQ4，預估每股 4.35 美元、營收 6.298 億美元。消費端看 9/29：CarMax（KMX）FQ2 預估每股 0.72 美元、營收 70 億美元，嘉年華郵輪 Q3 預估每股 1.35 美元、營收 84 億美元，去年同期是 1.43 美元——燃油成本上升是這份財報最被盯的一行。", "en": "Memory is the headline act next week. Micron (MU) reports fiscal Q4 2026 after the close on September 30, the most direct read on whether AI capital spending is still accelerating. The same day brings Jabil's (JBL) fiscal Q4, with consensus at $4.07 per share on $9.7 billion of revenue, and FactSet's (FDS) fiscal Q4, expected at $4.35 per share on $629.8 million. On the consumer side, September 29 has CarMax (KMX) fiscal Q2 at an estimated $0.72 per share on $7.0 billion, and Carnival's Q3 at $1.35 per share on $8.4 billion, down from $1.43 a year ago — with rising fuel cost the single line everyone will read first.", "url": "https://www.gurufocus.com/news/8919682/upcoming-earnings-reports-jabil-jbl-carmax-kmx-progressive-corporation-pgr", "stocks": [{"t": "MU", "n": "9/30 盤後 FQ4，AI 資本支出是否仍在加速的最直接讀數"}, {"t": "JBL", "n": "9/30 FQ4，市場預估每股 4.07 美元、營收 97 億美元"}, {"t": "KMX", "n": "9/29 FQ2，預估每股 0.72 美元、營收 70 億美元"}, {"t": "FDS", "n": "9/30 FQ4，預估每股 4.35 美元、營收 6.298 億美元"}]},
    {"id": "eval_0", "channel": "今日評估", "tag": "今日評估", "color": "#E8A838", "status": "翻到最後一張可以按討論鍵，把今天的重點直接帶進對話", "zh": "今天最值得注意的一件事：30 年期公債殖利率 5.43%，創 2004 年以來新高，而且上升速度快過 10 年期。這代表市場定價的已經不只是「聯準會再升一碼」這種循環性的事，而是更長期的通膨中樞與財政供給風險。如果長端就停在這裡，過去十五年所有「低利率環境下才成立」的配置邏輯——高本益比成長股、高槓桿不動產信託、用高股息股當債券替代品、以及小型股靠便宜浮動利率負債擴張——都需要重新算一次。今天的問題：你手上的部位，如果把「利率會在 12 個月內回到 4% 以下」這個假設拿掉，哪一個會最先站不住？", "en": "The one thing worth noting today: the 30-year Treasury yield at 5.43%, a new high since 2004, rising faster than the 10-year. That prices in more than one more cyclical Fed hike — it prices in a higher long-run inflation anchor and fiscal supply risk. If the long end simply stays here, every allocation logic that only worked in a low-rate world over the past fifteen years needs recomputing: high-multiple growth, levered REITs, dividend stocks used as bond substitutes, and small caps expanding on cheap floating-rate debt. Today's question: across your current positions, if you remove the assumption that rates return below 4% within twelve months, which one breaks first?", "url": "https://www.nbcnews.com/business/energy/treasury-yields-oil-stocks-rcna599398", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，長期通膨中樞是否上移的直接對照"}, {"t": "MU", "n": "9/30 財報，是驗證「AI 資本支出能不能扛住 5% 利率」的第一個實證"}]},
];

const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();
const lsKeyFor = (sub) => "mosfeed_" + BRIEF_ID + "_" + sub;

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/25/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v12.2</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
