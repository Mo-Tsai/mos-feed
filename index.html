/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;
    --text-tertiary: #6b6863; --divider: #ddd9d1;
    --noise-opacity: 0.035;

  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }

    0% { opacity: 0; }
    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }

  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }

  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }

  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }
  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }
  .source-link { position: relative; display: inline-block; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }

  .az-input { width:100%; background:var(--bg); border:1px solid var(--divider); color:var(--text); padding:9px 10px; font-family:'Courier New',monospace; font-size:12px; outline:none; -webkit-appearance:none; appearance:none; border-radius:0; }

  .nav-btn { background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:16px; cursor:pointer; padding:10px 18px; min-height:44px; min-width:40px; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; line-height:1; }
  .nav-btn-icon { padding:10px 14px; font-size:14px; }

  {"id": "earn_0", "channel": "財報速報", "tag": "CrowdStrike 買 Zscaler", "color": "#E8786A", "zh": "網路資安出現大併購：CrowdStrike（CRWD）宣布以約 439 億美元全股票收購 Zscaler（ZS），合併後 CrowdStrike 股東約持有 84.1%。市場反應分歧：Zscaler 週一漲約 13% 至 18%（不同來源數字不同），CrowdStrike 跌約 8% 至 9%，是典型的收購方折價、被收購方溢價。這則消息發生在大盤普漲的一天，所以 CrowdStrike 的下跌更值得注意：市場在替整合風險與全股票稀釋定價。", "en": "A big cybersecurity deal: CrowdStrike (CRWD) said it will buy Zscaler (ZS) in an all-stock transaction valued at about $43.9 billion, leaving CrowdStrike holders with roughly 84.1% of the combined company. The reaction was split: Zscaler rose about 13% to 18% (sources differ) while CrowdStrike fell about 8% to 9%, the classic acquirer discount and target premium. It happened on a day when the whole market rallied, so CrowdStrike's drop stands out: investors are pricing integration risk and the dilution from an all-stock deal.", "url": "https://www.cnbc.com/2026/11/22/stock-market-today-live-updates.html", "stocks": [{"t": "CRWD", "n": "收購方，週一約 -8% 至 -9%"}, {"t": "ZS", "n": "被收購方，週一約 +13% 至 +18%"}]},
  {"id": "earn_1", "channel": "財報速報", "tag": "Dell、HPE 財報前", "color": "#E8786A", "zh": "兩檔 AI 伺服器股在財報前先大漲：247 Wall St. 的名單顯示 Dell 週一約 +20.5%、HPE 約 +17.4%（盤中時間點未標示，數字請與行情軟體核對）。HPE 於週一盤後公布財報，CNBC 提到它本月已跌約 25%；Dell 週二盤後公布，本月已跌約 34%。我沒有查到 HPE 的實際財報結果與盤後反應，所以只能說：兩家都是在大幅回檔後被一口氣拉回，財報成為下一個檢驗。", "en": "Two AI-server stocks jumped ahead of their reports: 247 Wall St.'s list shows Dell up about 20.5% and HPE about 17.4% on Monday (the intraday timing is not labeled, so check a terminal). HPE reported after the bell on Monday; CNBC notes it had fallen about 25% this month, while Dell reports Tuesday after the close after a roughly 34% drop in November. I could not find HPE's actual results or its after-hours reaction, so all that can be said is that both were pulled up sharply after deep declines, and earnings are the next test.", "url": "https://247wallst.com/investing/2026/11/23/stock-market-today-dow-sp-500-and-nasdaq-surge-as-nvidia-leads-a-major-ai-rebound/", "stocks": [{"t": "DELL", "n": "週一約 +20.5%，週二盤後公布財報"}, {"t": "HPE", "n": "週一約 +17.4%，週一盤後公布財報"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "Oracle 說資金到位", "color": "#E8786A", "zh": "Oracle（ORCL）週一漲約 12%，原因是公司在週五收盤後發聲明，表示與 OpenAI 運算合約的資金已經到位。此前 Oracle 股價已比高點跌近七成，市場主要擔心它的 AI 資料中心債務與資金來源。CoreWeave（CRWV）同日漲約 22%；美聯社與 CNBC 都提到，高殖利率讓 AI 基建的借款更困難，所以「資金有著落」本身就是題材。聲明不等於財報，後續仍要看負債與現金流的實際數字。", "en": "Oracle (ORCL) rose about 12% on Monday after a statement issued following Friday's close said funding is in place for its OpenAI compute deal. Its stock had fallen nearly 70% from its peak on worries about AI data-center debt and funding. CoreWeave (CRWV) gained about 22% the same day; both the AP and CNBC note that high yields make AI build-out borrowing harder, so 'funding secured' is itself the story. A statement is not an earnings report, and debt and cash flow still need to be checked.", "url": "https://247wallst.com/investing/2026/11/23/stock-market-today-dow-sp-500-and-nasdaq-surge-as-nvidia-leads-a-major-ai-rebound/", "stocks": [{"t": "ORCL", "n": "週一約 +12%，稱 OpenAI 合約資金到位"}, {"t": "CRWV", "n": "週一約 +22%，新興雲端業者，融資敏感"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "PMI 降溫", "color": "#7C6AF7", "zh": "標普全球的 11 月 PMI 初值顯示景氣仍擴張但降溫：製造業 53.7（10 月 54.5，為三個月低點）、服務業 54.7（10 月 56.1，為四個月低點）。市場原本預期製造業約 54.5、服務業約 55.6，所以兩項都略低於預期。在升息預期尚未退場的情況下，數據降溫可以讀成「通膨壓力減輕」，也可以讀成「需求在走弱」，要看週三的 PCE 與 GDP 才分得出來。", "en": "S&P Global's flash November PMIs show activity still expanding but cooling: manufacturing 53.7 (October 54.5, a three-month low) and services 54.7 (October 56.1, a four-month low). Forecasts were about 54.5 and 55.6, so both came in a little light. With rate-hike expectations still alive, cooler data can be read as easing inflation pressure or as weakening demand, and Wednesday's PCE and GDP are needed to tell which.", "url": "https://www.cnbc.com/2026/11/22/stock-market-today-live-updates.html", "stocks": [{"t": "SPY", "n": "大盤，PMI 數據降溫但仍在 50 以上"}, {"t": "TLT", "n": "長天期美債，殖利率 4.93%"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "威廉斯演講", "color": "#7C6AF7", "zh": "紐約聯準銀行總裁威廉斯（Williams）週一下午 4:00 發表貨幣政策展望談話，heygotrade 的週報提到市場想從中找 12 月決策的線索，核心 PCE 若偏熱可能再添升息擔憂。我在本次可讀的頁面中沒有查到威廉斯談話的實際內容，也沒查到 CME FedWatch 的升息機率，因此不寫機率數字；先前的紀錄是下次 FOMC 會議在 12/9。這一則先當成「待核對事項」，請回到 Fed 官網或 FedWatch 看實際內容。", "en": "New York Fed President John Williams spoke on monetary policy at 4:00 p.m. Monday, and the heygotrade weekly says markets were looking for clues on the December decision, with a hot core PCE potentially adding to worries about more hikes. I could not find the content of his remarks or CME FedWatch hike odds in the pages I could read, so I am not quoting a probability; the next FOMC meeting was earlier noted as Dec. 9. Treat this as an item to verify against the Fed's site or FedWatch.", "url": "https://www.heygotrade.com/en/news/weekly-economic-outlook-2026-11-23/", "stocks": [{"t": "XLF", "n": "金融類股 ETF，利率路徑敏感"}, {"t": "KRE", "n": "區域銀行 ETF，對升息預期敏感"}, {"t": "IEF", "n": "7 至 10 年期美債 ETF"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "川普：中國買波音", "color": "#7C6AF7", "zh": "貿易與地緣訊號同時出現：川普表示中國將再買 250 架波音飛機，波音（BA）週一漲逾 4%；另外 Coterra（CTRA）下跌約 8.6%，與布蘭特原油下跌 3.6% 一致。美聯社提到，2 月美以攻擊伊朗後布蘭特一路在 72 至 114 美元之間，目前 86.68 美元算中段。這類消息多來自川普的公開說法，簽約與交機時程要等公司或中方確認再看。", "en": "Trade and geopolitics both showed up: President Trump said China would buy 250 more Boeing jets, and Boeing (BA) rose more than 4% on Monday; separately Coterra (CTRA) fell about 8.6%, in line with Brent's 3.6% drop. The AP notes Brent has ranged between $72 and $114 since the US and Israel attacked Iran in February, so $86.68 is mid-range. Such news largely comes from the President's own statements, and contract and delivery timing should be confirmed by the companies or Beijing.", "url": "https://www.cnbc.com/2026/11/22/stock-market-today-live-updates.html", "stocks": [{"t": "BA", "n": "週一漲逾 4%，因川普稱中國將再買 250 架"}, {"t": "CTRA", "n": "週一約 -8.6%，油價走弱"}, {"t": "USO", "n": "原油 ETF，布蘭特 -3.6%"}, {"t": "XLE", "n": "能源類股 ETF"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "半導體領漲", "color": "#4EABA4", "zh": "板塊中最強的是半導體：VanEck 半導體 ETF（SMH）盤中漲逾 16%，已接近 2025 年 4 月 9 日漲 17.16% 的最大單日紀錄；科技類股 ETF（XLK）漲逾 10%，也追近同日的 13.43%。記憶體是最亮的一塊，美光漲約 19%。極端的單日漲幅常常出現在極端的單週下跌之後，所以先把它看成「超賣修復」而不是新趨勢。", "en": "The strongest sector was semiconductors: the VanEck Semiconductor ETF (SMH) was up more than 16% at one point, near its record one-day gain of 17.16% on April 9, 2025, and the technology sector ETF (XLK) rose more than 10% versus 13.43% that day. Memory was the brightest spot, with Micron up about 19%. Extreme one-day gains often follow extreme weekly losses, so treat this first as an oversold repair, not a new trend.", "url": "https://www.cnbc.com/2026/11/22/stock-market-today-live-updates.html", "stocks": [{"t": "SMH", "n": "半導體 ETF，盤中漲逾 16%"}, {"t": "XLK", "n": "科技類股 ETF，漲逾 10%"}, {"t": "DRAM", "n": "記憶體 ETF，漲逾 19%"}, {"t": "MU", "n": "美光，約 +19%"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "工業與電力設備", "color": "#4EABA4", "zh": "工業與電力設備跟著反彈：GE Vernova（GEV）漲約 8.2%、Caterpillar（CAT）漲約 7.2%，兩者在前一週分別跌近 13% 與 15%。這兩檔的邏輯和 AI 資料中心的電力需求有關，所以會跟著 AI 情緒一起大跌大漲。波音則因川普稱中國將再買 250 架而漲逾 4%，屬於另一條獨立的題材。", "en": "Industrials and power equipment rebounded: GE Vernova (GEV) rose about 8.2% and Caterpillar (CAT) about 7.2%, after falling nearly 13% and 15% the previous week. Both are tied to power demand from AI data centers, so they swing with AI sentiment. Boeing rose more than 4% on Trump's claim that China will buy 250 more jets, a separate story.", "url": "https://www.whec.com/ap-top-news/us-stocks-soar-and-recover-more-than-half-of-last-weeks-plunge-after-jensen-huang-returns-to-nvidia/", "stocks": [{"t": "GEV", "n": "約 +8.2%，上週約 -13%"}, {"t": "CAT", "n": "約 +7.2%，上週約 -15%"}, {"t": "BA", "n": "約 +4%，另有中國訂單題材"}, {"t": "XLI", "n": "工業類股 ETF"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "金銀銅礦業", "color": "#4EABA4", "zh": "貴金屬與基本金屬一起走高：金價約 +4%、銀約 +5%、銅約 +3%，Newmont（NEM）等礦業股受惠。股市與黃金同日大漲，表示當天的買盤不是單純的避險，而是風險偏好回升加上實質利率預期的調整。我沒有查到黃金現貨價格，只引用期貨漲幅；礦業股的後續要看 11/25 的 PCE 與美元走勢。", "en": "Precious and base metals rose together: gold about 4%, silver about 5% and copper about 3%, helping miners such as Newmont (NEM). Stocks and gold both surging on the same day suggests buying was not just a flight to safety but also a pickup in risk appetite and a shift in real-rate expectations. I did not find a spot gold price and only cite futures moves; follow-through depends on Wednesday's PCE and the dollar.", "url": "https://www.cnbc.com/2026/11/22/stock-market-today-live-updates.html", "stocks": [{"t": "GDX", "n": "金礦業 ETF"}, {"t": "NEM", "n": "Newmont，隨金價走高"}, {"t": "COPX", "n": "銅礦業 ETF，銅約 +3%"}, {"t": "GLD", "n": "黃金 ETF，期貨約 +4%"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "判讀：沒有收盤價", "color": "#5B8ED6", "zh": "這則是判讀，不是行情。週一我沒有查到羅素 2000 的確切收盤：247 Wall St. 盤前表中追蹤它的 ETF 約 +3%，頁首有一個 2,673.97（+3.05%）的數字但沒有時間戳記，所以只能當未確認。判讀小型股反彈要分開看：一是大型科技修復帶動的風險偏好，二是小型股自己的利率敏感度（多數公司舉債是浮動利率）。後者要等 PCE 與 12 月 FOMC 才會明朗。", "en": "This is a reading note, not a market report. I could not find an exact Russell 2000 close for Monday: 247 Wall St.'s premarket table shows a tracking ETF up about 3%, and a header figure of 2,673.97 (+3.05%) carries no timestamp, so treat it as unconfirmed. Read a small-cap bounce in two parts: risk appetite lifted by the large-cap tech repair, and small caps' own rate sensitivity (most carry floating-rate debt). The latter becomes clearer after PCE and the December FOMC.", "url": "https://247wallst.com/investing/2026/11/23/stock-market-today-dow-sp-500-and-nasdaq-surge-as-nvidia-leads-a-major-ai-rebound/", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，盤前約 +3%（未確認收盤）"}, {"t": "VTWO", "n": "羅素 2000 ETF（另一檔）"}, {"t": "IJR", "n": "標普小型 600 ETF，不同編製的對照"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "比特幣礦工反彈", "color": "#5B8ED6", "zh": "比特幣相關股在盤前先反彈：Mara（MARA）漲約 7.6%、Strategy（MSTR）漲約 8.5%，CNBC 說比特幣正試圖收復上週的大幅虧損。這類公司的股價等於把比特幣價格加上槓桿，漲跌幅通常比幣價本身大；Mara 屬中型股、波動大。我沒有查到比特幣的確切價格，因此只能寫方向，不寫數字。", "en": "Bitcoin-linked stocks bounced in premarket trading: Mara (MARA) rose about 7.6% and Strategy (MSTR) about 8.5%, with CNBC saying bitcoin was trying to recover steep losses from last week. These stocks are effectively leveraged bets on bitcoin, so their moves tend to exceed the coin's; Mara is a mid-cap with high volatility. I did not find an exact bitcoin price, so I can give direction but no figure.", "url": "https://www.cnbc.com/2026/11/22/stock-market-today-live-updates.html", "stocks": [{"t": "MARA", "n": "盤前約 +7.6%，比特幣礦工"}, {"t": "MSTR", "n": "盤前約 +8.5%，持有大量比特幣的公司"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "區域銀行升評", "color": "#5B8ED6", "zh": "Baird 把 Citizens Financial（CFG）與 Truist（TFC）調升為優於大盤，兩檔盤前都漲逾 2%；它們屬於中型或偏大型的區域銀行，是小型股池子之外、與利率路徑關係最深的族群。升評的時間點落在升息預期仍高的時候，值得觀察是否會被 PCE 反轉。我沒有查到 Baird 的目標價或理由，這則只能提供事實，不能推論它的邏輯。", "en": "Baird upgraded Citizens Financial (CFG) and Truist (TFC) to outperform, and both rose more than 2% in premarket trading. They are mid-to-large regional banks, outside the small-cap pool but closely tied to the rate path. The upgrades came while hike expectations remain elevated, and it is worth watching whether PCE reverses them. I did not find Baird's targets or reasoning, so this card gives the fact but not the logic.", "url": "https://www.cnbc.com/2026/11/22/stock-market-today-live-updates.html", "stocks": [{"t": "CFG", "n": "Baird 調升為優於大盤，盤前漲逾 2%"}, {"t": "TFC", "n": "Baird 調升為優於大盤，盤前漲逾 2%"}, {"t": "KRE", "n": "區域銀行 ETF"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "國際紙業分拆", "color": "#5B8ED6", "zh": "International Paper（IP）週一下跌約 4% 至 4.5%，原因是董事會核准把歐洲、中東與非洲的包裝業務（來自 DS Smith）分拆出去。分拆通常是為了讓兩個部分被各自估值，但短期會有一次性成本與投資人換股壓力。這屬於中型股的「結構性事件」，要等分拆時程、債務分配與新公司的獨立財報才能判斷價值。", "en": "International Paper (IP) fell about 4% to 4.5% on Monday after its board approved spinning off its EMEA packaging business, which came with the DS Smith acquisition. Spinoffs aim to let two parts be valued separately, but near-term there are one-time costs and shareholder churn. This is a mid-cap structural event, and its value depends on the timetable, debt allocation and the new company's standalone financials.", "url": "https://www.cnbc.com/2026/11/22/stock-market-today-live-updates.html", "stocks": [{"t": "IP", "n": "週一約 -4% 至 -4.5%，核准分拆 EMEA 包裝業務"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "逆風的個股", "color": "#5B8ED6", "zh": "大漲日也有逆行者：Elevance Health（ELV）約 -3.8%、Texas Pacific Land（TPL）約 -3.5%、Coterra（CTRA）約 -8.6%；Anthropic（ANT）的消息互相矛盾，CNBC 說午後約 -3%，247 說盤前約 +4%，報價框顯示 87.64 美元（-1.43%），所以不能下定論。把這些個股放在一起看，是為了提醒：大盤漲 4.7% 的日子仍有一批股票沒有跟上。", "en": "Even on a big up day some stocks went the other way: Elevance Health (ELV) about -3.8%, Texas Pacific Land (TPL) about -3.5% and Coterra (CTRA) about -8.6%. Reports on Anthropic (ANT) conflict: CNBC says it was down about 3% in the afternoon, 247 says it was up about 4% premarket, and its quote box shows $87.64 (-1.43%), so no conclusion can be drawn. The point of grouping them is that a 4.7% market gain still left a number of stocks behind.", "url": "https://247wallst.com/investing/2026/11/23/stock-market-today-dow-sp-500-and-nasdaq-surge-as-nvidia-leads-a-major-ai-rebound/", "stocks": [{"t": "ANT", "n": "各來源矛盾：CNBC 約 -3%、247 盤前約 +4%"}, {"t": "ELV", "n": "約 -3.8%"}, {"t": "TPL", "n": "約 -3.5%"}, {"t": "CTRA", "n": "約 -8.6%"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "Solaris 四人買進", "color": "#C9A227", "zh": "Solaris Energy Infrastructure（SEI，NYSE）：做模組化發電、配電設備，賣給資料中心與能源客戶，另有油田物流事業。InsiderPrint 顯示 4 名內部人在 11/9 至 11/20 合計買進約 74.8 萬美元，包括執行長 Amanda Brock 約 26.9 萬、董事長 Zartler 約 21.2 萬，均價約 54.37 美元。什麼正在改變：Q3（11/5 公布）調高財測並新增電力合約，逐字稿提到一份 900 MW、15 年期合約與逾 160 億美元積壓訂單；2025 年營收年增約 99%。為什麼被忽視：其實不算被忽視，有 14 位分析師、共識偏強烈買進、目標價約 107.77 美元，股價 61.23 美元，距 52 週區間 40.38 至 86.19 的上緣不遠也不近；所以它是「內部人加碼」而不是「雙重忽視」。風險：9 月發了 12.5 億美元 7% 利率的高級債券，債務與資料中心景氣是關鍵。這是研究線索，不是投資建議。", "en": "Solaris Energy Infrastructure (SEI, NYSE) makes modular power generation and distribution equipment for data centers and energy customers, plus oilfield logistics. InsiderPrint shows four insiders bought about $748,000 between Nov. 9 and Nov. 20, including CEO Amanda Brock (about $269,000) and chair Zartler (about $212,000), at an average of about $54.37. What is changing: Q3 results (Nov. 5) raised guidance and added power contracts, with the transcript citing a 900 MW, 15-year contract and more than $16 billion of backlog; 2025 revenue rose about 99%. Why neglected: it is not really neglected, with 14 analysts, a strong-buy consensus and a $107.77 average target, so this is insider buying rather than a double-neglect case; the stock is $61.23 against a 52-week range of $40.38-$86.19. Risk: a $1.25 billion 7% senior note issue in September, so debt and data-center demand matter. This is a research lead, not investment advice.", "url": "https://buttondown.com/insiderprint/archive/u1f514-4-new-cluster-buys-sei-crmd-ctgo-arr/", "stocks": [{"t": "SEI", "n": "4 人買進約 74.8 萬美元，均價約 54.37；收盤 61.23"}], "status": "RADAR · 下一個驗證點 讀 Form 4 與下次財報"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "Contango 三人買進", "color": "#C9A227", "zh": "Contango Silver & Gold（CTGO，NYSE American）：阿拉斯加與加拿大黃金三角區的金銀探勘與生產公司，3 月由 Contango Ore 改名，只有約 6 名員工。InsiderPrint 顯示 3 名內部人在 11/17 至 11/19 合計買進約 47.3 萬美元（董事 Juneau 約 29.6 萬、執行長 Van Nieuwenhuyse 約 10.1 萬），均價約 10.56 美元。什麼正在改變：11/18 公布 Lucky Shot 鑽探結果 3.92 公尺含金 62.97 g/t；逐字稿說 2026 年是低產量、高成本的一年，但沒有增資計畫，2027 年有資源量估算與可行性研究。股價 9.98 美元，接近 52 週低點 9.37（高點 34.38）。風險：近 12 個月虧損約 5,655 萬美元、還沒有營收數字；7 位分析師共識買進、目標價 28.33 美元只是參考。這是研究線索，不是投資建議。", "en": "Contango Silver & Gold (CTGO, NYSE American) explores and produces gold and silver in Alaska and British Columbia's Golden Triangle; it was renamed from Contango Ore in March and has about six employees. InsiderPrint shows three insiders bought about $473,000 between Nov. 17 and Nov. 19 (director Juneau about $296,000, CEO Van Nieuwenhuyse about $101,000) at an average of about $10.56. What is changing: a Nov. 18 drill result of 62.97 g/t gold over 3.92 m at Lucky Shot; the transcript calls 2026 a low-production, high-cost year but says no equity raise is planned, with a resource estimate and feasibility study planned for 2027. The stock is $9.98, near its 52-week low of $9.37 (high $34.38). Risk: a trailing net loss of about $56.6 million and no revenue figure shown; seven analysts rate it a buy with a $28.33 target, which is only a reference. This is a research lead, not investment advice.", "url": "https://buttondown.com/insiderprint/archive/u1f514-4-new-cluster-buys-sei-crmd-ctgo-arr/", "stocks": [{"t": "CTGO", "n": "3 人買進約 47.3 萬美元，均價約 10.56；收盤 9.98 近 52 週低點"}], "status": "RADAR · 下一個驗證點 2027 年 Q2 資源量估算"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "PicPay 董事加碼", "color": "#C9A227", "zh": "PicS N.V.（PICS，Nasdaq）即 PicPay：巴西數位錢包與金融服務業者，主打 Pix 即時支付、個人貸款與分期，2026/1/29 上市。InsiderPrint 顯示 3 名董事在 11/18 至 11/19 合計買進約 55.7 萬美元，均價約 4.84 美元。什麼正在改變：Q3（11/16 公布）公司稱超過財測，營收年增 73%（不含 Kev 的貢獻）、信貸年增 88%；但 Q4 因無擔保貸款沖銷政策改變，會有約 3.25 億雷亞爾的一次性費用。為什麼被忽視：股價 5.21 美元，接近 52 週低點 4.48（高點 19.95）；Mizuho 與 RBC 在 Q3 後把目標價自 16 美元降到 8 與 9 美元，另有與 IPO 相關的集體訴訟通知。風險：信貸品質、巴西利率、官司。這是研究線索，不是投資建議。", "en": "PicS N.V. (PICS, Nasdaq), or PicPay, is a Brazilian digital wallet and financial-services company built around Pix instant payments, personal loans and installments; it listed on Jan. 29, 2026. InsiderPrint shows three directors bought about $557,000 on Nov. 18-19 at an average of about $4.84. What is changing: Q3 results (Nov. 16) exceeded guidance by the company's account, with revenue up 73% year over year excluding Kev and credit up 88%; a policy change on unsecured-loan write-offs will bring a one-time charge of roughly BRL 325 million in Q4. Why neglected: the stock is $5.21, near its 52-week low of $4.48 (high $19.95); Mizuho and RBC cut targets from $16 to $8 and $9 after Q3, and IPO-related class-action notices exist. Risk: credit quality, Brazilian rates and litigation. This is a research lead, not investment advice.", "url": "https://buttondown.com/insiderprint/archive/u1f514-cluster-buy-alert-pics-3-insiders-bought/", "stocks": [{"t": "PICS", "n": "3 名董事買進約 55.7 萬美元，均價約 4.84；收盤 5.21"}], "status": "RADAR · 下一個驗證點 Q4 沖銷費用與信貸品質"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "CorMedix 回鍋", "color": "#C9A227", "zh": "CorMedix（CRMD，Nasdaq；雷達池 9/2 入池）：主力是 DefenCath（腎衰竭病患的導管封管溶液），另有 Rezzayo。InsiderPrint 顯示 4 名內部人在 11/13 至 11/19 合計買進約 58.8 萬美元，執行長 Todisco 約 39.1 萬；對照提醒：它列出的均價 4.84 美元與 PICS 完全相同，建議回頭核對 Form 4。新動態：Q3（11/12）營收 5,450 萬美元高於共識 5,277 萬、現金 3.552 億美元；同時簽約以 1.45 億美元現金買下 Heron Therapeutics 幾乎全部資產，並稱 2027 年底前有 4,500 萬至 6,000 萬美元年化綜效；Rezzayo 補充申請獲優先審查。股價 5.49 美元，一年下跌約 44.7%，52 週區間 4.47 至 13.02；5 位分析師共識買進，但 Oppenheimer 把目標價自 15 降到 13。風險：整併風險、淨損與藥價。這是研究線索，不是投資建議。", "en": "CorMedix (CRMD, Nasdaq; added to the radar pool on Sept. 2) sells DefenCath, a catheter lock solution for kidney-failure patients, plus Rezzayo. InsiderPrint shows four insiders bought about $588,000 between Nov. 13 and Nov. 19, including CEO Todisco (about $391,000); one caution is that the average price listed, $4.84, is identical to PICS's, so check the Form 4s. New developments: Q3 (Nov. 12) revenue of $54.5 million beat the $52.77 million consensus, with $355.2 million of cash; it also agreed to buy substantially all of Heron Therapeutics' assets for $145 million cash and cites $45-$60 million of annualized synergies by the end of 2027; a Rezzayo supplemental application got priority review. The stock is $5.49, down about 44.7% over a year, with a 52-week range of $4.47-$13.02; five analysts rate it a buy, though Oppenheimer cut its target from $15 to $13. Risk: integration, net losses and drug pricing. This is a research lead, not investment advice.", "url": "https://stockanalysis.com/stocks/crmd/", "stocks": [{"t": "CRMD", "n": "4 人買進約 58.8 萬美元；收盤 5.49，Heron 收購 1.45 億美元"}], "status": "RADAR · 下一個驗證點 Heron 交割與 Q4 財報"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "Suncrete 五人買進", "color": "#C9A227", "zh": "Suncrete（RMIX）：InsiderPrint 顯示 5 名內部人在 11/17 至 11/18 合計買進約 110 萬美元，均價約 6.14 美元；其中董事 David Rees-Jones 約 73.1 萬、董事 Ned Fleming 約 23.8 萬，還有營運長約 5 萬。這是這次能查到的唯一訊號：我沒有查到公司的業務細節、分析師家數或財報，所以這張卡只能算「單一訊號，待補第二項證據」。叢集買進的意義在於多名董事同日用自己的錢買，但原因（看好或成本攤平）從 Form 4 看不出來。這是研究線索，不是投資建議。", "en": "Suncrete (RMIX): InsiderPrint shows five insiders bought about $1.1 million between Nov. 17 and Nov. 18 at an average of about $6.14, including director David Rees-Jones (about $731,000), director Ned Fleming (about $238,000) and the COO (about $50,000). This is the only signal I could confirm: I did not find the business details, analyst count or financials, so this card is a single signal awaiting a second piece of evidence. Cluster buying matters because several directors bought on the same days with their own money, but the Form 4s do not say why. This is a research lead, not investment advice.", "url": "https://buttondown.com/insiderprint/archive/u1f514-3-new-cluster-buys-eqpt-rmix-ofrm/", "stocks": [{"t": "RMIX", "n": "5 人買進約 110 萬美元，均價約 6.14"}], "status": "RADAR · 下一個驗證點 查業務與下次財報日"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "Once Upon a Farm", "color": "#C9A227", "zh": "Once Upon a Farm（OFRM）：InsiderPrint 顯示 4 名內部人在 11/16 至 11/17 合計買進約 55.6 萬美元，均價約 10.94 美元；董事 Larry Peiros 約 30.1 萬、其他人約 10.4 萬、10 萬與 5 萬。和 Suncrete 一樣，這次我只查到內部人訊號，沒有核實營收、分析師家數與股價位置，因此是「單一訊號」卡。可跟進的方向是對照它上市後的股價區間與下次財報日。這是研究線索，不是投資建議。", "en": "Once Upon a Farm (OFRM): InsiderPrint shows four insiders bought about $556,000 between Nov. 16 and Nov. 17 at an average of about $10.94, including director Larry Peiros (about $301,000) and others at roughly $104,000, $100,000 and $50,000. As with Suncrete, I could only confirm the insider signal, not revenue, analyst count or where the stock sits in its range, so this is a single-signal card. A useful follow-up is to compare it with its post-listing price range and next earnings date. This is a research lead, not investment advice.", "url": "https://buttondown.com/insiderprint/archive/u1f514-3-new-cluster-buys-eqpt-rmix-ofrm/", "stocks": [{"t": "OFRM", "n": "4 人買進約 55.6 萬美元，均價約 10.94"}], "status": "RADAR · 下一個驗證點 查股價區間與下次財報日"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "Starwood 執行長 1,470 萬", "color": "#6DB56D", "zh": "Starwood Property Trust（STWD）出現這期最大的一筆叢集買進：InsiderPrint 顯示 3 人在 11/11 至 11/16 合計買進約 1,870 萬美元，其中董事長暨執行長 Barry Sternlicht 約 1,470 萬、兩位董事各約 200 萬，均價約 11.80 美元。金額大、而且是同一時段多人買，在 Form 4 的訊號裡屬較強的一種。判讀提醒：這是房地產抵押貸款 REIT，股價與利率路徑緊密相關，買進不等於已經見底；我沒有查證公司的財務與股利狀況。", "en": "Starwood Property Trust (STWD) had the biggest cluster buy in this batch: InsiderPrint shows three insiders bought about $18.7 million between Nov. 11 and Nov. 16, including chairman and CEO Barry Sternlicht (about $14.7 million) and two directors (about $2 million each), at an average of about $11.80. Large size and several insiders buying in the same window is one of the stronger Form 4 signals. Caution: this is a mortgage REIT whose shares track the rate path, and buying does not mean the bottom is in; I did not verify its financials or dividend.", "url": "https://buttondown.com/insiderprint/archive/u1f514-2-new-cluster-buys-stwd-umh/", "stocks": [{"t": "STWD", "n": "3 人買進約 1,870 萬美元，執行長約 1,470 萬，均價約 11.80"}]},
  {"id": "insider_1", "channel": "內部人動向", "tag": "Liberty、MP 大額買進", "color": "#6DB56D", "zh": "兩個大額案例：Liberty Global（LBTYA）在 11/4 至 11/9 有 3 人合計買進約 450 萬美元，包括技術長 Enrique Rodriguez 約 200 萬、10% 持股人 John Malone 約 150 萬、執行長 Fries 約 100 萬，均價約 9.52 美元；MP Materials（MP）在 11/10 至 11/11 有 3 人合計買進約 340 萬美元（董事 Weisenburger 約 200 萬、營運長 Rosenthal 約 120 萬、財務長約 20 萬），均價約 36.26 美元。這兩個案例都有高階主管與大股東或董事同時進場，比單人買進更像「共識」。同樣只是 Form 4 的事實，公司基本面我沒有逐一查證。", "en": "Two large cases: Liberty Global (LBTYA) had three insiders buy about $4.5 million between Nov. 4 and Nov. 9, including CTO Enrique Rodriguez (about $2.0 million), 10% owner John Malone (about $1.5 million) and CEO Fries (about $1.0 million), at an average of about $9.52; MP Materials (MP) had three insiders buy about $3.4 million on Nov. 10-11 (director Weisenburger about $2.0 million, COO Rosenthal about $1.2 million, CFO about $199,000) at an average of about $36.26. Both involve executives together with a large holder or directors, which looks more like consensus than a single buyer. These are Form 4 facts only; I did not check each company's fundamentals.", "url": "https://buttondown.com/insiderprint/archive/u1f514-cluster-buy-alert-lbtya-3-insiders-bought/", "stocks": [{"t": "LBTYA", "n": "3 人買進約 450 萬美元，含 Malone 約 150 萬"}, {"t": "MP", "n": "3 人買進約 340 萬美元，均價約 36.26"}]},
  {"id": "insider_2", "channel": "內部人動向", "tag": "判讀：金額與時間", "color": "#6DB56D", "zh": "判讀這類叢集買進，先看三件事。一是金額相對規模：ARR 的 3 人合計約 9.1 萬美元、ITG 的 5 人合計約 120 萬美元，金額差十倍以上，訊號強度不同；二是時間：ITG 的 5 人全部在 11/13 同一天買進，像是一次協調好的動作，而 ARR 分散在 11/13 至 11/20；三是來源，InsiderPrint 這類整理是第三方，必須回 SEC 的 Form 4 原件核對。昨日的紀錄也提過資料站之間會彼此矛盾，所以每次上卡都附上這句提醒。", "en": "Three checks help when reading cluster buys. First, size relative to the company: ARR's three insiders bought about $91,000 in total while ITG's five bought about $1.2 million, more than ten times as much, so signal strength differs. Second, timing: all five ITG insiders bought on the same day, Nov. 13, which looks coordinated, whereas ARR's buys were spread across Nov. 13-20. Third, source: an aggregator like InsiderPrint is a third party, so always verify against the SEC Form 4s. Data sites have also contradicted each other before, which is why this reminder is repeated.", "url": "https://buttondown.com/insiderprint/archive/u1f514-cluster-buy-alert-itg-5-insiders-bought-12m/", "stocks": [{"t": "ARR", "n": "3 人買進約 9.1 萬美元，分散在 11/13 至 11/20"}, {"t": "ITG", "n": "5 人同日（11/13）買進約 120 萬美元，均價約 5.63"}]},
