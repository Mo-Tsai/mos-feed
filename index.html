/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;
    --text-tertiary: #6b6863; --divider: #ddd9d1;
    --noise-opacity: 0.035;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  /* 鍵盤焦點:看得到目前在哪一顆 */
  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }
  .tab-nav button { background: none; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: Georgia, serif; transition: all 0.3s ease; padding: 0; line-height: 1.2; }

  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }
  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }
  .source-link { position: relative; display: inline-block; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }

  .nav-btn:active { background:var(--bg-elevated); }
  .nav-btn:disabled { opacity:0.3; cursor:default; border-color:var(--divider); color:var(--text-tertiary); }

</style>

  {"id": "earn_0", "channel": "財報速報", "tag": "Sky Harbour", "color": "#E8786A", "zh": "Sky Harbour（SKYH）排定 11/10 盤後公布第三季財報並於美東下午 5 點開電話會議，但我搜尋時還沒找到公布的數字，不確認結果。可參考的背景：今年 Q1 營收年增 56%，Q2 營運面積約 104 萬平方英尺，上一季虧損每股 0.15 美元，預告稿的看點是營收成長能否開始縮小虧損。看到實際數字前請不要當成結論。", "en": "Sky Harbour (SKYH) scheduled its Q3 results and 10-Q for after the close on Nov 10 with a 5 p.m. ET webcast, but I could not find the published numbers, so the result is unconfirmed. Background: Q1 revenue grew 56% year over year, about 1.04 million square feet of hangar space was operating as of Q2, and last quarter's loss was $0.15 a share; the preview focus is whether revenue growth starts to narrow losses. Do not treat this as a conclusion before the actual figures.", "url": "https://finviz.com/news/414620/sky-harbour-must-show-hangar-revenue-growth-can-start-narrowing-its-widening-losses", "stocks": [{"t": "SKYH", "n": "11/10 盤後財報，數字待確認；商務機棚開發商"}], "status": "待確認 · Q3 實際數字與股價反應"},
  {"id": "earn_1", "channel": "財報速報", "tag": "AMD 上週財報", "color": "#E8786A", "zh": "AMD 在 11/3 盤後交出優於預期的營收與獲利，盤後一度漲約 8%；Super Micro 同樣優於預期，Booking 則是每股盈餘優於預期但營收略低。週二 AMD 漲幅約 13%，但我沒有找到當天上漲的明確原因，不能直接說是財報延續；比較保守的說法是市場在財報後持續重新定價 AI 硬體，而且前一天（週一）已先大漲。", "en": "AMD beat on revenue and earnings after the close on Nov 3 and traded up about 8% in extended hours; Super Micro also beat, while Booking beat on earnings but missed on revenue. AMD rose about 13% on Tuesday, but I did not find a stated reason for that day's move, so it cannot be called a straight continuation of earnings. A more cautious reading is that the market keeps repricing AI hardware after the print, after a big rally on Monday.", "url": "https://investinglive.com/stocks/nasdaq-rebounds-as-chip-stocks-rally-and-dow-slips/", "stocks": [{"t": "AMD", "n": "11/3 財報後，週二約 +13%，原因未確認"}, {"t": "SMCI", "n": "11/3 同樣優於預期的 AI 伺服器廠"}, {"t": "BKNG", "n": "EPS 優於預期但營收略低"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "財報分歧", "color": "#E8786A", "zh": "最近公布的幾份財報顯示好壞很不一致：Cricut 營收年增 11%、預期全年成長；Adtran 營收幾乎持平、Q4 指引上緣仍低於共識；Stewart 營收增 13% 但 GAAP 每股盈餘由 1.55 降到 0.98 美元，管理層預期住宅市場到第四季還會走弱。營收成長不等於獲利，指引與一次性項目決定股價的解讀；這些公司公布時間在 10/21 至 11/3 之間。", "en": "Recent reports have been mixed: Cricut grew revenue 11% and expects full-year growth; Adtran was roughly flat with Q4 guidance whose top end is still below consensus; Stewart grew revenue 13% but GAAP EPS fell from $1.55 to $0.98 and management expects the housing market to keep weakening into Q4. Revenue growth is not profit, and guidance and one-offs decide how a print is read; these reports ran from Oct 21 to Nov 3.", "url": "https://www.sec.gov/Archives/edgar/data/0000094344/000110465926117852/tm2628060d1_ex99-1.htm", "stocks": [{"t": "TRTX", "n": "10/27 Q3：配息覆蓋與帳面價值並存"}, {"t": "STC", "n": "營收增但 GAAP EPS 由 1.55 降到 0.98"}, {"t": "ADTN", "n": "營收約持平，Q4 指引偏弱"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "10 月 CPI", "color": "#7C6AF7", "zh": "10 月整體 CPI 月增 0.4%（9 月為 0.6%），核心 CPI 月增 0.3%，高於預期的約 0.2%；細項中住房 +0.3%、食品 +0.5%、能源 +0.7%。核心通膨沒有降溫，讓市場更難相信通膨已被壓住。這是美國勞工統計局公布的資料，與油價在最近兩個交易日回落並不矛盾，因為 CPI 反映的是過去一個月。", "en": "October headline CPI rose 0.4% month over month (September: 0.6%) and core CPI rose 0.3%, above the roughly 0.2% expected; within that, shelter rose 0.3%, food 0.5% and energy 0.7%. Core inflation did not cool, making it harder to argue that inflation is contained. This does not contradict the oil pullback of the last two sessions, because CPI reflects the past month.", "url": "https://coinpaper.com/38618/stock-market-today-s-and-p-500-drops-after-inflation-hits-0-4-and-fed-official-warns-of-bigger-rate-hike", "stocks": [{"t": "TIP", "n": "抗通膨債券 ETF，直接反映通膨預期"}, {"t": "XLE", "n": "能源板塊，能源 CPI +0.7% 的來源之一"}, {"t": "XHB", "n": "房屋建商 ETF，對利率與住房成本敏感"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "Fed 升息預期", "color": "#7C6AF7", "zh": "聯準會理事 Waller 11/10 在倫敦表示支持 12 月升息 25 個基點，但若通膨持續偏高也會考慮更大幅度，這是個人看法，不是 Fed 決議。聯邦基金利率目前在 3.75%–4.00%，Fed 在 10/28 按兵不動、投票 10 比 2；預測市場對 12/9 會議升息的機率約 78%（Kalshi），10 月下旬有文章引用約 85%，各來源時間點不同，請看即時資料。", "en": "Fed Governor Waller said in London on Nov 10 that he favors a 25-basis-point hike in December but would consider a larger move if inflation stays high; this is his personal view, not a Fed decision. The fed funds range is 3.75%–4.00% after the Oct 28 hold on a 10–2 vote. Prediction markets put a hike at the Dec 9 meeting at about 78% (Kalshi), and a late-October article cited about 85%; the sources are from different days, so check live data.", "url": "https://kalshi.com/fed-rate-odds", "stocks": [{"t": "SHY", "n": "短天期公債 ETF，對政策利率預期最敏感"}, {"t": "KRE", "n": "區域銀行 ETF，升息對存放款利差的雙面影響"}, {"t": "TLT", "n": "長天期公債 ETF，殖利率接近 5% 的壓力"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "殖利率逼近 5%", "color": "#7C6AF7", "zh": "10 年期公債殖利率週二由 4.86% 升到約 4.98%，離 5% 只差一點，美元同步轉強。高殖利率對長期現金流估值（成長股）、房貸與住房相關產業壓力最直接；同時也提高企業借款成本，小型股與負債較高的公司更敏感。目前還沒有看到殖利率站上 5% 後的市場反應，下一個觀察點是 12/9 FOMC。", "en": "The 10-year Treasury yield rose from 4.86% to about 4.98% on Tuesday, close to 5%, with the dollar firmer. High yields weigh most directly on long-duration growth valuations, mortgages and housing-related industries, and raise borrowing costs, to which small caps and leveraged companies are more sensitive. I have not seen the market's reaction to a yield above 5% yet; the next checkpoint is the Dec 9 FOMC.", "url": "https://journalarta.com/en/2026/11/11/stock-market-today-sp-500-slips-0-38-to-7520-93-and-nasdaq-falls-0-74-as-10-year-yield-rises-to-4-98/", "stocks": [{"t": "IEF", "n": "7–10 年期公債 ETF，殖利率上升時價格承壓"}, {"t": "XLRE", "n": "不動產板塊，對利率最敏感"}, {"t": "ITB", "n": "房屋建商 ETF，房貸利率上行的壓力"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "半導體 vs 軟體", "color": "#4EABA4", "zh": "週二資金明顯從軟體、電商與廣告科技流向半導體設備與網通：晶片股（AMD、AMAT、AVGO、ANET）大漲，Shopify、AppLovin、Accenture 下跌。可能反映市場更願意為「AI 硬體」付價，對軟體的 AI 獲利路徑較保守；但這是單日觀察，且當天上漲原因多數沒有被來源說明，不能視為趨勢確立。", "en": "On Tuesday money rotated from software, e-commerce and ad-tech into semiconductor equipment and networking: AMD, Applied Materials, Broadcom and Arista surged while Shopify, AppLovin and Accenture fell. This may reflect a willingness to pay for AI hardware while being more cautious on software's AI earnings path, but it is a one-day observation and the sources did not explain most of the moves, so it should not be read as an established trend.", "url": "https://journalarta.com/en/2026/11/11/stock-market-today-sp-500-slips-0-38-to-7520-93-and-nasdaq-falls-0-74-as-10-year-yield-rises-to-4-98/", "stocks": [{"t": "SOXX", "n": "半導體 ETF，當日領漲族群"}, {"t": "AMAT", "n": "半導體設備，11/12 盤後財報前大漲"}, {"t": "ACN", "n": "IT 服務，約 -2.35%，AI 對服務業衝擊的疑慮"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "工業電力", "color": "#4EABA4", "zh": "工業股也強：開拓重工（CAT）約 +7.21%、GE Vernova（GEV）約 +7.13%。這兩檔今年被視為 AI 電力與資料中心基礎設施的受惠者（今年稍早資料顯示兩者年初至今漲幅都在五成以上），但我沒有找到 11/10 當天的明確催化事件，因此只能說資金回到「AI 的實體基礎設施」這個主題，而不能說有新消息。", "en": "Industrials were strong too: Caterpillar rose about 7.21% and GE Vernova about 7.13%. Both have been treated this year as beneficiaries of AI power and data-center infrastructure (earlier-in-the-year reports showed each up more than 50% year to date), but I found no specific catalyst for Nov 10, so the most that can be said is that money returned to the physical-infrastructure side of AI, not that there was new news.", "url": "https://finance.yahoo.com/markets/stocks/articles/industrial-strength-rally-why-caterpillar-184127336.html", "stocks": [{"t": "CAT", "n": "約 +7.21%，AI 電力需求敘事的受惠股"}, {"t": "GEV", "n": "約 +7.13%，燃氣渦輪與電網設備"}, {"t": "XLI", "n": "工業板塊 ETF"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "能源與防禦", "color": "#4EABA4", "zh": "油價連兩日下跌（布蘭特 91.84 美元），11/9 的大跌被歸因於伊朗和平希望；但能源板塊今年仍是最強的一塊（XLE 至 10/23 年初至今約 +51.9%，為過期資料）。10 月下旬的輪動是醫療保健（XLV 當週 +3.12%）領先、通訊服務最弱。這些是週資料，11 月最新板塊排名我沒有找到。", "en": "Oil fell for a second session (Brent $91.84), with Monday's sharp drop attributed to Iran peace hopes, yet energy remains the strongest sector this year (XLE was up about 51.9% year to date as of Oct 23; that data is dated). In late October the rotation favored health care (XLV +3.12% for the week) while communication services lagged. Those are weekly figures and I did not find November sector rankings.", "url": "https://journalarta.com/en/2026/11/09/oil-price-today-brent-falls-4-96-to-93-44-on-iran-peace-hopes-as-gold-climbs/", "stocks": [{"t": "XLE", "n": "能源板塊，年初至今仍領先但近日油價走弱"}, {"t": "XLV", "n": "醫療保健，10 月下旬週漲 +3.12%"}, {"t": "XOP", "n": "油氣探勘生產 ETF，對油價最敏感"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000", "color": "#5B8ED6", "zh": "羅素 2000 週二跌 0.69% 至 2,821.30，跌幅與那斯達克（-0.74%）接近、大於標普（-0.38%），週一則是 +3.15%。小型股對利率最敏感：10 年期殖利率逼近 5%、12 月升息機率偏高時，借款成本較高的公司壓力較大。11/3 收盤為 2,812.45，目前只比一週前高約 0.3%。", "en": "The Russell 2000 fell 0.69% to 2,821.30 on Tuesday, close to the Nasdaq's 0.74% decline and larger than the S&P's 0.38%, after Monday's 3.15% gain. Small caps are the most rate-sensitive: with the 10-year yield near 5% and a December hike likely, companies with higher borrowing costs feel more pressure. The Nov 3 close was 2,812.45, so the index is only about 0.3% above where it was a week ago.", "url": "https://journalarta.com/en/2026/11/11/stock-market-today-sp-500-slips-0-38-to-7520-93-and-nasdaq-falls-0-74-as-10-year-yield-rises-to-4-98/", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF"}, {"t": "IJR", "n": "標普小型股 600 ETF，品質篩選較嚴"}, {"t": "KRE", "n": "區域銀行，小型股裡對利率最敏感的板塊"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "Cricut 財報", "color": "#5B8ED6", "zh": "Cricut（CRCT）第三季營收 1.886 億美元，年增 11%，營業利益 3,390 萬美元（年增 50%），每股盈餘 0.13 美元；公司預期全年營收是 2021 年來首度成長，並核准每股 0.10 美元半年配息、0.70 美元特別股息與最多 5,000 萬美元回購。11/4 股價單日大漲約四到五成（來源報導 38.8% 至 50%，數字不一）。", "en": "Cricut (CRCT) reported Q3 revenue of $188.6 million, up 11%, operating income of $33.9 million (up 50%) and EPS of $0.13; it expects full-year revenue growth for the first time since 2021 and approved a $0.10 semi-annual dividend, a $0.70 special dividend and up to $50 million of buybacks. The stock jumped on Nov 4 (sources say 38.8% to 50%; the figures differ).", "url": "https://www.sec.gov/Archives/edgar/data/0001828962/000182896226000057/cricutq32026earningsrelease.htm", "stocks": [{"t": "CRCT", "n": "Q3 營收 +11%、特別股息 0.70 美元，11/4 股價大漲"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "漲幅怎麼拆", "color": "#5B8ED6", "zh": "小型股一天大漲後，應先拆「一次性因素」。以 Cricut 為例，報導指出毛利改善含有資本化採購成本、處理過剩及過時庫存，以及最後一筆 IEEPA 關稅退款等項目，平台業務成長則連續第三季放緩到 3.7%。這些不代表財報不好，只是說明一次性利潤不一定會在下一季重複，判讀時要看經常性的營收與現金流。", "en": "After a big one-day move in a small cap, first separate one-offs. In Cricut's case, reports say the margin gain included capitalized procurement costs, sales of excess and obsolete inventory and the final IEEPA tariff refunds, while platform revenue growth slowed for a third straight quarter to 3.7%. That does not make the report bad; it means one-time profit may not repeat next quarter, so look at recurring revenue and cash flow.", "url": "https://finviz.com/news/415043/cricuts-hardware-revival-delivers-a-big-beat-but-platform-slowdown-and-one-time-margin-help-cloud-the-quality", "stocks": [{"t": "CRCT", "n": "平台成長 3.7%，毛利含一次性項目"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "PAL 財報前", "color": "#5B8ED6", "zh": "Proficient Auto Logistics（PAL，汽車運輸）排定 11/12 公布財報；一份小型股 11 月財報解說列出它是五家公司中市值最小的，10/23 市值約 7,600 萬美元。市值這麼小的公司流動性低、買賣價差大、股價容易被小額交易推動，不適合只憑一次財報就下結論。這是日程提醒，不是個股分析。", "en": "Proficient Auto Logistics (PAL, auto transport) is scheduled to report on Nov 12; a November small-cap earnings explainer lists it as the smallest of five companies, with a market cap of about $76 million as of Oct 23. Companies this small have thin liquidity, wide bid-ask spreads and can be moved by small trades, so one report should not drive a conclusion. This is a calendar note, not stock analysis.", "url": "https://news.ifyouspent.com/en/news/small-cap-stocks-reporting-november-2026-explainer", "stocks": [{"t": "PAL", "n": "11/12 財報，市值約 7,600 萬美元（10/23）"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "ESEA 財報前", "color": "#5B8ED6", "zh": "Euroseas（ESEA，貨櫃船出租）上季（Q2）淨利 3,320 萬美元、每股 4.74 美元，宣布每季股息 0.80 美元；租約覆蓋率約為 2026 年剩餘時間 96%、2027 年 81%、2028 年 47%。Q3 財報我沒有找到，去年 Q3 是在 11 月中旬公布，預期近期會公布，屆時看租約續約價格與股息是否維持。航運股循環性強，高股息不等於穩定。", "en": "Euroseas (ESEA, container-ship owner) reported Q2 net income of $33.2 million, or $4.74 per share, and declared a $0.80 quarterly dividend; charter coverage was about 96% for the rest of 2026, 81% for 2027 and 47% for 2028. I did not find Q3 results; last year's Q3 came in mid-November, so a release is likely soon, with renewal rates and the dividend the points to watch. Shipping is cyclical, and a high dividend is not the same as a stable one.", "url": "https://dashboard.channelchek.com/?p=104956", "stocks": [{"t": "ESEA", "n": "Q2 每股 4.74 美元、季股息 0.80 美元，Q3 待公布"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "TRTX 低於淨值", "color": "#C9A227", "zh": "TPG RE Finance Trust（TRTX，商用不動產貸款 REIT）10/27 公布 Q3：每股帳面價值 10.85 美元（較上季少 0.10）、實現損失前可分配盈餘 0.24 美元可覆蓋配息；Q3 以平均 8.00 美元買回約 116 萬股（約 930 萬美元），董事會另核准 5,000 萬美元新回購。風險：法拍相關沖銷後可分配盈餘降到約 0.07 美元，配息覆蓋是問題，商辦貸款信用品質也要持續追蹤。以上是研究線索，不是投資建議。", "en": "TPG RE Finance Trust (TRTX, a commercial real-estate lender) reported Q3 on Oct 27: book value per share of $10.85 (down $0.10), pre-realized-loss distributable earnings of $0.24 covering the dividend; it repurchased about 1.16 million shares for $9.3 million at an average of $8.00 and the board approved a new $50 million program. Risk: after a foreclosure-related write-off, distributable earnings fell to about $0.07, so dividend coverage is a question and credit quality on office loans needs tracking. Research leads, not investment advice.", "url": "https://www.panabee.com/news/tpg-re-finance-trust-earnings-q3-2026", "stocks": [{"t": "TRTX", "n": "回購均價 8.00 美元、帳面價值 10.85 美元"}], "status": "RADAR · 下一個驗證點 Q4 財報與配息覆蓋"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "STC 拆解", "color": "#C9A227", "zh": "Stewart Information Services（STC，產權保險）10/21 公布 Q3：營收 9.007 億美元（去年 7.969 億），調整後每股盈餘 1.33 美元（去年 1.64），GAAP 為 0.98 美元（去年 1.55）；產權業務營收 +5%，但產權損失費用 +20%，房地產解決方案營收 +68%（主要來自併購 MCS）；年度股息由 2.10 提高到 2.20 美元。風險：管理層預期住宅市場到第四季仍走弱，10 年期殖利率接近 5% 更不利成交量。研究線索，不是投資建議。", "en": "Stewart Information Services (STC, title insurance) reported Q3 on Oct 21: revenue of $900.7 million (vs $796.9 million), adjusted EPS of $1.33 (vs $1.64) and GAAP EPS of $0.98 (vs $1.55); title revenue rose 5% but title loss expense rose 20%, real estate solutions revenue rose 68% mainly from the MCS acquisition, and the annual dividend was raised to $2.20 from $2.10. Risk: management expects residential conditions to keep weakening into Q4, and a 10-year yield near 5% hurts transaction volume. Research leads, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0000094344/000110465926117852/tm2628060d1_ex99-1.htm", "stocks": [{"t": "STC", "n": "營收年增但利潤下滑，股息上調到 2.20 美元"}], "status": "RADAR · 下一個驗證點 Q4 財報與成屋成交量"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "ADTN 展望", "color": "#C9A227", "zh": "Adtran（ADTN，寬頻與光網路設備）11/3 公布 Q3：營收約 2.812 億美元（年增 0.6%）、調整後每股盈餘 0.09 美元，略低於指引中點，管理層歸因於供應限制與大客戶專案時程調整；Q4 營收指引 2.72 億至 2.92 億美元，上緣仍低於分析師共識約 2.929 億。各來源對展望的反應說法不一，我沒有找到確切股價反應。這張是「拐點尚未確認」的追蹤更新，研究線索，不是投資建議。", "en": "Adtran (ADTN, broadband and optical networking equipment) reported Q3 on Nov 3: revenue of about $281.2 million (up 0.6%) and adjusted EPS of $0.09, slightly below the guidance midpoint, which management blamed on supply constraints and project-timing changes at a large customer; Q4 revenue guidance is $272–292 million, with the top end still below consensus of about $292.9 million. Sources differ on how the outlook was received and I found no confirmed price reaction. This is a tracking update where the inflection is not confirmed. Research leads, not investment advice.", "url": "https://www.telecomtv.com/content/access-evolution/adtran-holdings-inc-reports-third-quarter-2026-financial-results-56580/", "stocks": [{"t": "ADTN", "n": "Q4 指引上緣低於共識，拐點未確認"}], "status": "RADAR · 下一個驗證點 Q4 財報與大客戶出貨"},
