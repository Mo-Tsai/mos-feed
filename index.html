<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;

  [data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #6a6663; --divider: #2e2a24;
    --noise-opacity: 0.06;
  }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }

  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }
    70% { opacity: 1; }

  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }
  .tab-nav button { background: none; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: Georgia, serif; transition: all 0.3s ease; padding: 0; line-height: 1.2; }
  .sub-pill { background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 0; transition: all 0.2s ease; border-bottom: 1px solid transparent; }
  .swipe-area { position: relative; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .card-slide { position: absolute; inset: 0; padding: 16px 32px 80px; display: flex; flex-direction: column; justify-content: flex-start; transition: transform 0.3s ease, opacity 0.3s ease; will-change: transform, opacity; overflow-y: auto; }
  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .source-link { font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }
  .source-link:hover { color: var(--text-secondary); border-color: var(--text-secondary); }
  .end-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; height: 100%; }
  .end-btn { padding: 12px 28px; background: none; border: 1px solid var(--divider); color: var(--text-tertiary); font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; transition: all 0.25s ease; }
  .end-btn:hover { border-color: var(--text-secondary); color: var(--text-secondary); }

  .theme-toggle:hover { color: var(--text-secondary); }
  .rule { height: 1px; background: var(--divider); }

  .word-popup-trans { font-family: system-ui, -apple-system, 'PingFang TC', sans-serif; font-size: 14px; color: var(--text-secondary); line-height: 1.6; font-weight: 300; }
  .speak-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--text-tertiary); padding: 2px; transition: color 0.2s; line-height: 1; }

  [data-theme="dark"] .word-popup { box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .az-input { width:100%; background:var(--bg); border:1px solid var(--divider); color:var(--text); padding:7px 10px; font-family:'Courier New',monospace; font-size:11px; outline:none; -webkit-appearance:none; appearance:none; border-radius:0; }
  .az-input:focus { border-color:var(--text-secondary); }
  .nav-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:680px; display:flex; justify-content:space-between; align-items:center; gap:6px; padding:10px 16px 14px; background:var(--bg); border-top:1px solid var(--divider); z-index:50; }
  .nav-btn { background:none; border:1px solid var(--divider); color:var(--text-secondary); font-family:'Courier New',monospace; font-size:16px; cursor:pointer; padding:10px 18px; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; line-height:1; }
  .nav-btn-icon { padding:10px 14px; font-size:13px; }
  .nav-btn-icon.playing { border-color:var(--text); color:var(--text); }
  .nav-btn-lang { padding:10px 11px; font-size:11px; letter-spacing:0.08em; color:var(--text-tertiary); min-width:38px; }
  .nav-btn-lang:hover { color:var(--text-secondary); }
  @media (max-width: 420px) { .nav-btn { padding:10px 11px; } .nav-btn-icon { padding:10px 10px; } .nav-btn-lang { padding:10px 8px; min-width:34px; } }
  .nav-btn:hover { border-color:var(--text-secondary); color:var(--text); }
  .nav-btn:active { background:var(--bg-elevated); }
  .nav-btn:disabled { opacity:0.25; cursor:default; border-color:var(--divider); color:var(--text-tertiary); }

</style>
</head>
<body data-theme="light">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
  ja: { locale:'ja-JP', lsKey:'mf_azureVoice_ja', fallback:'ja-JP-NanamiNeural',     styleKey:'mf_azureStyle_ja',
        sysVoices:["Microsoft Nanami Online (Natural) - Japanese (Japan)","Google 日本語","Kyoko","O-ren"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : lang === "ja" ? "ja" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  if (L === "ja") return card.ja || card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "道瓊N高", "color": "#E05C5C", "stocks": [{"t": "DIA", "n": "道瓊ETF，+263.24 點(+0.49%)收 54,349.12 再創新高"}, {"t": "SPY", "n": "標普500 ETF，盤中先創高後回落，-0.17% 收 7,723.55"}, {"t": "QQQ", "n": "那斯達克100，-0.83% 收 26,363.44，四連漲告終"}], "en": "Wednesday split the market in half. The Dow rose 263.24 points (+0.49%) to a fresh record 54,349.12, while the S&P 500 set a new intraday record then reversed to close down 0.17% at 7,723.55 and the Nasdaq fell 0.83% to 26,363.44, snapping a four-day rally. Strong earnings from Eli Lilly and Disney carried the index-level highs; tech gave them back. When the Dow makes a record on the same day the Nasdaq breaks a streak, the money is not leaving — it is changing seats.", "zh": "週三的市場裂成兩半。道瓊加 263.24 點(+0.49%)再創新高 54,349.12；標普 500 盤中先創歷史新高、收盤却轉跌 0.17% 到 7,723.55；那斯達克跌 0.83% 收 26,363.44，四連漲就此告終。抬轎指數的是禮來與迪士尼的好財報，而科技股把漲幅吐了回去。當道瓊創高與那指斷鏈同一天發生，意思不是錢要走，而是錢在換座位。", "ja": "水曜の市場は二つに割れた。ダウは263.24ポイント高（+0.49%）の54,349.12で再び最高値、S&P500は取引中に最高値をつけた後反転して0.17%安の7,723.55、ナスダックは0.83%安の26,363.44で４連高が途切れた。指数の高値を支えたのはイーライリリーとディズニーの好決算。ダウ最高値とナスダック連高途切れが同じ日に起きるのは、資金が逃げたのではなく席を移しているということだ。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-5-2026"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "荷莫茲", "color": "#E05C5C", "stocks": [{"t": "XLE", "n": "能源類股 ETF，油價回落直接壓到毛利"}, {"t": "USO", "n": "原油期貨 ETF，布蘭特 8/4 重挖 5.3%、8/5 再跌 0.3% 至 79.15 美元"}], "en": "Iran's Foreign Ministry said Wednesday that Tehran and Oman have reached an understanding on managing the Strait of Hormuz and are finalising a joint announcement; Trump said a deal could land as early as that day. Brent had already sunk 5.3% on Tuesday to close below $80 for the first time since July 13, and slipped another 0.3% to $79.15 on Wednesday. This is the single biggest swing factor in the market right now: the same headline that lifts the Dow takes the geopolitical premium out of energy earnings.", "zh": "伊朗外交部週三表示，德黑蘭與阿曼已就「如何管理荷莫茲海峽」達成諠解，聯合聲明正在定稿；川普則說協議可能當天就成。布蘭特原油週二先暴跌 5.3%，是 7/13 以來首度收破 80 美元，週三再跌 0.3% 到 79.15 美元。這是目前市場最大的單一擺盪因子：同一則新聞抬起道瓊，却同時把地緣溢價從能源股的獲利裡抽掉。", "ja": "イラン外務省は水曜、オマーンとホルムズ海峡の管理方法で了解に達し、共同発表を最終調整中と発表。ブレントは火曜に5.3%下落し７月13日以来80ドル割れ、水曜もさ0.3%安の79.15ドル。同じヘッドラインがダウを押し上げ、エネルギー株から地政学的プレミアムを抹けさせる。", "url": "https://investinglive.com/commodities/oil-recap-oil-prices-mixed-as-hormuz-reopening-hopes-offset-surprise-us-crude-build/"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "寬度轉向", "color": "#E05C5C", "stocks": [{"t": "RSP", "n": "等權重標普500，反映成分股普遍強弱而非巵頭影響"}, {"t": "XLF", "n": "金融類股，8/4 以 +0.88% 領漲十一大類股"}, {"t": "IJR", "n": "標普小型 600 ETF，小型股 8/5 收黑，沒跟上道瓊的創高"}], "en": "Look under the index prints and the leadership has quietly changed hands. On Tuesday financials (+0.88%) and communication services (+0.56%) led the eleven S&P sectors while energy (-0.49%) and utilities (-0.60%) lagged; on Wednesday the Dow made a record but the Russell 2000 slipped 0.37%. Value is being paid and long-duration growth is being trimmed — not violently, but consistently, and that is the tell worth tracking.", "zh": "把指數數字接開來看，領漲棒已經惄惄換手。週二十一大類股中，金融(+0.88%)與通訊服務(+0.56%)領漲，能源(-0.49%)與公用事業(-0.60%)垫底；週三道瓊創高的同時，羅素 2000 却跌 0.37%。市場正在付錢給價值、同時修減長久期成長股——不是暴力切換，而是持續的、一點一點的，這才是值得追蹤的訊號。", "ja": "指数の裏を見ると主導権は静かに交代している。火曜は金融（+0.88%）と通信サービス（+0.56%）が上位、エネルギー（-0.49%）と公共事業（-0.60%）が下位。水曜はダウが最高値の一方でラッセル2000は0.37%安。バリューに資金が向かい、長期グロースが削られている。", "url": "https://www.investing.com/analysis/sector-rotation-a-guide-to-the-sp-500-momentum-status-200675903"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "個股異動", "color": "#E05C5C", "stocks": [{"t": "ZBRA", "n": "Zebra Technologies，8/5 標普500 漲幅前段班"}, {"t": "IT", "n": "Gartner，同日領漲名單內"}, {"t": "APTV", "n": "Aptiv，汽車電子，當日跌幅前段班"}, {"t": "NRG", "n": "NRG Energy，電力股屬當日墨底——跟 AI 用電主題的多頭叙事相反"}, {"t": "CMG", "n": "Chipotle，餐飲股當日跌幅前段班"}], "en": "Beneath a flat index the single-stock dispersion was wide. Zebra Technologies and Gartner sat at the top of the S&P 500 on Wednesday while Aptiv, NRG Energy and Chipotle sat at the bottom. NRG is the one worth a second look: power generation is supposed to be the AI-electricity trade's home turf, so a red day there is a reminder that a hot theme does not lift every name inside it on every session.", "zh": "指數看似平淡，個股的離散度却很大。週三標普 500 漲幅前段班是 Zebra Technologies 與 Gartner，墨底則是 Aptiv、NRG Energy 與 Chipotle。值得多看一眼的是 NRG：發電本該是「AI 用電」這條主線的主場，它在這種日子收黑，提醒了一件事——主題很熱，不代表主題裡每一檔股票每一天都會被抬起來。", "ja": "指数は横ばいでも個別株の差は大きい。水曜のS&P500上位はZebraとGartner、下位はAptiv、NRG Energy、Chipotle。注目はNRG——発電は本来AI電力テーマの本場であり、そこが下げるというのは、熱いテーマでも全銘柄が毎日上がるわけではないというリマインダーだ。", "url": "https://www.trefis.com/stock/spy/articles-v3/610178/sp-500-movers-winners-pltr-zbra-it-losers-aptv-nrg-cmg/2026-08-05"},
    {"id": "earn_0", "channel": "財報速報", "tag": "禮來大贏", "color": "#E8786A", "stocks": [{"t": "LLY", "n": "禮來，Q2 營收 229.7 億美元年增 47.7%，盤中一度 +7%"}, {"t": "NVO", "n": "諾和諾德，同日交卷的減重藥直接對手"}], "en": "Eli Lilly was the earnings story of the day: Q2 revenue jumped 47.7% year on year to $22.97 billion against a $20.62 billion consensus, adjusted EPS of $8.38 beat by 27.3%, and full-year revenue guidance was lifted 3% to a $86 billion midpoint — driven by injectable GLP-1s and the oral pill Foundayo. Shares jumped as much as 7% but gave back most of the gain intraday. A 27% EPS beat that cannot hold its opening move tells you how much was already in the price.", "zh": "禮來是當日的財報主角：Q2 營收 229.7 億美元、年增 47.7%，遠高於市場預估的 206.2 億；調整後 EPS 8.38 美元超預期 27.3%；全年營收指引上修 3% 至 860 億美元中位數，推手是注射型 GLP-1 與口服錐 Foundayo。股價一度漲 7%，却在盤中吐回大半。一個超預期 27% 的財報守不住開盤漲幅，本身就是一個訊息：好消息早已在價格裡。", "ja": "イーライリリーが主役だった。Q2売上は前年比47.7%増の229.7億ドル（予想206.2億）、調整EPS8.38ドルは27.3%上振れ、通期売上見通しを3%引き上げ860億ドルへ。注射GLP-1と経口薬Foundayoが牽引。株価は一時 7%高も大半を吐き出した——好材料はすでに価格に入っていた。", "url": "https://qz.com/sp500-dow-record-high-disney-eli-lilly-earnings-080526"},
    {"id": "earn_1", "channel": "財報速報", "tag": "不對稱獼懲", "color": "#E8786A", "stocks": [{"t": "AMD", "n": "Q2 營收 115.4 億超預期 112.8 億、Q3 指引 130 億也高於預期，盤後仍跌 8.8% 到 472.94"}, {"t": "SPCX", "n": "SpaceX 首份財報：營收 78 億年增 92%、調整 EBITDA 35 億 +191%，却因資本支出 184 億而盤後跌近 8%"}], "en": "Two beats, two sell-offs. AMD posted Q2 revenue of $11.54B (vs $11.28B) and adjusted EPS of $1.66 (vs $1.61), and guided Q3 to roughly $13B against a $12.52B consensus — shares still fell 8.8% after hours because the market wanted a blowout Helios rack-scale guide. SpaceX's first report as a public company showed revenue up 92% to $7.8B and adjusted EBITDA up 191% to $3.5B, yet the stock dropped up to 8% on $18.4B of quarterly capex, versus $10.1B the prior quarter. The bar this season is not the estimate; it is the story.", "zh": "兩場超預期，兩場下跌。AMD Q2 營收 115.4 億（預期 112.8 億）、調整 EPS 1.66（預期 1.61），Q3 指引約 130 億也高於市場的 125.2 億，股價盤後仍跌 8.8% 到 472.94 美元——因為市場想要的是 Helios 機櫃級平台帶來的「爆發式」指引。SpaceX 上市後首份財報營收 78 億年增 92%、調整 EBITDA 35 億年增 191%，却因單季資本支出飛到 184 億（上季 101 億）而盤後跌近 8%。這季的標準不是市場預估，是故事。", "ja": "二つの上振れ、二つの売られ。AMDはQ2売上115.4億ドル、調整EPS1.66ドルと共に予想超、Q3指針130億ドルも予想超だが時間外で8.8%安。Heliosの爆發的なガイダンスが望まれていた。SpaceXは初決算で売上92%增の78億ドル、調整EBITDA191%増の35億ドルながら、四半期設備投資184億ドルを嫌気され最大8%安。", "url": "https://www.benzinga.com/markets/tech/26/08/60936941/amd-earnings-stock-after-hours-wall-street-forecast"},
    {"id": "earn_2", "channel": "財報速報", "tag": "消費與平台", "color": "#E8786A", "stocks": [{"t": "DIS", "n": "迪士尼會計年度 Q3 超預期，股價 +2% 以上"}, {"t": "UBER", "n": "同日盤前交卷的共乘與外送平台"}, {"t": "SHOP", "n": "同日交卷的電商基建平台"}, {"t": "XYZ", "n": "Block，營收 66.18 億優於預期 64.85 億、EPS 1.02 優於 0.87"}], "en": "Wednesday was one of the heaviest days of the season — 351 companies reported. Disney's fiscal Q3 topped expectations and the stock added more than 2%; Uber, Shopify and Novo Nordisk also crossed the tape before the open. Block was the cleanest beat of the group, with revenue of $6.618B against $6.485B expected and EPS of $1.02 against $0.87. Consumer and platform names are still delivering; it is the AI-capex names that are being interrogated.", "zh": "週三是這季最擁擠的交卷日之一，共 351 家公司公布財報。迪士尼會計年度 Q3 超預期，股價漲逾 2%；Uber、Shopify 與諾和諾德也在盤前交卷。這組裡最乾淨的超預期是 Block：營收 66.18 億美元（預期 64.85 億）、EPS 1.02 美元（預期 0.87）。消費與平台型公司仍在交出成績，真正被拷問的是那些大手筆的 AI 資本支出股。", "ja": "水曜は今シーズン最大級の決算日で351社が発表。ディズニーは予想超で株価2%高、Uber、Shopify、ノボノルディスクも発表。最も明確な上振れはBlock（売上66.18億ドル、EPS1.02ドル）。消費・プラットフォームは健在で、厳しく問われているのはAI設備投資銘柄の方だ。", "url": "https://www.thestreet.com/latest-news/block-inc-xyz-q2-2026-earnings-call-updates"},
    {"id": "macro_0", "channel": "總經政策", "tag": "30年期5.25", "color": "#7C6AF7", "stocks": [{"t": "TLT", "n": "20 年以上公債 ETF，長端殖利率上行時首當其衝"}, {"t": "IEF", "n": "7-10 年公債 ETF，可對照曲線陳峭化程度"}, {"t": "LQD", "n": "投資級公司債，長端利率直接決定其貼現"}], "en": "The 30-year Treasury yield pushed above 5.24% — its highest since 2007 — after the FOMC left the target range unchanged at 3.50-3.75% on July 29 and several officials said publicly that hikes are needed. This is the market's central contradiction right now: equity indices are printing records while the long end prices in more inflation and more supply. Long duration is where that argument gets settled, and right now the bond market is not agreeing with the stock market.", "zh": "30 年期美債殖利率推升至 5.24% 以上，是 2007 年以來新高。背景是 Fed 於 7/29 維持利率區間 3.50-3.75% 不變，而多位官員公開表示「需要升息」。這是目前市場最核心的矛盾：股市在創高，長端利率却在把更高的通膨與更大的發債量定進價格裡。長久期債券就是這場爭論的裁判場，而現在債市並不同意股市的看法。", "ja": "30年債利回りは5.24%を超え、2007年以来の高水準。FOMCは7月29日に3.50-3.75%を据え置きだが、複数の役員が利上げの必要性に言及。株式が最高値をつける一方で長期ゾーンはインフレと発行量を織り込む——市場最大の矛盾であり、債券市場は株式市場に同意していない。", "url": "https://www.cnbc.com/2026/07/31/treasury-yields-inflation-interest-rates-federal-reserve.html"},
    {"id": "macro_1", "channel": "總經政策", "tag": "9月61.9%", "color": "#7C6AF7", "stocks": [{"t": "XLU", "n": "公用事業，債券替代品屬性，升息預期下直接受壓"}, {"t": "XLRE", "n": "不動產類股，對長端利率最敏感"}, {"t": "VNQ", "n": "REIT ETF，法人整批迴避的直接標的"}], "en": "CME FedWatch put the odds of a 25bp hike at the September 16 FOMC at 61.9% as of August 4. Note the direction: the debate has flipped from how many cuts to whether the next move is up. That single change re-prices everything that was bought as a bond substitute — utilities, REITs, high-dividend equity — and it is why those groups keep showing up at the bottom of the daily sector table even on green days for the index.", "zh": "截至 8/4，CME FedWatch 顯示 9/16 FOMC 升息 1 碼的機率為 61.9%。請注意方向性：辩論的題目已經從「今年降幾碼」變成「下一步是不是往上」。這一個轉向，就把所有當初被當成「債券替代品」買進的資產全部重新定價——公用事業、REIT、高股息股；這也是為什麼即使大盤收紅，這幾組仍常出現在類股表的最底部。", "ja": "8月4日時点でCME FedWatchは9月16日FOMCの0.25%利上げ確率を61.9%と示す。論点は「何回利下げか」から「次は上げなのか」へ転換した。この転換は公共事業、REIT、高配当株など「債券代替」として買われた資産を一斉に再評価させる。", "url": "https://growbeansprout.com/tools/fedwatch"},
    {"id": "macro_2", "channel": "總經政策", "tag": "ADP4.4萬", "color": "#7C6AF7", "stocks": [{"t": "XLI", "n": "工業類股，就業降溫最早反映在製造與運輸雇用"}, {"t": "XRT", "n": "零售 ETF，薪資與就業直接決定消費力"}], "en": "ADP said private employers added just 44,000 jobs in July — below the 75,000 consensus and below June's downwardly revised 95,000. Hold that next to a 61.9% probability of a September hike and the tension is obvious: the labour market is cooling while the policy debate leans hawkish on inflation. Friday's official payrolls print is the first referee, and this is exactly the setup where a single data point moves more than it should.", "zh": "ADP 公布 7 月民間就業僅增 4.4 萬人，低於市場預期的 7.5 萬，也低於 6 月下修後的 9.5 萬。把這個數字跟「9 月升息機率 61.9%」放在一起，張力就很明顯：勞動市場正在降溫，而政策辩論却因通膨而偏鷹。週五的官方非農是第一個裁判，而這正是那種「單一數據會動得比它該動的還大」的局面。", "ja": "ADPの7月民間雇用は4.4万人増にとどまり、予想7.5万人も下方修正後の6月9.5万人も下回った。9月利上げ確率61.9%と並べると矛盾は明白だ——雇用は冷え、政策議論はタカ派。金曜の雇用統計が最初の審判となる。", "url": "https://www.cnbc.com/2026/08/05/private-companies-added-just-44000-workers-in-july-below-expectations-adp-reports.html"},
    {"id": "sector_0", "channel": "產業風向", "tag": "電力卸頸", "color": "#4EABA4", "stocks": [{"t": "GEV", "n": "GE Vernova，電氣化部門光 Q1 資料中心設備訂單就達 24 億美元，超過 2025 全年"}, {"t": "ETN", "n": "Eaton，組內最純的電力基建標的"}, {"t": "PWR", "n": "Quanta Services，電網工程施工端"}], "en": "The AI trade's bottleneck is migrating from compute to electricity. Hyperscaler capex guidance for 2026 has been raised to roughly $750 billion (from $670 billion), and the money increasingly buys switchgear, transformers, turbines and gensets rather than accelerators — GE Vernova's electrification arm booked $2.4 billion of data-centre equipment orders in Q1 alone, more than all of 2025. The DOE projects data centres could take up to 12% of US electricity demand by 2028. The pick-and-shovel layer has moved one step down the stack.", "zh": "AI 交易的卸頸正在從算力搬到電力。超大規模業者 2026 年資本支出指引已上修至約 7,500 億美元（原為 6,700 億），而這筆錢越來越多花在開關設備、變壓器、燃氣輪機與發電機組，而不是加速卡——GE Vernova 電氣化部門光 Q1 的資料中心設備訂單就有 24 億美元，比 2025 一整年還多。美國能源部估計到 2028 年資料中心最多將佔全美用電 12%。賣鏟子的那一層，往下移了一格。", "ja": "AI取引のボトルネックは計算力から電力へ移っている。2026年のハイパースケーラー設備投資は約7,500億ドルに引き上げられ、資金は開閉器・変圧器・タービンへ。GE Vernovaの電気化部門はQ1だけでデータセンター向け機器受注24億ドルと2025年通年超。DOEは2028年にデータセンターが米国電力需要の最大12%を占めると予測。", "url": "https://www.fool.com/investing/2026/07/04/the-ai-boom-has-a-power-problem-these-industrial-s/"},
    {"id": "sector_1", "channel": "產業風向", "tag": "金融受惠", "color": "#4EABA4", "stocks": [{"t": "XLF", "n": "金融類股，8/4 以 +0.88% 在十一大類股中領漲"}, {"t": "KRE", "n": "區域銀行 ETF，升息對淨息差是順風、對存款成本是逆風"}], "en": "Financials led the S&P sectors on Tuesday at +0.88%, and the reason is the rate path itself: expectations flipped from cuts to a possible September hike, which widens net interest margins for lenders. The nuance small-cap investors should hold onto is that the same hike raises deposit costs and pressures commercial real estate books — so the sector-level tailwind does not distribute evenly. Big diversified banks and small community lenders are, functionally, two different trades.", "zh": "金融週二以 +0.88% 在十一大類股中領漲，原因就是利率路徑本身：預期從降息翻轉成「9 月可能升息」，而升息能拉開放款方的淨息差。但小型股投資人要記住一個細節：同一次升息也會推高存款成本、壓到商用不動產放款部位——這份順風並不均勻。大型綜合銀行與小型社區銀行，實質上是兩種不同的交易。", "ja": "金融は火曜に+0.88%でセクター首位。理由は金利パスそのもの——利下げ期待から9月利上げへの転換が貫付利阁を拡げる。ただし同じ利上げは預金コストを押し上げ、商業用不動産与信を圧迫する。大手銀行と小型地域銀行は実質別の取引だ。", "url": "https://www.investing.com/analysis/sector-rotation-a-guide-to-the-sp-500-momentum-status-200675903"},
    {"id": "sector_2", "channel": "產業風向", "tag": "能源逆風", "color": "#4EABA4", "stocks": [{"t": "XLE", "n": "能源類股今年漲逾 22%，但 8/4 以 -0.49% 垫底"}, {"t": "XOP", "n": "石油與天然氣探勘生產，對油價的彈性高於綜合型大廠"}], "en": "Energy has been one of 2026's best sectors, up more than 22% year to date — but a large slice of that came from a geopolitical premium that a Hormuz deal would delete. Tuesday's sector table already showed energy at the bottom (-0.49%). The question worth sitting with is what these companies are worth on normalised crude rather than conflict crude, because the answer decides whether this year's gain was earnings or fear.", "zh": "能源是 2026 年表現最好的類股之一，年内漲逾 22%——但其中很大一塊來自地緣風險溢價，而荷莫茲協議一旦成局，這塊溢價就被刪掉。週二的類股表中，能源已經以 -0.49% 垫底。值得坐下來想的問題是：這些公司在「正常化油價」而非「衝突油價」下值多少？答案決定了今年這波漲幅到底是獲利還是恐懼。", "ja": "エネルギーは2026年の優等生セクターで年初来・22%高。だがその相当部分は地政学プレミアムであり、ホルムズ合意が成れば消える。火曜のセクター表ですでにエネルギーは最下位（-0.49%）。問うべきは、正常化した原油価格でこれらの企業はいくらなのかだ。", "url": "https://www.investing.com/analysis/sector-rotation-intensifies-value-outperforms-growth-in-2026-market-split-200675093"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "23年最強", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，年內約 +20%，8/5 小跌 0.37%"}, {"t": "IJR", "n": "標普小型 600 ETF，成分股有獲利門檻，可對照羅素 2000"}], "en": "The Russell 2000 is up about 20% in 2026 — its best year since 2003 — against 11% for the S&P 500 and just 4% for the Magnificent 7. For the twelve months to 30 June it was up 40.8%. After several years of small-cap underperformance this is a genuine regime change, and it is happening while the megacap AI leaders stall. Wednesday's 0.37% dip is noise; the year-to-date spread is the signal.", "zh": "羅素 2000 今年以來漲約 20%，是 2003 年以來最好的一年，同期標普 500 漲 11%、七巨頭只漲 4%；截至 6/30 的過去一年則漲 40.8%。在連續幾年落後之後，這是一次真正的風格輪替，而且它發生在巨型 AI 龍頭停滞的同時。週三跌 0.37% 是雜訊；年內的優勣差才是訊號。", "ja": "ラッセル2000は2026年に約20%高と2003年以来の好パフォーマンス。S&P500は11%、マグニフィセント・セブンはわずか4%。6月30日までの1年では40.8%高。数年の劣勢を経ての本格的な局面転換であり、大型AI銘柄の足踏み中に起きている。", "url": "https://247wallst.com/investing/2026/07/16/the-russell-2000-is-having-its-best-year-in-23-years-heres-why-small-caps-are-winning-again/"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "品質分層", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素 2000 成長型，不賺錢公司比重高，這波漲幅最大"}, {"t": "IWN", "n": "羅素 2000 價值型，獲利公司比重高，漲幅相對溫和"}], "en": "Inside the small-cap rally there is a quality split that matters more than the headline number: unprofitable Russell 2000 companies have surged 154% since mid-2025, while profitable ones gained 34%. That is a 4.5x gap, and it means the index return is being driven disproportionately by companies with no earnings to defend it. If the September hike lands, the unprofitable cohort is where the damage concentrates first — this is the most fragile part of the strongest trade of 2026.", "zh": "小型股這波漲勢裡藏著一個比指數數字重要得多的品質分層：自 2025 年中以來，羅素 2000 裡不賺錢的公司漲了 154%，而有獲利的只漲 34%——差距 4.5 倍。這代表指數報酬不成比例地由「沒有獲利可以支撐股價」的公司帶動。若 9 月真的升息，傷害會最先集中在不賺錢那一群——這是 2026 年最強交易裡最脆弱的一塊。", "ja": "小型株ラリーの中には指数の数字より重要な質の分断がある。2025年半ば以降、赤字のラッセル2000企業は154%高、黒字企業は34%高と4.5倍の差。指数のリターンは利益のない企業に偏って支えられており、9月利上げならそこから崩れる。", "url": "https://247wallst.com/investing/2026/07/16/the-russell-2000-is-having-its-best-year-in-23-years-heres-why-small-caps-are-winning-again/"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "AI外溢", "color": "#5B8ED6", "stocks": [{"t": "CLS", "n": "Celestica，Q2 營收 47 億美元年增 62.4%、調整 EPS 2.54 連續第五季超預期，全年指引上修至 205 億"}, {"t": "ALAB", "n": "Astera Labs，AI 連接需求推升單季營收創新高、年增 93%"}, {"t": "ON", "n": "onsemi，AI 資料中心營收年增超過一倍"}], "en": "This is the mechanism behind the small-cap rally: AI capex is spilling out of the megacaps into the supply chain. Celestica's Q2 revenue rose 62.4% to $4.70 billion with adjusted EPS of $2.54 — a fifth consecutive beat — and full-year guidance was lifted to $20.5 billion; Astera Labs posted record revenue up 93% on AI connectivity; onsemi's AI data-centre revenue more than doubled. These are not story stocks, they are order books. That is the distinction worth making when someone says small caps are running on hype.", "zh": "這就是小型股漲勢背後的機制：AI 資本支出正從巨頭外溢到供應鏈。Celestica Q2 營收 47 億美元年增 62.4%、調整 EPS 2.54 美元連續第五季超預期，全年指引上修至 205 億；Astera Labs 因 AI 連接需求單季營收創新高、年增 93%；onsemi 的 AI 資料中心營收年增超過一倍。這些不是概念股，是訂單。下次有人說小型股靠概念在漲，這是值得區分的地方。", "ja": "小型株上昇のメカニズムは、AI設備投資が大型株からサプライチェーンへ溢れ出していることだ。CelesticaはQ2売上62.4%増の47億ドル、調整EPS2.54ドルで5四半期連続の上振れ。Astera Labsは93%増収で過去最高、onsemiのAIデータセンター収益は倍増。概念ではなく受注残高である。", "url": "https://247wallst.com/investing/2026/08/03/3-stocks-to-buy-before-wall-street-catches-on-in-august/"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "覆蓋真空", "color": "#5B8ED6", "stocks": [{"t": "IWC", "n": "微型股 ETF，成分股大多落在零覆蓋區"}, {"t": "IJS", "n": "標普小型價值型，適合對照「便宜但沒人寫」的那一群"}], "en": "A structural fact worth memorising: only about 3,100 US listed companies — roughly 35% — are followed by even one analyst. The other 65% have no professional model, no estimate to beat, and no sell-side note when something changes. That vacuum is the entire premise of the neglect radar, but it cuts both ways: no coverage also means no one is checking the numbers for you, disclosure is thinner, and liquidity is worse. Do the work yourself or stay out.", "zh": "一個值得背起來的結構性事實：美股中只有約 3,100 家公司（約 35%）至少有一位分析師覆蓋，其餘 65% 沒有任何法人模型、沒有可供「超預期」的預估值，也沒有人在事情變化時寫報告。這個真空就是忽視雷達的全部前提，但它是雙刃：沒人覆蓋也意味著沒人替你核數字、揭露更薄、流動性更差。要麼自己做功課，要麼就不要進去。", "ja": "覚えておく価値のある構造的事実：米国上場企業でアナリストが1人でもついているのは約3,100社、約35%にすぎない。残り65%にはモデルも予想もない。この空白こそがレーダーの前提だが、同時に誰も数字を検証してくれず、開示も流動性も薄いということでもある。", "url": "https://www.zacks.com/stock-education/57/Stocks-Neglected-By-Analysts"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "升息風險", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000，成分股浮動利率債務比重高於大型股"}, {"t": "KRE", "n": "區域銀行，既是小型股的一部分，也是小型企業的主要放款來源"}], "en": "Here is the risk that sits underneath the best small-cap year since 2003: small companies carry a much higher share of floating-rate debt than large caps, so a September hike hits their interest expense within a quarter rather than at the next refinancing. Add the fact that their main lenders are regional banks facing their own deposit-cost squeeze, and a single 25bp move transmits through the small-cap complex twice — once through the borrower, once through the lender.", "zh": "這是埋在「2003 年以來最強小型股年」下面的風險：小型公司的浮動利率債務比重遠高於大型股，因此 9 月若升息，影響會在一季內就反映在利息支出上，而不是等到下一次重新融資。再加上它們的主要放款方是同樣面對存款成本壓力的區域銀行，一次 1 碼的升息會在小型股體系裡傳導兩次——一次走借款人，一次走放款人。", "ja": "2003年以来最強の小型株相場の下にあるリスク：小型企業は変動金利債務の比率が大型株より高く、9月の利上げは四半期内に支払利息へ反映する。主な貸し手である地域銀行も預金コスト圧力に直面しており、0.25%の利上げは小型株に二重に伝わる。", "url": "https://www.investing.com/analysis/small-caps-are-quietly-winning-while-mega-caps-wobble-200684618"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "HDSN交卷", "color": "#C9A227", "stocks": [{"t": "HDSN", "n": "Hudson Technologies，Q2 營收 7,835 萬美元年增 7.5% 超過 7,450 萬指引中位數，但 GAAP EPS 0.12 美元低於市場預估 32.4%"}], "en": "Hudson Technologies recycles and resells refrigerants under the AIM Act HFC phase-down. It went on the radar because 10% holder Hartree Partners bought 834,986 shares over a year with zero sales, and we set 08/05 as the verification date with three tests. Verdict: revenue passed — $78.35 million, up 7.5%, above the $74.5 million guidance midpoint, with a second straight quarter of double-digit volume growth. Margin failed — operating margin fell to 9.4% from 17.5% a year ago and GAAP EPS of $0.12 missed by 32.4%, down from $0.23. Management blames a continued trough in HFC pricing plus inflation. The bull case was always volume-plus-price; volume delivered, price did not. This is a research lead, not investment advice.", "zh": "Hudson Technologies 做的是冷媒回收再製與銷售，吃 AIM 法案 HFC 逐步淡出的紅利。它上雷達是因為 10% 大股東 Hartree Partners 一年內累積買進 834,986 股且零賣出，而我們把 08/05 訂為驗證點、列了三項檢查。結果：營收過關——總營收 7,835 萬美元、年增 7.5%，高於 7,450 萬的指引中位數，且連續兩季達雙位數銷量成長。毛利沒過關——營業利益率從去年同期 17.5% 掘到 9.4%，GAAP EPS 0.12 美元低於預期 32.4%（去年同期 0.23）。管理層指向 HFC 價格持續探底加上通膨壓力。多方論點一直是「量價齊升」，現在量到了、價沒到。這是研究線索，不是投資建議。", "ja": "Hudson Technologiesは冷媒の回収・再生・販売を手掛ける。大株主Hartreeの1年で834,986株購入・売却ゼロを根拠にレーダー入りし、8/5を検証日とした。結果：売上は合格（7,835万ドル、7.5%増、指針中央値超）。利益率は不合格——営業利益率は17.5%から9.4%へ、GAAP EPS0.12ドルは32.4%下振れ。量は出たが価格が出なかった。これは投資勩奨ではなく研究の手がかりである。", "url": "https://markets.financialcontent.com/stocks/article/stockstory-2026-8-5-hudson-technologies-nasdaqhdsn-surprises-with-q2-cy2026-sales", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（看 HFC 售價是否觸底回升、毛利率能否回到 20% 中段）"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "ERII驗證失敗", "color": "#C9A227", "stocks": [{"t": "ERII", "n": "Energy Recovery，Q2 營收 1,200 萬美元年減 57.2%、低於市場預估 1,883 萬達 36.3%；調整 EBITDA -260 萬，利潤率從去年 15.7% 轉為 -21.7%"}], "en": "This one has to be reported straight, because the discipline of a watchlist lives in what it admits. Energy Recovery makes PX pressure exchangers for desalination; it entered the pool on a Saudi contract, India wastewater orders, and a director buying at $8.88. We flagged 08/05 as the make-or-break. It broke: Q2 revenue of $12 million fell 57.2% year on year and missed estimates by 36.3%, and adjusted EBITDA swung to -$2.6 million (-21.7% margin) from +15.7%. The non-GAAP loss of $0.03 was merely in line. The bull case rested entirely on new orders converting to revenue; this quarter says they have not. A failed verification point is information, not a reason to look away. Research lead only, not investment advice.", "zh": "這一則必須直說，因為一個雷達池的紀律就在於它敢不敢認錯。Energy Recovery 做的是海水淡化用的 PX 壓力交換器，當初入池靠的是沙烏地大單、印度廢水案與董事在 8.88 美元加碼，而我們把 08/05 訂為決勝點。結果是沒過：Q2 營收僅 1,200 萬美元、年減 57.2%，比市場預估的 1,883 萬少了 36.3%；調整 EBITDA 從去年的 +15.7% 利潤率轉為 -260 萬美元、-21.7%。非 GAAP 每股損 0.03 美元只能算符合預期。多方論點完全壓在「新訂單能否轉成營收」，這一季的答案是還沒有。驗證失敗本身就是資訊，不是移開視線的理由。研究線索，非投資建議。", "ja": "これは正直に報じなければならない。Energy Recoveryは海水淡水化用PX圧力交換器のメーカー。8/5を正念場としていたが、結果は不合格——Q2売上1,200万ドル（前年比57.2%減、予想を36.3%下回る）、調整EBITDAは-260万ドル（-21.7%）。強気論は新規受注の売上転換に全依存していたが、今四半期はそれを否定した。検証失敗も情報である。", "url": "https://markets.financialcontent.com/stocks/article/stockstory-2026-8-5-energy-recovery-nasdaqerii-misses-q2-cy2026-revenue-estimates-stock-drops", "status": "RADAR · 驗證失敗，降級觀察；下一個驗證點是 Q3 財報的 backlog 轉換率"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "MBC合併首季", "color": "#C9A227", "stocks": [{"t": "MBC", "n": "MasterBrand，合併後首份完整季報：營收 8.152 億美元大幅超過市場預估的 7.43 億、年增 11.5%，但 EPS 0.05 美元低於預期 0.10；股價周三盤中跌至 9.19"}], "en": "MasterBrand makes kitchen and bath cabinets and completed an all-stock merger with American Woodmark on 05/28. Its first full post-merger quarter: net sales of $815.2 million beat the $743 million consensus and rose 11.5%, but that includes $125.5 million from American Woodmark — legacy MasterBrand sales actually fell 5.6%. EPS of $0.05 missed the $0.10 estimate. The genuinely new information is on synergies: roughly $30 million of annual actions were completed by end-July, and management now guides to more than $100 million of annual run-rate cost synergies by year three, above the original target. So the deal maths improved while the underlying housing demand did not. Research lead, not investment advice.", "zh": "MasterBrand 做廁浴櫃體，05/28 完成與 American Woodmark 的全股交換合併。合併後首份完整季報：營收 8.152 億美元大幅超過市場預估的 7.43 億、年增 11.5%，但這裡面含 American Woodmark 貢獻的 1.255 億——原 MasterBrand 本體營收其實年減 5.6%；EPS 0.05 美元低於預期的 0.10。真正新的資訊在綼效：截至 7 月底已完成約 3,000 萬美元的年化綼效措施，管理層現在指引第三年底前年化成本綼效超過 1 億美元，高於原目標。簡單講：交易的算式變好了，底下的房市需求沒有。研究線索，非投資建議。", "ja": "MasterBrandはキッチン・バスキャビネットのメーカーで5/28にAmerican Woodmarkとの全株式交換合併を完了。合併後初の四半期は売上8.152億ドルで予想超だが、American Woodmark分1.255億を含み、旧MasterBrand単体は5.6%減。EPS0.05ドルは予想0.10ドルを下回る。新しい情報はシナジー——7月末で年3,000万ドル分完了、3年目に年1億ドル超へ上方修正。", "url": "https://www.financialcontent.com/article/bizwire-2026-8-4-masterbrand-reports-second-quarter-2026-financial-results", "status": "RADAR · 下一個驗證點 Q3 財報（看原 MasterBrand 本體營收能否止跌、綼效實現速度）"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "WEX新名字", "color": "#C9A227", "stocks": [{"t": "WEX", "n": "WEX Inc，車隊卡、企業支付與醫療帳戶服務；董事長 Melissa Smith 6/2 花 50.07 萬美元買 3,721 股，董事 James Groch 5/18 買 1,500 股"}], "en": "New name. WEX processes fleet-card, corporate and health-account payments. Why ignored: the stock is down 5% over a year, 24% over three and 30.3% over five, so the generalist funds left and the story went quiet. What is changing: a genuine insider cluster — the Chair, COO, CFO, CTO, Chief Legal Officer and Chief Digital Officer all bought in the open market within a short window, including Chair Melissa Smith's $500,720 purchase of 3,721 shares on 06/02. A whole C-suite buying together after a multi-year derating is the rarest form of this signal, because it is hard to explain as diversification or a scheduled plan. Risks: fleet-card volume is tied to fuel prices and miles driven, and five years of underperformance is a fact about execution, not just sentiment. Insiders can be early and wrong. This is a research lead, not investment advice.", "zh": "新名字。WEX 做的是車隊卡、企業支付與醫療帳戶的支付處理。為什麼被忽視：股價一年跌 5%、三年跌 24%、五年跌 30.3%，泛用型基金早就走光、媒體也不寫了。什麼正在改變：一次真正的內部人群聚買進——董事長、營運長、財務長、技術長、法務長與數位長在短時間內全部於公開市場買進，包括董事長 Melissa Smith 於 6/2 花 50.07 萬美元買 3,721 股。整個高管團在多年跌價後一起進場，是這類訊號中最難得的一種，因為很難用「分散配置」或「預設交易計畫」來解釋。風險：車隊卡交易量綁在油價與行駛里程上，而五年落後是執行力的事實、不只是情緒。內部人也可能既早且錯。研究線索，非投資建議。", "ja": "新規銘柄。WEXはフリートカード・法人決済・医療口座の決済企業。無視の理由：1年5%安、3年24%安、5年30.3%安で汎用ファンドが離脱。変化：会長・COO・CFO・CTO・法務・デジタル担当が短期間に揃って市場購入し、会長Melissa Smithは6/2に50万ドル分を取得。経営陣全体の同時購入は最も説明のつきにくいシグナルだ。リスクは燃料価格連動と長期の実績不振。投資勩奨ではない。", "url": "https://finance.yahoo.com/news/wex-insider-buying-cluster-highlights-101146160.html", "status": "RADAR · 下一個驗證點：下一份 10-Q 的車隊卡交易量與全年指引是否上修"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "FCFS新名字", "color": "#C9A227", "stocks": [{"t": "FCFS", "n": "FirstCash Holdings，美墨兩地當鋪連鎖；Q2 營收 10.7 億美元年增 29%、GAAP EPS 2.12 年增 58%，當鋪債權跳 63% 至 8.98 億"}], "en": "New name. FirstCash runs 3,343 pawn stores across the US and Latin America. Why ignored: pawn lending is on most ESG exclusion lists and reads as a low-growth consumer-credit business, so coverage is thin and media attention near zero. What is changing: Q2 was a record — revenue $1.07 billion (+29%), GAAP diluted EPS $2.12 (+58%), adjusted EPS $2.50 (+40%), pawn receivables up 63% in total and 22% same-store, pawn segment income +59%, operating cash flow $673 million funding 347 net new stores over twelve months. Capital allocation followed: the prior $150 million buyback was completed and the board authorised a new $150 million, plus a $0.42 quarterly dividend. Risks: pawn demand rising this fast is partly a read on consumer stress, which cuts both ways; regulatory risk in consumer lending is permanent; Latin American FX moves the reported numbers. Research lead, not investment advice.", "zh": "新名字。FirstCash 在美國與拉丁美洲經營 3,343 家當鋪門市。為什麼被忽視：當鋪放款在大多數 ESG 排除名單上，又被归類成低成長的消費金融，因此覆蓋薄、媒體聲量幾乎為零。什麼正在改變：Q2 是紀錄季——營收 10.7 億美元（+29%）、GAAP 稀釋 EPS 2.12 美元（+58%）、調整後 EPS 2.50（+40%），當鋪債權總量跳 63%、同店成長 22%，當鋪部門利益 +59%，營運現金流 6.73 億支應了一年內淨增 347 家門市。資本配置跟上：前一個 1.5 億庫藏股計畫已執行完畢，董事會再授權 1.5 億，同時宣布每股 0.42 美元季配。風險：當鋪需求這種漲幅本身就是消費者財務壓力的讀數，是雙刃；消費金融的監管風險永遠存在；拉美匯率會直接搔動帳面數字。研究線索，非投資建議。", "ja": "新規銘柄。FirstCashは米国と中南米で3,343店の質屋を運営。無視の理由：ESG除外リストに入り低成長の消費者金融と見られている。変化：Q2は過去最高——売上10.7億ドル（+29%）、GAAP EPS2.12ドル（+58%）、質入れ債権+63%（既存店+22%）、営業CF6.73億ドルで年間347店純増。既存の1.5億ドル自社株買いを完了し新たに1.5億ドルを承認。リスクは消費者の困窮という読み、規制、中南米為替。投資勩奨ではない。", "url": "https://www.stocktitan.net/news/FCFS/first-cash-reports-record-second-quarter-operating-results-pawn-nry75dt7e0li.html", "status": "RADAR · 下一個驗證點 Q3 財報（看同店成長能否守住雙位數、新庫藏股的實際執行速度）"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "MQ新名字", "color": "#C9A227", "stocks": [{"t": "MQ", "n": "Marqeta，發卡基建平台；Q2 淨營收 1.76 億美元年增 17%、TPV +32%、調整 EBITDA 3,700 萬 +31%，連續兩季 GAAP 獲利"}], "en": "New name. Marqeta provides the card-issuing infrastructure behind other companies' payment products. Why ignored: it IPO'd into the 2021 fintech peak and spent years being repriced downwards, so it now sits in the \"broken IPO\" drawer that most funds do not reopen. What is changing: Q2 net revenue rose 17% to $176 million on 32% TPV growth, gross profit rose 17% to $122 million, adjusted EBITDA rose 31% to $37 million, and EPS of $0.07 landed far above the roughly breakeven consensus — a second consecutive quarter of GAAP profit. On 08/03 the board authorised a fresh $150 million buyback, having completed the previous programme. Risks: Q3 revenue guidance came in below expectations, growth is concentrated in a small number of large platform customers, and two straight profitable quarters is a short record. Research lead, not investment advice.", "zh": "新名字。Marqeta 提供的是藏在別人支付產品背後的發卡基建。為什麼被忽視：它在 2021 金融科技高點上市，之後多年一路被重新定價往下，現在被歸到「壞掉的 IPO」那個抽尜，大多數基金不會再打開。什麼正在改變：Q2 淨營收年增 17% 至 1.76 億美元（總支付金額 TPV +32%）、毛利 +17% 至 1.22 億、調整 EBITDA +31% 至 3,700 萬，EPS 0.07 美元遠高於幾乎損益兩平的市場預估，是連續第二季 GAAP 獲利。8/3 董事會在前一個計畫執行完畢後，再授權 1.5 億美元庫藏股。風險：Q3 營收指引低於市場預期；成長高度集中在少數幾個大型平台客戶；兩季獲利是很短的紀錄。研究線索，非投資建議。", "ja": "新規銘柄。Marqetaは他社の決済製品を支えるカード発行基盤。無視の理由：2021年のフィンテック高値圏で上場し、「壊れたIPO」の引き出しに入っている。変化：Q2純収益は17%増の1.76億ドル、TPV+32%、調整EBITDA+31%の3,700万ドル、EPS0.07ドルで２四半期連続GAAP黒字。8/3に1.5億ドルの新規自社株買いを承認。リスクはQ3指針の未達と顧客集中。投資勩奨ではない。", "url": "https://stockstory.org/us/stocks/nasdaq/mq/news/earnings/marqetas-nasdaqmq-q2-cy2026-sales-top-estimates-but-quarterly-revenue-guidance-misses-expectations", "status": "RADAR · 下一個驗證點 Q3 財報（看 GAAP 獲利能否連三季、庫藏股實際執行均價）"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "科技創紀錄", "color": "#6DB56D", "stocks": [{"t": "XLK", "n": "科技類股 ETF，成分股內部人買進家數今年創紀錄"}, {"t": "SMH", "n": "半導體 ETF，這波回檔最深的子族群"}], "en": "A record number of technology-company insiders have bought their own shares in 2026. Read that carefully before acting on it: insider buying is a valuation opinion from people who know the operations, but it is also the most over-interpreted signal in the market. A record count says the group as a whole thinks tech is cheaper than it was, not that any individual name is. The version worth acting on is narrower — large cash purchases, several executives at once, in a name the sell side has stopped covering.", "zh": "2026 年自行買回公司股票的科技公司內部人家數創下紀錄。但要看清楚再行動：內部人買進是一群懂營運的人給的估值意見，但也是市場上最容易被過度解讀的訊號。家數創紀錄只能說明這一群人集體認為科技股比之前便宜，不代表任何單一個股便宜。真正值得跟的版本窄得多：大金額現金買進、多位高管同時出手、而且發生在賣方已經不寫的公司身上。", "ja": "2026年はテック企業のインサイダー購入社数が過去最多。ただし解釈には注意——インサイダー購入は実態を知る人々のバリュエーション見解である一方、最も過大解釈されやすいシグナルでもある。価値があるのはもっと狭い形——大額の現金購入・複数役員の同時購入・カバレッジのない銘柄だ。", "url": "https://finance.yahoo.com/markets/article/a-record-number-of-tech-stock-insiders-are-buying-their-own-shares-in-2026-133810825.html"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "13F倒數", "color": "#6DB56D", "stocks": [{"t": "MSFT", "n": "機構持倉市值季增 120 億美元至 470 億，是統計中市值最大的持倉"}, {"t": "UNH", "n": "巴菲特、Tepper 等大戶集體加碼"}, {"t": "NFLX", "n": "同樣遭對沖基金大幅加碼的大型科技股"}], "en": "Q2 13F filings are due August 14 and the early ones are landing. Bloomberg's read across 716 funds shows total disclosed holdings at $726.54 billion versus $622.94 billion three months earlier, with hedge funds crowding back into megacap tech — Microsoft's aggregate position value grew $12 billion to $47 billion — and Buffett, Tepper and others adding UnitedHealth. Two health warnings: 13Fs are up to 45 days stale by the time you read them, and they show long equity only — no shorts, no options structure, no bonds. Use them to generate questions, never as a trade trigger.", "zh": "Q2 的 13F 申報截止日是 8/14，早交的已經陸續落地。彭博統計 716 檔基金的揭露持倉總額達 7,265.4 億美元，三個月前是 6,229.4 億；對沖基金又擠回大型科技股——微軟的合計持倉市值增加 120 億美元到 470 億；巴菲特、Tepper 等人則在加碼聯合健康。兩個警語：13F 到你手上時最多已經落後 45 天；而且它只揭露多頭股票部位——沒有空單、沒有選擇權結構、沒有債券。它適合拿來產生問題，不適合拿來當扳機。", "ja": "Q2の13Fは8月14日期限で、早いものから届き始めている。716ファンドの開示保有額は7,265.4億ドル（3カ月前6,229.4億）。ヘッジファンドは大型テックに回帰し、MSFTの保有額は120億ドル増の470億ドル。注意点は二つ——最大45日のラグと、ロングの株式しか見えないこと。問いを作るための資料であり、売買の引き金ではない。", "url": "https://whalewisdom.com/"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "授權≠執行", "color": "#6DB56D", "stocks": [{"t": "ICFI", "n": "ICF International，6/25 授權 1 億美元庫藏股約當流通股 8.1%，1-6 月已實際買回 43.5 萬股、2,900 萬美元"}, {"t": "SONO", "n": "Sonos，3-6 月買回 199 萬股、3,014 萬美元，累計已買回 1.1532 億"}, {"t": "MQ", "n": "Marqeta，8/3 在前一個計畫執行完畢後再授權 1.5 億美元"}], "en": "Buyback announcements are the most abused management signal, so here is the filter: an authorisation is permission, not a promise, and boards routinely announce and then buy nothing. What separates signal from theatre is the 10-Q line showing shares actually retired. Three current examples sit at different points on that spectrum — ICF International authorised $100 million (about 8.1% of shares) and had already bought $29 million in the first half; Sonos has executed $115.32 million cumulatively including $30.14 million between March and June; Marqeta's new $150 million follows a completed prior programme, which is the best kind of precedent. Always check execution before you credit the announcement.", "zh": "庫藏股公告是管理層訊號裡被濾用最嚴重的一種，所以這裡給一個過濾器：授權是「許可」而非「承諾」，董事會宣布了却一股也沒買的例子比比皆是。區分訊號與演出的，是 10-Q 裡那一行實際買回股數。目前三個例子分別落在這條光譜的不同位置：ICF International 授權 1 億美元（約流通股 8.1%）且上半年已實買 2,900 萬；Sonos 累計已執行 1.1532 億，其中 3-6 月就花了 3,014 萬；Marqeta 的新 1.5 億授權是在前一個計畫執行完畢後才提出——這是最好的那種前科。先檢查執行率，再相信公告。", "ja": "自社株買いの発表は最も乱用されるシグナルだ。承認は「許可」であって「約束」ではない。見分けるのは10-Qの実際の取得株数だ。ICFは1億ドル（発行済株の約8.1%）を承認し上半期に2,900万ドルを実行、Sonosは累計1.1532億ドル、Marqetaは既存計画完了後に新規1.5億ドル。発表より先に実行率を見よ。", "url": "https://simplywall.st/stocks/us/consumer-durables/nasdaq-sono/sonos/news/discover-august-2026s-undervalued-small-caps-with-insider-bu/amp"},
    {"id": "week_0", "channel": "本週事件", "tag": "周五非農", "color": "#C97DD4", "stocks": [{"t": "SPY", "n": "非農與 CPI 是 9/16 FOMC 前的兩個關鍵輸入，大盤首當其衝"}, {"t": "TLT", "n": "長端公債，對這兩份數據的反應會比股市直接"}], "en": "Friday 08/07 at 8:30am ET brings the July employment report. Forecasts range from 80,000 to 120,000 payrolls, with unemployment seen unchanged at 4.2% and average hourly earnings at 3.5% year on year. ADP's 44,000 private-sector print on Wednesday sets a soft tone into it. Then CPI lands 08/12. Those two releases are the core data set for the September 16 FOMC, where a hike is currently 61.9% priced. If payrolls come in weak and CPI hot, the market has to choose which one the Fed is listening to — and that is when positioning gets tested.", "zh": "週五 08/07 美東時間早上 8:30 公布 7 月就業報告。市場預估非農新增落在 8 萬到 12 萬之間，失業率預期持平 4.2%、平均時薪年增 3.5%。週三 ADP 的 4.4 萬已經先定了偏弱的調性。接著 08/12 是 CPI。這兩份數據就是 9/16 FOMC 的核心依據，而目前升息機率已定價到 61.9%。如果非農弱、CPI 却熱，市場就必須選邊站——猜 Fed 到底在聽哪一個，那才是部位真正被測試的時刻。", "ja": "金曜8月7日米東時刍8時30分に7月雇用統計。非農部門は8万～12万人、失業率は4.2%据え置き、平均時給は前年比3.5%の見通し。水曜のADP4.4万人が弱いトーンを作った。8月12日にCPI。この二つが9月16日FOMC（利上げ確率61.9%）の中核資料だ。雇用が弱くCPIが高ければ、市場はどちらをFOMCが見るかを選ばざるを得ない。", "url": "https://continuumeconomics.com/a/6815e0e3/preview-due-august-7-us-july-employment-non-farm-payrolls-stronger-than-june-but-with-a-rise-in-unemployment"},
    {"id": "week_1", "channel": "本週事件", "tag": "財報尾聲", "color": "#C97DD4", "stocks": [{"t": "ALLT", "n": "Allot，8/12 美東時間上午 8:30 公布 Q2 —— 雷達池內下一個到期的驗證點"}], "en": "Earnings season is thinning out after Wednesday's 351-company crush, which changes what moves prices next week: macro data takes over from company results. Two dates matter for this feed's own watchlist — 08/12 brings Allot's Q2 at 8:30am ET, the test of whether the profit growth that justified its $40 million buyback authorisation is real, and 08/14 is the 13F deadline, when the full picture of Q2 institutional positioning becomes visible. Between now and then, payrolls and CPI are the whole story.", "zh": "在週三 351 家公司的大塞車之後，財報季進入尾聲，這也改變了下週推動價格的東西：總經數據從公司財報手中接過主導權。對這份雷達池而言有兩個日子要記：08/12 美東時間上午 8:30 Allot 公布 Q2，這是驗證「支撐它 4,000 萬美元庫藏股授權的獲利成長是否真實」的那一季；08/14 則是 13F 申報截止日，Q2 機構部位的全貌到那天才會齊。在那之前，非農與 CPI 就是全部的故事。", "ja": "水曜の351社の集中発表を経て決算シーズンは終盤へ。来週は決算ではなくマクロ指標が相場を動かす。このレーダーにとっての重要日は二つ——8/12米東時間午前8:30のAllotのQ2（4,000万ドルの自社株買いを支える利益成長の検証）と、8/14の13F提出期限。それまでは雇用統計とCPIがすべてだ。", "url": "https://www.tipranks.com/news/these-are-the-stocks-reporting-earnings-today-august-5-2026"},
    {"id": "eval_0", "channel": "今日評估", "tag": "今日一件事", "color": "#E8A838", "stocks": [{"t": "ERII", "n": "驗證失敗的那一檔：營收年減 57.2%、miss 36.3%"}, {"t": "HDSN", "n": "同一晚交卷、量過關但價沒過關的那一檔"}], "en": "The most useful thing that happened yesterday was not the Dow record — it was two radar names reporting on the same night and splitting. Hudson beat on revenue and failed on margin; Energy Recovery missed revenue by 36.3% and swung to negative EBITDA. Both were flagged in advance with specific tests, which is the only reason today's read is information rather than hindsight. Setting the verification point before the event is what separates a watchlist from a wish list. Question to sit with: when a thesis fails its own stated test, what is your rule for how long the name stays on the list — and have you ever written that rule down?", "zh": "昨天最有用的一件事不是道瓊創高，而是兩檔雷達股同一晚交卷、而且結果分歧。Hudson 營收過關、毛利沒過關；Energy Recovery 營收低於預期 36.3%、EBITDA 轉負。兩檔都是事前就標好驗證點、列好檢查項目的——正因為如此，今天的讀數才叫資訊，而不是事後論。先設驗證點再等結果，這件事本身就是「觀察名單」與「願望清單」的分界線。留一個問題給你：當一個論點沒過它自己訂的檢驗，你的規則是讓它在名單上再待多久？而你曾經把這條規則寫下來過嗎？", "ja": "昨日最も有益だったのはダウの最高値ではなく、レーダー二銘柄が同じ夜に決算を出し結果が分かれたことだ。Hudsonは売上合格・利益率不合格、Energy Recoveryは売上36.3%未達でEBITDA赤字転落。事前に検証日と項目を決めていたからこそ、今日の読みは情報になる。問い：論点が自らの検証に落ちたとき、あなたはどれだけリストに残すルールを持っているか？", "url": "https://markets.financialcontent.com/stocks/article/stockstory-2026-8-5-energy-recovery-nasdaqerii-misses-q2-cy2026-revenue-estimates-stock-drops", "status": "今日討論 · 按下方討論鍵跟 Claude 繼續聊"},

const DISCUSS_PROMPT = "我剛讀完 2026-08-06 的 Mo's Feed 財經晨報(9 額道 30 卡)。今天重點:(1)隔夜市場裂成兩半——道瓊 +263 點再創高 54,349，標普 500 盤中創高後轉跌 0.17%、那斯達克 -0.83% 四連漲告終;(2)伊朗與阿曼就荷莫茲海峽達成諠解、聯合聲明定稿中，布蘭特兩日內從 84 美元下來到 79.15，能源股今年 +22% 裡有多少是恐懼溢價要重算;(3)這季的獼懲是不對稱的——AMD 上下超預期、Q3 指引也超預期，盤後仍跌 8.8%；SpaceX 營收 +92% 却因資本支出 184 億而跌；禮來 EPS 超預期 27% 也守不住盤中漲幅;(4)30 年期公債殖利率突破 5.24% 創 2007 來新高、9 月升息機率 61.9%，但 ADP 七月民間就業只增 4.4 萬——就業降溫與鷹派定價同時存在;(5)羅素 2000 年內 +20% 是 2003 來最強，但不賺錢的小型股自 2025 年中漲 154%、賺錢的只漲 34%，而小型股的浮動利率債務比重高，升息會傳導兩次;(6)雷達池今日最重要的是兩場驗證：HDSN 營收 7,835 萬過關但營業利益率從 17.5% 掘到 9.4%、EPS miss 32.4%；ERII 則彻底失敗——營收 1,200 萬年減 57.2%、低於預期 36.3%、EBITDA 轉負。新名字三檔:WEX(整個高管團短期內群聚買進，股價五年跌 30%)、FCFS(當鋪連鎖紀錄季，債權 +63%、新 1.5 億庫藏股)、MQ(連兩季 GAAP 獲利、8/3 新 1.5 億授權，但 Q3 指引低於預期)。請跟我討論:今天哪一條最值得追?ERII 驗證失敗之後，你會怎麼訂「什麼時候把一檔股從雷達池拿掉」的規則?新名字三檔裡哪一個證據最強、哪一個最弱?最大的矛盾仍然是股市創高與 30 年期殖利率 5.24% 並存，而週五非農是第一個裁判——你怎麼看?雷達池在 Notion:https://app.notion.com/p/6ae9be8507e24aaf85a9a8af4b69fcf0";

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文、展開日本語=日文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>

  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'ja' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'ja', ja:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : playLang === 'ja' ? (card.ja || card.en) : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : playLang === 'ja' ? `${i + 1}／${total}。`
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/06/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v6.5</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English",ja:"日本語"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN",ja:"日"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English",ja:"日本語"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
