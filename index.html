/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;

    --noise-opacity: 0.035;

  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }

  @keyframes fadeInOut {

    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }

  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }

  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }

  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }
  .source-link { position: relative; display: inline-block; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }

  {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "輪動分歧", "color": "#E05C5C", "zh": "這次反彈的另一面是輪動：微軟（MSFT）-2.3%、Meta -2.0%、亞馬遜 -1.7% 回吐，消費與房市相關股也偏弱，如 Airbnb -3.1%、Lululemon -2.7%、麥當勞 -2.6%、NVR -2.3%。資金從大型平台股與利率敏感的消費股，轉向晶片、記憶體與 AI 雲端。前一週標普出現 2025 年 4 月以來最差單週，那斯達克還曾單日重挫逾 5%，所以這一天只能算修復，不是趨勢確立。", "en": "The flip side was rotation: Microsoft fell 2.3%, Meta 2.0% and Amazon 1.7%, while consumer and housing-linked names lagged, including Airbnb -3.1%, Lululemon -2.7%, McDonald's -2.6% and NVR -2.3%. Money moved from mega-cap platforms and rate-sensitive consumer stocks into chips, memory and AI cloud. With the prior week the S&P's worst since April 2025 and a single-day Nasdaq drop of over 5%, this looks like a repair, not a confirmed trend.", "url": "https://www.investing.com/news/stock-market-news/us-stock-futures-tick-higher-after-wall-st-slips-on-hot-cpi-nvidia-losses-5017417", "stocks": [{"t": "MSFT", "n": "約 -2.3%，大型平台股回吐"}, {"t": "META", "n": "約 -2.0%"}, {"t": "ABNB", "n": "約 -3.1%，消費旅宿偏弱"}, {"t": "MCD", "n": "約 -2.6%，防禦消費也下跌"}, {"t": "NVR", "n": "約 -2.3%，房建商受高殖利率壓力"}]},
  {"id": "earn_0", "channel": "財報速報", "tag": "CoreWeave", "color": "#E8786A", "zh": "CoreWeave 週三盤前公布第三季：營收 36.6 億美元優於預期，每股虧損 1.27 美元小於市場預估，並把全年營收預測訂在 130 億至 133 億美元、高於分析師共識。公司說營收年增約 168%，預計約 90 億美元的客戶預付款，並且在 2027 年前不會再借更貴的債，直接回應市場對它約 500 億美元債務的疑慮。股價收漲約 24.7%，帶動 Nebius、Bloom Energy 等同類股。", "en": "CoreWeave reported Q3 before the open on Wednesday: revenue of $3.66 billion beat estimates, the loss per share of $1.27 was smaller than expected, and full-year revenue guidance of $13.0-13.3 billion came in above consensus. It cited roughly 168% revenue growth, about $9 billion in expected customer prepayments and no more expensive debt through 2027, directly addressing worries about its roughly $50 billion debt load. The stock closed up about 24.7% and lifted peers such as Nebius and Bloom Energy.", "url": "https://www.investing.com/news/stock-market-news/us-stock-futures-tick-higher-after-wall-st-slips-on-hot-cpi-nvidia-losses-5017417", "stocks": [{"t": "CRWV", "n": "營收 36.6 億美元、全年預測 130 至 133 億美元"}, {"t": "NBIS", "n": "同業跟漲約 15.4%，週四盤前公布財報"}, {"t": "BE", "n": "電力供應股，盤中曾漲約 16%"}]},
  {"id": "earn_1", "channel": "財報速報", "tag": "下修案例", "color": "#E8786A", "zh": "醫材公司 Orthofix（OFIX）週一公布第三季，營收約 2.08 億美元，GAAP 每股虧損 0.15 美元，並把全年營收預測從 8.45 億至 8.55 億美元下修到 8.25 億至 8.30 億美元，調整後 EBITDA 預測從 9,500 萬至 9,800 萬美元降到 8,600 萬至 8,800 萬美元。主因是美國脊椎業務疲弱、經銷商通路摩擦，加上海外肢體重建訂單時程；Q4 要全面推出 VIRATA 脊椎固定系統。這是本週最清楚的「基本面下修」案例，也提醒財報季不全是 AI 好消息。", "en": "Orthofix reported Q3 on Monday: revenue was about $207.9 million with a GAAP loss of $0.15 per share, and it cut full-year sales guidance from $845-855 million to $825-830 million and adjusted EBITDA guidance from $95-98 million to $86-88 million. It blamed weak US Spine, distributor-channel friction and the timing of international limb-reconstruction orders, and plans a full US launch of its VIRATA spinal fixation system in Q4. It is this week's clearest fundamentals-cut example, a reminder that earnings season is not all AI good news.", "url": "https://finviz.com/news/418928/orthofix-reports-third-quarter-2026-results-and-revises-full-year-2026-guidance", "stocks": [{"t": "OFIX", "n": "全年營收預測下修至 8.25 至 8.30 億美元"}, {"t": "SPNE", "n": "同為脊椎醫材產業，可作對照"}, {"t": "XLV", "n": "醫療保健板塊 ETF"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "今晚重頭戲", "color": "#E8786A", "zh": "週四有兩個重頭戲：Cisco 與應用材料（AMAT）盤後公布財報，Cisco 市場預期每股約 1.32 美元、營收約 181 億美元（另一來源給 1.15 美元，估值不一致），AMAT 預期每股約 4.06 美元。AI 資料中心網通需求是看 Cisco 的重點，AMAT 則看晶片設備訂單能否延續本週半導體的強勢。Nebius 在週四盤前公布，同日還有默克、Nu Holdings、Brookfield 等。", "en": "Thursday has two main events: Cisco and Applied Materials report after the close. Cisco is expected to earn about $1.32 per share on about $18.1 billion of revenue (another source says $1.15, so estimates disagree) and AMAT about $4.06 per share. For Cisco the focus is AI data-center networking demand; for AMAT, whether chip-equipment orders can sustain this week's semiconductor strength. Nebius reports before the open, and Merck, Nu Holdings and Brookfield also report the same day.", "url": "https://www.openingbelldailynews.com/p/stock-market-week-ahead-nov-9-2026", "stocks": [{"t": "CSCO", "n": "盤後公布，預期每股約 1.32 美元"}, {"t": "AMAT", "n": "盤後公布，預期每股約 4.06 美元"}, {"t": "NBIS", "n": "盤前公布"}, {"t": "NU", "n": "週四公布，拉美數位銀行"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "CPI 偏熱", "color": "#7C6AF7", "zh": "10 月 CPI 月增 0.4%，高於預期的 0.3%；核心 CPI 月增 0.3%，高於預期的 0.2%，已是連續第三次向上驚喜。2 年期殖利率週二大漲 17 個基點到 4.74%，10 年期漲 11 個基點到約 4.99% 並一度站上 5%，10 年期公債拍賣的需求是 6 月初以來最弱，MOVE 債券波動指數升到 92.44。這是週二股市下跌、週三才靠 AI 股反彈的背景。", "en": "October CPI rose 0.4% month on month versus 0.3% expected, and core CPI rose 0.3% versus 0.2%, a third straight upside surprise. The 2-year yield jumped 17bp to 4.74% on Tuesday and the 10-year rose 11bp to about 4.99%, briefly topping 5%; the 10-year auction drew the weakest demand since early June and the MOVE index rose to 92.44. That is the backdrop for Tuesday's selloff and the AI-led rebound on Wednesday.", "url": "https://www.home.saxo/en-sg/content/articles/macro/market-quick-take---us-treasury-yields-rip-higher---11-november-2026-11112026", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，殖利率上升時價格承壓"}, {"t": "IEF", "n": "7 至 10 年期公債 ETF"}, {"t": "KRE", "n": "區域銀行 ETF，對利率走勢敏感"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "升息定價", "color": "#7C6AF7", "zh": "Fed 理事 Waller 支持 12 月升息 1 碼（25 個基點），並且不排除升 2 碼；達拉斯聯銀總裁 Logan 認為至少還要再升兩次。市場目前幾乎完全定價 12 月升息，加上明年 6 月前再升兩次，升 2 碼的機率約 13%。下一次 FOMC 在 12 月 8 日至 9 日，之前還有週五的 10 月 PPI，是下一個會改變定價的數據。", "en": "Fed Governor Waller backed a 25bp hike in December and did not rule out 50bp, while Dallas Fed President Logan called for at least two more hikes. Markets now almost fully price a December hike plus two more by June, with roughly 13% odds of a 50bp move. The next FOMC meeting is December 8-9, and Friday's October PPI is the next data point that could shift pricing.", "url": "https://www.home.saxo/en-sg/content/articles/macro/market-quick-take---us-treasury-yields-rip-higher---11-november-2026-11112026", "stocks": [{"t": "XLF", "n": "金融板塊 ETF，升息週期中的淨利差題材"}, {"t": "SHY", "n": "短天期公債 ETF，對政策利率最敏感"}, {"t": "IWM", "n": "小型股 ETF，浮動利率債務較多"}]},
  {"id": "macro_2", "channel": "總經政策", "tag": "匯率警戒", "color": "#7C6AF7", "zh": "美元隨殖利率走強：美元兌日圓升回 158.5 以上、逼近 159 的關鍵壓力區，干預風險持續被討論；歐元一度從 1.1251 跌到 1.1150 下方，英鎊從 1.3459 掉到 1.3350 下方，澳幣測試 0.6850 以下、是今年初以來低點。強美元加上 5% 殖利率，對海外營收占比高的美股與新興市場都是逆風，這是 AI 股反彈之外值得留意的另一條線。", "en": "The dollar strengthened with yields: USD/JPY returned above 158.5 and neared the key 159 resistance zone with intervention risk in focus; EUR/USD fell from 1.1251 to below 1.1150, GBP/USD slid from 1.3459 to below 1.3350 and AUD/USD tested below 0.6850, its lowest since early this year. A strong dollar plus 5% yields is a headwind for US companies with heavy overseas revenue and for emerging markets, a thread worth watching alongside the AI rebound.", "url": "https://www.home.saxo/en-sg/content/articles/macro/market-quick-take---us-treasury-yields-rip-higher---11-november-2026-11112026", "stocks": [{"t": "UUP", "n": "美元指數 ETF"}, {"t": "EWJ", "n": "日本股市 ETF，日圓貶值與干預議題"}, {"t": "EEM", "n": "新興市場 ETF，強美元壓力"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "記憶體", "color": "#4EABA4", "zh": "記憶體與儲存族群是週三最強的板塊：閃迪（SNDK）、美光（MU）與 SK 海力士各漲逾 10%。亞洲市場先反映：台積電（TSM）公布 10 月營收年增 59.7%、股價漲約 3.1%，台灣加權指數大漲 3.6%、韓國 Kospi 漲 2.4%。需要留意的是記憶體漲價對下游不是好事，例如 Sonos 就說記憶體成本讓 Q3 調整後 EBITDA 少約 1,400 萬美元。", "en": "Memory and storage was Wednesday's strongest group: SanDisk, Micron and SK Hynix each gained more than 10%. Asia moved first: TSMC reported October revenue up 59.7% year on year and rose about 3.1%, while Taiwan's Taiex jumped 3.6% and Korea's Kospi 2.4%. Note that higher memory prices hurt downstream makers; Sonos, for example, said memory costs cut its Q3 adjusted EBITDA by about $14 million.", "url": "https://www.home.saxo/en-sg/content/articles/macro/market-quick-take---us-treasury-yields-rip-higher---11-november-2026-11112026", "stocks": [{"t": "MU", "n": "約 +11.9%，記憶體龍頭"}, {"t": "SNDK", "n": "約 +13.7%，快閃記憶體與儲存"}, {"t": "TSM", "n": "10 月營收年增 59.7%"}, {"t": "SONO", "n": "下游受害例：記憶體成本壓縮獲利"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "AI 雲端與電力", "color": "#4EABA4", "zh": "AI 基礎設施的熱度延伸到雲端租賃與供電：Nebius、CoreWeave 領漲，Bloom Energy（BE）盤中漲約 16%、被視為資料中心電力題材，戴爾（DELL）漲約 11.8%、Lumentum（LITE）漲約 10.7%。報導同時指出，Anthropic 傳出 IPO 籌資約 644 億美元、估值最高約 1.4 兆美元且已多倍超額認購，OpenAI 單季營收首度達 100 億美元，這些消息推升了 AI 需求的敘事，但都是媒體報導，非公司公告。", "en": "AI infrastructure enthusiasm spread to cloud rental and power: Nebius and CoreWeave led, Bloom Energy rose about 16% intraday as a data-center power play, Dell gained about 11.8% and Lumentum about 10.7%. Reports also said Anthropic is aiming to raise about $64.4 billion in an IPO at up to a $1.4 trillion valuation and is multiple times oversubscribed, and that OpenAI booked $10 billion of quarterly revenue for the first time; these boosted the AI-demand narrative but are media reports, not company announcements.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-wednesday-november-11-dow-sp-500-nasdaq-nvidia-treasurys-veterans-day-140638547.html", "stocks": [{"t": "BE", "n": "燃料電池供電，盤中約 +16%"}, {"t": "NBIS", "n": "AI 雲端，約 +15.4%"}, {"t": "LITE", "n": "光通訊元件，約 +10.7%"}, {"t": "DELL", "n": "AI 伺服器，約 +11.8%"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "利率敏感股", "color": "#4EABA4", "zh": "反彈之外，利率敏感與防禦型個股並沒有受惠：房建商 NVR 跌約 2.3%、食品股 Conagra 約 -2.4%、烈酒的 Brown-Forman 約 -2.3%、國防服務商 Leidos 約 -2.4%、麥當勞約 -2.6%。10 年期殖利率貼著 5% 又加上升息預期，房建、必需消費這類股利與房貸敏感的產業評價承壓。不同產業的跌因各異，這裡只描述同日走勢，沒有證據顯示是單一原因。", "en": "Rate-sensitive and defensive stocks did not join the bounce: homebuilder NVR fell about 2.3%, Conagra about 2.4%, Brown-Forman about 2.3%, defense services firm Leidos about 2.4% and McDonald's about 2.6%. With the 10-year hugging 5% and rate hikes in the pricing, valuations of dividend- and mortgage-sensitive groups such as homebuilding and staples are under pressure. The causes differ by industry; this only describes same-day moves and does not prove a single driver.", "url": "https://www.investing.com/news/stock-market-news/us-stock-futures-tick-higher-after-wall-st-slips-on-hot-cpi-nvidia-losses-5017417", "stocks": [{"t": "NVR", "n": "房建商，約 -2.3%"}, {"t": "CAG", "n": "包裝食品，約 -2.4%"}, {"t": "BF.B", "n": "烈酒，約 -2.3%"}, {"t": "LDOS", "n": "國防與政府 IT 服務，約 -2.4%"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "R2K 落後", "color": "#5B8ED6", "zh": "羅素 2000 週三漲 0.88% 至 2,846.26，落後標普的約 1.3% 與那斯達克的 1.6%；因為這次反彈由 AI 大型股主導，小型股的參與度偏低。今年以來羅素 2000 約 +13%，仍高於標普約 +10%。小型股對 5% 的 10 年期殖利率特別敏感，因為它們的浮動利率債務比例較高；升息預期若持續，這個領先優勢是第一個會受考驗的地方。", "en": "The Russell 2000 rose 0.88% to 2,846.26 on Wednesday, lagging the S&P's roughly 1.3% and the Nasdaq's 1.6% because the bounce was led by AI mega-caps. It is still up about 13% this year against about 10% for the S&P. Small caps are especially sensitive to a 5% 10-year yield since they carry more floating-rate debt, so their lead is the first thing a persistent rate-hike outlook would test.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-wednesday-november-11-dow-sp-500-nasdaq-nvidia-treasurys-veterans-day-140638547.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，約 +0.9%"}, {"t": "IJR", "n": "標普小型 600 ETF，品質篩選較嚴"}, {"t": "KRE", "n": "區域銀行 ETF"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "財報後上攻", "color": "#5B8ED6", "zh": "財報後本月漲幅最突出的幾檔：Ardent Health（ARDT）本月約 +49%，EPS 0.31 美元對預期 0.23 美元，營收 16.2 億美元；Bob's Discount Furniture（BOBS）約 +28%，EPS 0.28 美元、營收 6.804 億美元年增 10.3%；Kyndryl（KD）約 +25%，EPS 0.42 美元對 0.38 美元。注意這些是整個 11 月的累計漲幅，來源是推廣性質的選股專欄，不是單日催化劑，也不是追價建議。", "en": "Month-to-date standouts after earnings: Ardent Health (ARDT) up about 49% on EPS of $0.31 versus $0.23 expected and revenue of $1.62 billion; Bob's Discount Furniture (BOBS) up about 28% on EPS of $0.28 and revenue of $680.4 million, up 10.3%; Kyndryl (KD) up about 25% on EPS of $0.42 versus $0.38. These are November-to-date gains from a promotional stock-pick column, not one-day catalysts, and not a reason to chase.", "url": "https://www.investing.com/news/stock-market-news/we-told-you-first-these-aipicked-smallcap-stocks-are-up-49-and-28-mtd-5018176", "stocks": [{"t": "ARDT", "n": "醫院營運商，本月約 +49%"}, {"t": "BOBS", "n": "家具零售，本月約 +28%"}, {"t": "KD", "n": "IT 基礎設施服務，本月約 +25%"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "量子分歧", "color": "#5B8ED6", "zh": "同一賽道的兩檔小型股，財報反應完全相反：D-Wave（QBTS）每股虧損高於預期，但營收年增 21%、訂單（bookings）暴增 611%，股價仍上漲；Rigetti（RGTI）營收只有約 140 萬美元，遠低於預期約 350 萬美元，股價下跌。市場對量子公司付錢的是「訂單與商業化進度」，不是技術敘事。兩檔都屬高波動、尚未穩定獲利的標的，這裡只談財報反應。", "en": "Two small caps in the same theme reacted in opposite ways: D-Wave missed on EPS but revenue grew 21% and bookings jumped 611%, and the stock rose; Rigetti's revenue of about $1.4 million badly missed the roughly $3.5 million estimate and the stock fell. The market is paying quantum companies for orders and commercialization progress, not the technology story. Both are highly volatile and not yet reliably profitable; this only covers the earnings reactions.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-wednesday-november-11-dow-sp-500-nasdaq-nvidia-treasurys-veterans-day-140638547.html", "stocks": [{"t": "QBTS", "n": "營收 +21%、訂單 +611%，股價上漲"}, {"t": "RGTI", "n": "營收約 140 萬美元，不及預期約 350 萬"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "半導體設備", "color": "#5B8ED6", "zh": "半導體設備小型股 Axcelis（ACLS）財報後一週內約漲 15.9%，同一份名單裡還有 Consensus Cloud Solutions（CCSI）：第三季 EPS 1.50 美元，高於預期的 1.44 美元，營收約 9,100 萬美元。Axcelis 這類設備商的特點是營收跟客戶資本支出週期走，波動大；CCSI 則是傳真與文件雲服務，成長慢但現金流穩定，兩者估值邏輯完全不同，放在一起看小型股不能只用一個框架。", "en": "Semiconductor-equipment small cap Axcelis (ACLS) rose about 15.9% in the week after earnings, and the same list includes Consensus Cloud Solutions (CCSI), whose Q3 EPS of $1.50 beat the $1.44 consensus on revenue of about $91 million. Equipment makers like Axcelis follow customer capex cycles and are volatile; CCSI, a fax and document cloud service, grows slowly with steady cash flow. Their valuation logic is entirely different, a reminder that small caps cannot be read with one framework.", "url": "https://www.investing.com/news/stock-market-news/we-told-you-first-these-aipicked-smallcap-stocks-are-up-49-and-28-mtd-5018176", "stocks": [{"t": "ACLS", "n": "離子植入設備，財報後一週約 +15.9%"}, {"t": "CCSI", "n": "EPS 1.50 美元，高於預期 1.44 美元"}]},
  {"id": "small_4", "channel": "小型股風雲", "tag": "判讀知識", "color": "#5B8ED6", "zh": "判讀小型股財報漲幅有三個常見陷阱：第一，「本月漲幅」不等於「財報當日反應」，推廣型專欄常挑累計最大的；第二，小型股成交量小，同樣的買盤會讓價格波動被放大，單日 +20% 不代表基本面等比例改善；第三，每個池子的組成不同，羅素 2000 含大量未獲利公司，標普小型 600 要求獲利，兩者表現會分歧。看到暴漲，先查是營收、訂單還是一次性項目。", "en": "Three common traps in reading small-cap earnings gains: first, month-to-date gains are not earnings-day reactions, and promotional columns pick the biggest cumulative winners; second, thin volume amplifies price moves, so a +20% day does not mean fundamentals improved by the same amount; third, indexes differ, as the Russell 2000 includes many unprofitable companies while the S&P SmallCap 600 requires profits, so they diverge. When you see a spike, check whether it came from revenue, orders or a one-off item.", "url": "https://www.cnbc.com/2026/11/10/baron-capital-small-cap-stock-picks.html", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，含大量未獲利公司"}, {"t": "IJR", "n": "標普小型 600 ETF，要求獲利"}]},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "Mission Produce", "color": "#C9A227", "zh": "Mission Produce（AVO）是全球酪梨的採購、催熟與配銷商，市值小、分析師覆蓋有限。2026 年大股東 Holdings Venture Globalharvest 持續買進：1 月買進 985,704 股、均價約 11.76 美元，7 月 9 日再買 592,957 股，另有董事 Jay Pack 在 6 月底買進 4 萬股約 48.4 萬美元，公司也授權 1 億美元庫藏股；不過執行長在 6 月底賣出 5,000 股。反方論點是財報偏弱：2026 會計年度第二季營收年減 26.1%，Zacks 預估本年度盈餘年減約 35%，下一年度才反彈。這是研究線索，不是投資建議。資料多為 7 月前，請以最新報價與財報為準。", "en": "Mission Produce (AVO) sources, ripens and distributes avocados globally, with a small market cap and limited coverage. In 2026 major shareholder Holdings Venture Globalharvest kept buying: 985,704 shares in January at about $11.76, and another 592,957 on July 9; director Jay Pack bought 40,000 shares (about $484,000) in late June, and a $100 million buyback is authorized, though the CEO sold 5,000 shares in late June. The counter-argument is weak earnings: fiscal Q2 revenue fell 26.1% and Zacks expects this year's earnings to drop about 35% before rebounding next year. This is a research lead, not investment advice. Most data predates July; check current prices and filings.", "url": "https://www.marketbeat.com/instant-alerts/insider-buying-mission-produce-nasdaqavo-major-shareholder-buys-592957-shares-2026-07-10/", "stocks": [{"t": "AVO", "n": "酪梨供應鏈，大股東連續買進"}], "status": "RADAR · 下一個驗證點 下一次財報與大股東申報"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "Six Flags", "color": "#C9A227", "zh": "Six Flags Entertainment（FUN）是北美主題樂園業者，與 Cedar Fair 合併後仍有整合與負債疑慮。拐點線索有兩條：H Partners 創辦人 Rehan Jaffer 依合作協議在 5 月股東會後進入董事會，並在 6 月中買進 12.5 萬股、約 296 萬美元，另一位董事 John Reilly 8 月以 15.80 美元買 15,713 股；第三季（11 月 5 日公布）報導每股盈餘 2.70 美元，高於預期 1.97 美元，但這個數字來自單一資料站，需要對照公司公告。風險是天氣、消費支出與槓桿。這是研究線索，不是投資建議。", "en": "Six Flags Entertainment (FUN) is a North American theme-park operator that still carries merger-integration and leverage concerns after combining with Cedar Fair. Two signals: H Partners founder Rehan Jaffer joined the board after the May annual meeting under a cooperation agreement and bought 125,000 shares (about $2.96 million) in mid-June, while director John Reilly bought 15,713 shares at $15.80 in August; Q3 (reported November 5) was reported at EPS of $2.70 versus $1.97 expected, but that comes from a single data site and should be checked against the company release. Risks are weather, consumer spending and leverage. This is a research lead, not investment advice.", "url": "https://www.quiverquant.com/news/SIX+FLAGS+ENTERTAINMENT+%28%24FUN%29+Releases+Q3+2026+Earnings", "stocks": [{"t": "FUN", "n": "主題樂園，激進投資人進董事會與董事買進"}], "status": "RADAR · 下一個驗證點 旺季假期與 2027 指引"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "Aehr Test", "color": "#C9A227", "zh": "Aehr Test Systems（AEHR）做晶片老化測試設備，客戶集中在 AI 處理器廠商。拐點證據很具體：來自一家超大規模雲端客戶的 4,100 萬美元後續訂單，被稱為公司史上最大，另有 2,200 萬美元後續訂單，且 2027 會計年度營收預期成長 160% 至 200%。但這檔已不算「被忽視」：過去一年股價約漲 484%，一位副總也賣出股票，客戶集中是最大風險。放在雷達是為了追蹤「還沒被忽視的邊緣」在哪裡。這是研究線索，不是投資建議。", "en": "Aehr Test Systems (AEHR) makes burn-in test equipment for chips, with customers concentrated among AI processor makers. The evidence is concrete: a $41 million follow-on order from a hyperscale cloud customer, described as the largest in company history, plus a $22 million follow-on, and fiscal 2027 revenue growth guided at roughly 160-200%. But it is no longer neglected: shares are up about 484% over the past year, a vice president sold stock, and customer concentration is the key risk. It stays on the radar to track where the edge of being overlooked ends. This is a research lead, not investment advice.", "url": "https://app.sentisense.ai/stories/aehr-test-systems-receives-ai-related-follow-on-order-evp-sells-shares-08122026", "stocks": [{"t": "AEHR", "n": "老化測試設備，大額 AI 訂單"}], "status": "RADAR · 下一個驗證點 下一季財報與新訂單"},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "Sonos", "color": "#C9A227", "zh": "Sonos（SONO）是無線音響品牌，曾因產品與軟體失誤被冷落。7 月 29 日公布的第三季營收 3.75 億美元年增 9%，調整後 EBITDA 4,400 萬美元年增 24%，非 GAAP 每股盈餘 0.27 美元高於預期 0.24 美元，全年 EBITDA 預期 1.81 億美元；財報後股價約漲 46%（Zacks）。風險有兩個：GAAP 結果含 2,320 萬美元關稅退款，以及記憶體成本讓第四季毛利再少約 3,500 萬美元，正好呼應本週記憶體族群的漲價。這是研究線索，不是投資建議。", "en": "Sonos (SONO) is a wireless-audio brand that was long out of favor after product and software missteps. Fiscal Q3 (reported July 29) revenue was $375 million, up 9%, adjusted EBITDA $44 million, up 24%, and non-GAAP EPS $0.27 versus $0.24 expected, with full-year EBITDA guided to $181 million; shares rose about 46% after the report (Zacks). Two risks: GAAP results include $23.2 million of tariff refunds, and memory costs are expected to cut Q4 gross profit by about $35 million, which ties to this week's memory rally. This is a research lead, not investment advice.", "url": "https://www.businesswire.com/news/home/20260729559143/en/Sonos-Reports-Third-Quarter-Fiscal-2026-Results", "stocks": [{"t": "SONO", "n": "智慧音響，獲利回升但記憶體成本壓力"}], "status": "RADAR · 下一個驗證點 第四季財報與毛利率"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "Hudson 降溫", "color": "#C9A227", "zh": "Hudson Technologies（HDSN）做冷媒回收與再販售，是池內「雷達中」的老名字，這次是拐點延後的回報：10 月 28 日第三季營收 5,940 萬美元年減 19.7%，遠低於預期約 7,950 萬美元，銷量降 9%、價格降 17%，毛利率 25%（去年 32%），股價單日跌約 6% 至 13%（來源說法不一）。通路庫存過多壓低冷媒價格；正面是帳上現金 3,500 萬美元且無負債，國防後勤局合約貢獻 1,100 萬美元，並簽了新分離技術的共同開發協議。這是研究線索，不是投資建議。", "en": "Hudson Technologies (HDSN) reclaims and resells refrigerants and is an existing radar name; this is an update that the turn is delayed. Q3 revenue on October 28 was $59.4 million, down 19.7% and well below the roughly $79.5 million estimate, with volume down 9%, price down 17% and gross margin of 25% versus 32% a year ago; shares fell between about 6% and 13% depending on the source. Excess channel inventory is suppressing refrigerant prices; on the positive side it holds $35 million of cash with no debt, a DLA contract added $11 million, and it signed a joint development agreement on new separation technology. This is a research lead, not investment advice.", "url": "https://finviz.com/news/411489/hudson-technologies-misses-badly-as-volume-reverses-and-pricing-slides-margin-discipline-and-cash-build-cant-offset-a-weaker-demand-picture", "stocks": [{"t": "HDSN", "n": "冷媒回收，通路庫存壓低價格"}], "status": "RADAR · 下一個驗證點 冷媒價格與通路庫存去化"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "Energy Recovery", "color": "#C9A227", "zh": "Energy Recovery（ERII）做海水淡化用的壓力交換設備，結束二氧化碳業務後轉為純水處理公司。11 月 4 日第三季淨損 630 萬美元，淡化營收從 2,910 萬美元掉到 1,070 萬美元，廢水營收只有 47.6 萬美元，自由現金流為負 1,010 萬美元；一篇分析的標題指出在手訂單（backlog）翻倍，把討論焦點移到 2027。要確認的是訂單何時轉成收入，否則大型專案落空的缺口會持續。這是研究線索，不是投資建議。", "en": "Energy Recovery (ERII) makes pressure exchangers for desalination and became a pure-play water company after closing its CO2 business. Q3 on November 4 showed a net loss of $6.3 million, desalination revenue falling from $29.1 million to $10.7 million, wastewater revenue of just $476,000 and free cash flow of negative $10.1 million; one analysis headline says backlog doubled, shifting the debate to 2027. What needs confirming is when backlog converts into revenue; otherwise the gap from missing megaprojects will persist. This is a research lead, not investment advice.", "url": "https://finviz.com/news/416409/energy-recovery-misses-badly-as-megaproject-revenue-nearly-vanishes-but-a-doubled-backlog-shifts-the-debate-to-2027", "stocks": [{"t": "ERII", "n": "海水淡化設備，在手訂單翻倍但營收空窗"}], "status": "RADAR · 下一個驗證點 在手訂單轉收入的時程"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "Kinder 大買", "color": "#6DB56D", "zh": "能源管線公司 Kinder Morgan（KMI）的執行董事長 Richard Kinder 在 2025 年 10 月 27 日以約 25.96 美元買進 100 萬股，金額約 2,600 萬美元，是「創辦人用自己的錢加碼」的典型案例。我嘗試查證網傳他在 2026 年 11 月再買 50 萬股，沒有找到一手申報，不能當作事實。判讀提醒：大額買進代表信心，但不保證短期股價；創辦人買進常是長期持股行為，不是擇時訊號。", "en": "Richard Kinder, executive chairman of pipeline company Kinder Morgan (KMI), bought 1,000,000 shares on October 27, 2025 at about $25.96, roughly $26 million, a classic founder-adds-with-own-money case. I tried to verify a rumored additional 500,000-share purchase in November 2026 and found no primary filing, so it cannot be treated as fact. Reading note: large buys signal conviction but do not guarantee near-term returns, and founder purchases are often long-term holdings rather than timing signals.", "url": "https://www.tipranks.com/news/insider-trading/massive-stock-purchase-richard-kinder-makes-a-bold-move-insider-trading", "stocks": [{"t": "KMI", "n": "天然氣管線，創辦人 2025 年 10 月買進 100 萬股"}]},
  {"id": "insider_1", "channel": "內部人動向", "tag": "查證提醒", "color": "#6DB56D", "zh": "網路聚合站本週列出幾筆「董事買進」線索，包括 Madrigal（MDGL）的 Julian Baker 關聯基金、TTM Technologies（TTMI）、Six Flags（FUN）、GlobalFoundries（GFS）等，但我逐一查證時，多數找不到對得上的一手資料：TTMI 的 Wajid Ali 買進紀錄是 2025 年 8 月、FUN 的 Jaffer 買進是 2026 年 6 月，MDGL 的 3,500 萬美元也沒有查到佐證。這些名字只當待查線索，真正要看的是 EDGAR 上的 Form 4 與交易代碼 P。", "en": "Aggregator sites listed several director-purchase leads this week, including Madrigal (MDGL, Julian Baker-linked funds), TTM Technologies (TTMI), Six Flags (FUN) and GlobalFoundries (GFS), but when I checked each one I mostly could not find matching primary data: Wajid Ali's TTMI purchases date to August 2025, Jaffer's FUN purchases to June 2026, and the $35 million MDGL figure had no corroboration. Treat these names only as leads to check; what matters is the Form 4 on EDGAR with transaction code P.", "url": "https://finviz.com/insidertrading", "stocks": [{"t": "MDGL", "n": "脂肪肝藥廠，傳聞 Baker 關聯基金買進，未證實"}, {"t": "TTMI", "n": "印刷電路板，Ali 買進為 2025 年 8 月"}, {"t": "GFS", "n": "晶圓代工，董事買進待查證"}]},
  {"id": "insider_2", "channel": "內部人動向", "tag": "別被騙", "color": "#6DB56D", "zh": "不是每筆「insider」申報都是看多訊號。台積電高階主管有多筆數十股的小額買進，來源說明是員工認股計畫（ESPP），例行性質、訊號很弱；Best Buy 的 Richard Schulze 那份 Form 4 並不是買進；Amgen、Holley 的董事申報屬於股票獎酬而非公開市場買進。真正有訊息量的是代碼 P 的公開市場買進，尤其是多位內部人在短時間內一起買，且用的是自己的錢。", "en": "Not every insider filing is a bullish signal. TSMC executives made many tiny purchases of a few dozen shares that sources attribute to an employee stock purchase plan, routine and a weak signal; the Best Buy Form 4 for Richard Schulze is not a purchase; and the Amgen and Holley director filings are equity awards, not open-market buys. The informative ones are open-market purchases with code P, especially several insiders buying close together with their own money.", "url": "https://www.investing.com/news/stock-market-news/top-insider-buys-and-sells-disclosed-on-friday-93CH-5012345", "stocks": [{"t": "TSM", "n": "高階主管小額買進為 ESPP，例行性質"}, {"t": "BBY", "n": "Schulze 的 Form 4 不是買進"}, {"t": "AMGN", "n": "董事申報屬股票獎酬"}]},
  {"id": "capitol_0", "channel": "政要持股", "tag": "本期偏小額", "color": "#B5654D", "zh": "最近兩週的 STOCK Act 申報以小額為主：截至 11 月 2 日的一週有 48 筆交易、7 位議員申報，其中 7 筆買進、41 筆賣出，Pete Sessions 一人就占 31 筆。可看到的買進包括 Josh Gottheimer 在 10 月 26 日買進應用材料（AMAT），以及 Maria Elvira Salazar 買進 Nvidia 與 P&G，金額區間皆在 1,001 至 15,000 美元。這期沒有哪一筆形成清楚的主題押注；AMAT 與 Cisco 今晚剛好財報，只是時間上的巧合，不代表任何意圖。", "en": "Recent STOCK Act filings were mostly small: in the week to November 2 there were 48 transactions from 7 members, 7 purchases and 41 sales, with Pete Sessions alone accounting for 31. Visible buys include Josh Gottheimer buying Applied Materials on October 26 and Maria Elvira Salazar buying Nvidia and P&G, all in the $1,001-$15,000 range. No filing this period forms a clear thematic bet; AMAT and Cisco reporting tonight is a coincidence of timing and implies no intent.", "url": "https://www.capitolexposed.com/news/weekly-roundup-2026-w45", "stocks": [{"t": "AMAT", "n": "Gottheimer 10 月 26 日申報買進，金額區間 1,001 至 15,000 美元"}, {"t": "NVDA", "n": "Salazar 申報買進，同金額區間"}, {"t": "PG", "n": "Salazar 申報買進，同金額區間"}]},
  {"id": "capitol_1", "channel": "政要持股", "tag": "判讀卡", "color": "#B5654D", "zh": "看政要持股要記住幾個限制：申報最長可延遲 45 天，所以看到的是舊交易，不是買賣訊號；金額只給寬區間（例如 1,001 至 15,000 美元），沒有實際數字；很多交易是配偶或信託帳戶執行；選擇權的履約價與到期日才有真正的資訊量；跟單的人實際買到的是別人 45 天前的價位。這個頻道只描述「誰申報了什麼」，不暗示內線交易，也不是跟單建議。", "en": "Keep several limits in mind when reading congressional trades: filings can be delayed up to 45 days, so you see old trades, not signals; amounts come only as broad ranges (for example $1,001-$15,000); many trades are executed by a spouse or trust; for options, the strike and expiry carry the real information; and anyone copying buys at today's price. This channel only describes who filed what, implies no insider trading, and is not copy-trading advice.", "url": "https://us.trendlyne.com/us/politicians/recent-trades/", "stocks": [{"t": "NANC", "n": "追蹤民主黨議員持股的 ETF"}, {"t": "GOP", "n": "追蹤共和黨議員持股的 ETF"}, {"t": "SPY", "n": "大盤對照基準"}]},
