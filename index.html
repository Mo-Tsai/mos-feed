<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "earn_0", "channel": "財報速報", "tag": "運動服飾崩", "color": "#E8786A", "stocks": [{"t": "LULU", "n": "同店銷售減9%、下修全年財測，盤後跌逾16%"}, {"t": "NKE", "n": "運動服飾同業，需求疑慮外溢"}, {"t": "ONON", "n": "新興運動品牌，市佔流失的受益者之一"}], "en": "Lululemon's post-close report was ugly: shares fell 15% Thursday and another 16%-plus after hours. Second-quarter revenue of $2.415B fell 4% with comparable sales down 9%. EPS of $2.92 beat the $1.80 estimate, but on cost control rather than demand. Full-year guidance was cut to $10.35-10.5B, an admitted 5-7% decline.", "zh": "Lululemon週四盤後交出難看的成績單，股價當天已跌15%、盤後再跌逾16%。第二季營收24.15億美元、年減4%，同店銷售大減9%；每股盈餘2.92美元雖然高於預期的1.80，但那是成本控制的結果，不是需求回來了。公司同時下修全年營收財測到103.5至105億美元，等於承認今年會衰退5%到7%。", "url": "https://www.cnbc.com/2026/09/03/lululemon-lulu-q2-2026-earnings.html"},
    {"id": "earn_1", "channel": "財報速報", "tag": "好消息被賣", "color": "#E8786A", "stocks": [{"t": "AVGO", "n": "AI營收年增221%，第四季指引小輸共識，跌3.3%"}, {"t": "NVDA", "n": "AI晶片同業，博通指引被視為需求風向球"}, {"t": "MRVL", "n": "客製化AI晶片同業，與博通同一賽道"}], "en": "Broadcom's report was almost flawless: revenue up 86% to $29.6B, AI semiconductor revenue of $16.7B up 221%, and full-year AI revenue guidance raised from $56B to $58B. The stock still fell 3.3%. The reason was one line: fourth-quarter revenue guidance of $34.8B against a $35.03B consensus, a shortfall of about 0.7%.", "zh": "博通交出一份幾乎挑不出毛病的財報：營收年增86%到296億美元，AI半導體營收167億美元、年增221%，全年AI營收預估還從560億上調到580億。但股價跌3.3%。原因只有一行：第四季總營收指引348億，比市場共識的350.3億低了約0.7%。在這個估值水準，0.7%的差距就足以觸發賣壓。", "url": "https://investors.broadcom.com/news-releases/news-release-details/broadcom-inc-announces-third-quarter-fiscal-year-2026-financial"},

    {"id": "macro_0", "channel": "總經政策", "tag": "沃勒鬆口", "color": "#7C6AF7", "stocks": [{"t": "XLF", "n": "金融股 ETF，升息預期降溫下反彈"}, {"t": "KRE", "n": "區域銀行 ETF，對利率路徑最敏感的族群"}], "en": "Fed Governor Waller was the market's pivot. He signaled support for holding rates steady unless inflation surprises materially, interrupting the hawkish repricing of the prior two sessions. With the September 15-16 FOMC less than two weeks away, markets still must digest today's jobs report and next week's inflation data. One governor is not the committee.", "zh": "Fed理事沃勒是昨天整個市場的支點。他表示除非通膨出現重大意外，否則他傾向支持利率按兵不動——這句話直接打斷了本週前兩天愈演愈烈的「九月升息」定價。距離9月15至16日的FOMC只剩不到兩週，而在那之前市場還要消化今天的非農與下週的通膨數據。單一理事的說法不等於委員會共識，這點要留意。", "url": "https://www.fool.com/coverage/stock-market-today/2026/09/03/stock-market-midday-sept-3-stocks-rally-as-treasury-yields-fall-broadcom-falls-despite-earnings-beat/"},
    {"id": "macro_1", "channel": "總經政策", "tag": "非農倒置", "color": "#7C6AF7", "stocks": [{"t": "VIXY", "n": "波動率 ETF，數據公布前後波動放大"}, {"t": "GLD", "n": "黃金 ETF，升息風險是金價最大變數"}, {"t": "UUP", "n": "美元指數 ETF，就業數據直接影響利率預期"}], "en": "August payrolls land at 8:30am ET today, with consensus around 53,000 (a Reuters survey says about 58,000), unemployment seen holding at 4.1% and wages up about 3% year over year. The reaction function has inverted: in September 2026 a strong print is the hawkish outcome and a soft one removes hike risk. July payrolls fell 23,000 against a consensus of plus 83,000.", "zh": "今天早上八點半（美東時間）公布八月非農，共識約增加5.3萬人，路透調查約5.8萬，失業率預估維持4.1%、時薪年增約3%。真正要理解的是反應函數已經倒過來：2024到2025年是「數據弱等於降息、股市漲」，但在2026年九月，強勁的就業數字才是鷹派結果，疲弱的數字反而會把升息風險拿掉。七月非農是減少2.3萬人，市場原本預期增加8.3萬。", "url": "https://www.cnbc.com/2026/09/03/august-2026-jobs-report-payrolls.html"},
    {"id": "macro_2", "channel": "總經政策", "tag": "逆差擴大", "color": "#7C6AF7", "stocks": [{"t": "FDX", "n": "貨運需求直接反映進口量能"}, {"t": "UPS", "n": "同為關稅提前拉貨的觀察指標"}, {"t": "EXPD", "n": "貨運承攬商，對跨境貿易量最敏感"}], "en": "Two data points pointed opposite ways. August ISM services came in at 55.4 versus 54.1 expected, showing domestic demand still expanding, while the July trade deficit widened to $88.6B, the largest gap since early 2025. Widening deficits often reflect importers pulling shipments forward ahead of tariffs, which distorts the next few months of import data.", "zh": "兩份數據方向相反。八月ISM服務業指數55.4，高於預期的54.1，內需明顯還在擴張；但七月貿易逆差擴大到886億美元，是2025年初以來最大缺口。逆差擴大通常代表進口商在關稅實施前搶著提貨，這種行為會讓接下來幾個月的進口數字失真。看物流與運輸類股時，要分清楚哪一段是真需求、哪一段是提前拉貨。", "url": "https://www.proactiveinvestors.com/companies/news/1098057/dow-climbs-as-stocks-rebound-on-earnings-falling-treasury-yields-1098057.html"},
    {"id": "sector_0", "channel": "產業風向", "tag": "白銀更兇", "color": "#4EABA4", "stocks": [{"t": "SLV", "n": "白銀 ETF，單日漲3.2%、一年漲65.7%"}, {"t": "PAAS", "n": "白銀礦商，金屬漲價直接放大毛利"}, {"t": "HL", "n": "美國白銀與貴金屬礦商"}, {"t": "GDX", "n": "金礦股 ETF，用來對照礦商與金屬本身的槓桿差異"}], "en": "Within precious metals, silver is running much harder than gold. Silver rose 3.2% on September 3 to $67.41 an ounce, up 13.3% in a month and 65.7% over a year, while gold gained 0.92% to $4,427.99, up 24.8% year over year. Silver carries both monetary and industrial demand, and miners amplify metal moves because costs are relatively fixed.", "zh": "貴金屬這一段裡，白銀跑得比黃金兇得多。九月三日白銀漲3.2%到每盎司67.41美元，一個月漲13.3%、一年漲65.7%；同日黃金漲0.92%到4,427.99美元，一年漲24.8%。白銀同時有貨幣與工業兩種需求，太陽能與電子的用量是它跑贏黃金的結構性理由。礦業股通常會放大金屬本身的漲幅，因為成本相對固定、售價一動毛利就跳。", "url": "https://tradingeconomics.com/commodity/silver"},
    {"id": "sector_1", "channel": "產業風向", "tag": "AI第二層", "color": "#4EABA4", "stocks": [{"t": "ANET", "n": "資料中心交換器龍頭，吃的是晶片之後那一層"}, {"t": "CIEN", "n": "光通訊傳輸設備，資料中心互連需求受惠"}, {"t": "COHR", "n": "光模組與雷射元件供應商"}], "en": "Broadcom raising full-year AI revenue guidance to $58B and Snowflake adding over 2,000 CoCo accounts in a quarter point the same way: data center buildout is still accelerating. The underappreciated layer is often not the silicon but what connects it — switches, optical modules and transport gear. That layer books revenue one to two quarters behind the chips.", "zh": "博通把全年AI營收預估上調到580億美元、Snowflake的AI編碼代理帳號一季增加逾2,000個，這兩件事指向同一個結論：資料中心的建置還在加速。但真正被低估的往往不是晶片本身，而是把晶片串起來的那一層——交換器、光模組、光通訊傳輸設備。這一層的營收認列比晶片晚一到兩季，所以現在拿到的訂單要到明年才看得到數字。", "url": "https://investors.broadcom.com/news-releases/news-release-details/broadcom-inc-announces-third-quarter-fiscal-year-2026-financial"},
    {"id": "sector_2", "channel": "產業風向", "tag": "消費裂開", "color": "#4EABA4", "stocks": [{"t": "XRT", "n": "零售股 ETF，用來看商品消費的整體體溫"}, {"t": "VSCO", "n": "財測不佳，單日跌逾12%"}, {"t": "CPB", "n": "獲利年減37%"}, {"t": "KR", "n": "食品零售商，下週公布財報可交叉驗證"}], "en": "Three consumer companies delivered bad news on the same day: Lululemon comps down 9% with guidance cut, Victoria's Secret down over 12% on weak guidance, and Campbell's earnings down 37%. Athleisure, intimates and packaged food sit at three different price points, so weakness across all three is not company-specific. Meanwhile ISM services held at 55.4 — services holding up, goods rolling over.", "zh": "昨天有三家消費公司同時交出壞消息：Lululemon同店銷售減9%並下修全年、維多利亞的秘密因財測不佳跌逾12%、金寶湯獲利年減37%。運動服飾、內衣、包裝食品分屬三個完全不同的價格帶，卻在同一天一起走弱，這就不是單一公司的問題。同時ISM服務業還在55.4的擴張區間——服務消費撐著，商品消費在退。", "url": "https://finance.yahoo.com/markets/article/lululemon-sinks-after-cutting-forecast-as-revenue-declines-210101310.html"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素定位", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，小型股的主要代表"}, {"t": "IJR", "n": "標普600小型股 ETF，成分股有獲利門檻"}], "en": "Small caps have led this year, but the lead rests on one assumption: that rates fall. The Russell 2000 was up 12.25% year to date through late April, with consensus looking for 43% earnings growth over the next twelve months versus 11% for the S&P 500. Waller only deferred hike risk rather than removing it, and today's payrolls matter more to small caps than to megacaps.", "zh": "小型股今年跑在大盤前面，但這個領先是建立在一個假設上：利率會往下走。羅素2000到四月底為止年初至今漲12.25%，市場預期未來十二個月盈餘成長43%，遠高於標普500的11%。問題是昨天沃勒的談話只是把升息風險推遲、沒有取消。今天早上的非農對小型股的意義，比對大型股大得多。", "url": "https://www.investing.com/news/stock-market-news/russell-2000-outperformance-can-this-trend-continue-into-2026-4455392"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "充電暴漲", "color": "#5B8ED6", "stocks": [{"t": "CHPT", "n": "營收超標、虧損大幅收斂，單日漲53%"}, {"t": "BLNK", "n": "充電樁同業，族群性重估的對照組"}, {"t": "EVGO", "n": "快充網路營運商，同樣吃電動車滲透率"}], "en": "ChargePoint jumped 53% Thursday, one of the market's biggest single-day moves. Second-quarter revenue of $116.1M rose 18% and beat the $105M estimate; adjusted EBITDA loss narrowed 78% to $4.8M against a forecast $16.4M loss; non-GAAP gross margin rose 500 basis points to 38%. But third-quarter guidance of $105-115M merely brackets consensus rather than beating it.", "zh": "ChargePoint週四大漲53%，是昨天全市場最猛的單日走勢之一。第二季營收1.161億美元、年增18%，高於分析師預估的1.05億；調整後EBITDA虧損從去年同期收斂78%到480萬美元，遠優於市場預期的虧損1,640萬；非GAAP毛利率年增500個基點到38%。但第三季指引1.05至1.15億只是包住共識、沒有超越，這一點要記在心裡。", "url": "https://247wallst.com/investing/2026/09/03/chargepoint-skyrockets-74-as-revenue-beat-and-narrower-loss-clear-estimates/"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "兩種小型股", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普600小型股 ETF，有獲利門檻的那一籃"}, {"t": "VIOO", "n": "同樣追蹤標普600，可比較費用率"}, {"t": "SPSM", "n": "標普600的另一檔追蹤工具"}], "en": "Before calling small caps cheap, ask which index. The Russell 2000 trades around 18 times earnings, the S&P 600 at 15.9 times trailing, and the S&P 500 at 27 times. The difference is a profitability screen: the S&P 600 requires consecutive profitable quarters for inclusion, the Russell 2000 does not, so a meaningful share of its members lose money persistently.", "zh": "講「小型股便宜」之前要先問是哪一個指數。羅素2000目前約18倍本益比，標普600只有15.9倍（追蹤本益比），標普500則是27倍。差別在於標普600有獲利門檻——公司必須連續數季獲利才會被納入，羅素2000沒有這道篩選，裡面有相當比例是長期虧損的公司。同樣叫小型股，兩者的風險結構完全不同。", "url": "https://www.kavout.com/market-lens/is-the-small-cap-comeback-finally-here-in-2026"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "浮動負債", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素2000 ETF，浮動利率負債比重高"}, {"t": "HYG", "n": "高收益債 ETF，小型股信用條件的先行指標"}, {"t": "SJNK", "n": "短天期高收益債，對利率變動的反應更直接"}], "en": "Small caps are rate-sensitive because of their balance sheets, not sentiment. Where large caps mostly issue long-dated fixed-rate bonds, small caps carry a high share of floating-rate bank debt and revolvers, so a rate move hits the income statement in the same quarter. That is why today's payrolls threaten the Russell 2000 more than the S&P 500 — it touches cost structure, not just multiples.", "zh": "小型股對利率敏感，不是因為情緒，是因為資產負債表。相對於大型股多半發行長天期固定利率公司債，小型股有相當高比例的債務是浮動利率的銀行貸款或循環額度，利率一升，利息費用當季就反映在損益表上。這就是為什麼今天早上的非農對羅素2000的殺傷力比對標普500大：它動到的是小型股的成本結構，不只是估值倍數。", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "暴漲成因", "color": "#5B8ED6", "stocks": [{"t": "CHPT", "n": "昨日單日漲53%，但指引只是包住共識"}, {"t": "PLSE", "n": "醫材小型股，營運長9/2買進約9.99萬美元"}, {"t": "QNRX", "n": "四名經營層同日買進，浮動股數極小的典型"}], "en": "A small cap jumping 50% after earnings is rarely just about the earnings. Three mechanics amplify it: a small float, high short interest that forces covering, and thin analyst coverage meaning no consensus was priced in beforehand. Whether the move holds depends on whether next quarter's guidance rises too, not on how good the reported quarter looked.", "zh": "小型股財報後單日跳50%的成因，通常不只是「財報好」。三個技術面因素會放大它：一是流通在外股數少、真正可交易的浮動股數更少；二是空單比例高，好消息會觸發回補；三是分析師覆蓋少，市場沒有預先形成共識，資訊一次全部反映。判斷這種漲勢能不能撐住，要看的是下一季的指引有沒有跟著上調，而不是這一季的數字有多漂亮。", "url": "https://stockstory.org/us/stocks/nyse/chpt/news/why-up-down/why-is-chargepoint-chpt-stock-soaring-today"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "制服轉機", "color": "#C9A227", "status": "RADAR · 下一個驗證點 下一季財報（營收能否止跌、EBITDA 利潤率能否從約 10% 回升）", "stocks": [{"t": "VSTS", "n": "分拆後利潤率腰斬，董事兼10%股東買進約680萬美元"}, {"t": "ARMK", "n": "原母公司，可對照分拆前後的利潤率"}, {"t": "CTAS", "n": "制服租賃龍頭，利潤率的參考基準"}, {"t": "UNF", "n": "同業，規模與 Vestis 較接近"}], "en": "Vestis rents workplace uniforms and supplies, spun off from Aramark in October 2023. It is ignored for understandable reasons: repeated earnings misses, low-single-digit revenue declines, and EBITDA margins compressed from about 19.2% to about 10%, taking the stock from roughly $20 to $7.70. What is changing is governance — activist pressure from Corvex produced board changes, ex-UPS executive Jim Barber as CEO, and about $75M of cost savings, while director and 10% holder Keith Meister bought over one million shares for roughly $6.8M in the open market. Risks: the turnaround is not yet in the numbers, sell-side still says Hold, and uniform rental tracks employment closely. Research lead, not investment advice.", "zh": "Vestis做的是企業制服租賃與工作場所耗材，2023年10月從Aramark分拆獨立。被忽視的原因很直接：分拆後連續財報未達標、營收低個位數衰退、EBITDA利潤率從約19.2%一路壓縮到約10%，股價從約20美元跌到約7.7美元，市場已經放棄它。正在改變的是治理：Corvex Management的施壓帶來董事會改組與新任執行長Jim Barber（前UPS高層），並推動約7,500萬美元的成本節省；董事兼10%股東Keith Meister在公開市場分兩筆買進逾100萬股、約680萬美元。反方論點是轉機還沒出現在數字上，賣方仍多給「持有」評等，而制服租賃跟就業人數高度連動，就業降溫會直接壓縮客單。這是研究線索，不是投資建議。", "url": "https://seekingalpha.com/article/4885343-vestis-shares-are-cheap-but-they-probably-deserve-to-be"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "光通訊隱身", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Q3 財報（2.75-2.95 億營收指引、光通訊佔比與 GAAP 能否轉正）", "stocks": [{"t": "ADTN", "n": "光通訊年增22%、超大規模客戶年增47%，財務長8/6買進"}, {"t": "CIEN", "n": "光通訊傳輸同業，可對照成長率"}, {"t": "LITE", "n": "光模組供應商，同一條供應鏈"}, {"t": "CALX", "n": "寬頻接取同業，對照接取業務的衰退"}], "en": "ADTRAN is filed under legacy telecom equipment, but its growing line is optical networking. Second-quarter revenue of $281.1M rose 6.1%, with optical networking at $109.7M up 22% and revenue from cloud providers, hyperscalers, enterprise and government up 47%, while access and aggregation fell 5%. It stays ignored because revenue actually missed its own $283-303M guidance on one customer's project delay, and GAAP EPS was a $0.13 loss against $0.04 non-GAAP. CFO Timothy Santo bought 6,579 shares on August 6. Risks: customer concentration, European uncertainty, GAAP still negative. Research lead, not investment advice.", "zh": "ADTRAN被市場歸類成傳統電信設備商，但它現在真正在成長的那條線是光通訊。第二季營收2.811億美元、年增6.1%，其中光通訊解決方案1.097億、年增22%，來自雲端業者、超大規模資料中心、企業與政府客戶的營收年增47%；接取與匯聚業務則年減5%。被忽視的理由也很清楚：這一季營收其實低於自家2.83至3.03億的指引（單一客戶專案延後），GAAP每股仍虧損0.13美元，非GAAP才是每股獲利0.04美元。財務長Timothy Santo於8月6日買進6,579股。風險是客戶集中、歐洲市場不確定、GAAP尚未轉正。這是研究線索，不是投資建議。", "url": "https://www.gurufocus.com/news/9019974/adtran-holdings-inc-adtn-insider-buying-cfo-timothy-santo-purchases-6579-shares"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "訂單與燒錢", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Q3 財報（3,000-3,500 萬營收指引、現金消耗速度與在手訂單轉換）", "stocks": [{"t": "FTCI", "n": "在手訂單5.6億但單季虧2,710萬，董事9/2買進約27.2萬美元"}, {"t": "ARRY", "n": "追日支架直接同業，規模較大"}, {"t": "NXT", "n": "支架龍頭，用來對照毛利率"}, {"t": "SHLS", "n": "太陽能電氣元件商，同族群景氣對照"}], "en": "FTC Solar makes solar trackers and is doubly ignored: the sector is out of favor under policy headwinds and the company itself is a microcap. What is changing is the order book — second-quarter revenue of $26.2M rose 31% year over year and 52% sequentially, with contracted backlog around $560M, more than twenty times quarterly revenue. It won a first 1P tracker order from a large US developer that had been a 2P customer, and a 330MW-plus Queensland project entered production. The counterargument is hard: a $27.1M GAAP net loss ($1.69 per share) is the same order of magnitude as revenue. Director Shaker Sadasivam bought 101,083 shares for about $272K on September 2. Research lead, not investment advice.", "zh": "FTC Solar做太陽能追日支架，是典型的雙重忽視：太陽能族群在政策逆風下整體被市場放棄，公司本身又是微型股。正在改變的是訂單：第二季營收2,620萬美元、年增31%、季增52%，已簽約在手訂單約5.6億美元，是單季營收的二十倍以上；本季首度拿到一家原本使用2P系統的美國大型開發商的1P支架訂單（東岸逾100百萬瓦），澳洲昆士蘭逾330百萬瓦的專案也開始投產。反方論點很硬：這一季GAAP淨損2,710萬美元、每股虧1.69美元，虧損金額跟營收同一個量級，在手訂單要能轉成現金才有意義。董事Shaker Sadasivam於9月2日買進101,083股、約27.2萬美元。這是研究線索，不是投資建議。", "url": "https://www.globenewswire.com/news-release/2026/08/05/3339127/0/en/FTC-Solar-Announces-Second-Quarter-2026-Financial-Results.html"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "關鍵礦產", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（營收能否從 790 萬回升並認列約 260 萬美元的 DLA 訂單、九座熔爐的實際投產數）", "stocks": [{"t": "UAMY", "n": "兩名內部人9/2合計買進約19.3萬美元"}, {"t": "MP", "n": "稀土與關鍵礦產同族群，政策邏輯相同"}, {"t": "ITA", "n": "航太國防 ETF，銻的終端需求之一"}], "en": "Pool name U.S. Antimony showed a cluster buy. On September 2, director Joseph Carrabba bought about $100.5K and EVP Lloyd Bardswich about $92.7K, roughly $193K combined. Antimony is a designated critical mineral used in flame retardants and military ordnance, with very little US domestic capacity — the original reason for inclusion. The dollar amounts are modest relative to the company, so the signal is moderate; the real test is whether policy-driven orders convert into revenue. Research lead, not investment advice.", "zh": "池內的美國銻業（U.S. Antimony）出現群聚買進訊號。9月2日董事Joseph Carrabba買進約10.05萬美元、執行副總Lloyd Bardswich買進約9.27萬美元，兩人合計約19.3萬美元。銻是列管的關鍵礦產，用於阻燃劑與軍用彈藥，美國本土產能極少，這是它當初入池的理由。要注意的是這兩筆金額對照公司規模並不大，訊號屬於中等強度，真正的檢驗是政策訂單能不能變成營收。這是研究線索，不是投資建議。", "url": "https://www.everhint.com/insider-trading-signals-september-02-2026/"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "下週交卷", "color": "#C9A227", "status": "RADAR · 下一個驗證點 09/08 盤後 FQ3 財報（酪梨均價、毛利率修復、庫藏股實際執行）", "stocks": [{"t": "AVO", "n": "9/8盤後公布 FQ3 財報，均價與毛利率是決勝點"}, {"t": "CALM", "n": "同為農產品價格驅動的公司，可對照定價週期"}, {"t": "LMNR", "n": "柑橘與農地經營商，農業小型股對照組"}], "en": "Pool name Mission Produce reports fiscal third-quarter results after the close on September 8, the pool's clearest near-term checkpoint. The original thesis was that falling avocado prices compressed margins but management called it temporary. Three things to check: whether average selling prices recovered, whether gross margin repaired, and the actual shares and average price under the $100M buyback, plus the blueberry unit's contribution. If prices did not recover and margin fell again, the temporary framing fails. Research lead, not investment advice.", "zh": "池內的Mission Produce將於9月8日盤後公布會計年度第三季財報，這是雷達池近期最明確的一個驗證點。當初入池的論點是：酪梨均價下滑壓縮毛利，但管理層說這是暫時性的。這次要看三件事——酪梨均價有沒有回升、毛利率能不能修復、1億美元庫藏股實際買回了多少股與均價，以及藍莓事業的損益貢獻。如果均價沒回升且毛利率再降一階，「暫時性」這個說法就站不住，應該考慮降級觀察。這是研究線索，不是投資建議。", "url": "https://stockanalysis.com/stocks/avo/"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "油價與避險", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（營運現金流能否轉正、避險部位到期時程與重訂價格）", "stocks": [{"t": "BATL", "n": "兩項外部檢查已通過，但避險部位可能吃掉油價漲幅"}, {"t": "USO", "n": "原油 ETF，追蹤 WTI 走勢"}, {"t": "XOM", "n": "大型能源股，用來對照避險策略的差異"}], "en": "Pool name Battalion Oil passed both external checks on September 2: WTI held above $80 (US-Iran tension pushed crude past $90) and a second insider followed with a purchase. But higher oil is not automatically good for it — the company booked $36.8M of derivative losses in the first half, so if hedges have not rolled off, a higher strip widens those losses. The question now is the maturity schedule and reset prices in the hedge book, not the oil price itself. Research lead, not investment advice.", "zh": "池內的Battalion Oil兩項外部檢查在9月2日都已通過：WTI守住80美元（美伊衝突把油價推到90美元之上），以及第二位內部人跟進買進。但油價漲對它不必然是好事——上半年它認列了3,680萬美元的衍生品損失，如果避險部位還沒到期，油價愈高、避險端的虧損愈大。所以現在的關鍵不是油價本身，而是避險表裡的到期日與重訂價格。這是研究線索，不是投資建議。", "url": "https://stockanalysis.com/stocks/batl/"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "全員買進", "color": "#6DB56D", "stocks": [{"t": "QNRX", "n": "執行長、營運長、財務長、董事同日買進，合計約28萬美元"}, {"t": "PLSE", "n": "營運長同日買進約9.99萬美元"}], "en": "The most complete cluster on September 2 was at Quoin Pharmaceuticals: CEO Myers about $99.9K, COO Carter about $99.9K, CFO Lawlor about $49.9K and director Culverwell about $29.9K, roughly $280K combined. The dollar total is small, but an entire leadership team buying on the same day matters more than the size — it rules out any one person's individual financial planning. Separately, Pulse Biosciences' COO bought about $99.9K the same day.", "zh": "9月2日最完整的一組群聚買進出現在Quoin Pharmaceuticals：執行長Myers買進約9.99萬美元、營運長Carter約9.99萬、財務長Lawlor約4.99萬、董事Culverwell約2.99萬，合計約28萬美元。金額不大，但「整個經營層在同一天一起買」這件事本身比金額重要——它排除了單一個人財務規劃的可能。另一組同日訊號是Pulse Biosciences的營運長買進約9.99萬美元。", "url": "https://www.everhint.com/insider-trading-signals-september-02-2026/"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "銀行自買", "color": "#6DB56D", "stocks": [{"t": "PNFP", "n": "執行長9/2買進約25萬美元自家股票"}, {"t": "KRE", "n": "區域銀行 ETF，同族群的存款成本壓力"}, {"t": "FHN", "n": "區域銀行同業，商用不動產曝險的對照組"}], "en": "Pinnacle Financial Partners CEO Kevin S. Blair bought about $250K of his own bank's stock on September 2. The timing is what makes it worth isolating: that day the market was pricing September hike risk, with deposit costs and commercial real estate exposure the two most questioned items for regional banks. Note that a single-insider buy is a weaker signal than a cluster, and bank insider holdings often reflect compensation structure, so read the transaction-code field on the Form 4 alongside it.", "zh": "Pinnacle Financial Partners執行長Kevin S. Blair於9月2日買進約25萬美元自家股票。這筆值得單獨看的理由是時機：那一天市場正在押注九月升息，而區域銀行的存款成本與商用不動產曝險是最被質疑的兩件事，執行長選在這種時候用個人資金加碼。要注意的是單一內部人買進的訊號強度低於群聚買進，而且銀行股的內部人持股常有薪酬結構因素，看的時候要跟Form 4上的交易性質欄位一起讀。", "url": "https://www.everhint.com/insider-trading-signals-september-02-2026/"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "買賣失衡", "color": "#6DB56D", "stocks": [{"t": "CAT", "n": "執行長賣出約2,620萬美元"}, {"t": "SNPS", "n": "執行董事長賣出約2,138萬美元"}, {"t": "ABNB", "n": "策略長賣出約1,345萬美元"}], "en": "A reading note: on September 2, market-wide insider sales exceeded $175M against only about $2.6M of purchases. That imbalance should not be read as bearish. Large sales mostly come from 10b5-1 plans and diversification — Caterpillar's CEO at about $26.2M, Synopsys' executive chair at about $21.38M, Airbnb's chief strategy officer at about $13.45M. What carries information is discretionary open-market buying, and the same dollar of buying means far more in a thinly covered small cap than in a megacap.", "zh": "判讀提醒：9月2日全市場的內部人賣出超過1.75億美元，買進只有約260萬美元，比例懸殊。但這個數字不能直接讀成看空——大額賣出多半來自10b5-1預定計畫與分散持股需求，例如卡特彼勒執行長約2,620萬美元、新思科技執行董事長約2,138萬美元、Airbnb策略長約1,345萬美元。真正有資訊量的是「主動用個人現金在公開市場買進」，而且在分析師覆蓋少的小型股上，同樣一塊錢的買進訊號比大型股重得多。", "url": "https://www.everhint.com/insider-trading-signals-september-02-2026/"},
    {"id": "capitol_0", "channel": "政要持股", "tag": "全數賣出", "color": "#B5654D", "stocks": [{"t": "XOM", "n": "申報賣出標的之一，能源部位"}, {"t": "OGN", "n": "申報賣出標的之一，醫藥分拆公司"}, {"t": "BA", "n": "申報賣出標的之一，工業與國防"}], "en": "Representative Kevin Hern (OK-01) filed a new periodic transaction report on September 1, lifting his 90-day transaction count from 12 to 33 — 30 sales and zero purchases, in a disclosed range of roughly $350K to $1.225M, concentrated in energy and industrials including Exxon Mobil, Organon and Boeing. The position structure implies broad de-risking rather than rotation: a rotation would show offsetting purchases alongside the sales. These trades occurred up to 45 days before the filing date.", "zh": "眾議員Kevin Hern（奧克拉荷馬州第一選區）於9月1日送出新的PTR申報，把他90天窗口內的交易筆數從12筆推高到33筆，其中30筆是賣出、0筆買進，金額區間約35萬至122.5萬美元，標的集中在能源與工業，包含艾克森美孚、Organon與波音。這個部位結構代表的假設是全面減碼、不是換股輪動——如果是輪動，賣出旁邊會有對應的買進。要記得這些交易實際發生在申報日的最多45天前。", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure"},
    {"id": "capitol_1", "channel": "政要持股", "tag": "怎麼讀", "color": "#B5654D", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報部位的 ETF"}, {"t": "GOP", "n": "追蹤共和黨籍議員申報部位的 ETF"}, {"t": "SPY", "n": "標普500 ETF，用來對照兩檔的實際績效差距"}], "en": "Four structural limits on congressional disclosure data. First, the STOCK Act allows up to 45 days to file, so you are always seeing prices from six weeks ago. Second, amounts come only as ranges (for example $1,001-$15,000), so any total is an estimated band rather than a number. Third, most trades are executed in spousal accounts or trusts, not by the member. Fourth, when options are disclosed, the strike and expiry carry the real information — reading only the ticker misses the position structure entirely.", "zh": "政要持股這條資料的四個天然限制要一次講清楚。第一，STOCK Act允許最長45天才申報，你看到的永遠是別人一個半月前的價位。第二，金額只有區間（例如1,001至15,000美元），沒有精確數字，所以任何「總金額」都是估算出來的上下界。第三，多數交易由配偶帳戶或信託執行，不是議員本人操作。第四，如果申報的是選擇權，履約價與到期日才是真正的資訊量，只看「買了什麼代號」會漏掉整個部位結構。", "url": "https://www.form4api.com/congress"},

    {"id": "week_1", "channel": "本週事件", "tag": "財報排程", "color": "#C97DD4", "stocks": [{"t": "ORCL", "n": "9/9公布財報，雲端與 AI 基礎建設需求讀數"}, {"t": "ADBE", "n": "生成式 AI 對訂閱模式的侵蝕測試"}, {"t": "KR", "n": "食品零售，消費端體溫計"}, {"t": "AVO", "n": "9/8盤後，雷達池的明確驗證點"}], "en": "Next week's earnings skew software and retail: Oracle on September 9 is an important read on cloud and AI infrastructure demand, Adobe will be tested on how far generative AI erodes incumbent software subscriptions, and Kroger gives a grocery-level consumer temperature check. For the radar pool the key date is Mission Produce's fiscal third quarter after the close on September 8.", "zh": "下週財報以軟體與零售為主：甲骨文（9/9）是雲端與AI基礎建設需求的重要讀數，Adobe則會被拿來檢驗生成式AI對既有軟體訂閱的侵蝕程度，Kroger提供食品零售端的消費體溫。對雷達池來說最關鍵的是9月8日盤後的Mission Produce會計年度第三季財報，那是池內近期唯一有明確日期的驗證點。", "url": "https://www.itiger.com/news/2518280398"},

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>

      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

        <div style={{ paddingTop:"20px" }}>
          <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 6px" }}>
            <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>個別議員 · 近 {R.window} 天申報</span>
            <span style={{ fontSize:"10px", color:"var(--text-tertiary)" }}>更新 {R.updated}</span>
          </div>
          <div style={{ padding:"0 16px 12px", fontSize:"11px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            眾議院 STOCK Act 定期交易報告（PTR）原始申報書彙整，共 {R.filings} 份、其中 {R.skipped_scanned} 份是紙本掃描件無法解析。金額只有級距沒有數字，絕大多數落在最低的 $1,001–$15,000，所以下面顯示的是<span style={{ color:"var(--text-secondary, inherit)" }}>申報區間</span>而不是實際金額——別把它當成真實部位大小。點議員名字可看原始申報書。
          </div>
          <div style={{ overflowX:"auto", padding:"0 16px" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"12px" }}>
              <thead>
                <tr style={{ color:"var(--text-tertiary)", fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", textTransform:"uppercase" }}>
                  <th style={{ textAlign:"left",  padding:"6px 8px 6px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>議員</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>筆數</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>買 / 賣</th>
                  <th style={{ textAlign:"right", padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>申報區間</th>
                  <th style={{ textAlign:"left",  padding:"6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>常見標的</th>
                  <th style={{ textAlign:"right", padding:"6px 0 6px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.25))", whiteSpace:"nowrap" }}>最新申報</th>
                </tr>
              </thead>
              <tbody>
                {R.roster.map(r => (
                  <tr key={r.name + r.dst}>
                    <td style={{ padding:"7px 8px 7px 0", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      <a href={r.url} target="_blank" rel="noopener noreferrer" style={{ color:"#B5654D", textDecoration:"none" }}>{r.name}</a>
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px", marginLeft:"6px" }}>{r.dst}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums" }}>{r.n}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>
                      <span style={{ color:"#6DB56D" }}>{r.buy}</span>
                      <span style={{ color:"var(--text-tertiary)" }}> / </span>
                      <span style={{ color:"#E05C5C" }}>{r.sell}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>{money(r.lo)}–{money(r.hi)}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      {r.top.map(t => (
                        <a key={t} href={"https://www.tradingview.com/symbols/" + t + "/"} target="_blank" rel="noopener noreferrer"
                           style={{ color:"var(--text-secondary, inherit)", textDecoration:"none", marginRight:"7px", fontFamily:"'Courier New',monospace" }}>{t}</a>
                      ))}
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px" }}>共 {r.distinct} 檔</span>
                    </td>
                    <td style={{ padding:"7px 0 7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", whiteSpace:"nowrap" }}>{r.last}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ padding:"12px 16px 0", fontSize:"10px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            只涵蓋眾議院；參議院走另一套 efdsearch 系統，尚未納入。買＋賣不一定等於筆數，差額是交換（exchange）類交易。
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/04/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v9.9</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
