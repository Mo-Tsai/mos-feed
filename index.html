<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "指數收盤", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普 500 ETF，指數首度收在 7,800 點之上"}, {"t": "QQQ", "n": "那斯達克 100，那指漲 0.81% 領先三大指數"}, {"t": "DIA", "n": "道瓊 ETF，指數僅漲 0.13%，明顯落後"}], "en": "The S&P 500 closed Thursday at 7,798.99, up 0.65%, clearing 7,800 for the first time ever. The Nasdaq Composite gained 0.81% to 26,803.03 while the Dow added just 69.72 points, or 0.13%, to 53,839.99. Two things pushed together: July producer prices came in flat, and oil fell more than 2%. Note the Dow's 0.13% — the spread across the three indexes says this bid was concentrated in tech and memory, not broad.", "zh": "標普 500 週四收在 7,798.99 點、上漲 0.65%，史上第一次站上 7,800 點；那斯達克綜合指數漲 0.81% 收 26,803.03，道瓊小漲 69.72 點、0.13% 收 53,839.99。推力來自兩件事同時發生：7 月生產者物價完全沒漲，加上油價重挫超過 2%。值得注意的是道瓊只漲 0.13%，三大指數之間的落差說明這波買盤集中在科技與記憶體，不是全面性的。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-13-2026"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "記憶體領軍", "color": "#E05C5C", "stocks": [{"t": "SNDK", "n": "盤中漲逾 15%，與 Kioxia 發表第九代 AI 快閃記憶體"}, {"t": "MU", "n": "美光漲 3.09%，市值重回一兆美元"}, {"t": "INTC", "n": "英特爾漲 4.41%，增資案機構認購逾一千億美元"}], "en": "The engine of Thursday's rally was memory and chips. SanDisk ran as much as 15% after unveiling ninth-generation flash with Kioxia — aimed at AI data centres, with a 33% speed gain — and pairing it with an investor day that targeted mid-to-high teens revenue growth and non-GAAP gross margins near 80%. Micron rose 3.09% and reclaimed a $1 trillion market cap. Intel added 4.41% as its outsized capital raise closed with institutional demand above $100 billion.", "zh": "週四漲勢的引擎是記憶體與晶片。SanDisk 盤中一度大漲 15%，因為它與 Kioxia 共同發表第九代快閃記憶體，主打 AI 資料中心、速度提升三成三，同日的投資人日又給出長期營收中高個位數到雙位數成長、非 GAAP 毛利率維持在八成左右的目標。美光上漲 3.09%，市值重新站回一兆美元；英特爾上漲 4.41%，原因是超大規模增資案定案，機構認購金額超過一千億美元。", "url": "https://www.benzinga.com/markets/tech/26/08/61166300/sandisk-kioxia-unveil-ai-ready-flash-tech-with-33-speed-boost"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "油價地緣", "color": "#E05C5C", "stocks": [{"t": "OXY", "n": "上游生產商，油價下跌直接壓縮每桶實現價格"}, {"t": "VLO", "n": "煉油廠，原油成本走低有利煉油價差"}, {"t": "DAL", "n": "達美航空，燃油是最大的單一成本項目"}], "en": "Oil was the other half of Thursday's rally. Brent fell more than 2% to $87.07 a barrel and WTI settled at $81.25, snapping a six-day advance. The trigger was Energy Secretary Chris Wright saying crude exports through the Strait of Hormuz are running near 9 million barrels a day — well above most independent estimates — while Trump claimed the US has total control of the waterway. Yet the IEA's monthly report in the same window put the global market 1.8 million barrels a day short this quarter. Price is trading the negotiation; the supply balance has not closed.", "zh": "油價是週四股市上漲的另一半原因。布蘭特原油下跌超過 2% 收在每桶 87.07 美元，西德州中級原油跌破 82 美元、收在 81.25 美元，中止連續六天的漲勢。轉折點是美國能源部長萊特表示，通過荷莫茲海峽的原油出口量接近每日九百萬桶，比多數獨立機構的估計高出一截，川普同時聲稱美國對該水道有完全的控制。但國際能源總署同一份月報估計，本季全球原油仍短缺每日一百八十萬桶——價格在賭談判，供需帳還沒平。", "url": "https://www.cnbc.com/2026/08/13/oil-spill-near-oman-worries-over-supply-.html"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "盤勢結構", "color": "#E05C5C", "stocks": [{"t": "RSP", "n": "標普 500 等權重 ETF，用來檢查漲勢是否只靠權值股"}, {"t": "MDY", "n": "中型股 ETF，中小型股同步走強"}, {"t": "VIXY", "n": "波動率 ETF，VIX 週四回落近 5%"}], "en": "The structure underneath the index matters more than the daily move. The VIX fell nearly 5% on Thursday, so hedging demand eased alongside. The real story was small caps: the Russell 2000 set a record at 3,045.48, its 27th record close of 2026. It is up 22.7% year to date, ahead of the S&P 500 by 9.5 percentage points and ahead of the Nasdaq 100's 19%. Small beating large in that order has barely happened in three years — worth logging as a structural shift, not daily noise.", "zh": "指數之下的結構比漲跌幅更值得看。恐慌指數 VIX 週四回落將近 5%，顯示避險需求同步鬆開；而真正的主角是小型股——羅素 2000 以 3,045.48 點刷新歷史高點，是今年第 27 次收盤新高。今年以來羅素 2000 上漲 22.7%，領先標普 500 達 9.5 個百分點，也超過那斯達克 100 的 19%。這種小勝大的排序在過去三年幾乎沒有出現過，值得當成盤勢結構的變化來記，而不是單日噪音。", "url": "https://ts2.tech/en/russell-2000-at-a-record-thursday-ppi-tests-small-caps-9-5-point-lead/"},
    {"id": "earn_0", "channel": "財報速報", "tag": "超標卻跌", "color": "#E8786A", "stocks": [{"t": "AMAT", "n": "財測遠超共識，盤後仍跌近 3% 至 519.70 美元"}, {"t": "LRCX", "n": "同屬晶圓設備，設備支出上修是全行業訊息"}, {"t": "KLAC", "n": "製程檢測設備，與晶圓廠資本支出同步"}], "en": "Applied Materials posted numbers that look strong on paper Thursday after the bell, and the stock kept falling. Fiscal fourth-quarter revenue guidance came in at $10.25 billion plus or minus $500 million against a $9.54 billion consensus; the reported quarter was $8.95 billion with non-GAAP EPS of $3.36; and CEO Gary Dickerson raised his 2026 wafer fab equipment growth estimate above 30%. The stock still fell almost 3% after hours to $519.70, on top of a 2.5% drop in the regular session. After the run of the past year, the good news was already inside the purchase price.", "zh": "應用材料週四盤後交出一份帳面很好看的成績單，股價卻繼續跌。公司給出的會計年度第四季營收展望為 102.5 億美元、正負 5 億，遠高於市場共識的 95.4 億；本季營收 89.5 億美元、非 GAAP 每股盈餘 3.36 美元；執行長迪克森同時把 2026 年全球晶圓設備支出的成長預估上調到 30% 以上。但股價盤後再跌近 3% 至 519.70 美元，當天正常盤已先跌 2.5%。過去一年這檔股票漲得太多，好消息早就被買進價格吃掉了。", "url": "https://ts2.tech/en/applied-materials-revenue-guide-beats-wall-street-even-at-the-low-end/"},
    {"id": "earn_1", "channel": "財報速報", "tag": "完美定價", "color": "#E8786A", "stocks": [{"t": "CBRS", "n": "第二季營收 1.80 億美元低於共識，單日跌近 14%"}, {"t": "NBIS", "n": "同屬 AI 雲端基建，估值同樣建立在成長率上"}, {"t": "SMCI", "n": "資料中心硬體，對 AI 資本支出節奏最敏感"}], "en": "Another report the same day told the opposite half of the story. Cerebras Systems reported second-quarter revenue of $180 million against the $194 million LSEG consensus, and the stock fell nearly 14%. It had already been down more than 25% year to date going into the print. AI infrastructure names are now priced so that anything short of a revenue beat is treated as bad news. That is the same phenomenon as Applied Materials falling on a beat, seen from the other side: the market is not buying the absolute number, it is buying the gap to expectations.", "zh": "同一天的另一份財報講的是反面。Cerebras Systems 第二季營收 1.80 億美元，低於 LSEG 匯整的 1.94 億共識，股價當日重挫將近 14%；進入財報前，這檔股票今年以來已經下跌超過 25%。AI 基礎建設族群現在的定價方式是：只要營收沒有超標，就當作壞消息處理。這跟應用材料超標卻下跌是同一個現象的兩面——市場買的不是絕對數字，是相對於預期的那個差距。", "url": "https://www.cnbc.com/2026/08/13/stocks-making-the-biggest-moves-midday-nflx-smci-sndk-stub.html"},
    {"id": "earn_2", "channel": "財報速報", "tag": "消費分歧", "color": "#E8786A", "stocks": [{"t": "RRGB", "n": "第二季財報超預期，單日大漲近 25%"}, {"t": "STUB", "n": "二手票券平台，同日重挫近 14%"}, {"t": "CAVA", "n": "快休閒餐飲同業，可對照客單價趨勢"}], "en": "Consumption split in two directions in a single session. Red Robin Gourmet Burgers jumped nearly 25% after second-quarter results beat expectations — a company long filed under declining casual dining. Meanwhile StubHub, the secondary ticket marketplace, fell almost 14%. The same consumer will spend twenty dollars on a burger and skip a high-ticket concert seat. That staples-versus-discretionary split usually shows up when real disposable income has stalled but a recession has not actually arrived.", "zh": "消費端在同一個交易日出現兩個方向。紅羅賓漢堡第二季財報優於分析師預期，股價大漲將近 25%，而它長期被歸類為衰退中的休閒餐飲；另一邊，二手票券平台 StubHub 重挫將近 14%。同一個消費者，一邊願意花二十美元吃漢堡，一邊縮手不買高單價的演唱會票。這種必需與非必需分家的型態，通常出現在實質可支配所得停滯、但還沒真正衰退的階段。", "url": "https://www.cnbc.com/2026/08/13/stocks-making-the-biggest-moves-midday-nflx-smci-sndk-stub.html"},
    {"id": "macro_0", "channel": "總經政策", "tag": "生產者物價", "color": "#7C6AF7", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，通膨數據決定長端定價"}, {"t": "IEF", "n": "7 至 10 年期公債，中段殖利率對數據反應最直接"}, {"t": "TIP", "n": "抗通膨債券 ETF，反映市場的通膨補償要求"}], "en": "July's Producer Price Index landed Thursday with final demand unchanged on the month against a consensus of +0.2%. The year-over-year rate was 4.7%, also below expectations. Underneath: final demand services rose 0.2%, final demand goods fell 0.7%, and construction rose 2.2%, partly offsetting. Coming a day after CPI landed exactly on consensus, this was the second inflation print of the week that made no trouble — and the direct reason stocks felt free to make a new high.", "zh": "7 月生產者物價指數週四公布，最終需求項目的月增率為零，市場原本預期上漲 0.2%；年增率 4.7%，同樣低於預期。拆開來看，最終需求服務月增 0.2%、最終需求商品月減 0.7%，另有營建項目月增 2.2% 部分抵銷。這是繼週三消費者物價完全落在共識之後，本週第二份不製造麻煩的通膨數據，也是股市在週四敢創新高的直接原因。", "url": "https://www.bls.gov/news.release/archives/ppi_08132026.htm"},
    {"id": "macro_1", "channel": "總經政策", "tag": "核心的反面", "color": "#7C6AF7", "stocks": [{"t": "BLK", "n": "全球最大資產管理商，投資組合管理費用正是本次核心的主推力"}, {"t": "SCHW", "n": "嘉信理財，資產管理與經紀費用同樣計入此項"}, {"t": "TROW", "n": "普信集團，純資產管理業者，費率變化最直接"}], "en": "The PPI headline and its internals are not saying the same thing. Core PPI — excluding food, energy and trade services — rose 0.4% in July, quadrupling June's 0.1% pace, led by a 6.5% jump in portfolio management fees. That line matters because it feeds directly into the PCE price index due 26 August, which is the gauge the Fed actually watches. The headline let the market exhale; the component that reaches PCE went the other way.", "zh": "但生產者物價的標題與內裡講的不是同一件事。剔除食品、能源與貿易服務後的核心生產者物價，7 月月增 0.4%，是 6 月 0.1% 的四倍，帶頭的是投資組合管理費用單月大漲 6.5%。這一項的重要性在於它會直接餵進 8 月 26 日公布的個人消費支出物價指數，也就是聯準會真正在看的那把尺。頭條數字讓市場鬆一口氣，但會進入 PCE 的那一項卻往反方向走。", "url": "https://www.techtimes.com/articles/324287/20260813/july-ppi-flat-headline-hides-04-core-surge-heading-august-26-pce.htm"},
    {"id": "macro_2", "channel": "總經政策", "tag": "政策行事曆", "color": "#7C6AF7", "stocks": [{"t": "XLF", "n": "金融板塊 ETF，利率路徑是它的主要變數"}, {"t": "KRE", "n": "區域銀行 ETF，對存款成本與升息最敏感"}, {"t": "PYPL", "n": "數位支付業者，今年研討會主題正是支付創新"}], "en": "The policy calendar is set. The Kansas City Fed's Jackson Hole symposium runs 27 to 29 August, with this year's theme Financial Innovation: Implications for Payments and Policy, focused on how digital payments, central bank digital currencies and fintech are reshaping monetary transmission; Chair Kevin Warsh presides. The decision date is the FOMC meeting on 16 September, where markets currently price roughly a 42% chance of a hike.", "zh": "接下來的政策日程已經排定。堪薩斯城聯邦準備銀行的傑克森洞年度研討會訂於 8 月 27 日至 29 日舉行，今年主題是「金融創新：對支付與政策的影響」，聚焦數位支付、央行數位貨幣與金融科技如何改變貨幣傳導；主持者是現任主席華許。真正的決策日則是 9 月 16 日的聯邦公開市場操作委員會會議，目前市場定價的 9 月升息機率約四成二。", "url": "https://www.kansascityfed.org/research/jackson-hole-economic-symposium/"},
    {"id": "sector_0", "channel": "產業風向", "tag": "能源領先", "color": "#4EABA4", "stocks": [{"t": "XLE", "n": "能源板塊 ETF，今年以來漲逾 22%"}, {"t": "XOP", "n": "石油與天然氣探勘生產 ETF，對油價彈性高於整體板塊"}, {"t": "CVX", "n": "綜合能源巨頭，上下游一體的對照組"}], "en": "Energy is one of 2026's strongest sectors year to date, up more than 22%, and currently sits in the leading quadrant alongside consumer staples, industrials and materials. Thursday's drop in crude is a reminder of what that leadership rests on: a large share of it is a Hormuz geopolitical premium, not a structural improvement in demand. Geopolitical premiums appear fast and vanish fast — a visible step forward in negotiations can reorder the leading quadrant inside a week.", "zh": "以年初至今的漲幅看，能源是 2026 年最強的板塊之一，累計漲幅超過 22%，目前與必需消費、工業、原物料同列在領先象限。但週四的油價重挫提醒了一件事：這波能源的相對強勢，有相當比重是荷莫茲海峽的地緣溢價，而不是需求端的結構改善。地緣溢價的特性是漲得快、消失得也快——只要談判出現明顯進展，領先象限的排序可以在一週內重排。", "url": "https://www.investing.com/analysis/sector-rotation-a-guide-to-the-sp-500-momentum-status-200675903"},
    {"id": "sector_1", "channel": "產業風向", "tag": "醫療落差", "color": "#4EABA4", "stocks": [{"t": "XLV", "n": "醫療保健板塊 ETF，動能指標落在轉弱象限"}, {"t": "XBI", "n": "生技 ETF，對利率與政策風險反應最劇烈"}, {"t": "MD", "n": "兒科醫師服務組織，財報超標股價仍跌 12.3% 的案例"}], "en": "Healthcare is the most-discussed sector of the year and the one whose momentum least cooperates. The bull case lists cleanly: demographics, innovation pipelines, relatively cheap valuations, growing demand for advanced treatments. Measured on momentum, though, healthcare sits in the weakening quadrant, not the leading one. That gap is itself information: when a sector's narrative is complete and price does not follow, the market is usually weighting policy risk — reimbursement, drug pricing — above the narrative.", "zh": "醫療保健是今年被講最多、但動能最不配合的板塊。多頭理由條列起來很整齊：人口結構、創新管線、相對便宜的估值、先進療法的需求成長；但以動能指標衡量，醫療保健目前落在轉弱象限，而不是領先象限。這個落差本身就是資訊——當一個板塊的敘事已經完整、價格卻不跟上，通常代表市場對其中的政策風險（給付、藥價）給了比敘事更高的權重。", "url": "https://algolabhk.com/en/blogs/august-sector-focus"},
    {"id": "sector_2", "channel": "產業風向", "tag": "輪動擴散", "color": "#4EABA4", "stocks": [{"t": "XLI", "n": "工業板塊 ETF，位居領先象限"}, {"t": "XLB", "n": "原物料板塊 ETF，同步轉強"}, {"t": "XLP", "n": "必需消費 ETF，防禦性板塊同時領先值得留意"}], "en": "The most important thing happening at the sector level in 2026 is that the tech-only rally running since 2023 is broadening outward. Consumer staples, industrials, materials and energy currently occupy the leading quadrant, as capital rotates out of heavily concentrated mega-cap tech and into more reasonably valued cyclicals. The logic is a shift in the investment cycle — from early-stage infrastructure buildout in chips and cloud capacity toward broad enterprise application, moving the beneficiary from hardware supplier to end industry.", "zh": "2026 年在板塊層面最重要的一件事，是自 2023 年以來由科技獨撐的漲勢正在往外擴散。目前站在領先象限的是必需消費、工業、原物料與能源；資金從高度集中的超大型科技股，流向估值相對合理的景氣循環股。背後的邏輯是投資週期的位移——從早期的基礎建設鋪設（晶片、雲端機房），轉向廣泛的企業應用，受惠者也從硬體供應商換成終端產業。", "url": "https://www.morningstar.com/stocks/6-stocks-driving-2026-stock-market-rotation"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素創高", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，指數創 3,045.48 點新高"}, {"t": "IJR", "n": "標普小型股 600 ETF，成分股獲利門檻較高的對照組"}, {"t": "VTWO", "n": "另一檔羅素 2000 ETF，費用率較低"}], "en": "The Russell 2000 set a record at 3,045.48 on Thursday, its 27th record close of 2026, and is up 22.7% year to date — 9.5 percentage points ahead of the S&P 500 and ahead of the Nasdaq 100's 19%. It is the index's best year since 2003. The read on the street is that investors are hunting the second layer of AI beneficiaries beyond the Magnificent 7, and most of that layer does not sit in the large-cap indexes.", "zh": "羅素 2000 指數週四以 3,045.48 點寫下歷史新高，是 2026 年第 27 次收盤新高；今年以來累計上漲 22.7%，領先標普 500 達 9.5 個百分點，也超過那斯達克 100 的 19%。這是羅素 2000 自 2003 年以來最好的一年。市場對這件事的解釋是：投資人開始在七雄之外尋找 AI 的第二層受惠者，而那一層大多不在大型指數裡面。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "極端漲幅", "color": "#5B8ED6", "stocks": [{"t": "BNAI", "n": "Brand Engagement Network，今年以來漲 553%，指數第一大贏家"}, {"t": "AEHR", "n": "Aehr Test Systems，今年以來漲 518%，且在忽視雷達池內"}, {"t": "IWO", "n": "羅素 2000 成長型 ETF，極端漲幅集中在成長端"}], "en": "Break down where the Russell 2000's gain came from this year and you get a picture that looks nothing like +22.7%. The two biggest winners are Brand Engagement Network, up 553%, and Aehr Test Systems, up 518%. Moves of that size are not explained by multiple re-rating; they are the market repricing a story that has not been proven yet. They contribute a lot to the index and almost nothing to the question of whether small caps as a class got better or cheaper. When you read an index return, ask what the median constituent did.", "zh": "拆開羅素 2000 今年的漲幅來源，會看到一個和「上漲 22.7%」完全不同的畫面。今年以來指數內漲最多的兩檔，是 Brand Engagement Network 上漲 553%、Aehr Test Systems 上漲 518%。這種量級的漲幅不是本益比重評價能解釋的，而是市場對一個尚未被證明的故事重新定價；它們對指數的貢獻很大，但對「小型股整體是否變便宜或變好」這個判斷幾乎沒有參考價值。看指數漲幅時，記得先問中位數的成分股漲了多少。", "url": "https://www.benzinga.com/etfs/specialty-etfs/26/08/61181756/quick-spark-russell-2000-hits-new-record-highs-beats-nasdaq-100-in-2026"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "利率槓桿", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，成分股浮動利率負債比重高於大型股"}, {"t": "SPY", "n": "標普 500 ETF，成分股多已鎖定長天期固定利率"}, {"t": "SITE", "n": "景觀建材批發商，需求同時綁住宅支出與利率的小型股案例"}], "en": "Why does a headline like September hike odds fell always move small caps more than large caps? Debt structure. Russell 2000 constituents carry a far higher share of floating-rate debt than S&P 500 constituents. Large caps mostly termed out into long-dated fixed coupons during the cheap-money years; small caps generally finance through bank revolvers and term loans. So every repricing of the rate path changes next quarter's actual interest expense for a small cap, while for a large cap it only changes a discount rate.", "zh": "為什麼「9 月升息機率下降」這種消息，在小型股身上的反應總是大於大型股？關鍵在負債結構。羅素 2000 成分股使用浮動利率負債的比重，遠高於標普 500 成分股；大型股多半在低利率年代把債務鎖成長天期固定利率，小型股則普遍靠銀行循環額度與定期貸款融資。所以利率路徑的每一次重新定價，對小型股是直接改動下一季的利息費用，對大型股只是換算折現率而已。", "url": "https://www.ssga.com/us/en/intermediary/insights/small-caps-rally-may-be-more-durable-than-investors-think"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "流動性差異", "color": "#5B8ED6", "stocks": [{"t": "RRGB", "n": "財報超預期單日漲近 25%"}, {"t": "CURI", "n": "財報後跳漲 21%，市值不到十億美元"}, {"t": "MU", "n": "同日在正面消息下只漲 3.09%，市值一兆美元"}], "en": "The same piece of news can move a small cap ten times as far as a large cap, and the reason is market depth and float, not the importance of the news. Red Robin jumped nearly 25% on Thursday on an earnings beat; CuriosityStream had jumped 21% on its own print. The same day, Micron rose 3.09% on genuinely positive memory-cycle news. Small caps have wide spreads and thin order books, so the same dollar of buying has to clear more price levels. The practical implication: a small cap's one-day move is not a clean readout of how much better the market thinks the business got.", "zh": "同一則新聞在小型股與大型股身上的振幅可以差十倍，原因是造市深度與流通股數，不是消息本身的重要性。週四紅羅賓漢堡因為一份超預期的財報單日大漲近 25%，CuriosityStream 在自己的財報後也曾跳漲 21%；同一天，美光在記憶體循環的正面消息下只漲 3.09%。小型股的買賣價差寬、委託簿薄，同樣金額的買盤必須吃掉更多層報價才成交。對讀者的意義是：小型股的單日漲幅，不能直接當成市場認為它變好了多少。", "url": "https://www.cnbc.com/2026/08/13/stocks-making-the-biggest-moves-midday-nflx-smci-sndk-stub.html"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "銀行骨幹", "color": "#5B8ED6", "stocks": [{"t": "STBA", "n": "S&T Bancorp，淨息差擴大到 3.99%、每股 1.02 美元"}, {"t": "BANR", "n": "Banner Corporation，每股 1.43 美元但較前季 1.60 美元下滑"}, {"t": "MPB", "n": "Mid Penn Bancorp，營收年增 39.6% 但多來自併購"}], "en": "Small caps are not only AI beneficiaries — regional and community banks are one of the heaviest groups in the Russell 2000, and the 16 September rate decision is a direct income-statement event for them. Recent results show the group diverging. S&T Bancorp earned $36.6 million, or $1.02 a share, in the second quarter, up 22.9% year over year, with net interest margin widening to 3.99%. Banner earned $1.43 a share, better than a year ago but below the prior quarter's $1.60. Same rate environment, but some banks grew earning assets and others bought volume with higher borrowings.", "zh": "談小型股不能只談 AI 受惠者——區域與社區銀行是羅素 2000 裡權重最重的族群之一，而 9 月 16 日的利率決策對它們是直接的損益表事件。從最近幾份財報看，這個族群的體質其實正在分岔：S&T Bancorp 第二季淨利 3,660 萬美元、每股 1.02 美元，年增 22.9%，淨息差擴大到 3.99%；Banner 每股 1.43 美元優於去年同期，但低於前一季的 1.60 美元。同一個利率環境，有的銀行靠生息資產成長，有的靠拉高借款堆量，品質完全不同。", "url": "https://www.chartmill.com/news/STBA/Chartmill-51506-ST-Bancorp-NASDAQSTBA-Stock-Rises-on-Earnings-Beat-and-New-100M-Buyback-Program"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "stocks": [{"t": "CURI", "n": "第二季營收年增 22%、授權營收年增 48%，淨利創紀錄 890 萬美元"}, {"t": "NFLX", "n": "串流龍頭，是這類片庫授權的潛在需求方"}, {"t": "IMAX", "n": "同屬小型內容授權模式的對照組"}], "en": "CuriosityStream is a sub-billion-dollar streaming platform built on documentary and non-fiction content. Why it is ignored is textbook: filed after its 2021 listing under broken pandemic streamer, generalist funds long gone, sell-side coverage near zero. What is changing is the revenue mix. Second-quarter revenue was $23.2 million, up 22%, with licensing revenue up 48% to $14.1 million from licensing out the existing library. Net income was a record $8.9 million against $0.8 million a year earlier, or $0.15 a share; adjusted EBITDA was $11.4 million, up roughly 300%; gross margin went from 53% to 73%. Management raised full-year guidance and declared a third-quarter dividend of $0.085. The counter-argument: licensing revenue is lumpy — one large deal can carry a quarter — and the stock already jumped 21% on the day. This is a research lead, not investment advice.", "zh": "CuriosityStream 是一家以紀錄片與非虛構內容為主的串流平台，市值不到十億美元。被忽視的原因很典型：2021 年掛牌後被歸到「壞掉的疫情串流股」抽屜，泛用型基金早已離場、賣方覆蓋接近零。正在改變的是收入結構——第二季營收 2,320 萬美元、年增 22%，其中授權營收年增 48% 至 1,410 萬美元，來自把既有片庫授權出去；單季淨利 890 萬美元創紀錄（去年同期僅 80 萬），每股 0.15 美元，調整後 EBITDA 1,140 萬美元、年增約 300%，毛利率由 53% 提升到 73%。公司同時上修全年財測，並宣布第三季每股 0.085 美元現金股利。反方必須記住：授權收入是塊狀的，一筆大約就能撐起一季，而股價當天已經漲了 21%。這是研究線索，不是投資建議。", "url": "https://www.newswire.com/news/curiositystream-delivers-record-q2-earnings-as-licensing-momentum-drives-8-9", "status": "RADAR · 下一個驗證點 11 月 Q3 財報看授權營收是否具經常性"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "stocks": [{"t": "UMH", "n": "第二季租金收入年增 10.3%、售屋收入創 1,140 萬美元紀錄"}, {"t": "ELS", "n": "Equity LifeStyle，製造住宅社區龍頭對照組"}, {"t": "SUI", "n": "Sun Communities，同業中規模最大者"}], "en": "UMH Properties is a manufactured housing REIT that owns and rents roughly 11,200 rental homes across communities in the central and eastern US. It is ignored on two levels: with the 30-year Treasury yield at a 19-year high, institutions have avoided REITs wholesale, and manufactured housing has no story to tell on top of that. What is changing is the operating line. Second-quarter rental and related income rose 10.3% year over year, July same-store rose 9.2%, and home sales income rose 9.2% to a quarterly record of $11.4 million. Normalised FFO was $21.5 million, or $0.25 a share; net income was $4.4 million with EPS of $0.05 against a $0.028 estimate, on revenue of $71.64 million versus $60.76 million expected. Occupancy is 95.3%. Insiders have traded five times in six months, all purchases. The counter-argument is that those purchases are tiny — the smallest was 68 shares — so reading them as a cluster is a stretch, and REITs live on the long end, which did not follow the short end down this week. This is a research lead, not investment advice.", "zh": "UMH Properties 是一檔製造住宅（活動住宅社區）不動產信託，在美國中部與東部持有並出租約 11,200 戶出租屋。它被忽視有兩層原因：三十年期公債殖利率創十九年新高，法人整批迴避不動產信託；加上製造住宅這個品類本身沒有故事性。正在改變的是營運數字——第二季租金及相關收入年增 10.3%，7 月同店年增 9.2%，售屋收入年增 9.2% 至單季紀錄 1,140 萬美元；正常化營運資金 2,150 萬美元、每股 0.25 美元，淨利 440 萬美元，每股盈餘 0.05 美元優於預估的 0.028，營收 7,164 萬美元遠高於預估的 6,076 萬，出租率 95.3%。內部人近六個月五筆交易全部是買進、零賣出。反方要講清楚：那五筆的規模都很小（最小一筆只有 68 股），當成群聚買進解讀是過度延伸；而不動產信託吃的是長端殖利率，本週長端幾乎沒有跟著短端下來。這是研究線索，不是投資建議。", "url": "https://www.stocktitan.net/news/UMH/umh-properties-inc-second-quarter-2026-operations-mc916k1367xe.html", "status": "RADAR · 下一個驗證點 Q3 財報看同店租金增速能否守住 9%"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "池內追蹤", "color": "#C9A227", "stocks": [{"t": "MOV", "n": "8 月 20 日財報，股價約 37.84 美元逼近 52 週高點"}, {"t": "FOSL", "n": "Fossil Group，同屬授權錶模式的對照組"}, {"t": "TPR", "n": "Tapestry，Coach 母公司，Movado 為其代工授權錶款"}], "en": "Movado Group, already in the radar pool, reports next Thursday, 20 August — the single most important date on its calendar this year. The watch and jewellery group (Movado and Ebel in-house, plus licensed watches for Coach, Tommy Hilfiger, Lacoste and HUGO) is ignored because the category is unfashionable, the market cap is only about $434 million, and analyst coverage is thin. Three things to check this quarter: whether the earnings momentum holds after last quarter's $0.32 EPS versus a $0.07 estimate, a 357% surprise; what the Kate Spade New York global watch licence effective 1 July actually contributes to revenue and margin; and whether management finally issues guidance for the next fiscal year. Note the valuation: at roughly $37.84 against a 52-week high of $39.85 and a P/E of 24.4, the margin of safety is compressed — this quarter has to be judged on whether growth is delivered, not on whether the stock is cheap. This is a research lead, not investment advice.", "zh": "雷達池內的 Movado Group 下週四 8 月 20 日交卷，這是它今年最重要的一個日期。這家手錶與珠寶品牌集團（自有 Movado、Ebel，並代工 Coach、Tommy Hilfiger、Lacoste、HUGO 等授權錶）被忽視的原因是產業冷門、市值僅約 4.34 億美元、分析師覆蓋極少。這一季要看三件事：上一季每股盈餘 0.32 美元遠勝預估的 0.07 美元（意外幅度 357%），這種動能能不能延續；7 月 1 日生效的 Kate Spade New York 全球授權錶合作，對營收與毛利的實際貢獻是多少；以及管理層是否終於給出下個會計年度的財測。估值要提醒：股價約 37.84 美元、逼近 52 週高點 39.85，本益比 24.4 倍，安全邊際已被壓縮，這一季必須用「成長是否兌現」而不是「便不便宜」來檢驗。這是研究線索，不是投資建議。", "url": "https://stockanalysis.com/stocks/mov/statistics/", "status": "RADAR · 下一個驗證點 08/20 財報"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內追蹤", "color": "#C9A227", "stocks": [{"t": "AEHR", "n": "今年以來漲 518%，為羅素 2000 第二大贏家"}, {"t": "COHU", "n": "同屬半導體測試設備，規模較大的對照組"}, {"t": "ONTO", "n": "Onto Innovation，製程控制與檢測，同一條資本支出鏈"}], "en": "Aehr Test Systems entered the radar pool only yesterday, and today it needs an honest update: it is up 518% year to date, the second-biggest winner in the Russell 2000. That means the premise written at entry — microcap, thin coverage, ignored — no longer fully holds. A stock that has gone up more than fivefold and is being named in the financial press is hard to describe as unnoticed. The fundamentals have not changed: fiscal fourth-quarter revenue of $18.8 million, record quarterly bookings of $60.7 million, effective backlog of $100.6 million, a swing to profit at $0.11 a share, and fiscal 2027 revenue guidance of $130-150 million, up roughly 160-200% and far above the roughly $85 million consensus. But $100.6 million of backlog against $130-150 million of guidance means part of that guidance is not yet covered by orders. This is a research lead, not investment advice.", "zh": "池內的 Aehr Test Systems 昨天才進池，今天就必須做一次誠實的更新：它今年以來上漲 518%，是羅素 2000 第二大贏家。這代表入池時寫的「微型股、覆蓋薄、被忽視」這個前提，今天已經不完全成立——一檔漲了五倍、被財經媒體點名的股票，很難再說沒有人注意。基本面的部分沒有變：會計年度第四季營收 1,880 萬美元、單季訂單創 6,070 萬美元紀錄、有效在手訂單 1.006 億美元、由虧轉盈每股 0.11 美元，2027 年度營收指引 1.3 至 1.5 億美元、年增約 160% 至 200%，遠高於市場約 8,500 萬的預估。但在手訂單 1.006 億對應 1.3 至 1.5 億的指引，代表其中有一段還沒被訂單覆蓋，要靠新接單補。這是研究線索，不是投資建議。", "url": "https://www.benzinga.com/etfs/specialty-etfs/26/08/61181756/quick-spark-russell-2000-hits-new-record-highs-beats-nasdaq-100-in-2026", "status": "RADAR · 下一個驗證點 10 月 Q1 財報看在手訂單能否續增"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內追蹤", "color": "#C9A227", "stocks": [{"t": "ICFI", "n": "1 至 6 月已實際買回 435,000 股、金額 2,900 萬美元"}, {"t": "BAH", "n": "Booz Allen，政府顧問業最大同業"}, {"t": "LDOS", "n": "Leidos，聯邦服務外包的對照組"}], "en": "ICF International, in the radar pool, is a consultancy serving government, energy and climate clients. It is ignored because consulting has no product story to tell, and a first-quarter miss pushed generalist funds out. Today's update is on execution of capital allocation: the board authorised a $100 million buyback on 25 June, about 8.1% of shares outstanding, and from January to June the company had already repurchased 435,000 shares for $29 million. That is executed, not merely authorised, and the two carry very different information. Full-year revenue guidance is maintained at $1.89-1.96 billion, and it won a $14 million contract with California's Department of Transportation. The counter-argument is blunt: federal budget and policy exposure is the entire business, and with a net margin under 5% the operating leverage is limited. This is a research lead, not investment advice.", "zh": "池內的 ICF International 是一家服務政府、能源與氣候客戶的顧問公司，被忽視的原因是顧問業沒有產品故事、缺乏題材性，加上第一季財報未達標把泛用型基金趕走。今天要更新的是資本配置的執行進度：董事會 6 月 25 日授權 1 億美元庫藏股（約當流通股 8.1%），而 1 至 6 月已經先買回 435,000 股、金額 2,900 萬美元——這是「已執行」而不只是「已授權」，兩者的資訊量差很多。全年營收指引維持在 18.9 億至 19.6 億美元，另外拿下加州交通局 1,400 萬美元合約。反方很直接：聯邦預算與政策曝險就是它的全部生意，而顧問業淨利率不到 5%，獲利槓桿有限。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/commercial-services/nasdaq-icfi/icf-international/news/icf-international-and-2-other-undervalued-small-caps-with-in", "status": "RADAR · 下一個驗證點 下一份 10-Q 的實際買回股數與均價"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內追蹤", "color": "#C9A227", "stocks": [{"t": "ANIK", "n": "第二季毛利率由 51% 擴張到 65%，6 月遭多個指數剔除"}, {"t": "OFIX", "n": "Orthofix，池內小型醫材，給付政策逆轉的案例"}, {"t": "IHI", "n": "醫療器材 ETF，族群估值的對照組"}], "en": "Anika Therapeutics, in the radar pool, gained one piece of information today that was not there at entry: it was dropped from several indices in June. That is the mechanism of neglect in its purest form — index deletion brings passive selling and the withdrawal of tracking money, with nothing to do with whether the business is good. The fundamentals point the other way. Second-quarter revenue was a record $32.61 million, up 16%, with net income of $3.31 million against a loss a year earlier, and gross margin expanding from 51% to 65%. Management raised full-year revenue growth guidance to 5-10% and the adjusted EBITDA margin target to 13-17%. On capital allocation, the company has repurchased 2.1 million shares for $30.39 million since May 2024. The risks are equally clear: one profitable quarter is a very short record for a company with a history of losses, and reimbursement risk in small-cap medtech arrives without warning — see Orthofix's CMS reversal in the same pool. This is a research lead, not investment advice.", "zh": "池內的 Anika Therapeutics 今天多了一項入池時沒有的資訊：它在 6 月被剔出數個指數。這件事本身就是忽視的機制——指數剔除會帶來被動賣壓與追蹤資金撤離，跟公司好壞無關。基本面則往另一個方向走：第二季營收 3,261 萬美元創單季紀錄、年增 16%，淨利 331 萬美元（去年同期為虧損），毛利率從 51% 擴張到 65%；公司同時上修全年營收成長至 5% 至 10%、調整後 EBITDA 利潤率至 13% 至 17%。資本配置面，自 2024 年 5 月以來已買回 210 萬股、金額 3,039 萬美元。風險同樣清楚：一季獲利對一家有虧損歷史的公司來說是很短的紀錄，而小型醫材的給付風險往往毫無預警（可對照池內 Orthofix 的 CMS 逆轉案例）。這是研究線索，不是投資建議。", "url": "https://simplywall.st/stocks/us/consumer-durables/nasdaq-sono/sonos/news/discover-august-2026s-undervalued-small-caps-with-insider-bu", "status": "RADAR · 下一個驗證點 11 月財報看 65% 毛利率能否守住"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "13F 截止", "color": "#6DB56D", "stocks": [{"t": "BRK.B", "n": "波克夏，每季最受關注的 13F 申報者"}, {"t": "BX", "n": "黑石集團，另類資產管理的部位揭露"}, {"t": "TROW", "n": "普信集團，長期持有型基金的代表"}], "en": "Today, 14 August, is the filing deadline for second-quarter 13Fs — any manager with more than $100 million in US equity assets must disclose holdings within 45 days of quarter-end. Start with what it does not tell you: long US equity positions, convertibles and the notional value of options only. No shorts, no bonds, no foreign holdings. And the as-of date is 30 June, so by the time you read it the data is six weeks old. The right use of a 13F is as a source of research leads and a way to watch long-horizon holders shift, not as homework to copy — for a high-turnover fund, six weeks is enough to have replaced the whole book.", "zh": "今天 8 月 14 日是第二季 13F 申報的截止日——管理超過 1 億美元美股資產的機構，必須在季末後 45 天內揭露持股。要先知道它不告訴你什麼：只有美股多頭部位、可轉債與選擇權的名目金額，不含空頭部位、不含債券與海外持股；而且資料的基準日是 6 月 30 日，看到的時候已經放了六週。所以 13F 的正確用法，是拿來找研究線索與觀察長期持有者的部位變化，而不是拿來抄作業——特別是對周轉率高的基金，六週足以讓整個部位換掉。", "url": "https://www.finrep.ai/blog/13f-filing-deadlines-2026-every-date-rule-and-trap"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "相對規模", "color": "#6DB56D", "stocks": [{"t": "SITE", "n": "執行長 8 月 4 日買進 816,280 美元，為近十二個月最大單筆"}, {"t": "LUMN", "n": "執行長 8 月 6 日買進 612,680 美元，但佔既有部位比重極小"}, {"t": "DTM", "n": "DT Midstream，董事 8 月 7 日以 132.61 美元買進 1,500 股"}], "en": "When reading insider buys, the dollar amount alone means nothing — relative size is the test. On 4 August, SiteOne Landscape Supply CEO Doug Black bought 8,000 shares through a family trust for $816,280 at about $102.03, the company's largest insider purchase in twelve months, with the stock near a 52-week low. On 6 August, Lumen CEO Kathleen Johnson bought 100,000 shares for $612,680 — a similar-looking number, except they already held roughly 7.5 million shares directly, so the add is a tiny fraction of an existing position. Both are chief executives writing a cheque; the first is doubling down, the second is closer to routine allocation.", "zh": "判讀內部人買進，金額本身沒有意義，要看的是相對規模。8 月 4 日 SiteOne Landscape Supply 執行長布萊克透過家族信託買進 8,000 股、金額 816,280 美元，均價約 102.03 美元——這是該公司近十二個月最大的一筆內部人買進，而且發生在股價貼近 52 週低點的時候。8 月 6 日 Lumen 執行長強森買進 100,000 股、金額 612,680 美元，數字看起來接近，但她名下原本就直接持有約 750 萬股，這筆加碼佔既有部位的比重極小。同樣是執行長掏現金，前者是加倍下注，後者比較接近例行配置。", "url": "https://www.benzinga.com/news/26/08/61043880/bullish-move-doug-black-shows-confidence-acquires-816k-siteone-landscape-supply-stock"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "授權與執行", "color": "#6DB56D", "stocks": [{"t": "FIGS", "n": "授權提高到 2 億美元，上半年已實際買回 3,280 萬美元"}, {"t": "EHC", "n": "Encompass Health，7 月 23 日將授權加到 10 億美元"}, {"t": "ICFI", "n": "ICF International，1 億授權中已執行 2,900 萬美元"}], "en": "Buyback announcements come in two kinds with very different information content: the board authorised, and we already bought. An authorisation is only permission and can quietly go unused; what matters is the actual share count and average price in the next 10-Q. This year offers clean comparisons. FIGS raised its authorisation to $200 million on 6 August — backed by 2,580,973 shares actually repurchased in the first half for about $32.8 million. Encompass Health lifted its authorisation to $1 billion on 23 July. ICF International authorised $100 million and had already executed $29 million. An authorisation with an execution record behind it is a different signal from one without.", "zh": "庫藏股公告有兩種，資訊量差很多：一種是「董事會授權」，另一種是「已經買了」。授權只是許可，隨時可以不執行；真正該看的是下一份 10-Q 裡的實際買回股數與均價。今年的例子很好對照：FIGS 在 8 月 6 日把授權提高到 2 億美元，但背書是上半年已實際買回 2,580,973 股、約 3,280 萬美元；Encompass Health 於 7 月 23 日把授權加到 10 億美元；ICF International 授權 1 億美元，同期已執行 2,900 萬美元。有執行紀錄背書的授權，跟單純的授權，是兩種不同強度的訊號。", "url": "https://www.sec.gov/Archives/edgar/data/0001846576/000162828026054319/figs-20260806.htm"},
    {"id": "week_0", "channel": "本週事件", "tag": "總經行事曆", "color": "#C97DD4", "stocks": [{"t": "XRT", "n": "零售業 ETF，零售銷售數據的直接對應"}, {"t": "TLT", "n": "20 年期以上公債，長端對 PCE 的反應是本月焦點"}, {"t": "TIP", "n": "抗通膨債券，市場通膨補償的即時讀數"}], "en": "At 8:30 Eastern this morning the Census Bureau publishes advance July retail sales, expected to show a slight acceleration from June. It is the week's last release and the only one that measures consumer behaviour directly — CPI and PPI both measure prices only. From here the sequence is: PCE on 26 August, the Jackson Hole symposium 27 to 29 August, and the FOMC decision on 16 September. Between today and 16 September, PCE carries the most weight, because Thursday's 0.4% monthly rise in core PPI feeds straight into it.", "zh": "今天早上美東 8:30，美國普查局公布 7 月零售銷售預估值，市場預期較 6 月小幅加速——這是本週最後一份、也是唯一一份直接量測消費者行為的數據，前兩份（消費者物價、生產者物價）都只量價格。接下來的節奏是：8 月 26 日個人消費支出物價指數，8 月 27 日至 29 日傑克森洞研討會，9 月 16 日聯邦公開市場操作委員會決策。從今天到 9 月 16 日之間，PCE 那一份的權重最高，因為週四核心生產者物價月增 0.4% 的那條線會直接餵進去。", "url": "https://www.census.gov/retail/marts/www/marts_current.pdf"},
    {"id": "week_1", "channel": "本週事件", "tag": "零售財報週", "color": "#C97DD4", "stocks": [{"t": "HD", "n": "8 月 18 日盤前財報，對應住宅修繕與利率敏感支出"}, {"t": "TGT", "n": "8 月 19 日財報，中價位非必需零售的讀數"}, {"t": "WMT", "n": "8 月 20 日盤前財報，規模最大、畫布最完整"}], "en": "Next week is retail earnings week, with three bellwethers reporting in three days: Home Depot before the open on 18 August, Target on 19 August, and Walmart before the open on 20 August. Together they amount to a consumer physical — Home Depot maps to home improvement and rate-sensitive big-ticket spend, Target to mid-price discretionary retail, and Walmart, by sheer size, offers the broadest canvas. Movado, in the radar pool, also reports on 20 August. The thing to watch is not who beats, but whether all three tell the same story about second-half spending power.", "zh": "下週是零售財報週，三家指標公司在三天內連續交卷：家得寶 8 月 18 日盤前、目標百貨 8 月 19 日、沃爾瑪 8 月 20 日盤前。這三份財報合起來就是一份消費者體檢——家得寶對應住宅修繕與利率敏感的大額支出，目標百貨對應非必需的中價位零售，沃爾瑪因為規模最大而提供最完整的畫布。同一天（8 月 20 日）還有雷達池內的 Movado 交卷。這一週要看的不是誰超標，而是三家對下半年消費力的說法是否一致。", "url": "https://finance.yahoo.com/markets/stocks/articles/dear-home-depot-stock-fans-130002400.html"},
    {"id": "eval_0", "channel": "今日評估", "tag": "今日一件事", "color": "#E8A838", "stocks": [{"t": "BLK", "n": "貝萊德，投資組合管理費用是核心生產者物價這次的主推力"}, {"t": "SCHW", "n": "嘉信理財，同一費用項目的另一個承載者"}, {"t": "VIXY", "n": "波動率 ETF，VIX 週四回落近 5%，市場定價的是頭條而非核心"}], "en": "The thing most worth noticing today is that two numbers inside the same PPI report moved in opposite directions. The headline was final demand unchanged on the month — that is the one the market bought, and it is why the S&P 500 closed above 7,800 for the first time. But core PPI, excluding food, energy and trade services, rose 0.4%, four times June's pace, driven mainly by a 6.5% jump in portfolio management fees. That line feeds directly into the PCE price index on 26 August, the gauge the Fed actually watches. The market bought the number that suited it. Open question: if core PCE on 26 August makes visible the 0.4% that was ignored on Thursday, was today's record high an early read or a misread?", "zh": "今天最值得注意的一件事，是同一份生產者物價報告裡的兩個數字往相反方向走。頭條是最終需求月增零，市場買的是這一個，標普 500 因此首度收在 7,800 點之上。但剔除食品、能源與貿易服務後的核心月增 0.4%，是 6 月的四倍，主要推力是投資組合管理費用單月上漲 6.5%——而這一項會直接進到 8 月 26 日的個人消費支出物價指數，也就是聯準會真正在看的那把尺。市場買了對自己有利的那個數字。開放式問題：如果 8 月 26 日的核心 PCE 把週四被忽略的那 0.4% 具現出來，今天的紀錄高點是提前反映，還是誤讀？", "url": "https://www.realclearmarkets.com/articles/2026/08/13/ppi_confirms_cpi_and_tells_the_fed_to_not_invent_an_inflation_crisis_1200202.html", "status": "討論題 · 今天哪一個數字才是真的"}
];

// 內容指紋:CARDS 一換(每日排程更新)就變,閱讀進度 key 跟著換 → 新的一天自動從第 1 張開始讀。
// 排程只要照常抽換 CARDS 就好,不用額外維護日期。
const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();
const lsKeyFor = (sub) => "mosfeed_" + BRIEF_ID + "_" + sub;

const DISCUSS_PROMPT = "我剛讀完 2026-08-14 的 Mo's Feed 財經晨報（9 頻道 30 卡）。今天重點：(1) 標普 500 週四收 7,798.99、上漲 0.65%，史上首度站上 7,800 點，那指漲 0.81% 收 26,803.03，道瓊只漲 0.13%；(2) 推力是 7 月生產者物價最終需求月增零（市場原預期 +0.2%）、年增 4.7%，加上油價重挫逾 2%（布蘭特 87.07、西德州 81.25）；(3) 但同一份報告的核心（剔除食品、能源、貿易服務）月增 0.4%，是 6 月的四倍，主推力是投資組合管理費用大漲 6.5%，這一項會直接餵進 8/26 的 PCE；(4) 羅素 2000 以 3,045.48 點創今年第 27 次收盤新高，年初至今 +22.7%，領先標普 9.5 個百分點、也超過那斯達克 100 的 19%，是 2003 年以來最好的一年；(5) 財報兩面：應用材料財測 102.5 億遠超共識 95.4 億仍盤後跌近 3%，Cerebras 營收 1.80 億低於 1.94 億共識重挫 14%——市場買的是與預期的差距，不是絕對數字；(6) 雷達池今日：新名字 CuriosityStream（授權營收 +48%、淨利創紀錄 890 萬）與 UMH Properties（租金收入 +10.3%、售屋創紀錄），池內更新 MOV（8/20 財報）、AEHR（年初至今 +518%，忽視前提已不成立）、ICFI、ANIK（6 月遭指數剔除）。請跟我討論：頭條與核心背道而馳時該信哪一個？8/26 PCE 之前要不要先減碼？雷達池的兩個新名字論點站得住嗎？雷達池在 Notion：https://app.notion.com/p/6ae9be8507e24aaf85a9a8af4b69fcf0";

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/14/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v7.5</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
