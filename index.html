<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    { "id": "overnight_0", "channel": "隔夜盤勢", "tag": "指數收盤", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普 500 ETF，收 7,728.20、跌 0.32%"}, {"t": "DIA", "n": "道瓊 ETF，指數跌 184.13 點收 53,791.85"}, {"t": "QQQ", "n": "那斯達克 100，那指跌 0.60% 領跌"}], "en": "US stocks fell for a second straight session Tuesday as the US-Iran standoff hardened and traders braced for inflation data. The Dow shed 184.13 points to 53,791.85, the S&P 500 lost 0.32% to 7,728.20, and the Nasdaq dropped 0.60% to 26,445.45. This wasn't panic selling — it was money stepping back ahead of a print that could decide the Fed's September move.", "zh": "週二美股連二日收黑，美伊僵局升溫，加上市場屏息等待通膨數據。道瓊跌 184.13 點收 53,791.85，標普 500 跌 0.32% 收 7,728.20，那斯達克跌 0.60% 收 26,445.45。這不是恐慌性賣壓，而是資金在一份可能決定 9 月 Fed 動向的數據公布前先行減碼。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-tuesday-august-11-dow-sp-500-nasdaq-102827503.html" },
    { "id": "overnight_1", "channel": "隔夜盤勢", "tag": "權值股", "color": "#E05C5C", "stocks": [{"t": "GOOGL", "n": "Alphabet，週二收跌約 3.6%，資本支出上修與人事異動雙殺"}], "en": "Alphabet was Tuesday's heaviest mega-cap, closing down about 3.6%. Three things landed at once: Demis Hassabis stepped down as DeepMind CEO while staying on as chairman and veteran AI scientist Jeff Dean left to start his own venture; the 2026 capex forecast rose to $195-205B from $180-190B; and the company closed a $25B senior notes offering with maturities stretching to 2066. Quarterly capex doubled year over year to $44.9B and free cash flow turned negative for the first time.", "zh": "Alphabet 是週二權值股裡最沉重的一顆，收盤跌約 3.6%。三件事同時砸下來：DeepMind 執行長 Demis Hassabis 卸任僅留任董事長，資深 AI 科學家 Jeff Dean 出走創業；公司把 2026 年資本支出財測從 1,800 至 1,900 億上調到 1,950 至 2,050 億美元；並完成 250 億美元優先無擔保債券發行，到期日一路排到 2066 年。單季資本支出年增一倍到 449 億美元，自由現金流首度轉負。", "url": "https://www.fool.com/investing/2026/08/11/sundar-pichai-alphabet-2026-capex-forecast-buy/" },
    { "id": "overnight_2", "channel": "隔夜盤勢", "tag": "地緣油價", "color": "#E05C5C", "stocks": [{"t": "USO", "n": "原油 ETF，布蘭特逼近每桶 88 美元、連四日上漲"}, {"t": "XLE", "n": "能源類股，供給風險溢價的直接受惠者"}, {"t": "FRO", "n": "Frontline，油輪航商，海峽航運風險的第一線"}], "en": "Oil extended gains Tuesday, with Brent pushing toward $88 a barrel — a fourth straight up session and a near two-week high. The sticking point is sequencing: Tehran wants the US blockade lifted before it fully reopens Hormuz, while Washington says it is 'only semi-negotiating.' Houthi forces claimed an attack on Saudi Arabia's Jazan refinery and an ADNOC-operated tanker was hit inside the strait. This supply premium is building the day before CPI.", "zh": "油價週二續強，布蘭特逼近每桶 88 美元、連四個交易日上漲，創近兩週新高。癥結在順序問題：德黑蘭要求美國先解除封鎖才願意完全重開荷莫茲海峽，華府則說只是「半談判」。同時青年運動宣稱襲擊沙烏地 Jazan 煉油廠，一艘阿布達比國家石油公司營運的油輪在海峽內遇襲。這條供給風險溢價，正好卡在 CPI 公布的前一天堆高。", "url": "https://www.aljazeera.com/economy/2026/8/10/oil-prices-climb-as-iranian-demands-cloud-outlook-for-strait-of-hormuz" },
    { "id": "overnight_3", "channel": "隔夜盤勢", "tag": "盤勢結構", "color": "#E05C5C", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，指數漲 9.72 點收 3,027.12"}, {"t": "RSP", "n": "標普 500 等權重 ETF，看的是廣度而非權值"}, {"t": "MDY", "n": "中型股 ETF，夾在大小型股分歧中間"}], "en": "Market structure said more than the index levels Tuesday: the Russell 2000 rose 9.72 points to 3,027.12 — the only major index to close green — while large caps fell across the board. Same day, same looming CPI, opposite bets from small caps and large caps. Divergences like this usually resolve one way, and the data is about to be the referee.", "zh": "看盤面結構比看指數點位更有訊息量：週二羅素 2000 逆勢上漲 9.72 點收 3,027.12，是唯一收紅的主要指數，而大型股全面走弱。同一天、同一份即將公布的 CPI，大小型股卻做出方向相反的下注。這種分歧通常只有一種結局能成立，而裁判就要出場了。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-11-2026" },
    { "id": "earn_0", "channel": "財報速報", "tag": "AI 基建", "color": "#E8786A", "stocks": [{"t": "CRWV", "n": "CoreWeave，盤後漲逾一成，待履約訂單跳到 1,292 億美元"}], "en": "CoreWeave delivered the quarter's most-watched AI print after Tuesday's close: an adjusted loss of $1.03 per share against $1.20 expected, revenue of $2.58B up 112% year over year, and shares up more than 10% in extended trading. The real number is backlog — $104.2B at quarter-end to $129.2B as of Aug 11, roughly $25B added in under six weeks, with Anthropic and Meta signed during the quarter. CEO Michael Intrator called it the point where scale starts converting into operating leverage.", "zh": "CoreWeave 在週二盤後交出本季最受矚目的 AI 財報：調整後每股虧損 1.03 美元優於預估的虧損 1.20，營收 25.8 億美元、年增 112%，盤後一度漲逾一成。真正的重點在待履約訂單，從第二季底的 1,042 億美元跳到 8 月 11 日的 1,292 億，不到六週增加約 250 億，本季新簽 Anthropic 與 Meta 兩個客戶。執行長 Michael Intrator 說公司走到了「規模開始轉化為營運槓桿」的拐點。", "url": "https://www.cnbc.com/2026/08/11/coreweave-crwv-q2-earnings-report-2026.html" },
    { "id": "earn_1", "channel": "財報速報", "tag": "財報季", "color": "#E8786A", "stocks": [{"t": "XLV", "n": "醫療類股，唯一獲利年減、卻也是正面意外的主要來源"}, {"t": "XLC", "n": "通訊服務類股，雙位數獲利成長的領軍板塊之一"}], "en": "Zoom out and Q2 growth is broad but uneven: eight of ten S&P 500 sectors are posting double-digit earnings growth, led by Energy, Communication Services, Consumer Discretionary, Information Technology and Materials. The only sector with a year-over-year decline is Health Care — yet in the same data, the positive EPS surprises that lifted the index growth rate most came from Health Care, Communication Services and Energy. A low bar is itself an asset.", "zh": "把整季拉遠看，Q2 的成長是全面的但不平均：標普 500 十個板塊有八個交出雙位數獲利成長，由能源、通訊服務、非必需消費、資訊科技與原物料領軍。唯一年減的是醫療保健，但在同一份統計裡，把指數整體成長率推上去的正面每股盈餘意外，也由醫療保健、通訊服務與能源包辦。低預期本身就是一種資產。", "url": "https://insight.factset.com/sp-500-earnings-season-update-august-7-2026" },
    { "id": "earn_2", "channel": "財報速報", "tag": "成長減速", "color": "#E8786A", "stocks": [{"t": "MNDY", "n": "monday.com，雙率超標仍因下季指引略低而下跌"}, {"t": "ETOR", "n": "eToro，每股 0.68 美元超標，加密營收年減三成、股價跌 8%"}, {"t": "ONON", "n": "On Holding，營收年增 21.6% 輸給預期的 24%，重挫 18%"}], "en": "What got punished this week wasn't the miss — it was the deceleration. Monday.com posted Q2 EPS of $1.48 against $1.11 expected and revenue of $364.6M above consensus, then sold off because Q3 guidance of $368-370M came in just under the $372M estimate. eToro beat at $0.68 a share but saw crypto-asset revenue fall about 30% and dropped 8%. On Holding grew revenue 21.6% versus the 24% the Street wanted and fell 18%. In 2026 the market is pricing the slope, not the level.", "zh": "本週被罰的不是「沒達標」，而是「減速」。monday.com 第二季每股盈餘 1.48 美元遠勝預估的 1.11、營收 3.646 億也超標，只因下季指引 3.68 至 3.70 億略低於預估的 3.72 億就被賣；eToro 每股 0.68 美元超標，但加密資產營收年減約三成，股價跌 8%；On Holding 營收年增 21.6%、輸給市場要的 24%，重挫 18%。2026 年的市場，定價的是斜率不是水位。", "url": "https://investrade.com/mid-morning-look-august-11-2026/" },
    { "id": "macro_0", "channel": "總經政策", "tag": "CPI 今日", "color": "#7C6AF7", "stocks": [{"t": "TLT", "n": "20 年期公債 ETF，對通膨數據最敏感"}, {"t": "TIP", "n": "抗通膨債 ETF，直接反映通膨預期定價"}], "en": "July CPI lands at 8:30 a.m. ET Wednesday, and it is the actual referee for every position this week. Consensus is headline +0.2% month over month, taking the annual rate down to 3.4%, with core +0.1% and 2.5% annual. Note where the headline sits: still above 3% — inflation isn't back at target, it is merely heading down.", "zh": "今晚台北時間 20:30、美東上午 8:30，美國勞工統計局公布 7 月 CPI，這是本週所有部位真正的裁判。市場共識是整體月增 0.2%、年增率降到 3.4%，核心月增 0.1%、年增 2.5%。要留意年增率仍在 3% 以上，通膨並沒有回到目標，只是往下走。", "url": "https://www.newsquawk.com/headlines/preview-us-cpi-due-wednesday-12th-august-2026-at-1330bst0830edt" },
    { "id": "macro_1", "channel": "總經政策", "tag": "升息辯論", "color": "#7C6AF7", "stocks": [{"t": "SHY", "n": "1 至 3 年期公債 ETF，短端政策預期的溫度計"}, {"t": "KRE", "n": "區域銀行 ETF，存款成本直接吃利率決策"}], "en": "Get the direction right: the live debate is whether the Fed hikes in September, not cuts. July's FOMC held at 3.50%-3.75% on a split 9-3 vote, and Chair Kevin Warsh has said plainly he would back a hike if inflation reaccelerates. CME FedWatch now puts the odds of a Sept 16 increase near 50%, down from roughly 82% on July 23 and about 61% late in the month. That number moves again tonight.", "zh": "方向要先講清楚：市場現在爭的是 9 月「升不升息」，不是降息。7 月 FOMC 以 9 比 3 的分歧票決維持在 3.50% 至 3.75%，Fed 主席 Kevin Warsh 明說若通膨重新加速就願意支持升息。CME FedWatch 顯示 9 月 16 日升息機率已回到約五成，而 7 月 23 日一度高達八成、7 月底約 61%。這個數字今晚會再跳一次。", "url": "https://www.cnn.com/2026/08/11/business/fed-markets-kevin-warsh" },
    { "id": "macro_2", "channel": "總經政策", "tag": "通膨傳導", "color": "#7C6AF7", "stocks": [{"t": "BNO", "n": "布蘭特原油 ETF，7 月油價漲約 21% 的傳導起點"}, {"t": "XOM", "n": "埃克森美孚，油價走高的獲利端受惠"}], "en": "Connect oil to CPI and you can see what tonight is actually a bet on. Crude jumped about 21% in July on the Iran conflict, and energy is one of the few inputs that pushes the whole price chain at once. Long-dated inflation swaps still imply 2.4% average inflation while 30-year Treasury yields sit near 20-year highs — the short end is betting on cooling, and the long end has not signed on.", "zh": "把油價和 CPI 連起來看，才知道今晚在賭什麼。7 月油價因伊朗衝突大漲約 21%，而能源是少數能同時推升整條物價鏈的投入成本。市場的長期通膨交換合約仍隱含平均 2.4%，30 年期公債殖利率卻貼近 20 年高點——短端在賭通膨降溫，長端根本沒買單。", "url": "https://www.cnbc.com/2026/08/11/an-inflation-report-wednesday-should-be-a-big-deal-for-the-fed-heres-what-to-expect.html" },
    { "id": "sector_0", "channel": "產業風向", "tag": "能源獨強", "color": "#4EABA4", "stocks": [{"t": "XLE", "n": "能源類股，7 月底大型股各板塊相對強度第一"}, {"t": "OXY", "n": "西方石油，美國本土產能的純度較高"}, {"t": "SLB", "n": "斯倫貝謝，油服端反映的是資本支出而非現貨價"}], "en": "Energy is the summer's strongest sector, and it's strong on two levels: it carried the highest relative strength among large-cap sectors at the end of July, and it is also one of the leaders in this quarter's earnings growth. That combination — price and profit moving together — is different from the headline-driven spikes of 2025. Just remember what is holding it up is a strait that diplomacy could reopen at any time.", "zh": "能源是這個夏天最強的板塊，而且強在兩個層面：7 月底它在大型股各板塊中相對強度最高，同時也是本季獲利成長的領頭羊之一。這種價格與獲利同向的組合，跟 2025 年那種純靠地緣消息的跳動不一樣。但要記得，撐住它的是一條隨時可能被外交手段重新打開的海峽。", "url": "https://www.spglobal.com/spdji/en/documents/performance-reports/dashboard-us-sector.pdf" },
    { "id": "sector_1", "channel": "產業風向", "tag": "醫療矛盾", "color": "#4EABA4", "stocks": [{"t": "XLV", "n": "醫療類股，唯一年減卻頻頻超預期的板塊"}, {"t": "MRK", "n": "默沙東，大型藥廠中的預期已被下修過一輪"}], "en": "Health Care is the quarter's most contradictory sector: it is the only S&P 500 sector with a year-over-year earnings decline, yet also one of the biggest sources of the positive EPS surprises that lifted the index's overall growth rate. Those two facts don't conflict — cut expectations low enough and beating them gets easy, while the underlying trend still slopes down. Separate 'beat the estimate' from 'got better.'", "zh": "醫療保健是這季最矛盾的板塊：它是標普 500 唯一獲利年減的板塊，卻同時是把指數整體成長率推上去的正面意外主要來源之一。這兩件事並不衝突——當市場預期被砍到夠低，超預期就變得容易，但基本面本身還在下坡。判讀時要分清楚「贏過預期」和「變好」是兩回事。", "url": "https://insight.factset.com/sp-500-earnings-season-update-august-7-2026" },
    { "id": "sector_2", "channel": "產業風向", "tag": "資本支出", "color": "#4EABA4", "stocks": [{"t": "VRT", "n": "Vertiv，資料中心電力與散熱設備供應商"}, {"t": "PWR", "n": "Quanta Services，電網與輸配電工程承包"}], "en": "The character of AI capex is changing, and that matters more than the dollar figure. Alphabet lifted 2026 capex to $195-205B while issuing $25B of notes, and quarterly free cash flow went negative for the first time — hyperscalers are shifting from building with cash to building with debt. For downstream power, cooling and grid-engineering suppliers, that extends order visibility; for shareholders, it moves leverage and rate risk inside the AI story.", "zh": "AI 資本支出的性質正在改變，這比金額本身更重要。Alphabet 把 2026 年資本支出上調到 1,950 至 2,050 億美元，同時發行 250 億美元債券，單季自由現金流首度轉負——超大規模業者正從「用現金蓋」轉向「借錢蓋」。對下游的電力、散熱與電網工程供應商，這代表訂單能見度延長；對股東，這代表槓桿與利率風險被搬進了 AI 敘事裡。", "url": "https://finance.yahoo.com/markets/stocks/articles/alphabet-sinks-6-amazon-slides-160005432.html" },
    { "id": "small_0", "channel": "小型股風雲", "tag": "小型領跑", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週二漲 0.3%、收 3,027.12"}, {"t": "IJR", "n": "標普小型股 ETF，另一條觀察小型股的軌道"}], "en": "The Russell 2000 rose 0.3% to 3,027.12 on Tuesday, the only major index to finish green. It isn't a one-day fluke: small caps have absorbed money spilling out of big tech all year, and consensus 2026 earnings growth for the index has been marked up from roughly 23% at the start of the year to 38%. The catch is that the expectation is now itself demanding.", "zh": "羅素 2000 週二上漲 0.3% 收 3,027.12，是唯一收紅的主要指數。這不是單日偶然：今年以來小型股一路吸納從大型科技外溢的資金，市場對 2026 年羅素 2000 獲利成長的共識預估，已從年初約 23% 一路上修到 38%。問題是，這個預期本身現在也變得很嚴苛。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-11-2026" },
    { "id": "small_1", "channel": "小型股風雲", "tag": "利率槓桿", "color": "#5B8ED6", "stocks": [{"t": "VTWO", "n": "羅素 2000 ETF，升息 1 碼約侵蝕 2% 營業獲利"}, {"t": "KRE", "n": "區域銀行，小型股信貸環境的上游"}], "en": "The biggest risk to small caps is precisely the number they least want to see. Bank of America estimates every additional 25bp of Fed tightening cuts Russell 2000 operating earnings by roughly 2%, because small caps carry more floating-rate debt and have larger refinancing needs than large caps. So with September hike odds near a coin flip, small caps aren't taking the same bet as the broad market — they're taking a more leveraged one.", "zh": "小型股最大的風險，正是它現在最不想面對的那個數字。美銀估算，Fed 每多升息一碼，羅素 2000 的營業獲利就會被削掉約 2%，原因是小型股帳上浮動利率債務比重高、再融資需求也大於大型股。所以當 9 月升息機率是五五波，小型股並不是在跟大盤賭同一件事，而是在賭一個對它槓桿更大的變數。", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment" },
    { "id": "small_2", "channel": "小型股風雲", "tag": "毛利翻身", "color": "#5B8ED6", "stocks": [{"t": "CRSR", "n": "Corsair Gaming，毛利率創 33.2% 新高，單日漲逾三成五"}], "en": "Corsair Gaming is the quarter's cleanest small-cap turnaround: Q2 non-GAAP EPS of $0.23 against a $0.07 estimate, with revenue of $314.3M beating expectations even as it fell 2% year over year. The real change is margin — a record 33.2% GAAP gross margin, with the Gamer and Creator Peripherals segment growing revenue 13% and lifting gross margin to 44.9% from 40.0%. Full-year revenue guidance rose to $1.40-1.47B and the stock gained more than 35% in a session.", "zh": "Corsair Gaming 是這季小型股裡最完整的翻身案例：第二季非 GAAP 每股盈餘 0.23 美元，遠勝市場預估的 0.07，營收 3.143 億美元雖仍年減 2% 卻超標。真正的變化在毛利——GAAP 毛利率創 33.2% 新高，玩家與創作者周邊部門營收年增 13%、毛利率從 40.0% 拉到 44.9%。公司同步把全年營收指引上修到 14.0 至 14.7 億美元，股價單日漲逾三成五。", "url": "https://www.benzinga.com/trading-ideas/movers/26/08/61054954/corsair-gaming-stock-surges-following-beat-and-raise-q2-results" },
    { "id": "small_3", "channel": "小型股風雲", "tag": "微型振幅", "color": "#5B8ED6", "stocks": [{"t": "NRGV", "n": "Energy Vault，能源儲存，營收翻倍並上修展望、盤後漲約 15%"}, {"t": "HQI", "n": "HireQuest，人力派遣，淨利年增 154%、盤後漲約 22%"}], "en": "Tuesday's after-hours action concentrated in two off-the-radar small caps. Energy storage firm Energy Vault rose about 15% after doubling revenue and raising its 2026 outlook, and staffing company HireQuest gained about 22% on a 154% jump in net income. Neither sits on any hot-theme list, yet a single report repriced them — that is the structural feature of small caps: the thinner the coverage, the larger the move one headline can produce.", "zh": "週二盤後的亮點集中在兩檔冷門小型股。能源儲存商 Energy Vault 漲約 15%，營收翻倍並上修 2026 年展望；人力派遣商 HireQuest 漲約 22%，淨利年增 154%。兩家都不在任何熱門主題名單上，卻各用一份財報就完成重估——這正是小型股的結構特徵：覆蓋越少，單一消息能造成的重估幅度越大。", "url": "https://stockanalysis.com/markets/afterhours/" },
    { "id": "small_4", "channel": "小型股風雲", "tag": "判讀方法", "color": "#5B8ED6", "stocks": [{"t": "IJR", "n": "標普小型股 ETF，成分股要求正獲利，體質與羅素不同"}, {"t": "MDY", "n": "中型股 ETF，可用來對照成長率的計算基礎"}], "en": "A common trap in reading small caps: treating an index-level earnings growth rate as a health check on the underlying companies. Russell 2000 consensus 2026 growth has been marked up to 38%, which sounds powerful — but for an index where a meaningful share of constituents earn nothing, the denominator is small and the arithmetic flatters easily. The question worth asking is where the growth comes from: revenue, margin, or last year's low base.", "zh": "小型股判讀有一個常見陷阱：把指數層級的獲利成長率當成個股體質的指標。羅素 2000 的 2026 年共識成長率被上修到 38%，聽起來很猛，但對一個有相當比例成分股根本不賺錢的指數而言，分母很小、算術上本來就容易衝高。真正該問的是成長從哪裡來：營收、毛利，還是去年的低基期。", "url": "https://www.investing.com/news/stock-market-news/russell-2000-outperformance-can-this-trend-continue-into-2026-4455392" },
    { "id": "radar_0", "channel": "忽視雷達", "tag": "資安服務", "color": "#C9A227", "status": "RADAR · 下一個驗證點 今日 8/12 美東 8:30 Q2 財報", "stocks": [{"t": "ALLT", "n": "Allot，雷達池 8/1 入池，今日交出決定性的一季"}], "en": "Allot is an Israeli network-intelligence and security vendor whose core product is security-as-a-service sold to telecom carriers. The reasons it gets ignored are textbook: small cap, dual-listed on Nasdaq and Tel Aviv, almost no major broker coverage, and years of losses that filed it under 'old tech.' What is changing is capital allocation — on June 23 the board approved up to $40M in buybacks, framed as confidence following a year of profit growth and double-digit revenue growth. The risk is that this claim had no fresh quarterly verification until today, and carrier capex is deeply cyclical. This is a research lead, not investment advice.", "zh": "Allot 是以色列的網路智慧與資安服務商，主力產品是賣給電信商的資安即服務。它被忽視的原因很典型：小市值、那斯達克與特拉維夫雙掛牌、幾乎沒有大型券商覆蓋，加上多年虧損讓它被歸到「舊科技」抽屜。正在改變的是資本配置——6 月 23 日董事會通過最高 4,000 萬美元庫藏股，公司說這是在一年獲利成長與營收雙位數增長之後的信心表態。風險在於，這個說法在今天之前完全沒有新一季財報驗證，而電信商資本支出本身高度循環。這是研究線索，不是投資建議。", "url": "https://www.stocktitan.net/news/ALLT/allot-to-release-second-quarter-2026-results-and-host-conference-3x32o6bwvgsu.html" },
    { "id": "radar_1", "channel": "忽視雷達", "tag": "舊電信", "color": "#C9A227", "status": "RADAR · 下一個驗證點 下季財報的企業網路營收趨勢", "stocks": [{"t": "LUMN", "n": "Lumen Technologies，執行長 8/6 以 61.27 萬美元買進 10 萬股"}], "en": "Lumen Technologies sells fiber backbone and enterprise networking — the kind of legacy telecom name nobody wants to reopen. On Aug 6, CEO Kathleen Johnson bought 100,000 shares on the open market for $612,680 through a family revocable trust, at prices between $6.065 and $6.175. In the same earnings season, Q2 adjusted loss per share came in at $0.07 against $0.13 expected, with revenue of $2.8B beating a $2.74B estimate. Read the bear case honestly: Johnson already holds roughly 7.5 million shares directly, so this purchase is a small fraction of her stake, and neither the structural decline of the legacy business nor the debt load is resolved. A research lead, not investment advice.", "zh": "Lumen Technologies 賣的是光纖骨幹與企業網路，是那種名字沒人想再打開的舊電信。8 月 6 日執行長 Kathleen Johnson 透過家族信託在公開市場買進 10 萬股、金額 61.27 萬美元，成交價落在 6.065 至 6.175 美元。同一個財報季裡，第二季調整後每股虧損 0.07 美元優於預估的虧損 0.13，營收 28 億美元也高於預估的 27.4 億。反方要看清楚：Johnson 名下已直接持有約 750 萬股，這筆買進佔她持股比重極小，傳統電信業務的結構性衰退與負債水位也都沒有解決。這是研究線索，不是投資建議。", "url": "https://www.fool.com/coverage/filings/2026/08/06/is-lumen-stock-a-buy-after-the-ceo-purchased-100-000-shares/" },
    { "id": "radar_2", "channel": "忽視雷達", "tag": "建材配送", "color": "#C9A227", "status": "RADAR · 下一個驗證點 下季財報的同店銷售與利率敏感度", "stocks": [{"t": "SITE", "n": "SiteOne Landscape Supply，執行長 8/4 以 81.63 萬美元買進 8,000 股"}], "en": "SiteOne Landscape Supply is the largest US wholesale distributor of landscaping and irrigation supplies — a business so unglamorous there is no story to tell. On Aug 4, CEO Doug Black bought 8,000 shares for $816,280 through a family trust at about $102.03 apiece, the largest insider purchase at the company in twelve months, with the stock near its 52-week low. It gets ignored because it is filed as a housing proxy, and housing is being held down by rates. That is also the bear case: if September brings a hike, demand takes the first hit, and insiders can be both early and wrong. A research lead, not investment advice.", "zh": "SiteOne Landscape Supply 做的是景觀與灌溉建材的批發配送，規模是全美最大，生意無聊到沒有故事可講。8 月 4 日執行長 Doug Black 透過家族信託買進 8,000 股、金額 81.63 萬美元，均價約 102.03 美元，這是該公司近十二個月最大的一筆內部人買進，而當時股價貼近 52 週低點。它被忽視的原因是被歸類成房市的代理變數，而房市正被利率壓著。反方也就在這裡：若 9 月真的升息，這門生意的需求端會先受傷，內部人可以既早又錯。這是研究線索，不是投資建議。", "url": "https://www.benzinga.com/news/26/08/61043880/bullish-move-doug-black-shows-confidence-acquires-816k-siteone-landscape-supply-stock" },
    { "id": "radar_3", "channel": "忽視雷達", "tag": "防護裝備", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Q3 財報拆分有機成長與併購貢獻", "stocks": [{"t": "CDRE", "n": "Cadre Holdings，Q2 營收年增 32%、盤後漲 18.26%"}], "en": "Pool name Cadre Holdings reported on Aug 6: Q2 net sales of $207.1M, up 32%, adjusted EBITDA up 56%, full-year guidance raised, and the stock up 18.26% after hours. It makes protective equipment for police, military and nuclear customers plus nuclear facility services — demand set by municipal and federal budgets. What updates today is the verification point: how much of that 32% was acquired versus organic. The report didn't separate them, and the answer decides how many legs the thesis still stands on. A research lead, not investment advice.", "zh": "雷達池內的 Cadre Holdings 在 8 月 6 日交卷：第二季淨銷售額 2.071 億美元、年增 32%，調整後 EBITDA 年增 56%，管理層上修全年財測，盤後漲 18.26%。它做的是警察、軍方與核能客戶的防護裝備與核設施服務，需求由地方政府與聯邦預算決定。今天要更新的是驗證點：這 32% 裡有多少是併購買來的、多少是有機成長。這份財報沒有拆乾淨，而答案決定了這個論點還剩幾條腿。這是研究線索，不是投資建議。", "url": "https://www.investing.com/news/company-news/cadre-q2-2026-slides-strong-revenue-beat-drives-guidance-raise-93CH-4843586" },
    { "id": "radar_4", "channel": "忽視雷達", "tag": "鐘錶集團", "color": "#C9A227", "status": "RADAR · 下一個驗證點 2026/08/20 財報（日期已提前一週）", "stocks": [{"t": "MOV", "n": "Movado Group，財報日提前到 8/20，市值約 4.34 億美元"}], "en": "The pool's longest-held name, Movado, needs a date correction: its next earnings report is set for Aug 20, a week earlier than the Aug 27 previously logged. The watch and jewelry group owns Movado, Ebel and MVMT plus licensed brands including Coach, Tommy Hilfiger and HUGO BOSS, carries a market cap near $434M, and is barely covered. Last quarter's EPS came in at $0.32 against a $0.07 estimate. But the stock has run from a $14.78 low to near its $39.85 52-week high at 24.4x earnings — most of the original margin of safety is gone. A research lead, not investment advice.", "zh": "雷達池裡待最久的一檔 Movado 有一個日期要改：下一份財報排在 8 月 20 日，比原先記錄的 8 月 27 日提前一週。這家鐘錶與珠寶集團旗下有 Movado、Ebel、MVMT，以及 Coach、Tommy Hilfiger、HUGO BOSS 等授權品牌，市值約 4.34 億美元、幾乎沒人覆蓋。上一季每股盈餘 0.32 美元，遠勝預估的 0.07。但股價已從 14.78 美元的低點漲到接近 39.85 的 52 週高點，本益比 24.4 倍，當初的安全邊際已經被壓掉大半。這是研究線索，不是投資建議。", "url": "https://tickernerd.com/stock/mov-forecast/" },
    { "id": "radar_5", "channel": "忽視雷達", "tag": "分拆賣壓", "color": "#C9A227", "status": "RADAR · 下一個驗證點 MFP 與 VGNT 的首份獨立季報", "stocks": [{"t": "SOLS", "n": "Solstice Advanced Materials，自 Honeywell 分拆後的先跌後漲樣本"}, {"t": "MFP", "n": "Midera Food Processing，池內分拆股，至今無獨立季報"}, {"t": "VGNT", "n": "Versigent，自 Aptiv 分拆，同樣尚無獨立年度成績"}], "en": "The pool currently holds four spin-offs, and what updates today is the statistical basis for this lead — and its limit. At separation, index funds and legacy holders sell indiscriminately because the new company no longer fits their mandate; that forced selling typically fades within months. Solstice Advanced Materials, spun out of Honeywell, ran exactly that script: down first, repriced only once standalone performance was legible. The limit is that a statistical regularity is not a financial statement — pool names Midera and Versigent still have no verifiable independent quarter. A research lead, not investment advice.", "zh": "雷達池目前有四檔分拆股，今天要更新的是這條線索的統計基礎，以及它的極限。分拆完成時，指數型基金與原股東會因為新公司不符合投資範圍而無差別賣出，這種被迫賣壓通常在數月內消退。Solstice Advanced Materials 自 Honeywell 分拆後就是這個劇本：先跌，等獨立表現清楚了才被重新定價。極限在於，統計規律不能代替財報——池內的 Midera 與 Versigent 至今都還沒有一份可檢驗的獨立季度成績。這是研究線索，不是投資建議。", "url": "https://www.forbes.com/sites/jimosman/2026/07/03/spinoff-investing-what-the-first-90-days-reveal/" },
    { "id": "insider_0", "channel": "內部人動向", "tag": "群聚定義", "color": "#6DB56D", "stocks": [{"t": "WEX", "n": "WEX，董事長與五位高階主管短時間內全部進場"}, {"t": "MBC", "n": "MasterBrand，執行長與兩位董事 11 天內連續市價買進"}], "en": "The definition of a cluster buy has to be strict to be useful: three or more insiders buying the same company on the open market inside 30 days, a pattern that historically concentrates in small and mid caps. The pool holds two live examples — at WEX the chairman, COO, CFO, CTO, general counsel and digital officer all bought within a short window, and at MasterBrand the CEO plus two directors bought at market across 11 days. One insider can have a hundred reasons; six at once is hard to explain as portfolio diversification.", "zh": "群聚買進的定義要夠嚴格才有用：同一家公司在 30 天內出現三位以上內部人於公開市場買進，才算一個群聚訊號，而這種型態歷史上集中出現在中小型股。雷達池裡有兩個現成例子——WEX 的董事長、營運長、財務長、技術長、法務長與數位長在短時間內全部進場；MasterBrand 則是執行長加兩位董事在 11 天內連續市價買進。單一內部人可以有一百種理由，六個人一起就很難用分散配置解釋。", "url": "http://openinsider.com/latest-cluster-buys" },
    { "id": "insider_1", "channel": "內部人動向", "tag": "授權與執行", "color": "#6DB56D", "stocks": [{"t": "FIGS", "n": "FIGS，授權提高到 2 億美元，上半年實買約 3,280 萬"}, {"t": "ICFI", "n": "ICF International，授權 1 億美元，1 至 6 月實買 2,900 萬"}], "en": "Buybacks are the second form of insider signal, but authorization and execution are different things. FIGS raised its repurchase authorization to $200M on Aug 6; the credible part isn't that number but the 2,580,973 Class A shares actually bought back in the first half for about $32.8M. ICF International is the same shape: a $100M authorization in June, against 435,000 shares already repurchased for $29M from January to June. An authorization can be halted at any time — only executed shares and the average price reach the balance sheet.", "zh": "庫藏股是內部人訊號的第二種形式，但要區分「授權」與「執行」。FIGS 在 8 月 6 日把買回授權提高到 2 億美元，可信的部分不是這個數字，而是上半年已經實際買回 2,580,973 股 A 類股、約 3,280 萬美元。ICF International 同樣如此：6 月授權 1 億美元，而 1 至 6 月已先買回 43.5 萬股、金額 2,900 萬。授權隨時可以停，只有已執行的股數與均價才進得了資產負債表。", "url": "https://www.stocktitan.net/news/FIGS/figs-releases-second-quarter-2026-financial-x6ei0y3af4l9.html" },
    { "id": "insider_2", "channel": "內部人動向", "tag": "相對規模", "color": "#6DB56D", "stocks": [{"t": "LUMN", "n": "Lumen，執行長已直接持有約 750 萬股，加碼佔比極小"}, {"t": "SITE", "n": "SiteOne，81.63 萬美元是近十二個月最大單筆內部人買進"}], "en": "When reading insider buys, the absolute dollar figure means almost nothing — relative size is what carries information. Lumen's CEO spent $612,680, which sounds substantial, but she already holds roughly 7.5 million shares directly, so the addition is a rounding error on her stake. SiteOne's CEO spent $816,280, and that was the company's largest insider purchase in twelve months, made near a 52-week low. Same headline, very different signal strength. Ask three things: what share of the existing stake, what multiple of annual salary, and bought at what level.", "zh": "看內部人買進時，金額的絕對值幾乎沒有意義，相對規模才有。Lumen 執行長這次買 61.27 萬美元看起來不小，但她名下已直接持有約 750 萬股，這筆加碼佔比極低；相對地，SiteOne 執行長買的 81.63 萬美元，是該公司近十二個月最大的一筆內部人買進，而且買在 52 週低點附近。同樣是「執行長買進」，訊號強度差很多。要問三件事：佔他既有持股多少、佔他年薪多少、買在什麼位置。", "url": "https://www.tipranks.com/news/insider-trading/top-executive-makes-bold-move-with-fresh-insider-buy-at-siteone-landscape-supply-insider-trading-news" },
    { "id": "week_0", "channel": "本週事件", "tag": "數據三連", "color": "#C97DD4", "stocks": [{"t": "TLT", "n": "長天期公債，三份數據都會直接改寫它的定價"}, {"t": "XRT", "n": "零售類股 ETF，週五 7 月零售銷售的直接標的"}], "en": "The next three sessions bring macro data back to back. Wednesday Aug 12 at 8:30 a.m. ET brings July CPI; Thursday Aug 13 morning follows with PPI; Friday Aug 14 at 8:30 delivers July retail sales, with the University of Michigan sentiment and expectations indexes at 10:00. The function of this cluster is clear: it answers whether inflation has cooled enough to keep Warsh on hold, or whether it reopens the September hike debate.", "zh": "未來三個交易日是總經數據三連發。週三 8/12 美東上午 8:30 公布 7 月 CPI，週四 8/13 早上接 PPI，週五 8/14 美東 8:30 出爐 7 月零售銷售，10:00 再加一份密西根大學消費者信心與預期指數。這一組數據的功能很明確：它們要回答的是通膨降得夠不夠讓 Warsh 按兵不動，還是重新打開 9 月升息的辯論。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar" },

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>

  );

          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>中文嗓音（主畫面 / 連續播放）</div>
          <select className="az-input" value={voiceZh} onChange={e=>setVoiceZh(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="zh-TW-HsiaoChenNeural">曉臻（女）台灣腔・自然</option>
            <option value="zh-TW-HsiaoYuNeural">曉雨（女）台灣腔・清亮</option>
            <option value="zh-TW-YunJheNeural">雲哲（男）台灣腔・沉穩</option>
            <option value="zh-CN-XiaoxiaoNeural">曉曉（女）大陸腔・可調語氣</option>
            <option value="zh-CN-YunyangNeural">雲揚（男）大陸腔・專業播報</option>
            <option value="zh-CN-YunxiNeural">雲希（男）大陸腔・可調語氣</option>
          </select>
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>中文語氣</div>
          <select className="az-input" value={styleZh} onChange={e=>setStyleZh(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="">一般</option>
            <option value="newscast">新聞播報</option>
            <option value="chat">聊天（放鬆）</option>
            <option value="gentle">溫柔</option>
            <option value="serious">嚴肅</option>
          </select>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.6,marginTop:'4px' }}>只有大陸腔嗓音支援語氣；<br/>台灣腔會忽略這一項</div>
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>English Voice</div>
          <select className="az-input" value={voice} onChange={e=>setVoice(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="en-US-AriaNeural">Aria（女）自然流暢</option>
            <option value="en-US-JennyNeural">Jenny（女）清晰</option>
            <option value="en-US-GuyNeural">Guy（男）沉穩</option>
            <option value="en-US-DavisNeural">Davis（男）個性</option>
            <option value="en-US-TonyNeural">Tony（男）自信</option>
          </select>
        </div>
        <div style={{ display:'flex',gap:'8px' }}>
          <button onClick={handleSave} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--divider)',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>儲存</button>
          <button onClick={handleTest} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--text-secondary)',color:'var(--text-secondary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>測試</button>
        </div>
        {status && <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',color:'var(--text-tertiary)',letterSpacing:'0.1em' }}>{status}</div>}
        <div style={{ marginTop:'auto',fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.7,paddingTop:'8px',borderTop:'1px solid var(--divider)' }}>Key 存於 localStorage<br/><b>沒填 Key 會退回瀏覽器內建語音，<br/>那個聽起來就是很機械。</b><br/>要好聽請填 Azure Key。<br/><br/>朗讀語系跟著畫面走：<br/>主文中文→中文嗓音<br/>展開 English→英文嗓音</div>
      </div>
    </>,
    document.body
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

// ===== 資金流向(TradingView 官方嵌入元件,即時資料,每日排程不需更新) =====
function HeatmapView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",
        blockSize: "market_cap_basic", blockColor: "change",
        locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true,
        hasSymbolTooltip: true, isMonoSize: false,
        width: "100%", height: "100%"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 10px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>S&P 500 · 即時資金流向</span>
        <a href="https://finviz.com/map?t=sec&st=d1" target="_blank" rel="noopener noreferrer" className="source-link">Finviz 完整版 ↗</a>
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ flex:1, minHeight:0 }} />
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/12/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v7.3</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
