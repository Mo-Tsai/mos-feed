/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "盤勢結構：不是全面避險，是資金從 AI 硬體撤出", "color": "#E05C5C", "zh": "把當天數字放在一起看：VIX 上升約 14% 至 19.03，是明顯升溫但還不到恐慌；道瓊持平、羅素 2000 小漲，代表傷害集中在 AI 與半導體相關族群，而不是整個市場；十年期美債殖利率盤中從 5.02% 一路掉到 5% 以下，有望成為兩年多來最大單日跌幅，法國十年期殖利率更自 2013 年以來首度高於美國。這是我們的讀法：資金是在調整對 AI 回收期的預期，不是在逃離股票。這是資訊整理，不是買賣訊號。", "en": "Putting the numbers together: the VIX rose about 14% to 19.03, a clear pickup but short of panic; the Dow was flat and the Russell 2000 edged up, so the damage was concentrated in AI and semiconductor-linked names rather than the whole market. The 10-year Treasury yield slid from 5.02% midday to below 5%, on track for its biggest one-day drop in over two years, and France's 10-year yield rose above the US 10-year for the first time since 2013. Our reading: money is repricing the payback period of AI spending, not fleeing equities. This is information, not a trading signal.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-22-dow-sp-500-nasdaq-tesla-meta-112217857.html", "stocks": [{"t": "VIXY", "n": "短期 VIX 期貨 ETF，VIX 約 +14% 至 19.03"}, {"t": "TLT", "n": "長天期美債 ETF，殖利率大跌方向"}, {"t": "DIA", "n": "道瓊 ETF，指數持平，對照那指 -2.6%"}]},
    {"id": "earn_0", "channel": "財報速報", "tag": "Meta：營收 +26%，但自由現金流轉負", "color": "#E8786A", "zh": "Meta 第三季營收 646.0 億美元、年增 26%，優於預期；但本季資本支出 349.1 億美元高於營運現金流 327.9 億美元，自由現金流為負 21.2 億美元，並把 2026 全年資本支出下限上調為 1,350 億至 1,450 億美元（原為 1,300 億至 1,450 億）。帳面營業利益年減 37%，主因約 99 億美元的法律訴訟費用，扣除後約 229 億美元。公司不提供 2027 年營收展望，也宣布計畫自 2027 年 1 月起新增無投票權的 C 類股。股價週四約跌 7%，五年期信用違約交換利差創歷史新高（CNBC）。", "en": "Meta's third-quarter revenue was $64.60 billion, up 26% and ahead of expectations, but capex of $34.91 billion exceeded operating cash flow of $32.79 billion, leaving free cash flow at negative $2.12 billion, and it raised the floor of 2026 capex to $135 billion to $145 billion (from $130 billion to $145 billion). Reported operating income fell 37% on a roughly $9.9 billion legal charge; excluding it, operating income was about $22.9 billion. It gave no 2027 revenue outlook and plans a new non-voting Class C share from January 2027. The stock fell about 7% Thursday and five-year credit default swap spreads hit an all-time high, per CNBC.", "url": "https://www.cnbc.com/2026/10/22/meta-stock-q3-earnings-free-cash-flow.html", "stocks": [{"t": "META", "n": "Meta，約 -7%，自由現金流 -21.2 億美元"}, {"t": "CRWV", "n": "CoreWeave，AI 基礎設施高負債股，同日約 -10%"}, {"t": "GOOGL", "n": "Alphabet，10/28 盤後公布財報，將被拿來對照資本支出"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "特斯拉：毛利率回升，但營業利益砍半", "color": "#E8786A", "zh": "特斯拉第三季營收 280.5 億美元，與去年持平、符合預期；非 GAAP 每股盈餘 0.48 美元，優於預期的約 0.45 美元，GAAP 每股 0.22 美元。毛利率 19.6%（前一季 16.8%），但營業利益年減 56% 至 7.18 億美元，自由現金流 15.3 億美元（去年同期 39.9 億美元），原因是 AI、機器人計程車與 Optimus 的支出成長快過毛利。能源儲存營收年減 16% 至 28.8 億美元。盤後一度上漲約 1.1%，週四正式交易約跌 3%，市場權衡的是較低的 2026 資本支出與更高的 2027、2028 年支出。", "en": "Tesla's third-quarter revenue was $28.05 billion, flat year over year and in line; non-GAAP EPS of $0.48 beat the roughly $0.45 consensus, with GAAP EPS at $0.22. Gross margin was 19.6% (16.8% last quarter), but operating income fell 56% to $718 million and free cash flow was $1.53 billion versus $3.99 billion a year earlier, as AI, robotaxi and Optimus spending grew faster than gross profit. Energy storage revenue fell 16% to $2.88 billion. The stock rose about 1.1% after hours but fell about 3% in Thursday trading as investors weighed lower 2026 capex against higher 2027 to 2028 spending.", "url": "https://electrek.co/2026/10/21/tesla-tsla-q3-2026-financial-results/", "stocks": [{"t": "TSLA", "n": "特斯拉，EPS 優於預期但約 -3%"}, {"t": "FLNC", "n": "Fluence，儲能同業，特斯拉儲能營收年減 16% 作對照"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "Lam、IBM、德州儀器：都優於預期，市場反應拉開", "color": "#E8786A", "zh": "三家都優於預期，反應卻不同。Lam Research 每股盈餘 2.20 美元（預期 2.18），營收 82.2 億美元（預期 81.3 億），但先前一年漲近 80%，獲利了結讓股價跌約 9% 至 10%，拖累整個半導體設備族群。IBM 營運每股盈餘 2.95 美元（預期 2.86），營收 171 億美元（預期 168.1 億），全年營收成長維持 4% 至 5%，軟體成長 9% 其中約四分之一來自延後的交易，執行長說部分客戶質疑 AI 投資是否有可衡量回報，股價下跌（各來源 1% 至 7% 不等）。德州儀器每股 2.62 美元（預期 2.42），下季營收指引 58 億至 63 億美元高於共識 57.5 億，反應最溫和。", "en": "All three beat estimates but reactions differed. Lam Research earned $2.20 per share (versus $2.18 expected) on revenue of $8.22 billion (versus $8.13 billion), but after a near-80% run over the past year, profit-taking sent it down roughly 9% to 10% and dragged chip equipment names. IBM's operating EPS of $2.95 (versus $2.86) and revenue of $17.1 billion (versus $16.81 billion) came with full-year growth held at 4% to 5%; software grew 9%, about a quarter of it from delayed deals, and the CEO said some customers question measurable returns on AI, so shares fell (1% to 7% depending on source). Texas Instruments earned $2.62 (versus $2.42) and guided next-quarter revenue of $5.8 billion to $6.3 billion versus a $5.75 billion consensus, drawing the mildest reaction.", "url": "https://moneycheck.com/todays-market-movers-tesla-meta-ibm-and-lam-research-fall-after-earnings/", "stocks": [{"t": "LRCX", "n": "Lam Research，優於預期仍約 -9%"}, {"t": "IBM", "n": "IBM，客戶質疑 AI 回報，股價下跌"}, {"t": "TXN", "n": "德州儀器，EPS 2.62 對預期 2.42"}, {"t": "AMAT", "n": "應用材料，設備族群連帶下跌約 6%（盤前）"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "十年期殖利率跌破 5%，聯準會升息押注降溫", "color": "#7C6AF7", "zh": "美債週四大漲：十年期殖利率下跌約 18.5 個基點至 4.96%，上週曾到 5.36%；二年期 4.65%（-17.1 bp）、五年期 4.78%（-19.2 bp）、三十年期 5.29%（-15.1 bp）。期貨顯示今年不再升息的機率約 22%，但該來源仍認為再升息較可能。聯邦基金利率目前區間為 3.75% 至 4.00%，10 月 28 日 FOMC 預測市場多數押維持不動（升息機率約 6% 至 13%，來源有出入），12 月升息才是焦點。殖利率大跌的原因，各報導多歸為 AI 股拋售帶動的避險買債，確切成因無法由價格確認。", "en": "Treasuries rallied hard Thursday: the 10-year yield fell about 18.5 basis points to 4.96% (it hit 5.36% last week); the 2-year was 4.65% (-17.1 bp), the 5-year 4.78% (-19.2 bp) and the 30-year 5.29% (-15.1 bp). Futures priced about a 22% chance of no further Fed hike this year, though the source still sees another hike as more likely. The fed funds range is 3.75% to 4.00%; prediction markets mostly expect a hold at the Oct. 28 FOMC (hike odds of roughly 6% to 13%, sources differ) with December the real focus. Reports mostly tie the rally to haven buying during the AI selloff, but the cause cannot be confirmed from price action.", "url": "https://investinglive.com/news/investinglive-americas-fx-news-wrap-22-oct-nasdaq-sinks-as-ai-worries-bite-treasury-yields-tumble/", "stocks": [{"t": "TLT", "n": "20 年期以上美債 ETF，殖利率大跌時價格上漲"}, {"t": "IEF", "n": "7 至 10 年期美債 ETF，十年期殖利率 -18.5 bp"}, {"t": "SHY", "n": "短天期美債 ETF，二年期 -17.1 bp"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "通膨數據偏熱：CPI 3.7%、PPI 年增 6.3%", "color": "#7C6AF7", "zh": "9 月消費者物價指數月增 0.6%、年增 3.7%，汽油年增 34.2%；核心 CPI 月增 0.3%、年增 2.6%，皆高於預期。9 月生產者物價指數月增 1.3%（預期 0.5%）、年增 6.3%（預期 5.3%），核心 PPI 月增 0.7%、年增 5.0%，月增幅為四年多來最大。8 月核心 PCE 為年增 3.0%。數據讓市場認為升息尚未結束，舊金山聯準會總裁戴利說升息可能需要，但不急。市場把焦點放在 10 月 29 日的第三季 GDP 與 9 月 PCE。", "en": "September consumer prices rose 0.6% on the month and 3.7% on the year, with gasoline up 34.2%; core CPI rose 0.3% m/m and 2.6% y/y, both above expectations. September producer prices rose 1.3% m/m (versus 0.5% expected) and 6.3% y/y (versus 5.3%), with core PPI up 0.7% m/m and 5.0% y/y, the biggest monthly gain in more than four years. Core PCE was 3.0% y/y in August. The data leave markets thinking the hiking cycle is not over; San Francisco Fed President Mary Daly said hikes are likely needed but not urgently. Attention turns to Q3 GDP and September PCE on Oct. 29.", "url": "https://247wallst.com/investing/2026/10/22/with-september-ppi-coming-in-red-hot-is-an-october-rate-hike-all-but-assured/", "stocks": [{"t": "TIP", "n": "抗通膨債券 ETF，通膨數據偏熱時受關注"}, {"t": "SCHP", "n": "抗通膨債券 ETF，實質利率是近期殖利率主因"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "勞動市場仍緊，油價推升通膨風險", "color": "#7C6AF7", "zh": "美國上週初領失業救濟金 19.4 萬人，低於預期的 20 萬人，是三個月來最少；前一週由 19.9 萬修正為 20.0 萬，四週平均降至 197,750；續領人數 172.8 萬，略高於預期的 172.0 萬，可能顯示重新就業變慢。勞動市場偏緊，加上布蘭特原油自 2 月伊朗戰爭開打以來已上漲逾五成，汽油又是 9 月 CPI 的主要推手，讓聯準會很難放鬆。加拿大央行 10 月 28 日升息的機率據報約 80%，顯示升息不是單一國家的事。週五還有美國 10 月 Flash PMI。", "en": "US initial jobless claims fell to 194,000 versus 200,000 expected, the lowest in three months; the prior week was revised to 200,000 from 199,000 and the four-week average fell to 197,750. Continuing claims were 1.728 million versus 1.720 million expected, which may signal slower rehiring. A tight labor market plus Brent up more than 50% since the Iran war began in February, with gasoline the main driver of September CPI, makes it hard for the Fed to ease. A morning report put the chance of a Bank of Canada hike on Oct. 28 near 80%, a sign tightening is not confined to one country. US flash PMIs are due Friday.", "url": "https://investinglive.com/news/investinglive-americas-fx-news-wrap-22-oct-nasdaq-sinks-as-ai-worries-bite-treasury-yields-tumble/", "stocks": [{"t": "USO", "n": "美國原油基金，油價是通膨與利率預期的關鍵變數"}, {"t": "XLE", "n": "能源類股 ETF，油價高檔時受惠"}, {"t": "XRT", "n": "零售 ETF，汽油上漲壓縮消費者可支配支出"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "半導體與 AI 基礎設施：獲利好也擋不住拋售", "color": "#4EABA4", "zh": "週四半導體首當其衝：費城半導體相關 ETF SOXX 盤前跌約 4%，Lam Research 約 -9%、應用材料與 KLA 各約 -6%、Nvidia 約 -2%（英國收盤時段 -4.4%）、AMD 與 Sandisk 約 -4% 至 -5%、英特爾盤前 -4% 至 -5%。觸發因素是 Meta 自由現金流轉負、IBM 客戶質疑 AI 回報，加上 CoreWeave 這類高負債業者的資本成本疑慮。市場邏輯從「誰在花錢」轉為「花的錢何時回收」。盤前數字不等於收盤，請以收盤為準。", "en": "Semiconductors took the brunt on Thursday: the semiconductor ETF SOXX fell about 4% premarket, Lam Research about 9%, Applied Materials and KLA about 6% each, Nvidia about 2% (4.4% at the London close), AMD and Sandisk 4% to 5% and Intel 4% to 5% premarket. The triggers were Meta's negative free cash flow, IBM customers questioning AI returns and cost-of-capital worries at leveraged operators such as CoreWeave. The market logic shifted from who is spending to when the spending pays back. Premarket moves are not closing moves.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-thursday-october-22-dow-sp-500-nasdaq-tesla-meta-112217857.html", "stocks": [{"t": "SOXX", "n": "半導體 ETF，盤前約 -4%"}, {"t": "NVDA", "n": "Nvidia，約 -2% 至 -4.4%"}, {"t": "KLAC", "n": "KLA，設備股，約 -6%"}, {"t": "AMD", "n": "AMD，盤前約 -4% 至 -5%"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "能源：伊朗風險推油價到 5 月來高點", "color": "#4EABA4", "zh": "能源是週四少數受惠的板塊：布蘭特約 111 至 113 美元，WTI 約 99 至 100 美元，自 2 月伊朗戰爭開打以來布蘭特已漲逾 50%。新的上行風險是紐約時報報導美國與以色列計畫在 11 月 3 日期中選舉後再打擊伊朗，川普則說不與德黑蘭談判；沙烏地方面，胡塞武裝攻擊使 Aramco 要求總部剩餘人員撤離。煉油端也有擾動：埃克森關閉伊利諾州喬利埃特煉油廠一座日產 27.5 萬桶的催化重組裝置。煉油商 Valero 10/22 公布財報，油服龍頭 SLB 10/23 公布。", "en": "Energy was one of the few beneficiaries Thursday: Brent was around $111 to $113 and WTI $99 to $100, with Brent up more than 50% since the Iran war began in February. The new upside risk is a New York Times report that the US and Israel plan renewed strikes on Iran after the Nov. 3 midterms, while Trump says Washington is not negotiating with Tehran; in Saudi Arabia, Houthi attacks led Aramco to tell remaining headquarters staff to evacuate. Refining had its own disruption: Exxon shut a 275,000 bpd catalytic reformer at its Joliet, Illinois refinery. Valero reported on Oct. 22 and oil services leader SLB reports Oct. 23.", "url": "https://www.marketscreener.com/news/stocks-rattled-by-tech-worry-oil-price-strength-ce785cdedd8ff324", "stocks": [{"t": "XLE", "n": "能源類股 ETF，油價高檔時受惠"}, {"t": "XOM", "n": "埃克森美孚，喬利埃特煉油廠一座重組裝置關閉"}, {"t": "VLO", "n": "Valero，煉油商，10/22 公布財報"}, {"t": "SLB", "n": "SLB，油服龍頭，10/23 公布財報"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "金屬與礦業：油價漲、殖利率跌，金銀銅仍重挫", "color": "#4EABA4", "zh": "貴金屬與基本金屬在殖利率大跌的日子仍下殺：黃金 -2.88% 至 4,021.61 美元，白銀 -5.87% 至 54.55 美元，銅 -2.68% 至 6.40 美元。歐洲礦業股跟著重挫（Fresnillo -6.5%、Antofagasta -6.2%、Anglo American -5.6%）。報導把原因歸為金融條件趨緊與通膨疑慮，但承認無法只靠價格確認。矛盾的是 Newmont 第三季調整後每股盈餘 2.20 美元（預期 2.06）、營收 63.6 億美元（預期 63.0 億），財報優於預期，盤後股價走高，顯示金價高檔時獲利很強，但金價短線震盪。", "en": "Precious and base metals sold off even as yields plunged: gold fell 2.88% to $4,021.61, silver dropped 5.87% to $54.55 and copper lost 2.68% to $6.40. European miners followed (Fresnillo -6.5%, Antofagasta -6.2%, Anglo American -5.6%). Reports blame tighter financial conditions and inflation worries but concede the cause cannot be confirmed from prices alone. The contradiction is Newmont, which beat in the third quarter with adjusted EPS of $2.20 (versus $2.06) and revenue of $6.36 billion (versus $6.30 billion) and rose after hours: profits are strong with gold this high, but gold is volatile in the short run.", "url": "https://investinglive.com/news/investinglive-americas-fx-news-wrap-22-oct-nasdaq-sinks-as-ai-worries-bite-treasury-yields-tumble/", "stocks": [{"t": "GLD", "n": "黃金 ETF，金價 -2.88%"}, {"t": "SLV", "n": "白銀 ETF，銀價 -5.87%"}, {"t": "NEM", "n": "Newmont，Q3 調整後 EPS 2.20 對預期 2.06"}, {"t": "COPX", "n": "銅礦業 ETF，銅價 -2.68%"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "羅素 2000 逆勢收紅，但仍處於修正區", "color": "#5B8ED6", "zh": "週四羅素 2000 上漲 0.11% 至 2,784.03，那斯達克 100 下跌 2.90%，相對差距近 3 個百分點，因為這次的拋售集中在 AI 與大型科技，小型股持股結構本來就較少這類公司。但不要解讀成小型股轉強：Seeking Alpha 在 10/15 指出羅素 2000 已較 8 月高點回落逾 10%、進入修正，當天跌 1.9%，擔憂的是通膨與利率上升。週四的相對抗跌是被動的，不代表資金主動流入。這是資訊整理，不是買賣訊號。", "en": "On Thursday the Russell 2000 gained 0.11% to 2,784.03 while the Nasdaq 100 fell 2.90%, a gap of nearly 3 percentage points, because the selloff centered on AI and large-cap tech, which small-cap indexes hold far less of. Do not read this as small-cap strength: Seeking Alpha noted on Oct. 15 that the index was already more than 10% below its August peak and in correction, down 1.9% that day, on inflation and rate fears. Thursday's relative resilience was passive and does not mean money is flowing in. This is information, not a trading signal.", "url": "https://seekingalpha.com/article/4954402-small-stumble-big-correction", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，指數 +0.11%"}, {"t": "IJR", "n": "標普小型 600 ETF，小型股另一個基準"}, {"t": "QQQ", "n": "那斯達克 100 ETF，指數 -2.90%，對照組"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "小型股判讀：殖利率一天大跌，不等於利率壓力解除", "color": "#5B8ED6", "zh": "小型股對利率敏感的常見解釋有三：一是浮動利率貸款比例高，利息成本隨短期利率變動；二是區域銀行的存款成本與放款價值同時受殖利率曲線影響；三是估值多半建立在遠期獲利，折現率高時最先被壓縮。週四十年期殖利率下跌約 18.5 bp 至 4.96%，對這群股票是短線緩解，但同一天的 PPI、油價與勞動數據都顯示通膨壓力還在，10 月 28 日 FOMC 與 12 月升息預期才是真正的變數。單日的殖利率變動不是趨勢，請用更長的時間尺度看。", "en": "There are three common explanations for small-cap rate sensitivity: a higher share of floating-rate loans, so interest costs track short-term rates; regional banks, whose deposit costs and loan values both depend on the yield curve; and valuations that rest on distant earnings, which compress first when discount rates are high. Thursday's 18.5 bp drop in the 10-year yield to 4.96% is short-term relief for this group, but PPI, oil and labor data all show inflation pressure remains, so the Oct. 28 FOMC and December hike expectations are the real variables. A one-day yield move is not a trend; use a longer horizon.", "url": "https://investinglive.com/news/investinglive-americas-fx-news-wrap-22-oct-nasdaq-sinks-as-ai-worries-bite-treasury-yields-tumble/", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，殖利率曲線與存款成本敏感"}, {"t": "IWN", "n": "羅素 2000 價值 ETF，利率敏感度較高"}, {"t": "XRT", "n": "零售 ETF，小型零售股對汽油與利率雙敏感"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "Eastern Bankshares：財報優於預期，內部人卻是淨賣出", "color": "#5B8ED6", "zh": "區域銀行 Eastern Bankshares（EBC）10/22 公布第三季：每股盈餘 0.51 美元（預期 0.49），營收 3.066 億美元。GuruFocus 同時提醒一個容易被忽略的反向訊號：過去 12 個月內部人賣出 930 萬美元、買進 140 萬美元，淨額為賣出。財報優於預期加上內部人淨賣出，代表單看一個指標容易被誤導；判讀小型股時，內部人買賣方向要和財報、估值一起看，這比單看財報有用。這是研究線索，不是投資建議。", "en": "Regional bank Eastern Bankshares (EBC) reported third-quarter results on Oct. 22: EPS of $0.51 (versus $0.49 expected) and revenue of $306.6 million. GuruFocus also flags an easily missed counter-signal: over the past 12 months insiders sold $9.3 million and bought $1.4 million, a net sale. A beat plus net insider selling is a reminder that any single indicator can mislead; when reading small caps, weigh the direction of insider trades alongside earnings and valuation. This is a research lead, not investment advice.", "url": "https://www.gurufocus.com/news/9138011/is-eastern-bankshares-inc-ebc-undervalued-after-q3-earnings-beat-eps-at-051-vs-estimated-049-revenue-at-3066-million", "stocks": [{"t": "EBC", "n": "Eastern Bankshares，Q3 EPS 0.51 對預期 0.49"}, {"t": "KRE", "n": "區域銀行 ETF，同族群基準"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "Lantronix（LTRX）：無人機模組放量，董事買進，帳上現金無負債", "color": "#C9A227", "zh": "Lantronix 做工業與企業物聯網產品，近來把重心放在無人機與無人系統：Spotter 機器人平台與 Open-Q 8550CS 系統模組，據報產品列入美國國防部的 Blue UAS 框架清單。為什麼被忽視：市值約 1.3 億美元的微型股，過去有股權稀釋紀錄，本益比為負。什麼正在改變：無人系統業務在 FY2026 營收 1,260 萬美元，管理層預期 FY2027 約 2,500 萬美元以上、占營收 15% 至 20%；財年末現金 6,000 萬美元、無負債；董事 Saleel Awsare 9 月買進 15,000 股、約 7.77 萬美元。風險：規模極小、稀釋歷史、外部借款提醒、無人機題材估值波動大。這是研究線索，不是投資建議。", "en": "Lantronix makes industrial and enterprise IoT products and is leaning into drones and unmanned systems with its Spotter robotics platform and the Open-Q 8550CS system-on-module, with products reportedly on the US Department of War's Blue UAS framework list. Why neglected: a micro-cap of roughly $130 million, a history of dilution and a negative P/E. What is changing: unmanned systems revenue was $12.6 million in fiscal 2026 and management expects about $25 million or more in fiscal 2027, 15% to 20% of revenue; it ended the year with $60 million cash and no debt; and director Saleel Awsare bought 15,000 shares for about $77,700 in September. Risks: tiny scale, dilution history, a funding-risk warning and volatile drone-theme valuations. This is a research lead, not investment advice.", "url": "https://simplywall.st/stocks/us/tech/nasdaq-ltrx/lantronix/news/undervalued-small-caps-with-insider-buying-to-watch-in-octob", "stocks": [{"t": "LTRX", "n": "Lantronix，無人系統業務放量、董事買進"}], "status": "RADAR · 下一個驗證點 11 月上旬 FY2027 Q1 財報（去年是 11/5，今年日期待公布）"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "Agora（API）：執行長連買 23 次、零賣出，現金龐大", "color": "#C9A227", "zh": "Agora 提供即時語音視訊的雲端服務，客戶涵蓋直播購物與金融服務。為什麼被忽視：成長曾停滯、是中概背景的美國存託憑證，市場關注度低。什麼正在改變：Q2 營收年增 18% 至 4,040 萬美元，連續第七季 GAAP 獲利，美元淨留存率從 94% 回升至 104%；現金與存款 3.617 億美元，Q2 回購約 100 萬股 ADS、370 萬美元；Quiver 資料顯示執行長 Zhao Bin 近 6 個月買進 23 次、共 208,862 股、約 87.4 萬美元，沒有任何賣出，10/16 又買 8,800 股。風險：毛利率降到 63.7%、營運現金流為負、客戶數只增 0.4%、中概股地緣與監管風險。這是研究線索，不是投資建議。", "en": "Agora provides real-time voice and video cloud services for customers in live shopping and financial services. Why neglected: growth stalled for a while, it is a US-listed ADR with Chinese roots and attention is low. What is changing: Q2 revenue rose 18% to $40.4 million, its seventh straight GAAP-profitable quarter, with dollar-based net retention up to 104% from 94%; it holds $361.7 million in cash and deposits and repurchased about 1.0 million ADSs for $3.7 million in Q2; and Quiver data show CEO Zhao Bin made 23 purchases over six months totaling 208,862 shares (about $874,000) with no sales, adding 8,800 more on Oct. 16. Risks: gross margin slipped to 63.7%, operating cash flow was negative, active customers grew only 0.4% and there are China-linked geopolitical and regulatory risks. This is a research lead, not investment advice.", "url": "https://www.globenewswire.com/news-release/2026/08/13/3345031/0/en/agora-inc-reports-second-quarter-2026-financial-results.html", "stocks": [{"t": "API", "n": "Agora，執行長連續買進、現金龐大"}], "status": "RADAR · 下一個驗證點 11 月中旬 Q3 財報（日期待公布）"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "Agomab（AGMB）：IPO 後股價腰斬，高管持續加碼", "color": "#C9A227", "zh": "Agomab 是比利時纖維化疾病生技，主力 ontunisertib（AGMB-129）是口服、腸道限定的 ALK5 抑制劑，針對纖維狹窄型克隆氏症。為什麼被忽視：2026 年 2 月以每股 16 美元 IPO，10/21 買進均價約 8.9 美元（Quiver 推算），小型生技波動大、覆蓋少。什麼正在改變：6 月底現金約 2.52 億歐元，預估撐到 2029 年上半年；第 2b 期 NOV-ERA 試驗預計 2026 下半年開始，已與 FDA 就主要設計取得共識；Quiver 資料顯示近 6 個月 10 次公開市場買進、零賣出，包含執行長與財務長，10/21 David Epstein 再買 5,000 股。風險：臨床失敗、需要再募資、開放標籤延伸試驗數據尚未公布。這是研究線索，不是投資建議。", "en": "Agomab is a Belgian fibrosis biotech whose lead asset ontunisertib (AGMB-129) is an oral, gut-restricted ALK5 inhibitor for fibrostenosing Crohn's disease. Why neglected: it IPO'd at $16 in February 2026 and traded near $8.9 on Oct. 21 (implied by Quiver), with the volatility and thin coverage typical of small biotechs. What is changing: cash was about EUR 252 million at end-June, projected to last into the first half of 2029; the Phase 2b NOV-ERA study is on track to start in the second half of 2026 with FDA alignment on key design elements; and Quiver data show 10 open-market purchases and no sales over six months, including the CEO and CFO, with David Epstein adding 5,000 shares on Oct. 21. Risks: clinical failure, future financing needs and pending open-label extension data. This is a research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0002020932/000110465926048615/tm2612596d1_ex99-1.htm", "stocks": [{"t": "AGMB", "n": "Agomab，近 6 個月 10 次買進零賣出"}], "status": "RADAR · 下一個驗證點 STENOVA 開放標籤延伸數據與 NOV-ERA 啟動（2026 下半年）"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "Tenax（TENX）：ADAR1 持續加碼，但別忘了第三期失敗", "color": "#6DB56D", "zh": "Quiver 資料顯示，10/21 ADAR1 Capital Management 又買進 TENX 331,979 股、約 55.1 萬美元（每股約 1.66 美元）。過去 6 個月共 14 筆公開市場買進、零賣出，其中 ADAR1 買了 10 次、共 3,619,049 股、約 626 萬美元，執行長 Giordano 與財務長 Staab 也有買進。但背景要一起看：8 月公布的 LEVEL 第三期試驗（TNX-103，口服 levosimendan，針對 PH-HFpEF）未達主要終點，6 分鐘步行距離只差 3.5 公尺，只有基線較差的次族群看到 26.3 公尺的改善。連續買進代表持有人看好調整後的路，不代表成功。這是研究線索，不是投資建議。", "en": "Quiver data show ADAR1 Capital Management bought another 331,979 TENX shares on Oct. 21, about $550,700 (roughly $1.66 per share). Over six months there were 14 open-market purchases and no sales; ADAR1 made 10 of them totaling 3,619,049 shares (about $6.26 million), and CEO Giordano and CFO Staab also bought. The backdrop matters: the LEVEL Phase 3 trial of TNX-103 (oral levosimendan in PH-HFpEF) announced in August missed its primary endpoint, with only a 3.5 meter difference in six-minute walk distance, and only a lower-baseline subgroup showed a 26.3 meter gain. Repeated buying shows holders back the revised path, not that it will work. This is a research lead, not investment advice.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+October+22,+2026", "stocks": [{"t": "TENX", "n": "Tenax，ADAR1 6 個月買 10 次、約 626 萬美元"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "Applied Digital（APLD）：總裁買進 566 萬美元，但同期也有賣出", "color": "#6DB56D", "zh": "Quiver 資料顯示，Applied Digital 總裁 Jason Zhang（共同創辦人）10/16 買進 300,000 股、約 565.8 萬美元，執行長暨董事長 Wes Cummins 也有買進 55,803 股、約 100.7 萬美元。Applied Digital 是替 AI 高效能運算客戶蓋與出租資料中心的公司（北達科他州園區租給 CoreWeave）。判讀提醒：過去 6 個月 APLD 共 7 筆交易，2 筆買進、5 筆賣出，所以這不是「只有買進」的案例；賣出包含稅務扣繳等例行項目的可能性，需看 Form 4 說明。在 AI 資本支出被重新檢視的一週，內部人用自己的錢加碼是一個資料點，不是結論。這是研究線索，不是投資建議。", "en": "Quiver data show Applied Digital President and co-founder Jason Zhang bought 300,000 shares on Oct. 16 for about $5.658 million, and CEO and Chairman Wes Cummins bought 55,803 shares for about $1.007 million. Applied Digital builds and leases data centers for AI high-performance computing customers, including a North Dakota campus leased to CoreWeave. A caution: over the past six months APLD had 7 trades, 2 purchases and 5 sales, so this is not a buy-only case, and some sales may be routine items such as tax withholding, which only the Form 4 footnotes would show. Insiders adding with their own money in a week when AI capex is under scrutiny is a data point, not a conclusion. This is a research lead, not investment advice.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+October+19,+2026", "stocks": [{"t": "APLD", "n": "Applied Digital，總裁與執行長買進，但 6 個月有 5 筆賣出"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "判讀：誰是「內部人」？Saba 買封閉式基金是另一回事", "color": "#6DB56D", "zh": "同一份 10/21 買進清單裡，Saba Capital Management 買進 Ellsworth Growth & Income Fund（ECF）2,600 股、約 3 萬美元，過去 6 個月 15 筆買進、共 188,182 股、約 223 萬美元。Saba 通常因持股超過 10% 才須申報 Form 4，但它買封閉式基金的邏輯多半是折價與主張公司治理，和公司管理層看好自家業務是兩種訊號。判讀內部人買進時可以問三件事：是誰買（管理層、董事或外部大股東）、金額相對於其資產與薪酬有多大、同期有沒有賣出。Form 4 最晚在交易後兩個營業日內申報，所以有時間差。", "en": "In the same Oct. 21 purchase list, Saba Capital Management bought 2,600 shares of the Ellsworth Growth & Income Fund (ECF), about $30,000, with 15 purchases over six months totaling 188,182 shares (about $2.23 million). Saba typically files Form 4s as a holder above 10%, but its logic in closed-end funds is usually the discount and governance pressure, a different signal from management buying its own company. When reading insider buying, ask three questions: who is buying (management, directors or an outside large holder), how large the purchase is relative to their means and pay, and whether there were sales in the same period. Form 4s are due within two business days, so there is a time lag.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases:+October+22,+2026", "stocks": [{"t": "ECF", "n": "Ellsworth Growth & Income Fund，Saba 6 個月買進 15 次"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "參議員 Boozman 一口氣申報 7 檔債券 ETF 買進", "color": "#B5654D", "zh": "Quiver 彙整的政要申報顯示，參議員 John Boozman 在 10/22 揭露的交易全是買進債券型 ETF：GIGB（投資等級公司債）、JMBS（抵押貸款證券）、XFIV（約 5 年期美債）、MBB（抵押貸款證券）、IEF（7 至 10 年期美債）、TLH（10 至 20 年期美債）與 CMBS（商業不動產抵押證券）。這個部位結構代表的假設是：把資金配置在殖利率已在 5% 附近的固定收益，並涵蓋公債、抵押貸款與公司債。頁面沒有顯示金額區間與交易日期，申報也可能有最多 45 天延遲，所以不能推論是在殖利率高點或低點買進。這是資訊整理，不是買賣訊號。", "en": "Congressional filings compiled by Quiver show Sen. John Boozman disclosed on Oct. 22 a set of trades that are all purchases of bond ETFs: GIGB (investment-grade corporates), JMBS (mortgage-backed), XFIV (about 5-year Treasuries), MBB (mortgage-backed), IEF (7 to 10 year Treasuries), TLH (10 to 20 year Treasuries) and CMBS (commercial mortgage-backed). The structure implies an assumption of allocating to fixed income with yields near 5% across Treasuries, mortgages and corporates. The page shows neither amount ranges nor trade dates, and filings can lag up to 45 days, so it cannot show that these were bought at a yield high or low. This is information, not a trading signal.", "url": "https://www.quiverquant.com/news/category/congress_trades_automated", "stocks": [{"t": "GIGB", "n": "投資等級公司債 ETF"}, {"t": "JMBS", "n": "抵押貸款證券 ETF"}, {"t": "XFIV", "n": "約 5 年期美債 ETF"}, {"t": "MBB", "n": "抵押貸款證券 ETF"}, {"t": "IEF", "n": "7 至 10 年期美債 ETF"}]},
