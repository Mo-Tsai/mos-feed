<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "指數收盤", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普 500 追蹤 ETF，週一跌 0.33% 收 7,686.14"}, {"t": "DIA", "n": "道瓊 ETF，指數大跌 374 點、單日跌幅最重的一個"}, {"t": "QQQ", "n": "那斯達克 100，僅跌 0.12% 相對抗跌"}], "en": "Wall Street opened September on the back foot. The S&P 500 fell 0.33% to 7,686.14, the Nasdaq Composite slipped 0.12% to 26,370.89, and the Dow dropped 374.09 points, or 0.7%, to 53,185.90. The trigger was the first exchange of fire between the United States and Iran in a month. Even so, all three indexes closed out August with gains, so this was a hit to the mood rather than to the trend.", "zh": "九月的第一個交易日，華爾街是踩著壞消息開場的。標普 500 跌 0.33% 收 7,686.14，那斯達克綜合指數跌 0.12% 收 26,370.89，道瓊重挫 374.09 點、跌幅 0.7% 收 53,185.90。導火線是美國與伊朗一個月來首度交火。不過三大指數整個八月仍然收紅，所以這一跌打到的是情緒，還沒有打到趨勢。", "url": "https://www.cnbc.com/2026/08/30/stock-market-today-live-updates.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "能源領漲", "color": "#E05C5C", "stocks": [{"t": "HAL", "n": "油服商，單日漲 2.5%，是能源族群漲最多的一檔"}, {"t": "OXY", "n": "獨立生產商，漲 1.8%"}, {"t": "SLB", "n": "油服龍頭，漲 1.7%"}], "en": "Energy was the only place with real buying. US forces struck Iranian rocket launchers near the Strait of Hormuz on Sunday, and Iran said it fired back at US bases in Jordan and the United Arab Emirates. WTI jumped 3.4% to $86.25 a barrel and Brent added 3.6% to $91.24. Halliburton rose 2.5%, SLB 1.7%, Occidental 1.8% and ConocoPhillips 1.3%.", "zh": "整個盤面只有能源有真正的買盤。美軍週日攻擊了荷莫茲海峽附近的伊朗火箭發射器，伊朗則說已對美國在約旦與阿拉伯聯合大公國的基地還擊。西德州原油單日跳升 3.4% 至每桶 86.25 美元，布蘭特漲 3.6% 至 91.24 美元。油服商 Halliburton 漲 2.5%、SLB 漲 1.7%，生產商 Occidental 漲 1.8%、ConocoPhillips 漲 1.3%。這條海峽承載全球約五分之一的原油運輸，所以市場定價的不是傷害本身，是航道風險。", "url": "https://www.investing.com/news/stock-market-news/energy-stocks-rally-as-fresh-usiran-attacks-drive-oil-prices-higher-4882320"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "商品匯率", "color": "#E05C5C", "stocks": [{"t": "GLD", "n": "黃金 ETF，現貨報 4,429 美元、單日跌約 1%"}, {"t": "UUP", "n": "美元指數 ETF，升息預期推升美元"}, {"t": "TLT", "n": "長天期公債 ETF，殖利率走高則價格受壓"}], "en": "The cross-asset reaction was the interesting part. Gold did not behave like a safe haven: spot slipped to about $4,429 an ounce, a near one-month low, even with missiles flying. The reason is rates. Markets now price roughly a 61% chance of a September Fed hike, up from about 38% before the Jackson Hole speech, and that pushed the dollar and short-dated Treasury yields sharply higher. Gold still gained 9.6% in August, its best month since January.", "zh": "跨資產的反應才是這天最值得看的地方。飛彈都在飛了，黃金卻沒有走避險行情：現貨滑落到每盎司約 4,429 美元，是近一個月低點。原因在利率。市場對九月升息的機率已經定價到約 61%，Jackson Hole 演說之前只有約 38%，這把美元與短天期公債殖利率一起推高，而黃金不生息，利率一升它就被比下去。話說回來，八月黃金仍漲 9.6%，是一月以來最好的一個月。", "url": "https://www.fxstreet.com/news/gold-slips-as-warsh-fed-hike-bets-oil-rally-lift-us-yields-202608311836"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "盤勢結構", "color": "#E05C5C", "stocks": [{"t": "XLE", "n": "能源 ETF，當天唯一有明確資金流入的板塊"}, {"t": "SOXX", "n": "半導體 ETF，利率敏感度最高的一群"}, {"t": "IWM", "n": "羅素 2000 ETF，對利率與信貸最敏感的指數"}], "en": "Split the tape open and the message is cleaner than the index numbers. Money went into energy, which benefits directly from the oil move, and out of anything valued off long-duration cash flows. The Dow fell more than twice as much as the S&P in percentage terms, which is unusual and says the damage was in old-economy cyclicals rather than in megacap tech. When a geopolitical shock and a hawkish rate repricing arrive on the same day, they push in the same direction for energy and in opposite directions for everything else.", "zh": "把盤面拆開看，訊息比指數數字乾淨。資金往能源走，因為它直接吃到油價；資金從所有靠遠期現金流估值的東西撤出。道瓊的百分比跌幅是標普的兩倍多，這個組合並不常見，代表傷害集中在傳統景氣循環股而不是大型科技股。地緣衝擊和鷹派利率定價同一天到齊時，兩股力量對能源是同向的，對其他所有東西是反向的，所以才會出現指數小跌、內部大搬風。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-31-2026"},
    {"id": "earn_0", "channel": "財報速報", "tag": "政府 IT", "color": "#E8786A", "stocks": [{"t": "SAIC", "n": "財報優於預期，單日大漲 8.13%"}, {"t": "LDOS", "n": "同業，政府技術服務的規模對照組"}, {"t": "CACI", "n": "同業，情報與國防 IT 承包商"}], "en": "Science Applications International surged 8.13% after the government technology integrator posted better-than-expected second-quarter results. This matters beyond one stock: government services companies live on multi-year contracts, so their numbers say something about how fast federal money is actually converting into revenue. With defense spending running at record levels, the read-across to Leidos and CACI is worth checking rather than assuming.", "zh": "政府技術整合商 Science Applications International 第二季財報優於預期，單日大漲 8.13%。這件事的意義不只在一檔股票：政府服務公司靠的是多年期合約，它的數字等於在回答「聯邦預算實際轉成營收的速度有多快」。在國防支出創新高的背景下，這個訊號是否能延伸到同業 Leidos 與 CACI，值得自己去查而不是直接假設。三家的合約組合與客戶機關其實差很多。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-31-2026"},
    {"id": "earn_1", "channel": "財報速報", "tag": "網路基建", "color": "#E8786A", "stocks": [{"t": "VRSN", "n": "財報超標，單日漲 4.8%"}, {"t": "AKAM", "n": "同屬網路基礎設施，商業模式對照組"}, {"t": "GDDY", "n": "網域註冊商，與 VeriSign 位於同一條產業鏈"}], "en": "VeriSign rose 4.8% after beating second-quarter expectations. The company runs the registry behind dot-com and dot-net, which is about as close to a toll booth as a listed business gets: revenue is contracted, prices are set by agreement, and demand tracks the number of domains rather than the economy. On a day when the market was repricing rates and war risk, a business with almost no cyclicality got bid up. That is a signal about what investors wanted to own, not just about the earnings.", "zh": "VeriSign 第二季財報超標，單日漲 4.8%。這家公司經營的是 dot-com 與 dot-net 的註冊管理，商業模式接近收過路費：營收是合約鎖住的、價格照協議走、需求跟著網域數量而不是景氣。在一個市場同時重新定價利率與戰爭風險的日子，一家幾乎沒有景氣循環的公司被追價。這反映的是投資人當下想持有什麼，而不只是財報本身好不好。", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-31-2026"},
    {"id": "earn_2", "channel": "財報速報", "tag": "今晚盤後", "color": "#E8786A", "stocks": [{"t": "PANW", "n": "今日盤後公布財報，資安權重股"}, {"t": "ZS", "n": "同日盤後公布，雲端資安純業者"}, {"t": "CRWD", "n": "同業，兩家的指引會被拿來對照"}], "en": "Tonight after the close, Palo Alto Networks and Zscaler both report. Two cybersecurity names on the same evening is a useful setup, because the market gets to compare a diversified platform vendor against a pure-play cloud security vendor under identical macro conditions. The number that decides the reaction is not the beat but the forward guidance on billings and remaining performance obligations, which is where enterprise budget tightening shows up first.", "zh": "今天盤後 Palo Alto Networks 與 Zscaler 同時公布財報。兩家資安公司排在同一晚是個好用的對照組，因為市場可以在完全相同的總經條件下，比較一家多角化平台廠與一家雲端資安純業者的表現。決定股價反應的通常不是超標與否，而是帳單金額與未實現履約義務的前瞻指引，因為企業縮減預算最先反映的就是這兩個數字。", "url": "https://www.marketscreener.com/news/this-week-s-earnings-calendar-broadcom-and-dell-to-keep-the-ai-momentum-alive-ce7858dcdc89f42c"},
    {"id": "macro_0", "channel": "總經政策", "tag": "九月升息", "color": "#7C6AF7", "stocks": [{"t": "SHY", "n": "短天期公債 ETF，升息預期直接反映在這裡"}, {"t": "TLT", "n": "長天期公債 ETF，反映的是長期通膨與成長預期"}, {"t": "XLF", "n": "金融 ETF，利率路徑改變時最先重新定價"}], "en": "The September FOMC has turned into a genuine coin flip. Futures now imply about a 61% chance of a rate hike, up from roughly 38% before Chair Kevin Warsh spoke at Jackson Hole. The July meeting already ended 9-3, with three members dissenting in favour of a quarter-point increase, so the hawkish minority is not hypothetical. Not everyone is convinced: inflation and hiring data since July have both come in softer, and some economists argue a consensus to hike simply is not there.", "zh": "九月的聯準會會議已經變成真正的丟銅板。期貨目前隱含約 61% 的升息機率，Warsh 主席在 Jackson Hole 發言之前只有約 38%。七月的會議本來就是 9 比 3 收場，三位委員投票支持升息一碼，所以鷹派少數不是假設而是既成事實。但反方也有理由：七月以來的通膨與就業數據都偏軟，部分經濟學家認為九月根本湊不出升息的共識。這一週的數據會直接決定誰對。", "url": "https://www.cnbc.com/2026/08/31/markets-see-warsh-endorsing-a-rate-hike-in-september-not-everyone-is-convinced.html"},
    {"id": "macro_1", "channel": "總經政策", "tag": "供給面通膨", "color": "#7C6AF7", "stocks": [{"t": "USO", "n": "原油 ETF，油價是這輪通膨敘事的來源"}, {"t": "TIP", "n": "抗通膨債券 ETF，反映的是通膨預期而非現值"}, {"t": "XOM", "n": "整合型油商，油價轉嫁能力最完整的一端"}], "en": "Here is the awkward part of the setup. The inflation the Fed is reacting to is increasingly energy-driven, and energy prices are being set by a military conflict rather than by demand. A central bank raising rates into a supply shock is not fixing the cause; it is deliberately cooling demand to offset a price increase it cannot control. That is a real policy choice with a real cost, and it is why the hawkish repricing hit rate-sensitive assets so much harder than it hit the index.", "zh": "這裡是整個局面最尷尬的地方。聯準會正在反應的通膨，愈來愈多是能源推上去的，而能源價格現在是由一場軍事衝突決定，不是由需求決定。央行對著供給面衝擊升息，並沒有處理到病因，而是刻意壓抑需求去抵銷一個它控制不了的漲價。這是一個有代價的政策選擇，也解釋了為什麼這次鷹派定價對利率敏感資產的打擊，遠大於對指數本身的打擊。", "url": "https://www.chase.com/personal/investments/learning-and-insights/article/september-2026-rate-hike-now-expected-amid-energy-shocks"},
    {"id": "macro_2", "channel": "總經政策", "tag": "利率傳導", "color": "#7C6AF7", "stocks": [{"t": "XHB", "n": "房屋建商 ETF，房貸利率的第一線受壓標的"}, {"t": "DHI", "n": "美國最大建商之一，訂單量對利率極敏感"}, {"t": "RKT", "n": "房貸業者，成交量直接跟著利率走"}], "en": "When rate expectations flip, the stock index is usually the last thing to react, not the first. Short-dated Treasury yields moved immediately on the Warsh repricing, and the channel that follows within weeks is credit: mortgage rates, auto loans, and floating-rate corporate debt. Housing is the cleanest place to watch this, because order volumes respond to the monthly payment rather than to sentiment. If the September hike happens, the read-through shows up in builder order books before it shows up in earnings.", "zh": "升息預期一翻，最後才反應的通常是股價指數，不是最先。短天期公債殖利率在 Warsh 這次定價後立刻動了，接下來幾週會跟上的是信貸這條路：房貸利率、車貸、以及浮動利率的企業債。房市是觀察這件事最乾淨的地方，因為建商的訂單量是跟著每月還款金額走，不是跟著情緒走。九月真的升了，衝擊會先出現在建商的訂單簿，再出現在財報上。", "url": "https://www.fxstreet.com/news/gold-holds-near-4-450-as-fed-rate-hike-expectations-keep-buyers-cautious-202608311131"},
    {"id": "sector_0", "channel": "產業風向", "tag": "公用事業", "color": "#4EABA4", "stocks": [{"t": "PCG", "n": "加州立法未過責任上限，單日重挫約 18% 至 13.57 美元"}, {"t": "EIX", "n": "同因素暴跌 23%，是二十五年來最大單日跌幅"}, {"t": "SRE", "n": "同州公用事業，受同一套法規框架約束"}], "en": "The biggest single move of the day had nothing to do with Iran. California's legislature closed its session on 29 August by passing SB 492, a wildfire bill that left out the liability cap utilities had lobbied for. Governor Newsom's proposal to end subrogation was rejected after insurers warned it would push property premiums sharply higher. PG&E fell about 18% to $13.57 and Edison International fell 23%, its worst day in more than 25 years. Under the amended bill PG&E must cover close to 48% of the liability fund without passing the cost to customers.", "zh": "當天最大的單一波動跟伊朗無關。加州議會 8 月 29 日休會前通過 SB 492，這份野火法案並未納入公用事業遊說已久的責任上限。州長 Newsom 原本主張終止代位求償，在保險業者警告此舉會大幅推高住宅保費後遭到否決。PG&E 單日重挫約 18% 至 13.57 美元，Edison International 跌 23%，是二十五年來最慘的一天。修正後的法案要求 PG&E 負擔責任基金將近 48%，而且這筆成本不能轉嫁給用戶。", "url": "https://finance.yahoo.com/markets/stocks/articles/pg-e-sinks-18-edison-163921802.html"},
    {"id": "sector_1", "channel": "產業風向", "tag": "國防", "color": "#4EABA4", "stocks": [{"t": "LMT", "n": "主承包商，過去每次衝突升溫都是第一波反應標的"}, {"t": "NOC", "n": "主承包商，長週期武器系統為主"}, {"t": "HII", "n": "造船廠，訂單週期最長、與短線消息連動最低"}], "en": "Defence is the sector everyone reaches for on a day like this, which is exactly why it deserves scepticism. Earlier in 2026, defence names jumped on the first day of trading after strikes on Iran, then gave much of it back; one analyst noted the sector index had already risen more than 150% between 2020 and 2025, leaving valuations historically stretched. The spending is real, with Operation Epic Fury running above $1 billion a day, but a stock that has already priced five years of rearmament does not get re-rated by one more headline.", "zh": "遇到這種日子，大家第一個想到的都是國防股，而這正是它需要被懷疑的原因。2026 年稍早美國對伊朗動手後，國防股在開盤第一天也是大漲，接著吐回了大部分漲幅；有分析師指出這個板塊指數在 2020 到 2025 年間已經漲超過 150%，估值處在歷史偏高的位置。支出本身是真的，Epic Fury 行動每天燒掉超過 10 億美元，但一檔已經把五年重整軍備都算進去的股票，不會因為再多一則新聞就重新評價。", "url": "https://www.airandspaceforces.com/iran-war-boosts-defense-stocks-for-now/"},
    {"id": "sector_2", "channel": "產業風向", "tag": "板塊輪動", "color": "#4EABA4", "stocks": [{"t": "XLP", "n": "必需消費 ETF，八月底相對強勢的防禦端"}, {"t": "XLK", "n": "科技 ETF，八月底反而是偏弱的一端"}, {"t": "XRT", "n": "零售 ETF，八月底表現居前"}], "en": "August closed with an unusual sector ranking. In the final week, retail, services and consumer non-cyclicals led while capital goods, basic materials and technology lagged. Technology is normally the best-performing sector SPDR in August, averaging just under a 1% gain, so this was a break from the seasonal pattern rather than noise. Defensive and consumer names outperforming while industrials fall is a combination that usually shows up late in a cycle, not early.", "zh": "八月是用一個不太尋常的板塊排名收尾的。最後一週零售、服務與非循環消費領先，資本財、基礎材料與科技落後。科技通常是八月表現最好的板塊，歷史平均約有接近 1% 的漲幅，所以這次是季節性規律被打破，不是隨機雜訊。防禦與消費走強、同時工業走弱，這個組合通常出現在景氣循環的後段而不是前段。這一點值得放在心裡對照後續數據。", "url": "https://csimarket.com/markets/markets_glance.php"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "指數位置", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，指數約 2,972、距歷史高點不到 3%"}, {"t": "IJR", "n": "標普小型股 600 ETF，成分股獲利門檻較嚴"}], "en": "The Russell 2000 is having its best year since 2003, up about 20% in 2026, and sits near 2,972, more than 29% above its 52-week low of 2,303 and within roughly 3% of its all-time high. For the twelve months to 30 April it returned 44.4% against 30.4% for the large-cap Russell 1000. The driver is AI spending spilling out of megacap technology into the companies that build, power and service it, plus an expectation that earnings growth is finally broadening.", "zh": "羅素 2000 正在走 2003 年以來最好的一年，2026 年至今漲約 20%，指數位置約 2,972，比 52 週低點 2,303 高出超過 29%，距離歷史高點只剩約 3%。截至 4 月 30 日的一年報酬是 44.4%，大型股的羅素 1000 同期是 30.4%。推力來自人工智慧支出從大型科技股外溢到蓋機房、供電、做維運的那一圈公司，再加上市場預期獲利成長終於開始擴散。位置這麼高，代表容錯空間變小。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "獲利拐點", "color": "#5B8ED6", "stocks": [{"t": "VB", "n": "小型股綜合 ETF，成分最廣的一種持有方式"}, {"t": "IWN", "n": "小型價值 ETF，獲利拐點論述最直接的受惠端"}], "en": "The core bull case for small caps is not valuation, it is the earnings line. Consensus has small-cap earnings growth accelerating to about 18% in 2026 and another 18% in 2027, which would be the first time in several years that small caps out-grow large caps. That is the whole argument. If it holds, the current index level is justified by fundamentals; if guidance starts slipping in the next two quarters, the same level becomes expensive very quickly, because small caps have no megacap balance sheets to absorb a miss.", "zh": "小型股的核心多頭論述不是估值便宜，是獲利那一條線。市場共識預期小型股獲利成長在 2026 年加速到約 18%、2027 年再一個 18%，這會是好幾年來第一次小型股的成長率超越大型股。整套論述就建立在這裡。若能兌現，目前的指數位置有基本面撐住；若接下來兩季指引開始下修，同一個位置會非常快變成昂貴，因為小型股沒有大型科技公司那種資產負債表可以吸收失誤。", "url": "https://www.fool.com/investing/2026/08/26/small-cap-stocks-waiting-years-moment-is-it-here/"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "財報彈性", "color": "#5B8ED6", "stocks": [{"t": "QMCO", "n": "單季營收年增 27% 至 7,800 萬美元，獲利超出預期 206%"}, {"t": "STX", "n": "儲存產業的大型對照組，規模與客戶結構完全不同"}], "en": "Quantum Corp is a useful example of how small-cap numbers behave. Revenue jumped 27% to $78 million in its latest quarter and earnings beat expectations by 206%. A 206% beat sounds spectacular until you notice the base: when the estimate is a small number, the percentage swing is mostly arithmetic, not business quality. This is the single most common way small-cap headlines mislead, and the fix is simple. Look at the absolute dollar change and the revenue trend, not the beat percentage.", "zh": "Quantum Corp 是一個很好用的例子，說明小型股的數字為什麼要換個方式讀。它最新一季營收年增 27% 至 7,800 萬美元，獲利超出預期 206%。206% 聽起來很驚人，直到你注意到基期：當市場預估值本身是個很小的數字，百分比的擺盪多半是算術問題，不是經營品質的證明。這是小型股標題最常見的誤導方式，破解方法也很簡單，看絕對金額的變化與營收趨勢，不要看超標百分比。", "url": "https://altindex.com/best-stocks/small-cap-stocks"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "利率敏感", "color": "#5B8ED6", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，小型股裡最直接吃利率的一群"}, {"t": "XBI", "n": "生技 ETF，多數成分尚未獲利、對貼現率最敏感"}], "en": "Why does a hawkish repricing hurt small caps more than the index? Two structural reasons. First, small caps carry a much higher share of floating-rate debt, so a policy rate move lands in their interest expense within a quarter, while large caps sit on long-dated fixed coupons. Second, a large slice of the index has no profits yet, so its value is almost entirely future cash flow, which is exactly what a higher discount rate compresses. Regional banks and biotech sit at the two extremes of this.", "zh": "為什麼鷹派定價對小型股的傷害會比對指數大？有兩個結構性理由。第一，小型股的浮動利率負債佔比高得多，政策利率一動，一季之內就會出現在它們的利息費用裡，而大型股手上多半是長天期的固定利率債券。第二，指數裡有相當比重的公司還沒有獲利，價值幾乎全部來自未來現金流，而貼現率上升壓縮的正好就是這一塊。區域銀行與生技分別站在這條光譜的兩端。", "url": "https://www.vtmarkets.com/en-ca/discover/russell-2000-index-trading-guide-2026-small-cap-investment-strategies/"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "品質裂縫", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "小型成長 ETF，未獲利公司權重最高的一籃子"}, {"t": "XBI", "n": "生技 ETF，未獲利族群漲勢的代表之一"}], "en": "Underneath the Russell 2000 rally sits a fact worth writing down. Unprofitable Russell 2000 companies have risen 154% since mid-2025, while their profitable peers gained 34%. Investors have been paying up for AI exposure rather than for current earnings, by a factor of more than four. That is not automatically wrong, but it means the index's strength is concentrated in the part most exposed to a rate rise and to any funding squeeze. If September brings a hike, this is the cohort that reprices first.", "zh": "羅素 2000 的漲勢底下藏著一個值得寫下來的事實。自 2025 年年中以來，指數裡沒有獲利的公司漲了 154%，有獲利的同儕只漲 34%。投資人為人工智慧的想像付出的溢價，是為當前獲利付出的四倍以上。這不代表一定是錯的，但它說明指數的強勢集中在最禁不起升息、也最禁不起資金收緊的那一塊。九月若真的升息，這一群會是最先被重新定價的。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報", "stocks": [{"t": "BAER", "n": "空中滅火機隊營運商，董事 8 月中在 52 週低點附近買進 35.4 萬美元"}], "en": "Bridger Aerospace flies Super Scoopers and sensor-equipped King Airs for wildfire suppression. Nobody covers it: market cap is tiny, the stock sits near a 52-week low of $1.12, down 53% in six months. What is changing: the US Forest Service awarded two 160-day task orders covering four Super Scoopers, the longest guaranteed orders in company history; a $58 million Texas A&M Forest Service contract landed in July; and first European revenue began in Portugal. Director Jeffrey Kelter bought $354,050 on 19-20 August. Risks: revenue was flat at $30.5 million, the balance sheet is levered, and fire season is weather-dependent. Research lead, not investment advice.", "zh": "Bridger Aerospace 做的是空中滅火：操作 Super Scooper 水陸兩用機與裝了雙感測器的 King Air 偵察機。它為什麼被忽視：市值極小、股價貼近 52 週低點 1.12 美元、半年跌 53%，幾乎沒有券商追蹤。什麼正在改變：美國林務署給了兩張 160 天的任務訂單、涵蓋四架 Super Scooper，是公司史上最長的保證訂單；七月拿下德州農工林務署 5,800 萬美元合約；並在葡萄牙開出歐洲第一筆營收。董事 Jeffrey Kelter 在 8 月 19 至 20 日買進 35.4 萬美元。風險與反方：單季營收 3,050 萬美元其實是持平、負債偏重、火季本身靠天吃飯。這是研究線索，不是投資建議。", "url": "https://ir.bridgeraerospace.com/news-events/press-releases/detail/91/bridger-aerospace-reports-second-quarter-2026-results"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報與九座熔爐產能", "stocks": [{"t": "UAMY", "n": "美國本土銻生產商，執行長 8 月 28 日買進 20,000 股、約 9.84 萬美元"}], "en": "United States Antimony mines and smelts antimony, a critical mineral used in ammunition primers, flame retardants and batteries, with almost no US supply chain. Why ignored: micro-cap, commodity-linked, and the stock is down roughly 46% in six months. What is changing: the Thompson Falls smelter began commissioning with all nine furnaces targeted for operation, full-year revenue guidance was raised 25%, the first two DLA shipments of about 82,000 pounds delivered in June with roughly $2.6 million landing in Q3, and Defense Production Act milestones unlocked $12.8 million. CEO Gary Evans bought 20,000 shares at $4.92 on 28 August. Risks: quarterly revenue actually fell year on year to $7.9 million, and antimony pricing is volatile. Research lead, not investment advice.", "zh": "United States Antimony 做的是銻的開採與冶煉。銻是關鍵礦物，用在彈藥底火、阻燃劑與電池，而美國本土幾乎沒有供應鏈。它為什麼被忽視：微型市值、與原物料價格連動、股價半年跌約 46%。什麼正在改變：Thompson Falls 熔煉廠開始試車，目標讓九座熔爐全部投產；全年營收指引上調 25%；六月已交付兩批共約 8.2 萬磅的國防後勤局訂單，約 260 萬美元認列在第三季；國防生產法補助也通過三個里程碑、解鎖 1,280 萬美元。執行長 Gary Evans 於 8 月 28 日以 4.92 美元買進 20,000 股。風險與反方：單季營收其實年減至 790 萬美元，銻價波動極大。這是研究線索，不是投資建議。", "url": "https://finance.yahoo.com/markets/stocks/articles/united-states-antimony-corporation-reports-200500130.html"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報與油價是否守在 80 美元之上", "stocks": [{"t": "BATL", "n": "德拉瓦盆地微型油氣商，董事 8 月 26 日買進 70,000 股、約 9.1 萬美元"}], "en": "Battalion Oil is a micro-cap oil and gas producer. Why ignored: the stock trades near a 52-week low of $1.00 and is down 76% over six months, which puts it below most screens and outside almost all coverage. What is changing: director William D. Rogers bought 70,000 shares at an average $1.3024 on 26 August, roughly $91,168 of his own money, and the Iran escalation has just pushed WTI to $86.25. A leveraged small producer has the most operating leverage to a sustained oil move. Risks: that leverage cuts both ways, the price move is headline-driven and could unwind on a ceasefire, and a 76% drawdown usually reflects balance-sheet problems, not neglect alone. Research lead, not investment advice.", "zh": "Battalion Oil 是一家微型市值的油氣生產商。它為什麼被忽視：股價貼近 52 週低點 1.00 美元、半年跌 76%，這種價位會被大部分選股條件直接濾掉，券商也幾乎不寫。什麼正在改變：董事 William D. Rogers 於 8 月 26 日以均價 1.3024 美元買進 70,000 股、約 9.1 萬美元的自有資金；同時伊朗情勢把西德州原油推到 86.25 美元。一家財務槓桿高的小型生產商，對油價的營運槓桿是最大的。風險與反方：槓桿是雙向的，這波油價由新聞推動、停火就可能吐回，而且跌 76% 通常代表財務結構有問題，不只是被忽視。這是研究線索，不是投資建議。", "url": "https://www.investing.com/news/stock-market-news/top-insider-buys-and-sells-from-fridays-market-activity-93CH-4882804"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內·驗證在即", "color": "#C9A227", "status": "RADAR · 下一個驗證點 本月上旬 Q3 財報", "stocks": [{"t": "AVO", "n": "酪梨與藍莓的種植行銷配銷商，本月上旬公布 Q3 財報"}], "en": "Mission Produce is the pool name whose verification point arrives first this month. It grows, markets and distributes avocados and blueberries, a roughly $1 billion market cap that sits in nobody's sector bucket cleanly. The thesis entered the pool on the claim that a fall in avocado pricing was temporary. The Q3 report due in early September answers it directly: whether average selling prices recovered and whether gross margin repaired. This is the cleanest kind of radar entry, because the claim was written down in advance and the data settles it. Risks: agricultural pricing is weather and harvest driven, and a single quarter can mislead in both directions. Research lead, not investment advice.", "zh": "Mission Produce 是雷達池裡這個月最快要交卷的名字。它做的是酪梨與藍莓的種植、行銷與配銷，市值約 10 億美元，在任何一個板塊分類裡都不太歸得了位。當初入池的論點是：酪梨均價下滑只是暫時的。九月上旬要公布的第三季財報會直接回答這個問題，看均價有沒有回升、毛利率能不能修復。這是最乾淨的一種雷達案例，因為論點事先寫下來了，數據會替我們判定。風險與反方：農產品價格看天氣與採收，單一季度往兩個方向都可能誤導。這是研究線索，不是投資建議。", "url": "https://stockanalysis.com/stocks/avo/"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內·內部人加碼", "color": "#C9A227", "status": "RADAR · 下一個驗證點 是否出現第二位內部人跟進買進", "stocks": [{"t": "BORR", "n": "淺水自升式鑽井平台業者，董事長 8 月 25 日買進 20 萬股、約 87.5 萬美元"}], "en": "Borr Drilling runs jackup rigs in shallow water, a corner of offshore drilling that gets far less attention than deepwater. Why ignored: single-segment, highly cyclical, and priced off day rates most investors never look at. What is changing: chairman Tor Olav Troim bought 200,000 shares on the open market on 25 August for about $874,620, and the oil move since Sunday raises the odds that day rates hold. A chairman buying at size is the strongest single-name insider signal there is, short of a cluster. Risks: jackup day rates are contracted well ahead, so a spot oil spike does not translate into revenue quickly, and the balance sheet carries real debt. Research lead, not investment advice.", "zh": "Borr Drilling 專做淺水自升式鑽井平台，這是離岸鑽井裡關注度遠低於深水的一角。它為什麼被忽視：單一業務、高度循環、股價取決於大部分投資人根本不會去看的日租金。什麼正在改變：董事長 Tor Olav Troim 於 8 月 25 日在公開市場買進 20 萬股、約 87.5 萬美元；而週日以來的油價變動提高了日租金撐住的機率。董事長大額買進，是單一名字裡僅次於群聚買進的最強內部人訊號。風險與反方：自升式平台的日租金是提前簽約鎖定的，現貨油價跳升不會很快轉成營收，而且負債水位不低。這是研究線索，不是投資建議。", "url": "https://www.borrdrilling.com/"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內·分拆卡關", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Trinzic 的 Form 10 何時生效", "stocks": [{"t": "KBR", "n": "分拆案的 Form 10 至 8 月底仍未生效，是整個論點的關卡"}], "en": "KBR is the pool name where nothing has happened, and that is the point. The engineering and government services group announced it would spin off Mission Technology Solutions as a company called Trinzic, and the whole thesis depends on that separation revealing what the government business is actually worth on its own. The Form 10 registration statement was still not effective as of 29 August. Until it is, there are no standalone financials, no capital structure and no valuation anchor. Risks: spin-off timetables slip routinely, and a delay long enough to run into a weaker market can shrink the value the separation was meant to unlock. Research lead, not investment advice.", "zh": "KBR 是雷達池裡什麼都還沒發生的那一檔，而重點正是這個。這家工程與政府服務集團宣布要把 Mission Technology Solutions 分拆成一家叫 Trinzic 的公司，整個論點就建立在：分開之後，政府業務單獨值多少錢會被攤在陽光下。但 Form 10 註冊聲明到 8 月 29 日為止仍未生效。只要它沒生效，就沒有獨立財報、沒有資本結構、也沒有估值錨點。風險與反方：分拆時程延後是常態，若拖到市況轉弱，本來要釋放的價值也會跟著縮水。這是研究線索，不是投資建議。", "url": "https://www.insidearbitrage.com/spinoffs/"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "群聚買進", "color": "#6DB56D", "stocks": [{"t": "DKS", "n": "四位董事於 8 月 26 至 27 日合計買進 372 萬美元"}, {"t": "HIBB", "n": "運動用品零售同業，規模與客群的對照組"}, {"t": "ASO", "n": "戶外運動零售同業，用來比較同期是否有相同訊號"}], "en": "The broadest insider cluster of 28 August was at Dick's Sporting Goods. Four directors bought on the open market across 26-27 August, $3.72 million between them. Mark Barrenechea added 17,000 shares at $130.72, nearly tripling his position; Robert Eddy put in $514,780, growing his holding 58%. The percentage increases matter more than the dollar totals, because they show conviction relative to what each person already owned. One caveat is worth flagging: every buyer here is a director. No named executive officer appears in the cluster.", "zh": "8 月 28 日申報中範圍最廣的一組群聚買進出現在 Dick's Sporting Goods。四位董事在 8 月 26 至 27 日於公開市場買進，合計 372 萬美元。Mark Barrenechea 以 130.72 美元加碼 17,000 股，持股接近變成原來的三倍；Robert Eddy 投入 514,780 美元，持股增加 58%。這裡真正該看的是加碼幅度而不是金額總數，因為幅度反映的是相對於他原本部位的信心強度。有一點必須標出來：這一組買進的全部是董事，沒有任何一位具名經理人在裡面。", "url": "https://ounie.com/b/ounie/insider-conviction-daily/insider-conviction-daily-august-28-2026"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "大股東買進", "color": "#6DB56D", "stocks": [{"t": "AEON", "n": "董事兼 10% 股東 8 月 19 日買進 115 萬股、約 24.3 萬美元"}, {"t": "ABBV", "n": "肉毒桿菌素市場的既有龍頭，是這類小公司的對照與威脅"}], "en": "At AEON Biopharma, director and 10% owner Timothy P. Lynch bought 1,150,000 shares on 19 August at an average $0.2117, about $243,455, with the stock near a 52-week low of $0.18 after falling 30% in a week. Read this one carefully. A 10% holder is not the same signal as an operating executive: large holders often average down to defend an existing position or protect a stake, and they may have participated in the financing that created the position. Share count, not dollar value, is what makes the headline look big here.", "zh": "AEON Biopharma 的董事兼 10% 股東 Timothy P. Lynch 於 8 月 19 日以均價 0.2117 美元買進 115 萬股、約 24.3 萬美元，當時股價貼近 52 週低點 0.18 美元、一週內剛跌 30%。這一筆要小心讀。10% 大股東和實際經營的經理人不是同一種訊號：大股東常常是為了護住既有部位而往下攤平，也可能本來就參與過造成這個部位的增資。這則標題看起來很大，靠的是股數而不是金額。", "url": "https://m.investing.com/news/stock-market-news/thursdays-insider-activity-notable-buys-and-major-sales-93CH-4860843"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "判讀", "color": "#6DB56D", "stocks": [{"t": "DKS", "n": "當日唯一的多人群聚案例，稀缺性本身就是資訊"}, {"t": "BAER", "n": "單一董事買進，訊號等級低於群聚但仍值得記錄"}], "en": "One number frames how to read all of this. On 28 August, 394 Form 4s were filed. Only 67 looked like open-market purchases, and just four qualified as clusters. Everything else was option exercises, vesting and scheduled sales, which carry almost no information. So the ranking is: a cluster beats a single filer; a named executive beats a director; a large percentage increase beats a large dollar amount; and an open-market purchase at market price beats anything done under a pre-arranged plan. Roughly one filing in a hundred clears all four.", "zh": "有一個數字可以框住這一切要怎麼讀。8 月 28 日當天有 394 份 Form 4 送件，其中只有 67 筆看起來是公開市場買進，符合群聚定義的只有四組。其餘全是選擇權行使、股權歸屬與事先排定的賣出，這些幾乎沒有資訊量。所以判讀的排序是：群聚勝過單人；具名經理人勝過董事；加碼百分比勝過金額大小；用市價在公開市場買進，勝過任何依既定計畫執行的交易。四項全過的，大約一百份裡面才有一份。", "url": "https://ounie.com/b/ounie/insider-conviction-daily/insider-conviction-daily-august-28-2026"},
    {"id": "capitol_0", "channel": "政要持股", "tag": "AI 電力", "color": "#B5654D", "stocks": [{"t": "BE", "n": "申報中的新部位：15,000 股加 200 口 2027 年 6 月到期、履約價 100 美元的買權"}, {"t": "INTC", "n": "7 月 24 日買進 10,000 股，另有 50 口履約價 50 美元、2027 年 6 月到期的買權"}], "en": "A periodic transaction report filed with the House Clerk on 21 August disclosed a new Bloom Energy position inside Nancy Pelosi's household, executed by her spouse and reported under the spousal rules. The filing shows 15,000 shares plus 200 call options struck at $100 expiring June 2027, alongside 10,000 Intel shares bought on 24 July for $500,001 to $1 million and 50 Intel calls struck at $50 expiring June 2027. Read as a position rather than as a personality, this is one theme expressed twice: electricity for AI data centres, and domestic chip manufacturing. The structure says more than the names. Long-dated calls struck well above the market are a bet on a multi-year re-rating, not on this quarter.", "zh": "8 月 21 日送進眾議院書記官的一份定期交易報告，揭露 Nancy Pelosi 家戶內新開的 Bloom Energy 部位，由配偶執行、依配偶條款申報。內容是 15,000 股，加上 200 口履約價 100 美元、2027 年 6 月到期的買權；同一份還有 7 月 24 日買進的 10,000 股 Intel，金額區間 50 萬到 100 萬美元，以及 50 口履約價 50 美元、同樣 2027 年 6 月到期的 Intel 買權。把它當成一個部位而不是一個人來看，這是同一個主題被押了兩次：人工智慧資料中心的電力，以及晶片的美國本土製造。結構比名字更有訊息量，長天期、履約價遠高於市價的買權，押的是好幾年的重新評價，不是這一季。", "url": "https://seekingalpha.com/news/4636268-nancy-pelosi-discloses-new-buys-of-intel-bloom-energy"},
    {"id": "capitol_1", "channel": "政要持股", "tag": "判讀", "color": "#B5654D", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報持股的 ETF，本站另有績效分頁"}, {"t": "GOP", "n": "追蹤共和黨籍議員申報持股的 ETF，可與 NANC 對照"}, {"t": "HUBB", "n": "另一位眾議員 90 天內 60 筆買進的首位標的，電網設備商"}], "en": "Five things make these filings weaker signals than they look. Reports arrive up to 45 days after the trade, so anyone following along is buying at a price the filer never paid. Amounts come as wide bands, not numbers, so a $1,001 trade and a $15,000 trade read identically. Many are executed in a spouse's or a trust's account, and the member may not have chosen them. Where options are involved, the strike and expiry carry the actual information, and most coverage omits both. And a second filer buying the same theme independently, as with the 60 purchases led by grid equipment maker Hubbell in another member's disclosures, is worth more than any single name.", "zh": "有五件事讓這類申報比表面上弱得多。第一，申報最晚可以在交易後 45 天才出現，跟單的人買到的是申報者從來沒付過的價位。第二，金額只有寬區間沒有數字，1,001 美元和 15,000 美元的交易讀起來一模一樣。第三，很多筆是在配偶或信託帳戶執行的，議員本人未必參與決策。第四，只要牽涉選擇權，真正的資訊在履約價與到期日，而大部分報導兩個都不寫。第五，第二位申報者獨立押到同一個主題，例如另一位眾議員 90 天內 60 筆買進、首位標的是電網設備商 Hubbell，這種重疊比任何單一名字都更有意義。", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure"},
    {"id": "week_0", "channel": "本週事件", "tag": "總經數據", "color": "#C97DD4", "stocks": [{"t": "IEF", "n": "中天期公債 ETF，數據落點會直接改寫殖利率曲線"}, {"t": "GLD", "n": "黃金 ETF，這週對實質利率的變化最敏感"}], "en": "This is the last full data week before the September FOMC, and the calendar is stacked. ISM Manufacturing and JOLTS land first, followed by ADP, Challenger job cuts and ISM Services, with the Employment Situation report on Friday 4 September at 8:30 am Eastern. Eurozone flash CPI and a Bank of Canada decision sit alongside. The sequencing matters: the earlier releases usually pre-position the market so that payrolls confirms or corrects rather than shocks from a flat base. With hike odds near 61%, a soft payroll print does more damage to that pricing than a strong one does to the market.", "zh": "這是九月聯準會會議前最後一個完整的數據週，行事曆排得很滿。ISM 製造業與職缺調查先出，接著是 ADP、Challenger 裁員與 ISM 服務業，就業報告落在 9 月 4 日週五美東時間早上 8 點半。同一週還有歐元區消費者物價初值與加拿大央行決議。順序本身有意義：前面幾份數據通常會先幫市場定好位，讓非農扮演確認或修正的角色，而不是從一片空白裡丟出震撼。在升息機率已經約 61% 的情況下，一份偏弱的非農對這個定價的破壞力，大於一份偏強的非農對股市的破壞力。", "url": "https://www.newsquawk.com/headlines/newsquawk-weekly-economic-calendar---31st-august---4th-september-2026"},
    {"id": "week_1", "channel": "本週事件", "tag": "重點財報", "color": "#C97DD4", "stocks": [{"t": "AVGO", "n": "9 月 2 日盤後，本週人工智慧資本支出的主要檢查點"}, {"t": "CRM", "n": "同日盤後，企業軟體支出的溫度計"}, {"t": "LULU", "n": "9 月 3 日盤後，可選消費的需求驗證"}], "en": "The earnings week is front-loaded with tests of the two stories driving this market. Palo Alto Networks and Zscaler report after tonight's close. Wednesday 2 September brings Broadcom, Salesforce, Snowflake and Dollar Tree, with Dell also in the week; Lululemon follows on Thursday 3 September. Broadcom is the one that matters most, because it is the cleanest read on whether AI capital spending is still accelerating. Dollar Tree and Lululemon test the other half of the picture, which is whether the consumer is trading down.", "zh": "這週的財報把兩個支撐市場的故事都排在前段檢驗。Palo Alto Networks 與 Zscaler 在今晚盤後公布。9 月 2 日週三輪到 Broadcom、Salesforce、Snowflake 與 Dollar Tree，Dell 也落在這一週；Lululemon 接在 9 月 3 日週四。其中最關鍵的是 Broadcom，因為它是判斷人工智慧資本支出是否還在加速最乾淨的一個讀數。Dollar Tree 與 Lululemon 則檢驗畫面的另外一半：消費者到底有沒有在降級。", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262140230-nonfarm-payrolls-broadcom-dell-palo-alto-networks-earnings-august-tradingkey"},
    {"id": "eval_0", "channel": "今日評估", "tag": "今日一問", "color": "#E8A838", "status": "讀完想一想 · 到 end screen 按討論鍵把它聊開", "stocks": [{"t": "USO", "n": "原油 ETF，這場衝突的價格出口"}, {"t": "SPY", "n": "標普 500 ETF，承受兩股力量的最終容器"}], "en": "If you only keep one thing from today, keep the combination rather than any single headline. A military conflict is pushing oil up, and a central bank is preparing to raise rates partly because oil is pushing inflation up. Those two forces are not independent, and they hit portfolios through completely different channels: one lifts energy and materials, the other compresses everything valued off future cash flow. The question worth sitting with: which of your current positions quietly assumes that rates fall from here, and what would you need to see this week to know that assumption is wrong?", "zh": "如果今天只留一件事，請留那個組合，而不是任何單一標題。一場軍事衝突正在把油價推上去，而央行準備升息，部分原因正是油價把通膨推上去。這兩股力量不是各走各的，但它們打到投資組合的路徑完全不同：一個抬升能源與原物料，另一個壓縮所有靠未來現金流估值的東西。值得坐下來想的問題是：你現在的部位裡，哪一個安靜地假設了利率會從這裡往下走？而這一週要看到什麼，你才會知道那個假設錯了？", "url": "https://www.cnbc.com/2026/08/31/markets-see-warsh-endorsing-a-rate-hike-in-september-not-everyone-is-convinced.html"},
];

const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();
const lsKeyFor = (sub) => "mosfeed_" + BRIEF_ID + "_" + sub;

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/01/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v9.6</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
