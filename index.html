<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "週線收官", "color": "#E05C5C", "zh": "上週五（8/14）三大指數全數收黑：標普 500 跌 13.23 點至 7,785.76，道瓊跌 107.58 點至 53,732.41，那斯達克跌 73.86 點至 26,729.16。但拉長到週線，標普仍收下今年第三個連續紅週。單日的下跌來自午盤後轉趨保守——密大八月消費者信心初值走弱、七月零售銷售意外月減 0.6%，兩份數據同時指向消費動能鬆動。這是今天開盤前最需要放在心裡的背景：指數在高檔，但撐著指數的那個消費者已經在喊累。", "en": "All three major indexes closed lower last Friday (8/14): the S&P 500 fell 13.23 points to 7,785.76, the Dow dropped 107.58 points to 53,732.41, and the Nasdaq lost 73.86 points to 26,729.16. Zoom out to the week, though, and the S&P still booked its third straight weekly gain. Friday's slide came from an afternoon turn to caution — the preliminary University of Michigan August sentiment reading softened and July retail sales unexpectedly fell 0.6%, both pointing to a consumer losing momentum. That is the backdrop to carry into today's open: indexes near highs, but the consumer holding them up is visibly tiring.", "url": "https://www.yakimaherald.com/news/nation_and_world/business/how-major-us-stock-indexes-fared-friday-8-14-2026/article_2af73552-fb1f-538a-b8b6-2c5203b256cc.html", "stocks": [{"t": "SPY", "n": "標普 500 ETF，週五 -0.2%，但全週仍收紅、連三週上漲"}, {"t": "DIA", "n": "道瓊 ETF，週五 -0.2%，全週表現落後另外兩大指數"}, {"t": "QQQ", "n": "那斯達克 100 ETF，週五 -0.3%，科技權值股是週五拖累主力"}]},

    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "商品與匯率", "color": "#E05C5C", "zh": "股市之外的三個數字今晨都在動。黃金報 4,428.80 美元、單日漲 1.49%，續留在歷史高檔區；西德州原油 82.42 美元、漲 1.44%，布蘭特原油仍在 89 至 90 美元一帶；美元指數 DXY 回落到 99.65（-0.31%）。金與油同步上漲、美元同步走弱，這個組合通常反映的是地緣風險溢價而不是景氣轉強——荷姆茲海峽自二月底封閉至今未解，美國海軍封鎖持續，伊朗外交部仍公開表示重啟條件不存在。", "en": "Three numbers outside equities are moving this morning. Gold is at $4,428.80, up 1.49%, still parked near record territory. WTI crude sits at $82.42, up 1.44%, with Brent hovering around $89 to $90. The dollar index has slipped to 99.65, down 0.31%. Gold and oil rising together while the dollar weakens usually signals a geopolitical risk premium rather than improving growth — the Strait of Hormuz has been closed since late February, the U.S. naval blockade continues, and Iran's foreign ministry still says the conditions for reopening do not exist.", "url": "https://oilprice.com/Energy/Oil-Prices/Brent-Tops-89-Amid-US-Iran-Stalemate-Over-Hormuz.html", "stocks": [{"t": "GLD", "n": "黃金 ETF，現貨金報 4,428.80 美元、單日 +1.49%，避險需求未退"}, {"t": "USO", "n": "原油 ETF，WTI 報 82.42 美元 +1.44%，荷姆茲僵局是價格底部支撐"}, {"t": "UUP", "n": "美元多頭 ETF，DXY 回落至 99.65（-0.31%），對商品構成順風"}]},
    {"id": "overnight_4", "channel": "隔夜盤勢", "tag": "債市與利率敏感股", "color": "#E05C5C", "zh": "十年期公債殖利率回升到 4.696%（+1.19%），這個位置很關鍵。上週四 PPI 意外溫和之後，市場把九月升息機率從 55% 砍到 35%，殖利率理應往下走；但它反而回升，代表債市對「通膨仍高、財政赤字仍大」這件事的定價，沒有跟著股市的樂觀一起走。對於銀行、公用事業、REIT 這些吃利率的族群，今天要盯的不是股價本身，而是殖利率能不能守在 4.7% 以下。", "en": "The 10-year Treasury yield has backed up to 4.696%, a rise of 1.19%, and that level matters. After Thursday's unexpectedly tame PPI print, markets cut the odds of a September rate hike from 55% to 35%, which should have pushed yields down. Instead they rose, meaning the bond market's pricing of persistent inflation and a wide fiscal deficit has not followed equities into optimism. For banks, utilities and REITs — the rate-sensitive complex — the number to watch today is not the share price but whether the 10-year can hold below 4.7%.", "url": "https://strongbuyanalytics.com/stock-market-outlook", "stocks": [{"t": "TLT", "n": "20 年期以上公債 ETF，十年期殖利率回到 4.696%，長天期債價承壓"}, {"t": "KRE", "n": "區域銀行 ETF，殖利率曲線形狀直接決定其淨利差預期"}, {"t": "XLU", "n": "公用事業 ETF，高股息族群對殖利率上行最敏感，近期已從強勢轉為落後"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "礦業財報", "color": "#E8786A", "zh": "全球最大礦商 BHP 將在明天（8/18）雪梨盤前公布截至 6 月底的 FY26 全年財報，這是本週非美國企業裡最有訊號價值的一份。看點不在獲利數字，而在結構：去年 12 月的半年報裡，銅已經貢獻 51% 的核心 EBITDA，首度超越鐵礦砂成為最大獲利來源。七月的營運回顧顯示 FY26 銅產量 195.3 萬噸（年減 3%，但落在上調後的指引區間內），鐵礦砂則創下 2.65 億噸新高。銅價與 AI 電網需求的連動，讓這份財報變成整個電氣化供應鏈的溫度計。", "en": "BHP, the world's largest miner, reports full-year FY26 results for the 12 months to June before the Sydney open tomorrow (8/18) — the highest-signal non-U.S. print of the week. The interesting part is not the profit line but the mix: in the December half, copper already contributed 51% of underlying EBITDA, overtaking iron ore as the largest earnings driver for the first time. The July operational review showed FY26 copper output of 1,953kt (down 3% year over year but inside raised guidance) and record iron ore of 265Mt. With copper tied to AI-driven grid demand, this print doubles as a thermometer for the whole electrification supply chain.", "url": "https://www.bhp.com/news/media-centre/releases/2026/02/bhp-results-for-the-half-year-ended-31-december-2025", "stocks": [{"t": "BHP", "n": "8/18 雪梨盤前公布 FY26 全年財報，銅已佔核心 EBITDA 的 51%"}, {"t": "RIO", "n": "力拓，鐵礦砂曝險更純，可用來對照 BHP 的銅轉型溢價"}, {"t": "FCX", "n": "自由港，純銅曝險標的，BHP 的銅價與成本評論會直接外溢到它"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "AI 供應鏈分歧", "color": "#E8786A", "zh": "上週三份 AI 相關財報把「AI 受惠股」這個標籤徹底拆開了。美超微財報後連兩天大漲，週四再漲 6%、加上週三的 19%，靠的是超出預期的當季指引；思科卻因毛利率壓力單日重挫 9%；Cerebras 更慘，第二季營收 1.8 億美元、低於預估的 1.94 億，股價跌 14%。同一個題材、同一週，結果三個方向。這說明市場已經不再無差別給 AI 溢價，而是開始分辨「誰真的在出貨」與「誰只是在講故事」。", "en": "Three AI-adjacent prints last week pulled the 'AI beneficiary' label apart. Super Micro rallied two days running, adding 6% on Thursday on top of 19% on Wednesday, on current-quarter guidance that beat. Cisco fell 9% in a single session on margin pressure. Cerebras fared worst, posting second-quarter revenue of $180 million against a $194 million estimate and dropping 14%. Same theme, same week, three different outcomes. The market has stopped handing out an undifferentiated AI premium and started separating who is actually shipping from who is still telling a story.", "url": "https://www.cnbc.com/2026/08/12/stock-market-today-live-updates.html", "stocks": [{"t": "SMCI", "n": "財報後兩日累漲逾 25%，當季指引優於預期，是「真出貨」那一邊"}, {"t": "CSCO", "n": "毛利率壓力導致單日 -9%，網通硬體吃不到 AI 溢價的代表"}, {"t": "CBRS", "n": "Q2 營收 1.8 億低於預估 1.94 億，股價 -14%，題材與交付之間的落差"}]},
    {"id": "earn_3", "channel": "財報速報", "tag": "重大公司事件", "color": "#E8786A", "zh": "波音把三家子公司賣給了一家市值遠小於它的 eVTOL 新創——這筆 8 月 10 日宣布的交易到現在還在市場消化。Archer Aviation 以全股票加認股權證的方式收購波音的 Wisk Aero（自駕飛行）、SkyGrid（空域管理平台）與 Insitu（無人機系統），成交時不付現金；波音則取得 Archer 交割前流通 A 股的 19.75%，並同步進行技術合作。這是把 eVTOL、無人機與空域軟體整合成單一「實體 AI」平台的嘗試，預計年底前完成，仍待反壟斷審查。", "en": "Boeing has sold three subsidiaries to an eVTOL startup a fraction of its size — a deal announced on August 10 that the market is still digesting. Archer Aviation is acquiring Boeing's Wisk Aero (autonomous flight), SkyGrid (airspace management software) and Insitu (unmanned aircraft systems) entirely in stock and warrants, with no cash paid at closing. Boeing receives Class A shares equal to 19.75% of Archer's outstanding Class A stock immediately before closing, plus a technology collaboration. The stated goal is to fuse eVTOL, UAS and airspace software into a single 'physical AI' platform. Closing is expected by year-end, pending antitrust review.", "url": "https://boeing.mediaroom.com/2026-08-10-Archer-to-Shape-Physical-AI-Future-of-Aerospace-and-Defense-with-Acquisition-of-Boeings-Wisk-Aero,-Insitu-and-SkyGrid-Subsidiaries-Boeing-to-Invest-in-Archer-and-Collaborate", "stocks": [{"t": "ACHR", "n": "以全股票收購波音三家子公司，交割時波音將持有其 19.75% A 股"}, {"t": "BA", "n": "出售 Wisk、SkyGrid、Insitu 換取 Archer 股權，等於把非核心資產證券化"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "今日數據", "color": "#7C6AF7", "zh": "今天有兩份中量級數據。8:30 是紐約聯儲的帝國州製造業指數，七月大幅回升十點到 15.6，是製造業少數轉正的訊號，市場想知道這個回升是一次性還是趨勢。10:00 是 NAHB 建商信心指數，這個指標近幾個月一直在低檔徘徊，房價所得比偏高、土地與營建成本居高不下，讓建商情緒始終壓抑。兩份數據一個看工廠、一個看工地，共同回答同一個問題：在利率沒降的情況下，實體經濟到底撐不撐得住。", "en": "Two mid-tier data points today. At 8:30 a.m. comes the New York Fed's Empire State manufacturing index, which jumped ten points to 15.6 in July — one of the few positive manufacturing signals — and the question is whether that bounce was a one-off. At 10:00 a.m. the NAHB builder sentiment index lands; it has been stuck at depressed levels for months as elevated price-to-income ratios and stubbornly high land and construction costs weigh on builders. One reads the factory floor, the other the job site, and together they answer the same question: with rates not coming down, can the real economy hold up?", "url": "https://www.investing.com/news/stock-market-news/ny-empire-state-manufacturing-index-among-economic-data-due-monday-93CH-4861389", "stocks": [{"t": "XLI", "n": "工業類股 ETF，帝國州製造業指數（前值 15.6）是其最直接的景氣代理指標"}, {"t": "ITB", "n": "住宅建商 ETF，10:00 的 NAHB 建商信心指數直接對應其基本面情緒"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "FOMC 紀要", "color": "#7C6AF7", "zh": "本週三（8/19）公布七月 28 至 29 日 FOMC 的會議紀要，這份文件的重要性高於一般月份。七月會議維持利率不變，但票數是 9 比 3，克里夫蘭的哈瑪克、明尼亞波利斯的卡什卡里、達拉斯的羅根三人同時主張升息——這是 2016 年 9 月以來首次出現三票同方向異議。紀要要回答的問題只有一個：這三票是孤立的少數，還是有更多委員在會議桌上被說服但沒投下反對票。前者維持現狀，後者會把九月會議的定價整個往鷹派推。", "en": "Wednesday (8/19) brings the minutes of the July 28-29 FOMC meeting, and this set matters more than most. July held rates steady on a 9-3 vote, with Cleveland's Hammack, Minneapolis's Kashkari and Dallas's Logan all dissenting in favor of a hike — the first three-way same-direction dissent since September 2016. The minutes have one job: show whether those three were an isolated minority or whether more members were persuaded around the table without formally dissenting. The first keeps the base case intact; the second drags September pricing sharply hawkish.", "url": "https://www.cnbc.com/2026/07/29/fed-rate-decision-july-2026.html", "stocks": [{"t": "IEF", "n": "7-10 年期公債 ETF，會議紀要的鷹派程度直接反映在中天期殖利率"}, {"t": "XLF", "n": "金融類股 ETF，升息預期升溫對銀行淨利差是短多、對信用品質是長空"}]},
    {"id": "macro_3", "channel": "總經政策", "tag": "升息定價", "color": "#7C6AF7", "zh": "市場現在爭論的不是「什麼時候降息」，而是「九月會不會升息」，這件事本身就值得停下來想一下。上週四七月 PPI 月增持平、年增從 5.5% 降到 4.7% 之後，隱含的九月升息機率從一週前的 55% 降到 35%。也就是說，即使數據轉好，市場仍給了三分之一強的升息機率。這是 2022 年以來很少見的定價結構：通膨黏著在高位、勞動市場七月大幅減少就業、消費在退潮，三個訊號互相矛盾，而聯準會的政策空間被夾在中間。", "en": "The debate is no longer about when the Fed cuts but whether it hikes in September — and that framing alone is worth pausing on. After Thursday's July PPI came in flat month over month, with the annual pace easing from 5.5% to 4.7%, the implied probability of a September increase fell to 35% from 55% a week earlier. Even on improving data, in other words, markets still assign better than a one-in-three chance of a hike. This is a pricing structure rarely seen since 2022: inflation sticky at elevated levels, a sharp July drop in payrolls, and consumption receding — three contradictory signals with the Fed's policy room squeezed in the middle.", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/", "stocks": [{"t": "SHY", "n": "1-3 年期公債 ETF，最貼近政策利率預期，九月升息機率 35% 直接反映在此"}, {"t": "TIP", "n": "抗通膨債券 ETF，PPI 年增從 5.5% 降到 4.7%，通膨補償預期是關鍵變數"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "醫療保健", "color": "#4EABA4", "zh": "上週表現最好的類股不是科技也不是能源，是醫療保健。這件事在今年大部分時間都不成立——醫療保健長期是資金最不想碰的板塊之一。轉變的邏輯有兩層：一是在消費疲弱、製造業不確定的環境下，醫療需求的防禦性重新被定價；二是這個板塊的估值折價已經深到即使基本面只是持平，均值回歸的空間也夠大。要留意的是，如果九月真的升息，生技這種長天期現金流的族群會第一個被打回去。", "en": "The best-performing sector last week was not technology or energy — it was health care. That has not been true for most of this year; health care has been among the least-wanted groups in the market. Two things changed. First, with consumption softening and manufacturing uncertain, the defensiveness of health care demand is being repriced. Second, the sector's valuation discount had grown deep enough that even flat fundamentals leave meaningful room for mean reversion. The caveat: if September brings a hike, long-duration cash flow groups like biotech get hit first.", "url": "https://www.schwab.com/learn/story/stock-market-update-open", "stocks": [{"t": "XLV", "n": "醫療保健類股 ETF，上週單週漲逾 1%、是表現最好的 S&P 類股"}, {"t": "IBB", "n": "生技 ETF，板塊內對利率最敏感的一段，升息預期回來會最先受壓"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "能源", "color": "#4EABA4", "zh": "能源類股的強勢已經不是短線現象。上週 XLE 漲超過 6%，加上前幾週的連續走揚，讓能源成為今年 11 個 S&P 類股中最強的一段。支撐它的不是需求，而是供給：荷姆茲海峽封閉導致的中東原油輸出受限預計整個八月都會持續，美國能源資訊署把第三季布蘭特均價預估放在每桶 85 美元。這裡有個不對稱——如果美伊談成，油價的下跌速度會遠快於它上漲的速度，而能源股現在的估值已經反映了封鎖延續。", "en": "Energy's strength is no longer a short-term phenomenon. XLE rose more than 6% last week, and after several strong weeks running, energy is the best-performing of the 11 S&P sectors this year. What supports it is not demand but supply: Middle East crude export constraints tied to the Hormuz closure are expected to persist through August, and the EIA puts its third-quarter Brent forecast at $85 a barrel. There is an asymmetry buried here — if Washington and Tehran reach a deal, oil would fall far faster than it rose, and energy equities are already priced for the blockade continuing.", "url": "https://www.eia.gov/outlooks/steo/", "stocks": [{"t": "XLE", "n": "能源類股 ETF，上週漲逾 6%，是今年 11 個 S&P 類股中最強的一段"}, {"t": "SLB", "n": "油服龍頭，對油價的營運槓桿高於整合型石油商，是這波的高 beta 端"}]},
    {"id": "sector_3", "channel": "產業風向", "tag": "特殊製程半導體", "color": "#4EABA4", "zh": "半導體內部正在出現第二條敘事線：不做設計、只做特殊製程的代工廠。以色列的高塔半導體第二季營收 4.6 億美元、年增 24%，毛利成長 72%、營業利益成長 2.26 倍、淨利成長 95%，引擎是矽光子——第二季年化營收速率已超過 6.8 億美元。這條線之所以被忽略，是因為一般投資人習慣用「誰設計了 AI 晶片」來分類，而不是「誰負責把光訊號變成電訊號」。資料中心互連的瓶頸正在從運算轉向傳輸，這個轉向決定了誰是下一段的受惠者。", "en": "A second narrative line is forming inside semiconductors: foundries that design nothing and specialize in process. Israel's Tower Semiconductor posted second-quarter revenue of $460 million, up 24% year over year, with gross profit up 72%, operating profit up 2.26 times and net profit up 95%. The engine is silicon photonics, which hit an annualized run rate above $680 million in the quarter. This line gets overlooked because generalists sort the sector by who designs the AI chip rather than who converts light into electrical signals. The data center bottleneck is shifting from compute to interconnect, and that shift decides who benefits next.", "url": "https://247wallst.com/investing/2026/08/15/3-under-the-radar-chip-stocks-wall-street-is-sleeping-on-in-august/", "stocks": [{"t": "TSEM", "n": "高塔半導體，Q2 營收 4.6 億（+24%）、淨利 +95%，矽光子年化速率逾 6.8 億"}, {"t": "NVTS", "n": "Navitas，資料中心 800V 直流架構的純小型股標的，屬同一條電力與傳輸敘事"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "指數創高", "color": "#5B8ED6", "zh": "羅素 2000 上週四收在 3,052.85 點的歷史新高，週五盤中一度到 3,068.42（+0.51%），今年累計漲幅約 23%，領先標普 500 約 9.1 個百分點。這是它 23 年來最好的一年。上週四的催化劑很明確：七月 PPI 月增持平、年增降到 4.7%，把九月升息機率打下來，而小型股是對利率最敏感的一段。要注意的是「領先 9 個百分點」這件事本身就是均值回歸的反向風險——差距越大，任何一次鷹派意外造成的回吐也會越劇烈。", "en": "The Russell 2000 closed at a record 3,052.85 last Thursday and traded as high as 3,068.42 on Friday, up 0.51%, taking its year-to-date gain to roughly 23% and its lead over the S&P 500 to about 9.1 percentage points. This is its best year in 23 years. Thursday's catalyst was clear: July PPI was flat month over month with the annual rate down to 4.7%, knocking back September hike odds, and small caps are the most rate-sensitive slice of the market. Worth noting is that the nine-point lead is itself the reverse risk — the wider the gap, the sharper the giveback on any hawkish surprise.", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，指數上週四收 3,052.85 創高，今年約 +23%"}, {"t": "VTWO", "n": "Vanguard 羅素 2000 ETF，費用率更低的同指數選擇，可對照追蹤誤差"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "估值折價", "color": "#5B8ED6", "zh": "即使漲了 23%，羅素 2000 的主要 ETF 相對大型股仍有約 34.5% 的本益比折價。這個數字要怎麼讀？折價本身不是買進理由——小型股長期折價是常態，因為獲利波動更大、破產率更高、流動性更差，市場本來就該給它折價。真正該問的是：34.5% 相對於它自己的歷史區間是偏高還是偏低？如果現在的折價仍在歷史平均之上，代表這波上漲還沒把估值優勢吃完；如果已經收斂到平均以下，那後面就只能靠獲利成長來推。", "en": "Even after a 23% run, the main Russell 2000 ETF still trades at roughly a 34.5% earnings-multiple discount to large caps. How should that be read? The discount alone is not a reason to buy — small caps trade at a structural discount because earnings are more volatile, bankruptcy rates are higher and liquidity is worse. The market is supposed to discount them. The real question is whether 34.5% is wide or narrow relative to its own history. If the discount is still above its long-run average, the valuation edge has not been consumed. If it has compressed below average, further gains must come from earnings growth alone.", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/", "stocks": [{"t": "IJR", "n": "標普小型 600 ETF，成分股要求獲利門檻，與羅素 2000 的品質差異明顯"}, {"t": "VIOO", "n": "Vanguard 標普小型 600 ETF，同樣採獲利篩選，適合對照折價的品質來源"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "品質警訊", "color": "#5B8ED6", "zh": "這波小型股上漲最需要看清楚的一件事：羅素 2000 裡沒有獲利的成分股，自 2025 年年中以來大漲 154%，而有獲利的成分股只漲 34%。四倍以上的差距，說明市場買的不是小型股的盈餘改善，而是它們身上「可能是下一波 AI 受惠者」的選擇權價值。這種結構在利率下行時很強，一旦升息預期回來就會反過來——沒有現金流的公司最先被清算。羅素 2000 大約四成的成分股本身就不賺錢，這是它與標普小型 600 的根本差異。", "en": "The single thing to see clearly in this small-cap rally: unprofitable Russell 2000 constituents have surged 154% since mid-2025, while profitable ones are up just 34%. A gap of more than four times says the market is not buying improving small-cap earnings — it is buying the option value of 'might be the next AI beneficiary.' That structure is powerful when rates are falling and reverses hard when hike expectations return, because companies without cash flow get liquidated first. Roughly 40% of Russell 2000 constituents are unprofitable to begin with, which is the fundamental difference between it and the S&P SmallCap 600.", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/", "stocks": [{"t": "IWO", "n": "羅素 2000 成長 ETF，未獲利與高本夢比成分集中於此，是 154% 漲幅的主要載體"}, {"t": "XBI", "n": "生技 ETF，典型的無獲利、純選擇權價值族群，可視為這個結構的極端樣本"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "利率槓桿", "color": "#5B8ED6", "zh": "為什麼小型股對聯準會的反應這麼激烈？答案在資產負債表的一個數字：羅素 2000 成分股的債務約有四成是浮動利率，而標普 500 不到一成。這代表利率每動一碼，小型股的利息支出立刻跟著動，大型股卻因為早年鎖定了長天期固定利率而幾乎沒感覺。所以借貸成本下滑對小型股不是「未來可能有幫助」，而是「這一季的利潤率立刻擴張」。反過來說，這也是升息時它們摔得最重的原因，這個槓桿是雙向的。", "en": "Why do small caps react so violently to the Fed? The answer sits in one balance-sheet number: roughly 40% of Russell 2000 constituent debt is floating rate, versus less than 10% for the S&P 500. Every quarter-point move in policy flows straight through to small-cap interest expense, while large caps, having locked in long-dated fixed rates years ago, barely notice. So falling borrowing costs are not a 'might help eventually' story for small caps — they expand margins in the current quarter. The same mechanism is why they fall hardest when rates rise. The leverage runs both ways.", "url": "https://intellectia.ai/blog/great-rotation-small-cap-stocks-2026", "stocks": [{"t": "SCHA", "n": "Schwab 美國小型股 ETF，成分覆蓋廣，適合觀察整體小型股的利率貝他"}, {"t": "KRE", "n": "區域銀行 ETF，既是小型股本身、又是小型股的放款方，利率敏感度雙重疊加"}]},
    {"id": "small_5", "channel": "小型股風雲", "tag": "池子與流動性", "color": "#5B8ED6", "zh": "小型股判讀最容易被忽略的一課是「池子不一樣」。羅素 2000 用市值排序取第 1001 到 3000 名，不看獲利；標普小型 600 有獲利門檻與流動性要求。同樣叫小型股，兩者的破產率、波動度、以及在空頭時的回撤深度都不一樣。再往下一層是流動性：小型股的買賣價差可能是大型股的十倍以上，資金一擁而上時漲勢會被放大，退潮時同樣會被放大。看到「小型股創高」這種標題時，先問是哪個池子。", "en": "The most overlooked lesson in reading small caps is that the pools are not the same. The Russell 2000 simply takes ranks 1,001 through 3,000 by market cap with no profitability screen. The S&P SmallCap 600 imposes both an earnings hurdle and liquidity requirements. Same label, but different bankruptcy rates, different volatility, and different drawdown depth in a bear market. One layer below sits liquidity: small-cap bid-ask spreads can be ten times wider than large caps, which amplifies rallies when money crowds in and amplifies declines when it leaves. When you see a 'small caps at record highs' headline, ask which pool first.", "url": "https://www.benzinga.com/etfs/specialty-etfs/26/08/61181756/quick-spark-russell-2000-hits-new-record-highs-beats-nasdaq-100-in-2026", "stocks": [{"t": "XSMO", "n": "小型股動能 ETF，用動能因子再篩一次，可對照純市值池與因子池的差異"}, {"t": "SLYV", "n": "標普小型 600 價值 ETF，獲利門檻加價值篩選，是光譜上最保守的小型股池"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "分拆新股", "color": "#C9A227", "zh": "ADI Global Distribution 是北美最大的低壓安防、影音與消防生命安全產品專業經銷商，8 月 4 日剛從 Resideo 分拆出來、在紐交所以 ADIG 掛牌，Resideo 股東每持有兩股換得一股。它為什麼被忽視：上市才兩週，沒有任何歷史股價、沒有機構持股基礎，而分拆股在頭幾個月通常會遭遇母公司股東的無差別拋售。正在改變的是能見度——Oppenheimer 已給出 Outperform 與 30 美元目標價，摩根大通給中立。基本面規模不小：2025 年營收 48 億美元、約 4,100 名員工、近 200 個據點。風險是它本質上是低毛利的經銷生意，且營建與安防需求跟著房市走，NAHB 建商信心正在低檔。這是研究線索，不是投資建議。", "en": "ADI Global Distribution is the largest North American specialty distributor of low-voltage security, audio-visual and fire and life-safety products. It was spun off from Resideo on August 4 and now trades on the NYSE as ADIG, with Resideo holders receiving one ADI share for every two they held. Why it is neglected: two weeks of listed life, no price history, no institutional ownership base, and spin-offs typically face indiscriminate selling from parent-company holders in the first months. What is changing is visibility — Oppenheimer has initiated at Outperform with a $30 target and JPMorgan at Neutral. The scale is real: $4.8 billion of 2025 revenue, roughly 4,100 employees and nearly 200 locations. The risk is that this is fundamentally a low-margin distribution business whose construction and security demand tracks housing, and NAHB builder sentiment is depressed. A research lead, not investment advice.", "url": "https://www.prnewswire.com/news-releases/resideo-technologies-completes-spin-off-of-adi-global-distribution-302841699.html", "status": "RADAR · 下一個驗證點 首份獨立季報（預計 2026/11）", "stocks": [{"t": "ADIG", "n": "8/4 自 Resideo 分拆掛牌，2025 年營收 48 億，Oppenheimer 目標價 30 美元"}, {"t": "REZI", "n": "母公司 Resideo，分拆後成為純建築科技公司並償還 9 億美元債務"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "折扣零售", "color": "#C9A227", "zh": "Grocery Outlet 做的是「機會型採購」的折扣雜貨——收購品牌商的過剩庫存再低價賣出，門市由獨立經營者管理。它被忽視的原因是連續幾季的同店銷售衰退讓市場放棄了這個故事，股價跌到 11 美元附近。正在改變的有兩件事：8 月 12 日的第二季財報，淨銷售 11.9 億美元（+1.1%）、調整後 EBITDA 約 6,570 萬、調整後每股盈餘 0.20 美元均優於自身指引，並上調全年展望，盤後跳漲 9.14%；同時內部人在過去六個月 27 筆交易中有 17 筆是買進，Erik Ragatz 買了 45 萬股（約 280 萬美元）、執行長 Jason Potter 買了 398,905 股（約 240 萬美元）。風險：同店銷售仍衰退 0.3%，且公司對外部借款的依賴度偏高，機構法人正在賣。這是研究線索，不是投資建議。", "en": "Grocery Outlet runs an opportunistic-buying discount grocery model — it acquires excess branded inventory and resells it cheap through independently operated stores. It is neglected because several quarters of negative comparable sales made the market give up on the story, pushing the stock toward $11. Two things are changing. The August 12 second-quarter print showed net sales of $1.19 billion (up 1.1%), adjusted EBITDA of about $65.7 million and adjusted EPS of $0.20, all ahead of the company's own guidance, with full-year guidance raised; shares jumped 9.14% after hours. Meanwhile insiders bought in 17 of 27 trades over six months, with Erik Ragatz taking 450,000 shares (about $2.8 million) and CEO Jason Potter 398,905 shares (about $2.4 million). Risks: comps still fell 0.3% and the company leans heavily on external borrowing, with institutions selling. A research lead, not investment advice.", "url": "https://www.investing.com/news/company-news/grocery-outlet-q2-2026-slides-show-early-turnaround-signs-raise-guidance-93CH-4856334", "status": "RADAR · 下一個驗證點 Q3 財報（約 2026/11），關鍵看同店銷售能否轉正", "stocks": [{"t": "GO", "n": "Q2 淨銷售 11.9 億優於指引、上調全年展望，執行長個人買進 398,905 股"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "國防彈藥", "color": "#C9A227", "zh": "National Presto 是市場上最奇怪的組合之一：一邊做壓力鍋與小家電，一邊透過子公司 AMTEC 與 Spectra Technologies 供應美軍 40 公釐彈藥系統與小直徑炸彈彈頭。這種「家電＋軍火」的結構讓它落在所有產業分類的縫隙裡，分析師覆蓋極少，是典型的雙重忽視。正在改變的是訂單：8 月 13 日公司公告兩筆合計 1.591 億美元的新業務——AMTEC 取得五年期陸軍 40 公釐系統合約第五年的選擇權，交付期落在 2028 年中到 2030 年初；Spectra 取得波音的小直徑炸彈彈頭分包，2027 年 9 月起交付。風險：這些是長交期訂單，短期營收貢獻有限，且家電部門仍受關稅與消費疲弱夾擊。這是研究線索，不是投資建議。", "en": "National Presto is one of the market's odder combinations: pressure cookers and small appliances on one side, and on the other, subsidiaries AMTEC and Spectra Technologies supplying the U.S. military with 40mm ammunition systems and Small Diameter Bomb warheads. That appliance-plus-ordnance structure leaves it in the cracks of every sector classification, with almost no analyst coverage — textbook double neglect. What is changing is the order book: on August 13 the company disclosed $159.1 million of new business, with AMTEC receiving year-five option awards under its five-year Army 40mm systems contract for delivery from mid-2028 into early 2030, and Spectra winning a Boeing subcontract for SDB warheads with deliveries starting September 2027. Risks: these are long-lead orders with limited near-term revenue, and the housewares segment is squeezed by tariffs and a soft consumer. A research lead, not investment advice.", "url": "https://www.sec.gov/Archives/edgar/data/0000080172/000143774926028014/npk20260814_8k.htm", "status": "RADAR · 下一個驗證點 Q3 財報（約 2026/11），看國防部門積壓訂單金額", "stocks": [{"t": "NPK", "n": "8/13 公告 1.591 億美元國防新訂單，含陸軍 40 公釐與波音小直徑炸彈彈頭"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "自由現金流", "color": "#C9A227", "zh": "Advantage Solutions 幫消費品牌做通路銷售代理與店內體驗行銷——賣場裡試吃、陳列、補貨那一整套。它被忽視的原因很直接：市值只剩約 3.91 億美元，是從 SPAC 上市後一路縮水的典型案例，加上高槓桿，多數機構直接排除在名單外。正在改變的是現金流結構：公司自由現金流殖利率高達 29%，管理層在 Canaccord 成長論壇上明確表示去槓桿主要靠自由現金流而非 EBITDA 成長，目標是每年降低 0.5 倍以上的槓桿倍數；董事 James Kilts 過去 12 個月淨買進約 52.6 萬美元，執行長 David Peacock 也在 5 月 20 日買進。風險：品牌服務部門受關稅、通膨與消費品公司縮減預算三重擠壓，29% 的自由現金流殖利率本身就是市場對倒閉風險的定價。這是研究線索，不是投資建議。", "en": "Advantage Solutions provides retail sales agency and in-store experiential marketing for consumer brands — the sampling, merchandising and restocking operation inside the store. It is neglected for a blunt reason: a market cap of roughly $391 million after a long post-SPAC shrinkage, plus high leverage, keeps it off most institutional lists. What is changing is the cash flow structure: free cash flow yield runs about 29%, and management said at the Canaccord growth conference that deleveraging will come primarily from free cash flow rather than EBITDA growth, targeting a reduction of 0.5 turns of leverage or more per year. Director James Kilts has net bought roughly $526,000 over 12 months and CEO David Peacock bought on May 20. Risks: the branded services segment is squeezed by tariffs, inflation and CPG budget cuts, and a 29% FCF yield is itself the market pricing in solvency risk. A research lead, not investment advice.", "url": "https://m.investing.com/news/transcripts/advantage-solutions-at-canaccord-growth-conference-cash-flow-focus-93CH-4855829?ampMode=1", "status": "RADAR · 下一個驗證點 Q3 財報（約 2026/11），看槓桿倍數是否照計畫下降", "stocks": [{"t": "ADV", "n": "市值約 3.91 億、自由現金流殖利率 29%，管理層目標年降槓桿 0.5 倍以上"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "分拆設備商", "color": "#C9A227", "zh": "Midera Food Processing 供應肉品、烘焙與零食生產商的食品加工設備與自動化方案，旗下超過 30 個品牌、全球裝機量逾 10 萬台、約 2,800 名員工，7 月 7 日從 Middleby 分拆後在那斯達克以 MFP 掛牌。被忽視的理由跟所有分拆股一樣：追蹤 Middleby 的分析師不見得會繼續追這家新公司，指數基金也在調整過程中被動賣出。基本面並不小：2025 年淨銷售 8.53 億美元、淨利 8,300 萬美元，並在分拆時簽下五年期 10 億美元的循環信用額度（7.5 億美元＋2.5 億多幣別）。風險：食品加工設備是資本支出型生意，客戶在食品業獲利承壓時最先砍設備預算，而信用額度本身也代表槓桿空間被打開。這是研究線索，不是投資建議。", "en": "Midera Food Processing supplies food processing equipment and automation to protein, bakery and snack producers, with more than 30 brands, an installed base above 100,000 units and roughly 2,800 employees. It was spun out of Middleby on July 7 and trades on Nasdaq as MFP. The neglect is the standard spin-off kind: analysts who covered Middleby will not necessarily follow the new entity, and index funds sell passively during the reshuffle. The fundamentals are not small — $853 million of 2025 net sales and $83 million of net earnings, plus a five-year, $1.0 billion revolving credit agreement at separation ($750 million dollar facility plus $250 million multi-currency). Risks: processing equipment is a capex business, and customers cut equipment budgets first when food industry margins compress; the credit facility also opens the door to leverage. A research lead, not investment advice.", "url": "https://investors.middleby.com/news-releases/news-release-details/middleby-completes-spin-midera-food-processing", "status": "RADAR · 下一個驗證點 首份完整獨立季報（預計 2026/11）", "stocks": [{"t": "MFP", "n": "7/7 自 Middleby 分拆掛牌，2025 年淨銷售 8.53 億、淨利 8,300 萬"}, {"t": "MIDD", "n": "母公司 Middleby，分拆後專注商用餐飲設備，可對照兩邊的估值重定價"}]},
    {"id": "radar_6", "channel": "忽視雷達", "tag": "國防資訊服務", "color": "#C9A227", "zh": "Castellum 是一家微型市值的國防與情報 IT 服務商，替美國政府提供網路安全、電子作戰與資料管理的技術服務。它被忽視到什麼程度？幾乎沒有主流券商覆蓋，成交量稀薄，是那種只在微型股社群裡被討論的名字。正在改變的是訂單能見度：積壓訂單達 2.717 億美元，資產負債表無負債、手上現金 1,686.5 萬美元，管理層預期 2026 年營收創新高；六月子公司 Specialty Systems 拿到 SAIC 的 GSA ASTRO 主約下一筆 400 萬美元的指定分包，內容是海軍航空資料管理與控制系統的現代化。風險：微型股流動性極差，且營收高度集中於美國政府預算，任何延續決議或預算凍結都會直接打到現金流。這是研究線索，不是投資建議。", "en": "Castellum is a micro-cap defense and intelligence IT services firm providing cybersecurity, electronic warfare and data management work to the U.S. government. How neglected is it? Essentially no mainstream broker coverage, thin volume — the kind of name discussed only in micro-cap circles. What is changing is order visibility: backlog stands at $271.7 million, the balance sheet carries no debt with $16.865 million of cash, and management expects record 2026 revenue. In June, subsidiary Specialty Systems received a $4 million directed subcontract under SAIC's GSA ASTRO prime contract to modernize a Navy Aircraft Data Management and Control System. Risks: micro-cap liquidity is very poor and revenue is concentrated in U.S. government budgets, so any continuing resolution or budget freeze hits cash flow directly. A research lead, not investment advice.", "url": "https://www.merlintrader.com/castellum-inc-stock-hub/", "status": "RADAR · 下一個驗證點 Q3 財報（約 2026/11），看積壓訂單轉為營收的速度", "stocks": [{"t": "CTM", "n": "積壓訂單 2.717 億、無負債且現金 1,686.5 萬，管理層預期 2026 營收創高"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "雙向訊號", "color": "#6DB56D", "zh": "MasterBrand 是北美最大的廚櫃製造商，最近的內部人紀錄剛好示範了「不要只看單邊」。子公司執行長 R. Banyard 在 6 月 1 日以每股 8.33 至 8.49 美元、加權均價 8.43 美元買進 6 萬股，交易後持股達 183 萬股；董事 David Petratis 也有買進。但 8 月 11 日，執行副總 Kurt Wanninger 以均價 9.22 美元賣出 5 萬股、金額 46.1 萬美元。同一家公司，兩個月內買在 8.43、賣在 9.22。判讀提醒：買進通常訊號較強（因為理由只有一個），賣出的理由則可能是稅務、分散或行權，但當賣出發生在買進的獲利價位上，就值得追問後續幾個月是否有更多賣單。", "en": "MasterBrand, North America's largest cabinet maker, has an insider record that neatly demonstrates why you should never read one side only. Subsidiary CEO R. Banyard bought 60,000 shares on June 1 at $8.33 to $8.49, a volume-weighted average of $8.43, taking his holding to 1.83 million shares; director David Petratis also bought. Then on August 11, EVP Kurt Wanninger sold 50,000 shares at an average of $9.22 for $461,000. Same company, bought at $8.43 and sold at $9.22 within two months. The reading rule: buys carry a stronger signal because there is only one reason to buy, while sales can reflect taxes, diversification or option exercise — but when a sale lands right on the buyers' profit, it is worth watching whether more sales follow in coming months.", "url": "https://www.marketbeat.com/instant-alerts/insider-selling-masterbrand-nysembc-evp-sells-46100000-in-stock-2026-08-13/", "stocks": [{"t": "MBC", "n": "子公司執行長 6 月買 6 萬股均價 8.43，執行副總 8/11 賣 5 萬股均價 9.22"}, {"t": "FBIN", "n": "Fortune Brands，MasterBrand 分拆前的母公司、同屬住宅建材，可對照週期位置"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "庫藏股", "color": "#6DB56D", "zh": "Commercial Metals 的董事會通過將庫藏股額度再增加 6 億美元，加計原有未執行部分後，目前總回購能量約 7.17 億美元。庫藏股加碼的判讀有兩層：正面是管理層認為股價低於內在價值、且現金流足以支應；負面是在鋼鐵這種強週期產業，庫藏股常出現在獲利週期高點——公司現金最多的時候，往往也是股價最貴的時候。要驗證是哪一種，看的不是宣布金額，而是接下來兩季實際執行的股數與均價，以及同期資本支出有沒有被排擠。", "en": "Commercial Metals' board approved a $600 million increase to its share repurchase authorization, bringing total current buyback capacity to roughly $717 million including the unused prior amount. Reading a buyback increase has two layers. The positive read is that management believes the stock trades below intrinsic value and that cash flow can fund it. The negative read is that in a deeply cyclical industry like steel, buybacks tend to cluster at the peak of the earnings cycle — the moment a company has the most cash is often the moment its stock is most expensive. To tell which, watch not the announced figure but the shares actually repurchased and the average price over the next two quarters, and whether capital expenditure gets crowded out.", "url": "https://www.stocktitan.net/news/CMC/cmc-announces-600-million-increase-in-share-repurchase-program-9dtko7an0ptr.html", "stocks": [{"t": "CMC", "n": "董事會加碼 6 億美元庫藏股，總回購能量約 7.17 億美元"}, {"t": "NUE", "n": "紐柯鋼鐵，規模更大的同業，可對照鋼鐵業當前的現金運用優先順序"}]},
    {"id": "insider_3", "channel": "內部人動向", "tag": "回購潮", "color": "#6DB56D", "zh": "八月是一波庫藏股加碼潮。Accenture 把 2026 會計年度的回購計畫再擴大 20 億美元至 75 億美元，理由是對其 AI 定位的信心；BlackLine 7 月 31 日董事會加碼 1 億美元、總授權來到 6 億美元；FIGS 8 月 6 日加碼 1 億美元、總授權來到 2 億美元。這三家的共同點是市值差距極大但邏輯一致：在估值被壓抑、而自身現金流仍穩定的時候，用回購取代併購。對投資人的判讀提醒是——回購授權不等於回購執行，授權額度只是上限，實際買了多少要看季報的股數變化。", "en": "August has brought a wave of buyback increases. Accenture expanded its fiscal 2026 repurchase program by $2 billion to $7.5 billion, citing confidence in its AI positioning. BlackLine's board added $100 million on July 31, taking total authorization to $600 million. FIGS added $100 million on August 6, bringing its total to $200 million. What these three share, despite wildly different market caps, is the same logic: with valuations suppressed and cash flow steady, choose repurchases over acquisitions. The reading rule for investors — an authorization is not an execution. The authorized amount is only a ceiling; what was actually bought shows up in the quarterly share count.", "url": "https://newsroom.accenture.com/news/2026/accenture-significantly-increases-fiscal-year-2026-share-repurchase-program-by-2-billion", "stocks": [{"t": "ACN", "n": "2026 會計年度回購計畫加碼 20 億至 75 億美元，理由是 AI 定位信心"}, {"t": "BL", "n": "BlackLine，7/31 加碼 1 億美元，總授權 6 億，中型 SaaS 的資本配置轉向"}, {"t": "FIGS", "n": "8/6 加碼 1 億美元至 2 億總授權，小型消費品牌用回購支撐每股數字"}]},
    {"id": "week_1", "channel": "本週事件", "tag": "總經數據", "color": "#C97DD4", "zh": "這週的總經行事曆前輕後重。今天（週一）8:30 帝國州製造業指數、10:00 NAHB 建商信心；週三（8/19）是本週最重要的一件事——七月 28 至 29 日 FOMC 會議紀要，市場要從裡面判斷那三張升息異議票背後有多少支持；週四則有費城聯儲製造業與每週初領失業金人數，在七月非農大幅減少之後，初領數據的權重比平常高很多。整週沒有 CPI 或 PCE，所以定價的主導權會落在會議紀要的措辭上。", "en": "This week's macro calendar is back-loaded. Today (Monday) brings the Empire State manufacturing index at 8:30 a.m. and NAHB builder sentiment at 10:00 a.m. Wednesday (8/19) carries the week's single most important item — the minutes of the July 28-29 FOMC meeting, from which markets will try to gauge how much support sat behind those three hawkish dissents. Thursday brings the Philadelphia Fed manufacturing survey and weekly initial jobless claims, and after July's sharp payroll drop, the claims number carries far more weight than usual. There is no CPI or PCE this week, so pricing power rests on the wording of the minutes.", "url": "https://blog.kraken.com/economic-brief/august-12-2026", "stocks": [{"t": "DIA", "n": "道瓊 ETF，權值偏工業與金融，對本週製造業與 Fed 措辭最敏感"}, {"t": "IEF", "n": "7-10 年期公債 ETF，週三會議紀要是本週殖利率的主要驅動事件"}]},
    {"id": "week_2", "channel": "本週事件", "tag": "零售財報週", "color": "#C97DD4", "zh": "本週是零售財報週，而且時間點極為敏感——這些公司報的是截至 7 月 31 日的那一季，正好對上七月零售銷售月減 0.6%、九個月來首次下滑的那個月。Home Depot 週二（8/18）盤前，市場預估每股盈餘 4.73 美元（去年同期 4.68）；Target 週三（8/19）盤前，預估每股 2.25 美元、年增 9.8%，營收 261 億美元、年增 3.4%；Walmart 週四公布，預估每股 0.74 美元、營收 1,867 億美元。Lowe's 與 TJX 同週跟進。消費耐久財是今年 11 個 S&P 類股中僅有的兩個下跌類股之一，這幾份財報會決定它是繼續被殺還是築底。", "en": "This is retail earnings week, and the timing could hardly be more sensitive — these companies report the quarter ended July 31, precisely the month in which retail sales fell 0.6%, the first decline in nine months. Home Depot reports Tuesday (8/18) before the open, with consensus EPS of $4.73 against $4.68 a year ago. Target follows Wednesday (8/19) pre-market, with EPS expected around $2.25, up 9.8%, on revenue of $26.1 billion, up 3.4%. Walmart reports Thursday, with expectations of $0.74 EPS on $186.7 billion of revenue. Lowe's and TJX follow in the same week. Consumer discretionary is one of only two S&P sectors down this year, and these prints will decide whether it keeps falling or forms a base.", "url": "https://www.cnbc.com/2026/08/14/stock-market-next-week-outlook-for-aug-17-21-2026.html", "stocks": [{"t": "HD", "n": "週二 8/18 盤前，市場預估每股 4.73 美元，直接對照 NAHB 的房市疲弱"}, {"t": "TGT", "n": "週三 8/19 盤前，預估每股 2.25 美元（+9.8%）、營收 261 億（+3.4%）"}, {"t": "WMT", "n": "週四公布，預估每股 0.74 美元、營收 1,867 億，消費者健康度的最大樣本"}, {"t": "LOW", "n": "與 Home Depot 同週報，兩者的差異可分辨是行業問題還是公司問題"}, {"t": "TJX", "n": "折扣零售同週報，若消費降級成立，它的同店銷售應該優於百貨型零售"}]},

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>

    </div>
  );
}

          <input type="password" className="az-input" value={key} onChange={e=>setKey(e.target.value)} placeholder="貼上 Azure Key…" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>Region</div>
          <input className="az-input" value={region} onChange={e=>setRegion(e.target.value)} placeholder="eastus" />
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>中文嗓音（主畫面 / 連續播放）</div>
          <select className="az-input" value={voiceZh} onChange={e=>setVoiceZh(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="zh-TW-HsiaoChenNeural">曉臻（女）台灣腔・自然</option>
            <option value="zh-TW-HsiaoYuNeural">曉雨（女）台灣腔・清亮</option>
            <option value="zh-TW-YunJheNeural">雲哲（男）台灣腔・沉穩</option>
            <option value="zh-CN-XiaoxiaoNeural">曉曉（女）大陸腔・可調語氣</option>
            <option value="zh-CN-YunyangNeural">雲揚（男）大陸腔・專業播報</option>
            <option value="zh-CN-YunxiNeural">雲希（男）大陸腔・可調語氣</option>
          </select>
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>中文語氣</div>
          <select className="az-input" value={styleZh} onChange={e=>setStyleZh(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="">一般</option>
            <option value="newscast">新聞播報</option>
            <option value="chat">聊天（放鬆）</option>
            <option value="gentle">溫柔</option>
            <option value="serious">嚴肅</option>
          </select>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.6,marginTop:'4px' }}>只有大陸腔嗓音支援語氣；<br/>台灣腔會忽略這一項</div>
        </div>
        <div>
          <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--text-tertiary)',marginBottom:'5px' }}>English Voice</div>
          <select className="az-input" value={voice} onChange={e=>setVoice(e.target.value)} style={{ cursor:'pointer' }}>
            <option value="en-US-AriaNeural">Aria（女）自然流暢</option>
            <option value="en-US-JennyNeural">Jenny（女）清晰</option>
            <option value="en-US-GuyNeural">Guy（男）沉穩</option>
            <option value="en-US-DavisNeural">Davis（男）個性</option>
            <option value="en-US-TonyNeural">Tony（男）自信</option>
          </select>
        </div>
        <div style={{ display:'flex',gap:'8px' }}>
          <button onClick={handleSave} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--divider)',color:'var(--text-tertiary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>儲存</button>
          <button onClick={handleTest} style={{ flex:1,padding:'8px 0',background:'none',border:'1px solid var(--text-secondary)',color:'var(--text-secondary)',fontFamily:"'Courier New',monospace",fontSize:'9px',letterSpacing:'0.12em',textTransform:'uppercase',cursor:'pointer' }}>測試</button>
        </div>
        {status && <div style={{ fontFamily:"'Courier New',monospace",fontSize:'9px',color:'var(--text-tertiary)',letterSpacing:'0.1em' }}>{status}</div>}
        <div style={{ marginTop:'auto',fontFamily:"'Courier New',monospace",fontSize:'8px',color:'var(--text-tertiary)',lineHeight:1.7,paddingTop:'8px',borderTop:'1px solid var(--divider)' }}>Key 存於 localStorage<br/><b>沒填 Key 會退回瀏覽器內建語音，<br/>那個聽起來就是很機械。</b><br/>要好聽請填 Azure Key。<br/><br/>朗讀語系跟著畫面走：<br/>主文中文→中文嗓音<br/>展開 English→英文嗓音</div>
      </div>
    </>,
    document.body
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

// ===== 資金流向(TradingView 官方嵌入元件,即時資料,每日排程不需更新) =====
function HeatmapView() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const container = ref.current;
    if (!container) return;
    const build = () => {
      const dark = document.body.getAttribute("data-theme") === "dark";
      container.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "tradingview-widget-container__widget";
      inner.style.height = "100%";
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js";
      script.async = true;
      script.innerHTML = JSON.stringify({
        dataSource: "SPX500", grouping: "sector",
        blockSize: "market_cap_basic", blockColor: "change",
        locale: "zh_TW", colorTheme: dark ? "dark" : "light",
        hasTopBar: false, isDataSetEnabled: false, isZoomEnabled: true,
        hasSymbolTooltip: true, isMonoSize: false,
        width: "100%", height: "100%"
      });
      container.appendChild(inner);
      container.appendChild(script);
    };
    build();
    const obs = new MutationObserver(build);
    obs.observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { obs.disconnect(); container.innerHTML = ""; };
  }, []);
  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column", padding:"12px 16px 16px" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 16px 10px" }}>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>S&P 500 · 即時資金流向</span>
        <a href="https://finviz.com/map?t=sec&st=d1" target="_blank" rel="noopener noreferrer" className="source-link">Finviz 完整版 ↗</a>
      </div>
      <div className="tradingview-widget-container" ref={ref} style={{ flex:1, minHeight:0 }} />
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/17/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v7.8</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
