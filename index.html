<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "指數收盤", "color": "#E05C5C", "stocks": [{"t": "SPY", "n": "標普 500 追蹤 ETF，週五跌 0.25%"}, {"t": "QQQ", "n": "那斯達克 100，科技權重高、單日跌幅最重"}, {"t": "DIA", "n": "道瓊 ETF，幾乎持平相對抗跌"}], "en": "Wall Street closed lower Friday under the shadow of Warsh's hawkish Jackson Hole debut. The S&P 500 fell 19.23 points to 7,711.76, the Nasdaq lost 138.93 points to 26,402.42, and the Dow was essentially flat, down 9.45 points to 53,559.99. All three still finished the week higher, with the Dow logging its first weekly win in three. The real change was not in the point count but in how the market repriced September rates overnight.", "zh": "週五華爾街三大指數同步收黑，籠罩在 Warsh 鷹派首秀的陰影下。標普 500 跌 19.23 點收 7,711.76，那斯達克跌 138.93 點收 26,402.42，道瓊幾乎持平、小跌 9.45 點收 53,559.99。單日雖然是黑的，整週三大指數仍收紅，道瓊更是三週來首度收紅。真正的變化不在點數，而在市場對九月利率的定價一夜之間翻了面。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-friday-august-28-dow-sp-500-nasdaq-dip-fed-warsh-jackson-hole-speech-081514091.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "個股異動", "color": "#E05C5C", "stocks": [{"t": "PYPL", "n": "併購破局，單日重挫 12.6% 收 53.75 美元"}, {"t": "MRVL", "n": "財報全面超標卻仍跌約 6%"}, {"t": "WDAY", "n": "逆勢上漲約 6.7%，領漲標普成分股"}], "en": "Friday's single-stock action was violently split. PayPal crashed 12.6% to $53.75 after Bloomberg reported a Stripe- and Advent-led consortium walked away from a $53 billion takeover. Marvell beat on every line yet fell about 6%. Workday, by contrast, rallied roughly 6.7% to lead S&P gainers. On the same day, a stock lifted by deal speculation fell back to earth while a software name that delivered on fundamentals drew the money.", "zh": "週五的個股表現極度分歧。PayPal 重挫 12.6% 收 53.75 美元，因彭博報導 Stripe 與 Advent 領軍的財團放棄 530 億美元的收購案；Marvell 財報全面超標卻仍下跌約 6%；Workday 則逆勢大漲約 6.7%，領漲標普成分股。同一天裡，被併購題材推上去的股票摔回原地，而靠基本面交出成績的軟體股拿到資金。這種分歧比指數的小跌更能說明當下的資金偏好。", "url": "https://www.fool.com/coverage/stock-market-today/2026/08/28/stock-market-today-aug-28-paypal-falls-13-after-stripe-and-advent-abandon-usd50b-takeover/"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "商品匯率", "color": "#E05C5C", "stocks": [{"t": "GLD", "n": "黃金 ETF，現貨報 4,631.5 美元"}, {"t": "USO", "n": "原油 ETF，布蘭特回落 2.5% 至 92.06 美元"}, {"t": "UUP", "n": "美元指數 ETF，美元升 0.56% 至 99.65"}], "en": "Commodities and currencies echoed the rate repricing. Spot gold printed $4,631.5, the dollar index rose 0.56% to 99.65, and Brent crude slipped 2.5% to $92.06 a barrel. A stronger dollar usually caps dollar-priced commodities, but oil has a second driver: Persian Gulf exports have recovered to roughly 15-16 million barrels per day from the March low of 5-6 million, still far below the 22-24 million seen before the conflict.", "zh": "商品與匯市同步反映升息預期。黃金現貨報 4,631.5 美元，美元指數升 0.56% 至 99.65，布蘭特原油則回落 2.5% 至每桶 92.06 美元。美元走強通常會壓抑以美元計價的商品，但油價這次的變數不只利率：波斯灣出口量已從三月低點的每日約 5 至 6 百萬桶回升到 15 至 16 百萬桶，卻仍遠低於衝突前的 22 至 24 百萬桶。供給缺口沒補回來，這是油價下不去的底。", "url": "https://tradingeconomics.com/commodity/brent-crude-oil"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "盤勢結構", "color": "#E05C5C", "stocks": [{"t": "SOXX", "n": "半導體 ETF，週五最大拖累"}, {"t": "XLP", "n": "必需消費 ETF，防禦族群相對有撐"}, {"t": "XLE", "n": "能源 ETF，利率轉鷹時仍有買盤"}], "en": "Break the tape apart and Friday's damage was concentrated where rates bite hardest. Semiconductors were the biggest drag, which is why the Nasdaq took the steepest index loss. Consumer staples and energy held up better as money leaned toward steady cash flow. Days like this - small index decline, large internal rotation - are worth logging, because they usually mark the start of a new leadership cycle rather than the end of one.", "zh": "把盤面拆開看，週五的下跌集中在對利率最敏感的地方。半導體是最大拖累，那斯達克因此成為單日跌幅最重的指數；相對地，必需消費與能源類股相對有撐，資金明顯往現金流穩定的地方靠。這種「指數小跌、內部結構大搬風」的日子，比單純的重挫更值得記錄，因為它通常是新一輪輪動的起點，而不是一段行情的結尾。", "url": "https://www.cnbc.com/2026/08/27/stock-market-today-live-updates.html"},
    {"id": "earn_0", "channel": "財報速報", "tag": "超標卻下跌", "color": "#E8786A", "stocks": [{"t": "MRVL", "n": "第二季營收 27.3 億美元創高，股價仍跌約 6%"}, {"t": "MU", "n": "記憶體同業，AI 資料中心需求的另一個溫度計"}, {"t": "NVDA", "n": "AI 半導體預期的定錨者，市場拿它衡量所有同業"}], "en": "Marvell posted a record quarter and got a 6% selloff for it. Q2 revenue was $2.73 billion versus $2.71 billion expected, and adjusted EPS of $0.94 beat the $0.93 consensus. Q3 guidance points to roughly $3.15 billion in revenue and $1.05-$1.15 in EPS, implying about 50% growth. The problem was not the scorecard. The stock had already run 184% year to date, so expectations were set too high for a beat to matter.", "zh": "Marvell 交出創新高的季度成績，換來的卻是股價下跌約 6%。第二季營收 27.3 億美元、優於預期的 27.1 億，調整後每股盈餘 0.94 美元也高於 0.93 美元的預估；第三季指引更給到營收約 31.5 億、每股盈餘 1.05 至 1.15 美元，等於指向約五成的年成長。問題不在成績單，而在它今年以來已經上漲 184%——預期被墊得太高，超標也不夠用。這是目前 AI 供應鏈個股共同的處境。", "url": "https://siliconangle.com/2026/08/27/marvells-stock-sinks-despite-earnings-beat-and-strong-guidance/"},
    {"id": "earn_1", "channel": "財報速報", "tag": "軟體交卷", "color": "#E8786A", "stocks": [{"t": "WDAY", "n": "第二季訂閱營收年增 13.9%，AI 代理年化收入近 5 億美元"}, {"t": "NOW", "n": "企業流程軟體同業，同樣主打 AI 代理"}, {"t": "CRM", "n": "企業軟體同業，市場拿它比較 AI 變現速度"}], "en": "Workday posted total revenue of $2.649 billion, up 12.8% year over year, with subscription revenue of $2.471 billion, up 13.9%. Operating income reached $313 million, lifting margin from 10.6% to 11.8%. More important is visibility: 12-month subscription backlog stood at $9.034 billion, up 14.2%. The company said agentic AI products are approaching $500 million in annual recurring revenue, with new bookings from them up more than 200% year over year.", "zh": "Workday 第二季總營收 26.49 億美元、年增 12.8%，其中訂閱營收 24.71 億、年增 13.9%；營業利益 3.13 億美元，利潤率從 10.6% 提升到 11.8%。更關鍵的是能見度：未來 12 個月的訂閱積壓訂單達 90.34 億美元、年增 14.2%，代表成長還有續航力。公司並表示 AI 代理產品的年化經常性收入已接近 5 億美元、新增合約年增超過兩倍——這是少數把 AI 講成具體數字而非願景的企業軟體公司。", "url": "https://investor.workday.com/news-and-events/press-releases/news-details/2026/Workday-Announces-Fiscal-2027-Second-Quarter-Financial-Results/default.aspx"},
    {"id": "earn_2", "channel": "財報速報", "tag": "今晨盤前", "color": "#E8786A", "stocks": [{"t": "SAIC", "n": "今晨盤前公布財報的政府 IT 服務商"}, {"t": "LDOS", "n": "同業，聯邦資訊服務規模更大"}, {"t": "BAH", "n": "同業，顧問與情報服務為主"}, {"t": "CACI", "n": "同業，國防資訊系統整合"}], "en": "Today's pre-market slot belongs to Science Applications International, a government IT services contractor. These companies read differently from ordinary tech names: revenue comes from federal contracts, so near-term consumer demand barely matters, while budget cycles and recompete timing matter a great deal. The numbers to watch are backlog and book-to-bill, not the headline quarterly EPS.", "zh": "今晨盤前由政府 IT 服務商 Science Applications（SAIC）打頭陣。這一類公司的看點跟一般科技股完全不同：營收來自聯邦合約，短期不受消費景氣影響，卻受預算流程與續約節奏牽制。所以讀這種財報時，重點應該放在在手訂單與接單出貨比，而不是單季每股盈餘的標題數字。標題數字漂亮但訂單縮水，往往才是真正的警訊。", "url": "https://www.cnbc.com/2026/08/30/here-are-the-3-big-things-were-watching-in-the-stock-market-in-the-week-ahead.html"},
    {"id": "macro_0", "channel": "總經政策", "tag": "升息定價", "color": "#7C6AF7", "stocks": [{"t": "KRE", "n": "區域銀行 ETF，對利率路徑最敏感"}, {"t": "XLF", "n": "金融類股 ETF，升息對淨息差是雙面刃"}, {"t": "IEF", "n": "中天期公債 ETF，直接反映利率預期"}], "en": "Warsh delivered his first Jackson Hole keynote as Fed chair and pushed the odds of a September quarter-point hike from 35% the day before to nearly 60%. CME's FedWatch showed about 56%, while prediction market Kalshi had it at 48%. In other words, the September meeting is now a coin flip. His line was direct: the Fed must be confident underlying inflation is moving to target, and otherwise, it has work to do.", "zh": "Warsh 以 Fed 主席身分首度在 Jackson Hole 發表主題演說，一口氣把九月升息一碼的機率從前一天的 35% 推到接近 60%。CME 的 FedWatch 顯示約 56%，預測市場 Kalshi 則是 48%——換句話說，九月會議現在是丟銅板。他的原話很直接：必須確信底層通膨正朝著目標移動，否則「我們還有工作要做」。他也說夏季的通膨數據雖然比預期好，但沒有讓他看到趨勢的實質改善。", "url": "https://www.cnbc.com/2026/08/28/-september-fed-decision-now-a-coin-flip-as-rate-hike-odds-increase.html"},
    {"id": "macro_1", "channel": "總經政策", "tag": "就業數據", "color": "#7C6AF7", "stocks": [{"t": "RHI", "n": "人力資源服務商，就業市場的第一線指標"}, {"t": "MAN", "n": "全球人力派遣商，景氣轉折時最先反映"}, {"t": "ADP", "n": "薪資處理商，同時是每月民間就業數據的發布者"}], "en": "The August payrolls report due Friday, September 4, carries unusual weight. Consensus looks for 45,000 new jobs after July unexpectedly shed 23,000. Unemployment is seen ticking up to 4.2% from 4.1%, while average hourly earnings growth is expected to accelerate to 0.2% month over month from 0.1%. With the Fed having put price stability back at the top of its list, a print showing a labor market that is not weak but with accelerating wages actually lowers the bar for a hike.", "zh": "九月四日的八月非農就業報告，這次的分量比平常重得多。市場預估新增 4.5 萬人，而七月是意外的減少 2.3 萬人；失業率預估從 4.1% 微升到 4.2%，平均時薪月增則從 0.1% 加快到 0.2%。在 Fed 已經把物價穩定擺回第一順位的情況下，就業數據若同時顯示「不弱、但薪資在加速」，升息的門檻反而更低。這份報告的解讀邏輯跟過去兩年剛好相反。", "url": "https://www.schaeffersresearch.com/content/news/2026/08/27/the-week-ahead-august-jobs-report-takes-center-stage"},
    {"id": "macro_2", "channel": "總經政策", "tag": "財政與地緣", "color": "#7C6AF7", "stocks": [{"t": "CAT", "n": "全球工程機械龍頭，關稅與海外需求的直接曝險"}, {"t": "DE", "n": "農機大廠，海外營收占比高"}, {"t": "DOV", "n": "多角化工業集團，供應鏈成本敏感"}], "en": "August 31 to September 1 brings the G20 finance ministers and central bank governors meeting, at the same time the Trump administration has rolled out a global sanctions plan aimed at Iran. The two tie policy and energy costs together: if sanctions choke Gulf exports again, oil will push the last mile of inflation back up, which is precisely where the Fed's attention now sits. For globally exposed industrials, tariffs and sanctions are harder to hedge than interest rates.", "zh": "八月三十一日到九月一日是 G20 財長與央行總裁會議，同一時間川普政府在八月底推出針對伊朗的全球制裁方案。這兩件事把「政策」跟「能源成本」綁在一起：制裁若讓波斯灣出口再度受阻，油價就會回頭墊高通膨的最後一哩，而那正是 Fed 現在最在意的地方。對營收分布全球的工業股來說，關稅與制裁是比利率更難對沖的變數，因為它無法用金融工具轉嫁。", "url": "https://www.newsquawk.com/headlines/newsquawk-weekly-economic-calendar---31st-august---4th-september-2026"},
    {"id": "sector_0", "channel": "產業風向", "tag": "支付與金融科技", "color": "#4EABA4", "stocks": [{"t": "PYPL", "n": "收購破局，單日跌 12.6%、量能爆出均量的兩倍以上"}, {"t": "FIS", "n": "支付基建同業，同樣長期受整併題材影響"}, {"t": "GPN", "n": "商戶收單同業，估值同受併購預期牽動"}], "en": "The payments sector's biggest deal story has collapsed. A consortium led by Stripe and private equity firm Advent walked away from PayPal after previously offering $60.50 per share, roughly $53 billion. PayPal fell 12.6% to $53.75 on 35.9 million shares, about 124% above its three-month average volume. The significance goes beyond one company: it removes the valuation floor from the idea that large fintech platforms eventually get bought, leaving them to execute turnarounds on their own.", "zh": "支付產業最大的併購題材宣告破局。Stripe 與私募基金 Advent 領軍的財團放棄收購 PayPal，先前開價每股 60.50 美元、總額約 530 億美元；消息傳出後 PayPal 單日下跌 12.6% 收 53.75 美元，成交量 3,590 萬股、比三個月均量高出 124%。這件事的意義超過一家公司：它把「大型金融科技終究會被買走」這個估值支撐抽掉了，剩下的只能靠自己把轉型做出來。同族群的估值假設都要跟著重算。", "url": "https://finance.yahoo.com/markets/stocks/articles/paypal-shares-fall-reported-acquisition-100923514.html"},
    {"id": "sector_1", "channel": "產業風向", "tag": "能源供給", "color": "#4EABA4", "stocks": [{"t": "XOM", "n": "整合型能源龍頭，油價走強的主要受惠者"}, {"t": "CVX", "n": "整合型同業，上游曝險比重高"}, {"t": "OXY", "n": "美國頁岩生產商，對油價彈性更大"}], "en": "Energy is up more than 22% this year, one of the few winners that owes nothing to the AI narrative. What supports it is physical tightness. Gulf exports have recovered from the March low of 5-6 million barrels per day to 15-16 million, but that is still well short of the 22-24 million seen before the conflict. Brent sits near $92, and institutional forecasts for the second half cluster in a wide $70-$100 band - a spread that itself says the geopolitical risk is not fully priced.", "zh": "能源類股今年以來上漲超過 22%，是少數不靠 AI 敘事的贏家。支撐它的是實體面的緊：波斯灣出口雖從三月的每日 5 至 6 百萬桶低點回到 15 至 16 百萬桶，但距離衝突前的 22 至 24 百萬桶還有一大段。布蘭特原油在每桶 92 美元附近，法人對下半年的區間看法多落在 70 到 100 美元——這個寬度本身就說明地緣風險還沒有定價完。區間越寬，代表市場對供給的把握越低。", "url": "https://www.iea.org/reports/oil-market-report-august-2026"},
    {"id": "sector_2", "channel": "產業風向", "tag": "輪動結構", "color": "#4EABA4", "stocks": [{"t": "GE", "n": "航太引擎與售後零組件，工業族群的領漲者"}, {"t": "ETN", "n": "電力管理設備商，基礎建設支出的直接受惠者"}, {"t": "COST", "n": "量販通路，必需消費族群的領頭羊"}], "en": "This year's market leadership belongs to industrials, consumer staples and energy, not technology. The industrial sector ETF is up about 11% year to date as infrastructure spending ramps and supply chains normalize, benefiting machinery and aerospace aftermarket names. Consumer defensives are up 13.3%, led by large-format retailers. Worth noting: defensives and cyclicals are strengthening at the same time, a combination that typically shows up late in the cycle and signals money spreading out rather than chasing one theme.", "zh": "今年帶動大盤的不是科技，而是工業、必需消費與能源。工業類股 ETF 年初至今上漲約 11%，基礎建設支出與供應鏈正常化讓機械與航太售後市場受惠；必需消費上漲 13.3%，由大型量販通路領軍。值得注意的是防禦股與景氣循環股同時走強——這種組合通常出現在景氣循環的晚段，代表資金在分散、而不是在追一個主題。看輪動比看指數更能理解現在的位置。", "url": "https://www.morningstar.com/stocks/6-stocks-driving-2026-stock-market-rotation"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "指數重挫", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，週五跌 1.39% 收 2,972"}, {"t": "IJR", "n": "標普小型股 ETF，同族群走勢"}], "en": "Friday's real casualty was small caps. The Russell 2000 fell 41.97 points, or 1.39%, to close at 2,972 - a decline many times steeper than the Dow's. The reason is simple: when the odds of a rate hike rise, expected borrowing costs rise with them, and small caps are far more sensitive to that than large caps. The S&P 500 fell only 0.25% the same day, and that gap is the clearest risk signal on the tape.", "zh": "週五真正被打的是小型股。羅素 2000 下跌 41.97 點、跌幅 1.39%，收在 2,972 點，跌幅是道瓊的數十倍。原因很單純：升息機率一上升，借款成本的預期就跟著上升，而小型股對這件事的敏感度遠高於大型股。同一天標普 500 只跌 0.25%，這個落差本身就是最好的風險提示——它告訴你市場認為誰的資產負債表禁不起升息。", "url": "https://www.benzinga.com/etfs/specialty-etfs/26/08/61181756/quick-spark-russell-2000-hits-new-record-highs-beats-nasdaq-100-in-2026"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "判讀知識", "color": "#5B8ED6", "stocks": [{"t": "VTWO", "n": "羅素 2000 ETF，另一檔追蹤同指數的工具"}, {"t": "IWN", "n": "羅素 2000 價值型 ETF，負債結構影響更明顯"}], "en": "Why do small caps drop first when rates move? It comes down to debt structure. Smaller companies borrow more often at floating rates or short maturities and need to refinance frequently, so a rate move shows up in interest expense almost immediately. Large companies mostly locked in long-dated fixed-rate debt during the cheap-money years and feel nothing in the short run. So for small caps, the probability of a hike is not sentiment - it is cash-flow arithmetic.", "zh": "為什麼利率一動、小型股先跌？關鍵在負債結構。小型公司的借款更常是浮動利率或短年期，需要頻繁再融資，利率往上，利息費用幾乎立刻反映在損益表上；大型公司則多半在低利時期鎖了長天期的固定利率，短期完全不痛。所以「升息機率」對小型股來說不是情緒，是現金流的算術。看小型股時，負債的到期結構比本益比更值得先看一眼。", "url": "https://bingx.com/en/learn/article/russell-2000-rty-outlook-and-price-prediction-is-russell-2000-a-good-investment"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "覆蓋斷層", "color": "#5B8ED6", "stocks": [{"t": "CTM", "n": "微型國防資訊服務商，營收 5,290 萬美元卻無第二位分析師"}], "en": "There are two kinds of cheap in small caps, and they need to be told apart. One is index-level: the Russell 2000 trades at roughly a 30% valuation discount to large caps while still up 23% year to date, ahead of the S&P 500 by about 9 percentage points. The other is stock-level coverage failure. Castellum, a micro-cap defense IT contractor, has $52.9 million of revenue, three prime federal contracts and a clean balance sheet, yet no second analyst and no reporting institutional holder. The first is a price problem; the second means there is no natural buyer to reprice the stock even if results improve.", "zh": "小型股的「便宜」有兩種，一定要分清楚。一種是指數層次的折價：羅素 2000 目前相對大型股有約三成的估值折價，年初至今仍上漲 23%、領先標普約 9 個百分點。另一種是個股層次的覆蓋斷層——以微型國防資訊服務商 Castellum 為例，5,290 萬美元營收、三張聯邦主約、資產負債表乾淨，卻連第二位分析師與第一位申報機構股東都沒有。前者是價格問題，後者是「就算變好也沒有自然買盤來重新定價」的結構問題。", "url": "https://www.merlintrader.com/castellum-inc-stock-hub/"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "指數成分", "color": "#5B8ED6", "stocks": [{"t": "FSBC", "n": "加州沙加緬度社區銀行，小型金融族群代表"}, {"t": "MPB", "n": "賓州社區銀行，同族群且幾乎無大型券商追蹤"}, {"t": "ATLO", "n": "愛荷華州小型社區銀行控股公司，同族群"}], "en": "The Russell 2000's 23% year-to-date gain has now edged past the Nasdaq 100's 19%, and the leadership came from broader earnings contribution rather than one hot theme. But that also explains Friday's asymmetry. Financials, dominated by community banks, carry the heaviest weight in the index, and rate expectations cut both ways for them: a hike widens net interest margin but raises deposit costs and pressures commercial real estate credit. When judging the index, look at what is actually inside it.", "zh": "羅素 2000 年初至今上漲 23%，已經超越那斯達克 100 的 19%，而這個領先來自「獲利貢獻變廣」而不是單一熱門主題，這是健康的訊號。但它也解釋了週五的不對稱：指數裡權重最重的是金融，而且以社區銀行為主，利率預期對它們是雙面刃——升息拉開淨息差，卻同時推高存款成本、壓迫商用不動產的信用品質。判斷指數之前，先看清楚裡面裝的是什麼。", "url": "https://ts2.tech/en/russell-2000-hits-a-record-with-a-9-point-2026-lead-and-34-valuation-discount/"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "財報時間差", "color": "#5B8ED6", "stocks": [{"t": "ANIK", "n": "小型醫材，第二季營收 3,261 萬美元、淨利 331 萬轉正"}, {"t": "GRC", "n": "小型泵浦製造商，年營收約 6.8 億美元的典型指數成分"}], "en": "One structural feature worth planning around: most small caps report on a calendar cadence that puts their next results in late October and November. That means the next two months are a data market, not an earnings market - macro releases will carry more weight in small-cap pricing than company news, simply because there is no company news. The exceptions are the few that have already reported, such as Anika Therapeutics, which posted Q2 sales of $32.61 million and swung to net income of $3.31 million.", "zh": "有一個結構性的時間差值得先安排好：多數小型股的下一份財報要等到十月底與十一月才出來。這代表接下來兩個月是「數據市」而不是「財報市」——總經數據對小型股定價的權重會高於個股新聞，原因很簡單，因為根本沒有個股新聞。例外是少數已經交卷的公司，例如小型醫材商 Anika，第二季營收 3,261 萬美元、淨利 331 萬美元轉正。沒有消息的兩個月，利率就是唯一的消息。", "url": "https://simplywall.st/stocks/us/consumer-durables/nyse-etd/ethan-allen-interiors/news/undervalued-small-caps-with-insider-activity-to-consider-in-9"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（在手訂單能否止跌）", "stocks": [{"t": "VTSI", "n": "微型市值警消與軍方訓練模擬器商，董事連兩日買進"}], "en": "VirTra builds judgmental use-of-force and firearms training simulators for law enforcement and military customers. It is a micro cap with essentially no analyst coverage. Why it is ignored: revenue is shrinking, with Q2 at $5.8 million, down 17%, and a loss of $0.02 per share. What is changing: Q2 bookings were $5.5 million and total backlog stood at $24.9 million as of June 30 ($13.2M capital, $3.8M service, $7.9M STEP), with gross margin still at 59%. Director Grant Barber bought 3,350 shares on the open market on August 27 and 28 at $3.05 and $2.99, his second round of buying this year. Risks: long revenue recognition cycles, lumpy single-customer orders, and an insider purchase under $10,000 that is more symbolic than substantive. This is a research lead, not investment advice.", "zh": "VirTra 做的是警消與軍方的判斷式用槍訓練模擬器，市值屬於微型股等級，幾乎沒有分析師覆蓋。為什麼被忽視：營收在縮，第二季 580 萬美元、年減 17%，並轉為每股虧損 0.02 美元。什麼正在改變：第二季新接訂單 550 萬美元，六月底在手訂單 2,490 萬美元（資本 1,320 萬、服務 380 萬、STEP 合約 790 萬），毛利率仍守在 59%；董事 Grant Barber 在 8 月 27、28 日連續兩天以 3.05 與 2.99 美元自公開市場買進共 3,350 股，這已是他今年第二輪買進。風險與反方論點：訂單認列時程長、單一客戶波動大，而且這筆內部人買進金額不到一萬美元，象徵意義大於實質。這是研究線索，不是投資建議。", "url": "https://www.globenewswire.com/news-release/2026/08/13/3344942/34563/en/virtra-reports-second-quarter-and-six-months-2026-financial-results.html"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "新名字", "color": "#C9A227", "status": "RADAR · 下一個驗證點 Long Ridge 交割完成與第三季財報", "stocks": [{"t": "FIP", "n": "鐵路與港口基礎建設持有者，15.2 億美元資產出售即將交割"}], "en": "FTAI Infrastructure owns rail (Transtar), ports and energy infrastructure, spun out of FTAI Aviation in 2022. The market has long discounted it as a pile of hard-to-model assets. What is changing: on April 30 it agreed to sell Long Ridge to MARA for $1.52 billion, expected to close in Q3. At closing it eliminates $1.16 billion of Long Ridge debt outright and applies roughly $300 million of net proceeds against parent-level debt, which management estimates saves about $25 million of annual interest. Q2 adjusted EBITDA was $76.1 million versus $45.9 million a year earlier, up about 66%. Risks: Transtar volumes softened in Q2 as U.S. Steel idled a blast furnace for its Gary investment, and the deal still needs regulatory approval. This is a research lead, not investment advice.", "zh": "FTAI Infrastructure 持有鐵路（Transtar）、港口與能源基礎建設資產，是 2022 年從 FTAI Aviation 分拆出來的公司，長期被市場當成「一堆看不懂的資產」而折價。什麼正在改變：4 月 30 日宣布以 15.2 億美元把 Long Ridge 賣給 MARA，預計第三季完成交割；交割時會一次消掉 11.6 億美元的 Long Ridge 債務，並用約 3 億美元淨收入償還母公司層級的負債，管理層估計每年可省下約 2,500 萬美元利息。第二季調整後 EBITDA 為 7,610 萬美元，較去年同期的 4,590 萬成長約 66%。風險與反方論點：Transtar 第二季運量走弱，因美國鋼鐵在 Gary 廠投資而停用一座高爐；交易尚待監管核准，時程若延後，去槓桿的故事也跟著延後。這是研究線索，不是投資建議。", "url": "https://finance.yahoo.com/markets/stocks/articles/ftai-infrastructure-fip-expects-more-234329676.html"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（看毛利率而非訂單金額）", "stocks": [{"t": "SHIM", "n": "水利與電力基礎建設營造商，在手訂單創兩年新高"}], "en": "Shimmick is a California-rooted contractor in water, electrical and critical infrastructure construction, already in the radar pool, and there is new evidence. As of July 3, 2026, backlog stood at roughly $991 million, the highest since Q1 2024, with a Q2 book-to-burn ratio of 1.4x and a further $221 million of new awards pending in water and electrical markets. Why it is ignored: contractor gross margins have been dragged down for years by legacy contracts, so the market still prices it on three years of bad numbers. Risks: growing backlog does not equal improving margin, and the cost of closing out old contracts can still consume the profit from new ones. This is a research lead, not investment advice.", "zh": "Shimmick 是加州起家的水利、電力與關鍵基礎建設營造商，屬於雷達池內既有名字，這次有新證據。截至 2026 年 7 月 3 日，在手訂單約 9.91 億美元，是 2024 年第一季以來最高；第二季接單出貨比達 1.4 倍，另有 2.21 億美元的水利與電力新約待入帳。為什麼被忽視：營造商的毛利率長期被舊約拖累，市場習慣用過去三年的難看數字看它。風險與反方論點：訂單金額成長不等於毛利改善，舊合約的收尾成本仍可能吃掉新約的利潤——這一檔要看的是毛利率，不是訂單金額。這是研究線索，不是投資建議。", "url": "https://www.sec.gov/Archives/edgar/data/0001887944/000119312526342368/shim-ex99_1.htm"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 下一份年報揭露的國防積壓訂單金額", "stocks": [{"t": "NPK", "n": "壓力鍋與彈藥的混合體，8 月拿下 1.591 億美元國防訂單"}], "en": "National Presto is half pressure cookers and small appliances, half ammunition - a combination that has long left it without a natural analyst peer group. New evidence for this pool name: on August 13, subsidiary AMTEC received option awards under year five of its five-year U.S. Army 40mm systems contract, and the same day Spectra Technologies won a Boeing subcontract to produce Small Diameter Bomb warheads. The two awards total $159.1 million. Deliveries run from mid-2028 through early 2030 and from September 2027 respectively, extending the defense backlog roughly three years out. Risks: long delivery schedules mean slow cash conversion, and both defense budgets and delivery timing can shift. This is a research lead, not investment advice.", "zh": "National Presto 一半是壓力鍋與小家電、一半是彈藥，這種組合讓它長期找不到合適的分析師族群來覆蓋。池內名字的新證據：8 月 13 日子公司 AMTEC 取得美國陸軍 40 公厘系統五年期合約的第五年選擇權，同日 Spectra Technologies 也拿到波音的小直徑炸彈彈頭分包合約，兩案合計 1.591 億美元。交期分別落在 2028 年中到 2030 年初、以及 2027 年 9 月起，等於把國防積壓訂單往後鋪了三年。風險與反方論點：交期長代表現金回收慢，而且國防預算與交付進度都可能變動，帳上訂單不等於帳上現金。這是研究線索，不是投資建議。", "url": "https://www.tipranks.com/news/company-announcements/national-presto-defense-subsidiaries-secure-major-u-s-contracts"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 是否出現第二位內部人跟進買進", "stocks": [{"t": "BORR", "n": "淺水自升式鑽井平台營運商，董事長 8 月 25 日買進 20 萬股"}], "en": "Borr Drilling is a pure-play shallow-water jackup driller, sitting squarely in the cold-sector, low-coverage corner of the market. New evidence for this pool name: chairman Tor Olav Troim bought 200,000 shares on the open market on August 25. That is an insider voting his own money on the day-rate cycle, and the buyer being the chairman rather than an ordinary director puts the signal a level higher. Risks: offshore drilling profits are tied entirely to oil prices and day rates, and Brent fell 2.5% on Friday. The company also carries high leverage, and a single insider purchase does not change a balance sheet. This is a research lead, not investment advice.", "zh": "Borr Drilling 是純做淺水自升式鑽井平台的離岸鑽井商，屬於典型「產業冷、覆蓋少」的位置。池內名字的新證據：董事長 Tor Olav Troim 於 8 月 25 日在公開市場買進 20 萬股。這是內部人用自己的錢對日費率循環投票，而且買方是董事長而非一般董事，訊號層級比較高。風險與反方論點：離岸鑽井的獲利完全綁在油價與日費率上，而布蘭特原油週五才回落 2.5%；公司負債水位偏高，單一內部人買進改變不了資產負債表。這是研究線索，不是投資建議。", "url": "https://stockanalysis.com/stocks/borr/"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "池內更新", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 FY2026 第四季財報（淨利能否連兩季轉正）", "stocks": [{"t": "AZTA", "n": "生技樣本管理與多體學服務商，Q3 營收大幅超標"}], "en": "Azenta provides biological sample storage, tracking and multiomics services - among the least discussed names in life science tools. New evidence for this pool name: Q3 revenue came in at $161 million against a $149 million consensus, up 12% reported and 9% organically, with Sample Management Solutions at $88 million and 9% organic growth. The company closed the sale of B Medical Systems on July 1 to focus on its core, repurchased about 2.3 million shares for $50 million in the quarter, and insiders bought roughly $0.2 million of stock over the past three months. Risks: the quarter also carried a $149 million goodwill impairment and a loss of $0.034 per share, so the combination of better revenue and a reported loss needs one more quarter to confirm it is not a one-off. This is a research lead, not investment advice.", "zh": "Azenta 做的是生技樣本的保存、追蹤與多體學分析服務，是生命科學工具族群裡最少被討論的一家。池內名字的新證據：第三季營收 1.61 億美元，大幅優於市場預期的 1.49 億，年增 12%、有機成長 9%；樣本管理業務營收 8,800 萬美元、有機成長 9%。公司在 7 月 1 日完成 B Medical Systems 的出售以聚焦核心，季內買回約 230 萬股、金額 5,000 萬美元，內部人近三個月也買進約 20 萬美元。風險與反方論點：本季同時認列 1.49 億美元的商譽減損、每股仍虧損 0.034 美元，「營收好轉但帳上虧損」的組合需要下一季確認不是一次性。這是研究線索，不是投資建議。", "url": "https://seekingalpha.com/article/4930773-azenta-inc-2026-q3-results-earnings-call-presentation"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "群聚買進", "color": "#6DB56D", "stocks": [{"t": "DKS", "n": "四位董事兩天內合計買進約 372 萬美元"}, {"t": "ASO", "n": "運動用品零售同業，可用來對照族群景氣"}], "en": "Dick's Sporting Goods produced the week's largest and broadest insider cluster: four directors bought roughly $3.72 million between August 26 and 27. Mark Barrenechea took 17,000 shares at an average $130.72, about $2.2 million. William Colombo bought 6,100 shares across the two days for $785,497. Robert Eddy bought 4,000 shares at $128.69, about $514,760. Sandeep Mathrani bought 1,550 shares at $128.89, about $199,780. The backdrop is a stock down roughly 42% over the past year. Read with care: all four are directors - no named executive officer appears in this cluster.", "zh": "Dick's Sporting Goods 出現本週最大也最完整的一組群聚買進：四位董事在 8 月 26 至 27 日合計買進約 372 萬美元。Mark Barrenechea 買進 17,000 股、均價 130.72 美元，約 220 萬美元；William Colombo 兩天合計買 6,100 股、78.5 萬美元；Robert Eddy 買 4,000 股、均價 128.69 美元，約 51.5 萬美元；Sandeep Mathrani 買 1,550 股、均價 128.89 美元，約 20 萬美元。背景是股價過去一年下跌約 42%。判讀提醒：四人全是董事，沒有任何一位具名經營層（執行長或財務長）出現在這組買進裡。", "url": "https://www.fool.com/coverage/filings/2026/08/29/dick-s-sporting-goods-director-barrenechea-buys-17-000-shares-for-usd2-2-million-should-you-buy-dks-too/"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "庫藏股", "color": "#6DB56D", "stocks": [{"t": "UNM", "n": "8 月 26 日核准 10 億美元新買回計畫，9 月 1 日起生效"}, {"t": "FIGS", "n": "8 月 6 日追加 1 億美元，總授權提高到 2 億美元"}], "en": "August's buyback authorizations clustered in insurance and consumer brands. Unum's board approved a new $1 billion repurchase program on August 26, effective September 1. FIGS added $100 million on August 6, lifting its total authorization to $200 million. Read with care: an authorization is not money spent - a company can announce one and never buy a share. What matters is the actual share count and average cost disclosed in the next 10-Q. Authorization is talk; execution is the hand.", "zh": "八月的庫藏股授權集中在保險與消費品牌。Unum 於 8 月 26 日核准 10 億美元的新買回計畫，自 9 月 1 日起生效；FIGS 則在 8 月 6 日追加 1 億美元，把總授權提高到 2 億美元。判讀提醒：授權金額不是已經花掉的錢，公司可以宣布之後一股都不買。真正該追的是下一份 10-Q 裡揭露的實際買回股數與平均成本——授權是嘴上說的，實買才是動手做的。這條規則適用於所有宣布庫藏股的公司。", "url": "https://www.tipranks.com/news/company-announcements/unum-group-announces-1-billion-share-repurchase-plan"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "統計判讀", "color": "#6DB56D", "stocks": [{"t": "DKS", "n": "當期唯一達到群聚標準的大型案例"}, {"t": "VTSI", "n": "微型股樣本：董事兩天買進 3,350 股、金額不到一萬美元"}], "en": "Lay out the insider filings from August 26 to 28 and the ratio itself is the lesson: 394 Form 4s were filed, only 67 were open-market purchases, and just four met a clustering definition. That tells you most Form 4s are vesting, option exercises and tax-related sales, not signals. Micro caps carry a separate trap in the other direction - VirTra's director bought 3,350 shares over two days for under $10,000, which is a rounding error in a large cap but can be a meaningful slice of a micro cap's daily volume. Judge insider activity on size, role and share of float together, never on the headline count.", "zh": "把 8 月 26 至 28 日的內部人申報攤開看，比例本身就是判讀重點：三天內共 394 份 Form 4，其中只有 67 筆是公開市場買進，符合「群聚」定義的更只有 4 組。這說明大多數 Form 4 是既得歸屬、選擇權行使與稅務賣出，根本不是訊號。微型股則有另一個方向的陷阱：VirTra 董事兩天買進 3,350 股、金額不到一萬美元，在大型股是零頭，在微型股卻可能是當日買盤的一大塊。看內部人要同時看金額、身分與占流通量的比重，不能只數筆數。", "url": "https://ounie.com/b/ounie/insider-conviction-daily/insider-conviction-daily-august-28-2026"},
    {"id": "capitol_0", "channel": "政要持股", "tag": "部位形狀", "color": "#B5654D", "stocks": [{"t": "HUBB", "n": "電網與配電設備商，該申報人的最大持股之一"}, {"t": "BWXT", "n": "海軍反應爐與核能組件製造商，同組申報中的重點名字"}, {"t": "CHRW", "n": "第三方物流商，同組申報中的另一個標的"}], "en": "Recomputing the last 90 days from the House Clerk's official filing index - 141 PTRs - the interesting part is not the name but the shape of the position. Representative April McClain Delaney of Maryland's sixth district filed 64 transactions, of which 60 were purchases and only three were sales, in a dollar range between $288,064 and $1.52 million, concentrated in just 15 distinct securities. The largest holdings include Hubbell (grid and distribution equipment), BWX Technologies (naval reactors and nuclear components), Life Time and C.H. Robinson. This money is betting on a single theme - power and grid infrastructure - not building a diversified allocation.", "zh": "從眾議院書記官的官方申報索引重算過去 90 天的 141 份 PTR，最值得看的不是名字，是部位的形狀。馬里蘭州第六選區的 April McClain Delaney 申報了 64 筆交易，其中 60 筆是買進、只有 3 筆賣出，金額區間落在 28.8 萬到 152 萬美元之間，而且只集中在 15 個標的。前幾大是 Hubbell（電網與配電設備）、BWX Technologies（海軍反應爐與核能組件）、Life Time 與 C.H. Robinson。這組錢押的是同一個主題：電力與電網基礎建設，而不是分散配置。", "url": "https://disclosures-clerk.house.gov/FinancialDisclosure"},
    {"id": "capitol_1", "channel": "政要持股", "tag": "判讀提醒", "color": "#B5654D", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報標的的 ETF，跟單工具的實際樣貌"}, {"t": "GOP", "n": "追蹤共和黨籍議員申報標的的 ETF，同類工具"}], "en": "This channel always carries a reading card, and today's is about the time gap. The STOCK Act allows 45 days to file, so a trade you read today may have executed in mid-July - anyone following it buys at someone else's price from 45 days ago, in a 45-day-old information environment. Three more limits get overlooked: amounts come only as wide bands (for example $1,001 to $15,000) with no exact figure; a meaningful share of trades is executed in spousal or trust accounts where the member may not have made the decision; and when the security is an option, the strike and expiry carry the real information, so reading only what was bought misses whether the bet is on direction or on time. This channel exists to note that someone is voting real money on a theme. It is not a trading signal.", "zh": "這個頻道每天固定附一張判讀卡，今天講的是「時間差」。STOCK Act 允許 45 天內申報，所以你今天讀到的交易，執行日可能是七月中——跟單的人買到的是別人 45 天前的價位，以及 45 天前的資訊環境。另外三個常被忽略的限制：金額只有寬區間（例如 1,001 至 15,000 美元）而沒有確切數字；相當比例的交易由配偶或信託帳戶執行，議員本人未必參與決策；若標的是選擇權，履約價與到期日才是真正的資訊量，光看「買了什麼」會漏掉他押的是方向還是時間。這個頻道的定位是「有人用真錢投票給某個主題」，不是買賣訊號。", "url": "https://www.congress.gov/crs_external_products/TE/HTML/TE10073.html"},
    {"id": "week_0", "channel": "本週事件", "tag": "總經行事曆", "color": "#C97DD4", "stocks": [{"t": "TLT", "n": "長天期公債 ETF，每一筆數據都會重新定價它"}, {"t": "XLI", "n": "工業類股 ETF，ISM 製造業的直接對照組"}], "en": "The next five sessions are a dense data week. Tuesday, September 1: ISM Manufacturing, JOLTS job openings and construction spending. Wednesday, September 2: ADP employment and factory orders. Thursday, September 3: ISM Services, initial claims and the trade balance. Friday, September 4: the August payrolls report as the closer. Monday itself carries no major U.S. release but does bring the G20 finance ministers and central bank governors meeting. With hike odds near a coin flip, every one of these prints will be used to reprice the September meeting.", "zh": "接下來五個交易日是密集的數據週。週二（9/1）ISM 製造業指數、JOLTS 職缺與營建支出；週三（9/2）ADP 就業與工廠訂單；週四（9/3）ISM 非製造業、初領失業金與貿易帳；週五（9/4）壓軸的八月非農就業報告。週一（8/31）本身沒有重要的美國數據，但有 G20 財長與央行總裁會議。在升息機率接近五成的情況下，這一週的每一筆數據都會被拿來重新定價九月的會議。", "url": "https://tradingeconomics.com/calendar?article=29368&g=top&importance=2&startdate=2026-08-28"},
    {"id": "week_1", "channel": "本週事件", "tag": "重點財報", "color": "#C97DD4", "stocks": [{"t": "AVGO", "n": "週三盤後，市場預估 AI 半導體營收 152.3 億美元"}, {"t": "DELL", "n": "週二盤後，AI 伺服器出貨的實際數字"}, {"t": "PANW", "n": "週二盤後，資安支出的溫度計"}, {"t": "LULU", "n": "週四盤後，市場預估獲利年減約 42%"}], "en": "On the earnings side, hardware and security take the baton. Tuesday, September 1 after the close: Dell and Palo Alto Networks. Wednesday, September 2 after the close is the main event - Broadcom, where consensus looks for EPS of $3.24 on revenue of $29.24 billion, with AI semiconductor revenue expected at $15.23 billion against $5.2 billion a year earlier. Hewlett Packard Enterprise and NetApp report the same day. Thursday, September 3 after the close brings Lululemon, where profit is expected to fall roughly 42% year over year to about $1.80 per share.", "zh": "財報方面本週由科技硬體與資安接棒。週二（9/1）盤後是 Dell 與 Palo Alto Networks；週三（9/2）盤後是重頭戲 Broadcom，市場預估每股盈餘 3.24 美元、營收 292.4 億美元，其中 AI 半導體營收預估 152.3 億美元，對比去年同期的 52 億；同日還有慧與科技與 NetApp。週四（9/3）盤後 Lululemon，市場預估獲利年減約 42% 至每股約 1.80 美元。前面三張是 AI 需求的驗證，最後一張是消費力的驗證。", "url": "https://www.tradingkey.com/analysis/stocks/us-stocks/262140230-nonfarm-payrolls-broadcom-dell-palo-alto-networks-earnings-august-tradingkey"},
    {"id": "eval_0", "channel": "今日評估", "tag": "今日評估", "color": "#E8A838", "status": "今日討論 · 翻到最後一頁按討論按鈕", "stocks": [{"t": "SPY", "n": "標普 500，週五只跌 0.25%"}, {"t": "QQQ", "n": "那斯達克 100，週五跌約 0.5%"}], "en": "The single most notable thing today is not a stock - it is that the Fed's reaction function flipped. In early August the question was when cuts would arrive; after Friday it is whether September brings a hike, at close to even odds. What deserves recording is who reacted first: the Nasdaq fell 0.5% and the S&P 0.25%, while the Russell 2000 fell 1.39%. The market ranked, on its own, who depends on low rates. Open question: if September does bring a quarter-point hike, which position you hold leans hardest on the assumption that rates come down - and what would you do if that assumption is wrong?", "zh": "今天最值得注意的一件事不是任何一檔股票，是 Fed 的反應函數翻了面。八月初的問題還是「什麼時候降息」，週五之後變成「九月會不會升息」，而且機率接近五成。更值得記下來的是誰先反應：那斯達克跌 0.5%、標普跌 0.25%，羅素 2000 卻跌 1.39%——市場自己把「誰依賴低利率」排了序。開放式問題：如果九月真的升息一碼，你手上的部位裡，哪一檔最依賴「利率會下來」這個假設？而這個假設如果錯了，你打算怎麼處理？", "url": "https://www.cnbc.com/2026/08/28/kevin-warsh-jackson-hole-fed-inflation-rate-hike.html"},
];

// 排程只要照常抽換 CARDS 就好,不用額外維護日期。
const BRIEF_ID = (() => {
  const s = CARDS.map(c => c.id + "|" + (c.zh || "").slice(0, 24)).join("~");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARDS.length + "-" + (h >>> 0).toString(36);
})();
const lsKeyFor = (sub) => "mosfeed_" + BRIEF_ID + "_" + sub;

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/31/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v9.5</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
