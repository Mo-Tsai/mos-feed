<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====

    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "殖利率衝擊", "color": "#E05C5C", "zh": "週三（9/23）美股三大指數同步收跌，標普 500 跌 0.75% 收 7,706.03，那斯達克跌 1.13% 收 26,936.04，道瓊跌 352.10 點（0.68%）收 51,511.59。下跌的單一主因是債市：10 年期美債殖利率一度觸及 5.135%，是 2007 年 7 月以來最高，5 年期也首度站上 5%。市場開始把「聯準會還會再升息」當成基準情境，而不是尾部風險。股票的折現率被整體上推，估值最高的那一端跌得最兇。", "en": "US stocks fell across the board Wednesday (9/23): the S&P 500 lost 0.75% to 7,706.03, the Nasdaq shed 1.13% to 26,936.04 and the Dow dropped 352.10 points (0.68%) to 51,511.59. The single driver was the bond market — the 10-year Treasury yield touched 5.135%, its highest since July 2007, and the 5-year crossed 5% for the first time since 2007. Investors are now treating further Fed hikes as the base case rather than a tail risk, lifting discount rates across the board and hitting the most expensive end of the market hardest.", "url": "https://www.cnbc.com/2026/09/23/treasury-yields-oil-inflation-fed.html", "stocks": [{"t": "SPY", "n": "標普 500 ETF，當日跌 0.75%"}, {"t": "QQQ", "n": "那斯達克 100 ETF，科技權重最高、跌幅最深"}, {"t": "TLT", "n": "20 年期以上美債 ETF，殖利率衝 5.135% 直接壓價"}]},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "類股分歧", "color": "#E05C5C", "zh": "盤面結構很乾淨：只有兩個類股收紅，能源漲約 1.1%、工業小漲約 0.2%，其餘全黑。跌最重的是公用事業與非核心消費，兩者都跌超過 1%。這是典型的「殖利率主導日」——靠股息吸引資金的族群直接被無風險利率比掉，而受油價帶動的族群反而受益。同一天看類股分布，比看指數跌幾點更能說明市場在重新定價什麼。", "en": "The internals were unusually clean: only two sectors finished green — energy up about 1.1% and industrials barely positive at about 0.2% — while everything else fell. Utilities and consumer discretionary were the worst, each down more than 1%. This is a textbook yield-driven session: groups bought for their dividends were outcompeted by the risk-free rate, while oil-levered groups benefited. The sector map explains what is being repriced far better than the index move does.", "url": "https://www.schwab.com/learn/story/stock-market-update-open", "stocks": [{"t": "XLE", "n": "能源類股 ETF，當日領漲約 1.1%"}, {"t": "XLU", "n": "公用事業 ETF，跌逾 1%，殖利率競爭下最大受害者"}, {"t": "XLY", "n": "非核心消費 ETF，同樣跌逾 1%"}, {"t": "XLI", "n": "工業 ETF，當日僅小漲約 0.2%"}]},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "原油", "color": "#E05C5C", "zh": "油價是這輪殖利率上衝的源頭。布蘭特原油週三大漲 3.86%，收在每桶 103.08 美元；西德州原油漲 1.81% 收 92.16 美元。基本面其實偏空——EIA 公布美國原油庫存單週增加 296.9 萬桶到 4.264 億桶，市場原本預期是減少 64.1 萬桶。庫存增加而價格照漲，說明主導的是中東供應風險溢價：沙烏地準備重啟東西向輸油管以繞過荷姆茲海峽，而美伊代表剛結束一輪被形容為「很有建設性」的會談。", "en": "Oil is the source of this yield surge. Brent jumped 3.86% Wednesday to settle at $103.08 a barrel and WTI rose 1.81% to $92.16. The fundamentals actually argued the other way: the EIA reported US crude inventories rose 2.969 million barrels to 426.4 million, against expectations for a 641,000-barrel draw. Prices climbing on a build says the market is pricing Middle East supply risk, not balances — Saudi Arabia is preparing to restart its East-West pipeline to bypass the Strait of Hormuz, while US and Iranian envoys just wrapped a round of talks described as productive.", "url": "https://tradingeconomics.com/commodity/brent-crude-oil", "stocks": [{"t": "USO", "n": "原油 ETF，直接反映布蘭特與西德州走勢"}, {"t": "XOP", "n": "油氣探勘生產 ETF，油價 100 美元以上的直接受惠"}, {"t": "TNK", "n": "蘇伊士型原油輪船東，中東航線繞遠反而推升噸海里需求"}, {"t": "OIH", "n": "油服 ETF，資本支出循環的落後指標"}]},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "小型股補跌", "color": "#E05C5C", "zh": "那斯達克與羅素 2000 一起下殺，是這天最值得記的細節。小型股對利率的敏感度遠高於大型股：高盛的數字是羅素 2000 約有 32% 的成分股帶浮動利率債務，標普 500 只有 6%。9/16 聯準會升息定案之後，這 32% 的利息成本是直接跟著調的，不需要等再融資。今年小型股一度是全場最強勢的族群，現在要驗證的是那段漲幅裡有多少是靠降息預期堆出來的。", "en": "The detail worth remembering is that the Nasdaq and the Russell 2000 sold off together. Small caps are far more rate-sensitive than large caps: Goldman Sachs estimates about 32% of Russell 2000 constituents carry floating-rate debt versus just 6% of the S&P 500. After the Fed's September 16 hike, that 32% sees its interest cost reset immediately — no refinancing required. Small caps were the strongest group in the market earlier this year; the open question is how much of that run rested on rate-cut expectations.", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-sept-23-2026", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，與那斯達克同步下殺"}, {"t": "IJR", "n": "標普小型股 600 ETF，成分股有獲利門檻"}, {"t": "VTWO", "n": "Vanguard 羅素 2000 ETF"}, {"t": "IWN", "n": "小型價值股 ETF，區域銀行權重高"}]},
    {"id": "earn_0", "channel": "財報速報", "tag": "食品財報", "color": "#E8786A", "zh": "通用磨坊（General Mills）公布 2027 會計年度第一季：淨銷售 44 億美元、年減 3%，但那是美國優格事業出售造成的，有機銷售持平。營業利益 6.34 億美元帳面暴跌 63%，原因是去年同期有 10 億美元的優格處分利益墊高基期；把一次性因素拆掉後，調整後每股盈餘 0.75 美元、以固定匯率計年減 13%。公司重申全年財測。這張卡的重點是：包裝食品的價格與產品組合還撐得住營收，但撐不住毛利，投入成本壓力仍在。", "en": "General Mills reported fiscal 2027 first-quarter results: net sales of $4.4 billion, down 3%, but that decline is entirely the US yogurt divestiture — organic sales were flat. Reported operating profit of $634 million fell 63%, distorted by a $1 billion yogurt divestiture gain in the year-ago quarter. Stripping out one-offs, adjusted EPS of $0.75 was down 13% in constant currency, and the company reaffirmed full-year guidance. The takeaway: in packaged food, pricing and mix can still hold the top line, but not the margin — input cost pressure has not gone away.", "url": "https://investors.generalmills.com/press-releases/press-release-details/2026/General-Mills-Reports-Fiscal-2027-First-quarter-Results-and-Reaffirms-Full-year-Outlook/default.aspx", "stocks": [{"t": "GIS", "n": "通用磨坊，FQ1 有機銷售持平、調整後 EPS 0.75 美元"}, {"t": "K", "n": "同為包裝食品，成本與定價結構可對照"}, {"t": "XLP", "n": "核心消費 ETF，防禦族群當日同樣承壓"}]},
    {"id": "earn_1", "channel": "財報速報", "tag": "財測砍到骨", "color": "#E8786A", "zh": "Stitch Fix 在 9/23 盤後公布 2026 會計年度第四季，股價盤後重挫 17% 到 2.34 美元。殺盤的不是當季數字，而是 2027 年度的營收展望遠低於分析師預期，加上活躍客戶數持續流失。股價本來就已經貼近 52 週低點，盤中還先跌了約 5%，盤後等於再補一刀。訂閱制服飾這條路的結構問題很明確：客戶數不成長時，營運槓桿完全發揮不出來。", "en": "Stitch Fix reported fiscal 2026 fourth-quarter results after Wednesday's close and the stock plunged 17% in after-hours trade to $2.34. The damage was not the quarter itself but a fiscal 2027 revenue outlook well below analyst expectations, alongside continued active-client attrition. The stock was already near its 52-week low and had slipped about 5% during the session, so the after-hours move compounded it. The structural problem with subscription apparel is plain: without client growth there is no operating leverage to harvest.", "url": "https://www.investing.com/news/stock-market-news/why-is-stitch-fix-stock-down-17-today-93CH-4913988", "stocks": [{"t": "SFIX", "n": "Stitch Fix，盤後跌 17% 至 2.34 美元"}, {"t": "RENT", "n": "同為服飾訂閱模式的對照組"}, {"t": "XRT", "n": "零售類股 ETF"}]},
    {"id": "earn_2", "channel": "財報速報", "tag": "勞動市場讀數", "color": "#E8786A", "zh": "Cintas 與 Paychex 都在 9/23 交卷，這兩家的價值不在財報數字本身，而在它們是勞動市場的民間讀數。Cintas 租制服給企業，路線量等於「企業實際讓多少人穿上制服」；Paychex 幫中小企業代管薪資，資料直接來自發薪紀錄。Paychex 自家的小企業就業指數 8 月是 99.13，大致等於今年迄今平均，週工時則是連續第六個月上升。在官方數據之外，這是判斷「企業不是在裁員、只是不加人」的另一組證據。市場對這兩份財報的預期分別是每股盈餘 1.35 美元與 1.32 美元。", "en": "Cintas and Paychex both reported on September 23, and their value is less in the numbers than in what they read out about the labour market. Cintas rents uniforms, so its route volumes track how many workers employers actually put in uniform; Paychex runs payroll for small businesses, so its data comes straight off pay records. Paychex's own Small Business Jobs Index stood at 99.13 in August, roughly the 2026 year-to-date average, while weekly hours worked rose for a sixth straight month. Outside the official data, that is a second line of evidence for firms not firing but not hiring either. Consensus looked for EPS of $1.35 and $1.32 respectively.", "url": "https://www.tradingview.com/news/marketbeat:4906a29e0094b:0-paychex-and-cintas-show-surprising-labor-market-resilience/", "stocks": [{"t": "CTAS", "n": "Cintas，FQ1 市場預期 EPS 1.35 美元、營收 29.8 億"}, {"t": "PAYX", "n": "Paychex，FQ1 市場預期 EPS 1.32 美元、營收 16.3 億"}, {"t": "DIA", "n": "道瓊 ETF，兩家皆為服務業景氣的成分讀數"}]},
    {"id": "macro_0", "channel": "總經政策", "tag": "升息循環", "color": "#7C6AF7", "zh": "背景要先擺清楚：聯準會在 9/16 把政策利率升到 3.75%–4.00%，這是 2023 年以來第一次升息，而且全體無異議通過。9 月的利率點陣圖顯示有八位官員認為 2027 年還要再升一次，六位主張不動，四位預期降息。期貨市場現在把 12 月的政策利率定價在約 4.2%、2027 年 9 月約 4.7%。換句話說，市場已經不在辯論「會不會再升」，而在算「還要升幾次」——這是一年來最大的敘事轉換。", "en": "Set the backdrop first: on September 16 the Fed raised its policy rate to 3.75%-4.00%, its first hike since 2023, and the vote was unanimous. The September dot plot showed eight officials penciling in another hike in 2027, six holding steady and four expecting cuts. Futures now price the policy rate near 4.2% by December and roughly 4.7% by September 2027. In other words the market has stopped debating whether there is another hike and started counting how many — the biggest narrative shift in a year.", "url": "https://www.cnbc.com/2026/09/16/fed-rate-decision-september-2026.html", "stocks": [{"t": "SHY", "n": "1–3 年期美債 ETF，最貼近政策利率定價"}, {"t": "IEF", "n": "7–10 年期美債 ETF，升息路徑的中段定價"}, {"t": "XLF", "n": "金融類股 ETF，利差與信用風險兩面受影響"}]},
    {"id": "macro_1", "channel": "總經政策", "tag": "供給衝擊", "color": "#7C6AF7", "zh": "這一輪升息預期的燃料不是需求過熱，而是能源價格。芝加哥聯準銀行總裁 Goolsbee 說央行不能無視持續性的供給衝擊，聖路易聯準銀行總裁 Musalem 則直說可能還需要進一步升息才能把通膨壓回目標。同一天公布的 S&P Global 美國採購經理人初值顯示企業活動以 2021 年以來最快的速度擴張，讓「經濟撐不住升息」這個反方論點更難成立。供給面通膨對央行最難處理，因為升息壓不了油價，只能壓需求。", "en": "The fuel for this hiking expectation is energy prices, not overheating demand. Chicago Fed President Goolsbee said the central bank cannot look past persistent supply shocks, while St. Louis Fed President Musalem said further increases may be needed to bring inflation back to target. The same day, S&P Global's flash US PMI showed business activity expanding at its fastest pace since 2021, making the counterargument that the economy cannot absorb hikes harder to sustain. Supply-side inflation is the hardest kind for a central bank: raising rates cannot lower the price of oil, only demand.", "url": "https://www.cnbc.com/2026/09/23/treasury-yields-oil-inflation-fed.html", "stocks": [{"t": "TIP", "n": "抗通膨債券 ETF，反映通膨補償的定價"}, {"t": "GLD", "n": "黃金 ETF，實質利率走高對它反而是逆風"}, {"t": "USO", "n": "原油 ETF，這輪供給面通膨的源頭"}]},
    {"id": "macro_2", "channel": "總經政策", "tag": "利率傳導", "color": "#7C6AF7", "zh": "殖利率上衝最快傳導到實體經濟的一條路是房貸。房貸銀行家協會（MBA）公布截至 9/18 當週，30 年期固定房貸平均利率升到 7.12%，是 2024 年以來最高；Freddie Mac 在 9/17 報 6.95%。自 2 月中東衝突開打以來，房貸利率已上升超過 100 個基點——以 40 萬美元貸款計算，利率升一個百分點，月付大約多 265 美元。當週總房貸申請件數減 1.5%，是連續第三週下滑，重貸減 2.6%、購屋減 0.8%。", "en": "The fastest channel from yields into the real economy is mortgages. The Mortgage Bankers Association reported the average 30-year fixed rate rose to 7.12% in the week ended September 18, the highest since 2024, while Freddie Mac printed 6.95% on September 17. Mortgage rates are up more than 100 basis points since the Middle East conflict began in February — on a $400,000 loan, a one-point move adds roughly $265 to the monthly payment. Total mortgage applications fell 1.5% that week, a third straight decline, with refinancing down 2.6% and purchases down 0.8%.", "url": "https://www.benzinga.com/markets/economic-data/26/09/61947115/mortgage-rates-highest-since-2024-5-housing-stocks-kbh-rkt-len", "stocks": [{"t": "ITB", "n": "美國住宅建築 ETF，週三早盤跌 1.36%"}, {"t": "XHB", "n": "房屋建材 ETF，裝修與供應鏈的對照"}, {"t": "RKT", "n": "房貸承作商，申請量直接決定營收"}]},
    {"id": "sector_0", "channel": "產業風向", "tag": "債券代理破功", "color": "#4EABA4", "zh": "公用事業長年被當成「債券代理」——買它的人要的是穩定股息。當 5 年期美債殖利率站上 5%，這個算式就不成立了：無風險利率直接跟股息競爭，而且不必承擔監管與氣候責任風險。更麻煩的是這幾年公用事業為了滿足 AI 資料中心的用電成長，資本支出計畫大幅膨脹，在高利率下這些投資的融資成本一起被重估。當日公用事業是跌幅最大的類股之一，這不是情緒，是算式改了。", "en": "Utilities spent years being treated as a bond proxy — people bought them for the stable dividend. With the 5-year Treasury above 5%, that arithmetic breaks: the risk-free rate competes directly with the dividend and carries no regulatory or climate-liability risk. Worse, capital programmes have ballooned to serve AI data-centre load growth, and at these rates the financing cost of those programmes is being repriced too. Utilities were among the day's worst sectors, and that is a change in the maths rather than a change in mood.", "url": "https://finance.yahoo.com/markets/stocks/articles/bond-proxy-battleground-why-utilities-140542376.html", "stocks": [{"t": "XLU", "n": "公用事業 ETF，當日跌逾 1%"}, {"t": "NEE", "n": "NextEra，再生能源資本支出最重的大型公用事業"}, {"t": "VST", "n": "電力業者，AI 用電題材的代表"}]},
    {"id": "sector_1", "channel": "產業風向", "tag": "能源輪動", "color": "#4EABA4", "zh": "能源是當日唯一有像樣漲幅的類股（約 +1.1%），但它已經不是年初那種「沒人要的便宜貨」。布蘭特站上 103 美元，能源股的漲幅相當程度反映地緣風險溢價而不是需求改善——同一天的 EIA 庫存是增加的。這代表兩件事：一是油價若因美伊談判有進展而回落，能源股會跟著吐回去；二是現在加碼能源，等於同時押注「中東緊張不會緩解」。把這個隱含部位講清楚，比看類股排行有用。", "en": "Energy was the only sector with a real gain on the day (about +1.1%), but it is no longer the unloved value trade it was in January. With Brent above $103, much of the move reflects a geopolitical risk premium rather than improving demand — the same day's EIA data showed a build. Two implications follow: if oil retreats on progress in US-Iran talks, energy equities give the gain back; and adding to energy here is implicitly a bet that Middle East tension does not ease. Naming that embedded position is more useful than reading the sector leaderboard.", "url": "https://www.schwab.com/learn/story/stock-market-update-open", "stocks": [{"t": "XLE", "n": "能源類股 ETF，當日領漲約 1.1%"}, {"t": "VLO", "n": "煉油廠，裂解價差是與原油不同的另一條變數"}, {"t": "SLB", "n": "油服龍頭，反映的是資本支出而非現貨油價"}]},
    {"id": "sector_2", "channel": "產業風向", "tag": "利率敏感", "color": "#4EABA4", "zh": "把當日的贏家與輸家排在一起，會看到同一條軸線：現金流越靠後、融資依賴越高的族群跌越兇。小型股、不動產信託、以及估值最高的 AI 權值股是這條軸線上最脆弱的三塊，住宅建商則是被 7.12% 的房貸利率直接打到。撐住的是能源與工業這類「現金流在當下、且能把成本轉嫁出去」的族群。在利率定價穩下來之前，這個結構很難改變——所以現在該做的是盤點自己的部位落在軸線的哪一端。", "en": "Line up the day's winners and losers and one axis explains almost all of it: the further out a company's cash flows sit and the more it depends on external financing, the worse it did. Small caps, REITs and the most expensive AI leaders are the three most exposed blocks on that axis, while homebuilders were hit directly by 7.12% mortgage rates. What held up was energy and industrials — cash flows in the present, with the ability to pass costs through. Until rate pricing settles, that structure persists, so the useful exercise is locating your own positions on the axis.", "url": "https://finance.yahoo.com/markets/live/stock-market-today-wednesday-september-23-dow-sp-500-nasdaq-080556640.html", "stocks": [{"t": "XLRE", "n": "不動產類股 ETF，長率上衝最直接的受害者"}, {"t": "KRE", "n": "區域銀行 ETF，資金成本與商用不動產曝險雙重壓力"}, {"t": "SMH", "n": "半導體 ETF，估值最高的那一端"}, {"t": "IWM", "n": "羅素 2000 ETF，浮動利率債務佔比最高的族群"}]},
    {"id": "small_0", "channel": "小型股風雲", "tag": "浮動利率債", "color": "#5B8ED6", "zh": "小型股今年一度是全場最強——羅素 2000 年初到目前漲幅超過 21%，是 1991 年以來最好的開年。但支撐這波的敘事有一條已經被打斷：資金從過度集中的 AI 大型股輪出、併購與 IPO 回溫這兩條還在，「降息在望」這條卻反轉成升息。高盛統計羅素 2000 約 32% 成分股帶浮動利率債務，標普 500 只有 6%。這是結構性弱點而不是情緒問題，因此不會因為超賣就自己修好。", "en": "Small caps were the market's strongest group this year — the Russell 2000 is up more than 21% year-to-date, its best start since 1991. But one leg of that story has snapped: rotation out of over-concentrated mega-cap AI is intact, and so is the pickup in M&A and IPOs, yet the coming-rate-cuts leg has flipped into hikes. Goldman Sachs counts roughly 32% of Russell 2000 constituents carrying floating-rate debt versus 6% for the S&P 500. That is a structural vulnerability, not a sentiment problem, so being oversold will not fix it.", "url": "https://seekingalpha.com/article/4920445-russell-2000-soars-21-percent-ytd-4-top-small-cap-stocks", "stocks": [{"t": "VTWO", "n": "Vanguard 羅素 2000 ETF，今年迄今漲幅逾 21%"}, {"t": "IJS", "n": "標普小型價值 ETF，負債結構較保守的一端"}, {"t": "IWO", "n": "小型成長股 ETF，對利率變化最敏感"}]},
    {"id": "small_1", "channel": "小型股風雲", "tag": "資料中心散熱", "color": "#5B8ED6", "zh": "當日漲幅榜上有一檔值得注意的中小型工業股：AAON 漲 5.49%，在一片皆黑的盤勢裡逆勢走強。AAON 做商用暖通空調與資料中心冷卻設備，這條題材今年在小型工業股裡反覆出現——只要跟「把資料中心的熱帶走」有關，市場就願意給溢價。在利率主導的日子裡，能靠訂單能見度而不是估值故事撐住股價的小型股本身就是一個訊號：它說明資金並沒有全面撤出小型股，而是在挑有現金流時程的。", "en": "One small-mid industrial stood out on the day's gainers list: AAON rose 5.49% against an almost uniformly red tape. AAON makes commercial HVAC and data-centre cooling equipment, a theme that has recurred all year among smaller industrials — anything tied to removing heat from a data centre gets a premium. On a rate-driven day, a small cap that holds up on order visibility rather than a valuation story is itself a signal: money is not leaving small caps wholesale, it is selecting for a visible cash-flow timetable.", "url": "https://strongbuyanalytics.com/stock-market-outlook", "stocks": [{"t": "AAON", "n": "商用暖通與資料中心冷卻設備，當日漲 5.49%"}, {"t": "WOR", "n": "Worthington，資料中心液冷用 ASME 壓力槽供應商"}, {"t": "MOD", "n": "Modine，Climate Solutions 含資料中心冷卻"}]},
    {"id": "small_2", "channel": "小型股風雲", "tag": "題材股", "color": "#5B8ED6", "zh": "當日漲幅前段的另兩個名字是 Securitize（+13.03%）與 IonQ（+5.89%）。這類標的的共同點是市值小、故事長、現金流遠在未來——在殖利率 5% 的環境裡它們的理論價值受傷最重，但股價常常反而先漲。這不是矛盾，而是兩種資金在同一張盤上：一邊是依折現率調倉的機構，一邊是追題材的散戶流量。判讀小型股時第一步是先分清自己看的是哪一種，否則會把流量誤讀成基本面。", "en": "Two other names near the top of the day's gainers were Securitize (+13.03%) and IonQ (+5.89%). What they share is a small market cap, a long story and cash flows far in the future — precisely the profile most damaged by 5% yields, and yet they rose. That is not a contradiction but two pools of money on the same tape: institutions rebalancing on discount rates, and retail flow chasing a theme. The first step in reading small caps is knowing which one you are looking at, or you will mistake flow for fundamentals.", "url": "https://strongbuyanalytics.com/stock-market-outlook", "stocks": [{"t": "IONQ", "n": "量子運算，當日漲 5.89%"}, {"t": "ARKK", "n": "主動式創新題材 ETF，這類標的的集中持有者"}, {"t": "IWC", "n": "微型股 ETF，流量驅動最明顯的一段"}]},
    {"id": "small_3", "channel": "小型股風雲", "tag": "被動資金", "color": "#5B8ED6", "zh": "小型股有一種漲法跟基本面完全無關：指數納入。9/21 生效的羅素 2000 與羅素 3000 成分調整，讓被納入的個股在生效前後出現明顯的被動買盤，USA Rare Earth 就是近期同時有納入效應與合作案消息的例子。這種買盤是一次性的，而且時間點公開可查。實務判讀規則很簡單：若一檔小型股在納入日前後放量大漲、之後成交量掉回原本水準，那段漲幅不該算進你的投資論點裡。", "en": "There is one way small caps rise that has nothing to do with fundamentals: index inclusion. The Russell 2000 and Russell 3000 reconstitution effective September 21 produced visible passive buying in the names being added, and USA Rare Earth is a recent case where inclusion effects and a partnership announcement landed together. That bid is one-off, and its timing is public. The practical rule: if a small cap gaps up on heavy volume around the inclusion date and volume then falls back to its old level, do not count that move as evidence for your thesis.", "url": "https://finance.yahoo.com/markets/stocks/articles/two-catalysts-could-trigger-massive-131735950.html", "stocks": [{"t": "USAR", "n": "USA Rare Earth，近期同時有納入效應與合作案消息"}, {"t": "VIOO", "n": "標普小型 600 ETF，另一套成分規則的對照"}, {"t": "IWO", "n": "小型成長股 ETF，成分調整的主要載體之一"}]},
    {"id": "small_4", "channel": "小型股風雲", "tag": "流動性", "color": "#5B8ED6", "zh": "小型股在利率上升期還有一個容易被忽略的風險：流動性。當殖利率 5% 讓機構資金有了無風險替代品，最先被減碼的往往是每天成交只有幾百萬美元的名字——不是因為公司變差，而是因為部位不好處理。實務上要看兩個數字：日均成交金額（低於 200 萬美元的要當成「進得去、出不來」），以及自由流通股數佔比。這兩個數字決定你的停損在真實世界裡執不執行得了，比本益比更該先算。", "en": "Rising rates bring a small-cap risk that is easy to overlook: liquidity. Once 5% yields give institutions a risk-free alternative, the first names trimmed are often those trading only a few million dollars a day — not because the business deteriorated but because the position is hard to move. Two numbers matter in practice: average daily dollar volume (below $2 million, treat it as easy to enter and hard to exit) and free float as a share of outstanding stock. Those two decide whether your stop-loss is executable in the real world, and they come before the P/E.", "url": "https://www.vtmarkets.com/discover/russell-2000-index-trading-guide-2026-small-cap-investment-strategies/", "stocks": [{"t": "IJR", "n": "標普小型 600 ETF，成分股有獲利門檻、流動性相對好"}, {"t": "VBR", "n": "小型價值 ETF，持股分散度較高"}, {"t": "IWC", "n": "微型股 ETF，流動性風險最集中的一端"}]},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "分拆轉型", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10/01 分拆分派完成", "zh": "Modine Manufacturing（MOD）做什麼：原本是車用與工業熱交換器製造商，正在把 Performance Technologies（車用零件）整包分拆出去。為什麼被忽視：它長年被歸類在汽車零件供應鏈，市場用汽車循環的估值看它，而留下來的 Climate Solutions 事業做的是商用暖通、室內空氣品質與資料中心冷卻。什麼正在改變：公司已定 9/28 為分拆基準日，SpinCo 股份 10/1 分派，隨即以反向莫里斯信託與 Gentherm 合併；Gentherm 同時宣布每股約 1.90 美元、總額約 5,835 萬美元的特別現金股利，10/7 發放。分拆完成後 MOD 會是一家純冷卻公司，估值的分母整個換掉。風險與反方論點：分拆後營收規模縮小、資料中心冷卻競爭激烈（AAON、Worthington、Vertiv 都在搶），交易本身還有稅務與執行風險，且新結構的第一份完整財報要等到明年。這是研究線索，不是投資建議。", "en": "What Modine (MOD) does: historically a vehicular and industrial heat-exchanger maker, now separating its Performance Technologies (automotive) business entirely. Why it is ignored: it has long been screened as an auto supplier and valued on the auto cycle, while the retained Climate Solutions business sells commercial HVAC, indoor air quality and data-centre cooling. What is changing: the board set September 28 as the SpinCo record date with distribution on October 1, immediately followed by a Reverse Morris Trust merger into Gentherm; Gentherm declared a special cash dividend of roughly $1.90 per share, about $58.35 million in total, payable October 7. Once done, MOD is a pure cooling company and the valuation denominator changes entirely. Risks and the bear case: smaller revenue base post-spin, crowded competition in data-centre cooling (AAON, Worthington, Vertiv), tax and execution risk in the transaction itself, and no clean full quarter under the new structure until next year. A research lead, not investment advice.", "url": "https://www.globenewswire.com/news-release/2026/09/17/3364397/0/en/gentherm-and-modine-manufacturing-company-announce-additional-information-in-connection-with-proposed-combination-of-gentherm-and-modine-s-performance-technologies-business.html", "stocks": [{"t": "MOD", "n": "Modine，9/28 分拆基準日、10/1 分派後成為純冷卻公司"}, {"t": "THRM", "n": "Gentherm，反向莫里斯信託的收購方、宣布每股約 1.90 美元特別股利"}, {"t": "AAON", "n": "資料中心冷卻的直接競爭者，可做估值對照"}]},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "液冷壓力槽", "color": "#C9A227", "status": "RADAR · 下一個驗證點 12 月 FQ2 財報（ASME 槽營收是否真的逐季成長）", "zh": "Worthington Enterprises（WOR）做什麼：工業與消費用壓力容器製造商（瓦斯鋼瓶、水系統、戶外用品），是典型沒什麼人寫研究報告的成熟工業股。為什麼被忽視：市場把它當成跟房市與戶外消費連動的低成長標的。什麼正在改變：9 月公布的 FY2027 第一季，調整後每股盈餘 0.82 美元、營收 3.439 億美元，分別超出市場預期 9.3% 與 3.8%；真正的亮點是資料中心液冷用的工程型 ASME 壓力槽單季貢獻 1,300 萬美元營收——等於整個 FY2026 全年的量。管理層預期這條線在 FY2027 剩下三季逐季成長，並估算液冷與熱管理用 ASME 槽的潛在市場是傳統市場的十倍以上。財報後股價單日跳漲近 16%。風險與反方論點：1,300 萬在 3.44 億營收裡佔比仍小，「十倍市場」是管理層說法而非在手訂單；股價已先反映一段，而傳統事業仍被房市與高利率壓著。這是研究線索，不是投資建議。", "en": "What Worthington Enterprises (WOR) does: makes industrial and consumer pressure vessels — gas cylinders, water systems, outdoor products — a mature industrial almost nobody writes research on. Why it is ignored: it is screened as a low-growth name tied to housing and outdoor consumer spending. What is changing: fiscal 2027 first-quarter results in September showed adjusted EPS of $0.82 on revenue of $343.9 million, beating consensus by 9.3% and 3.8%. The real item was engineered ASME tanks for data-centre liquid cooling contributing $13 million of revenue in one quarter — equal to the entire fiscal 2026 total for that line. Management expects sequential growth in each remaining fiscal 2027 quarter and estimates the addressable market for liquid-cooling and thermal-management ASME tanks at more than ten times the legacy market. The stock jumped nearly 16% in a day on the print. Risks and the bear case: $13 million is still small against $343.9 million, the ten-times figure is management commentary rather than backlog, the stock has already repriced, and the legacy business remains pressured by housing and high rates. A research lead, not investment advice.", "url": "https://seekingalpha.com/news/4646187-worthington-expects-asme-tank-revenue-to-grow-sequentially-as-data-center-liquid-cooling", "stocks": [{"t": "WOR", "n": "Worthington，FQ1 調整後 EPS 0.82 美元、ASME 槽營收 1,300 萬"}, {"t": "VRT", "n": "Vertiv，資料中心熱管理的規模對照組"}, {"t": "XLI", "n": "工業 ETF，成熟工業股的族群基準"}]},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "油輪運價", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報（現貨運價與在手合約日費）", "zh": "Teekay Tankers（TNK）做什麼：蘇伊士型與阿芙拉型原油輪船東，營收以現貨市場為主。為什麼被忽視：航運股的循環性讓多數機構懶得長期覆蓋，願意覆蓋的又常只在運價高點發聲。什麼正在改變（池內更新）：這檔 9/21 剛在本報更新過驗證點，今天的新資訊是供應路線本身——沙烏地準備重啟東西向輸油管以繞過荷姆茲海峽，布蘭特同日漲 3.86% 到 103.08 美元。對船東而言，原油被迫繞遠是運價的正向變數（噸海里增加），供應路線正常化則相反。也就是說中東局勢對 TNK 是雙向的，不是單邊利多，這一點入池時沒寫清楚。風險與反方論點：現貨運價波動極大，單季高運價不等於全年；若美伊談判成局，風險溢價與繞航需求會同時消失。這是研究線索，不是投資建議。", "en": "What Teekay Tankers (TNK) does: owns Suezmax and Aframax crude tankers, with revenue driven mainly by the spot market. Why it is ignored: shipping cyclicality keeps most institutions from covering it consistently, and those who do tend to speak only at rate peaks. What is changing (pool update): this name's checkpoint was refreshed in this brief on September 21; today's new information is the supply route itself — Saudi Arabia is preparing to restart its East-West pipeline to bypass the Strait of Hormuz, while Brent rose 3.86% to $103.08 the same day. For a tanker owner, crude forced onto longer routes is positive for rates via tonne-miles, and route normalisation is the opposite. Middle East developments are therefore two-way for TNK rather than one-way bullish, which the original pool entry did not make explicit. Risks and the bear case: spot rates are extremely volatile and one strong quarter is not a year; if US-Iran talks succeed, both the risk premium and the re-routing demand disappear at once. A research lead, not investment advice.", "url": "https://tradingeconomics.com/commodity/brent-crude-oil", "stocks": [{"t": "TNK", "n": "Teekay Tankers，蘇伊士型現貨曝險最直接"}, {"t": "INSW", "n": "International Seaways，同船型對照組"}, {"t": "FRO", "n": "Frontline，規模較大的油輪船東對照"}]},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "區域銀行", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月下旬 Q3 財報（NIM 與 CRE 逾期率）", "zh": "Five Star Bancorp（FSBC）做什麼：加州沙加緬度的社區銀行控股公司，市值小、機構覆蓋極少。為什麼被忽視：這個規模的社區銀行幾乎不在任何賣方的覆蓋名單上，股價完全由本地存款結構與商用不動產（CRE）曝險決定。什麼正在改變（池內環境更新）：入池時的論點建立在「降息會鬆開存款成本」，但 9/16 聯準會升息、5 年期美債站上 5%，這個前提反轉了。升息對社區銀行是兩面刃——資產端重定價有利淨息差，負債端存款競爭與 CRE 借款人的續貸壓力則同步升高。原本的驗證點（10 月下旬 Q3 財報看淨息差）沒變，但要問的問題換了：淨息差撐住是靠資產重定價，還是靠拉高借款堆量。風險與反方論點：CRE 逾期率在 7% 房貸利率與 5% 國債殖利率下可能惡化；小型銀行在利率震盪期的未實現債券損失也要看。這是研究線索，不是投資建議。", "en": "What Five Star Bancorp (FSBC) does: a community bank holding company in Sacramento, California — small cap with almost no institutional coverage. Why it is ignored: banks this size sit on virtually no sell-side coverage list, and the stock is driven entirely by local deposit mix and commercial real estate exposure. What is changing (pool environment update): the original thesis assumed cuts would loosen deposit costs, but the Fed's September 16 hike and a 5-year Treasury above 5% reversed that premise. Hikes cut both ways for a community bank — asset repricing helps net interest margin, while deposit competition and refinancing pressure on CRE borrowers rise at the same time. The checkpoint is unchanged (late-October Q3 results, watching NIM) but the question is different: is NIM holding on asset repricing or on piling up borrowings? Risks and the bear case: CRE delinquencies could deteriorate with 7% mortgages and 5% Treasuries, and unrealised bond losses at small banks deserve a look in a volatile rate regime. A research lead, not investment advice.", "url": "https://www.cnbc.com/2026/09/16/fed-rate-decision-september-2026.html", "stocks": [{"t": "FSBC", "n": "Five Star Bancorp，沙加緬度社區銀行、CRE 曝險為核心變數"}, {"t": "KRE", "n": "區域銀行 ETF，同族群的環境對照"}, {"t": "STBA", "n": "S&T Bancorp，池內同類型的賓州社區銀行"}]},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "可負擔住宅", "color": "#C9A227", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（同店租金增速與出租率）", "zh": "UMH Properties（UMH）做什麼：製造住宅（活動住宅社區）不動產信託，出租土地與房屋給住戶。為什麼被忽視：市值小、屬於不動產信託裡最冷門的子類，主流住宅 REIT 研究幾乎不碰。什麼正在改變（池內環境更新）：30 年期房貸利率升到 7.12%、是 2024 年以來最高，Lennar 自己承認在 6.8% 的利率下已有近半來客無法取得貸款。買不起傳統住宅的需求會往下遊走，製造住宅是其中一個承接口——這是 UMH 出租率與租金成長的外部順風。但同一個利率環境也直接壓 REIT 的估值與再融資成本，所以這張卡的重點是：同一個變數對 UMH 的營運面是順風、對股價面是逆風，必須分開看，不要混成一個結論。風險與反方論點：REIT 對長率的敏感度極高；售屋業務的利潤率在利率高檔時會被壓縮；小型 REIT 的股權融資成本也在上升。這是研究線索，不是投資建議。", "en": "What UMH Properties (UMH) does: a manufactured-housing REIT that leases land and homes to residents. Why it is ignored: small cap in the least fashionable REIT sub-sector, largely untouched by mainstream residential REIT research. What is changing (pool environment update): the 30-year mortgage rate has climbed to 7.12%, the highest since 2024, and Lennar itself concedes that near 6.8% almost half of its visitors cannot qualify for a mortgage. Demand priced out of conventional housing moves down-market, and manufactured housing is one of the catches — an external tailwind for UMH's occupancy and rent growth. But the same rate environment directly pressures REIT valuations and refinancing costs, so the point of this card is that one variable is a tailwind operationally and a headwind for the share price, and the two must be kept apart. Risks and the bear case: REITs are highly sensitive to long rates, home-sales margins compress at high rates, and equity financing costs for small REITs are rising too. A research lead, not investment advice.", "url": "https://www.benzinga.com/markets/economic-data/26/09/61947115/mortgage-rates-highest-since-2024-5-housing-stocks-kbh-rkt-len", "stocks": [{"t": "UMH", "n": "UMH Properties，製造住宅 REIT，出租率與租金為核心指標"}, {"t": "ELS", "n": "Equity LifeStyle，同子類的大型對照組"}, {"t": "LEN", "n": "Lennar，近半來客無法取得貸款的那一端"}]},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "航電微型股", "color": "#C9A227", "status": "RADAR · 下一個驗證點 10 月 FQ4 財報（毛利率能否守在 50% 以上）", "zh": "Innovative Solutions and Support（ISSC）做什麼：微型市值航電廠，做飛機的空速與高度儀表系統、自動節流閥與整合駕駛艙，客戶含軍用與商用改裝市場。為什麼被忽視：市值太小、機構覆蓋屈指可數，而且營收會隨單筆合約大幅跳動，讓模型很難建。什麼正在改變（池內追蹤）：論點核心是它近幾季靠併購來的產品線把毛利率推上 50% 以上；接下來要驗證的是這個毛利率是結構性的，還是單季產品組合造成的。在利率環境轉向、小型股整體承壓的背景下，這種「獲利品質可以驗證」的微型股反而比題材型微型股好判讀——因為驗證點是一個數字，不是一個故事。風險與反方論點：單一客戶與單一合約集中度高；併購後的整合成本可能吃掉毛利改善；流動性極差，出場成本要先算進去再談報酬。這是研究線索，不是投資建議。", "en": "What Innovative Solutions and Support (ISSC) does: a micro-cap avionics maker producing air data and altitude systems, autothrottles and integrated flight decks for military and commercial retrofit customers. Why it is ignored: too small for coverage, with a handful of institutions following it, and revenue that jumps with single contracts, which makes modelling hard. What is changing (pool tracking): the thesis rests on acquired product lines pushing gross margin above 50% in recent quarters, and what needs verifying is whether that margin is structural or a one-quarter mix effect. With rates turning and small caps under pressure generally, a micro cap whose earnings quality can be checked is easier to read than a thematic one, because the checkpoint is a number rather than a story. Risks and the bear case: high single-customer and single-contract concentration, integration costs that could eat the margin gain, and very thin liquidity — price the exit before discussing the return. A research lead, not investment advice.", "url": "https://stockanalysis.com/stocks/issc/", "stocks": [{"t": "ISSC", "n": "航電微型股，毛利率 50% 是論點的生死線"}, {"t": "HONA", "n": "Honeywell Aerospace，池內的大型航太對照組"}, {"t": "ITA", "n": "航太國防 ETF，族群基準"}]},
    {"id": "insider_0", "channel": "內部人動向", "tag": "群聚買進", "color": "#6DB56D", "zh": "Fluence Energy（FLNC）出現教科書式的群聚買進：董事 Harald von Heynitz 以均價 7.36 美元買進 7,000 股，直接持股增加約 12%；董事 Herman Bulls 同樣以 7.36 美元買進 10,000 股，部位增加約 6%。兩人同價買進、時間相近，這是 Form 4 裡最值得看的型態——不是一個人的判斷，是兩個人在同一個價位下同一個注。判讀提醒：群聚買進說明內部人認為賣壓過頭，但它不會解決公司本身的營運與法律爭議，而且金額（各約五到七萬美元）相對持股價值並不算大。", "en": "Fluence Energy (FLNC) produced a textbook cluster buy: director Harald von Heynitz bought 7,000 shares at an average $7.36, lifting his direct holding by about 12%, while director Herman Bulls bought 10,000 shares at the same $7.36, raising his position by roughly 6%. Two insiders buying at the same price within days is the most informative pattern in Form 4 data — not one person's judgement but two placing the same bet at the same level. Read it carefully: a cluster buy says insiders think the selloff overshot, but it does not resolve the company's operational and legal issues, and the dollar amounts (roughly $50,000 to $75,000 each) are modest relative to their holdings.", "url": "https://www.defenseworld.net/2026/09/23/fluence-energy-nasdaqflnc-director-herman-bulls-acquires-10000-shares-of-stock", "stocks": [{"t": "FLNC", "n": "Fluence Energy，兩位董事同以 7.36 美元買進"}, {"t": "STEM", "n": "儲能軟體與服務，同族群的對照組"}, {"t": "ICLN", "n": "清潔能源 ETF，族群基準"}]},
    {"id": "insider_1", "channel": "內部人動向", "tag": "大戶動向", "color": "#6DB56D", "zh": "波克夏在 9/17 到 9/21 之間買進超過 270 萬股 Lennar A 與 B 股，加權平均成本區間 74.80 到 79.41 美元，持股突破 10%、總部位 2,370 萬股約 18 億美元。時間點是關鍵：它是在 Lennar 財報不如預期、並把全年交屋目標下調到 8.0 萬至 8.1 萬戶的隔天加碼的。判讀提醒：突破 10% 之後波克夏變成申報義務人，之後的增減會用 Form 4 即時揭露，追蹤成本遠低於等 13F。另一個對照是賣方看法——目前多數分析師給 LEN 賣出評等、目標價低於現價，這正是「大戶與賣方分歧」的典型場面。", "en": "Berkshire Hathaway bought more than 2.7 million Lennar Class A and B shares between September 17 and 21 at weighted-average prices ranging from $74.80 to $79.41, taking its stake past 10% and the position to 23.7 million shares worth about $1.8 billion. The timing matters: it added the day after Lennar missed and cut its full-year delivery guidance to 80,000-81,000 homes. Read it carefully: above 10%, Berkshire becomes a reporting insider, so further changes show up in Form 4 filings in near real time rather than a delayed 13F. The other contrast is the sell side — most analysts currently rate LEN a sell with price targets below the market, a textbook case of a large holder disagreeing with the Street.", "url": "https://www.cnbc.com/2026/09/22/lennar-shares-pop-as-berkshire-builds-almost-a-10percent-stake-in-beleaguered-homebuilder.html", "stocks": [{"t": "LEN", "n": "Lennar，波克夏持股突破 10%、成本 74.80–79.41 美元"}, {"t": "BRK.B", "n": "波克夏，買方本身"}, {"t": "DHI", "n": "D.R. Horton，同業對照組"}, {"t": "ITB", "n": "住宅建築 ETF，族群基準"}]},
    {"id": "insider_2", "channel": "內部人動向", "tag": "Form 4 判讀", "color": "#6DB56D", "zh": "能源類的內部人買進在八、九月明顯增加，其中一筆值得單獨看：Solaris Energy Infrastructure 董事 A. James Teague 與配偶在 9/8 於 64.20 到 64.23 美元之間做了多筆公開市場買進。Solaris 提供油氣與資料中心用的電力與設備服務，市值約 40 億美元。判讀提醒三點：一是要確認 Form 4 的交易代碼是「P」（公開市場買進、自掏現金），不是選擇權執行或股票獎勵；二是配偶帳戶執行同樣算內部人申報，但決策歸屬要留意；三是單一董事買進的訊號強度遠低於群聚買進，要等第二位跟進才算。", "en": "Insider buying among energy names picked up noticeably through August and September, and one filing deserves its own look: Solaris Energy Infrastructure director A. James Teague and his spouse made multiple open-market purchases on September 8 at prices between $64.20 and $64.23. Solaris supplies power and equipment services to oil and gas and to data centres, with a market capitalisation near $4.0 billion. Three notes on reading this: confirm the Form 4 transaction code is a P (open-market purchase with the insider's own cash) rather than an option exercise or award; spouse-account purchases are reportable but attribution of the decision is less clean; and a single director buying is a far weaker signal than a cluster, so wait for a second filer.", "url": "https://finance.yahoo.com/markets/stocks/articles/solaris-energy-director-buys-nearly-213656671.html", "stocks": [{"t": "SEI", "n": "Solaris Energy Infrastructure，董事夫婦 9/8 於 64.20–64.23 美元買進"}, {"t": "SKIL", "n": "Skillsoft，執行長 9/21 以均價 6.10 美元買進 8,325 股"}, {"t": "XOP", "n": "油氣探勘生產 ETF，能源族群基準"}]},
    {"id": "capitol_0", "channel": "政要持股", "tag": "PTR 揭露", "color": "#B5654D", "zh": "本期最值得看的一組申報來自佛州眾議員 Scott Franklin，他在 9/17 到 9/19 間陸續揭露八月下旬的一批交易：8/20 賣出 Alphabet、JPMorgan 與 Apple（各 1,001 到 15,000 美元級距），8/26 買進 PepsiCo、McDonald's 與 Novo Nordisk（同級距），另買進 Accenture 6,006 到 90,000 美元。挑這一組不是因為申報人的名字，是因為底下的假設很清楚——從「七雄」與大型金融換到核心消費與 GLP-1，是一筆押在防禦性現金流的錢。有人用真錢投票給這個主題，值得記下來；主題對不對，得自己判斷。", "en": "The disclosure worth reading this cycle comes from Florida Representative Scott Franklin, who filed a batch of late-August trades between September 17 and 19: sales of Alphabet, JPMorgan and Apple on August 20 (each in the $1,001-$15,000 band), purchases of PepsiCo, McDonald's and Novo Nordisk on August 26 (same band), plus Accenture in the $6,006-$90,000 band. This group was chosen not for the filer's name but because the underlying assumption is legible — rotating out of the Magnificent Seven and large financials into consumer staples and GLP-1 is money placed on defensive cash flows. Someone voted for that theme with real money, which is worth noting; whether the theme is right is your call.", "url": "https://www.benzinga.com/news/politics/26/09/61881383/congressman-ditches-magnificent-seven-stocks-for-consumer-staples-heres-what-he-bought", "stocks": [{"t": "PEP", "n": "PepsiCo，8/26 申報買進"}, {"t": "MCD", "n": "McDonald's，8/26 申報買進"}, {"t": "NVO", "n": "Novo Nordisk，8/26 申報買進"}, {"t": "ACN", "n": "Accenture，8/26 買進，金額級距最大"}, {"t": "GOOGL", "n": "Alphabet，8/20 申報賣出"}]},
    {"id": "capitol_1", "channel": "政要持股", "tag": "45 天延遲", "color": "#B5654D", "zh": "每天換一個角度講同一件事：這個頻道的資料為什麼天生不是買賣訊號。今天的角度是時間差。上面那組交易發生在 8/20 與 8/26，揭露日是 9/17 到 9/19，中間隔了三到四週；STOCK Act 允許的上限是 45 天。關鍵在於這段空窗裡發生了什麼——9/16 聯準會升息到 3.75% 至 4.00%，10 年期殖利率一路衝到 5.135%。申報人是在升息定案之前做的決定，你現在跟單買到的是升息之後的價格，兩者面對的世界並不相同。另外兩個結構性限制也要記住：金額只有寬區間（1,001 到 15,000 這種），而且多數交易由配偶或信託帳戶執行。", "en": "Each day, one more angle on the same point: why this channel's data is not a trading signal by construction. Today's angle is the time gap. Those trades happened on August 20 and 26 and were disclosed between September 17 and 19 — three to four weeks later, against the STOCK Act's 45-day limit. What matters is what happened inside that window: on September 16 the Fed raised rates to 3.75%-4.00% and the 10-year yield ran to 5.135%. The filer decided before the hike was settled; anyone copying the trade now buys at post-hike prices. Two structural limits also stand: amounts come only as wide bands ($1,001-$15,000 and the like), and most transactions are executed in spouse or trust accounts.", "url": "https://www.congress.gov/crs_external_products/TE/HTML/TE10073.html", "stocks": [{"t": "SPY", "n": "大盤對照，衡量 45 天延遲期間的價格變化"}, {"t": "TLT", "n": "長天期美債 ETF，這段空窗裡真正動的是它"}, {"t": "NANC", "n": "追蹤民主黨籍申報人持股的 ETF"}, {"t": "GOP", "n": "追蹤共和黨籍申報人持股的 ETF"}]},
    {"id": "week_0", "channel": "本週事件", "tag": "數據排程", "color": "#C97DD4", "zh": "接下來幾個交易日的總經數據排程，順序決定市場節奏：9/29 成屋待完成銷售與達拉斯聯準銀行製造業指數；9/30 JOLTS 職缺、FHFA 房價指數、芝加哥採購經理人指數與消費者信心；10/1 ADP 民間就業、ISM 製造業指數、營建支出與 EIA 原油庫存；10/2 初領失業金、Challenger 裁員與工廠訂單，同日還有勞工統計局的非農就業報告（東部時間上午 8:30）。在「還會不會再升息」是主戰場的當下，就業與物價這兩組數據的權重遠高於其他。", "en": "The macro calendar over the next several sessions, in the order that will set the tempo: September 29 brings pending home sales and the Dallas Fed manufacturing index; September 30 has JOLTS openings, the FHFA house price index, Chicago PMI and consumer confidence; October 1 delivers ADP private payrolls, ISM manufacturing, construction spending and the EIA crude report; October 2 has initial claims, Challenger job cuts and factory orders, plus the BLS employment situation report at 8:30 a.m. ET. With the argument centred on whether another hike is coming, the labour and price data carry far more weight than the rest.", "url": "https://us.econoday.com/", "stocks": [{"t": "IEF", "n": "7–10 年期美債 ETF，數據直接反映在殖利率"}, {"t": "UUP", "n": "美元指數 ETF，利差擴大的受益端"}, {"t": "DIA", "n": "道瓊 ETF，景氣循環股權重較高"}, {"t": "XLP", "n": "核心消費 ETF，消費者信心的對應族群"}]},

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);

  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;

    <div style={{ padding:"10px 32px 32px" }}>

      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>

          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>

        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums" }}>{r.n}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>
                      <span style={{ color:"#6DB56D" }}>{r.buy}</span>
                      <span style={{ color:"var(--text-tertiary)" }}> / </span>
                      <span style={{ color:"#E05C5C" }}>{r.sell}</span>
                    </td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", fontVariantNumeric:"tabular-nums", whiteSpace:"nowrap" }}>{money(r.lo)}–{money(r.hi)}</td>
                    <td style={{ padding:"7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", whiteSpace:"nowrap" }}>
                      {r.top.map(t => (
                        <a key={t} href={"https://www.tradingview.com/symbols/" + t + "/"} target="_blank" rel="noopener noreferrer"
                           style={{ color:"var(--text-secondary, inherit)", textDecoration:"none", marginRight:"7px", fontFamily:"'Courier New',monospace" }}>{t}</a>
                      ))}
                      <span style={{ color:"var(--text-tertiary)", fontSize:"10px" }}>共 {r.distinct} 檔</span>
                    </td>
                    <td style={{ padding:"7px 0 7px 8px", borderBottom:"1px solid var(--border, rgba(128,128,128,0.12))", textAlign:"right", color:"var(--text-tertiary)", whiteSpace:"nowrap" }}>{r.last}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ padding:"12px 16px 0", fontSize:"10px", lineHeight:1.6, color:"var(--text-tertiary)" }}>
            只涵蓋眾議院；參議院走另一套 efdsearch 系統，尚未納入。買＋賣不一定等於筆數，差額是交換（exchange）類交易。
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/24/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v12.1</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
