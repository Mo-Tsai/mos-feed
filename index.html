<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
// 只合成、不播放:回傳音訊 blob URL。連續播放靠它「唸這張的同時預抓下一張」,
// 唸完才能零延遲接播 — iOS 背景會凍結 timer 與網路,唸完後再打 API 就來不及了。
async function _azSynthUrl(text, { rate='0%', speakLang='en', tailMs=0, signal }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  if (!key) return null;
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  const token = await _getAzToken(key, region, signal);
  const style = localStorage.getItem(conf.styleKey) || '';
  const useStyle = style && STYLE_VOICES.has(voice);
  const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
  const inner = `<prosody rate='${rate}'>${body}</prosody>`;
  const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
  // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
  const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
  // 卡與卡之間的停頓直接燒進音檔尾端:背景時 setTimeout 會被 iOS 凍結,不能靠 timer 停頓
  const silence = tailMs > 0 ? `<mstts:silence type='Tailing-exact' value='${tailMs}ms'/>` : '';
  const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${silence}${styled}</voice></speak>`;
  const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
    method:'POST', signal,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
    body:ssml
  });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}
async function azureSpeak(text, { rate='0%', speakLang='en', tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  if (!preUrl && !(localStorage.getItem('mf_azureKey') || '')) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const url = preUrl || await _azSynthUrl(text, { rate, speakLang, tailMs, signal: ctrl.signal });
    if (!url) return false;
    if (ctrl.signal.aborted) { try { URL.revokeObjectURL(url); } catch(e) {} return true; }
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 預先合成下一張的音訊(不播放、不動當前播放的 abort controller);失敗回 null,播放時會再試或退回瀏覽器 TTS
async function speakPrefetch(rawText, { speakLang='zh', azRate='0%', tailMs=0 }={}) {
  try { return await _azSynthUrl(normalizeForSpeech(rawText, speakLang), { rate: azRate, speakLang, tailMs }); }
  catch(e) { _azToken = null; return null; }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, tailMs=0, preUrl=null, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, tailMs, preUrl, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) { if (tailMs > 0) setTimeout(onEnd, tailMs); else onEnd(); } };   // 瀏覽器 TTS 沒有音檔尾端靜音,停頓用 timer 補(僅前景有效)
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "政要持股", color: "#B5654D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    {"id": "overnight_0", "channel": "隔夜盤勢", "tag": "地緣殺盤", "color": "#E05C5C", "stocks": [{"t": "DIA", "n": "道瓊 ETF，昨日道瓊跌 1.18% 收 52,786.07 點、三大指數中跌最重"}, {"t": "SPY", "n": "標普 500 ETF，昨日標普跌 0.58% 收 7,673.52 點"}, {"t": "QQQ", "n": "那斯達克 100 ETF，科技股相對抗跌、那斯達克僅跌 0.32%"}], "en": "Wall Street reopened after Labor Day with losses across the board: the Dow fell 1.18% to 52,786.07, the S&P 500 dropped 0.58% to 7,673.52 and the Nasdaq slipped 0.32% to 26,421.41. The driver was neither earnings nor rates but renewed Middle East hostilities, with Iran-aligned Houthi drone and missile strikes on Saudi Aramco installations forcing several facilities offline. The Dow's underperformance suggests the selling targeted real-economy exposure rather than valuation.", "zh": "美股週二重新開盤就收黑，道瓊跌 1.18% 收 52,786.07 點、標普 500 跌 0.58% 收 7,673.52 點、那斯達克跌 0.32% 收 26,421.41 點。跌勢的主因不是財報也不是利率，而是中東戰事再起：親伊朗的青年運動對沙烏地南部多座能源設施發動無人機與彈道飛彈攻擊，沙國能源部證實數座油廠與公用設施暫停運作。這是這一週唯一四個交易日的第一天，市場在勞動節連假後直接面對一個新的風險來源。道瓊跌得比那斯達克重，代表殺的是實體經濟曝險而非估值。", "url": "https://finance.yahoo.com/markets/stocks/articles/stock-market-today-sept-8-133744027.html"},
    {"id": "overnight_1", "channel": "隔夜盤勢", "tag": "醫療重挫", "color": "#E05C5C", "stocks": [{"t": "NVS", "n": "諾華，兩項臨床試驗同日失敗、單日重挫 12%"}, {"t": "AMGN", "n": "安進，遭 BMO Capital 以評價為由降評、下跌 8%"}, {"t": "BSX", "n": "波士頓科學，資安事件衝擊營運、坦言全年營收目標難達成"}], "en": "The real single-stock damage was in healthcare. Novartis plunged 12% after disclosing two separate failed trials, one neuromuscular and one cardiovascular. Amgen fell 8% on a BMO Capital downgrade to Market Perform on valuation. Boston Scientific slipped about 2% after saying a cybersecurity incident makes its full-year net sales guidance unlikely to be met. Three unrelated events, one sector taken down together.", "zh": "昨天真正的個股災難發生在醫療保健。諾華 (Novartis) 一口氣公布兩項臨床試驗失敗，一項在神經肌肉領域、一項在心血管與膽固醇領域，股價重挫 12%。安進 (Amgen) 被 BMO Capital 以評價過高為由降評至中性，下跌 8%。波士頓科學 (Boston Scientific) 則說一起資安事件影響營運，全年淨銷售目標「不太可能」達成，跌約 2%。三則消息互不相干，卻讓醫療保健成為當日最弱的板塊之一。", "url": "https://investrade.com/market-review-september-08-2026/"},
    {"id": "overnight_2", "channel": "隔夜盤勢", "tag": "油債齊揚", "color": "#E05C5C", "stocks": [{"t": "USO", "n": "美國原油基金，布蘭特盤中觸及 99.22 美元、7 月下旬以來最高"}, {"t": "TLT", "n": "20 年期以上公債 ETF，30 年期殖利率升至 5.27%、長債價格承壓"}, {"t": "GLD", "n": "黃金 ETF，實質利率走高使避險買盤未能全面接手"}], "en": "Commodities and bonds both priced in sticky inflation. Brent touched $99.22 a barrel intraday, its strongest since 24 July, while WTI traded in the $92-94 range. The US 10-year yield sat at 4.80% and the 30-year at 5.27%: long rates did not fall with equities, which means the market read the oil spike as an inflation story rather than a flight-to-safety one. That combination is worst for leveraged, rate-sensitive names.", "zh": "商品與債市昨天同步往「通膨還沒走」的方向定價。布蘭特原油盤中一度觸及每桶 99.22 美元，是 7 月 24 日以來最強，西德州中級原油也漲至 92 至 94 美元一帶。美國 10 年期公債殖利率來到 4.80%、30 年期 5.27%，長天期利率沒有因為股市下跌而走低，代表市場把這次油價上衝解讀成通膨題材而不是避險題材。這個組合對高負債、對利率敏感的族群最不利。", "url": "https://www.cnbc.com/2026/09/08/oil-prices-today-brent-wti-hormuz-iran-war.html"},
    {"id": "overnight_3", "channel": "隔夜盤勢", "tag": "電力領漲", "color": "#E05C5C", "stocks": [{"t": "BE", "n": "Bloom Energy，納入標普 500 指數帶動被動買盤、單日漲 8%"}, {"t": "AMD", "n": "超微，喊出 2 兆美元人工智慧可及市場、股價漲約 7%"}, {"t": "XLE", "n": "能源類股 ETF，油價衝高使能源成為當日最強板塊"}], "en": "Two pockets stayed green: energy and power. Bloom Energy rose 8%, not on oil but on its addition to the S&P 500, which forces passive buying. AMD gained roughly 7% as the chipmaker framed a $2 trillion AI addressable market. Money did not leave risk assets yesterday; it moved from healthcare and financials into energy, power and compute. Index red with rotation intact is a very different thing from systematic deleveraging.", "zh": "在一片綠中仍有兩個口袋是紅的：能源與電力。Bloom Energy 上漲 8%，理由不是油價而是它被納入標普 500 指數，被動資金必須買。超微半導體 (AMD) 上漲約 7%，公司把人工智慧的可及市場喊到 2 兆美元規模。這兩檔一起漲說明昨天的資金並沒有離開風險資產，只是從醫療與金融搬到能源、電力與運算。指數收黑但輪動仍在運作，這跟系統性去槓桿是兩回事。", "url": "https://investrade.com/market-review-september-08-2026/"},
    {"id": "earn_0", "channel": "財報速報", "tag": "靠投資賺錢", "color": "#E8786A", "stocks": [{"t": "GME", "n": "GameStop，淨銷售自 9.72 億降至 7.8-8.0 億、淨利 2.9-3.1 億中約 2.38 億為投資利益"}, {"t": "EBAY", "n": "eBay，GameStop 持股的投資利益來源、本季獲利的主要貢獻者"}, {"t": "BBY", "n": "百思買，實體電子零售的對照組，本業營收趨勢的參照"}], "en": "GameStop's fiscal Q2 print matters more for its composition than its size. Net sales of $780-800 million fell sharply from $972.2 million a year ago, while operating income jumped to $150-170 million from $66.4 million and net income reached $290-310 million, of which roughly $238 million came from eBay-related investment gains. The core retail business is still shrinking; the reported profit is largely a balance-sheet outcome.", "zh": "GameStop 週二盤後交出第二季成績，數字的組成比金額本身更值得看。淨銷售落在 7.8 至 8.0 億美元，比去年同期的 9.72 億美元明顯下滑；營業利益 1.5 至 1.7 億美元，卻比去年的 6,640 萬大幅跳升；淨利 2.9 至 3.1 億美元，其中約 2.38 億來自 eBay 相關的投資利益。換句話說，本業營收還在萎縮，帳面獲利主要是資產負債表操作的結果。這是一家零售商，還是一檔投資控股公司，這一季的財報沒有給出安慰的答案。", "url": "https://247wallst.com/cards/gamestop-reports-at-4-02-pm-et-today-and-with-an-8-6-billi-gme-earnings-calendar-01m20401g3t0w4mk0rdj07cef6"},
    {"id": "earn_1", "channel": "財報速報", "tag": "超標仍被殺", "color": "#E8786A", "stocks": [{"t": "BRZE", "n": "Braze，營收年增 26% 至 2.27 億美元、盤後仍重挫 12.11%"}, {"t": "HUBS", "n": "HubSpot，同樣以行銷與客戶互動為核心的訂閱制對照組"}, {"t": "TWLO", "n": "Twilio，客戶互動基礎建設端的對照組，變現節奏同受檢視"}], "en": "Braze grew Q2 revenue 26% year over year to $227 million, beating estimates, yet shares fell another 12.11% after hours to $26.64 on top of a 5.16% decline in the regular session. It is the pattern of this earnings season: meeting the number without showing acceleration invites an immediate valuation reset. For subscription software, 26% growth was a strength two years ago and is now merely a pass, especially when investors are looking for AI monetisation to inflect.", "zh": "客戶互動軟體商 Braze 第二季營收年增 26% 至 2.27 億美元，超越市場預期，股價卻在盤後再跌 12.11% 至 26.64 美元，當天正常交易時段已先跌 5.16%。這是本輪財報季反覆出現的模式：數字達標但指引沒有給出加速的證據，市場就直接按估值重算。對訂閱制軟體來說，26% 的成長率在兩年前是強項、現在只是及格線，尤其當投資人期待人工智慧產品線帶來變現轉折時。", "url": "https://uk.investing.com/news/stock-market-news/earnings-call-transcript-braze-tops-q2-2026-estimates-but-shares-fall-93CH-4861458"},
    {"id": "earn_2", "channel": "財報速報", "tag": "油賺得比店多", "color": "#E8786A", "stocks": [{"t": "CASY", "n": "Casey's General Stores，每股盈餘 7.37 美元年增 27.7%、燃油毛利每加侖 47.8 美分"}, {"t": "MUSA", "n": "Murphy USA，同樣以燃油毛利為主要獲利來源的加油零售商"}, {"t": "ARKO", "n": "Arko Corp，小型便利商店與加油站連鎖，燃油毛利敏感度更高"}], "en": "Casey's General Stores posted fiscal Q1 2027 diluted EPS of $7.37, up 27.7%, with net income of $273.7 million, up 27.1%, its fifth straight consensus beat. Inside same-store sales rose only 3.2% at a 42.2% margin, while fuel margin hit 47.8 cents per gallon and drove fuel gross profit up 19.6% to $446.9 million. The pumps, not the shelves, carried the quarter. Management also said Fikes integration is running ahead of schedule alongside a new three-year plan.", "zh": "中西部便利商店連鎖 Casey's General Stores 公布 2027 會計年度第一季，稀釋每股盈餘 7.37 美元、年增 27.7%，淨利 2.737 億美元、年增 27.1%，連續第五季超越市場共識。拆開來看，店內同店銷售僅增 3.2%、店內毛利率 42.2%，但燃油毛利衝到每加侖 47.8 美分，帶動燃油毛利年增 19.6% 至 4.469 億美元。真正的獲利引擎是加油站而不是貨架。管理層同時表示 Fikes 併購整合進度超前，並啟動新的三年策略計畫。", "url": "https://www.sec.gov/Archives/edgar/data/0000726958/000072695826000084/q1fy2027earningspressrelea.htm"},
    {"id": "macro_0", "channel": "總經政策", "tag": "升息六成", "color": "#7C6AF7", "stocks": [{"t": "XLF", "n": "金融類股 ETF，升息定價升溫時利差擴張的相對受惠者"}, {"t": "TLT", "n": "20 年期以上公債 ETF，零降息定價直接壓抑長天期債券"}, {"t": "KRE", "n": "區域銀行 ETF，對短端利率與存款成本最敏感的一塊"}], "en": "Fed pricing has fully reversed. After August payrolls came in at 162,000, futures put roughly 60% odds on a 25 basis point hike at the 15-16 September FOMC, with Chair Kevin Warsh and other officials citing supply-side pressure while inflation runs above the 2% target. The more striking number is the full-year one: the market-implied probability of zero rate cuts in 2026 sits at 92.7%. The debate is no longer how many cuts but whether the next move is up.", "zh": "市場對聯準會的定價已經完全掉頭。八月非農新增 16.2 萬人的強勁數據出來後，期貨對 9 月 15 至 16 日聯邦公開市場委員會會議升息一碼的機率推到約六成；主席華許 (Kevin Warsh) 與多位官員以供給面壓力為由釋出鷹派訊號，通膨仍高於 2% 目標。更值得注意的是全年定價：市場對 2026 年「零次降息」的隱含機率高達 92.7%。這已經不是討論降幾碼，而是討論會不會反手升。", "url": "https://www.schwab.com/learn/story/fomc-meeting"},
    {"id": "macro_1", "channel": "總經政策", "tag": "油價卡通膨", "color": "#7C6AF7", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，兩份物價數據直接決定盈虧平衡通膨率"}, {"t": "VLO", "n": "Valero，煉油端價差是能源如何傳導到零售油價的第一站"}, {"t": "XLP", "n": "必需消費類股 ETF，成本轉嫁能力的觀察窗口"}], "en": "The remaining three sessions this week are about prices: August PPI lands Thursday and August CPI on Friday. The complication is that oil only spiked toward $100 yesterday, so the freshest energy shock is not in either report. Markets will trade two things at once: the known August numbers and how September energy will contaminate next month's print. When the data looks backward and the risk sits forward, the reaction is usually larger than the release.", "zh": "本週剩下的三個交易日，物價數據會決定聯準會的位置：八月生產者物價指數在週四公布，八月消費者物價指數在週五公布。麻煩的是油價昨天才剛衝到接近 100 美元，而這兩份數據反映的是八月，也就是說最新的能源衝擊還沒被計入。市場會同時交易兩件事——已知的八月數字，以及九月能源價格會怎麼污染下個月的報告。這種「數據看後照鏡、風險在擋風玻璃」的結構，通常讓數據當天的波動比數據本身大。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar"},
    {"id": "macro_2", "channel": "總經政策", "tag": "風險溢價回來", "color": "#7C6AF7", "stocks": [{"t": "XOP", "n": "油氣探勘生產 ETF，風險溢價回升時彈性最大的一段"}, {"t": "OIH", "n": "油田服務 ETF，反映的是資本支出預期而非現貨價格"}, {"t": "ITA", "n": "航太國防 ETF，地緣衝突升溫時的另一條資金出口"}], "en": "This oil move is not about supply and demand; it is a risk premium returning to front-month contracts. Saudi Arabia's energy ministry confirmed several oil and utility facilities were suspended with firefighters still at work and at least 73 people injured. The market's worry is not those sites but whether the conflict reaches Hormuz transit. Goldman Sachs only raised its December Brent forecast by $5 to $85 on Monday, implying much of the current $99 is fear rather than fundamentals.", "zh": "這次油價上衝跟供需無關，是風險溢價重新回到近月合約。沙國能源部承認多座油廠與公用設施停止運作、消防人員仍在滅火，至少 73 人受傷；市場擔心的不是這幾座設施，而是衝突會不會擴散到荷姆茲海峽的通行。高盛週一才把 12 月布蘭特預估上調 5 美元至 85 美元，也就是說目前 99 美元的價格裡有相當比重是恐懼而不是基本面。恐懼溢價的特性是消得比漲得快，但只要事件持續，它就不會消。", "url": "https://www.cnbc.com/2026/09/08/oil-prices-today-brent-wti-hormuz-iran-war.html"},
    {"id": "sector_0", "channel": "產業風向", "tag": "能源加國防", "color": "#4EABA4", "stocks": [{"t": "LMT", "n": "洛克希德馬丁，昨日獲分析師調升評等、國防股領漲指標"}, {"t": "RTX", "n": "雷神技術，飛彈防禦與攔截系統的直接曝險"}, {"t": "GD", "n": "通用動力，地面系統與彈藥端的另一條受惠路徑"}], "en": "The cleanest sector signal yesterday was energy and defence rising together for the same reason. Crude hit three-month highs on the Saudi strikes while defence contractors caught a bid on escalation plus a Lockheed Martin analyst upgrade. Both groups have been second-tier destinations for capital through 2026 until a geopolitical event pushed them to the front simultaneously. Event-driven rotations of this kind usually run for weeks, not months, unless the disruption turns structural.", "zh": "昨天最清楚的板塊訊號是能源與國防同步走強，而且理由是同一個。原油因為沙烏地能源設施遇襲創下三個月新高，國防承包商則因為衝突升溫加上洛克希德馬丁獲得分析師調升評等而受到追捧。這兩個板塊在 2026 年一直是資金的第二順位，直到地緣事件把它們同時推到第一線。要注意的是，這種靠事件驅動的板塊輪動通常持續數週而非數月，除非事件本身變成結構性的供應中斷。", "url": "https://tradingstrategyguides.com/defense-stocks-in-focus-what-to-watch-on-september-8-2026/"},
    {"id": "sector_1", "channel": "產業風向", "tag": "醫療失血", "color": "#4EABA4", "stocks": [{"t": "XLV", "n": "醫療保健類股 ETF，昨日領跌板塊之一"}, {"t": "XBI", "n": "生技 ETF，臨床事件驅動、與大型製藥走勢常不同步"}, {"t": "AMGN", "n": "安進，遭降評下跌 8%、拖累大型製藥權重"}], "en": "Healthcare saw the clearest outflow yesterday, and it came after a good first half of the year. Two failed Novartis trials and an Amgen downgrade dragged large-cap pharma and the sector index with it. Yet on the same day small-cap biotech Pharvaris jumped 27% on positive trial data. This is not healthcare being abandoned; it is large pharma having valuation and pipeline risk repriced together, while single clinical events still move the other way.", "zh": "醫療保健昨天是資金流出最明顯的板塊，而且是在它今年前段表現不錯之後。諾華的兩項試驗失敗與安進的降評把大型製藥拉下來，帶動整個板塊指數走弱。但同一天生技小型股裡的 Pharvaris 因為正面試驗數據大漲 27%，說明這不是「醫療全面被拋棄」，而是「大型製藥的評價與研發風險同時被重新定價」。板塊 ETF 與個別臨床事件在同一天往相反方向走，是這個產業最典型的樣貌。", "url": "https://investrade.com/market-review-september-08-2026/"},
    {"id": "sector_2", "channel": "產業風向", "tag": "顧問被反噬", "color": "#4EABA4", "stocks": [{"t": "ACN", "n": "埃森哲，年內下跌約 46%、買回額度加碼至 75 億美元"}, {"t": "IBM", "n": "IBM，同樣以顧問與資訊服務為大宗營收的對照組"}, {"t": "CTSH", "n": "Cognizant，資訊科技外包純度更高、受衝擊路徑更直接"}], "en": "The sharpest AI plot twist this year is not who benefits but who gets disrupted. Accenture is down roughly 46% year to date and nearly 53% off its 52-week high, on fears that enterprises will use AI to replace large volumes of outsourceable professional-services hours. The company raised its fiscal 2026 buyback authorisation by $2 billion to $7.5 billion, with CEO Julie Sweet saying the share price does not reflect the firm's position in AI-driven reinvention.", "zh": "人工智慧今年最戲劇性的轉折不是誰受惠，而是誰被反噬。埃森哲 (Accenture) 股價年內下跌約 46%、距 52 週高點近 53%，市場的擔憂是企業用人工智慧取代大量可外包的專業服務工時。公司宣布把 2026 會計年度買回額度再加 20 億至 75 億美元，執行長史薇特 (Julie Sweet) 直言目前股價「並未反映」公司在人工智慧重塑中的位置。這是「顛覆者被顛覆」主題最大的一個樣本，也是判斷資訊服務業商業模式是否真的被侵蝕的觀察點。", "url": "https://finance.yahoo.com/markets/stocks/articles/buyback-boom-3-companies-betting-billions-on-their-own-stocks"},
    {"id": "small_0", "channel": "小型股風雲", "tag": "23年最佳", "color": "#5B8ED6", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，今年以來漲約 20%、2003 年來最佳"}, {"t": "VTWO", "n": "Vanguard 羅素 2000 ETF，追蹤同一指數的低費率替代"}, {"t": "IJR", "n": "標普 600 小型股 ETF，成分股有連續獲利的品質門檻"}], "en": "The Russell 2000 is up about 20% this year, its best showing since 2003, having recently set an all-time high. Two forces are behind it: AI capital spending spilling out of mega-cap tech into smaller suppliers, and regional banks re-rating on a steeper curve and lighter regulation, with Zions, Regions Financial and Prosperity Bancshares among the names. Best year since 2003 and cheap today are, however, two different claims.", "zh": "羅素 2000 今年以來上漲約 20%，是 2003 年以來最好的一年，而且近期才創下歷史新高。推力來自兩個方向：人工智慧的資本支出從超大型科技公司外溢到供應鏈的中小型廠商，以及區域銀行在殖利率曲線變陡與監管放鬆下重新獲得評價。Zions Bancorporation、Regions Financial 與 Prosperity Bancshares 都是這條線上的代表。要注意的是，「今年最好」與「現在便宜」是兩回事，這一點會在後面兩張卡展開。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
    {"id": "small_1", "channel": "小型股風雲", "tag": "微型更猛", "color": "#5B8ED6", "stocks": [{"t": "IWC", "n": "微型股 ETF，涵蓋羅素 2000 底部與更小市值的族群"}, {"t": "VTWO", "n": "Vanguard 羅素 2000 ETF，作為小型股報酬的對照基準"}, {"t": "IWO", "n": "羅素 2000 成長股 ETF，微型成長端的流動性風險最集中"}], "en": "If small caps look strong, micro caps look extreme. For the trailing year through 17 August 2026 the Morningstar US Micro Cap Index returned 45.7% against 22.8% for the broad market, roughly double. Companies at this size typically carry sub-$300 million valuations, near-zero analyst coverage and daily turnover measured in low single-digit millions. The flip side of doubled returns is doubled spread, impact cost and liquidity risk: paper returns and realised returns diverge far more here.", "zh": "如果覺得小型股已經很強，微型股更誇張。截至 2026 年 8 月 17 日的過去一年，晨星美國微型股指數報酬 45.7%，同期整體市場指數只有 22.8%，差距超過一倍。這個級距的公司通常市值不到 3 億美元、分析師覆蓋接近零、日成交金額可能只有幾百萬美元。報酬率翻倍的另一面是：進出成本、買賣價差與流動性風險同樣翻倍。在微型股裡，紙上報酬與實際能拿到的報酬之間的落差，遠大於大型股。", "url": "https://www.morningstar.com/funds/these-tiny-stocks-are-quietly-outperforming-market"},
    {"id": "small_2", "channel": "小型股風雲", "tag": "虧損股狂飆", "color": "#5B8ED6", "stocks": [{"t": "IWO", "n": "羅素 2000 成長股 ETF，未獲利成分股集中的一端"}, {"t": "IWC", "n": "微型股 ETF，未獲利比重更高、對利率變化最脆弱"}, {"t": "IJR", "n": "標普 600 小型股 ETF，因有獲利門檻可作為品質對照組"}], "en": "Here is the number to remember about this year's small-cap run: unprofitable Russell 2000 companies are up 154% since mid-2025 while profitable peers gained 34%. Investors are paying for AI exposure rather than current earnings. That structure self-reinforces in a bull phase because the losers' returns attract more capital, but it is also the first segment to break when rates rise and liquidity tightens. Judge a small-cap position by which half is rallying, not by the index.", "zh": "這是今年小型股行情裡最該記住的一個數字：羅素 2000 裡「不賺錢」的公司自 2025 年年中以來上漲 154%，同期有獲利的同儕只漲 34%。也就是說，投資人押的是人工智慧曝險而不是當期盈餘。這種結構在多頭裡會自我強化，因為虧損股的漲幅會吸引更多資金；但在利率往上走、流動性收緊時，它也是最先崩的一段。判斷小型股部位的健康程度，不要只看指數漲多少，要看漲的是哪一半。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-having-best-23-154735452.html"},
    {"id": "small_3", "channel": "小型股風雲", "tag": "數據翻身", "color": "#5B8ED6", "stocks": [{"t": "PHVS", "n": "Pharvaris，正面試驗數據帶動單日上漲 27%"}, {"t": "KALV", "n": "KalVista，同樣鎖定遺傳性血管性水腫口服療法的競爭者"}, {"t": "IONS", "n": "Ionis，罕見疾病領域的規模對照組"}], "en": "On a red day Pharvaris jumped 27% on positive trial data, the cleanest catalyst case among small caps yesterday. The company develops oral therapies for hereditary angioedema; with a modest market value and thin coverage, its price is set almost entirely by clinical readouts. Before a readout, macro and oil barely matter to it; after one, every other variable becomes noise. Reading it alongside competitors in the same indication carries more information than reading it alone.", "zh": "在指數收黑的一天，Pharvaris 因為正面試驗數據單日上漲 27%，是昨天小型股裡最乾淨的催化劑案例。這家公司做的是遺傳性血管性水腫的口服療法，市值不大、覆蓋有限，股價幾乎完全由臨床讀數決定。這類標的的特性是：在讀數出來之前，總經與油價對它幾乎沒有影響；讀數出來之後，其他所有變數都變成雜訊。把它跟同賽道的競爭者一起看，比單獨看它更有資訊量。", "url": "https://investrade.com/market-review-september-08-2026/"},
    {"id": "small_4", "channel": "小型股風雲", "tag": "燃油咬利潤", "color": "#5B8ED6", "stocks": [{"t": "HTLD", "n": "Heartland Express，小型整車運輸業者，柴油成本轉嫁能力有限"}, {"t": "MRTN", "n": "Marten Transport，溫控運輸小型業者，燃油與人力雙重壓力"}, {"t": "ULCC", "n": "Frontier Group，超低成本航空模式下燃油佔成本比重最高"}], "en": "Oil near $100 hurts small caps through a different channel than large caps. Big carriers have fuel surcharge mechanisms and long contracts to pass costs through; small truckers and ultra-low-cost airlines have far less pricing power, so higher fuel goes almost straight out of operating income. Heartland Express and Marten Transport sit at the diesel-sensitive end of trucking, while Frontier Group carries the highest fuel share of cost among US carriers. Watch cost per mile and cost per available seat mile next quarter, not the share price.", "zh": "油價逼近 100 美元對小型股的傷害路徑跟大型股不同。大型運輸業者有燃油附加費機制與長約可以轉嫁，小型卡車與廉價航空的議價能力弱得多，燃油成本上升幾乎是直接吃掉營業利益。Heartland Express 與 Marten Transport 是零擔與整車運輸裡規模較小、對柴油最敏感的一端；Frontier Group 則是超低成本航空模式下燃油佔成本比重最高的樣本。這一組值得盯的不是股價，是下一季財報裡的每英里成本與單位座位成本。", "url": "https://investrade.com/morning-preview-september-08-2026/"},
    {"id": "radar_0", "channel": "忽視雷達", "tag": "驗證點通過", "color": "#C9A227", "stocks": [{"t": "AVO", "n": "Mission Produce，第三季營收 4.50 億遠超預期 2.807 億、股價漲 7%"}, {"t": "FDP", "n": "Fresh Del Monte，同樣吃產地價格波動的生鮮供應商"}, {"t": "DOLE", "n": "Dole，生鮮農產配銷的規模對照組"}], "en": "Pool name Mission Produce cleared its verification point. Q3 revenue came in at $450.0 million against a $280.7 million consensus, up 26%, with avocado volume up 38%. A $25.4 million Calavo acquisition charge pushed it to a $6.5 million net loss, but adjusted net income was $15.0 million or $0.18 per share, and management raised annualised Calavo synergies to more than $30 million. Shares rose 7%. The counterpoint: gross margin fell 270 basis points to 9.9%. Research lead, not investment advice.", "zh": "池內標的 Mission Produce 昨晚交卷，驗證點通過。這家做酪梨與藍莓種植配銷的公司，第三季營收 4.50 億美元，遠超市場預期的 2.807 億，年增 26%，酪梨銷量年增 38%。帳面因為 Calavo 併購相關費用 2,540 萬美元而轉為淨損 650 萬，但調整後淨利 1,500 萬、每股 0.18 美元，且公司把 Calavo 年化綜效目標從原本水準上調至超過 3,000 萬美元，股價盤後跳漲 7%。要留意的反方論點：毛利率年減 270 個基點至 9.9%，量增而利潤率縮，說明轉嫁能力仍有限。以上是研究線索，不是投資建議。", "url": "https://www.globenewswire.com/news-release/2026/09/08/3358114/0/en/mission-produce-announces-fiscal-2026-third-quarter-financial-results.html", "status": "RADAR · 下一個驗證點 12 月 FQ4 財報（看 3,000 萬綜效是否落到毛利率）"},
    {"id": "radar_1", "channel": "忽視雷達", "tag": "中東再開機", "color": "#C9A227", "stocks": [{"t": "TNK", "n": "Teekay Tankers，第二季蘇伊士型日均 10.9 萬美元、第三季已訂 44% 船期"}, {"t": "FRO", "n": "Frontline，同樣以現貨曝險為主的大型原油輪船東"}, {"t": "INSW", "n": "International Seaways，噸海里效應的另一個純度較高標的"}], "en": "Pool name Teekay Tankers got its external variable back. The pure spot-market Suezmax and Aframax owner averaged $109,000 per day on Suezmaxes and $74,100 on Aframax LR2s in Q2, its highest mid-size tanker rates on record, driven by Hormuz disruption. At the Q2 report 44% of Q3 Suezmax days were fixed at $104,800. Yesterday's strikes on Saudi energy sites restart the same driver. The counterpoint: spot exposure cuts both ways when peace arrives. Research lead, not investment advice.", "zh": "池內標的 Teekay Tankers 昨天等到了它的外部變數。這家只做蘇伊士型與阿芙拉型原油輪、以現貨運價賣航次的船東，第二季蘇伊士型現貨日均 10.9 萬美元、阿芙拉型 7.41 萬美元，是公司史上最高的中型油輪均價，推力正是荷姆茲海峽的中斷。第三季公布時已訂 44% 蘇伊士型船期、均價 10.48 萬美元。昨天沙烏地能源設施遇襲讓同一組推力重新啟動。反方論點：現貨模式意味著和平來得快、獲利掉得也快，這是收益的來源也是它的脆弱點。以上是研究線索，不是投資建議。", "url": "https://www.investing.com/news/company-news/teekay-tankers-q2-2026-slides-record-profit-on-geopolitical-surge-93CH-4825677", "status": "RADAR · 下一個驗證點 10 月底 Q3 財報（看剩餘 56% 船期的實現價格）"},
    {"id": "radar_2", "channel": "忽視雷達", "tag": "訂單先於油價", "color": "#C9A227", "stocks": [{"t": "BORR", "n": "Borr Drilling，在手訂單升至 11.3 億美元、29 艘平台中 24 艘已簽約"}, {"t": "VAL", "n": "Valaris，深水與淺水兼營的規模對照組"}, {"t": "NE", "n": "Noble Corporation，離岸鑽井日費週期的另一個觀察窗口"}], "en": "Pool name Borr Drilling's thesis is only indirectly about oil. The pure modern jackup driller has 24 of its 29 owned rigs contracted or committed, with 98.4% technical and 96.4% economic utilisation in Q2. Year to date it has won 21 commitments covering about 4,350 days and $541 million of dayrate equivalent backlog, lifting total backlog from $1.04 billion at end-June to $1.13 billion. Those contracts were signed before oil reached $99, which matters more than the oil price itself. Research lead, not investment advice.", "zh": "池內標的 Borr Drilling 的論點跟油價的關係比看起來間接。這家只做現代化淺水自升式鑽井平台的離岸鑽井商，29 艘自有平台中有 24 艘已簽約或已承諾，第二季技術可用率 98.4%、經濟可用率 96.4%。今年以來拿到 21 份合約承諾、約 4,350 個作業日、日費等值在手訂單 5.41 億美元，總在手訂單從 6 月底的 10.4 億升到 11.3 億美元。訂單是在油價衝上 99 美元之前就簽的，這比油價本身更有意義。反方論點：離岸鑽井的資本支出週期長，油價回落時合約會遞延而非取消，但獲利認列會慢。以上是研究線索，不是投資建議。", "url": "https://www.sec.gov/Archives/edgar/data/0001715497/000114036126032598/ef20080031_ex99-2.htm", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（看在手訂單能否續增至 12 億以上）"},
    {"id": "radar_3", "channel": "忽視雷達", "tag": "唯一的冶煉廠", "color": "#C9A227", "stocks": [{"t": "UAMY", "n": "美國銻業，國防後勤局最高 2.45 億合約、累計訂單 5,730 萬美元"}, {"t": "MP", "n": "MP Materials，美國本土關鍵礦物的規模對照組"}, {"t": "PPTA", "n": "Perpetua Resources，同樣鎖定美國本土銻與金礦的開發案"}], "en": "Pool name United States Antimony is worth revisiting against yesterday's geopolitical backdrop. Antimony goes into ammunition primers, armour-piercing rounds, night vision and precision optics, and this company runs the only operating antimony smelter in the United States. It holds a sole-source IDIQ contract worth up to $245 million from the Defense Logistics Agency for national stockpile replenishment, completed first deliveries in Q2, and had $57.3 million of cumulative orders as of July. Heavily shorted micro cap; the contract ceiling is not a guarantee. Research lead, not investment advice.", "zh": "池內標的 United States Antimony 在昨天的地緣背景下值得回頭看一次。銻用在彈藥底火、穿甲彈、夜視鏡與精密光學，而這家公司經營美國境內唯一在運轉的銻冶煉廠。它拿到國防後勤局最高 2.45 億美元的獨家不定期不定量合約，用於補充國防戰略儲備；第二季完成首批交付，至 7 月為止累計訂單 5,730 萬美元。阿拉斯加、蒙大拿與安大略的礦權今年開始實質供料給自家冶煉廠。反方論點：這是高度被放空、波動極大的微型股，訂單金額是上限不是保證，且自有礦的產能爬坡尚未證明。以上是研究線索，不是投資建議。", "url": "https://www.stocktitan.net/news/UAMY/united-states-antimony-corporation-provides-update-on-antimony-rbqtyalamvnu.html", "status": "RADAR · 下一個驗證點 11 月 Q3 財報（看認列的國防後勤局交付金額）"},
    {"id": "radar_4", "channel": "忽視雷達", "tag": "新名字·稀土", "color": "#C9A227", "stocks": [{"t": "CRML", "n": "Critical Metals Corp，格陵蘭稀土礦權加下游 REalloys 承購鏈"}, {"t": "MP", "n": "MP Materials，美國稀土開採與加工的規模對照組"}, {"t": "USAR", "n": "USA Rare Earth，同樣鎖定本土磁石供應鏈的對照標的"}], "en": "One of today's new names is Critical Metals Corp, which links Greenland rare-earth resources to US downstream processor REalloys. The neglect is straightforward: small capitalisation, revenue not yet at scale, almost no coverage, and a project timeline long enough that most institutions will not spend time on it. What is changing sits downstream, with the US Army selecting REalloys to qualify defence-grade heavy rare earths by end-2026 against a 1 January 2027 procurement deadline, pulling forward the value of a long-term offtake. This remains a pre-production resource story with heavy dilution and timeline risk. Research lead, not investment advice.", "zh": "今天的新名字之一是 Critical Metals Corp，一家把格陵蘭稀土礦權與美國下游加工商 REalloys 串起來的公司。忽視的原因很直接：市值小、營收尚未放量、覆蓋幾乎沒有，且格陵蘭專案的時程長得讓多數法人不願花時間。正在改變的是下游端——美國陸軍選定 REalloys 在 2026 年底前完成國防級重稀土的資格認證，對應 2027 年 1 月 1 日的國防採購期限，這讓一份長期承購協議的價值隨著客戶的認證時程一起前移。反方論點很重：這仍是一檔前期、尚未量產的資源股，任何時程延誤都會讓整個論點失效，且股權稀釋風險高。以上是研究線索，不是投資建議。", "url": "https://www.forbes.com/sites/investor-hub/article/5-rare-earth-stocks-to-buy-in-2026/", "status": "RADAR · 下一個驗證點 2026 年底 REalloys 國防級資格認證是否如期完成"},
    {"id": "radar_5", "channel": "忽視雷達", "tag": "新名字·利差", "color": "#C9A227", "stocks": [{"t": "HNVR", "n": "Hanover Bancorp，淨息差三季由 2.76% 擴至 3.10%、每股盈餘 0.33 升至 0.55"}, {"t": "DCOM", "n": "Dime Community Bancshares，長島同區域的規模對照組"}, {"t": "FLG", "n": "Flagstar Financial，紐約都會區商用不動產曝險的對照樣本"}], "en": "Today's other new name is Hanover Bancorp, a roughly $2.34 billion community bank with ten branches across Long Island, the greater New York metro and Freehold, New Jersey. The neglect is textbook: too small, almost no major-broker coverage, no narrative. What is changing is three consecutive quarters of margin expansion, with net interest margin moving 2.76% to 2.96% to 3.10%, quarterly net income rising from $2.4 million to $4.1 million and EPS from $0.33 to $0.55 on record net interest income of $16.8 million. If rates rise, deposit costs may catch up with asset repricing. Research lead, not investment advice.", "zh": "今天的另一個新名字是 Hanover Bancorp，總資產約 23.4 億美元、在長島與紐約都會區加上紐澤西 Freehold 共十間分行的社區銀行。忽視的原因是典型的：規模太小、幾乎沒有大型券商追蹤、業務模式沒有故事性。正在改變的是淨息差的連續擴張——2025 年第二季 2.76%、2026 年第一季 2.96%、第二季 3.10%，同期單季淨利從 240 萬升至 410 萬美元，每股盈餘從 0.33 升至 0.55 美元，淨利息收入創下 1,680 萬美元的紀錄。反方論點：升息路徑若真的往上走，存款成本可能追上資產重定價，且商用不動產曝險是所有社區銀行的共同風險。以上是研究線索，不是投資建議。", "url": "https://www.globenewswire.com/news-release/2026/07/23/3332537/0/en/Hanover-Bancorp-Inc-Reports-Second-Quarter-2026-Results-Highlighted-by-Increased-Net-Interest-Income-and-Margin-Expansion-Declares-0-10-Quarterly-Cash-Dividend.html", "status": "RADAR · 下一個驗證點 10 月下旬 Q3 財報（看淨息差能否守住 3.10%）"},
    {"id": "insider_0", "channel": "內部人動向", "tag": "三度加碼", "color": "#6DB56D", "stocks": [{"t": "CSGP", "n": "CoStar Group，執行長三度買進累計約 610 萬美元、股價年內跌約 52%"}, {"t": "ZG", "n": "Zillow，住宅入口網站的主要競爭者，市佔壓力來源"}, {"t": "RDFN", "n": "Redfin，住宅交易平台的另一個對照樣本"}], "en": "CoStar Group founder and CEO Andrew Florance bought 83,300 shares on the open market with personal funds on 4 August for roughly $2.5 million, his third recent purchase, bringing the total to about 141,900 shares for approximately $6.1 million bought at successively lower prices. The stock is down about 52% year to date and the average analyst target has been cut from $97 a year ago to $37. The market's doubt is Homes.com spending and monetisation; the CEO is taking the other side.", "zh": "CoStar Group 創辦人兼執行長佛羅倫斯 (Andrew Florance) 在 8 月 4 日以個人資金於公開市場買進 83,300 股，金額約 250 萬美元，這是他近期第三次買進，累計約 141,900 股、約 610 萬美元，而且是在股價一路下跌的過程中分批買，均價逐次走低。同期股價年內下跌約 52%，分析師平均目標價從一年前的 97 美元砍到 37 美元。市場的疑慮集中在 Homes.com 住宅平台的燒錢與變現，執行長的行為則是明確的反向表態。", "url": "https://www.fool.com/coverage/filings/2026/08/10/costar-ceo-andrew-florance-buys-83-300-shares-for-usd2-5-million-what-does-this-tell-investors/"},
    {"id": "insider_1", "channel": "內部人動向", "tag": "銀行家買自家", "color": "#6DB56D", "stocks": [{"t": "GBCI", "n": "Glacier Bancorp，董事長 8 月 28 日買進 2,250 股逾 10.5 萬美元"}, {"t": "PNFP", "n": "Pinnacle Financial Partners，執行長同期買進自家股票"}, {"t": "DGICA", "n": "Donegal Group，小型保險與金融端的同期內部人買進樣本"}], "en": "Regional bank insiders bought through late August and early September. Glacier Bancorp chairman Craig A. Langel purchased 2,250 shares worth more than $105,000 on 28 August, Pinnacle Financial Partners CEO Kevin S. Blair bought his own stock in the same window, and Donegal Group also saw insider purchases. The timing coincides with a steepening curve and rising hike pricing, which points the same way: wider spreads help deposit-funded banks. A $105,000 purchase is not large for a bank executive, so treat the signal as moderate.", "zh": "區域銀行的內部人在八月底到九月初出現一波買進。Glacier Bancorp 董事長蘭格爾 (Craig A. Langel) 在 8 月 28 日買進 2,250 股、價值逾 10.5 萬美元；Pinnacle Financial Partners 執行長布萊爾 (Kevin S. Blair) 同期買進自家股票；Donegal Group 也有內部人買進紀錄。這一組動作發生在殖利率曲線變陡、市場開始定價升息的同一段時間，方向是一致的：利差擴張對持有存款基礎的銀行有利。要注意的是，董事長買 10 萬美元對一位銀行高管而言不是大金額，訊號強度屬於中等。", "url": "https://www.fool.com/coverage/filings/2026/09/01/regional-bank-insider-buys-2-250-shares-valued-at-more-than-usd105-000/"},
    {"id": "insider_2", "channel": "內部人動向", "tag": "怎麼讀才對", "color": "#6DB56D", "stocks": [{"t": "WD", "n": "Walker & Dunlop，池內標的，近期出現多位內部人群聚買進"}, {"t": "SMID", "n": "Smith-Midland，池內標的，9 月初執行長與董事接連買進"}, {"t": "AMR", "n": "Alpha Metallurgical Resources，池內標的，等待第二位內部人跟進"}], "en": "Insider buying needs a threshold or the noise wins. The working definition of a cluster buy is three or more distinct insiders purchasing the same stock on the open market within 7 to 14 days; a director's purchase carries most weight when they chair the audit committee or when several directors buy in the same window. Filter out sub-$10,000 to $25,000 purchases as symbolic, loosening that for micro caps but always normalising against known compensation. Heavily bought names have outperformed by roughly 7.5% over the following 12 months, concentrated in small and mid caps.", "zh": "看內部人買進要有門檻，否則會被雜訊淹沒。學術與實務上的定義是：同一檔股票在 7 至 14 天內有三位以上不同內部人於公開市場買進，才算「群聚買進」；董事買進的權重在他是審計委員會主席、或多位董事同窗買進時最高。過濾規則是每人低於 1 萬至 2.5 萬美元的買單通常視為象徵性，微型股可以放寬但要對照該內部人的已知薪酬規模。統計上，內部人重買的股票在後續 12 個月平均超越大盤約 7.5%，而且效果集中在中小型股。池內的 Walker & Dunlop 與 Smith-Midland 都是近期出現多人買進的樣本。", "url": "https://www.form4api.com/guides/cluster-buy-signals"},
    {"id": "capitol_0", "channel": "政要持股", "tag": "押電不押晶片", "color": "#B5654D", "stocks": [{"t": "BE", "n": "Bloom Energy，申報取得 15,000 股加 200 口 2027/6 到期買權、昨日漲 8%"}, {"t": "INTC", "n": "Intel，申報取得 10,000 股加 50 口履約價 50 美元買權"}, {"t": "UBER", "n": "Uber，同一家戶今年稍早申報的長天期買權部位"}], "en": "House filings released on 24 August show the Pelosi household acquired 15,000 Bloom Energy Class A shares across trades on 24 and 28 July, plus 200 call options struck at $100 expiring 17 June 2027, alongside 10,000 Intel shares in the $500,001 to $1 million band and 50 Intel calls struck at $50 with the same expiry. Combined disclosed ranges run roughly $4.25 million to $14.5 million. The underlying assumption is legible: the AI bottleneck sits in power supply and domestic fabrication rather than in buying another round of compute.", "zh": "眾議院 8 月 24 日公布的申報顯示，Pelosi 家戶在 7 月 24 日與 7 月 28 日兩筆交易中取得 Bloom Energy 15,000 股 A 類普通股，另加 200 口履約價 100 美元、2027 年 6 月 17 日到期的買權；同日買進 Intel 10,000 股（申報區間 50 萬至 100 萬美元）與 50 口履約價 50 美元、同一到期日的買權。合計申報區間約 425 萬至 1,450 萬美元。這組部位底下的假設很清楚：人工智慧的瓶頸在供電端與本土晶片製造，而不是再多買一輪運算晶片。巧的是 Bloom Energy 昨天因納入標普 500 上漲 8%。", "url": "https://finance.yahoo.com/markets/stocks/articles/bloom-energy-shares-jump-nancy-110446950.html"},
    {"id": "capitol_1", "channel": "政要持股", "tag": "為何不能跟", "color": "#B5654D", "stocks": [{"t": "NANC", "n": "追蹤民主黨籍議員申報部位的 ETF，可對照策略化跟單的實際結果"}, {"t": "KRUZ", "n": "追蹤共和黨籍議員申報部位的 ETF，另一半的對照組"}, {"t": "VOO", "n": "標普 500 ETF，任何跟單策略都要先贏過的基準線"}], "en": "The structure of this data is why it is not a trading signal. First, the lag: those trades happened on 24 and 28 July and were disclosed on 24 August, about a month later, against a 45-day statutory deadline, so anyone following buys at a month-old price. Second, amounts are bands, not numbers, so you cannot size the position or weigh it within a portfolio. Third, the filings are marked SP, meaning a spouse's account executed them. The genuine information is in the option strike and expiry, which tell you what move, by when.", "zh": "這類資料的結構決定了它不是買賣訊號，今天講三點。第一，時間差：上面那組交易發生在 7 月 24 日與 28 日，8 月 24 日才公布，中間隔了約一個月，而法定期限是 45 天，跟單者買到的永遠是別人一個月前的價位。第二，金額不是數字而是區間：申報只給「50 萬至 100 萬美元」這種寬帶，你無法知道實際部位大小，也就無法計算它在對方資產配置裡的權重。第三，申報明確標記 SP，代表交易由配偶帳戶執行，不是議員本人下單。真正有資訊量的其實是選擇權的履約價與到期日——它告訴你這筆錢押的是「多久之內、漲到哪裡」。", "url": "https://getstockplus.app/congress-trades"},
    {"id": "week_0", "channel": "本週事件", "tag": "兩份物價", "color": "#C97DD4", "stocks": [{"t": "TIP", "n": "抗通膨公債 ETF，兩份數據直接決定盈虧平衡通膨率"}, {"t": "IEF", "n": "7-10 年期公債 ETF，中天期利率對數據最敏感的一段"}, {"t": "UUP", "n": "美元指數 ETF，升息定價升溫時的直接受惠者"}], "en": "The week is shortened by Labor Day and the remaining three sessions belong to prices. August PPI arrives before Thursday's open and August CPI before Friday's, with weekly initial jobless claims in between. Both feed directly into pricing for the 15-16 September FOMC, where futures currently imply roughly 60% odds of a 25 basis point hike. The reading trap: both reports cover August, while oil only spiked toward $100 this week, so a soft print may not settle anything.", "zh": "本週因勞動節只有四個交易日，剩下三天的主軸全在物價。八月生產者物價指數在週四盤前公布，八月消費者物價指數在週五盤前公布，中間夾著每週初領失業金人數。這兩份數據會直接決定下週二、三 (9/15-16) 聯邦公開市場委員會的定價——目前期貨對升息一碼的機率約六成。要留意的判讀陷阱：這兩份數字反映的是八月，而油價是這週才衝到接近 100 美元，因此就算數據溫和，市場也未必會放心。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar"},
    {"id": "week_1", "channel": "本週事件", "tag": "甲骨文交卷", "color": "#C97DD4", "stocks": [{"t": "ORCL", "n": "甲骨文，週四盤後公布，共識每股盈餘 1.73 美元、營收 191.3 億"}, {"t": "ADBE", "n": "Adobe，同日盤後公布，共識每股盈餘 6.07 美元、營收 66.9 億"}, {"t": "KR", "n": "Kroger，週五盤前公布，共識每股盈餘 1.06 美元、營收 346.5 億"}], "en": "Three earnings events remain. Oracle and Adobe both report after Thursday's close on 10 September, with Kroger before Friday's open. Oracle consensus sits at $1.73 EPS on $19.13 billion of revenue, roughly 28% growth and potentially its fastest on record, yet the stock is down 21.11% since the last report and options price a post-earnings move of plus or minus 9.85%. The number that matters is not the quarter but the change in remaining performance obligations, the evidence on whether cloud bookings convert.", "zh": "財報端剩下三場重頭戲。甲骨文 (Oracle) 與 Adobe 在週四 (9/10) 盤後同日公布，Kroger 在週五 (9/11) 盤前。甲骨文的共識是每股盈餘 1.73 美元、營收 191.3 億美元、年增約 28%，若達成將是它有紀錄以來最快的營收成長率；但股價自上次財報以來已下跌 21.11%，選擇權市場定價的財報後波動高達正負 9.85%。真正要看的不是本季數字，是剩餘履約義務的變化——那才是雲端訂單能不能兌現的證據。", "url": "https://www.investing.com/news/stock-market-news/oracle-adobe-and-kroger-earnings-watchlist-for-the-week-of-september-10-93CH-4892177"},
    {"id": "eval_0", "channel": "今日評估", "tag": "兩股力量夾擊", "color": "#E8A838", "stocks": [{"t": "SPY", "n": "標普 500 ETF，估值對長天期殖利率最敏感的整體代表"}, {"t": "XLE", "n": "能源類股 ETF，這組矛盾裡唯一兩邊都受惠的板塊"}, {"t": "IWM", "n": "羅素 2000 ETF，升息定價升溫時最先被檢驗的一段"}], "en": "The single thing worth noticing today is that geopolitical risk and hike pricing are landing on the same week's inflation data for the first time. For two years an oil rally came with expectations of a dovish Fed because high energy was assumed to break demand. This time it is the reverse: 162,000 payrolls, a 92.7% implied probability of zero cuts and a 5.27% 30-year yield say the economy holds and oil only makes inflation stickier. That is the least valuation-friendly combination there is.", "zh": "今天最值得注意的一件事，是「地緣風險」與「升息定價」第一次壓在同一週的物價數據上。過去兩年，油價上漲通常伴隨聯準會轉鴿的預期，因為市場相信高油價會壓垮需求；這一次相反，非農 16.2 萬人、零降息機率 92.7%、30 年期殖利率 5.27%，代表市場認為經濟撐得住，而油價只會讓通膨更黏。這是一個對估值最不友善的組合。留給你的問題：如果週五的消費者物價指數落在溫和區間，但布蘭特仍在 99 美元，你會相信數據還是相信油價？", "url": "https://investrade.com/market-review-september-08-2026/", "status": "今天想跟你討論：數據與油價衝突時，你先相信哪一個？"}
];

// 「資金流向」「政要績效」是特殊分頁,不吃 CARDS、卡片版型完全不適用
const TODAY_SUBS = ["全部", ...CHANNELS.map(c => c.key), "資金流向", "政要績效"];

// 個別議員申報彙整。來源是眾議院書記官的官方 PTR 索引與 PDF,由 tools/capitol_roster.py

  return CARDS.length + "-" + (h >>> 0).toString(36);
})();

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>相關個股</span>
          {card.stocks.map(s => (
            <a key={s.t} href={"https://www.tradingview.com/symbols/" + s.t + "/"} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} style={{ display:"flex", alignItems:"baseline", gap:"12px", textDecoration:"none" }}>
              <span style={{ fontFamily:"'Courier New',monospace", fontSize:"12px", fontWeight:700, letterSpacing:"0.08em", color:card.color, minWidth:"56px", flexShrink:0 }}>{s.t}</span>
              <span style={{ fontFamily:"system-ui,-apple-system,'PingFang TC',sans-serif", fontSize:"12.5px", lineHeight:1.6, color:"var(--text-secondary)", fontWeight:300 }}>{s.n}</span>
            </a>
          ))}
        </div>
      )}
      <WordPopup popup={popup} onSpeak={speakWord} />
      <div style={{ overflow:"hidden", maxHeight:isOpen?"500px":"0px", transition:"max-height 0.45s cubic-bezier(0.4,0,0.2,1)" }}>
        <div style={{ marginTop:"16px", paddingTop:"14px", borderTop:"1px solid var(--divider)" }}>
          <p style={{ fontFamily:"Georgia,'Times New Roman',serif", fontSize:"16px", lineHeight:1.8, color:"var(--text-secondary)", margin:0, maxWidth:"52ch", letterSpacing:"-0.01em" }}>{words}</p>
        </div>
      </div>
      <div className="expand-row" style={{ marginTop:"14px" }}>
        <span onPointerDown={e => e.stopPropagation()} onClick={e => { e.stopPropagation(); toggle("en"); }} style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color: lang==="en" ? "var(--text-secondary)" : "var(--text-tertiary)", cursor:"pointer" }}>{lang==="en" ? "close ↑" : "English ↓"}</span>
        {card.url && (<a href={card.url} target="_blank" rel="noopener noreferrer" onPointerDown={e => e.stopPropagation()} onClick={e => e.stopPropagation()} className="source-link">source ↗</a>)}
      </div>
      {card.status && (
        <div style={{ marginTop:"16px", border:"1px solid "+card.color, padding:"10px 14px", display:"flex", alignItems:"center", gap:"10px", opacity:0.85 }}>
          <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:card.color, flexShrink:0 }} />
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.14em", textTransform:"uppercase", color:card.color }}>{card.status}</span>
        </div>
      )}
      <div style={{ position:"relative", marginTop:"16px" }}>
        <div style={{ height:"1px", background:"var(--divider)" }} />
        <div style={{ position:"absolute", top:0, left:0, height:"1px", background:"var(--text-tertiary)", width:((idx+1)/total*100)+"%", transition:"width 0.3s" }} />
      </div>
    </div>
  );
}

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>
      <div style={{ display:"flex", gap:"12px", flexWrap:"wrap", justifyContent:"center" }}>
        <button className="end-btn" onClick={onPrev}>← Prev</button>
        <button className="end-btn" onClick={onTop}>⤒ 回第一張</button>
        <button className="end-btn" onClick={copyPrompt}>{copied ? "✓ 已複製" : "跟 Claude 討論"}</button>
      </div>
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.1em", color:"var(--text-tertiary)", maxWidth:"32ch", textAlign:"center", lineHeight:1.8 }}>複製今日摘要 prompt，貼進 Claude 開始復盤</p>
    </div>
  );
}

function ThemeToggle() {
  const [dark, setDark] = useState(false);
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const toggle = () => { const next = !dark; setDark(next); document.body.setAttribute("data-theme", next ? "dark" : "light"); };
  return (
    <>
      <button className="theme-toggle" onClick={toggle}>{dark ? "○" : "●"}</button>
      <button className="theme-toggle" onClick={() => setSettingsOpen(o => !o)} style={{ top:'50px' }}>⚙</button>
      <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </>
  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";
  const isPerf = todaySub === "政要績效";
  const isEmbed = isFlow || isPerf;  // 兩個嵌入分頁都不吃 CARDS:停用滑動、朗讀與前後翻頁

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  // v6.4 背景播放:整條鏈不再依賴 setTimeout、也不在唸完後才 fetch —
  // 唸這張的同時預抓下一張音訊,onended 立刻換 src 接播,卡間 0.6 秒停頓燒進音檔尾端。
  // iOS 背景會凍結 timer 與網路,但「音訊播完 → 馬上接著播下一顆」這條路是放行的。
  const playTokenRef = React.useRef(0);
  const idxRef = React.useRef(idx);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);
  const flowCtlRef = React.useRef(null);   // 鎖屏 Media Session 的上一則/下一則用

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isEmbed || atEnd || !cards[idxRef.current]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const alive = () => playTokenRef.current === token;
    let prefetch = null;   // { i, promise } 下一張的音訊 blob URL,唸完零延遲接播

    const azRate = playLang === 'zh' ? '-8%' : '-5%';
    const sysRate = playLang === 'zh' ? 0.95 : 0.88;
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const textOf = (i) => {
      const card = cards[i];
      const body = playLang === 'en' ? card.en : card.zh;
      const intro = playLang === 'en' ? `Number ${i + 1} of ${total}. `
                  : `第 ${i + 1} 則，${card.channel}，${card.tag || ""}。`;
      return intro + body;
    };
    const setMedia = (i) => {   // 鎖屏畫面顯示現在唸到哪一則
      if (!('mediaSession' in navigator)) return;
      try {
        const card = cards[i];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: (i + 1) + "/" + total + "・" + card.channel + (card.tag ? "・" + card.tag : ""),
          artist: "Mo's Feed",
          artwork: [{ src: "apple-touch-icon.png", sizes: "180x180", type: "image/png" }]
        });
        navigator.mediaSession.playbackState = 'playing';
      } catch(e) {}
    };

    const playCard = async (i) => {
      if (!alive()) return;
      if (i >= total) { setPlaying(false); setDir(1); setIdx(total); try { localStorage.setItem(lsKey, String(total)); } catch(e) {} return; }
      setDir(1); setIdx(i); idxRef.current = i;
      try { localStorage.setItem(lsKey, String(i)); } catch(e) {}
      setMedia(i);
      let preUrl = null;
      if (prefetch && prefetch.i === i) preUrl = await prefetch.promise;
      prefetch = null;
      if (!alive()) { if (preUrl) { try { URL.revokeObjectURL(preUrl); } catch(e) {} } return; }
      if (i + 1 < total) prefetch = { i: i + 1, promise: speakPrefetch(textOf(i + 1), { speakLang: playLang, azRate, tailMs: 600 }) };
      speakSmart(textOf(i), {
        speakLang: playLang, azRate, sysRate, tailMs: 600, preUrl,
        onEnd: () => { if (alive()) playCard(i + 1); },
        onError: () => { if (alive()) setPlaying(false); }
      });
    };

    flowCtlRef.current = {   // 鎖屏的上一則/下一則:跳到目標卡重新接鏈,prefetch 對得上就直接用
      next: () => { if (alive()) playCard(Math.min(idxRef.current + 1, total)); },
      prev: () => { if (alive()) playCard(Math.max(idxRef.current - 1, 0)); },
    };
    playCard(idxRef.current);
    return () => {
      playTokenRef.current++;
      azureStop();
      flowCtlRef.current = null;
      const p = prefetch; prefetch = null;
      if (p) p.promise.then(u => { if (u) { try { URL.revokeObjectURL(u); } catch(e) {} } });
    };
  }, [playing, playLang, todaySub]);

  // 鎖屏/耳機控制:播放、暫停、上一則、下一則(開車時不用點亮螢幕)
  React.useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch(e) {} };
    if (!playing) {
      try { ms.playbackState = 'none'; } catch(e) {}
      ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null));
      return;
    }
    set('pause', () => { try { if (_azEl) _azEl.pause(); ms.playbackState = 'paused'; } catch(e) {} });
    set('play',  () => { try { if (_azEl) _azEl.play();  ms.playbackState = 'playing'; } catch(e) {} });
    set('nexttrack',     () => { if (flowCtlRef.current) flowCtlRef.current.next(); });
    set('previoustrack', () => { if (flowCtlRef.current) flowCtlRef.current.prev(); });
    return () => { ['play','pause','nexttrack','previoustrack'].forEach(a => set(a, null)); };
  }, [playing]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 09/09/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v10.4</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isEmbed ? undefined : onTouchStart} onTouchEnd={isEmbed ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : isPerf ? (
          <PerfView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isEmbed || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isEmbed}
          title={"連續播放語言：" + {zh:"中文",en:"English"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isEmbed || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isEmbed ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isEmbed || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isEmbed || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
