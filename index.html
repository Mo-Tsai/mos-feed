<script type="text/babel">
const { useState, useMemo } = React;

// ===== AZURE TTS(依顯示語系切換嗓音) =====
let _azToken = null, _azTokenExp = 0, _azAbort = null, _azAudio = null, _azEl = null;
// 每個語系一組預設嗓音 + localStorage key,朗讀時依當下顯示語言自動挑選
const VOICE_CONF = {
  zh: { locale:'zh-TW', lsKey:'mf_azureVoice_zh', fallback:'zh-TW-HsiaoChenNeural', styleKey:'mf_azureStyle_zh',
        sysVoices:["Microsoft HsiaoChen Online (Natural) - Chinese (Taiwan)","Google 國語（臺灣）","Meijia","Tingting","Google 普通话（中国大陆）"] },
  en: { locale:'en-US', lsKey:'mf_azureVoice',    fallback:'en-US-AriaNeural',       styleKey:'mf_azureStyle_en',
        sysVoices:["Google US English","Microsoft Aria Online (Natural) - English (United States)","Microsoft Guy Online (Natural) - English (United States)","Samantha","Alex"] },
  ja: { locale:'ja-JP', lsKey:'mf_azureVoice_ja', fallback:'ja-JP-NanamiNeural',     styleKey:'mf_azureStyle_ja',
        sysVoices:["Microsoft Nanami Online (Natural) - Japanese (Japan)","Google 日本語","Kyoko","O-ren"] },
};
// 支援 express-as 語氣的嗓音(台灣腔 zh-TW 系列不支援,設了也會被忽略)
const STYLE_VOICES = new Set(['zh-CN-XiaoxiaoNeural','zh-CN-YunyangNeural','zh-CN-YunxiNeural','zh-CN-YunjianNeural',
  'en-US-AriaNeural','en-US-JennyNeural','en-US-GuyNeural','en-US-DavisNeural','en-US-TonyNeural']);

// 中文縮寫/符號的唸法對照。TTS 把 "Fed"「3.50-3.75%」「8/3」直接吐出來時最像機器人,
// 先換成人會唸的樣子,比換嗓音有感得多。
const ZH_READ_MAP = [
  [/S\s*&\s*P\s*500/gi, '標普 500'], [/S\s*&\s*P/gi, '標普'], [/&/g, '和'],
  [/\bFed\b/g, '聯準會'], [/\bFOMC\b/g, 'F O M C'], [/\bCPI\b/g, 'C P I'], [/\bPCE\b/g, 'P C E'],
  [/\bGDP\b/g, 'G D P'], [/\bETFs?\b/g, 'E T F'], [/\bEPS\b/g, 'E P S'], [/\bIPO\b/g, 'I P O'],
  [/\bREITs?\b/g, 'R E I T'], [/\bAI\b/g, 'A I'], [/\bNIM\b/g, 'N I M'], [/\bJOLTS\b/g, 'JOLTS'],
  [/\bYoY\b/gi, '年增'], [/\bQoQ\b/gi, '季增'], [/\bbps\b/gi, '個基點'],
  [/\bQ([1-4])\b/g, (m, n) => '第' + ['一','二','三','四'][n-1] + '季'],
  [/\bH([12])\b/g, (m, n) => '上下'[n-1] + '半年'],
];
function normalizeForSpeech(text, speakLang) {
  if (speakLang !== 'zh') return text;
  let t = text;
  t = t.replace(/(\d{4})-(\d{1,2})-(\d{1,2})/g, '$1年$2月$3日');   // 2026-08-02
  t = t.replace(/(\d)\s*[-–—~～]\s*(\d)/g, '$1 到 $2');            // 3.50-3.75% / 60-80%
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?!\d)/g, '$1月$2日');        // 8/3
  ZH_READ_MAP.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/\b[A-Z]{2,5}\b/g, m => m.split('').join(' '));    // 股票代號逐字母唸,AHRT → A H R T
  return t;
}
// 依句號切句,句與句之間插 break,讓語氣有停頓、不會一路衝到底
function _splitSentences(text) {
  const out = []; let cur = '';
  for (const ch of text) {
    cur += ch;
    if ('。！？!?；;'.indexOf(ch) >= 0) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(s => s.trim());
}
function speakLangOf(card, lang) { return lang === "en" ? "en" : lang === "ja" ? "ja" : "zh"; }
function speakTextOf(card, lang) {
  const L = speakLangOf(card, lang);
  if (L === "en") return card.en;
  if (L === "ja") return card.ja || card.en;
  return card.zh;
}
function _xmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function _getAzToken(key, region, signal) {
  const now = Date.now();
  if (_azToken && now < _azTokenExp) return _azToken;
  const res = await fetch(`https://${region}.api.cognitive.microsoft.com/sts/v1.0/issueToken`, { method:'POST', headers:{'Ocp-Apim-Subscription-Key':key}, signal });
  if (!res.ok) throw new Error('Token ' + res.status);
  _azToken = await res.text();
  _azTokenExp = now + 9*60*1000;
  return _azToken;
}
// 持久播放器:iOS 只放行「使用者手勢解鎖過的元素」。連續播放每張卡若都 new Audio(),
// 第二張起就不是手勢觸發、會被 iOS 擋下 → 停播。改成同一顆元素換 src 續播就不會被擋。
function _azPlayer() {
  if (!_azEl) { _azEl = new Audio(); _azEl.preload = 'auto'; }
  return _azEl;
}
const _SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
function azureUnlock() {   // 必須在點擊/按鍵等使用者手勢裡呼叫
  try {
    const a = _azPlayer();
    if (a._unlocked) return;
    a.src = _SILENT_WAV;
    const p = a.play();
    if (p && p.then) p.then(() => { a._unlocked = true; }).catch(() => {});
  } catch(e) {}
}
function azureStop() {
  if (_azAbort) { _azAbort.abort(); _azAbort = null; }
  if (_azAudio) {
    const a = _azAudio; _azAudio = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch(e) {}
    if (a.src && a.src.indexOf('blob:') === 0) { try { URL.revokeObjectURL(a.src); } catch(e) {} }
  }
  try { speechSynthesis.cancel(); } catch(e) {}
}
async function azureSpeak(text, { rate='0%', speakLang='en', onStart, onEnd, onError }={}) {
  const key = localStorage.getItem('mf_azureKey') || '';
  const region = localStorage.getItem('mf_azureRegion') || 'eastus';
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const voice = localStorage.getItem(conf.lsKey) || conf.fallback;
  if (!key) return false;
  azureStop();
  const ctrl = new AbortController(); _azAbort = ctrl;
  try {
    const token = await _getAzToken(key, region, ctrl.signal);
    const style = localStorage.getItem(conf.styleKey) || '';
    const useStyle = style && STYLE_VOICES.has(voice);
    const body = _splitSentences(text).map(_xmlEsc).join(`<break time='260ms'/>`);
    const inner = `<prosody rate='${rate}'>${body}</prosody>`;
    const styled = useStyle ? `<mstts:express-as style='${style}'>${inner}</mstts:express-as>` : inner;
    // xml:lang 跟著嗓音本身的 locale 走(選了大陸腔就該是 zh-CN,不是介面的 zh-TW)
    const vLocale = (voice.match(/^[a-z]{2}-[A-Z]{2}/) || [conf.locale])[0];
    const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='${vLocale}'><voice name='${voice}'>${styled}</voice></speak>`;
    const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method:'POST', signal:ctrl.signal,
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-16khz-128kbitrate-mono-mp3'},
      body:ssml
    });
    if (!res.ok) throw new Error('TTS ' + res.status);
    const blob = await res.blob();
    if (ctrl.signal.aborted) return true;
    const url = URL.createObjectURL(blob);
    const audio = _azPlayer();
    audio.src = url;
    _azAudio = audio;
    if (onStart) onStart(audio);
    audio.onended = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audio.onended = null; audio.onerror = null; if (_azAudio === audio) _azAudio = null; if (onError) onError(); };
    await audio.play();
    return true;
  } catch(e) {
    if (e.name === 'AbortError') return true;
    _azToken = null;
    return false;   // 不呼叫 onError:讓 speakSmart 退回瀏覽器 TTS 接手,連續播放不因 Azure 失敗而中斷
  }
}

// 統一朗讀入口:Azure 優先,沒 key 或失敗就退回瀏覽器 TTS;兩者都依 speakLang 挑對應語系嗓音
async function speakSmart(rawText, { speakLang='zh', azRate='0%', sysRate=1.0, onStart, onEnd, onError }={}) {
  const conf = VOICE_CONF[speakLang] || VOICE_CONF.en;
  const text = normalizeForSpeech(rawText, speakLang);
  const ok = await azureSpeak(text, { rate:azRate, speakLang, onStart, onEnd, onError });
  if (ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = conf.locale; u.rate = sysRate; u.pitch = 1.0; u.volume = 1.0;
  const pick = () => {
    const voices = speechSynthesis.getVoices();
    const byName = conf.sysVoices.map(n => voices.find(v => v.name === n)).find(Boolean);
    const norm = s => (s || '').replace('_','-').toLowerCase();
    const byLang = voices.find(v => norm(v.lang) === conf.locale.toLowerCase())
                || voices.find(v => norm(v.lang).startsWith(conf.locale.slice(0,2)));
    const picked = byName || byLang;
    if (picked) u.voice = picked;
  };
  if (speechSynthesis.getVoices().length > 0) pick();
  else await new Promise(r => { speechSynthesis.onvoiceschanged = () => { pick(); speechSynthesis.onvoiceschanged = null; r(); }; setTimeout(r, 600); });
  u.onend = () => { if (onEnd) onEnd(); };
  u.onerror = () => { if (onError) onError(); };
  if (onStart) onStart(null);
  speechSynthesis.speak(u);
}

// ===== 頻道設定(要加新頻道:在 CHANNELS 加一行、CARDS 加卡片即可,不用動版型) =====
const CHANNELS = [
  { key: "隔夜盤勢", color: "#E05C5C" },
  { key: "財報速報", color: "#E8786A" },
  { key: "總經政策", color: "#7C6AF7" },
  { key: "產業風向", color: "#4EABA4" },
  { key: "小型股風雲", color: "#5B8ED6" },
  { key: "忽視雷達", color: "#C9A227" },
  { key: "內部人動向", color: "#6DB56D" },
  { key: "本週事件", color: "#C97DD4" },
  { key: "今日評估", color: "#E8A838" },
];

// ===== 每日卡片(由每日排程整批抽換,自 v5.7 起共 30 張;張數不寫死,版型跟著陣列長度走) =====
const CARDS = [
    { "id": "overnight_0", "channel": "隔夜盤勢", "tag": "三大創高", "color": "#E05C5C", "stocks": [ { "t": "SPY", "n": "標普500 ETF，反映大盤整體表現" }, { "t": "QQQ", "n": "那斯達克100，科技領軍的主戰場" }, { "t": "DIA", "n": "道瓊 ETF，本日刷新收盤高" } ], "en": "Wall Street ripped higher Monday as the Dow jumped 693 points (+1.32%) to a record 53,178, the S&P 500 climbed 1.48% to 7,600, and the Nasdaq surged 2.1% to 25,914. Big Tech powered the rally while falling oil eased inflation fears. Breadth was broad — this wasn't a narrow melt-up.", "zh": "週一華爾街強攻，道瓊大漲 693 點(+1.32%)刷新收盤高至 53,178，標普 500 漲 1.48% 收 7,600，那斯達克飆 2.1% 收 25,914。科技巨頭領軍，油價下滑緩和通膨疑慮。這波是廣度型上漲，不是少數股撐盤。", "ja": "月曜のウォール街は急伸。ダウは693ポイント高（+1.32%）で史上最高値の53,178、S&P500は1.48%高の7,600、ナスダックは2.1%高の25,914。ハイテク大手が相場を牽引し、原油安がインフレ懸念を和らげた。上昇の裾野は広い。", "url": "https://finance.yahoo.com/markets/live/stock-market-today-monday-august-3-dow-sp-500-nasdaq-big-tech-oil-092516872.html" },
    { "id": "overnight_1", "channel": "隔夜盤勢", "tag": "財報驅動", "color": "#E05C5C", "stocks": [ { "t": "CNH", "n": "財報超預期並上調 EPS，狂飆 16%" }, { "t": "SUPN", "n": "與 Indivior 合併，漲 5%" }, { "t": "TE", "n": "拿下 641MW 太陽能供應合約，漲 4%" }, { "t": "ALHC", "n": "遭 Raymond James 降評，跌 6%" } ], "en": "Single-stock action tracked fundamentals. CNH Industrial ripped +16% after Q2 revenue of $4.8B beat the $4.38B estimate and management raised full-year EPS guidance. Supernus (SUPN) rose +5% on its Indivior merger, TE gained +4% on a 641MW solar supply deal with Clearway. Alignment Healthcare (ALHC) fell -6% on a Raymond James downgrade.", "zh": "個股跟著基本面走。CNH Industrial 第二季營收 48 億美元超越 43.8 億預期並上調全年 EPS 展望，狂飆 +16%。Supernus(SUPN)因與 Indivior 合併漲 +5%，TE 拿下 641MW 太陽能供應合約漲 +4%。Alignment Healthcare(ALHC)遭 Raymond James 降評跌 -6%。", "ja": "個別株はファンダメンタルズに連動。CNHインダストリアルは第2四半期売上48億ドルが予想を上回り通期EPS見通しを引き上げ+16%。Supernus（SUPN）はIndivior統合で+5%、TEはClearwayへの641MW太陽光供給契約で+4%。Alignment Healthcare（ALHC）はレイモンド・ジェームズの格下げで-6%。", "url": "https://investrade.com/mid-morning-look-august-03-2026/" },
    { "id": "overnight_2", "channel": "隔夜盤勢", "tag": "荷莫茲降溫", "color": "#E05C5C", "stocks": [ { "t": "USO", "n": "原油 ETF，本日隨油價急殺" }, { "t": "XLE", "n": "能源類股 ETF，油價敏感" }, { "t": "CVX", "n": "大型油商，地緣風險曝險" } ], "en": "Geopolitics turned tailwind. Trump called off a planned strike on Iran and opened talks to reopen the Strait of Hormuz, sending oil sharply lower — WTI fell nearly 6% to about $80. Cheaper crude cooled inflation anxiety and lifted risk appetite. But the strait remains largely closed and tankers are still being turned back — the de-escalation is fragile.", "zh": "地緣政治由逆風轉順風。川普喊停對伊朗攻擊、開啟重開荷莫茲海峽談判，油價急殺——WTI 重挫近 6% 至約 80 美元。原油走低降低通膨焦慮、拉高風險胃納。但海峽目前仍大致封閉、油輪仍被攔回，這波降溫很脆弱。", "ja": "地政学が追い風に転じた。トランプ氏はイラン攻撃を中止し、ホルムズ海峡再開の交渉を開始。原油は急落しWTIは約6%安の80ドル前後。原油安はインフレ不安を和らげリスク選好を高めた。ただ海峡はなお概ね封鎖され、緊張緩和は脆い。", "url": "https://www.thenationalnews.com/business/energy/2026/08/03/oil-prices-slump-on-potential-us-iran-deal-to-open-strait-of-hormuz/" },
    { "id": "earn_0", "channel": "財報速報", "tag": "財測上修", "color": "#E8786A", "stocks": [ { "t": "PLTR", "n": "Q2 勝出並罕見兩位數上修全年營收指引" } ], "en": "Palantir delivered a clean Q2 beat and — crucially — raised full-year revenue guidance to $8.15–8.16B from $7.65–7.66B, a rare double-digit hike. AI-platform demand keeps compounding. The catch: at these multiples, a beat alone won't move the stock; the guidance raise is what matters, and Palantir delivered it.", "zh": "Palantir 第二季財報乾淨勝出，關鍵是把全年營收指引從 76.5-76.6 億上修到 81.5-81.6 億美元，罕見的兩位數上調。AI 平台需求持續複利成長。重點在：這種估值下，光是 beat 撐不起股價，財測上修才是關鍵，而 Palantir 交出來了。", "ja": "Palantirは第2四半期を明確に上回り、通期売上見通しを76.5〜76.6億ドルから81.5〜81.6億ドルへ二桁の異例の引き上げ。AIプラットフォーム需要が複利的に拡大。この高倍率では上振れだけでは株価は動かず、見通し引き上げこそが鍵——Palantirはそれを示した。", "url": "https://www.cnbc.com/2026/08/03/palantir-pltr-earnings-q2-2026.html" },
    { "id": "earn_1", "channel": "財報速報", "tag": "財報季強", "color": "#E8786A", "stocks": [ { "t": "AMZN", "n": "營收+20%、AWS+37%，全面超預期" }, { "t": "META", "n": "營收強但 EPS 因 AI 資本支出遜於預期" } ], "en": "The season is shaping up as one of the strongest in years: about 85% of the 300 reported S&P 500 names have beaten, with aggregate profit growth tracking +47%. Amazon crushed it — revenue +20% to $200.6B, AWS +37%, EPS $1.97 vs $1.82. Meta's top line was strong (+28%) but EPS of $6.18 missed the $7.17 consensus by 14% on heavy AI spend.", "zh": "這個財報季正朝多年來最強邁進：已公布的 300 家標普成分股約 85% 勝出，整體獲利成長達 +47%。Amazon 大爆發——營收 +20% 至 2,006 億，AWS +37%，EPS 1.97 勝 1.82。Meta 營收強勁 (+28%) 但 EPS 6.18 因 AI 重砸資本，遜於 7.17 預期達 14%。", "ja": "今季は近年最強の一つになりつつある。発表済みS&P構成300社の約85%が上回り、全体の利益成長は+47%。Amazonは圧巻——売上+20%の2,006億ドル、AWS+37%、EPS1.97ドル（予想1.82）。Metaは売上好調（+28%）だがEPS6.18ドルはAI投資重く予想7.17を14%下回った。", "url": "https://www.clearbrookglobal.com/weekly-market-commentary-august-3-2026/" },
    { "id": "macro_0", "channel": "總經政策", "tag": "升息陰影", "color": "#7C6AF7", "stocks": [ { "t": "TLT", "n": "20年期公債 ETF，升息預期下受壓" }, { "t": "SHY", "n": "短天期公債，反映政策利率" } ], "en": "The rate narrative has flipped. The Fed held at 3.50–3.75% in July, and with core PCE accelerating to 3.3% (from 3.0% in December), markets now price the risk of one or two HIKES by year-end — nine of 18 FOMC officials have penciled in at least one. Sticky inflation, not cuts, is the constraint. Long bonds stay pressured.", "zh": "利率敘事翻轉。Fed 七月維持 3.50-3.75%，核心 PCE 從去年 12 月 3.0% 加速到 3.3%，市場現在定價的是年底可能「升息」一到兩碼——18 位 FOMC 官員中 9 位點陣圖至少畫一次升息。黏性通膨、而非降息，才是約束。長天期債續受壓。", "ja": "金利シナリオが反転。Fedは7月に3.50〜3.75%を据え置き、コアPCEは（昨年12月の3.0%から）3.3%へ加速。市場は年末までに1〜2回の「利上げ」リスクを織り込む——FOMC18人中9人が少なくとも1回を予想。制約は利下げでなく粘着インフレ。長期債は圧迫継続。", "url": "https://www.goldmansachs.com/insights/articles/the-outlook-for-fed-rate-cuts-in-2026" },
    { "id": "macro_1", "channel": "總經政策", "tag": "就業周", "color": "#7C6AF7", "stocks": [ { "t": "SPY", "n": "大盤，週五非農將牽動利率預期" } ], "en": "This week is all about the labor market. JOLTS lands Tuesday (June openings expected slightly lower), and Friday brings the July jobs report — the data point that could decide whether the Fed's hawkish tilt hardens or eases. A hot number pushes the hike odds up; a soft one reopens the cut debate. Position for volatility around Friday.", "zh": "這週焦點全在就業市場。JOLTS 週二公布(六月職缺預期略降)，週五端出七月非農就業報告——這個數字可能決定 Fed 的鷹派傾向是加深還是鬆動。數字太熱、升息機率上升；太軟、降息辯論重啟。週五前後留意波動。", "ja": "今週は労働市場が全て。JOLTSは火曜（6月求人はやや減少見込み）、金曜には7月雇用統計——Fedのタカ派傾斜が強まるか和らぐかを左右し得る指標。強ければ利上げ確率上昇、弱ければ利下げ論再燃。金曜前後のボラに備えを。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar" },
    { "id": "sector_0", "channel": "產業風向", "tag": "實體回歸", "color": "#4EABA4", "stocks": [ { "t": "XLI", "n": "工業類股 ETF，受惠回流與基建" }, { "t": "XLB", "n": "原物料類股 ETF，實體需求受益" } ], "en": "Leadership is rotating out of Big Tech and into the physical economy. Capital is flowing to industrials and materials with operating leverage to reshoring, grid buildout, and infrastructure spend — a durable, multi-year tailwind. Tech is cooling as investors question when AI capex actually pays off. The market is broadening, not topping.", "zh": "領導權正從科技巨頭輪動到實體經濟。資金流入具營運槓桿的工業與原物料類股——受惠於製造業回流、電網擴建、基礎建設支出，這是多年期的結構性順風。科技降溫，因為投資人開始質疑 AI 資本支出何時真正回收。市場在廣化，不是見頂。", "ja": "主役はハイテク大手から実体経済へ輪番。資金はリショアリング・送電網構築・インフラ投資にレバレッジの効く資本財と素材へ——多年にわたる構造的追い風。AI設備投資の回収時期への疑問でハイテクは減速。相場は天井ではなく裾野拡大。", "url": "https://www.morganstanley.com/insights/articles/magnificent-seven-rotation-portfolio-strategies-2026" },
    { "id": "sector_1", "channel": "產業風向", "tag": "金融吸金", "color": "#4EABA4", "stocks": [ { "t": "XLF", "n": "金融類股 ETF，資金主要流入標的" }, { "t": "XLE", "n": "能源類股，原油企穩+高自由現金流" } ], "en": "Financials are the primary target for inflows on robust bank-earnings expectations and healthy consumer credit, while energy draws buyers on stabilized crude and attractive free cash flow. Both are classic 'high nominal growth' beneficiaries with pricing power. If the rotation into cyclicals holds, these are where the money keeps going.", "zh": "金融股成為資金主要標的，受惠強勁銀行財報預期與健康的消費信貸；能源股則靠原油企穩與吸引人的自由現金流吸引買盤。兩者都是典型「高名目成長」受益者、具定價權。若這波輪動到景氣循環股延續，錢會繼續往這裡流。", "ja": "金融は堅調な銀行決算期待と健全な消費者信用で資金流入の主軸。エネルギーは原油安定と魅力的なフリーキャッシュフローで買いを集める。ともに価格決定力を持つ典型的な「高名目成長」の受益者。景気敏感株への輪番が続けば、資金はここへ。", "url": "https://www.investing.com/analysis/sector-rotation-a-guide-to-the-sp-500-momentum-status-200675903" },
    { "id": "small_0", "channel": "小型股風雲", "tag": "35年最強", "color": "#5B8ED6", "stocks": [ { "t": "IWM", "n": "羅素2000 ETF，最強上半年+22%" } ], "en": "The Russell 2000 just posted its strongest first half since 1991 — up nearly 22% — as the valuation gap versus large caps hit a 25-year extreme (small-cap forward P/E ~18x vs S&P ~26x). The 'great rotation' out of megacaps is real. The question now is whether the second half sustains it or the rally pauses to digest.", "zh": "羅素 2000 剛繳出 1991 年以來最強的上半年——大漲近 22%——因為小型股與大型股的估值差擴大到 25 年極端(小型股前瞻本益比約 18 倍 vs 標普約 26 倍)。從超大型股撤離的「大輪動」是真的。現在問題是下半年能否延續，還是先暫停消化。", "ja": "ラッセル2000は1991年以来最強の上半期——約22%高。大型株との割安差は25年ぶりの極端に（小型株予想PER約18倍 対 S&P約26倍）。メガキャップからの「大輪番」は本物。焦点は下半期に続くか、いったん調整に入るか。", "url": "https://247wallst.com/investing/2026/07/16/the-russell-2000-is-having-its-best-year-in-23-years-heres-why-small-caps-are-winning-again/" },
    { "id": "small_1", "channel": "小型股風雲", "tag": "晶片領軍", "color": "#5B8ED6", "stocks": [ { "t": "IWM", "n": "羅素2000，本波漲勢核心" }, { "t": "SOXX", "n": "半導體 ETF，小型晶片股連動主題" } ], "en": "The small-cap rally has a semiconductor engine. Chip and chip-equipment names account for 16 of the Russell 2000's 50 best performers this year, as investors look beyond the Magnificent 7 for AI-infrastructure exposure. Small-cap chips offer the same secular story at a fraction of the multiple — but with more single-name risk.", "zh": "小型股這波有半導體引擎。晶片與晶片設備類股占了羅素 2000 今年前 50 強的其中 16 檔，因為投資人在 Magnificent 7 之外尋找 AI 基建曝險。小型晶片股提供同樣的長期故事、卻只用一小截估值——但單一個股風險更高。", "ja": "小型株ラリーの原動力は半導体。チップ・チップ製造装置がラッセル2000の年初来ベスト50のうち16銘柄を占める。マグニフィセント7の外にAIインフラ妙味を探す動き。小型チップ株は同じ長期テーマを低倍率で提供——ただ個別リスクは高い。", "url": "https://www.ibtimes.com.au/russell-2000-index-small-cap-rally-2026-1872366" },
    { "id": "small_2", "channel": "小型股風雲", "tag": "補課時間", "color": "#5B8ED6", "stocks": [ { "t": "IJR", "n": "S&P600 小型股 ETF" }, { "t": "IWM", "n": "羅素2000，利率槓桿最直接" } ], "en": "Why small caps now, in plain terms: they carry more debt, so they benefit disproportionately when rate-cut hopes rise and get hurt when hikes loom. That's the tension in 2026 — the rally leans on soft-landing and rate-relief bets, even as the Fed signals it may hike. Watch the jobs data: it's the fulcrum for the whole small-cap thesis.", "zh": "白話講為什麼現在看小型股：它們負債比較高，所以降息預期一升、受惠特別大；升息陰影一來、受傷也特別重。這正是 2026 年的張力——這波漲勢押注軟著陸與利率轉鬆，但 Fed 卻在暗示可能升息。盯緊就業數據，它是整個小型股論點的支點。", "ja": "なぜ今小型株か、平たく言うと：負債が多いため利下げ期待が高まると恩恵が大きく、利上げ観測では傷みも大きい。これが2026年の緊張——ラリーはソフトランディングと金利緩和に賭けるが、Fedは利上げを示唆。雇用統計に注目、小型株論の支点だ。", "url": "https://finance.yahoo.com/markets/stocks/articles/russell-2000-outpacing-p-500-163007242.html" },
    { "id": "radar_0", "channel": "忽視雷達", "tag": "淨利息升", "color": "#C9A227", "stocks": [ { "t": "OBT", "n": "紐約社區小銀行，NII 年增、低覆蓋" } ], "status": "RADAR · 下一個驗證點 下季財報 NII 是否續增", "en": "Orange County Bancorp (OBT) is a small NY community bank flying under Wall Street's radar. The signal: net interest income rose to $27.9M from $23.6M year-over-year — a quiet margin improvement while big-bank headlines dominate. Low coverage plus improving fundamentals is the classic overlooked setup. Risk: rate volatility and regional-bank deposit pressure. Not advice — a research lead.", "zh": "Orange County Bancorp(OBT)是被華爾街忽視的紐約社區小銀行。訊號在：淨利息收入從去年 2,363 萬升到 2,790 萬——在大銀行搶頭條時安靜地改善利差。低覆蓋率加上基本面改善，是典型被忽視的組合。風險：利率波動與區域銀行存款壓力。不是建議，是研究線索。", "ja": "Orange County Bancorp（OBT）はウォール街に見過ごされたNYの小型地域銀行。シグナルは純金利収入が前年2,363万ドルから2,790万ドルへ——大手が見出しを賑わす裏で静かに利ざや改善。低カバレッジ＋ファンダ改善は典型的な見過ごし構図。リスクは金利変動と地銀の預金圧力。助言ではなく研究の手がかり。", "url": "https://finance.yahoo.com/markets/stocks/articles/globals-undervalued-small-caps-insider-093943292.html" },
    { "id": "radar_1", "channel": "忽視雷達", "tag": "雙升", "color": "#C9A227", "stocks": [ { "t": "BHB", "n": "緬因州社區銀行，NII 與淨利雙雙年增" } ], "status": "RADAR · 下一個驗證點 下季 NII 與淨利是否同步再升", "en": "Bar Harbor Bankshares (BHB), a Maine community bank, posted Q1 net interest income of $36.9M and net income of $13.5M — both up year-over-year. It's a boring, under-followed name doing the unglamorous work of widening margins in a hard rate environment. The overlooked-with-improving-fundamentals pattern again. Risk: regional-bank credit and deposit dynamics. Not advice — a research lead.", "zh": "Bar Harbor Bankshares(BHB)是緬因州的社區銀行，第一季淨利息收入 3,690 萬、淨利 1,350 萬——雙雙年增。這是一檔無聊、少人追蹤的股票，在艱難利率環境下做著不起眼的擴利差工作。又是「被忽視+基本面改善」的模式。風險：區域銀行信用與存款動態。不是建議，是研究線索。", "ja": "Bar Harbor Bankshares（BHB）はメイン州の地域銀行。第1四半期の純金利収入は3,690万ドル、純利益1,350万ドルでともに前年増。地味で追う人の少ない銘柄が、厳しい金利環境で利ざや拡大という目立たぬ仕事をこなす。再び「見過ごし＋ファンダ改善」型。リスクは地銀の信用と預金動向。助言ではなく研究の手がかり。", "url": "https://simplywall.st/stocks/us/banks/nasdaq-istr/investar-holding/news/exploring-july-2026s-undervalued-small-caps-with-insider-buy/amp" },

    { "id": "week_0", "channel": "本週事件", "tag": "本週行事", "color": "#C97DD4", "stocks": [ { "t": "SPY", "n": "大盤，週五非農為本週最大變數" }, { "t": "IWM", "n": "小型股，對就業數據最敏感" } ], "en": "The week that matters: JOLTS on Tuesday sets the tone for labor-market reads, earnings season keeps rolling with ~200 S&P names still to report, and everything builds to Friday's July jobs report — the single print most likely to move rate expectations. Light on Fed speakers, heavy on data. Keep powder dry into Friday.", "zh": "本週重點：週二 JOLTS 為勞動市場定調，財報季持續進行、標普還有約 200 家待公布，一切都堆疊到週五的七月非農就業報告——最可能撼動利率預期的單一數字。Fed 官員發言少、數據多。週五前保留子彈。", "ja": "今週の要点：火曜のJOLTSが労働市場観測の基調を決め、決算はS&P約200社が残り継続、全ては金曜の7月雇用統計へ収束——金利観測を最も動かし得る一発。Fed高官発言は少なく、指標は多い。金曜まで余力を残せ。", "url": "https://www.kiplinger.com/investing/economy/this-weeks-economic-calendar" },

function getDateString() {
  return new Date().toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }).toUpperCase();
}

function WordPopup({ popup, onSpeak }) {
  if (!popup) return null;
  const popupX = Math.min(popup.x, window.innerWidth - 270);
  const popupY = popup.y + 120 > window.innerHeight ? popup.y - 80 : popup.y;
  return ReactDOM.createPortal(
    <div className="word-popup" style={{ left: popupX + "px", top: popupY + "px" }} onClick={e => e.stopPropagation()}>
      <div className="word-popup-word">
        {popup.word}
        <button className="speak-btn" onClick={() => onSpeak(popup.word)} title="播放發音">🔊</button>
      </div>
      <div className="word-popup-trans">{popup.loading ? "翻譯中..." : popup.translation}</div>
      <div style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", color:"var(--text-tertiary)", marginTop:"8px" }}>powered by MyMemory · 翻譯僅供參考</div>
    </div>,
    document.body
  );
}

function CardView({ card, idx, total, onManualSpeak }) {
  const [lang, setLang] = useState(null);
  const [popup, setPopup] = useState(null);
  const [speaking, setSpeaking] = useState(false);
  const abortRef = React.useRef(null);
  const audioRef = React.useRef(null);
  const toggle = (target) => setLang(lang === target ? null : target);
  const isOpen = lang !== null;

  // 單字發音永遠是英文(點的是英文原文裡的單字)
  const speakWord = React.useCallback((word) => {
    azureUnlock();
    speakSmart(word, { speakLang:'en', azRate:'-15%', sysRate:0.82 });
  }, []);

  // 朗讀全文:語系跟著畫面走 — 沒展開=中文主文、展開 English=英文、展開日本語=日文
  const speakAll = React.useCallback(async (e) => {
    e.stopPropagation();
    if (speaking) { azureStop(); audioRef.current = null; setSpeaking(false); return; }
    if (onManualSpeak) onManualSpeak();   // 手動朗讀時先停掉連續播放,避免兩個聲音疊在一起
    azureUnlock();
    setSpeaking(true);
    const L = speakLangOf(card, lang);
    await speakSmart(speakTextOf(card, lang), {
      speakLang: L,
      azRate: L === 'zh' ? '-8%' : '-5%',
      sysRate: L === 'zh' ? 0.95 : 0.88,
      onStart: (audio) => { audioRef.current = audio; },
      onEnd: () => { audioRef.current = null; setSpeaking(false); },
      onError: () => { audioRef.current = null; setSpeaking(false); }
    });
  }, [card, lang, speaking, onManualSpeak]);

  const speakingRef = React.useRef(false);
  React.useEffect(() => { speakingRef.current = speaking; }, [speaking]);

  // 換卡時關掉 popup 與翻譯請求;只有「手動朗讀中」才停聲音,不然會誤殺連續播放
  React.useEffect(() => {
    return () => {
      if (speakingRef.current) { azureStop(); }
      audioRef.current = null;
      setSpeaking(false);
      setPopup(null);
      if (abortRef.current) abortRef.current.abort();
    };
  }, [card.id]);

  const handleWordClick = React.useCallback(async (e, rawWord) => {
    e.stopPropagation();
    const clean = rawWord.replace(/[^a-zA-Z'-]/g, "");
    if (!clean || clean.length < 2) return;
    // Abort previous in-flight request
    if (abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const rect = e.target.getBoundingClientRect();
    setPopup({ word: clean, x: rect.left, y: rect.bottom + 6, translation: null, loading: true });
    try {
      const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(clean) + "&langpair=en|zh-TW", { signal: ctrl.signal });
      const data = await res.json();
      setPopup(p => p && p.word === clean ? { ...p, translation: data.responseData.translatedText, loading: false } : p);
    } catch (err) {
      if (err.name !== "AbortError") {
        setPopup(p => p && p.word === clean ? { ...p, translation: "(翻譯失敗)", loading: false } : p);
      }
    }
  }, []);

  // Close popup on outside click
  React.useEffect(() => {
    if (!popup) return;
    const close = () => setPopup(null);
    const timer = setTimeout(() => window.addEventListener("click", close), 10);
    return () => { clearTimeout(timer); window.removeEventListener("click", close); };
  }, [popup]);

  const words = useMemo(() => card.en.split(/(\s+)/).map((chunk, i) => {
    if (/^\s+$/.test(chunk)) return chunk;
    return <span key={i} className="clickable-word" onPointerDown={e => e.stopPropagation()} onClick={(e) => handleWordClick(e, chunk)}>{chunk}</span>;
  }), [card.en, handleWordClick]);

  return (
    <div style={{ padding:"10px 32px 32px" }}>
      <div style={{ height:"2px", background:card.color, opacity:0.6, margin:"-10px -32px 14px", width:"calc(100% + 64px)" }} />
      <div style={{ display:"flex", alignItems:"center", gap:"10px", marginBottom:"14px" }}>
        <span style={{ display:"inline-block", width:"18px", height:"1px", background:card.color, flexShrink:0 }} />
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:card.color, opacity:0.9 }}>{card.channel}</span>
        <span style={{ fontFamily:"'Courier New',monospace", fontSize:"9px", letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{card.tag}</span>
        <span style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:"6px" }}>
          <span style={{ fontFamily:"'Courier New',monospace", fontSize:"8px", letterSpacing:"0.14em", textTransform:"uppercase", color:"var(--text-tertiary)" }}>{ {zh:"中文",en:"EN",ja:"日本語"}[speakLangOf(card, lang)] }</span>
          <button className={"speak-btn" + (speaking ? " active" : "")} onPointerDown={e => e.stopPropagation()} onClick={speakAll} title={speaking ? "停止朗讀" : "朗讀（依目前顯示語言）"}>{speaking ? "■" : "🔊"}</button>
        </span>
      </div>
      <p style={{ fontFamily:"system-ui,-apple-system,'PingFang TC','Hiragino Sans',sans-serif", fontSize:"19px", lineHeight:1.9, color:"var(--text)", margin:0, maxWidth:"36ch", fontWeight:400, letterSpacing:"0.01em" }}>{card.zh}</p>
      {card.stocks && card.stocks.length > 0 && (
        <div style={{ marginTop:"16px", paddingTop:"12px", borderTop:"1px dashed var(--divider)", display:"flex", flexDirection:"column", gap:"7px" }}>

function EndScreen({ onPrev, onTop }) {
  const [copied, setCopied] = React.useState(false);
  const copyPrompt = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(DISCUSS_PROMPT).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = DISCUSS_PROMPT; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }
  };
  return (
    <div className="end-screen">
      <p style={{ fontFamily:"'Courier New',monospace", fontSize:"11px", letterSpacing:"0.14em", color:"var(--text-tertiary)", textTransform:"uppercase" }}>end of brief</p>

  );
}

function App() {
  const [todaySub, setTodaySub] = useState("全部");
  const [idx, setIdx] = useState(0);
  const [dir, setDir] = useState(0); // -1=left, 1=right, 0=none
  const touchRef = React.useRef(null);

  const cards = useMemo(() => {
    if (todaySub === "全部") return CARDS;
    return CARDS.filter(c => c.channel === todaySub);
  }, [todaySub]);

  const total = cards.length;
  const atEnd = idx >= total;
  const isFlow = todaySub === "資金流向";

  const [resumeMsg, setResumeMsg] = useState(null);
  const [playing, setPlaying] = useState(false);
  // 連續播放的語言(與單卡 🔊 的「跟著畫面走」分開;開車時想聽英文就切這裡),記在 localStorage
  const [playLang, setPlayLang] = useState(() => {
    const v = localStorage.getItem('mf_playLang');
    return (v === 'en' || v === 'ja' || v === 'zh') ? v : 'zh';
  });
  const cyclePlayLang = () => {
    const next = { zh:'en', en:'ja', ja:'zh' }[playLang];
    setPlayLang(next);
    try { localStorage.setItem('mf_playLang', next); } catch(e) {}
  };
  const lsKey = lsKeyFor(todaySub);

  // 每日更新後清掉舊 brief 的閱讀進度,localStorage 不會越積越多
  React.useEffect(() => {
    try {
      const stale = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("mosfeed_") === 0 && k.indexOf(BRIEF_ID) !== 8) stale.push(k);
      }
      stale.forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }, []);

  // Read localStorage on tab/sub change(換 brief 就沒有舊 key,自然從第 1 張開始)
  React.useEffect(() => {
    try {
      const saved = parseInt(localStorage.getItem(lsKeyFor(todaySub)), 10);
      if (saved > 0 && saved < cards.length) {
        setIdx(saved); setDir(0);
        setResumeMsg({ idx: saved, total: cards.length });
        setTimeout(() => setResumeMsg(null), 1500);
        return;
      }
    } catch(e) {}
    setIdx(0); setDir(0);
  }, [todaySub]);

  const go = (newIdx) => {
    if (newIdx < 0) return;
    if (newIdx > total) return;
    setDir(newIdx > idx ? 1 : -1);
    setIdx(newIdx);
    try { localStorage.setItem(lsKey, String(newIdx)); } catch(e) {}
  };

  // 回到第一張(開車時單手可按;連續播放中按了就從頭再播)
  const goTop = () => { setDir(-1); setIdx(0); try { localStorage.setItem(lsKey, "0"); } catch(e) {} };

  // ===== 連續播放:唸完一張自動翻下一張,一路唸到最後 =====
  const playTokenRef = React.useRef(0);

  const stopPlay = React.useCallback(() => {
    playTokenRef.current++;   // 讓還在飛的 onEnd 失效,不會誤翻頁
    azureStop();
    setPlaying(false);
  }, []);

  React.useEffect(() => {
    if (!playing) return;
    if (isFlow || atEnd || !cards[idx]) { setPlaying(false); return; }
    const token = ++playTokenRef.current;
    const card = cards[idx];
    // 開車情境:先報位置(中文再加頻道與標籤),讓耳朵知道現在是哪一則,再唸內文
    const body = playLang === 'en' ? card.en : playLang === 'ja' ? (card.ja || card.en) : card.zh;
    const intro = playLang === 'en' ? `Number ${idx + 1} of ${total}. `
                : playLang === 'ja' ? `${idx + 1}／${total}。`
                : `第 ${idx + 1} 則，${card.channel}，${card.tag || ""}。`;
    const text = intro + body;
    const advance = () => {
      if (playTokenRef.current !== token) return;
      if (idx + 1 >= total) { setPlaying(false); go(total); return; }
      go(idx + 1);
    };
    speakSmart(text, {
      speakLang: playLang,
      azRate: playLang === 'zh' ? '-8%' : '-5%',
      sysRate: playLang === 'zh' ? 0.95 : 0.88,
      onEnd: () => setTimeout(advance, 600),   // 卡與卡之間留一點呼吸
      onError: () => { if (playTokenRef.current === token) setPlaying(false); }
    });
    return () => { playTokenRef.current++; azureStop(); };
  }, [playing, idx, total, isFlow, atEnd, playLang]);

  // 切頻道 / 進資金流向就停播
  React.useEffect(() => { stopPlay(); }, [todaySub]);

  // Keyboard
  React.useEffect(() => {
    const handler = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { stopPlay(); go(idx + 1); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { stopPlay(); go(idx - 1); }
      if (e.key === "Home") { stopPlay(); goTop(); }
      if (e.key === " ") { e.preventDefault(); if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, total, playing]);

  // Touch
  const onTouchStart = (e) => { touchRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
  const onTouchEnd = (e) => {
    if (!touchRef.current) return;
    const dx = e.changedTouches[0].clientX - touchRef.current.x;
    const dy = e.changedTouches[0].clientY - touchRef.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      stopPlay();                       // 手動滑動就接手控制權,停掉連續播放
      if (dx < 0) go(idx + 1);
      else go(idx - 1);
    }
    touchRef.current = null;
  };

  const headerHeight = "200px";

  return (
    <div style={{ maxWidth:"680px", margin:"0 auto", height:"100vh", overflow:"hidden", display:"flex", flexDirection:"column" }}>
      <ThemeToggle />
      {/* Header */}
      <div style={{ flexShrink:0, background:"var(--bg)", paddingTop:"20px", zIndex:10 }}>
        <div style={{ padding:"0 32px", marginBottom:"16px" }}>
          <div style={{ marginBottom:"4px" }}>
            <h1 className="masthead-title" style={{ fontSize:"32px" }}>Mo's Feed</h1>
            <span className="running-header" style={{ display:"block", marginTop:"4px" }}><span style={{ opacity:0.85 }}>updated 08/04/2026</span><span style={{ opacity:0.75, marginLeft:"10px" }}>v6.2</span></span>
          </div>
          <div className="rule" />
        </div>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", padding:"0 32px" }}>
          <div className="tab-nav" style={{ padding:0 }}>
            <span style={{ fontFamily:"Georgia,serif", fontSize:"26px", fontWeight:600, color:"var(--text)", letterSpacing:"-0.01em", lineHeight:1.2 }}>Today</span>
          </div>
        </div>
        <div style={{ display:"flex", gap:"20px", padding:"14px 32px 0", overflowX:"auto" }}>
          {TODAY_SUBS.map(sub => (
            <button key={sub} className="sub-pill" onClick={() => setTodaySub(sub)}
              style={{ color:todaySub===sub?"var(--text-secondary)":"var(--text-tertiary)", borderBottomColor:todaySub===sub?"var(--text-secondary)":"transparent", opacity:todaySub===sub?1:0.6 }}>
              {sub}
            </button>
          ))}
        </div>
        <div style={{ padding:"0 32px", marginTop:"10px" }}><div className="rule" /></div>
        {resumeMsg && (
          <div className="running-header" style={{ padding:"6px 32px", animation:"fadeInOut 1.5s ease forwards" }}>
            繼續閱讀 {resumeMsg.idx + 1}/{resumeMsg.total}
          </div>
        )}
      </div>

      {/* Swipe area */}
      <div className="swipe-area" style={{ flex:1 }}
        onTouchStart={isFlow ? undefined : onTouchStart} onTouchEnd={isFlow ? undefined : onTouchEnd}
      >
        {isFlow ? (
          <HeatmapView />
        ) : atEnd ? (
          <div className="card-slide" style={{ position:"relative", transform:"none" }}>
            <EndScreen onPrev={() => go(total - 1)} onTop={goTop} />
          </div>
        ) : (
          <div className="card-slide" key={cards[idx].id} style={{ position:"relative", transform:"none" }}>
            <CardView card={cards[idx]} idx={idx} total={total} onManualSpeak={stopPlay} />
          </div>
        )}
      </div>

      {/* Nav bar:← 播放語言 ▶連續播放 頁碼 ⤒回第一張 → */}
      <div className="nav-bar">
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx - 1); }} disabled={isFlow || idx === 0}>←</button>
        <button className="nav-btn nav-btn-lang" onClick={cyclePlayLang} disabled={isFlow}
          title={"連續播放語言：" + {zh:"中文",en:"English",ja:"日本語"}[playLang] + "（點一下切換）"}>{ {zh:"中",en:"EN",ja:"日"}[playLang] }</button>
        <button className={"nav-btn nav-btn-icon" + (playing ? " playing" : "")} onClick={() => { if (playing) stopPlay(); else { azureUnlock(); setPlaying(true); } }}
          disabled={isFlow || atEnd} title={playing ? "停止連續播放" : "連續播放（" + {zh:"中文",en:"English",ja:"日本語"}[playLang] + "）"}>{playing ? "❚❚" : "▶"}</button>
        <span className="nav-count">{isFlow ? "live · tradingview" : atEnd ? `${total}/${total}` : `${idx + 1} / ${total}`}</span>
        <button className="nav-btn nav-btn-icon" onClick={() => { stopPlay(); goTop(); }} disabled={isFlow || idx === 0} title="回到第一張">⤒</button>
        <button className="nav-btn" onClick={() => { stopPlay(); go(idx + 1); }} disabled={isFlow || atEnd}>→</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
