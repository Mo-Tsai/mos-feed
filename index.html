/* 開頁前先套主題(手動選擇 > 系統偏好),避免亮暗閃爍。必須是同步、放在 CSS 前面。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('mf_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0f0e0c' : '#f5f1ea');
})();

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f1ea; --bg-elevated: #ede9e1;
    --text: #1c1a17; --text-secondary: #5e5b56;
    --text-tertiary: #6b6863; --divider: #ddd9d1;
    --noise-opacity: 0.035;

  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --bg-elevated: #161410;
    --text: #e8e4dc; --text-secondary: #9a9691;
    --text-tertiary: #86837f; --divider: #2e2a24;
    --noise-opacity: 0.06;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg); -webkit-font-smoothing: antialiased;
    font-family: Georgia, 'Times New Roman', serif;
    transition: background 0.4s ease, color 0.4s ease; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 180px 180px;
  }
  #root { position: relative; z-index: 1; }
  /* 100vh 在 iOS Safari 會被網址列吃掉底部 nav;dvh 排在後面,不支援的瀏覽器退回 vh */
  .app-shell { height: 100vh; height: 100dvh; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    15% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }
  ::-webkit-scrollbar { width: 2px; }
  ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
  /* 鍵盤焦點:看得到目前在哪一顆 */
  :focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  .masthead-title { font-family: Georgia, serif; font-weight: 400; font-style: italic; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
  .tab-nav { display: flex; align-items: baseline; gap: 28px; padding: 0 32px; }
  .tab-nav button { background: none; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: Georgia, serif; transition: all 0.3s ease; padding: 0; line-height: 1.2; }

  .expand-row { display: flex; align-items: center; gap: 20px; margin-top: 18px; }
  .text-btn { background: none; border: none; cursor: pointer; padding: 0; position: relative; min-height: 40px; display: inline-flex; align-items: center; }
  .text-btn::after, .source-link::after { content: ''; position: absolute; inset: -6px -10px; }
  .source-link { position: relative; display: inline-block; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.1em; text-decoration: none; border-bottom: 1px solid var(--divider); padding-bottom: 1px; transition: all 0.2s ease; color: var(--text-tertiary); }

</style>

  {"id": "earn_0", "channel": "財報速報", "tag": "Palo Alto 上修", "color": "#E8786A", "zh": "資安公司 Palo Alto Networks 週四上漲 6.4%，原因是上調 2027 會計年度的營收預期（路透）。在整體科技類股下跌 1.9%、半導體下跌 2.4% 的一天，這是少數逆勢走強的科技股；同屬資安的 CrowdStrike 也漲約 2.7%。這個反應顯示市場並非一概賣科技，而是在區分「資本支出受惠鏈」與「軟體與訂閱營收」。細節數字路透原文未列，本卡不補推測。", "en": "Cybersecurity firm Palo Alto Networks rose 6.4% on Thursday after raising its fiscal 2027 revenue outlook, Reuters reported. On a day when tech fell 1.9% and semiconductors 2.4%, it was one of the few tech names to rise; peer CrowdStrike gained about 2.7%. The reaction suggests the market is not selling all tech indiscriminately but separating the capex-driven chain from software and subscription revenue. Reuters did not list the detailed figures, so none are guessed here.", "url": "https://www.investing.com/news/stock-market-news/wall-street-ends-sharply-lower-asanthropics-debut-fails-to-revive-ai-fervor-5040108", "stocks": [{"t": "PANW", "n": "週四 +6.4%，上調 2027 年度營收預期"}, {"t": "CRWD", "n": "同為資安，約 +2.7%（盤面快照）"}]},
  {"id": "earn_1", "channel": "財報速報", "tag": "Walmart 零售訊號", "color": "#E8786A", "zh": "Walmart 公布第三季：營收年增 5.2% 到 1,888 億美元，高於預期的約 1,874 億；不含燃料的同店銷售成長 2.9%，與預期相符，高於上一季的 2.6%，但低於去年同期的 4.5%。全球電商成長 17%、美國電商成長 23%，美國實體店同店則下滑（財務長說法）。公司第三度上調全年展望，但幅度比分析師預期保守，路透稱年度銷售預測令投資人失望，股價週四跌 1.0%。", "en": "Walmart reported third-quarter revenue up 5.2% to $188.8 billion, above the roughly $187.4 billion expected; comparable sales excluding fuel rose 2.9%, in line with forecasts and above last quarter's 2.6% but below 4.5% a year earlier. Global e-commerce grew 17% and US e-commerce 23%, while US store comparable sales declined according to the CFO. It raised its full-year outlook for a third time, but by less than analysts hoped; Reuters said the annual sales forecast disappointed and the shares fell 1.0% on Thursday.", "url": "https://www.cnbc.com/2026/11/19/walmart-wmt-q3-2026-earnings.html", "stocks": [{"t": "WMT", "n": "第三季營收 1,888 億美元，股價 -1.0%"}, {"t": "XLP", "n": "民生消費 ETF，觀察防禦族群是否承接"}]},
  {"id": "earn_2", "channel": "財報速報", "tag": "Nvidia 好財報仍跌", "color": "#E8786A", "zh": "Nvidia 在 11 月 17 日公布的財報超預期：營收 1,158 億美元、年增 103%，調整後每股盈餘 2.68 美元（預期約 2.48），第四季營收預測 1,300 億美元上下 3%，且不含中國資料中心運算營收；毛利率預計由 74.8% 降到 71% 至 72%。路透說上調的預測「沒能提振情緒」，股價週四再跌 3.3%、已連六個交易日下跌。創辦人黃仁勳在 11 月 12 日辭任，財務長 Kress 暫代執行長。", "en": "Nvidia's results reported on November 17 beat expectations: revenue of $115.8 billion, up 103%, adjusted EPS of $2.68 against about $2.48 expected, and a fourth-quarter revenue forecast of $130 billion plus or minus 3% with no China data-center compute assumed; gross margin is guided to fall from 74.8% to 71%-72%. Reuters said the upbeat forecast did little to lift sentiment, and the stock fell another 3.3% on Thursday for a sixth straight decline. Jensen Huang resigned on November 12, with CFO Colette Kress serving as interim CEO.", "url": "https://www.newsquawk.com/headlines/nvidia-corporation-nvda-q3-fy27-usd-adj-eps-268-exp-248-revenue-1158bln-exp-109bln", "stocks": [{"t": "NVDA", "n": "財報超預期但週四 -3.3%、連六跌"}, {"t": "SMH", "n": "半導體 ETF，觀察龍頭疲弱是否外溢"}]},
  {"id": "macro_0", "channel": "總經政策", "tag": "殖利率回落", "color": "#7C6AF7", "zh": "10 年期美債殖利率一天內從 5.04% 回落到 4.93%，是股市賣壓下的典型避險反應：資金離開股票、買進公債，價格上漲、殖利率下降。這不等於利率壓力消失；殖利率仍在 5% 附近，對高估值成長股與負債偏高的公司仍是負擔。我沒有查到週五收盤後的 12 月升息機率，昨天卡片寫的 96.4% 不沿用，請以 CME FedWatch 為準。", "en": "The 10-year Treasury yield slid to 4.93% from 5.04% in a single session, a classic haven reaction to a stock selloff: money leaves equities for bonds, pushing bond prices up and yields down. That does not mean rate pressure is gone; yields remain near 5%, still a burden for richly valued growth stocks and heavily indebted companies. I could not find a post-close December hike probability, so yesterday's 96.4% is not carried forward; check CME FedWatch.", "url": "https://www.bnnbloomberg.ca/markets/2026/11/20/tech-stocks-pull-us-markets-lower-early-with-anthropics-historic-debut-doing-little-to-slow-rout/", "stocks": [{"t": "IEF", "n": "7-10 年期公債 ETF，殖利率下降時價格上漲"}, {"t": "SHY", "n": "短天期公債 ETF，避險資金停泊處"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "消費者信心回升", "color": "#7C6AF7", "zh": "密西根大學消費者信心指數週五公布，較上月大幅回升，也略高於經濟學家預期（報導未給指數數值）；汽油價格走低是主因。不過信心仍低於今年 2 月、伊朗戰事爆發之前的水準。信心回升與股市重挫同日出現，提醒市場的賣壓來自 AI 估值與政策風險，而不是消費端已經轉壞，但油價仍在每桶 92 美元附近，是下一個要看的變數。", "en": "The University of Michigan's consumer sentiment index rose sharply from last month and came in slightly above economists' expectations on Friday (the report gave no index level), helped by easing gas prices. Sentiment is still below February levels, before the Iran war. The jump on the same day stocks plunged suggests the selling reflects AI valuations and policy risk rather than a consumer slump, though oil near $92 a barrel remains the next variable to watch.", "url": "https://www.bnnbloomberg.ca/markets/2026/11/20/tech-stocks-pull-us-markets-lower-early-with-anthropics-historic-debut-doing-little-to-slow-rout/", "stocks": [{"t": "XLY", "n": "非必需消費 ETF，信心與油價的直接受惠者"}, {"t": "XRT", "n": "零售 ETF，假期消費前的觀察指標"}]},
  {"id": "macro_1", "channel": "總經政策", "tag": "CPI 偏熱 PPI 持平", "color": "#7C6AF7", "zh": "10 月 CPI 月增 0.4%，高於預期的 0.3%，核心 CPI 月增 0.3%；10 月 PPI 月增 0.3%，低於預期的 0.4%，核心 PPI 月增 0.3%、與預期一致（Motley Fool 11 月 14 日整理）。消費端物價比生產端更熱，意味著成本壓力已經在往終端價格傳。路透指出，這些數字讓市場對升息幅度的押注上移；下週三的 PCE 是 12 月會議前的最後一份通膨數據。", "en": "October CPI rose 0.4% month on month against 0.3% expected, with core CPI up 0.3%; October PPI rose 0.3% against 0.4% expected, with core PPI up 0.3% as forecast, per a November 14 Motley Fool summary. Consumer prices running hotter than producer prices suggests cost pressure is passing through to final prices. Reuters noted the data pushed up bets on the size of hikes, and next Wednesday's PCE is the last inflation read before the December meeting.", "url": "https://finance.yahoo.com/markets/stocks/articles/nov-25-could-huge-day-222101943.html", "stocks": [{"t": "TIP", "n": "抗通膨債券 ETF，通膨數據的直接受惠者"}, {"t": "XLE", "n": "能源 ETF，油價與通膨預期連動"}]},
  {"id": "sector_0", "channel": "產業風向", "tag": "AI 硬體鏈崩盤", "color": "#4EABA4", "zh": "週五的賣壓集中在 AI 硬體與基礎設施：晶片之外，康寧（光纖與光學材料）-10.9%、Bloom Energy（燃料電池供電，常被視為資料中心電力題材）-15.3%。這代表市場不只在重新定價晶片，而是在重新定價整條「AI 建設」供應鏈。若資本支出預期下修，受影響的會是設備、材料與電力供應商，而不只是 Nvidia。", "en": "Friday's selling was concentrated in AI hardware and infrastructure: beyond chips, Corning (fiber and optical materials) fell 10.9% and Bloom Energy (fuel-cell power, often treated as a data-center power theme) fell 15.3%. The market is repricing the whole AI build-out supply chain, not just chips. If capital-spending expectations are cut, equipment, materials and power suppliers would be hit alongside Nvidia.", "url": "https://www.bnnbloomberg.ca/markets/2026/11/20/tech-stocks-pull-us-markets-lower-early-with-anthropics-historic-debut-doing-little-to-slow-rout/", "stocks": [{"t": "GLW", "n": "康寧 -10.9%，光纖與光學材料"}, {"t": "BE", "n": "Bloom Energy -15.3%，資料中心供電題材"}, {"t": "AVGO", "n": "博通 -12.1%，網路與客製晶片"}]},
  {"id": "sector_1", "channel": "產業風向", "tag": "防禦與房建逆勢", "color": "#4EABA4", "zh": "在全面下跌中，少數逆勢上漲的是與 AI 無關的板塊：General Mills 上漲 3.7%、房屋建商 Lennar 上漲 1%。包裝食品屬防禦型消費股，在大盤恐慌時常被當作避風港；房建股走強，則可能反映殖利率回落對房貸利率的預期。報導沒有解釋這兩檔個別上漲的原因，上面是我的推測，不是來源說法。", "en": "In a broad decline, the few gainers were unrelated to AI: General Mills rose 3.7% and homebuilder Lennar rose 1%. Packaged food is a defensive consumer group that often serves as a haven in panics, and homebuilders may reflect the drop in yields easing mortgage-rate expectations. The report did not explain these two moves; the explanations here are my inference, not the source's.", "url": "https://www.bnnbloomberg.ca/markets/2026/11/20/tech-stocks-pull-us-markets-lower-early-with-anthropics-historic-debut-doing-little-to-slow-rout/", "stocks": [{"t": "GIS", "n": "General Mills +3.7%，防禦型包裝食品"}, {"t": "LEN", "n": "Lennar +1%，住宅建商"}, {"t": "XLP", "n": "必需消費 ETF，防禦板塊代表"}]},
  {"id": "sector_2", "channel": "產業風向", "tag": "資料中心政策風險", "color": "#4EABA4", "zh": "賣壓報導把「期中選舉結果有利於主張放慢資料中心建設的候選人」列為原因之一，並指聯邦與州層級都有。這把 AI 風險從技術與估值，擴大到電力、土地許可與地方政治。資料中心 REIT 是這類政策的直接對象；我沒有查到它們週五的漲跌，所以只列為追蹤對象，不下結論。", "en": "The selloff report listed midterm results favoring candidates who want to slow data-center construction, at both federal and state level, as one cause. That widens AI risk from technology and valuation to power, permitting and local politics. Data-center REITs are the direct subject of such policy; I could not find their Friday moves, so they are listed for tracking only, with no conclusion drawn.", "url": "https://www.bnnbloomberg.ca/markets/2026/11/20/tech-stocks-pull-us-markets-lower-early-with-anthropics-historic-debut-doing-little-to-slow-rout/", "stocks": [{"t": "DLR", "n": "資料中心 REIT，建設政策的直接對象；當日漲跌未查到"}, {"t": "EQIX", "n": "資料中心 REIT，同上"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "判讀：小型股的賣壓來源", "color": "#5B8ED6", "zh": "判讀卡：我沒有查到羅素 2000 週五的收盤，所以不寫數字。可以確定的是，小型股的風險來源與大型 AI 股不同：它們對油價與利率更敏感，而週五布蘭特仍在 92.57 美元、10 年期殖利率仍在 4.93%。所以大型股崩跌之日，小型股不一定跟著跌得一樣兇，也不能因此當成避風港；要看的是個別公司的負債與利息負擔。", "en": "Explainer: I could not find the Russell 2000's Friday close, so no figure is given. What can be said is that small caps carry different risks from big AI stocks: they are more sensitive to oil and interest rates, and on Friday Brent was still $92.57 and the 10-year yield still 4.93%. On a day big caps crash, small caps need not fall equally hard, but that does not make them a haven; debt and interest burdens at the company level are what matter.", "url": "https://www.bnnbloomberg.ca/markets/2026/11/20/tech-stocks-pull-us-markets-lower-early-with-anthropics-historic-debut-doing-little-to-slow-rout/", "stocks": [{"t": "VTWO", "n": "羅素 2000 ETF，當日收盤未查到"}, {"t": "IJT", "n": "標普小型成長 ETF，對利率更敏感"}]},
  {"id": "small_0", "channel": "小型股風雲", "tag": "浮動利率債務", "color": "#5B8ED6", "zh": "高盛的統計是：羅素 2000 成分公司約 32% 持有浮動利率債務，標普 500 只有約 6%。這代表升息對小型股的融資成本影響來得又快又直接，而且高盛仍預期 2027 上半年還有兩次升息。這是小型股在這一輪利率環境下和大型股最大的結構差異之一，也解釋了為什麼利率消息出來時，小型股的反應常比指數更劇烈。", "en": "Goldman Sachs estimates that about 32% of Russell 2000 companies carry floating-rate debt against about 6% in the S&P 500. A hike therefore feeds into small-cap financing costs quickly and directly, and Goldman still expects two more hikes by the first half of 2027. This is one of the main structural differences between small and large caps in the current rate regime, and it helps explain why small caps often react more sharply to rate news than the broad index.", "url": "https://rallies.ai/news/iwm-slips-as-treasury-yields-stay-elevated-weighing-on-small-cap-valuations", "stocks": [{"t": "IWM", "n": "羅素 2000 ETF，利率敏感度最高的代表"}, {"t": "IJR", "n": "標普小型股 600 ETF，獲利門檻較高的對照"}]},
  {"id": "small_1", "channel": "小型股風雲", "tag": "距高點約一成", "color": "#5B8ED6", "zh": "羅素 2000 在 11 月 6 日收約 2,756 點，前一天曾單日重挫 4.45%，當天反彈 0.97%；IWM 收約 272.5 美元。8 月中旬的紀錄高點在 3,045 到 3,053 點之間（兩個來源數字略有差異），所以 11 月初已比高點低約一成。我沒有查到 11 月 19 日羅素 2000 的收盤數字，大盤當天重挫、小型股很可能也承壓，但不能當成事實寫進來。", "en": "The Russell 2000 closed near 2,756 on November 6 after a 4.45% one-day plunge the day before, bouncing 0.97% that day; IWM closed near $272.5. The August record high was between 3,045 and 3,053 depending on the source, so the index was already roughly 10% below its peak in early November. I could not find the Russell 2000 close for November 19; with the market falling sharply small caps were likely under pressure too, but that cannot be stated as fact here.", "url": "https://rallies.ai/news/iwm-slips-as-treasury-yields-stay-elevated-weighing-on-small-cap-valuations", "stocks": [{"t": "IWM", "n": "11 月 6 日收約 272.5 美元"}, {"t": "VTWO", "n": "羅素 2000 的另一檔 ETF，費用率較低"}]},
  {"id": "small_2", "channel": "小型股風雲", "tag": "判讀：池子差異", "color": "#5B8ED6", "zh": "小型股判讀知識：同樣叫「小型股」，不同指數的池子差很多。羅素 2000 涵蓋範圍大、包含不少尚未獲利的公司，標普小型股 600 要求過去四季合計獲利為正，所以後者通常品質較高、波動較小。看到「小型股大漲或大跌」時，先確認講的是哪個指數，再看它是由利率、獲利還是少數權值股帶動，否則容易把不同池子的數字混著比。", "en": "A small-cap reading tip: not all small-cap indexes are the same pool. The Russell 2000 is broad and includes many companies that are not yet profitable, while the S&P SmallCap 600 requires positive trailing earnings, so the latter tends to be higher quality and less volatile. When you see small caps surge or sink, first check which index is meant, then whether rates, earnings or a handful of heavyweights drove it; otherwise numbers from different pools get compared by mistake.", "url": "https://rallies.ai/news/iwm-slips-as-treasury-yields-stay-elevated-weighing-on-small-cap-valuations", "stocks": [{"t": "VB", "n": "CRSP 小型股 ETF，另一種小型股池子"}, {"t": "IJR", "n": "標普小型股 600，要求獲利為正"}, {"t": "IJT", "n": "標普小型成長股，風格細分的對照"}]},
  {"id": "small_3", "channel": "小型股風雲", "tag": "FMC 低價股", "color": "#5B8ED6", "zh": "農化公司 FMC 週四約跌 8.3%、收約 4.29 美元（盤面快照）。這家公司 10 月 15 日因大幅下調展望盤中暴跌約 32%；較早的資料也顯示其現金約 5 億美元、負債約 45 億美元（2025 年底前後的整理，數字可能已變動）。股價落到個位數後，小型股的流動性與融資壓力問題會被放大。我沒有查到 11 月 19 日這一天的個別消息，請把它當作波動案例，不是研究結論。", "en": "Agricultural chemicals company FMC fell about 8.3% on Thursday to roughly $4.29, per a market snapshot. It plunged about 32% intraday on October 15 after sharply cutting its outlook, and earlier data showed about $500 million of cash against roughly $4.5 billion of debt (a figure from around late 2025 that may have changed). With the price in single digits, small-cap liquidity and financing pressure are magnified. I found no company-specific news for November 19, so treat this as a volatility example, not a research conclusion.", "url": "https://www.fool.com/investing/2026/10/15/why-fmc-corporation-stock-just-crashed/", "stocks": [{"t": "FMC", "n": "約 -8.3%，約 4.29 美元"}, {"t": "CTVA", "n": "農化同業，供對照"}]},
  {"id": "radar_3", "channel": "忽視雷達", "tag": "Hornbeck 執行長買進", "color": "#C9A227", "zh": "Hornbeck Offshore（HOS）是海上油氣支援船隊業者，已在雷達池。Quiver 11/16 整理顯示，總裁暨執行長 Todd Hornbeck 於 11/13 買進 85,912 股、約 50 萬美元，是當日最大筆之一。為什麼被忽視：細分的海上船隊業，覆蓋度需另查；什麼正在改變：負責人用自己的錢加碼，布蘭特原油在 92 美元附近也有利於海上活動，但我沒查到公司基本面證據，所以仍是單一訊號。風險：油價回落、船隊租金下滑。這是研究線索，不是投資建議。", "en": "Hornbeck Offshore (HOS), an offshore oil-and-gas support vessel operator, is already in the radar pool. Quiver's Nov. 16 roundup shows President and CEO Todd Hornbeck bought 85,912 shares on Nov. 13 for about $500,000, one of the day's largest purchases. Why overlooked: a niche offshore fleet group, with coverage still to be checked. What is changing: the chief executive added with his own money, and Brent near $92 helps offshore activity, but I found no company fundamentals, so it remains a single signal. Risks: lower oil prices, weaker vessel rates. This is a research lead, not investment advice.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases%3A+November+16%2C+2026", "stocks": [{"t": "HOS", "n": "CEO 11/13 買進 85,912 股、約 50 萬美元"}], "status": "RADAR · 下一個驗證點 下次財報與覆蓋度查證"},
  {"id": "radar_4", "channel": "忽視雷達", "tag": "Hudson Pacific 三人買進", "color": "#C9A227", "zh": "Hudson Pacific Properties（HPP）是西岸辦公室與影視攝影棚 REIT，已在雷達池。InsiderPrint 11/14 的叢集買進名單顯示，11/9 到 11/12 之間有 3 名內部人（含執行長或財務長）合計買進約 89.8 萬美元，其中董事 Jon Bortz 約 67.2 萬美元。為什麼被忽視：辦公室 REIT 長期被市場視為弱勢板塊；什麼正在改變：管理層與董事同時用自己的錢買。風險：債務到期與辦公室空置率，這些我今天沒有查到最新數據。這是研究線索，不是投資建議。", "en": "Hudson Pacific Properties (HPP), a West Coast office and film-studio REIT, is already in the radar pool. InsiderPrint's Nov. 14 cluster-buy list shows three insiders, including the CEO or CFO, bought about $898,000 between Nov. 9 and Nov. 12, with director Jon Bortz accounting for roughly $672,000. Why overlooked: office REITs have long been an out-of-favor group. What is changing: management and a director are buying with their own money at the same time. Risks: debt maturities and office vacancy, for which I found no fresh data today. This is a research lead, not investment advice.", "url": "https://buttondown.com/insiderprint/archive/u1f514-4-new-cluster-buys-hpp-bw-kgs-alt/", "stocks": [{"t": "HPP", "n": "3 名內部人 11/9-11/12 合計約 89.8 萬美元"}], "status": "RADAR · 下一個驗證點 下一份季報（日期待公司公布）與債務到期安排"},
  {"id": "radar_5", "channel": "忽視雷達", "tag": "Babcock & Wilcox 再買進", "color": "#C9A227", "zh": "Babcock & Wilcox（BW）是鍋爐與熱能、環保設備業者，已在雷達池：池內紀錄有 8 月與 Siemens Energy 簽下 20 組蒸汽渦輪發電機的製造合約，以及執行長、董事當時的買進。InsiderPrint 11/14 又把它列為當期最大的叢集買進：11/11 到 11/13 之間，持股逾 10% 的大股東與多名董事、主管合計買進約 74.9 萬美元，買家名單中包括 Brc Group Holdings。新增的是第二輪內部人買進；我沒有讀 Form 4 原件確認買進身分與價格，也沒查到最新分析師覆蓋數據。這是研究線索，不是投資建議。", "en": "Babcock & Wilcox (BW), a maker of boilers and thermal and environmental equipment, is already in the radar pool, whose notes record an August contract with Siemens Energy to build 20 steam turbine generators and insider buying at that time. InsiderPrint's Nov. 14 list now shows it as the largest cluster buy: between Nov. 11 and Nov. 13 a 10%-plus owner and several directors and officers bought about $749,000 combined, with Brc Group Holdings among the buyers. What is new is a second round of insider buying; I did not read the Form 4 originals for buyer identity and price, and found no current analyst-coverage data. This is a research lead, not investment advice.", "url": "https://buttondown.com/insiderprint/archive/u1f514-4-new-cluster-buys-hpp-bw-kgs-alt/", "stocks": [{"t": "BW", "n": "10% 大股東與董事、主管 11/11-11/13 合計約 74.9 萬美元"}], "status": "RADAR · 下一個驗證點 讀 Form 4 原件確認買進身分與價格"},
  {"id": "radar_0", "channel": "忽視雷達", "tag": "EquipmentShare 內部人", "color": "#C9A227", "zh": "EquipmentShare（EQPT）是租賃建設設備並提供科技平台的公司，2026 年掛牌。InsiderPrint 11 月 19 日列出三位內部人在 11 月 11 日到 17 日買進合計約 130 萬美元、均價 14.46 美元，包括執行長 Schlacks 約 56.3 萬、董事 Hill 約 55.4 萬、總裁約 14.5 萬。這個均價低於它 9 月初資料中的 52 週低點 15.71 美元；執行長自 8 月底起也多次買進。反方：主要股東 Chheda 8 月賣出約 220 萬股、約 4,540 萬美元，分析師共識僅「持有」。這是研究線索，不是投資建議。", "en": "EquipmentShare (EQPT) rents construction equipment alongside a technology platform and listed in 2026. InsiderPrint on November 19 listed three insiders buying about $1.3 million between November 11 and 17 at an average $14.46, including CEO Schlacks (about $563K), director Hill (about $554K) and the president (about $145K). That average is below the 52-week low of $15.71 shown in early-September data, and the CEO had also bought repeatedly since late August. Counterpoint: major holder Chheda sold about 2.2 million shares, roughly $45.4 million, in August, and the analyst consensus is only Hold. This is a research lead, not investment advice.", "url": "https://buttondown.com/insiderprint/archive/u1f514-3-new-cluster-buys-eqpt-rmix-ofrm/", "stocks": [{"t": "EQPT", "n": "11/11 至 11/17 內部人買進約 130 萬美元，均價 14.46"}], "status": "RADAR · 下一個驗證點 後續 Form 4 與下次財報日"},
  {"id": "radar_1", "channel": "忽視雷達", "tag": "Suncrete 五人買進", "color": "#C9A227", "zh": "Suncrete（RMIX）自稱是預拌混凝土的物流與配送平台，據點在奧克拉荷馬、阿肯色、路易斯安那與德州。InsiderPrint 列出五位內部人在 11 月 17 到 18 日買進合計約 110 萬美元、均價 6.14 美元，董事 Rees-Jones 就佔約 73.1 萬美元，營運長也買。我查到的報價快照互相不一致（8.93 到 18.25 美元不等），無法確認買價相對現價的位置，需要用即時報價核對。另外，部分 Form 4 是限制型股票的授予，不是公開市場買進。這是研究線索，不是投資建議。", "en": "Suncrete (RMIX) describes itself as a ready-mix concrete logistics and distribution platform in Oklahoma, Arkansas, Louisiana and Texas. InsiderPrint lists five insiders buying about $1.1 million on November 17-18 at an average $6.14, with director Rees-Jones alone accounting for about $731K and the COO also buying. The price snapshots I found conflict (from $8.93 to $18.25), so I cannot confirm where the buy price sits relative to the current quote; check a live quote. Also, some Form 4s are restricted stock grants rather than open-market purchases. This is a research lead, not investment advice.", "url": "https://buttondown.com/insiderprint/archive/u1f514-3-new-cluster-buys-eqpt-rmix-ofrm/", "stocks": [{"t": "RMIX", "n": "11/17 至 11/18 五位內部人買進約 110 萬美元，均價 6.14"}], "status": "RADAR · 下一個驗證點 以即時報價核對買價與下次財報"},
  {"id": "radar_2", "channel": "忽視雷達", "tag": "Once Upon a Farm", "color": "#C9A227", "zh": "Once Upon a Farm（OFRM）是有機兒童冷藏食品公司，2026 年 2 月以每股 18 美元掛牌，開盤約 21 美元，早期曾到約 25 美元。InsiderPrint 列出四位內部人在 11 月 16 到 17 日買進合計約 55.6 萬美元、均價 10.94 美元，比發行價低約 39%；董事 Peiros 買約 30.1 萬、Robb 在 2 月 IPO 時也曾以發行價買進約 10 萬美元。反方：民生食品新股從發行價腰斬式下跌，通常有成長或毛利問題，我沒有查到其財報細節。這是研究線索，不是投資建議。", "en": "Once Upon a Farm (OFRM) makes organic refrigerated kids' food and listed in February 2026 at $18, opening near $21 and reaching around $25 early on. InsiderPrint lists four insiders buying about $556K on November 16-17 at an average $10.94, roughly 39% below the IPO price; director Peiros bought about $301K, and Robb had also bought about $100K at the IPO price in February. Counterpoint: a consumer staples IPO falling this far from its offer price usually signals growth or margin issues, and I did not find its earnings detail. This is a research lead, not investment advice.", "url": "https://buttondown.com/insiderprint/archive/u1f514-3-new-cluster-buys-eqpt-rmix-ofrm/", "stocks": [{"t": "OFRM", "n": "11/16 至 11/17 四位內部人買進約 55.6 萬美元，均價 10.94"}], "status": "RADAR · 下一個驗證點 下次財報與毛利率"},
  {"id": "insider_0", "channel": "內部人動向", "tag": "HubSpot 執行長大買", "color": "#6DB56D", "zh": "HubSpot（HUBS）執行長 Brian Halligan 於 11/13 在公開市場買進 22,985 股，價值約 499.8 萬美元（隱含均價約 217 美元），是 Quiver 11/16 整理當日名單上最大的一筆。這是軟體股在 AI 取代疑慮下的內部人表態：一般要看是否為公開市場買進，而不是獎酬或選擇權行使；Quiver 的整理沒有細分，建議讀 Form 4 原件。", "en": "HubSpot (HUBS) CEO Brian Halligan bought 22,985 shares in the open market on Nov. 13, worth about $4.998 million (an implied average near $217), the largest purchase on Quiver's Nov. 16 list. It reads as an insider stance on a software stock under AI-displacement worries; the thing to check is that it is an open-market purchase rather than compensation or option exercise, which Quiver's summary does not break out, so read the Form 4.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases%3A+November+16%2C+2026", "stocks": [{"t": "HUBS", "n": "CEO Halligan 11/13 買進 22,985 股、約 499.8 萬美元"}]},
  {"id": "insider_1", "channel": "內部人動向", "tag": "三位執行長出手", "color": "#6DB56D", "zh": "Quiver 11/17 的名單顯示三筆值得看的買進：Kura Oncology 執行長 Troy Wilson 於 11/13 買進 98,881 股（約 75.4 萬美元）；Brandywine Realty 執行長 Michael Mazzei 於 11/16 買進 228,463 股（約 74.9 萬美元）；Skydance 的 Gerald Cardinale 於 11/13 買進 66,400 股（約 50.1 萬美元）。三家分屬生技、辦公室 REIT 與媒體，是不同產業的獨立動作，不是同一個題材。金額都在 50 到 75 萬美元之間，對個別高階主管來說屬中型押注。", "en": "Quiver's Nov. 17 list showed three purchases worth a look: Kura Oncology CEO Troy Wilson bought 98,881 shares on Nov. 13 (about $754,000); Brandywine Realty CEO Michael Mazzei bought 228,463 shares on Nov. 16 (about $749,000); and Skydance's Gerald Cardinale bought 66,400 shares on Nov. 13 (about $501,000). They span biotech, an office REIT and media, independent actions rather than one theme. At $500,000 to $750,000 each, they are mid-sized bets for individual executives.", "url": "https://www.quiverquant.com/news/Insider+Stock+Purchases%3A+November+17%2C+2026", "stocks": [{"t": "KURA", "n": "CEO 11/13 買進 98,881 股、約 75.4 萬美元"}, {"t": "BDN", "n": "CEO 11/16 買進 228,463 股、約 74.9 萬美元"}, {"t": "SKYD", "n": "Cardinale 11/13 買進 66,400 股、約 50.1 萬美元"}]},
  {"id": "insider_2", "channel": "內部人動向", "tag": "判讀：Six Flags 與 Kodiak", "color": "#6DB56D", "zh": "InsiderPrint 的叢集買進名單裡，Six Flags（FUN）11/3 到 11/13 有 3 名內部人合計約 1,510 萬美元，是名單上金額最大的一組，FUN 也已在雷達池；Kodiak Gas（KGS）董事 Alexander Darden 約 45 萬美元。判讀提醒：叢集買進比單筆買進更有資訊量，但金額大不等於一定看對；要先確認是公開市場買進、而不是現金增資認購，還要看買進後股價的反應與公司的債務結構。", "en": "On InsiderPrint's cluster-buy list, Six Flags (FUN) had three insiders buying about $15.1 million combined between Nov. 3 and Nov. 13, the largest group on the list, and FUN is already in the radar pool; Kodiak Gas (KGS) director Alexander Darden bought about $450,000. A caution: clusters carry more information than single buys, but size is no guarantee of being right; confirm they are open-market purchases rather than participation in a share offering, and watch the price reaction and the debt structure.", "url": "https://buttondown.com/insiderprint/archive/u1f514-4-new-cluster-buys-hpp-bw-kgs-alt/", "stocks": [{"t": "FUN", "n": "3 名內部人 11/3-11/13 合計約 1,510 萬美元"}, {"t": "KGS", "n": "董事 Darden 約 45 萬美元"}]},
  {"id": "capitol_0", "channel": "政要持股", "tag": "Nvidia：一買一賣", "color": "#B5654D", "zh": "本期申報裡有兩筆 Nvidia 交易值得並排看：眾議員 Maria Elvira Salazar（R-FL）11/5 申報，揭露她 10/23 買進 Nvidia；Benzinga 標題寫的區間與內文表格不同（$4,004–$60,000 對 $1,001–$15,000），金額以官方申報為準。另一邊，眾議員 Daniel Meuser（R-PA）申報賣出最多 1.5 萬美元的 Nvidia，且由配偶帳戶執行。這是兩名議員在不同時間點的小額交易，兩者都發生在週五 Nvidia 下跌 13.8% 之前。", "en": "Two Nvidia filings in this period are worth reading side by side: Rep. Maria Elvira Salazar (R-FL) filed on Nov. 5 disclosing an Oct. 23 purchase of Nvidia; Benzinga's headline range and its body table disagree ($4,004-$60,000 versus $1,001-$15,000), so rely on the official filing. On the other side, Rep. Daniel Meuser (R-PA) filed a sale of up to $15,000 of Nvidia, executed by a spouse's account. Both are small trades by two members at different times, and both predate Friday's 13.8% Nvidia drop.", "url": "https://www.benzinga.com/node/62982002", "stocks": [{"t": "NVDA", "n": "Salazar 10/23 買進、Meuser 申報賣出（配偶帳戶）"}]},
  {"id": "capitol_1", "channel": "政要持股", "tag": "判讀：45 天時差", "color": "#B5654D", "zh": "判讀卡：STOCK Act 允許最長 45 天才申報，所以你看到的是舊部位。以 Salazar 為例，交易日 10/23、申報日 11/5，之後市場已經大幅改變，Nvidia 光週五就跌 13.8%。再加上金額只有寬區間、不少交易是由配偶或信託帳戶執行，單筆申報很難推出「這個人現在怎麼看」。只讀「誰申報了什麼」，不要讀成該跟著買或賣。", "en": "Explainer: the STOCK Act allows up to 45 days to file, so what you see is an old position. For Salazar the trade date was Oct. 23 and the filing date Nov. 5, and the market has changed a lot since, with Nvidia alone down 13.8% on Friday. With amounts given only in wide ranges and many trades executed by spouses or trusts, a single filing says little about what the person thinks now. Read it as who filed what, not as a signal to buy or sell.", "url": "https://www.congressstock.com/articles/congressional-trades-week-of-2026-11-07", "stocks": [{"t": "SOXX", "n": "半導體 ETF，申報時與現在的價格已大不同"}]},
